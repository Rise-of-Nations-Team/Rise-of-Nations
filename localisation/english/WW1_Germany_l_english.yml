 GER_idea_OHL3_desc: "The Oberste Heeresleitung (OHL) is the highest echelon of command of the army of the German Empire. The influence of Staff is so great that it can become a dangerous political force in the country."
 GER_idea_OHL_dictatorship: "General Staff Dictatorship"
 GER_idea_OHL_dictatorship_desc: "The Oberste Heeresleitung (OHL) is the highest echelon of command of the army of the German Empire. Virtually all internal affairs of the country under the management of OHL. Generals are able to impose their will even on Kaiser, which can undermine the authority of the ruler."
 GER_idea_norddeutscher_bund_legacy: "Norddeutscher Bund Legacy"
 GER_idea_norddeutscher_bund_legacy_desc: "Germany is indestructible and indivisible! The legacy of past years for many centuries to come determined the greatness of the German Empire."
 GER_idea_gross_kaiserreich: "Gross Kaiserreich"
 GER_idea_republican_spirit: "Republican Spirit"
 GER_idea_republican_spirit_desc: "Germany is ready to sacrifice imperialist ambitions in order to create an ideal democratic society."
 GER_idea_prussian_militarism: "Prussian Militarism"
 GER_idea_prussian_militarism_desc: "The German army will parade from Berlin to the enemy capital. As did our fathers and grandfathers."
 GER_idea_isolation_of_adriatic_sea: "Isolated Adriatic Sea"
 GER_idea_isolation_of_adriatic_sea_desc: "Germany and Italy exert economic pressure by blocking trade routes in the Adriatic. Looks like they're getting ready for something."
 GER_idea_german_military_advisors: "German advisors"
 GER_idea_german_military_advisors_desc: "The German headquarters took over part of the command functions in our army."
 GER_idea_hindenburg_programme: "Hindenburg Programme"
 GER_idea_militarize_youth: "Militarization of Youth"
 GER_idea_wilhelm_ii: "Kaiser Wilhelm II"
 GER_idea_wilhelm_ii_desc: "We Wilhelm, by the Grace of God, King of Prussia, Margrave of Brandenburg, Sovereign and Supreme Duke of Silesia, Grand Duke of the Lower Rhine and Posen, Duke of Saxony, Westphalia and Pomerania, of Lüneburg and Bremen, of Holstein, Schleswig and Lauenburg, Burgrave of Nuremberg, Landgrave of Hesse, Prince of East Frisia, Osnabrück and Hildesheim, of Nassau and Fulda, Count of Hohenzollern, Lord of Frankfurt."
 GER_idea_army_reform: "Army Reform"
 GER_idea_army_reform2: "Bundesheer"
 GER_idea_army_reform3: "Elite Bundeskorps"
 GER_idea_reformed_staff: "Reformed General Staff"
 GER_idea_abwehr: "Kaiserliche Abwehr"
 GER_idea_central_powers_joint_staff: "Joint Staff of the Central Powers"
 GER_idea_central_powers_joint_staff2: "Joint Staff of the Central Powers"
 GER_idea_colonial_elite: "German Colonial Elite"
 tokyo_pact: "§YGerman-Japanese Pact§!"
 GER_legation_profits: "Legation Profits"
 GER_legation_profits_desc: "We have set up the International Concession Government, and we are reaping the rewards."
 GER_german_staff_planning_auh: "German Staff Planning"
 GER_german_staff_planning_auh_desc: "German headquarters focused on our front."
 GER_german_staff_planning: "Joint Planning"
 GER_german_staff_planning_desc: "Our headquarters sent several high-ranking generals to the location of the allied army."
 GER_state_in_blockade: "State in Blockade"
 GER_state_in_blockade_desc: "The country is in an enemy blockade. They expect total economic isolation to provoke famine undermine our morale."
 GER_quenched_militarism: "Quenched Militarism"
 GER_quenched_militarism_desc: "Victory always comes at a cost, and the Weltkrieg was unlike any war the world had ever seen. While we may have been victorious, that didn't bring our boys home. Our families still remember that pain clearly and are not eager to experience it again."
 GER_victors_of_wwi: "Victors of the Weltkrieg"
 GER_victors_of_wwi_desc: "We are the undisputed victors of the Weltkrieg and our place in the sun all but guaranteed."
 GER_mitteleuropa: "Mitteleuropa"
 GER_mitteleuropa_desc: "We are the leader of Mitteleuropa, an economic cooperation pact that helps us project power."
 GER_reformed_economy: "Reformed Economy"
 GER_representative_reform_idea: "Representative Reform"
 GER_idea_hitler_arrested: "Beer Hall Putsch Failed"
 GER_idea_hitler_arrested_desc: "Adolf Hitler was arrested for the failure of the Munich Beer Hall putsch. But his supporters are still out there, and he has been seen as a true patriot even in court."
 GER_idea_colonial_exploitation_interwar: "Colonial Exploitation"
 GER_idea_colonial_exploitation_interwar_desc: "The Colonial Administration is cruelly efficient in extracting as much from here as they possibly can. Though small reforms have been made here or there, at the end of the day all we are to the Mainlanders is a vast money trough for them to stick their dirty, greedy paws into."
 GER_dysfunctional_government: "Dysfunctional Government"
 GER_dysfunctional_government_desc: "The Government of [ROOT.GetName] is incredibly poorly run, with an autonomous military administration and a neglected civilian administration. Corporations run wild and corruption is rife."
 GER_roter_frontkampferbund: "Roter Frontkampferbund"
 GER_holy_order: "Holy Order"
 ger_famine: "Famine"
 ger_famine_desc: "The only food we have is Hindenburg bread..."
 GER_idea_ludendorff_offensive: "Ludendorff Offensive"
 GER_idea_ludendorff_offensive_desc: "Our army is doing its best to break through the Western Front, which has been stuck in trench warfare. As if this was the last time..."
 GER_idea_treaty_of_rapallo: "Treaty of Rapallo"
 GER_idea_treaty_of_rapallo_desc: "Toast to our German-Soivet friendship!"
 GER_idea_kapp_illegitimate_government: "Illegitimate Government"
 GER_idea_kapp_illegitimate_government_desc: "The current rulling government is not recongnised legitimate nationalwide. There would be keep storming political unrests until we stablize the situation."
 GER_idea_sino_german_company: "Sino-German Company"
 GER_idea_sino_german_company_desc: "Toast to our Sino-German friendship!"

 GER_wealth_tax_law_idea: "Progressive Taxation"
 GER_wealth_tax_law_idea_desc: "By implementing a more progressive tax system that places a greater burden on the wealthy, we have increased our revenue while maintaining social stability."
 GER_temporary_tariffs: "Emergency Tariffs"
 GER_temporary_tariffs_desc: "These temporary trade restrictions help protect our domestic industries and generate additional revenue for the state, though at the cost of some international trade relationships."
 GER_military_expansion_law: "Military Expansion Act"
 GER_military_expansion_law_desc: "This comprehensive program of military expansion will ensure that our armed forces have the manpower and resources needed to defend the Reich."
 GER_military_expansion_laws: "Extended Military Reforms"
 GER_military_expansion_laws_desc: "Our continued military reforms and expansion programs have transformed the armed forces into a more effective fighting force, though at considerable cost to the treasury."
 GER_structured_doctrines: "Structured Doctrines"
 GER_structured_doctrines_abandonned: "Heeringen-Falkenhayn Doctrines"
 GER_lessons_of_lorraine: "Lessons of Lothringen"
 GER_lessons_of_lorraine_desc: "The offensives against France allowed us to accumulate a wealth of experience in modern warfare. The importance of artillery and the preservation of soldiers are two essential components of victory."
 GER_initial_zeppelin_investment: "Initial Zeppelin Investment"
 GER_new_air_doctrine: "New Air Doctrine"
 GER_heeringen_air_plan: "Heeringen Air Plan"
 GER_prussian_army_style: "Prussian Army Style"
 quantitative_war_planning: "Quantitative War Planning"
 quantitative_war_planning4: "Elastic Defense Doctrine"
 GER_idea_schlieffen_plan: "Schlieffen Plan"
 GER_idea_schlieffen_moltke_plan: "Schlieffen-Moltke Plan"
 GER_strategiestreit: "Strategiestreit"
 GER_strategiestreit_desc: "Since the victory in the 1871, there have been no doubts about the inevitability of an another war with France. Best minds of the German Empire, from public intellectuals and historians to military leaders have been weighing in on the Strategy Debate, trying to provide the nation with the most adequate strategy for winning the upcoming war. The Großer Generalstab has come up with a varitery of war plans, and the victory of the Fatherland depends on choosing one of them."
 GER_strategiestreit_tt: "When the §Rwar§! with §Y[FRA.getFlag][FRA.getName]§! breaks out, the §YWar Plan§! we have chosen will be executed"
 race_to_the_sea: "Race to the Sea"
 GER_ohl_command: "[OHL_command_name]"
 GER_OHL_normal_name: "Oberste Heeresleitung"
 GER_OHL_dictatoship: "Oberste Heeresleitung's Silent Dictatorship"
 GER_OHL_political_dictatorship: "Oberste Heeresleitung's Political Influence"
 GER_ohl_command_desc: "The §gOberste Heeresleitung§! (Supreme Army Command) has expanded its authority, gaining additional command powers and improving military planning capabilities. However, this comes at the cost of some political friction with the civilian government, slightly reducing our political efficiency."
 GER_konige_im_luftrevier: "Könige im Luftrevier"
 GER_schlieffen_ost_variante: "Schlieffen Ostvariante"
 GER_battleship_production_focus: "Battleship Construction Focus"
 GER_battleship_production_focus_desc: "Current naval doctrine dictates the superiority of the Battleship. While it may face challenges brought about by new technology, It will always remain central to naval warfare."
 GER_submarine_production_focus: "Submarine Construction Focus"
 GER_submarine_production_focus_desc: "Torpedoes proved their worth in the Battle of Tsushima in 1905, where torpedo boats sent most of the Russian fleet to the bottom of the ocean. combined with the U-boats ability to travel underwater we have a weapon that can strike and remain hidden, bringing victory at sea."
 GER_fith_fleet_act: "Fifth Fleet Act"
 GER_fith_fleet_act_desc: "Admiral von Tirpitz's latest naval expansion program aims to challenge British naval supremacy through the construction of additional capital ships."
 GER_fith_fleet_act_extended: "Extended Naval Program"
 GER_fith_fleet_act_extended_desc: "The expanded naval construction program represents our commitment to establishing Germany as a leading naval power, regardless of diplomatic consequences."
 GER_idea_high_seas_fleet: "High Seas Fleet"
 GER_mass_produce_v_30: "V-30 Mass Production"
 GER_mass_produce_v_30_desc: "By streamlining the production of our V-30 torpedoe boats, we have achieved significant economies of scale. This efficient manufacturing process ensures our naval force receives a steady supply of modern light hulls."
 GER_idea_naval_arms_race_desc: "More dreadnoughts! Bigger guns!"

