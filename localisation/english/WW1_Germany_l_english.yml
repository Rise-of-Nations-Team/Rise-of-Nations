l_english:

### FOCUSES ###

 GER_WW1_weltpolitik: "Weltpolitik"
 GER_WW1_weltpolitik_desc: "We must enforce our Kaiser's divine right to rule. He will lead us to glory!"
 GER_WW1_moroccan_crisis: "Agadir Crisis"
 GER_WW1_moroccan_crisis_desc: "France wishes to Expand their Colonial Empire further into Morocco. We must make a public show of strength, and demand that France allow us a piece of their newly aquired territory."
 GER_WW1_place_under_the_sun: "Place Under the Sun"
 GER_WW1_place_under_the_sun_desc: "It's time to expand our colonial empire. Germany will take its rightful place under the Sun, and destroy anyone who gets in its way."
 GER_WW1_befriend_holland: "Befriend Holland"
 GER_WW1_threaten_holland: "Threaten Holland"
 GER_WW1_threaten_holland_desc: "The Dutch will bend to our will, or they will be eliminated."
 GER_WW1_befriend_holland_desc: "The Dutch do not have to be our enemy. They could be a valuable member of our Alliance, and could be critical in executing the schlieffen plan."
 GER_WW1_war_with_france_ww1: "War with France"
 GER_WW1_war_with_france_ww1_desc: "The French hold a colonial hegemony in Africa, and are standing in the way of Germany's Greatness. They must be dealt with."
 GER_WW1_coalition_split_desc: ""
 GER_WW1_military_mission_in_turkey: "Military Mission in Turkey"
 GER_WW1_military_mission_in_turkey_desc: "By sending military leaders to Turkey, we can manipulate the Turkish military, and by extent, the Government, to side with us."
 GER_WW1_befriend_bulgaria: "Befriend Bulgaria"
 GER_WW1_befriend_bulgaria_desc: "We have much in common with the Bulgarians. We should reach out to them, and see if they are willing to Ally us."
 GER_WW1_war_with_england: "War with England"
 GER_WW1_war_with_england_desc: "No longer will the English attempt to stop Germany from following its Destiny as the World's dominant power. For the Kaiser!"
 GER_WW1_prussian_militarism: "Fan Prussian Militarism"
 GER_WW1_prussuan_militarism_desc: "To serve your Kaiser in armed combat is not an obligation, but a privilege! The Kaiser's subjects must take pride in serving their country."
 GER_WW1_military_advisers: "Military Advisers"
 GER_WW1_military_advisers_desc: "We will sign Military Advisers to positions in Government, to greater increase cooperation between Government and Military."
 GER_WW1_strait_blockade: "Strait Blockade"
 GER_WW1_strait_blockade_desc: "A blockade of the Channel will greatly cripple the British Economy, if done correctly."
 GER_WW1_asian_shipyards: "Sino-German Shipyard"
 GER_WW1_asian_shipyards_desc: "Invensting in Chinese naval production is also good for our naval building in East Asia."
 GER_WW1_zimmermann_depesche: "Zimmermann-Depesche"
 GER_WW1_zimmermann_depesche_desc: "The Americans are a thorn in our side. In the case that they decide to join the war in the Entente, we will send a secret telegram to Mexico, asking for alliance in exchange for American Territories."
 GER_WW1_zimmermann_depesche_tt: "§RIn the case that the Telegram is intercepted, this might be the last straw for the Americans!§!\n\n"
 GER_WW1_support_austrian_claims: "Support Austrian Claims"
 GER_WW1_support_austrian_claims_desc: "The Austrians are our brothers. We will support their claims on Italian terrirories in Lombardy-Veneto, as they are rightfully Austrian."
 GER_WW1_backstab: "Backstab"
 GER_WW1_backstab_desc: "Austria is more of a Burden than an Ally. Their national fragmentation and weak armed forces means they are constantly coming to us for help. If we abandon them, perhaps we can seek more powerful allies."
 GER_WW1_bruderkrieg: "Bruderkrieg"
 GER_WW1_bruderkrieg_desc: "Austria-Hungary is merely a construct of territories that rightfully belong to other nations. We must end this, for the sake of us and our brothers."
 GER_WW1_pressure_on_switzerland: "Pressure on Switzerland"
 GER_WW1_pressure_on_switzerland_desc: "There is no Neutral. If they are not for us, they are against us!"
 GER_WW1_german_cisleithania: "German Cisleithania"
 GER_WW1_german_cisleithania_desc: "Austria is German. Therefore, it belongs to the Kaiserreich. We will unite once more, even if it is through force."
 GER_WW1_HRE_focus: "Restoration of the Holy Roman Empire"
 GER_WW1_HRE_focus_desc: "Some jurists argues that while abdication of Emperor Franz II in 1806 was legal, the release of all vassals was beyond the Emperor's authority, thus the Holy Roman Empire has never been dissoluted de jure. We have now won the Weltkreig and recover all German lands of the old Empire. Perhaps we should restore this ancient imperial title, and justify our rule to the Greater Germany lands ... or even further."
 GER_WW1_american_campaign: "American Campaign"
 GER_WW1_american_campaign_desc: "The Americans are standing in the way of our great Kaiserreich. We must prepare for their elimination."
 GER_WW1_war_with_usa: "War with USA"
 GER_WW1_war_with_usa_desc: "It is time to execute the plan. Germany will stand unopposed!"
 GER_WW1_kaiserreich: "Kaiserreich"
 GER_WW1_kaiserreich_desc: "We have emerged victorious in the Weltkrieg! It is time to strengthen our Kaiser's rein, to establish a German-dominated world!"
 GER_WW1_contain_kaiser: "Contain Kaiser"
 GER_WW1_contain_kaiser_desc: "The Kaiser has ruled over the people for long enough. It is time to end the corrupt system of one person ruling millions, and put the People in charge of Goverment."
 GER_WW1_turn_to_asia: "Turn to Asia"
 GER_WW1_turn_to_asia_desc: "While Africa is almost fully colonized by greedy western imperialists unwilling to give up an inch of terrirory, Asia is vast and has many opportunities for imperialism."
 GER_WW1_tokyo_pact: "Tokyo-Berlin Pact"
 GER_WW1_tokyo_pact_desc: "We share a common struggle with Japan: The British. If we promised them some of Britain's colonies in Asia, the Japanese may be willing to join our side."
 GER_WW1_chinese_campaign: "Chinese Campaign"
 GER_WW1_chinese_campaign_desc: "By investing in the Chinese economy, we can increase our sphere of influence over China."
 GER_WW1_claim_mittelafrika: "Claim Mittelafrika"
 GER_WW1_claim_mittelafrika_desc: "The Western Powers have an unfair monopoly over Africa. We will announce claims on regions in Central Africa."
 GER_WW1_south_administration: "South African Administration"
 GER_WW1_south_administration_desc: "By instituting local government in our South African colonies, we can better administer our colonies and at the same time appease local resistance."
 GER_WW1_reform_colonial_management: "Reform Colonial Management"
 GER_WW1_reform_colonial_management_desc: "The direct rule we currently exercise in our colonies in inefficient and attracts resistance. Instead, we will institute local government in our colonies, to better administer the regions."
 GER_WW1_cameroon_administration: "West African Administration"
 GER_WW1_cameroon_administration_desc: "By instituting local government in our West African colonies, we can better administer our colonies and at the same time appease local resistance."
 GER_WW1_contain_OHL: "Contain OHL"
 GER_WW1_contain_OHL_desc: "The Army's extensive control over the government must end. The Army serves the people, not the other way around."
 GER_WW1_befriend_sweden: "Befriend Sweden"
 GER_WW1_isolate_adriatic_sea: "Isolate Adriatic Sea"
 GER_WW1_isolate_adriatic_sea_desc: "If we impose a Blockade on Austria in the Adriatic Sea, we can severely cripple their economy and further sway the Italians to our side."
 GER_WW1_west_african_administration: "East African Administration"
 GER_WW1_ostasien_administration: "East Asian Administration"
 GER_WW1_cities_of_concessions: "Cities of Concessions"
 GER_WW1_romanian_pact: "Romanian Pact"
 GER_WW1_romanian_pact_desc: "If we support their claims on Transylvania, Romania may be enticed to join our faction."
 GER_WW1_suppress_the_hungarian_uprising: "Finish the Habsburgs"
 GER_WW1_suppress_the_hungarian_uprising_desc: "It is time to finish what we had started not so long ago, Habsburgs should be wiped out from this world."
 GER_WW1_colonial_protectorates: "Colonial Protectorates"
 GER_WW1_colonial_protectorates_modifier: "Kolonialreich"
 GER_WW1_colonial_protectorates_desc: "After the war, it would be possible to create colonial protectorates."
 GER_WW1_sphere_of_influence: "Sphere of Influence"
 GER_WW1_sphere_of_influence_desc: "Allows us to liberate the Eastern States as protectorates."
 GER_WW1__scandinavian_focus: "GER__scandinavian_focus"
 GER_WW1_scandinavian_focus: "Scandinavian Focus"
 GER_WW1_OHL_authority: "OHL Authority"
 GER_WW1_benelux_focus: "Benelux Focus"
 GER_WW1_oberster_kriegsherr: "Oberster Kriegsherr"
 GER_WW1_oberster_kriegsherr_desc: "It is necessary to expand the powers of the headquarters so that it can command the army without the constant participation of the Kaiser."
 GER_WW1_bohemia_integration: "Bohemia Integration"
 GER_WW1_bohemia_integration_desc: "Bohemia was in German Confederation. That means it should be Germany."
 GER_WW1_german_austrian_joint_staff: "German-Austrian Joint Staff"
 GER_WW1_german_austrian_joint_staff_desc: "The Austrian military is in a pitiful state. We will send them Generals to improve their forces, and at the same time we will be able to manipulate their operations."
 GER_WW1_western_expansion: "Western Expansion"
 GER_WW1_benelux_focus_desc: "Claims to Belgium."
 GER_WW1_western_expansion_desc: "Claims to France."
 GER_WW1_pressure_on_dennmark: "Pressure on Dennmark"
 GER_WW1_focus_on_true_enemy: "Focus on True Enemy"
 GER_WW1_focus_on_true_enemy_tt: "Activation of §YSchlieffen's plan§! will give a bonus to the §Gattack§! against France.\n\n"
 GER_WW1_invansion_in_finland: "Invasion in Finland"
 GER_WW1_invansion_in_finland_desc: "Protect Finland! Do not let the Bolsheviks seize it."
 GER_WW1_pressure_on_scandinavia: "Pressure on Scandinavia"
 GER_WW1_eastern_expansion: "Eastern Expansion"
 GER_WW1_eastern_expansion_desc: "Claims on Poland."
 GER_WW1_puppet_kingdoms: "Puppet Monarchies"
 GER_WW1_puppet_kingdoms_desc: "Puppet monarchies can be established in Poland and in the Baltic region, and they will be ruled by the German monarch."
 GER_WW1_partition_of_persia: "Partition of Persia"
 GER_WW1_partition_of_persia_desc: "If we promise the Russians some of the spoils, perhaps we can Subjugate the Persians without them interfering."
 GER_WW1_delegation_to_romania: "Delegation to Romania"
 GER_WW1_delegation_to_romania_desc: "Romania has the same Royal house as us and Germanophile king, we should propuse a mutual defensive allience."
 GER_WW1_focus_on_true_enemy_desc: "War is inevitable. We need to prepare for the invasion and update Schlieffen’s plan."
 GER_WW1_isolate_balkans: "Isolate_balkans"
 GER_WW1_isolate_balkan_treaty: "Isolate the Balkan Threaty"
 GER_WW1_isolate_balkan_treaty_desc: "GER_isolate_balkan_treaty_desc"
 GER_WW1_isolate_balkan_threat: "Isolate the Balkan Threat"
 GER_WW1_isolate_balkan_threat_desc: "We shall embargo the Serbs."
 GER_WW1_militarization_of_youth: "Militarization of Youth"
 GER_WW1_militarization_of_youth_desc: "15 years old is the most suitable age to give your life for Germany!"
 GER_WW1_cult_of_the_generals: "Cult of the Generals"
 GER_WW1_cult_of_the_generals_desc: "Under no circumstances will the German generals be punished by the new government. The dictatorship is practically established."
 GER_WW1_OHL_authority_desc: "Allows to take drastic measures to please the army."
 GER_WW1_hindenburg_programme: "Hindenburg Programme"
 GER_WW1_hindenburg_programme_desc: "The economy is under the control of the OHL.  Gives a decision to construct the Hindenburg Line."
 GER_WW1_democratization_of_army: "Democratization of the Army"
 GER_WW1_befriend_sweden_desc: "If Sweden agrees, they will have claims on Finland. Further action in Scandinavia depends on Sweden's decision."
 GER_WW1_pressure_on_scandinavia_desc: "Scandinavia will have to submit."
 GER_WW1_veteran_organisation: "Veteran Organisation"
 GER_WW1_veteran_organisation_desc: "The paramilitary Frei Corps, mostly former soldiers, goes in action. They will be the government-inspired organization of the Weimar Republic, which quells the uprising of the far left."
 GER_WW1_research_bureau: "Research Bureau"
 GER_WW1_expand_staff: "Expand the Staff"
 GER_WW1_ruhm_der_republik: "Ruhm der Republik!"
 GER_WW1_federal_army: "Federal Army"
 GER_WW1_federal_army_desc: "Buff to defense on national territory, a small debuff on military conscription."
 GER_WW1_allied_command_cooperation: "Allied Command Cooperation"
 GER_WW1_allied_command_cooperation_desc: "A command method similar to the French one. The independent command is involved in developing the strategy together. In contrast to the historical one, where Germany simply commanded its allies."
 GER_WW1_central_powers_conference: "Central Powers Conference"
 GER_WW1_central_powers_conference_desc: "A long conference will be held to resolve the conflict between Italy and Austria."
 GER_WW1_imperial_research_department: "Imperial Research Department"
 GER_WW1_imperial_research_department_desc: "Depending on how Germany behaved, Einstein may appear among the advisers."
 GER_WW1_25_punkte_programm: "25-Punkte-Programm"
 GER_WW1_25_punkte_programm_desc: "A former soldier named Adolf Hitler joined the Deutsches Arbeiterpartei. He captivates people and declares at party rallies the 25-Punkte-Programm on which Nazism is based."
 GER_WW1_supremacy_of_the_fuhrer: "Supremacy of the Fuhrer"
 GER_WW1_supremacy_of_the_fuhrer_desc: "Hitler becomes head of the party."
 GER_WW1_long_live_sacred_germany: "Long Live Sacred Germany"
 GER_WW1_long_live_sacred_germany_desc: "Deutschland, Deutschland über alles, Über alles in der Welt!"
 GER_WW1_iron_front: "Eiserne Front"
 GER_WW1_iron_front_desc: "Since the fascists are the most dangerous opposition to the government, the Democrats organized the largest movement of antifa.Since the fascists are the most dangerous opposition to the government, the Democrats organized the largest movement of Antifa."
 GER_WW1_emergency_powers_act: "Emergency Powers Act"
 GER_WW1_emergency_powers_act_desc: "During the war, generals took so much power which is not belong to them. It's time to take it back."
 GER_WW1_reichstag_crisis: "Reichstag Crisis"
 GER_WW1_reichstag_crisis_desc: "Reichstag will now be restored to normal."
 GER_WW1_abolish_dictatorships: "Abolish the Dictatorships"
 GER_WW1_abolish_dictatorships_desc: "The OHL served us well in the Weltkrieg. Too well, even. With their victories in the Great War, the General Staff seized even more political power, and are quickly emerging as a prominent threat to the Kaiser's rule. We must snuff them out for the sake of the German people."
 GER_WW1_mitteleuropa_pact: "Mitteleuropa Pact"
 GER_WW1_mitteleuropa_pact_desc: "Central Europe in one economic bloc, especially under our control is ideal for us. And, although the mutual defense treaty with Austria is over, we can formally sign non-aggression pact so that friendly relations can continue."
 GER_WW1_two_kaisers: "Two Kaisers"
 GER_WW1_two_kaisers_desc: "Wilhelm III becomes the de facto leader, because his father did an honorable retirement."
 GER_WW1_representative_reform: "Representative Reform"
 GER_WW1_representative_reform_desc: "Although we are victorious, it were tough and depressive times for All Germans. People deserves more rights to politics.\n But you can always make promises that are only lies."
 GER_WW1_schutztruppe: "Schutztruppe"
 GER_WW1_ostasien: "Claim Ostasien"
 GER_WW1_ostasien_desc: "Our asian empire!"
 GER_WW1_befriend_siam: "Befriend Siam"
 GER_WW1_befriend_siam_desc: "Offer to join Tokyo-Berlin Pact."
 GER_WW1_colonial_economy_control: "Colonial Economy Control"
 GER_WW1_colonial_economy_control_tt: "Colonies will get idea §YMetropolis Support§!.\n\n"
 GER_WW1_colonial_exploitation: "Colonial Exploitation"
 GER_WW1_colonial_exploitation_tt: "Colonies will get idea §YColonial Exploitation§!.\n\n"
 GER_WW1_colonial_exploitation_desc: ""
 GER_WW1_rotte_garde: "GER_rotte_garde"
 GER_WW1_rote_garde: "Rote Garde"
 GER_WW1_establish_finnish_monarchy: "Establish Finnish Monarchy"
 GER_WW1_expand_staff_desc: "Military doctrines."
 GER_WW1_colonial_legion: "Colonial Legion"
 GER_WW1_colonial_legion_tt: "Colonies will get idea §YColonial Legion§! which gives manpower weekly.\n\n"
 GER_WW1_investing_in_cameroon: "Investing in Kamerun"
 GER_WW1_persian_campaign: "Persian Campaign"
 GER_WW1_persian_campaign_desc: "Offer subsidies for Persia in exchange for recognition of German superiority."
 GER_WW1_pearl_of_the_british_crown: "Pearl of the British Crown"
 GER_WW1_pearl_of_the_british_crown_desc: "Claims on India."
 GER_WW1_investing_in_ostasien: "Investing in Ostasien"
 GER_WW1_investing_in_ostasien_desc: "East Asia shows great potential, we must invest immediately."
 GER_WW1_japanese_german_company: "Japanese-German Company"
 GER_WW1_japanese_german_company_desc: "Toast to our Japanese-German friendship!"
 GER_WW1_qingdao_agreement: "Qingdao Agreement"
 GER_WW1_qingdao_agreement_desc: "We need to divide the spheare of inglunces with Japan."
 GER_WW1_qingdao_agreement_tt: "If we signed the defense treaty with Japanese, you will demand them to comply with the treaty."
 GER_WW1_way_to_india: "Way to India"
 GER_WW1_way_to_india_desc: "To India trough Madagascar."
 GER_WW1_destabilize_raj: "Hindu–German Conspiracy"
 GER_WW1_destabilize_raj_desc: "Concentrate on weakening the British colonies. India and Afghanistan must declare their independence sooner or later."
 GER_WW1_chinese_intervention: "Chinese Intervention"
 GER_WW1_chinese_intervention_desc: "Chinese clearly shown that they can't govern themselves, we'll help them with that."
 GER_WW1_hindenburg_line: "Hindenburg Line"
 GER_WW1_protector_of_europe: "Protector of Europe"
 GER_WW1_rejuvenate_officer_staff: "Rejuvenate Military Staff"
 GER_WW1_rejuvenate_officer_staff_desc: "We need to rejuvenate the Military Staff with new officiers."
 GER_WW1_secure_allied_monarchies: "Secure Allied Monarchies"
 GER_WW1_secure_allied_monarchies_desc: "Keep your friends close."
 GER_WW1_secure_allied_monarchies_tt: "Germany will able to organize §Ya monarchist coup§! if the allies leave the §Yalliance§!.\n\n"
 GER_WW1_abwehr: "Imperial Abwehr"
 GER_WW1_the_great_game_begins: "The Great Game Begins"
 GER_WW1_the_great_game_begins_desc: "Germany will destabilize neighbors, particularly Russia. At the same time, countries will be able to declare war only in case of high tension."
 GER_WW1_strike_from_the_shadows: "Strike from the Shadows"
 GER_WW1_strike_from_the_shadows_desc: "An Abwehr agent, Lenin, on command, raises a revolution when Germany declares war on Russia."
 GER_WW1_strike_from_the_shadows_tt: "§YWe will help the Russian revolutionaries organize an armed insurrection as soon as Russia weakens.§!\n\n"
 GER_WW1_european_legion: "European Legion"
 GER_WW1_european_legion_desc: "Friends of Germany will form expeditionary legions - a full-fledged army."
 GER_WW1_restore_burgundy: "Restore Burgundy"
 GER_WW1_france_alone: "GER_france_alone"
 GER_WW1_final_strike: "GER_final_strike"
 GER_WW1_strike_entente: "Strike Entente"
 GER_WW1_civil_defense: "Civil Defense"
 GER_WW1_investing_in_sudwestafrika: "Investing in Sudwest-Afrika"
 GER_WW1_investing_in_ostafrika: "Investing in Ostafrika"
 GER_WW1_way_to_rhodesia: "Way to Rhodesia"
 GER_WW1_way_through_rhodesia: "Path through Rhodesia"
 GER_WW1_way_through_rhodesia_desc: ""
 GER_WW1_partisan_warfare: "Partisan Warfare"
 GER_WW1_colonial_docks: "Colonial Docks"
 GER_WW1_befriend_switzerland: "Befriend Switzerland"
 GER_WW1_ensure_neutrality_of_romania: "Ensure Neutrality of Romania"
 GER_WW1_its_time_for_lenin_to_die: "It’s Time for Lenin to Die!"
 lenin_german_agent: "Lenin recruited by German intelligence "
 GER_WW1_its_time_for_lenin_to_die_desc: "Lenin did our job. Fortunately, the Abwehr has introduced several loyal agents into the Bolshevik gang who will help get rid of the threat of world revolution. Everything is planned!"
 GER_WW1_colonial_elite: "Support Colonial Elite"
 GER_WW1_colonial_elite_desc: "The colonies became home to highly successful subjects of the empire. Perhaps we should support the new elite."
 GER_WW1_rule_germania: "Rule, Germania!"
 GER_WW1_rebuild_civilian_economy: "Rebuild Civilian Economy"
 GER_WW1_rebuild_civilian_economy_desc: "Now that the war is over and our dominance over Europe is secured, it is time to transit from a war economy to a free, civilian one. We will convert military production lines we no longer need into civilian factories, while building new ones."
 GER_WW1_economic_reform: "Economic Liberalization"
 GER_WW1_economic_reform_desc: "Chancellor Tirpitz will be able to become the leader of the Democrats after a successful reform."
 GER_WW1_holy_act: ""
 GER_WW1_disband_bundestag: "Revive Reichsstände"
 GER_WW1_disband_bundestag_desc: "With the restoration of the old empire, we should abolish our current bicameral parliamentary system, and revive the old, rightful representative system of Imperial Estates."
 GER_WW1_reichpact: "Conclude the Reichpact"
 GER_WW1_reichspakt: "Reichspakt"
 GER_WW1_reichspakt_desc: "By entering into military alliance with countries in our sphere of power officially, we will be able to guarantee the continuation of the regime."
 GER_WW1_isolate_french_syndicalists: "Isolate French Syndicalists"
 GER_WW1_revive_order_of_the_crusaders: "Revive Order of the Crusaders"
 GER_WW1_we_will_take_jerusalem: "We Will Take Jerusalem!"
 GER_WW1_fall_barbarossa: "Fall Barbarossa"
 GER_WW1_fall_normandia: "Fall Normandie"
 GER_WW1_fall_normandia_desc: "Landing in East Anglia is predictable if the British fleet is defeated. But landing straight from France will be a shock to our enemies."
 GER_WW1_rome_act: "Rome Act"
 GER_WW1_rome_act_desc: "Rome must submit to the Reich."
 GER_WW1_general_staff_purge: "General Staff Purge"
 GER_WW1_general_staff_purge_desc: "The loyalty of the General Staff is questionable at best, we must stabilise the situation immediately."
 GER_WW1_superiority_of_aces: "The Superiority of Aces"
 GER_WW1_army_inovations: "Army Innovations"
 GER_WW1_army_inovations_desc: "The German military is already the best in the world, but we always have room for improvement. By incorporating cutting-edge steel war machines into our ranks, we can strengthen our military dominace even further."
 GER_WW1_defender_of_the_faith: "Defender of the Faith"
 GER_WW1_danish_throne: "Danish Throne"
 GER_WW1_danish_throne_desc: ""
 GER_WW1_lion_from_the_north: "Lion from the North"
 GER_WW1_lion_from_the_north_desc: ""
 GER_WW1_protect_benelux: "Protect Low Countries"
 GER_WW1_protect_benelux_desc: ""
 GER_WW1_constitutional_compromise: "Constitutional Compromise"
 GER_WW1_second_bjork_agreement: "Second Bjork Agreement"
 GER_WW1_second_bjork_agreement_desc: "By supporting their claims on Austrian Territory, we can pursue a pact of non-agression with Russia."
 GER_WW1_recognize_hungarian_sovereignty: "Recognize Hungarian Sovereignty"
 GER_WW1_recognize_hungarian_sovereignty_desc: "Hugarians broke the Ausgleich and got their freedom. That is what we can celebrate!"

 GER_WW1_the_1912_military_conference: "Commence the War Council"
 GER_WW1_the_1912_military_conference_desc: "With tensions rising across Europe, the Kaiser has called for a crucial conference with our military leadership. We must assess the diplomatic situation, review our war plans, and determine how to strengthen our armed forces. Most critically, we must decide whether to maintain our naval focus or pivot towards army expansion."
 GER_WW1_five_year_army_law: "Five-Year Army Law"
 GER_WW1_five_year_army_law_desc: "The Five-Year Army Act reassesses the number of officers, active forces, and the army's investments and priorities. This is a critical step in reforming and maintaining the German army as the most powerful in the world."
 GER_WW1_enact_rustungswende: "Rüstungswende"
 GER_WW1_enact_rustungswende_desc: "The 'Armaments Turn' represents a major shift in our military priorities. By redirecting resources from naval construction to the army, we can better match the growing strength of France and Russia. While the Admiralty will protest, the security of our land borders must take precedence."
 GER_WW1_heeringens_plan: "Heeringen's New Plan"
 GER_WW1_heeringens_plan_desc: "Josias von Heeringen, the minister of war, has come forward with the controversial proposal of radical new strategies surrounding the expansion of the army and tactical reforms. Most importantly, he is opposed to any mass expansion of the army out of fear that it will degrade the quality which our army is renowned for. Furthermore, he wishes to scrap Schiefflen's plan fully and fight with a more methodical approach to survive a prolonged war."
 GER_WW1_quantitative_plan: "Quantitative War Planning"
 GER_WW1_quantitative_plan_desc: "Helmuth von Moltke the Younger proposes a reformed military planning strategy that focuses on expanding the army to compete with the rest of Europe. In addition, proposed reforms to the Schlieffen plan have been made to prioritize the defense of Prussia and to recognize Holland's neutrality."
 GER_WW1_traditional_plan: "Traditional Prussian War Planning"
 GER_WW1_traditional_plan_desc: "The Großer Generalstab, under Helmuth von Moltke the Younger, propose an aggressive military planning strategy and focus on the quality of arms. They believe that only through decisive action can Germany prevail against enemies on multiple fronts."
 GER_WW1_state_munitions: "State Armaments Program"
 GER_WW1_state_munitions_desc: "To face the combined might of our potential enemies, we must expand state investment in military production. This new funding initiative will focus on ammunition and artillery, without drawing resources away from ongoing naval construction."
 GER_WW1_finance_rheinmetall: "Finance Rheinmetall"
 GER_WW1_finance_rheinmetall_desc: "The Rheinmetall corporation has approached us with a request for a loan, something that can be easily arranged. With it the company will further expand its manufacturing base for the army."
 GER_WW1_qualitative_superiority: "Qualitative Superiority"
 GER_WW1_qualitative_superiority_desc: "Victory will come not through numbers alone, but through superior weaponry and tactics. By focusing on technological advancement in artillery, machine guns, and other modern weapons, we can ensure our forces maintain their qualitative edge over our opponents."
 GER_WW1_wealth_tax_laws: "Wehrbeitrag"
 GER_WW1_wealth_tax_laws_desc: "The extraordinary defense contribution of 1913 will raise nearly a billion marks through a one-time tax on property and wealth. This unprecedented measure demonstrates the Reich's commitment to military preparedness."
 GER_WW1_introduce_new_tariff_laws: "Military Tariff Act"
 GER_WW1_introduce_new_tariff_laws_desc: "By raising import duties, we can generate additional revenue for army expansion while protecting domestic industry. This approach aligns with conservative economic policy and ensures we maintain our industrial self-sufficiency."
 GER_WW1_stick_to_heeringen_plan: "Stick to Heeringen Plan"
 GER_WW1_stick_to_heeringen_plan_desc: "Through rigorous training and meticulous planning, we can perfect our ability to execute rapid, decisive campaigns. Our soldiers must be prepared to deliver knockout blows that will bring quick victory before our enemies can fully mobilize their resources. With proper preparation and God's grace, our troops will celebrate Christmas in their homes."
 GER_WW1_fortify_the_russian_border: "Eastern Border Defenses"
 GER_WW1_fortify_the_russian_border_desc: "Our eastern frontier with Russia represents our most vulnerable border. We must strengthen our fortifications and improve infrastructure to ensure rapid deployment of troops should the Tsar's armies advance."
 GER_WW1_first_army_bill: "Army Bill of 1912"
 GER_WW1_first_army_bill_desc: "This comprehensive military bill will significantly increase our standing army's size and combat readiness. While costly, the Reichstag must understand that our national security depends on maintaining military superiority."
 GER_WW1_abandon_the_great_ostaufmarsch: "Abandon the Ostaufmarsch"
 GER_WW1_abandon_the_great_ostaufmarsch_desc: "The plan for a major eastern deployment against Russia must be reconsidered. Given the Russian army's slow mobilization compared to France's rapid deployment capabilities, we should prioritize our western defenses and offensive capabilities."
 GER_WW1_second_army_bill: "Army Bill of 1913"
 GER_WW1_second_army_bill_desc: "To ensure the Reich's security, we must enact an even more ambitious expansion of our armed forces. This second military law will create new army corps and strengthen existing units. Gott mit uns!"
 GER_WW1_improved_schlieffen_alone_plan: "We will change the §Y£decision_icon_small Schlieffen Plan§! to make it even more §tAggressive§!.\n\n"
 GER_WW1_improved_schlieffen_plan: "We will change the §Y£decision_icon_small Schlieffen-Moltke Plan§! to make it even more §tAggressive§!.\n\n"
 GER_WW1_more_aggressive_schlieffen_plan: "Invigor the Schlieffen Plan"
 GER_WW1_more_aggressive_schlieffen_plan_desc: "The General Staff proposed a modernization of the Schlieffen Plan aimed at increasing the aggressiveness of the operation. This approach is linked to the traditional Prussian approach that our superior army will be able to counter any numerical advantage the enemy may have. Furthermore, the recognition of Holland's neutrality must be considered."
 GER_WW1_subsidise_mauser: "Subsidize Mauser"
 GER_WW1_subsidise_mauser_desc: "The Mauser company is a cornerstone of our arms industry, and their Gewehr 98 rifle forms the backbone of our infantry. We must provide state subsidies to ensure they can expand production and equip our soldiers with the finest small arms in the world."
 GER_WW1_methodical_teachings: "Embrace Methodical Teachings"
 GER_WW1_methodical_teachings_desc: "Following Heerigen's new plan we must impose that our military strategists focus on methodical rational planning that will benefit our army's performance without needless offensives that have only a chance of victory in fiction."
 GER_WW1_prepare_for_long_war: "Prepare for the Long-War"
 GER_WW1_prepare_for_long_war_desc: "The fallacy of Schlieffen's short war has finally come to an end, now that we can look at the coming war with a rational mind of thought we should make preparations for an extended period of conflict. These preparations will aid us when dealing with the strain on supply we will face."
 GER_WW1_harshen_standard_training: "Harshen Standard Training"
 GER_WW1_harshen_standard_training_desc: "The quality of the Empire's army must be sustained and rise above the quantitative advantage our enemies have. Through the introduction of harsher training standards, we will weed out the weak and make men out of boys."
 GER_WW1_fortify_elsass: "Defend Elsaß-Lothringen"
 GER_WW1_fortify_elsass_desc: "The loss of Elsaß-Lothringen remains an open wound for France. To deter any revanchist ambitions, we must transform our western border into an impenetrable line. Investing in a modern fortress network here will secure the province and our industrial heartland."
 GER_WW1_mobile_and_armored_support: "Mobile and Armored Support"
 GER_WW1_mobile_and_armored_support_desc: "The era of static warfare can be broken by the internal combustion engine. We must invest in developing motorised transport and armoured fighting vehicles to give our army unparalleled mobility and decisive shock power on the battlefield."
 GER_WW1_artillery_massification: "Artillery Massification"
 GER_WW1_artillery_massification_desc: "Modern battles are won by firepower. We will rationalise and expand our artillery production to ensure our forces can deliver overwhelming barrages against any foe. Our guns will silence the enemy and pave the way for our infantry's advance."
 GER_WW1_limited_army_bill: "Limited Army Bill"
 GER_WW1_limited_army_bill_desc: "Whilst it is true, that large expansions of the army will degrade its quality, we can't let our army struggle to hold the fronts we must face the enemy on. A limited expansion bill will be proposed to the Reichstag so that we may conscript the manpower we need - naturally, we will choose only the best and most fit to serve."
 GER_WW1_preparing_russian_offensives: "Prepare the Ostaufmarsch"
 GER_WW1_preparing_russian_offensives_desc: "'Anyone who has ever looked into the glazed eyes of a soldier dying on the battlefield will think hard before starting a war.' Pah! the foolish nonsense of a peace-loving chancellor. Bismarck attempted to cozy our Empire up to the Russian bastards, but they have always been our enemy, it's time to recognize that and plan offensives deep inside the Russian heartland."
 GER_WW1_quality_over_quantity: "High Infantry Equipment Standard"
 GER_WW1_quality_over_quantity_desc: "A German soldier is worth ten of his enemies, but only if properly equipped. We will enforce the highest standards for our infantry's arms and gear, providing our men with the decisive material advantage they need to dominate the battlefield."
 GER_WW1_quality_equipment_primacy: "Quality Equipment Primacy"
 GER_WW1_communication_innovations: "Communication Innovations"
 GER_WW1_communication_innovations_desc: "The German Army had an extensive communications mechanism, made possible by sections of engineers dedicated to laying telephone cables. This innovation was also reflected in the creation of the first mobile radios, capable of transmitting information over difficult terrain."
 GER_WW1_expanding_the_luftstreitkrafte: "Harnessing the Skies"
 GER_WW1_expanding_the_luftstreitkrafte_desc: "The mastery of flight promises to reshape warfare itself. Germany cannot afford to lag behind - we must seize the initiative in this new dimension, dedicating resources to explore military aviation in all its forms. This commitment will launch our journey towards aerial dominance, establishing the basis for future air power."
 GER_WW1_create_the_fliegertruppe: "Establish the Fliegertruppe"
 GER_WW1_create_the_fliegertruppe_desc: "Our initial aviation efforts show promise but require structure to be truly effective. We shall formally establish the Fliegertruppe (Flying Troops), organizing our disparate aerial assets into dedicated units under unified command. This crucial step will enable standardized training and doctrine development, transforming pioneers into a coordinated force capable of supporting ground operations."
 GER_WW1_establish_pilot_schools: "Establish Pilot Schools"
 GER_WW1_establish_pilot_schools_desc: "Our Fliegertruppe needs skilled pilots. We shall replace informal training by establishing dedicated schools with standardized curricula across the Reich, ensuring a steady supply of aviators prepared for modern aerial combat."
 GER_WW1_develop_airfields: "Develop Airfields"
 GER_WW1_develop_airfields_desc: "To project air power effectively, especially on the Western Front, we must develop our airfield infrastructure. We will prioritize building and expanding bases near France and Belgium, ensuring our squadrons are ready for rapid deployment and sustained operations in the West."
 GER_WW1_dicta_boelcke: "Spread the Dicta Boelcke"
 GER_WW1_dicta_boelcke_desc: "Master aviator Oswald Boelcke has codified the fundamental principles of aerial combat. We must ensure his 'Dicta Boelcke' becomes the standard tactical doctrine for all our fighter pilots. By instilling these rules we can dramatically increase the effectiveness and survivability of our pilots, forging a truly professional fighter corps."
 GER_WW1_pioneer_aircraft_development: "Pioneer Aircraft Development"
 GER_WW1_pioneer_aircraft_development_desc: "The skies represent a new frontier, and German ingenuity must lead the way in conquering it. We shall invest heavily in aeronautical research and experimentation, pushing the boundaries of early aircraft design, particularly improving our scout planes."
 GER_WW1_fokkers_pursuit_concepts: "Fokker's Pursuit Concepts"
 GER_WW1_fokkers_pursuit_concepts_desc: "Anthony Fokker's innovative designs, particularly his development of a reliable synchronizer gear allowing pilots to fire machine guns through the propeller arc, promise to create true 'pursuit' aircraft. By embracing his advancements, we will be able to field revolutionary fighters capable of dominating their opponents."
 GER_WW1_form_the_jagdstaffeln: "Form the Jagdstaffeln"
 GER_WW1_form_the_jagdstaffeln_desc: "To truly dominate the skies, our fighter pilots need specialized units focused exclusively on air combat. We will reorganize our Fliegertruppe assets, forming dedicated Jagdstaffeln (Hunter Squadrons) tasked with seeking and destroying enemy aircraft."
 GER_WW1_albatros_ascendency: "Albatros Ascendency"
 GER_WW1_albatros_ascendency_desc: "The advanced, twin-gun Albatros fighters represent a new standard in aerial combat. We shall prioritize equipping our Jagdstaffeln with these superior machines, working with Albatros Flugzeugwerke, to ensure German pilots dominate the skies."
 GER_WW1_explore_army_aviation_roles: "Explore Army Aviation Roles"
 GER_WW1_explore_army_aviation_roles_desc: "Beyond reconnaissance, aircraft possess the potential for direct offensive action in support of the Army. We shall explore tactical bombing and ground attack roles, developing the necessary designs and technologies to understand how best to apply air power directly on the battlefield."
 GER_WW1_schlachtflieger_program: "Schlachtflieger Program"
 GER_WW1_schlachtflieger_program_desc: "Dedicated ground attack aircraft, or 'Schlachtflieger', can devastate enemy positions and support infantry advances. We will initiate a program to develop specialized close air support planes and tactics."
 GER_WW1_aeg_bombing_initiatives: "AEG Bombing Initiatives"
 GER_WW1_aeg_bombing_initiatives_desc: "The Allgemeine Elektricitäts-Gesellschaft (AEG) shows promise in developing larger, multi-engine bombers capable of tactical strikes. We shall support these initiatives, collaborating closely with AEG to bring their advanced bombing platforms into service."
 GER_WW1_refine_ground_attack: "Refine Ground Attack Tactics"
 GER_WW1_refine_ground_attack_desc: "Effective close air support requires continuous refinement of tactics and equipment. We shall further develop our ground attack capabilities, improving aircraft effectiveness even in adverse weather conditions. These refinements will ensure our Schlachtflieger provide reliable support to the Army when it is needed most."
 GER_WW1_establish_the_bogohls: "Establish the Bogohls"
 GER_WW1_establish_the_bogohls_desc: "To strike deep into enemy territory, we shall establish elite bomber formations under the Supreme Army Command (Oberste Heeresleitung), designated Bombengeschwader der Obersten Heeresleitung ('Bogohl'). Equipping and operating these strategic squadrons requires developing advanced bombers and skilled crews to project German power far beyond the front lines."
 GER_WW1_embrace_zeppelin_technology: "Embrace Zeppelin Technology"
 GER_WW1_embrace_zeppelin_technology_desc: "Graf von Zeppelin's magnificent airships operate on principles entirely different from conventional aeroplanes, offering unique strategic possibilities. We shall therefore embrace this innovative lighter-than-air approach, dedicating resources to explore its potential for long-range reconnaissance and strategic reach."
 GER_WW1_zeppelin_company: "Support Luftschiffbau Zeppelin GmbH"
 GER_WW1_zeppelin_company_desc: "To realize our ambitions for a powerful airship fleet, a dedicated industrial base is essential. We shall support Luftschiffbau Zeppelin GmbH, ensuring the necessary industrial capacity exists to construct and maintain these complex machines for military service."
 GER_WW1_zeppelin_experimentations: "Zeppelin Experimentations"
 GER_WW1_zeppelin_experimentations_desc: "Our airships must prove their effectiveness under realistic operational conditions. We will conduct extensive trials focusing on navigation, reliability, and bombing capabilities, especially in adverse weather and at night, to refine designs and operational procedures."
 GER_WW1_strategic_zeppelins: "Strategic Zeppelins"
 GER_WW1_strategic_zeppelins_desc: "Beyond mere reconnaissance, our Zeppelins must be adapted for impactful strategic missions deep into enemy territory. We shall focus development on enhancing their range, endurance, and effectiveness for long-distance operations, turning them into true instruments of strategic warfare."
 GER_WW1_heighten_airship_threat: "Heighten Airship Threat"
 GER_WW1_heighten_airship_threat_desc: "Our Zeppelin fleet must become a feared weapon, capable of striking distant targets with impunity, particularly under darkness. We will further refine their offensive capabilities and operational tactics to ensure they pose a constant and potent strategic threat across enemy skies."

 GER_WW1_the_matter_of_the_navy: "The Naval Question"
 GER_WW1_the_matter_of_the_navy_desc: "Since 1898, Admiral von Tirpitz's vision has shaped our naval policy through four successive Fleet Laws. While we've built the second-largest navy in the world, this achievement has come at a cost. Britain's determination to maintain naval supremacy has only intensified with each German keel laid down, leading to an increasingly expensive arms race."
 GER_WW1_flirt_with_britain: "Concede Naval Supremacy"
 GER_WW1_flirt_with_britain_desc: "The cost of competing with Britain's two-power standard has become unsustainable. A diplomatic rapprochement with Britain, starting with a halt to our naval expansion, could ease tensions. Recent signals from the British Foreign Office suggest they would welcome such an overture."
 GER_WW1_a_grand_navy: "Tirpitz's Risk Theory"
 GER_WW1_a_grand_navy_desc: "Admiral von Tirpitz's doctrine maintains that a German fleet strong enough to threaten British naval supremacy will force Britain to seek accommodation with Germany. We must proceed with the next Fleet Law, regardless of diplomatic consequences."
 GER_WW1_common_interests: "Befriend the Kaiser"
 GER_WW1_common_interests_desc: "Though Chancellor Bethmann Hollweg and the Kaiser often disagree on policy, they share the aristocratic passions of hunting and shooting. The Chancellor plans to use these informal occasions to persuade His Majesty against the Admiralty's costly proposals."
 GER_WW1_german_pride: "Naval Prestige"
 GER_WW1_german_pride_desc: "Our High Seas Fleet represents more than mere military power - it is a symbol of German technological and industrial might. We must convince the Kaiser that maintaining our naval program is essential to Germany's standing as a world power."
 GER_WW1_propose_immediate_rustungswende: "Propose the Rüstungswende"
 GER_WW1_propose_immediate_rustungswende_desc: "Our army requires immediate reinforcement to match the growing strength of France and Russia. We must redirect resources from naval construction to the army, despite inevitable protests from the Admiralty. A strong army, not a fleet, will decide Germany's fate in any coming conflict."
 GER_WW1_expansion_of_shipyards: "Fifth Naval Law"
 GER_WW1_expansion_of_shipyards_desc: "The time has come to further expand our naval capabilities. This new Fleet Law will provide for additional dreadnoughts and battle cruisers, cementing Germany's position as a leading naval power."
 GER_WW1_utilise_the_navy_league: "Utilise the Navy League"
 GER_WW1_utilise_the_navy_league_desc: "The Deutscher Flottenverein (German Navy League) has become a powerful force in shaping public opinion. With over a million members and extensive propaganda campaigns, they can rally middle-class support for Tirpitz's naval program and pressure the Reichstag to approve further expansion."
 GER_WW1_bigger_guns: "Continue the Naval Arms Race"
 GER_WW1_bigger_guns_desc: "The race for naval supremacy demands constant innovation. We must increase the caliber of our naval guns and the size of our hulls to maintain parity with British dreadnought development."
 GER_WW1_the_influence_of_sea_power: "The Influence of Sea Power"
 GER_WW1_the_influence_of_sea_power_desc: "Our global empire requires a modern fleet to protect our colonial interests and trade routes. We must ensure our navy remains at the forefront of technological advancement."
 GER_WW1_u_nineteen: "U-19 Class Development"
 GER_WW1_u_nineteen_desc: "The proposed U-19 class represents a significant advance in submarine technology. These vessels will feature improved range, reliability, and combat effectiveness, marking a new chapter in undersea warfare."
 GER_WW1_the_fleet_in_being: "Fleet in Being"
 GER_WW1_the_fleet_in_being_desc: "A powerful fleet, even when anchored in port, forces our enemies to commit significant resources against it. By maintaining our High Seas Fleet as a constant threat, we can tie down the Royal Navy's strength in the North Sea without risking our capital ships in direct battle. This strategy of deterrence through existence is our fleet's greatest asset."
 GER_WW1_a_smarter_navy: "Under the Seas"
 GER_WW1_a_smarter_navy_desc: "Rather than seeking decisive battle with the Royal Navy, we should focus on disrupting enemy commerce through U-boat warfare. This strategy promises better results at a fraction of the cost of Dreadnought construction."
 GER_WW1_full_steam_ahead: "Full Steam Ahead!"
 GER_WW1_full_steam_ahead_desc: "Competition amongst the great powers demands that our naval engineers and researchers dedicate their full efforts to developing the cutting edge of capital ship design. We must invest heavily in the research needed to build the next generation of battleships and battlecruisers, securing our place amongst the premier naval powers."
 GER_WW1_equip_anti_air: "Anti-Aircraft Artillery"
 GER_WW1_equip_anti_air_desc: "The growing threat of aerial warfare necessitates defending our fleet against enemy aircraft and airships. We must equip our vessels with specialized anti-aircraft weapons to ensure their survival in modern naval combat."
 GER_WW1_vulcan_contracts: "AG Vulcan Contracts"
 GER_WW1_vulcan_contracts_desc: "The AG Vulcan shipyards in Stettin and Hamburg have proven themselves capable of producing our finest vessels. By securing long-term contracts with them, we can ensure steady production of capital ships while modernizing their facilities for even larger construction projects."
 GER_WW1_zepplin_reconnaissance: "Zeppelin Reconnaissance"
 GER_WW1_zepplin_reconnaissance_desc: "Our Zeppelin airships offer unprecedented capabilities for naval reconnaissance. Their great range and endurance allow them to patrol vast areas of the North Sea, providing early warning of enemy fleet movements and supporting our naval strategy."
 GER_WW1_invest_into_naval_bombers: "Naval Aviation Development"
 GER_WW1_invest_into_naval_bombers_desc: "The future of naval warfare lies partly in the air. We must invest in specialized aircraft capable of operating over water and attacking enemy vessels. These naval bombers will add a new dimension to our maritime capabilities."
 GER_WW1_tirpitz_grand_fleet: "The High Seas Triumph"
 GER_WW1_tirpitz_grand_fleet_desc: "At last, Admiral von Tirpitz's dream of a fleet to rival Britain's has become reality. Our High Seas Fleet now stands as a testament to German industrial might and naval engineering, with modern battleships, cruisers, and support vessels ready to challenge any adversary."
 GER_WW1_v_thirty_production: "V-30 Mass Production"
 GER_WW1_v_thirty_production_desc: "The Type V-30 torpedo boat destroyer represents the pinnacle of our destroyer development. By standardizing production and ordering these vessels in quantity, we can provide our fleet with a modern escort."
 GER_WW1_fund_blohm_voss: "Fund Blohm & Voss"
 GER_WW1_fund_blohm_voss_desc: "One of the largest shipbuilding companies in Germany, Blohm & Voss is the perfect candidate to expand our line of battlecruisers on time. All they need is the proper funding..."
 GER_WW1_develop_derfflinger_class: "Lay down the Derfflinger Class"
 GER_WW1_develop_derfflinger_class_desc: "In reaction to the Royal Navy's new Lion Class battlecruisers, we shall order a new class, one that will outclass similar ships in terms of guns and speed, to be constructed ahead of schedule."
 GER_WW1_expand_kaiserliche_werften: "Expand the Kaiserliche Werften"
 GER_WW1_expand_kaiserliche_werften_desc: "The state owned shipyards require further expansion in order to keep up with demand for new warships. Urgent investement is needed."
 GER_WW1_fund_ag_weser: "Grant Loans to AG Weser"
 GER_WW1_fund_ag_weser_desc: "Founded in 1872, AG Weser largely makes ships for civilian use, but has approached us with a request for a loan to build new warships. Granting this loan will be an added bonus in the arms race."
 GER_WW1_gruss_an_kiel: "Gruß an Kiel"
 GER_WW1_gruss_an_kiel_desc: "The Kiel shipyards are a major player in the naval arms race. Tirpitz has asked for them to be expanded promptly!"
 GER_WW1_develop_light_cruisers: "Develop Light Cruisers"
 GER_WW1_develop_light_cruisers_desc: "Light cruisers have the advantages of protected cruisers, but are faster and better equipped, as well as cheaper to build. A new batch is needed to keep up with the Royal Navy. "
 GER_WW1_develop_seaplane_carriers: "Develop the Seaplane Tender"
 GER_WW1_develop_seaplane_carriers_desc: "The seaplane tender is a small vessel that supports seaplanes with fuel. With other nations building them, this new ship could greatly increase the range of reconnaissance aircraft."
 GER_WW1_u_boat_campaign: "U-Boat Campaign"
 GER_WW1_u_boat_campaign_desc: "Naval law and the 1899 Hague Convention state the lives of merchant crews must be protected, and unarmed vessels cannot be sunk without warning. Admirals Tirpitz and von Pohl have devised a strategy by which U-boats will strike without warning, strangling Entente trade. While the risk of dragging neutral nations into the war against us is great, Tirpitz predicts it will soon bringthe UK into a concillatory mood."
 #Long Range Submarine Cruiser, alternative title "Long-Range U-Boats"
 GER_WW1_develop_u_boats: "Develop the U-151 Class"
 GER_WW1_develop_u_boats_desc: "Originally built to carry cargo between the United States and Germany undetected, the U-151 class shall be sent on a new mission; to strike Allied shipping off the North Amertican coast!"

### EVENTS ###

 # GERMANY
 ww1_germany.1.t: "Official abdication of Wilhelm II"
 ww1_germany.1.d: "With the war clearly being lost, and with the anarchy and chaos back home, Wilhem the Second has decided to abdicate. He will soon leave to the Netherlands, and leave his past behind. The German Empire is no more, but in its place, an emergency government is created in the form of a parliamentary republic founded in the town of Weimar. Germany's fate is unclear, but this will have to do for now."
 ww1_germany.1.a: "Ruhm der Republik!"
 ww1_germany.2.t: "German Zeppelin Campaign"
 ww1_germany.2.d: "It is highly unlikely that German troops will be able to breach the British mainland in the current situation. However, our Zeppelin bomber balloons will be able to strike at the heart of British industry from afar! Though they may send their pathetic little fighter planes to try and strike them down, it's unlikely they'll even be able to come close in altitude. This'll show John Bull our might!"
 ww1_germany.2.a: "Impressive"
 ww1_germany.3.t: "Death of August Bebel"
 ww1_germany.3.d: "German Socialist, August Bebel, cofounder of the Social Democratic Party of Germany and its most influential and popular leader for more than 40 years, died of a heart attack.\n\nFrom being an ordinary worker into becoming a political leader in the struggle for a "better social system, Bebel, like no other, embodied the tradition of the German SPD. Already in 1882 Engels had described him as “a unique manifestation of the German, indeed of the European working class.” A member of the Reichstag from 1867 almost continuously until his death, he achieved his most celebrated triumphs as a parliamentarian. Even his opponents could not withhold their respect in the face of his passionate honesty."
 ww1_germany.3.a: "A model workers' leader."
 ww1_germany.4.a: "We are stuck in hell."
 ww1_germany.4.d: "Im Westen nichts Neues. Neither the past nor the future."
 ww1_germany.4.t: "Frontline Reports"
 ww1_germany.5.t: "Formation of the Weimar Republic"
 ww1_germany.5.d: "With the defeat of Germany in the Great War, Wilhem the Second has decided to abdicate. The situation was hopeless when the November Revolution effectively made him lose control of his own country. With no suitable monarch to replace him, the German Empire has effectively ceased to exist. A republic has been founded in the town of Weimar as a replacement, but it is still uncertain as to how long this emergency government will last, perhaps it might end in chaos and anarchy just like its predecessor."
 ww1_germany.5.a: "The end of German Empire?"
 ww1_germany.6.t: "[GER.GetName] offer to officially join the Triple Alliance"
 ww1_germany.6.d: "\nGermany broke the alliance with Austria Hungary for some reason. The German ambassador proposes to isolate Austria, in exchange for the transfer of Transylvania in case of intervention."
 ww1_germany.6.a: "This is our chance!"
 ww1_germany.6.b: "Too risky."
 ww1_germany.7.a: "Did [GER.GetName] find a new enemy?"
 ww1_germany.7.d: "\n\nGermany refused to extend a military alliance with the Austro Hungarian Empire. Due to the growing contradiction between Italy and Austria Hungary, the Triple Alliance is on the verge of collapse. However, German diplomats still have hope for cooperation with Italy, as there are no confrontations between these countries yet."
 ww1_germany.7.t: "[GER.GetName] and [AUH.GetName] break the Alliance"
 ww1_germany.8.t: "Second Bjork Agreement"
 ww1_germany.8.d: "[GER.GetName] offers to sign expanded pact on neutrality and delimitation of spheres of colonial influence. This means that the Kaiser is committed to supporting us in case of intervention in Persia. A good chance to weaken the influence of the British crown in Asia."
 ww1_germany.8.a: "Why not?"
 ww1_germany.8.b: "We don't make deal with the devil."
 ww1_germany.9.t: "[GER.GetName] suggests non-intervention treaty"
 ww1_germany.9.d: "After the conclusion of the neutrality agreement, Germany asks not to exert pressure on Austria to confirm our neutrality. Germany intends to leave the Balkans, recognizing the Russian sphere of influence in this region."
 ww1_germany.9.a: "Let's do the Germans a favor."
 ww1_germany.9.b: "We will protect poles."
 ww1_germany.10.t: "[GER.GetName] threatens intervention"
 ww1_germany.10.d: "The intervention of Germany in the struggle for Persia became a reality. United with Russia, German diplomats pushed the demand to become a protectorate of Germany and Russia. Britain left the game, which means Germany is not afraid to send troops for colonial occupation."
 ww1_germany.10.a: "We are weak to resist."
 ww1_germany.10.b: "Let them come!"
 ww1_germany.11.t: "Kiel Mutiny"
 ww1_germany.11.d: "The sailors in Kiel, despite orders to continue operations, are engaging in a massive mutiny! This mutiny is spreading to the rest of Germany, with political unrest and chaos plaguing Germany. This could spell some serious trouble if this rebellion reaches a boiling point."
 ww1_germany.11.a: "Traitors!"
 ww1_germany.12.t: "Spartakusaufstand"
 ww1_germany.12.d: "Everything is getting worse! Proponents of Marxism have declared a general strike demanding the resignation of the German government. The main driving force of the protest is the Spartacist Movement, which accuses us of counter-revolution.\n\nThey are ready to provoke a civil war depending on our actions, all measures must be immediately taken to suppress the Spartacist uprising. Freikorp units are ready to support us."
 ww1_germany.12.a: "Crush this uprising!"
 ww1_germany.12.b: "Support the Spartacists."
 ww1_germany.13.t: "Deutscher Bürgerkrieg"
 ww1_germany.13.d: "The Spartacists have started a coup to overthrow the Weimar Republic! More than a hundred thousand supporters of the Spartacist League have stormed the Reichstag building and announced the establishment of the Soviet German Republic in Berlin. The Freikorps, despite their best efforts, have failed to effectively counter this uprising, but with their courage, some members of parliament have actually managed to escape the chaos in Berlin. Berlin has gone silent. §RThe German Civil War has begun.§!"
 ww1_germany.13.a: "Crush them!"
 ww1_germany.13.b: "For the Revolution!"
 ww1_germany.14.t: "German Civil War"
 ww1_germany.14.d: "In Germany, sporadic engagements began between the revolutionary Spartacists brigades and the detachments of nationalist Freikorps. Over the past few days, several coup attempts have been made in Germany, but by some miracle, the government managed to avoid total catastrophe. But this time, a massive uprising could not be avoided.\n\nBerlin is controlled by the Communists, but the rest of the regions are still under the control of a democratic government that refused to give up. Civil war is inevitable."
 ww1_germany.14.a: "The red tides will not stop.."
 ww1_germany.15.t: "Germany expands sphere of influence"
 ww1_germany.15.d: "After the defeat of Austria Hungary, the Kaiser plans to unite the German nations into a single federation within the Holy Roman Empire. They oblige us to submit to the interim government, which is formed from German military advisers."
 ww1_germany.15.a: "We have no choice."
 ww1_germany.15.b: "Neutrality is neutrality!"
 ww1_germany.16.t: "[GER.GetName] puts pressure on Switzerland"
 ww1_germany.16.d: "After the collapse of Austria-Hungary, the Kaiser intends to expand the German sphere of influence in the territory of the former Holy Roman Empire. Switzerland decided not to test Kaiser's patience, so the Federal Council decided to transfer part of the authority to the German headquarters of military advisers.\n\nGlobal tension is growing rapidly. The Great Powers are trying to cooperate in order to withstand German expansion in Europe."
 ww1_germany.16.a: "Holy Roman Empire? Baffling."
 ww1_germany.17.t: "[GER.GetName] intends to isolate us"
 ww1_germany.17.d: "Germany supported the economic war that Austria has been waging against us since tariff conflict of 1909. Thus, they intend to weaken the flow of resources, but force us to get closer to the Entente."
 ww1_germany.17.a: "We will find other partners."
 ww1_germany.18.t: "[GER.GetName] offers secret pact"
 ww1_germany.18.d: "Germany proposes to approve a secret pact signed in 1883. This means that Germany will become the guarantor of our security, and we will provide military support in the event of a major war.\n\nHowever, we have several important claims against Austria-Hungary because of their policies in Transylvania. And this secret pact does not provide for our requirements regarding Transylvanian Romanians."
 ww1_germany.18.a: "Conclude an agreement."
 ww1_germany.18.b: "We have reasons to distrust."
 ww1_germany.19.t: "[GER.GetName] puts pressure on us"
 ww1_germany.19.d: "The German Kaiser forces us to make a difficult choice: either Germany will force troops into the Netherlands to expand the bridgehead for the war with the Entente, or the authority will be transferred to German military advisers, which means the actual dissolution of parliament."
 ww1_germany.19.a: "We need their protection."
 ww1_germany.19.b: "We must protect our sovereignty!"
 ww1_germany.20.t: "[GER.GetName] asks military access"
 ww1_germany.20.d: "The German Empire has asked us to give them a Military Access.\nShould we give them this chance?"
 ww1_germany.20.a: "Provide military access."
 ww1_germany.20.b: "We refuse."
 ww1_germany.21.t: "[ITA.GetName] asks to transfer states"
 ww1_germany.21.d: "Italy asks to transfer regions in Tyrol and Istria. We are obliged to return these territories under the agreement that we concluded before the Brothers War."
 ww1_germany.21.a: "They deserve it."
 ww1_germany.21.b: "These lands are GERMAN."
 ww1_germany.22.t: "The Fate of [AUH.GetLeader]"
 ww1_germany.22.d: "[AUH.GetLeader] is now evacuated to Munich, away from the [AUH.GetAdjective] government. Most [AUH.GetAdjective] officers don't recognize [GER.GetAdjective] power, but at the same time cast doubt on possibility that Habsburgs will be able to restore the collapsed empire.\n\nWhile OHL is restoring order in occupied Cisleithania, we should decide what will happen to the former Emperor and the Archduke."
 ww1_germany.22.a: "Send to exile in Saxony."
 ww1_germany.22.b: "Crown him to the King of Austria."
 ww1_germany.25.t: "Offensive on Soviet Russia"
 ww1_germany.25.d: "The Bolshevik government refused to negotiate with us. Apparently, Lenin forgot that we did him a favor and helped him get to Petrograd. Then he will have to pay for his forgetfulness."
 ww1_germany.25.a: "It's time to end them."
 ww1_germany.26.t: "New Colonial Administration of Mittelafrika"
 ww1_germany.26.d: "The vast African colonies obtained after the victory of the Great War were united under a single colonial administration, Mittelafrika. This will bring glory and wealth to our empire."
 ww1_germany.26.a: "Forever, German Mittelafrika!"
 ww1_germany.27.t: "[GER.GetName] offers to revive the Swedish Empire"
 ww1_germany.27.d: "German Secretary for Foreign Affairs Arthur Zimmermann proposed an interesting agreement. They are asking to officially support Germany in the war. If we enter into an alliance with Germany, they vow to support our territorial expansion and even the revival of the Swedish Empire."
 ww1_germany.27.a: "Swedish Empire... Perfect."
 ww1_germany.27.b: "We will remain neutral."
 ww1_germany.28.t: "Proclamation of the new Reichsverfassung"
 ww1_germany.28.d: "During the conflict between the Reichstag and Kaiser, Wilhelm II adopted several decrees that expand the powers of the Prime Minister in the internal affairs of the country. Recognizing the inferiority of the constitutional system, Kaiser decided to reform the state system for the benefit of the German people and their empire allies.\n\nIn fact, constitutional reform won't weaken the influence of the Kaiser, but German foreign policy will depend on restraint of Reichstag."
 ww1_germany.28.a: "Germany decided to make peace with her neighbours?"
 ww1_germany.29.t: "Central Powers Conference begins"
 ww1_germany.29.d: "Trying to resolve the conflict between the participants of the Triple Alliance, Germany intends to hold a conference over the next three months. The number of members of the alliance will depend on the success of the negotiations."
 ww1_germany.29.a: "Let's begin already."
 ww1_germany.30.t: "Central Powers Conference begins"
 ww1_germany.30.d: "Trying to resolve the conflict between the participants of the Triple Alliance, Germany intends to hold a conference over the next three months. The number of members of the alliance will depend on the success of the negotiations."
 ww1_germany.30.a: "Let's begin already."
 ww1_germany.31.t: "Italian Question"
 ww1_germany.31.d: "[GER.GetName] asks us to cede the region of South Tyrol and Istria in order to prevent national conflicts. The Germans are ready to provide economic support so that we can recover from the loss of regions."
 ww1_germany.31.a: "Follow Willy's advice."
 ww1_germany.31.b: "Only Istria. Tyrol is our historical state."
 ww1_germany.31.c: "Over my dead body."
 ww1_germany.32.t: "[AUH.GetName] agrees to transfer the states"
 ww1_germany.32.t_2: "[AUH.GetName] agrees to transfer Istria"
 ww1_germany.32.d: "Austria agrees to cede its border regions to Italy in exchange for payment. At the end of the conference, we will be obliged to give part of our production to Austria.\n\nI hope Italy no longer has a disagreement with our allies."
 ww1_germany.32.d_2: "Austria agrees to cede Istria to Italy for payment. At the end of the conference, we will be obliged to give part of our production to Austria.\n\nI hope Italy will make this compromise. At least it's better than nothing."
 ww1_germany.32.a: "Good decision."
 ww1_germany.33.t: "[AUH.GetName] won't transfer states to [ITA.GetName]"
 ww1_germany.33.d: "Austria refused to transfer Istria and Tyrol to [ITA.GetName]. This means that Italy is unlikely to take our side at the end of the conference.\n\nAt least we don’t have to pay for this transfer."
 ww1_germany.33.a: "You absolute idiot.."
 ww1_germany.34.t: "Romanian Question"
 ww1_germany.34.d: "[GER.GetName] asks us to cede the region of Transylvania in order to prevent national conflicts. The Germans are ready to provide economic support so that we can recover from the loss of regions."
 ww1_germany.34.a: "Follow Willy's advice."
 ww1_germany.34.b: "We agree to transfer only Southern Transylvania."
 ww1_germany.34.c: "Never."
 ww1_germany.35.t: "[AUH.GetName] agrees to transfer states"
 ww1_germany.35.t_2: "[AUH.GetName] will transfer Southern Transylvania"
 ww1_germany.35.d: "Austria agrees to cede Transylvania to [ROM.GetName] in exchange for payment. At the end of the conference, we will be obliged to give part of our production to Austria.\n\nI hope Romania no longer has a disagreement with our allies."
 ww1_germany.35.d_2: "Austria agrees to cede only Southern Transylvania to [ROM.GetName] for payment. At the end of the conference, we will be obliged to give part of our production to Austria.\n\nI hope [ROM.GetName] will make this compromise. At least it's better than nothing."
 ww1_germany.35.a: "Good decision."
 ww1_germany.36.t: "[AUH.GetName] won't transfer states to [ROM.GetName]"
 ww1_germany.36.d: "Austria refused to transfer Transylvania to [ROM.GetName]. This means that Romania is unlikely to take our side at the end of the conference.\n\nAt least we don’t have to pay for this transfer."
 ww1_germany.36.a: "Are they kidding me?"
 ww1_germany.37.t: "Sonderjylland Question"
 ww1_germany.37.d: "[GER.GetName] decided to resolve the differences and make territorial concessions. They transfer South Jutland, in exchange they ask for an alliance. This is a good chance to become an ally of the strongest power in Europe."
 ww1_germany.37.a: "Agree to a deal."
 ww1_germany.37.b: "Too suspicious."
 ww1_germany.38.t: "[FROM.GetName] agreed to conclude an alliance with us"
 ww1_germany.38.d: "[FROM.GetName] responded positively to our proposal and are ready to conclude a pact with the Central Powers at the end of the conference. Let's celebrate it!"
 ww1_germany.38.a: "Alliance is getting stronger."
 ww1_germany.39.t: "[FROM.GetName] refused to conclude an alliance with us"
 ww1_germany.39.d: "[FROM.GetName] refused to conclude an agreement, declaring their neutrality. Well, that is their right. We wanted to solve our affairs in a good way."
 ww1_germany.39.a: "This is sad."
 ww1_germany.40.t: "Offer for [SWE.GetName]"
 ww1_germany.40.a: "Economic support."
 ww1_germany.40.b: "Military technology."
 ww1_germany.40.c: "Nothing to offer, but our protection."
 ww1_germany.41.t: "[GER.GetName] offers to join Central Powers"
 ww1_germany.41.a: "Agree to a deal."
 ww1_germany.41.b: "Too suspicious."
 ww1_germany.42.t: "Offer for [HOL.GetName]"
 ww1_germany.43.t: "Offer for [NOR.GetName]"
 ww1_germany.44.t: "Offer for [SWI.GetName]"
 ww1_germany.45.t: "[GER.GetName] offers to expand the Defensive pact"
 ww1_germany.45.d: "[FROM.GetName] responded positively to our proposal and are ready to conclude a pact with the Central Powers at the end of the conference. Let's celebrate it!"
 ww1_germany.45.a: "Why not?"
 ww1_germany.45.b: "We are no longer negotiating with them."
 ww1_germany.46.t: "Secret Pact inactivated"
 ww1_germany.46.d: "Germany is at war, so we are obliged to announce mobilization and support our allies."
 ww1_germany.46.a: "Ready to fight."
 ww1_germany.47.t: "Vladimir Lenin leaves Switzerland"
 ww1_germany.47.d: "Revolution will begin soon in Russia. Upon learning of the unstable situation in his homeland, Vladimir Lenin, who was in Switzerland with other russian radical socialists, realized this is the best opportunity to establish communist government in Russia.\n\nThe German government is interested in destabilizing Russia with the goal of weakening their army. Therefore, we must provide Lenin and his comrades with a safe path to Petrograd. Better yet, provide a sealed wagon so that no one will notice it."
 ww1_germany.47.a: "Have a good trip!"
 ww1_germany.48.t: "[GER.GetName] initiates unification of Concessions"
 ww1_germany.48.d: "Germany proposes to establish  Organization of Legation Cities with federal self-government. Since we own colonial subject in China, we can sign this treatise. If we don't agree to transfer the subject under control, then the cities of Concession will have claims to our colony."
 ww1_germany.48.a: "Take it, boy!"
 ww1_germany.48.b: "Answer is negative."
 ww1_germany.49.t: "[GER.GetName] puts pressure on Scandinavia"
 ww1_germany.49.d: "[GER.GetName] intends to gain a foothold in northern Europe to cut Britain off Russia and limit trade across the northern seas. Therefore, they demand to transfer part of the management of the army to the German Headquarters, which will actually turn us into a their puppet."
 ww1_germany.49.a: "Skit. Dritt. Lort."
 ww1_germany.49.b: "Gø åwäy, Kaiser!"
 ww1_germany.50.t: "[GER.GetName] offers conclude pact"
 ww1_germany.50.d: "[GER.GetName] suggests concluding a series of diplomatic acts that will allow us to avoid territorial conflicts in Oceania. This tells us that Kaiser intends to conclude a military alliance with us in the future."
 ww1_germany.50.a: "Good deal."
 ww1_germany.50.b: "Refuse to sign an agreement."
 ww1_germany.51.t: "Muslim minority protests"
 ww1_germany.51.d: "Anti-government protests erupted in the western region of Raj; several dozen soldiers were killed during the uprising. Underground organizations receive arms supplies from abroad, through Afghanistan. Most likely someone from abroad is destabilizing the situation in Raj."
 ww1_germany.51.a: "It is necessary to report this to the metropolis."
 ww1_germany.53.t: "Zimmermann Telegram"
 ww1_germany.53.d: "From [GER.GetLeader] to [MEX.GetLeader]:\n\n'We intend to begin unrestricted submarine warfare. We shall endeavor in spite of this to keep [USA.GetName] neutral. In the event of this not succeeding, we make Mexico a proposal of alliance on the following basis: make war together, make peace together, generous financial support and an understanding on our part that Mexico is to reconquer the lost territory in Texas, New Mexico, and Arizona."
 ww1_germany.53.a: "America will pay for everything!"
 ww1_germany.53.b: "We are not so strong."
 ww1_germany.54.t: "Mexico agrees to support Germany"
 ww1_germany.55.t: "Mexico rejects Zimmerman's offer"
 ww1_germany.56.t: "Secret alliance with Germany"
 ww1_germany.57.t: "Austria Hungary transfers Italian territories"
 ww1_germany.58.t: "Austria Hungary transfers Romanian territories"
 ww1_germany.59.t: "Lenin was killed by a German Agent"
 ww1_germany.59.d: "Germany has stabbed the Soviets in the back! After the tides of revolution have passed, the German government has taken decisive measures to eliminate the Bolshevik leaders as soon as they became too dangerous. There were many Abwehr agents in the party, which came as a big surprise. The traitor Kirov, along with his assistants, blew up the office of Comrade Lenin. The leader of the revolution died from his wounds. Kirov managed to escape to Denmark.\n\nThis attack means only one thing - Germany intends to establish its own power over Russia."
 ww1_germany.59.a: "Your revolution is no more!"
 ww1_germany.60.t: "German Investments"
 ww1_germany.61.t: "Payment of Reparations"
 ww1_germany.61.d: "The Entente powers have forced us to pay 132 billion gold marks, or 33 billion U.S dollars, in reparations for civilian damages caused throughout the war. This huge sum of money isn't going to get paid with little effort, and our government is already under huge stress from internal and external affairs. Not only is this a huge humiliation, but this comes greatly at the expense of our people."
 ww1_germany.61.a: "Today we eat bread, tomorrow paper.."
 ww1_germany.65.t: "[GER.GetName] offers cooperation"
 ww1_germany.65.d: "Germany offers military support in the upcoming war for the British colonies. They ask us to provide docks and ports for the construction of the German Asian fleet."
 ww1_germany.65.a: "We agree."
 ww1_germany.65.b: "I don't think so."
 ww1_germany.66.t: "[SIA.GetName] agree to sign agreement"
 ww1_germany.66.d: "We are pleased to announce that Siam is ready to join the Tokyo-Berlin Pact. In the event of a war for the colonies in Asia, they will join our alliance."
 ww1_germany.66.a: "Nice."
 ww1_germany.67.t: "[SIA.GetName] refuses to sign Tokyo-Berlin Pact"
 ww1_germany.67.d: "Siam will not sign an agreement with us, and will not cede seaports. They refuse to participate in the war."
 ww1_germany.67.a: "Obnoxiously."
 ww1_germany.68.t: "[GER.GetName] calls for arms"
 ww1_germany.68.d: "The colonial empires at war. Germany calls on us to fulfill our obligations and enter the war against Britain. If we break the contract, Germany will consider us a traitor."
 ww1_germany.68.a: "Do it."
 ww1_germany.68.b: "This is not our war."
 ww1_germany.69.t: "[FROM.GetName] denounces the Tokyo-Berlin Pact"
 ww1_germany.69.d: "Frightened by the large-scale colonial war against Britain, [FROM.GetName] decided to break the agreement with us. We have the right to punish them for their betrayal."
 ww1_germany.69.a: "Traitors must be punished."
 ww1_germany.70.t: "[JAP.GetName] calls for arms"
 ww1_germany.70.d: "The colonial empires at war. [JAP.GetName] calls on us to fulfill our obligations and enter the war against Britain. This is our chance to defeat British hegemony."
 ww1_germany.70.a: "Fight!"
 ww1_germany.71.t: "[GER.GetName] offers investment"
 ww1_germany.71.d: "[GER.GetName] expects [PER.GetName] to support their alliance. Therefore, they offer economic support in exchange for a military treaty. They realize that we are weak enough, so Germany can put pressure on us if we do not agree."
 ww1_germany.71.a: "No reason to refuse after all."
 ww1_germany.71.b: "And why should we accept this?"
 ww1_germany.72.t: "[PER.GetName] refuses"
 ww1_germany.72.d: "[PER.GetName] will not conclude an alliance agreement despite our proposal. We can put economic pressure on them to change the answer."
 ww1_germany.72.a: "Leave Persia."
 ww1_germany.72.b: "Press on them."
 ww1_germany.73.t: "[GER.GetName] puts economic pressure"
 ww1_germany.73.d: "[GER.GetName] uses its economic influence so that we change our mind about their offer."
 ww1_germany.73.a: "No. Our last word."
 ww1_germany.73.b: "Well, if they insist so."
 ww1_germany.74.t: "Romania Surrenders!"
 ww1_germany.74.d: "Without Russian support, the Romanian army isn't able to resist the advance of troops of the Central Powers.\n\nOur terms are harsh, but [ROM.GetNameDef] has no choice but to accept them."
 ww1_germany.74.a: "Shouldn't have picked a fight with the German army!"
 ww1_germany.74.b: "They will remain occupied."
 ww1_germany.75.t: "Finished French Civil War Intervention?"
 ww1_germany.75.d: "The French Civil War is over. Our army successfully defeated the Socialists who threatened the western border, and cut their buds off.\nBut we may be able to crush the French so that they can no longer reach us..."
 ww1_germany.75.a: "§RLet's not give them any chance for revenge.§!"
 ww1_germany.75.b: "No more war!"
 ww1_germany.77.t: "Schlieffen dies!"
 ww1_germany.77.d: "On the 4th of January, 1913, a former head of our General Staff, Alfred von Schlieffen, died of old age. He was mostly famous for developing our strategy for a possible war against French-Russian Entente."
 ww1_germany.77.a: "Memento mori."
 ww1_germany.78.t: "Expedition arrives in Kabul"
 ww1_germany.78.d: "The expedition to Afghanistan has finally arrived to meet the Emir in Kabul after a long expedition from Berlin to Kabul and several weeks on traveling and evading British and Russian infantry patrols."
 ww1_germany.78.a: "A great accomplishment!"
 ww1_germany.79.t: "Afghanistan joins the Central Powers"
 ww1_germany.79.d: "News has come from India and Afghanistan that Afghan soldiers and German officers have invaded northern India and several skirmishes have broken out between Indian and Afghan soldiers. It has put the Raj in a very poor situation, and the fall of the Crown Jewel is possible."
 ww1_germany.79.a: "The war expands."
 ww1_germany.80.t: "German Defeat of the Third Franco-German War"
 ww1_germany.80.d: "It hasn't been long since the Great War ended, but something shocking happened again. The German Empire is defeated after fierce battles against France. Something that no one could have expected happened. The past days are completely over. This century is not in our hands anymore.\nThe German Empire collapsed, and German colonies and influences were completely destroyed. And there's only chaos left."
 ww1_germany.80.a: "It is unbelievable."
 ww1_germany.81.t: "Occupation of Rhineland"
 ww1_germany.81.d: "By the Treaty of Versailles, the Entente set up a demilitarized zone on Rhineland, so that [GER.GetName] could not have troops in the region. Moreover [FRA.GetAdjective] seem that they have a intention on annexing the region into [FRA.GetName] or separating it as a buffer state for them."
 ww1_germany.81.a: "It is too harsh!"
 ww1_germany.81.b: "I hear a baby crying..."
 ww1_germany.82.t: "Scuttling of the Fleet"
 ww1_germany.82.d: "Our fleet is now in the enemy harbor. They are considering how to divide our ships in the postwar treaty. We'd rather have all these ships scuttled..."
 ww1_germany.82.a: "What a difficult decision..."
 ww1_germany.82.b: "What does it matter now?"
 ww1_germany.83.t: "Scuttling of the German Fleet"
 ww1_germany.83.d: "The High Seas Fleet has interned an Allied port under the terms of the Armistice whilst negotiations took place over the fate of the ships. Fearing that either the Entente would seize the ships unilaterally or the German government at the time might reject the Treaty of Versailles and resume the war effort (in which case the ships could be used against Germany), Admiral Ludwig von Reuter decided to scuttle the fleet."
 ww1_germany.83.a: "What the hell?"
 ww1_germany.83.b: "It's heartbroken..."
 ww1_germany.83.c: "Shocking."
 ww1_germany.84.t: "Imposed Army Restriction"
 ww1_germany.84.d: "By the Treaty of Versailles, our army is limited to 100,000 and our officers to 4,000. In addition, the General Staff will not be able to set up, and we are not allowed have up-to-date weapons such as tanks, submarines, and airplanes. Head of the Army Command Hans von Zeckt, who became the highst man in the army, tries to select young and competent officers and form elite troops within a limited military size."
 ww1_germany.84.a: "Leave competent men as we can..."
 ww1_germany.85.t: "Erich Ludendorff Is In Power"
 ww1_germany.85.d: "Although Kaiser Wilhelm II of the German Empire and the army chief of staff, Paul von Hindenburg, are in charge of leading [GER.GetNameDef] in the Great War, the Kaiser is incompetent in the military and Hindenburg is too old.   Because of that Erich Ludendorff which is the second army chief of staff and the commander-in-chief of the munitions is in power now.\nIn addition, he controlled the German economy with the pretext of producing military supplies, and became involved in business and general life of the people. In fact, he can be told as the leader of [GER.GetNameDef]."
 ww1_germany.85.a: "Can we trust him?"
 ww1_germany.86.t: "Approach to [SOV.GetNameDef]"
 ww1_germany.86.d: "We, branded as a loser in the Great War, and [SOV.GetNameDef], which had a different system in the name of communism, have one thing in common. That is we are being alienated from the world. Since the last war, we have not established a proper diplomatic relationship with them. Maybe now is a good time to find a suitable ally."
 ww1_germany.86.a: "Let's give a shot."
 ww1_germany.86.b: "Nein."
 ww1_germany.87.t: "German Ally?"
 ww1_germany.87.d: "It seems the Germans want to establish good relations with us. We are under pressure to pay the Russian Empire's debts to [FRA.GetName], and [GER.GetName] is obliged to pay huge reparations to [FRA.GetName]. That is why we have a common where we can be united."
 ww1_germany.87.a: "Like the good old days..."
 ww1_germany.87.b: "Remember the Treaty of Brest-Litovsk!"
 ww1_germany.88.t: "Treaty of Rapallo"
 ww1_germany.88.d: "An agreement is signed on today between [GER.GetNameDef] and [SOV.GetName] under which both renounced all territorial and financial claims against each other and opened friendly diplomatic relations. Also, it is signed during the Genoa Economic and Financial Conference, where the victors of the Great War were planning to have [GER.GetName] repay the debts owed by the Russian Empire to [FRA.GetName]. However, this treaty failed the plan."
 ww1_germany.88.a: "Le vin est tiré. Il faut le boire."
 ww1_germany.88.b: "Shocking."
 ww1_germany.89.t: "[SOV.GetAdjective] Refusal"
 ww1_germany.89.d: "The reds are incredible. They still burn with vengeance against us!"
 ww1_germany.89.a: "Sure then whatever..."
 ww1_germany.90.t: "The Military Renounces War"
 ww1_germany.90.d: "The German army is no longer willing to fight and the our defense line will soon be collapsed. Moreover, the German people no longer have food to eat and support war effort. If we don't immediately ask for an armistice, we will be completely defeated."
 ww1_germany.90.a: "Mein Gott...!"
 ww1_germany.91.t: "The Turnip Winter"
 ww1_germany.91.d: "The Great War is expensive for [GER.GetNameDef], because of the maritime blockades that we are suffering, we are today short of food for our population. Despite rationing, our people are suffering a terrible famine which threatens to undermine our war effort."
 ww1_germany.91.a: "Shocking..."
 ww1_germany.92.t: "Ludendorff Offensive"
 ww1_germany.92.d: "[GER.GetNameDefCap] has a gut feeling that the war situation is getting more unfavorable, and attempts an all-out offensive to change the situation on the entrenched Western Front. If this offensive fails, [GER.GetNameDef] may not be able to hold out any longer."
 ww1_germany.92.a: "One last shot that risking life of the Empire."
 ww1_germany.92.b: "It's a desperate move!"
 ww1_germany.92.c: "It seems that victory or defeat has been decided."
 ww1_germany.93.t: "Refusal to Import Polish Goods with No Customs?"
 ww1_germany.93.d: "The Treaty of Versailles, which had to be signed due to our defeat in the Great War, has a clause that defeated countries should unilaterally exempt import duties on goods exported from countries that independence from defeated countries to them. As a result, our country cannot impose tariffs on imports from Poland.  Moreover, all goods we export to [POL.GetName] are subject to customs duties.\n[POL.GetNameDefCap] has robbed more German-populated regions simply because we lost, and they seem to look down on us a lot.\nThere is public opinion that a trade attack which is refuse to import their goods must be launched against [POL.GetNameDefCap] to trample their rudeness. And they will be hit hard because they depend on us for most of their trade."
 ww1_germany.93.a: "What are you waiting for, gentleman?"
 ww1_germany.93.b: "If we break the treaty, we will get into big trouble."
 ww1_germany.94.t: "[GER.GetName] Refuses to Import Our Goods with No Customs"
 ww1_germany.94.d: "The Treaty of Versailles, which had to be signed due to achieve our independence after the Great War, has a clause that defeated countries should unilaterally exempt import duties on goods exported from countries that independence from defeated countries to them. As a result, [GER.GetNameDefCap] cannot impose tariffs on imports from us.  Moreover, all goods they export to us are subject to customs duties.\nWe have had a territorial dispute with Germany since our independence. They claim that the undoubted Polish territories should be reclaimed because they were under their rule at the time of their imperial expansion. So they unilaterally informed us that they would stop importing from us."
 ww1_germany.94.a: "Tell them we're going to stop importing too!"
 ww1_germany.94.b: "Our economy is too weak. For the development of our country, hand over the lands they demand..."
 ww1_germany.95.t: "Aftermath of the German-Polish customs war"
 ww1_germany.95.d: "The Great Depression and the trade war have severely crushed and broke our economy... But this war will not end without concessions from either side."
 ww1_germany.95.a: "Just have to endure..."
 ww1_germany.96.t: "German-Polish Customs War Ends"
 ww1_germany.96.d: "To end the pointless trade retaliation that has weakened our mutual economy and establish a friendly relationship with Poland will help Germany prepare for the war for the Lebensraum."
 ww1_germany.96.d_2: "The trade dispute with Poland has ceased to exist somehow. So no one wins."
 ww1_germany.96.a: "Well..."
 ww1_germany.96.b: "Jawohl!"
 ww1_germany.96.c: "But we do not negotiate with these lowly Slavs."
 ww1_germany.97.t: "Hitler Proposes Cessation of Customs War and Non-Aggression Pact"
 ww1_germany.97.d: "German Chancellor Adolf Hitler announced that he wants to end the senseless trade retaliation that had weakened the mutual economy and to establish friendly relations with Poland."
 ww1_germany.97.a: "Man of culture, he is."
 ww1_germany.97.b: "You know what? Screw you!"
 ww1_germany.98.t: "Reichstag Fire"
 ww1_germany.98.d: "An arson attack on the Reichstag building, home of the German parliament in Berlin, executed on today. Hitler's government stated that Marinus van der Lubbe, a Dutch council communist, was the culprit, and it attributed the fire to communist agitators.\nThe first report of the fire came shortly after 9:00 p.m., when a Berlin fire station received an alarm call. By the time police and firefighters arrived, the lower house 'Chamber of Deputies' was engulfed in flames. The police conducted a thorough search inside the building and accused Van der Lubbe. He was arrested, as were four communist leaders soon after. Hitler urged President Paul von Hindenburg to issue an emergency decree to suspend civil liberties and pursue a ruthless confrontation with the Communist Party of Germany. After the decree was issued, the government instituted mass arrests of communists, including all of the Communist Party's parliamentary delegates."
 ww1_germany.98.a: "Damn communists!"
 ww1_germany.99.t: "Reichskanzler Georg Michaelis"
 ww1_germany.99.d: "The Reichstag and the High Command (OHL) foreces Bethmann-Hollweg to resign because he has to take responsibility for the lack of war support. Because of that, Georg Michaelis is appointed Reichskanzler of [ROOT.GetNameDef].\nAlso, he is the first chancellor not of noble birth to hold the office."
 ww1_germany.100.t: "Reichskanzler Georg von Hertling"
 ww1_germany.100.d: "Georg Michaelis leaves the office because the Reichstag demands the prime minister, who accused them of being socialists, to resign. Georg von Hertling, a Zentrum aristocrat, replaces him as Reichskanzler of [ROOT.GetNameDef]."
 ww1_germany.101.t: "Reichskanzler Maximilian von Baden"
 ww1_germany.101.d: "Maximilian von Baden, who is appointed Reichskanzler of [ROOT.GetNameDef] at this time when the defeat is imminent, will move forward with parliamentarization while proposing the truce to [FRA.GetFactionName]."
 ww1_germany.101.a: "I hope he leads the truce negotiations well."
 ww1_germany.102.t: "Reichskanzler Alfred von Tirpitz"
 ww1_germany.102.d: "Alfred von Tirpitz, the great admiral, is appointed Reichskanzler of [ROOT.GetNameDef]."
 ww1_germany.102.a: "The people welcomes him."
 ww1_germany.104.t: "Reichskanzler Erich Ludendorff"
 ww1_germany.104.d: "Erich Ludendorff, the general of the army, is appointed Reichskanzler of [ROOT.GetNameDef]."
 ww1_germany.104.a: "I hope him to be a good leader in this wartime."
 ww1_germany.105.t: "The Death of Alfred von Tirpitz"
 ww1_germany.105.d: "Alfred Peter Friedrich von Tirpitz, the Reichskanzler and Großadmiral is dead. While on a trip to Hamburg, von Tirpitz was suddenly taken ill. Despite the best efforts of local doctors, he died on today, due to complications from his advanced age. The death of von Tirpitz caught the DVLP unawares, as he had not prepared anyone to act as his successor."
 ww1_germany.105.a: "He was loyal to his emperor."
 ww1_germany.106.t: "[GetYear] [GER.GetAdjective] Presidental Election"
 ww1_germany.106.d: "After the death of Friedrich Ebert, the first president of the Weimar Republic, elected by the Constituent Assembly, a presidential election is held to elect a new president according to the constitution. The war hero and royalist Paul von Hindenburg met Wilhelm II and eventually ran as an independent at the insistence of the Reichswehr. To counter him, the Weimar Union; Social Democratic Party, Zentrum, and the German Democratic Party decided to form a solidarity and nominated former Prime Minister Wilhelm Marx of the Zentrum Party as a single candidate. In the end, however, Hindenburg won the election."
 ww1_germany.106.a: "A royalist president?"
 ww1_germany.108.t: "Disbanding the Freikorps"
 ww1_germany.108.d: "The Treaty of Versailles forces us to disband our army and paramilitaries and keep our forces as minimal as necessary. So we need to disband the largest paramilitary in our country that is the Freikorps. Prime minister and minister of defense has signed on the paper of order."
 ww1_germany.108.a: "Okay."
 ww1_germany.109.t: "Freikorps Refused!"
 ww1_germany.109.d: "The Freikorps, currently the most powerful paramilitary organization in [GER.GetNameDef] and closely related to the military, has refused to disband. They put pressure on us, holding their parade near Berlin, and Lüttwitz, the leader of the Freikorps and the supreme commander of all military troops of the Reich in case of an emergency or war, said the following: I will not allow such a core force to be crushed in such a thunderstorm time.\nThe president and the defense minister got in touch with him, but he made unreasonable demands, such as an immediate dissolution of Reichstag, holding elections to form a new government, and making him supreme commander of the army."
 ww1_germany.109.a: "What are they gonna do? Coup us?"
 ww1_germany.110.t: "Kapp-Lüttwitz Putsch"
 ww1_germany.110.d: "There is nothing we can do. The defense minister asked the military to crush them, but they, Hans von Seeckt said, 'Reichswehr does not shoot at Reichswehr'. At dawn the next day, rebels began to march into the city of Berlin, and members of the Cabinet had to evacuate. In the morning the rebels finally took control of all of Berlin, the rebel leader Wolfgang Kapp proclaimed himself Reichskanzler, and Lüttwitz, who actually led the rebellion, became Minister of Defense."
 ww1_germany.110.a: "Call for a general strike!"
 ww1_germany.110.b: "Bring any troops we can mobilize!"
 ww1_germany.111.t: "Putsch Failed"
 ww1_germany.111.d: "The Putsch failed after the massive general strike of 12 million workers across the country. However, the government also lacked the force to decisively expel the rebels, and negotiations were held once again. In negotiations involving major political parties and the military, General Hans von Sekt became commander-in-chief of the army instead of overthrowing the cabinet established by Kapp and Lüttwitz. The putsch was finally over when a compromise was reached that included re-elections to appoint and form Reichstag."
 ww1_germany.111.a: "That was a mess."
 ww1_germany.112.t: "The Empire Strikes Back?"
 ww1_germany.112.d: "After the chaos and bitter civil wars, the Kapp government became the only government in Germany. Wolfgang Kapp is a royalist in the first place, so he wants to end this republican mischief and bring Wilhelm II back from Holland. But Lüttwitz may be unwilling to miss the golden opportunity to have an all-Germany under his grasp."
 ww1_germany.112.a: "Contact the Dutch embassy."
 ww1_germany.112.b: "Kapp, hold on..."
 ww1_germany.113.t: "The Occupation of the Rhineland Ended"
 ww1_germany.113.d: "Under the Treaty of Versailles, the Inter-Allied Rhineland High Commission had administrated on the occupied Rhineland in order to prevent Germany from starting a another war against France and to force them to pay the war reparations properly. However, due to changes in the international situation, continued German demand for return, frequent workers' strikes, and reparation issues, the Entente forces withdrew from the Rhineland, considering that they had achieved their intended purpose."
 ww1_germany.113.a: "The shadow of the Treaty of Versailles is gradually lifted."
 ww1_germany.113.b: "Are they docile now?"
 ww1_germany.114.t: "Question on the Holy Kaiser"
 ww1_germany.114.d: "Wilhelm II is now not only Kaiser of the German Empire, but also Kaiser of the Holy Roman Empire which once again is proclaimed the resurrection. The status of the Römisch-deutscher Kaiser, the double emperor, is higher than at any other time of German history. However, the German Empire has sacrificed many freedoms and rights to pursue the victory on the Great War and is under a de facto military controlled regime. Now the Great Holy Roman Empire, victorious in the Great War, will again enter the eternal golden age under the Kaiser's rule."
 ww1_germany.114.a: "Long live the Römisch-deutscher Kaiser Wilhelm II!"
 ww1_germany.114.b: "The Reichsarmee of the Holy Roman Empire, swears allegiance to the only Kaiser!"
 ww1_germany.115.t: "Aftermath of the French Civil War"
 ww1_germany.115.d: "The French Civil War is over. The socialists are defeated and the republic is victorious. However, it should be noted that Germany intervened in the civil war to occupy northern France, and while helping to drive the socialists out, they intervened in the civil war and effectively invaded our country once again."
 ww1_germany.115.a: "Of course, they must leave!"
 ww1_germany.116.t: "Aftermath of the French Civil War"
 ww1_germany.116.d: "The French Civil War is over. The socialists are defeated and the French Republic is victorious. We intervene in the French civil war, successfully expelling the socialists and occupying few parts of Northern France. A military occupation administration is being established in the region, and imperial ambitious politicians claim this opportunity to make France a permanent subject or dominion.\nOn the other hand, the government of the French Republic claims that we have interfered in their internal affairs and, in effect, broke the peace treaty and invaded France again. They are not willing to yield unless we return the occupied territories."
 ww1_germany.116.a: "The only intention was drive the socialist out."
 ww1_germany.116.b: "Demand some territorial concessions and accession to Reichspakt."
 ww1_germany.116.c: "Answer them: No."
 ww1_germany.117.t: "Germany Cedes Their Occupations"
 ww1_germany.117.d: "Germany returned their occupied territories unconditionally, claiming that their only intention was to drive the socialists out of Europe."
 ww1_germany.117.a: "Viva la France!"
 ww1_germany.118.t: "Germany Wants to Conditionally Cede Occupied Territories"
 ww1_germany.118.d: "For the cost of returning France, which they occupied without any permission, Germany want us to join the Reichspakt and calls for approval of the ceding of French Alsace-Lorraine, Nancy, Nord and Ivory Coast."
 ww1_germany.118.a: "The republic became a springboard being played within their new order."
 ww1_germany.118.b: "No compromise with Germany ever again! Viva la French Republic!"
 ww1_germany.119.t: "France Refused!"
 ww1_germany.119.d: "The French Republic government flatly rejected our offer and their troops are immediately being deployed near our French occupied territories."
 ww1_germany.119.a: "To war..."
 ww1_germany.120.t: "Germany Refused!"
 ww1_germany.120.d: "The German government flatly rejected our demand and their troops are immediately being deployed near our border."
 ww1_germany.120.a: "They shall not pass!"
 ww1_germany.121.t: "Capital of Greater Germany"
 ww1_germany.121.d: "With the unification of Greater Germany and restoration of the Holy Roman Empire, we can now reconsider the location of our capital. We may move our capital to Frankfurt, location of the 1848 Nationalversammlung, to show our identification to the ideal of Greater Germany. Another possible choice is moving our capital to Regensburg, location of the Perpetual Imperial Diet since 1663, to show our respect to tradition of the old empire."
 ww1_germany.121.a: "Move our capital to Frankfurt."
 ww1_germany.121.b: "Move our capital to Regensburg."
 ww1_germany.121.c: "We will still rule from Berlin."
 ww1_germany.122.t: "Ruhr Uprising"
 ww1_germany.122.d: "Despite the end of the Kapp-Lüttwitz Putsch, and the SPD government returned to power of the Weimar Republic, the workers in the Ruhr region continue to strike and try to proceed another communist revolution. This is a threat that cannot be overlooked, and movements of the far left that threaten the stability of the current government must be thoroughly crushed."
 ww1_germany.122.a: "Reichswehr and Freikorps shall handle them."
 ww1_germany.122.b: "Workers of the world, unite!\n(Play as Ruhr Red Army)"
 ww1_germany.123.t: "Ruhr Red Army Victorious"
 ww1_germany.123.d: "Despite we faced all as our enemies, the Ruhr Red Army defeated the false Social-Democratic regime, the conservative reactionary Reichswehr and the Freikorps. The red flag have already been hoisted over the Reichstag in Berlin."
 ww1_germany.123.a: "Es lebe die Arbeiter! Lang lebe die Revolution!"
 ww1_germany.124.t: "Ruhr Red Army Crushed"
 ww1_germany.124.d: "The workers who participated to strikes in Ruhr, and the Ruhr Red Army have crushed by our military operation."
 ww1_germany.124.a: "Can this shut the far lefts up?"
 ww1_germany.125.t: "Territorial Reparation of [FRA.GetName]"
 ww1_germany.125.d: "The army of [FRA.GetNameDef] has failed on every frontline by our forces, after that [FRA.GetNameDef] government asked us the truce. There is no room for the French to keep the fights on.\n We will gonna force the post war treaty on the losers, and a lot of people insist that we must include some territorial reparations in treaty terms."
 ww1_germany.125.a: "All of the Mosel basin belongs to Germany."
 ww1_germany.125.b: "Should not be that there are too many French in [GER.GetNameDefCap]."
 ww1_germany.126.t: "Return of Rhineland Occupations?"
 ww1_germany.126.d: "[FRA.GetName] decided to return Rhineland occupations to [GER.GetNameDef]. Since we have participated in these occupation, we need to decide what should we do."
 ww1_germany.126.a: "Disarm would suffice."
 ww1_germany.126.b: "Here is totally our territory now."
 weimar_republic: "Weimar Republic"
 ww1_germany.127.t: "Disposition on French-occupied Germany?"
 ww1_germany.127.d: "Germany submitted under our control. There was a disgraceful event that the German Empire was declared in the Palace of Versailles which is located in Paris, the heart of France. So we can also declare the dissolution of Germany in Berlin Palace, once the heart of the German Empire."
 ww1_germany.127.a: "Let's disunite them."
 ww1_germany.127.b: "That's too pre-modern."
 ww1_germany.128.t: "Schlieffen-Plan"
 ww1_germany.128.d: "[ROOT.GetNameDefCap] is at risk of a two-sided front. The Imperial Staff had already begun to formulate a war plan to overcome this unfavorable situation. We predicted that [RUS.GetNameDef] would take at least two monthsto mobilize, organize, train, and transport reserve forces to the front line, considering their pre-modern administrative system and poor rail transport network. Therefore, we envisioned a plan to place a minimal number of troops on the [RUS.GetAdjective] front to contain them, while at the same time mobilizing all available resources to neutralize [FRA.GetName] as soon as possible, and then quickly return the main force to the Eastern Front to face [RUS.GetName]. This would require attacking the Lowlands and advancing straight into Paris, rather than breaking through the [ROOT.GetAdjective]-[FRA.GetAdjective] border, where [FRA.GetName] has fortified its defenses through the Serre de Rivière system of fortifications. \nHowever, there is a fatal problem with this plan; [BEL.GetNameDef] is a neutral country."
 ww1_germany.128.a: "Will consider."
 ww1_germany.128.a.tt: "§YYou can now run Schlieffen-Plan in the Decisions tab.§!"
 ww1_germany.129.t: "The Winter is Coming"
 ww1_germany.129.d: "A very bitterly cold winter is coming for [ROOT.GetName]. The Imperial Staff warns that all domestic stockpiles, including strategic and daily necessities, may run out if the war is prolonged due to the naval blockade."
 ww1_germany.129.a: "Will prepare."
 ww1_germany.129.a.tt: "§RFailure to complete the mission would impose a fatal national idea on our war effort.§!"
 ww1_germany.130.t: "The Kaiser Calls for a War Council"
 ww1_germany.130.d: "Meeting at the Stadtschloss in Berlin, the Kaiser has called a War Council between the highest military leaders in the German Empire. It's expected that the topics of discussion will follow the tense military and diplomatic situation in Europe. Specific topics will naturally focus on Russia's 'Great Military Plan', Austria-Hungary's concerns about Serbian military action, and the relationship of the Empire with the British.\n\nKnown attendees include Tirpitz, Muller, Molkte, and Heeringen, with an equally strong presence from the Army and the Navy.\n\nAs preparations and talks about Germany's place in a war in Europe, each day brings war closer to the Reich and do doubt, soon legislature will be passed to expand the German armed forces to meet a new era of war."
 ww1_germany.130.a: "A major war is on the horizon."
 ww1_germany.131.t: "Modernization of the Schlieffen Plan?"
 ww1_germany.131.d: "The General Staff is pressing for a rewrite of the Schlieffen Plan, designed to invade France via the Benelux. The Generalstab has proposed a more aggressive version of the plan, aiming to leave the Netherlands behind and instead focus on a forward offensive directly against Belgium.\n\nWar Minister Josias von Heeringen has already made it clear that, in his view, such a plan is too risky and would exhaust soldiers and immobilize the front. Many other generals disagree, and a decision must be made on whether or not to approve this new plan."
 ww1_germany.131.a: "The new plan is a sound compromise."
 ww1_germany.131.b: "Stick to the original plan."
 ww1_germany.132.t: "Schlieffen Plan Failed"
 ww1_germany.132.d: "Schlieffen Plan has failed. The troops attempted to detour through Belgium and directly attack northern France, but failed to enter Paris, the original goal, facing strong resistance from the enemy. Now, the right wing of the German army is exposed to enemy attacks, and the excessively stretched supply lines are starting to stimulate the anxiety of defeat.\nTo overcome this problem, the headquarter decided that it would be needful to dig trenches on the frontlines, install machine guns, and construct stronghold-fortress lines to temporarily switch to a defensive aspect."
 ww1_germany.132.a: "Dig in! We need to hold the frontline!"

