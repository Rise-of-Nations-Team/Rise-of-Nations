 LOG_3: "RISE OF NATIONS CHANGELOG (v1.3 HOI4 1.13 ) ----------------- \n'Spooky'\n\n §YHOTFIX:§! \n-Fixed Volunteers, you can now send volunteers, which was broken before \n\n §YADDITIONS:§! \n- §7Updated to latest HOI4 version, this version of the mod includes MIOs and Armament trade, please note that every Manufacturer was not added, we are adding them progressively. \n- BBA Plane Rework: We added compatibility for BBA, you can now design planes if the DLC is enabled, non-DLC users will still have the same tech tree. \n- Added Characters (advisors, generals and leaders) for Qing China, Nationalist China and Communist China. \n- The political view will no longer display the country's ideology but its sub-ideology.§!\n\n§YQoL:§! \n- §RFixed random crash happening, on focus completion, on game load and on plane creation§!\n- §RFixed a lot of errors that were present in the mod§! \n\n§YExperimental Features:§! \n - Spanish civil war rework, including decisions and focus tree \n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

