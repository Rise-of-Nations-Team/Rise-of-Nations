l_english:
 start_game_tt: "[ROOT.GetDebugState]"
 start_game_warning_tt: "§RDo not report bugs! Experimental features are enabled!§!\nBegin your campaign!"
 start_game_no_warning_tt: "Begin your campaign!"

 INTRO_TEXT: "I'd like to take this opportunity to thank MisterJay, Ted52 and the better parts of The Hoi4 Modding Community, without your amazing work and generosity, this mod would have been impossible. I would also like to remind everyone that we are working as hard as we can to expand the game from 1900 to 2060, in other words to make Hoi4 what we all think it should be. This isn't an easy or small task, so we ask you to please be patient with us. If you would like to help the mod, then please join our Discord and check out the How-To-Help Channels.\n\n[ROOT.GetScenarioState]"
 SCENARIO_STATUS_TEXT: "[ROOT.GetScenarioState]"
 scenario_finished: "This scenario is §7Finished!§!"
 scenario_wip: "This scenario is being §YWorked on!§!"
 scenario_unfinished: "This scenario is §RUnfinished!§!"
 scripted_treaties_tt: "Try to keep the deal even if you don't they may not agree to your deal. Click the X when done."
 scripted_peace_deals_tt: "Make sure to keep it checked if you plan on playing a Historical Game. If, on the other hand, you enjoy Sandbox/Ahistorical Gameplay, we recommend to uncheck it .\n\n§RNOTE = This is still a WIP, so do not expect EVERY scripted peacedeal to be fixed. Please leave a comment on the the Bug Reports Channel if you find one that isn't.§!"
 ron_player_led_pc_tt: "This option is to turn off AI from making choices in a peace conference whenever a player is also in it."
 reduce_border_gore_tt: "This option prevents visually displeasing borders from forming during conquests and wars by auto-puppeting every country on capitulation."
 experiments_tt: "If you enable this you can get early access to our new features but be aware of having a lot of unfinished stuff show up like focustree skeletons or missing textures etc."
 unit_limits_tt: "This enabled limit for the amount of divisions relative to the country size."
 manpower_cheats_tt: "This enables manpower decisions (cheats) which will give you manpower for the cost of war support."
 islam_path_tt: "This option enables the Enlightenment (Islam) path in the generic focus tree for non-Muslim, non-Asian and non-African countries."
 mp_sp_button_text: "[GetMultiplayerOn]"
 mp_sp_tt: "Choose if you want extra Multiplayer features (work for Singleplayer too)."
 snap_out_sudamerika_tt: "If you don't plan on playing in South America enable this option to reduce lag."
 no_ai_minors_tt: "Thanks to disabling the AI for minors (countries with less than 10 factories with capital outside of Europe) the game will take less resources and improve it's perfomance (especially late-game lag)."
 realism_mode_tt: "This option gives more realistic but harder to get requirements. This is very useful for Alt-History, if you don't want the AI to go super crazy. \n\n§ROnly available for WW2 Hungary!§!"

