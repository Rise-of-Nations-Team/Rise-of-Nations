 LOG_7_11: "RISE OF NATIONS CHANGELOG (v1.7.11 HOI4 1.19.3 ) ------------------ \n'The Homefront'\n\n§YADDITIONS§!\n§t- Event flavor text has been improved in some cases.§!\n§YBUGFIXES§!\n§t- Naval invasion capacity now gets updated correctly.§!\n§t- The Reich Labor Service Initiative decisions now correctly cover the entirety of Germany.§!\n§t- Some characters with missing or generic portraits will now get their portrait displayed as intended.§!\n§t- Body Armor now gets localized correctly.§!\n§t- The 1900 Shoubak Revolt now correctly spawns in Jordan.§!\n§t- FFixed an oversight where the US national spirit Organized Filipino Militias didn't get removed if the Philippines were granted independence.§!\n§t- Anti-air research correctly increases the level limit on anti-air buildings.\n§YQOL§!\n§t- Focuses that only remove the US national spirit Organized Filipino Militias can now be bypassed if the national spirit has been removed.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_10: "RISE OF NATIONS CHANGELOG (v1.7.10 HOI4 1.19.2 ) ------------------ \n'The Homefront'\n\n§YBUGFIXES§!\n§t- Polizei Bremen no longer spawns in Kuwait in the 1946 and 1949 start dates.§!\n§t- Character names have been fixed.§!\n§t- Cape Verde has its own equipment in the 2000 start date.§!\n§t- Fixed the Bosporus/Dardanelles friendly relations requirements.§!\n\n§YQOL§!\n§t- Improved Zombie and Missle tech descriptions.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_9: "RISE OF NATIONS CHANGELOG (v1.7.9 HOI4 1.19.1 ) ------------------ \n'The Homefront'\n\n§YBUGFIXES§!\n§t- The Polish WW2 focus tree no longer disapears after completing the April Constitution.§!\n§t- Era changes will no longer trigger when selecting a start date that starts on the first day of an era.§!\n§t- Era changes will no longer randomly trigger.§!\n§t- The Austro-Hungarian focus Deutscher Bund is now correctly mutually exclusive with the focuses Austrian Empire and Austria-Hungary.§!\n\n§YQOL§!\n§t- Unplayed countries will no longer be displayed first in the bookmark screen.§!\n§t- Majors will no longer be included in the list of minors on the bookmark screen.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_8: "RISE OF NATIONS CHANGELOG (v1.7.8 HOI4 1.19.1 ) ------------------ \n'The Homefront'\n\n§YADDITIONS§!\n§t- (NCNS) Added some NATO related content.§!\n§YBUGFIXES§!\n§t- The Treaty Organizations decision category now has an icon.§!\n§t- The Invite Foreign Industries decision category now has an icon.§!\n§t- The Border Clashes decision category now has an icon.§!\n§t- Inviting a subject of a type that's not marked as a puppet to your faction no longer invalidates Sunset Invasion.§!\n§t- NATO will now get created correctly in a few cases where it wasn't.§!\n§t- Fixed a bug in the automatic era changing logic which caused it to sometimes not change the era propperly.§!\n§t- The Event for the end of the 4th Carlist war will now fire correctly.§!\n§t- The Boxers rising up a second time should happen less often.§!\n§t- Fixed some typos.\n§YBALANCE§!\n§t- Boxer Protocols: Factory output -500% -> -250%§!\n§t- Boxer Protocols: Dockyard output -500% -> -250%§!\n§t- Outdated Army: Surrender limit 20% -> 0%§!\n§t- Balanced Mandate: Surrender limit 20% -> 0%§!\n§t- Balanced Mandate: Factory output 0% -> 10%§!\n§t- Very Stable Mandate: Surrender limit 40% -> 0%§!\n§t- Very Stable Mandate: Factory output 0% -> 20%§!\n§t- Mandate Secured: Surrender limit 75% -> 10%§!\n§t- Mandate Secured: Factory output 0% -> 25%§!\n§t- Organizer Inspector: Surrender limit 15% -> 7.5%§!\n§t- Militaristic Nationalist: Surrender limit 20% -> 10%§!\n§t- The Southern Tiger: Surrender limit 50% -> 10%§!\n§t- Black Baron: Surrender limit: 20% -> 10%§!\n§t- The Permanent Leader: Surrender limit 20% -> 5%\n§YQOL§!\n§t- Made events from war justifications show up less.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_7: "RISE OF NATIONS CHANGELOG (v1.7.7 HOI4 1.18.3 ) ------------------ \n'The Homefront'\n\n§YBUGFIXES§!\n§t- Fixed a crash when looking at the Spanish focus tree during the WW2 era.§!\n§t- The Bosphorus Straight's rules no longer check for control of a state in Germany.§!\n§t- The Ottoman focus Maintain Centralisation is now possible to start.§!\n§t- The Spanish focus Civil War Measures will now have a focus icon when playing Nationalist or Carlist Spain.§!\n§t- The Spanish focus Focus on Nationalist Spain now has an icon.§!\n§t- The Spanish focus Focus on POUM now has an icon.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_6: "RISE OF NATIONS CHANGELOG (v1.7.6 HOI4 1.18.3 ) ------------------ \n'The Homefront'\n\n§YBUGFIXES§!\n§t- Hovering over the Infiltration Tactics operations subdoctrine no longer crashes the game.§!\n§t- Fixed a crash in 1910 relating to the Italian focus tree.§!\n§t- US Elections will fire propperly again.§!\n§t- Rhineland fully remilitarizes when taking the focus.§!\n§t- The Screens subdoctrine Screen Support Focus no longer requires an invisible special project.§!\n§t- The Sumbarines subdoctrine Long Range Submarines required an invisible special project, but could be selected anyway.§!\n§t- Germany will start with Slovakia and Croatia puppeted correctly when applicable.§!\n§t- The Committee of Uhtua will correctly lead Karelia in the 1919 start date.§!\n§t- The Fusion Engine giving +1000% range now gives the intended +100%.§!\n§t- Generic character with an army chief trait will no longer show up as a high command member, but as a possible army chief.§!\n§t- Removed the duplicate entrenchment generic high command member.§!\n§t- Removed generic high command member that did nothing.§!\n§YREMOVALS§!\n§t- Removed 2 carrier doctrines that did nothing.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_5: "RISE OF NATIONS CHANGELOG (v1.7.5 HOI4 1.18.1 ) ------------------ \n'¡Arriba España!'\n\n§YBUGFIXES§!\n§t- The Gambian coup of 1994 now triggers correctly.§!\n§t- The Viceroyalty puppet type no longer shows up in the autonomy system.§!\n§t- Carlist war now fires correctly once the timer is over.§!\n§t- Alfonso XIII no longer gets attacked every day.§!\n§t- AI will now calculate it's willingness to take certain event options more accurately.§!\n§t- Fixed Portuguese WW2 events being borked.§!\n§t- Internal faction decisions now work properly.§!\n§t- Fixed some typos.§!\n§t- Fixed some missing localisation.§!\n§YBALANCE§!\n§t- Smuggle weapons in the eyes of the Foreigners: Factory output 50000% -> 2500%§!\n§t- Smuggle weapons in the eyes of the Foreigners: AI no longer considers it's stockpiles when deciding on enabling the decision.§!\n§t- Establishing the Government of National Salvation: made event easier to trigger.§!\n§t- Immediate Military Deployment: no longer spawns a navy.§!\n§t- Immediate Military Deployment: spawns fewer infantry divisions.§!\n§t- Realpolitik: Training Time +10% -> 0%§!\n§t- Realpolitik: Justify war goal time +10% -> 0%§!\n§t- Realpolitik: Political advisor cost 0% -> -10%§!\n§t- Realpolitik: Stability 0% -> +2.5%§!\n§t- Weltpolitik: Political power gain -0.2 -> -0.1\n§YQoL§!\n§t- Slightly optimised daily ticks.§!\n§t- Increased number of dynamic tags.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_4: "RISE OF NATIONS CHANGELOG (v1.7.4 HOI4 1.17.4.1 ) ------------------ \n'¡Arriba España!'\n\n§YADDITIONS§!\n§t- (NCNS) Added custom factions for WW1.§!\n§YBUGFIXES§!\n§t- 4th Carlist War no longer starts instantly upon completion of the focus 'Legacy of the Carlist Wars'.§!\n§t- US focus trees have been returned to existence.§!\n§t- Fixed missing localisation in carlist war decisions.§!\n§t- Carlist war decisions disappear correctly now.§!\n§t- Práxedes Mateo-Sagasta will now only die once.§!\n§t- Joint focus 'Expand the Army' for Carlist Spain no longer takes 0 days to complete.§!\n§t- Fixed unlocalised string SPR_central_american_diplomacy_tt in the Central American Diplomacy focus.§!\n§t- The Viceroyalty subject type now works as intended.§!\n§t- The 'Destiny of Canada' event now gets fired correctly by the decision with the same name.§!\n§t- The PRC event 'Long March Begins' fires correctly.§!\n§t- The decisions for Italian minors to gain cores now appear correctly.§!\n§t- Fixed some bugs in M.I.O. visibility.§!\n§t- Commonwealth of Nations formable now gives every core it should.§!\n§t- German political party names should be displayed correctly.§!\n§t- Cuban focus 'Live Germany!' is now correctly exclusive with the focuses it should.§!\n§t- DNC Ottoman Empire focuses that were supposed to give ideas will now do so correctly.§!\n§t- Fixed some focus icons in the Ottoman DNC focus tree.§!\n§t- Fixed a bug where generic decisions didn't appear.§!\n§t- The Vietnamese focus 'Save Asia from Communism' now correctly checks for communists powers in Asia.§!\n§t- Central Powers are now created after the Boxer Rebellion.§!§YREMOVALS§!\n§t- Removed Crisis (again).§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_3: "RISE OF NATIONS CHANGELOG (v1.7.3 HOI4 1.17.4.1 ) ------------------ \n'¡Arriba España!'\n\n§YADDITIONS§!\n§t- Added a focus tree for DNC Spain.\n§!§YBUGFIXES§!\n§t-Fixed Lithuania's borders in 1933 \n- §t1939 start dates.§!\n- §tBase map files are now free of errors.§!\n- §tFixed a typo in a developer's name in the credits.§!\n- §tTimor-Leste should now have it's cores properly applied.§!\n- §tDecisions that were supposed to highlight states will now do so correctly.§!\n- §tOnly the USA can now grant statehood.§!\n- §tEra change will no longer spam events.§!\n- §tFrench politics will update.§!\n- §tWar justifications spawn events again.§!\n- §tNukes now correctly remove civilian factories.§!\n- §tThe CSTO Member idea will now be correctly applied on startup when starting after the year 2000.§!\n- §tEvents for Vichy France will trigger correctly.§!\n- §tSome designer bonuses are now applied correctly.§!\n- §tRussia has cores again.§!\n- §tJapan now correctly peaces out Brazil if the Allies surrender.§!\n- §tEmptied the Reichstag's supply of fire extinguishers for the second time this year.§!\n- §tCold war events for USA's and New Zealand's special forces now correctly spawn a division in their respective capitals.§!\n- §tUS territories and other puppets now appear during country selection.§!\n- §tHawaii no longer ambitious.§!\n- §tRío de la Plata naval exercises will trigger correctly.§!\n- §tSome events in the Zombies mode had their triggers corrected.§!\n- §tCorrected some events regarding Albania not being fired correctly.§!\n- §tThe US focus 'Question of Establishment' now checks for the characters instead of just their name.§!\n- §tThe early tank engine technology is now linked to and displays it's prerequisite technology.§!\n- §tThe Mexican WW2 decision 'Approach Mexican spy cells in the United States' now has it's intended effect.§!\n- §tThe Korean event 'Japan Presents us with an Ultimatum' no longer has 2 options with the same name but different effects.§!\n- §tEvents in the interwar generic tree should now complete the correct focuses.§!\n- §tInterwar air focuses now check for By Blood Alone technologies if the DLC is enabled.§!\n- §tTangier history has been fixed.§!§YQOL§!\n- §tSignificantly optimized era change logic.§!\n- §tA lot of decision checks have been optimized.§!§YREMOVALS§!\n- §tTemporarily removed the Crisis mechanic until the source of the lag can be determined and it can be balanced better.§!\n- §tRemoved War Exhaustion.§!\n- §tRemoved Devastation.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_2: "RISE OF NATIONS CHANGELOG (v1.7.2 HOI4 1.17.4 ) ------------------ \n'Opre Roma!'\n\n§YADDITIONS§!\n- §tAdded significantly more accurate coal distribution.§!\n- §tAdded a decision as a backup for when the era doesn't change correctly. It shows up about 2 weeks into each era if you're still in the previous one.§!\n- §tReadded the map changes from last update.§!\n- §tAdded a temporary solution for naval dominance.§!\n- §tAdded a Roma path for Romania.§!\n- §tTemporarily re-enabled the non-MTG (Man the Guns) naval tech tree.§!§YBUGFIXES§!\n- §tFixed a crash after a few days of playing on the 1946 start date.§!\n- §tFixed a crash when loading in to the 1941 start date.§!\n- §tEras now switch correctly.§!\n- §tCertain buttons in the theater selection menu are now be fully displayed.§!\n- §tOccupation law icons are now be displayed correctly.§!\n- §tThe Hungarian 'Reassert Old Claims' focuses and subsequent events now reference the correct states.§!\n- §tGerman Historical AI now correctly picks Hitler in the 1933 elections.§!\n- §tElections now only fire one event.§!\n- §tControl over the Bosporus is now calculated correctly.§!\n- §tCentrally Planned Economy no longer checks for a Malaysian focus if you're not Malaysia.§!\n- §tWar justifications will no longer spawn an event every day.§!\n- §tRadar special project no longer incorrectly locked behind Götterdämmerung.§!\n- §tAdded effects for some American focuses.§!\n- §tOperation Countenance now works correctly.§!\n- §tKonstantinos Logothetopoulos will be the Greek puppet leader if master is fascist.§!§YQOL§!\n- §tCharacters reworked for the US, Central America and other countries.§!\n- §tSlightly improved the AI.§!§YREMOVALS§!\n- §tRemoved temporary solution for coal.§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_1: "RISE OF NATIONS CHANGELOG (v1.7.1 HOI4 1.17.2 ) ------------------ \n'December Update'\n\n§YADDITIONS§!\n- §tAdded Ukrainian names for Ukrainian states and victory points when under Ukrainian control§!\n\n§YBUGFIXES§!\n- §tA crash caused by a broken OOB after a few years of playing on most start dates has been fixed§!\n- §tGoebbels and Rosenberg no longer available in 1900§!\n- §tFixed some bugs in events§!\n- §tReichstag fire now correctly unlocks the focus when playing on the 1933 start date§!\n- §tFixed some bugs related to formables§!\n- §tEthiopian military focuses no longer require you to own states in New England§!\n- §tSanta Cruz de Tenerife and Klaipeda are now in more correct locations§!\n- §tFixed some states having the wrong names§!\n- §tFixed a few bugs in the Chilean WW2 tree§!\n\n§YQoL§!\n- §tIncreased performance when states change controllers§!\n\n§YGFX§!\n- §tUncompressed a lot of focus icons§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

 LOG_7_0: "RISE OF NATIONS CHANGELOG (v1.7.0 HOI4 1.17.0 ) ------------------ \n'November Update'\n\n §YADDITIONS§!\n- §tAdded Belgian Congo for all scenarios before 1960.§!\n- §tReworked WW2 Polish focus tree§!\n- §tReworked WW2 Nationalist Chinese focus tree§!\n- §tRevamped WW2 Cuban focus tree§!\n- §tAdded WW2 Congolese focus tree§!\n- §tAdded DNC Morocco focus tree§!\n- §tAdded a mini event chain for Rommel's forced suicide§!\n- §tPartially reintegrated Expert AI§!\n- §tAdded Iceland for Interwar/WW2 as Danish subject§!\n- §tAdded Devastation§!\n- §tAdded more game rules and settings§!\n- §tAdded Soviet Defence missions from vanilla§!\n- §tAdded War Exhaustion§!\n- §t2nd Libyan Civil War is more accurate§!\n\n§YBUGFIXES§!\n- §tFixed USA election events§!\n- §tFixed gaps in Interservice Rivalry BOP for WW2 Japan§!\n- §tFixed missing portraits in MD§!\n- §tFixed swapped OOBs for the Congos (1949-2016)§!\n- §tWW2 Yugoslav Pressure events appear correctly§!\n- §tFixed missing capital city for Siberia§!\n- §tFixed the nuke system§!\n- §tFixed the requirements to form Generalgouvernment§!\n- §tMany events will display as they were intended to§!\n- §tGreece will no longer have base game national spirits§!\n- §tEconomic Effect of Versailles is replaced by The Great Depression§!\n- §tFixed some mistakes in start dates§!\n- §tFixed a ton of typos§!\n\n§YQoL§!\n- §tUngern-Sternberg lives up to 1959 if he's not killed and has new cool traits!\n- §tAdded 100 building slots§!\n- §tDrastically reduced lag§!\n- §tSynchronized vanilla traits§!\n- §tPartially synchronized the map§!\n- §tAdded cores for Silesia, Kashubia, Corsica, Balochistan, Nenetsia§!\n\n§YGFX§!\n- §tAdded new generic portraits§!\n- §tAdded a lot of WW1 portraits§!\n- §tImproved focus icons through WW2§!\n- §tChina's blue...§!\n- §tImproved German advisor icons§!\n\n§YREMOVALS§!\n- §tRemoved the economy system§!\n- §tRemoved the dual tree for WW2 Communist China, Brazil§!\n\n\n Stay safe and enjoy your game\n          §LThe RON Team§!"

