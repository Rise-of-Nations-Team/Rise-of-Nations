 RULE_GROUP_DNC_AI_BEHAVIOR: "§YDNC 1900-1910§! AI Behavior"

 ITA_DNC_AI_BEHAVIOR: "Italian AI, the end of the century"
 RULE_OPTION_ITA_DNC_DEFAULT_DESC: "The Italian AI follows the ministry when historical focuses are on, and otherwise draws its road at the start of the game."
 RULE_OPTION_ITA_HISTORICAL: "The ministry"
 RULE_OPTION_ITA_HISTORICAL_DESC: "The Italian AI lets the era run as it did."
 RULE_OPTION_ITA_CROWN: "The King breaks the Chamber"
 RULE_OPTION_ITA_CROWN_DESC: "The Italian AI sends the Chamber home and returns to the Statuto."
 RULE_OPTION_ITA_CONSTITUTIONAL: "The King recalls the Chamber"
 RULE_OPTION_ITA_CONSTITUTIONAL_DESC: "The Italian AI sends the Chamber home and recalls it once the war is won, under a King who reigns and does not govern."
 RULE_OPTION_ITA_COMANDO: "The army will not fire"
 RULE_OPTION_ITA_COMANDO_DESC: "The Italian AI lets the army refuse to fire on the crowd, and the Supreme Command governs."
 RULE_OPTION_ITA_OATH: "The oath to the Statuto"
 RULE_OPTION_ITA_OATH_DESC: "The Italian AI lets the army refuse to fire, seats the Chamber and binds the King by an oath to the Statuto."
 RULE_OPTION_ITA_REPUBLIC: "The leagues govern"
 RULE_OPTION_ITA_REPUBLIC_DESC: "The Italian AI lets the army refuse to fire, seats the Chamber and hands the ministries to the leagues."
 RULE_OPTION_ITA_DNC_RANDOM_DESC: "The Italian AI draws one of the six roads at the start of the game and follows it."
