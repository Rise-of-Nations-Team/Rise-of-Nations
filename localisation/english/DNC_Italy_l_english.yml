 ITA_party_governo_del_re: "Governo del Re"
 ITA_party_governo_del_re_long: "The Government of the King"
 ITA_party_destra_storica: "Destra Storica"
 ITA_party_destra_storica_long: "The Historical Right"
 ITA_party_unione_liberale: "Unione Liberale"
 ITA_party_unione_liberale_long: "The Liberal Union"
 ITA_party_destra_costituzionale: "Destra Costituzionale"
 ITA_party_destra_costituzionale_long: "The Constitutional Right"
 ITA_party_partito_socialista: "Partito Socialista"
 ITA_party_partito_socialista_long: "The Italian Socialist Party"
 ITA_party_comando_supremo: "Comando Supremo"
 ITA_party_comando_supremo_long: "The Supreme Command"
 ITA_the_presidency: "The Presidency"
 ITA_the_presidency_desc: "He is president of the council because he can count a majority in the Chamber. He holds the office for exactly as long as that stays true, and the King signs what the majority sends him."
 ITA_the_presidency_conciliator: "The Presidency: Conciliation"
 ITA_the_presidency_conciliator_desc: "He answers a strike by letting it run itself out, and a deputation by hearing it. The country is quieter for it, and the Left gains a little ground every year."
 ITA_the_presidency_prefects: "The Presidency: The Prefects"
 ITA_the_presidency_prefects_desc: "He governs through the prefects, and the prefects govern through the police. The country will take a war more readily, the King's government gains ground, and the habit of looking to the Chamber is wearing off."
 ITA_the_presidency_prerogative: "The Presidency and the Prerogative"
 ITA_the_presidency_prerogative_desc: "The Crown has taken back the naming of ministers. The president of the council now speaks with the King behind him instead of the Chamber, and the parties have nothing left to bargain over."
 ITA_the_presidency_prerogative_conciliator: "The Prerogative: Conciliation"
 ITA_the_presidency_prerogative_conciliator_desc: "The King names the government, and the country is governed with a light hand. Nobody asks this ministry to prove its majority, and the Left gains ground all the same."
 ITA_the_presidency_prerogative_prefects: "The Prerogative: The Prefects"
 ITA_the_presidency_prerogative_prefects_desc: "The King names the ministry and the ministry names the prefects. Between them there is no room for a motion of confidence, and the country does as it is told."
 ITA_l_loyalty_of_the_army: "Loyalty of the Army"
 ITA_l_loyalty_of_the_army_desc: "The regiments cheered the man who reviewed them, not the ministry that pays them. The army has decided whose it is, and the barracks are quieter for it."
 ITA_l_supreme_command: "Supreme Command"
 ITA_l_supreme_command_desc: "The Statuto, the kingdom's constitution, makes the King first soldier, and now he is one in fact. The staff takes its orders from him, and garrison and province alike are quieter for it."
 ITA_l_the_arbiter: "The Arbiter of the Nation"
 ITA_l_the_arbiter_desc: "The army, the provinces and the new possessions all answer to the King and to nobody in between. He stands above the parties, and every quarrel is carried to his door."
 ITA_h_the_confidence_of_the_crown: "The Confidence of the Crown"
 ITA_h_the_confidence_of_the_crown_desc: "The same ministry has sat through the whole reign and finished what it began. No Italian government has done that before. The Crown has stopped looking for a replacement, and the offices have stopped waiting for one."
 ITA_h_nitti_president: "Nitti at the Council"
 ITA_h_nitti_president_desc: "Francesco Saverio Nitti is the economist who counted what the South was owed, and he now has the council. He has brought his whole programme of works with him, so the mills, the roads and the railways all go up at once."
 ITA_h_stringher_president: "Stringher at the Council"
 ITA_h_stringher_president_desc: "Bonaldo Stringher held the lira steady through the panic, and now he holds the government. He treats the budget as he treated the reserve of the bank, and nothing is spent that has not been provided for."
 ITA_h_luzzatti_president: "Luzzatti at the Council"
 ITA_h_luzzatti_president_desc: "Luigi Luzzatti has the council, and he has kept the Treasury as well. He knows what the country produces better than the men who produce it, and he means to have every ton of it counted."
 ITA_h_giolitti_president_files: "Giolitti at the Council: The Files"
 ITA_h_giolitti_president_files_desc: "Giovanni Giolitti came to the council from the Interior, and he brought the files with him. He knows who is paid by whom, at home and abroad, and foreign agents find the ground very hard here."
 ITA_h_giolitti_president_guards: "Giolitti at the Council: The Guards"
 ITA_h_giolitti_president_guards_desc: "Giovanni Giolitti came to the council from the Interior, and he brought the public security guards with him. Where we hold unwilling ground, fewer of our garrison come to harm."
 ITA_h_orlando_president: "Orlando at the Council"
 ITA_h_orlando_president_desc: "Orlando, the professor of public law, has the council. The schools he built are turning out a generation that believes in the state and will take a war if one is asked for."
 ITA_h_sacchi_president: "Sacchi at the Council"
 ITA_h_sacchi_president_desc: "Ettore Sacchi is in office, and the Extreme Left is in the majority for the first time since the Risorgimento. Governments abroad that think as we do have noticed, and their opinion of us climbs much faster."
 ITA_h_salandra_president: "Salandra at the Council"
 ITA_h_salandra_president_desc: "Antonio Salandra has the council, and the whole conservative bench has come with him. Able men are suddenly willing to serve, and they ask a good deal less to do it."
 ITA_anna_kuliscioff: "Anna Kuliscioff"
 ITA_anna_kuliscioff_desc: "The doctor of the poor quarters who will not let the party forget the women in the factories. Give her the law on the hours of women and children and she will bring the leagues in behind it."
 ITA_nullo_baldini: "Nullo Baldini"
 ITA_nullo_baldini_desc: "He put the day labourers of the Romagna into a cooperative and made it pay, then did it again across the plain. Hand him the leases and the drainage and he will find the men to work them."
 ITA_giuseppe_ottolenghi: "Giuseppe Ottolenghi"
 ITA_giuseppe_ottolenghi_desc: "The first Jew to sit as minister of war, and the man who made the army manoeuvre against itself instead of parading. His staff is allowed to lose, and it learns from losing."
 ITA_dnc_the_prefects: "The Machine of the Prefects"
 ITA_dnc_the_prefects_desc: "A prefect is the Kingdom in his province, and he answers to the Interior and to nobody else. What we ask of him is paid for in political power, and the squares hear of it the same week."
 ITA_dnc_the_chamber: "The Majority in the Chamber"
 ITA_dnc_the_chamber_desc: "A majority in the Chamber is not won once. It has to be kept every month. These are the instruments a ministry keeps it with, and each of them leaves a debt behind."
 ITA_dnc_the_crown: "The Favour of the Crown"
 ITA_dnc_the_crown_desc: "The King reigns, and the Statuto, the kingdom's constitution, lets him govern whenever a ministry lets him. Every courtesy we pay him raises the Crown a little, and every answer we refuse lowers it."
 ITA_h_colonial_levies: "The Colonial Levies"
 ITA_h_colonial_levies_desc: "The Colonial Office holds that it alone may enrol the ascari, our colonial troops. The War Office will not have a second army outside its command, and the foreign ministry objects for reasons of its own. Every levy angers whichever of the two did not sign the order, and when one of them has had enough it will come to us."
 ITA_h_governorate_eritrea: "The Governorate of Eritrea"
 ITA_h_governorate_eritrea_desc: "The oldest of our possessions has a civil governor and a budget of its own. Whatever we do here goes on the colonial account that every governorate shares, and that account has a ceiling."
 ITA_h_governorate_somalia: "The Governorate of Somalia"
 ITA_h_governorate_somalia_desc: "The southern coast is administered from a handful of ports and a great deal of paper. Whatever we do here goes on the colonial account that every governorate shares, and that account has a ceiling."
 ITA_h_governorate_benadir: "The Governorate of the Benadir"
 ITA_h_governorate_benadir_desc: "The company is bought out, and the coast is governed by the Kingdom now instead of by a charter. Whatever we do here goes on the colonial account that every governorate shares, and that account has a ceiling."
 ITA_h_governorate_tripolitania: "The Governorate of Tripolitania"
 ITA_h_governorate_tripolitania_desc: "Tripolitania is administered from the coast, and the interior is administered by agreement. Whatever we do here goes on the colonial account that every governorate shares, and that account has a ceiling."
 ITA_h_governorate_aegean: "The Governorate of the Aegean"
 ITA_h_governorate_aegean_desc: "The islands are held as a pledge and governed as a province, and nobody at the foreign ministry wishes to resolve the contradiction. Whatever we do here goes on the colonial account that every governorate shares, and that account has a ceiling."
 ITA_h_governorate_east_africa: "The Governorate of East Africa"
 ITA_h_governorate_east_africa_desc: "The sphere we agreed at the conference table has to be turned into an administration on the ground. Whatever we do here goes on the colonial account that every governorate shares, and that account has a ceiling."
 ITA_l_the_plate: "The Italians of the River Plate"
 ITA_h_levy_raised_tt: "The levy is enrolled, and the anger of the War Office, or of the foreign ministry, rises by 1."
 ITA_h_the_consulate_works_on: "The Consulate Is Set to Work"
 ITA_h_the_consulate_works_on_desc: "Our consulate there is given money for schools, for a chamber of commerce and for the local newspapers. In two years that government will be in the habit of asking us first."
 ITA_h_the_consulate_opens_tt: "The work begins, and we already think better of them."
 ITA_h_the_consulate_reports_tt: "They think better of us, and their government begins to look to us first."
 ITA_o_the_iberian_union: "The Iberian Union"
 ITA_o_the_iberian_union_desc: "Spain and Portugal are one peninsula under two crowns. We have said in public what we think of that, and the decision is theirs to take."
 ITA_arm_the_plan_of_the_north_east: "The North-Eastern Plan"
 ITA_arm_the_plan_of_the_north_east_desc: "Saletta's staff has drawn a concentration of four armies between the Isonzo and the Cadore. It faces the ally we are still bound to by treaty. We file it as the working plan, and the west can wait."
 ITA_dec_the_plan_of_the_north_east_tt: "Files the north-eastern plan and withdraws the western one. The staff keeps §G+10%§! planning speed and §G+10%§! maximum planning."
 ITA_arm_the_plan_of_the_west: "The Western Plan"
 ITA_arm_the_plan_of_the_west_desc: "The other plan faces the Alps of Savoy and the coast road to Nice. The Triple Alliance was signed to make France the likely enemy. We file it as the working plan, and the north-east can wait."
 ITA_dec_the_plan_of_the_west_tt: "Files the western plan and withdraws the north-eastern one. The staff keeps §G+10%§! planning speed and §G+10%§! maximum planning."
 ITA_o_form_the_iberian_union: "Form the Iberian Union"
 ITA_o_form_the_iberian_union_desc: "Rome has said in public what federalists on both sides of the Guadiana have said in private for 50 years. The peninsula is one country with two courts. We put the question to the other crown, and it will be answered there."
 ITA_dec_form_the_iberian_union_tt: "Puts the question to the other Iberian crown. Acceptance makes one state of the peninsula and Rome will offer it a place in the league, while refusal closes the matter for good."
 ITA_u_proclaim_the_albanian_principality: "Proclaim the Albanian Principality"
 ITA_u_proclaim_the_albanian_principality_desc: "The committee has its map, the clans have their subsidies, and the shore is in our hands. We proclaim the principality, and put a prince of Savoy at the head of it."
 ITA_dec_proclaim_the_albanian_principality_tt: "Albania takes every Albanian core we hold that is not also ours, and becomes our puppet. Costs §R50§! political power."
 ITA_u_proclaim_the_kingdom_of_croatia: "Proclaim the Kingdom of Croatia"
 ITA_u_proclaim_the_kingdom_of_croatia_desc: "Agram is ours, and the diet that sits there has been asking for a crown of its own for a century.\n\nWe shall proclaim the kingdom and hand it the Croatian ground we hold, keeping Fiume. It will be a kingdom under our protection, and it will answer to us."
 ITA_dec_proclaim_the_kingdom_of_croatia_tt: "Croatia is set up as our puppet and takes every Croatian state we hold. Costs §R50§! political power."
 ITA_u_proclaim_the_slovene_state: "Proclaim the Slovene State"
 ITA_u_proclaim_the_slovene_state_desc: "Laibach is in our hands and the assembly has voted its address to us. The cores are drawn and the ground is held.\n\nWe shall proclaim the state, hand it the Slovene provinces we hold, and keep it as our client. Vienna would then reach the sea only through a country that owes us everything."
 ITA_dec_proclaim_the_slovene_state_tt: "Slovenia is set up as our puppet and takes every Slovene state we hold. Costs §R50§! political power."
 ITA_u_raise_the_hungarian_kingdom: "Raise the Hungarian Kingdom"
 ITA_u_raise_the_hungarian_kingdom_desc: "Buda is ours and the diet has sworn to the new crown. The Hungarian states we hold are ready to be handed over.\n\nWe shall raise the kingdom of Saint Stephen and keep it as our client. Vienna would be left to govern the rest of the Monarchy."
 ITA_dec_raise_the_hungarian_kingdom_tt: "Hungary is set up as our puppet and takes every Hungarian state we hold. Costs §R50§! political power."
 ITA_arm_the_column_is_ready: "The Column Is Ready"
 ITA_arm_the_column_is_ready_desc: "The African command has its own plan, its own wells and its own transport tables."
 ITA_arm_the_plan_is_filed: "The Plan Is Filed"
 ITA_arm_the_plan_is_filed_desc: "One plan of concentration lies on the table at the Supreme Command, and the staff works to it instead of arguing about it."
 ITA_n_the_auxiliary_squadron: "The Auxiliary Squadron"
 ITA_n_the_auxiliary_squadron_desc: "The mail steamers we subsidise are built with gun mountings already in them. The guns themselves wait in store ashore until we need them."
 ITA_e_the_white_coal: "The White Coal"
 ITA_e_the_white_coal_desc: "Electric current comes down from the mountain works. The province burns far less imported coal, and building here goes faster."
 ITA_o_the_league_is_kept: "The League Is Kept"
 ITA_o_the_league_is_kept_desc: "The smaller courts trade under one tariff with us and sit at our conference table. They take our subsidy and have stopped looking for another patron."
 ITADNC_arm_the_army_after_adwa: "The Army After Adwa"
 ITADNC_arm_the_army_after_adwa_desc: "The enquiry into Adwa has reported, the war estimates have collapsed, and our chief of staff has nothing to spend. We must rebuild the army from the ground up, starting by saying plainly what the enquiry found."
 ITADNC_arm_the_alpine_frontier: "The Alpine Frontier"
 ITADNC_arm_the_alpine_frontier_desc: "The forts that should close our Alpine passes have never had the money to be finished. We will survey the passes sector by sector and build where the ground demands it, not where the ministry would like."
 ITADNC_arm_the_barriers_of_the_cadore: "The Cadore Barriers"
 ITADNC_arm_the_barriers_of_the_cadore_desc: "The Cadore is the shortest road from Austria down to the Venetian plain, and a few companies and a customs post hold it. We will build the barriers our engineers have already surveyed, in both valleys."
 ITADNC_arm_the_line_of_the_tagliamento: "The River Line"
 ITADNC_arm_the_line_of_the_tagliamento_desc: "An Austrian army could come down the Valsugana to Bassano within the week, and east of the Piave only the river can be held. We will shut the valley first, then fortify the crossings of the Tagliamento."
 ITADNC_arm_the_great_manoeuvres: "The Great Manoeuvres"
 ITADNC_arm_the_great_manoeuvres_desc: "The minister of war wants two armies put in the field against each other, with schools of fire and promotion by merit instead of seniority. We must give him his manoeuvre season now, before the estimates take it back."
 ITADNC_arm_the_war_hypotheses: "The War Hypotheses"
 ITADNC_arm_the_war_hypotheses_desc: "Our Supreme Command must draw its war plans: one against Austria, our ally by treaty, and one against France, the neighbour we quarrel with. We will have both written and let the planners say which they prefer."
 ITADNC_arm_the_truppe_celeri: "The Fast Troops"
 ITADNC_arm_the_truppe_celeri_desc: "Our cavalry, cyclist bersaglieri and horse artillery are scattered among the divisions and cannot move fast where they stand. We will gather them into fast troops of their own."
 ITADNC_arm_the_school_of_musketry: "The School of Fire"
 ITADNC_arm_the_school_of_musketry_desc: "Our infantry is issued a rifle and taught to carry it rather than to shoot it. The school of fire the army was promised has never been paid for. We shall open it, and have every regiment send its instructors through."
 ITADNC_arm_the_motor_service: "The Motor Service"
 ITADNC_arm_the_motor_service_desc: "The Engineers have bought their first lorries out of the ordinary budget, and the service has no place in the army list. We will give it men, money and workshops before the horse contractors talk us out of it."
 ITADNC_arm_the_workshops_of_reconstruction: "The Repair Workshops"
 ITADNC_arm_the_workshops_of_reconstruction_desc: "The workshops at Turin and Naples are choked with material sent home from Africa. Half of it can be made fit for service again. We shall put them on war hours and take back what the campaign left us."
 ITADNC_arm_the_war_school_at_turin: "The War School at Turin"
 ITADNC_arm_the_war_school_at_turin_desc: "The War School at Turin quarrels with the ministry every year over who sets its courses and passes its students. We will settle it in the school's favour, and let its teachers shape the next general staff."
 ITADNC_arm_the_heavy_field_artillery: "The Heavy Field Artillery"
 ITADNC_arm_the_heavy_field_artillery_desc: "The artillery trials are over. A heavy howitzer and a long gun of heavy calibre have both come through them. We shall order both into service, and give the army a piece that can reach behind a fortified line."
 ITADNC_arm_the_quick_firing_gun: "The Quick-Firing Gun"
 ITADNC_arm_the_quick_firing_gun_desc: "The recoil system we need is held under a foreign licence, and that licence is for sale. We will buy it and give our field and mountain batteries a gun that need not be re-aimed after every shot."
 ITADNC_arm_the_army_corps_commands: "The Army Corps Commands"
 ITADNC_arm_the_army_corps_commands_desc: "The corps commands were shuffled after the defeat, and the generals left in them are of very uneven quality. We shall promote the two best over the heads of the seniority list. The corps would then be commanded rather than administered."
 ITADNC_arm_the_range_at_nettuno: "The Firing Range"
 ITADNC_arm_the_range_at_nettuno_desc: "Every gun the works deliver is taken to one stretch of coast at Nettuno, fired, measured and passed before it goes to a battery. We must enlarge the range, so that nothing reaches the field untested."
 ITADNC_arm_the_eyes_of_the_army: "Spotting for the Guns"
 ITADNC_arm_the_eyes_of_the_army_desc: "The balloon section can hold a captive balloon above a battery and correct its fire from the basket. We shall attach the section to the artillery. The guns would then see what they are shooting at, instead of firing on a map reference."
 ITADNC_arm_the_bersaglieri_cyclists: "The Cyclist Battalions"
 ITADNC_arm_the_bersaglieri_cyclists_desc: "Companies of bersaglieri, our light infantry, have been put on bicycles. On a road they cover ground no marching company can match. We must raise them properly, with men and money of their own, and use them where the roads allow it."
 ITADNC_arm_the_africa_command: "The Africa Command"
 ITADNC_arm_the_africa_command_desc: "Our troops in Africa are run from Rome by men who have never seen the country they write orders for. We shall set up a command in Africa with the colonial corps under it, and let it answer for its own garrisons."
 ITADNC_arm_the_machine_gun_sections: "The Machine Gun Sections"
 ITADNC_arm_the_machine_gun_sections_desc: "The Council must choose between a foreign machine gun and our own design, and argues over how many each regiment needs. We will settle it, order both, and give every line regiment its section."
 ITADNC_arm_the_alpini: "The Alpini"
 ITADNC_arm_the_alpini_desc: "The Alpini, our mountain troops, are raised in the valleys they are meant to hold, and their guns go up on mules. We shall give them men, money and a school of their own, and hold the frontier with troops who live on it."
 ITADNC_arm_the_works_at_sampierdarena: "The Genoa Works"
 ITADNC_arm_the_works_at_sampierdarena_desc: "Only one works on the Ligurian shore can bore and line a heavy gun barrel. Every other order goes abroad. We must enlarge the Ansaldo yard at Sampierdarena, and stop paying foreigners for work our own hands can finish."
 ITADNC_arm_the_supply_columns: "The Supply Columns"
 ITADNC_arm_the_supply_columns_desc: "Our mule columns and supply corps have come home from Africa knowing what a campaign really costs. We will rebuild both on that experience and stop feeding our army by improvisation."
 ITADNC_arm_the_defence_of_the_kingdom: "The Defence of the Kingdom"
 ITADNC_arm_the_defence_of_the_kingdom_desc: "The defence of the Kingdom has to hold two frontiers at once, and it has never been written out as one plan. We must write it and fortify to it. The works would then follow the plan, and not the province that asks loudest."
 ITADNC_arm_the_military_railways: "The Military Railways"
 ITADNC_arm_the_military_railways_desc: "Mobilisation is a railway problem before it is a military one. The lines are being bought back into the hands of the State. We shall build the military branches and the loading platforms while the question is still open."
 ITADNC_arm_the_field_wireless: "The Field Wireless"
 ITADNC_arm_the_field_wireless_desc: "The trials have carried a signal from a field station to a headquarters with no wire between them. We must equip the army with the sets. An order would then reach a corps faster than a mounted man can carry it."
 ITA_arm_the_new_army_tt: "§YThe Army of the Kingdom§! is opened. Every reform in this branch adds to it, and the modifier shows what the army has become."
 ITA_arm_the_alpine_works_tt: "§YThe alpine frontier is surveyed§! and the forts are sited. The barriers are built one sector at a time, starting with the Cadore and the Tagliamento."
 ITA_arm_the_plans_office_tt: "§YThe plans of the Supreme Command§! are opened. We may file a working plan for the north-east or for the west, and switch between them."
 ITA_arm_the_fucile_tt: "The depots are issued the Fucile mod. 91, our new service rifle."
 ITA_arm_the_motor_section_tt: "The motor section of the Engineers becomes a standing unit and takes its first lorries."
 ITA_arm_the_heavy_pieces_tt: "The Obice da 149/12 and the Cannone da 149/35 A pass out of the experimental commissions and into the batteries."
 ITA_arm_the_deport_gun_tt: "The Deport licence is taken, and the Cannone da 75/27 mod. 906 and the Cannone da 65/17 go to the field and mountain batteries."
 ITA_arm_the_marshals_tt: "Two corps commanders are promoted over the heads of the seniority list."
 ITA_arm_the_range_tt: "The proving range receives, fires and measures every piece before it is passed to a battery."
 ITA_arm_the_cyclists_tt: "The cyclist companies of the bersaglieri are raised as units of their own."
 ITA_arm_the_colonial_troops_tt: "A command for the troops in Africa is set up, with the colonial corps under its orders."
 ITA_arm_the_machine_guns_tt: "The Mitragliatrice Maxim mod. 906 and the Mitragliatrice Perino are both ordered, and a section goes to every regiment of the line."
 ITA_arm_the_works_tt: "The Ansaldo works at Sampierdarena take the boring and lining of heavy gun barrels."
 ITA_arm_the_military_railways_tt: "The military branches and the loading platforms are laid on the lines the State has bought back."
 ITA_arm_available_chief_of_army_tt: "§YThe following Chief of the Army Staff is now available:§!"
