 ITA_n_the_war_on_trade_lock_tt: "The line of battle has not yet been laid down, or the fleet of battle is already built"
 ITA_e_the_kingdom_in_arms_desc: "The estimates are voted as a single sum and the works run day and night. Nothing that can be made in the kingdom is bought abroad."
 ITA_e_the_unified_types_desc: "One pattern of rifle, one gauge of shell, one drawing for every yard. What one workshop makes, another can finish."

 ITA_u_the_understanding_with_london: "The Understanding with London"
 ITA_u_the_anglo_italian_defence_pact: "The Anglo-Italian Defence Pact"
 ITA_o_the_beira_is_not_theirs_tt: "Lisbon no longer holds the mining district of the Beira, and there is no wolfram there for us to be given."
 ITA_n_a_shore_across_the_adriatic_tt: "We hold a shore on the far side of the Adriatic"
 ITA_h_nitti_minister_of_industry_and_labour_desc: "The new ministry sits between the works and the men who run them, and the Minister means to be at every table where a plant is sited or a wage is settled."
 ITA_h_stringher_plenipotentiary_of_credit_desc: "The Bank now speaks for the Treasury when the great houses ask for money, and it lends where the arms trade needs lending."
 ITA_h_luzzatti_plenipotentiary_of_the_treasury_desc: "The last word over the estimates is held by one man, and the departments bring their demands to him before they bring them to the Chamber."
 ITA_h_giolitti_the_interior_reorganised_desc: "The Interior is put back in order from the top: one register, one chain of orders, and prefects who answer for their provinces."
 ITA_h_giolitti_master_of_the_prefects_desc: "Every prefect owes his place to the Minister, and the whole administration of the provinces moves when he moves."
 ITA_h_orlando_makes_italians_desc: "The schools of the Kingdom teach one language and one history, and the recruits who come up from them understand their officers."
 ITA_h_sacchi_the_leagues_in_the_majority_desc: "The leagues sit with the government instead of against it, and the strikes that would have been fought are now negotiated."
 ITA_h_sacchi_first_among_equals_desc: "The Radicals hold the balance of the Chamber, and nothing passes that their leader has not first agreed to."
 ITA_h_salandra_the_prefects_deliver_desc: "The prefects are told what majority is wanted and they return it, and the constituencies of the South answer to the ministry."
 ITA_h_salandra_the_grey_eminence_desc: "He holds no great office and settles every question before it reaches one, and the Right governs through him whoever presides."
 ITA_h_treasury_initiative_modifier_desc: "The plenipotentiary carries his own estimate into the Council, and the departments learn to ask him first."
 ITA_h_the_experimental_works_desc: "The State keeps its own workshops for what the trade will not build, and what is proved there passes to the arsenals."
 ITA_h_the_interior_commands_desc: "The police, the register and the prefects answer to one desk, and the Interior is the strongest ministry in the Kingdom."
 ITA_h_the_school_makes_italians_desc: "The classroom is the first barracks: the children of the villages learn the language of the State before they are called to serve it."
 ITA_h_the_school_makes_italians_plain_desc: "The schools are opened where they were wanted and the masters are paid, and that is the whole of the law."
 ITA_h_the_army_keeps_the_streets_tt: "The squadrons are quartered in the cities and the army keeps the streets: order is held, and the cost is paid in stability and in political power for as long as it lasts."
 ITA_h_gov_workshops_account_only_tt: "The colonial account adds 0.005 to the building speed of arms factories."
 ITA_operative_emilio_rossi: "Emilio Rossi"
 ITA_l_the_act_of_algeciras_desc: "We sat at the table with the powers and came away with a mandate over the police of the Moroccan ports. It is a small thing on paper and a seat among the great on the map."
 ITA_l_antivari_agreement_desc: "The court at Cetinje has let us into its one harbour, and the works there are ours to build. The Adriatic is a little less Austrian for it."
 ITA_l_naval_operation_idea_desc: "The staff has drawn the western basin on one chart: the coaling stops, the landing beaches and the hours between them. The fleet moves faster for having read it."
 ITA_l_alpine_operation_ns_desc: "The passes, the depots and the garrisons of the northern frontier are worked out to the day. Our columns will not be the ones improvising."
 ITA_l_leash_cut_ns_desc: "The fleet is no longer tied to the shore it was built to defend. What the admirals plan now begins beyond the straits."
 ITA_o_threat_vienna_confirms: "Vienna Was Asked to Confirm the Italian Crown"
 ITA_u_army_mobilization_tt: "Mobilisation speed of the Royal Army: §Y[?ITA_u_army_mobilization|%1]§!"
 ITA_u_grande_the_grant_lapses_tt: "The court cannot deliver what it does not hold, and the grant lapses with the deed unsigned."
 u_the_second_naval_race: "The Second Naval Race"
 ITA_u_grande_the_ally_is_not_quarrelled_with_tt: "We share a faction with London, and the division of the concessions is settled at the table instead of at sea."
 ITA_u_grande_the_colonial_account_tt: "One command answers for both seas, and the colonial account is opened: what the residencies spend from here is read against it."
 ITA_u_tt_the_refusal_is_a_casus_belli: "Every court that refuses gives us a claim to free the nations it governs."
 ita_dnc.2910.t: "The Constructors at Brescia"
 ita_dnc.2910.d: "The circuit is flown and the ministry has the reports. Four houses want the order: the sheds at Vizzola Ticino, the Transaerea and its licences, the French firms who will sell us their drawings, and the motor trade of Turin, which has never built an aeroplane and can build anything. Whom do we pay?"
 ita_dnc.2910.a: "The sheds at Vizzola Ticino"
 ita_dnc.2910.b: "The Transaerea shall have the order"
 ita_dnc.2910.c: "Buy the French drawings"
 ita_dnc.2910.f: "Let Turin build them"
 ita_dnc.2910.e: "No house is chosen, and the reports go to the schools"
 ITA_air_the_house_of_vizzola: "The Sheds at Vizzola Ticino"
 ITA_air_the_house_of_vizzola_desc: "The first aeroplanes built in the Kingdom come out of the sheds on the Ticino, and the men who build them are ours."
 ITA_air_the_transaerea: "The Societa Italiana Transaerea"
 ITA_air_the_transaerea_desc: "The company holds the licences and the hangars, and it will fly what the ministry asks for as far as the ministry asks."
 ITA_air_the_french_licences: "The French Licences"
 ITA_air_the_french_licences_desc: "We buy the drawings instead of making them, and our pilots fly a proven machine a year before we could have built one."
 ITA_air_the_turin_motor_trade: "The Motor Trade of Turin"
 ITA_air_the_turin_motor_trade_desc: "The men who build motor cars are told to build aero engines, and the shops of Turin turn to it as though they had always done so."
 ITA_o_the_exceptional_laws: "The Exceptional Laws"
 ITA_o_the_exceptional_laws_desc: "The associations are dissolved, the presses licensed and the leaders put over the frontier. What is left of the extreme meets in other countries, and the prefects sleep."
 ITA_tt_arm_army_keeps_the_streets: "§RThe army holds the streets§!: stability and political power suffer, the Left gains ground, and colonial levies now anger the Consulta."
 ITA_tt_arm_supply_up: "§RThe army's supply consumption rises§!, and the establishments wait on the estimates."
 ITA_tt_camera_low_months_set_0: "§GThe count of months the Chamber has sat without a majority starts again at nothing.§!"
 ITA_tt_ch_fortis: "§YAlessandro Fortis enters the King's service, once and once only.§!"
 ITA_tt_ch_monza_survived: "§YThe King survives Monza, and the reign goes on as before.§!"
 ITA_tt_ch_tripoli_promised: "§YThe African shore is written into the programme.§!"
 ITA_tt_crown_down_l: "The Crown §Yloosens its grip§! sharply."
 ITA_tt_crown_down_m: "The Crown §Yloosens its grip§!."
 ITA_tt_crown_set_30: "The Crown §Yfalls back to a King who listens§!."
 ITA_tt_crown_up_l: "The Crown §Ytightens its grip§! sharply."
 ITA_tt_crown_up_m: "The Crown §Ytightens its grip§!."
 ITA_tt_dnc_the_path_is_nazionale: "§YThe kingdom takes the Nation's path§!: the other paths are cleared, and the Nation's decisions open."
 ITA_tt_end_route: "§YThe systems of the decade close where they stand§!; the Last Question follows within days, unless the era has already ended."
 ITA_tt_end_the_verdict_is_refused: "§RA ministry of transition takes the chair for a year§!, Luzzatti's caretakers under the Chamber, and the decade ends without its verdict."
 ITA_tt_g_boards: "§GThe Boards of Conciliation sit without charge, and the Piazza cools faster every month.§!"
 ITA_tt_g_bosnia_snub: "§YRome's refusal is on record§!: Petersburg is the likelier to offer Racconigi, and §RVienna the likelier to refuse Tripoli§!."
 ITA_tt_g_sounded_auh: "§YVienna is sounded about Tripoli and cannot be asked twice§!; its answer comes within the week."
 ITA_tt_g_sounded_eng: "§YLondon is sounded about Tripoli and cannot be asked twice§!; its answer comes within the week."
 ITA_tt_g_sounded_fra: "§YParis is sounded about Tripoli and cannot be asked twice§!; its answer comes within the week."
 ITA_tt_g_sounded_ger: "§YBerlin is sounded about Tripoli and cannot be asked twice§!; its answer comes within the week."
 ITA_tt_g_sounded_rus: "§YPetersburg is sounded about Tripoli and cannot be asked twice§!; its answer comes within the week."
 ITA_tt_g_trieste_faculty: "§YThe Italian faculty at Trieste is conceded§!, and the University Fund has nothing left to ask for."
 ITA_tt_h_council_cd_flag_cleared: "§GThe King's season of waiting is cut short: another name may be put to him at once.§!"
 ITA_tt_h_council_event_pending_flag_cleared: "§YThe council's pending business is discharged, and the ministers' focuses may be taken again.§!"
 ITA_tt_h_rising_minister_set_0: "§YNo name is left rising; the council's next name must be put forward afresh.§!"
 ITA_tt_h_the_guards_of_public_safety_in_progress_flag: "§YGiolitti takes up the Guards of Public Safety§!: the focus is barred while he works, and he closes the file within the half-year."
 ITA_tt_h_the_political_police_in_progress_flag: "§YGiolitti takes up the Political Police§!: the focus is barred while he works, and he closes the file within the half-year."
 ITA_tt_h_withdraw_the_name: "§YThe focus that named him is undone and its political power refunded§!; he may be named again another day."
 ITA_tt_ita_dnc_1609_b: "If Vienna still stands, the Lega's closing is left to Vienna to answer; if it does not, the Piazza §Rheats§!."
 ITA_tt_ita_dnc_2130_a: "§YRome invokes the seventh article.§! Unless the path is Giolitti's or the Nation's, Vienna is asked within days to name the compensation."
 ITA_tt_ita_dnc_2168_a: "§YNathan's council sits at the Capitol.§! On the Church's path the Bloc takes to the street and the Twentieth of September follows; on Giolitti's, Nathan enters the King's service."
 ITA_tt_ita_dnc_701_b: "If the Piazza is calm the Chamber's majority §Ggrows§!; if it is not, it §Rthins§!."
 ITA_tt_ita_dnc_702_b: "With the Catholic vote or the Gentiloni understanding the Chamber's majority §Ggrows§! sharply; without them it §Ggrows§! a little."
 ITA_tt_k_vatican_offended: "§RThe Vatican takes offence: the intermediary cannot be sent again, and reading the Law of Guarantees again opens no talks.§!"
 ITA_tt_l_the_provinces_are_ceded: "§RThe Trentino, South Tyrol, Trieste, Istria, Rijeka and Zara pass to Italy§!, and the Italians of the Monarchy are the more content for it."
 ITA_tt_majority_bought_up_l: "The bought majority §Rswells§! sharply: at the next poll those votes count for half, and under a widened franchise they count against us."
 ITA_tt_majority_down_l: "The Chamber's majority §Rthins§! sharply."
 ITA_tt_majority_down_m: "The Chamber's majority §Rthins§!."
 ITA_tt_majority_down_s: "The Chamber's majority §Rthins§! a little."
 ITA_tt_majority_set_45: "The Chamber's majority is §Rreset to a thin margin, short of what a ministry needs§!."
 ITA_tt_majority_set_50: "The Chamber's majority is §Yreset to an even House, neither made nor lost§!."
 ITA_tt_majority_up_m: "The Chamber's majority §Ggrows§!."
 ITA_tt_majority_up_s: "The Chamber's majority §Ggrows§! a little."
 ITA_tt_o_vienna_asked_berlin: "§YBerlin is asked to judge the recognition before Vienna answers§!, and the question cannot be put off a second time."
 ITA_tt_piazza_down_l: "The Piazza §Gcools§! sharply."
 ITA_tt_piazza_down_m: "The Piazza §Gcools§!."
 ITA_tt_piazza_down_s: "The Piazza §Gcools§! a little."
 ITA_tt_piazza_floor_up_m: "The floor under the Piazza §Rrises§!: the squares never settle as low again."
 ITA_tt_piazza_floor_up_s: "The floor under the Piazza §Rrises§! a little: the squares never settle quite as low again."
 ITA_tt_piazza_up_l: "The Piazza §Rheats§! sharply."
 ITA_tt_piazza_up_m: "The Piazza §Rheats§!."
 ITA_tt_piazza_up_s: "The Piazza §Rheats§! a little."
 ITA_tt_pledges_up: "§RMore promises are entered against the ministry§!, each called in a year apart at the majority's cost unless the South's special laws pay it."
 ITA_tt_r_garibaldian_legion_to_the_rebels: "§YThree Garibaldian legions cross the frontier to the rebel republic.§!"
 ITA_tt_r_irredenta_renounced: "§YRome's renunciation of the unredeemed provinces is on record in Vienna.§!"
 ITA_tt_s_berlin_in_the_protocol: "§GBerlin's name goes on the police protocol and Petersburg is asked again§!, the likelier now to sign it."
 ITA_tt_s_crown_stands: "§YThe Crown stands by its decree§!, and Berlin is the likelier to sign the police protocol when it is asked."
 ITA_tt_t_the_prefect_was_sustained: "§YThe prefect of Genoa is sustained, and the chamber of labour stays closed.§!"
 ITA_tt_vienna_trust_down_l: "Vienna's confidence in Rome §Rfalls§! sharply."
 ITA_tt_vienna_trust_down_m: "Vienna's confidence in Rome §Rfalls§!."
 ITA_tt_vienna_trust_down_s: "Vienna's confidence in Rome §Rfalls§! a little."
 ITA_tt_vienna_trust_set_0: "Vienna's confidence in Rome §Rfalls to nothing§!."
 ITA_tt_vienna_trust_up_l: "Vienna's confidence in Rome §Grises§! sharply."
 ITA_tt_vienna_trust_up_m: "Vienna's confidence in Rome §Grises§!."
 ITA_tt_vienna_trust_up_s: "Vienna's confidence in Rome §Grises§! a little."
 ITA_tt_w_powers_consent_down: "§RThe count of the Powers' consent to Tripoli falls§!, and the Porte reads it before it answers Rome."
 ITA_tt_w_powers_consent_up: "§GOne more Power consents to Tripoli§!, and the Porte reads the count before it answers Rome."
 ITA_tt_w_racconigi: "§YThe Bargain at Racconigi opens to Rome§!, the Irredenta decisions with it on Giolitti's path, and the chronicle offers no second bargain."
 ITA_tt_w_racconigi_is_read_in_vienna: "§YVienna has read Racconigi and protested to Rome.§!"
 ITA_tt_w_sandjak_only: "§YRome takes the sandjak and asks no more§!: Vienna is the likelier to consent to Tripoli, and Petersburg to offer Racconigi."
 ITA_tt_w_the_denial: "§YRome denies the second book before the world.§!"
 ITA_tt_w_trentino_bought_with_neutrality: "§YThe Trentino is bought with Italy's neutrality, and the bargain is on record.§!"
 ITA_tt_w_valona_claimed: "§YThe claim on Valona opens the Adriatic decisions.§!"
 ITA_tt_w_we_mean_the_convention: "§YRome means the military convention, and the staff goes to Berlin to prove it.§!"
 ITA_tt_z_compensated: "§YVienna has paid Rome its compensation: the sandjak and the faculty.§!"
 ITA_tt_z_conrad_answered: "§YRome has given its answer to Conrad's mobilisation, and the file is closed.§!"
 ITA_tt_z_consented_to_bosnia: "§YRome consents to the annexation of Bosnia and calls the account settled.§!"
 ITA_tt_z_innsbruck: "§YThe night at Innsbruck is remembered in the provinces.§!"
 ITA_tt_z_petersburg_withdrew: "§YPetersburg cuts Cetinje's subsidy§!, and Montenegro is the likelier to take Rome's guarantee."
 ITA_tt_z_tyrol_crisis: "§YThe Tyrol crisis is on record, and Berlin is asked to hold Vienna back.§!"
 ita_dnc.2961.t: "The Admirals Name Their Price"
 ita_dnc.2961.d_a: "The Minister of the Navy reminds us that the Chamber refused the credits of the fleet, and that the squadrons answer to their officers before they answer to any assembly. If the Crown promises the fleet law that the Chamber would not vote, the admirals will hold the ships for the King when the kingdom splits. We may promise, or we may keep the Crown's word for better uses."
 ita_dnc.2961.d_b: "The admirals have let the Chamber know that the fleet is royal by its officers, and that the price of its silence is the fleet law which the Extreme Left fought for a decade. We who refused those credits are now asked to vote them, or to watch the squadrons sail for the King. Either answer will be remembered on the quays."
 ita_dnc.2961.a: "Promise them their fleet law"
 ita_dnc.2961.b: "The State does not bargain with its officers"
 ita_dnc.2501.t: "Giolitti at Dronero"
 ita_dnc.2501.d: "The member for Dronero walked out of the House with the Left and has not walked into the opposition's camp. He sits in his own province and receives letters from both sides, and every prefect in Piedmont waits to see which letter he answers. We may buy him with the Interior, let him decide for himself, or make sure that he decides nothing at all."
 ita_dnc.2501.a: "Offer him the Interior"
 ita_dnc.2501.b: "Let him choose"
 ita_dnc.2501.c: "Have him held at Dronero"
 ita_dnc.2605.t: "The Prefects Wait for the First Telegram"
 ita_dnc.2605.d: "The prefects of the kingdom have the security guards and the telegraph, and they have not yet been told whom they serve. The Interior can write to them tonight and bind the central provinces to the ministry; or the Comando can write to the twelve corps commanders and bind the garrisons of the north. We can pay for one letter, not for both."
 ita_dnc.2605.a: "The Interior writes first"
 ita_dnc.2605.b: "The Comando writes to the twelve corps"
 ita_dnc.2500.b: "The Court withdraws to Turin"
 ita_dnc.2962.t: "Italy at War with Itself"
 ita_dnc.2962.d: "Word has come from the peninsula that the King and the Chamber each claim to be the government of Italy, and that the army has answered both. The prefects of the south hold their provinces for the Crown; the cities of the north have raised their own guards for the Chamber. There is one Italy on the map this morning and two in every ministry of Europe."
 ita_dnc.2962.a: "Whichever wins, it is our country that bleeds."
 ita_dnc.2962.b: "A throne in danger is every throne's business."
 ita_dnc.2962.c: "Let the Italians settle it among themselves."
 ITA_cw_the_civil_war_follows_tt: "§RThe party that is sent home will take up arms: the kingdom will be at war with itself.§!"
 ITA_cw_the_civil_war_follows_b_tt: "§RThe Crown will not accept the refusal: the King's government withdraws to the South, and the kingdom will be at war with itself.§!"
 ITA_cw_the_prefects_are_bound_tt: "§YThe standing of the prefects§! rises sharply: the Interior has bound them to the ministry."
 ITA_cw_the_map_reads_tt: "§YThe lines of the map.§! Today the centre is [ITA_cw_GetCentreHeld], the frontier [ITA_cw_GetFrontierHeld], Piedmont [ITA_cw_GetPiedmontHeld]; the lines themselves are read among the decisions, under §Y$ITA_cw_the_war_of_the_two_italies$§!."
 ITA_cw_promised_the_fleet_tt: "§YThe squadrons stay with us when the kingdom splits.§! Unless the fleet law is carried within two years — §Y$ITADNC_o_rebuild_the_battle_fleet$§!, §Y$ITADNC_n_the_fleet_of_battle$§!, or §Y$ITADNC_n_the_naval_estimates$§! with §Y$ITADNC_n_the_naval_staff$§! — the admirals §Rmay turn their ships against the government§!."
 ITA_cw_the_admirals_refused_tt: "§RHalf the fleet or more sails with the other side when the kingdom splits.§! We owe the admirals nothing."
 ITA_cw_the_quays_see_the_credits_tt: "The Piazza §Rheats sharply§!: the leagues see the Chamber vote the credits it fought."
 ITA_cw_giolitti_at_the_interior_tt: "§GGiolitti keeps his seat and Piedmont keeps its King; the prefects answer him.§! §RThe Right will remember that the coup began by bargaining.§!"
 ITA_cw_giolitti_binds_the_prefects_tt: "§YThe standing of the prefects§! rises sharply: Giolitti at the Interior is their master."
 ITA_cw_giolitti_chooses_tt: "§YGiolitti answers for himself, and Piedmont answers with him.§! If he goes to the Chamber the province follows; if he stays at Dronero it stays with the Crown. The King's grip is the likelier argument when the frontier is [ITA_cw_GetFrontierHeld]."
 ITA_cw_giolitti_in_the_fortress_tt: "§GPiedmont stays with the Crown.§! §RThe Chamber in arms gains a martyr, and its stability is higher when the kingdom splits.§!"
 ITA_cw_the_interior_wrote_first_tt: "§YThe prefects answer the ministry§!: Tuscany and the Marches follow the Interior when the kingdom splits §Yif the centre is held§!. The centre is now [ITA_cw_GetCentreHeld]."
 ITA_cw_the_corps_are_written_to_tt: "§YThe Crown's grip loosens sharply§!: Piedmont and the frontier corps lean to the legal country when the kingdom splits §Yif they are held§!. The frontier is now [ITA_cw_GetFrontierHeld], Piedmont [ITA_cw_GetPiedmontHeld]."
 ITA_cw_the_split_a_tt: "§RThe Chamber takes Milan, Lombardy, Liguria and the Romagna, and the fleet as the admirals were answered.§! The central provinces are [ITA_cw_GetCentreHeld], the frontier corps [ITA_cw_GetFrontierHeld]; Piedmont goes where Giolitti went. The Crown keeps Rome, the South and the islands."
 ITA_cw_the_split_b_tt: "§RThe Chamber takes Rome and the north, and the fleet as the admirals were answered.§! The central provinces are [ITA_cw_GetCentreHeld], the frontier corps [ITA_cw_GetFrontierHeld]. §GThe Court is safe among its own at Turin: the army is gathered, not scattered.§!"
 ITA_cw_the_split_c_tt: "§RThe King's Government holds the South and the islands, and the fleet as the admirals were answered.§! The central provinces are [ITA_cw_GetCentreHeld], the frontier corps [ITA_cw_GetFrontierHeld], Piedmont [ITA_cw_GetPiedmontHeld]. Turin will follow Giolitti later unless a royal division holds it."
 ITA_cw_held: "§Gheld§!"
 ITA_cw_lost: "§Rlost§!"
 ITA_cw_fascio_delle_opposizioni: "Fascio delle Opposizioni"
 ITA_cw_fascio_delle_opposizioni_long: "The Fascio of the Oppositions"
 ITA_cw_partito_dell_ordine: "Partito dell'Ordine"
 ITA_cw_partito_dell_ordine_long: "The Party of Order"
 ITA_cw_the_exiles_return: "The Exiles Return"
 ITA_cw_the_exiles_return_desc: "The men the tribunals sent abroad are home, and the leagues listen to them before they listen to us."
 ITA_cw_the_exiles_watched: "The Exiles Watched"
 ITA_cw_the_exiles_watched_desc: "The exiles are home under the eye of the questura, and every meeting of the leagues has a policeman at the door."
 ITA_cw_the_popular_militia: "The Popular Militia"
 ITA_cw_the_popular_militia_desc: "The squads of the leagues hold our streets under their own captains, and the rifles are theirs to keep."
 ITA_cw_the_kings_reserve: "The King's Reserve"
 ITA_cw_the_kings_reserve_desc: "The reserve legions of the carabinieri are called up and stand in the loyal provinces under royal officers."
 ITA_cw_the_territorial_militia: "The Territorial Militia"
 ITA_cw_the_territorial_militia_desc: "A territorial militia stands in the provinces under the army corps, drilled by them and paid by the municipalities."
 ITA_cw_the_kings_levy: "The King's Levy"
 ITA_cw_the_kings_levy_desc: "The parishes and the prefects bring the young men of the loyal provinces to the colours in the King's name."
 ITA_cw_the_frontier_kept: "The Frontier Kept"
 ITA_cw_the_frontier_kept_desc: "The frontier corps stay in the passes for whoever wins, and the country is calmer for knowing it."
 ITA_cw_the_nation_in_arms: "The Nation in Arms"
 ITA_cw_the_nation_in_arms_desc: "The leagues, the municipalities and the students are under arms for the Chamber, and the country is a camp."
 ITA_cw_the_bishops_price: "The Bishops' Price"
 ITA_cw_the_bishops_price_desc: "The parishes vote for the King, and the Crown pays for it with every law it wants to carry."
 ITA_cw_the_purge_of_the_admirals: "The Purge of the Admirals"
 ITA_cw_the_purge_of_the_admirals_desc: "The admirals who turned their ships are struck from the lists, and the fleet is commanded by men who have never had a squadron."
 ITA_cw_the_recovery: "The Recovery"
 ITA_cw_the_recovery_desc: "The provinces the war passed through are being put back to work, and the country goes without to pay for it."
 ITA_DNC_AI_BEHAVIOR: "Italian AI, the end of the century"
 RULE_OPTION_ITA_DNC_DEFAULT_DESC: "The Italian AI follows the ministry when historical focuses are on, and otherwise draws its road at the start of the game."
 RULE_OPTION_ITA_HISTORICAL: "The ministry"
 RULE_OPTION_ITA_HISTORICAL_DESC: "The Italian AI lets the era run as it did."
 RULE_OPTION_ITA_CROWN: "The King breaks the Chamber"
 RULE_OPTION_ITA_CROWN_DESC: "The Italian AI sends the Chamber home and returns to the Statuto."
 RULE_OPTION_ITA_CONSTITUTIONAL: "The King recalls the Chamber"
 RULE_OPTION_ITA_CONSTITUTIONAL_DESC: "The Italian AI sends the Chamber home and recalls it once the war is won, under a King who reigns and does not govern."
 RULE_OPTION_ITA_COMANDO: "The army will not fire"
 RULE_OPTION_ITA_COMANDO_DESC: "The Italian AI lets the army refuse to fire on the crowd, and the Supreme Command governs."
 RULE_OPTION_ITA_OATH: "The oath to the Statuto"
 RULE_OPTION_ITA_OATH_DESC: "The Italian AI lets the army refuse to fire, seats the Chamber and binds the King by an oath to the Statuto."
 RULE_OPTION_ITA_REPUBLIC: "The leagues govern"
 RULE_OPTION_ITA_REPUBLIC_DESC: "The Italian AI lets the army refuse to fire, seats the Chamber and hands the ministries to the leagues."
 RULE_OPTION_ITA_DNC_RANDOM_DESC: "The Italian AI draws one of the six roads at the start of the game and follows it."
 ita_dnc.2968.t: "The Fortress Corps Stay Out"
 ita_dnc.2968.d: "The corps of the Quadrilateral and of the Piave stand where the treaty with Vienna put them, and their commanders ask whether they are to march on their own countrymen or to hold the passes for whoever wins. If we leave them where they are, the frontier stays a frontier and Vienna has less to say; if we call them down to the plain, we gain their rifles and lose the passes. Either way the other Italy will hear of it within the week."
 ita_dnc.2968.a: "Leave the frontier corps where they are"
 ita_dnc.2968.b: "Order the frontier corps to the plain"
 ita_dnc.2966.t: "The Senate Sits with the Seal"
 ita_dnc.2966.d: "The Senate has not left the capital, and its president has let us know that the upper house will lend its name to whichever government holds the seal, provided that government lets the newspapers print again. We can pay the price and gain the one body in the kingdom that both sides still call lawful; or we can let the old man go where he likes, and keep the press under the prefects."
 ita_dnc.2966.a: "Pay the Senate's price: the press walks free"
 ita_dnc.2966.b: "The President of the Senate may go where he likes"
 ita_dnc.2967.t: "Sonnino Is Sent For"
 ita_dnc.2967.d: "The man who wrote that we should return to the Statuto has offered to form the King's ministry and to give the coup the face of a programme. The General who holds the Council has not asked to be replaced, and the army has no quarrel with him. We may call the leader of the Right and let a soldier go back to being a soldier, or keep the General and let the country say that a sabre governs it."
 ita_dnc.2967.a: "Sonnino forms the King's ministry"
 ita_dnc.2967.b: "The General keeps the Council"
 ita_dnc.2969.t: "The Bishops Are Asked"
 ita_dnc.2969.d: "The bishops of the loyal provinces have let us know that the parishes would vote for the King's candidates if Rome lifted the prohibition, and that Rome would lift it for a price: the schools, the marriage, and a word on the Roman Question. The Vatican was struck by the same tribunals as the leagues and owes the Crown nothing. We may ask and pay, or keep the Crown out of the sacristy."
 ita_dnc.2969.a: "Ask Rome to lift the non expedit for the King's candidates"
 ita_dnc.2969.b: "The Crown does not beg at the Vatican"
 ita_dnc.2965.t: "The Leagues in Arms or the Civic Guard"
 ita_dnc.2965.d_a: "The leagues of the north have asked for rifles and the municipalities have asked for a civic guard, and both are asking the same question: who will hold the streets of the cities while the army holds the front. We must choose the militia we can afford to have when the war ends, because whichever we raise will have to be sent home or kept."
 ita_dnc.2965.d_b: "The prefects of the loyal provinces ask us for leave to arm the municipalities that have declared for the King, and the Arma asks us instead that its reserve be called up under its own officers. Either will hold our streets while the army marches; either will have to be paid off or kept when the war is over."
 ita_dnc.2965.a: "The leagues take up rifles"
 ita_dnc.2965.b: "A territorial militia under the corps"
 ita_dnc.2965.c: "The prefects arm the loyal municipalities"
 ita_dnc.2965.d: "The Carabinieri reserve is called up"
 ITA_cw_the_frontier_kept_tt: "§GVienna is told the passes are held for whoever wins, and is slower to march.§! §RThe men of the Quadrilateral are not ours to spend.§!"
 ITA_cw_the_frontier_emptied_tt: "§GThe frontier corps come down to the plain and fight for us.§! §RThe passes stand empty: Vienna is quicker to march, and readier to mass in the Tyrol.§!"
 ITA_cw_the_prefects_lose_the_press_tt: "The standing of the prefects §Rfalls sharply§!: they lose the press they were used to seizing."
 ITA_cw_the_senate_covers_tt: "§GThe Senate covers the government that holds the seal, and the war will be judged more gently.§!"
 ITA_cw_saracco_crosses_tt: "§RSaracco goes to the other Italy, and its ministries have a president.§!"
 ITA_cw_sonnino_governs_tt: "§YThe Right governs in the King's name; the General keeps the army and leaves the Council.§! The bishops of the loyal provinces will be heard next."
 ITA_cw_the_general_keeps_the_council_tt: "§RA soldier governs, and the country knows it§!; §Gthe army has no quarrel with its minister§!. The bishops of the loyal provinces will be heard next."
 ITA_cw_the_bishops_price_tt: "§GThe parishes vote for the King.§! §RThe Roman Question is open again, and the Crown owes the bishops.§!"
 ITA_cw_the_crown_does_not_beg_tt: "§YThe non expedit stands, and the parishes stay home.§!"
 ITA_cw_the_squads_tt: "§YA militia that will have to be §RSent home§! or §YKept on the rolls§! when the war ends.§!"
 ITA_cw_the_militia_is_chosen_tt: "§YWe choose the militia that holds our streets, and it will have to be sent home or kept when the war ends.§!"
 ITA_cw_threat_the_empty_frontier: "The Italian frontier stands empty"
 ITADNC_o_rally_the_kingdom: "Rally the Kingdom"
 ITADNC_o_rally_the_kingdom_desc: "The loyal provinces must be held while the army marches, and the garrisons that hold them are the same men the front is asking for. We shall call the King's levy and raise the militia that keeps our streets until the war is won."
 ITADNC_o_the_kingdom_at_work: "The Kingdom at Work"
 ITADNC_o_the_kingdom_at_work_desc: "The provinces we take back come to us with their registers burned and their rails lifted. We shall put the kingdom back to work while the war is still being fought, so that the peace does not find it in ruins."
 ITADNC_o_the_leagues_dissolved: "The Leagues Dissolved"
 ITADNC_o_the_leagues_dissolved_desc: "The leagues that armed the other Italy still have their sections in the provinces we hold. We shall dissolve them by decree while the state of siege allows it, and let the parishes hear that the King governs."
 ita_dnc.2989.t: "The Arma Remembers Its Oath"
 ita_dnc.2989.d: "The legions of the Carabinieri in our provinces have not moved from their barracks, and their colonels have written to ask whom their oath now binds them to. We can release them to the King, and know at last where we stand in our own streets; or we can hold them to their barracks and keep a force that will not fight for us. The leagues are already asking why we keep an army that took an oath to the other side."
 ita_dnc.2989.a: "Let them go to the King"
 ita_dnc.2989.b: "Hold them to their barracks"
 ita_dnc.2963.t: "The Exiles Come Back"
 ita_dnc.2963.d: "The men the tribunals sent abroad after the days of May are coming home by every train from Lugano and every steamer from the American ports, and they are asking for rifles. Some are the printers and weavers of the leagues; some are the friends of the man who shot at the King. We may welcome them and take their hands, or set the police on them and lose their numbers."
 ita_dnc.2963.a: "Welcome them home"
 ita_dnc.2963.b: "Someone must keep an eye on them"
 ita_dnc.2964.t: "The Fortress Gates Open"
 ita_dnc.2964.d: "The old anarchist has landed on the Adriatic shore and the Romagna is listening to him, and the same week the gates of the fortress prisons have opened for the men the military tribunals sentenced after the days of May. Lazzari walks out with the printers of the Avanti and asks for a seat, not a rifle. We did not order either thing, and we cannot now undo them."
 ita_dnc.2964.a: "The old men are home."
 ita_dnc.2990.t: "The Man from Dronero"
 ita_dnc.2990.d: "Giolitti sits in our ministry and Turin sits under the King's flag, and the prefect of Turin has written privately that the city would declare for us if the member for Dronero came home to say so. The garrison is the question. If the royal divisions have left the city, a speech will take it for us; if they have not, the speech will be made to a barracks."
 ita_dnc.2990.a: "Send him to Turin"
 ita_dnc.2990.b: "He is more useful where he is"
 ita_dnc.2972.t: "The Chancellor Weighs the Alliance"
 ita_dnc.2972.d: "Our ally has two governments, and each has written to ask which one we recognise. The King's ministers govern by decree behind a line of bayonets; the Chamber sits under the guns of its own guards. We need an Italy that keeps its passes against France, and we do not much care which Italy it is, so long as it is one."
 ita_dnc.2972.a: "Back the King and his ministry"
 ita_dnc.2972.b: "No Austrian corps south of the Brenner"
 ita_dnc.2972.c: "Italy has ceased to be useful"
 ita_dnc.2976.t: "The Chancellor's Word"
 ita_dnc.2976.d: "The Chancellor's note has arrived by the hand of the ambassador, and it says in the plainest German that the Empire deals with the King of Italy and with no one else. It is a word, not a corps; but it is the word every prefect in our south was waiting to read in the newspaper."
 ita_dnc.2976.a: "Berlin stands behind the throne."
 ita_dnc.2992.t: "The Alliance Lapses"
 ita_dnc.2992.d: "The Chancellor has let it be known, without a note and without a word, that the Empire deals with neither Italy until there is one. The alliance is not denounced; it lapses, and Vienna, which reads Berlin's silences better than we do, will draw its own conclusion about how much Rome is still worth to the alliance."
 ita_dnc.2992.a: "The Empire has no Italian policy today."
 ita_dnc.2970.t: "Laibach Again?"
 ita_dnc.2970.d: "The Italians have two governments and one of them is a Chamber of the Extreme Left sitting in permanence, which is what the Congress of Laibach was called to prevent. We can recognise the King and give him our word; we can mass a corps in the Tyrol and let both Italies read the notice; or we can do what our grandfathers did and march. Berlin has opinions on the last course, and so will Paris."
 ita_dnc.2970.a: "Recognise the King's Government"
 ita_dnc.2970.b: "Mass in the Tyrol, for order"
 ita_dnc.2970.c: "Laibach again"
 ita_dnc.2973.t: "The Ambassador's Note"
 ita_dnc.2973.d_a: "The ambassador has brought the alliance's answer: Vienna deals with the King's government and with no other, and it offers whatever the King's government asks. We may take the word and the confidence that comes with it, or decline to owe the throne to a foreign chancery. The other Italy will read either answer."
 ita_dnc.2973.d_c: "The ambassador has brought a note and the frontier has brought the rest: an Austrian corps is over the passes and marching on the Chamber's provinces in the name of order. We did not ask for it and we cannot send it home. We may accept what it brings and pay the price in the eyes of our own soldiers, or refuse the foreign bayonet and let the other Italy claim the nation."
 ita_dnc.2973.a: "The Crown accepts what is offered"
 ita_dnc.2973.b: "The Crown will not owe its throne to Austria"
 ita_dnc.2974.t: "The Austrians Are at the Isonzo"
 ita_dnc.2974.d_a: "An Austrian corps has been massed above the passes with a notice that it is there for order, and the frontier towns are counting the guns. We can answer the King's foreign friends with the nation's own anger, and make the Chamber the party of the unredeemed provinces; or we can keep our corps on the Isonzo and hold the passes quietly for whoever wins the quarrel."
 ita_dnc.2974.d_b: "The Austrians have come over the passes in the King's name, as they came for the King of Naples in our grandfathers' time. The Chamber is now the only Italy that fights the foreigner, and the country knows it. We can call the nation to arms and let the King answer for his allies, or hold the Isonzo with what we have and let the war of the two Italies wait."
 ita_dnc.2974.a: "Trento and Trieste before the Quirinal!"
 ita_dnc.2974.b: "Hold the Isonzo, and wait"
 ita_dnc.2971.t: "The Republic and the Chamber"
 ita_dnc.2971.d: "The Italians have done to their Chamber what our own generals dreamed of doing to ours, and the Chamber has answered by raising the cities. The son of Garibaldi is at Nice asking for the frontier to be opened to his volunteers, and the government of the north asks to be called the government of Italy. We may let the legion through, give the Chamber our word, or close the passes and wait."
 ita_dnc.2971.a: "Let the legion through"
 ita_dnc.2971.b: "Recognise the government of the Chamber"
 ita_dnc.2971.c: "Close the passes"
 ita_dnc.2975.t: "The Legion Crosses the Frontier"
 ita_dnc.2975.d: "The French have opened the passes and the son of the General has come over with the red shirts of three generations, singing as they did in the Vosges. They ask us for a sector and a flag, not for pay. Vienna will read of it tomorrow and the King will call it what it is, a foreign hand in an Italian quarrel; but the rifles are real."
 ita_dnc.2975.a: "Garibaldi's son brings his rifles."
 ita_dnc.2991.t: "The Republic Recognises the Chamber"
 ita_dnc.2991.d: "The French ambassador has presented his letters to the Chamber and not to the King, and the Republic's newspapers call us the government of Italy. It is a word and a precedent, not a corps; but every prefect who was waiting to see which way Europe would lean has read it this morning, and Vienna has read it too."
 ita_dnc.2991.a: "Paris calls us the government of Italy."
 ITA_cw_the_exiles_welcomed_tt: "§YThe leagues remember who welcomed them: the fortress gates will open, and the man who walks out of them is the likelier choice when the Chamber names its leader.§!"
 ITA_cw_berlin_forbids_laibach_tt: "§YBerlin tells Vienna that no Austrian corps may cross the Brenner: the Congress of Laibach is not to be repeated, and Vienna is likelier to recognise the King instead.§!"
 ITA_cw_the_arma_goes_to_the_king_tt: "§RA legion of carabinieri stands with the King.§! §GOur own streets are ours to keep, and we know where we stand.§!"
 ITA_cw_the_arma_stays_in_barracks_tt: "§YNo carabinieri march for either side.§!"
 ITA_cw_the_gates_open_tt: "§YMalatesta is back and the Romagna listens to him: the Insurrection comes sooner if the Piazza is left to heat after the war.§! §YLazzari is free, and may sit in the ministry.§!"
 ITA_cw_berlin_lets_the_alliance_lapse_tt: "Berlin lets the alliance lapse in silence: §RVienna's confidence in Rome falls sharply.§!"
 ITA_cw_the_crown_owed_vienna_tt: "§RThe throne owes its safety to a foreign army, and the country will remember it when the war is judged.§!"
 ITA_cw_the_crown_refuses_the_bayonet_tt: "§GThe King refuses the foreign bayonet.§!"
 ITA_cw_vienna_stands_with_the_crown_tt: "§GVienna deals with the King's government and with no other.§!"
 ITA_cw_the_isonzo_is_held_tt: "§YThe frontier corps hold the passes for whoever wins, and Vienna has nothing to answer.§!"
 ITA_cw_paris_recognises_the_chamber_tt: "§GParis calls the Chamber the government of Italy.§!"
 ITA_cw_the_legion_stands_with_the_chamber_tt: "§GThree legions and Ricciotti Garibaldi stand with the Chamber.§! §RVienna takes note.§!"
 ITA_cw_tt_2990_a: "§GGiolitti comes over, and Piedmont with him — unless a royal division holds Turin, in which case the speech is made to a barracks.§!"
 ITA_cw_nothing_follows_tt: "Nothing further follows from this choice."
 ITA_cw_threat_the_corps_in_the_tyrol: "Austrian corps in the Tyrol"
 ITA_cw_threat_laibach: "The Austrian intervention in Italy"
 ITA_cw_threat_the_legion: "The Legion at the Frontier"
 ita_dnc.2979.t: "The Province Changes Hands"
 ita_dnc.2979.d_a: "The prefect's men have entered the province behind the army and found the registers of the land tax burned on the square, the rolling stock gone south with the leagues, and the telegraph cut at every post. The province is ours again; what it was worth is another question."
 ita_dnc.2979.d_b: "Our columns have entered the province behind the Crown's retreat and found the prefecture emptied, the archives taken away in the King's carts, and the rails lifted at the junctions. We hold the ground; the works on it will have to be rebuilt."
 ita_dnc.2979.a: "A province is a province."
 ita_dnc.2980.t: "The Other Capital Falls"
 ita_dnc.2980.d_a: "The Chamber's seat has fallen to our columns and its president has been taken with his papers, but the deputies who got away have met in another city and named another leader: the socialist who came out of the fortress two years ago. The moderate Chamber is finished; the Chamber of the leagues fights on."
 ita_dnc.2980.d_b: "The King has gone aboard the squadron with the Queen and the ministry, as the last King of Naples did before him, and the generals who stayed have put the Duke of Aosta at the head of the government in the King's name. Our columns hold his capital; the Crown has another city and another face, and it has not surrendered to us."
 ita_dnc.2980.a: "They have another city, and another leader."
 ita_dnc.2994.t_a: "The King Goes Aboard"
 ita_dnc.2994.t_b: "The Chamber Sits in Another City"
 ita_dnc.2994.d_a: "The capital is in the Chamber's hands and the King has gone aboard the squadron with the Queen and the ministry, as the last King of Naples went before him. The generals who stayed have put the Duke of Aosta at the head of the government in the King's name, and the prefects of the provinces still ours are told that the Crown has another city and another face. We have not surrendered; we have moved."
 ita_dnc.2994.d_b: "The seat of the Chamber has fallen to the King's columns and its president was taken with his papers. The deputies who got away have met in another city and named the socialist who came out of the fortress two years ago to lead what is left of the legal country. The moderate Chamber is finished; the Chamber of the leagues fights on, and the provinces that followed us are asked to follow him."
 ita_dnc.2994.a: "We have another city."
 ita_dnc.2977.t: "The Island Rises"
 ita_dnc.2977.d: "The island waited for its statute through the whole of our war and was answered with a corps in the interior. This morning the fasci of the sulphur towns and the republican clubs of Palermo have proclaimed the island's own government, and our garrisons have gone over or gone home. Whichever of us wins on the mainland will have to take Sicily back by sea."
 ita_dnc.2977.a: "They cannot be allowed to succeed."
 ita_dnc.2993.t: "The Island Proclaims Itself"
 ita_dnc.2993.d: "The island that waited for its statute through the whole of the war has proclaimed its own government at Palermo, and both Italies have declared war on it the same morning. The squadrons that were holding the strait for one King or the other now hold it against Sicily. There are three Italies on the map tonight, and the oldest of them is the newest."
 ita_dnc.2993.a: "We shall take the island back by sea."
 ita_dnc.2993.b: "Palermo governs Palermo."
 ita_dnc.2993.c: "The Sicilian question is open again."
 ita_dnc.2978.t: "The Admirals Ask for Their Ships"
 ita_dnc.2978.d: "We promised the admirals their fleet law when the kingdom split and the two years have run out without a vote. This morning the squadron weighed anchor without orders and stood in toward the capital, and the Minister of the Navy has sent word that the officers will answer to him and to nobody else. We can break them, or we can give them what they came for."
 ita_dnc.2978.a: "They will answer for it"
 ita_dnc.2978.b: "The State keeps its word too late"
 ITA_cw_tt_2994_a: "§YThe government sits in another city under another head: the Duke of Aosta for the Crown, Turati for the Chamber. The war goes on.§!"
 ITA_cw_palermo_is_promised_tt: "§YPalermo is promised its statute, and the island's republican may sit in the ministry.§!"
 ITA_cw_threat_the_island: "The rising in Sicily"
 ITA_cw_palermo_asks_its_price: "Palermo Asks Its Price"
 ITA_cw_palermo_asks_its_price_desc: "The island has sent its deputies to ask what the statute it was promised is worth while the kingdom fights itself. We have seven months to answer, and every month we spend on the mainland is a month the sulphur towns spend listening to the republican clubs."
 ITA_cw_the_fleet_law_is_owed: "The Fleet Law Is Owed"
 ITA_cw_the_fleet_law_is_owed_desc: "We promised the admirals their fleet law when the kingdom split, and they hold the squadrons for us on that word. If the law is not carried within two years, they will come for their ships."
 ITA_cw_promise_palermo_its_statute: "Promise Palermo its statute"
 ITA_cw_promise_palermo_its_statute_desc: "We shall tell Palermo that its statute will be written when the war is won, and let the island's republican sit in the ministry as the pledge of it. The promise buys us time; it does not buy the island."
 ITA_cw_the_twelfth_corps_into_the_interior: "Send the Twelfth Corps into the interior"
 ITA_cw_the_twelfth_corps_into_the_interior_desc: "We shall send the corps of the island into the sulphur towns and the interior, where the fasci meet, and let the garrisons keep the roads. The squares of the mainland will hear of it before the clubs of Palermo do."
 ITA_cw_the_war_of_the_two_italies: "The War of the Two Italies"
 ITA_cw_the_war_of_the_two_italies_desc: "§YThe lines of the map.§! The prefects hold the centre from §Y[?ITA_cw_prefects_line|0]§!; the King holds the frontier from §Y[?ITA_cw_crown_line|0]§! and Piedmont from §Y[?ITA_cw_piedmont_line|0]§!. Today the centre is [ITA_cw_GetCentreHeld], the frontier [ITA_cw_GetFrontierHeld], Piedmont [ITA_cw_GetPiedmontHeld]."
 ITA_cw_the_debt_to_the_admirals: "The Debt to the Admirals"
 ITA_cw_the_debt_to_the_admirals_desc: "§YThe fleet law was promised when the kingdom split.§! The admirals hold the ships for us until the term runs out; if the law is not carried by then, they will ask for their ships."
 ita_dnc.2982.t: "The Amnesty or the Tribunals"
 ita_dnc.2982.d_a: "The other Italy's leaders are in our hands, and the prefects ask what is to be done with the men who sat in a Chamber against the King. The tribunals of May are ready to sit again; the new reign could instead begin with the amnesty that every reign begins with. One answer keeps the Piazza quiet for a year and makes the prisoners a party; the other buys the country's peace and leaves the prisoners at large."
 ita_dnc.2982.d_b: "The King's ministers are in our hands, and the deputies ask what is to be done with the men who governed by decree and sent the Chamber home. We can try them before the tribunals they once used on us, or open the reign of the legal country with an amnesty that lets them keep their seats. The street wants the one; the country will remember the other."
 ita_dnc.2982.a: "The amnesty of the new reign"
 ita_dnc.2982.b: "The military tribunals sit"
 ita_dnc.2983.t: "The War of the Two Italies Ends"
 ita_dnc.2983.d_a: "The King's columns have entered the last of the Chamber's cities and the deputies who sat against the decrees have been taken or have fled. The Crown governs Italy again by the sword that made it, and the ministries of Europe are asking what it will do with the victory."
 ita_dnc.2983.d_b: "The legal country has taken the last of the Crown's provinces and the King's ministers are in its hands. Italy has a Chamber and no decree, and the chanceries of Europe are asking whether it will also have a King."
 ita_dnc.2983.a: "It is over."
 ita_dnc.2983.b: "Italy has a government again."
 ita_dnc.2988.t: "The Future of the Squads"
 ita_dnc.2988.d: "The militia we raised for the war is still on the rolls, and its officers are asking whether they are to be paid off or kept. A country at peace does not need armed leagues in its streets, nor a reserve that answers to the Arma before the ministry. We may send them home, or keep them a while longer for what may come."
 ita_dnc.2988.a: "Send them home"
 ita_dnc.2988.b: "Keep them on the rolls for now"
 ita_dnc.2984.t: "The General Retires"
 ita_dnc.2984.d: "The General who held the government through the war has asked to be relieved of it, and of his command with it. He has served the Crown and the country as a soldier does, without being asked what he thought of either; now that the guns are quiet he says that the question of what Italy is to be is not a soldier's to answer. We shall let him go, and answer it ourselves."
 ita_dnc.2984.a: "He has served the Crown."
 ita_dnc.2986.t: "The Crown Is Asked"
 ita_dnc.2986.d_a: "The King who left the capital rather than govern with us has been brought back with his ministers, and we must say what we do with him. He may swear the Statuto a second time before the assembled Houses and reign as his father reigned; or the House of Savoy may take ship for the last time, as another Piedmontese king did, and leave the country to name itself. Either answer will be the first article of our new state."
 ita_dnc.2986.d_b: "The King who sent us home has lost the war that his decree began, and we who won it must say what we do with him. His son may be called to swear the Statuto and reign as a constitutional king over our recalled Chamber; or we may declare that the Crown has forfeited what it broke, and let the country call itself a republic."
 ita_dnc.2986.a: "The King swears the Statuto a second time"
 ita_dnc.2986.b: "The House of Savoy takes ship"
 ita_dnc.2985.t: "The Prisoners of the Fortress"
 ita_dnc.2985.d: "The war has come and the depots are asking for officers and for men, and the men the tribunals sent to the fortress after the civil war are asking to serve. Their party is broken but their names still carry in the provinces that followed them. We can put them back in the ranks and open the ministries to their friends, leave them where they are, or finish what the tribunals began."
 ita_dnc.2985.a: "Let them out and put them in the ranks"
 ita_dnc.2985.b: "The fortress keeps them"
 ita_dnc.2985.c: "Finish what the tribunals began"
 ita_dnc.2620.e: "Lazzari, who came out of the fortress"
 ITA_cw_the_leaders_amnestied_tt: "§GThe other Italy's leaders keep their seats and their counsel.§!"
 ITA_cw_the_leaders_in_the_fortress_tt: "§RThe other Italy's leaders go to the fortress, and their party is broken; they may be recalled if a war ever needs them.§!"
 ITA_cw_the_hundred_days_open_tt: "§YThe Hundred Days begin: the country has a season to say what it will be.§!"
 ITA_cw_the_winner_is_settled_tt: "§YThe government returns to the capital. If the Chamber has won, the Crown is asked what becomes of the King; if the Comando's Crown has won, it returns to the Statuto.§!"
 ITA_cw_the_hundred_days_are_bought_tt: "§GA month is bought back on the Hundred Days.§!"
 ITA_cw_the_general_retired_tt: "§YThe General leaves the government, and the question of the regime is open.§!"
 ITA_cw_tt_2986_a: "§GThe King swears again: the Crown's grip tightens sharply, the country settles, and the King's spirit returns.§! If the Chamber won the war it began, the Chamber is recalled under the King's son."
 ITA_cw_tt_2986_b: "§RThe King leaves the country, or his son is told the Chamber will not swear him.§! If the Chamber won the war it began, Italy calls itself a republic under Colajanni, or under Barzilai if the island has taken him; otherwise the choice of the regime is the Chamber's alone."
 ITA_cw_the_leaders_reinstated_tt: "§YThe fortress opens and the vanquished party's men are eligible for the ministries again.§!"
 ITA_cw_the_fortress_is_emptied_tt: "§RThe tribunals finish their work; nobody will be recalled.§!"
 ITA_cw_fuorusciti: "Fuorusciti"
 ITA_cw_fuorusciti_long: "The Exiles"
 ITA_cw_the_red_rising_tt: "§RMilan, Lombardy, Liguria and the Romagna rise in arms against the kingdom, Malatesta at their head, and the capitals are told.§!"
 ITA_cw_the_romagna_rises_tt: "§RThe Romagna, Tuscany and the Abruzzi rise in arms.§! The Piazza is §Rreset to a high mark§! and the Chamber's majority §Rthins sharply§!."
