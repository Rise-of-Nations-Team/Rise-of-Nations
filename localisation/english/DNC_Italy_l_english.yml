 ita_dnc.2360.t: "The Rise of a Minister"
 ita_dnc.2360.d: "The three chairs at the council table are all taken, and we have put a fourth name before the King. He will not add a chair to please the Chamber. One of the ministers now seated must give his up, or we withdraw the name."
 ita_dnc.2360.a: "Dismiss the minister in the first chair."
 ita_dnc.2360.b: "Dismiss the minister in the second chair."
 ita_dnc.2360.c: "Dismiss the minister in the third chair."
 ita_dnc.2360.e: "Withdraw the name and leave the council as it is."
 ita_dnc.2361.t: "The King Calls Another"
 ita_dnc.2361.d: "Our ministry has done the work it was called to do. The three men who did it are now larger than the offices they hold. The King alone decides who forms a government, and no vote of the Chamber can decide it for him. He will name one of the three, or none of them."
 ita_dnc.2361.a: "Let the minister in the first chair form the government."
 ita_dnc.2361.b: "Let the minister in the second chair form the government."
 ita_dnc.2361.c: "Let the minister in the third chair form the government."
 ita_dnc.2361.e: "Keep the ministry where it is for now."
 ita_dnc.2362.t: "Giolitti Chooses His First Work"
 ita_dnc.2362.d: "The Interior keeps two forces that never speak to each other. One is the reserved office, the police bureau that files cards on subversives. The other is the city guards who stand in the squares. We have the money to build up one of them, and only one."
 ita_dnc.2362.a: "Build up the reserved office and its files."
 ita_dnc.2362.b: "Build up the guards in the squares."
 ita_dnc.2363.t: "The Quarrel over the Estimates"
 ita_dnc.2363.d: "Three of our ministers each claim the last word over the estimates, the army and navy money bills. Each of them holds letters from the other two that would read badly in the papers. No ministry carries a budget while a quarrel like this runs. We must settle it, or leave it open."
 ita_dnc.2363.a: "Give the last word to the Ministry of Industry."
 ita_dnc.2363.b: "Give the last word to the Bank of Italy."
 ita_dnc.2363.c: "Give the last word to the Treasury."
 ita_dnc.2363.e: "Leave the quarrel unsettled."
 ita_dnc.2364.t: "Nitti Takes Up a File"
 ita_dnc.2364.d: "The Minister goes through the papers on his desk and settles on the one he means to finish."
 ita_dnc.2364.a: "Very well."
 ita_dnc.2365.t: "Nitti Closes a File"
 ita_dnc.2365.d: "The Minister sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2365.a: "Very well."
 ita_dnc.2366.t: "Stringher Takes Up a File"
 ita_dnc.2366.d: "The director general of the Bank sets aside the correspondence and settles on the work he means to finish."
 ita_dnc.2366.a: "Very well."
 ita_dnc.2367.t: "Stringher Closes a File"
 ita_dnc.2367.d: "The director general sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2367.a: "Very well."
 ita_dnc.2368.t: "Luzzatti Takes Up a File"
 ita_dnc.2368.d: "The Treasury clears its desk of everything that is not the one operation it means to finish."
 ita_dnc.2368.a: "Very well."
 ita_dnc.2369.t: "Luzzatti Closes a File"
 ita_dnc.2369.d: "The Treasury sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2369.a: "Very well."
 ita_dnc.2370.t: "Giolitti Takes Up a File"
 ita_dnc.2370.d: "The Interior reads what the prefectures have sent and settles on the work it means to finish."
 ita_dnc.2370.a: "Very well."
 ita_dnc.2371.t: "Giolitti Closes a File"
 ita_dnc.2371.d: "The Interior sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2371.a: "Very well."
 ita_dnc.2372.t: "Orlando Takes Up a File"
 ita_dnc.2372.d: "Public Instruction sets its clerks on the one law it means to carry through the Chamber."
 ita_dnc.2372.a: "Very well."
 ita_dnc.2373.t: "Orlando Closes a File"
 ita_dnc.2373.d: "Public Instruction sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2373.a: "Very well."
 ita_dnc.2374.t: "Sacchi Takes Up a File"
 ita_dnc.2374.d: "The chancellor of the majority counts his people in the lobbies and settles on the work he means to finish."
 ita_dnc.2374.a: "Very well."
 ita_dnc.2375.t: "Sacchi Closes a File"
 ita_dnc.2375.d: "The chancellor sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2375.a: "Very well."
 ita_dnc.2376.t: "Salandra Takes Up a File"
 ita_dnc.2376.d: "The chancellor of the majority counts his people in the lobbies and settles on the work he means to finish."
 ita_dnc.2376.a: "Very well."
 ita_dnc.2377.t: "Salandra Closes a File"
 ita_dnc.2377.d: "The chancellor sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2377.a: "Very well."
 ITA_h_the_council_dm: "The Council of Seven"
 ITA_h_the_council_dm_desc: "The King lends three chairs at the council table, and takes them back when he pleases. A minister who sits in one of them does not wait to be told what to do. He works his own branch of the government and finishes it in his own time. The notice that reaches the country carries his name, not ours."
 ITA_h_the_council_dm_tt: "The King has lent three seats at the council table, and they are held by §Y[GetITACouncilSeatOne]§!, §Y[GetITACouncilSeatTwo]§! and §Y[GetITACouncilSeatThree]§!. \nEach minister seated works his own branch and finishes it without being told."
 ITA_h_nitti_minister_of_industry: "Nitti at the Ministry of Industry"
 ITA_h_nitti_minister_of_industry_desc: "He believes the State can build an industry where none has grown by itself. He means to spend our money proving it, and our new factories go up faster for it."
 ITA_h_nitti_minister_of_industry_and_labour: "Ministry of Industry and Labour"
 ITA_h_stringher_at_the_bank: "Stringher at the Bank"
 ITA_h_stringher_at_the_bank_desc: "The director general of the Bank keeps the note issue steady and the failing houses upright. He expects the Treasury to keep out of it, and his credit builds our arms works faster."
 ITA_h_stringher_plenipotentiary_of_credit: "Envoy of Credit"
 ITA_h_luzzatti_at_the_treasury: "Luzzatti at the Treasury"
 ITA_h_luzzatti_at_the_treasury_desc: "The markets answer him when they answer nobody else. He means to spend that credit on the debt first, and the saving leaves more of our factories free."
 ITA_h_luzzatti_plenipotentiary_of_the_treasury: "Envoy of the Treasury"
 ITA_h_giolitti_at_the_interior: "Giolitti at the Interior"
 ITA_h_giolitti_at_the_interior_desc: "He holds the prefects, the police and the machine that runs our elections. He uses all three to keep the country quiet."
 ITA_h_giolitti_the_interior_reorganised: "The Interior Reorganised"
 ITA_h_giolitti_master_of_the_prefects: "Master of the Prefects"
 ITA_h_orlando_at_public_instruction: "Orlando at Public Instruction"
 ITA_h_orlando_at_public_instruction_desc: "He is a lawyer in a ministry of clerks. He means to build the schools by law rather than wait for the communes to do it."
 ITA_h_orlando_makes_italians: "The Ministry That Makes Italians"
 ITA_h_sacchi_and_the_extreme: "Sacchi and the Extreme Left"
 ITA_h_sacchi_and_the_extreme_desc: "The radicals sit in the cabinet now. They bring their votes with them, and they bring their quarrels too."
 ITA_h_sacchi_the_leagues_in_the_majority: "The Leagues in the Majority"
 ITA_h_sacchi_first_among_equals: "First Among Equals"
 ITA_h_salandra_and_the_right: "Salandra and the Right"
 ITA_h_salandra_and_the_right_desc: "The constitutional Right sits in the cabinet now. It will vote for anything that keeps the prefects busy, and it makes enemies on the Left doing it."
 ITA_h_salandra_the_prefects_deliver: "The Prefects Deliver"
 ITA_h_salandra_the_grey_eminence: "The Grey Eminence"
 ITA_h_treasury_initiative_modifier: "The Treasury Funds the Works"
 ITA_h_the_experimental_works: "The Experimental Works"
 ITA_h_the_interior_commands: "The Interior Commands"
 ITA_h_the_school_makes_italians: "The School Makes Italians"
 ITA_h_the_school_makes_italians_plain: "The Schools of the Kingdom"
 ITADNC_l_the_unredeemed_brothers: "The Unredeemed Brothers"
 ITADNC_l_the_unredeemed_brothers_desc: "Italians live under Austria in the Trentino and along the Adriatic, and Vienna polices them as a nuisance, dissolving their schools society every year. We will tell Vienna plainly that these lands are Italian and we mean to have them."
 ITADNC_l_the_price_of_article_seven: "The Price of Bosnia"
 ITADNC_l_the_price_of_article_seven_desc: "The seventh article of the Triple Alliance is plain: no ally takes Ottoman land without compensating the other. Vienna has taken Bosnia and offers us words. We will send the bill to Berlin and Vienna and name Dalmatia as the price."
 ITADNC_l_the_review_of_the_fleet: "The Review at Naples"
 ITADNC_l_the_review_of_the_fleet_desc: "The King took his oath with his father barely buried, and the country has watched him ever since. We will hold a review at Naples, the fleet in the bay and the army on the shore, so every officer sees who commands him."
 ITADNC_l_the_claims_of_the_risorgimento: "The Claims of Unity"
 ITADNC_l_the_claims_of_the_risorgimento_desc: "We paid for our unity with Nice and Savoy. Tens of thousands of Italians live under France in Tunis, and Malta is dropping our language. We will lay claim to all of it and send the note to Paris."
 ITADNC_l_the_verdict_of_adwa_reversed: "The Verdict of Adwa Reversed"
 ITADNC_l_the_verdict_of_adwa_reversed_desc: "Every dispatch from Africa has been read against Adwa, and the army and the country have never forgiven each other. Addis Ababa is ours now, and we will say so where the whole country can hear it."
 ITADNC_l_the_convention_with_san_marino: "A Treaty with San Marino"
 ITADNC_l_the_convention_with_san_marino_desc: "Our treaty of friendship with San Marino is due for renewal, and a railway from Rimini has sat in a drawer for years. We will renew the treaty, build the line, and open a works at the Romagna end."
 ITADNC_l_the_albanian_shore: "The Albanian Shore"
 ITADNC_l_the_albanian_shore_desc: "We have agreed with Vienna that neither of us will take the Albanian coast, and each reads the paper differently. Valona in foreign hands is a gun aimed at Brindisi. We will settle it with Vienna, not with the weak Porte."
 ITADNC_l_the_award_at_belgrade: "A Port for Serbia"
 ITADNC_l_the_award_at_belgrade_desc: "An Austrian customs war has been strangling Serbian trade for three years, and Serbia has no port of her own. We hold the coast that Vienna has lost. A port given freely will buy us a friend on the Danube for a generation."
 ITADNC_l_the_first_soldier: "The First Soldier of Italy"
 ITADNC_l_the_first_soldier_desc: "The Statuto gives the King command of the army and fleet, and he has stood at every manoeuvre since his accession. We will make that command plain, so the army answers to the Crown before the Chamber."
 ITADNC_l_the_award_at_cetinje: "The Balkan Award"
 ITADNC_l_the_award_at_cetinje_desc: "Montenegro is bound to us by Antivari, tobacco and a royal marriage, and Serbia and Greece have long awaited their share. We will pay our friends from what we take from the Porte, and the other powers will think less of them."
 ITADNC_l_the_fate_of_the_dual_monarchy: "After the Habsburgs"
 ITADNC_l_the_fate_of_the_dual_monarchy_desc: "Our foreign ministry keeps a drawer of papers on what follows the Habsburgs, and Vienna's talk of a Slav crown makes them all look likely. We will not leave the eastern Adriatic to whoever inherits the wreck."
 ITADNC_l_the_arbiter_of_the_nation: "The Arbiter of the Nation"
 ITADNC_l_the_arbiter_of_the_nation_desc: "Ministries come and go, and the Crown has settled every crisis by calling the man it wanted. Abroad we are received as a great power. The King already decides what Italy does, and we will say so plainly."
 ITADNC_l_the_claims_pressed: "The Claims Taken by Force"
 ITADNC_l_the_claims_pressed_desc: "Notes have gone to Paris and London and notes have come back, and the Chamber will not sit through another round. We will take Nice, Savoy, Monaco, Tunis and Malta from whoever holds them."
 ITADNC_l_the_italians_of_tunis: "The Italians of Tunis"
 ITADNC_l_the_italians_of_tunis_desc: "There are more Italians than Frenchmen in Tunis, with their own schools, hospital and chamber of commerce. We will work through them rather than against Paris, paying for their schools until the Regency expects us."
 ITADNC_l_the_fate_of_ottoman_europe: "The Albanian Demand"
 ITADNC_l_the_fate_of_ottoman_europe_desc: "The Porte cannot hold the Albanian lands, and our consuls have said so for years. We have a prince ready and a plan for a principality under our protection, and we will name our price before anyone else does."
 ITADNC_l_the_second_award_at_cetinje: "The Second Balkan Award"
 ITADNC_l_the_second_award_at_cetinje_desc: "Athens holds islands and districts our friends want, from a position it cannot defend. Montenegro and Serbia are owed a second payment, so we will put the demand to Athens and hand them what we do not keep."
 ITADNC_l_the_war_with_greece: "The War with Greece"
 ITADNC_l_the_war_with_greece_desc: "Greece is already at war, and a kingdom at war cannot defend two seas at once. Nothing we would have had to ask for in peace can be refused us now. We shall declare war on Athens and take the whole kingdom."
 ITADNC_l_the_schools_of_the_levant: "The Schools of the Levant"
 ITADNC_l_the_schools_of_the_levant_desc: "The Dante Alighieri society runs Italian schools across the Levant, yet France still claims to protect every Catholic mission there. We will take up that protection ourselves, and the coast will learn to read Italian."
 ITADNC_l_the_protectorate_over_greece: "The Protectorate over Greece"
 ITADNC_l_the_protectorate_over_greece_desc: "Greece has lost its islands and its northern province, and nobody answers its notes any more. We will leave Athens its King, its flag and its army list, and take everything else."
 ITA_l_the_rifles_are_counted_tt: "Our armies carry more than 40,000 rifles."
 ITA_l_the_ladder_opens_tt: "§YWe put our first demand to Vienna for the Italian lands it holds. Every demand after this one is built on it.§!"
 ITA_l_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_l_if_they_refuse_tt: "\n§YEffects if they refuse:§!"
 ITA_l_the_review_of_the_fleet_tt: "We hold more than two subject nations, or more than nine states beyond the Kingdom."
 ITA_l_the_first_soldier_tt: "We hold more than four subject nations, or more than 24 states beyond the Kingdom."
 ITA_l_the_arbiter_of_the_nation_tt: "We hold more than four subject nations, or more than 24 states beyond the Kingdom, and a great power has capitulated to us."
 ITA_l_the_verdict_of_adwa_reversed_tt: "Shewa and Tigray are held by us or by an ally."
 ITA_l_the_verdict_reversed_tt: "§GThe defeat at Adwa is answered, and the army and the country are reconciled.§!"
 ITA_l_unlock_influence_countries_tt: "§YWe may now work through our schools, our hospitals and our chambers of commerce abroad, and set our consuls to work from the Consulta.§!"
 ITA_l_the_severity_is_chosen_tt: "§YWe choose how much to ask of the Porte, and the world will judge us by what we ask.§!"
 ITA_l_vienna_refuses_tt: "§RWe keep the provinces, and the Italians of the realm lose some of what we had conceded them.§!"
 ITA_l_belgrade_holds_no_claim_tt: "We have no claim on the Adriatic states to withdraw, so we offer our friendship instead."
 ITA_l_blunders_tt: "§RThe Italian demand has been refused in public. Rome has now been rebuffed [?ITA_l_blunders|0] times.§!"
 ITA_l_the_principality_is_raised_tt: "§YAn Albanian principality is raised under Italian protection.§!"
 ITA_l_article_seven_threat: "Italy claims the Dalmatian coast"
 ITA_l_risorgimento_claims_threat: "Italy claims Nice, Savoy, Monaco, Tunis and Malta"
 ITA_l_albanian_shore_threat: "Italy raises the Albanian question with Vienna"
 ITA_l_end_of_the_monarchy: "Italy demands the end of Austria-Hungary"
 ITA_l_claims_pressed_threat: "Italy presses its western claims by force"
 ITA_l_second_award_threat: "Italy demands Greek islands and Epirus"
 ITA_l_the_provinces_are_ours: "Italy has taken the unredeemed provinces"
 ITA_l_the_whole_shore: "Italy demands the whole Albanian coast"
 ITA_l_the_albanian_principality: "Italy demands an Albanian principality"
 ITA_l_the_wing_over_cetinje: "Italy demands Albania and rewards Montenegro"
 ITA_l_the_verdict_reversed: "The Verdict Reversed"
 ITA_l_the_verdict_reversed_desc: "The defeat at Adwa has been answered, and the army has its name back. It trains harder and fights in better heart. Recruits come to the depots without being called twice, and the ministries have room to work."
 ITA_l_the_ally_stood_aside: "The Ally Stood Aside"
 ITA_l_the_ally_stood_aside_desc: "Germany let the Italian demand be presented and said nothing. The country is shaken, the regiments are less willing, and every ministry in Vienna now counts for less."
 ita_dnc.2400.t: "The Demand for the Provinces"
 ita_dnc.2400.d: "The Italian ambassador has read out a list of our provinces and called it a debt, not a request. He was careful to say that the alliance is dear to Rome, and that the list is not open to discussion.\n\nGiving them up would keep the treaty alive and hand a rival the eastern shore of the Adriatic. The ambassador is waiting on our answer."
 ita_dnc.2400.a: "Cede the provinces and keep the alliance."
 ita_dnc.2400.b: "Refuse. We do not sell our provinces."
 ita_dnc.2401.t: "Rome Brings Us Its Claim"
 ita_dnc.2401.d: "The Italians have brought their claim to us instead of to Vienna, whose provinces they want. They say we guaranteed the alliance, so it is for us to price it.\n\nVienna has not been consulted, and will read our answer in the newspapers. We must decide whether the alliance is worth an ally's provinces."
 ita_dnc.2401.a: "Let Rome have the provinces."
 ita_dnc.2401.b: "Stand by the guarantee and back Vienna."
 ita_dnc.2402.t: "The Provinces Are Ceded"
 ita_dnc.2402.d: "The papers were signed without ceremony. Our prefects were in Trieste before the crowds were, and bells have been rung in every city of the Kingdom.\n\nThe Chamber adjourned in the middle of a finance debate to cheer. Abroad the mood is colder, and every foreign ministry is asking what else we will decide is ours."
 ita_dnc.2402.a: "Take the provinces into the Kingdom."
 ita_dnc.2404.t: "Rome Demands Our Provinces"
 ita_dnc.2404.d: "The Italian note has arrived in the middle of our own civil war. It is addressed to whoever is judged to be governing.\n\nOur rivals will make what they can of any answer we give. Giving up the provinces would buy us quiet on one frontier while we settle the other."
 ita_dnc.2404.a: "Hand over the provinces. We have troubles enough at home."
 ita_dnc.2404.b: "Refuse. Not one village, not in this hour."
 ita_dnc.2405.t: "Rome Asks Us to Judge"
 ita_dnc.2405.d: "Rome has invoked the compensation clause of the alliance and asked us to judge it. We guarantee Vienna and hold the three of them together, so the quarrel comes to our door.\n\nThe Austrians took the Bosnian provinces without asking and have offered their partner nothing but courtesies. Standing aside would cost us Vienna's trust and keep the Italians in the alliance."
 ita_dnc.2405.a: "Stand aside. Vienna is on its own in this."
 ita_dnc.2405.b: "Back Vienna, and let Rome leave the alliance."
 ita_dnc.2406.t: "Berlin Drops Its Guarantee"
 ita_dnc.2406.d: "The Germans have refused to shelter Vienna in the Adriatic quarrel. The news reached us before it reached Vienna itself.\n\nThe Balkan settlement now has one guarantor fewer. We can take up the guarantee ourselves, or let two allies quarrel without us."
 ita_dnc.2406.a: "Guarantee Vienna, and speak for it in the Adriatic."
 ita_dnc.2406.b: "Stay out, and keep Rome's friendship."
 ita_dnc.2407.t: "Berlin Stands with Vienna"
 ita_dnc.2407.d: "The Germans have refused the Italian claim and put their weight behind Vienna. The alliance that faces us has closed ranks, and Rome has been left with nothing for its trouble.\n\nWe can offer the Italians our hand and try to pull them out of it. Or we can press the quarrel with Vienna instead."
 ita_dnc.2407.a: "Offer Rome our friendship."
 ita_dnc.2407.b: "Turn on Vienna. It is the greater danger."
 ita_dnc.2409.t: "The Demand for Dalmatia"
 ita_dnc.2409.d: "The compensation clause of the alliance has been read against us abroad, and the Italians have named their price in Dalmatian towns. Our guarantor has said nothing we can quote.\n\nPaying would keep the alliance and cut our coast in half. Refusing would leave an ally standing over us with a grievance and an army."
 ita_dnc.2409.a: "Refuse. We do not pay for Bosnia."
 ita_dnc.2409.b: "Give Rome its compensation in Dalmatia."
 ita_dnc.2409.c: "Yield the towns. We are in no position to refuse."
 ita_dnc.2411.t: "Rome Claims the Adriatic Towns"
 ita_dnc.2411.d: "The Italians have laid claim to the Adriatic towns, and they took the trouble to tell us before the newspapers did. The customs war with Vienna taught us how little our northern neighbour cares whether we eat.\n\nDropping our own claim would buy us a friend with a fleet. We have never held that coast for a day."
 ita_dnc.2411.a: "Drop our claim and take Rome's friendship."
 ita_dnc.2411.b: "Keep our claim. The coast is Serbian."
 ita_dnc.2415.t: "The Italians Give Us Budva"
 ita_dnc.2415.d: "An Italian note offers us Budva and its roadstead outright. There is no condition written into it, and none hinted at.\n\nOur merchants have been at the mercy of a neighbour's customs house for three years. Now we are handed a harbour by a great power that will expect to be remembered for it."
 ita_dnc.2415.a: "Take the port, and thank Rome for it."
 ita_dnc.2416.t: "Budva Given to the Serbs"
 ita_dnc.2416.d: "The Italians have handed Budva and its coast to the Serbs, and have made a ceremony of it. The town was ours in law, whatever army stood in it on the day.\n\nAnswering the insult would mean a quarrel with two neighbours at once. Saying nothing would tell the realm that our maps are worth nothing."
 ita_dnc.2416.a: "Protest to Rome, and mark it against Belgrade."
 ita_dnc.2416.b: "Say nothing. The coast was lost long before."
 ita_dnc.2420.t: "The Demand for the Succession"
 ita_dnc.2420.d: "The Italians no longer ask for provinces. They ask what is to be done with the realm when it ends, and they ask it while we are still governing.\n\nThe nationalities read the note before the ministers had finished it. Giving in would end the Monarchy on terms written in Rome."
 ita_dnc.2420.a: "Give in to the Italians."
 ita_dnc.2420.b: "Refuse. The Monarchy must stand."
 ita_dnc.2421.t: "What Replaces the Monarchy"
 ita_dnc.2421.d: "Vienna has conceded. The memoranda our foreign ministry has kept for years are open on the table.\n\nWhat replaces the Monarchy on the eastern shore is ours to draw. Every line we draw makes a friend or an enemy for a generation."
 ita_dnc.2421.a: "Raise Croatia alone as a client kingdom."
 ita_dnc.2421.b: "Partition the inheritance with Serbia."
 ita_dnc.2421.c: "Keep the whole Adriatic for the Kingdom."
 ita_dnc.2421.f: "Honour the promise made to Cetinje."
 ita_dnc.2421.e: "Raise Croatia and Slovenia as client kingdoms."
 ita_dnc.2423.t: "The Monarchy Must Stand"
 ita_dnc.2423.d: "We have refused the Italian note, and the refusal has been printed in every language of the realm. The regiments are steady, and the nationalities are watching to see what that steadiness costs us.\n\nWe can call the country to arms and answer the insult. Or we can buy the nationalities their quiet and be called weak for it."
 ita_dnc.2423.a: "Call the regiments to the colours."
 ita_dnc.2423.b: "Buy the nationalities their quiet."
 ita_dnc.2425.t: "The Italian Note on Tunis"
 ita_dnc.2425.d: "An Italian note claims the Regency of Tunis outright, and cites treaties older than our Protectorate there. 100,000 Italians live in the Regency, and they pay no attention to our schools.\n\nGiving up the Regency would cost us a province and keep the peace. Refusing would invite an Italian fleet into a sea we do not command alone."
 ita_dnc.2425.a: "Give up the Regency, and quickly."
 ita_dnc.2425.b: "Refuse, and let them try to take it."
 ita_dnc.2430.t: "The Albanian Coast"
 ita_dnc.2430.d: "Twice we signed with Rome that neither of us would take the Albanian coast. Rome has now denounced that agreement and asks us to stand aside while it settles the coast alone.\n\nThe Porte cannot hold that coast, and both of us have always known it. Letting Rome have it would keep the alliance and lose us the mouth of the Adriatic."
 ita_dnc.2430.a: "Stand aside. The agreement is not worth a war."
 ita_dnc.2430.b: "Refuse. The Adriatic is not Italy's to take."
 ita_dnc.2431.t: "Vienna Drops the Albanian Agreement"
 ita_dnc.2431.d: "Vienna has let go of its agreement with Rome over the Albanian coast, and told us so through a third party. The Adriatic is now open to whoever moves first.\n\nOnly one power on that sea has a fleet ready. Speaking for the Porte would put us in the way of a friend we have been courting."
 ita_dnc.2431.a: "Note our displeasure, but do not act alone."
 ita_dnc.2431.b: "Guarantee the Porte. The Adriatic is not a private lake."
 ita_dnc.2435.t: "Rome Gives Us Sjenica"
 ita_dnc.2435.d: "The Italians have taken the Sjenica district from the Porte, and are handing it to us. The note asks nothing in return.\n\nThe port concession at Antivari and the royal marriage have earned us more than we dared ask. A principality that lives on a tobacco monopoly is handed a province by a kingdom that will expect gratitude."
 ita_dnc.2435.a: "Take the district, and thank Rome for it."
 ita_dnc.2436.t: "Rome Gives Us Kosovo"
 ita_dnc.2436.d: "Rome has sent word that Kosovo and the Kacanik pass are to be handed to us. Our schoolmasters have written about those districts for a generation.\n\nThere is no condition in the note and no committee to sit on it. A kingdom without a coast is being paid in the one coin it has always wanted."
 ita_dnc.2436.a: "Take the districts, and thank Rome for them."
 ita_dnc.2437.t: "Italy Grants Us the Union"
 ita_dnc.2437.d: "The Italian government has written to say that what it took from the Porte on our side of the line is ours to keep.\n\nOur assembly voted for union and waited for the powers to notice. One of them has noticed, and has sent the deeds instead of a lecture."
 ita_dnc.2437.d_crete: "The Italian garrison at Canea is to be withdrawn, and Crete handed to us. The note is so short that the ministry read it twice.\n\nOur assembly proclaimed the union and was told to be patient. The one protecting power that wanted something in return has rewarded that patience."
 ita_dnc.2437.d_epirus: "Rome is handing us the Epirus districts our schoolmasters have counted for a generation. It took them from the Porte and gave them away in the same season.\n\nThere is no condition in the note. A power that wanted the Adriatic has decided our gratitude is worth more than a province."
 ita_dnc.2437.a: "Take the lands, and proclaim the union."
 ita_dnc.2440.t: "The Note on Albania"
 ita_dnc.2440.d: "The Porte cannot hold the Albanian lands, and our consuls have said so for a decade.\n\nWe can take the coast outright. We can raise an Albanian principality under our protection instead, and we can pay Montenegro a share for standing with us. The heavier the demand, the louder the powers will object."
 ita_dnc.2440.a: "Take the whole of the shore."
 ita_dnc.2440.b: "Raise a principality under our protection."
 ita_dnc.2440.c: "Raise the principality, and pay Montenegro its share."
 ita_dnc.2441.t: "Rome Demands the Albanian Coast"
 ita_dnc.2441.d: "The Italians demand the Albanian coast outright. There is no talk of autonomy in the note, and no offer of a price.\n\nOur garrisons there are paid late, and the mountain chiefs answer to nobody. Standing firm means a war in a province we barely govern."
 ita_dnc.2441.a: "Stand firm, and let them come."
 ita_dnc.2441.b: "Give up the coast. It will spare many lives."
 ita_dnc.2442.t: "Rome Proposes an Albanian Principality"
 ita_dnc.2442.d: "Rome proposes an Albanian principality under its own protection. It offers to leave the Sultan his title over the province.\n\nThe province has cost us more in garrisons than it has ever returned in taxes. Standing firm would keep the letter of our sovereignty and buy us a war."
 ita_dnc.2442.a: "Stand firm, and let them come."
 ita_dnc.2442.b: "Accept the principality. It will spare many lives."
 ita_dnc.2443.t: "Albania and Montenegro under Rome"
 ita_dnc.2443.d: "The Italian note asks for an Albanian principality under Rome's protection. It also asks us to recognise that Montenegro stands under the same protection.\n\nThat is our whole northern frontier settled by another power's pen. Standing firm means a war on a frontier we cannot supply."
 ita_dnc.2443.a: "Stand firm, and let them come."
 ita_dnc.2443.b: "Accept the terms. It will spare many lives."
 ita_dnc.2445.t: "What Montenegro Is to Get"
 ita_dnc.2445.d: "The note to Athens is drafted. The only question left is what Montenegro is to be paid out of it.\n\nA promise kept in the mountains is worth an army corps on that frontier for a generation. A promise broken leaves more in our own hands."
 ita_dnc.2445.a: "Promise Montenegro its share."
 ita_dnc.2445.b: "Keep everything we take."
 ita_dnc.2446.t: "Rome Demands the Islands and Epirus"
 ita_dnc.2446.d: "An Italian note claims the Aegean islands and Epirus. It was delivered with a squadron already at sea.\n\nOur army is spread over three frontiers, and our creditors sit in the same capitals as our friends. Refusing would cost us whatever that fleet decides to take."
 ita_dnc.2446.d_cetinje: "The Italian note claims the Aegean islands and Epirus. It says plainly that part of what is taken will be handed to Montenegro.\n\nOur army is spread over three frontiers. Yielding would buy peace and make a neighbour bigger than us."
 ita_dnc.2446.d_belgrade: "The Italian note claims the Aegean islands and Epirus. The Serbs have already been promised a portion of the settlement.\n\nOur army is spread over three frontiers, and our friends are counting their own gains. Yielding would cost us two provinces and buy us quiet."
 ita_dnc.2446.d_both: "The Italian note claims the Aegean islands and Epirus. Both our northern neighbours were promised a share before the note reached us.\n\nWe are being carved up by people who send us congratulations. Yielding would leave us a kingdom without a frontier."
 ita_dnc.2446.a: "Give up the islands and Epirus."
 ita_dnc.2446.b: "Refuse, and hold what is ours."
 ita_dnc.2447.t: "Rome Offers Us a Protectorate"
 ita_dnc.2447.d: "The Italians offer to leave us our King, our flag and our army list, and to take everything else.\n\nThe islands are gone and Epirus is gone. No power has answered our last three notes. Accepting would keep the throne and end the kingdom."
 ita_dnc.2447.a: "Accept the protectorate."
 ita_dnc.2447.b: "Refuse, whatever it costs."
 auh_dnc.2490.t: "A Demand Is Coming from Rome"
 auh_dnc.2490.d: "Our legation in Rome reports that the Italian foreign ministry has opened a file on our provinces. A note is being drawn up.\n\nWe have weeks, not months. Preparing openly would steady the army and give the ministry a free hand. It also tells every subject of the realm that the frontier is in question."
 auh_dnc.2490.a: "Prepare the country openly."
 ITADNC_l_the_bank_before_the_flag: "Tripoli by Treaty"
 ITADNC_l_the_bank_before_the_flag_desc: "The Porte stands in the way of our plans in Africa, and it is not too late to seek its friendship instead. We will offer Bosnia, taken from Vienna, in exchange for running the African shore. The Porte has sold Bosnia before."
 ITADNC_l_the_ultimatum_to_the_porte: "Tripoli or War"
 ITADNC_l_the_ultimatum_to_the_porte_desc: "Paris promised us Tripoli and London agreed, and that promise weakens every year. We will tell the Porte plainly: hand us the African shore or we take it. If the answer is no, the country must prepare for war."
 ITADNC_l_the_friendship_with_the_porte: "The Friendship of the Porte"
 ITADNC_l_the_friendship_with_the_porte_desc: "We have chosen trade over conquest, and the Porte should know what that is worth. We will sign the commercial convention it wants and promise support at the Straits, because a friend in Constantinople beats a war in the sand."
 ITADNC_l_the_sphere_between_the_colonies: "The Link Between Our Colonies"
 ITADNC_l_the_sphere_between_the_colonies_desc: "The powers reserved us a strip joining Eritrea to Somalia, and nobody has ever surveyed it. We will take the agreement to the Emperor and ask for the railway concession, because only Addis Ababa can grant it on the ground."
 ITADNC_l_the_understanding_with_the_neutrals: "Friends on the Frontier"
 ITADNC_l_the_understanding_with_the_neutrals_desc: "Switzerland, Monaco and San Marino sit on our frontier, and no power wants them armed. We will open our consulates and our purse to all of them, because an understanding costs less than an army corps."
 ITADNC_l_the_plan_against_the_ally: "The War Plan Against Vienna"
 ITADNC_l_the_plan_against_the_ally_desc: "With the Simplon open and the Gotthard convention signed, our staff has been studying the northern frontier. We will finish the war plan against Vienna and ask the Swiss, who already grant us transit, to march with us."
 ITADNC_l_the_landing_at_valona: "The Landing at Valona"
 ITADNC_l_the_landing_at_valona_desc: "Our navy has kept the Valona landing on file for years, and war with Vienna is the hour it was drawn for. We will take the bay and the mountain behind it, and its minerals will flow to our yards."
 ITADNC_l_the_pact_of_cartagena: "The Mediterranean Pact"
 ITADNC_l_the_pact_of_cartagena_desc: "London, Paris and Madrid have divided the Mediterranean among themselves and left our name off the paper. We will go to Madrid and ask for the missing signature, so no one in that sea moves without us."
 ITADNC_l_the_balearics: "The Balearics"
 ITADNC_l_the_balearics_desc: "Every naval paper we write puts the Balearics across our western route, and Madrid can neither fortify them nor let them go. We will take them, and the Canaries beyond the strait as well."
 ITADNC_l_the_war_with_vienna: "The War with Vienna"
 ITADNC_l_the_war_with_vienna_desc: "For years the Chamber has heard that the alliance is a leash and Trieste is Italian, and our staff already has the plan. We will be done with our ally and claim the city the alliance forbade us to name."
 ITADNC_l_the_concession_at_antivari: "Mines in Montenegro"
 ITADNC_l_the_concession_at_antivari_desc: "Our company holds the port of Antivari, our loan holds Montenegro, and the mountain behind is full of ore. We will ask for the mining rights and a shipyard, and a prince who owes us his budget can hardly refuse."
 ITADNC_l_the_league_of_the_adriatic: "The League of the Adriatic"
 ITADNC_l_the_league_of_the_adriatic_desc: "The Pig War has driven Serbia's trade into our market, and Tittoni has sketched a league of the eastern shore. We will offer Belgrade the friendship Petersburg never bothered to give. Serbia joins us, or we take the Adriatic from her."
 ITADNC_l_the_mandate_at_algeciras: "The Morocco Conference"
 ITADNC_l_the_mandate_at_algeciras_desc: "At the Morocco conference our delegation holds a vote Paris and Berlin both want. We will cast it with London and Paris and take our share of the bank and the police, holding by signature what we cannot hold by troops."
 ITADNC_l_the_share_of_morocco: "The Share of Morocco"
 ITADNC_l_the_share_of_morocco_desc: "Our notes with Paris traded Morocco for Tripolitania, and we have been paid in neither. We will offer the Sultan our protection and take our share. If Madrid wants to keep Ceuta, it may defend it."
 ITADNC_l_the_landing_on_the_dalmatian_shore: "The Dalmatian Landing"
 ITADNC_l_the_landing_on_the_dalmatian_shore_desc: "Our navy has rehearsed the eastern landing for years, and war with Vienna has opened the far shore. We will put our divisions across and hold the beaches until the army follows, with every specialist battalion we have."
 ITADNC_l_the_valleys_that_speak_italian: "The Valleys That Speak Italian"
 ITADNC_l_the_valleys_that_speak_italian_desc: "Beyond the lakes lie valleys whose schools, churches and newspapers are Italian while the flag is not, and Rome has always disowned those who say so. We will stop disowning them and claim the valleys, by force if need be."
 ITADNC_l_the_gold_of_the_lakes: "The Office of the Lakes"
 ITADNC_l_the_gold_of_the_lakes_desc: "Much of what our emigrants save crosses the Swiss border at Chiasso, and nobody in Rome knows who moves it. We will open an office on the lakes to read that traffic, and one of its clerks will work for us abroad."
 ITADNC_l_the_friendship_of_menelik: "The Friendship of Menelik"
 ITADNC_l_the_friendship_of_menelik_desc: "Our frontier conventions with Menelik settled our colonial borders without a shot. We will confirm every one and add a pact of non-aggression, and Addis Ababa will not be our enemy while it holds."
 ITADNC_l_the_road_to_addis: "The Road to Addis Ababa"
 ITADNC_l_the_road_to_addis_desc: "Paris disputes our railway concession to the highlands, and Menelik is old with no settled heir. We will offer Ethiopia our protection while it can still be offered, and take the road by force if Addis Ababa refuses."
 ITADNC_l_the_plan_for_the_aegean: "The Plan for the Aegean"
 ITADNC_l_the_plan_for_the_aegean_desc: "Our navy has planned for the islands for years, with the Porte holding the Dodecanese and Athens the rest. We will treat both as one operation, claim them all, and have the fleet ready before war makes it necessary."
 ITADNC_l_the_return_of_the_lands_of_savoy: "Nice and Savoy"
 ITADNC_l_the_return_of_the_lands_of_savoy_desc: "The plebiscites that gave Nice and Savoy to France have been called a fraud in our press ever since. We will take back the cradle of our dynasty and the birthplace of Garibaldi, and Paris and Monaco will be told, not asked."
 ITADNC_l_beyond_the_pillars: "The Ocean Fleet"
 ITADNC_l_beyond_the_pillars_desc: "Our fleet burns Welsh coal that passes under British guns at Gibraltar, Malta or Suez. We will break with London and build ships that can leave our own sea. It means war with Britain, but there is no other road to the ocean."
 ITADNC_l_the_italians_of_the_plate: "The Italians of Argentina"
 ITADNC_l_the_italians_of_the_plate_desc: "More Italians live along the River Plate than in half our provinces, and their debts are owed to European banks. We blockaded Venezuela alongside London and Berlin and were paid first, and we will use the same method on the Plate."
 ITADNC_l_the_leash_is_cut: "The Leash Is Cut"
 ITADNC_l_the_leash_is_cut_desc: "Gibraltar, Malta and Suez are the doors to our sea, and none of them is ours. The debate is over. We will order the fleet to plan and train as if the doors were already open, so our admirals learn the ocean before they cross it."
 ITADNC_l_the_governorships_beyond_the_sea: "The Colonial Governors"
 ITADNC_l_the_governorships_beyond_the_sea_desc: "Martini showed in Eritrea that a colony can be governed, not just garrisoned. Our colonial directorate now needs governorships, and we will create them for Tripolitania, Cyrenaica, the Horn and the islands."
 ita_dnc.2450.t: "Bosnia for Tripoli"
 ita_dnc.2450.d: "Rome offers a trade instead of an ultimatum. The Italians would hand back Bosnia and Trebinje, and take over the government of our African shore.\n\nWe would recover two provinces we had written off. The price is a coast we have held for centuries."
 ita_dnc.2450.a: "Take the trade. The provinces are worth more than the shore."
 ita_dnc.2450.b: "Refuse. We do not sell our own provinces."
 ita_dnc.2451.t: "The Bargain Is Struck"
 ita_dnc.2451.d: "The Porte has signed. Our commissioners give up what we held and claimed in the Balkans, and take up the government of Tripolitania and Cyrenaica.\n\nNeither government will call the exchange a defeat in public. We have the African shore, and we did not fire a shot for it."
 ita_dnc.2451.a: "Give up the Balkans and take the shore."
 ita_dnc.2452.t: "The Porte Will Not Trade"
 ita_dnc.2452.d: "Constantinople has read our offer and sent it back unopened. The provinces stay where they are, and the African shore stays Ottoman.\n\nThe foreign ministry has spent its credit for nothing. What we cannot buy we shall have to take."
 ita_dnc.2452.a: "Take Tripoli by force, then."
 ita_dnc.2455.t: "Tripoli or War"
 ita_dnc.2455.d: "The Italian ambassador has asked for the government of our African shore, and named the alternative aloud. Their army is mustered in the south and their fleet is coaled.\n\nWe can give up the province and keep the peace, or fight a great power for it."
 ita_dnc.2455.a: "Concede the shore. The peace is worth more."
 ita_dnc.2455.b: "Refuse. Tripoli stays Ottoman, and we will fight for it."
 ita_dnc.2456.t: "The Porte Concedes the Shore"
 ita_dnc.2456.d: "The concession has come back signed from Constantinople, and the governor has been told to receive our officials. Tripolitania and Cyrenaica are ours without a war.\n\nParis and London promised us the shore and then dreaded the war it would cost. Both are relieved. We give up our claim on the Dodecanese as the price."
 ita_dnc.2456.a: "Take the shore and give up the islands."
 ita_dnc.2457.t: "Tripoli Will Remain Trablus"
 ita_dnc.2457.d: "The Porte refuses, and refuses in public. Every pact we hold with Constantinople is void tonight, and a dozen capitals are reading our other signatures again.\n\nVienna, which claimed its share under the alliance, will not be sorry to see us stuck in the sand. The fleet is the only argument we have left."
 ita_dnc.2457.a: "Send the fleet. We take the shore by war."
 ita_dnc.2458.t: "One Battle at a Time"
 ita_dnc.2458.d: "We are fighting for the capital itself, and a second war on the African shore would finish us before the first is won.\n\nThe Italians ask for the coast and offer nothing but their silence. A government that cannot hold its own provinces is in no position to refuse anyone."
 ita_dnc.2458.a: "Give them the shore. We have one war already."
 ita_dnc.2460.t: "The Friendship of the Porte"
 ita_dnc.2460.d: "Rome has signed the commercial convention and promised us its support at the Straits. The note arrived with no condition attached to it.\n\nIt is the first paper from a European capital in years that asks us for nothing. The Sultan has ordered it acknowledged."
 ita_dnc.2460.a: "Acknowledge the note."
 ita_dnc.2460.b: "Acknowledge it, and wait to see what it is worth."
 ita_dnc.2465.t: "The Railway and the Customs"
 ita_dnc.2465.d: "The Italians have brought us the treaty the European powers signed about our country among themselves. Now they propose to make part of it real.\n\nA railway concession and a customs treaty would join their two colonies across our west. We would gain a railway. They would gain a road we cannot police."
 ita_dnc.2465.a: "Sign the concession. Let the line be built."
 ita_dnc.2465.b: "Refuse. Our west is not theirs to cross."
 ita_dnc.2470.t: "Rome Asks Where We Stand"
 ita_dnc.2470.d: "The Simplon tunnel is open and the convention is signed. The staff in Rome has finished a war plan that runs through our valleys, and says so openly.\n\nThe Italians ask which side of that plan we intend to stand on. Neutrality has never had to be answered so directly."
 ita_dnc.2470.a: "Join the Italian alliance."
 ita_dnc.2470.b: "Refuse. We will hold the valleys ourselves."
 ita_dnc.2475.t: "The Mining Rights at Antivari"
 ita_dnc.2475.d: "The Italian company already runs our port, and the Italian loan already carries our budget. Now Rome asks for the mines in the mountain behind both.\n\nThey offer us factories and a shipyard in exchange for the mining rights. We can take the works, or we can say no to a great power."
 ita_dnc.2475.a: "Refuse. The mountain is not for sale."
 ita_dnc.2475.b: "Sell the mining rights and take the works."
 ita_dnc.2480.t: "The League of the Adriatic"
 ita_dnc.2480.d: "Vienna has closed its market to our pigs and our plums, and the customs war is emptying the treasury. Rome has chosen this moment to offer us a place at its side.\n\nA league of the eastern shore would give us a port and a patron in one signature. Petersburg has promised much and sent little, and this offer will not come twice."
 ita_dnc.2480.a: "Accept, and join the Italian league."
 ita_dnc.2480.b: "Refuse. Belgrade will not be anyone's client."
 ita_dnc.2485.t: "Nice and Savoy Are Gone"
 ita_dnc.2485.d: "The Italian government has declared Savoy and the county of Nice to be Italian soil. Its troops did not wait for the declaration.\n\nThe votes that gave us both have been called a fraud in the Italian Chamber for a generation. There is nothing to answer here. The thing is done."
 ita_dnc.2485.a: "Send a note of protest."
 ita_dnc.2486.t: "Nice and Savoy Are Gone"
 ita_dnc.2486.d: "The Italian army has taken the county on our doorstep, and the flag over the old town of Nice has changed.\n\nOur frontier now runs against a kingdom that has just shown what it thinks of old settlements. The Prince was informed, not consulted."
 ita_dnc.2486.a: "Say nothing. We are small, and they are close."
 ita_dnc.2490.t: "Rome Collects on the Plate"
 ita_dnc.2490.d: "Rome is pressing its emigrants' debts on the river republics, with the same fleet it used off Venezuela. The tribunal at The Hague rewarded that method once already.\n\nOur doctrine says this hemisphere is not a collection agency. The Department asks whether we mean to say so aloud."
 ita_dnc.2490.a: "Take the matter to the tribunal at The Hague."
 ita_dnc.2490.b: "Say nothing. The river is not our quarrel."
 ita_dnc.2495.t: "Rome Offers Protection"
 ita_dnc.2495.d: "The Italian minister has offered our Emperor the protection of his King, and he did not soften the word protection.\n\nThe powers around us have already divided the map in their own capitals, and this is the first to say so to our face. Accept, and the throne stands while Rome speaks for us abroad. Refuse, and we wait for the column that comes up from Eritrea."
 ita_dnc.2495.a: "Accept the protection of the Italian King."
 ita_dnc.2495.b: "Refuse. We are nobody's province."
 ITA_l_the_capital_answers_tt: "§YAddis Ababa will answer.§!"
 ITA_l_the_bank_renounces_tt: "We hold nothing in the Balkans the Porte would call its own, so there is nothing to hand over. Our claims on Bosnia and on Trebinje are withdrawn instead."
 ITA_l_valona_tt: "While we hold Albania, the mine sends chromium and aluminium to our yards. Every sixth shipment builds a civilian factory offshore, up to 4 in all, and losing Albania loses them."
 ITA_l_valona_tt_complete: "The mine has sent §Y[?ITA_l_valona_shipments|0]§! shipments since the last factory, and has paid for §Y[?ITA_l_valona_civs|0]§! factories in all."
 ITA_l_the_far_shore_tt: "The landing takes every specialist battalion we have, and nothing else will get them for six months."
 ITA_l_the_operator_of_the_lakes_tt: "The new office produces an operative for our intelligence agency."
 ITA_l_the_pillars_dockyards_tt: "In up to [?ITA_l_max_states_for_dockyards|0] of our coastal states in Europe, 1 military factory comes down and 2 dockyards go up in its place."
 ITA_l_the_plate_tt: "§Y[?ITA_l_plate_countries^num]§! republics of the Plate are on our books, and our banks and schools there add to our weight every few months."
 ITA_l_the_plate_trigger_tt: "At least one republic of the Plate exists outside our faction"
 ITA_l_beyond_the_pillars_trigger_tt: "No major power at war with us still holds a coast in Europe or Africa"
 ITA_l_the_sphere_granted_tt: "Addis Ababa grants the concession, and our two colonies are joined on paper at last."
 ITA_l_the_court_is_seized_tt: "Washington takes the debts to the tribunal at The Hague, and our collectors on the river work under its eye."
 ITA_l_the_ultimatum_to_the_porte: "The Ultimatum to the Porte"
 ITA_l_war_with_vienna_threat: "The War with Vienna"
 ITA_l_the_lands_of_savoy_threat: "Italy takes Nice and Savoy"
 the_landing_at_valona: "The Landing at Valona"
 ITA_l_the_sphere_agreement: "The Railway and the Customs"
 ITA_l_the_sphere_agreement_desc: "The railway between the two Italian colonies is surveyed at last, and it crosses our country. The customs houses along it answer to Rome as much as to us, and Italian buyers pay less for what we sell."
 ITA_l_the_act_of_algeciras: "The Morocco Agreement"
 ITA_l_antivari_agreement: "The Antivari Agreement"
 ITA_l_naval_operation_idea: "The Balearic Landing"
 ITA_l_alpine_operation_ns: "The Alpine Operation"
 ITA_l_dalmatian_landing_ns: "The Dalmatian Landing"
 ITA_l_dalmatian_landing_ns_desc: "Every specialist battalion in the kingdom is aboard a transport or waiting for one. The fleet can put more of them ashore at once, and nothing else will get them until the far shore is held."
 ITA_l_the_office_of_the_lakes: "The Office of the Lakes"
 ITA_l_the_office_of_the_lakes_desc: "A small office at Chiasso reads the money that crosses into Switzerland. The same clerks read the telegrams, so we break other people's codes faster and less of our own money leaves."
 ITA_l_the_leash_broken: "The Leash Broken"
 ITA_l_the_leash_broken_desc: "The coal contract is no longer the first article of our naval policy. The yards of the inner sea are being cut over to ocean work. The men who used to sign for Welsh colliers are signing for hulls, and our trading partners think less of us for it."
 ITA_l_leash_cut_ns: "The Fleet Looks Outward"
 ITADNC_o_break_the_chamber: "Break the Chamber"
 ITADNC_o_break_the_chamber_desc: "The opposition means to paralyse the Chamber until the ministry falls. We will send the deputies home and govern by the Statuto with the army behind us, and half the country is already arming against it."
 ITADNC_o_secure_the_new_order: "Secure the New Order"
 ITADNC_o_secure_the_new_order_desc: "The fighting is over, and the men who called themselves the legal government are in prison or abroad. We will keep the labour chambers under watch and the decrees in force, and buy the Crown some time."
 ITADNC_o_the_statuto_alone: "The Charter Alone"
 ITADNC_o_the_statuto_alone_desc: "The Statuto gives the King the power to make war, sign treaties and choose ministers, and the Chamber has borrowed all three for generations. We will govern by the charter as written and keep out of other people's quarrels."
 ITADNC_o_recall_the_chamber: "Recall the Chamber"
 ITADNC_o_recall_the_chamber_desc: "The country will not be held down by prefects forever, and the Crown does not want to be Europe's last royal house ruling by decree. We will recall the deputies, hold elections and let the ministry answer to them again."
 ITADNC_o_vienna_confirms_the_crown: "Vienna Confirms the Crown"
 ITADNC_o_vienna_confirms_the_crown_desc: "A government born of a coup is one our alliance may refuse, and that alliance is our only cover in the north. We will ask Vienna to renew with us as we are, and if it agrees, no cabinet will question the King's right again."
 ITADNC_o_rebuild_the_kingdom: "Rebuild the Kingdom"
 ITADNC_o_rebuild_the_kingdom_desc: "The mills are cold, the harvest was left standing, and the roads still carry soldiers instead of goods. We will put the country back to work first and spend everything the treasury can spare on repairing what the fighting broke."
 ITADNC_o_the_army_of_the_king: "The Army of the King"
 ITADNC_o_the_army_of_the_king_desc: "The regiments that held the streets did not do it for a ministry. We will bind the army to the person of the King, so the barracks fill again and the next crisis finds the regiments already sworn."
 ITADNC_o_a_greater_and_better_italy: "Build Up the South"
 ITADNC_o_a_greater_and_better_italy_desc: "The South sent its sons to the barricades and its taxes to Rome, and got a prefect in return. We will take the special laws for the South out of the drawer, drain the land and build aqueducts, so the State is more than a tax collector."
 ITADNC_o_the_bulwark_of_latinity: "Guardian of the Latin Name"
 ITADNC_o_the_bulwark_of_latinity_desc: "Beyond the Isonzo our language is taught only on sufferance, and students broke up the Italian law faculty at Innsbruck. We will declare that Italy stands behind every Italian school abroad, and [AUH.GetNameDef] will understand."
 ita_dnc.2500.t: "The Chamber Is Sent Home"
 ita_dnc.2500.d: "The decree was read to a chamber the Carabinieri had already cleared. The deputies who would not leave were carried down the steps.\n\nThe prefects hold the telegraph and the garrisons hold the streets. In the north the opposition has named a government of its own: the kingdom has two governments and one army between them."
 ita_dnc.2500.a: "Hold Rome. The King stays at the Quirinal."
 ita_dnc.2510.t: "Rome Asks for Recognition"
 ita_dnc.2510.d: "The ministry that governs in Rome was put there by a decree and a regiment, and it now asks the alliance to call it the kingdom.\n\nOur ambassador writes that the King signs what the generals bring him, and that the Chamber is shut. Renewing with such a government means answering for whatever it does next."
 ita_dnc.2510.a: "Renew the alliance. The King is still the King."
 ita_dnc.2510.b: "Refuse to renew with a government of generals."
 ita_dnc.2510.c: "Ask Berlin to judge before we answer."
 ita_dnc.2511.t: "The Crown Is Not Confirmed"
 ita_dnc.2511.d: "Vienna will not put its name to a government of generals. The alliance has lapsed with the answer, and our northern frontier is open.\n\nWe can march for the Trentino and the South Tyrol and settle the question ourselves. Or the King can take back, in his own name, the power we have been using for him."
 ita_dnc.2511.a: "March for the Trentino and the South Tyrol."
 ita_dnc.2511.b: "Stand down, and let the King govern in his own name."
 ita_dnc.2512.t: "Vienna Asks Berlin to Judge"
 ita_dnc.2512.d: "Vienna has been asked to recognise a government that no election made, and would rather not decide it alone.\n\nThe Italians are our ally on paper, and they watch passes we would otherwise have to garrison. A word from us keeps them in the alliance. Silence sends them out of it."
 ita_dnc.2512.a: "Tell Vienna to renew."
 ita_dnc.2512.b: "Say nothing. This is Vienna's affair."
 ITA_o_the_house_is_sent_home_tt: "§YThe Chamber is dissolved and the prefects govern by decree.§! The half of the country that will not accept it takes up arms."
 ITA_o_the_prefects_answer_tt: "§YThe standing of the prefects§! rises sharply: the decrees put every province in their hands."
 ITA_o_the_kingdom_restored_tt: "§YThe kingdom takes back its older name, and the Historical Right takes the government.§!"
 ITA_o_constitutional_kingdom_tt: "§YThe kingdom is named for the charter it has just honoured, and the Liberal Union takes the government.§!"
 ITA_o_if_vienna_confirms_tt: "\n§YEffects if Vienna confirms the crown:§!"
 ITA_o_tt_the_capital_answers: "Vienna will answer, and the answer decides whether the alliance still covers us."
 ITA_o_vienna_trust_tt: "§YConfidence at Vienna§! rises: the ally has put in writing what our own Chamber would not."
 ITA_o_the_king_resumes_tt: "The generals stand down, and the King governs in his own name."
 ITA_o_the_bulwark_of_latinity_tt: "§RThis national spirit stops working while we stand in a faction with [AUH.GetNameDef], or fight a war at its side.§!"
 ITA_o_threat_the_chamber: "The Coup Against the Italian Chamber"
 ITA_o_threat_the_statuto: "The Italian Return to the Statuto"
 ITA_o_threat_the_crown_denied: "The Italian Claim on the Unredeemed Provinces"
 ITA_o_the_royal_decrees: "The Royal Decrees"
 ITA_o_the_royal_decrees_desc: "The public safety law the Chamber refused stands by decree, and the prefects hold every power it gives them. Nothing has been withdrawn, and nothing is going to be."
 ITA_o_clamp_down_on_the_leagues: "Clamp Down on the Leagues"
 ITA_o_clamp_down_on_the_leagues_desc: "The chambers of labour are watched, their funds are audited and their meetings need a permit. The order is temporary in law and permanent in practice."
 ITA_o_the_statuto_alone: "The Charter Alone"
 ITA_o_the_statuto_alone_desc: "The King makes the treaties and names the ministers, as the charter always said he might. A kingdom that answers to no assembly has little to gain from other people's quarrels."
 ITA_o_recall_the_chamber: "The Chamber Recalled"
 ITA_o_recall_the_chamber_desc: "The deputies sit again, and the decrees are read to them before they are signed. The habit of government by prefect takes longer to lose than it took to acquire."
 ITA_o_rebuild_the_kingdom: "Rebuild the Kingdom"
 ITA_o_rebuild_the_kingdom_desc: "Everything the treasury can spare goes to the mills, the fields and the roads, and the shops are empty of everything else."
 ITA_o_national_revival: "National Revival"
 ITA_o_national_revival_desc: "The country is repairing what the fighting broke, and the work is going faster than the ministry promised."
 ITA_o_national_revival2_desc: "The country is repairing what the fighting broke, and the barracks are filling again with men who came for the wage."
 ITA_o_national_revival3_desc: "The country is repairing what the fighting broke, and the South is being built for the first time rather than policed."
 ITA_o_national_revival4_desc: "The country is repairing what the fighting broke, the barracks are full and the South is being built at last. The kingdom is stronger than the one that went into the quarrel."
 ITA_o_the_bulwark_of_latinity: "Guardian of the Latin Name"
 ITA_o_the_bulwark_of_latinity_desc: "The kingdom stands openly behind every Italian school from the Alps to the Levant. The societies that teach our language abroad no longer have to work in secret."
 ITA_o_the_alliance_confirms_us: "The Alliance Confirms Us"
 ITA_o_the_alliance_confirms_us_desc: "The ally has recognised the government the Chamber would not, and no cabinet in Europe now asks by what right the King governs."
 ITADNC_o_the_true_enemy_is_the_west: "Our True Enemy Is France"
 ITADNC_o_the_true_enemy_is_the_west_desc: "France took Tunis from under us, and we never answered. Our quarrel is not in the Alps but on the African shore, and we will tell the country so."
 ITADNC_o_expel_the_subversives: "Expel the Subversives"
 ITADNC_o_expel_the_subversives_desc: "The exceptional laws are on the books, and every agitator is known to his prefect. We shall put them across the frontier by the trainload. Berne and Paris can decide for themselves what to do with the men we send them."
 ITADNC_o_see_to_the_alpine_front: "See to the Alpine Front"
 ITADNC_o_see_to_the_alpine_front_desc: "The Trentino salient hangs over Venetia, and the barrier forts of the Astico and the Agno are rising against it. We shall put concrete on every border province from Piedmont to Venetia, and lay our claim to the salient itself."
 ITADNC_o_rebuild_the_battle_fleet: "Rebuild the Battle Fleet"
 ITADNC_o_rebuild_the_battle_fleet_desc: "Colonel Cuniberti has drawn the all-big-gun battleship, and a foreign navy has read him more carefully than our own. We shall widen the slipways and lay the programme down before the design is taken from us."
 ITADNC_o_accept_the_mastery_of_the_sea: "Accept British Sea Power"
 ITADNC_o_accept_the_mastery_of_the_sea_desc: "Our coasts are open, our coal comes from Cardiff and our bread crosses water we do not control. We shall concede the sea to Britain, and spend on factories what we would have sunk in armour."
 ITADNC_o_safeguard_the_adriatic_shore: "Safeguard the Adriatic Shore"
 ITADNC_o_safeguard_the_adriatic_shore_desc: "The understandings with Vienna promised that no great power would take the eastern shore, and Vienna has begun to forget them. We shall offer our guarantee to Montenegro, Serbia and Greece before someone else offers them a garrison."
 ITADNC_o_a_place_in_the_sun: "A Place in the Sun"
 ITADNC_o_a_place_in_the_sun_desc: "Enrico Corradini writes that we are a proletarian nation, and the country reads him aloud. We shall ask for a bay on the China coast and a coaling station in it, as any other power would. We shall also remember the answer we are given."
 ITADNC_o_an_alliance_with_the_shadow: "An Alliance with Britain"
 ITADNC_o_an_alliance_with_the_shadow_desc: "We cannot take the sea from Britain, and we have said so. We shall ask London for a place in her alliance rather than stand against her."
 ITADNC_o_the_shore_at_antivari: "The Montenegrin Shore"
 ITADNC_o_the_shore_at_antivari_desc: "The company at Antivari flies our flag, our subsidies keep Cetinje solvent, and our Queen was born on that shore. We shall guarantee the principality and build it the works that make a guarantee worth having."
 ITADNC_o_the_trentino_for_a_guarantee: "The Trentino for a Guarantee"
 ITADNC_o_the_trentino_for_a_guarantee_desc: "Article 7 of the alliance was written so that neither ally could move in the Balkans without paying the other. We shall name the price in plain words. Vienna hands us the Trentino, and we sign for whatever it wants in the east."
 ITADNC_o_the_pride_of_the_new_italy: "The Pride of the Yards"
 ITADNC_o_the_pride_of_the_new_italy_desc: "The armour rolled at Terni equals any in Europe, and the triple turret was our idea first. We cannot win by counting hulls against richer yards, so we will widen more slipways and build ships no other navy can match."
 ITADNC_o_the_latin_understanding: "The Latin Understanding"
 ITADNC_o_the_latin_understanding_desc: "The Mediterranean agreements lapsed long ago, and every foreign minister since has failed to revive them. We will offer the pact to Madrid, Lisbon, Athens, Belgrade, Cetinje and Paris at once and let each answer for itself."
 ITADNC_o_the_day_the_coal_stops: "Water Power in the Alps"
 ITADNC_o_the_day_the_coal_stops_desc: "Every furnace in the north burns coal shipped from Cardiff, and every winter reminds the Chamber of it. We will put the Alpine rivers to work, because water power is free once the dams are built and no blockade can stop it."
 ITADNC_o_the_latin_league: "The Latin League"
 ITADNC_o_the_latin_league_desc: "The Mediterranean agreements once bound Rome, London and Madrid together, and Spain signed them last of all. We shall raise a league of our own in this sea, and send the invitation to Madrid, Lisbon, Athens and Cetinje."
 ITADNC_o_a_free_hand_in_tunis: "A Free Hand in Tunis"
 ITADNC_o_a_free_hand_in_tunis_desc: "More Italians than Frenchmen live in Tunis, and Paris is in no state to argue. Our people there were denied any status when the protectorate began. We will claim Tunis and take it from whoever holds it."
 ITADNC_o_the_military_convention: "The Military Convention"
 ITADNC_o_the_military_convention_desc: "Cosenz once promised our allies an army on the Rhine, and every chief of staff since has renewed it only on paper. We will turn that understanding into a signed convention with the divisions counted and the timetables agreed."
 ITADNC_o_break_the_mediterranean_condominium: "Break Anglo-French Rule"
 ITADNC_o_break_the_mediterranean_condominium_desc: "Malta's courts dropped our language by decree, Kassala was given away without asking us, and France took Nice and Savoy. Britain and France hold our sea between them, and we will break that hold."
 ITADNC_o_the_conspiracy_at_belgrade: "The Conspiracy at Belgrade"
 ITADNC_o_the_conspiracy_at_belgrade_desc: "A circle of Serbian officers is tired of a dynasty that takes orders from Vienna. We will give them money and keep their names quiet, because if the palace hears first, they will never move."
 ITADNC_o_rekindle_the_iberian_union: "Rekindle the Iberian Union"
 ITADNC_o_rekindle_the_iberian_union_desc: "The idea of a single Iberian state still lives among the federalists of Madrid and the republicans of Lisbon. It has never found a patron. We shall be that patron, and leave the two crowns to decide what to do with the idea."
 ITADNC_o_the_hour_of_vienna: "The Trentino While Vienna Fights"
 ITADNC_o_the_hour_of_vienna_desc: "Conrad, the Austrian chief of staff, has asked his Emperor for a war against us in every memorandum he writes. He will get it one day. The moment Vienna is fighting somebody else, we shall take the Trentino."
 ITADNC_o_the_corniche: "The Road Through Monaco"
 ITADNC_o_the_corniche_desc: "The coast road from Ventimiglia to Nice runs through Monaco. The forts in the mountains above it close every other pass. We shall take the road, and Monaco with it."
 ITADNC_o_the_night_of_the_konak: "The Coup in Belgrade"
 ITADNC_o_the_night_of_the_konak_desc: "The old palace in Belgrade has one door that is never watched, and the officers of the guard are our friends. On the night we choose, Serbia will wake to a new dynasty. Belgrade will leave Vienna and come over to us."
 ITADNC_o_through_the_valais: "The Road Through Switzerland"
 ITADNC_o_through_the_valais_desc: "The Simplon tunnel is bored and the Gotthard railway agreement is signed. The only road round the French Alps runs through Switzerland. We shall use that road, whatever Bern says about its neutrality."
 ITADNC_o_the_last_shore: "The Shore at Valona"
 ITADNC_o_the_last_shore_desc: "Valona stands at the mouth of the Adriatic. Whoever holds it can shut our sea against us whenever he pleases. We shall claim Valona and the coast around it, and take it from whoever holds it."
 ITADNC_o_reinstate_the_lost_provinces: "Take Back Nice and Savoy"
 ITADNC_o_reinstate_the_lost_provinces_desc: "The county of Nice and the duchy of Savoy were signed away at Turin. A vote was held afterwards, and nobody has ever believed it. We shall take both back into the kingdom, and they will carry their Italian names again."
 ita_dnc.2515.t: "The Exiles at the Border"
 ita_dnc.2515.d: "Rome has emptied its gaols of agitators and put them on trains to our frontier. Their papers are in order and we cannot turn them back at the gate.\n\nOur police say the men are dangerous. Our liberals say a free country does not hand refugees over. We must decide before the next train comes in."
 ita_dnc.2515.a: "Let them stay. We are not Rome's gaoler."
 ita_dnc.2515.b: "Watch them for Rome, and pay for the police it takes."
 ita_dnc.2518.t: "The Demand for San Mun"
 ita_dnc.2518.d: "An Italian squadron is lying off the bay. The minister has handed us a note asking for a lease, a coaling station and a customs house.\n\nThe note is polite and carries no ultimatum. Every concession we have ever granted began the same way. We must answer it."
 ita_dnc.2518.a: "Grant the lease, and keep the peace with Rome."
 ita_dnc.2518.b: "Refuse the note. The coast is not for sale."
 ita_dnc.2520.t: "Rome Offers a Guarantee"
 ita_dnc.2520.d: "The Italian minister has offered his government's guarantee against any power that moves on this coast. He has named no price for it.\n\nIf we take it, Rome answers for our safety and we answer to Rome. The court must decide before the offer reaches the newspapers."
 ita_dnc.2520.a: "Accept the guarantee from Rome."
 ita_dnc.2520.b: "Refuse the guarantee. We will answer for ourselves."
 ita_dnc.2528.t: "Rome Asks for the Trentino"
 ita_dnc.2528.d: "Rome asks for the Trentino by name. In exchange she offers her signature on the alliance and a guarantee of our southern frontier.\n\nThe General Staff says the ground is worth two corps in any war against Italy. The foreign minister says an unsatisfied ally costs us more than the ground. We must choose."
 ita_dnc.2528.a: "Hand over the Trentino, and keep the ally satisfied."
 ita_dnc.2528.b: "Refuse. Not one village of the Empire goes to Rome."
 ita_dnc.2530.t: "Rome Proposes a Latin Pact"
 ita_dnc.2530.d: "Rome proposes a standing understanding among the Latin powers. Each of us would consult the others before moving, and none of us would bargain separately with the great powers.\n\nNo arms are promised and no money is asked. What Rome gains is the right to speak first, and we must say whether she may have it."
 ita_dnc.2530.a: "Join the understanding, and let Rome speak first."
 ita_dnc.2530.b: "Stay out of it, and keep our own counsel."
 ita_dnc.2548.t: "The Iberian Union"
 ita_dnc.2548.d: "The government across the border has voted for union and asks only that we agree. The two crowns would become one, the armies would be merged, and the peninsula would answer Europe with a single voice.\n\nOur own state would cease to exist. Our ministers are divided and the court has said nothing."
 ita_dnc.2548.a: "Accept the union, and let our crown pass to theirs."
 ita_dnc.2548.b: "Refuse the union, and keep our own crown."
 ITA_o_the_capitals_answer_tt: "§YBern and Paris will each decide what to do with the men we have expelled.§!"
 ITA_o_the_sbarramenti_tt: "Builds §Yland forts to level 2§! on every border province of Piedmont, Lombardy and Venetia."
 ITA_o_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_o_the_three_answer_tt: "§YMontenegro, Serbia and Greece each answer for themselves.§!"
 ITA_o_the_capital_answers_tt: "§YThe power that holds the bay will send us its answer.§!"
 ITA_o_the_antivari_yards_tt: "§YBuilds 1 civilian factory in Montenegro, and adds the building slot to hold it.§!"
 ITA_o_the_latin_understanding_tt: "§YParis, Madrid, Lisbon, Athens, Belgrade and Cetinje are each asked to join.§!"
 ITA_o_the_military_convention_tt: "§YEvery member of our faction is pressed to hold to the alliance with us.§!"
 ITA_o_the_conspiracy_is_watched_tt: "§RBelgrade has heard of the conspiracy, and the officers will not move.§!"
 ITA_o_the_officers_are_ours_tt: "§YIf the palace has heard nothing, the officers are ours and Serbia turns towards us.§!"
 ITA_o_the_iberian_union_opens_tt: "§YMadrid and Lisbon may now decide between themselves to refound the union.§!"
 ITA_o_the_night_of_the_konak_tt: "§YBelgrade turns away from Vienna, and joins our faction if we lead one.§!"
 ITA_o_the_statuto_alone2: "The Charter Alone"
 ITA_o_the_statuto_alone2_desc: "The Statuto, the kingdom's constitution, is read to mean that the King governs through his own ministers. The Chamber is not consulted.\n\nThe prefects know whom they answer to. Orders go out quickly and the country is quiet, but it is not content."
 ITA_o_the_naval_programme: "The Naval Programme"
 ITA_o_the_naval_programme_desc: "The slipways at Castellammare and La Spezia have been laid out for hulls larger than any we have built.\n\nThe yards work faster now, and a battleship costs us less than it did."
 ITA_o_the_mastery_of_the_sea: "The Naval Estimates Cut"
 ITA_o_the_mastery_of_the_sea_desc: "The naval estimates have been cut and the money has gone to the mills instead. The factories run fuller and the country pays less for its own goods.\n\nThe yards are the ones that pay for it. They are turning out a fifth less than they did."
 ITA_o_the_white_coal: "The Alpine Power Stations"
 ITA_o_the_white_coal_desc: "The alpine torrents turn the dynamos of the north, and the north now lights and heats itself without coal.\n\nEvery household bill falls. A blockade would still hurt us, but it would no longer stop the country."
 ITA_o_the_military_convention: "The Military Convention"
 ITA_o_the_military_convention_desc: "The staffs have exchanged their mobilisation tables, and the railway timetables of the allies now agree with one another.\n\nOur divisions hold together better and our staff work is quicker. Joining a faction now alarms Europe less."
 ITA_o_the_subversives_abroad: "The Subversives from Italy"
 ITA_o_the_subversives_abroad_desc: "The Italian exiles Rome expelled have settled in our cities. They have brought their newspapers and their unions with them.\n\nThey work cheap and they argue loud. The socialists are gaining, the country is less settled, and there are more hands for the army."
 ITA_o_the_adriatic_guarantee: "The Guarantee from Rome"
 ITA_o_the_adriatic_guarantee_desc: "Rome has given her word against any power that moves on this coast.\n\nThe court is steadier, the army is steadier, and fewer people here want to take sides in anyone else's quarrel."
 ITA_o_industrial_support: "Italian Industrial Support"
 ITA_o_industrial_support_desc: "Italian engineers and Italian money are at work here, and the works they have built are ours to use.\n\nThe factories turn out more than they did, and new arms works go up faster."
 ITA_o_the_iberian_idea: "The Iberian Idea"
 ITA_o_the_iberian_idea_desc: "The old idea of one Iberian state is being printed again, and somebody abroad is paying for the paper.\n\nThe federalists have found a patron. The crown has noticed, and the country is harder to hold together."
 ITA_o_the_latin_league_faction: "Latin League"
 ITA_o_threat_the_true_enemy_is_the_west: "Italy has named the western powers its enemy"
 ITA_o_threat_expel_the_subversives: "Italy has expelled its agitators across the frontier"
 ITA_o_threat_the_alpine_front: "Italy is fortifying the alpine frontier"
 ITA_o_threat_a_place_in_the_sun: "Italy has demanded a bay on the China coast"
 ITA_o_threat_the_trentino_for_a_guarantee: "Italy has asked Vienna for the Trentino"
 ITA_o_threat_the_latin_understanding: "Italy has proposed a Latin understanding"
 ITA_o_threat_the_latin_league: "Italy has founded the Latin League"
 ITA_o_threat_a_free_hand_in_tunis: "Italy has claimed the Regency of Tunis"
 ITA_o_threat_the_military_convention: "Italy has signed a military convention"
 ITA_o_threat_break_the_mediterranean_condominium: "Italy has moved against Britain and France"
 ITA_o_threat_the_hour_of_vienna: "Italy has turned on Vienna"
 ITA_o_threat_the_corniche: "Italy has marched on Monaco"
 ITA_o_threat_the_night_of_the_konak: "Italy has changed the dynasty in Belgrade"
 ITA_o_threat_through_the_valais: "Italy has marched into Switzerland"
 ITA_o_threat_the_last_shore: "Italy has claimed Valona and the Albanian shore"
 ITADNC_o_the_king_reigns_and_does_not_govern: "The King Will Not Govern"
 ITADNC_o_the_king_reigns_and_does_not_govern_desc: "The new reign has taken the Statuto at its word, and the ministry that ended the reaction was a bargain between Crown and Chamber. We will make that bargain the rule: the King reigns, and the elected govern."
 ITADNC_o_marconi_recalled: "Marconi Recalled"
 ITADNC_o_marconi_recalled_desc: "Our Post Office sent Guglielmo Marconi away, and London paid for the wireless that the trials off La Spezia had already proved. We shall bring him home and build him a laboratory. The next Italian invention is to be patented here."
 ITADNC_o_the_menace_from_the_alps: "The Press Campaign Against Vienna"
 ITADNC_o_the_menace_from_the_alps_desc: "Vienna has taken a province without asking Europe, and the railway she means to drive south will end on our own sea. We shall put the whole affair in every paper in Italy, and let the smaller courts read what kind of friend she is."
 ITADNC_o_the_adriatic_league: "The Adriatic League"
 ITADNC_o_the_adriatic_league_desc: "The Serbs want a railway from the Danube to our coast. Vienna wants one driven south to the same sea. Every small state between them is looking for a patron. We shall be that patron, and gather them into a league of our own."
 ITADNC_o_the_danubian_membership: "The Danubian Membership"
 ITADNC_o_the_danubian_membership_desc: "Bucharest sells us her wheat. Athens has given us a seat on her financial commission. We recognised Sofia's independence without waiting for Vienna to do it first. We shall ask all three to sit in the league with us."
 ITADNC_o_the_alpine_membership: "The Alpine Membership"
 ITADNC_o_the_alpine_membership_desc: "Bern and Monaco strike the same coin we do. The tunnel under the Simplon was paid for in part out of our own budget. We shall ask the mountain states to sit with us, and keep the trade of the Alps in Latin hands rather than German ones."
 ITADNC_o_the_iberian_membership: "The Iberian Membership"
 ITADNC_o_the_iberian_membership_desc: "At Algeciras the Spanish delegation voted with ours from the first session to the last. The commercial treaty with Madrid is already signed. We shall ask Madrid and Lisbon to join the league, and speak for our sea with one voice."
 ITADNC_o_the_shared_laboratories: "The Shared Laboratories"
 ITADNC_o_the_shared_laboratories_desc: "Our torpedoes and armour are built under foreign licences, while the men who could have held those patents work abroad. We will open our laboratories to our allies and take theirs in exchange."
 ITADNC_o_the_danubian_expansion: "Widen the League"
 ITADNC_o_the_danubian_expansion_desc: "The convention with San Marino has never once been broken. Our seat on the Ottoman debt council gives us the ear of the Porte, the Ottoman government, on every tariff. We shall ask both to join the league."
 ITADNC_o_no_austrian_clients_in_the_alps: "Austria Out of the Alps"
 ITADNC_o_no_austrian_clients_in_the_alps_desc: "Liechtenstein has no army of its own and lives in a customs union with Vienna, and Monaco serves another master. We will break every Austrian client in the mountains, whatever the war costs us."
 ITADNC_o_the_wolfram_of_the_beira: "Portuguese Tungsten"
 ITADNC_o_the_wolfram_of_the_beira_desc: "The tungsten Terni and Ansaldo need for their steel comes from a single Portuguese district and goes to the highest bidder. We will ask our Portuguese ally to sign the rights over to us and pay in machines."
 ITADNC_o_pool_the_workshops: "Pool the Workshops"
 ITADNC_o_pool_the_workshops_desc: "Each of our partners has a workshop that does one thing better than the rest, and each guards its drawings. We will pool the drawings and the gauges, so a gun proven in one yard is built in every yard of the league."
 ITADNC_o_no_austrian_clients_in_the_balkans: "Austria Out of the Balkans"
 ITADNC_o_no_austrian_clients_in_the_balkans_desc: "A secret convention made Belgrade a client of Vienna for a generation. Vienna has been buying replacements for it ever since. We shall put an end to the government of the Balkans from Vienna."
 ITADNC_o_the_serbian_membership: "The Serbian Membership"
 ITADNC_o_the_serbian_membership_desc: "Vienna has shut its border to Serbian livestock, and we have fed Belgrade throughout the quarrel. Our railway to the coast was drawn with Serbian engineers, and we will offer the Serbs a seat while the quarrel lasts."
 ITADNC_o_the_montenegrin_membership: "The Montenegrin Membership"
 ITADNC_o_the_montenegrin_membership_desc: "Our Queen is a daughter of the Prince of Montenegro. Our subsidy keeps Cetinje solvent, and an Italian company at Antivari holds the port, the railway inland and the tobacco. We shall ask the Prince to put that friendship into a treaty."
 ITADNC_o_the_albanian_membership: "The Albanian Membership"
 ITADNC_o_the_albanian_membership_desc: "Vienna agreed with us twice that Albania should stand alone if the Porte withdrew. Our own Albanians have held their congresses at Corigliano, at Lungro and at Naples. We shall call the Albanians into the league before Vienna does."
 ITADNC_o_strike_at_vienna: "Strike at Vienna"
 ITADNC_o_strike_at_vienna_desc: "The Empire is held together by an idea its own peoples have stopped believing. Every nationality inside it is looking outward for a friend. We shall not annex Austria. We shall go to war to change the government in Vienna."
 ITA_o_the_adriatic_league_tt: "Founds the Adriatic League with Rome at its head, unless we already lead a faction of our own."
 ITA_o_the_adriatic_league_faction: "Adriatic League"
 ITA_o_the_invitation_tt: "Only states that still exist, answer to nobody and belong to no other faction are invited."
 ITA_o_no_austrian_clients_in_the_alps_tt: "Every mountain state that answers to Vienna gives us a war goal to topple its government."
 ITA_o_no_austrian_clients_in_the_alps_SWI_tt: "Switzerland answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_alps_MCO_tt: "Monaco answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_alps_SMR_tt: "San Marino answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_alps_LIE_tt: "Liechtenstein answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_balkans_tt: "Every Balkan state that answers to Vienna gives us a war goal to topple its government."
 ITA_o_the_wolfram_of_the_beira_tt: "Lisbon signs the tungsten of Guarda, in the Beira, over to our own industry."
 ITA_o_pool_the_workshops_tt: "Every other member of the league gets the same pooled workshops."
 ITA_o_the_zanardelli_ministry: "The Bargain with the Chamber"
 ITA_o_the_zanardelli_ministry_desc: "The Crown has stopped choosing ministries against the Chamber, and the Chamber has stopped voting against the Crown.\n\nThe ministry gets its business through, the country is steadier, and nobody is listening to the extremes."
 ITA_o_the_adriatic_system: "The Adriatic System"
 ITA_o_the_adriatic_system_desc: "A belt of small states along the eastern shore looks to Rome now, and not up the Danube.\n\nGovernments of our own kind think better of us, we trade on better terms, and the ministry has an easier time at home."
 ITA_o_the_adriatic_system2: "The Adriatic System Confirmed"
 ITA_o_the_adriatic_system2_desc: "The league now feeds our own workshops, and the smaller courts have stopped asking Vienna what Rome intends.\n\nOur factories turn out more, and we are trusted further abroad than we were."
 ITA_o_pool_the_workshops: "The Pooled Workshops"
 ITA_o_pool_the_workshops_desc: "Drawings, gauges and tooling pass freely between the yards of the league. A new line reaches full output sooner, and runs higher when it gets there."
 ITA_o_the_menace_from_the_alps: "The Menace from the Alps"
 ITA_o_the_menace_from_the_alps_desc: "The Italian press has convinced us that Austria-Hungary means to reach the sea over our heads.\n\nWe are readier to listen to Rome, and less easily turned by anyone at home."
 ita_adriatic_research: "Adriatic Research"
 ita_adriatic_research_desc: "The laboratories of the league report their work to one another."
 ita_dnc.2550.t: "The Italian Press Campaign"
 ita_dnc.2550.d: "Every paper from Milan to Palermo is printing the same story. We took a province without asking Europe, and our railway south is meant to bring us down to the sea.\n\nThe Italian foreign ministry says nothing and lets the editors talk. We can answer the charge, or let it stand and lose the smaller courts."
 ita_dnc.2550.a: "Let them print. The province is ours."
 ita_dnc.2550.b: "Send a note, and quiet the editors."
 ita_dnc.2551.t: "The League Rome Has Founded"
 ita_dnc.2551.d: "Rome has gathered the courts between us and the sea into a league, and put herself at its head. The invitations went out to Bucharest, to Bern and to Cetinje on the same morning.\n\nWe can outbid her in every one of those capitals, or decide that a league of small states is not worth the money."
 ita_dnc.2551.a: "Buy back every capital on that list, whatever it costs."
 ita_dnc.2551.b: "Let it stand. A league of shopkeepers changes nothing."
 ita_dnc.2552.t: "Belgrade Looks to Rome"
 ita_dnc.2552.d: "The Serbs have been offered a seat in the Italian league. Our own frontier has stood shut against their pigs and cattle through the whole quarrel, and Rome has fed Belgrade instead.\n\nWe can shut the frontier tighter, or open it and buy back what we are losing."
 ita_dnc.2552.a: "Shut the frontier tighter."
 ita_dnc.2552.b: "Open it, and let the herds through."
 ita_dnc.2553.t: "Montenegro Looks to Rome"
 ita_dnc.2553.d: "The Queen of Italy is a daughter of the Prince of Montenegro. The company that holds the port at Antivari, the railway inland and the tobacco is Italian to the last share.\n\nNow Rome offers Cetinje a seat at her own table. The Prince has always taken whichever subsidy was the larger."
 ita_dnc.2553.a: "Then let our subsidy be the larger."
 ita_dnc.2553.b: "Let Cetinje go. The Prince was bought long ago, and not by us."
 ita_dnc.2554.t: "The Promise About Albania"
 ita_dnc.2554.d: "Twice we promised Rome that Albania should stand alone if the Porte withdrew. Both times we meant it only for as long as Rome could not act on it.\n\nThe schools and the consulates at Valona and Scutari are Italian, and now the invitation is Italian too. Rome is calling the promise in."
 ita_dnc.2554.a: "Renounce the promise. It was made to another Rome."
 ita_dnc.2554.b: "Keep the promise, and keep the ally."
 ITADNC_u_the_army_will_not_fire: "The Army Will Not Fire"
 ITADNC_u_the_army_will_not_fire_desc: "The courts have struck down the decrees, and the ministry has ordered troops into the squares again. The Supreme Command has answered in writing that the army will not fire on the people, and we must govern with what is left."
 ITADNC_u_rally_the_country: "Rally the Country"
 ITADNC_u_rally_the_country_desc: "Socialists, republicans and radicals have sat together through the whole obstruction. Their popular blocs already hold the streets of the northern towns. We shall call those men out for us, before the prefects arm them against us."
 ITADNC_u_the_men_of_the_siege: "The Amnesty for Milan"
 ITADNC_u_the_men_of_the_siege_desc: "The military tribunals of Milan sentenced civilians by the hundred. The new reign began by pardoning some of them. We shall pardon the rest, and send home the officers and the prefects who signed those sentences."
 ITADNC_u_the_country_put_back_to_work: "Work for the South"
 ITADNC_u_the_country_put_back_to_work_desc: "The works drawn up for the South were voted and never paid for. The harbours and the aqueducts stand half built. We shall finish them now, and let the country live modestly while the quarrel over its government is settled."
 ITADNC_u_the_public_works_of_the_recovery: "The Municipal Works"
 ITADNC_u_the_public_works_of_the_recovery_desc: "The debt can be converted at last, and the law on municipal enterprise lets a town run its own gas and its own trams. We shall spend what the conversion saves on the works, and put a counsellor for industry at the ministry."
 ITADNC_u_what_italy_will_be: "The Proclamation to the Country"
 ITADNC_u_what_italy_will_be_desc: "The proclamation has been read, and the oath to the Statuto will be sworn before the Chambers. We must say now what Italy will be when the fighting ends. It costs us nothing and buys us time."
 ITADNC_u_the_workers_of_the_littoral: "The Workers of Trieste"
 ITADNC_u_the_workers_of_the_littoral_desc: "The labour chambers of Trieste speak our language, and the Austrian governor has dissolved every one of them. We will demand the ports and valleys they organised, and take them if Vienna will not hand them over."
 ITADNC_u_the_shore_of_dalmatia: "The Shore of Dalmatia"
 ITADNC_u_the_shore_of_dalmatia_desc: "The Croat and Serb coalition has resolved at Fiume and at Zara that the coast shall be governed from the coast. We shall answer that it will be governed from Rome, and we shall be ready to go and say so in arms."
 ITADNC_u_the_valleys_of_the_confederation: "The Swiss Italian Valleys"
 ITADNC_u_the_valleys_of_the_confederation_desc: "Italian hands dug the Simplon and the Gotthard tunnels. When those men struck, Zurich answered with a riot against them. The valleys that speak our language must come home, and Bern will not give them up for the asking."
 ITADNC_u_the_alpine_shield: "The Alpine Shield"
 ITADNC_u_the_alpine_shield_desc: "Liechtenstein belongs to Vienna's customs union, Monaco is bound to Paris, and San Marino to us. We will gather the small states under our own shield before another power gathers them under its own."
 ITADNC_u_re_ratify_the_triple_alliance: "Renew the Triple Alliance"
 ITADNC_u_re_ratify_the_triple_alliance_desc: "The alliance falls due for renewal. Both courts have asked whether the new Rome still means what the old one signed. We shall renew it as it stands, and show Berlin and Vienna that a change of government has not changed our word."
 ITADNC_u_the_franco_italian_pact: "The Franco-Italian Pact"
 ITADNC_u_the_franco_italian_pact_desc: "Our secret notes with the French ambassador say neither power will march if the other is attacked. We will turn them into a signed treaty and ask Paris to sign what it has already promised."
 ITADNC_u_offer_a_trade_proposal: "Offer France a Trade Treaty"
 ITADNC_u_offer_a_trade_proposal_desc: "The customs war closed the French market to our wine and our silk. It ruined the South a second time. We shall offer Paris the treaty of commerce that ends it, and ask for nothing else in the same letter."
 ITADNC_u_request_the_french_colonies: "Ask Paris for Tunis"
 ITADNC_u_request_the_french_colonies_desc: "The Regency of Tunis was promised to us and taken by Paris. The Italians who work its fields are the greater part of its settlers. We shall ask Paris to hand it over, and be ready for the answer we have had once already."
 ITADNC_u_the_army_on_the_rhine: "The Army on the Rhine"
 ITADNC_u_the_army_on_the_rhine_desc: "The alliance treaty promises an army corps for the upper Rhine, and the staffs have confirmed it at every meeting since. We shall tell our ally that the corps is ready, and ask what the alliance will pay for it."
 ITADNC_u_reject_the_triple_alliance: "Reject the Triple Alliance"
 ITADNC_u_reject_the_triple_alliance_desc: "The republicans ask the Chamber every year to denounce the treaty. The Chamber has never dared put it to a vote. We shall denounce it, leave the alliance, and take the free hand the country has wanted since the frontier was drawn."
 ITADNC_u_the_note_of_denunciation: "End the Alliance"
 ITADNC_u_the_note_of_denunciation_desc: "The Chamber has voted the denunciation. It must now be delivered, in the proper form and by the proper hand. We shall send the note to Vienna and Berlin, and set our consulates to the work that follows a broken alliance."
 ITADNC_u_the_hypothesis_north_east: "The North-East War Plan"
 ITADNC_u_the_hypothesis_north_east_desc: "The Supreme Command has kept a war plan against our own ally in its safe. The ground has been surveyed twice over. We shall take the plan out and give it to the armies facing the north-east."
 ITADNC_u_the_hypothesis_west: "The Western War Plan"
 ITADNC_u_the_hypothesis_west_desc: "The other plan lies in the same safe. It faces the passes and the river of the west, and it has been kept as carefully as the first. We shall take it out and give it to the armies facing that way."
 ITADNC_u_demand_the_return_of_nice: "Demand the Return of Nice"
 ITADNC_u_demand_the_return_of_nice_desc: "The plebiscites that gave Nice and Savoy to France were held under occupation. Our press has never let the country forget it. We shall claim both back, and Paris will hear of it in the street before she reads our note."
 ITADNC_u_the_passes_of_the_alps: "Passage Through the Alps"
 ITADNC_u_the_passes_of_the_alps_desc: "The Simplon and the Gotthard tunnels carry more of our trade than any port we own. Both run through a neutral country. We shall ask Switzerland for the right of passage, and ask for nothing else."
 ITADNC_u_the_western_settlement: "The Western Settlement"
 ITADNC_u_the_western_settlement_desc: "The fighting west of the mountains has stopped. No great power holds a valley on our side of the watershed any longer. We shall write the settlement now, make the ground we hold Italian in law, and put our own prefects over it."
 ITA_u_the_civil_war_tt: "§RThe country is at war with itself.§! The Chamber, the street and the officers who refused stand on one side; the Crown, the South and the islands on the other."
 ITA_u_the_hundred_days_tt: "§YThe Hundred Days§! begin. We have 100 days to settle what form the state will take, and if the term runs out with no answer §RAn Uncertain Future§! settles on us."
 ITA_u_the_blocchi_answer_tt: "The popular blocs answer the call. Their squads come over to us instead of being armed against us, and the leagues of the north bring in men the recruiting office never found."
 ITA_u_the_tribunals_are_undone_tt: "The sentences of the military tribunals are quashed and the men who signed them lose their posts. §GStability +5%§! and the democratic vote grows by §G5%§!."
 ITA_u_the_south_is_paid_tt: "The special laws for the South are paid at last, and the half-built works start again."
 ITA_u_the_industrial_counsellor_tt: "A counsellor for industry takes a desk at the ministry and the municipal works are opened."
 ITA_u_the_oath_is_prepared_tt: "The oath is drafted and the two answers are laid before the Chamber. §Y14 days§! are added to the Hundred Days."
 ITA_u_the_littoral_is_handed_over_tt: "Vienna is already ours or already with us, and the Littoral passes to Rome without a shot. §YTrieste, Istria, Fiume, Idria, the Trentino and the Tyrol§!."
 ITA_u_the_shore_is_handed_over_tt: "Vienna is already ours or already with us, and the whole coast from Zara to Budva passes to Rome without a shot."
 ITA_u_the_valleys_are_handed_over_tt: "Switzerland is already ours or already with us, and §YTicino§! and §YGrisons§! pass to Rome without a shot."
 ITA_u_the_small_states_come_in_tt: "A state that is already our own subject is taken into the kingdom entire, with its army and its treasury."
 ITA_u_the_sphere_still_covers_them_tt: "§YThe sphere agreement still covers them.§! Paris leaves the small neutrals alone while we do, and while we are not at war with her."
 ITA_u_the_capitals_answer_tt: "§YThe capital answers within a day.§! What it answers depends on what we have built and on what it owes elsewhere."
 ITA_u_the_offer_goes_out_tt: "The offer of a treaty of commerce leaves for Paris. §YNothing else is asked in the same letter§! and nothing else is promised."
 ITA_u_the_passage_is_asked_tt: "We ask Switzerland for the right to move troops and stores through the tunnels, and we offer to pay for every train."
 ITA_u_the_settlement_is_signed_tt: "The western settlement is signed. Every state we hold west of the watershed becomes ours in law, and our own prefects take over Nice and Savoy."
 ITA_u_the_provisional_regime_tt: "§YThe Supreme Command takes the ministries.§! A soldier governs until the question of the regime is settled, and the army obeys him because he is one of them."
 ITA_u_the_chamber_sits_tt: "§YThe Chamber sits in permanence.§! No soldier is put over the ministries, and the deputies govern in the middle of a war they cannot direct."
 ITA_u_the_hundred_days_are_won_tt: "§GThe Hundred Days are won.§! A form of state has been chosen before the term ran out, and the prefects know again whose orders they take."
 ITA_u_the_regime_is_settled_tt: "§GThe question of the regime is settled.§! The Hundred Days close, and §RAn Uncertain Future§! will not be laid on us."
 ITA_u_the_customs_line_is_moved_tt: "The customs line moves to the watershed and the old posts in the valleys come down."
 ITA_u_threat_the_army_refuses: "The Italian army has refused an order"
 ITA_u_threat_the_regency: "Rome asks for a share of the Regency"
 ITA_u_threat_the_denunciation: "Rome has denounced her alliance"
 ITA_u_threat_the_western_claim: "Rome claims Nice and Savoy"
 ITA_u_the_provisional_regime: "The Provisional Regime"
 ITA_u_the_provisional_regime_desc: "A soldier holds the ministries and signs what the Chamber votes. The staff work is quick and the political work is slow. The army is steadier for it, and the Chamber gets less done."
 ITA_u_the_blocchi_popolari: "The Popular Blocs"
 ITA_u_the_blocchi_popolari_desc: "Socialists, republicans and radicals share one list and one street. The leagues bring in men the recruiting office never found, and they expect to be heard when the fighting stops."
 ITA_u_the_municipal_works: "The Municipal Works"
 ITA_u_the_municipal_works_desc: "The towns run their own gas, their own water and their own trams. The work is cheap, the roads and rails go up faster, and the country is quieter for it."
 ITA_u_uncertain_future: "An Uncertain Future"
 ITA_u_uncertain_future_desc: "The provisional arrangement has outlived its term and no form of state has been chosen. The prefects obey whoever writes first and the ministries answer only to themselves."
 ITA_u_the_alliance_re_ratified: "The Alliance Re-Ratified"
 ITA_u_the_alliance_re_ratified_desc: "The old articles have been signed again by a government that was in the street a season ago. Vienna and Berlin are reassured, and so is every chancery that reads the renewal."
 ITA_u_the_pact_with_paris: "The Pact with Paris"
 ITA_u_the_pact_with_paris_desc: "Neither power marches if the other is attacked, and the paper says so in plain words at last. We can thin the western frontier, and the country will stand a longer war. A new quarrel takes longer to prepare."
 ITA_u_the_commercial_treaty: "The Commercial Treaty"
 ITA_u_the_commercial_treaty_desc: "The tariff walls come down and the wine, the silk and the wheat cross the frontier again. Food and cloth are cheaper at home, and every country that trades with us thinks better of us."
 ITA_u_the_continental_engagement: "The Promised Army Corps"
 ITA_u_the_continental_engagement_desc: "An army corps is earmarked for the Rhine, and the staffs exchange railway timetables every spring. The work has made our army steadier, and our allies value us more."
 ITA_u_the_corps_on_the_rhine: "The Corps on the Rhine"
 ITA_u_the_corps_on_the_rhine_desc: "The corps has gone north with its guns and its trains. The staffs plan together now, and the passes behind it are held by fewer men than the army would like."
 ITA_u_the_free_hand_ns: "The Free Hand"
 ITA_u_the_free_hand_ns_desc: "We are bound to nobody and owed by nobody. Taking a side now would alarm every chancery in Europe. We can pick our own quarrel, prepare it quickly, and draw less notice when we do."
 ITA_u_the_denunciation: "The Alliance Ended"
 ITA_u_the_denunciation_desc: "The note has been delivered and the consulates are at the work that follows. Our ministers abroad are busier than they have been in a generation, and the ministry gets more done."
 ITA_u_the_alpine_transit: "The Alpine Transit"
 ITA_u_the_alpine_transit_desc: "The tunnels are open to our trains and we pay for every one of them. Our armies are supplied with less waste, and the work of building roads and rails goes faster."
 ITA_u_the_hypothesis_north_east: "The North-East War Plan"
 ITA_u_the_hypothesis_north_east_desc: "The plan against our own ally has come out of the safe and gone to the army commands. The ground is surveyed and the bridges are numbered, and our men attack better on that frontier."
 ITA_u_the_hypothesis_west: "The Western War Plan"
 ITA_u_the_hypothesis_west_desc: "The plan against France has come out of the Supreme Command's safe. The passes are surveyed, the first timetables are printed, and our men attack better on that frontier."
 ITA_u_the_hundred_days: "The Hundred Days"
 ITA_u_the_duchies_cat: "The Adriatic Duchies"
 ITA_u_the_duchies_cat_desc: "Each nation we free from the Empire gets its crown only when its capital is in our hands. Albania, Croatia, Slovenia and Hungary are proclaimed one at a time, and each becomes our client."
 ITA_u_growing_dissent_mission: "The Hundred Days"
 ITA_u_growing_dissent_mission_desc: "The provisional regime has given itself 100 days to settle what form the state will take. If the term runs out with no answer, nobody in Rome will be able to say who governs."
 ita_dnc.2600.t: "The Supreme Command Refuses"
 ita_dnc.2600.d: "The ministry ordered the troops into the squares a second time. The Supreme Command refused the order in writing and published the refusal. The Chamber now sits in permanence, the prefects hold the police, the Crown holds the seal, and the country has two governments and one army. Somebody must hold the ministries until the quarrel is settled, and the army will obey that man."
 ita_dnc.2600.a: "Let the Supreme Command hold the ministries."
 ita_dnc.2600.b: "Let the Chamber govern, and put no soldier over the ministries."
 ita_dnc.2601.t: "The Deadline Has Passed"
 ita_dnc.2601.d: "The 100 days are gone and no form of state has been chosen. The prefects take their orders from whoever writes to them first, and the ministries answer to themselves. We can only carry on, and the country loses patience a little more each week."
 ita_dnc.2601.a: "Let it run on until somebody settles it."
 ita_dnc.2820.t: "Rome Renews the Treaty"
 ita_dnc.2820.d: "The Italian ambassador has brought the alliance back to us, with the same articles and a new government behind them. The men who signed the last renewal are gone. The men who hold the ministries now were in the street against their own Crown a season ago. We can sign again, or we can tell Rome that she has changed too much."
 ita_dnc.2820.a: "Sign the renewal. The treaty holds."
 ita_dnc.2820.b: "Refuse the renewal. Rome has changed too much."
 ita_dnc.2821.t: "Rome Signs Again"
 ita_dnc.2821.d: "The Italian ambassador has laid the alliance before us unaltered and asks for our signature under it. Rome is worth to us exactly what the army corps she promises the Rhine is worth, and that promise has not been withdrawn. We can sign, or we can say that Rome has changed too much since the last renewal."
 ita_dnc.2821.a: "Sign the renewal. The treaty holds."
 ita_dnc.2821.b: "Refuse the renewal. Rome has changed too much."
 ita_dnc.2822.t: "Rome Offers a Pact"
 ita_dnc.2822.d: "Rome proposes to turn the notes our ambassadors exchanged into a signed treaty. Neither power would march if the other were attacked. The same government has just renewed its alliance in Vienna and in Berlin, and our deputies will ask how both papers can be honest. We can sign, or we can wait until Rome leaves Berlin."
 ita_dnc.2822.a: "Sign the pact. The notes of the two ministers stand."
 ita_dnc.2822.b: "Refuse. Rome cannot sign in Berlin and in Paris at once."
 ita_dnc.2824.t: "Rome Offers a Trade Treaty"
 ita_dnc.2824.d: "Rome asks for the treaty of commerce that would end the tariff war, and asks for nothing else in the same letter. Our growers have had the home market to themselves since the tariff walls went up, and they will be heard. The Italians have already sold their harvest elsewhere and can wait longer than we can."
 ita_dnc.2824.a: "Sign the treaty and end the customs war."
 ita_dnc.2824.b: "Keep the tariff where it is."
 ita_dnc.2826.t: "Rome Asks for the Regency"
 ita_dnc.2826.d: "The Italian minister asks for a share in the government of the Regency of Tunis. He says most of the settlers who work it are his countrymen. We answered that argument once with the Protectorate, and the argument has not improved with keeping. Refusing will put the claim into every Italian newspaper, and leave it there."
 ita_dnc.2826.a: "Share the government of the Regency with Rome."
 ita_dnc.2826.b: "Refuse. The Protectorate is not shared."
 ita_dnc.2827.t: "Paris Shares the Regency"
 ita_dnc.2827.d: "Paris has agreed to a joint administration, and the first Italian resident is already on the boat. The settlers who cleared those fields will be governed by their own consuls at last. The Chamber will want to know what we gave up for it."
 ita_dnc.2827.a: "Send the resident"
 ita_dnc.2828.t: "Rome Offers the Corps"
 ita_dnc.2828.d: "Rome has told us that the army corps promised for the Rhine is mobilised and waiting for a railway timetable. Sending it would thin the Alpine passes while her neighbour counts the battalions there. Keeping it at home would tell every chancery in Europe what the alliance is worth."
 ita_dnc.2828.a: "Send the corps"
 ita_dnc.2828.b: "Keep them in the Alps"
 ita_dnc.2830.t: "The Alliance Is Denounced"
 ita_dnc.2830.d: "The Italian ambassador has read out a note denouncing the alliance and has asked for no reply. He did not ask for terms and he did not ask for time. He left the paper on the table and went home. The treaty is at an end, and the frontier is a frontier like any other."
 ita_dnc.2830.a: "Note it, and mark Rome down as an enemy."
 ita_dnc.2832.t: "Rome Sends the Formal Note"
 ita_dnc.2832.d: "The formal note has followed the denunciation and goes over the same ground in the language of lawyers. Rome asks that the commercial articles be kept in force and that her consulates be left alone. We may let her go quietly, or we may make the departure expensive for her."
 ita_dnc.2832.a: "Let her go quietly"
 ita_dnc.2832.b: "Answer coldly, and watch her from now on."
 ita_dnc.2834.t: "Rome Claims Nice and Savoy"
 ita_dnc.2834.d: "The Italian note asks for Nice and Savoy back. It calls the plebiscites that gave them to us a fraud carried out under occupation. Their press has made that argument for two generations, and nobody in ours has ever troubled to answer it. Giving them up would cost us the mountain frontier."
 ita_dnc.2834.a: "Give up Nice and Savoy rather than fight for them."
 ita_dnc.2834.b: "Refuse the note. Nice is French."
 ita_dnc.2835.t: "Nice and Savoy Come Home"
 ita_dnc.2835.d: "The commissioners have signed, and Nice and Savoy pass to us without a shot fired. The men who voted under occupation are mostly gone, and their sons will vote for us. The frontier now sits where the mountains put it."
 ita_dnc.2835.a: "Raise the flag over the prefecture"
 ita_dnc.2836.t: "Rome Asks for Passage"
 ita_dnc.2836.d: "Rome asks for the right to move troops and stores through the tunnels, and offers to pay for every train. We dug those tunnels so that no power would ever have to ask. Our neutrality rests on refusing requests like this one. Granting it would buy us a friend on the south side of the mountain."
 ita_dnc.2836.a: "Open the tunnels to Italian trains."
 ita_dnc.2836.b: "Refuse. Our neutrality is not for sale."
 ITADNC_u_call_the_general_strike: "Call the General Strike"
 ITADNC_u_call_the_general_strike_desc: "The dead at Buggerru and Castelluzzo did what no congress could, and the labour chambers are voting to stop the whole country. We will call the strike ourselves and come out of it at the head of the leagues."
 ITADNC_u_the_bureau_of_the_leagues: "The Bureau of the Leagues"
 ITADNC_u_the_bureau_of_the_leagues_desc: "Every league keeps its own books and its own informers. The ministry knows more about us than we know about ourselves. We shall put one secretariat over them all, and find out who is paid by the prefects before we are asked to govern."
 ITADNC_u_the_office_of_public_vigilance: "The Public Watch Office"
 ITADNC_u_the_office_of_public_vigilance_desc: "The central register of subversives holds a card for every one of us. The clerks who wrote them never expected the men on the cards to read them. We shall keep the files working, and turn them on the people who kept them."
 ITADNC_u_the_agents_beyond_the_frontier: "The Agents Beyond the Frontier"
 ITADNC_u_the_agents_beyond_the_frontier_desc: "Men the ministry paid followed our people to London, to Lugano and to Paterson. Their reports came back to Rome with the ordinary post. We shall send our own men abroad, because the quarrel does not stop at the customs house."
 ITADNC_u_the_men_who_came_back_from_lugano: "The Exiles of Lugano"
 ITADNC_u_the_men_who_came_back_from_lugano_desc: "The papers printed in Switzerland were read in every northern valley, and their printers were expelled from canton after canton. We will bring them home and give them work, because a man who has been watched knows how watching works."
 ITADNC_u_the_fasci_brought_back: "The Sicilian Leagues Return"
 ITADNC_u_the_fasci_brought_back_desc: "The fasci, the workers' leagues of Sicily, were dissolved by decree. Their leaders were tried by court martial and the name has been forbidden since. We shall raise them again, and give them a place in the army instead of a banner."
 ITADNC_u_the_army_of_the_leagues: "The Army of the Leagues"
 ITADNC_u_the_army_of_the_leagues_desc: "The programme asks for a nation in arms in place of the standing army. The officer corps was chosen by the men we have just put out. We shall clear the seniority lists and give the commands to those who did not fire on the crowd."
 ITADNC_u_the_delegates_in_the_regiments: "The Delegates in the Regiments"
 ITADNC_u_the_delegates_in_the_regiments_desc: "Our speakers have been tried for what they said outside the barracks gates. The conscripts inside heard every word of it. We shall seat a delegate in each regiment, and let the men argue with their officers about what an army is for."
 ITADNC_u_the_levy_of_the_leagues: "The Levy of the Leagues"
 ITADNC_u_the_levy_of_the_leagues_desc: "Short service and a militia are written into the programme. The men of military age we never called are standing in the piazza waiting to be asked. We shall take them all at once, and accept that they reach the depots knowing nothing."
 ITADNC_u_the_country_is_ours: "The Republic Is Proclaimed"
 ITADNC_u_the_country_is_ours_desc: "The country stood still, and the government could not find a general to order the volleys. We will say plainly that the kingdom is finished, put a workers' republic in its place, and answer to the powers for it."
 ITADNC_u_the_minimum_programme: "The Minimum Programme"
 ITADNC_u_the_minimum_programme_desc: "Our party programme asks for universal suffrage, a citizen army, free association, the eight-hour day and a graduated tax. We will govern on that paper alone and let the congress choose who reads it out."
 ITADNC_u_the_syndicate_governs: "The Unions Take the State"
 ITADNC_u_the_syndicate_governs_desc: "The men of the Avanguardia, the syndicalist paper, have carried the party at Bologna. They hold that the union and not the deputy is the unit of the state. We shall let the chambers of labour govern in place of a parliament."
 ITADNC_u_the_municipality_takes_it: "Municipal Gas, Water and Trams"
 ITADNC_u_the_municipality_takes_it_desc: "The law lets a town run its own gas, water and trams, and Milan and Bologna have shown what the accounts look like afterwards. We will take over everything the law allows, paid for by what the private concessions cost us."
 ITADNC_u_the_works_to_the_syndicate: "The Works to the Unions"
 ITADNC_u_the_works_to_the_syndicate_desc: "At Parma the chamber of labour ran the province for a whole season, while the landowners waited for troops that were never sent. We shall hand the works to the unions that already run them, and accept rougher work for more of it."
 ITADNC_u_the_liberties_are_not_suspended: "The Liberties Are Not Suspended"
 ITADNC_u_the_liberties_are_not_suspended_desc: "Every ministry before us answered strikes with a state of siege, and we were the ones dragged away. We will not suspend a single liberty we were once denied, and the party itself will answer for public order."
 ITADNC_u_the_congress_governs: "The Congress Governs"
 ITADNC_u_the_congress_governs_desc: "Our party congresses have settled more than the Chamber ever did, and the deputies came home to be told what they had voted for. We will make the congress sovereign, and anyone who wants a say may take a card."
 ITADNC_u_the_state_takes_the_works: "The State Takes the Works"
 ITADNC_u_the_state_takes_the_works_desc: "The railways were run for the shareholders and repaired for nobody, and the law to take them is already drafted. We will put the lines, workshops and men on the State's books and build the factories the companies would not."
 ITADNC_u_the_single_council: "The Council of Labour"
 ITADNC_u_the_single_council_desc: "The higher council of labour was set up to be consulted and then ignored. It has advised on everything and decided nothing. We shall give it the decision itself, and let one room settle what a dozen ministries used to argue about."
 ITADNC_u_the_confederation_of_labour: "The Labour Federation"
 ITADNC_u_the_confederation_of_labour_desc: "The labour chambers and trade federations have met at Milan and agreed to speak with one voice. We will recognise the confederation as the other half of the government and stop treating strikes as police business."
 ITADNC_u_the_collective_tenancies: "The Collective Tenancies"
 ITADNC_u_the_collective_tenancies_desc: "In the Romagna the day labourers have rented whole estates together and farmed them in common for a generation, without a lira of credit. We shall lend them the money for the drains and the roads they were always refused."
 ITADNC_u_the_worker_who_gives_more: "The Worker Who Gives More"
 ITADNC_u_the_worker_who_gives_more_desc: "The cooperative congresses preach emulation, the race to produce more, and the chambers of labour quarrel about piecework. We shall reward the worker who gives more, and hear from the rest that we have become the masters."
 ITADNC_u_the_pensions_of_the_state: "The State Pension"
 ITADNC_u_the_pensions_of_the_state_desc: "The national pension fund is voluntary, underfunded and almost unknown, and the bills to make it compulsory were never voted. We will vote them, so a man who has worked his whole life can stop without begging his sons."
 ITADNC_u_the_state_works_at_terni: "The State Works at Terni"
 ITADNC_u_the_state_works_at_terni_desc: "The steelworks live on navy orders and bank their furnaces whenever the budget is cut. We will put the State's own orders behind them, so our armour and guns come from a works that answers to us, not to the banks."
 ITADNC_u_the_women_of_the_leagues: "The Women of the Leagues"
 ITADNC_u_the_women_of_the_leagues_desc: "The law on women's and children's hours was carried against the mills, and the women enrolled at Ancona were struck off within the month. We will bring them into the leagues on the same card as the men and end the night shift."
 ita_dnc.2620.t: "The Congress Chooses a Leader"
 ita_dnc.2620.d: "The congress has sat three days in a hall that used to be a theatre, and voted on everything except the question it came for. Filippo Turati wrote the programme. Leonida Bissolati would sooner govern with the army than against it. Rinaldo Rigola was sent by the unions. If the fortress has opened, Constantino Lazzari is here too."
 ita_dnc.2620.a: "Give the government to Turati, who wrote the programme."
 ita_dnc.2620.b: "Give the government to Bissolati, and end the quarrels."
 ita_dnc.2620.c: "Give the government to Rigola, whom the unions sent."
 ITA_u_the_provinces_rise_tt: "§YMilan, Genoa and Turin come out with the leagues.§! The strike costs us the season's work, and adds 45 days to the Hundred Days if that term is still running."
 ITA_u_the_bureau_watches_tt: "§YThe secretariat reads the post of every chamber of labour, and the informers are listed before they are paid.§!"
 ITA_u_the_vigilance_office_tt: "§YThe central register keeps working, with our names taken off it and the ministry's put on.§! §RThe office is dissolved the day this road is abandoned.§!"
 ITA_u_the_agents_abroad_tt: "§YOur own people watch the emigration now, and the reports come to the party and not to the prefecture.§!"
 ITA_u_the_frontier_is_no_wall_tt: "§YWhat is printed in Lugano is read in the valleys inside a week.§!"
 ITA_u_the_exiles_are_called_home_tt: "§YThe writers expelled from Bern and from Geneva come home to paid work.§!"
 ITA_u_the_leagues_in_arms_tt: "§YThe Leagues in Arms§! collects what the militia is worth to the army. Every focus on this road adds to it."
 ITA_u_the_country_is_ours_tt: "§YThe kingdom is declared finished, and the powers are told so in writing.§! From here the road divides between the ballot and the union."
 ITA_u_the_congress_elects_tt: "§YThe congress meets to choose the head of the republic.§!"
 ITA_u_the_syndicate_governs_tt: "§YArturo Labriola takes the government, and the chambers of labour take the state.§!"
 ITA_u_the_works_in_common_tt: "§YThe Works in Common§! collects what the works taken into public hands are worth. Every focus on this road adds to it."
 ITA_u_the_direction_tt: "§YThe Direction§! is the executive of the party. Every step on this road adds to the political power and the stability it brings us."
 ITA_u_the_syndicate_is_recognised_tt: "§YThe confederation of labour is recognised, and the government deals with it as an equal.§!"
 ITA_u_the_tenancies_tt: "§YThree of our own provinces get the roads and drains the landlords never paid for.§!"
 ITA_u_the_pensions_tt: "§YThe state pays a pension, and a worn-out man can stop work without asking his sons.§!"
 ITA_u_the_night_shift_is_closed_tt: "§RNight work in the mills is now forbidden for good.§!"
 ITA_u_threat_the_country_is_ours: "The Italian Republic of the Leagues"
 ITA_u_the_general_strike: "The General Strike"
 ITA_u_the_general_strike_desc: "The mills are cold, the ports are shut and the trains are not running. Nobody goes back to work until the leagues say so.\n\nLittle is being made and nothing is being built. The men on strike are with us, and the country can see who holds the streets."
 ITA_u_the_bureau_of_the_leagues: "The Bureau of the Leagues"
 ITA_u_the_bureau_of_the_leagues_desc: "One secretariat now keeps the books of every chamber of labour, and reads their post before the prefect does."
 ITA_u_the_agents_abroad: "The Agents Beyond the Frontier"
 ITA_u_the_agents_abroad_desc: "Our own men follow the emigration through Switzerland, France and England, and the reports come home to the party."
 ITA_u_the_exiles_of_lugano: "The Exiles from Lugano"
 ITA_u_the_exiles_of_lugano_desc: "The writers expelled from one canton after another are on our payroll now, and they know precisely how a police force follows a man."
 ITA_u_the_country_is_ours: "The Country Is Ours"
 ITA_u_the_country_is_ours_desc: "The kingdom has been declared finished, and nothing has been put in its place yet. Every office in the country is waiting to be told whose it is."
 ITA_u_the_minimum_programme: "The Minimum Programme"
 ITA_u_the_minimum_programme_desc: "The republic has one sheet of paper for a constitution, and every measure is read against it in public before it is voted."
 ITA_u_the_pensions_of_the_state: "The Pensions of the State"
 ITA_u_the_pensions_of_the_state_desc: "The provident fund is compulsory, funded and paid, and men who would have worked until they dropped are at home instead."
 ITA_u_the_women_of_the_leagues: "The Women of the Leagues"
 ITA_u_the_women_of_the_leagues_desc: "The law on hours is enforced, and the leagues take women on the same card as the men. The registers are longer for it."
 ITA_u_the_direction: "The Direction"
 ITA_u_the_direction_desc: "The executive of the party sits above the ministries and answers for them. Every power this road has given it, it keeps."
 ITA_u_the_leagues_in_arms: "The Leagues in Arms"
 ITA_u_the_leagues_in_arms_desc: "The army is being rebuilt around the leagues rather than the depots. The men come in willing, they train faster, and they hold together."
 ITA_u_the_works_in_common: "The Works in Common"
 ITA_u_the_works_in_common_desc: "Mills, railways and land have been taken into common hands and are run together. The factories run fuller, the sites build faster and the mines give more."
 ITA_u_the_vigilance_office: "The Office of Public Vigilance"
 ITA_u_the_vigilance_office_desc: "The register of subversives is still kept, still complete and still growing. It now watches our own enemies as closely as it once watched us."
 ITA_ud_the_mills_run_at_night: "The Mills Run at Night"
 ITA_ud_the_mills_run_at_night_desc: "The looms and the furnaces can be kept running through the night. The leagues will not be asked, and they will not forgive it."
 ITADNC_u_royalist_sentiment: "Love for the Crown"
 ITADNC_u_royalist_sentiment_desc: "The old King is buried, the Queen's prayer is in every paper, and men who never cheered a Savoy stand bareheaded in the street. The dynasty is the one thing the country agrees on, and we will build on it before the mood passes."
 ITADNC_u_the_oath_to_the_statuto: "The Oath to the Charter"
 ITADNC_u_the_oath_to_the_statuto_desc: "The new King has sworn before the Chambers to keep the Statuto, and deputies who expected a soldier found a constitutional prince. We will hold him to his words and make that oath the charter of the reign."
 ITADNC_u_return_to_the_statuto: "Return to the Charter"
 ITADNC_u_return_to_the_statuto_desc: "Sonnino argues that the Statuto never made ministers answer to the Chamber, and calls parliamentary government a theft of royal power. We will read the articles as written and give the Crown back the naming of ministers."
 ITADNC_u_the_country_is_consulted: "The Country Is Consulted"
 ITADNC_u_the_country_is_consulted_desc: "The election has returned a Chamber no single group can command, and the King must choose among the men it sent. We will let the country speak first and the Quirinal decide after, so whoever governs need not buy his majority."
 ITADNC_u_the_king_is_called_home: "The King Is Called Home"
 ITADNC_u_the_king_is_called_home_desc: "Our Queen is a Petrović, and our Treasury keeps Montenegro solvent, while Vienna still claims a say in its affairs. We will ask the Prince to raise a son in Rome and let us settle his foreign policy, or take the crown another way."
 ITADNC_u_the_supreme_command_governs: "The Supreme Command Governs"
 ITADNC_u_the_supreme_command_governs_desc: "A general governed this country by decree within living memory, and the staff remembers how quiet the provinces were. We will put the Supreme Command at the head of the State, and the generals will choose who signs."
 ITADNC_u_no_bands_in_the_streets: "No Bands in the Streets"
 ITADNC_u_no_bands_in_the_streets_desc: "The public security law already lets a prefect dissolve any association, and the labour chambers march wherever the police are thin. We will take politics off the street: no processions, uniforms or bands, and no undeclared meetings."
 ITADNC_u_the_scholars_come_home: "The Scholars Come Home"
 ITADNC_u_the_scholars_come_home_desc: "Our best physicist works in England because no ministry here would pay for his masts, and our navy had to buy his invention from a foreign company. We will bring the men and their patents home and pay them what they earn abroad."
 ITADNC_u_the_kings_academy: "The King's Academy"
 ITADNC_u_the_kings_academy_desc: "The Lincei academy lives on the King's own purse, and the Crown has quietly funded more research than the ministry. We will make royal patronage an institution, with chairs, laboratories and a stipend a young scholar can live on."
 ITADNC_u_the_sea_that_closes: "The Depots at Taranto"
 ITADNC_u_the_sea_that_closes_desc: "Every ton of coal that turns our wheels comes by sea from Cardiff, in ships that will not sail for us when we need them. We will fill the depots at Taranto while peace lasts and buy convoys to carry the coal ourselves."
 ITADNC_u_the_subversives_expelled: "The Subversives Expelled"
 ITADNC_u_the_subversives_expelled_desc: "The anarchist law lets us put a man on a train across the border, and the Rome conference made our neighbours care where he gets off. We will clear the plotters out of the Kingdom and leave the rest to Switzerland and France."
 ITADNC_u_the_school_of_turin: "The School of Turin"
 ITADNC_u_the_school_of_turin_desc: "Piedmont made the Kingdom with its army before the deputies agreed on a flag, and the war school at Turin still teaches it. We will put the school back at the heart of the service, and its officers will shape the country."
 ITADNC_u_the_liberal_leaning: "The Liberal Leaning"
 ITADNC_u_the_liberal_leaning_desc: "The radicals and the Extreme Left have come in from the cold, and popular blocs are winning the prefects' towns. We will give our shield a liberal colour and govern with men who can talk to the leagues without calling the troops."
 ITADNC_u_the_conservative_leaning: "The Conservative Leaning"
 ITADNC_u_the_conservative_leaning_desc: "The constitutional right finally has its own newspaper, where Sonnino and Salandra print what ministries have only dared to do. We will give our shield a conservative colour and govern with men who hold that the State is obeyed first."
 ITADNC_u_the_shared_laboratories: "The Shared Laboratories"
 ITADNC_u_the_shared_laboratories_desc: "The scientific congresses meet regularly, and the Milan exhibition brought Europe's instrument makers through the new tunnel to see us. We will open our laboratories to anyone who opens theirs, and allies make the exchange worth more."
 ITADNC_u_the_technical_missions: "The Technical Missions"
 ITADNC_u_the_technical_missions_desc: "Terni learned armour from Vickers and Ansaldo learned gun-boring from Armstrong, by sending men abroad rather than buying drawings. We will send such missions as a matter of policy and share what they bring back with our allies."
 ITADNC_u_the_kings_machines: "The King's Machines"
 ITADNC_u_the_kings_machines_desc: "The airship park has more ideas than money, and our naval office is drawing a battleship no other navy has imagined. We will pay for both from the King's own household and let the ministries argue about it afterwards."
 ITADNC_u_everything_for_the_army: "Everything for the Army"
 ITADNC_u_everything_for_the_army_desc: "The war is here, and the depots we filled in peace are all that stand between our divisions and empty magazines. We will open them entirely and give the army everything it can carry, and the factories will have to wait."
 ITADNC_u_the_garibaldian_legion: "Garibaldi's Legion"
 ITADNC_u_the_garibaldian_legion_desc: "Garibaldi's red shirts went to fight in Greece within living memory, and the Kingdom has used its volunteers as often as it feared them. We will raise the legion under the royal colours, so those who might march against us march for us."
 ITADNC_u_the_territorial_militia: "The Territorial Militia"
 ITADNC_u_the_territorial_militia_desc: "Our mobile and territorial militias exist only on paper, without officers or rifles, and every reform has been shelved. We will officer them from the reserve list and equip them, so they count as troops and not as names."
 ITADNC_u_the_state_that_provides: "The State That Provides"
 ITADNC_u_the_state_that_provides_desc: "The labour office and the law on women's and children's work were voted by men who agreed on nothing else. We will make relief and insurance the business of the State, not of a party, and let both sides of the Chamber claim the credit."
 ITADNC_u_the_station_at_coltano: "The Wireless Station"
 ITADNC_u_the_station_at_coltano_desc: "The Crown has given the marshes near Pisa to the man who sent a signal across the Atlantic, because no ministry could find him a site. We will finish the station so our fleet can be reached by wireless wherever it sails."
 ITADNC_u_the_piedmontese_gunners: "The Turin Gunners"
 ITADNC_u_the_piedmontese_gunners_desc: "We have bought the licence for the quick-firing gun, and it is the equal of anything in Europe, but our gunners are still trained as their fathers were. We will rebuild the artillery school at Turin around it and retrain the whole arm."
 ITADNC_u_the_glory_of_the_royal_army: "The Royal Army's Glory"
 ITADNC_u_the_glory_of_the_royal_army_desc: "Our army has carried Adwa on its back for a generation, and every recruit knows it. We will bury that verdict under a service the country is proud of, and make the army the first institution of the Kingdom again."
 ITADNC_u_the_shield_of_the_constitution: "The Shield of the Constitution"
 ITADNC_u_the_shield_of_the_constitution_desc: "The Hague conferences have met, an Italian has won the peace prize, and our Carabinieri keep order in Macedonia for Europe. We will summon the governments that answer to no parliament to accept the arbitration they signed."
 ita_dnc.2610.t: "Rome Asks for an Audience"
 ita_dnc.2610.d: "The Italian minister has asked for an audience in a week's time. He has let it be known what he means to put on the table when he comes.\n\nThe Prince has that long to decide whether the house of Petrovic answers to Rome, to Vienna, or to nobody. The court will spend the week arguing about it."
 ita_dnc.2610.a: "Prepare for the demand, and count our friends."
 ita_dnc.2602.t: "The Offer from Rome"
 ita_dnc.2602.d: "The Italian paper is on the Prince's table. Rome asks for a son of the house to be brought up in Italy, and for our despatches to be read there before they are answered.\n\nIn exchange we are offered the subsidy, the harbour company at Antivari and an Italian guarantee. Vienna will hear of it within the week, and Vienna has views about this house."
 ita_dnc.2602.a: "Accept the terms. The two houses are already one."
 ita_dnc.2602.b: "Refuse. Cetinje is not a Roman province."
 ita_dnc.2603.t: "The Prince Comes to Rome"
 ita_dnc.2603.d: "The Prince has accepted. A boy of the house of Petrovic will be brought up at the Quirinal, and the harbour company passes into Italian hands.\n\nCetinje's despatches will be read here before they are answered. We may announce the arrangement and guarantee the little kingdom, or keep it to ourselves and say nothing to Vienna."
 ita_dnc.2603.a: "Bind the two crowns openly, and guarantee Cetinje."
 ita_dnc.2603.b: "Say nothing, and keep the arrangement private."
 ita_dnc.2604.t: "The Men from Rome"
 ita_dnc.2604.d: "A train from Italy has left a crowd of men on our platform. They carry expulsion orders, and no country beyond ours will take them.\n\nRome calls them anarchists. Our own police call them printers, cobblers and one poet. We may keep them under watch at our own expense, or put them back on the train."
 ita_dnc.2604.a: "Keep them, and open a file on each."
 ita_dnc.2604.b: "Put them back on the train to Italy."
 ita_dnc.2606.t: "The Ministry Is Chosen"
 ita_dnc.2606.d: "The returns are in, and no group has the majority that would let the King send for its leader.\n\nThe King may call the man the Chamber will follow, who governs by bargaining and lasts as long as the bargain. Or he may call the man the Crown trusts, who governs by decree and is obeyed until he is not."
 ita_dnc.2606.a: "Send for the man the Chamber follows."
 ita_dnc.2606.b: "Send for the King's own man."
 ita_dnc.2608.t: "A Summons to The Hague"
 ita_dnc.2608.d: "An Italian note has been handed to our foreign ministry. Italy invites us to take our quarrels with our neighbours to the permanent court at The Hague.\n\nThe court would rule on us, and we would appoint none of its judges. Refusing costs us nothing today, and gives Rome a grievance it can keep as long as it likes."
 ita_dnc.2608.a: "Accept, and take our quarrels to the court."
 ita_dnc.2608.b: "Refuse the note. Rome may keep its lectures."
 ITA_u_crown_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_u_crown_if_they_refuse_tt: "\n§YEffects if they refuse:§!"
 ITA_u_crown_tt_the_capital_answers: "§YCetinje will answer.§! The Prince may bind his house to ours, or refuse and leave us a war goal against him."
 ITA_u_crown_tt_the_capitals_answer: "§YEvery major power that answers to no chamber is summoned.§! Those that sit down with us become friendlier, and those that refuse give us a war goal against them."
 ITA_u_tt_the_articles_returned: "The Crown names the ministers and dissolves the Chamber again, as the articles were written. Elections are no longer held."
 ITA_u_tt_the_command_governs: "The chief of the general staff takes the presidency of the council, and the army's programme becomes the government's."
 ITA_u_tt_the_prefects_may_act: "The prefects may dissolve any association by decree, and the public security guards answer to the Interior alone."
 ITA_u_tt_the_academies_are_open: "The chairs left empty for want of money are filled, and the men who took their instruments abroad are offered them back at home."
 ITA_u_tt_the_royal_patronage: "The King's own purse pays for the laboratories the budget will not, and the academy answers to the Crown rather than to the ministry of instruction."
 ITA_u_tt_the_depots_are_filled: "Coal, oil and grain are bought while the sea is open and stored where the fleet can guard them. The country pays for the stores now and uses them in a war."
 ITA_u_tt_the_depots_are_opened: "The depots are opened entire. What was bought against a blockade goes to the divisions in the field, and the factories at home go short."
 ITA_u_tt_the_neighbour_decides: "The expelled men are put over the frontier. Whether they are watched, jailed or sent straight back to us is no longer our decision."
 ITA_u_tt_the_school_forms_the_country: "The war school takes the whole promotion list through its hands, and an officer who has not passed it does not command."
 ITA_u_crown_tt_an_advisor_is_available: "§YA political adviser is now willing to serve:§!"
 ITA_u_tt_the_red_shirts_muster: "Five volunteer legions muster under the royal colours, officered from the reserve list and paid by the war ministry."
 ITA_u_tt_the_verdict_reversed: "The defeat at Adwa is struck out of the service, and the burden it laid on the army is lifted if the army still carries it."
 ITA_u_tt_the_laboratories_are_shared: "Our institutes are opened to every ally and theirs to us, and the exchange is worth twice as much if we are in a faction."
 ITA_u_tt_the_royal_workshops: "The airship park and the naval drawing office are paid out of the royal establishment, and neither has to wait for a vote."
 ITA_u_tt_the_station_speaks: "The station on the royal estate carries the fleet's traffic and the government's, and any ship under our flag can be reached from it."
 ITA_u_tt_the_country_answers: "The constituencies have spoken, and the King must now choose his minister. He may call the Chamber's man or his own."
 ITA_u_the_royal_army_tt: "§YThe Army of the Kingdom§! grows with every reform on this road. The guns shoot harder, and the reserves come to the depots faster."
 ITA_u_artillery_attack_tt: "Artillery attack of the Royal Army: §Y[?ITA_u_army_artillery_attack|%1]§!"
 ITA_u_artillery_defence_tt: "Artillery defence of the Royal Army: §Y[?ITA_u_army_artillery_defence|%1]§!"
 ITA_u_the_royal_army: "The Army of the Kingdom"
 ITA_u_the_royal_army_desc: "The gunners of Turin are the arm this road pays for first. Every licence bought and every battery re-taught is felt in the field."
 ITA_u_the_king_restored: "The King Restored"
 ITA_u_the_king_restored_desc: "The Crown is again the first authority of the Kingdom and not the last resort of a ministry. Whoever governs, governs in the King's name and knows he may be replaced in it."
 ITA_u_the_shield_of_the_state: "The Shield of the State"
 ITA_u_the_shield_of_the_state_desc: "Politics has been taken out of the street and put back into the Chamber, where the prefects can watch it. The country is quieter, and the men who lived by processions are looking for other work."
 ITA_u_the_shield_of_the_left: "The Shield of the Left"
 ITA_u_the_shield_of_the_right: "The Shield of the Right"
 ITA_u_the_shield_of_the_left_and_labour: "The Left Shield and Labour"
 ITA_u_the_shield_of_the_right_and_labour: "The Right Shield and Labour"
 ITA_u_the_shield_of_the_left_complete: "The Left Shield of the Constitution"
 ITA_u_the_shield_of_the_right_complete: "The Right Shield of the Constitution"
 ITA_u_the_school_of_turin: "The School of Turin"
 ITA_u_the_school_of_turin_desc: "The war school teaches that the Kingdom was made by regiments and is held by them. The officers it turns out believe it, and so do the men they command."
 ITA_u_the_school_of_turin_2: "The School of Turin: The Levy"
 ITA_u_the_school_of_turin_3: "The School of Turin: The Glory"
 ITA_u_the_school_of_turin_4: "The School of Turin: First Institution"
 ITA_u_the_scholars_returned: "The Scholars Returned"
 ITA_u_the_royal_patronage: "The Royal Patronage"
 ITA_u_the_depots_at_taranto: "The Depots at Taranto"
 ITA_u_the_depots_at_taranto_desc: "The coal and the oil are bought while the sea is open and stored where the fleet can watch them. The country pays for it in shortages at home."
 ITA_u_everything_for_the_army: "Everything for the Army"
 ITA_u_the_technical_missions: "The Technical Missions"
 ITA_u_the_station_at_coltano: "The Station at Coltano"
 ITA_u_the_volunteers: "The Volunteers Under the Royal Colours"
 ITA_u_the_volunteers_desc: "These men came to the depots for a cause and not for a conscription notice. They fight harder than the line and obey a little worse, and the war ministry can live with that."
 ITA_u_the_house_of_petrovic: "The House of Petrovic"
 ITA_u_the_house_of_petrovic_desc: "The marriage has become an arrangement. A prince of Cetinje is brought up at the Quirinal, the harbour company is ours, and the little kingdom's despatches are read here first."
 ITA_u_the_returned_exiles: "The Exiles Sent Back"
 ITA_u_the_men_from_rome: "The Men from Rome"
 ITA_u_the_oath_to_the_statuto: "the oath to the Statuto"
 ITA_u_return_to_the_statuto: "the return to the Statuto"
 ITA_u_the_king_is_called_home: "the demand made at Cetinje"
 ITA_u_the_shield_of_the_constitution: "the summons to the court"
 the_scholars_come_home: "The Scholars Come Home"
 the_kings_academy: "The King's Academy"
 the_shared_laboratories: "The Shared Laboratories"
 the_kings_machines: "The King's Machines"
 the_station_at_coltano: "The Station at Coltano"
 the_piedmontese_gunners: "The Piedmontese Gunners"
 ITADNC_u_the_second_note_to_paris: "The Second Note to Paris"
 ITADNC_u_the_second_note_to_paris_desc: "Our first note told Paris only that we would not join an attack on France. We will send a second, trading a free hand in the west for a free hand in the east, and the Triple Alliance will learn of it late."
 ITADNC_u_the_defence_treaty_with_paris: "The Defence Treaty with Paris"
 ITADNC_u_the_defence_treaty_with_paris_desc: "A secret note protects nobody in a crisis, and our understanding with Paris must become a treaty. We will bind both frontiers with a mutual guarantee and keep the paper where Berlin and Vienna cannot read it."
 ITADNC_u_the_industrial_cooperation: "The Industrial Cooperation"
 ITADNC_u_the_industrial_cooperation_desc: "The steel works at Terni and the dynamo shops at Milan need capital. The only money in Europe that comes without a political price is French. We shall open the north to the banks of Paris. They will build what our own houses cannot."
 ITADNC_u_the_shared_patents: "The Shared Patents"
 ITADNC_u_the_shared_patents_desc: "Our foundries copy what they are shown and pay for what they are not, and the French do the same to us. We will trade licences with Schneider and Saint-Chamond, share the drawings of Terni and Ansaldo, and research together."
 ITADNC_u_the_coal_and_the_ore: "The Coal and the Ore"
 ITADNC_u_the_coal_and_the_ore_desc: "Every furnace we light burns Cardiff coal that a foreign fleet can stop. We will trade the iron ore of Elba for French coal from the Loire, and buy nothing across the Channel that a friend can sell us."
 ITADNC_u_the_works_for_the_ore: "The Works for the Ore"
 ITADNC_u_the_works_for_the_ore_desc: "France has the iron ore and the bauxite. We have the men who know how to work them. We shall move plant across the Alps in exchange for what comes out of her ground. Two industries tied together hold better than a treaty."
 ITADNC_u_the_spheres_in_the_middle_sea: "Spheres in the Middle Sea"
 ITADNC_u_the_spheres_in_the_middle_sea_desc: "Two powers cannot want the same shore and stay friends. France and Italy have to settle the Mediterranean between them. We shall draw the line ourselves: the west to Paris, the east to us. It will hold as long as Paris holds to it."
 ITADNC_u_the_hand_to_barcelona: "The Hand to Barcelona"
 ITADNC_u_the_hand_to_barcelona_desc: "They shot the schoolmaster in the ditch at Montjuic. The news emptied our own workshops for a week. We shall send men, money and printers to the Catalan comrades. Our own men will learn in their streets what they will need at home."
 ITADNC_u_the_comrades_of_the_east: "The Comrades of the East"
 ITADNC_u_the_comrades_of_the_east_desc: "Strikers in Petersburg are fed by collections taken in Turin and Milan, and the police of two empires read the same lists. We will organise the collection properly and send men east with the money to learn what they can."
 ITADNC_u_the_littoral_rises: "Trieste Rises"
 ITADNC_u_the_littoral_rises_desc: "The principle of nationality was born here, and it can be turned on the empire that once used it against us. We will not march to annex the Adriatic coast. We will call its workmen to rise and unmake the government that holds them."
 ITADNC_u_the_general_strike_abroad: "The General Strike Abroad"
 ITADNC_u_the_general_strike_abroad_desc: "The congresses voted that the answer to war is a strike in every country that declares it, and no party has dared to try. We will pay for the halls, printers and funds beyond our border, and the parties that answer will stand with us."
 ITADNC_u_support_the_proletarian_uprising: "Back the Workers' Rising"
 ITADNC_u_support_the_proletarian_uprising_desc: "A rising that runs out of bread in a fortnight teaches everyone the wrong lesson. We will keep a standing fund at the disposal of the labour chambers, so the next rising abroad does not end for want of money."
 ITADNC_u_the_hand_to_lisbon: "The Hand to Lisbon"
 ITADNC_u_the_hand_to_lisbon_desc: "Portugal's King was shot in a public square, and the throne now rests on the garrison alone. The republicans have men and newspapers but neither money nor friends, and we will give them both."
 ITADNC_u_the_congress_of_the_nations: "The Congress of the Nations"
 ITADNC_u_the_congress_of_the_nations_desc: "Trentini, Ruthenes, Poles and Croats have no seat in the parliaments that rule them. We will call them to Rome and invite every empire to send them, and from that platform raise new states across the Danube and the Balkans."
 ITADNC_u_the_red_legion: "The Red Legion"
 ITADNC_u_the_red_legion_desc: "Red shirts went abroad for other men's freedom within living memory, and the volunteers are still there to be called. We will raise the legion again under the leagues instead of a general, train it beside the army, and send it abroad."
 ITADNC_u_the_international_at_rome: "The International at Rome"
 ITADNC_u_the_international_at_rome_desc: "Our party has asked every congress to seat the International in Rome and been refused every time. We will call it here on our own authority, and our men abroad will have funds, speakers and presses."
 ITADNC_u_a_europe_of_labour: "A Europe of Labour"
 ITADNC_u_a_europe_of_labour_desc: "The congresses at Paris and Amsterdam declared that the continent belongs to those who work it, then everyone went home. We will act on it instead of reprinting it, and our men will organise every small state in Europe."
 ITADNC_u_the_end_of_the_thrones: "The End of the Thrones"
 ITADNC_u_the_end_of_the_thrones_desc: "Our programme says what is to be done with crowns, and we have done it with our own, yet kings still rule on every frontier we touch. We will not stop at the Alps, and no crowned government in Europe can say it was not warned."
 ITADNC_u_the_ships_that_carry_them: "The Ships That Carry Them"
 ITADNC_u_the_ships_that_carry_them_desc: "The State pays the subsidy that keeps the emigrant liners sailing, so it may say who and what sails with them. We will write our politics into the shipping contracts, and our men and papers will travel with the emigrants."
 ITADNC_u_proletarian_solidarity: "Workers Stand Together"
 ITADNC_u_proletarian_solidarity_desc: "Every labour chamber keeps a fund for widows and locked-out men, but only for its own city. We will join the funds into one, so what one city can spare another may draw, and no strike starves a town into surrender."
 ITADNC_u_the_end_of_the_protectorates: "The End of the Protectorates"
 ITADNC_u_the_end_of_the_protectorates_desc: "Reformers in London have shown what a protectorate does to the people inside it, and our press printed every word. We will take up their case, and every colony in the world will hear that Rome has spoken for it."
 ITADNC_u_the_leagues_of_the_plate: "The Leagues of the Plate"
 ITADNC_u_the_leagues_of_the_plate_desc: "More Italians live on the River Plate and in São Paulo than in many of our own provinces, and their halls and presses are already ours. We will organise them city by city, whatever residence laws are written against them."
 ITADNC_u_the_young_turks: "The Young Turks"
 ITADNC_u_the_young_turks_desc: "The officers at Salonika forced an old empire to change its constitution in a single summer, and every capital in the East noticed. We will find the men who will do the same elsewhere and give them money and arms."
 ITADNC_u_war_on_the_counting_house: "War on the Counting House"
 ITADNC_u_war_on_the_counting_house_desc: "Our congress declared that capital has no country, and its greatest fortress lies across the ocean in the United States. We must break it there or watch it buy back everything we took here, and that means war with America."
 ITADNC_u_the_answer_to_tokyo: "The Answer to Tokyo"
 ITADNC_u_the_answer_to_tokyo_desc: "Our yards sold Japan the cruisers that helped it beat Russia, and we were paid to build a new empire in the East. We will answer for that ourselves and send the fleet east before Japan comes to teach us the lesson."
 ITADNC_u_the_labour_hegemony: "Labour Rules Europe"
 ITADNC_u_the_labour_hegemony_desc: "The leagues govern here, and a lone workers' state ringed by empires will not be left in peace. We will make labour master of the continent, and that means war with every great power at once, a war we cannot stop halfway."
 ita_dnc.2700.t: "The Second Note from Rome"
 ita_dnc.2700.d: "The Italian ambassador has left a note with us. It says, without quite saying it, that Rome will not march with Vienna and Berlin against us.\n\nNothing is signed and nothing is published. Rome asks only that we write the same words down, and the paper costs us no army and no colony. It will make an enemy of the Triple Alliance the day it becomes known."
 ita_dnc.2700.a: "Give Barrere the same words in writing."
 ita_dnc.2700.b: "Refuse. Rome signs with everyone."
 ita_dnc.2702.t: "A Treaty of Mutual Defence"
 ita_dnc.2702.d: "Rome now asks for what the note left unsaid. Neither of us is to be attacked without the other standing up.\n\nOur staff wants the Alpine frontier quiet, and our admirals want the middle sea shared. The price is that we answer for Italy's quarrels as she answers for ours, and we can show the guarantee to nobody."
 ita_dnc.2702.a: "Guarantee Italy, and let her guarantee us."
 ita_dnc.2702.b: "Refuse. We guarantee nobody's adventures."
 ita_dnc.2704.t: "The Capital for the Mills"
 ita_dnc.2704.d: "Rome has asked our banks to take shares in the steel and the electricity of her north. The works are there. The money is not.\n\nThe houses that would put it up ask only for the blessing of the government. Our shareholders would draw a dividend out of Milan, and the mills we pay for will one day sell against our own."
 ita_dnc.2704.a: "Let our banks take the shares."
 ita_dnc.2704.b: "Refuse. Our banks will not build a rival."
 ita_dnc.2706.t: "The Patents Exchanged"
 ita_dnc.2706.d: "The Italians propose that Schneider and Saint-Chamond open their drawings to Terni and Ansaldo, and that the Italian houses open theirs in return.\n\nOur engineers say the exchange is uneven, and that we would teach more than we learn. Our ministers say a workshop that owes us its patents follows our policy."
 ita_dnc.2706.a: "Let the drawings cross the Alps."
 ita_dnc.2706.b: "Refuse. We do not lend our trade secrets."
 ita_dnc.2708.t: "Coal for Ore"
 ita_dnc.2708.d: "Rome offers the ore of her island for the coal of the Loire, cargo against cargo, and neither of us need ask Cardiff for anything.\n\nOur mines would gain a customer who pays. Her furnaces would gain a supply no fleet can cut. It would tie the two economies together tightly enough to make a quarrel expensive."
 ita_dnc.2708.a: "Let the ships be loaded."
 ita_dnc.2708.b: "Refuse. Our coal is wanted at home."
 ita_dnc.2710.t: "A Line Across the Sea"
 ita_dnc.2710.d: "The Italians propose to draw a line down the middle sea, and that neither of us cross it. The eastern shore and the islands off it would be their affair.\n\nThe west would be ours, from the ocean coast to the desert. No congress will ratify such a thing, and it will hold only as long as both governments want it to."
 ita_dnc.2710.a: "Agree to the line. The west is ours, the east theirs."
 ita_dnc.2710.b: "Refuse. We share nothing with Rome."
 ita_dnc.2880.t: "The Ships from Genoa"
 ita_dnc.2880.d: "Italian volunteers, Italian money and Italian newspapers have come ashore for the strikers of Barcelona. The garrison has asked us for orders.\n\nIf we let them work, we admit that the quarrel in our own streets is now the business of the whole continent. If we turn them back, we say so to our own workmen, in front of the barricades."
 ita_dnc.2880.a: "Let the comrades land."
 ita_dnc.2880.b: "Close the frontier to them."
 ita_dnc.2882.t: "Rome Offers the Republic"
 ita_dnc.2882.d: "The Italians write that the throne here has outlived the country under it. Rome will stand behind whatever the republicans put in its place, with money, presses and recognition on the first morning.\n\nProclaiming the republic puts us in Rome's camp and the crowd in the street behind us. Refusing ends the correspondence, and Rome will look for another way to see it done."
 ita_dnc.2882.a: "Proclaim the republic and take Rome's hand."
 ita_dnc.2882.b: "Refuse. This crown is not Rome's to give."
 ita_dnc.2884.t: "The Congress Meets at Rome"
 ita_dnc.2884.d: "The Italians have called the International to sit in their own capital, and have sent us a place on the platform. Our delegates would speak and vote beside theirs.\n\nWhat the congress resolved would be read out in every hall we have. It would also make Rome, and not us, the address the workmen of the world write to."
 ita_dnc.2884.a: "Send our delegates to Rome."
 ita_dnc.2884.b: "Refuse. The International sits nowhere."
 ita_dnc.2886.t: "A Congress of Nationalities"
 ita_dnc.2886.d: "Rome proposes a congress of the peoples who have no state of their own, and has invited the ones inside our frontiers by name. The Italians call it a hearing. Our police call it a school for agitators.\n\nWhatever we answer will be printed within the week. The peoples in question will read it before our own parliament does."
 ita_dnc.2886.a: "Give them passports and let them talk."
 ita_dnc.2886.b: "Refuse passports for the congress."
 ITA_u_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_u_if_they_refuse_tt: "\n§YEffects if they refuse:§!"
 ITA_u_tt_the_capital_answers: "§YThe capital we have written to answers for itself,§! and we do not choose the answer."
 ITA_u_spheres_of_influence_tt: "§YOurs under the agreement:§! the Tripolitanian and Cyrenaican shore, the Regency of Tunis, the Albanian coast and Montenegro."
 ITA_u_the_western_sphere_tt: "§YTheirs under the agreement:§! Morocco, Algeria and the Syrian coast."
 ITA_u_the_works_for_the_ore_tt: "§YFrance is offered our factories in exchange for her ore.§!"
 ITA_u_the_littoral_rises_tt: "§YThe leagues call the workmen of the Littoral out against the Austrian governor,§! and we answer for whatever follows."
 ITA_u_the_general_strike_abroad_tt: "§YIf we are in no alliance, the leagues found one of their own,§! and every party that follows us may join it."
 ITA_u_support_the_proletarian_uprising_tt: "§YThe chambers of labour get a standing fund§! for strikes and risings that are not our own."
 ITA_u_the_congress_of_the_nations_tt: "§YEvery European power that governs a nation without its consent is asked to send it to Rome.§!"
 ITA_u_the_red_legion_tt: "§YThe leagues raise their own volunteers,§! and the legion can be sent where no ministry would send the army."
 ITA_u_the_leagues_abroad_tt: "§YWe pay for the strike funds and the presses of the International§! in other men's countries."
 ITA_u_the_international_at_rome_tt: "§YThere is no other workers' government anywhere yet,§! and the congress waits until there is one."
 ITA_u_a_europe_of_labour_tt: "§YEvery small state in Europe hears the resolution from us,§! and our men get to work in each of them."
 ITA_u_the_end_of_the_thrones_tt: "§YWe take a quarrel with every crowned government in Europe that is neither our subject nor our ally.§!"
 ITA_u_bypass_the_end_of_the_thrones_tt: "§YThere is no crowned government left in Europe to answer for.§!"
 ITA_u_the_ships_that_carry_them_tt: "§YThe subsidised liners carry our politics as well as our emigrants,§! and the republics of the south learn who fills their cities."
 ITA_u_proletarian_solidarity_tt: "§YThe funds of the chambers of labour are made common,§! and what one city can spare another may draw."
 ITA_u_the_end_of_the_protectorates_tt: "§YEvery people held under another flag learns that Rome has spoken for it.§!"
 ITA_u_the_leagues_of_the_plate_tt: "§YThe halls and the presses of the emigration go to work on the republics of the south.§!"
 ITA_u_the_young_turks_tt: "§YThe committees of the Levant find money, printers and officers,§! and they know who sent all three."
 ITA_u_war_on_the_counting_house_tt: "§YThe quarrel is with capital itself, and its books are kept in the United States.§!"
 ITA_u_the_answer_to_tokyo_tt: "§YThe yards that built Japan her fleet will now answer for it.§!"
 ITA_u_the_labour_hegemony_tt: "§YEvery major power holding ground in Europe that is not with us is now against us.§!"
 ITA_u_the_workers_international: "The Workers' International"
 ITA_u_a_europe_of_labour: "A Europe of Labour"
 ITA_u_the_end_of_the_thrones: "The End of the Thrones"
 ITA_u_the_end_of_the_protectorates: "The End of the Protectorates"
 ITA_u_war_on_the_counting_house: "War on the Counting House"
 ITA_u_the_answer_to_tokyo: "The Answer to Tokyo"
 ITA_u_the_labour_hegemony: "The Labour Hegemony"
 ITA_u_the_hand_to_lisbon: "The Hand to Lisbon"
 ITA_u_the_shared_patents_ns: "The Shared Patents"
 ITA_u_the_shared_patents_ns_desc: "The drawings cross the Alps in both directions. Our engineers work from French plans and the French work from ours, and both sides build faster."
 ITA_u_french_trade_ns: "The Coal of the Loire"
 ITA_u_french_trade_ns_desc: "Ore goes north and coal comes south. No fleet in the Channel decides any longer whether our furnaces burn, and our own mines yield more."
 ITA_u_the_french_capital: "French Capital in the North"
 ITA_u_the_french_capital_desc: "French money is building mills faster than we could build them ourselves. Paris owns a share of each one, and takes the dividend home."
 ITA_u_the_eastern_subscription: "The Eastern Subscription"
 ITA_u_the_solidarity_funds: "The Solidarity Funds"
 ITA_u_the_red_legion_ns: "The Red Legion"
 ITA_u_the_red_legion_ns_desc: "Volunteers of the leagues, sworn to no ministry. They train beside the army and go where the army cannot, and there are far more of them to send abroad."
 ITA_u_the_emigrant_fleet: "The Emigrant Fleet"
 ITA_u_the_emigrant_fleet_desc: "The subsidised liners carry more than passengers, and we decide what. The yards that build them are busy, and the countries they sail to trade with us more readily."
 ITA_u_war_on_the_counting_house_ns: "War on the Counting House"
 ITA_u_the_answer_to_tokyo_ns: "The Answer to Tokyo"
 ITADNC_u_the_free_hand: "The Free Hand"
 ITADNC_u_the_free_hand_desc: "Our foreign ministry calls its doctrine the free hand, and the phrase has outlived the men who coined it. We will promise our signature to no capital, let each bid for it in turn, and take the best offer."
 ITADNC_u_the_mediterranean_system: "The Mediterranean System"
 ITADNC_u_the_mediterranean_system_desc: "The agreements that once bound the Mediterranean powers have lapsed, and every foreign minister since has failed to revive them. We will rebuild the system treaty by treaty, and this time Rome holds the pen."
 ITADNC_u_the_alliance_renewed: "The Alliance Renewed"
 ITADNC_u_the_alliance_renewed_desc: "Vienna wants the Triple Alliance renewed early and unchanged, at no cost to itself. We will sign and name our price in the same breath: Austria-Hungary may join a system that Rome leads, or refuse."
 ITADNC_u_the_habsburg_question: "The Habsburg Question"
 ITADNC_u_the_habsburg_question_desc: "Our press and our diplomats argue over what follows the Habsburg Monarchy, and nobody in Vienna will say it aloud. We will ask plainly whether its peoples are to be heard, and if Vienna refuses, we will prepare for war."
 ITADNC_u_rekindle_the_royalist_sentiment: "Revive Royalist Feeling"
 ITADNC_u_rekindle_the_royalist_sentiment_desc: "The funeral at Monza and the Queen's prayer turned a murdered king into a rallying cry that every court in Europe read. We will send the same story abroad, printed and paid for, and the kings still on their thrones will remember us."
 ITADNC_u_carve_up_the_littoral: "Carve Up the Adriatic Coast"
 ITADNC_u_carve_up_the_littoral_desc: "The resolutions of Fiume and Zara claim the eastern Adriatic for a coalition that never invited us, and its men cannot hold it yet. We will claim the coast and islands ourselves, and say so out loud."
 ITADNC_u_align_the_south_slavs: "Align the South Slavs"
 ITADNC_u_align_the_south_slavs_desc: "The Croat and Serb deputies have resolved at Fiume and Zara to act as one, and they ask Vienna for what it will never grant. We will offer what Vienna refuses, and ask only that they look to us as their patron."
 ITADNC_u_sway_the_balkans: "Sway the Balkans"
 ITADNC_u_sway_the_balkans_desc: "Our officers run a sector of the Macedonian gendarmerie, and General De Giorgis is obeyed there as no other foreigner is. We will turn that police mandate into lasting influence, with a consul behind every gendarme."
 ITADNC_u_establish_a_customs_union: "Establish a Customs Union"
 ITADNC_u_establish_a_customs_union_desc: "Luzzatti's treaties proved our exports can live without protection, and our partners have read the same figures. We will pull down the tariff walls between the members of our system, and our manufacturers will have to compete."
 ITADNC_u_the_first_award_at_rome: "The First Award at Rome"
 ITADNC_u_the_first_award_at_rome_desc: "Tittoni asked that Balkan quarrels be judged in Rome rather than Berlin, and was never given the chair. We will take it ourselves and hand down the first award, giving Romania the ground it claims and owing us for it."
 ITADNC_u_the_mediterranean_cooperation_sphere: "The Cooperation Sphere"
 ITADNC_u_the_mediterranean_cooperation_sphere_desc: "Our post offices in Ottoman lands and our consulates in the Levant already carry far more than mail. We will bind them into one sphere with our partners, so a survey, a school and a shipping line all move on the same word."
 ITADNC_u_extend_the_system_eastward: "Extend the System Eastward"
 ITADNC_u_extend_the_system_eastward_desc: "Our trade treaty with the Porte opened Smyrna, Beirut and Salonika to our consuls, and our merchants followed within the season. We will carry the system east and invite Constantinople, Sofia, Bucharest and Athens to join."
 ITADNC_u_the_capitulations: "Our Consular Courts"
 ITADNC_u_the_capitulations_desc: "Under the capitulations our consular courts in Constantinople and Smyrna judge our subjects under our law, and the Porte has never dared close them. We will have those privileges confirmed and widened, and every judging consul reports."
 ITADNC_u_the_second_award_at_rome: "The Second Award at Rome"
 ITADNC_u_the_second_award_at_rome_desc: "The first award was obeyed. The claimants who were not heard have come back to Rome with their maps. We shall judge again on the same model. Bulgaria gets the ground it claims, and owes us for it as Romania does."
 ITADNC_u_the_trade_agreements: "The Trade Agreements"
 ITADNC_u_the_trade_agreements_desc: "Our commercial treaties are signed, and the partners of our system now ask for the same terms among themselves. We will extend the tariffs to every member, so the Mediterranean keeps its own accounts."
 ITADNC_u_the_integrated_economies: "The Integrated Economies"
 ITADNC_u_the_integrated_economies_desc: "The exposition at Milan showed the continent an Italy standing where the Simplon tunnel meets the sea. We shall braid our industries into those of our partners. After that no member of the system can price a ton of steel on its own."
 ITADNC_u_the_neutral_republic: "The Neutral Republic"
 ITADNC_u_the_neutral_republic_desc: "Our notes with Barrère already bind Paris and Rome to stay out of each other's quarrels, without denouncing any treaty. We will put that understanding on paper and ask the French Republic to sign it."
 ITADNC_u_the_march_on_the_var: "The March on the Var"
 ITADNC_u_the_march_on_the_var_desc: "Every chief of staff since Saletta has kept the plan for war with France up to date, down to the frontier railways. We will take it out of the drawer and march, and our claim reaches far beyond the Var."
 ITADNC_u_the_note_to_christiania: "The Note to Norway"
 ITADNC_u_the_note_to_christiania_desc: "Norway won its independence without a shot, and the powers soon guaranteed its integrity. We will send our own note north, offering Norway our guarantee and a place in our alliance for nothing but a signature."
 ITADNC_u_the_mediterranean_confederation: "A Mediterranean Union"
 ITADNC_u_the_mediterranean_confederation_desc: "Our newspapers and our foreign ministry have each drawn up a confederation of the Mediterranean, and neither ever convened one. We will convene it ourselves, one table and one set of rules, with Rome in the chair."
 ITADNC_u_the_latin_sisters: "The Latin Sisters"
 ITADNC_u_the_latin_sisters_desc: "Prinetti's note and the visit of the French President to Rome have already made the understanding a fact. Neither capital will admit it out loud. We shall ask Paris to admit it in writing, and to stand with us in the sea we share."
 ITADNC_u_the_hand_on_the_var: "The Hand on the Var"
 ITADNC_u_the_hand_on_the_var_desc: "More Italians than Frenchmen live in Tunis, and our staff has drawn a coup no minister has seen. Paris is bound by our neutrality treaty, so we will take Tunis while it holds. If France sees it coming, we get nothing."
 ITADNC_u_partition_the_porte: "Partition the Porte"
 ITADNC_u_partition_the_porte_desc: "Our foreign ministry has weighed three Ottoman policies, and the first is to share the Empire out. We will put the partition to our partners and let each name its share. Constantinople will hear soon, and it ends in war."
 ITADNC_u_prop_up_the_porte: "Prop Up the Porte"
 ITADNC_u_prop_up_the_porte_desc: "The second policy is to keep the Ottoman Empire standing, because a weak neighbour is worth more than a strong one. We will guarantee the Porte and build the works that make it worth guaranteeing, and Tripoli stays Ottoman."
 ITADNC_u_the_shore_alone: "The Shore Alone"
 ITADNC_u_the_shore_alone_desc: "The third policy asks for the African shore and nothing more, no share of Constantinople and no word on the Straits. We will name our price to the Porte: Tripolitania, Cyrenaica and the Fezzan, or we take them by force."
 ITADNC_u_the_league_of_the_middle_sea: "The Middle Sea League"
 ITADNC_u_the_league_of_the_middle_sea_desc: "The system began as a set of lapsed agreements. It is now a table at which the whole basin sits. We shall name it a league at last. The middle sea will be governed by those who live on it, and the era we began ends here."
 ita_dnc.2720.t: "The Treaty Comes Up Again"
 ita_dnc.2720.d: "The ambassador from Rome asks that the alliance be renewed early and without conditions, as it was renewed before any of us held office.\n\nHe offers us a place in a system that Rome intends to lead, and he does not pretend otherwise. Signing keeps our southern frontier quiet. Refusing leaves that frontier to the generals."
 ita_dnc.2720.a: "Sign again, and take the place offered."
 ita_dnc.2720.b: "Refuse. The Monarchy needs no Latin partner."
 ita_dnc.2722.t: "The Nationalities Speak"
 ita_dnc.2722.d: "The Italian note asks, in the politest possible language, what we intend to do about the peoples we govern and do not represent.\n\nWhatever answer we give will be printed in Zagreb and Prague before it is read in Rome. Hearing them out would steady the empire and cost the Emperor's ministers their authority. Refusing would put Rome at war with us."
 ita_dnc.2722.a: "Grant the nationalities a hearing."
 ita_dnc.2722.b: "Refuse. The Monarchy is not a debating club."
 ita_dnc.2724.t: "Rome or Vienna"
 ita_dnc.2724.d: "An envoy from Rome has come with the proposal our deputies have wanted for years and never once been offered. He asks nothing of our language or our church.\n\nHe asks only that we look south when we look for a patron. Vienna has promised us as much twice, and delivered neither time."
 ita_dnc.2724.a: "Take Rome's hand, and not Vienna's."
 ita_dnc.2724.b: "Refuse the envoy. We take nothing on a promise."
 ita_dnc.2726.t: "The Tariff Wall"
 ita_dnc.2726.d: "Rome proposes that the duties between the members of the system come down together, and has sent us the schedules already drawn.\n\nOur exporters have read them and are delighted. Our manufacturers have read them and are not. The question is whether our workshops meet the open market now or later."
 ita_dnc.2726.a: "Bring the tariff wall down with them."
 ita_dnc.2726.b: "Keep our duties. Our industries are not ready."
 ita_dnc.2728.t: "The Award at Rome"
 ita_dnc.2728.d: "The powers have argued over the same valleys since before our grandfathers were born. Rome has at last offered to judge between them.\n\nThe award is read out with our minister beside the Italian one and the maps unrolled on the table. It gives us a claim on every district we call our own, and the other great powers will not forgive it."
 ita_dnc.2728.a: "Accept the award and press our claims."
 ita_dnc.2729.t: "The Second Award"
 ita_dnc.2729.d: "A second court sits at Rome, and this time it is our claim on the table. Romania took the first award, and the chancelleries already call it a client of Rome.\n\nWe shall be called the same. The award gives us the districts we claim, and we take the name that comes with them."
 ita_dnc.2729.a: "Accept the award, and the name that comes with it."
 ita_dnc.2730.t: "The Consular Privileges"
 ita_dnc.2730.d: "The Italian embassy asks that the old privileges be confirmed and widened. Their own courts would go on judging their own subjects in our cities.\n\nOur jurists call it a wound that never closes. Our treasury answers that the trade which follows is real money, and that the Empire has granted worse and survived it."
 ita_dnc.2730.a: "Confirm the privileges and widen them."
 ita_dnc.2730.b: "Refuse. The Empire is not a market."
 ita_dnc.2732.t: "A Warning from Rome"
 ita_dnc.2732.d: "Our attache in Rome reports that something has been decided and that we are the subject of it. He cannot yet say what.\n\nThe prefects along the frontier are told to expect a note before the season is out. We can put the army and the country on notice now, and argue about it afterwards."
 ita_dnc.2732.a: "Warn the frontier and prepare the country."
 ita_dnc.2734.t: "The Treaty of Neutrality"
 ita_dnc.2734.d: "Rome offers us a treaty of neutrality. Neither of us would join a war the other started, and Italy does not offer to leave its own alliance in order to sign it.\n\nOur ambassador believes the offer is honest. Signing takes the Alpine frontier out of our calculations. Refusing leaves Italy free to press its claims there."
 ita_dnc.2734.a: "Sign the treaty of neutrality."
 ita_dnc.2734.b: "Refuse the treaty and keep our hands free."
 ita_dnc.2736.t: "Rome Offers a Guarantee"
 ita_dnc.2736.d: "A note has arrived from Rome. Italy offers to guarantee our borders and to give us a seat at its own table in the Mediterranean.\n\nWe are a small kingdom, lately made, and we have taken care to owe nothing to anybody. A guarantee from a great power is protection now and a debt later. The note must be answered."
 ita_dnc.2736.a: "Accept the Italian guarantee."
 ita_dnc.2736.b: "Decline the offer and stay neutral."
 ita_dnc.2738.t: "Rome Asks for an Alliance"
 ita_dnc.2738.d: "The Italian ambassador has asked us to come out into the open. He wants the Republic in a formal alliance with Rome, and he says so plainly.\n\nItaly calls it two Latin powers on one sea. Our frontier does not face south and our quarrels are not in the Mediterranean. We must sign or say no."
 ita_dnc.2738.a: "Join the alliance with Rome."
 ita_dnc.2738.b: "Refuse the alliance and keep our hands free."
 ita_dnc.2740.t: "Italian Agents in Tunis"
 ita_dnc.2740.d: "Our officials in Tunis report Italian officers in plain clothes and Italian money in the wrong hands. The garrison there has become too small for the work.\n\nRome is bound by treaty not to march on the Regency of Tunis, and has found a way to arrive without marching. We can give the Regency up, or say aloud what Italy is doing and let Europe judge."
 ita_dnc.2740.a: "Give up the Regency rather than fight for it."
 ita_dnc.2740.b: "Tell the powers what Rome is doing in Tunis."
 ita_dnc.2742.t: "Rome Proposes a Partition"
 ita_dnc.2742.d: "Rome has put a map of the Ottoman lands on the table and asked each of us to point at what we want. The shares offered are generous and the offer will not be made twice.\n\nOur merchants trade in the Empire and will pay for this long after the soldiers go home. We can take a share, or refuse and keep our name with the Ottoman government."
 ita_dnc.2742.a: "Take our share of the partition."
 ita_dnc.2742.b: "Refuse to carve up a state we trade with."
 ita_dnc.2743.t: "The Partition Proposed"
 ita_dnc.2743.d: "Our ambassadors report that a map of the Empire was drawn in Rome and shown to a room of ministers. Not one of them walked out. The shares are named and the claimants counted.\n\nWe can refuse the whole scheme and be attacked by all of them together. Or we can give up our African provinces and keep the capital."
 ita_dnc.2743.a: "Refuse the partition and take the war that follows."
 ita_dnc.2743.b: "Concede the African shore and keep the capital."
 ita_dnc.2744.t: "The Roman Guarantee"
 ita_dnc.2744.d: "Rome offers to guarantee the Empire and to build a factory here at its own expense. It asks for nothing at the signing.\n\nOur ministers remember that the last power to guarantee us took a province for its trouble. We can take the protection, or send the guarantee back."
 ita_dnc.2744.a: "Accept the Italian guarantee."
 ita_dnc.2744.b: "Send the guarantee back to Rome."
 ita_dnc.2746.t: "Rome Demands the African Shore"
 ita_dnc.2746.d: "The Italian note asks for our African provinces and states in writing that Rome wants nothing else. No claim is made on the capital, the straits or the islands, and the ambassador said so twice.\n\nThe shore is far from us, poor, and hard to hold. We can sign it away and be done with it, or refuse and let Italy come for it."
 ita_dnc.2746.a: "Cede the African shore and keep the peace."
 ita_dnc.2746.b: "Refuse. Italy will have to take it by force."
 ITA_u_the_free_hand_tt: "§YOur foreign ministry is free to choose its own friends, and owes its signature to no capital.§!"
 ITA_u_the_mediterranean_system_tt: "§YRome now has a system to offer, and every capital on this sea will judge our next step against it.§!"
 ITA_u_the_royalist_example_tt: "Every crowned government takes the Italian example to heart, and thinks better of Rome for it."
 ITA_u_align_the_south_slavs_tt: "The offer goes to Zagreb and to Ljubljana, and stands open until there is someone there to answer it."
 ITA_u_unlock_influence_countries_tt: "Our consulates may now work on the governments of the neighbouring states, one at a time."
 ITA_u_the_customs_union_tt: "Every member of the system brings its tariff wall down with ours."
 ITA_u_the_first_award_at_rome_tt: "Rome judges the first Balkan claim, and Romania takes its award from our table."
 ITA_u_the_second_award_at_rome_tt: "Rome judges again, and Bulgaria takes the second award from the same table."
 ITA_u_the_cooperation_sphere_tt: "Every member of the system shares its consulates, its post offices and what its men discover."
 ITA_u_extend_the_system_eastward_tt: "The invitation goes east, to the Ottoman government and to Bulgaria, Romania and Greece."
 ITA_u_the_capitulations_tt: "The consular privileges are widened for three years, and our trade follows them into the Empire."
 ITA_u_the_integrated_economies_tt: "Every member of the sphere trades its cooperation agreement for a single integrated economy."
 ITA_u_the_mediterranean_confederation_tt: "The Latin System becomes the Confederation, and every member exchanges its agreement for the new one."
 ITA_u_the_note_to_christiania_tt: "Norway is invited into the system, and offered our guarantee along with the invitation."
 ITA_u_the_league_of_the_middle_sea_tt: "The system takes the name of the League of the Middle Sea, and this road ends there."
 ITA_u_threat_the_alliance_renewed: "Italy renews the alliance on its own terms"
 ITA_u_threat_the_habsburg_question: "Italy demands that Vienna hear its nationalities"
 ITA_u_threat_carve_up_the_littoral: "Italy claims Trieste, Istria and Fiume"
 ITA_u_threat_the_march_on_the_var: "Italy marches on the Var"
 ITA_u_threat_the_shore_alone: "Italy demands the African shore"
 ITA_u_threat_partition_the_porte: "Italy proposes to partition the Ottoman Empire"
 ITA_u_threat_the_hand_on_the_var: "Italy has taken the Regency of Tunis"
 ITA_u_the_mediterranean_system: "The Mediterranean System"
 ITA_u_the_mediterranean_system_desc: "The old agreements of this sea are ours to reopen. The capitals around it come to Rome first now, and wait to see what Rome does next."
 ITA_u_the_nationalities_heard: "The Nationalities Heard"
 ITA_u_the_nationalities_heard_desc: "The Monarchy has agreed to hear the peoples it governs. Every province is drafting its list of demands, and the government must answer them one by one."
 ITA_u_the_hand_of_rome: "The Hand of Rome"
 ITA_u_the_hand_of_rome_desc: "Rome offered what Vienna refused. Our ministries look south for an answer now, and our traders are welcome in Italian ports."
 ITA_u_the_royalist_example: "The Royalist Example"
 ITA_u_the_royalist_example_desc: "The Italian throne survived the murder of its King and came out stronger. Our own court has taken the lesson to heart, and the country is quieter for it."
 ITA_u_the_customs_union: "The Customs Union"
 ITA_u_the_customs_union_desc: "The duties between the members of the system have come down together. The whole sea trades as one market now, and goods at home are cheaper for it."
 ITA_u_the_cooperation_sphere: "The Cooperation Sphere"
 ITA_u_the_cooperation_sphere_desc: "Consuls, post offices, schools and laboratories are pooled across the system. What one member discovers is read in all of them."
 ITA_u_the_integrated_economies: "The Integrated Economies"
 ITA_u_the_integrated_economies_desc: "The industries of the system work as one. No member prices a ton of steel without the others, and building is faster everywhere."
 ITA_u_the_confederation: "The Mediterranean Confederation"
 ITA_u_the_confederation_desc: "The system has one table, one tariff and one set of accounts. Its members no longer bargain against one another, and they build faster together."
 ITA_u_the_capitulations: "Our Consular Courts"
 ITA_u_the_capitulations_desc: "Our own courts judge our own subjects in the cities of the Empire. Our merchants trade behind them, and our consuls hear a great deal."
 ITA_u_the_capitulations_granted: "Consular Courts Granted"
 ITA_u_the_capitulations_granted_desc: "Foreign courts sit in our cities and foreign merchants trade under their own law. Our treasury sees very little of the money, and the government is blamed for it."
 ITA_u_the_trade_agreements: "The Trade Agreements"
 ITA_u_the_trade_agreements_desc: "The trade schedules of the system read the same in every capital. We keep more of what we make, and still sell well abroad."
 ITA_u_the_award_at_rome: "The Award at Rome"
 ITA_u_the_award_at_rome_desc: "Our claim was judged at Rome and granted. The country has not stopped celebrating, and it would fight to keep what it was given."
 ITA_u_the_roman_guarantee: "The Roman Guarantee"
 ITA_u_the_roman_guarantee_desc: "Rome has guaranteed our borders and paid for the works that make the guarantee worth something. The country holds together better for knowing it."
 ITA_u_the_league_of_the_middle_sea: "The League of the Middle Sea"
 ITA_u_the_league_of_the_middle_sea_desc: "This sea is governed by the countries that live on it, and the chair stands in Rome. Our ships and our word both reach further now."
 ITADNC_u_see_to_the_adriatic: "See to the Adriatic"
 ITADNC_u_see_to_the_adriatic_desc: "Vienna settles the affairs of the eastern Adriatic at conferences we are not invited to, and maps a railway through the Sandjak. We hold one of this sea's coasts, and we will tell the small courts across it that Rome answers for them."
 ITADNC_u_restore_the_venetian_borders: "Restore the Venetian Borders"
 ITADNC_u_restore_the_venetian_borders_desc: "The clubs of Trieste hang maps of the old Venetian dominion on their walls. We will claim the whole Venetian inheritance and stop pretending the alliance means anything, and every court will take it as a threat."
 ITADNC_u_safeguard_the_porte: "Safeguard the Porte"
 ITADNC_u_safeguard_the_porte_desc: "The Sultan cannot hold his European provinces alone, and every power offering a shield wants a coast in return. We will offer ours and ask nothing yet, so when we finally ask, he will have nobody else to turn to."
 ITADNC_u_valona_for_guarantees: "Valona for Guarantees"
 ITADNC_u_valona_for_guarantees_desc: "Our consuls have bought schools and roads on the far shore for a generation, and Valona closes the mouth of the Adriatic. We will offer the Porte a deal: the Albanian coast and islands for our word that nobody else takes the rest."
 ITADNC_u_tributes_for_guarantees: "Tributes for Guarantees"
 ITADNC_u_tributes_for_guarantees_desc: "Our tobacco monopoly, harbour company and financial commission already run through the accounts of the small Adriatic courts. We will put it on paper: Montenegro, Serbia and Greece pay for the protection they receive."
 ITADNC_u_safeguard_the_adriatic: "Safeguard the Adriatic"
 ITADNC_u_safeguard_the_adriatic_desc: "Our Queen is a Montenegrin princess, and the courts across the Adriatic would rather deal with a cousin than an army. We will guarantee Montenegro, Serbia and Greece together, so none of them ever needs to call on Vienna."
 ITADNC_u_the_corfu_note: "The Corfu Note"
 ITADNC_u_the_corfu_note_desc: "Venice held Corfu for 400 years, and the island still speaks and judges in Italian. The kingdom that holds it now cannot pay its own creditors. We shall claim the island and send our note to whoever is holding it."
 ITADNC_u_the_venetian_possessions: "The Venetian Possessions"
 ITADNC_u_the_venetian_possessions_desc: "The alliance promised us compensation whenever the Balkan balance changed, and the Empire changed it and paid nothing. We will take our compensation from the weaker party and claim the old Venetian ports outright."
 ITADNC_u_the_frontier_works: "The Frontier Works"
 ITADNC_u_the_frontier_works_desc: "Our engineers have surveyed the passes above the Isonzo, and the small states across the sea have no forts facing the Empire. We will fortify our own frontier and offer Italian engineers and concrete to any court that wants them."
 ITADNC_u_liberate_oppressed_peoples: "Liberate the Oppressed Peoples"
 ITADNC_u_liberate_oppressed_peoples_desc: "Albanian societies have petitioned us for a state of their own, and Ruthene deputies ask the same of a parliament that ignores them. We will put both claims on the map before anyone else, and our committee in Rome will speak for them."
 ITADNC_u_the_arsenal_for_the_allies: "The Arsenal for the Allies"
 ITADNC_u_the_arsenal_for_the_allies_desc: "We lost the Serbian gun trials to Schneider on price and credit, while our rifles in the mountains won more goodwill than any treaty. We will fund the orders ourselves and let Terni and Ansaldo undercut the French."
 ITADNC_u_the_ionian_protectorate: "The Ionian Protectorate"
 ITADNC_u_the_ionian_protectorate_desc: "The Ionian islands were a foreign protectorate within living memory, and Greece has lived under foreign financial control ever since. We must choose between the islands alone or the whole kingdom, and neither demand can be withdrawn."
 ITADNC_u_further_ottoman_concessions: "Further Ottoman Concessions"
 ITADNC_u_further_ottoman_concessions_desc: "Vienna wants its railway through the Sandjak and the country beyond, and our own line needs the same passes. We will demand the interior as well as the coast before Vienna surveys it for us, and take it if the Sultan refuses."
 ITADNC_u_support_the_albanians: "Support the Albanians"
 ITADNC_u_support_the_albanians_desc: "We have paid for Albanian schools, presses and consulates for years without saying what we want. We will say it now: our money and protection in exchange for speaking for them, and if no government exists, our committee will make one."
 ITADNC_u_the_adriatic_duchies: "The Adriatic Duchies"
 ITADNC_u_the_adriatic_duchies_desc: "The resolutions of Fiume and Zara made nationality a doctrine of our own left, and the Empire holds peoples who would rather be duchies than provinces. We will keep a crown ready for each, and promise nothing we do not yet hold."
 ITADNC_u_the_volunteers_of_the_adriatic: "The Volunteers of the Adriatic"
 ITADNC_u_the_volunteers_of_the_adriatic_desc: "Ricciotti Garibaldi is recruiting volunteers for the far shore again, and we are asked every week whether we know. We must decide whether the red shirts sail with our silence. A legion that leaves can be disowned, but not recalled."
 ITADNC_u_the_albanian_crown: "The Albanian Crown"
 ITADNC_u_the_albanian_crown_desc: "The Albanian congresses want a prince but cannot agree on a name, and our House has more princes than thrones. We will offer the crown to Prince Emanuele Filiberto, because a country that owes us its prince will owe us its ports."
 ITADNC_u_the_rump_of_the_porte: "The Rump of the Porte"
 ITADNC_u_the_rump_of_the_porte_desc: "Partition plans have sat in our foreign ministry since the annexation crisis, and whoever waits will find the ground taken. We will finish what is left of Turkey in Europe on our terms, whether the Sultan signs or the army marches."
 ITADNC_u_the_joint_squadron: "The Joint Squadron"
 ITADNC_u_the_joint_squadron_desc: "Our officers command a sector of the Macedonian gendarmerie, and our ships sail in the international squadron. We will make it permanent and hold the eastern manoeuvres under our flag, learning more in a season than in years of paper."
 ITADNC_u_subdue_the_adriatic_states: "Subdue the Adriatic States"
 ITADNC_u_subdue_the_adriatic_states_desc: "We have paid the subsidies, built the railway and bought the opposition, yet the courts across the Adriatic still treat us as equals. We will demand they join our system and keep their crowns, or lose them."
 ITADNC_u_the_hour_of_the_isonzo: "The Hour of the Isonzo"
 ITADNC_u_the_hour_of_the_isonzo_desc: "Our staff has kept the same plan in the same safe for years, while our ally kept its own. The army is in the field and the depots are full. We will demand Austria's Italian provinces, and if Vienna refuses, take the whole Monarchy."
 ITADNC_u_the_springtime_of_nations: "The Springtime of Nations"
 ITADNC_u_the_springtime_of_nations_desc: "The principle we invoked for ourselves cannot stop at our border, and many powers rule nations that never consented. We will free our own allies' subject peoples first, then demand the same of everyone else, and war on whoever refuses."
 ita_dnc.2760.t: "The Italian Note on the Adriatic"
 ita_dnc.2760.d: "The Italian ambassador has read us a note. Rome undertakes to answer for the security of the small courts of the eastern shore. It names no one, and it is not addressed to us.\n\nOur General Staff wants to answer it on the Isonzo. Our foreign ministry would rather buy the quarrel off before the newspapers make it a question of honour. We may also say nothing at all."
 ita_dnc.2760.a: "Move the mountain battalions to the Isonzo."
 ita_dnc.2760.b: "Buy the quarrel off and answer Rome warmly."
 ita_dnc.2760.c: "Say nothing. The note is written for the newspapers."
 ita_dnc.2761.t: "Manoeuvres on the Frontier"
 ita_dnc.2761.d: "The Austrian army has moved its mountain battalions to the Italian frontier, and the movement was announced rather than hidden.\n\nThe Roman press calls it an answer to a note that Vienna says it never received. Both capitals insist that the alliance stands."
 ita_dnc.2761.a: "Note it. The alliance is a piece of paper."
 ita_dnc.2762.t: "Rome Offers Its Good Offices"
 ita_dnc.2762.d: "Rome has sent a note to the smaller states of the continent, offering to speak for them in any quarrel. Nobody doubts which great power the note is aimed at.\n\nAnswering warmly would cost us the goodwill of Vienna, which sits nearer to us than Rome does. Saying nothing costs us nothing today, and leaves us alone tomorrow."
 ita_dnc.2762.a: "Answer Rome warmly and take the offer."
 ita_dnc.2762.b: "Thank Rome and commit to nothing."
 ita_dnc.2763.t: "The Adriatic Question Reopens"
 ita_dnc.2763.d: "Italy has pressed its claim on the eastern shore in the open, and it has been refused in the open.\n\nEvery government in the Balkans is now counting what it holds and what it might be given. The powers with interests there will speak within the month."
 ita_dnc.2763.a: "Press our own claim while the question is open."
 ita_dnc.2763.b: "Note it and say nothing."
 ita_dnc.2764.t: "Vienna Answers the Note"
 ita_dnc.2764.d: "Vienna has chosen to treat our note as a friendly communication, and has said so in writing. Our ambassador was received with more warmth than the occasion needed, and left with assurances he had not asked for.\n\nWe are being paid not to press the matter. The Chamber will take the assurances and the credit that comes with them."
 ita_dnc.2764.a: "Take the assurances and keep the note."
 ita_dnc.2765.t: "Rome Claims the Venetian Coast"
 ita_dnc.2765.d: "Rome has published a claim to the whole Venetian inheritance: the coast we govern and the provinces behind it.\n\nConrad von Hotzendorf has asked for years to read his memorandum on a preventive war to the Emperor. Letting him read it ends the alliance in all but name. Refusing tells Rome that we answer its street societies with silence."
 ita_dnc.2765.a: "Let Conrad read his memorandum to the Emperor."
 ita_dnc.2765.b: "Refuse him. We do not answer street societies."
 ita_dnc.2766.t: "Conrad Reads His War Plan"
 ita_dnc.2766.d: "Our military attache in Vienna reports that Conrad has laid a plan for a preventive war before the Emperor, and was heard out to the end. The plan names our frontier, our depots and the season for it.\n\nWe can answer it quietly in the depots, or print it and let the Chamber judge Vienna."
 ita_dnc.2766.a: "Answer it in the depots and on the drill ground."
 ita_dnc.2766.b: "Print it and let the Chamber judge."
 ita_dnc.2770.t: "The Italian Offer of Protection"
 ita_dnc.2770.d: "The Italian ambassador offers his King's guarantee for our European provinces. For the moment he asks for nothing in return.\n\nAccepting puts an Italian name beside ours in every dispatch about the shore, and makes an enemy of Vienna, which wants the railway. Refusing leaves us where we are, which is alone."
 ita_dnc.2770.a: "Take the Italian guarantee and let Rome answer for us."
 ita_dnc.2770.b: "Refuse. The Sultan needs no Italian shield."
 ita_dnc.2771.t: "The Guarantee Is Signed"
 ita_dnc.2771.d: "The Ottoman government has accepted our word for its European provinces, and the notes were exchanged this morning. Our consuls report that the news reached the villages before it reached the newspapers.\n\nWe are now the one power in this sea whose promise the Sultan holds in writing."
 ita_dnc.2771.a: "Take the credit and hold to our word."
 ita_dnc.2772.t: "Rome Asks for the Coast"
 ita_dnc.2772.d: "Rome asks for the bay of Valona, the coast around it, Epirus and the islands. In exchange Italy offers to answer for everything else we hold in Europe.\n\nThe bay is a harbour we cannot garrison and a debt we cannot pay. Giving it away buys us a protector. Keeping it buys us a war we would fight alone."
 ita_dnc.2772.a: "Give up the coast and take the Italian shield."
 ita_dnc.2772.b: "Refuse. Not one stone of the Sultan's shore."
 ita_dnc.2773.t: "The Shore Is Delivered"
 ita_dnc.2773.d: "The Ottoman government has signed the coast over to us, and asked only that our guarantee be published on the same day. Our marines went ashore at Valona without a shot, and the consulate flag was flying before they landed.\n\nEurope will read the arrangement as a purchase, and it was one."
 ita_dnc.2773.a: "Publish the guarantee with the deed."
 ita_dnc.2774.t: "The Sultan Declines"
 ita_dnc.2774.d: "The Ottoman government has returned our note with thanks and no answer to the question it asked. Our consulates report that the refusal was drafted before the offer arrived.\n\nWe have shown the whole sea what we want, and been refused in front of it. We can prepare to take the coast another way, or let the note lie where it fell."
 ita_dnc.2774.a: "Prepare to take the coast another way."
 ita_dnc.2774.b: "Let the note lie where it fell."
 ita_dnc.2776.t: "Rival Tenders for the Guns"
 ita_dnc.2776.d: "The Italian works have bid for our field batteries, on better terms than they have ever offered before. Their guns come with an Italian subsidy and an Italian friendship we may not want.\n\nThe French house offers a longer credit and asks for nothing anybody will write down. The order must go to one of them."
 ita_dnc.2776.a: "Give the order to Terni."
 ita_dnc.2776.b: "Give the order to Creusot."
 ita_dnc.2777.t: "The Trials Are Lost"
 ita_dnc.2777.d: "The batteries have gone to the French house again, on terms our own works were told were impossible. The subsidy is spent, the estimates are voted, and the guns are in somebody else's country.\n\nThe Chamber will want to know what we bought with the money. We can pay the bill quietly, or print the terms we were beaten by."
 ita_dnc.2777.a: "Pay the bill and say nothing."
 ita_dnc.2777.b: "Publish the terms we were beaten by."
 ita_dnc.2782.t: "Rome Asks to Be Paid"
 ita_dnc.2782.d: "Rome wants to put on paper what has been true for years. Our tobacco, our harbour and our loans are already Italian, and the protection that comes with them has a price.\n\nPaying it makes our independence a matter of book-keeping. Refusing it hands our accounts to whoever offers the next loan."
 ita_dnc.2782.a: "Pay Rome and take the guarantee."
 ita_dnc.2782.b: "Refuse. We are not a province to be farmed."
 ita_dnc.2784.t: "The Tribute Is Entered"
 ita_dnc.2784.d: "A court of the far bank has accepted our terms. The first payment is entered in the books of the Treasury, and our guarantee went out by the same post.\n\nThe other capitals of this sea will hear of it before our own Chamber does."
 ita_dnc.2784.a: "Enter it and guarantee the payer."
 ita_dnc.2786.t: "The Italian Engineers"
 ita_dnc.2786.d: "Rome offers to build the forts on our Austrian frontier at its own cost and with its own engineers. The work would be finished at once.\n\nConcrete laid by a foreign staff is concrete a foreign staff has surveyed. Building it ourselves would take longer than the quarrel is likely to leave us."
 ita_dnc.2786.a: "Let the Italian engineers come."
 ita_dnc.2786.b: "Build our own forts, in our own time."
 ita_dnc.2788.t: "The Italian King's Guarantee"
 ita_dnc.2788.d: "The Italian minister offers his King's guarantee for our frontiers. He asks for no treaty, no base and no payment.\n\nA protector taken on is not easily sent away again. A protector refused is an insult, and Vienna will hear of the refusal within the week."
 ita_dnc.2788.a: "Accept the guarantee of the King of Italy."
 ita_dnc.2788.b: "Refuse the guarantee we did not ask for."
 ita_dnc.2790.t: "The Italian Claim on Corfu"
 ita_dnc.2790.d: "Rome has laid a formal claim to Corfu and asks us to hand it over rather than fight for it. The powers that guaranteed our finances have said nothing at all.\n\nGiving up the island costs us a province and our name. Keeping it may cost us the fleet."
 ita_dnc.2790.a: "Cede the island rather than fight for it."
 ita_dnc.2790.b: "Refuse the note. Corfu is not for sale."
 ita_dnc.2791.t: "Corfu Is Ceded to Us"
 ita_dnc.2791.d: "Corfu has been signed over to us, and our garrison landed at the citadel this morning. The Italian schools that never closed on the island are now schools of the Kingdom.\n\nThe other capitals have protested. None of them has done anything but protest, and the island is ours to hold as Italian ground."
 ita_dnc.2791.a: "Take the island into the Kingdom."
 ita_dnc.2792.t: "The Note Is Refused"
 ita_dnc.2792.d: "The government that holds Corfu has refused our note. It wrote the refusal for the newspapers rather than for us, and it has reinforced the garrison on the island.\n\nIts guarantors have been asked where they stand. Our claim stays on the register, and we have no island to show for it."
 ita_dnc.2792.a: "Press the claim with the army."
 ita_dnc.2792.b: "Leave the claim on the register."
 ita_dnc.2794.t: "The Old Venetian Ports"
 ita_dnc.2794.d: "Rome demands the ports that Venice held on our coast before we took them, from Albania down to Epirus and out to the islands. It offers nothing in exchange.\n\nGiving them up leaves our European provinces without a harbour worth the name. Refusing brings a fleet we cannot meet, and Vienna will take its own share while we are busy."
 ita_dnc.2794.a: "Cede the ports rather than fight the Italian fleet."
 ita_dnc.2794.b: "Refuse the demand and hold the ports."
 ita_dnc.2795.t: "The Answer on the Ports"
 ita_dnc.2795.d: "The Porte, the Ottoman government, has answered our demand for the old Venetian ports. We have the text before the Chamber does.\n\nEither the harbours are signed over to us, or we take them on the claim already on the register. Whichever it is, the answer will be published."
 ita_dnc.2795.a: "Publish the answer as it stands."
 ita_dnc.2796.t: "The Offer from Rome"
 ita_dnc.2796.d: "Rome offers us its guarantee, its subsidies and its schools. In exchange, Italy would speak for us in Europe. Its money has already paid for half the presses now arguing about the offer.\n\nWe can take the guarantee and an Italian hand on our coast with it. Or we can refuse, and stay under the Sultan with Vienna behind him."
 ita_dnc.2796.a: "Take the guarantee and the subsidies."
 ita_dnc.2796.b: "Refuse the offer and stay under the Sultan."
 ita_dnc.2797.t: "The Committee Asks for a State"
 ita_dnc.2797.d: "The committee of the colonies has come to the ministry with a map. It points out that we are offering to guarantee a country that does not exist.\n\nThey want us to make the state first and guarantee it afterwards. That is slower work than a promise, and it will cost us in the Chamber."
 ita_dnc.2797.a: "Put the making of the state on the agenda."
 ita_dnc.2797.b: "Promise the guarantee now and leave the state to them."
 ita_dnc.2798.t: "The Fleet at Taranto"
 ita_dnc.2798.d: "Our ally in Rome has demanded the old Venetian ports from the Porte and been refused. The fleet at Taranto is being provisioned.\n\nWhatever follows will hold the Italian army in the south for a season. We can announce our own claim on that shore while they are busy, or stay out of it and keep our reserves at home."
 ita_dnc.2798.a: "Announce our own claim on the shore."
 ita_dnc.2798.b: "Stay out of it and keep our reserves at home."
 ita_dnc.2800.t: "The Red Shirts Are Recruiting"
 ita_dnc.2800.d: "The son of Garibaldi has opened his lists again. The prefects report that men are leaving for the Adriatic coast by the trainload.\n\nWe can look away, let the legion go, and answer for it in Europe afterwards. Or the Crown can forbid it and keep the volunteers at home, and half the country will say we have betrayed the name."
 ita_dnc.2800.a: "Let the legion go, and answer for it later."
 ita_dnc.2800.b: "Forbid the legion and keep the volunteers at home."
 ita_dnc.2802.t: "A Prince Is Offered"
 ita_dnc.2802.d: "Rome offers us a prince of its own House, a crown, a treasury and its guarantee. In exchange it asks what a protectorate always asks: our foreign affairs, our customs and our obedience.\n\nOur chieftains have never agreed on a prince of their own. Refusing means holding the coast alone against everyone who wants it."
 ita_dnc.2802.a: "Accept the prince, and the Italian protection with him."
 ita_dnc.2802.b: "Refuse the prince, and hold the coast ourselves."
 ita_dnc.2803.t: "The Terms from Rome"
 ita_dnc.2803.d: "Rome proposes to take our foreign affairs and our customs into its own hands, and to leave us our flag. It points out that it is already paying for both.\n\nIf we sign, we keep the flag and little else. If we refuse, Italy will take the same thing by war, and later."
 ita_dnc.2803.a: "Sign the terms, and keep the flag."
 ita_dnc.2803.b: "Refuse the terms and govern ourselves."
 ita_dnc.2804.t: "The Note to Athens"
 ita_dnc.2804.d: "The ministry has two drafts on the table and the courier leaves tonight. Both are addressed to Athens.\n\nThe first asks for the islands alone, from Corfu out to the Aegean, which the powers may swallow. The second asks for the kingdom itself under our control, which will wake every capital that has lent it money."
 ita_dnc.2804.a: "Ask Athens for the islands and nothing more."
 ita_dnc.2804.b: "Ask for the kingdom itself, under our control."
 ita_dnc.2805.t: "The Demand for the Islands"
 ita_dnc.2805.d: "Rome asks for our islands, from Corfu out to the Aegean, and offers its guarantee in return. They are the poorest part of the kingdom and the loudest part of our parliament.\n\nGiving them up buys us an Italian guarantee against the next demand. Keeping them may cost us the fleet and the coast together."
 ita_dnc.2805.a: "Cede the islands and take the Italian guarantee."
 ita_dnc.2805.b: "Refuse, and let them come for the islands."
 ita_dnc.2806.t: "The End of the Dynasty"
 ita_dnc.2806.d: "Rome proposes to close the account and take what is left of us into the Kingdom outright. We are already governed from a foreign capital, and the request is a formality dressed as a treaty.\n\nIf we sign, the dynasty leaves with its dignity. If we refuse, we keep the throne, and Rome will remember the refusal."
 ita_dnc.2806.a: "Sign the act, and let the dynasty withdraw."
 ita_dnc.2806.b: "Refuse to sign, and keep the throne."
 ita_dnc.2807.t: "The Italian Ultimatum"
 ita_dnc.2807.d: "The Italian note demands what is left of our European provinces and sets a term for the answer. Our guarantors have been sounded, and they have offered sympathy.\n\nThe army in Europe can hold the passes for a season. After that there will be nothing left to hold, and we shall be asked to sign anyway."
 ita_dnc.2807.a: "Accept the protectorate and keep the throne."
 ita_dnc.2807.b: "Refuse the note, and fight for the passes."
 ita_dnc.2808.t: "Rome Asks for the Kingdom"
 ita_dnc.2808.d: "Rome proposes to take charge of our finances, our customs and our foreign policy, and to leave the dynasty on its throne. The commission that already governs our revenues would only change its chairman.\n\nAccepting makes us the client of one power instead of four. Refusing makes us the object of a war we would fight alone."
 ita_dnc.2808.a: "Accept the terms, and answer to one creditor."
 ita_dnc.2808.b: "Refuse, and keep the kingdom our own."
 ita_dnc.2809.t: "The Ionian Protectorate"
 ita_dnc.2809.d: "Rome means to take up in the Ionian sea the protectorate this country held there and gave away. Our commercial houses in the Levant are asking whether the flag will follow the trade.\n\nGuaranteeing Greece means a quarrel with a power we have been cultivating. Standing aside leaves that sea to Italy."
 ita_dnc.2809.a: "Guarantee Greece, and keep the islands a British interest."
 ita_dnc.2809.b: "Stand aside. We gave the islands up once already."
 ita_dnc.2810.t: "The Demand for the Interior"
 ita_dnc.2810.d: "Rome now asks for the country behind the coast. It wants Kosovo and the towns along the railway, and the passes the line has to cross.\n\nCeding the interior leaves our remaining provinces without a road between them. Refusing brings a landing on a shore we have already been told we cannot hold."
 ita_dnc.2810.a: "Cede the interior rather than fight for it."
 ita_dnc.2810.b: "Refuse, and hold the passes with the army."
 ita_dnc.2811.t: "Our Road to the Sea"
 ita_dnc.2811.d: "The Italians are taking the interior behind the Adriatic coast, and no note of theirs has mentioned us. Every road they ask for is a road our own merchants use to reach the sea.\n\nWe can protest and have the protest entered in the record. Or we can ask Rome plainly for our portion, while there is still a portion to ask for."
 ita_dnc.2811.a: "Protest, and have the protest recorded."
 ita_dnc.2811.b: "Ask Rome for our share while there is one."
 ita_dnc.2812.t: "The Demand on the Frontier"
 ita_dnc.2812.d: "Our ally in Rome has laid a demand on the table and moved its corps up to the Isonzo. It wants the Trentino and the South Tyrol, the Italian-speaking provinces on our frontier.\n\nGiving them up would cost the Monarchy its mountain frontier and its standing with it. Refusing means a war on a new front, while Berlin decides at its leisure whether the treaty binds it."
 ita_dnc.2812.a: "Cede the Trentino and the South Tyrol, and no more."
 ita_dnc.2812.b: "Refuse the demand and hold the frontier."
 ita_dnc.2813.t: "The Squadron at the Straits"
 ita_dnc.2813.d: "The Italians ask to bring their squadron and their allied captains through the Straits for the manoeuvres of the season. No foreign fleet has ever surveyed that water.\n\nOpening the passage teaches them a sea we would rather keep to ourselves. Keeping them at Salonica costs us nothing and teaches them nothing."
 ita_dnc.2813.a: "Open the Straits to the squadron."
 ita_dnc.2813.b: "Keep them out, and let them anchor at Salonica."
 ita_dnc.2814.t: "The Demand from Rome"
 ita_dnc.2814.d: "The Italian minister has put it to us plainly. We are to enter their system, keep the crown, and take the subsidy as a settled arrangement instead of a favour.\n\nTheir money already pays for our railway, our tobacco and half our opposition. Refusing means holding the coast alone against the fleet that has been supplying it."
 ita_dnc.2814.a: "Enter their system and keep the crown."
 ita_dnc.2814.b: "Refuse the demand, and keep the crown our own."
 ita_dnc.2815.t: "Our Neighbour Refuses"
 ita_dnc.2815.d: "The court across the mountains has refused the Italian demand. It is asking us whether it will have to stand alone.\n\nComing to its aid means a war with a power whose loans we are still repaying. Leaving it to its fate means we shall be next, and alone when our turn comes."
 ita_dnc.2815.a: "Guarantee our neighbour. We shall not be taken one by one."
 ita_dnc.2815.b: "Stay out of it. This is not our quarrel."
 ita_dnc.2816.t: "The Frontier Is Moved"
 ita_dnc.2816.d: "Vienna has given up the Trentino and the South Tyrol rather than fight for them. The commissioners are already marking the new line on the ground.\n\nHalf of what the Italian societies have claimed for a generation is ours by signature. The other half is still on the far side of the frontier."
 ita_dnc.2816.a: "Take the Trentino and the South Tyrol into the Kingdom."
 ita_dnc.2817.t: "Vienna Refuses the Demand"
 ita_dnc.2817.d: "Vienna has refused the demand entire, and has recalled its ambassador without waiting for ours to leave. Both staffs have taken out the plans they have kept in the safe for a decade.\n\nThere is nothing left to write. The army is standing where the plan says it should stand, and the quarrel is ours to settle by arms."
 ita_dnc.2817.a: "Order the plan carried out."
 ita_dnc.2818.t: "The Note on the Nationalities"
 ita_dnc.2818.d: "Rome has raised the principle of nationality against every power that governs a people which never consented, and this time the note names us. It asks us to let our subject nations go.\n\nLetting them go costs us provinces, revenue and the obedience of what is left. Refusing puts an Italian army in the field with a cause half of Europe will applaud."
 ita_dnc.2818.a: "Release the subject nations and keep what is left."
 ita_dnc.2818.b: "Refuse the note. We govern our own provinces."
 ita_dnc.2819.t: "A Crown Without a Kingdom"
 ita_dnc.2819.d: "The crown papers for the Adriatic coast are drawn and sealed, and they are useless. There is no state over there to receive them, and no prince will take a crown with no ground under it.\n\nThe committee of the colonies has been saying so for years. We can make the country first, or put the papers back in the drawer."
 ita_dnc.2819.a: "Make the country first, and crown it afterwards."
 ita_dnc.2819.b: "Put the papers back in the drawer."
 ITA_u_one_of_the_options_tt: "\n§YOne of the following:§!"
 ITA_u_credit_tt: "§YCourts of the far shore under Italian protection:§! [?ITA_u_credit|0]"
 ITA_u_tt_safeguard_the_porte: "§YIf the Porte is still our ally or under our guarantee when the joint squadron sails, our army and our navy gain experience with it.§!"
 ITA_u_tt_the_frontier_works: "Bunkers go up in our own provinces along the Austrian frontier."
 ITA_u_tt_the_works_wait: "The frontier works give us nothing until Austria is at war with us."
 ITA_u_tt_liberate_oppressed_peoples: "§YThese lands are entered as Albanian and Ruthenian ground, so that they can be freed later.§!"
 ITA_u_tt_the_arsenal_waits: "No state on the far shore is under our protection, so the arms orders wait for one that is."
 ITA_u_tt_the_joint_squadron: "Every court under our protection joins the manoeuvres of the season, and so do we."
 ITA_u_tt_the_dalmatian_legion: "The Dalmatian Legion is raised, and its battalions take the field under our colours."
 ITA_u_tt_the_legions_are_raised: "The volunteer legions are raised and their battalions take the field under our colours."
 ITA_u_tt_the_principle_of_nationality: "Our own allies and clients are released from every tie to us before the demand reaches them."
 ITA_u_tt_the_third_party_holds: "Another power holds part of the old Ottoman provinces in Europe, and we claim that ground as well."
 ITA_u_tt_the_isonzo_equipment: "The depots hold enough rifles for the field army."
 ITA_u_tt_no_subject_nations: "No great power still holds any of these nations."
 ITA_u_tt_the_committee_is_heard: "The committee of the colonies is heard, and the making of the state goes on the agenda."
 ITA_u_tt_the_state_must_be_made: "The crown papers wait in the drawer until there is a state on that coast to receive them."
 ITA_u_threat_the_habsburg_menace: "Italy answers for the Adriatic"
 ITA_u_threat_corfu: "Italy claims the Ionian island"
 ITA_u_threat_the_ionian_protectorate: "Italy demands the Ionian protectorate"
 ITA_u_threat_the_venetian_possessions: "Italy claims the Venetian possessions"
 ITA_u_threat_further_ottoman_concessions: "Italy demands the eastern interior"
 ITA_u_threat_the_isonzo_review: "Austria masses on the Isonzo"
 ITA_u_threat_the_albanian_shore: "Italy takes the Albanian shore"
 ITA_u_threat_the_tribute: "Italy collects the Adriatic tribute"
 ITA_u_threat_vienna_moves_too: "Vienna takes its share of the shore"
 ITA_u_threat_the_ionian_quarrel: "London answers for the islands"
 ITA_u_threat_the_isonzo_settlement: "The frontier on the Isonzo is moved"
 ITA_u_threat_the_hour_of_the_isonzo: "Italy turns on the Dual Monarchy"
 ITA_u_the_austrian_manoeuvres: "The Austrian Manoeuvres"
 ITA_u_the_austrian_manoeuvres_desc: "Austrian mountain battalions are camped in sight of our frontier posts, and the newspapers print the map every morning. The country is uneasy and the army is looking over its shoulder."
 ITA_u_safeguard_the_porte_idea: "The Italian Shield"
 ITA_u_safeguard_the_porte_idea_desc: "The Kingdom of Italy has undertaken to answer for these provinces, and the undertaking has been published. Our defence is steadier for it, and foreign houses trade with us more willingly."
 ITA_u_safeguard_the_adriatic_idea: "The Guarantee of Rome"
 ITA_u_safeguard_the_adriatic_idea_desc: "Our frontier is covered by a word given in Rome. The ministry has stopped budgeting for the alternative, and it governs more easily for it."
 ITA_u_paying_for_protection: "Paying for Protection"
 ITA_u_paying_for_protection_desc: "The monopoly, the harbour dues and the loan service all run through a foreign house, and the money leaves the country every quarter. Everyone knows whose house it is, and the government is weaker for defending it."
 ITA_u_receiving_the_tribute: "The Tribute of the Far Shore"
 ITA_u_receiving_the_tribute_desc: "The protected courts pay, and their payments are entered in the accounts of the Treasury. The money eases the estimates, and the Chamber has stopped asking where it comes from."
 ITA_u_the_italian_arsenal: "The Italian Arsenal"
 ITA_u_the_italian_arsenal_desc: "Our batteries, our rifles and our cartridges all come from the same works across the water, and so do the instructors. One pattern, one drill book, and our own workshops build to it faster."
 ITA_u_the_cost_of_the_subsidies: "The Cost of the Subsidies"
 ITA_u_the_cost_of_the_subsidies_desc: "The orders placed for the small courts are carried on our own estimates. The works are paid whether the guns are wanted or not, and the country pays for the difference."
 ITA_u_safeguard_albania_idea: "The Italian Subsidy"
 ITA_u_safeguard_albania_idea_desc: "The schools, the presses and the rifles all come from across the sea, and the chieftains have grown used to it. Men enlist more readily now, and they stand better when they are called."
 ITA_u_the_arsenal_of_the_allies: "The Arsenal of the Allies"
 ITA_u_the_arsenal_of_the_allies_desc: "We arm the coast across the Adriatic, and it sends us its volunteers in return. Our workshops turn old stock into new faster, and there are more men to send where the flag cannot go."
 ITA_u_the_joint_manoeuvres: "The Joint Manoeuvres"
 ITA_u_the_joint_manoeuvres_desc: "The staffs of the Adriatic coast drill with ours for a season, and every ship carries the same signal book. Both services learn from the cruise."
 ITA_u_the_frontier_works_ns: "The Works on the Isonzo"
 ITA_u_the_frontier_works_ns_desc: "The concrete is laid, the batteries are mounted and the passes are held by men who know the ground."
 ITA_u_the_hour_of_the_isonzo_ns: "The Hour of the Isonzo"
 ITA_u_the_hour_of_the_isonzo_ns_desc: "The plan that two staffs have kept in the same safe for a decade is out on the table at last, and the army is working to it."
 ITA_u_the_adriatic_duchies_cat_desc: "The crowns of the eastern shore, drawn and sealed, waiting for ground that is ours."
 ALB_neutrality_party_principality: "Principality"
 ALB_neutrality_party_principality_long: "The Principality of Albania"
 ALB_PRINCIPALITY: "Principality of Albania"
 ALB_PRINCIPALITY_DEF: "the Principality of Albania"
 ALB_PRINCIPALITY_ADJ: "Albanian"
 ITADNC_u_la_grande_politica: "The Great Policy"
 ITADNC_u_la_grande_politica_desc: "The Navy League prints its programme in every port, and the press asks why a kingdom between two seas thinks like a province. We will answer plainly: from now on Italy has a world policy, and every ministry will be measured by it."
 ITADNC_u_the_understanding_with_london: "The Understanding with London"
 ITADNC_u_the_understanding_with_london_desc: "Our coasts lie open, our coal comes from British pits and our bread crosses a sea Britain commands. Our staffs have written it plainly: Italy cannot fight England. We will say so in London ourselves, before anyone makes us prove it."
 ITADNC_u_the_battle_fleet: "The Battle Fleet"
 ITADNC_u_the_battle_fleet_desc: "Our yards can lay down the fastest armoured ships afloat. The estimates have never once been written to let them. We shall order the squadron the naval press has been drawing for years, and widen the slipways that must carry it."
 ITADNC_u_carve_up_the_congo: "Carve Up the Congo"
 ITADNC_u_carve_up_the_congo_desc: "Our officers have served in the Congo's Force Publique and know what the concession companies do there, and London has made a scandal Brussels cannot answer. We will claim our share of the basin before the table is set."
 ITADNC_u_the_second_naval_race: "The Second Naval Race"
 ITADNC_u_the_second_naval_race_desc: "The world's first ship with triple turrets stands on our slips, and every admiralty in Europe has sent someone to look. We will lay down the rest of her class before the design is copied and widen the yards to build them."
 ITADNC_u_expand_the_eastern_holdings: "Expand the Eastern Holdings"
 ITADNC_u_expand_the_eastern_holdings_desc: "The court at Peking granted us a quarter on the river once the legations were relieved. We have governed it with a flagpole and a clerk. We shall ask Peking to make the grant real, and open the business of the Kingdom in the East."
 ITADNC_u_the_anglo_italian_defence_pact: "The Anglo-Italian Defence Pact"
 ITADNC_u_the_anglo_italian_defence_pact_desc: "Our consuls and Britain's drafted agreements on the Horn and the Somali coast, but no cabinet ever signed them. We will offer London a treaty of guarantee and let the offer stand or fall on its merits."
 ITADNC_u_the_industrial_investments: "The Industrial Investments"
 ITADNC_u_the_industrial_investments_desc: "The peace terms left the Chinese court poorer than the war did, surrounded by creditors still quarrelling over interest. While they quarrel, we will put Italian firms and Italian capital into the eastern provinces."
 ITADNC_u_the_arms_for_peking: "The Arms for Peking"
 ITADNC_u_the_arms_for_peking_desc: "The court is fighting on its own ground with rifles bought wherever a merchant would sell them, and it pays in silver. Our arsenals shall send the pattern we make, the works to feed it and the instructors to teach it."
 ITADNC_u_break_the_mediterranean_hegemony: "Free Our Own Sea"
 ITADNC_u_break_the_mediterranean_hegemony_desc: "Our sea is locked at both ends and cut across the middle by foreign garrisons, and every naval debate turns on that fact. We will claim Malta, Tunis and Nice and stop asking permission to leave our own coast."
 ITADNC_u_the_anglo_italian_cooperation_program: "Build Ships with Britain"
 ITADNC_u_the_anglo_italian_cooperation_program_desc: "Our best armour is rolled in Sheffield and our turrets are drawn on the Tyne, ordered year after year with no plan behind them. We will turn the invoices into a programme with shared drawings, builders and designs."
 ITADNC_u_the_joint_research_with_peking: "The Joint Research with Peking"
 ITADNC_u_the_joint_research_with_peking_desc: "Our technical missions surveyed mines, railways and arsenals in the East and brought home far more than they were sent for. We will make those missions permanent, so the court's schools and ours read the same papers."
 ITADNC_u_the_volunteers_for_china: "The Volunteers for China"
 ITADNC_u_the_volunteers_for_china_desc: "A royal expeditionary corps embarked for the East once already. The officers who came back from it are still on the active rolls. We shall raise the corps again, and send the court soldiers instead of notes of sympathy."
 ITADNC_u_the_eastern_allies: "The Eastern Allies"
 ITADNC_u_the_eastern_allies_desc: "Consular reports from every Eastern port say the same thing: those courts want partners, and the powers offer them creditors. We will invite Peking, Tokyo and the Porte into our alliance, and ask before we demand."
 ITADNC_u_a_free_hand_in_tunis_ww: "A Free Hand in Tunis"
 ITADNC_u_a_free_hand_in_tunis_ww_desc: "France took Tunis from under us, and no ministry has ever buried that grievance. The power that dealt the blow can no longer hold the shore, and we will take Tunis back as a province of the Kingdom."
 ITADNC_u_petition_for_the_old_claims: "Petition for the Old Claims"
 ITADNC_u_petition_for_the_old_claims_desc: "We handed a frontier post back to London with a stroke of the pen, and the colonial press still asks why. The claim was never withdrawn, and we will put it to our ally in writing and enter the answer in the record."
 ITADNC_u_the_concession_at_tientsin_ww: "Our Concession in China"
 ITADNC_u_the_concession_at_tientsin_ww_desc: "The grant on the river exists on paper and nowhere else. There is no boundary, no council, no garrison and no quay. We shall ask the court to let us build the concession properly, and we shall pay for the work ourselves."
 ITADNC_u_the_stations_of_the_red_sea_ww: "The Red Sea Stations"
 ITADNC_u_the_stations_of_the_red_sea_ww_desc: "Massawa and Assab sit astride the road to the canal. Every ship that coals there coals under our flag. We shall stock the stations, dredge the moorings and make the passage to the Indies a road that we supply."
 ITADNC_u_expand_the_african_reach: "Expand the African Reach"
 ITADNC_u_expand_the_african_reach_desc: "The powers agreed at a conference table that the land between our two colonies is ours, yet no Italian officer has set foot there. We will register that sphere as a claim of the Kingdom, on the Horn and along the northern shore."
 ITADNC_u_unify_the_horn: "Unify the Horn"
 ITADNC_u_unify_the_horn_desc: "The law has made the southern coast a colony of the State. It is still administered as three separate accidents by three separate residencies. We shall put the whole Horn under one command, and let the residencies answer to it."
 ITADNC_u_the_naval_doctrine_of_the_middle_sea: "A Navy for Our Sea"
 ITADNC_u_the_naval_doctrine_of_the_middle_sea_desc: "The navy's journal has long argued the fleet should be built for our sea alone, and officers trained for the ocean disagree. We will settle it: the fleet is built for the Mediterranean, and its schools and manoeuvres will follow."
 ITADNC_u_the_pact_with_peking: "The Pact with Peking"
 ITADNC_u_the_pact_with_peking_desc: "Our trade treaty gave us standing at a court that expects an ultimatum from every flag it sees, and no power has yet offered it an equal alliance. We will offer one, and take Peking's answer as it comes."
 ITADNC_u_the_african_allies: "The African Allies"
 ITADNC_u_the_african_allies_desc: "We have treaties with Addis Ababa and with Rabat. At home both were read as the price of a war we could not win. We shall read them the other way. Our invitation to join the alliance goes to both courts, and each will answer for itself."
 ITADNC_u_the_pacific_stations: "The Pacific Stations"
 ITADNC_u_the_pacific_stations_desc: "The colonial press has drawn coaling stations across the Pacific for years, and the Geographical Society has surveyed half of them. We will enter the claims, because an eastern squadron needs a shore of its own."
 ITADNC_u_divide_the_powers_in_china: "Divide the Powers in China"
 ITADNC_u_divide_the_powers_in_china_desc: "We once demanded a bay on the Chinese coast, backed down under pressure and lost a minister over it. We will not ask again. We will share out the foreign concessions with the court, and that means war with Britain over Hong Kong."
 ITADNC_u_the_middle_sea_is_ours: "The Middle Sea Is Ours"
 ITADNC_u_the_middle_sea_is_ours_desc: "No hostile squadron lies between Gibraltar and Suez, and no enemy flag flies on a shore our fleet cannot reach within a week. We will declare the Mediterranean ours, and every ministry after us will be judged on holding it."
 ITADNC_u_the_shore_from_tripoli_to_the_horn: "From Tripoli to the Horn"
 ITADNC_u_the_shore_from_tripoli_to_the_horn_desc: "The conference reserved this ground to us and left the line on the map undrawn. Nobody there expected us to walk it. We shall mark it out claim by claim, from the Regency of Tunis through Tripolitania to the Benadir coast and the Horn."
 ITA_u_grande_tt_the_world_policy: "The fleet, the eastern concessions and the African claims now hang from one programme, and the rest of this branch opens."
 ITA_u_grande_tt_the_capital_answers: "The capital we have written to answers for itself, and its answer reaches us within days."
 ITA_u_grande_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_u_grande_tt_the_locks_of_the_sea: "Malta, Tunisia and Nice are claimed for the Kingdom, and the mail steamers are armed as auxiliary cruisers."
 ITA_u_grande_tt_the_invitation: "Every court named here receives our invitation to the alliance and answers it as it sees fit."
 ITA_u_grande_tt_the_coaling_road: "Every coaling station we hold on the road to Suez is stocked and dredged for the next six months."
 ITA_u_grande_tt_the_sphere_declared: "The Kingdom claims Tripoli and Tripolitania on the African shore, and the Somali coast on the Horn."
 ITA_u_grande_tt_one_command_on_two_seas: "Eritrea, Somalia, the Benadir and East Africa answer to one colonial office."
 ITA_u_grande_tt_the_far_stations: "The Kingdom claims the coaling points of the Pacific, so an eastern squadron has a shore of its own."
 ITA_u_grande_tt_the_sea_is_kept: "No hostile great power holds a shore of the middle sea, and the fleet keeps it that way."
 ITA_u_grande_tt_the_line_is_drawn: "Every province from the Regency of Tunis to the Horn is claimed for the Kingdom."
 ITA_u_la_grande_politica: "The Great Policy"
 ITA_u_la_grande_politica_desc: "The government has one foreign programme now, from our own coast to wherever the flag can be carried. A ministry that knows its own mind carries the Chamber more easily."
 ITA_u_the_naval_understanding: "The Naval Understanding"
 ITA_u_the_naval_understanding_desc: "We do not build against the British fleet, and the British fleet guards the sea our grain crosses. Our convoys are cheaper to run and better escorted for it."
 ITA_u_the_battle_fleet: "The Battle Fleet"
 ITA_u_the_battle_fleet_desc: "The estimates are written at last for a squadron of the line, and the slips are widened to carry it."
 ITA_u_the_second_naval_race: "The Second Naval Race"
 ITA_u_the_second_naval_race_desc: "Every yard that can lay a heavy hull is laying one, and the drawings they work from are ours."
 ITA_u_the_eastern_investments: "The Italian Houses"
 ITA_u_the_eastern_investments_desc: "Italian capital, Italian foremen and Italian machines are at work in our provinces, and our own works go up faster for it.\n\nNone of it was a gift. What the houses lend they expect back, and the goods they sell come out of our own market."
 ITA_u_the_arsenal_of_the_east: "The Arsenal of the East"
 ITA_u_the_arsenal_of_the_east_desc: "Our arsenals now fill foreign orders as well as our own, and they build the same rifle for both. The works go up faster, and buyers abroad think better of us."
 ITA_u_the_shared_yards: "The Shared Yards"
 ITA_u_the_shared_yards_desc: "Drawings, constructors and rolled plate pass both ways between our yards and the British."
 ITA_u_the_corps_for_china: "The Corps for the East"
 ITA_u_the_corps_for_china_desc: "A brigade of the line, a battery and two flights of airmen stand ready to embark as volunteers for the war in the east."
 ITA_u_the_middle_sea_is_ours: "The Middle Sea Is Ours"
 ITA_u_the_middle_sea_is_ours_desc: "The sea between Gibraltar and Suez answers to one fleet, and it is ours. Our crews sail further and in better heart, and traders abroad deal with us accordingly."
 ITA_u_the_coaling_station: "The Coaling Station"
 ITA_u_the_coaling_station_desc: "Coal sheds, a stone mole and a water condenser on the passage to the Indies."
 ita_dnc.2840.t: "The Note from Rome"
 ita_dnc.2840.d: "Rome has sent a memorandum that admits more than it asks. Italy's coasts lie open, her coal comes from our pits, and her bread crosses a sea we command.\n\nThe Italians want us to say so in writing and to stop counting their cruisers. The Admiralty is divided on whether an admission of that kind is worth a signature."
 ita_dnc.2840.a: "Sign the understanding. Rome knows its place."
 ita_dnc.2840.b: "Refuse. We will not bless another Mediterranean fleet."
 ita_dnc.2842.t: "The Italian Claim on the Congo"
 ita_dnc.2842.d: "Rome reminds us that Italian officers served in the Force Publique and that Italian merchants have been kept off the river ever since. The note asks for Rwanda and Burundi, and offers to say nothing more about the concession companies.\n\nOur own parliament has spent a year asking what those districts are worth. We can answer it now, or leave the Italians to complain."
 ita_dnc.2842.a: "Hand Rome the two eastern districts."
 ita_dnc.2842.b: "Refuse. The Congo is ours now."
 ita_dnc.2844.t: "The Italian Quarter in China"
 ita_dnc.2844.d: "The quarter we granted the Italians after the legations were relieved has a flagpole, a clerk and no boundary at all. Their minister now asks for a boundary, a council and police of his own.\n\nEvery concession of this kind has begun the same way. We can grant what he asks, or leave the quarter as it stands."
 ita_dnc.2844.a: "Grant the boundary and let the quarter be built."
 ita_dnc.2844.b: "Refuse. Tientsin was a courtesy, not a grant."
 ita_dnc.2846.t: "The Italian Defence Pact"
 ita_dnc.2846.d: "Our consuls and theirs settled two agreements on the Horn and a convention on the Somali coast, and neither cabinet was consulted. Rome now wants the habit put into a treaty.\n\nThe Italians offer a guarantee against a guarantee, with the Mediterranean divided plainly between us. We have never signed such a thing with a lesser power."
 ita_dnc.2846.a: "Sign the pact and guarantee Italy."
 ita_dnc.2846.b: "Refuse. We guarantee no one."
 ita_dnc.2848.t: "The Italian Banks Offer Capital"
 ita_dnc.2848.d: "The indemnity protocol left the court poorer than the war did. The creditors who imposed it will not lend again.\n\nThe Italians offer capital, foremen and machines for the provinces, and ask for standing rather than land. Nothing they build here will ever be wholly ours."
 ita_dnc.2848.a: "Let the Italian houses build in the provinces."
 ita_dnc.2848.b: "Refuse. The concessions they hold are enough."
 ita_dnc.2850.t: "The Rifles from Turin"
 ita_dnc.2850.d: "Our battalions are fighting on our own ground with rifles bought from any merchant who would sell. No two of them carry the same cartridge.\n\nRome offers one pattern, the works to make the cartridges and the instructors to teach the drill. It asks for nothing in writing, which is a debt we shall be reminded of."
 ita_dnc.2850.a: "Take the rifles, and take the instructors with them."
 ita_dnc.2850.b: "Refuse. We will not owe Rome our rifles."
 ita_dnc.2852.t: "The Claim on Kassala"
 ita_dnc.2852.d: "We handed Kassala to the Italians and took it back when the reconquest of the Sudan was done. Their colonial press has never let the matter rest.\n\nTheir ambassador now makes the claim formally, as an ally and not a suppliant. Granting it means giving up the frontier districts with it, and refusing it costs us nothing today."
 ita_dnc.2852.a: "Hand Kassala and the frontier districts back to Rome."
 ita_dnc.2852.b: "Refuse. We paid for that frontier ourselves."
 ita_dnc.2854.t: "The Italian Plans for China"
 ita_dnc.2854.d: "The Italians have surveyed their quarter, drawn its streets and costed its quay. They will pay for every part of it themselves, and ask us only for a boundary and a signature.\n\nA concession that has been built properly is far harder to take back later. We can sign the deed, or let the grant lapse."
 ita_dnc.2854.a: "Sign the deed and let them build."
 ita_dnc.2854.b: "Let the grant lapse."
 ita_dnc.2855.t: "The Deed from Peking"
 ita_dnc.2855.d: "The court has signed the boundary and the council. The quarter at Tientsin is ours in law, and not only on paper.\n\nOur consul asks what lands first, the flag or the harbour engineers. Peking will notice either one, and the engineers will cost us more than the flagpole."
 ita_dnc.2855.a: "Raise the flag over the quarter."
 ita_dnc.2855.b: "Land the engineers first and build the harbour."
 ita_dnc.2856.t: "The Alliance Offered"
 ita_dnc.2856.d: "No power has offered this court a treaty between equals since the indemnity protocol. The Italians now offer one, signed openly and published in full.\n\nTheir minister asks for no province and no new concession. The council reads that as a price still to be named, and must decide whether to pay it."
 ita_dnc.2856.a: "Join the Italian alliance."
 ita_dnc.2856.b: "Refuse. The court binds itself to no one."
 ita_dnc.2951.t: "The Ministry Faces the Country"
 ita_dnc.2951.d: "The decade we asked for is over, and the country wants an account of it. The prefects have their returns, the Chamber has our majority, and the streets remember what we did there.\n\nWe can go to the country with the machine one last time. We can buy quiet out of our own credit, or let the country speak and take its answer."
 ita_dnc.2951.a: "Let the prefects make the returns one last time."
 ita_dnc.2951.b: "We shall pay for order out of our own credit."
 ita_dnc.2951.c: "We shall let the country speak and take what it says."
 ITA_o_the_union_inherits_the_wars_tt: "The union takes over every war the annexed crown is fighting."
 ITA_o_the_union_stands_alone_tt: "Italy leads no alliance, so the new union joins none."
 ITA_u_the_nations_are_freed_tt: "Every people with cores in our provinces is released as a state of its own."
 ita_dnc.2952.t: "The General Staff Objects"
 ita_dnc.2952.d: "The general staff has counted the battalions we raised in Africa. The colonies now hold more rifles than the divisions of the north, and the staff has put that in writing.\n\nThe memorandum is polite, and it is not a request. We can open the army estimates and pay for what we have taken, or refuse and let the staff remember it."
 ita_dnc.2952.a: "Open the estimates and pay the army what it asks."
 ita_dnc.2952.b: "Keep the colonial battalions and let the staff write again."
 ITA_h_the_war_office_is_paid_tt: "The §Yanger of the War Office§! falls back."
 ITA_h_the_war_office_is_refused_tt: "The staff will remember that it was refused."
 ITA_h_the_war_office_resents_us: "The Staff Is Not Answered"
 ITA_h_the_war_office_resents_us_desc: "We took the men for Africa and never paid the army for them. The staff still obeys, but the regiments are sullen and every order out of Rome costs us more to give."
 ita_dnc.2953.t: "The Foreign Ministry Objects"
 ita_dnc.2953.d: "The Consulta, our foreign ministry, has been reading the same telegrams as the colonial governors. It does not like what the levies are doing to our word abroad.\n\nEvery irregular band we raise turns into a paragraph in some foreign note. We can cut the recruiting back, or let the foreign ministry stop answering for it."
 ita_dnc.2953.a: "Cut the recruiting back and answer the Consulta."
 ita_dnc.2953.b: "Refuse. The colonies are governed from Rome, not from the Consulta."
 ITA_h_the_consulta_is_paid_tt: "The §Yanger of the Consulta§! falls back."
 ITA_h_the_consulta_is_refused_tt: "The foreign ministry will answer for nothing it did not write."
 ITA_h_the_consulta_resents_us: "The Consulta Is Not Answered"
 ITA_h_the_consulta_resents_us_desc: "The foreign ministry has been overruled on the ground it is paid to speak for. It has stopped defending us in the notes it sends, and foreign capitals have noticed."
 ita_dnc.2954.t: "The Italian Consuls on the Plate"
 ita_dnc.2954.d: "The Italian consuls on the River Plate have gone well past what a consulate does. They enrol reservists, they pay for a newspaper, and they speak for a community larger than some of the republics around them.\n\nThe department has the file. We can lay it before the arbitration court, or leave it in a drawer."
 ita_dnc.2954.a: "Lay the file before the arbitration court."
 ita_dnc.2954.b: "Leave the file in the drawer."
 ITA_l_the_court_at_washington: "The Arbitration at Washington"
 ITA_l_the_court_at_washington_desc: "Washington has taken our work on the Plate to an arbitration court, and every republic on the river now reads our consuls as a party to a case. Buyers abroad trade with us on worse terms for it."
 ITA_l_washington_looks_away_tt: "Washington has read the file and put it away."
