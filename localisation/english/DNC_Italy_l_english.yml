 ITA_air_the_service_of_the_air: "The Service of the Air"
 ITA_air_the_service_of_the_air_desc: "What the Specialist Brigade has been made into. Every step of the aviation branch is entered here, and the account is never closed."
 ITA_air_the_service_of_the_air_tt: "§YThe Service of the Air§! now keeps its own account, and every step of this branch pours a further measure into it."
 ITA_n_the_fleet_of_the_kingdom: "The Fleet of the Kingdom"
 ITA_n_the_fleet_of_the_kingdom_desc: "What the estimates have actually built. Every step of the naval branch is entered here, and the account is never closed."
 ITA_n_the_fleet_of_the_kingdom_tt: "§YThe Fleet of the Kingdom§! now keeps its own account, and every step of this branch pours a further measure into it."

