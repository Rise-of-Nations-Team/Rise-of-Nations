 ITA_v_the_triple_alliance: "Triple Alliance"
 ITA_dnc_crown_cat: "The Crown"
 ITA_dnc_crown_cat_desc: "The Crown stands at [?ITA_crown|0]. What the King will sign, and what he will send back to the ministry unsigned, is read off that figure at every fork."
 ITA_dnc_church_cat: "The Church"
 ITA_dnc_church_cat_desc: "The business the ministry does with the Church: the prefects who count the parish, the bishops who wait on the exequatur, and whichever intermediary is willing to carry a letter across the Tiber."
 ITA_dnc_bloc_cat: "The Popular Bloc"
 ITA_dnc_bloc_cat_desc: "What a ministry of the bloc can give the country through the councils, the leagues and the schools. None of it needs the Chamber to be asked twice."
 ITA_dnc_irredenta_cat: "Irredenta"
 ITA_dnc_irredenta_cat_desc: "The committees, the gymnastic societies and the subscriptions that keep the unredeemed provinces in mind. Every one of them is read in Vienna, and answered."
 ITA_p_the_strike_is_let_run: "The Strike Is Let Run"
 ITA_p_the_strike_is_let_run_desc: "The prefects are told to keep the troops in barracks and let the strike find its own end. Nothing is conceded and nothing is broken, and in a few days the men go back to work because they are hungry."
 ITA_p_the_anarchists_are_sent_to_the_islands: "The Anarchists Are Sent to the Islands"
 ITA_p_the_anarchists_are_sent_to_the_islands_desc: "The law of suspects allows the police to remove a man to Lampedusa or Ustica without troubling a court. The squares grow quieter and the courts grow ashamed."
 ITA_p_buggerru_is_investigated: "Buggerru Is Investigated"
 ITA_p_buggerru_is_investigated_desc: "An inquiry is opened into the volleys fired at the Sardinian miners and the lieutenant who ordered them. The findings will not please the officer corps, and the mining districts will read them for years."
 ITA_p_the_amnesty_of_the_romagna: "The Amnesty of the Romagna"
 ITA_p_the_amnesty_of_the_romagna_desc: "The men convicted in the agrarian troubles of the Romagna are let out and their sentences struck from the record. The province is quieter for it, and stays quieter than it was before."
 ITA_c_the_register_of_five_million: "The Register of Five Million"
 ITA_c_the_register_of_five_million_desc: "The new electorate is inscribed college by college, and the prefects are given the time to inscribe it in the right order. The Chamber that comes back will be larger and the square will notice who was left off the list."
 ITA_c_the_twelfths_are_voted: "The Twelfths Are Voted"
 ITA_c_the_twelfths_are_voted_desc: "The budget is not ready, so the Chamber votes the provisional twelfths and the ministry is paid for another quarter. It is the least interesting thing a government can do and it is what keeps a government alive."
 ITA_c_the_closure_is_moved: "The Closure Is Moved"
 ITA_c_the_closure_is_moved_desc: "The obstruction from the benches of the Extreme Left is broken by moving the closure and voting through the night. The bill passes and the galleries empty into the street."
 ITA_c_the_extreme_left_is_received: "The Extreme Left Is Received"
 ITA_c_the_extreme_left_is_received_desc: "The leaders of the Extreme Left are received at the Consulta and told what the ministry intends before the Chamber hears it. Some of them come away half persuaded, and their followers notice."
 ITA_c_the_nationalist_interpellation: "The Nationalist Interpellation"
 ITA_c_the_nationalist_interpellation_desc: "A nationalist deputy interpellates the government on the unredeemed provinces and the ministry answers him at length. The answer is read in the Ballhausplatz before it is read in Milan."
 ITA_pr_the_ninety_are_asked_for_a_list: "The Ninety Are Asked for a List"
 ITA_pr_the_ninety_are_asked_for_a_list_desc: "Every prefect in the kingdom is asked which candidate his province can be made to return. The lists come back promptly, and the machine spends some of itself in the writing."
 ITA_pr_the_prefect_answers_to_the_minister_of_labour: "The Prefect Answers to the Minister of Labour"
 ITA_pr_the_prefect_answers_to_the_minister_of_labour_desc: "Labour disputes are taken out of the hands of the Interior and given to the new ministry that the leagues trust. The squares calm and the prefects lose a weapon they had grown fond of."
 ITA_pr_the_prefect_counts_the_parish: "The Prefect Counts the Parish"
 ITA_pr_the_prefect_counts_the_parish_desc: "The prefects are instructed to report which parishes will deliver and which priest is worth calling on. The Catholic vote is thereby added to the machine without anybody admitting that it has been."
 ITA_s_the_law_for_naples: "The Law for Naples"
 ITA_s_the_law_for_naples_desc: "The special law for Naples pays for a industrial quarter at Bagnoli and the works to serve it. The South gets a factory instead of a promise."
 ITA_s_the_emphyteusis: "The Emphyteusis"
 ITA_s_the_emphyteusis_desc: "The waste lands of the latifundia are let out on long leases to the men who work them. The roads follow the leases, because a tenant who owns his improvements will ask for a road."
 ITA_s_the_white_leagues_in_apulia: "The White Leagues in Apulia"
 ITA_s_the_white_leagues_in_apulia_desc: "The Catholic leagues are given the run of the Apulian harvest and the labour contracts that go with it. The red leagues lose the province, and the province loses some of its hands to the settlement."
 ITA_e_the_consuls_of_the_americas: "The Consuls of the Americas"
 ITA_e_the_consuls_of_the_americas_desc: "The consulates on the far side of the ocean are given clerks, a register and the money to keep them. Men who are counted come back more often than men who are not."
 ITA_e_the_indemnity_is_asked_again: "The Indemnity Is Asked Again"
 ITA_e_the_indemnity_is_asked_again_desc: "The claim for the Italians lynched in Louisiana is presented again, with the consular inspection of arrivals attached to it. Washington may pay, or may send us back to the state courts."
 ITA_e_the_brazilian_passage_reopened: "The Brazilian Passage Reopened"
 ITA_e_the_brazilian_passage_reopened_desc: "The ban on the subsidised passage is offered back to Rio in exchange for consular inspection of the plantations. The planters want the hands badly enough to consider it."
 ITA_e_the_parish_sends_the_chaplain: "The Parish Sends the Chaplain"
 ITA_e_the_parish_sends_the_chaplain_desc: "The Scalabrinian fathers are put aboard the emigrant ships and paid for out of the estimates. They keep the villages in touch with the men who left them, and the men come home."
 ITA_w_the_antivari_subsidy: "The Antivari Subsidy"
 ITA_w_the_antivari_subsidy_desc: "The Compagnia di Antivari is paid to run the port, the telegraph and the salt of the little kingdom. Cetinje is grateful and the Ballhausplatz counts the bill."
 ITA_w_the_schools_in_albania: "The Schools in Albania"
 ITA_w_the_schools_in_albania_desc: "More Italian schools are opened in Scutari and along the coast, and the teachers are chosen in Rome. The Porte protests, and our staff learns the roads behind the schools."
 ITA_w_the_consul_at_tunis: "The Consul at Tunis"
 ITA_w_the_consul_at_tunis_desc: "The consulate at Tunis is enlarged and told to speak for the Italian colony as though it were a province. Paris takes it very badly and the powers take note of the precedent."
 ITA_w_the_banks_branch_at_tripoli: "The Bank's Branch at Tripoli"
 ITA_w_the_banks_branch_at_tripoli_desc: "The Banco di Roma opens at Tripoli with a mill, a steamer line and a credit for the caravans. Trade is the cheapest way to occupy a province, and the cheapest to disown."
 ITA_w_the_powers_are_sounded_on_tripoli: "The Powers Are Sounded on Tripoli"
 ITA_w_the_powers_are_sounded_on_tripoli_desc: "One capital at a time is asked, in confidence, what it would say if Italy took the fourth shore. Each answer costs something and each answer is worth having before the ultimatum is drafted."
 ITA_k_the_audience_at_the_quirinal: "The Audience at the Quirinal"
 ITA_k_the_audience_at_the_quirinal_desc: "The President of the Council goes up the hill weekly and stays longer than protocol requires. The King is consulted before he is informed, and he remembers it."
 ITA_k_the_royal_decree: "The Royal Decree"
 ITA_k_the_royal_decree_desc: "A measure the Chamber will not pass is issued as a royal decree and enforced from the day of signature. The works begin at once and the Cassation is invited to think about it afterwards."
 ITA_k_the_prorogation_for_the_session: "The Prorogation for the Session"
 ITA_k_the_prorogation_for_the_session_desc: "The Chamber is prorogued and does not sit again until the ministry wants it to. The majority is spared a season of wear, and the square is left to make the arguments the deputies would have made."
 ITA_k_a_batch_of_senators: "A Batch of Senators"
 ITA_k_a_batch_of_senators_desc: "The Crown names a batch of senators chosen for their willingness rather than their eminence. The upper house will carry what the lower house sends it."
 ITA_k_the_grand_cross: "The Grand Cross for the General"
 ITA_k_the_grand_cross_desc: "The general who fired on the crowd is decorated in front of the garrison of the capital. The army learns what the Crown thinks of officers who obey, and the streets learn it too."
 ITA_k_the_amnesty_of_the_new_reign: "The Amnesty of the New Reign"
 ITA_k_the_amnesty_of_the_new_reign_desc: "The new reign opens the prisons to the men convicted under the old one. The country is grateful and the Crown has spent the gratitude it was given at the funeral."
 ITA_k_the_royal_commissioner: "The Royal Commissioner"
 ITA_k_the_royal_commissioner_desc: "A royal commissioner is sent into a southern province with the powers of a council and a prefect together. The province is governed, and the deputies of the province are not consulted."
 ITA_k_the_civil_list_cut: "The Civil List Cut"
 ITA_k_the_civil_list_cut_desc: "The civil list is trimmed and the saving is voted to the estimates of the ministry. The Treasury is pleased, the court is not, and the court says so."
 ITA_k_the_kings_veto_withheld: "The King's Veto Withheld"
 ITA_k_the_kings_veto_withheld_desc: "The King is persuaded not to refuse his signature to a bill his household detests. The Chamber discovers that it can carry a measure over the Crown, and does not forget."
 ITA_k_the_regents_question: "The Regent's Question"
 ITA_k_the_regents_question_desc: "The Duke of Aosta is sounded on whether he would take the throne if it were offered him. He does not say no, and the answer is written down."
 ITA_k_the_king_is_asked_again: "The King Is Asked Again"
 ITA_k_the_king_is_asked_again_desc: "The King who refused to sign is asked again, this time by the whole cabinet and the Senate together. A monarch who has been asked twice by everyone he trusts usually signs."
 ITA_k_the_kings_tour_of_the_south: "The King's Tour of the South"
 ITA_k_the_kings_tour_of_the_south_desc: "The King goes down to the provinces of the South with the Queen and stays a month. The towns turn out, the deputies ride in the train, and nobody strikes while he is there."
 ITA_k_the_senates_list: "The Senate's List"
 ITA_k_the_senates_list_desc: "The Senate votes the twelfths and the list of appointments in a single afternoon and asks nothing in return. The ministry that survived the Chamber finds the upper house waiting to be useful."
 ITA_ch_the_sacristy_list: "The Sacristy List"
 ITA_ch_the_sacristy_list_desc: "The Electoral Union draws up the colleges where Catholics may vote and for whom. The list is not published and it decides more seats than any speech."
 ITA_ch_the_opera_dei_congressi: "The Opera dei Congressi"
 ITA_ch_the_opera_dei_congressi_desc: "The Catholic congresses are left alone to run their rural banks, their leagues and their parish committees. The countryside gets a discipline that costs the prefecture nothing."
 ITA_ch_the_law_of_guarantees_read_again: "The Law of Guarantees Read Again"
 ITA_ch_the_law_of_guarantees_read_again_desc: "The lawyers of the Consulta are asked what the Law of Guarantees would allow if anybody wanted it to allow something. Their answer is sent quietly across the Tiber."
 ITA_ch_the_divorce_bill_buried: "The Divorce Bill Buried"
 ITA_ch_the_divorce_bill_buried_desc: "The divorce bill is sent to a committee from which no bill has ever returned. The Church is satisfied and the anticlerical press is furious."
 ITA_ch_the_catechism_in_the_schools: "The Catechism in the Schools"
 ITA_ch_the_catechism_in_the_schools_desc: "The communes are permitted to put religious instruction back into the elementary schools. The parish priest becomes an officer of the state without being paid by it."
 ITA_ch_the_bishops_exequatur: "The Bishop's Exequatur"
 ITA_ch_the_bishops_exequatur_desc: "The royal exequatur is granted to a bishop the Curia has appointed without asking us. It is a small courtesy and it is counted on the other bank of the river."
 ITA_ch_the_catholic_banks: "The Catholic Banks"
 ITA_ch_the_catholic_banks_desc: "The rural savings banks of the Catholic movement are given the standing of public institutions. They lend where the state will not, and the roads follow the lending."
 ITA_ch_the_rural_leagues: "The Rural Leagues"
 ITA_ch_the_rural_leagues_desc: "The white leagues are given the contracts and the recognition that the red ones were refused. The harvest is brought in without a strike."
 ITA_ch_the_intermediary_is_sent_again: "The Intermediary Is Sent Again"
 ITA_ch_the_intermediary_is_sent_again_desc: "A layman nobody can name officially is sent across the river again with a written question. If he comes back with a written answer, the conversation has begun."
 ITA_ch_the_concordat_is_drafted: "The Concordat Is Drafted"
 ITA_ch_the_concordat_is_drafted_desc: "The jurists of both sides sit down to a text covering the bishops, the schools, the marriage law and the territory. Nothing is signed, but the text exists and both sides have initialled it."
 ITA_ch_the_twentieth_of_september_stood_down: "The Twentieth of September Stood Down"
 ITA_ch_the_twentieth_of_september_stood_down_desc: "The official commemoration of the breach at the Porta Pia is reduced to a wreath and a bugle. The Curia notices, and so do the lodges."
 ITA_b_the_league_is_lawful: "The League Is Lawful"
 ITA_b_the_league_is_lawful_desc: "The leagues of resistance are entered on a register and given standing before the courts. A union that can sue does not need to riot."
 ITA_b_the_cooperatives_contract: "The Cooperative's Contract"
 ITA_b_the_cooperatives_contract_desc: "Public works are contracted directly to the workers cooperatives instead of to the usual houses. The roads are built and the profit stays in the province."
 ITA_b_municipal_socialism: "Municipal Socialism"
 ITA_b_municipal_socialism_desc: "The red communes are allowed to take the gas, the trams and the mills into their own hands. The rates fall, the works are built, and the square has something to defend."
 ITA_b_the_school_against_the_parish: "The School Against the Parish"
 ITA_b_the_school_against_the_parish_desc: "The elementary schools are taken from the communes and paid for by the state, and the catechism goes out of them. The teachers are ours and the Curia says so loudly."
 ITA_b_the_womens_work_law: "The Women's Work Law"
 ITA_b_the_womens_work_law_desc: "The hours of women and children in the mills and the rice fields are fixed by law and inspected. The mills complain, and the mill towns are quieter."
 ITA_b_the_school_meals: "The School Meals"
 ITA_b_the_school_meals_desc: "The communes are given the money to feed the children who come to school hungry. Attendance rises and so does the standing of the men who voted it."
 ITA_b_the_strike_fund_is_counted: "The Strike Fund Is Counted"
 ITA_b_the_strike_fund_is_counted_desc: "The Confederation opens its books and tells the leagues how long they could actually stay out. The answer is short, and the leagues settle."
 ITA_b_the_pension_fund: "The Pension Fund"
 ITA_b_the_pension_fund_desc: "The old age and invalidity fund is made compulsory and the employers are made to pay into it. Every wage in the kingdom is a little smaller and every old man is a little safer."
 ITA_b_the_garibaldian_legion: "The Garibaldian Legion"
 ITA_b_the_garibaldian_legion_desc: "The red shirts are called out again and the volunteers are given rifles and a number. They are worth a brigade and they belong to nobody in the ministry."
 ITA_b_the_committee_for_the_constituent: "The Committee for the Constituent"
 ITA_b_the_committee_for_the_constituent_desc: "A committee of deputies, lawyers and league secretaries sits to prepare the summoning of a constituent assembly. It has no legal standing whatever and everybody knows where it meets."
 ITA_i_the_trento_committee: "The Trento Committee"
 ITA_i_the_trento_committee_desc: "The Trento and Trieste committee is funded, housed and allowed to hold its meetings in public halls. Its maps are better than the ones the staff has."
 ITA_i_the_trieste_gymnasts: "The Trieste Gymnasts"
 ITA_i_the_trieste_gymnasts_desc: "The gymnastic societies of the coast are given instructors, flags and a subsidy from Rome. Vienna must decide whether they are athletes or a militia."
 ITA_i_the_dalmatian_press: "The Dalmatian Press"
 ITA_i_the_dalmatian_press_desc: "The Italian papers of Zara and Spalato are bought quietly and given a new press. Belgrade reads them with pleasure and the Ballhausplatz with none."
 ITA_i_battistis_lectures: "Battisti's Lectures"
 ITA_i_battistis_lectures_desc: "Battisti is sent round the northern cities to lecture on the province he comes from. He fills the halls, and the halls sing on the way out."
 ITA_i_the_adriatic_map: "The Adriatic Map"
 ITA_i_the_adriatic_map_desc: "The staff is given the soundings, the roads and the garrisons of the far shore, and told to draw the plan for them. A war that has been drawn is half a war."
 ITA_i_the_consulate_at_fiume: "The Consulate at Fiume"
 ITA_i_the_consulate_at_fiume_desc: "The consulate is enlarged with clerks who are not clerks and a budget nobody itemises. The consular service becomes the best informed office in the kingdom."
 ITA_i_the_university_fund: "The University Fund"
 ITA_i_the_university_fund_desc: "A national subscription is raised for an Italian faculty in the unredeemed provinces. Vienna is asked again where it may be put."
 ITA_i_the_volunteers_register: "The Volunteers' Register"
 ITA_i_the_volunteers_register_desc: "A register is opened for the men who wish to serve wherever the frontier is crossed. It fills faster than the depots can clothe it."
 ITA_i_the_students_to_innsbruck: "The Students to Innsbruck"
 ITA_i_the_students_to_innsbruck_desc: "The student associations are paid to send their delegations north for the term. There will be a riot and there will be arrests, and both will be reported at length."
 ITA_i_the_albanian_committee: "The Albanian Committee"
 ITA_i_the_albanian_committee_desc: "The Albanian exiles in Naples and Bari are given a house, a newspaper and a subsidy. They call themselves a committee and the Porte calls them something else."
 ITA_dec_strike_let_run_tt: "The troops stay in barracks; the strike will end by itself, one way or the other"
 ITA_dec_the_islands_tt: "The known agitators go to the islands, and the courts look away"
 ITA_dec_buggerru_tt: "The volleys in the mining district are examined in public"
 ITA_dec_amnesty_romagna_tt: "The province is pardoned, and the floor beneath its square comes down"
 ITA_dec_register_of_five_million_tt: "The new voters are inscribed to the advantage of the ministry at the next returns"
 ITA_dec_the_twelfths_tt: "The ministry is paid for another quarter without a budget"
 ITA_dec_the_closure_tt: "The obstruction is broken and the majority holds, at the cost of the street"
 ITA_dec_the_extreme_left_tt: "The Extreme Left is taken into the confidence of the ministry"
 ITA_dec_the_interpellation_tt: "The unredeemed provinces are named aloud in the Chamber, and heard abroad"
 ITA_dec_the_ninety_tt: "Every prefecture reports the college it can deliver at the next returns"
 ITA_dec_the_minister_of_labour_tt: "Labour disputes leave the prefecture for the new ministry"
 ITA_dec_counts_the_parish_tt: "The parishes are counted into the majority"
 ITA_dec_law_for_naples_tt: "The special law raises an industrial quarter at Naples"
 ITA_dec_the_emphyteusis_tt: "The waste land is leased out, and the roads follow the leases"
 ITA_dec_white_leagues_apulia_tt: "The white leagues settle on the Apulian harvest for a year"
 ITA_dec_consuls_americas_tt: "The consulates count our own, and more of them come home"
 ITA_dec_indemnity_again_tt: "Washington is asked to pay, and to let our consuls onto the quay"
 ITA_dec_brazil_reopened_tt: "Rio is asked whether the passage may be opened on our terms"
 ITA_dec_the_chaplain_tt: "The fathers sail with the emigrants and the villages keep their men"
 ITA_dec_antivari_subsidy_tt: "The port of the little kingdom is ours to run, and Vienna reads the accounts"
 ITA_dec_schools_in_albania_tt: "The schools spread along the coast, and our staff learns the ground behind them"
 ITA_dec_consul_at_tunis_tt: "The consulate speaks for the colony, and the powers take note"
 ITA_dec_banks_branch_tripoli_tt: "The bank is at Tripoli before the army is"
 ITA_dec_powers_sounded_tt: "One capital is chosen and asked, in confidence, what it would say"
 ITA_dec_audience_quirinal_tt: "The King is consulted before he is informed"
 ITA_dec_the_royal_decree_tt: "The measure is law from the day of signature, and the Chamber is told afterwards"
 ITA_dec_the_prorogation_tt: "The Chamber does not sit, and the majority is spared the wear of a session"
 ITA_dec_batch_of_senators_tt: "The upper house is filled with men who will carry what is sent to them"
 ITA_dec_the_grand_cross_tt: "The decoration stands, and the army knows where it stands"
 ITA_dec_amnesty_new_reign_tt: "The prisons are opened for the new reign, and the floor of the square comes down"
 ITA_dec_royal_commissioner_tt: "A province is governed from the Quirinal, over the heads of its deputies"
 ITA_dec_civil_list_cut_tt: "The court pays for the estimates, and does not forgive it"
 ITA_dec_veto_withheld_tt: "The Crown signs what it hates, and the Chamber remembers that it can be made to"
 ITA_dec_the_regents_question_tt: "The Duke of Aosta has been asked, and has not said no"
 ITA_dec_king_asked_again_tt: "The King consents at the second asking"
 ITA_dec_tour_of_the_south_tt: "The King is cheered in the provinces, and nothing is struck while he is there"
 ITA_dec_the_senates_list_tt: "The Senate votes the money and the appointments in one afternoon"
 ITA_dec_the_sacristy_list_tt: "The Electoral Union names the colleges, and they answer at the next returns"
 ITA_dec_opera_dei_congressi_tt: "The Catholic congresses keep the countryside in order at no charge to us"
 ITA_dec_guarantees_read_again_tt: "The Law of Guarantees is read for what it would permit, and the reading crosses the river"
 ITA_dec_divorce_buried_tt: "The bill dies in committee and the Church is told so"
 ITA_dec_the_catechism_tt: "The parish priest teaches in the schools of the state again"
 ITA_dec_the_exequatur_tt: "One more step is taken towards the Curia"
 ITA_dec_catholic_banks_tt: "The rural banks lend where the Treasury will not"
 ITA_dec_the_rural_leagues_tt: "The white leagues take the countryside from the red ones"
 ITA_dec_the_intermediary_tt: "The conversation across the river is begun"
 ITA_dec_concordat_drafted_tt: "A text exists, initialled by both sides"
 ITA_dec_twentieth_stood_down_tt: "The commemoration is reduced to a wreath; the Curia notices and the lodges shout"
 ITA_dec_league_is_lawful_tt: "A union that can go to court has less use for the street"
 ITA_dec_cooperatives_contract_tt: "The works go to the cooperatives, and the profit stays in the province"
 ITA_dec_municipal_socialism_tt: "The commune takes the works into its own hands"
 ITA_dec_school_against_parish_tt: "The state pays the teachers, and the Curia steps back"
 ITA_dec_womens_work_law_tt: "The hours in the mills and the rice fields are fixed and inspected"
 ITA_dec_school_meals_tt: "The children are fed at school, and the commune is thanked for it"
 ITA_dec_strike_fund_tt: "The leagues are shown how long their money would last"
 ITA_dec_the_pension_fund_tt: "The fund is compulsory, and every wage in the kingdom pays into it"
 ITA_dec_garibaldian_legion_tt: "The volunteers are raised, armed and formed into a division of our own"
 ITA_dec_committee_constituent_tt: "The committee sits, and everybody knows where"
 ITA_dec_trento_committee_tt: "The committee is public, funded and better mapped than the staff"
 ITA_dec_trieste_gymnasts_tt: "The societies drill in the open, and Vienna must decide what they are"
 ITA_dec_dalmatian_press_tt: "The papers of the far shore change hands quietly"
 ITA_dec_battistis_lectures_tt: "The halls are full, and they sing on the way out"
 ITA_dec_the_adriatic_map_tt: "The plan against the ally is drawn, with the soundings on it"
 ITA_dec_consulate_at_fiume_tt: "The consular service becomes the best informed office in the kingdom"
 ITA_dec_university_fund_tt: "The subscription is raised and Vienna is asked again where the faculty may stand"
 ITA_dec_volunteers_register_tt: "The register fills faster than the depots can clothe it"
 ITA_dec_students_to_innsbruck_tt: "The delegations go north, and what happens there is reported at length"
 ITA_dec_albanian_committee_tt: "The exiles have a house, a paper and a name"
 ITA_dec_strike_burned_out_tt: "The men go back, and the square is emptier than it has been for a long time"
 ITA_dec_strike_hardened_tt: "The strike hardens into a habit, and the floor beneath the square rises"
 ITA_dec_soundings_put_off_tt: "No capital is asked this season"
 ita_dnc.2200.t: "The Strike Runs Its Course"
 ita_dnc.2200.d: "No troops were sent, no chamber of labour was shut and no arrests were made, and the strike has now lasted longer than the funds behind it. The Confederation must decide whether to call the men back with nothing to show, or to let the chambers of labour vote to stay out and turn a wage dispute into a standing quarrel with the state.\n\nWhichever they choose, the ministry will be told it did too little."
 ita_dnc.2200.a: "The Confederation calls the men back."
 ita_dnc.2200.b: "The chambers of labour vote to stay out."
 ita_dnc.2208.t: "A Second Indemnity"
 ita_dnc.2208.d: "The Italian ambassador presents the claim for the men killed in Louisiana a second time, and attaches to it a request that Italian consuls be admitted to the landing stages to inspect the arrivals.\n\nThe money is small and the precedent is not. Admitting a foreign consul to the quay is a thing that will be quoted at us by every other government that sends us its poor."
 ita_dnc.2208.a: "Pay it, and let their consuls on the quay."
 ita_dnc.2208.b: "The matter belongs to the courts of the state."
 ita_dnc.2212.t: "The Passage Is Asked For Again"
 ita_dnc.2212.d: "Rome offers to lift the ban on the subsidised passage, on condition that Italian consuls may inspect the plantations and that the contracts are paid in coin.\n\nThe fazendas want the hands and have wanted them for years. The planters will not enjoy being inspected by a foreign government in their own province."
 ita_dnc.2212.a: "Accept the inspection; we need the hands."
 ita_dnc.2212.b: "The plantations will not be inspected."
 ita_dnc.2216.t: "The Question Is Put to the Powers"
 ita_dnc.2216.d: "The Consulta has drafted the same confidential question five times over, once for each of the chancelleries whose opinion will matter when the fourth shore is taken. Each of them will answer differently, each answer will cost us something elsewhere, and none of them can be asked twice in the same season.\n\nWe must choose which capital hears the question first."
 ita_dnc.2216.a: "Ask Paris."
 ita_dnc.2216.b: "Ask London."
 ita_dnc.2216.c: "Ask Berlin."
 ita_dnc.2216.e: "Ask Vienna."
 ita_dnc.2216.f: "Ask Petersburg."
 ita_dnc.2216.g: "The soundings can wait."
 ITA_e_the_consuls_on_the_quay: "The Consuls on the Quay"
 ITA_e_the_consuls_on_the_quay_desc: "Our consulates in the Americas keep a register of the men who landed, and a man who is on a register comes home."
 ITA_e_the_chaplains_of_the_passage: "The Chaplains of the Passage"
 ITA_e_the_chaplains_of_the_passage_desc: "The Scalabrinian fathers sail with the emigrants and write to the parish that sent them, and the parish keeps its men."
 ITA_b_the_pensions_are_funded: "The Pensions Are Funded"
 ITA_b_the_pensions_are_funded_desc: "The old age fund is compulsory and the employers pay into it, and every wage in the kingdom is that much smaller."
 ITA_i_the_volunteers_are_registered: "The Volunteers Are Registered"
 ITA_i_the_volunteers_are_registered_desc: "A register of men who have asked to serve beyond the frontier stands open in every northern city."
 ITA_i_the_committees_beyond_the_frontier: "The Committees Beyond the Frontier"
 ITA_i_the_committees_beyond_the_frontier_desc: "The irredentist committees send back roads, garrisons and timetables that the staff would otherwise have to guess at."
 ITA_i_the_committees_beyond_the_frontier_reinforced: "The Committees Beyond the Frontier Are Reinforced"
 ITA_i_the_committees_beyond_the_frontier_reinforced_desc: "The committees are funded from the secret estimates and answer to the staff instead of to the newspapers, and the maps that come back are drawn to scale."
 ITA_i_the_map_of_the_adriatic: "The Map of the Adriatic"
 ITA_i_the_map_of_the_adriatic_desc: "The staff has the soundings of the far shore, the roads behind it and the plan drawn for both."
 ITA_w_the_schools_are_reinforced: "The Schools Are Reinforced"
 ITA_w_the_schools_are_reinforced_desc: "Every schoolmaster we send down the Albanian coast comes back with something the staff can use."
 ITA_dnc_colonies_cat: "The Colonies"
 ITA_dnc_works_cat: "Public Works"
 ITA_dnc_plans_cat: "War Plans and the Staff"
 ITA_dnc_ministry_cat: "The Ministry"
 ITA_dnc_press_cat: "The Press"
 ITA_dnc_wars_cat: "The Wars"
 ITA_dnc_adriatic_cat: "The Adriatic"
 ITA_dnc_messina_cat: "Messina"
 ITA_dnc_siege_cat: "The State of Siege"
 ITA_af_the_massawa_railway: "The Massawa Railway"
 ITA_af_the_massawa_railway_desc: "The colony lives off one port and a mule track into the highlands. We will carry the line up from the sea, so that a battalion and a harvest can move in the same week."
 ITA_af_the_benadir_bought_out: "The Benadir Bought Out"
 ITA_af_the_benadir_bought_out_desc: "The chartered company has governed the southern coast cheaply and badly, and the scandal of its labour has reached the Chamber. We will buy it out, put the Benadir under the state and take its askari companies onto our own establishment."
 ITA_af_the_ascari_battalion_raised: "The Ascari Battalion Raised"
 ITA_af_the_ascari_battalion_raised_desc: "Recruiting is open in the highlands, and the pay of a soldier is better than the pay of a herdsman. We will raise another battalion of askari and let it carry the garrison duty that costs us conscripts."
 ITA_af_the_tripoli_agents: "The Tripoli Agents"
 ITA_af_the_tripoli_agents_desc: "Our consulate on that coast keeps a list of the notables and a fund for them. We will pay the agents, buy the opinion of the town and let the powers see that our interest there is an old one."
 ITA_af_the_kufra_caravan: "The Kufra Caravan"
 ITA_af_the_kufra_caravan_desc: "The brotherhood of the interior trades through the oases and sells us nothing. We will send a caravan of goods and gifts up to the lodges and ask for nothing in return this season."
 ITA_af_the_senussi_subsidy: "The Senussi Subsidy"
 ITA_af_the_senussi_subsidy_desc: "The interior is held by nobody who signs treaties, and the order that rules the oases can be paid. We will pay it, and a province that has been ungovernable will be governed by somebody who is not at war with us."
 ITA_af_the_sultans_treaties: "The Sultans' Treaties"
 ITA_af_the_sultans_treaties_desc: "The sultans of the southern ports signed with the company, not with the kingdom. We will renew the treaties in our own name and pay openly for the harbours we already use."
 ITA_af_the_lake_tana_survey: "The Lake Tana Survey"
 ITA_af_the_lake_tana_survey_desc: "The engineers want the levels of the lake and the passes that lead to it, and the Emperor will not like being asked. We will send the survey anyway and file what it brings back."
 ITA_af_the_tripartite_is_invoked: "The Tripartite Is Invoked"
 ITA_af_the_tripartite_is_invoked_desc: "The three powers divided the future of the highlands on paper, and paper has to be reread from time to time. We will ask London whether the zone that agreement left us is still ours."
 ITA_af_the_senussi_are_asked: "The Senussi Are Asked"
 ITA_af_the_senussi_are_asked_desc: "If the coast is ever taken, the war for it will be decided in the oases behind it. We will ask the order, through the bank and the missions, to keep the interior quiet whatever happens on the shore."
 ITA_af_the_customs_at_massawa: "The Customs at Massawa"
 ITA_af_the_customs_at_massawa_desc: "Everything the highlands buy passes our customs house, and the duty is a standing grievance at the Emperor's court. We will offer to share the receipts and see what he will give for them."
 ITA_af_the_africa_corps_is_named: "The Africa Corps Is Named"
 ITA_af_the_africa_corps_is_named_desc: "The African garrisons are a collection of detachments with no head over them. We will name a corps for Africa, give it a staff, and let the army plan for a war south of the sea."
 ITA_pw_the_apulian_aqueduct: "The Apulian Aqueduct"
 ITA_pw_the_apulian_aqueduct_desc: "The driest province in Europe drinks from cisterns and buys its water by the barrel. We will bring the springs of Campania across the mountains, and the towns that riot over water will have taps."
 ITA_pw_the_direttissima: "The Direttissima Rome-Naples"
 ITA_pw_the_direttissima_desc: "The trains between the capital and the greatest city of the South still crawl around every hill. We will build the direct line and cut the run to half a day."
 ITA_pw_the_po_dykes: "The Po Dykes"
 ITA_pw_the_po_dykes_desc: "The great river takes a harvest and half a province whenever the spring is wet. We will raise and widen the dykes along the lower reaches before it does it again."
 ITA_pw_the_genoa_harbour: "The Genoa Harbour"
 ITA_pw_the_genoa_harbour_desc: "The port that feeds the industry of the North is full, and the ships wait their turn outside the mole. We will dredge the basin and build the new quays."
 ITA_pw_the_simplon_approaches: "The Simplon Approaches"
 ITA_pw_the_simplon_approaches_desc: "The tunnel under the mountain will open, and our side of it is a single track winding through the valleys. We will double the approaches so that the traffic of the North does not stop at the frontier."
 ITA_pw_the_sulphur_consortium: "The Sulphur Consortium"
 ITA_pw_the_sulphur_consortium_desc: "The sulphur of the island is sold by men who undercut each other and pay their miners in bread. We will put the trade into a consortium and build the refinery the owners never built."
 ITA_pw_messina_rebuilt: "Messina Rebuilt"
 ITA_pw_messina_rebuilt_desc: "The city is a field of rubble with a plan drawn over it, and the huts were meant to last one winter. We will rebuild it in stone, to the seismic code, and put the works back on the strait."
 ITA_pw_the_calabria_law: "The Calabria Law"
 ITA_pw_the_calabria_law_desc: "The province shakes, the hillsides come down on the villages, and the emigrant ships take whoever is left. We will pass the special law for Calabria and pay for its roads, its forests and its rebuilt towns."
 ITA_wp_plan_west: "Plan West"
 ITA_wp_plan_west_desc: "The staff keeps a plan for the western frontier, and it has not been opened since the last quarrel with Paris. We will bring it up to date, with the passes, the depots and the timetable of the trains."
 ITA_wp_plan_east: "Plan East"
 ITA_wp_plan_east_desc: "There is a plan against the ally in a locked drawer, and nobody has walked the ground it describes. We will work it through: the river line, the mountain sectors, and the railways that would carry the army there."
 ITA_wp_the_libya_expedition: "The Libya Expedition"
 ITA_wp_the_libya_expedition_desc: "An expedition across the sea is a naval problem before it is a military one. We will rehearse the loading, the convoy and the landing beaches until the corps can sail within a fortnight of the order."
 ITA_wp_the_adwa_column: "The Adwa Column"
 ITA_wp_the_adwa_column_desc: "The road up to the highlands is the road on which we lost an army. We will plan the column properly this time: water, transport, and a line of posts behind it."
 ITA_wp_the_adriatic_coast_defence: "The Adriatic Coast Defence"
 ITA_wp_the_adriatic_coast_defence_desc: "Our eastern shore is flat, open, and one night's steaming from the ally's bases. We will fortify the landing places of the Veneto and of Apulia."
 ITA_wp_the_mobilisation_test: "The Alpine Mobilisation Test"
 ITA_wp_the_mobilisation_test_desc: "A mobilisation that has never been tried is a table of figures. We will call up the alpine districts without warning and count what actually reaches the depots."
 ITA_wp_the_alpine_frontier_is_surveyed: "The Alpine Frontier Is Surveyed"
 ITA_wp_the_alpine_frontier_is_surveyed_desc: "The engineers have never mapped the passes on our side as an enemy would read them. We will survey the whole alpine frontier and site the works where the survey tells us to."
 ITA_wp_the_fleet_school_is_chosen: "The Fleet School Is Chosen"
 ITA_wp_the_fleet_school_is_chosen_desc: "The admiralty is split between a fleet for the open sea and a fleet for the narrow one, and the estimates will not pay for both. We will call the board together and make it choose the school."
 ITA_wp_the_class_is_called_early: "The Class Is Called Early"
 ITA_wp_the_class_is_called_early_desc: "The class of the year can be called to the colours before its time, and the country will notice that it has been. We will call it early and take the trouble that follows."
 ITA_wp_the_manoeuvres_of_the_two_armies: "The Manoeuvres of the Two Armies"
 ITA_wp_the_manoeuvres_of_the_two_armies_desc: "The army trains by regiments and has not moved two armies against each other in a decade. We will hold the great manoeuvres and let the staff learn its trade on the ground."
 ITA_mi_the_reshuffle: "The Reshuffle"
 ITA_mi_the_reshuffle_desc: "A ministry that has been in office a season owes something to every group in the Chamber. We will redistribute the portfolios and pay some of those debts."
 ITA_mi_the_confidence_vote: "The Confidence Vote"
 ITA_mi_the_confidence_vote_desc: "The Chamber is talking and the ministry is not governing. We will put the question of confidence and make the groups declare themselves in the division."
 ITA_mi_the_interpellation_answered: "The Interpellation Answered"
 ITA_mi_the_interpellation_answered_desc: "The Extreme Left has an interpellation down on the last shooting, and it will be debated with the galleries full. We will answer it from the tribune ourselves."
 ITA_mi_the_estimates_by_decree: "The Estimates by Decree"
 ITA_mi_the_estimates_by_decree_desc: "The Chamber will not vote the estimates and the arsenals are waiting for the money. We will bring them in by decree and let the deputies protest in the lobby."
 ITA_mi_the_honours_list: "The Honours List"
 ITA_mi_the_honours_list_desc: "Senators are made, crosses are given, and provincial notables are remembered by name. We will publish the list before the session opens."
 ITA_mi_the_resignation_threatened: "The Resignation Threatened"
 ITA_mi_the_resignation_threatened_desc: "A ministry that cannot be replaced may ask for anything it likes. We will lay our resignation on the table and see who in this Chamber wants the succession."
 ITA_mi_the_under_secretary_for_the_left: "The Under-Secretary for the Left"
 ITA_mi_the_under_secretary_for_the_left_desc: "A reformist deputy at a desk in the ministry is worth more to us than the same man making speeches in the piazza. We will offer him the under-secretaryship and let his friends explain it to the party."
 ITA_mi_the_ministry_of_transition: "The Ministry of Transition"
 ITA_mi_the_ministry_of_transition_desc: "The majority has come apart and no group will carry the session on its own. We will form a ministry of transition, hold the machine together, and pay for it in patronage."
 ITA_pr2_subsidise_a_paper: "Subsidise a Paper"
 ITA_pr2_subsidise_a_paper_desc: "Every group in the Chamber has a paper, and every paper has a deficit. We will carry one of them through the session, and it will carry us."
 ITA_pr2_seize_an_edition: "Seize an Edition"
 ITA_pr2_seize_an_edition_desc: "An edition is on the streets calling for the strike by name and by district. We will seize it at the presses and prosecute the editor."
 ITA_pr2_the_agenzia_stefani: "The Agenzia Stefani"
 ITA_pr2_the_agenzia_stefani_desc: "The wire service that speaks for the ministry is read in every chancellery in Europe. We will put it on a proper footing, and the courts of Europe will read us as we wish to be read."
 ITA_pr2_the_war_correspondents: "The War Correspondents"
 ITA_pr2_the_war_correspondents_desc: "The country reads its war in the evening papers, and the papers print what the staff allows them. We will take the correspondents to the front and let them write from it."
 ITA_pr2_the_idea_nazionale: "The Idea Nazionale"
 ITA_pr2_the_idea_nazionale_desc: "The nationalist groups have a review, a lecture circuit and no money at all. We will fund the paper and let it carry the programme into the piazza."
 ITA_pr2_the_avanti_prosecuted: "The Avanti Prosecuted"
 ITA_pr2_the_avanti_prosecuted_desc: "The socialist daily has printed an incitement that a court can read as one. We will prosecute it, take the noise of the trial, and take the silence that follows the verdict."
 ITA_wr_the_transports_at_naples: "The Transports at Naples"
 ITA_wr_the_transports_at_naples_desc: "The expedition is waiting on hulls, and the merchant companies want their season. We will requisition the transports at the quays and load the corps."
 ITA_wr_reprisals_in_the_oases: "Reprisals in the Oases"
 ITA_wr_reprisals_in_the_oases_desc: "The columns are ambushed at the wells, and the villages behind us feed the ambush. We will make the reprisals the officers are asking for and hold the interior by fear."
 ITA_wr_the_islands_as_a_pledge: "The Islands as a Pledge"
 ITA_wr_the_islands_as_a_pledge_desc: "The war on that coast will not end until the enemy feels it at home. We will take the islands of the Aegean and hold them as a pledge for the peace."
 ITA_wr_the_volunteers_of_garibaldi: "The Volunteers of Garibaldi"
 ITA_wr_the_volunteers_of_garibaldi_desc: "The old man's son has the name, and the volunteers are already writing to him. We will let him raise his legion and put it in the line where the name is worth something."
 ITA_wr_the_irredentist_legion: "The Irredentist Legion"
 ITA_wr_the_irredentist_legion_desc: "The students from beyond the frontier are subjects of the enemy, and every one of them has come to enlist. We will form them into an alpine legion and mind where we send it."
 ITA_wr_the_indemnity_loan: "The Indemnity Loan"
 ITA_wr_the_indemnity_loan_desc: "The indemnity is being paid out of the ordinary budget and it is eating the estimates. We will fund it with a loan and be rid of the charge a year early."
 ITA_ad_the_montenegrin_loan: "The Montenegrin Loan"
 ITA_ad_the_montenegrin_loan_desc: "The prince across the water is short of money, and his creditors sit in Vienna. We will lend him ours and take the port and the customs as our security."
 ITA_ad_the_survey_of_valona: "The Survey of Valona"
 ITA_ad_the_survey_of_valona_desc: "The bay is the finest anchorage on the far shore, and nobody has charted it properly since the Venetians. We will send the hydrographers across under a merchant flag."
 ITA_ad_the_bocche_are_watched: "The Bocche Are Watched"
 ITA_ad_the_bocche_are_watched_desc: "The ally exercises his fleet behind the mouths, and our attaches are never invited. We will keep a ship in the strait and let it count what comes out."
 ITA_ad_the_serbian_line_is_financed: "The Serbian Line Is Financed"
 ITA_ad_the_serbian_line_is_financed_desc: "Belgrade wants a railway to the sea that does not pass through the ally's hands. We will find the money for it, and put an Italian port at the end of it."
 ITA_ad_article_twenty_nine_is_invoked: "Article Twenty-Nine Is Invoked Against Vienna"
 ITA_ad_article_twenty_nine_is_invoked_desc: "The treaty that closed the last war on that coast forbids the little kingdom a navy and puts its shore under the ally's police. We will ask Vienna to give the article up, and we will ask in public."
 ITA_ad_the_fleet_visits_cattaro: "The Fleet Visits Cattaro"
 ITA_ad_the_fleet_visits_cattaro_desc: "A fleet that never visits the ally's ports is read as a fleet preparing against him. We will ask for the courtesy visit and read the answer carefully."
 ITA_ad_the_tobacco_regie: "The Tobacco Regie"
 ITA_ad_the_tobacco_regie_desc: "The little kingdom's whole revenue is its tobacco, and the monopoly is for sale. We will take the regie and pay the prince his rent."
 ITA_ad_the_adriatic_squadron_shows_the_flag: "The Adriatic Squadron Shows the Flag"
 ITA_ad_the_adriatic_squadron_shows_the_flag_desc: "The far shore sees the ally's ships every season and ours almost never. We will send the squadron up the coast and let it be seen in every roadstead."
 ITA_me_the_huts: "The Huts"
 ITA_me_the_huts_desc: "The survivors are under canvas and the winter is coming down the strait. We will put up the timber huts and quarter the homeless before the rains."
 ITA_me_the_relief_credit: "The Relief Credit"
 ITA_me_the_relief_credit_desc: "The Chamber will vote anything asked for the strait this session. We will ask for the relief credit and spend it on the water, the roads and the harbour."
 ITA_me_the_foreign_sailors_thanked: "The Foreign Sailors Thanked"
 ITA_me_the_foreign_sailors_thanked_desc: "Foreign squadrons were in the roads before our own were, and their sailors dug our people out of the ruins. We will thank them by name, in public, and remember the debt."
 ITA_me_the_reconstruction_plan: "The Reconstruction Plan"
 ITA_me_the_reconstruction_plan_desc: "The city will be rebuilt where it stood, and the only argument left is how. We will adopt the plan, the building code and the works that go with them."
 ITA_me_the_straits_ferry: "The Straits Ferry"
 ITA_me_the_straits_ferry_desc: "The island and the mainland are joined by a boat that cannot carry a train. We will build the ferry berths and the approaches on both shores."
 ITA_sg_siege_by_telegram: "Siege by Telegram"
 ITA_sg_siege_by_telegram_desc: "A province has stopped obeying its prefect, and the telegraph to it still works. We will proclaim the state of siege there by wire and let the general govern it until it is quiet."
 ITA_sg_the_military_tribunals: "The Military Tribunals"
 ITA_sg_the_military_tribunals_desc: "The civil courts acquit, and the trials drag on for a year while the districts watch. We will send the cases to military tribunals and have them judged in a week."
 ITA_sg_the_press_sequestered: "The Press Sequestered"
 ITA_sg_the_press_sequestered_desc: "The seditious sheets are printed at night in a few cities and read in the morning in all of them. We will sequester the presses and hold the type."
 ITA_sg_the_siege_lifted: "The Siege Lifted"
 ITA_sg_the_siege_lifted_desc: "The state of siege was meant for a season and it has become the way we govern. We will lift it, give the districts back their civil courts, and take the credit for it."
 ITA_sg_the_amnesty: "The Amnesty"
 ITA_sg_the_amnesty_desc: "The prisons hold the men of the last rising, and every one of them is an argument against us. We will proclaim the amnesty and empty the cells."
 ITA_sg_the_carabinieri_reinforced: "The Carabinieri Reinforced"
 ITA_sg_the_carabinieri_reinforced_desc: "Public order is kept by soldiers who were raised for a war, and they keep it badly. We will raise more legions of carabinieri and take the army out of the squares."
 ITA_dec_massawa_railway_tt: "The line climbs from the port into the highlands"
 ITA_dec_benadir_tt: "The southern coast passes to the state, with its askari"
 ITA_dec_ascari_battalion_tt: "Another battalion of askari takes the colours"
 ITA_dec_tripoli_agents_tt: "The notables of the coast are on our list, and the Porte knows it"
 ITA_dec_kufra_caravan_tt: "The lodges of the interior receive us"
 ITA_dec_senussi_subsidy_tt: "The order is paid, and an ungoverned province is governed"
 ITA_dec_sultans_treaties_tt: "The treaties are renewed in the name of the kingdom"
 ITA_dec_lake_tana_tt: "The levels and the passes are filed at the staff"
 ITA_dec_the_zone_is_asked_tt: "London is asked whether our zone is still ours"
 ITA_dec_the_order_is_asked_tt: "The order is asked to keep the interior quiet"
 ITA_dec_customs_at_massawa_tt: "The Emperor is offered a share of the customs"
 ITA_dec_africa_corps_tt: "Africa gets a corps and a staff of its own"
 ITA_dec_apulian_aqueduct_tt: "The aqueduct advances, and the province is quieter for it"
 ITA_dec_direttissima_tt: "The direct line joins the capital to the South"
 ITA_dec_po_dykes_tt: "The lower river is diked"
 ITA_dec_genoa_harbour_tt: "The basin is dredged and the new quays are built"
 ITA_dec_simplon_tt: "The approaches are doubled, and Bern takes note"
 ITA_dec_sulphur_consortium_tt: "The trade is consolidated and the refinery is built"
 ITA_dec_messina_rebuilt_tt: "The city rises again, in stone"
 ITA_dec_calabria_law_tt: "The special law is applied to the province"
 ITA_dec_plan_west_tt: "The western plan is worked through"
 ITA_dec_plan_east_tt: "The plan against the ally is worked through"
 ITA_dec_libya_expedition_tt: "The crossing and the landing are rehearsed"
 ITA_dec_adwa_column_tt: "The column south is planned properly this time"
 ITA_dec_adriatic_coast_tt: "The eastern beaches are fortified"
 ITA_dec_mobilisation_test_tt: "The alpine districts are called without warning"
 ITA_dec_alpine_survey_tt: "The frontier is surveyed, and the works are sited"
 ITA_dec_fleet_school_tt: "The board is called together to choose the school of the fleet"
 ITA_dec_class_called_early_tt: "The class is with the colours, and the country notices"
 ITA_dec_manoeuvres_tt: "Two armies manoeuvre against each other"
 ITA_dec_reshuffle_tt: "Portfolios change hands and the majority is paid"
 ITA_dec_confidence_vote_tt: "The Chamber is made to declare itself"
 ITA_dec_interpellation_tt: "The tribune is answered, and the piazza is not"
 ITA_dec_estimates_by_decree_tt: "The estimates pass without the Chamber"
 ITA_dec_honours_list_tt: "The list is published before the session opens"
 ITA_dec_resignation_threatened_tt: "The succession is offered to whoever will take it"
 ITA_dec_under_secretary_tt: "A reformist takes a desk in the ministry"
 ITA_dec_ministry_of_transition_tt: "A ministry is put together to hold the session"
 ITA_dec_subsidise_a_paper_tt: "A paper is carried through the session"
 ITA_dec_seize_an_edition_tt: "The edition is taken at the presses"
 ITA_dec_agenzia_stefani_tt: "The chancelleries read us as we wish to be read"
 ITA_dec_war_correspondents_tt: "The country reads the war and stays with it"
 ITA_dec_idea_nazionale_tt: "The programme is carried into the piazza"
 ITA_dec_avanti_the_trial_tt: "The trial opens, and the square answers it"
 ITA_dec_avanti_the_verdict_tt: "The verdict comes down and the noise goes out of it"
 ITA_dec_transports_at_naples_tt: "The transports are requisitioned and loaded"
 ITA_dec_reprisals_tt: "The interior is held by fear, and Europe reads the reports"
 ITA_dec_islands_pledge_tt: "The islands are claimed as a pledge for the peace"
 ITA_dec_garibaldi_volunteers_tt: "The legion takes the field under the name"
 ITA_dec_irredentist_legion_tt: "The students from beyond the frontier are in the line"
 ITA_dec_indemnity_loan_tt: "The indemnity is funded and lifted early"
 ITA_dec_montenegrin_loan_tt: "The prince takes our money, and the port goes with it"
 ITA_dec_survey_of_valona_tt: "The bay is charted, and Vienna hears of it"
 ITA_dec_bocche_watched_tt: "A ship keeps count in the strait, and the ally resents it"
 ITA_dec_serbian_line_tt: "The line to the sea is financed"
 ITA_dec_article_twenty_nine_tt: "Vienna is asked to give up the article"
 ITA_dec_fleet_visits_tt: "The courtesy visit is asked for"
 ITA_dec_tobacco_regie_tt: "The monopoly is ours, and the prince is paid his rent"
 ITA_dec_squadron_shows_the_flag_tt: "The far shore sees our flag, and the ally takes offence"
 ITA_dec_the_huts_tt: "The homeless are under a roof before the rains"
 ITA_dec_relief_credit_tt: "The credit is voted and spent on the strait"
 ITA_dec_sailors_thanked_tt: "The foreign squadrons are thanked by name"
 ITA_dec_reconstruction_plan_tt: "The city is rebuilt to the plan and to the code"
 ITA_dec_straits_ferry_tt: "The ferry berths join the island to the mainland"
 ITA_dec_siege_by_telegram_tt: "The province is governed again, and the square pays for it"
 ITA_dec_military_tribunals_tt: "The cases go to the soldiers, and the courts are silent"
 ITA_dec_press_sequestered_tt: "The presses are held and the type is seized"
 ITA_dec_siege_lifted_tt: "The civil courts come back, and the Quirinal grumbles"
 ITA_dec_the_amnesty_tt: "The cells are emptied, and the Crown was not asked"
 ITA_dec_carabinieri_tt: "The Arma is reinforced and the army leaves the squares"
 ITA_dec_tt_the_highlands_answer: "The highlands answer, and the Consulta reads the answer"
 ITA_dec_tt_a_power_reaffirms: "A power reaffirms our zone"
 ITA_dec_tt_the_article_is_struck: "The article is struck out, and the far shore may arm itself"
 ITA_dec_tt_the_roadstead_is_open: "The ally opens his roadstead to our squadron"
 ITA_dec_tt_the_ocean_school: "The fleet is built for the open sea"
 ITA_dec_tt_the_narrow_school: "The fleet is built for the narrow sea"
 ITA_dec_tt_the_interior_stays_quiet: "The order stands aside, and the interior stays quiet"
 ITA_af_threat_the_order_answers: "The Senussi proclaim the holy war against Italy"
 ita_dnc.2224.t: "The Customs Are Offered"
 ita_dnc.2224.d: "The Italians propose to share the receipts of the customs house at the port, where everything our merchants bring up the escarpment is taxed before it reaches us. There is a draft convention with the offer, and a request that our caravans keep to the road they have always used. We may take it up and sign, or leave the paper where it lies and go on paying at the gate."
 ita_dnc.2224.a: "Take it up and sign"
 ita_dnc.2224.b: "Leave the paper where it lies"
 ita_dnc.2225.t: "The Customs Are Taken Up"
 ita_dnc.2225.d: "The convention is signed and the first quarter's receipts are already going up the escarpment. Our consul writes that the party at that court which wants nothing whatever from us has lost a little ground. The Consulta can build on this."
 ita_dnc.2225.a: "The road up the escarpment is open"
 ita_dnc.2226.t: "The Offer Is Not Taken Up"
 ita_dnc.2226.d: "The draft has come back unsigned, with a courteous note about the dignity of an empire. Nobody at the customs house will admit that a refusal was what they expected."
 ita_dnc.2226.a: "File it and wait"
 ita_dnc.2228.t: "The Zone Is Asked About Again"
 ita_dnc.2228.d: "Rome asks whether the agreement of the three powers on the Abyssinian question still stands, and whether the zone it left to Italy is still hers. The question is put in a note that plainly expects an answer we shall have to publish. We may reaffirm the agreement as it was signed, or say nothing and keep our own hands free on the upper river."
 ita_dnc.2228.a: "Reaffirm the zone"
 ita_dnc.2228.b: "Say nothing, and keep our hands free"
 ita_dnc.2229.t: "The Zone Is Reaffirmed"
 ita_dnc.2229.d: "The answer is friendly and it names the zone. The Consulta can quote it in the next conversation with the powers, and the consent we have been counting is worth a little more than it was."
 ita_dnc.2229.a: "Quote it where it matters"
 ita_dnc.2230.t: "No Answer on the Zone"
 ita_dnc.2230.d: "The reply says a great deal about old friendship and nothing at all about the zone. The agreement is not denied, and it is not confirmed either."
 ita_dnc.2230.a: "Then we shall ask again"
 ita_dnc.2232.t: "Rome Asks for the Abrogation of Article Twenty-Nine"
 ita_dnc.2232.d: "The Italians ask us to give up the article of the treaty that keeps the little kingdom across the water from arming its own coast and puts its shore under our maritime police. They ask in a note that their newspapers already have in proof. We may abrogate the article and be thanked for it in Cetinje, or refuse and leave the ministry in Rome to explain the refusal to its own piazza."
 ita_dnc.2232.a: "Give up the article"
 ita_dnc.2232.b: "Refuse, and let them explain it"
 ita_dnc.2233.t: "The Article Is Struck Out"
 ita_dnc.2233.d: "The ally has given up the article, and the shore opposite ours is free of his police. The prince over the water knows perfectly well who asked for it."
 ita_dnc.2233.a: "The coast is free"
 ita_dnc.2234.t: "The Article Stands"
 ita_dnc.2234.d: "The ally will not touch the article, and says so in a note that was written to be read aloud. The papers have it by the evening and the piazza has it by the morning."
 ita_dnc.2234.a: "Let the country read it"
 ita_dnc.2236.t: "The Italian Squadron at Cattaro"
 ita_dnc.2236.d: "The Italians ask for a courtesy visit of their Adriatic squadron to our great roadstead, with the salutes, the dinners and the exchange of officers that go with it. Our admirals do not want them counting the moorings; our diplomats say that a refusal will be printed from Paris to Petersburg. We may receive the squadron properly, or find a reason why this season will not do."
 ita_dnc.2236.a: "Receive them, with the salutes"
 ita_dnc.2236.b: "Find a reason"
 ita_dnc.2237.t: "The Squadron Is Received"
 ita_dnc.2237.d: "The salutes were fired, the dinners were given, and our officers walked the moorings for the best part of a week. They came back with rather more than the admirals opposite meant to show them."
 ita_dnc.2237.a: "Worth the coal it cost"
 ita_dnc.2238.t: "The Roadstead Is Closed to Us"
 ita_dnc.2238.d: "The visit is declined, politely, on account of manoeuvres that nobody can find in the naval lists. The squadron turns back at sea, and every wardroom in the fleet draws the same conclusion about the alliance."
 ita_dnc.2238.a: "The wardrooms have understood"
 ita_dnc.2240.t: "The Admiralty Asks for a School"
 ita_dnc.2240.d: "The board is divided and the estimates will carry only one school. One party wants capital ships that can leave this sea and be counted among the great fleets; the other wants torpedo craft, submarines and coast defence, because the war we shall actually fight will be fought within sight of land. The minister has to choose, and the yards, the academy and the estimates will follow the choice for a generation."
 ita_dnc.2240.a: "Build for the open sea"
 ita_dnc.2240.b: "Build for the narrow sea"
 ita_dnc.2244.t: "Rome Asks the Order to Keep the Interior Quiet"
 ita_dnc.2244.d: "An envoy has come up from the coast with letters from the Italian bank and from the missions, and one request: that the brotherhood keep the oases quiet whatever happens on the shore. He offers subsidies for the lodges, arms for the caravans and a written promise about our schools. We may give the word and stand aside, or preach the holy war and close the wells behind him."
 ita_dnc.2244.a: "Give the word, and stand aside"
 ita_dnc.2244.b: "Preach the holy war"
 ita_dnc.2245.t: "The Interior Stays Quiet"
 ita_dnc.2245.d: "The word has gone out to the lodges of the interior: whatever happens on the shore, the oases will not rise. It has cost the Treasury and the missions between them a great deal, and it is worth an army corps."
 ita_dnc.2245.a: "Worth an army corps"
 ita_dnc.2246.t: "The Order Preaches the War"
 ita_dnc.2246.d: "The brotherhood has answered with a proclamation, and the wells behind the coast are closed to us. Every column that goes inland will have to fight for its water."
 ita_dnc.2246.a: "Then it will be fought for"
 ITA_p_the_league_settles: "The League Has Settled Here"
 ITA_p_the_league_settles_desc: "The white league has its hall, its contract and its own list of the men to be hired first. Fewer of them will go for soldiers, and rather more gets built."
 ITA_c_the_crown: "The Crown"
 ITA_c_the_crown_desc: "There is a King in this kingdom and the Statuto does not say how much of it is his. What he believes he may do is settled by what the last ministry let him do.\n\nThe Crown's hand: §Y[?ITA_crown|0]§! of a hundred.\n\nBelow thirty-five the King listens. From thirty-five to sixty-four he hesitates. At sixty-five and above the King governs."
 ITA_g_the_ministry_of_the_left: "The Ministry of the Left"
 ITA_g_the_ministry_of_the_left_desc: "The majority is not a party but a subscription, renewed session by session with a portfolio here and a public work there. Nothing can be asked of the Chamber until the Extreme Left has had its answer, and every request costs more than the last."
 ITA_g_the_convention_of_paris: "The Convention of Paris"
 ITA_g_the_convention_of_paris_desc: "A labour treaty for our workmen in France, signed in the open and celebrated with a presidential visit. Two governments that were enemies over Tunis now have a document to point at."
 ITA_g_the_rente_converted: "The Rente Converted"
 ITA_g_the_rente_converted_desc: "The Paris market carried the conversion and the coupon on our debt has come down. What was going out in interest goes into ground and mortar instead."
 ITA_g_the_rente_half: "The Half Conversion"
 ITA_g_the_rente_half_desc: "The conversion went through without us at the table, and the saving is real but smaller than it should have been. The houses that did it will remember that the Treasury was not consulted."
 ITA_g_the_conversion_that_failed: "The Conversion That Failed"
 ITA_g_the_conversion_that_failed_desc: "No market would carry the paper, and the Treasury has had to say so out loud. Every ministry that follows will be asked why the coupon was not cut."
 ITA_g_the_state_railways: "The State Railways"
 ITA_g_the_state_railways_desc: "The lines are bought back and run from a desk in Rome. The gauge is the same and the timetable is worse, but the state now decides where the next embankment goes."
 ITA_s_garrison_duty: "Garrison Duty"
 ITA_s_garrison_duty_desc: "Battalions that should be at manoeuvres are standing in market squares with fixed bayonets. The men learn the trade of policemen and forget the trade of soldiers."
 ITA_s_the_protocol: "The Protocol"
 ITA_s_the_protocol_desc: "A police convention against the anarchists, signed with a power that has more experience of them than we have. Names cross the frontier now, and the squares are quieter every month."
 ITA_s_the_powers_silence: "The Powers' Silence"
 ITA_s_the_powers_silence_desc: "We asked the chancelleries what they would say, and not one of them said anything. A government that has been told nothing may do a great deal."
 ITA_s_the_naval_convention: "The Naval Convention"
 ITA_s_the_naval_convention_desc: "Our squadrons and theirs now share a signal book, a coaling plan and a station in the middle sea. The wardrooms study a doctrine written elsewhere and are glad of it."
 ITA_s_the_score_of_tunis_settled: "The Score of Tunis Settled"
 ITA_s_the_score_of_tunis_settled_desc: "The oldest grievance in the kingdom has been paid, and the men who were told to forget it no longer have to. A country that has had its answer is easier to govern."
 ITA_s_bizerte_open: "Bizerte Open"
 ITA_s_bizerte_open_desc: "The works at the great roadstead are levelled and the basin is open water. Nobody keeps a fleet there now, and that is the whole of the bargain."
 ITA_s_the_indemnity: "The Indemnity"
 ITA_s_the_indemnity_desc: "The peace was bought with a sum the Treasury will be paying for years, and the schedule is written in gold. Ministries will be made and unmade over the instalments."
 ITA_s_the_fleet_limited: "The Fleet Limited"
 ITA_s_the_fleet_limited_desc: "The peace fixed what we may lay down, and the yards have been told which slips to close. The naval estimates are now written in another capital."
 ITA_r_the_yards_stopped: "The Yards Stopped"
 ITA_r_the_yards_stopped_desc: "The great arsenal has downed tools and the admirals have written to the King about it. Nothing leaves the slipways until the dispute is settled."
 ITA_r_the_sunday_rest: "The Sunday Rest"
 ITA_r_the_sunday_rest_desc: "One day in seven is closed by law, and the inspectors are being let through the gate at last. The mills lose a shift and the country gains a temper."
 ITA_r_the_berlin_model: "The Berlin Model"
 ITA_r_the_berlin_model_desc: "Our study mission came home with the insurance registers of a state that has been at this longer than we have. The clerks copy the forms and the workmen notice the difference."
 ITA_r_the_crown_and_the_bloc: "The Crown and the Bloc"
 ITA_r_the_crown_and_the_bloc_desc: "The King has taken the majority as he found it, and the majority has stopped asking whether he would. A ministry that need not look over its shoulder gets more done in a morning."
 ITA_r_the_arbitration_clause: "The Arbitration Clause"
 ITA_r_the_arbitration_clause_desc: "A general treaty of arbitration, signed and printed, which sends our quarrels to a table before they reach a frontier. The country approves, and the general staff has stopped reading the newspapers."
 ITA_r_the_war_not_fought: "The War Not Fought"
 ITA_r_the_war_not_fought_desc: "The expedition was talked about, costed and put away in a drawer. The Treasury and the mothers of the south are of one mind for once."
 ITA_r_the_constituent_sits: "The Constituent Sits"
 ITA_r_the_constituent_sits_desc: "An assembly is writing the state down from the beginning, and until it has finished nothing else can be decided. Every ministerial order is provisional and every deputy knows it."
 ITA_r_the_republic: "The Republic"
 ITA_r_the_republic_desc: "The form of the state has changed and the prefects are still addressing their reports to a Crown that is not there. It will settle, but not this year."
 ITA_r_the_guarantees_renewed: "The Guarantees Renewed"
 ITA_r_the_guarantees_renewed_desc: "The new state has renewed, in its own name, the guarantees the old one gave the Holy See. The Pope stayed, and half the quarrel went out with the King."
 ITA_r_the_republic_one_and_indivisible: "The Republic, One and Indivisible"
 ITA_r_the_republic_one_and_indivisible_desc: "The assembly has voted the formula and the army has sworn to it. Whatever else is in dispute, the shape of the state no longer is."
 ITA_z_the_adriatic_line: "The Adriatic Line"
 ITA_z_the_adriatic_line_desc: "Our money built the road to the eastern shore and our houses handle what moves along it. The two small kingdoms across the water trade through Italian ledgers now."
 ITA_z_the_army_that_is_not_ready: "The Army That Is Not Ready"
 ITA_z_the_army_that_is_not_ready_desc: "The general staff has put in writing what the ministry did not want written down. The country has read it too."
 ITA_z_the_war_that_did_not_come: "The War That Did Not Come"
 ITA_z_the_war_that_did_not_come_desc: "The staff across the mountains asked for its war and was refused by its own foreign office. Both frontiers went back to sleep, and ours slept the better of the two."
 ITA_z_the_mobilisation: "The Mobilisation"
 ITA_z_the_mobilisation_desc: "The classes are called, the railways are on the military timetable and the depots are full. The country has never been so ready, and will not be again for a generation."
 ITA_z_the_legions_in_the_street: "The Legions in the Street"
 ITA_z_the_legions_in_the_street_desc: "The volunteer companies did not go home when the crisis passed, and they drill where the prefect can watch them. There are more men under arms than the state has sworn in."
 ITA_z_the_two_shores: "The Two Shores"
 ITA_z_the_two_shores_desc: "One sea, two coasts and one flag over the harbours of both. The freight that used to go round now goes across."
 ITA_z_the_consular_service_reinforced: "The Consular Service Reinforced"
 ITA_z_the_consular_service_reinforced_desc: "Every port and market town of the eastern shore has an Italian consul, a clerk and a subsidy. What the neighbouring staff intends is generally known in Rome before it is signed."
 ITA_k_the_private_channel: "The Private Channel"
 ITA_k_the_private_channel_desc: "No audience, no communique, and a monsignor who calls on a lawyer in a private house. The Catholic courts of Europe have noticed the calm, which is what it was for."
 ITA_k_the_lodges_against_us: "The Lodges Against Us"
 ITA_k_the_lodges_against_us_desc: "The lodges and the Extreme Left have decided that this is a clerical ministry and obstruct it as such. Everything must be carried twice, and paid for twice."
 ITA_k_the_missions: "The Missions Shared"
 ITA_k_the_missions_desc: "The protectorate of the Catholic missions in the east is exercised by two courts instead of one, and one of them is ours. Our houses in the Levant trade under our own flag at last."
 ITA_k_the_chairs_of_the_state: "The Chairs of the State"
 ITA_k_the_chairs_of_the_state_desc: "The state has kept its chairs and told the Curia that a professor answers to the ministry which pays him. The faculties are noisier and the work is better."
 ITA_k_the_conciliation: "The Conciliation"
 ITA_k_the_conciliation_desc: "The oldest quarrel in the kingdom has been signed away, and the Pope is a sovereign again on a few hectares of garden. Half the country has stopped choosing between its parish and its passport."
 ITA_k_the_catholic_kingdom: "The Catholic Kingdom"
 ITA_k_the_catholic_kingdom_desc: "The altar and the throne stand together, and the electoral union delivers what it undertook to deliver. The barracks fill without a quarrel and the sacristies count the ballots."
 ITA_k_the_christian_democrats: "The Christian Democrats"
 ITA_k_the_christian_democrats_desc: "A Catholic party that answers to its voters before its bishops now sits in the Chamber under its own name. The country is steadier and the ministry is watched from a new quarter."
 ITA_k_the_concordat: "The Concordat"
 ITA_k_the_concordat_desc: "Marriage, the schools and the seminaries are settled in a single instrument signed by both sovereigns. What used to be argued in the newspapers is now argued between lawyers."
 ITA_v_the_madrid_convention: "The Madrid Convention"
 ITA_v_the_madrid_convention_desc: "A young Catholic king came to Rome, and a commercial treaty was signed while he was here. The Curia was displeased and the merchants of the Tyrrhenian were not."
 ITA_v_the_crown_and_the_altar: "The Crown and the Altar"
 ITA_v_the_crown_and_the_altar_desc: "The King has consented to be spoken for, and the ministry and the Quirinal say the same thing to the Vatican. A government that speaks with one voice is obeyed with fewer letters."
 ITA_v_the_missions: "The Protection of Our Own"
 ITA_v_the_missions_desc: "The Porte has recognised that Italian religious in the Levant are protected by Italy and by nobody else. It is a small paper, and every chancellery has read it."
 ITA_v_the_curia_is_cold: "The Curia Is Cold"
 ITA_v_the_curia_is_cold_desc: "The offer was made, and the answer was that the Holy Father remains a prisoner. Nothing can be asked of that quarter until the frost lifts."
 ITA_v_the_prisoner_remains: "The Prisoner Remains"
 ITA_v_the_prisoner_remains_desc: "The Conciliation was within a day of signature and the Secretariat of State stopped it. The country was promised an end to the quarrel and has been handed the quarrel back."
 ITA_e_the_bank_of_italy: "The Bank of Italy"
 ITA_e_the_bank_of_italy_desc: "One bank of issue, one discount rate, and a director whom the other houses obey. Credit reaches the yards and the building sites at a price they can pay."
 ITA_n_the_coal_of_cardiff: "The Coal of Cardiff"
 ITA_n_the_coal_of_cardiff_desc: "Our bunkers are filled under a long contract and our colliers sail in convoy behind our own escorts. A country with no coal of its own has at least made the carriage safe."
 MNT_the_coast_policed: "The Coast Is Policed"
 MNT_the_coast_policed_desc: "Foreign gunboats keep order in our roadsteads and foreign engineers survey our harbours. Nothing is built along this shore that the visitors have not approved."
 ITA_giuseppe_saracco: "Giuseppe Saracco"
 ITA_giuseppe_saracco_desc: "The ministry of transition, kept in a drawer at the Senate and taken out when nobody else will serve. He will hold the seals for exactly as long as the Chamber needs to decide what it wants."
 ITA_alessandro_fortis: "Alessandro Fortis"
 ITA_alessandro_fortis_desc: "The locum, a Romagnol who was a republican before he was a minister and still argues like one. He will keep the chair warm and buy the railways while he is sitting in it."
 ITA_ettore_sacchi: "Ettore Sacchi"
 ITA_ettore_sacchi_desc: "The radical, who wants the franchise widened, the clergy out of the schools and the Chamber sitting oftener. He will vote with anybody who gives him one of the three."
 ITA_filippo_turati: "Filippo Turati"
 ITA_filippo_turati_desc: "The reformist who edits the review the whole Left reads and will not take office without the party's leave. Offer him labour and the leagues come in behind him."
 ITA_leonida_bissolati: "Leonida Bissolati"
 ITA_leonida_bissolati_desc: "The reformist of the party paper, who holds that a socialist may serve the state without ceasing to be one. His motion has split the congress twice."
 ITA_rinaldo_rigola: "Rinaldo Rigola"
 ITA_rinaldo_rigola_desc: "The secretary of the confederation, who counts subscriptions rather than speeches and calls the general strike a weapon that rusts. What he signs, the chambers of labour keep."
 ITA_arturo_labriola: "Arturo Labriola"
 ITA_arturo_labriola_desc: "The revolutionary syndicalist of Naples, who despises the ballot and believes in the strike that does not stop. He is heard further in the south than any deputy."
 ITA_napoleone_colajanni: "Napoleone Colajanni"
 ITA_napoleone_colajanni_desc: "The republican dean, a Sicilian who has been proving with figures that the south is robbed for longer than most deputies have sat. He is the only republican the moderates will listen to."
 ITA_ernesto_nathan: "Ernesto Nathan"
 ITA_ernesto_nathan_desc: "The mayor of the Capitol and Grand Master of the lodges, who lights the streets, builds the schools and says at the anniversary of the breach precisely what the Vatican dreads. The city has never been better run or worse loved across the river."
 ITA_filippo_meda: "Filippo Meda"
 ITA_filippo_meda_desc: "The Catholic deputy, elected where no Catholic was supposed to stand, who reads the ban loosely and votes for order. He is the standing proof that the pews can be counted."
 ITA_ottorino_gentiloni: "Ottorino Gentiloni"
 ITA_ottorino_gentiloni_desc: "The count who keeps the lists of the electoral union and knows which candidate signed which undertaking. Nothing is written down that a bishop would ever have to disown."
 ITA_giuseppe_toniolo: "Giuseppe Toniolo"
 ITA_giuseppe_toniolo_desc: "The social Catholic of the popular union, who teaches that a wage is a moral question before it is an economic one. The white leagues quote him at their meetings."
 ITA_romolo_murri: "Romolo Murri"
 ITA_romolo_murri_desc: "The suspended priest of the democratic league, who wants a Catholic party answerable to its voters. Rome has already told him twice to be quiet."
 ITA_ernesto_pacelli: "Ernesto Pacelli"
 ITA_ernesto_pacelli_desc: "The Pope's banker, who lends where the Holy See wishes to be seen and then asks the Consulta for an escort. His branch reaches Tripoli before our consul does."
 ITA_bonaldo_stringher: "Bonaldo Stringher"
 ITA_bonaldo_stringher_desc: "The director of the bank of issue, who held the lira steady through a panic that broke better houses than ours. Ministers call on him, and not the other way about."
 ITA_giulio_prinetti: "Giulio Prinetti"
 ITA_giulio_prinetti_desc: "A bicycle manufacturer at the Consulta, blunt with ambassadors and quick with a decree. He exchanged the letters that no ally has yet been shown."
 ITA_emilio_visconti_venosta: "Emilio Visconti Venosta"
 ITA_emilio_visconti_venosta_desc: "The old hand of the Consulta, brought back whenever a conference must be attended and nothing must be conceded. He has outlived the men who taught him the trade."
 ITA_antonino_di_san_giuliano: "Antonino di San Giuliano"
 ITA_antonino_di_san_giuliano_desc: "A Sicilian marquis who has read every treaty and believes none of them. He asks for the eastern shore in a tone which suggests he is doing everyone a favour."
 ITA_luigi_federzoni: "Luigi Federzoni"
 ITA_luigi_federzoni_desc: "The nationalist journalist who gave the idea its paper and the paper its readers. He wants the emigrants to leave as soldiers rather than as passengers."
 ITA_gabriele_dannunzio: "Gabriele D'Annunzio"
 ITA_gabriele_dannunzio_desc: "The poet of the ship, who can fill a theatre and a recruiting office in the same week. His debts are as celebrated as his verse."
 ITA_cesare_battisti: "Cesare Battisti"
 ITA_cesare_battisti_desc: "The socialist of Trento, who edits an Italian paper under an imperial censor and keeps a map of the valleys on his wall. He is a subject of the Emperor and the guest of every Italian faculty."
 ITA_alceste_de_ambris: "Alceste De Ambris"
 ITA_alceste_de_ambris_desc: "The syndicalist of Parma, who took a whole province out on strike and fed it from soup kitchens. The prefect sent cavalry and made him a legend."
 ITA_ferdinando_martini: "Ferdinando Martini"
 ITA_ferdinando_martini_desc: "The civil governor, a man of letters who ran a colony with a budget, a school and no punitive columns. He is the answer to everyone who says Africa can only be held with the sword."
 ITA_ernesto_teodoro_moneta: "Ernesto Teodoro Moneta"
 ITA_ernesto_teodoro_moneta_desc: "A Garibaldian who has spent his old age arguing that wars are settled more cheaply at a table. The prize he was given abroad is quoted against him at home."
 ITA_salvatore_barzilai: "Salvatore Barzilai"
 ITA_salvatore_barzilai_desc: "A republican deputy born under the double eagle, who speaks for the unredeemed cities in a chamber that is not supposed to mention them. He votes against the ministry and for the fleet."
 ITA_luigi_albertini: "Luigi Albertini"
 ITA_luigi_albertini_desc: "The editor of the great Milanese daily, who turned a newspaper into an institution and the institution into an opposition. Ministers read him before they read their prefects."
 ITA_tancredi_saletta: "Tancredi Saletta"
 ITA_tancredi_saletta_desc: "The chief of staff of the long peace, who plans for the Alpine wall and declines to plan for anything else. He will tell the ministry the army is not ready, and he will be right."
 ITA_ettore_pedotti: "Ettore Pedotti"
 ITA_ettore_pedotti_desc: "A minister of war who counts blankets, boots and remounts and leaves the speeches to others. The depots have been in order since he took them over."
 ITA_carlo_mirabello: "Carlo Mirabello"
 ITA_carlo_mirabello_desc: "A minister of the marine who believes in the line of battle and has laid down the hulls to prove it. He would rather have a few good ships than a fleet of coastal ones."
 ITA_giovanni_bettolo: "Giovanni Bettolo"
 ITA_giovanni_bettolo_desc: "A sailor turned minister whose name is tied to the steel works and to the contracts that came with them. He is trusted at sea and watched on shore."
 ITA_enrico_corradini_desc: "The president of the association, who tells the country it is a proletarian nation and that emigration is a defeat. He wants the men who sail for the plate to sail for a colony instead."
 ITA_giulio_douhet_theorist: "Giulio Douhet"
 ITA_giulio_douhet_theorist_desc: "An artillery officer who has decided that the next war will be settled above the trenches and writes about nothing else. The staff calls him a nuisance and reads every page."
 ITA_maurizio_moris_air_chief: "Maurizio Mario Moris"
 ITA_maurizio_moris_air_chief_desc: "The engineer officer who built the first shed at the aerodrome outside Rome and put the army into the air. Every Italian pilot has passed through a school he founded."
 ITADNC_g_the_neutral_state: "The Neutral State"
 ITADNC_g_the_neutral_state_desc: "The Cassation has struck down the decrees, the strikes are running ahead of the prefects and no majority will sit through a whole session. We shall ask the Crown for a ministry of the constitutional Left, and let the State take no side in a quarrel between masters and men."
 ITADNC_g_the_prefects_instructed: "The Prefects Instructed"
 ITADNC_g_the_prefects_instructed_desc: "The public force was sent into every labour dispute of the last reign and settled none of them. We shall instruct the prefects that the State does not take sides in a strike, and find out which of them obey."
 ITADNC_g_the_commissariat_of_emigration: "The Commissariat of Emigration"
 ITADNC_g_the_commissariat_of_emigration_desc: "Our people leave by the shipload and no office of the Kingdom counts them, feeds them or meets them on the far quay. We shall raise a Commissariat of Emigration, and ask the American republic for the indemnity it owes us and a consul on its landing stage."
 ITADNC_g_the_prinetti_decree: "The Prinetti Decree"
 ITADNC_g_the_prinetti_decree_desc: "The subsidised passage to the coffee estates has been paid for in unpaid contracts and buried men. We shall forbid the subsidised passage, and tell the government of the estates what it must accept before it sees our labour again."
 ITADNC_g_the_divorce_bill: "The Divorce Bill"
 ITADNC_g_the_divorce_bill_desc: "The bill for civil divorce is on the order paper and the parish committees are burying the Chamber under petitions against it. We shall put the bill down and let the Vatican say plainly what its silence is worth."
 ITADNC_g_the_labour_office: "The Labour Office"
 ITADNC_g_the_labour_office_desc: "Women and children work the night shift in the spinning mills and no inspector of the Kingdom has the right to walk through the gate. We shall carry the labour bill and open the Labour Office, whatever the Senate makes of it."
 ITADNC_g_the_hand_offered: "The Hand Offered"
 ITADNC_g_the_hand_offered_desc: "The old President of the Council is dying and the reformist socialists carry more votes in the lobby than any group we can buy. We shall offer their leader a portfolio and let his party answer for him."
 ITADNC_g_the_convention_with_paris: "The Convention with Paris"
 ITADNC_g_the_convention_with_paris_desc: "Our labourers cross the mountains by the hundred thousand and come home with no pension, no insurance and no standing before a foreign court. We shall ask the French republic for a labour convention and an arbitration treaty, and receive its President if it signs."
 ITADNC_g_the_law_for_naples: "The Law for Naples"
 ITADNC_g_the_law_for_naples_desc: "The southern provinces send us deputies who will vote for anything and cities that have neither clean water nor work. We shall carry a special law for the South, and let the southern deputies fix its terms."
 ITADNC_g_the_general_strike: "Buggerru and the Six Days"
 ITADNC_g_the_general_strike_desc: "Troops have shot miners in the pits of the island and the chambers of labour are meeting to decide whether the country comes out. We shall let the strike committee decide, and answer the strike as it comes."
 ITADNC_g_the_sacristies: "The Sacristies Are Opened"
 ITADNC_g_the_sacristies_desc: "The ban forbids the faithful to vote, and where a socialist can carry the seat the bishops have begun to ask whether it still binds. We shall let the Vatican decide which sacristies open, and take the seats it sends us."
 ITADNC_g_the_lodge_and_the_bloc: "The Lodge and the Bloc"
 ITADNC_g_the_lodge_and_the_bloc_desc: "The radicals, the republicans and the lodges have taken the Capitol and hold the capital against the ministry. We shall offer them a place in the majority, and hear what they mean to charge for it."
 ITADNC_g_the_dissolution: "The Dissolution"
 ITADNC_g_the_dissolution_desc: "The Chamber was elected before the strike and no longer answers for the country that made it. We shall dissolve it, send the circular down to the prefects, and take what the country returns."
 ITADNC_g_the_state_railways: "The Railways of the State"
 ITADNC_g_the_state_railways_desc: "The companies have run the lines into the ground and their men have struck twice in a season. We shall buy the railways for the State and make their servants civil servants, who may not strike."
 ITA_g_tt_the_prefects_are_open: "The decisions of the Prefects are open."
 ITA_g_tt_the_emigration_office_is_open: "The decisions of Emigration are open, and the indemnity may be asked for a second time."
 ITA_g_tt_the_church_is_open: "The decisions of the Church are open."
 ITA_g_tt_the_south_is_open: "The decisions of the South are open."
 ITA_g_tt_the_chamber_is_open: "The decisions of the Chamber are open."
 ITA_g_tt_the_chamber_may_be_dissolved: "The next dissolution of the Chamber will cost the ministry nothing."
 ITA_g_tt_the_sacristy_list: "The Sacristy List may be drawn up if the Church answers for the ballot."
 ITA_g_tt_nathan_is_available: "The mayor of the Capitol may serve the ministry as an adviser, if the Capitol says yes."
 ITA_g_tt_the_remittance_office_is_cheap: "The Remittance Office will open for half of what it would have cost."
 ITA_g_tt_the_boards_sit_free: "The Boards of Conciliation will sit once without charge."
 ITA_g_tt_the_passage_is_watched: "Our consuls inspect the estates and the wages are paid in coin."
 ITA_g_tt_the_wine_duties_fall: "The duties on wine fall on both sides of the mountains."
 ITA_g_tt_the_vatican_protests: "The Vatican protests at the reception of a foreign head of state in the palace of the Popes."
 ITA_v_tt_the_file_comes_round: "The file is left with the Porte and the consulates are told to ask again when the season changes."
 ITA_g_tt_the_protest_is_private: "The protest is made in a letter that nobody outside the Curia will read, and the private channel stays open."
 ita_dnc.1934.t: "The Vatican Reads the Visit"
 ita_dnc.1934.d: "A foreign head of state has been received in the palace that was taken from the Popes, and the Secretariat of State has been asked what the Holy See intends to say about it. The Curia is divided between the men who want the insult answered from the balcony and the men who want the ministry kept talking.\n\nThe answer will be given to us before it is given to anyone else."
 ita_dnc.1934.a: "Protest publicly. The whole Church will hear it."
 ita_dnc.1934.b: "Protest in a letter, and keep the channel open."
 ITA_g_tt_the_visit_is_postponed: "The visit is postponed and the convention lapses."
 ITA_g_tt_the_corn_duty_is_kept: "The duty on foreign corn is kept."
 ITA_g_tt_the_island_is_ungoverned: "The province is out of the prefect's hands for a year."
 ITA_g_tt_the_catholic_vote_returns: "Where the sacristies open, the returns come back to the ministry."
 ITA_g_tt_the_railway_law_passes: "The railway law passes and the lines pass to the State."
 ITA_g_the_strike_threat: "Italy on general strike"
 ita_dnc.1900.t: "The Quirinal Is Asked"
 ita_dnc.1900.d: "The King must name a President of the Council, and the palace has three names on its table: the old senator who will offend nobody, the Left that can carry a labour bill, and the Right that will govern with the police. The Chamber will sit for whichever of them the Crown sends for. What the palace settles now settles the whole reign."
 ita_dnc.1900.a: "Zanardelli to the Presidency, Giolitti to the Interior."
 ita_dnc.1900.b: "Saracco first, and a ministry of transition."
 ita_dnc.1900.c: "Send for Sonnino."
 ita_dnc.1901.t: "The Left Is Called At Last"
 ita_dnc.1901.d: "The transition has run its course and the palace has no other bench to try. The Left is sent for, and the Interior goes with the Presidency."
 ita_dnc.1901.a: "Then let them form it."
 ita_dnc.1904.t: "The Prefects Read the Circular"
 ita_dnc.1904.d: "The circular tells every prefect that troops are not to be used to settle a wage. Several have written back to ask what they are to do when a mill gate is shut and a crowd is standing in front of it. The corps will answer the circular before the strikers do."
 ita_dnc.1904.a: "The corps obeys: the troops stay in barracks."
 ita_dnc.1904.b: "The prefecture of the great port asks for instructions."
 ita_dnc.1905.t: "Instructions Are Asked For"
 ita_dnc.1905.d: "The prefect has a crowd on the quays, a chamber of labour that will not disperse and a garrison waiting for a written order. He wants that order tonight and he wants it signed. Whatever we send him will be read aloud in the Chamber within the week."
 ita_dnc.1905.a: "Send him the battalions he asks for."
 ita_dnc.1905.b: "Order the troops back, and note that he went past the circular."
 ita_dnc.1905.c: "Send him a board of conciliation instead."
 ita_dnc.1907.t: "Italy Lets Them Strike"
 ita_dnc.1907.d: "The Italian ministry has told its prefects to keep the army out of labour disputes, and the number of strikes has trebled in a season. Our consuls report mills standing idle from the lakes to the sea. A neighbour who will not police his own streets is a neighbour worth measuring again."
 ita_dnc.1907.a: "Note the weakness, and lower our estimate of them."
 ita_dnc.1907.b: "Let the Chief of Staff review the plans against them."
 ita_dnc.1907.c: "It is their own affair."
 ita_dnc.1908.t: "Rome Asks for an Indemnity and a Consul on the Quay"
 ita_dnc.1908.d: "The Italian ambassador asks payment for the men taken out of a parish jail and hanged, and something more: an Italian consul standing on the landing stage when the emigrant ships come in. The first is a matter for Congress. The second is a matter for the state that owns the jail."
 ita_dnc.1908.a: "Pay, and let their consul stand on the quay."
 ita_dnc.1908.b: "The lynching is a matter for Louisiana."
 ita_dnc.1909.t: "The Consuls Are on the Quay"
 ita_dnc.1909.d: "The indemnity is voted and our consuls meet the ships now, with a doctor and a list. The Commissariat has a register of every man who leaves and a claim upon the line that carries him."
 ita_dnc.1909.a: "Then the emigration is governed."
 ita_dnc.1910.t: "The Office Sails Alone"
 ita_dnc.1910.d: "There will be no indemnity and no consul on the far quay. The Commissariat opens all the same, counts the departures, and can do nothing at the other end. The word goes round the villages that the Kingdom collects their names and nothing else."
 ita_dnc.1910.a: "We count them, and that is all we do."
 ita_dnc.1912.t: "Rome Closes the Subsidised Passage"
 ita_dnc.1912.d: "The Italian government has forbidden the subsidised passage to our coffee estates and will lift the ban on two conditions: consular inspection of the plantations, and wages paid in coin instead of the estate ledger. The planters of the interior will hear of neither. Without the ban lifted the estates lose the only labour that will take the work."
 ita_dnc.1912.a: "Accept the inspection, and pay in coin."
 ita_dnc.1912.b: "The estates are our own affair; let the ban stand."
 ita_dnc.1913.t: "The Passage Is Opened Again"
 ita_dnc.1913.d: "The estates have taken our inspectors and our currency, and the ships may carry subsidised passengers again. Our consuls walk the plantations with a register in hand."
 ita_dnc.1913.a: "Then the passage is watched."
 ita_dnc.1914.t: "The Passage Stays Shut"
 ita_dnc.1914.d: "The estates will not have our inspectors, and the decree stands. The lines that carried our labour across the ocean must find another flag or another shore."
 ita_dnc.1914.a: "Then let them look elsewhere for hands."
 ita_dnc.1915.t: "The Ships Turn to the Plate"
 ita_dnc.1915.d: "The ban on the coffee estates has left a whole season of emigrant traffic without a destination, and the shipping lines are asking whether our quays are open. Our own interior wants hands on the wheat lands. The Italians would arrive by the tens of thousands and stay."
 ita_dnc.1915.a: "Open the quays, and take the harvest hands."
 ita_dnc.1915.b: "We have labour enough."
 ita_dnc.1916.t: "The Vatican Reads the Divorce Bill"
 ita_dnc.1916.d: "The bill would let a marriage be dissolved by a court of the Kingdom, and the congress committees have gathered petitions in every parish against it. The Vatican can bury the bill under those petitions, let it pass and take the quarrel to the country, or sell its silence for something it has wanted far longer than it has feared divorce."
 ita_dnc.1916.a: "The committees petition, and the bill is withdrawn."
 ita_dnc.1916.b: "Let it pass on the votes of the Extreme Left."
 ita_dnc.1916.c: "Silence, against the catechism in the schools."
 ita_dnc.1917.t: "The Catechism Is Offered"
 ita_dnc.1917.d: "The price of the withdrawal is the catechism taught in the elementary schools of the Kingdom, at the Kingdom's expense. The lodges will call it the surrender of the lay State. The bishops call it the least they could have asked."
 ita_dnc.1917.a: "Grant the catechism."
 ita_dnc.1917.b: "Withdraw the bill and grant nothing."
 ita_dnc.1919.t: "The Divorce Law at Rome"
 ita_dnc.1919.d: "The Italian Chamber has voted civil divorce against the whole weight of its parishes. Our own ministry has been at war with its clergy for a year and is short of company. A word of welcome costs a stamp and will be read in every presbytery between here and the Alps."
 ita_dnc.1919.a: "Salute a sister who has done what we did."
 ita_dnc.1919.b: "Say nothing; we have quarrels enough."
 ita_dnc.1920.t: "Montecitorio Votes the Labour Bill"
 ita_dnc.1920.d: "The bill limits the hours of women and children, forbids night work under a certain age and puts an inspector at the mill gate. The cotton masters have petitioned the Senate, and the Right has an amendment ready that would forbid strikes in the services of the State. The Chamber will vote whatever the lobby leaves of it."
 ita_dnc.1920.a: "Vote it whole; the inspectors go into the mills."
 ita_dnc.1920.b: "The Senate empties it on the petition of the mills."
 ita_dnc.1920.c: "Take the amendment: no strike in the State services."
 ita_dnc.1923.t: "The Labour Office at Rome"
 ita_dnc.1923.d: "The Italians have set up a labour office and a superior council of labour, the first of their kind south of the mountains. Our own ministry has staked its life on the same ground. A note of interest costs nothing and buys a friend in a chamber that has few of them."
 ita_dnc.1923.a: "Send a note of interest."
 ita_dnc.1923.b: "We have our own bill to carry."
 ita_dnc.1924.t: "The Party Reads the Offer"
 ita_dnc.1924.d: "A portfolio has been offered to the leader of the reformists, and the party is meeting to tell him what to do with it. The revolutionaries say that a socialist in a royal ministry is a socialist lost. The reformists answer that a party which never sits will never govern."
 ita_dnc.1924.a: "Refuse, and support the ministry from outside."
 ita_dnc.1924.b: "Take the portfolio."
 ita_dnc.1924.c: "The congress orders him out of the lobby altogether."
 ita_dnc.1926.t: "The Duties on Wine"
 ita_dnc.1926.d: "The convention is signed and the French will talk about the commercial treaty as well. Our growers want the duty on wine cut on both sides of the mountains; our treasury lives on that duty. The offer will not be made twice."
 ita_dnc.1926.a: "Cut the duties on wine."
 ita_dnc.1926.b: "Leave the tariff where it stands."
 ita_dnc.1927.t: "A Socialist Sits in the Italian Cabinet"
 ita_dnc.1927.d: "A socialist has taken a portfolio in a royal ministry beyond the Alps, and the Italian revolutionaries are in the streets over it. Our own party of that colour has read the news aloud in the chamber. An ally whose cabinet holds such a man is an ally to be watched rather than trusted."
 ita_dnc.1927.a: "Note it, and trust them less."
 ita_dnc.1927.b: "Every court has its embarrassments."
 ita_dnc.1928.t: "Rome Asks for the Labour Convention"
 ita_dnc.1928.d: "The Italian ambassador proposes a labour convention: each state would recognise the other's insurance, pensions and accident awards, and an arbitration treaty would follow it. Nothing of the kind exists anywhere. It would also put our President on a train to the Quirinal, which is not a small thing to offer a court that still dines with the Central Powers."
 ita_dnc.1928.a: "Sign it, and let the President go."
 ita_dnc.1928.b: "Sign, and offer to widen the commercial treaty."
 ita_dnc.1928.c: "Decline, and postpone the visit."
 ita_dnc.1929.t: "The Convention Is Signed"
 ita_dnc.1929.d: "The convention is signed, the arbitration treaty with it, and the President will come. Our labourers beyond the mountains have a court to go to and a pension that follows them home. The Vatican has already let it be known what it thinks of a foreign head of state received in the palace of the Popes."
 ita_dnc.1929.a: "Let the Vatican complain."
 ita_dnc.1930.t: "The Convention Is Not Signed"
 ita_dnc.1930.d: "There will be no convention and no visit. Our labourers beyond the mountains keep whatever the foreign courts choose to give them, which is nothing. The ambassador is instructed to ask again when the ministry there has changed."
 ita_dnc.1930.a: "Then we ask again later."
 ita_dnc.1931.t: "The President at the Quirinal"
 ita_dnc.1931.d: "The President of the French Republic is to be received in the palace the Italians took from the Popes, and the Italian ministry has signed a labour convention with him. Rome is still inscribed in the alliance with us. A court cannot take a turn of the waltz with both partners and expect neither to notice."
 ita_dnc.1931.a: "Note the dance, and cool towards them."
 ita_dnc.1931.b: "An exchange of visits is not a treaty."
 ita_dnc.1931.c: "Let it be said aloud that they have danced a waltz."
 ita_dnc.1931.e: "Press Vienna to ask them what it means."
 ita_dnc.1932.t: "The Southern Deputies Fix the Terms"
 ita_dnc.1932.d: "The special law will spend more in the southern provinces than any law since the union, and every deputy south of the capital wants to say where. The ministry can let them place the works and buy a majority with roads, or send engineers of its own and keep the money honest, or pay what the agrarian bloc is asking, which is the duty on corn."
 ita_dnc.1932.a: "Let the deputies place the works."
 ita_dnc.1932.b: "Send engineers of the ministry to place them."
 ita_dnc.1932.c: "The bloc obstructs until the corn duty is kept."
 ita_dnc.1933.t: "The Duty on Corn"
 ita_dnc.1933.d: "The bloc will let the law through if the duty on foreign corn stays where it is. Bread will cost what bread costs. The landowners will vote for anything afterwards."
 ita_dnc.1933.a: "Keep the duty, and take the votes."
 ita_dnc.1933.b: "Refuse, and pass the law with the majority we have."
 ita_dnc.1936.t: "The Chambers of Labour Meet"
 ita_dnc.1936.d: "Miners have been shot in the pits of the island and the chambers of labour have called a meeting to decide whether the whole country comes out. Nothing of the kind has ever been tried here. The committee will settle it tonight, and the ministry will learn of it with everyone else."
 ita_dnc.1936.a: "The general strike is called."
 ita_dnc.1936.b: "The strike runs south and out of anyone's hands."
 ita_dnc.1936.c: "The committee draws back."
 ita_dnc.1937.t: "The Six Days Are Over"
 ita_dnc.1937.d: "The strike has run out of money, out of bread and out of patience, and the trams are moving again. What the ministry did in those days is what the country will remember of it."
 ita_dnc.1937.a: "It is over."
 ita_dnc.1939.t: "Italy on General Strike"
 ita_dnc.1939.d: "The whole peninsula has stopped: railways, ports, mills and post. The ministry has refused to send the army in and says it will let the strike exhaust itself. The Chief of Staff observes that an ally in that condition cannot move a corps to the Alps."
 ita_dnc.1939.a: "Note it, and trust them less."
 ita_dnc.1939.b: "Ask leave to profit by the moment."
 ita_dnc.1939.c: "Every state has its bad weeks."
 ita_dnc.1940.t: "The Vatican Counts the Seats"
 ita_dnc.1940.d: "The ban still forbids the faithful to vote, and in a good many districts the only man who can beat the socialist is a Catholic. The bishops have asked whether the ban may be lifted case by case. The answer will be worth more to the ministry than any prefect."
 ita_dnc.1940.a: "Let them vote where the socialist would otherwise win."
 ita_dnc.1940.b: "The ban holds, and no exception is made."
 ita_dnc.1940.c: "The catechism first, and then the sacristies."
 ita_dnc.1941.t: "The Lodge Names Its Price"
 ita_dnc.1941.d: "The bloc of radicals, republicans and lodges holds the Capitol and could hold a share of the majority instead. Its committee is meeting to decide whether to come in. Some of them want office; the rest want the anticlerical bills that office would let them carry."
 ita_dnc.1941.a: "Come in, and take a share of the majority."
 ita_dnc.1941.b: "Come in, against the anticlerical laws."
 ita_dnc.1941.c: "Stay outside and keep our hands clean."
 ita_dnc.1942.t: "The Catechism in the Schools"
 ita_dnc.1942.d: "The Vatican will open the sacristies at the next return if the catechism is taught in the elementary schools at the Kingdom's expense. The lodges will read it as the surrender of the lay State. The seats are real and the lodges are only loud."
 ita_dnc.1942.a: "Grant the catechism, and take the seats."
 ita_dnc.1942.b: "Refuse, and let the ban hold."
 ita_dnc.1943.t: "The Price of the Bloc"
 ita_dnc.1943.d: "The lodges will join the majority and their price is written out: the divorce bill back on the order paper. The Catholic seats we might have had would go with it. A majority bought this way is at least a majority that votes."
 ita_dnc.1943.a: "Pay the price, and put the bill back."
 ita_dnc.1943.b: "Refuse, and take what they will give for nothing."
 ita_dnc.1944.t: "The Country Is Asked"
 ita_dnc.1944.d: "The Chamber is dissolved, the circular has gone down to the prefects and the country has voted. The returns are coming in from the provinces, and the machine has done what the machine can do. The rest belongs to the electors."
 ita_dnc.1944.a: "The government is returned with a majority."
 ita_dnc.1944.b: "A ministry, but not a majority."
 ita_dnc.1944.c: "There is no government in this Chamber."
 ita_dnc.1945.t: "The Old Man Is Called Back"
 ita_dnc.1945.d: "The interim ministry has spent its credit and can carry nothing. The palace sends for the man who made the last majority and asks him to make another."
 ita_dnc.1945.a: "Take the Presidency again."
 ita_dnc.1948.t: "The Railwaymen Decide"
 ita_dnc.1948.d: "The lines are to be bought by the State, and the clause that makes the railwaymen civil servants takes their right to strike away with it. Their union is meeting to decide whether the clause is worth a strike. If they come out, the country stops with them."
 ita_dnc.1948.a: "The union votes to strike."
 ita_dnc.1948.b: "The union swallows the clause."
 ita_dnc.1949.t: "The Lines or the Clause"
 ita_dnc.1949.d: "The trains have stopped and the mails with them. The ministry can call the railwaymen to the colours and run the lines under military discipline, or drop the clause and buy the railways without it. Either way the law passes this session."
 ita_dnc.1949.a: "Militarise the lines and call up the men."
 ita_dnc.1949.b: "Withdraw the clause and buy the lines anyway."
 ITADNC_s_return_to_the_statuto: "Torniamo allo Statuto"
 ITADNC_s_return_to_the_statuto_desc: "The Cassation has struck down the decrees and the Chamber will not read them a second time. We must go back to the Statuto and let the ministers answer to the King who appoints them."
 ITADNC_s_the_decrees_revived: "The Decrees Revived"
 ITADNC_s_the_decrees_revived_desc: "The bill of public safety is on the order paper and the Extreme Left has taken the floor to read the Statuto aloud. We must put the bill through the Chamber, or govern without the Chamber."
 ITADNC_s_the_cassation: "The Cassation Is Asked Again"
 ITADNC_s_the_cassation_desc: "The Court of Cassation has ruled that a decree of the King is not a law of the Kingdom. We must ask the bench for a law of interpretation that says the opposite."
 ITADNC_s_the_law_of_suspects: "The Law of Suspects"
 ITADNC_s_the_law_of_suspects_desc: "The anarchists move between our ports and the mill towns abroad, and no two police forces keep the same list. We must pass the law of suspects and ask the other capitals to sign a police protocol with us."
 ITADNC_s_the_chambers_dissolved: "The Chambers of Labour Are Closed"
 ITADNC_s_the_chambers_dissolved_desc: "The Chambers of Labour have become the general staff of every strike in the Kingdom. We must dissolve them by decree and see what the leagues do about it."
 ITADNC_s_the_army_at_call: "The Army at the Prefects' Call"
 ITADNC_s_the_army_at_call_desc: "The prefects ask for battalions whenever a square fills, and no ministry has yet told them no. We must put the army at their call and let the general staff say whether it will come."
 ITADNC_s_the_guards_of_public_safety: "The Guards of Public Safety"
 ITADNC_s_the_guards_of_public_safety_desc: "The army is not a police force and the prefects have no other. We must ask the Chamber for the credits to raise a corps of guards of public safety."
 ITADNC_s_the_chamber_governed_past: "The Prorogation"
 ITADNC_s_the_chamber_governed_past_desc: "The Chamber has sat for weeks without voting a line, and the ministry cannot govern against it. We must ask the King to prorogue it and to let us govern in the interval."
 ITADNC_s_the_colleges_redrawn: "The Colleges Redrawn"
 ITADNC_s_the_colleges_redrawn_desc: "The colleges of the industrial north return the same red deputies whatever the ministry spends there. We must have the prefects redraw them and let the Council of State say whether it will register the decree."
 ITADNC_s_the_altar_and_the_throne: "The Altar and the Throne"
 ITADNC_s_the_altar_and_the_throne_desc: "The Catholic vote is forbidden the polls by the Pope and courted in private by everybody else. We must ask the Vatican to bless an understanding between the altar and the throne."
 ITADNC_s_the_lodge_is_silenced: "The Lodge Is Silenced"
 ITADNC_s_the_lodge_is_silenced_desc: "The lodges sit in the ministries, in the prefectures and in the officers' messes, and they answer to no minister of the King. We must ask the Grand Orient to close itself to the servants of the State."
 ITADNC_s_the_south_governed: "The South Governed, Not Bought"
 ITADNC_s_the_south_governed_desc: "The South is administered by whoever can deliver its seats, and the money we send there is spent on the men who deliver them. We must govern it with royal commissioners instead of buying it."
 ITADNC_s_the_state_of_siege: "The State of Siege by Telegram"
 ITADNC_s_the_state_of_siege_desc: "The general strike has reached the tramways and the arsenals, and the command at Milan asks by telegram whether it may proclaim a state of siege. We must give the command its orders and let the King countersign them."
 ITADNC_s_the_king_at_vienna: "The King at Vienna"
 ITADNC_s_the_king_at_vienna_desc: "No Italian king has been received at the Austrian court since our grandfather went there, and the Emperor cannot return the visit while the Pope calls himself a prisoner. We must ask to be received, and let the other court decide."
 ita_dnc.1700.t: "The Quirinal Is Asked to Govern"
 ita_dnc.1700.d: "The ministry has been beaten at the polls and beaten in the Chamber, and it has asked the King whether it should go. The article that says the ministers of the King answer to the King, and not to Montecitorio, is on the desk at the Quirinal.\n\nThe Court may keep the general and call the author of that article to his side, put a civil face on the same programme, or let the ministry go and be done with it."
 ita_dnc.1700.a: "Keep the general, and call Sonnino to his side."
 ita_dnc.1700.b: "A civil face first, and the same programme."
 ita_dnc.1700.c: "Let the ministry go."
 ita_dnc.1701.t: "The Transition Ends"
 ita_dnc.1701.d: "The transitional ministry has done what transitional ministries do, which is to last until something else is ready. The King now sends for the men who wrote the programme.\n\nThe Chamber is told what it will be given, and is not asked what it would like."
 ita_dnc.1701.a: "The King's own ministry takes office."
 ita_dnc.1704.t: "The Bill of Public Safety"
 ita_dnc.1704.d: "The decrees the Court struck down are back before the Chamber as a bill, article by article. The Extreme Left has announced that it will read the Statuto aloud from the tribune for as long as its voices hold.\n\nThe Chamber can sit out the obstruction, vote the bill as it stands, or watch the Centre go over to the men at the tribune."
 ita_dnc.1704.a: "Sit through the obstruction."
 ita_dnc.1704.b: "Vote the bill as it stands."
 ita_dnc.1704.c: "The Centre goes over to the obstruction."
 ita_dnc.1705.t: "Three Weeks of Obstruction"
 ita_dnc.1705.d: "For three weeks nothing has been voted, and the shorthand writers have taken down the whole Statuto twice over. The ministry must either move the closure under the new standing orders or stop asking the Chamber at all.\n\nThe closure will drive the Extreme Left out of the House. The other road is to send the House home and put the decrees out over the King's signature."
 ita_dnc.1705.a: "Move the closure."
 ita_dnc.1705.b: "Prorogue, and decree."
 ita_dnc.1707.t: "A Prussian Conflict at Rome"
 ita_dnc.1707.d: "Our ambassador reports that the Italian ministry is governing against its own Chamber and citing the years when Prussia did the same. The parallel is being drawn in the Italian press, and it is not being drawn against us.\n\nThe Chancellor can say that a government which governs has our sympathy, or he can say nothing at all."
 ita_dnc.1707.a: "Say that we understand them."
 ita_dnc.1707.b: "Say nothing."
 ita_dnc.1708.t: "The Court Is Asked to Read Again"
 ita_dnc.1708.d: "The first president has been shown a bill of interpretation which would give a decree of the King the force of law until the Chamber disposes of it. He has been told, courteously, what the ministry expects of the bench.\n\nThe Court can accept the reading, or hold to the judgment it has already given."
 ita_dnc.1708.a: "The Court accepts the interpretation."
 ita_dnc.1708.b: "The Court holds to its judgment."
 ita_dnc.1710.t: "The Bench Holds"
 ita_dnc.1710.d: "The first president answers that a decree is not a law and that no bill of interpretation will make it one. The judgment stands, and the newspapers have it by the evening.\n\nWe can rename the bench, which is within the King's gift, or take the decrees back to the Chamber and pay for them there."
 ita_dnc.1710.a: "Rename the bench."
 ita_dnc.1710.b: "Take the decrees to the Chamber."
 ita_dnc.1712.t: "The Law of Suspects"
 ita_dnc.1712.d: "The bill would send men held to be dangerous to the islands without a trial, on the word of the prefect and the assent of a magistrate. The magistracy has asked to be heard, and has been heard.\n\nThe Chamber can vote the law and let the lists go out to the other capitals, or answer that a new reign should open with an amnesty."
 ita_dnc.1712.a: "Vote the law, and send the lists abroad."
 ita_dnc.1712.b: "An amnesty instead."
 ita_dnc.1713.t: "Rome Proposes the Police Protocol"
 ita_dnc.1713.d: "The Italian ambassador proposes that our police and theirs exchange lists of anarchists, photographs and sailings, and that each expel what the other names. The draft is the one our own ministry drew up and could not get the western courts to sign.\n\nRome offers to sign it first. The question is whether an Italian ministry can be trusted with our lists, and whether Berlin should be brought in before we answer."
 ita_dnc.1713.a: "Sign with Rome."
 ita_dnc.1713.b: "Berlin should sign before we do."
 ita_dnc.1714.t: "Rome Asks Bern to Expel the Anarchists"
 ita_dnc.1714.d: "The Italian legation hands us a list of names, all of them living quietly in our cantons, and asks that they be put over the frontier. Half of them are printers and the rest are watchmakers.\n\nThe Confederation has given asylum to every kind of exile for a very long time, and has been paid in reputation for it."
 ita_dnc.1714.a: "Expel the men on the list."
 ita_dnc.1714.b: "Asylum is not negotiable."
 ita_dnc.1715.t: "Rome Asks About Paterson"
 ita_dnc.1715.d: "The Italian ambassador observes that the man who fired at their King was a silk weaver from one of our mill towns, and that the money for his passage was raised there. He asks that the colony be watched and its clubs reported on.\n\nThe federal government keeps no police of its own for such work, and the state has not asked for help."
 ita_dnc.1715.a: "Have the colony watched."
 ita_dnc.1715.b: "The federal law does not allow it."
 ita_dnc.1796.t: "The Protocol Needs Berlin"
 ita_dnc.1796.d: "Petersburg will not sign a police convention with Rome unless we sign it too, and has said so through their ambassador. The draft binds every signatory to expel what the others name.\n\nThe Chancellor can put our name to it and let the eastern courts have their convention, or leave Rome to be disappointed."
 ita_dnc.1796.a: "Berlin signs as well."
 ita_dnc.1796.b: "Let them settle it between themselves."
 ita_dnc.1716.t: "The Leagues Answer the Decree"
 ita_dnc.1716.d: "The decree closes every Chamber of Labour in the Kingdom, and the seals went on the doors before the newspapers had the text. The federations have met in the one hall that is still open.\n\nThey can bring the port out, take the leagues underground, or send a deputation to the King with a petition."
 ita_dnc.1716.a: "The dockers come out."
 ita_dnc.1716.b: "The leagues go underground."
 ita_dnc.1716.c: "The reformists petition the King."
 ita_dnc.1717.t: "The Port That Stopped"
 ita_dnc.1717.d: "Nothing has moved on the quays for four days and the coal for the northern works is standing in the roads. The prefect who signed the seals asks whether he is supported.\n\nWe can stand behind him and let the port stay shut, or recall him and let the hall reopen."
 ita_dnc.1717.a: "The prefect is sustained."
 ita_dnc.1717.b: "The prefect is recalled."
 ita_dnc.1719.t: "Rome Closes the Chambers of Labour"
 ita_dnc.1719.d: "The Italian government has dissolved the labour chambers of the whole peninsula in a single decree. Our consuls report the ports quiet and the garrisons out.\n\nA neighbour who keeps order is worth more to us than one who does not. We might also ask her to sign the police convention while she is in the mood for it."
 ita_dnc.1719.a: "Note that they can keep order."
 ita_dnc.1719.b: "Ask them to sign the police convention."
 ita_dnc.1720.t: "The Staff Is Asked for the Garrisons"
 ita_dnc.1720.d: "The ministry asks the chief of staff to place the garrisons at the disposal of the prefects, so that a telegram brings out a battalion. The general remembers what the guns did at Milan and what was said about it afterwards.\n\nHe can agree, ask that the Carabinieri be doubled instead, or answer that the army is not a police force."
 ita_dnc.1720.a: "The garrisons are at the prefects' call."
 ita_dnc.1720.b: "Double the Carabinieri instead."
 ita_dnc.1720.c: "The army is not a police force."
 ita_dnc.1721.t: "The Credits of the Interior"
 ita_dnc.1721.d: "The estimate asks for a corps of guards of public safety, paid by the State and answering to the prefects, so that the troops need not be called out at all. The sum is not small and the Left calls it an army in plain clothes.\n\nThe Chamber can vote the credits, vote half of them, or throw them out and leave the prefects with the garrisons."
 ita_dnc.1721.a: "Vote the credits."
 ita_dnc.1721.b: "Vote half of them."
 ita_dnc.1721.c: "Throw them out."
 ita_dnc.1724.t: "The Quirinal Is Asked to Prorogue"
 ita_dnc.1724.d: "The ministry asks the King to prorogue the Chamber without naming the day of its return, and cites the article of the Statuto that gives him the power. The Court is reminded that a Prussian king once governed for years without a budget and kept his crown.\n\nThe King can prorogue without a term, prorogue for a single session, or refuse and leave the ministry to answer to the House."
 ita_dnc.1724.a: "Prorogue without naming the day."
 ita_dnc.1724.b: "A single session only."
 ita_dnc.1724.c: "The King refuses."
 ita_dnc.1727.t: "The Chamber at Rome Is Sent Home"
 ita_dnc.1727.d: "The Italian Chamber has been prorogued without a day of return and the ministry is governing by decree. Their King has signed everything that was put in front of him.\n\nWe can say that we approve of a government which governs, or leave the comment to the newspapers."
 ita_dnc.1727.a: "Say that we approve."
 ita_dnc.1727.b: "The monarchy has found its footing."
 ita_dnc.1727.c: "Leave it to the newspapers."
 ita_dnc.1728.t: "The Colleges Are Redrawn"
 ita_dnc.1728.d: "The plan takes the red wards of the northern cities and divides them among the quiet country colleges around them. The prefects would draw the lines and the Council of State would have to register the decree.\n\nThe prefects can redraw the whole country, redraw only the seats we might lose, or the Council of State can refuse to register anything of the kind."
 ita_dnc.1728.a: "Redraw the whole country."
 ita_dnc.1728.b: "Only where the seat is doubtful."
 ita_dnc.1728.c: "The Council of State refuses."
 ita_dnc.1732.t: "The Altar Is Asked"
 ita_dnc.1732.d: "A quiet approach has been made to the Vatican: let the ban on the polls be lifted for lists the bishops can accept, and the Kingdom will find the Church in its schools and its charities again. The answer will come as a silence or as a permission.\n\nThe Holy See can bless the understanding, reopen the Roman question and name its price, or refuse the whole of it."
 ita_dnc.1732.a: "Bless the understanding."
 ita_dnc.1732.b: "Reopen the Roman question."
 ita_dnc.1732.c: "Refuse."
 ita_dnc.1734.t: "The Leonine City"
 ita_dnc.1734.d: "The Curia answers that the ban may go when the Pope is no longer a prisoner, and names the quarter beyond the river that he would hold as his own. The dotation would be ours to pay and the guarantee ours to give.\n\nWe can refuse and leave the ban where it is, or make the Pope a sovereign of a few streets and take the Catholic vote with him."
 ita_dnc.1734.a: "Refuse."
 ita_dnc.1734.b: "Give him the Leonine City."
 ita_dnc.1733.t: "The Grand Orient Answers"
 ita_dnc.1733.d: "The Grand Master has been told that the King's servants may serve the King or the lodge and not both, and that the ministry prefers the first. The military lodges are named in the letter.\n\nThe Order can close itself to officials, let its officers petition against the ministry, or take the whole of its strength over to the Bloc."
 ita_dnc.1733.a: "The lodges close to officials."
 ita_dnc.1733.b: "The officers petition."
 ita_dnc.1733.c: "The lodges go to the Bloc."
 ita_dnc.1736.t: "The Notables of the South"
 ita_dnc.1736.d: "The programme would put royal commissioners over the southern communes, lease the great estates in perpetuity to the men who work them, and open agrarian credit that does not pass through the deputy. The notables have come up to hear it read.\n\nThey can accept the commissioners, obstruct the whole of it, or accept in exchange for something they have wanted longer."
 ita_dnc.1736.a: "Accept the royal commissioners."
 ita_dnc.1736.b: "Obstruct."
 ita_dnc.1736.c: "Accept, for a price."
 ita_dnc.1737.t: "The Duty on Grain"
 ita_dnc.1737.d: "The price the notables name is the duty on foreign grain, kept where it stands and written into the special laws of the South. It is the landlords who gain by it and the bread of the towns that pays for it.\n\nWe can give way and have the South administered, or refuse and have the South against us."
 ita_dnc.1737.a: "Give way on the duty."
 ita_dnc.1737.b: "Refuse."
 ita_dnc.1740.t: "The Command Asks for Orders"
 ita_dnc.1740.d: "The strike has closed the tramways, the gas and the arsenal, and the corps command asks by telegram whether it may proclaim a state of siege and hold the city under military law. The King must countersign whatever answer goes back.\n\nThe command can be told to clear the squares, told to hold on without the siege, or the general may answer that he will not fire on the crowd."
 ita_dnc.1740.a: "Proclaim the siege and clear the squares."
 ita_dnc.1740.b: "Hold on without the siege."
 ita_dnc.1740.c: "The general will not fire."
 ita_dnc.1741.t: "The General Who Would Not Fire"
 ita_dnc.1741.d: "The corps commander has put his refusal in writing and asked to be relieved rather than to obey conditionally. The dispatch is already in the hands of two newspapers.\n\nWe can take him at his word and relieve him, or keep him and accept that the army will decide for itself when it comes out."
 ita_dnc.1741.a: "Relieve him."
 ita_dnc.1741.b: "Keep him."
 ita_dnc.1743.t: "Rome Keeps Order"
 ita_dnc.1743.d: "The Italians have put three of their provinces under military law and their troops have cleared the squares. The dispatches say that order was restored in a day.\n\nThe chief of staff would like the plans against Italy taken out and read again, on the ground that an army used in the streets is an army that can be counted."
 ita_dnc.1743.a: "A neighbour who keeps order."
 ita_dnc.1743.b: "Take the plans out and read them again."
 ita_dnc.1744.t: "Rome Asks to Be Received"
 ita_dnc.1744.d: "The Italian ambassador asks, without quite asking, whether their King would be received at our court, and suggests a city that is neither capital. The last such visit was made by his grandfather and has never been returned, because the Emperor cannot go to a city where the Pope calls himself a prisoner.\n\nWe can invite him and let the alliance be seen, or answer that the Roman question stands where it stood."
 ita_dnc.1744.a: "Invite the King."
 ita_dnc.1744.b: "The Roman question stands."
 ita_dnc.1745.t: "The Journey Is Not Made"
 ita_dnc.1745.d: "There is no court left to receive us and no invitation to be had. The preparations are put away and the newspapers are given nothing to print.\n\nThe Court is left with the impression that it asked for something and was not answered."
 ita_dnc.1745.a: "Put the preparations away."
 ita_dnc.1746.t: "The Vatican Reads the Refusal"
 ita_dnc.1746.d: "The refusal is known in the Borgo before it is known in the ministry, and the reason given for it is the Pope himself. The Curia is pleased to be the obstacle and says so in its own newspaper.\n\nIt may be content to have shown its weight, or it may offer to remove the obstacle in exchange for a conversation."
 ita_dnc.1746.a: "Let them enjoy it."
 ita_dnc.1746.b: "Offer to carry the word."
 ita_dnc.1747.t: "The Two Kings"
 ita_dnc.1747.d: "The two courts are arranging a meeting and neither has thought to mention it to us. Our ambassador reports that the alliance is being celebrated in a city we have not been invited to.\n\nThe Emperor can invite himself and make the party three, or send a telegram and stay at home."
 ita_dnc.1747.a: "Invite ourselves."
 ita_dnc.1747.b: "Send a telegram."
 ITA_s_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_s_tt_the_crown: "The King's hold on his ministers: §Y[?ITA_crown|0]§!"
 ITA_s_tt_the_programme_waits: "The programme waits for a new reign, and nothing more of it can be taken until the Crown stands behind it."
 ITA_s_tt_the_royal_decree_is_unlocked: "The Royal Decree may now be laid before the country from among the decisions of the Crown."
 ITA_s_tt_the_cassation_must_answer_first: "Nothing else will pass this Chamber until the Court has been asked again."
 ITA_s_tt_berlin_reads_the_conflict: "Berlin has read our constitutional conflict and has drawn its own parallel with it."
 ITA_s_tt_berlin_says_nothing: "Berlin says nothing, which is neither a blessing nor a warning."
 ITA_s_tt_the_islands_are_opened: "The Anarchists Are Sent to the Islands becomes available among the decisions of the Piazza."
 ITA_s_tt_petersburg_wants_berlin_first: "Petersburg will not put its name to the protocol until Berlin has put down its own."
 ITA_s_tt_the_colony_is_watched: "The colony abroad is watched and its clubs are reported on."
 ITA_s_tt_the_federal_law_does_not_allow_it: "We are told that the federal law does not allow it, and there the matter rests."
 ITA_s_tt_berlin_declines_the_protocol: "Berlin declines the protocol, and Petersburg will not move without it."
 ITA_s_tt_the_arma_is_doubled: "The Arma is doubled in place of the garrisons, and the squares are policed by gendarmes."
 ITA_s_tt_the_questore_is_free: "The Questore Is Replaced costs the ministry nothing once the guards hold the streets."
 ITA_s_tt_one_session_only: "The Chamber is prorogued for a single session and will have to be faced again."
 ITA_s_tt_the_estimates_by_decree: "The Estimates by Decree becomes available among the decisions of the Ministry once the King's ministry holds."
 ITA_s_tt_the_powers_say_nothing: "The powers say nothing, and their newspapers say it for them."
 ITA_s_tt_the_lists_are_made: "The new lists are drawn in every province and will be read at the next returns."
 ITA_s_meda_in_the_ministry: "The Catholic Deputy in the Ministry"
 ITA_s_meda_in_the_ministry_desc: "The Electoral Union names him and the bishops do not disown him, which is the whole of his qualification and quite enough of it."
 ITA_s_tt_the_ban_is_not_lifted: "The ban on the polls is not lifted, and the Catholic vote stays where it was."
 ITA_s_tt_the_offer_is_refused: "The quarter beyond the river is refused, and the Roman question closes again."
 ITA_s_tt_the_royal_commissioner: "The Royal Commissioner becomes available among the decisions of the Crown once the South is administered."
 ITA_s_tt_the_plans_are_reviewed: "The plans against us are taken out and read again at the other staff."
 ITA_s_tt_berlin_stays_at_home: "Berlin stays at home and sends a telegram."
 ITA_s_threat_torniamo_allo_statuto: "Torniamo allo Statuto"
 ITA_s_threat_the_chamber_is_sent_home: "The Chamber Is Sent Home"
 ITA_s_salandra_keeper_of_the_seals: "Keeper of the Seals"
 ITA_s_salandra_keeper_of_the_seals_desc: "The bill of interpretation was drafted in his room, and the bench will hear from him before it hears from anyone else."
 ITA_s_pelloux_at_the_interior: "The General at the Interior"
 ITA_s_pelloux_at_the_interior_desc: "He has held a ministry and he has held a corps, and he has never thought the two so very different."
 ITADNC_r_the_hand_offered: "The Hand Offered to Turati"
 ITADNC_r_the_hand_offered_desc: "The Extreme Left holds the votes this ministry needs and its leader has already been offered a portfolio in private. We must offer Turati the Ministry of Labour in public, and promise him that the Interior will not send troops into a strike."
 ITADNC_r_the_chambers_enter_the_state: "The Chambers Enter the State"
 ITADNC_r_the_chambers_enter_the_state_desc: "The Chambers of Labour settle wages that no statute recognises, and the industrialists tear up every award they make. We must give the collective contract the force of law and seat the boards of arbitration inside the State."
 ITADNC_r_the_illiterate_voter: "The Illiterate Voter"
 ITADNC_r_the_illiterate_voter_desc: "Most men of this Kingdom pay the salt tax and carry a rifle without ever seeing a ballot, because they cannot read one. We must lay the widened register before the Chamber and the Senate and ask for the vote of every man."
 ITADNC_r_the_leagues_are_lawful: "The Leagues Are Lawful"
 ITADNC_r_the_leagues_are_lawful_desc: "The leagues of resistance bargain for half the countryside and stand outside the law while they do it. We must trade the widened register for a statute that makes the leagues lawful bodies."
 ITADNC_r_the_answer_to_the_parish: "The Answer to the Parish"
 ITADNC_r_the_answer_to_the_parish_desc: "A socialist sits in the ministry, and every parish has already been told from the Borgo what to think of it. We must ask the Vatican plainly what it means to do about a ministry it has condemned."
 ITADNC_r_the_eight_hours: "The Eight Hours in the State Yards"
 ITADNC_r_the_eight_hours_desc: "The State is the largest employer in the Kingdom and its arsenals work whatever hours their directors please. We must impose the eight hours where we are the master, and let the admiralty answer for the yards."
 ITADNC_r_the_sunday_rest: "The Sunday Rest"
 ITADNC_r_the_sunday_rest_desc: "The weekly rest is on the statute book and the mills of the north keep their gates open on the seventh day all the same. We must send the inspectors out and make the industrialists answer for every shift they run."
 ITADNC_r_the_convention_with_paris: "Paris Is Asked for the Convention"
 ITADNC_r_the_convention_with_paris_desc: "Our emigrants cut French coal under no treaty at all, and the arbitration convention lies ready for signature. We must invite the President to the Quirinal and ask for a labour convention to be signed beside it."
 ITADNC_r_berlin_social_laws: "Berlin Is Asked for the Social Laws"
 ITADNC_r_berlin_social_laws_desc: "The insurance laws of the German Empire are quoted in every debate our reformists open, and our own workmen there are covered by nothing at all. We must send a study mission and ask for a convention that carries the insurance across the frontier."
 ITADNC_r_the_pension: "The Pension That Is Not Charity"
 ITADNC_r_the_pension_desc: "The national fund is voluntary, and the workman who joins it is treated as a case for the poor board. We must ask the Chamber for an insurance that every employer pays and every workman claims by right."
 ITADNC_r_the_king_is_asked: "The King Is Asked"
 ITADNC_r_the_king_is_asked_desc: "The bills of the Bloc are drafted and not one of them is law until the Crown puts its name to them. We must lay them before the King together and learn whether he will sign."
 ITADNC_r_the_army_bill: "The Army the Reformists Will Pay For"
 ITADNC_r_the_army_bill_desc: "The reformists will vote the estimates for a service of two years with a militia establishment behind it, and for nothing else. We must lay the shortened service before the general staff and let them answer for the frontier."
 ITADNC_r_the_general_strike: "The Strike That Is Counted"
 ITADNC_r_the_general_strike_desc: "The syndicalists mean to call a general strike against the reformist line and against the ministry that carries it. We must put the question to the Confederation of Labour and let it say whether the strike is called at all."
 ITADNC_r_the_hague_arbitration: "The Hague Is Asked About the Trentino"
 ITADNC_r_the_hague_arbitration_desc: "We have signed treaties of arbitration with powers we have no quarrel with, and never with the one we have. We must ask Vienna to put the diet of the Trentino and the Italian faculty to an arbitral court."
 ITADNC_r_the_colony: "The Colony That Pays Nothing"
 ITADNC_r_the_colony_desc: "The colony beyond the Red Sea costs the treasury a garrison every year and returns nothing that any deputy can name. We must put the colonial credits to a vote and govern what we hold with civilians."
 ITADNC_r_the_banco_di_roma: "The Bank Is Asked to Wait"
 ITADNC_r_the_banco_di_roma_desc: "The Banco di Roma has bought quays, a mill and a great deal of land at Tripoli, and now asks the ministry to stand behind them. We must call the bank in and tell it that this ministry will not go to war for its ledger."
 ita_dnc.1800.t: "The Quirinal Is Asked"
 ita_dnc.1800.d: "The ministry proposes to bring the leader of the reformist socialists into the cabinet with the Ministry of Labour, and to guarantee him that the Interior will keep the troops out of the squares. The Court has read the proposal twice and has not answered it.\n\nThe King may take the man at his word, wait until the party congress has said whether it will let its leader sit at all, or refuse him and send for a socialist with no party behind him."
 ita_dnc.1800.a: "Let Turati take the portfolio."
 ita_dnc.1800.b: "Wait for the congress to answer."
 ita_dnc.1800.c: "Refuse, and send for Bissolati."
 ita_dnc.1801.t: "The Congress Is Asked"
 ita_dnc.1801.d: "The party meets to decide whether a socialist may sit in a ministry of the King and remain a socialist. The reformists have the platform and the syndicalists have the galleries.\n\nThe congress can vote the portfolio and keep the party whole, or vote against it and lose the half of the party that means to take it anyway."
 ita_dnc.1801.a: "The reformists carry the congress."
 ita_dnc.1801.b: "The party splits, and he sits regardless."
 ita_dnc.1803.t: "A Socialist Sits in the Italian Cabinet"
 ita_dnc.1803.d: "The ministry at Rome has given a portfolio to the leader of its socialists, and the Italian press writes as though the monarchy had survived the shock. Our ambassador reports that the King signed the list without comment.\n\nWe can enter it in the ledger, let the chief of staff draw the conclusion he prefers, or treat the whole business as an Italian domestic matter."
 ita_dnc.1803.a: "Enter it in the ledger."
 ita_dnc.1803.b: "Let Conrad draw his conclusion."
 ita_dnc.1803.c: "It is their affair, not ours."
 ita_dnc.1804.t: "The League of Industry Answers"
 ita_dnc.1804.d: "The bill would make the collective contract binding and put the Chambers of Labour inside the law. The industrial league of Turin has called its members together to decide what to do about it.\n\nThey can accept the boards and the contract, shut the gates in the lower plain and see whether the ministry sends an arbitrator or a squadron, or take their capital out of Milan altogether."
 ita_dnc.1804.a: "Accept the boards and the contract."
 ita_dnc.1804.b: "Answer with a lockout."
 ita_dnc.1804.c: "Take the capital elsewhere."
 ita_dnc.1806.t: "The Lockout in the Bassa"
 ita_dnc.1806.d: "The gates are shut across the whole of the lower plain and the leagues have answered with a strike of the harvest. The prefect asks for instructions, and the cavalry is already quartered in the town.\n\nWe can make the prefect arbitrate and impose his award on both sides, or give him the squadrons and let him clear the square."
 ita_dnc.1806.a: "The prefect arbitrates, and his award binds."
 ita_dnc.1806.b: "Give the prefect his cavalry."
 ita_dnc.1808.t: "The Register Before the Chamber"
 ita_dnc.1808.d: "The bill would strike the reading test out of the electoral law and put every grown man on the register. The prefects have told the ministry what that does to the colleges they manage, and the Senate has explained what the property qualification is for.\n\nThe Chamber can vote the whole register, keep the reading test and lower the age instead, or let the Senate throw the bill out."
 ita_dnc.1808.a: "Every man on the register."
 ita_dnc.1808.b: "Keep the reading test, lower the age."
 ita_dnc.1808.c: "Let the Senate refuse it."
 ita_dnc.1809.t: "The Leagues Before the Chamber"
 ita_dnc.1809.d: "The Bloc offers to let the register wait if the Chamber will put the leagues of resistance into the law and give their contracts standing before a court. The prefects would lose the power to dissolve them at will.\n\nThe Chamber can make the leagues lawful, register them and watch them, or refuse both and leave matters where they stand."
 ita_dnc.1809.a: "The leagues are lawful."
 ita_dnc.1809.b: "Registered, and watched."
 ita_dnc.1809.c: "Refuse the statute."
 ita_dnc.1812.t: "The Vatican Answers the Ministry"
 ita_dnc.1812.d: "A socialist holds a portfolio, and the ban on the polls still keeps the faithful out of the colleges that might have answered him. The Curia must decide what a Catholic is to do in a kingdom governed by the Bloc.\n\nIt can harden the ban and set the white leagues against the red, offer terms in which the schools are left alone and the leagues stay neutral, or carry the whole question to the King."
 ita_dnc.1812.a: "Harden the ban and organise the white leagues."
 ita_dnc.1812.b: "Offer terms to the ministry."
 ita_dnc.1812.c: "Carry it to the King."
 ita_dnc.1813.t: "The Church Offers Terms"
 ita_dnc.1813.d: "The terms are plain. Religious teaching stays in the elementary schools, the white leagues keep out of the ministry's quarrels, and the ban on the polls is not pressed against the men who would vote for us.\n\nWe can take the bargain and quiet the parishes, or refuse it and accept the second street the white leagues will fill."
 ita_dnc.1813.a: "Take the bargain."
 ita_dnc.1813.b: "Refuse it."
 ita_dnc.1816.t: "The Arsenals Answer"
 ita_dnc.1816.d: "The shorter day would come first to the yards the State owns, on both coasts and at the steelworks inland. The directors have costed it and the admiralty has read the costing.\n\nThe admirals can apply it, carry a memorial to the King and stop the largest yard while they wait for their answer, or apply it at the steelworks and nowhere else."
 ita_dnc.1816.a: "Apply the shorter day in the yards."
 ita_dnc.1816.b: "Carry a memorial to the King."
 ita_dnc.1816.c: "The steelworks only."
 ita_dnc.1817.t: "The Mills and the Seventh Day"
 ita_dnc.1817.d: "The weekly rest is law, the inspectors are few, and the mills of the north have already found the exemptions. The industrialists have met to decide whether the law is worth obeying.\n\nThey can comply and shut their gates on the seventh day, or keep the shifts running and let the inspectors prove what they can."
 ita_dnc.1817.a: "Comply with the law."
 ita_dnc.1817.b: "Work around it."
 ita_dnc.1819.t: "The Vatican Reads the Convention"
 ita_dnc.1819.d: "The treaty with the Republic has been read in the Borgo as an alliance with the men who took the temporal power, and with the lodges that keep it. The Catholic press has been given its line and the parish clergy have been given theirs.\n\nThe Curia can make the quarrel public and treat this ministry as an enemy of the Church, or spend its credit elsewhere and let the matter pass."
 ita_dnc.1819.a: "Make the quarrel public."
 ita_dnc.1819.b: "Let it pass."
 ita_dnc.1820.t: "Rome Invites the President"
 ita_dnc.1820.d: "The Italian ambassador brings an invitation for the President and a draft labour convention for their emigrant workmen, with a clause of arbitration attached to it. The Italians add, without being asked, that the understanding of the last ministry need not stay in a safe.\n\nWe can go and sign, go and ask that the old understanding be published, or find that the season is unsuitable."
 ita_dnc.1820.a: "Go, and sign the convention."
 ita_dnc.1820.b: "Go, and ask that the understanding be published."
 ita_dnc.1820.c: "Adjourn the visit."
 ita_dnc.1821.t: "The Study Mission"
 ita_dnc.1821.d: "An Italian commission asks to study the insurance offices, and it brings with it a draft convention for the Italian workmen in our mines and building trades. The Reichstag would read our signature as a compliment to the laws it is proudest of.\n\nWe can receive them and sign, or receive them, show them everything and sign nothing."
 ita_dnc.1821.a: "Receive them, and sign."
 ita_dnc.1821.b: "Receive them, and sign nothing."
 ita_dnc.1822.t: "The Note in the Safe"
 ita_dnc.1822.d: "The understanding says that we stay neutral if the Republic is attacked, and that we will do nothing in North Africa that Paris would resent. It has never been published, and our ally has never been shown it.\n\nWe can publish it and let both courts of the alliance read what we have signed, or lock it up again and say nothing."
 ita_dnc.1822.a: "Publish it."
 ita_dnc.1822.b: "Keep it in the safe."
 ita_dnc.1823.t: "The President at the Quirinal"
 ita_dnc.1823.d: "The French President has been received at the Italian court and a labour treaty has been signed with a clause of arbitration in it. Our embassy sends the toasts as well as the treaty.\n\nWe can note where our ally spends its afternoons, or say nothing and keep the alliance quiet."
 ita_dnc.1823.a: "Note where the ally spends its afternoons."
 ita_dnc.1823.b: "Say nothing."
 ita_dnc.1824.t: "The Chamber and the Pension"
 ita_dnc.1824.d: "The national fund exists, it is voluntary, and hardly anyone joins it. The bill would make the contribution compulsory for the employer and the pension a right of the workman.\n\nThe centre of the Chamber can vote the compulsory insurance, keep it voluntary and subsidise it, or throw the bill out and tell the Bloc what its programme costs."
 ita_dnc.1824.a: "Compulsory insurance."
 ita_dnc.1824.b: "Voluntary, and subsidised."
 ita_dnc.1824.c: "Throw the bill out."
 ita_dnc.1828.t: "The King Answers"
 ita_dnc.1828.d: "The bills of the Bloc lie on the desk together: the register, the leagues, the pension and the shortened service. The Court has told the King what the party of the Court thinks of all four.\n\nHe can sign them, refuse and send for the man who wrote the article on the Statuto, or sign them with the military law taken out."
 ita_dnc.1828.a: "Sign the bills."
 ita_dnc.1828.b: "Refuse, and send for Sonnino."
 ita_dnc.1828.c: "Sign, but withdraw the military law."
 ita_dnc.1829.t: "The King and the Army Bill"
 ita_dnc.1829.d: "The Crown will sign the civil bills and asks that the shortened service be withdrawn before it reaches him. The ministry can live without the military law and cannot live without the rest.\n\nWe can withdraw it and keep the ministry, or insist on the whole programme and be refused the whole programme."
 ita_dnc.1829.a: "Withdraw the military law."
 ita_dnc.1829.b: "Insist, and be refused."
 ita_dnc.1831.t: "The King of Italy Sends for Sonnino"
 ita_dnc.1831.d: "The Bloc has been dismissed at Rome and the author of the article on the Statuto has been called to form a ministry. Our ambassador has known him for years and has always found him easier to read than his predecessors.\n\nWe can treat the change as good news for the alliance, or wait and see whether it outlasts a session."
 ita_dnc.1831.a: "Good news for the alliance."
 ita_dnc.1831.b: "Wait and see whether it lasts."
 ita_dnc.1832.t: "The Staff Answers"
 ita_dnc.1832.d: "The bill would cut the term with the colours, reduce the standing cadres and put a militia establishment behind them. The general staff has been asked whether the frontier can be held on those terms.\n\nIt can accept the shortened service, send a memorial of the officers to the King, or resign in a body and leave the ministry to find another chief."
 ita_dnc.1832.a: "Accept the shortened service."
 ita_dnc.1832.b: "The officers send a memorial."
 ita_dnc.1832.c: "The staff resigns."
 ita_dnc.1833.t: "A Casus Belli Against Us"
 ita_dnc.1833.d: "The other staff has read our shortened service as an invitation and has drawn up its claim on the provinces of the north-east. Our attaches report that leave has been cancelled in the Tyrol garrisons.\n\nThere is nothing to answer and no note to send. The Chamber will have to be told what the reduced cadres have bought it."
 ita_dnc.1833.a: "Tell the Chamber what it has bought."
 ita_dnc.1835.t: "Italy Shortens the Service"
 ita_dnc.1835.d: "The Kingdom has cut its term with the colours and put a militia behind the line regiments. Our chief of staff has the returns and says that their frontier corps will not be worth what the treaty assumes for a generation.\n\nHe asks the Emperor for the preventive war while the advantage lasts. The Emperor may refuse him, and the Ballhausplatz may prefer to file the report."
 ita_dnc.1835.a: "Conrad shall have his war goal."
 ita_dnc.1835.b: "The Emperor refuses him."
 ita_dnc.1835.c: "File the report."
 ita_dnc.1836.t: "The Confederation Decides"
 ita_dnc.1836.d: "The syndicalists have called for a general strike against the reformist line and against a ministry that has a socialist in it. The Confederation of Labour must say whether it will call the men out or hold them in.\n\nThe reformists can hold the unions, the syndicalists can carry the vote and call the strike, or the Court can settle the question by demanding the troops before it begins."
 ita_dnc.1836.a: "The reformists hold the unions."
 ita_dnc.1836.b: "The syndicalists carry the vote."
 ita_dnc.1836.c: "The King demands the troops."
 ita_dnc.1837.t: "The First General Strike"
 ita_dnc.1837.d: "The tramways have stopped, the ports have stopped, and the reservists in the barracks have been told to stand ready. The prefects ask whether this ministry will send the army in, as every ministry before it has done.\n\nWe can let the strike exhaust itself and take the credit for the quiet afterwards, or resign rather than give the order to fire."
 ita_dnc.1837.a: "Let it burn itself out."
 ita_dnc.1837.b: "Resign rather than fire."
 ita_dnc.1838.t: "The King Demands the Troops"
 ita_dnc.1838.d: "The Court has asked for the state of siege in the industrial towns, and the command at Milan is waiting for the telegram. The Minister of Labour has said what he will do the day it is sent.\n\nWe can obey the Crown and lose the socialist out of the cabinet, or refuse the order and let the officers carry their complaint to the King."
 ita_dnc.1838.a: "Obey the Crown."
 ita_dnc.1838.b: "Refuse the order."
 ita_dnc.1839.t: "Italy on General Strike"
 ita_dnc.1839.d: "The Italian ports and railways have stopped and the ministry has not sent the army into the squares. Our consuls report that the reservist classes were called and did not come.\n\nWe can enter it in the ledger, let the chief of staff make what use he can of it, or wait for the season to pass."
 ita_dnc.1839.a: "Enter it in the ledger."
 ita_dnc.1839.b: "Let Conrad make use of it."
 ita_dnc.1839.c: "Wait for it to pass."
 ita_dnc.1840.t: "Rome Asks for Arbitration on the Trentino"
 ita_dnc.1840.d: "The Italian ambassador proposes that the question of a diet for the Trentino and of an Italian faculty be put to an arbitral court. He is careful to say that the treaty is not in question and that the award would bind both parties.\n\nWe can grant the diet and the faculty ourselves and keep the court out of it, refuse the arbitration and the request with it, or accept the court and abide by what it finds."
 ita_dnc.1840.a: "Grant the diet and the faculty."
 ita_dnc.1840.b: "Refuse the arbitration."
 ita_dnc.1840.c: "Accept the court."
 ita_dnc.1841.t: "The Award Goes Against Us"
 ita_dnc.1841.d: "The court has found for the other party on every head. There is to be no diet, no faculty, and no appeal from a finding we asked for ourselves.\n\nThe irredentist committees have the verdict printed and posted before the ministry has finished reading it."
 ita_dnc.1841.a: "We asked, and we were answered."
 ita_dnc.1842.t: "The Award"
 ita_dnc.1842.d: "The court has found for us. The Trentino is to have its diet, the Italians of the coast are to have a faculty in their own tongue, and the other party has undertaken to execute the finding.\n\nIt is the first thing this Kingdom has taken from that empire without a soldier."
 ita_dnc.1842.a: "Take it, and say so quietly."
 ita_dnc.1843.t: "Rome Proposes a General Arbitration Treaty"
 ita_dnc.1843.d: "The Italians ask us to sign a treaty of arbitration of general application, with no reservation for questions of honour or of vital interest. They are proposing it to the other powers at the same time, and they will publish the refusals.\n\nWe can sign the general clause as it stands, or sign a narrower one and decline the general character."
 ita_dnc.1843.a: "Sign the general clause."
 ita_dnc.1843.b: "Decline the general character."
 ita_dnc.1844.t: "The Colonial Credits"
 ita_dnc.1844.d: "The colony beyond the Red Sea has a garrison, a governor and no revenue, and the Extreme Left has moved that we leave Africa altogether. The Chamber has the estimates in front of it.\n\nIt can vote a civil administration and a colony that costs little, vote the credits as they stand, or vote the railway inland from the port and try to make the place pay."
 ita_dnc.1844.a: "A civil colony, and a cheap one."
 ita_dnc.1844.b: "The credits as they stand."
 ita_dnc.1844.c: "Vote the railway from the port."
 ita_dnc.1847.t: "Rome Will Not Come Back"
 ita_dnc.1847.d: "The Italian Chamber has voted a civil administration for the coast and has struck out the credits that would have paid for anything else. Their Extreme Left said in the debate that the road inland is closed for good.\n\nWe can take them at their word and treat the coast as a neighbour, or remember what was said the last time and keep the levies where they are."
 ita_dnc.1847.a: "Take them at their word."
 ita_dnc.1847.b: "Keep the levies where they are."
 ita_dnc.1848.t: "The Bank Is Called In"
 ita_dnc.1848.d: "The Banco di Roma has bought quays, a mill and a great deal of land at Tripoli, and its president would like the Consulta to see that the investment is protected. The nationalist press has already been told what the ministry is refusing.\n\nThe bank can sell its positions and take the loss, carry the quarrel to the press, or ask the Consulta to press the Porte on its behalf."
 ita_dnc.1848.a: "Sell the positions."
 ita_dnc.1848.b: "Carry it to the press."
 ita_dnc.1848.c: "Ask the Consulta to press the Porte."
 ita_dnc.1851.t: "Rome Will Not Come"
 ita_dnc.1851.d: "The Italian ministry has told its own bank that it will not stand behind the concessions at Tripoli, and the bank is selling. The vali reports that the Italian steamers have stopped landing engineers.\n\nWe can grant the bank its concessions now that no fleet stands behind them, or reinforce the province while the chance is there."
 ita_dnc.1851.a: "Grant the bank its concessions."
 ita_dnc.1851.b: "Reinforce the province."
 ITA_r_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_r_tt_the_price_of_entry: "The price of the Bloc: the street loses patience with a ministry that has taken the oath, the prefects lose their instructions, the Court withdraws its confidence, and the Vatican is against us from the first day."
 ITA_r_tt_turati_takes_the_portfolio: "Turati takes the Ministry of Labour, and the Interior is bound to keep the troops out of the squares."
 ITA_r_tt_bissolati_takes_the_portfolio: "Bissolati takes the portfolio instead, and he brings no party with him."
 ITA_r_tt_the_bloc_takes_the_floor: "The decisions of the Popular Bloc are open for as long as the Bloc governs."
 ITA_r_tt_the_register_of_five_millions: "The Register of Five Million becomes available among the decisions of the Chamber once the new electorate is voted."
 ITA_r_tt_the_register_is_read_for_us: "The register is widened now and read at the next returns, where the new colleges answer for the Bloc."
 ITA_r_tt_rigola_takes_the_chair: "The secretary of the Confederation of Labour is available to the ministry as an adviser."
 ITA_r_tt_the_school_against_the_parish: "The School Against the Parish becomes available among the decisions of the Popular Bloc."
 ITA_r_tt_the_womens_work_law: "The Women's Work Law becomes available among the decisions of the Popular Bloc."
 ITA_r_tt_no_answer_comes: "There is no government in that capital to answer us, and the question falls."
 ITA_r_tt_the_convention_is_offered: "The invitation and the draft convention go out together, and the answer will come from the other side of the Alps."
 ITA_r_tt_luzzatti_is_called: "Luzzatti is called in for the insurance bill and is available to the ministry as an adviser."
 ITA_r_tt_the_mission_comes_home: "The mission comes home with notes, courtesies and no signature."
 ITA_r_tt_the_visit_is_adjourned: "The visit is adjourned to a season that is never named."
 ITA_r_tt_the_pension_fund: "The Pension Fund becomes available among the decisions of the Popular Bloc once the insurance is law."
 ITA_r_tt_the_militia_or_the_staff: "The general staff answers the bill, and its answer decides whether we get the militia establishment or a new chief of staff."
 ITA_r_tt_cadorna_takes_the_staff: "Cadorna takes the general staff, and he is available to the ministry as an adviser."
 ITA_r_tt_the_strike_fund: "The Strike Fund Is Counted becomes available among the decisions of the Popular Bloc once the Confederation is recognised."
 ITA_r_tt_the_appeal_to_the_king: "The Curia carries the quarrel over the head of the ministry, and the King will remember it when the bills of the Bloc reach him."
 ITA_r_tt_the_massawa_railway: "The Massawa Railway becomes available among the decisions of the Colonies."
 ITA_r_tt_the_bank_asks_the_consulta: "The bank carries its case to the Consulta, where the Banco di Roma Instead becomes the likelier answer to the Tripoli question."
 ITA_r_threat_vienna_answers: "Vienna answers the shortened service"
 ITADNC_z_the_proletarian_nation: "The Proletarian Nation"
 ITADNC_z_the_proletarian_nation_desc: "We sell our men abroad the way a poor country sells anything else, and we are answered at the congresses in the voice kept for debtors. We must put the nationalist programme on the government bench and let the Right form a ministry that will carry it."
 ITADNC_z_the_unredeemed_provinces: "The Unredeemed Provinces"
 ITADNC_z_the_unredeemed_provinces_desc: "Vienna will give our people a law faculty in any town of the monarchy except the one where they live. We must ask for the Italian faculty at Trieste and let the Ballhausplatz answer for its refusal."
 ITADNC_z_the_consuls_on_the_adriatic: "The Consuls on the Adriatic"
 ITADNC_z_the_consuls_on_the_adriatic_desc: "Our consulates at Trieste, Zara and Spalato pay the schoolmasters of the Lega Nazionale, and the Statthalter knows to the crown what they cost. We must ask that our consuls and their schools be left alone, and prepare for the answer we expect."
 ITADNC_z_the_schools_beyond: "The Schools Beyond the Frontier"
 ITADNC_z_the_schools_beyond_desc: "Our schoolmasters teach at Scutari, Valona and Durazzo on a subsidy nobody votes and a licence nobody has granted. We must ask the Porte to license them as she licenses the Austrian ones."
 ITADNC_z_the_marriage: "The Marriage's Price"
 ITADNC_z_the_marriage_desc: "The Queen is a daughter of the Black Mountain, and our companies already hold the tobacco monopoly there and the little railway up from the coast. We must ask her father for a military mission and a coaling station at Antivari."
 ITADNC_z_the_danube_adriatic_railway: "The Danube-Adriatic Railway"
 ITADNC_z_the_danube_adriatic_railway_desc: "Belgrade wants a line to the sea that does not pass through the Sandjak, and the money for it has to come from somewhere. We must offer to carry the line to Medua ourselves and take the concession with it."
 ITADNC_z_the_strike_is_treason: "The Strike That Is Treason"
 ITADNC_z_the_strike_is_treason_desc: "A political strike stops the arsenals and the railways, and we have no law that calls it anything worse than a strike. We must lay the bill before the Chamber and let the Confederation answer it."
 ITADNC_z_the_syndicalists: "The Syndicalists Who Crossed"
 ITADNC_z_the_syndicalists_desc: "The men who left the party for the general strike now write about the nation instead of the class. We must open the door to them and see how many walk through it."
 ITADNC_z_the_emigrant: "The Emigrant Is Not a Loss"
 ITADNC_z_the_emigrant_desc: "Our consuls abroad count our people, bury them and can lend them nothing, because no treaty allows them more. We must ask Washington for protection, for the recognition of our nationality and for banks of remittance."
 ITADNC_z_the_alliance_is_a_receipt: "The Alliance Is a Receipt"
 ITADNC_z_the_alliance_is_a_receipt_desc: "The seventh article promises compensation for every change in the Balkans, and our ally reads it as a courtesy between friends. We must ask Berlin to underwrite our reading of it before anything happens."
 ITADNC_z_the_price_of_article_seven: "The Price of Article Seven"
 ITADNC_z_the_price_of_article_seven_desc: "The provinces have been annexed and the seventh article says plainly that we are owed for it. We must present the bill in form and name what would settle it. What we are asking for is taken from the monarchy that has just helped itself."
 ITADNC_z_the_understanding_with_belgrade: "The Understanding with Belgrade"
 ITADNC_z_the_understanding_with_belgrade_desc: "Belgrade has no ally against the monarchy and no harbour of her own, and we have both to offer. We must propose a military convention and a guarantee, and accept that it points at Vienna."
 ITADNC_z_the_chamber_tears_the_treaty: "The Chamber Tears the Treaty"
 ITADNC_z_the_chamber_tears_the_treaty_desc: "The nationalist benches have moved that the alliance be denounced, and the ministry cannot refuse the debate. We must let Montecitorio vote on what the alliance has actually returned to us."
 ITADNC_z_valona: "The Beys of Valona"
 ITADNC_z_valona_desc: "The beys of Valona take our money, our schools and our doctors, and answer to a governor who cannot pay them. We must ask the Porte for a coaling station at Saseno and a free hand on that shore. What we are asking for is a piece of her empire."
 ita_dnc.1600.t: "The Right Takes the Programme"
 ita_dnc.1600.d: "The nationalist committees have written a programme no minister has yet dared to sign, and the Right is being offered it whole.\n\nSalandra will take the ministry on it as it stands. Sonnino says the street must be quieter first. The old men would rather wait for a crisis to make the thing respectable."
 ita_dnc.1600.a: "Salandra forms the national ministry."
 ita_dnc.1600.b: "Sonnino, and not before the street is quiet."
 ita_dnc.1600.c: "Wait. A crisis will bring it to us."
 ita_dnc.1601.t: "The Ministry That Was Waiting"
 ita_dnc.1601.d: "The crisis the Right was waiting for has come and gone, and the programme is still lying on the table where it was left.\n\nSalandra takes the ministry on it, without further conditions and without much enthusiasm."
 ita_dnc.1601.a: "The ministry is formed."
 ita_dnc.1602.t: "No Answer Comes"
 ita_dnc.1602.d: "The note went out and there is nobody left to receive it. The chancery it was addressed to no longer answers for anything.\n\nThe piazza reads the silence as a refusal, which for our purposes it is."
 ita_dnc.1602.a: "Then we are answered."
 ita_dnc.1603.t: "The Press That Names the Provinces"
 ita_dnc.1603.d: "The Roman papers have begun to print the names of the monarchy's Italian districts as though they were provinces of the Kingdom, and the government there does not disown them.\n\nWe can note it in the file, or let a newspaper be a newspaper."
 ita_dnc.1603.a: "Note it, and remember who did not disown it."
 ita_dnc.1603.b: "Let a newspaper be a newspaper."
 ita_dnc.1604.t: "Rome Asks for the Italian Faculty at Trieste"
 ita_dnc.1604.d: "The Italian ambassador asks that the law faculty promised to our Italian subjects be opened at Trieste, where they live, and not in a German town where they can be watched.\n\nThe Statthalter answers that a faculty at Trieste is a claim with a lecture hall. The Hungarians do not care. The Emperor would like the noise to stop."
 ita_dnc.1604.a: "Give them the faculty at Trieste."
 ita_dnc.1604.b: "Refuse. Innsbruck will do, or nothing will."
 ita_dnc.1604.c: "Offer the faculty here, under our own eye."
 ita_dnc.1605.t: "Rome Asks That the Lega Nazionale Be Left Alone"
 ita_dnc.1605.d: "The Italian consulates at Trieste, Zara and Spalato pay the schoolmasters of the Lega Nazionale, and Rome asks that this be tolerated as it has been tolerated for a generation.\n\nThe police at Zara would rather expel the consul and close the schools. The Foreign Ministry would rather sell the toleration than give it away."
 ita_dnc.1605.a: "Tolerate the consuls and their schools."
 ita_dnc.1605.b: "Expel the consul at Zara and close the schools."
 ita_dnc.1605.c: "Tolerate them, if the Lega Nazionale is dissolved."
 ita_dnc.1606.t: "The Night at Innsbruck"
 ita_dnc.1606.d: "The faculty was refused and our students went to hear the lecture anyway. The town rose against them and the gendarmes arrested the lecturers along with the rioters.\n\nBy morning the whole affair is in every Italian paper, with the names of the arrested printed like a casualty list."
 ita_dnc.1606.a: "The provinces have a night to remember."
 ita_dnc.1607.t: "Berlin Counsels Vienna"
 ita_dnc.1607.d: "Rome has asked for a university faculty and Vienna is about to refuse it over the name on a signboard.\n\nThe Chancellor thinks an ally is cheaply kept for the price of a lecture hall. The staff thinks it is not our quarrel and that we should not be seen in it."
 ita_dnc.1607.a: "Counsel Vienna to grant the faculty."
 ita_dnc.1607.b: "Say nothing. It is their monarchy."
 ita_dnc.1608.t: "Rome Asks the Porte to License Her Schools"
 ita_dnc.1608.d: "The Italian schools at Scutari, Valona and Durazzo have been open for years without a licence, and Rome now asks for the standing the Austrian schools enjoy.\n\nThe valis want them closed. The treasury observes that the Italians have a bank, and that the province has no money at all."
 ita_dnc.1608.a: "License them, as we license the Austrian schools."
 ita_dnc.1608.b: "Close the Italian schools and keep the Austrian ones."
 ita_dnc.1608.c: "License them, against a loan from their bank."
 ita_dnc.1609.t: "The Lega Is Asked to Close Its Doors"
 ita_dnc.1609.d: "Vienna will leave our consuls alone if the Lega Nazionale is dissolved by our own hand.\n\nThe Lega is a society of schoolmasters and a subscription list. It is also the only Italian institution left in Dalmatia. We can sign the dissolution, or tell the ambassador what he already expects to hear."
 ita_dnc.1609.a: "Dissolve the Lega. The consuls are worth more."
 ita_dnc.1609.b: "Refuse. Let them do their own closing."
 ita_dnc.1610.t: "The Bank Is Asked for a Loan"
 ita_dnc.1610.d: "The Porte will license our schools if our bank carries the provincial loan that nobody else will touch.\n\nThe money is real and would be lent at a loss. The board is willing if the government asks it in writing and takes the blame for the writing."
 ita_dnc.1610.a: "Lend the money and keep the schools."
 ita_dnc.1610.b: "Refuse. The schools are not worth a bad loan."
 ita_dnc.1611.t: "Italian Schools at Scutari"
 ita_dnc.1611.d: "The Italian consul at Scutari has opened schools on ground where our own cultual protectorate is the only recognised one, and Rome has asked the Porte to license them.\n\nWe can protest to the Porte and have the licence refused, or leave the Albanians to their schoolmasters."
 ita_dnc.1611.a: "Protest to the Porte."
 ita_dnc.1611.b: "Leave them to their schoolmasters."
 ita_dnc.1612.t: "The Marriage's Price"
 ita_dnc.1612.d: "Our daughter is Queen in Rome, and the Italians have come at last to say what the marriage was worth to them: a military mission for our army and a coaling station in the bay.\n\nVienna has told us the harbour is closed to warships by treaty, and will tell us again. The concession without the officers would offend nobody at all."
 ita_dnc.1612.a: "Grant the mission and the station."
 ita_dnc.1612.b: "Refuse. Vienna has already spoken."
 ita_dnc.1612.c: "The concession, but not the officers."
 ita_dnc.1613.t: "The Article and the Provinces"
 ita_dnc.1613.d: "Vienna offers to have the article that closes Antivari to warships struck out, and asks in exchange that we say nothing when the provinces are annexed.\n\nThe bargain is a good one for the fleet and a poor one for the piazza. It has to be taken or refused before the annexation, not after."
 ita_dnc.1613.a: "Take the harbour. The provinces were never ours."
 ita_dnc.1613.b: "Refuse. We will not be paid in another country's land."
 ita_dnc.1614.t: "A Faculty in the Wrong Town"
 ita_dnc.1614.d: "The faculty is offered in the capital, under the eye of the police, and the word Trieste does not appear anywhere in the decree.\n\nOur students would have their degrees. The committees would have a grievance instead, and they would rather have the grievance."
 ita_dnc.1614.a: "Take the faculty where it is offered."
 ita_dnc.1614.b: "Refuse. It is Trieste or nothing."
 ita_dnc.1615.t: "The Italians Are at Antivari"
 ita_dnc.1615.d: "The Italians have landed engineers and a military mission at Antivari and are dredging the bay in the open.\n\nThe treaty closes that harbour to warships and we are entitled to say so. The Foreign Ministry would rather sell the article than defend it, and the price it has in mind is the annexation."
 ita_dnc.1615.a: "Invoke the article and police the coast."
 ita_dnc.1615.b: "Offer to strike the article out, for a price."
 ita_dnc.1615.c: "Say nothing. It is a fishing port."
 ita_dnc.1616.t: "Rome Offers to Finance the Line to Medua"
 ita_dnc.1616.d: "The Italians offer the capital, the engineers and the rolling stock for a railway from the Danube to a harbour that is not Austrian.\n\nPetersburg has encouraged the scheme warmly and has not paid for any part of it. The syndicate wants an answer before the season closes."
 ita_dnc.1616.a: "Take the Italian money and build the line."
 ita_dnc.1616.b: "Ask Petersburg first."
 ita_dnc.1617.t: "The Concession Through Albania"
 ita_dnc.1617.d: "The line the Serbs want must cross our Albanian sanjaks to reach the sea, and the concession is ours to grant or to withhold.\n\nGranting it brings money, and Italian engineers, into a province we barely hold. Withholding it leaves the Serbs exactly where they are."
 ita_dnc.1617.a: "Grant the concession."
 ita_dnc.1617.b: "Refuse it. The province is quiet enough."
 ita_dnc.1618.t: "Petersburg Is Asked About the Line"
 ita_dnc.1618.d: "Belgrade will not take Italian money for the railway until we say what we think of it.\n\nThe line breaks the Austrian hold on the Sandjak, which is what we want. It also puts Italy on the Albanian shore, which is not. We can back it, or send the question back to Vienna where it will die."
 ita_dnc.1618.a: "Back the line, and let the Italians pay for it."
 ita_dnc.1618.b: "Send them to Vienna. It is an Austrian question."
 ita_dnc.1619.t: "The Line to Medua"
 ita_dnc.1619.d: "The Italians are offering the Serbs a railway to the sea that would leave our own line through the Sandjak without traffic and without a purpose.\n\nWe can begin our line at once and carry the loss. Or we can offer Rome a share in theirs and keep the Italians inside the alliance a while longer."
 ita_dnc.1619.a: "Begin the line through the Sandjak."
 ita_dnc.1619.b: "Offer Rome a share in the line."
 ita_dnc.1620.t: "The Confederation Answers the Bill"
 ita_dnc.1620.d: "The bill makes a strike against the mobilisation of the army an offence, and the Confederation has read it as a bill against strikes.\n\nThe reformists want to fight it in the Chamber. The chambers of labour want to answer it in the street. The syndicalists want to leave the Confederation and say why."
 ita_dnc.1620.a: "Fight it in the Chamber."
 ita_dnc.1620.b: "Answer it with a general strike."
 ita_dnc.1620.c: "The syndicalists walk out."
 ita_dnc.1621.t: "The General Strike"
 ita_dnc.1621.d: "The chambers of labour are out, the arsenals are quiet and the trains have stopped where they stood.\n\nThe prefects ask for the garrison. The ministry can send the troops and be obeyed, or withdraw the bill and let the men go back to work."
 ita_dnc.1621.a: "Send the troops."
 ita_dnc.1621.b: "Withdraw the bill."
 ita_dnc.1623.t: "Rome Will Not Close the Lega"
 ita_dnc.1623.d: "Rome has refused to dissolve the Lega Nazionale, and the consul at Zara has been instructed to go on paying its schoolmasters as before.\n\nThe police have the expulsion order drawn. The Statthalter would like it signed today."
 ita_dnc.1623.a: "Expel the consul and close the schools."
 ita_dnc.1624.t: "The Men Who Left the Party"
 ita_dnc.1624.d: "Labriola and the men around him have been writing that the class war is a quarrel among Italians, and that it is the nation which is poor.\n\nThe ministry has left the door open for them. They can walk through it, refuse it, or ask first what is in it for the south."
 ita_dnc.1624.a: "Cross over to the nation."
 ita_dnc.1624.b: "Refuse. It is the same old ministry."
 ita_dnc.1624.c: "Cross over, if Tripoli is promised."
 ita_dnc.1625.t: "A Promise in Exchange"
 ita_dnc.1625.d: "The syndicalists will come across if the ministry says plainly that the fourth shore is government policy and not a lecture subject.\n\nThe promise costs nothing today. It will cost a great deal on the day it has to be kept."
 ita_dnc.1625.a: "Promise them Tripoli."
 ita_dnc.1625.b: "Promise them nothing."
 ita_dnc.1626.t: "Rome Will Not Trade the Shore for the Desert"
 ita_dnc.1626.d: "Rome has refused to renounce Tripoli for a free hand at Valona, and the Italian squadron has not left the bay.\n\nThe governor asks for battalions and a battery. We can reinforce the place and let Rome draw the conclusion for itself."
 ita_dnc.1626.a: "Reinforce Valona."
 ita_dnc.1628.t: "The Consuls' Request"
 ita_dnc.1628.d: "The Italian consuls ask for the protection of their nationals after the murder of a police officer in Palermo, for the recognition of a double nationality, and for the right to open banks of remittance.\n\nThe department sees no harm in the first. The commission sitting on immigration would rather concede nothing at all, and has an answer of its own to offer."
 ita_dnc.1628.a: "Grant what the consuls ask."
 ita_dnc.1628.b: "Decline. The commission is still sitting."
 ita_dnc.1628.c: "Grant it, against a literacy test at embarkation."
 ita_dnc.1629.t: "The Test at the Gangway"
 ita_dnc.1629.d: "The Americans will grant the consuls everything if the emigrants are examined for their letters before they board.\n\nHalf the men of the south would fail it. The register would be honest, and it would be shorter."
 ita_dnc.1629.a: "Accept the test."
 ita_dnc.1629.b: "Refuse it. They are our people."
 ita_dnc.1630.t: "The Rifles Have Arrived"
 ita_dnc.1630.d: "The Italian rifles are in the depots and the cases were not opened at the frontier.\n\nRome has asked for the convention in exchange, and the staff would sign it tonight if the ministers let them."
 ita_dnc.1630.a: "Sign the convention."
 ita_dnc.1631.t: "Rome Counts Her Sons"
 ita_dnc.1631.d: "Rome asks that Italians settled here be entered on both registers, hers and ours, and reserves the right to call the young men home for their service.\n\nOur own law says that a man born here is ours. The estancias would rather keep the men than argue about the paper."
 ita_dnc.1631.a: "Allow the double register."
 ita_dnc.1631.b: "A man born here is ours."
 ita_dnc.1632.t: "Rome Asks Berlin to Underwrite the Seventh Article"
 ita_dnc.1632.d: "The Italians want us to say, in writing, that the seventh article means what they say it means: that nothing changes in the Balkans without their being paid for it.\n\nVienna reads the same article as a promise to consult. The Chancellor can put our name under the Italian reading, or under the text."
 ita_dnc.1632.a: "Underwrite the Italian reading."
 ita_dnc.1632.b: "The article says consultation. We stand on the text."
 ita_dnc.1633.t: "Rome Refuses the Bargain"
 ita_dnc.1633.d: "Rome has refused the Sandjak and refused the free hand at Valona, and the Italian note now asks for the compensation in land and in nothing else.\n\nThe council can give nothing and let the claim be made in public, where everyone will hear it."
 ita_dnc.1633.a: "Give nothing. Let them claim it."
 ita_dnc.1634.t: "Berlin Asks Vienna to Pay"
 ita_dnc.1634.d: "Berlin has asked us, as plainly as one ally may ask another, to settle with Rome before the Italians make their claim in public.\n\nThe evacuation of the Sandjak and a faculty would cost us very little. The alternative costs us the alliance and an army on the Isonzo."
 ita_dnc.1634.a: "Pay them the Sandjak and the faculty."
 ita_dnc.1635.t: "Berlin Has Read the Seventh Article"
 ita_dnc.1635.d: "Berlin has told Rome that the seventh article means compensation and not consultation, and has told us afterwards, as a courtesy.\n\nWe can accept the reading and keep both allies, or say that the treaty is ours to read as well as theirs."
 ita_dnc.1635.a: "Accept the reading."
 ita_dnc.1635.b: "The treaty is ours to read too."
 ita_dnc.1636.t: "Rome Demands the Compensation of the Seventh Article"
 ita_dnc.1636.d: "The provinces are annexed and the Italian ambassador has come with the bill. He names the Trentino, Trieste and Istria, and says the article requires them.\n\nThe Foreign Ministry would concede the Sandjak and the faculty and be done with it. The staff would concede nothing. The Hungarians will not fight for Trieste and have said so."
 ita_dnc.1636.a: "Nothing is owed. Let them claim it."
 ita_dnc.1636.b: "The Sandjak, and the faculty at Trieste."
 ita_dnc.1636.c: "A free hand at Valona, against the Sandjak."
 ita_dnc.1637.t: "A Free Hand for a Sandjak"
 ita_dnc.1637.d: "Vienna offers us the Albanian shore, in writing and in private, if we take the evacuation of the Sandjak as our compensation and say no more about the provinces.\n\nThe shore is worth more than the piazza thinks. The piazza was promised the provinces, and remembers being promised them."
 ita_dnc.1637.a: "Take the free hand at Valona."
 ita_dnc.1637.b: "Refuse. The bill was for the provinces."
 ita_dnc.1638.t: "Berlin Stands Behind Vienna"
 ita_dnc.1638.d: "Vienna asks what we will do if Rome presses her claim, and Rome asks what we will do if Vienna refuses it.\n\nThe staff would rather not choose. The Chancellor observes that only one of the two has an army we have ever counted on for the Rhine."
 ita_dnc.1638.a: "Stand behind Vienna."
 ita_dnc.1638.b: "Press Vienna to pay."
 ita_dnc.1639.t: "Izvolsky Proposes Racconigi"
 ita_dnc.1639.d: "Vienna has refused Rome her compensation, and the Italians are looking about them for a friend.\n\nA meeting at a royal shooting box would cost us nothing and could be made to mean a great deal. Or we can wait until they need us rather more than they do now."
 ita_dnc.1639.a: "Propose the meeting."
 ita_dnc.1639.b: "Wait. They will come again."
 ita_dnc.1640.t: "Rome Proposes a Convention Against Vienna"
 ita_dnc.1640.d: "The Italian military attache has brought a draft convention: our army on the Danube, theirs on the Isonzo, and neither of us to make peace alone. Rome offers a guarantee to go with it.\n\nThe staff asks whether the Italians would actually come, and how many rifles we should have in the depots first."
 ita_dnc.1640.a: "Sign the convention."
 ita_dnc.1640.b: "Decline. Rome is not strong enough."
 ita_dnc.1640.c: "Rifles first, then signatures."
 ita_dnc.1641.t: "The Ambassador Asks for an Explanation"
 ita_dnc.1641.d: "The Austrian ambassador has asked, in form and in writing, what the guarantee to the Serbs is for.\n\nWe can call it a commercial understanding and be disbelieved politely. Or we can tell him the truth and let the alliance stand as best it can."
 ita_dnc.1641.a: "Call it a commercial understanding."
 ita_dnc.1641.b: "Tell him what it is for."
 ita_dnc.1642.t: "Rifles Before Signatures"
 ita_dnc.1642.d: "Belgrade will sign nothing until the depots are full, and asks for the rifles out of our own stores.\n\nThe arsenals can spare them and would not miss them for a year. The Chamber will be told that they were sold."
 ita_dnc.1642.a: "Send the rifles."
 ita_dnc.1642.b: "Send nothing."
 ita_dnc.1643.t: "Rome Guarantees Belgrade"
 ita_dnc.1643.d: "Rome has guaranteed the Serbs. Our ally has done it, and has done it against us.\n\nThe Ballhausplatz can enter the fact in the file and say nothing whatever. Or it can ask the Italian ambassador, in form, what the guarantee is for."
 ita_dnc.1643.a: "Note it. The file is long already."
 ita_dnc.1643.b: "Ask them, in form, what it is for."
 ita_dnc.1644.t: "The Interpellation on the Alliance"
 ita_dnc.1644.d: "The nationalist benches have moved that the alliance be denounced, and the ministry has agreed to let the Chamber divide on it.\n\nThe question before the House is what the treaty has actually returned to us. The friends of the ministry answer that a receipt is worth keeping even when the bill is unpaid."
 ita_dnc.1644.a: "Denounce the treaty."
 ita_dnc.1644.b: "The alliance is a receipt. Keep it."
 ita_dnc.1644.c: "Denounce it, once the Serbs have signed."
 ita_dnc.1645.t: "The Ministry Appeals to the Country"
 ita_dnc.1645.d: "The Chamber would not denounce the treaty, and the ministry has asked for a dissolution rather than govern on that majority.\n\nThe prefects have their instructions. The country will answer."
 ita_dnc.1645.a: "Let the country answer."
 ita_dnc.1646.t: "The Chamber Waits for a Signature"
 ita_dnc.1646.d: "The Chamber will vote the denunciation when there is an army on the far shore of the Adriatic pledged to march with us, and not one day before.\n\nUntil then the motion stands adjourned and the ministry is glad of it."
 ita_dnc.1646.a: "Adjourned, until the convention is signed."
 ita_dnc.1648.t: "The Beys of Valona"
 ita_dnc.1648.d: "The Italians ask for a coaling station on the island off Valona, and a free hand with the beys who already take their money.\n\nThe valis want battalions sent instead. The treasury observes that the beys have not been paid this year, and that the Italians pay everybody."
 ita_dnc.1648.a: "Tolerate the station at Saseno."
 ita_dnc.1648.b: "Reinforce Valona and grant nothing."
 ita_dnc.1648.c: "Valona, if Rome says nothing more about Tripoli."
 ita_dnc.1649.t: "A Shore for a Silence"
 ita_dnc.1649.d: "The Porte will let us have Saseno and the beys with it, if we renounce Tripoli in writing.\n\nThe shore is close and the desert is far. The Consulta has spent years on Tripoli and would have to say out loud that the years were wasted."
 ita_dnc.1649.a: "Take the shore. Renounce Tripoli."
 ita_dnc.1649.b: "Refuse. Tripoli is not for sale."
 ita_dnc.1650.t: "Athens Reads Valona"
 ita_dnc.1650.d: "The Italians are settling themselves on the Albanian shore, and the Greek villages of the south lie behind it.\n\nThe Chamber wants Epirus claimed while the claiming is still cheap. The Foreign Ministry would rather not quarrel with a fleet."
 ita_dnc.1650.a: "Claim Epirus now."
 ita_dnc.1650.b: "Say nothing, and watch."
 ita_dnc.1651.t: "Rome at Valona"
 ita_dnc.1651.d: "Rome has asked the Porte for a station at Valona, which the understanding at Monza says neither of us would ever do.\n\nWe can warn them, publicly and in the old words. Or we can offer them the shore and take our own compensation somewhere else."
 ita_dnc.1651.a: "Warn them, in the old words."
 ita_dnc.1651.b: "Offer them the shore, for a price."
 ITA_z_tt_the_irredenta_decisions: "The Irredenta decisions are opened."
 ITA_z_tt_the_antivari_subsidy: "The Antivari Subsidy is opened among the Consulta decisions."
 ITA_z_tt_the_avanti_is_prosecuted: "The Avanti Prosecuted is opened among the Press decisions."
 ITA_z_tt_the_consuls_of_the_americas: "The Consuls of the Americas is opened among the Emigration decisions."
 ITA_z_tt_the_adriatic_map: "The Adriatic Map is opened among the Irredenta decisions."
 ITA_z_tt_the_volunteers_register: "The Volunteers' Register is opened among the Irredenta decisions."
 ITA_z_tt_the_albanian_committee: "The Albanian Committee is opened among the Irredenta decisions."
 ITA_z_tt_belgrade_signs_first: "The motion waits until the Serbs have signed the convention."
 ITA_z_threat_the_proletarian_nation: "The Proletarian Nation"
 ITA_z_threat_antivari: "The Italian Station at Antivari"
 ITA_z_threat_the_line: "The Danube-Adriatic Railway"
 ITA_z_threat_the_convention: "The Convention with Belgrade"
 ITADNC_v_the_pew_and_the_ballot: "The Pew and the Ballot"
 ITADNC_v_the_pew_and_the_ballot_desc: "The clerical-moderate lists have carried the town councils of the north and the archbishop has not yet forbidden them. We shall govern with the men of the pew, and pay the lodges what that costs us."
 ITADNC_v_the_law_of_guarantees_reread: "The Law of Guarantees Reread"
 ITADNC_v_the_law_of_guarantees_reread_desc: "The palaces, the endowment and the immunities were voted to a Pope who has refused to touch any of them since. We shall have the law read again and carry the offer across the river ourselves."
 ITADNC_v_the_divorce_bill_buried: "The Divorce Bill Buried"
 ITADNC_v_the_divorce_bill_buried_desc: "The divorce bill is back on the order paper and the parishes have buried the Chamber under petitions against it. We must settle what the ministry does with it before the bishops settle it for us."
 ITADNC_v_the_conclave_and_the_veto: "The Conclave and the Veto"
 ITADNC_v_the_conclave_and_the_veto_desc: "The old Pope is dying and the courts that still claim the right of exclusion are counting the cardinals. We shall ask Vienna to let the conclave choose without a veto carried into it."
 ITADNC_v_the_president_at_the_quirinal: "The President at the Quirinal"
 ITADNC_v_the_president_at_the_quirinal_desc: "A Catholic head of state is to be received in the palace this kingdom took from the Popes. We shall ask Paris plainly whether the President intends to cross the river afterwards."
 ITADNC_v_the_unions_founded: "The Unions Founded"
 ITADNC_v_the_unions_founded_desc: "The old congress movement has been dissolved from above and the lay Catholics of the kingdom have no organisation left to belong to. We shall let the Unions be founded under the bishops, and see who refuses to obey."
 ITADNC_v_the_deputies_nobody_admits: "The Deputies Nobody Admits to Sending"
 ITADNC_v_the_deputies_nobody_admits_desc: "Catholic voters are already going to the urns in the northern cities while the ban that forbids it is still in force. We shall hold the general election and let the bishops judge constituency by constituency."
 ITADNC_v_il_fermo_proposito: "Il Fermo Proposito"
 ITADNC_v_il_fermo_proposito_desc: "The ban has been suspended constituency by constituency for years and has never once been lifted in writing. We shall ask the Vatican for the encyclical that says so, and be rid of the obstruction the lodges have made of this ministry."
 ITADNC_v_the_protectorate_of_the_missions: "The Protectorate of the Missions"
 ITADNC_v_the_protectorate_of_the_missions_desc: "The Catholics of the Albanian coast are protected by a foreign court and taught by our own missionaries. We shall ask Vienna to hold the protectorate in common rather than alone."
 ITADNC_v_the_bank_of_the_pope: "The Bank of the Pope"
 ITADNC_v_the_bank_of_the_pope_desc: "The Roman bank of the Catholic nobility wants counters at Tripoli and Benghazi, and the concession is in the gift of the Porte. We shall put the request forward as the government's own."
 ITADNC_v_the_missions_of_the_levant: "The Missions of the Levant"
 ITADNC_v_the_missions_of_the_levant_desc: "Our friars, our hospitals and our schools in the Levant are counted as the wards of another power's protectorate. We shall ask the Porte to recognise that we protect our own religious."
 ITADNC_v_murri_suspended: "Murri Suspended"
 ITADNC_v_murri_suspended_desc: "The priest who leads the democratic league has been suspended by his own Church, and the radicals of his province want him in the Chamber. We must decide whether the ministry seats him or leaves him to the discipline of the Vatican."
 ITA_v_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_v_tt_the_church_decisions_open: "§YThe decisions of the Church are open to the ministry.§!"
 ITA_v_tt_the_catholic_banks: "§YThe decision on the Catholic banks takes the place of the one on the divorce bill.§!"
 ITA_v_tt_the_channel_survives: "§YThe private channel to the Secretariat is not broken.§!"
 ITA_v_tt_the_powers_consent: "§YOne more of the powers has let us pass.§!"
 ITA_v_tt_the_old_protector_is_confirmed: "§YThe old protector keeps the charge, and we keep nothing.§!"
 ITA_v_tt_the_quirinal_looks_for_the_channel: "§YThe ministry will look for the channel to the Vatican without the archbishop.§!"
 ITA_v_threat_the_bank: "The Bank of the Pope in Tripoli"
 ita_dnc.2000.t: "The Moderates and the Archbishop"
 ita_dnc.2000.d: "The clerical-moderate lists have already carried the town councils of the north, and the men who made them are asking the ministry to bless the arrangement in the open. The archbishop can let his clergy stand on those lists, or forbid them from the pulpit.\n\nThe lodges and the Extreme Left will read either answer as a confession. We can take the alliance and the obstruction that comes with it, or watch the ban close again."
 ita_dnc.2000.a: "The alliance is made."
 ita_dnc.2000.b: "The archbishop forbids it."
 ita_dnc.2004.t: "The Offer Is Carried Across the River"
 ita_dnc.2004.d: "The law that gave the Holy See its palaces, its endowment and its immunities has never been touched by the man it was written for. An intermediary has been found who can carry a rereading of it into the Secretariat of State without either court admitting that he went.\n\nThe Pope can refuse to hear the offer, as he has refused the endowment every year of his reign, or he can let the cardinal secretary receive our man in private."
 ita_dnc.2004.a: "The Pope will not hear it."
 ita_dnc.2004.b: "The cardinal secretary receives him."
 ita_dnc.2008.t: "The Bill Returns to the Floor"
 ita_dnc.2008.d: "The divorce bill has come back to the order paper and the parishes have buried the Chamber under petitions against it. The ministry can withdraw its own bill, let the Extreme Left force a division it will lose, or stand aside and let the law pass.\n\nEvery bishop in the kingdom is counting the votes, and so is every lodge."
 ita_dnc.2008.a: "The ministry withdraws the bill."
 ita_dnc.2008.b: "Let the Extreme Left force the division."
 ita_dnc.2008.c: "The law passes."
 ita_dnc.2012.t: "Rome Asks Vienna to Leave the Conclave Free"
 ita_dnc.2012.d: "The Pope is dying, and the Italian government has asked through its ambassador, and without a note, that the ancient right of exclusion be left in the archives this time. The cardinal who would carry our veto is already in the city.\n\nThe Secretary of State they would give us is a friend of Paris. To use the exclusion is our right; to use it is also to remind Rome that we still have one."
 ita_dnc.2012.a: "Carry the exclusion into the conclave."
 ita_dnc.2012.b: "Let the conclave choose freely."
 ita_dnc.2014.t: "The Cardinal Secretary Is Elected"
 ita_dnc.2014.d: "The conclave has raised the late Pope's own Secretary of State, a diplomat who has spent his life in the chancelleries and who is held to be a friend of the Republic beyond the Alps. He is not a man who will be told what to do by any court.\n\nThe Quirinal can send its compliments through the usual channel, or say nothing at all and let the new reign begin without us."
 ita_dnc.2014.a: "Send our compliments."
 ita_dnc.2014.b: "Say nothing."
 ita_dnc.2015.t: "The Veto at the Conclave"
 ita_dnc.2015.d: "A foreign court has reached into the conclave and struck down the candidate our embassy had counted on. The Concordat has held for a century on the understanding that the Holy See was not a chancellery of a hostile crown.\n\nThe Chamber will ask what our embassy at the Holy See is for. The ministry can recall it, or keep it and say nothing."
 ita_dnc.2015.a: "Break with the Holy See."
 ita_dnc.2015.b: "Keep the ambassador."
 ita_dnc.2016.t: "Rome Asks Whether the President Will Also Call at the Vatican"
 ita_dnc.2016.d: "The President is to be received at the Quirinal, the first Catholic head of state to enter the palace the kingdom took from the Popes. The Italian government would like to know, before the programme is printed, whether he intends to cross the river afterwards.\n\nThe Secretariat has let it be known that a visit to the King and not to the Pope will be answered. The visit can go forward as it stands, or be put off until it can be made without an insult."
 ita_dnc.2016.a: "He calls at the Quirinal and nowhere else."
 ita_dnc.2016.b: "Put the visit off."
 ita_dnc.2017.t: "The Visit Is Put Off"
 ita_dnc.2017.d: "The programme is withdrawn without a reason being printed, and both governments let it be understood that the season was unsuitable. The Secretariat is satisfied and says so to nobody.\n\nThe treaty of commerce that was to be signed during the visit goes back into the drawer."
 ita_dnc.2017.a: "Then we shall seek the Secretariat through the usual channel."
 ita_dnc.2017.b: "Let the season pass and say nothing."
 ita_dnc.2018.t: "The Note from the Secretariat"
 ita_dnc.2018.d: "The Secretariat of State has drawn up a protest at the reception of a Catholic sovereign in the palace of the Popes, and has to decide whether to publish it or hand it round the nunciatures alone. Published, it will be read everywhere as a declaration that the Roman Question is open again.\n\nOur intermediary is asking, very quietly, for the second course."
 ita_dnc.2018.a: "Publish the protest."
 ita_dnc.2018.b: "Circulate it privately."
 ita_dnc.2020.t: "The Congresses Are Dissolved"
 ita_dnc.2020.d: "The old congress movement has been dissolved from above, and the lay Catholics of the kingdom have no organisation left to belong to. The bishops want the Unions under their own hand; the priest who leads the democrats will not promise obedience; the old president wants his congresses back.\n\nWhichever is chosen will own the rural leagues, and with them a great part of the countryside."
 ita_dnc.2020.a: "The Unions, under the bishops."
 ita_dnc.2020.b: "The priest refuses obedience."
 ita_dnc.2020.c: "The old congresses survive."
 ita_dnc.2024.t: "The Bishops Are Asked to Judge"
 ita_dnc.2024.d: "The country goes to the urns, and the ban that keeps Catholics away from the poll has never been withdrawn in writing. The Curia can release its people widely, leave each bishop to judge his own constituency, or hold the ban where it is.\n\nThe returns will be read as the answer, whatever the answer is called."
 ita_dnc.2024.a: "Release them widely."
 ita_dnc.2024.b: "Let each bishop judge."
 ita_dnc.2024.c: "The ban holds."
 ita_dnc.2028.t: "The Encyclical Is Drafted"
 ita_dnc.2028.d: "The ban has been suspended constituency by constituency for years and has never been lifted on paper. A draft lies on the desk of the Secretariat which says that Catholics may vote when the good of society requires it, and that the bishops shall judge when it does.\n\nThe encyclical can go out as it stands, or it can go further and end the ban outright."
 ita_dnc.2028.a: "Let it go out as it stands."
 ita_dnc.2028.b: "Lift the ban outright."
 ita_dnc.2031.t: "The Pope Lets Them Vote"
 ita_dnc.2031.d: "The encyclical from beyond the Alps tells Catholics to go to the polls, and this ministry has spent the whole of its life teaching the country that clericalism is the enemy. The Italian government presents it as a domestic arrangement of no concern to us.\n\nWe can answer it from the tribune, or treat it as an Italian affair and say nothing."
 ita_dnc.2031.a: "Answer it from the tribune."
 ita_dnc.2031.b: "It is an Italian affair."
 ita_dnc.2032.t: "Rome Asks to Share the Protectorate"
 ita_dnc.2032.d: "The Catholics of the Albanian coast are ours to protect under an arrangement older than the Italian kingdom, and the schools that teach them are more Italian every year. Rome asks that the protectorate be held in common and the missions divided.\n\nTo share it is to be paid in goodwill on the Adriatic. To keep it is to keep the one title that makes the coast ours before it is anybody else's."
 ita_dnc.2032.a: "Share the protectorate."
 ita_dnc.2032.b: "The protectorate stays where it is."
 ita_dnc.2034.t: "The Congregation Chooses a Protector"
 ita_dnc.2034.d: "The question of who protects the Catholics of the eastern shore has gone to the Congregation, which has the old briefs on one side of the table and our missionaries on the other. It can confirm the protector it has confirmed for two centuries, or divide the charge.\n\nOur intermediary has been told that the Congregation reads the state of our own relations with the Holy See before it reads the briefs."
 ita_dnc.2034.a: "The old protector is confirmed."
 ita_dnc.2034.b: "The charge is divided."
 ita_dnc.2035.t: "Two Protectors"
 ita_dnc.2035.d: "The Catholics of our Albanian provinces have had one foreign protector for as long as the arrangement has existed, and are now to have two. Two protectors quarrelling in our vilayets are easier to govern than one that never quarrels.\n\nThe Porte can welcome the second, or note the change and say nothing at all."
 ita_dnc.2035.a: "Welcome the second protector."
 ita_dnc.2035.b: "Note it, and say nothing."
 ita_dnc.2036.t: "The Italian Bank Asks for Tripoli"
 ita_dnc.2036.d: "The Roman bank of the Catholic nobility has counters in Egypt and wants them at Tripoli and Benghazi, with the Italian government standing behind the request in writing. The money would build roads in a province that has none.\n\nIt would also give Rome a ledger of every debt in the vilayet. The concession can be granted, or held in the offices until the applicants tire of asking."
 ita_dnc.2036.a: "Grant the concession."
 ita_dnc.2036.b: "Hold it in the offices."
 ita_dnc.2038.t: "The Counters Stay Shut"
 ita_dnc.2038.d: "The concession has not been refused, which would have been an act; it has been sent from one office to another until the papers are too old to be read. The bank has money on the quay at Genoa and nowhere to land it.\n\nWe can open at the delta instead, where another power keeps the customs, or wait and let the file come round again."
 ita_dnc.2038.a: "Open at the delta instead."
 ita_dnc.2038.b: "Wait for the file to come round."
 ita_dnc.2039.t: "The Bank at Alexandria"
 ita_dnc.2039.d: "An Italian bank with Roman clerical money behind it is opening in Egypt and asks to be treated as any other house. The consul reports that it lends to the religious orders and to nobody who matters to us.\n\nIt can be left alone, which costs nothing, or kept off the list of banks the administration will deal with."
 ita_dnc.2039.a: "Leave them to it."
 ita_dnc.2039.b: "Keep them off the list."
 ita_dnc.2040.t: "Rome Asks to Protect Her Own Religious"
 ita_dnc.2040.d: "The friars, the hospitals and the schools of the Levant are Italian in every man and every brick, and are protected under a foreign flag by an arrangement made before Italy existed. Rome asks that the passports of her own religious be honoured as her own.\n\nThe old protector has just quarrelled with the Holy See. There will never be a better moment to divide the charge, nor a better moment to refuse."
 ita_dnc.2040.a: "Recognise the Italian protection."
 ita_dnc.2040.b: "The old protectorate covers them all."
 ita_dnc.2042.t: "The Friars Are Not Ours to Protect"
 ita_dnc.2042.d: "The answer is that the arrangement stands, that our religious are protected as they have been protected for three centuries, and that our consulates may address themselves to the older protector. Our schools go on teaching in Italian under another flag.\n\nWe shall pay for them out of our own estimates and say nothing about it."
 ita_dnc.2042.a: "Then we pay for them ourselves."
 ita_dnc.2042.b: "Let the consulates drop the charge and the friars answer to whoever pays them."
 ITA_v_tt_the_estimates_carry_the_schools: "The schools of the Levant are carried on our own estimates, and the Curia is told who pays the schoolmasters."
 ITA_v_tt_the_consulates_drop_the_charge: "The consulates stop making the case, the Italian schoolmasters are left to the older protector, and the newspapers at home say what they like about it."
 ita_dnc.2043.t: "The Protectorate Is Divided"
 ita_dnc.2043.d: "The Porte has recognised an Italian protection over Italian religious in the Levant, and a charge that has been ours alone since the Capitulations is a charge shared. The consuls report that the friars themselves asked for it.\n\nWe can protest at the Holy See, which will be reported in every capital, or let it pass as a matter of passports."
 ita_dnc.2043.a: "Protest at the Holy See."
 ita_dnc.2043.b: "Let it pass."
 ita_dnc.2044.t: "The Priest Is Suspended"
 ita_dnc.2044.d: "The priest who founded the democratic league has been suspended from his orders, and the radicals of his province are preparing to send him to the Chamber with their own votes. The ministry can leave the discipline to the Church, or seat him and protect the league he made.\n\nOur intermediary says plainly that the second course closes the private channel."
 ita_dnc.2044.a: "Leave him to the discipline of the Church."
 ita_dnc.2044.b: "Seat him, and protect the league."
 ITADNC_e_light_the_cities_first: "Light the Cities First"
 ITADNC_e_light_the_cities_first_desc: "The current is made in the mountains and the capital still lights its ministries by gas. We shall carry the line into Rome before the looms, and build a civilian works and better roads in Lazio with it."
 ITADNC_e_ansaldo_at_sampierdarena: "Ansaldo at Sampierdarena"
 ITADNC_e_ansaldo_at_sampierdarena_desc: "The yard on the Polcevera casts boilers, guns and locomotives and is short of orders. We shall place the state's work there and raise a military factory in Liguria."
 ITADNC_e_the_bank_of_italy: "The Bank of Italy"
 ITADNC_e_the_bank_of_italy_desc: "The note issue is shared between rival houses and the last crash cost us a ministry. We shall put one bank above the others, give its director his head and build faster for it."
 ITADNC_e_the_simplon: "The Simplon"
 ITADNC_e_the_simplon_desc: "The longest bore in Europe is being driven under the Alps and its far portal is not ours. We shall finish our half of the works and settle the traffic with Bern."
 ITADNC_e_the_milan_exposition: "The Milan Exposition"
 ITADNC_e_the_milan_exposition_desc: "The exposition of transport opens under the new tunnel and every maker in the north wants a hall. We shall pay for the electrical pavilion and take the industrial research out of it."
 ITADNC_e_the_genoa_harbour: "The Genoa Harbour"
 ITADNC_e_the_genoa_harbour_desc: "Genoa loads more than any other port of the kingdom and its moles were built for sail. We shall deepen the basins and add a dockyard to the harbour."
 ITADNC_e_the_direttissima: "The Direttissima"
 ITADNC_e_the_direttissima_desc: "The mail to Naples still climbs the old line through the hills and loses a day doing it. We shall cut the direct road through and improve the rails at both ends of it."
 ITADNC_e_the_map_of_the_fever: "The Map of the Fever"
 ITADNC_e_the_map_of_the_fever_desc: "Malaria empties the harvest fields of the south every summer and the state has never counted the sick. We shall map the fever and sell quinine at the state's price in every commune."
 ITADNC_e_the_ground_that_is_drained: "The Ground That Is Drained"
 ITADNC_e_the_ground_that_is_drained_desc: "The marshes of Apulia and the Volturno swallow more land than this kingdom can spare. We shall drain them and carry new roads across the ground we win."
 ITADNC_e_the_apulian_aqueduct: "The Apulian Aqueduct"
 ITADNC_e_the_apulian_aqueduct_desc: "Apulia has stone, olives and no water, and its towns buy what they drink from carts. We shall bring the spring across the mountains and build the works the water makes possible."
 ITADNC_e_the_sulphur_of_sicily: "The Sulphur of Sicily"
 ITADNC_e_the_sulphur_of_sicily_desc: "Sicilian sulphur is dug by hand and sold by a consortium that fixes the price against us. We shall take the trade in hand and put a civilian works on the island."
 ITADNC_e_the_children_in_the_mines: "The Children in the Mines"
 ITADNC_e_the_children_in_the_mines_desc: "The carriers in the sulphur pits are boys, and the inspectors we send are not let underground. We shall put the children out of the mines and answer for what it costs the owners."
 ITADNC_e_the_calabria_law: "The Calabria Law"
 ITADNC_e_the_calabria_law_desc: "Calabria has no road a loaded cart can keep to and the last shock took what roads there were. We shall vote the special law and rebuild the province's roads with it."
 ITADNC_e_messina_rebuilt: "Messina Rebuilt"
 ITADNC_e_messina_rebuilt_desc: "The city on the strait is rubble and its people are living in the goods yards. We shall rebuild Messina to a code that will stand, and give the island back the works it lost."
 ITADNC_e_the_remittances: "The Remittances"
 ITADNC_e_the_remittances_desc: "Our people abroad send home more money than the customs collect, and it goes into land and mattresses. We shall bank the remittances and put them into a factory in the south."
 ITADNC_e_the_third_class_deck: "The Third-Class Deck"
 ITADNC_e_the_third_class_deck_desc: "Our emigrants cross in foreign bottoms, on decks our consuls are not allowed to inspect. We shall carry them in our own ships and add the hulls to the merchant fleet."
 ITADNC_arm_seniority_is_kept: "Seniority Is Kept"
 ITADNC_arm_seniority_is_kept_desc: "The promotion list is read by date of commission and the colonels who came back from Africa are content with it. We shall keep the seniority list as it stands and buy the quiet of the officer corps."
 ITADNC_arm_promotion_by_merit: "Promotion by Merit"
 ITADNC_arm_promotion_by_merit_desc: "Most of the majors of this army will never command anything and the list will not let them go. We shall promote by examination and let the staff college make the choice."
 ITADNC_arm_two_years_with_the_colours: "Two Years with the Colours"
 ITADNC_arm_two_years_with_the_colours_desc: "The conscript costs us his keep and the fields he is not working, and the Chamber counts both. We shall shorten the service, take more of the class and send the men home sooner."
 ITADNC_arm_three_years_with_the_colours: "Three Years with the Colours"
 ITADNC_arm_three_years_with_the_colours_desc: "A soldier who has learned his trade is worth the harvest he did not bring in. We shall keep the class with the colours longer and drill it until it is an army."
 ITADNC_arm_the_deport_licence: "The Déport Licence"
 ITADNC_arm_the_deport_licence_desc: "There is a field gun that recoils on its own carriage, and the licence to build it can be had. We shall cast the gun in our own arsenals and take the artillery study with it."
 ITADNC_arm_the_krupp_contract: "The Krupp Contract"
 ITADNC_arm_the_krupp_contract_desc: "Essen will sell us finished batteries tomorrow and our arsenals cannot cast them before the next class comes up. We shall buy the guns abroad, take delivery at once and let our ally read the order as loyalty."
 ITADNC_arm_the_expedition_plan: "The Expedition Plan"
 ITADNC_arm_the_expedition_plan_desc: "There is no plan in the ministry for putting a corps ashore on the African coast and no establishment for the troops that would do it. We shall write the plan, raise the expeditionary corps and study the landing."
 ITADNC_arm_the_recruit_who_cannot_read: "The Recruit Who Cannot Read"
 ITADNC_arm_the_recruit_who_cannot_read_desc: "Much of the class that answers the call cannot read the orders pinned on the barrack door. We shall take them anyway and carry the cost in the time it takes to make soldiers of them."
 ITADNC_arm_the_regimental_primer: "The Regimental Primer"
 ITADNC_arm_the_regimental_primer_desc: "The regiment keeps the recruit for a season and nobody has thought to teach him his letters there. We shall put a school in every depot and train the class faster for it."
 ITADNC_arm_the_war_school_at_turin: "The War School at Turin"
 ITADNC_arm_the_war_school_at_turin_desc: "The staff school takes the officers the regiments can spare and teaches them the last war. We shall rebuild the course at Turin and pay for it in doctrine and experience."
 ITADNC_arm_the_quick_firing_batteries: "The Quick-Firing Batteries"
 ITADNC_arm_the_quick_firing_batteries_desc: "Our field batteries must be laid again after every round while other armies keep the sight on the target. We shall re-equip the divisional artillery and drill it to fire as fast as it can load."
 ITADNC_arm_the_machine_gun: "The Machine Gun"
 ITADNC_arm_the_machine_gun_desc: "A gunsmith in Turin has built an automatic gun and the ministry has ordered a handful for trials. We shall order the guns in quantity and give the battalions their support weapons."
 ITADNC_arm_the_bersaglieri_cyclists: "The Bersaglieri Cyclists"
 ITADNC_arm_the_bersaglieri_cyclists_desc: "The plumed battalions still run to the front, and the roads of the north will now carry a bicycle. We shall mount them on wheels and use them to find the enemy first."
 ITADNC_arm_the_army_out_of_the_streets: "The Army Out of the Streets"
 ITADNC_arm_the_army_out_of_the_streets_desc: "Every strike ends with a prefect asking for a battalion and a battalion firing on a crowd. We shall take the army out of public order and let it be an army again."
 ITADNC_arm_the_mobile_squadrons: "The Mobile Squadrons"
 ITADNC_arm_the_mobile_squadrons_desc: "The prefects will go on asking for troops as long as they have nothing else to send. We shall raise mobile squadrons of carabinieri and let the crowd meet them instead."
 ITADNC_arm_plan_west: "Plan West"
 ITADNC_arm_plan_west_desc: "The staff has drawn one plan and it faces the wrong mountains if Paris is the enemy. We shall write the western plan, fortify the Riviera and open the war plans to the ministry."
 ITADNC_n_the_high_seas_school: "The High Seas School"
 ITADNC_n_the_high_seas_school_desc: "The admiralty is split between the men who want a battle fleet and the men who want the narrow sea. We shall build for the open Mediterranean and let the capital ships have the estimates."
 ITADNC_n_the_narrow_sea_school: "The Narrow Sea School"
 ITADNC_n_the_narrow_sea_school_desc: "A battle fleet we cannot pay for will be sunk by one we cannot match. We shall build torpedo craft and submarines for the narrow waters and let the battleships wait."
 ITADNC_n_the_regina_elena: "The Regina Elena"
 ITADNC_n_the_regina_elena_desc: "Our own designer has drawn a fast battleship and the estimates will just carry her. We shall lay down the class and take the experience of building her."
 ITADNC_n_the_terni_plate: "The Terni Plate"
 ITADNC_n_the_terni_plate_desc: "The armour for our hulls is rolled at Terni at a price the admiralty calls a scandal. We shall keep the mill alive, take its plate and add a military works to Umbria."
 ITADNC_n_the_sheffield_contract: "The Sheffield Contract"
 ITADNC_n_the_sheffield_contract_desc: "English plate is better than ours and cheaper, and buying it will idle a mill at home. We shall place the armour contract abroad and take the drawings that come with it."
 ITADNC_n_the_maddalena_base: "The Maddalena Base"
 ITADNC_n_the_maddalena_base_desc: "The island roadstead watches the strait a French fleet would have to use, and it has no works. We shall build the naval base at La Maddalena and give a squadron a home there."
 ITADNC_n_the_coal_of_cardiff: "The Coal of Cardiff"
 ITADNC_n_the_coal_of_cardiff_desc: "Every ton our boilers burn is bought abroad and carried to us in other men's bottoms. We shall contract for Welsh steam coal and run our convoys on it."
 ITADNC_n_the_landing_is_rehearsed: "The Landing Is Rehearsed"
 ITADNC_n_the_landing_is_rehearsed_desc: "No squadron of ours has ever put a brigade ashore against a defended beach. We shall rehearse the landing with a flotilla of transports and let the exercise be seen from the other shore."
 ITADNC_n_the_naval_flying_service: "The Naval Flying Service"
 ITADNC_n_the_naval_flying_service_desc: "An officer of ours has flown a machine off the lagoon and the fleet has no use for him yet. We shall give the navy its own flying station and let him teach there."
 ita_dnc.410.t: "Who Holds the Order"
 ita_dnc.410.d: "The Statuto gives the army to the King, the estimates to the Chamber and the operations order to nobody in particular. The chief of staff, the Minister of War and the senior commanders each read the regulation to mean that the pen is theirs. The question will not wait for a war to settle it, and whoever signs will shape the campaign we fight."
 ita_dnc.410.a: "The chief of staff signs alone."
 ita_dnc.410.b: "The Minister of War countersigns every order."
 ita_dnc.410.c: "The men who will fight write their own orders."
 ITA_arm_spingardi_holds_the_order: "Spingardi Holds the Order"
