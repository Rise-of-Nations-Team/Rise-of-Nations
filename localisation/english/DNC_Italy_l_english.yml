 ita_dnc.3050.t: "The Rendita Falls Due"
 ita_dnc.3050.d: "A year of extraordinary estimates has come due. The Treasury has to roll over what the war budget borrowed, and the Minister wants to know how the Kingdom means to pay for it."
 ita_dnc.3050.a: "Raise the consumption duties."
 ita_dnc.3050.b: "Convert the rendita to a lower rate."
 ita_dnc.3050.c: "Borrow in Paris."
 ita_dnc.3050.e: "Carry the debt another year."
 ITA_e_the_rendita_converted_tt: "§GThe service of the debt grows more slowly from now on.§!"
 ITA_e_the_paris_loan_tt: "§RThe Paris loan must be served too: the service of the debt grows faster from now on.§!"
 ITA_e_the_debt_carried_tt: "Nothing changes, and the debt keeps growing."
 ita_dnc.3051.t: "The Treasury Cannot Pay"
 ita_dnc.3051.d: "The service of the debt now takes all of the ordinary revenue. The Minister of the Treasury says the extraordinary estimates must stop now, or the Kingdom must learn to live on credit it no longer has."
 ita_dnc.3051.a: "Stop the extraordinary estimates."
 ita_dnc.3051.b: "The works must go on."
 ITA_e_the_wall_carried_tt: "§RThe penalties of the wall stay, and the Treasury will ask again in half a year.§!"
