 ITA_arm_mobilization_tt: " Mobilisation Speed: $RIGHT|+=%1$"
 ITA_arm_the_new_army: "The Army of the Kingdom"
 ITA_arm_the_new_army_desc: "This is what the reforms after the defeat have made of our army. Every measure taken in the army branch is added here, and more will follow."
 ITA_arm_the_sbarramenti: "The Alpine Barrages"
 ITA_arm_the_sbarramenti_desc: "The barrages of the Cadore, the Agordino and the Valsugana are under construction. The engineers are working the passes while the season allows."
 ITA_arm_the_camp_of_instruction: "The Camp of Instruction"
 ITA_arm_the_camp_of_instruction_desc: "Two armies are in the field against each other for the manoeuvre season, and the ministry is paying for every day of it."
 ita_dnc.2900.t: "The Operations Office"
 ita_dnc.2900.d: "The Supreme Command has been told to draw up its war plans, and now it wants an office to do the work. It asks for a standing bureau with its own draughtsmen and its own line in the estimates.\n\nThe Treasury answers that a bureau paid for every year is a bureau that never reports. We must decide what the office is to be given."
 ita_dnc.2900.a: "Give the office a standing staff and a line in the estimates."
 ita_dnc.2900.b: "Let the office work on what the estimates already allow."
 ita_dnc.2901.t: "The Arsenals Wait"
 ita_dnc.2901.d: "The State arsenals and construction works have been told to hold their orders until the estimates are read again. The men in them are not paid to wait.\n\nTheir delegates went to the ministry, and the ministry has sent them on to us. Whatever we say now will be repeated in every yard in the Kingdom within the week."
 ita_dnc.2901.a: "Find them the work out of the ordinary vote."
 ita_dnc.2901.b: "Make them wait for the reading of the estimates."
 ITADNC_air_the_specialist_brigade: "The Specialist Brigade"
 ITADNC_air_the_specialist_brigade_desc: "Our balloons belong to a corps that also digs trenches and strings telegraph wire. We will raise a specialist brigade, give Maurizio Moris the air section, and let it order its own equipment."
 ITADNC_air_the_aerostatic_companies: "The Balloon Companies"
 ITADNC_air_the_aerostatic_companies_desc: "Our captive balloons go out with the great manoeuvres, hang above the gun line for a morning, and then go back into the fortress stores. We must make the balloon companies permanent units, with their own gas, drivers and winches."
 ITADNC_air_the_yard_at_vigna_di_valle: "The Lake Airship Yard"
 ITADNC_air_the_yard_at_vigna_di_valle_desc: "Lake Bracciano offers sheltered water, level ground and room for a shed, and no other site will do for airship trials. We will open our experimental yard at Vigna di Valle and watch our airships fly."
 ITADNC_air_the_dirigible_of_schio: "The Gift Airship"
 ITADNC_air_the_dirigible_of_schio_desc: "Almerico da Schio built an airship with his own money and offered it to us, and the ministry said no. We will accept the gift now, bring it into our shed, and pay the men who know how it was made."
 ITADNC_air_the_wireless_aloft: "The Wireless Aloft"
 ITADNC_air_the_wireless_aloft_desc: "An airship that sees the enemy and cannot report it is worth no more than a cavalry patrol. We must put a wireless set and a trained operator in every car we send up. The ground stations must be taught to take down what they send."
 ITADNC_air_the_directorate: "The Air Directorate"
 ITADNC_air_the_directorate_desc: "Flying belongs to the Engineers, who care about bridges and roads first. We will carve out a directorate of aeronautics with its own money, schools and yards."
 ITADNC_air_the_school_of_the_eye: "The School of Observation"
 ITADNC_air_the_school_of_the_eye_desc: "The staff will grant the flying machine one duty only: to see for the guns and report what it sees. We must teach observation and the correction of fire, until the balloon and the airship are the eyes of the artillery and of the fleet."
 ITADNC_air_the_school_of_the_airship: "The School of the Airship"
 ITADNC_air_the_school_of_the_airship_desc: "The semi-rigid airship of Crocco and Ricaldoni has come up over Rome, and Forlanini has flown his own above Milan. We must train airship crews in numbers, keep both designs alive, and build the sheds that will hold what they fly."
 ITADNC_air_the_school_of_the_bomb: "The School of the Bomb"
 ITADNC_air_the_school_of_the_bomb_desc: "Officers write that an aeroplane carrying explosives is worth more than one that only watches, and the ministry will not listen. We will teach bombing, order bombs and sights, and test them on our own ground."
 ITADNC_air_the_defence_of_the_kingdom: "The Defence of the Sky"
 ITADNC_air_the_defence_of_the_kingdom_desc: "The Engineers have written that our cities can be reached from the sky, and nobody will pay for an answer. We will plan our air defence, name the cities to protect, and buy guns that can aim at a flying machine."
 ITADNC_air_the_sheds_on_the_far_shore: "The Sheds Across the Adriatic"
 ITADNC_air_the_sheds_on_the_far_shore_desc: "An airship that must return to the lagoon each night can watch only the mouth of the Adriatic. Our staff wants sheds on the eastern shore, and we will survey the ground while the question is still ours to decide."
 ITADNC_air_the_night_and_the_beam: "Night Flying"
 ITADNC_air_the_night_and_the_beam_desc: "Men have flown from Vigna di Valle after dark with a searchlight following them, and nobody recorded what they learned. We will make night flying a proper programme and find out what the dark costs us."
 ITADNC_air_the_circuit_at_brescia: "The Brescia Air Meet"
 ITADNC_air_the_circuit_at_brescia_desc: "Every maker in Europe will fly at the Brescia meeting, and our workshops will either be there or be seen to be absent. We will go with money in hand and buy from the firms whose machines finish the course."
 ITADNC_n_the_ideal_battleship: "The Ideal Battleship"
 ITADNC_n_the_ideal_battleship_desc: "Cuniberti has drawn a ship with a single calibre of gun that outranges everything afloat, and our budget cannot pay for her. We will keep the drawings, let him publish abroad, and set our office on the next hull."
 ITADNC_n_the_yards_of_the_kingdom: "The Yards of the Kingdom"
 ITADNC_n_the_yards_of_the_kingdom_desc: "Our state yards at La Spezia, Venice, Castellammare and Taranto stand half idle between votes. We will keep them in steady work, widen their docks, and let private yards build alongside them."
 ITADNC_n_the_fleet_of_battle: "The Fleet of Battle"
 ITADNC_n_the_fleet_of_battle_desc: "Masdea's ships at Castellammare are the fastest big ships afloat. Scattered between four seas, they are worth nothing. We shall build the line of battle and keep it together, and the navy will stop being a squadron of raiders."
 ITA_air_the_specialist_brigade_tt: "The army's air section is put under the Specialist Brigade, and every field, works and school after it is raised there."
 ITA_air_the_field_at_centocelle_tt: "Calderara and Savoia take the first pilot's licences, and the field outside Rome becomes our first flying ground."
 ITA_air_the_aerostatic_companies_tt: "The balloon companies get a standing strength of their own, and the Engineers stop borrowing them back from the fortresses."
 ITA_air_the_yard_at_vigna_di_valle_tt: "The experimental works on the lake takes the trials, the drawing office and the gas plant under one roof."
 ITA_air_the_wireless_aloft_tt: "Every airship that goes up carries a wireless set, and the ground stations are trained to take down what it sends."
 ITA_air_the_directorate_tt: "Aeronautics leaves the Engineers and votes its own money bill. We cannot take it at all once the prefects have been instructed."
 ITA_air_the_school_of_the_eye_tt: "The observers come out able to direct the guns from the air and to report for the fleet."
 ITA_air_the_school_of_the_airship_tt: "Airship crews are trained in numbers, and both our semi-rigid hulls and Forlanini's keep their place in the service."
 ITA_air_the_school_of_the_bomb_tt: "The school teaches bombing and bomb-sights, and the Ministry at last buys the bombs it has always refused."
 ITA_air_the_seaplane_station_tt: "A seaplane station opens on water the fleet already holds, with a slipway, a crane and moorings for the machines."
 ITA_air_the_defence_of_the_kingdom_tt: "Guarding the sky over the kingdom becomes the Ministry's own charge, and the first batteries go up over our cities."
 ITA_air_the_orders_of_the_ministry_tt: "Types, numbers and delivery dates are fixed in advance, so a maker can build a shop knowing we shall keep buying."
 ITA_air_the_sheds_on_the_far_shore_tt: "The ground and the moorings on the far shore of the Adriatic are surveyed, and the sheds are drawn before anyone else asks."
 ITA_air_the_memoranda_of_douhet_tt: "Douhet's memoranda are read to the end and answered in print, and the staff has to argue about war in the air."
 ITA_air_the_engine_that_is_ours_tt: "The motor works of Turin and Milan take the aero engine contracts, and the French licence is no longer our only offer."
 ITA_air_the_circuit_at_brescia_tt: "The Ministry orders at the meeting from the firms whose machines finish the course, and those workshops keep the work."
 ITA_n_the_naval_estimates_tt: "The navy must say what it means to buy before the Chamber votes, and the money is voted against a programme and not a single hull."
 ITA_n_the_ideal_battleship_tt: "The design office holds the all-big-gun drawings, and what we refuse to build is printed where it will be read."
 ITA_n_the_ideal_battleship_lock_tt: "The war on trade is untaken, or the flotillas have already been unleashed."
 ITA_n_the_yards_of_the_kingdom_tt: "The state yards are kept in work between votes, and their docks are enlarged for the hulls we mean to lay."
 ITA_n_the_naval_flying_service_tt: "The fleet gets its own flying station and its own observers. Completing the fleet of battle shuts this door for good."
 ITA_n_the_dante_alighieri_tt: "The first dreadnought of our own design is laid down at Castellammare. Completing the fleet of battle shuts this door for good."
 ITA_n_the_fleet_of_battle_tt: "The high seas school is settled, and our fleet will be able to cover a landing abroad. The flying service and the Dante are closed to us."
 ITA_air_the_wireless_aloft_ns: "Wireless Aloft"
 ITA_air_the_defence_of_the_kingdom_ns: "The Defence of the Kingdom"
 ITA_air_the_sheds_on_the_far_shore_ns: "Sheds on the Far Shore"
 ITA_air_the_night_and_the_beam_ns: "Night Flying"
 ITA_air_the_memoranda_of_douhet_ns: "Douhet's Papers"
 ITADNC_n_the_war_on_trade: "The War on Trade"
 ITADNC_n_the_war_on_trade_desc: "The Rivista Marittima, the navy's own review, has argued for a decade that a poor fleet sinks cargoes and does not seek battle. We shall fit ours out for the war on trade and leave the line of battle to the powers who can pay for one."
 ITADNC_n_the_naval_staff: "The Naval Staff"
 ITADNC_n_the_naval_staff_desc: "Every squadron sails to an order written in the minister's own hand. Nobody at the navy ministry keeps a war plan from one government to the next. We shall raise a naval staff by royal decree and let sailors plan the war at sea."
 ITADNC_n_the_landing_companies: "The Landing Companies"
 ITADNC_n_the_landing_companies_desc: "The landing companies of the cruiser Elba held the legations at Peking, and the first men ashore in the ruins of Messina were ours. We shall train them properly, so the fleet can put a battalion on any beach it can reach."
 ITADNC_n_the_bases_beyond_the_strait: "The Bases Beyond the Strait"
 ITADNC_n_the_bases_beyond_the_strait_desc: "The arsenal and the dry dock at Taranto stand open and empty. The squadron still winters in the Tyrrhenian, where the weather is kinder. We shall move it into the lower Adriatic and keep the fleet where the war will be."
 ITADNC_n_the_adriatic_is_ours: "The Adriatic Is Ours"
 ITADNC_n_the_adriatic_is_ours_desc: "From Venice to Otranto our shore is low and has no shelter. Theirs is a wall of islands, with Pola, Sebenico and the Bocche behind it. We shall take a hold on the far side, and the Adriatic will have two coasts at last."
 ITADNC_n_the_middle_sea: "The Middle Sea"
 ITADNC_n_the_middle_sea_desc: "The Lega Navale, the navy league, has taught a generation to call this water ours. The fleet can at last say the same without embarrassment. We shall hold the middle sea, and no squadron will cross it against our will."
 ITADNC_n_the_cruiser_squadron: "The Cruiser Squadron"
 ITADNC_n_the_cruiser_squadron_desc: "Ansaldo has laid down 10 Garibaldi hulls and sold seven of them abroad. The three we kept are the best ships we have. We shall order the rest for ourselves and pay for the yard that can build more."
 ITADNC_n_the_armoured_raiders: "The Armoured Raiders"
 ITADNC_n_the_armoured_raiders_desc: "The armoured cruisers we design for foreign buyers are built for the trade routes, not for the line of battle. We shall arm our own to the same drawings and send them where the cargoes are."
 ITADNC_n_the_flotilla_at_night: "The Flotilla at Night"
 ITADNC_n_the_flotilla_at_night_desc: "The Lampo and Nembo boats can cross the Adriatic between dusk and dawn. The Whitehead works at Fiume sells us its torpedo under licence. We shall drill the flotillas for night work and buy torpedoes by the hundred."
 ITADNC_n_the_submarine_flotilla: "The Submarine Flotilla"
 ITADNC_n_the_submarine_flotilla_desc: "Laurenti has drawn the Glauco boats. Pullino's Delfino has proved a double hull that foreign yards already want under licence. We shall build the flotilla for ourselves before we sell the drawings abroad."
 ITADNC_n_the_flotilla_unleashed: "The Flotilla Unleashed"
 ITADNC_n_the_flotilla_unleashed_desc: "The reviews have argued the war on trade with every restriction attached to it, and the restrictions are what make it useless. We shall let the flotillas take a cargo wherever they find one, and answer for it afterwards."
 ITADNC_e_the_extraordinary_estimates: "The Special Budget"
 ITADNC_e_the_extraordinary_estimates_desc: "The ordinary budget closes in surplus every year, and it pays for nothing a war would need. We shall vote a second budget beside it, and the war and navy ministries will spend out of that."
 ITADNC_e_the_tariff_kept: "The Tariff Kept"
 ITADNC_e_the_tariff_kept_desc: "The South asks us to open the tariff. The ironmasters of the North ask us to keep it whole. We shall keep it whole, and our mills will have the home market to themselves."
 ITADNC_e_the_consumption_duties: "The Consumption Duties"
 ITADNC_e_the_consumption_duties_desc: "The duties are collected at the gate of every city. The poor pay them on bread, salt and oil before they pay anything else. We shall press them harder to hold the estimates, and the towns will know who is taking the money."
 ITADNC_e_the_steel_consortium: "The Steel Cartel"
 ITADNC_e_the_steel_consortium_desc: "Elba, Ilva, Terni and Piombino bid against one another for the same ore, and then for the same state order. We shall bring them under one agreement, and the kingdom will have a steel industry instead of four foundries."
 ITADNC_e_the_industries_of_the_colonies: "The Industries of the Colonies"
 ITADNC_e_the_industries_of_the_colonies_desc: "The Benadir Company has run the coast at a loss, and asks the Treasury to cover the deficit once again. We shall buy the company out and work the colonies as an estate of the kingdom."
 ITADNC_e_the_current_instead_of_coal: "Water Power Instead of Coal"
 ITADNC_e_the_current_instead_of_coal_desc: "Nine tenths of our coal crosses the sea from Cardiff, while the Alps run white water all year for nothing. We shall build power stations on the rivers instead, and let water carry what the coal cannot."
 ITADNC_e_the_sulcis_pits: "The Sardinian Mines"
 ITADNC_e_the_sulcis_pits_desc: "The seams at Bacu Abis are thin and the coal is poor. The press calls it national coal all the same. We shall open the Sulcis pits, because a bad mine at home outlasts a good one behind a blockade."
 ITADNC_e_the_electric_furnace: "The Electric Furnace"
 ITADNC_e_the_electric_furnace_desc: "Stassano has patented a furnace that makes steel from electricity and scrap, without a ton of coke. We shall set his furnaces to work at Turin and cast the steel our blast furnaces cannot."
 ITADNC_e_the_kingdom_supplies_itself: "The Kingdom Supplies Itself"
 ITADNC_e_the_kingdom_supplies_itself_desc: "The pits, the furnaces and the colonies now give what the extraordinary estimates promised, and the bills drawn against them can be paid. We shall clear the debt, and the kingdom will owe nothing for what it has built."
 ITADNC_e_the_estimates_raised: "The Estimates Raised"
 ITADNC_e_the_estimates_raised_desc: "The Chamber has voted the naval programme, and the War Ministry now asks for as much again. We shall raise the army estimates beside the navy's, and let the orders follow out of the ministries."
 ITADNC_e_the_orders_are_concentrated: "The Orders Are Concentrated"
 ITADNC_e_the_orders_are_concentrated_desc: "Every corps command buys its own stores, and the Treasury learns the total only when the bills arrive. We shall put every military order in one book, and the arsenals will know what they are building."
 ITADNC_e_the_programme_of_construction: "The Programme of Construction"
 ITADNC_e_the_programme_of_construction_desc: "The naval programme is voted, and the armour for it must come from Terni under an English licence. We shall lay the hulls down at once and let the plate follow out of the rolling mill."
 ITADNC_e_the_council_of_supply: "The Council of Supply"
 ITADNC_e_the_council_of_supply_desc: "The ministries bid against one another for the same steel, the same rails and the same men. The war has made that bidding ruinous. We shall put one council over the supply of the kingdom, and no ministry will order outside it."
 ITADNC_e_the_undersecretariat_of_arms: "The Arms Office"
 ITADNC_e_the_undersecretariat_of_arms_desc: "The arsenals answer to the War Ministry and the yards to the navy, and nobody answers for the cartridge. We shall set up one office for arms and munitions, and give it the whole business."
 ITADNC_e_the_unified_types: "The Standard Patterns"
 ITADNC_e_the_unified_types_desc: "The army carries three rifles, the batteries fire four different cartridges, and the depots sort them by hand. We shall settle on one rifle, one gun and one cartridge, and every works in the kingdom will make them."
 ITADNC_e_the_whole_kingdom_mobilised: "The Whole Kingdom Mobilised"
 ITADNC_e_the_whole_kingdom_mobilised_desc: "Nothing has prepared the country to put its whole industry under the War Ministry. The war will not wait for us to learn. We shall mobilise the kingdom entire, and the works that made ploughs will make shells."
 ITA_n_the_narrow_sea_school_tt: "§Y$ITADNC_n_the_ideal_battleship$§! stays closed until §Y$ITADNC_n_the_flotilla_unleashed$§! is completed. The narrow sea school is settled, and our fleet will be held to the middle sea."
 ITA_n_the_squadron_moves_south_tt: "Every core coastal state that already keeps a §Y$naval_base$§!: add §G1§! §Y$naval_base$§!."
 ITA_n_an_island_beyond_otranto_tt: "§Y[ROOT.GetName]§! or an Italian subject fully controls an island beyond the Strait of Otranto"
 ITA_n_the_coast_that_answers_tt: "Every core coastal state: add §G1§! §Y$coastal_bunker$§!."
 ITA_n_the_line_school_opens_tt: "§Y$ITADNC_n_the_ideal_battleship$§! is open again."
 ITA_e_rendita_risen_tt: "The §Yservice of the debt§! grows heavier, and stands at §R[?ITA_e_rendita|%0]§!."
 ITA_e_the_treasury_goes_to_war_tt: "§RRemove§! §Y$ITA_e_the_consolidated_five_per_cent$§!. Gain §Y$ITA_e_the_war_treasury$§!, and the balanced budget is closed to us."
 ITA_e_the_drift_is_slowed_tt: "§GReduce§! the monthly growth of the §Yservice of the debt§! by §Y0.5%§!."
 ITA_e_the_debt_is_cleared_tt: "§RRemove§! §Y$ITA_e_the_war_treasury$§!. Gain §Y$ITA_e_the_kingdom_solvent_mod$§!, and the §Yservice of the debt§! falls to §G0%§!."
 ITA_e_the_tariff_holds_tt: "§RLock§! §Y$free_trade$§! and §Y$export_focus$§!. Gain §Y$closed_economy$§!."
 ITA_e_the_law_that_follows_tt: "If we already have §Y$partial_economic_mobilisation$§! and the country wants the war, the Economy Law becomes §Y$war_economy$§!."
 ITA_e_the_whole_kingdom_mobilised_tt: "§RRemove§! the standing Economy Law. Gain §Y$tot_economic_mobilisation$§!."
 ITA_n_the_staff_of_the_marine: "The Naval Staff"
 ITA_n_the_staff_of_the_marine_improved: "The Naval Staff Reformed"
 ITA_n_the_night_flotillas: "The Night Flotillas"
 ITA_n_the_glauco_boats: "The Glauco Boats"
 ITA_n_the_guerre_de_course: "The War on Trade"
 ITA_n_the_guerre_de_course_desc: "Our cruisers and flotillas are fitted to hunt cargoes, not to hold a line. The line of battle has been let go."
 ITA_n_mare_nostrum: "Mare Nostrum"
 ITA_n_mare_nostrum_desc: "The fleet keeps the middle sea from the Bocche to the Sicilian narrows. The Lega Navale, the navy league, has taught the country to call that water ours."
 ITA_e_the_tariff_of_eighty_seven: "The Protective Tariff"
 ITA_e_the_tariff_of_eighty_seven_desc: "The tariff stands as it was written, and our mills have the home market to themselves. Building is faster and the factories run fuller. The countries we shut out have noticed, and they think less of us as a trading partner."
 ITA_e_the_unified_types: "One Rifle, One Gun, One Cartridge"
 ITA_e_the_kingdom_in_arms: "The Kingdom in Arms"
 ITADNC_e_the_pareggio: "The Budget in Balance"
 ITADNC_e_the_pareggio_desc: "Years of extraordinary estimates have left the kingdom paying its creditors before it pays its own people. We shall close the second budget and meet the interest out of ordinary revenue. The country will grow before the army does."
 ITADNC_e_the_lira_at_par: "The Lira at Par"
 ITADNC_e_the_lira_at_par_desc: "Our paper money is taken abroad at a discount, and every cargo we buy costs more for it. Our first step out of trouble is to make the lira worth abroad what it is worth at home."
 ITADNC_e_the_sgravi: "Relief from the Taxes"
 ITADNC_e_the_sgravi_desc: "The consumption taxes have grown heavier every year that the estimates have grown. Lifting part of them will cost the Treasury for a season. Our people must be left more of their own money to spend."
 ITADNC_e_the_duty_on_bread_repealed: "Repeal the Duty on Bread"
 ITADNC_e_the_duty_on_bread_repealed_desc: "The duty on foreign grain was laid to shelter our landowners, and it has stayed to feed the Treasury. It is paid at the baker's door in every town of the South. We shall strike it from the tariff and let bread find its own price."
 ITADNC_e_the_commercial_treaties: "The Commercial Treaties"
 ITADNC_e_the_commercial_treaties_desc: "If our people are to thrive, we must sell abroad what we grow and buy abroad what we cannot dig. We shall sign new treaties of commerce with our neighbours, written on terms that suit us."
 ITADNC_e_the_workmens_houses: "Houses for the Working People"
 ITADNC_e_the_workmens_houses_desc: "The men who fill our new works sleep in courtyards no inspector will enter. We shall charter societies to build them decent lodgings, and make Milan and Genoa cities we can show a visitor."
 ITADNC_e_the_boards_of_conciliation: "The Boards of Conciliation"
 ITADNC_e_the_boards_of_conciliation_desc: "Every dispute in our works ends in the street, because there is no room where it can end otherwise. We shall seat masters and men at the same table, before a prefect has to send the troops."
 ITADNC_e_the_industrial_triangle: "The Industrial Triangle"
 ITADNC_e_the_industrial_triangle_desc: "Turin, Milan and Genoa now make more between them than the rest of the kingdom together. We shall put our money into the triangle and be known abroad for what comes out of it."
 ITADNC_e_the_ilva_at_piombino: "The Coastal Steelworks"
 ITADNC_e_the_ilva_at_piombino_desc: "The ore of Elba is shipped abroad and comes back as rails we pay for twice. We shall charter a company to smelt it on our own shore, and the furnaces will stand at Piombino."
 ITADNC_e_the_land_reclaimed: "The Land Reclaimed"
 ITADNC_e_the_land_reclaimed_desc: "Half the plain of the kingdom is marsh. The men who might work it are on the quay at Genoa with a ticket in their hand. We shall drain the land, put a road through it, and teach the men who stay."
 ITADNC_e_the_cities_that_swell: "The Cities That Swell"
 ITADNC_e_the_cities_that_swell_desc: "The machines we have put in the fields have freed more hands than the fields ever held. Those men are walking to Turin and to Milan. They will find work in our shops, and the shops must be ready for them."
 ITADNC_e_the_kingdom_solvent: "The Kingdom Solvent"
 ITADNC_e_the_kingdom_solvent_desc: "The lira stands at par, and our debt has come home from Paris. The houses that would not lend to us before now offer on our own terms. The kingdom is solvent, and every office in Europe has had to print it."
 ITADNC_e_the_orders_of_the_state: "The Orders of the State"
 ITADNC_e_the_orders_of_the_state_desc: "Everything our great works know, they learned filling an order signed by a ministry. We shall put those orders in one book and on one calendar, and the lines will not stand idle again."
 ITADNC_e_the_arsenals_enlarged: "Enlarge the Arsenals"
 ITADNC_e_the_arsenals_enlarged_desc: "Our finances are in order at last, and we can turn to the safety of what we have built. We shall enlarge the arsenals of Spezia, Turin and Pozzuoli, and make at home what the kingdom needs."
 ITADNC_e_the_kingdom_at_war_pays: "Paying for the War"
 ITADNC_e_the_kingdom_at_war_pays_desc: "War has come to us after all. Every lira saved by a decade of careful budgets will be spent in a single year. We shall spend it on the works that turn out arms, and turn our civil shops over cheaply."
 ITADNC_e_the_railways_of_the_state: "The Railways of the State"
 ITADNC_e_the_railways_of_the_state_desc: "The companies have run our lines for a generation. Every year the State paid for the track while they took the fare. The network is ours now, and what remains is to make it worth having."
 ITADNC_e_the_simplon_is_opened: "The Simplon Is Opened"
 ITADNC_e_the_simplon_is_opened_desc: "The longest tunnel in the world runs under the Alps, and it opens on our side. It is the shortest road our goods have ever had to the markets of the north. We shall build our own approaches to match it."
 ITADNC_e_the_coal_contract: "The Coal Contract"
 ITADNC_e_the_coal_contract_desc: "We have no coal. Every furnace, every locomotive and every boiler in the fleet burns what comes over the sea from the Welsh pits. A standing contract would end the yearly scramble, and put our boiler rooms in another man's hand."
 ITADNC_e_the_rolling_stock_orders: "The Rolling Stock Orders"
 ITADNC_e_the_rolling_stock_orders_desc: "The lines are ours, and they are worked with engines bought abroad. We shall build our own and give the work to our own shops, whatever it costs the estimates."
 ITADNC_e_the_line_to_the_south: "The Line to the South"
 ITADNC_e_the_line_to_the_south_desc: "The trains that go south still go the long way round. A regiment sent to Naples spends a day and a night on the journey. A direct line would carry our goods and our soldiers at twice the speed."
 ITADNC_e_the_line_to_the_north: "The Line to the North"
 ITADNC_e_the_line_to_the_north_desc: "Between Bologna and Florence our goods climb a mountain on a road built for mules. We shall cut a direct line through it, to bind the north of the kingdom to the centre."
 ITADNC_e_the_polytechnic: "The Polytechnic"
 ITADNC_e_the_polytechnic_desc: "Our works are run by men who learned their trade in Zurich and Charlottenburg, because there is nowhere here to learn it. We shall found a school of our own, with laboratories and a workshop, and keep the next generation at home."
 ita_dnc.2930.t: "A Standing Contract for Coal"
 ita_dnc.2930.d: "The Italian ambassador has put a proposal to us. Italy would take a fixed tonnage from the Welsh pits every year, at a price agreed for the term of the charter. Our owners would have a buyer who never haggles and never fails to pay. A kingdom that need not worry about its coal is free to spend its money on a fleet."
 ita_dnc.2930.a: "Sign the charter. Their furnaces and our pits both stand to gain."
 ita_dnc.2930.b: "Refuse. We shall not bind our pits to a fixed price."
 ita_dnc.2931.t: "The Charter Is Signed"
 ita_dnc.2931.d: "The contract is signed and the first colliers are already loading. Our furnaces, our locomotives and the boiler rooms of the fleet are provided for, at a price we know in advance. The yearly scramble in the coal market is over."
 ita_dnc.2931.a: "Load the first colliers and put the scramble behind us."
 ita_dnc.2932.t: "The Charter Refused"
 ita_dnc.2932.d: "The answer is that the pits will not be bound. They will sell to us as they always have, cargo by cargo, at whatever the season asks. Every rise in the market will be felt in our works within the month. We shall pay it, because there is nowhere else to buy."
 ita_dnc.2932.a: "Buy as we always have, cargo by cargo."
 ITA_e_tt_luzzatti_at_the_treasury: "§YLuigi Luzzatti§! takes the Treasury, and may be hired as a §Ypolitical advisor§!."
 ITA_e_tt_pacelli_withdraws: "§RThe Banco di Roma withdraws§!: with the extraordinary estimates closed, §YErnesto Pacelli§! has no further business with the State."
 ITA_e_tt_the_credit_becomes_the_solvency: "Replace §YThe Credit Restored§! with §YThe Kingdom Solvent§!, effective change:"
 ITA_e_tt_the_credit_is_restored: "Replace §YThe Consolidated 5 Per Cent§! with §YThe Credit Restored§!: the service of the debt falls to nothing and stops climbing."
 ITA_e_tt_the_note_falls_due: "§RThe holders must be paid at par§!: §YThe Conversion Pending§! is laid on the Treasury, and the longer we borrowed the longer it lasts."
 ITA_e_tt_the_wall_is_reached: "§RThe service of the debt has eaten the whole ordinary revenue§!: our factories and our slipways give less, and more of our industry goes to consumer goods."
 ITA_e_tt_the_network_is_ours: "Bring §YInfrastructure§! to its full height in §YMilano§!, §YLiguria§!, §YEmilia Romagna§! and §YLatium§!, wherever we hold the ground."
 ITA_e_tt_the_line_to_the_south: "Raise §YInfrastructure§! in §YNapoli§!, §YPuglia§!, §YCalabria§! and §YSicily§! where we hold them, and lay a railway from the capital to Naples if we hold both ends."
 ITA_e_tt_the_line_to_the_north: "Raise §YInfrastructure§! in §YEmilia Romagna§!, §YTuscany§!, §YVeneto§! and §YFriuli§! where we hold them, and cut a railway through the mountain if we hold both ends."
 ITA_e_tt_if_they_accept: "\n§YEffects if they accept:§!"
 ITA_e_tt_war_cancels_the_charter: "A war between the two kingdoms cancels the charter."
 ITA_e_tt_the_capital_answers: "§YLondon will send its answer within a few days.§!"
 ITA_e_modify_the_consolidated_tt: "Modify §YThe Consolidated 5 Per Cent§! by:"
 ITA_e_modify_the_war_treasury_tt: "Modify §YThe War Treasury§! by:"
 ITA_e_modify_the_credit_restored_tt: "Modify §YThe Credit Restored§! by:"
 ITA_e_modify_the_kingdom_solvent_tt: "Modify §YThe Kingdom Solvent§! by:"
 ITA_e_rendita_tt: "§YService of the debt§!: §R[?ITA_e_rendita|%0]§! of our revenue is spoken for before we spend a lira, and it costs our industry §R[?ITA_e_rendita_cg|%0]§! more in consumer goods.\nUnder the War Treasury it grows by §Y[?ITA_e_monthly_rendita_increase|%1]§! a month and falls due every year; once our credit is restored, it is paid down month by month."
 ITA_e_rendita_eased_tt: "The §Yservice of the debt§! is eased, and stands at §Y[?ITA_e_rendita|%0]§!."
 ITA_e_the_bread_is_cheaper_tt: "Bread is cheaper, and the §Ypiazza§! is quieter for it."
 ITA_e_the_treaties_are_signed_tt: "Our works buy their raw materials abroad on better terms."
 ITA_e_the_yards_work_faster_tt: "Everything the Kingdom builds goes up faster."
 ITA_e_the_drawing_office_tt: "Our research goes faster."
 ITA_e_the_ore_stays_home_tt: "More is drawn from the resources we hold ourselves."
 ITA_e_the_book_is_full_tt: "A shortage of raw materials costs our lines less."
 ITA_e_the_shops_change_hands_tt: "Turning a civilian shop over to war work costs less."
 ITA_e_the_shops_grow_tt: "Our §Yfactories§! give more."
 ITA_e_the_slips_grow_tt: "Our §Ydockyards§! give more."
 ITA_e_the_line_reaches_further_tt: "A production line reaches a higher efficiency."
 ITA_e_the_line_settles_sooner_tt: "A production line gains its efficiency faster."
 ITA_e_the_line_starts_higher_tt: "A production line starts at a higher efficiency."
 ITA_e_the_line_changes_cheaper_tt: "Changing what a line makes costs less efficiency."
 ITA_e_the_military_works_slow_tt: "Arms factories are built more slowly."
 ITA_e_the_slips_work_slow_tt: "Dockyards are built more slowly."
 ITA_e_the_books_are_open_tt: "The banks that place our debt abroad read the Treasury books, and foreign powers learn more about us."
 ITA_e_the_consolidated_five_per_cent: "The 5 Per Cent Debt"
 ITA_e_the_consolidated_five_per_cent_desc: "Our debt is placed in Paris and in London, and the interest is paid before anything else. Every month we go on borrowing, more of what our works produce is spoken for."
 ITA_e_the_war_treasury: "The War Treasury"
 ITA_e_the_war_treasury_desc: "We have chosen to go on borrowing while we arm. The lenders are willing and the works are busy. The interest climbs every month."
 ITA_e_the_credit_restored: "The Credit Restored"
 ITA_e_the_credit_restored_desc: "The extraordinary budget is closed, and the cost of the debt no longer climbs by itself. What we owe is still owed. The holders must be paid in full one day."
 ITA_e_the_kingdom_solvent_mod: "The Kingdom Solvent"
 ITA_e_the_kingdom_solvent_mod_desc: "The debt has come home and been converted on our own terms. We borrow now at the rate a solvent state pays, and our works stand behind it."
 ITA_e_a_power_that_makes_things: "A Power That Makes Things"
 ITA_e_a_power_that_makes_things_desc: "We were a great power on paper, with a seat at every table and nothing in our hands. The works of Turin, Milan and Genoa now make what the army and the fleet need."
 ITA_e_the_conversion_pending: "The Conversion Pending"
 ITA_e_the_conversion_pending_desc: "The Treasury must be ready to pay off in full every holder who refuses the new rate. That money is locked up until the conversion closes, and it cannot be spent twice."
 ITA_e_the_coal_charter_ns: "The Italian Coal Charter"
 ITA_e_the_coal_charter_ns_desc: "We ship a fixed tonnage of coal to Italy every year, at a price fixed for the term. It is good trade, and it is a hold on a kingdom with no coal of its own."
 ITADNC_h_the_works_on_the_frontier: "The Works on the Frontier"
 ITADNC_h_the_works_on_the_frontier_desc: "Since we signed the alliance with Vienna, our passes above the Piave have stood open and our engineers have been forbidden to build. We are a sovereign state, and we will fortify our own ground."
 ITADNC_h_the_army_is_paid: "The Army Is Paid"
 ITADNC_h_the_army_is_paid_desc: "A junior officer cannot keep a decent coat on what the Treasury pays him, and the general staff knows it. We will pass the army budget in full and raise the pay before we raise a single new regiment."
 ITADNC_h_the_state_stands_aside: "The State Stands Aside"
 ITADNC_h_the_state_stands_aside_desc: "The prefects ask again whether they may close the labour chambers and put troops in the squares, and our answer is no. Where no law is broken we take no side, and a prefect who needs bayonets to govern may resign."
 ITADNC_h_the_prefects_are_instructed: "The Prefects Are Instructed"
 ITADNC_h_the_prefects_are_instructed_desc: "A government that watches a general strike from the window is no government. Our circular goes out tonight: close the seditious labour chambers, dissolve the leagues, and replace any prefect who hesitates."
 ITADNC_h_the_corps_for_china: "The Corps for China"
 ITADNC_h_the_corps_for_china_desc: "Our corps has gone ashore beside the other powers, and the legations in Peking are still holding. We shall keep it in the field until the rising is broken. Our officers will come home knowing what a modern campaign looks like."
 ITADNC_h_the_oath_before_the_king: "The Oath Before the King"
 ITADNC_h_the_oath_before_the_king_desc: "Our army swore to the King and the Statuto, not to whatever majority sits in the Chamber. We will have the oath read in every barracks and promotion follow seniority, and an officer who wants a party may resign."
 ITADNC_h_the_schools_are_left_alone: "The Schools Are Left Alone"
 ITADNC_h_the_schools_are_left_alone_desc: "The war school at Turin trains the men who will draw our plans. The ministry rewrites its syllabus every time a deputy complains of it. We shall leave the school to its own professors, and let doctrine be argued out by soldiers."
 ITADNC_h_the_reserve_is_prepared: "The Reserve Is Prepared"
 ITADNC_h_the_reserve_is_prepared_desc: "The staff has worked out what mobilisation would cost us. Our depots run empty in two weeks. We shall fill them now and quietly, so that the next war finds the reserve clothed and fed instead of waiting on a platform."
 ITADNC_h_the_colonial_office: "The Colonial Office"
 ITADNC_h_the_colonial_office_desc: "Our colonies are run by a single bureau of the foreign ministry that is overwhelmed by every dispatch. We will make it a central directorate with its own governors and budget, and a future ministry of colonies."
 ITADNC_h_the_companies_of_discipline: "The Companies of Discipline"
 ITADNC_h_the_companies_of_discipline_desc: "Every regiment keeps a few men it cannot use and may not discharge. They cost the Treasury as much as soldiers do. We shall gather them into companies of discipline and set them to the roads, the forts and the colonies."
 ITADNC_h_the_schools_of_the_corps: "The Regimental Schools"
 ITADNC_h_the_schools_of_the_corps_desc: "Half the conscripts who come to us cannot read the order pinned to the barrack door. We shall reopen the regimental schools and teach them their letters before we teach them gunnery. A soldier who can read a map is worth two who cannot."
 ITADNC_h_the_office_of_reserved_affairs: "The Office of Reserved Affairs"
 ITADNC_h_the_office_of_reserved_affairs_desc: "The police and the army keep separate files on our enemies and have never compared them. We will put both under one roof and pay for the men they need, so we learn what our enemies intend before they act."
 ITADNC_h_the_understanding_with_vienna: "The Understanding with Vienna"
 ITADNC_h_the_understanding_with_vienna_desc: "Our alliance with Vienna has held for a generation and cost us only our newspapers' patience. Vienna will renew it early and unconditionally if we ask first. We will sign again, and let our claims wait."
 ITADNC_h_the_ascari_are_enrolled: "The Ascari Are Enrolled"
 ITADNC_h_the_ascari_are_enrolled_desc: "Our colonial corps in Eritrea is the only force we have that has seen battle lately, and two ministries still quarrel over it. We will settle it by enrolling the ascari in battalions of their own."
 ITADNC_h_the_new_arms: "The New Arms"
 ITADNC_h_the_new_arms_desc: "Our artillery is a generation behind, and our infantry has no machine guns at all. We will order the quick-firing gun, buy machine guns abroad where we must, and keep our experimental works busy."
 ITADNC_h_the_grain_and_the_coal: "The Grain and the Coal"
 ITADNC_h_the_grain_and_the_coal_desc: "Nearly every ton of coal we burn is landed from Cardiff, and much of our bread is grown abroad. We shall build state warehouses and sign the shipping contracts in advance. A blockade would then take months to bite instead of weeks."
 ITADNC_h_the_men_in_the_cafes: "The Informers Abroad"
 ITADNC_h_the_men_in_the_cafes_desc: "Our register lists every subversive who has left the country, and our consulates pay informers in the cafés where they meet. We will pay those informers better and place them where the exiles actually talk."
 ITADNC_h_the_integration_of_the_littoral: "The Coast Customs Union"
 ITADNC_h_the_integration_of_the_littoral_desc: "Our workmen build Austria's ships and our ports carry its trade, while the customs line between us costs both sides. We will propose a customs and railway union of the coast and win its industry by treaty."
 ITADNC_h_the_yards_of_trieste: "The Yards of Trieste"
 ITADNC_h_the_yards_of_trieste_desc: "The technical works at Trieste and the torpedo yard at Fiume are the most modern war industries within our reach, and they are ours at last. We will keep their drawing offices whole and let them build for us."
 ITA_h_frontier_ultimatum_tt: "§RIf Vienna confronts us and we give way, the works stop.§!"
 ITA_h_may_provoke_hostility_tt: "§RVienna may answer with hostility.§!"
 ITA_h_army_advisor_cp_tt: "Command power cost of unit leaders serving as advisors: §G-15%§!"
 ITA_h_the_army_estimates_pass_tt: "The army estimates pass in full, and these officers take service with us."
 ITA_h_the_army_of_the_king_tt: "We open the §YArmy of the King§!, and it grows with every army measure we carry."
 ITA_h_sacchi_is_offered_tt: "The radicals will support a ministry that keeps the troops out of the squares."
 ITA_h_salandra_stands_down_tt: "Salandra leaves the ministry, and the constitutional Right goes with him."
 ITA_h_the_squares_empty_tt: "The §YPiazza§! falls by 5 points as the strikes are left to end on their own."
 ITA_h_salandra_is_called_tt: "Salandra is called to the ministry, and the constitutional Right comes with him."
 ITA_h_the_extreme_is_shut_out_tt: "Sacchi, Turati, Bissolati and Rigola are shut out of every ministry while the circular stands."
 ITA_h_the_prefects_rise_tt: "The §YPrefects§! gain 10 points as the circular goes out over the ministry's signature."
 ITA_h_the_volunteers_are_ashore_tt: "We have more than one volunteer division ashore in China."
 ITA_h_army_mobilization_tt: "Mobilisation speed: §G+10%§!"
 ITA_h_army_morale_tt: "Army morale: §G+10%§!"
 ITA_h_pollio_takes_the_oath_tt: "Pollio reads the oath at the head of the army, and gains the offensive doctrine trait."
 ITA_h_the_war_school_is_free_tt: "The war school sets its own syllabus, and soldiers argue doctrine without a deputy in the room."
 ITA_h_reserve_tt: "§YNext time the Kingdom is at war:§!"
 ITA_h_the_colonial_office_tt: "We may now form colonies and protectorates in conquered land, and mark out our spheres in Africa."
 ITA_h_the_discipline_divisions_tt: "Three discipline divisions are raised in the capital, and we may keep up to 12 of them."
 ITA_h_the_conscript_can_read_tt: "The regimental schools reopen, and the support arms get recruits who can read an order."
 ITA_h_the_reserved_office_tt: "Our intelligence service opens, with one more operative and agency upgrades 20% faster."
 ITA_h_if_vienna_accepts_tt: "§YEffects if Vienna accepts:§!"
 ITA_h_the_capital_answers_tt: "§YVienna will send its answer in a day or two.§!"
 ITA_h_the_ascari_battalions_tt: "Four battalions of ascari are raised in Eritrea, or at home if Eritrea is not ours."
 ITA_h_the_experimental_batteries_tt: "The experimental batteries keep firing, and what they learn goes to the gun works."
 ITA_h_the_crown_is_humbled_tt: "The §YCrown§! loses 10 points, and the King remembers it."
 ITA_h_the_alliance_is_signed_tt: "The alliance is signed again, and our northern frontier is quiet."
 ITA_h_the_littoral_opens_tt: "The Littoral opens to our trade, and if Trieste is not ours we are given a factory on the far side of the customs line."
 ITA_h_the_frontier: "the works above the Piave"
 ITA_h_the_schools_of_the_corps: "The Regimental Schools"
 ITA_h_the_schools_are_left_alone: "The Schools Are Left Alone"
 ITA_h_the_new_arms: "The New Arms"
 ITA_h_the_army_of_the_king: "The Army of the King"
 ITA_h_the_army_of_the_king_desc: "This is what the ministry has carried for the army. Every bill voted and every oath read adds to it."
 ITA_h_the_colonial_office_modifier: "The Colonial Office"
 ITA_h_the_colonial_office_modifier_desc: "The central directorate keeps the accounts of the governorates. What it is worth depends on what the governors do with it."
 ITA_h_the_frontier_armed: "The Armed Frontier"
 ITA_h_the_frontier_armed_desc: "The engineers are laying stone in the passes above the Piave at last. Vienna reads the treaty differently, and says so."
 ITA_h_the_works_halted: "The Works Halted"
 ITA_h_the_works_halted_desc: "We were confronted on the frontier and we gave way. The engineers have come down from the passes, and the Chamber wants to know who told them to go up."
 ITA_h_the_china_corps: "The Corps in China"
 ITA_h_the_china_corps_desc: "2,000 men under a colonel of ours are serving beside the great powers. What they learn there is worth more than any concession they bring home."
 ITA_h_the_depots_are_full: "The Depots Are Full"
 ITA_h_the_depots_are_full_desc: "The stores were filled in peacetime, and the reserve found them ready. For once the recruits are clothed on the day they report."
 ITA_h_the_magazines_of_the_state: "The State Warehouses"
 ITA_h_the_magazines_of_the_state_desc: "Grain sits in the state warehouses and the coal is contracted a season ahead. The shipping agreements were signed before anyone needed them."
 ITA_h_the_reserved_office: "The Reserved Office"
 ITA_h_the_reserved_office_desc: "The police and the army's information office now keep one register between them. It is read every morning by men who are paid to be suspicious."
 ITA_h_the_informers: "The Informers Abroad"
 ITA_h_the_informers_desc: "The consulates pay well and the exiles talk freely. What is settled in a cafe in Paris or Geneva is known in Rome within the week."
 ITA_h_the_alliance_renewed: "The Alliance Renewed"
 ITA_h_the_alliance_renewed_desc: "The treaty was signed again before its term, and without a province changing hands. Our northern frontier is quiet, and our claims on Austrian land are harder to press."
 ITA_h_the_littoral_trade: "The Trade of the Adriatic Coast"
 ITA_h_the_littoral_trade_desc: "One tariff and one timetable run from Venice to Fiume. The ports on both shores are busier than either finance ministry expected."
 ITA_h_the_triestine_yards: "Stabilimento Tecnico Triestino"
 ITA_h_the_triestine_yards_desc: "The technical works of Trieste, taken over with their drawing offices and slipways whole. Vienna's battleships were built on these slips, and the men who built them now build for us."
 ita_dnc.2300.t: "The Works Above the Piave"
 ita_dnc.2300.d: "Italian engineers are cutting gun emplacements into the passes of the Cadore and the Valsugana. The treaty of alliance says that ground must be left open. Our chief of staff has asked twice for a war to stop it, and been refused twice.\n\nWe can demand that the work stops and ask Berlin to stand behind us. Or we can send a note of protest and let the matter lie."
 ita_dnc.2300.a: "Demand the works stop, and call on Berlin."
 ita_dnc.2300.b: "Send a note of protest, and nothing more."
 ita_dnc.2301.t: "Vienna Asks for Our Guarantee"
 ita_dnc.2301.d: "Vienna has demanded that Rome take its engineers off the alpine passes. It wants to know whether we will march if Rome refuses.\n\nBacking the demand means putting our army behind a quarrel over stone. Our own staff would rather have the Italians friendly than frightened."
 ita_dnc.2301.a: "Tell Vienna it stands alone in this."
 ita_dnc.2301.b: "Guarantee Vienna, and let Rome hear of it."
 ita_dnc.2302.t: "Vienna Sends Only a Note"
 ita_dnc.2302.d: "Vienna has sent Rome a note of protest over the works in the passes, and has asked for nothing more. It is a small thing in itself.\n\nIt tells us how little the Monarchy will spend to keep its southern ally honest. We can put our name to the note, or leave the two of them to it."
 ita_dnc.2302.a: "Endorse the note in our own name."
 ita_dnc.2302.b: "Stay out of it. This is not our quarrel."
 ita_dnc.2303.t: "Berlin Will Not Follow"
 ita_dnc.2303.d: "Our demand has gone to Rome, and Berlin has declined to stand behind it.\n\nWe can still put the army on the frontier and make the Italians choose. If they refuse, we shall be alone in whatever follows."
 ita_dnc.2303.a: "Put the ultimatum to Rome regardless."
 ita_dnc.2303.b: "Let the note stand and say no more."
 ita_dnc.2304.t: "Berlin Stands with Us"
 ita_dnc.2304.d: "Berlin has answered that it will honour the alliance if the quarrel over the passes becomes a war.\n\nWith the German army behind us, the Italians must take their engineers off the mountain or answer to two courts at once. The promise is worth something even if we never use it."
 ita_dnc.2304.a: "Put the ultimatum to Rome."
 ita_dnc.2304.b: "Keep the promise in hand and send no ultimatum."
 ita_dnc.2305.t: "The Ultimatum from Vienna"
 ita_dnc.2305.d: "Vienna gives us a term to take our engineers off the passes and level what they have built. Berlin has not put its name to the demand, and our staff believes the Monarchy is bluffing.\n\nIf we stand firm we may have a war on the Isonzo before the depots are filled. If we give way we lose the works, and the King loses more than that."
 ita_dnc.2305.a: "Go on with the works. This is our own ground."
 ita_dnc.2305.b: "Suspend the works. We are not ready for this."
 ita_dnc.2306.t: "An Ultimatum from Rival Courts"
 ita_dnc.2306.d: "The demand from Vienna arrives with Berlin's name under it, and the term is short.\n\nIf we refuse we face both of them on the Isonzo, with our reserve still on paper. If we give way the engineers come down the mountain, and somebody else tells the Chamber why."
 ita_dnc.2306.a: "Go on with the works. We do not stop for two courts."
 ita_dnc.2306.b: "Suspend the works. We cannot face both of them."
 ita_dnc.2308.t: "Rome Does Not Stop"
 ita_dnc.2308.d: "Rome answers that the passes are Italian ground and that the works will go on.\n\nOur army stands on the frontier, and the Emperor must say whether we meant what we wrote. The chief of staff wants the order. The foreign ministry would rather find a form of words."
 ita_dnc.2308.a: "Take the frontier by force."
 ita_dnc.2308.b: "We will not begin a war over stone."
 ita_dnc.2309.t: "Rome Gives Way"
 ita_dnc.2309.d: "The Italian engineers are coming down from the passes, and the ministry in Rome is explaining to its own Chamber why. We have our answer without firing a round.\n\nWe can take the climbdown quietly, or we can let our newspapers make the most of it."
 ita_dnc.2309.a: "Take the climbdown and say nothing."
 ita_dnc.2309.b: "Let the newspapers make the most of it."
 ita_dnc.2390.t: "The Alliance Renewed Early"
 ita_dnc.2390.d: "Rome proposes to renew the treaty before its term and asks nothing for it. No province, no undertaking about the Littoral, only the signature.\n\nIt would settle our southern frontier for another decade and cost us nothing. It would also teach the party in Rome that patience is rewarded."
 ita_dnc.2390.a: "Sign again. The alliance is worth more than three provinces."
 ita_dnc.2390.b: "Refuse. Rome asks too often."
 ita_dnc.2391.t: "Vienna Declines Rome"
 ita_dnc.2391.d: "Vienna has refused to renew the treaty early, and has told Rome so in the coldest terms it could find. The alliance holds on paper.\n\nThe Italians have been shown what their signature is worth. We can speak to Vienna about it, or leave the two of them to sort it out."
 ita_dnc.2391.a: "Remind Vienna what the alliance is for."
 ita_dnc.2391.b: "Let them settle it between themselves."
 ita_dnc.2392.t: "The Customs Union"
 ita_dnc.2392.d: "Rome offers a customs and railway union of the Littoral. Our trade would go through their ports, their workmen would come to our yards, and both would work to one tariff.\n\nOur finance ministry says we need a southern outlet. The governor at Trieste says it hands the province to Italy without a shot."
 ita_dnc.2392.a: "Accept the union. We need a southern outlet."
 ita_dnc.2392.b: "Refuse. The Littoral is not for sale."
 ITADNC_h_the_pact_against_anarchy: "The Pact Against Anarchy"
 ITADNC_h_the_pact_against_anarchy_desc: "The men who killed our King plotted in one country and struck in another, and no police force can follow them across borders. We will ask the powers for a common list of names, shared photographs and no asylum."
 ITADNC_h_the_surrender_of_the_exiles: "The Surrender of the Exiles"
 ITADNC_h_the_surrender_of_the_exiles_desc: "The convention binds Europe's police but not its courts, and the committees we named are safe once they cross a border. We will ask every signatory to treat the killers of kings as criminals, not refugees."
 ITADNC_h_the_bargain_at_racconigi: "The Tsar's Visit"
 ITADNC_h_the_bargain_at_racconigi_desc: "Russia has been beaten in the East and outplayed in the Balkans. We will meet the Tsar at Racconigi, where nothing is signed and everything is agreed: neither of us moves in the Balkans without the other."
 ITADNC_h_the_treaty_of_commerce_with_petersburg: "The Trade Treaty with Petersburg"
 ITADNC_h_the_treaty_of_commerce_with_petersburg_desc: "Racconigi settled what neither crown would do, but not what we might sell. Our yards can build the cruisers the Tsar needs, and we will tie the tariff and the naval orders into one treaty before London objects."
 ITADNC_h_the_convention_of_the_straits: "The Straits Deal"
 ITADNC_h_the_convention_of_the_straits_desc: "The other half of the bargain at Racconigi was never written down. We back Russia at the Straits, and Russia backs us in Tripoli. We shall ask Petersburg to sign it as an alliance. A promise that is on no paper binds nobody."
 ITADNC_h_the_porte_in_our_debt: "The Porte in Our Debt"
 ITADNC_h_the_porte_in_our_debt_desc: "Our bank holds the loans of the Sultan's provinces, and our delegate sits on his debt council. We will call in the whole account at once and offer the Porte the only terms it can meet: our protection."
 ITADNC_h_the_consulates_abroad: "The Consulates Abroad"
 ITADNC_h_the_consulates_abroad_desc: "The emigration law gave us a consul in every port that takes our people, and we have used them only for paperwork. We will put our consuls to work speaking for Italy wherever Italy has no soldiers."
 ITADNC_h_the_carabinieri_for_macedonia: "Police for Macedonia"
 ITADNC_h_the_carabinieri_for_macedonia_desc: "The powers have divided Macedonia into police sectors, and ours is the one nobody else wanted. We will send the Carabinieri under a general of their own, and our officers will learn their trade in another empire."
 ITADNC_h_the_reckoning_with_the_refuge: "The Demand on Switzerland"
 ITADNC_h_the_reckoning_with_the_refuge_desc: "Every man who has murdered a sovereign in our time was fed and armed in the same Swiss cantons, and the Swiss call them guests. We will demand that the exile colonies be broken up and say plainly what refusal will cost."
 ITADNC_h_the_convention_of_the_gotthard: "The Convention of the Gotthard"
 ITADNC_h_the_convention_of_the_gotthard_desc: "The Alpine tunnels bring our coal south and our emigrants home, at rates set by a company we do not own. We will sit down with Berne and Berlin and fix the Gotthard rates by treaty rather than favour."
 ITADNC_h_the_kingdom_is_no_refuge: "The Kingdom Is No Refuge"
 ITADNC_h_the_kingdom_is_no_refuge_desc: "We asked the powers to shut their doors to anarchists, and some refused. We cannot ask of others what we will not do ourselves, so we will expel every foreign subversive, and those who refused lose our friendship."
 ITADNC_h_the_hand_of_menelik: "Arms for Menelik"
 ITADNC_h_the_hand_of_menelik_desc: "Menelik buys his rifles where he can, and he remembers who sold him the last ones. We shall arm him and send officers to drill his levies. That puts us beside his throne, where London believes it already stands."
 ITADNC_h_the_hand_of_london: "An Understanding with London"
 ITADNC_h_the_hand_of_london_desc: "Our warships and Britain's already hunt the same Somali rebels along the same coast. We will turn that habit into a policy, and settle the Horn of Africa and the Mediterranean with the one fleet we cannot fight."
 ITADNC_h_the_concession_at_tientsin: "Our Concession in China"
 ITADNC_h_the_concession_at_tientsin_desc: "Peking granted us a quarter of Tientsin on the river once the legations were relieved. We have governed it with a flagpole and a clerk. We shall ask that the grant be made real, with a boundary, a council and a garrison of our own."
 ITADNC_h_the_bay_of_san_mun: "A Bay in China"
 ITADNC_h_the_bay_of_san_mun_desc: "We once asked Peking for a naval station on that coast. We withdrew the demand and lost a minister over it. We shall put the claim back on the table. Where the shore is held by another power, we shall lodge our claim to it instead."
 ITADNC_h_the_stations_of_the_benadir: "The Somali Stations"
 ITADNC_h_the_stations_of_the_benadir_desc: "The Benadir coast is ours by law, but the land behind it still answers to sultans, companies and foreign flags. We will fix its stations and borders with whoever will talk, and claim outright from whoever will not."
 ITADNC_h_the_naval_understanding: "The Naval Understanding"
 ITADNC_h_the_naval_understanding_desc: "Our best armour is rolled in Sheffield and our best turrets are drawn on the Tyne. We will put this on a proper footing, exchanging designs and shipwrights, so what we buy this year we can build ourselves next year."
 ITADNC_h_the_talks_at_the_foreign_office: "The Talks in London"
 ITADNC_h_the_talks_at_the_foreign_office_desc: "The border between our Benadir and the British protectorate was drawn on a map by men who had seen neither. We shall reopen the question in London, and ask that the wells and the river bank fall on our side."
 ITADNC_h_the_treaty_with_peking: "The Treaty with Peking"
 ITADNC_h_the_treaty_with_peking_desc: "The peace after the Boxer rising left Peking poorer, angrier and surrounded by quarrelling creditors. We will offer it a trade treaty no other power has offered, and be the first flag China need not fear."
 ITADNC_h_the_sphere_of_the_tripartite: "Our Sphere in East Africa"
 ITADNC_h_the_sphere_of_the_tripartite_desc: "Britain and France agreed on paper that the land between our two colonies is ours to develop, yet no Italian officer has set foot there. We will claim the whole sphere and name the governorates that will hold it."
 ITADNC_h_the_colonial_administrations: "Colonial Governments"
 ITADNC_h_the_colonial_administrations_desc: "Our possessions are run by three ministries, a chartered company and a naval station. None of them answers to another. We shall give each colony a governor, a budget and a seal. One desk in Rome will read all their reports."
 ITADNC_h_the_wealth_of_the_east: "The Wealth of the East"
 ITADNC_h_the_wealth_of_the_east_desc: "Our consuls report silk, tin and coal leaving Eastern ports in foreign ships, and our geographers have called it a scandal for years. We will declare that trade our concern and lay claim to the ports themselves."
 ITADNC_h_the_stations_of_the_red_sea: "The Red Sea Stations"
 ITADNC_h_the_stations_of_the_red_sea_desc: "Massawa and Assab sit on the road every steamer to the Indies must take, and we sell those ships nothing but water. We shall build the coal sheds, the moles and the condensers at every station we hold, and make the passage pay us."
 ITADNC_h_the_kingdom_and_the_dragon: "With Peking Against Britain"
 ITADNC_h_the_kingdom_and_the_dragon_desc: "The court at Peking is our ally now, not our debtor. The powers that carved up its coast are guests there, and we are the host. We shall stand with Peking against them, and take from Britain what Britain took from everyone else."
 ITADNC_h_the_million_who_left: "Our People Abroad"
 ITADNC_h_the_million_who_left_desc: "Italians are being lynched in American towns, and Washington says it cannot reach inside a state of the Union. We will demand a commission, an indemnity and a federal law, because our emigrants carry our flag."
 ITA_h_tt_the_capital_answers: "The capital we have written to will answer in a few days, and it decides for itself what to say."
 ITA_h_if_they_accept_tt: "§YEffects if they accept:§!"
 ITA_h_if_they_refuse_tt: "§YEffects if they refuse:§!"
 ITA_h_unlock_influence_countries_tt: "Our consulates can be set to work on a foreign government from the Consulta."
 ITA_h_tt_the_kingdom_is_no_refuge: "Every state that refused the convention loses our guarantee and our non-aggression pact, and an ally that refused it is put out of the alliance."
 ITA_h_tt_the_colonial_levies: "Three colonial division templates are added: a colonial battalion, a mounted band and a mixed militia."
 ITA_h_tt_the_bay_of_san_mun: "Where China or an ally holds the shore, we ask for the anchorage. Where anyone else holds it, we lay a claim."
 ITA_h_tt_the_stations_of_the_benadir: "Where an ally holds a station, we ask for it. Where anyone else holds it, we claim it outright."
 ITA_h_tt_the_talks_at_the_foreign_office: "The talks cover [547.GetName], [549.GetName], [268.GetName], [1087.GetName], [1088.GetName] and [116.GetName]."
 ITA_h_tt_the_sphere_of_the_tripartite: "We claim the whole zone the three powers left us, and the ministry can now put the question to London."
 ITA_h_unlock_benadir_tt: "Unlocks Decisions: The Governorate of the Benadir"
 ITA_h_unlock_tripolitania_tt: "Unlocks Decisions: The Governorate of Tripolitania"
 ITA_h_unlock_the_aegean_tt: "Unlocks Decisions: The Governorate of the Aegean"
 ITA_h_unlock_east_africa_tt: "Unlocks Decisions: The Governorate of East Africa"
 ITA_h_tt_the_wealth_of_the_east: "We declare the trade of those coasts our own concern, and we hold a claim on every port named above."
 ITA_h_tt_the_stations_of_the_red_sea: "Every station on the passage that we hold receives its coal sheds, its moles and its condensers."
 ITA_h_tt_the_kingdom_and_the_dragon: "We stand with Peking against the British, and say so openly."
 ITA_h_the_pact_against_anarchy: "The Convention Against Anarchy"
 ITA_h_racconigi: "The Bargain at Racconigi"
 ITA_h_the_straits: "The Convention of the Straits"
 ITA_h_the_porte_in_our_debt: "The Porte in Our Debt"
 ITA_h_the_reckoning_with_the_refuge: "Italy makes a demand on Switzerland"
 ITA_h_the_stations_of_the_benadir: "The Stations of the Benadir"
 ITA_h_the_sphere_of_the_tripartite: "Italy claims a sphere in East Africa"
 ITA_h_the_wealth_of_the_east: "The Wealth of the East"
 ITA_h_the_kingdom_and_the_dragon: "Italy stands with Peking against Britain"
 ITA_h_the_naval_understanding: "The Naval Understanding"
 h_the_treaty_of_commerce_with_petersburg: "The Treaty of Commerce with Petersburg"
 h_the_naval_understanding: "The Naval Understanding"
 h_the_million_who_left: "The Million Who Left"
 ITA_h_the_convention_of_extradition: "The Convention of Extradition"
 ITA_h_the_convention_of_extradition_desc: "The powers now keep one list of names and one file of photographs. A man on that list has nowhere left to go where no police force can follow him."
 ITA_h_the_balkan_status_quo: "The Balkan Status Quo"
 ITA_h_the_balkan_status_quo_desc: "Neither the King nor the Tsar will move in the Balkans without the other. Nothing of it was ever put on paper."
 ITA_h_trading_partners: "Trading Partners of the Kingdom"
 ITA_h_the_gendarmerie_mission: "Our Police in Macedonia"
 ITA_h_the_gendarmerie_mission_desc: "Our Carabinieri are policing a district of another empire. The officers who come back have learned more there than on any parade ground."
 ITA_h_the_pass_is_ours_to_use: "The Gotthard Treaty"
 ITA_h_the_concession_at_tientsin: "Our Concession in China"
 ITA_h_the_dragon_and_the_eagle: "The Alliance with Peking"
 ITA_h_the_flag_follows_the_emigrant: "The Flag Follows the Emigrant"
 ITA_h_the_flag_follows_the_emigrant_desc: "Where our people land, a consul lands with them, and a warship is never far behind. The yards are busy and the recruiting lists are longer."
 ITA_h_stations_modifier: "The Stations of the Red Sea"
 ITA_h_stations_modifier_desc: "Coal sheds, moles and condensers on the passage to the Indies."
 ITA_h_the_league_of_the_straits: "The League of the Straits"
 ita_dnc.2310.t: "The Convention Against Anarchy"
 ita_dnc.2310.d: "Rome has sent round the protocol drafted at its own conference. The powers would keep one list of names and one file of photographs, and refuse asylum to any man who kills a sovereign.\n\nSigning lets a foreign police force ask questions in our courts, and costs us the exiles who shelter here. Refusing marks us, in every foreign office, as the door the assassins use."
 ita_dnc.2310.a: "Sign what Rome has drafted."
 ita_dnc.2310.b: "Refuse to sign. No court of ours will be bound."
 ita_dnc.2311.t: "The Surrender of the Exiles"
 ita_dnc.2311.d: "The convention bound our police. Rome now asks that it bind our judges as well. The article would make any man who kills a head of state a common criminal, to be handed over on demand.\n\nGranting it puts a rule written abroad on our own benches. Withholding it tells Rome the pact was only paper."
 ita_dnc.2311.a: "Hand over any man who kills a head of state."
 ita_dnc.2311.b: "Refuse the article. No court of ours can promise that."
 ita_dnc.2312.t: "Europe Signs the Convention"
 ita_dnc.2312.d: "The powers that signed at Rome are writing the extradition article into their own law. The committees that printed freely a season ago are packing up their presses.\n\nThe states that refused are named in the same dispatch. Sheltering an assassin is now a quarrel between governments, and Italy made it one."
 ita_dnc.2312.a: "Note it. Our signature is on it."
 ita_dnc.2312.b: "Say nothing. We signed nothing."
 ita_dnc.2313.t: "The Presses of the Ticino"
 ita_dnc.2313.d: "A note from Rome lists the halls, the printers and the streets of the southern canton where the Italian exiles meet. It asks that the colonies be broken up and the men handed over.\n\nComplying breaks the oldest promise the republic makes to anyone who reaches our border. Refusing leaves an Italian army standing at the head of the passes."
 ita_dnc.2313.a: "Break up the colonies and hand the men over."
 ita_dnc.2313.b: "Refuse. We do not hand over our guests."
 ita_dnc.2314.t: "The Convention of the Gotthard"
 ita_dnc.2314.d: "Rome proposes a treaty on the Gotthard tunnel. The three states the line serves would fix the toll between them, instead of leaving it to the company that bored it.\n\nSigning ties our rates to our neighbours for a generation. Refusing keeps the toll in our own hands, and earns the ill will of the two capitals that use the line most."
 ita_dnc.2314.a: "Sign the treaty and fix the toll together."
 ita_dnc.2314.b: "Set our own rates. The tunnel is on our soil."
 ita_dnc.2315.t: "Berne Answers on the Gotthard"
 ita_dnc.2315.d: "Berne has answered, and the ministry now has the schedule the Gotthard will carry. Our coal goes north on that line and our emigrants come home on it.\n\nThe only question left is whether the rate is written into a treaty, or still granted to us as a favour."
 ita_dnc.2315.a: "Use the pass at the treaty rate."
 ita_dnc.2315.b: "Pay what the company asks."
 ita_dnc.2320.t: "The Benadir Hinterland"
 ita_dnc.2320.d: "Italy has made the Benadir coast a colony of the State, and now asks that the border behind it be drawn. The wells, the caravan roads and the stations are claimed by both of us.\n\nGiving up the inland provinces buys a friend on that shore. Holding them keeps the map as it stands and invites a quarrel we would have to garrison."
 ita_dnc.2320.a: "Give Rome the inland provinces behind the coast."
 ita_dnc.2320.b: "Refuse. The border stays where it is."
 ita_dnc.2321.t: "The Demand for San Mun"
 ita_dnc.2321.d: "Italy has revived a demand it once withdrew. It wants an anchorage on that coast, a coaling station, and the strip of shore that goes with them, held on lease and guarded by its marines.\n\nGranting it opens the door every other power here has already walked through. Refusing it tells a proud and impatient ministry that the door is barred."
 ita_dnc.2321.a: "Hand over the ports they ask for."
 ita_dnc.2321.b: "Refuse. That coast is not theirs to ask for."
 ita_dnc.2324.t: "Our Concession in China"
 ita_dnc.2324.d: "The Italian concession at Tientsin was granted in the settlement that ended the siege. It has never been more than a flagpole and a clerk.\n\nRome now asks for the boundary, the council and the garrison that would make it real. Honouring the grant costs us a quarter of the city. Withholding it keeps a creditor waiting."
 ita_dnc.2324.a: "Refuse. The grant was a courtesy, not a gift."
 ita_dnc.2324.b: "Honour the grant and mark out the concession."
 ita_dnc.2325.t: "The Naval Understanding"
 ita_dnc.2325.d: "Rome asks us for constructors, drawings and armour plate. In exchange it offers the free run of its own yards and its trials.\n\nSharing the craft builds a fleet in the Mediterranean that answers to nobody but its own king. Withholding it keeps the craft at home, and sends the Italian orders to a rival yard."
 ita_dnc.2325.a: "Let them build with our drawings."
 ita_dnc.2325.b: "Keep the craft at home."
 ita_dnc.2326.t: "The Talks at the Foreign Office"
 ita_dnc.2326.d: "The Italians have reopened the question of the frontier behind their Benadir colony. They want the wells and the river bank on their side of the line.\n\nConceding it buys a friendly flank on a coast we cannot garrison twice. Refusing keeps the line where it is and adds one more grievance to a growing file."
 ita_dnc.2326.a: "Let them lay claim to the wells and the river bank."
 ita_dnc.2326.b: "Refuse. The line stays where it was drawn."
 ita_dnc.2327.t: "The Italian Offer of Arms"
 ita_dnc.2327.d: "The men we beat at Adwa are back at the gate. This time they bring rifles, cartridges and instructors, not surveyors.\n\nTaking the offer arms our levies faster than any other friend could. Refusing it keeps the memory clean and the arsenal empty."
 ita_dnc.2327.a: "Take the rifles and the instructors."
 ita_dnc.2327.b: "Refuse. We have seen their roads before."
 ita_dnc.2328.t: "The Offer from Rome"
 ita_dnc.2328.d: "Rome offers to line up its Horn garrisons, its coast and its fleet with ours. It asks only that we stop treating its colonies as a nuisance.\n\nAccepting steadies the Mediterranean and disappoints an emperor who trusted us instead. Refusing leaves that fleet free for the powers we watch to court."
 ita_dnc.2328.a: "Accept, and sign the pact with Rome."
 ita_dnc.2328.b: "Decline. We will not be tied to Rome."
 ita_dnc.2330.t: "Rome Turns to London"
 ita_dnc.2330.d: "The Italian instructors have been recalled and the convoy of rifles is halted on the coast. The ministry that courted us has signed with the British instead.\n\nNothing was ever promised in writing, so nothing has been broken. We can take it as a fact of business, or as a slight."
 ita_dnc.2330.a: "Let it pass. Nothing was ever promised."
 ita_dnc.2330.b: "Note the slight, and remember the road."
 ita_dnc.2332.t: "The Treaty Italy Offers"
 ita_dnc.2332.d: "Italy offers the court what the great powers never have: a treaty of commerce and settlement on equal terms, and a place in its alliance.\n\nAccepting binds us to a distant quarrel we have no fleet to join. Refusing leaves us alone among creditors who agree on everything except us."
 ita_dnc.2332.a: "Sign the treaty and join their alliance."
 ita_dnc.2332.b: "Refuse. We are done with treaties."
 ita_dnc.2333.t: "Rome Demands an Indemnity"
 ita_dnc.2333.d: "Italians have been lynched in our southern ports. Rome demands a commission, an indemnity and a federal law, and its ambassador has read the list of the dead aloud.\n\nMeeting the demand takes the federal government into a matter the states call their own. Refusing tells a proud kingdom that its people here have no flag behind them."
 ita_dnc.2333.a: "Appoint a commission and pay the indemnity."
 ita_dnc.2333.b: "Refuse. Lynching is a matter for the states."
 ita_dnc.2394.t: "The Meeting with the Tsar"
 ita_dnc.2394.d: "The Italian King proposes a meeting at his shooting lodge, where nothing will be put on paper. Neither crown would move in the Balkans without the other, and each would back the other at the Straits.\n\nAgreeing costs us the free hand that Vienna also wants. Refusing costs us the only friend left who wants the Straits open."
 ita_dnc.2394.a: "Meet the King, and write nothing down."
 ita_dnc.2394.b: "Decline. The Tsar does not bargain with the Triple Alliance."
 ita_dnc.2395.t: "Rome and Petersburg Have Met"
 ita_dnc.2395.d: "Our ally in Rome and the empire we have just outmanoeuvred in the Balkans have met at a shooting lodge. The notice says only that the two sovereigns went hunting, and the foreign ministry believes rather more than that.\n\nProtesting spends the credit of the court on a paper we cannot produce. Saying nothing lets the thing stand."
 ita_dnc.2395.a: "Protest, and let Rome hear it."
 ita_dnc.2395.b: "Let them hunt."
 ita_dnc.2396.t: "The Treaty and the Cruisers"
 ita_dnc.2396.d: "The Italians offer a commercial treaty, and with it the slips to build the armoured cruisers our own yards cannot lay down in time.\n\nSigning puts our naval programme in a foreign yard and our tariff in a foreign book. Declining keeps both at home and leaves the ships unbuilt."
 ita_dnc.2396.a: "Sign the treaty, and order the ships."
 ita_dnc.2396.b: "Decline. Our own yards will build them."
 ita_dnc.2397.t: "The Russian Order in Genoa"
 ita_dnc.2397.d: "The armoured cruisers on the Genoa slips are now building for Russia, and the ministry has been asked what it makes of that. The yard is neutral and the contract is lawful.\n\nThe only question is whether this makes the Italians a supplier to Petersburg or a partner of it."
 ita_dnc.2397.a: "Let it pass. A yard sells to whoever pays."
 ita_dnc.2397.b: "Note it, and keep them close."
 ita_dnc.2398.t: "The Convention of the Straits"
 ita_dnc.2398.d: "The Italians ask that the understanding from the shooting lodge be written up as an alliance. We would hold their hand at the Straits, and they would hold ours where the desert begins.\n\nAccepting ties the empire to a kingdom still bound by treaty to Vienna. Refusing leaves the thing where it is, a promise between two men."
 ita_dnc.2398.a: "Sign the alliance. The Straits are worth it."
 ita_dnc.2398.b: "Refuse. We do not bind ourselves to Rome."
 ita_dnc.2399.t: "The Offer on Our Debt"
 ita_dnc.2399.d: "An Italian bank holds the paper of our provinces, and its delegate already sits on the council of our debt. Rome now offers to administer both, under its own protection.\n\nAccepting hands a foreign ministry the revenue of the empire. Refusing leaves the account open, and this creditor has an army."
 ita_dnc.2399.a: "Accept the protection, and let Rome run the debt."
 ita_dnc.2399.b: "Refuse. This empire is not a company in default."
 FOCUS_FILTER_ITA_COUNCIL: "Council of Seven"
 ITADNC_h_the_royal_prerogative: "The Royal Prerogative"
 ITADNC_h_the_royal_prerogative_desc: "The King names and dismisses his ministers, and no vote of the Chamber can do it for him. Those he calls hold only what he lends them. We will open the council at the Quirinal and name the men ourselves."
 ITADNC_h_nitti_at_the_ministry: "Nitti at the Ministry"
 ITADNC_h_nitti_at_the_ministry_desc: "Nitti has told the Chamber for years that the South will stay poor until the State builds its industry. We will give him the ministry he keeps asking for and let him prove it at our expense."
 ITADNC_h_stringher_at_the_bank: "Stringher at the Bank"
 ITADNC_h_stringher_at_the_bank_desc: "Stringher has kept the Bank of Italy's notes steady since the day he took office, and the great banks consult him before us. We will seat him at our council table before the next crash finds him there alone."
 ITADNC_h_luzzatti_at_the_treasury: "Luzzatti at the Treasury"
 ITADNC_h_luzzatti_at_the_treasury_desc: "The Treasury needs a man the Paris and London markets will answer. Luigi Luzzatti has carried our paper through worse weather than this. We shall call him back to the Treasury and let him refund the debt."
 ITADNC_h_giolitti_at_the_interior: "Giolitti at the Interior"
 ITADNC_h_giolitti_at_the_interior_desc: "The Interior is the ministry that counts the votes, moves the prefects and decides which strike is a crime. We must put it in the hands of Giovanni Giolitti, who has never mistaken it for anything else."
 ITADNC_h_orlando_at_public_instruction: "Orlando at Public Instruction"
 ITADNC_h_orlando_at_public_instruction_desc: "Public Instruction is the ministry nobody wants, passed around with its schools half built and its teachers half paid. We will give it to Orlando, a lawyer who means to write laws rather than sign papers."
 ITADNC_h_sacchi_and_the_extreme: "Sacchi and the Radicals"
 ITADNC_h_sacchi_and_the_extreme_desc: "The Extreme Left holds enough seats to break any budget, and nobody has yet given it a reason not to. We must bring Ettore Sacchi into the cabinet, and buy the radicals with a chair instead of a promise."
 ITADNC_h_salandra_and_the_right: "Salandra and the Right"
 ITADNC_h_salandra_and_the_right_desc: "The Right votes with us when it is asked and against us when it is ignored. Lately it has been ignored. We shall seat Antonio Salandra at the council table, and have our majority counted from the other side as well."
 ITADNC_h_the_special_law_for_naples: "The Special Law for Naples"
 ITADNC_h_the_special_law_for_naples_desc: "Naples has a harbour, a customs house and no work. The emigration offices there are busier than the yards. We shall carry a special law for the city: an industrial zone on the bay, and furnaces where there is now nothing but salt."
 ITADNC_h_the_credit_for_industry: "The Credit for Industry"
 ITADNC_h_the_credit_for_industry_desc: "Our banks lend against land and against paper. They almost never lend against a machine that has not been built yet. The Bank of Italy will stand behind industrial credit itself, and the workshops will find money at a rate they can pay."
 ITADNC_h_the_conversion_of_the_rendita: "The Conversion of the Debt"
 ITADNC_h_the_conversion_of_the_rendita_desc: "The rendita, our state debt, pays a coupon the Treasury can no longer justify, and the markets are quiet enough to refund it. We shall offer the holders a lower rate or their money back, and spend the difference where the furnaces are."
 ITADNC_h_the_political_police: "The Political Police"
 ITADNC_h_the_political_police_desc: "The Interior keeps its cards on the subversives in a dozen offices that do not speak to one another. One reserved office shall hold the whole file, and the man who reads it will report to the Minister and to nobody else."
 ITADNC_h_the_guards_of_public_safety: "The Guards of Public Safety"
 ITADNC_h_the_guards_of_public_safety_desc: "The city guards are hired by the communes, paid badly and rarely obeyed. Every riot proves it again. We shall make them a corps of the State, sworn, drilled and answerable to the prefect."
 ITADNC_h_the_law_on_the_schools: "The Law on the Schools"
 ITADNC_h_the_law_on_the_schools_desc: "Half our conscripts cannot sign their own names. The communes that owe them a school have neither the money nor the will. The law will lengthen the years of schooling and open evening and Sunday classes at the charge of the State."
 ITADNC_h_the_work_of_the_majority: "The Work of the Majority"
 ITADNC_h_the_work_of_the_majority_desc: "A majority that only votes is an audience, not a majority, and ours has sat quietly for far too long. We shall put it to work on the commissions, the budget and the laws of expenditure."
 ITADNC_h_the_ministry_of_industry: "The Ministry of Industry"
 ITADNC_h_the_ministry_of_industry_desc: "Industry and labour are still run as an appendix to agriculture, by clerks who have never been inside a foundry. We shall cut them loose into a ministry of their own, and give it to Nitti, who asked for it."
 ITADNC_h_the_plenipotentiary_of_credit: "A Credit Envoy"
 ITADNC_h_the_plenipotentiary_of_credit_desc: "The Bank of Italy already decides which company survives a bad winter, and it does so on an authority nobody can point to in law. We shall write that authority down, and give its director general full powers over industrial credit."
 ITADNC_h_the_plenipotentiary_of_the_treasury: "A Treasury Envoy"
 ITADNC_h_the_plenipotentiary_of_the_treasury_desc: "Every ministry spends, and only one of them is ever asked where the money went. The Treasury shall have the last word on the estimates, and the departments will learn to ask before they buy."
 ITADNC_h_the_files_are_joined: "The Single Police File"
 ITADNC_h_the_files_are_joined_desc: "The cards of the reserved office are worth little while every prefect keeps his own and shares nothing. All of it shall be joined in one directorate. The Minister will know a man's politics before the man has settled them."
 ITADNC_h_the_mobile_squadrons: "The Mobile Squadrons"
 ITADNC_h_the_mobile_squadrons_desc: "A rising in the Sicilian interior takes three days to reach by rail. By then the town has burned or calmed itself. We shall raise mobile squadrons of Carabinieri, mounted and carried by road, that move the day the telegram arrives."
 ITADNC_h_the_agency_and_the_press: "The Agency and the Press"
 ITADNC_h_the_agency_and_the_press_desc: "The official news agency is subsidised and read in every prefecture. The great Milan paper is read everywhere else. We must keep the first, and come to terms with Luigi Albertini at the second before somebody else does."
 ITADNC_h_the_leagues_in_the_majority: "The Leagues in the Majority"
 ITADNC_h_the_leagues_in_the_majority_desc: "The leagues and the cooperatives can call a general strike whenever the Chamber forgets them, and once they nearly did. We shall bring them inside the bargain, and the Extreme Left will not walk out on us again."
 ITADNC_h_the_prefects_deliver: "The Prefects Deliver"
 ITADNC_h_the_prefects_deliver_desc: "A dissolution helps only a government whose prefects know what is expected of them in the constituencies. The circulars shall go out before the writs do, and the majority will come back larger than it left."
 ITADNC_h_the_new_industries: "The New Industries"
 ITADNC_h_the_new_industries_desc: "Electricity, chemistry and the patent office are where the next fortune lies. We keep laboratories that nobody has ever paid to test anything. We shall fund the testing institutes, and let the new trades grow up around them."
 ITADNC_h_the_commercial_treaties: "The Commercial Treaties"
 ITADNC_h_the_commercial_treaties_desc: "Our tariff was written for a country that exported wine and imported everything else. It no longer describes us. The Treasury shall reopen the commercial treaties and revise the schedule line by line."
 ITADNC_h_the_interior_commands: "The Interior Commands"
 ITADNC_h_the_interior_commands_desc: "Troops sent to keep order answer to a general, and the general answers to the War Ministry, which has never wanted the duty. In practice, though not in law, the Interior shall command them, and the prefect will stop having to ask twice."
 ITADNC_h_the_school_makes_italians: "The School Makes Italians"
 ITADNC_h_the_school_makes_italians_desc: "We have made Italy, and we have not yet made Italians. The recruits who reach the barracks each speak their own dialect and little else. Our schools will teach one language, one history and one flag in every commune of the kingdom."
 ITADNC_h_the_majority_that_governs: "The Majority That Governs"
 ITADNC_h_the_majority_that_governs_desc: "Our majority survives every vote and carries nothing of its own. It turns up when the ministry asks and does nothing in between. The chancellor of the majority will take it in hand, and make it an instrument the ministry can use."
 ITADNC_h_the_king_calls_another: "The King Calls Another"
 ITADNC_h_the_king_calls_another_desc: "The presidency of the Council is not won in the Chamber. It is given at the Quirinal, the King's palace, and it can be taken back there. The King will call one of the ministers we have raised and charge him with forming a government."
 ITADNC_h_the_ministry_stands: "The Ministry Stands"
 ITADNC_h_the_ministry_stands_desc: "We risked a dissolution and went to the country. The elections are over and our majority has come back whole. We shall stay in office, the Crown will confirm us, and the work on the capital goes on."
 ITA_h_the_council_opens_tt: "Opens the §YCouncil of Seven§!. The King lends three seats at the council table, and each minister seated works his own branch alone."
 ITA_h_the_crown_gains_tt: "The §YCrown§! gains authority over the ministry."
 ITA_h_council_seat_tt: "If the three seats are already taken, the King must be asked which of the sitting ministers gives his up."
 ITA_h_council_cd_days_tt: "Days before the King will hear another name: [?ITA_h_council_cd_flag:days_left|Y0]"
 ITA_h_the_council_has_finished_tt: "Three of the ministers seated at the council table have each finished their own branch."
 ITA_h_nitti_named_tt: "§YFrancesco Saverio Nitti§! is called to the council table and takes up the industry of the South:"
 ITA_h_stringher_named_tt: "§YBonaldo Stringher§! is called to the council table and brings the Bank with him:"
 ITA_h_luzzatti_named_tt: "§YLuigi Luzzatti§! is called to the council table and takes the Treasury:"
 ITA_h_giolitti_named_tt: "§YGiovanni Giolitti§! is called to the council table and takes the Interior:"
 ITA_h_orlando_named_tt: "§YVittorio Emanuele Orlando§! is called to the council table and takes Public Instruction:"
 ITA_h_sacchi_named_tt: "§YEttore Sacchi§! is called to the council table and answers for the Extreme Left:"
 ITA_h_salandra_named_tt: "§YAntonio Salandra§! is called to the council table and answers for the Right:"
 ITA_h_the_seat_is_emptied_tt: "The minister sitting in that chair is dismissed and his branch stops where it stands."
 ITA_h_the_seat_is_filled_tt: "The new minister takes the chair and begins on the first work of his branch."
 ITA_h_the_name_is_withdrawn_tt: "The name is withdrawn, the political power is returned and the King will hear another at once."
 ITA_h_the_king_names_a_president_tt: "The minister is called to the Quirinal, the King's palace, and charged with forming the government."
 ITA_h_sacchi_leaves_the_cabinet_tt: "Sacchi leaves the cabinet for the presidency, and the radicals lose their voice in it."
 ITA_h_the_treasury_intrigue_tt: "The minister who prevails keeps the last word over the estimates, and the other two are shut out of it."
 ITA_h_stop_the_ministry_of_industry_tt: "The work on the Ministry of Industry and Labour stops where it stands, and the political power spent on it is lost."
 ITA_h_stop_the_plenipotentiary_of_credit_tt: "The work on the Plenipotentiary of Credit stops where it stands, and the political power spent on it is lost."
 ITA_h_stop_the_plenipotentiary_of_the_treasury_tt: "The work on the Plenipotentiary of the Treasury stops where it stands, and the political power spent on it is lost."
 ITA_h_the_treasury_intrigue_unsettled_tt: "Nobody is given the last word, and the quarrel is carried into the next session."
 ITA_h_plenipotentiary_me_tt: "Only one plenipotentiary may hold the last word over the estimates."
 ITA_h_the_special_law_for_naples_tt: "The industrial zone on the bay of Naples is opened by law."
 ITA_h_the_credit_for_industry_tt: "The Bank stands behind the industrial credit and the rescue of the failing houses."
 ITA_h_the_conversion_of_the_rendita_tt: "The interest we save on the debt is spent on new works in the north and on the steel mills."
 ITA_h_the_political_police_tt: "The reserved office, the political police, takes over the whole file on the subversives."
 ITA_h_the_guards_of_public_safety_tt: "The city guards become a sworn corps of the State under the prefect."
 ITA_h_the_law_on_the_schools_tt: "Children stay longer at school, and the evening classes are opened to adults."
 ITA_h_the_work_of_the_majority_tt: "The majority is set to work in the Chamber, and the ministry may call on it:"
 ITA_h_the_ministry_of_industry_tt: "Industry and labour are taken out of the agriculture ministry and given one of their own."
 ITA_h_the_plenipotentiary_of_credit_tt: "The director general of the Bank is made plenipotentiary over the industrial credit."
 ITA_h_the_files_are_joined_tt: "The cards of the reserved office and of the prefectures are joined in one directorate."
 ITA_h_the_mobile_squadrons_tt: "The mobile squadrons are raised, on horseback where there is no road and in lorries where there is."
 ITA_h_the_ascari_battalion_opens_tt: "Our ascari, the colonial troops in Africa, may now be formed into a battalion of their own."
 ITA_h_the_agency_and_the_press_tt: "The news agency stays on our subsidy, and we come to terms with the great Milan paper."
 ITA_h_the_leagues_in_the_majority_tt: "Prevents the Extreme Left from walking out of the Chamber."
 ITA_h_the_majority_gains_tt: "The §Ymajority§! in the Chamber is enlarged."
 ITA_h_the_prefects_deliver_tt: "The prefects prepare the constituencies before the writs are issued."
 ITA_h_the_new_industries_tt: "The testing institutes are funded and the new trades grow around them."
 ITA_h_the_commercial_treaties_tt: "The commercial treaties are reopened and the tariff schedule with them:"
 ITA_h_the_interior_commands_tt: "The troops kept for public order answer to the Interior in fact if not in law."
 ITA_h_the_school_makes_italians_tt: "One language, one history and one flag are taught in every commune of the kingdom."
 ITA_h_the_majority_that_governs_tt: "The chancellor makes the majority the instrument of the ministry."
 ITA_h_the_king_calls_another_tt: "The King will call one of the ministers of the council to form the government."
 ITA_h_the_ministry_stands_tt: "The Crown confirms the ministry in office, and the roads of the capital are widened."
 ITA_h_only_nitti_tt: "This focus can only be completed by §YNitti§!, once he has been called to the council table."
 ITA_h_only_stringher_tt: "This focus can only be completed by §YStringher§!, once he has been called to the council table."
 ITA_h_only_luzzatti_tt: "This focus can only be completed by §YLuzzatti§!, once he has been called to the council table."
 ITA_h_only_giolitti_tt: "This focus can only be completed by §YGiolitti§!, once he has been called to the council table."
 ITA_h_only_orlando_tt: "This focus can only be completed by §YOrlando§!, once he has been called to the council table."
 ITA_h_only_sacchi_tt: "This focus can only be completed by §YSacchi§!, once he has been called to the council table."
 ITA_h_only_salandra_tt: "This focus can only be completed by §YSalandra§!, once he has been called to the council table."
 ITA_h_only_the_chancellor_tt: "This focus can only be completed by the chancellor of the majority, once he has been called to the council table."
 ITA_h_only_the_industrial_minister_tt: "This focus can only be completed by whichever of §YNitti§! or §YStringher§! has taken the industrial portfolio."
