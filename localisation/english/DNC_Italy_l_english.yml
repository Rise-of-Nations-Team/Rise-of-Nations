 ITA_vittorio_cuniberti: "Vittorio Cuniberti"
 ITA_vittorio_cuniberti_desc: "Colonel of the naval engineers. He drew the all-big-gun ship years ago, and he has spent every year since explaining to committees why the small guns have to go."
 ITA_edoardo_masdea: "Edoardo Masdea"
 ITA_edoardo_masdea_desc: "Chief constructor of the Regia Marina, our navy. He put three gun barrels on one mounting before anyone else dared, and he did the sums twice before he asked to do them again."
 ITA_giacinto_pullino: "Giacinto Pullino"
 ITA_cesare_laurenti: "Cesare Laurenti"
 ITA_cesare_laurenti_desc: "He designed the double hull that became the Foca and then the Medusa class of submarine. The rest of Europe buys the design from us."
