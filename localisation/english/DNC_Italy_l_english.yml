 ITA_n_tb_the_glauco_boats: "The Glauco Boats"
 ITA_n_tb_the_triple_turret: "The Triple Turret"
 ITA_n_tb_the_sheffield_contract: "The Sheffield Contract"
 ITA_n_tb_the_laurenti_hull: "The Laurenti Hull"
 ITA_n_tb_the_dante_alighieri: "The Dante Alighieri"
 ITA_n_tb_the_cavour_class: "The Cavour Class"
 ITA_n_dr_the_night_attack: "The Night Attack"
 ITA_n_dr_the_naval_academy_study: "The Naval Academy Study"
 ITA_air_tb_the_airship_park: "The Airship Park"
 ITA_air_tb_the_lesson_of_wilbur_wright: "The Lesson of Wilbur Wright"
 ITA_air_tb_the_engine_that_is_ours: "The Engine That Is Ours"
 ITA_air_tb_the_airship_goes_to_sea: "The Airship Goes to Sea"
 ITA_air_tb_the_first_bomb: "The First Bomb"
 ITA_air_tb_the_answer_of_the_world: "The Answer of the World"
 ITA_air_dr_the_memoranda_of_douhet: "The Memoranda of Douhet"
 ITA_air_dr_the_command_of_the_air: "The Command of the Air"
 ITA_g_tt_the_reading_is_refused: "The reading is declined, and the papers of the Nile stay where they were."
 ITA_z_tt_the_syndicalists_refuse: "The chambers of labour will not sign, and the offer is left on the table."
 ITA_z_tt_the_soil_decides: "The children born on this soil belong to it, and the consulates say so."
 ITA_g_tt_stringher_takes_the_bank: "Bonaldo Stringher is available to the ministry as an adviser."
 ITA_wr_threat_the_islands: "Italy holds the islands as a pledge"
 ITA_tt_the_piazza_opens: "§YThe Piazza§! opens: the temper of the streets as the prefects report it, from calm to boiling, which moves stability, war support, political power and how fast we build."
 ITA_tt_the_chamber_opens: "§YThe Chamber§! opens: the majority the ministry can count on, assembled deputy by deputy, and it moves political power and stability."
 ITA_tt_the_crown_opens: "§YThe Crown§! opens: how much of the kingdom the King believes is his, from a King who listens to a King who governs, which moves political power and stability."
 ita_dnc.2103.t: "The Shot at Monza"
 ita_dnc.2103.d: "The King had just reviewed the gymnasts at Monza and raised his hand to the crowd. Gaetano Bresci fired at four paces.\n\nBresci makes no attempt to run. He tells the carabinieri that he paid his own passage home from Paterson in America, and that he was answering for the dead of Milan."
 ita_dnc.2103.a: "Follow the history. The King dies at Monza."
 ita_dnc.2103.b: "Turn the history. The shot misses, and the King rides on."
 ITA_dnc_air_sc: "Air Force"
 ITA_dnc_consulta_sc: "Foreign Policy"
 ITA_dnc_historical_sc: "The Works on the Frontier"
 ITA_dnc_uchronia_a_sc: "The Chamber Broken"
 ITA_dnc_uchronia_b_sc: "The Army Will Not Fire"
 ITA_h_the_open_frontier: "The Open Frontier"
 ITA_h_the_open_frontier_desc: "The treaty with Vienna forbids works on the passes above the Piave, so the ridges stand as our grandfathers left them. Our engineers may not fortify there, and the powers treat us as a country that will need an ally."
 ITA_e_the_rendita: "The Service of the Debt"
 ITA_e_the_rendita_desc: "The interest on the debt of the Risorgimento falls due whether the harvest comes in or not. The Treasury borrows every year to pay what it borrowed the year before.\n\nThe service of the debt: §Y[?ITA_e_rendita|%0]§! of the revenue.\n\nIf it ever reaches the whole of the revenue, the mills and the slipways lose a fifth of what they make."
 ITA_tt_the_rendita_opens: "§YThe Service of the Debt§! opens: the interest the Risorgimento left us, which grows every month by itself, comes out of what the mills make, and is pushed back only by the budget."
 ITA_h_tt_the_crown_is_humbled: "§RThe Crown has been made to give way in public.§! That has now happened §Y[?ITA_h_crown_blunders|0]§! times, and at two the road to the Italians under Austria closes."
 ITA_u_tt_a_court_accepts: "Another court has put itself under our word. §YThe courts that trust us§! now number §Y[?ITA_u_credit|0]§!."
