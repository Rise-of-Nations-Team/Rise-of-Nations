 ITA_air_tb_the_lagoon_station: "The Station on the Lagoon"
 ITA_air_tb_the_watch_on_pola: "The Watch on Pola"
 ITA_air_tb_the_memoranda: "The Memoranda of Douhet"
 ITA_air_tb_the_aero_engine: "An Engine of Our Own"
 ITA_air_tb_the_turin_bench: "The Bench at Turin"
 ITA_air_tb_the_aeronautical_shop: "The Aeronautical Shop"
 ITA_air_tb_the_gun_shop_learns: "The Gun Shop Learns the Trade"
 ITA_air_tb_the_civil_brevet: "The Civil Brevet"
 ITA_air_tb_the_settled_argument: "The Argument Settled"
 ITA_air_tb_the_aeroplane_wins: "The Aeroplane Wins the Estimates"
 ITA_air_tb_the_airship_keeps_it: "The Airship Keeps the Estimates"
 ITA_air_tb_the_slipway: "The Slipway and the Crane"
 ITA_air_tb_the_command_of_the_air: "The Command of the Air"
 ITA_air_tb_the_only_evidence: "The Only Evidence in Europe"
 ITA_air_tb_the_trimotor: "The Caproni Trimotor"
 ITA_air_tb_doctrine_meets_machine: "The Doctrine Meets the Machine"
 ITA_air_tb_the_standing_order: "The Standing Order"
 ITA_air_tb_the_three_year_list: "The Three Year List"
 ITA_air_tb_the_reserve: "The Reserve of Brevets"
 ITA_air_tb_the_naval_service: "The Naval Flying Service"
 ITA_air_tb_the_admiralty_vote: "The Admiralty Vote"
 ITA_air_tb_the_new_arm: "An Arm of Its Own"
 ITA_air_tb_the_directorate: "The Directorate of Aeronautics"
 ITA_air_the_answer_threat: "Italy has bombed from the air"
 ITA_air_the_adriatic_watch_threat: "Italian airships over the Adriatic"
 ITA_air_the_doctrine_threat: "The Italian bombardment squadrons"
 ITA_air_the_trimotor_threat: "The Italian heavy aeroplane"
 ITA_air_the_new_arm_threat: "Italy has raised an air arm"
 ita_dnc.1500.t: "Rome Renews the Alliance"
 ita_dnc.1500.d: "The Italian ambassador brings the renewal and asks for nothing with it. Our ministers read the military convention that comes attached and find it unchanged.\n\nRome has renewed before and built a fleet base facing us the same year. The question is whether to take the paper at its word."
 ita_dnc.1500.a: "Take the renewal at its word."
 ita_dnc.1500.b: "Sign it, and watch them."
 ita_dnc.1501.t: "Vienna Signs Warmly"
 ita_dnc.1501.d: "The Ballhausplatz answers within the week. The renewal is welcomed as the act of an ally, and the covering minute, which our black cabinet has read, says the same thing in private.\n\nThat has not happened before. It gives us something to spend."
 ita_dnc.1501.a: "Good. Now it can be spent."
 ita_dnc.1502.t: "Vienna Signs Without Warmth"
 ita_dnc.1502.d: "The renewal comes back signed and nothing else. The Austrian ambassador, asked whether his court is content, says that his court has signed.\n\nOur attaché reports that the frontier garrisons in the Tyrol were not reduced this spring."
 ita_dnc.1502.a: "Then we know where we stand."
 ita_dnc.1530.t: "A Note from Rome"
 ita_dnc.1530.d: "The Italian ambassador hands over two paragraphs in his own hand. If France is attacked, Italy will stand neutral; and Italy will do nothing in North Africa that France would resent.\n\nIt is worth a great deal, if it stays in the safe. It is worth something else if it does not."
 ita_dnc.1530.a: "Take it, and keep it in the safe."
 ita_dnc.1530.b: "Take it, and let Vienna hear of it."
 ita_dnc.1531.t: "Paris Talks About Rome"
 ita_dnc.1531.d: "A French deputy, defending a colonial estimate, says more than he needed to about Italian goodwill in the Mediterranean. Our embassy sends the cutting the same evening.\n\nEither Rome has given Paris an undertaking, or Paris wants us to think so. We can ask, or we can remember."
 ita_dnc.1531.a: "Ask Rome directly."
 ita_dnc.1531.b: "Say nothing, and remember it."
 ita_dnc.1510.t: "Rome Gives Notice"
 ita_dnc.1510.d: "The Italian ambassador reads the declaration standing. The alliance will lapse and will not be renewed. He adds that the Kingdom remains a friendly neighbour, which is the phrase used about neighbours who are not friends.\n\nThe staff asks whether the Tyrol garrisons should be brought up now, while Rome is still explaining itself."
 ita_dnc.1510.a: "Accept the notice coldly."
 ita_dnc.1510.b: "Answer with a warning on the frontier."
 ita_dnc.1511.t: "Vienna Answers with a Warning"
 ita_dnc.1511.d: "The reply to our notice is not a note. It is the recall of leave in the Tyrol garrisons and a communiqué that speaks of the security of the monarchy's southern frontier.\n\nThe Chamber wants to know whether the ministry expected this. The ministry can stand on the notice or soften it."
 ita_dnc.1511.a: "Stand on the notice."
 ita_dnc.1511.b: "Send a softer note after the first one."
 ita_dnc.1512.t: "Rome Leaves the Triplice"
 ita_dnc.1512.d: "Rome has given Vienna notice that the alliance will lapse. The Italian ambassador here is anxious to say that nothing changes between Berlin and Rome.\n\nThe staff has long counted the Italian army for the Rhine. It would like to know whether to go on counting it."
 ita_dnc.1512.a: "Let them go."
 ita_dnc.1512.b: "Keep the door open."
 ita_dnc.1513.t: "Berlin Keeps the Door Open"
 ita_dnc.1513.d: "The Wilhelmstrasse takes our notice to Vienna as a matter between Rome and Vienna. The Chancellor lets it be known that a separate understanding with Berlin would be read with interest.\n\nWe have left one alliance and not yet lost the other half of it."
 ita_dnc.1513.a: "Note it, and keep the channel."
 ita_dnc.1514.t: "Berlin Shuts the Door"
 ita_dnc.1514.d: "Berlin answers our notice to Vienna as if it had been addressed to Berlin. The military attaché is no longer received by the staff. The trade talks are adjourned without a date.\n\nWe are out of the Triplice altogether, which is what the notice said and not what the ministry meant."
 ita_dnc.1514.a: "Then Paris and London it is."
 ita_dnc.1515.t: "Rome Is Free"
 ita_dnc.1515.d: "Italy has given notice to Vienna. For the first time since the Tunis affair, Rome has no ally on the other side of the Alps and no treaty that binds her against us.\n\nThe Quai wants to know whether to court her now or let her come."
 ita_dnc.1515.a: "Court her now."
 ita_dnc.1515.b: "Let her come to us."
 ita_dnc.1520.t: "The Italian Staff Comes to Berlin"
 ita_dnc.1520.d: "General Pollio and two colonels arrive with the timetable for a third army on the Rhine. They want the rolling stock, the detraining stations and a date on which the convention is more than a convention.\n\nThe General Staff will agree to all of it if Rome can be relied on, and to none of it if Rome cannot."
 ita_dnc.1520.a: "Agree the timetable."
 ita_dnc.1520.b: "Listen, and promise nothing."
 ita_dnc.1521.t: "The Timetable Is Agreed"
 ita_dnc.1521.d: "Berlin has signed the timetable. Three corps, the trains found, the stations named. The staff comes home with a document that binds the Kingdom to the Rhine on the eleventh day of a mobilisation.\n\nThe Chamber has not seen it and will not."
 ita_dnc.1521.a: "File it where the Chamber cannot read it."
 ita_dnc.1522.t: "Berlin Listens"
 ita_dnc.1522.d: "The staff comes home with dinners and no signatures. The Germans were courteous about the third army and said that the question of the trains would be studied.\n\nThey do not believe we would come."
 ita_dnc.1522.a: "They may be right."
 ita_dnc.1525.t: "Rome Reaffirms the Alliance"
 ita_dnc.1525.d: "The Italian government asks that the alliance be read as a true one. The military convention, it says, is to be honoured to the letter, and the ministry would like Vienna to say so.\n\nThe Ballhausplatz has heard this from Rome before. This time the question is whether to believe it."
 ita_dnc.1525.a: "Believe them, and say so."
 ita_dnc.1525.b: "Note it, and doubt it."
 ita_dnc.1526.t: "Vienna Believes Us"
 ita_dnc.1526.d: "The answer from the Ballhausplatz uses the word ally without a qualifying clause. The convention is to be worked out between the staffs. The Emperor sends a decoration.\n\nIt is the first time in twenty years that Vienna has taken our word at its face."
 ita_dnc.1526.a: "It has been a long time coming."
 ita_dnc.1540.t: "Rome Demands the Irredenta"
 ita_dnc.1540.d: "The Italian note names the Trentino, Trieste and Istria and asks for their transfer as the price of peace between the two kingdoms. It is not phrased as an ultimatum. It does not need to be.\n\nThe staff answers that the Tyrol can be held. The Foreign Ministry answers that the Trentino alone has been on the table before. The Hungarians answer that they will not fight for Trieste."
 ita_dnc.1540.a: "Cede the Trentino, and keep the peace."
 ita_dnc.1540.b: "Refuse."
 ita_dnc.1540.c: "Offer the Trentino for their neutrality."
 ita_dnc.1541.t: "Vienna Yields the Trentino"
 ita_dnc.1541.d: "The Austrian answer cedes the Trentino to the Brenner watershed and says nothing about Trieste. The commissioners meet at Ala within the month.\n\nThe piazza wanted the whole of the irredenta. The ministry has half of it without a shot, which is a thing the piazza will have to be told is a victory."
 ita_dnc.1541.a: "Half the irredenta, and no war."
 ita_dnc.1542.t: "Vienna Refuses"
 ita_dnc.1542.d: "The refusal is short and is published in Vienna before it reaches Rome. The Tyrol garrisons are brought to war strength. The Austrian ambassador asks for his passports and is told to keep them for now.\n\nThe claim is now a claim with a casus belli under it. The Chamber has to decide what it is worth."
 ita_dnc.1542.a: "Then it will be settled on the Isonzo."
 ita_dnc.1543.t: "Vienna Offers the Trentino for Our Neutrality"
 ita_dnc.1543.d: "Vienna is at war and answers our note with an offer. The Trentino now, in exchange for a declaration that the Kingdom will stand neutral for the duration.\n\nTrieste is not in the offer. The ministry can take what is on the table, or say that it is not enough."
 ita_dnc.1543.a: "Take the Trentino, and stand aside."
 ita_dnc.1543.b: "Not enough. Trieste too."
 ita_dnc.1544.t: "The Trentino Changes Hands"
 ita_dnc.1544.d: "Vienna has ceded the Trentino to Rome rather than fight for it. The Italian ambassador is pleased and says so. The Austrian ambassador is not and says nothing.\n\nAn ally who can be made to pay will be asked to pay again."
 ita_dnc.1544.a: "It was Vienna's to give."
 ita_dnc.1544.b: "Rome has learnt how to ask."
 ita_dnc.1545.t: "Rome Asks for the Irredenta by Force"
 ita_dnc.1545.d: "Vienna has refused the Italian demand and Rome has a casus belli under her claim. The Austrian ambassador asks what Berlin will do if the Italians cross the Isonzo.\n\nThe staff would rather not fight Italy over the Trentino. The staff would rather not lose Austria either."
 ita_dnc.1545.a: "Stand behind Vienna."
 ita_dnc.1545.b: "Hold aloof."
 ita_dnc.1546.t: "Berlin Stands Behind Vienna"
 ita_dnc.1546.d: "The German guarantee is announced in the Reichstag. The staff is told that a war for the Trentino is a war on two fronts, and that the second front is the one that matters.\n\nThe piazza does not read the Reichstag. The ministry does."
 ita_dnc.1546.a: "Then we must be very sure before we march."
 ita_dnc.1547.t: "Berlin Holds Aloof"
 ita_dnc.1547.d: "Berlin lets it be known that the Trentino is a matter between Rome and Vienna. The German ambassador in Rome is, if anything, cordial.\n\nVienna is alone in this, and Vienna knows it."
 ita_dnc.1547.a: "Vienna is alone."
 ita_dnc.1550.t: "The Italians Ask About the Balkans"
 ita_dnc.1550.d: "The King of Italy proposes a meeting at Racconigi and an understanding to follow it. Rome would recognise our interest in the Straits. We would recognise hers in Tripoli. Both would agree that the Balkans are not Vienna's to arrange.\n\nIt costs us nothing that we were going to keep."
 ita_dnc.1550.a: "Agree. The Balkans are not Vienna's."
 ita_dnc.1550.b: "Decline. We have Vienna to think of."
 ita_dnc.1551.t: "Petersburg Agrees"
 ita_dnc.1551.d: "The understanding is initialled at Racconigi in a single afternoon. The Tsar recognises our interest in Tripoli. We recognise his in the Straits. Neither of us will let Vienna arrange the Balkans alone.\n\nIt is the first paper we have signed with a power that is not our ally."
 ita_dnc.1551.a: "A second string to the bow."
 ita_dnc.1552.t: "Racconigi Is Read in Vienna"
 ita_dnc.1552.d: "The Tsar and the King of Italy have met at Racconigi and our embassy has the text of what they agreed within the fortnight. The Balkans, it says, are not to be arranged by one power alone. The one power is us.\n\nRome has bargained behind our back. The question is whether to say so."
 ita_dnc.1552.a: "Protest to Rome."
 ita_dnc.1552.b: "Say nothing, and remember it."
 ita_dnc.1553.t: "Vienna Protests"
 ita_dnc.1553.d: "The Austrian protest is formal and is handed over in the presence of the German ambassador. Rome has undertaken, it says, to arrange the Balkans with Petersburg against her own ally.\n\nThe ministry can deny that the paper says what it says. Vienna has the paper."
 ita_dnc.1553.a: "The paper says what it says."
 ita_dnc.1554.t: "Petersburg Declines"
 ita_dnc.1554.d: "The Russian answer is warm and empty. The Tsar will be pleased to receive the King, and the Straits are not a matter for a paper.\n\nPetersburg has Vienna to think of, or Paris has asked her to."
 ita_dnc.1554.a: "Then Tripoli is ours to take alone."
 ita_dnc.1560.t: "Rome Buys Valona"
 ita_dnc.1560.d: "Both courts are paying the same Albanian chiefs, opening rival schools in the same towns and surveying the same anchorage. The Italian consul at Valona has been seen with a naval officer and a tape.\n\nWe can propose that both of us stop, or tell Rome to."
 ita_dnc.1560.a: "Propose an understanding. Neither of us takes it."
 ita_dnc.1560.b: "Warn Rome off the Adriatic."
 ita_dnc.1561.t: "Vienna Warns Us Off Valona"
 ita_dnc.1561.d: "The Austrian note says that the monarchy regards the Albanian coast as a matter of its own security and would view an Italian establishment there as an unfriendly act.\n\nThe Adriatic is a narrow sea. Whoever holds Valona holds the door of it."
 ita_dnc.1561.a: "Back down, for now."
 ita_dnc.1561.b: "Claim it anyway."
 ita_dnc.1562.t: "Two Courts Bid for Albania"
 ita_dnc.1562.d: "The Italian and Austrian consuls at Valona are buying the same beys. Each has a school, a doctor and a survey party, and neither has asked the Porte.\n\nThe vilayet is ours. It is a question of whether to garrison it like ours."
 ita_dnc.1562.a: "Reinforce the vilayet."
 ita_dnc.1562.b: "Let them bid. The beys are ours either way."
 ita_dnc.1563.t: "The Porte Reinforces Albania"
 ita_dnc.1563.d: "Two battalions land at Durazzo and a third marches up from Janina. The beys we have been paying take the Sultan's pay as well.\n\nValona is not going to be bought. It will have to be waited for, or taken."
 ita_dnc.1563.a: "The survey stays in the drawer."
 ita_dnc.1570.t: "Rome Demands Satisfaction for Adwa"
 ita_dnc.1570.d: "The Italian resident brings a note. The Kingdom requires the cession of Tigray to the escarpment and the recognition of an Italian protectorate over the trade of the north. Failing this, the army of Eritrea will march.\n\nWe beat them once with spears. They have had years to count why."
 ita_dnc.1570.a: "Cede Tigray, and keep the crown."
 ita_dnc.1570.b: "Refuse. Adwa was not an accident."
 ita_dnc.1571.t: "Menelik Yields Tigray"
 ita_dnc.1571.d: "The Emperor cedes Tigray to the escarpment rather than fight a second time. His envoy signs at Asmara and does not stay for the dinner.\n\nAdwa is answered, on paper. The staff points out that the same roads still lead to the same plateau."
 ita_dnc.1571.a: "Adwa is answered."
 ita_dnc.1572.t: "Italy Moves on Abyssinia"
 ita_dnc.1572.d: "Rome has demanded Tigray and been refused, and the army of Eritrea is being brought up to the escarpment. The Emperor's envoy asks whether Britain will guarantee what Britain has recognised.\n\nThe Nile waters rise in his country. Rome has been useful in the Mediterranean."
 ita_dnc.1572.a: "Warn Rome, and guarantee the Emperor."
 ita_dnc.1572.b: "Let Rome burn her fingers."
 ita_dnc.1573.t: "London Guarantees Abyssinia"
 ita_dnc.1573.d: "The British ambassador reads us a guarantee to the Emperor and adds, without instruction, that the Mediterranean fleet is at Malta this season.\n\nThe expedition can go on into a war with Britain behind the enemy, or halt at the escarpment."
 ita_dnc.1573.a: "Go on regardless."
 ita_dnc.1573.b: "Halt at the escarpment."
 ita_dnc.1574.t: "London Looks Away"
 ita_dnc.1574.d: "The British ambassador says that His Majesty's Government has no interest in the interior of Abyssinia beyond the waters of the Nile, and would be glad to be told when that becomes relevant.\n\nWe have a free hand as far as the escarpment."
 ita_dnc.1574.a: "A free hand, as far as the escarpment."
 ita_dnc.1575.t: "Rome Proposes a Boundary"
 ita_dnc.1575.d: "The Italian resident brings a map with a line on it, an offer of a road from the coast and the recognition of the Emperor's title. The line is further back than the last one.\n\nWe can sign it, or ask for the customs at the coast before we do."
 ita_dnc.1575.a: "Sign the boundary."
 ita_dnc.1575.b: "Sign, but ask for the customs at Massawa first."
 ita_dnc.1576.t: "Menelik Asks for the Customs"
 ita_dnc.1576.d: "The Emperor will sign the boundary if the customs at Massawa are shared. His envoy has the figures and they are not small.\n\nThe colony pays for itself or it does not. The boundary is worth something too."
 ita_dnc.1576.a: "Grant the customs, and sign."
 ita_dnc.1576.b: "Refuse. There is no treaty."
 ita_dnc.1580.t: "The Italian Note on Tripoli"
 ita_dnc.1580.d: "Rome asks that Italian enterprise in Tripoli be given the standing of the state behind it: the bank, the school, the shipping line, and a consul who is heard. The note does not mention the garrison. The garrison is what it is about.\n\nWe can let the Italians buy the vilayet slowly, or make it expensive now."
 ita_dnc.1580.a: "Concede Italian enterprise, and no more."
 ita_dnc.1580.b: "Reinforce Tripoli."
 ita_dnc.1581.t: "The Porte Concedes the Bank"
 ita_dnc.1581.d: "The Porte answers that Italian enterprise in Tripoli is welcome and that the consul will be heard. It answers nothing about the garrison, which is left where it is.\n\nThe door is open a hand's breadth. It can be pushed, or walked through slowly."
 ita_dnc.1581.a: "Walk through slowly."
 ita_dnc.1582.t: "The Porte Reinforces Tripoli"
 ita_dnc.1582.d: "The Porte answers the note with two battalions from Smyrna and a governor known for his opinions of Italians. The bank's manager is asked to produce his papers weekly.\n\nThe note was a question. The answer is no."
 ita_dnc.1582.a: "Then the note becomes an ultimatum."
 ita_dnc.1582.b: "Withdraw the note."
 ita_dnc.1583.t: "Rome Asks About Tripoli"
 ita_dnc.1583.d: "The Italian ambassador asks, without a note, whether an Italian establishment in Tripoli would be regarded as a matter of concern. He does not say establishment of what.\n\nWe can acquiesce and have Rome in our debt, or object and have Rome remember it."
 ita_dnc.1583.a: "Acquiesce."
 ita_dnc.1583.b: "Object."
 ita_dnc.1585.t: "The Italian Ultimatum"
 ita_dnc.1585.d: "Rome gives the Porte a day and a night to consent to the occupation of Tripolitania and Cyrenaica. The note offers guarantees for the Sultan's religious authority and nothing for his sovereignty.\n\nThe garrison is small and the sea is theirs. The vilayet is ours. The question is what the empire can afford to lose this year."
 ita_dnc.1585.a: "Cede the vilayet."
 ita_dnc.1585.b: "Refuse. Let them come and take it."
 ita_dnc.1586.t: "The Porte Yields Tripoli"
 ita_dnc.1586.d: "The Porte's answer arrives before the hour is out and it is not the one the fleet was waiting for. The vilayet is ceded, subject to the Sultan's religious authority, which the note is careful to keep.\n\nThe fourth shore is ours without a landing. The army of Africa has been promised one."
 ita_dnc.1586.a: "A province, and no war."
 ita_dnc.1587.t: "Italy and the Porte"
 ita_dnc.1587.d: "Rome has sent the Porte an ultimatum over Tripoli and the Porte has refused it. The Italian fleet is at sea. Whatever else it does, it will pass Rhodes.\n\nThe islands are Greek in everything but the flag."
 ita_dnc.1587.a: "Watch Rhodes."
 ita_dnc.1587.b: "Stay quiet."
 ita_dnc.1588.t: "Rome Goes to War Without Asking"
 ita_dnc.1588.d: "Rome has sent the Porte an ultimatum over Tripoli. We were told after the note was handed over, in the form of a copy.\n\nAn ally who consults us afterwards is telling us something."
 ita_dnc.1588.a: "Protest the manner of it."
 ita_dnc.1588.b: "Note it."
 ita_dnc.1590.t: "Terms at Ouchy"
 ita_dnc.1590.d: "The Italian plenipotentiaries offer peace at Ouchy. The vilayet passes to Rome. The Sultan keeps his religious authority there and a pension for the officials. The islands, they say, will be returned when the last Ottoman officer has left Africa.\n\nThe war is lost on the coast and not lost in the interior. The empire has other frontiers."
 ita_dnc.1590.a: "Sign."
 ita_dnc.1590.b: "Fight on."
 ita_dnc.1591.t: "The Porte Signs at Ouchy"
 ita_dnc.1591.d: "The treaty is signed at Ouchy in the afternoon. The vilayet is ours. The Sultan keeps his name in the Friday prayers and we keep the coast, which is what we came for.\n\nThe interior has not been asked."
 ita_dnc.1591.a: "The coast is ours. The interior can wait."
 ita_dnc.1592.t: "The Porte Will Not Sign"
 ita_dnc.1592.d: "The Ottoman plenipotentiaries leave Ouchy without signing. The Porte will fight on in the interior, where the Senussi fight for it, and let us hold a coast that costs a division a month.\n\nWe can take the interior, or make the terms worth signing."
 ita_dnc.1592.a: "Then we take the interior."
 ita_dnc.1592.b: "Sweeten the terms."
 ita_dnc.1595.t: "Rhodes Under the Tricolour"
 ita_dnc.1595.d: "The Italians have landed on Rhodes and the smaller islands, almost unopposed. The notables came out to meet the boats. They are Greeks and they are cheering.\n\nRome calls it a pledge, held until the Porte signs. Pledges have a way of staying held."
 ita_dnc.1595.a: "Protest the occupation."
 ita_dnc.1595.b: "Ask that they never go back to the Porte."
 ita_dnc.1596.t: "Athens Claims the Islands"
 ita_dnc.1596.d: "The Greek protest is polite and is accompanied by a map on which the islands are already coloured blue. Athens does not ask us to leave. It asks us to remember whose they are.\n\nThe pledge now has two claimants and one holder."
 ita_dnc.1596.a: "Held is held."
 ITA_w_threat_vienna_answers: "Vienna answers the notice"
 ITA_w_tt_a_power_consents: "§GA power consents to our enterprise in Tripoli.§!"
 ITA_w_tt_a_power_objects: "§RA power objects to our enterprise in Tripoli.§!"
 ITA_w_tt_the_porte_answers: "§YThe Porte will answer the terms within the week.§!"
 ITA_w_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITADNC_the_kingdom: "The Kingdom of Italy"
 ITADNC_the_kingdom_desc: "The Cassation has struck down the decrees and the Chamber is obstructed from the Extreme Left. We must decide who governs this kingdom in the name of the Statuto."
 ITA_tt_choose_who_governs_after_the_crisis: "Choose who governs in the name of the Statuto: the ministry, the Crown, the Bloc, the Nation or the Church."
 ITA_ch_threat_the_frontier_is_manned: "The Alpine Frontier Is Manned"
 ITA_ch_threat_the_insurrection: "The Insurrection in the Romagna"
 ITA_r_garibaldian_legion_tt: "The Garibaldian Legion takes the field: five thousand men, the experience of a volunteer corps, and one division raised on our own soil."
 ita_dnc.2100.t: "Regicide at Monza"
 ita_dnc.2100.d: "The Prince of Naples has never been trusted with anything and is King of Italy tonight. The ministry must say what the kingdom does before the funeral train leaves."
 ita_dnc.2100.a: "A state of siege in the red cities, and the subscription lists seized."
 ita_dnc.2100.b: "Saracco, and the amnesty of the new reign."
 ita_dnc.2100.c: "The Estrema will not walk behind the coffin. Let it be seen."
 ita_dnc.2100.e: "The nation goes into mourning, and the mourning will be ours to lead."
 ita_dnc.2101.t: "The Oath at the Quirinale"
 ita_dnc.2101.d: "The King came up on a night train and swore before the two Chambers to observe the Statuto loyally. There are two Statutos in that room: the text, in which ministers answer to the Crown, and the practice grown over it, in which no ministry survives a hostile vote.\n\nHis father died believing the first. The men in front of him have built their careers on the second, and they are watching his face to see which one he has just sworn to."
 ita_dnc.2101.a: "As it is written."
 ita_dnc.2101.b: "As it has been practised."
 ita_dnc.2102.t: "The New Reign Is Asked"
 ita_dnc.2102.d: "The decrees of public safety lapsed with the old reign and the Interior has laid them again on the desk of a King who has been on the throne for a fortnight. The Cassation has already said what it thinks of them.\n\nThe Court wants to know whether the new King signs what his father signed. The Chamber wants to know the same thing, for the opposite reason."
 ita_dnc.2102.a: "The King signs, and the prefects have their powers back."
 ita_dnc.2102.b: "The King will not begin his reign under a decree."
 ita_dnc.2104.t: "Genoa Shuts Its Port"
 ita_dnc.2104.d: "The prefect has dissolved the chamber of labour by decree, on the ground that it took dues from dock workers who were not its members. Within a day the port is shut, the tram men are out and the Ligurian committee has voted a general strike in a city that handles a third of the kingdom's trade.\n\nThe ministry has no answer prepared and the Chamber reconvenes within six weeks. The question will be on the order paper whether we put it there or not."
 ita_dnc.2104.a: "Restore the chamber of labour and recall the prefect."
 ita_dnc.2104.b: "The prefect is sustained. He applied the law as it stands."
 ita_dnc.2104.c: "Let the ministry fall on it rather than answer for it."
 ita_dnc.2105.t: "The Last Question"
 ita_dnc.2105.d: "The decade is closing and nothing has been settled by us. The men who could settle it are still in the room, and they will not sit there for ever.\n\nWe are asked, once, what this ministry was for. The answer will be read out at the end and there will be no second reading."
 ita_dnc.2105.a: "The system worked. Say so, and let the arithmetic stand."
 ita_dnc.2105.b: "The Crown governed. Let it be written that it governed."
 ita_dnc.2105.c: "The Bloc was in the State. That is the whole of it."
 ita_dnc.2105.e: "The nation was armed and the nation was asked. That is enough."
 ita_dnc.2105.f: "The altar and the throne stood together. Let the country see it."
 ita_dnc.2105.g: "Nobody decided anything, and the ledger will say so."
 ita_dnc.2105.h: "The arithmetic will not stand. Let the ministry go and the next one answer for it."
 ita_dnc.2105.i: "The Crown will not put its name to this. Let the ministry answer alone."
 ita_dnc.2105.j: "The Bloc will not sign a verdict upon itself. Let the question be adjourned."
 ita_dnc.2105.k: "The nation was never asked, and we will not pretend that it was."
 ita_dnc.2105.l: "The altar is not entered in a ledger. Let the question wait for better men."
 ITA_end_the_caretakers: "The Caretakers"
 ITA_end_the_caretakers_long: "The Caretaker Ministry"
 ITA_end_tt_the_verdict_is_refused: "The verdict is refused. A caretaker ministry takes the chair and the question is left to the men who come after us."
 ita_dnc.2108.t: "Six Hundred Thousand a Year"
 ita_dnc.2108.d: "Naples, Palermo, Genoa. They are men of military age, they are the ones who could have gone either to America or to a barricade, and the money they post home closes the trade deficit of a great power.\n\nThe Commissariat can protect them on the voyage and count them as they go, or the prefects can refuse a passport to any man of the conscription class and keep the villages full."
 ita_dnc.2108.a: "Protect them. We will not stop them."
 ita_dnc.2108.b: "Let them go, and let the remittances answer for it."
 ita_dnc.2112.t: "The Chambers of Labour Vote to Come Out"
 ita_dnc.2112.d: "It began over a shooting and it is now in Milan, Genoa, Turin and the capital at once, without a central committee, without a demand and without a fund. The trams have stopped, the port has stopped and the newspapers are not being printed.\n\nNobody in this ministry has seen a general strike before, because until this week no European country had one. The piazza stands at §Y[?ITA_piazza|0]§!."
 ita_dnc.2112.a: "Send the prefect to sit at the table with them."
 ita_dnc.2112.b: "The garrison will clear the squares by this evening."
 ita_dnc.2112.c: "It has no demands. It will exhaust itself."
 ita_dnc.2116.t: "The Elections of the Strike"
 ita_dnc.2116.d: "The Chamber goes home and the country is asked instead, with the strike still in every memory and the clergy released from the ban in a few dioceses. In half the southern constituencies the poll is a formality arranged in the prefecture.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects."
 ita_dnc.2116.a: "Work the prefectures. A candidate who wants the seat comes to the Interior first."
 ita_dnc.2116.b: "Fight it on what the ministry has actually built."
 ita_dnc.2116.c: "The government will not touch this election."
 ita_dnc.2120.t: "The Veto at the Conclave"
 ita_dnc.2120.d: "The Pope is dead and the cardinals are shut in. Our ambassador reports that the Secretary of State, who has spent his career leaning on Paris and has never hidden what he thinks of the monarchy, will be elected on the next scrutiny unless the Emperor uses the right of exclusion that his house has held since anyone can remember.\n\nThe Cardinal of Cracow is willing to carry the word into the conclave. It has never been used in living memory, and using it will be known within the day."
 ita_dnc.2120.a: "Use the right of exclusion. The crown has held it for centuries."
 ita_dnc.2120.b: "The Emperor will not put his hand into a conclave."
 ita_dnc.2121.t: "A Pope Who Was a Parish Priest"
 ita_dnc.2121.d: "The conclave has been through a veto to reach the patriarch of Venice, the son of a village postman. He has spent his life in parishes, and in several of those parishes the socialists took the council while the faithful stayed home under the ban as instructed.\n\nHe has said nothing about the ban and has not repeated it either, which in these matters is a sentence rather than a silence."
 ita_dnc.2121.a: "Sound the Vatican quietly, through the men who can be sounded."
 ita_dnc.2121.b: "Say nothing, and let the bishops move first."
 ita_dnc.2122.t: "The Cardinal Secretary Is Elected"
 ita_dnc.2122.d: "No crown was raised against him and the Secretary of State is Pope. He knows every chancellery in Europe, he has never conceded a syllable on the guarantees, and he owes his election to the fact that nobody stopped it.\n\nThe ban on Catholic voting stays exactly where it was, and it will be enforced by a man who wrote most of it."
 ita_dnc.2122.a: "Then the ban stays where it is, and we govern without those votes."
 ita_dnc.2122.b: "Ask, through the usual channel, what the new pontificate will cost us."
 ita_dnc.2124.t: "The Line Is Stopped"
 ita_dnc.2124.d: "The private companies have let the permanent way rot and the enginemen have answered with a stoppage that has cut the peninsula in half. The Chamber has been shown the accounts and does not believe them.\n\nWe can take the lines into the hands of the State and put the men under a discipline, or we can pay the companies again and hear the same thing in a year."
 ita_dnc.2124.a: "Buy the lines, and let the State run them under military discipline."
 ita_dnc.2124.b: "Concede, and let the companies keep what is theirs."
 ita_dnc.2128.t: "The Old Man of Brescia"
 ita_dnc.2128.d: "The President of the Council is dying in office and will not resign, and the Interior has governed in his name for a year. The party of the ministry is already counting.\n\nThe succession is between the man who made this Chamber and a lawyer of the Romagna who will keep the seat warm and nothing else."
 ita_dnc.2128.a: "The Interior takes the Presidency of the Council."
 ita_dnc.2128.b: "A caretaker, then, and the Chamber keeps its distance."
 ita_dnc.2130.t: "The Provinces Are Annexed"
 ita_dnc.2130.d: "Vienna has annexed the two provinces it has occupied since the Congress, without a conference and without asking anyone. The seventh article of our treaty says that no change in the Balkans is made without compensation to the other party.\n\nThe piazza has read the article in the newspapers and is in the street with it. We may invoke it, sell it, or look elsewhere for a friend who reads treaties the same way we do."
 ita_dnc.2130.a: "Invoke the article. The compensation is owed and we shall name it."
 ita_dnc.2130.b: "Take the abrogation of the twenty-ninth article and call it settled."
 ita_dnc.2130.c: "Then we look east, to the only court with the same grievance."
 ita_dnc.2133.t: "Buggerru"
 ita_dnc.2133.d: "The Sardinian pits struck over the hour they are made to lose at the coal face, and the company wrote to the prefect asking for troops. The troops came, and the troops fired.\n\nThe telegraph out of the island is slow. By the time the chambers of labour have the story it will have been improved in the telling, and it will be true enough."
 ita_dnc.2133.a: "Court-martial the lieutenant and move the regiment off the island."
 ita_dnc.2133.b: "The troops were stoned first. The file is closed and the officer confirmed."
 ita_dnc.2134.t: "The First General Strike"
 ita_dnc.2134.d: "Milan struck first and Genoa followed the same evening, then Turin, then the capital. There is no train moving north of Florence and no newspaper printing but the socialist ones, and nobody ordered any of it.\n\nNo European state has seen this before. There is no article of the code that fits it and no precedent to send to the prefects."
 ita_dnc.2134.a: "Let it exhaust itself, then dissolve the Chamber."
 ita_dnc.2134.b: "The garrisons out. Every station and every tram shed under guard by morning."
 ita_dnc.2134.c: "Concede the eight-hour day in the mines and be done with it."
 ita_dnc.2136.t: "Tangier"
 ita_dnc.2136.d: "The Emperor landed on the Moroccan coast and spoke of the independence of the Sultan, and a conference has been called to settle what he meant. Our ally asks for our vote and our friend across the Alps asks for our silence, which is the same thing said politely.\n\nWe have promised the second party in writing that we will not cross it in North Africa. The first party has never been told."
 ita_dnc.2136.a: "Our vote goes with the ally. The treaty is a treaty."
 ita_dnc.2136.b: "Our vote goes the other way, and the note we signed is honoured."
 ita_dnc.2136.c: "We will say nothing at all, and let the conference read it as it likes."
 ita_dnc.2137.t: "Conrad Asks for the War"
 ita_dnc.2137.d: "Our attache reports that the Chief of the General Staff has asked his Emperor, for the fourth time, for a preventive war against the Kingdom, and that this time the Foreign Ministry did not object at once. The Tyrol garrisons are being brought up to strength for manoeuvres that were not on the calendar.\n\nWe can man the frontier and let it be seen, or leave the answer to the old man in the Hofburg."
 ita_dnc.2137.a: "Man the frontier, and let them read it in the returns."
 ita_dnc.2137.b: "Say nothing. The Emperor has refused him three times already."
 ita_dnc.2138.t: "The Insurrection"
 ita_dnc.2138.d: "The Romagna has been out of the government's hands for three months and the rest of the country has stopped pretending otherwise. The reservists called up in the Marche did not report and a garrison commander has asked to be relieved rather than fire.\n\nWhat is being read from the balconies is no longer a list of grievances but a constitution. The kingdom is past the point where a ministry decides anything."
 ita_dnc.2138.a: "Then it is a war, and we shall fight it."
 ita_dnc.2139.t: "The Hour Strikes"
 ita_dnc.2139.d: "The Empire is at war on another frontier and every square in the north is full of men shouting the names of two cities that are not ours. The interventionist committees have stopped asking the ministry and started announcing what the ministry will do.\n\nThe army says it needs a season. The street says it needs an hour."
 ita_dnc.2139.a: "Now, while the other frontier holds them."
 ita_dnc.2139.b: "Not yet. Let them shout, and let the depots fill."
 ita_dnc.2140.t: "The Congress at Bologna"
 ita_dnc.2140.d: "The party has been called together to decide whether a socialist may sit in a bourgeois ministry, and the hall is not in a mood to be reasoned with. The reformists point at the labour office and the factory inspectors; the intransigents point at the prefects, who have not gone anywhere.\n\nWhat this congress votes decides who we shall be negotiating with for the rest of the decade."
 ita_dnc.2140.a: "The revolutionaries carry the hall."
 ita_dnc.2140.b: "The reformists hold, and the resolution is buried in committee."
 ita_dnc.2141.t: "The Ministry Falls"
 ita_dnc.2141.d: "The majority that voted the estimates in the spring did not divide with the government tonight, and the men who arranged it are already in the corridor arranging the next one. Nothing was defeated on principle.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!, the majority at §Y[?ITA_majority|0]§!."
 ita_dnc.2141.a: "Send for the same man. He will make another majority."
 ita_dnc.2141.b: "Send for someone the Chamber has not yet used up."
 ita_dnc.2141.c: "Ask the King to prorogue the House until it is calmer."
 ita_dnc.2142.t: "The Fleet Is Asked to Choose"
 ita_dnc.2142.d: "The war is going against us on land and the fleet has spent it at anchor with steam up. The admiralty says that a fleet in being is worth more than a fleet at the bottom, and the country says that it paid for battleships and would like to see one.\n\nThe order can be given tonight and cannot be taken back."
 ita_dnc.2142.a: "The fleet goes out."
 ita_dnc.2142.b: "The fleet stays where it is, and the country may say what it likes."
 ita_dnc.2143.t: "The King's Veto"
 ita_dnc.2143.d: "The King has read the decrees the ministry sent up and has sent them back unsigned, with a note in his own hand about the prerogative of the Crown. The Court has been briefing the newspapers of the right for a fortnight.\n\nThe Crown stands at §Y[?ITA_crown|0]§!. Either the ministry goes, or the King learns what a ministry is."
 ita_dnc.2143.a: "The King dismisses us and sends for a man of his own."
 ita_dnc.2143.b: "The King gives way, and the note is never mentioned again."
 ita_dnc.2144.t: "Crete Rises"
 ita_dnc.2144.d: "The island has risen again and the assembly has voted union with the Kingdom for the third time in a decade. The Powers hold the harbours with a handful of ships and the Porte holds nothing at all.\n\nWe can lay the question before the Powers now, while the Kingdom that would swallow the island is still weak, or wait until it is not."
 ita_dnc.2144.a: "Lay it before the Powers, and see who answers."
 ita_dnc.2144.b: "We will wait. The island is not going anywhere."
 ita_dnc.2145.t: "The Cretan Question"
 ita_dnc.2145.d: "Athens has asked the Powers to hear the island's vote and our name is on the list of protectors, which costs us a squadron and a policy. The Porte has asked us privately to remember whose islands they are.\n\nWe may speak for the Hellenes and be thanked in the Aegean, or hold to the Porte and be thanked in Africa."
 ita_dnc.2145.a: "Speak for the island, and let the Porte hear it from us first."
 ita_dnc.2145.b: "Decline. The Powers will settle it without our voice."
 ita_dnc.2146.t: "The Officers' Address"
 ita_dnc.2146.d: "Thirty general officers have signed an address to the King asking that the army be given a free hand in the disturbed provinces and that the ministry be told so. It was not sent through the War Office and the newspapers of the right had it before the King did.\n\nEither the Crown reads it out and the state of siege follows, or the Crown calls its own generals to order in public."
 ita_dnc.2146.a: "The address is granted. The provinces go under the army."
 ita_dnc.2146.b: "The King calls them to order, and the address is returned unread."
 ita_dnc.2147.t: "Terms"
 ita_dnc.2147.d: "The front has stopped moving and the staffs on both sides know it before the newspapers do. There is a moment, which will not be long, when what is held on the map can be turned into what is written in a treaty.\n\nWe can send the terms across the lines tonight, or wait for a spring campaign that neither army has the depots for."
 ita_dnc.2147.a: "Send the terms across, and let them answer them."
 ita_dnc.2147.b: "We fight on. The line will move again."
 ita_dnc.2148.t: "Il Fermo Proposito"
 ita_dnc.2148.d: "The encyclical does not lift the ban and does not repeat it. It tells Catholics to act in the Christian life of the nation, and it leaves the bishops to say what that means in each diocese.\n\nIn three hundred constituencies the parish clergy have already worked out what it means. Nothing is signed and nothing is denied."
 ita_dnc.2148.a: "Take what is offered. The lists will circulate where they are useful."
 ita_dnc.2148.b: "The encyclical says nothing about the ballot, and neither shall we."
 ita_dnc.2149.t: "The Ledger of the Decade"
 ita_dnc.2149.d: "The decade is out and the clerks have added it up: what was promised, what was bought, what was shot at and what was signed. The country will read the total whether we publish it or not.\n\nWhat we did with the Statuto is now a matter of record."
 ita_dnc.2149.a: "Let it be read out."
 ita_dnc.2152.t: "Calabria Shakes"
 ita_dnc.2152.d: "The province has gone down in the night: the villages of the Aspromonte are rubble, the roads are cut and the prefect is asking for engineers, tents and bread in that order. The emigration agents were at the quays before the relief columns were on the road.\n\nWe can send the army and be done in a season, or write a law for the whole of the South and pay for it out of a budget we do not have."
 ita_dnc.2152.a: "The army goes in. Tents, bread and the road reopened."
 ita_dnc.2152.b: "A law for Calabria, and the money found somewhere."
 ita_dnc.2156.t: "The Party Congress Answers"
 ita_dnc.2156.d: "The socialist deputies have a minister among them and the congress has been called to decide whether he is still one of theirs. The reformists point at the accident insurance and the inspectors who now actually enter the sheds.\n\nThe intransigents point at the prefects and at the fact that the ministry's majority is made of men elected by promising to fight it."
 ita_dnc.2156.a: "The portfolio is kept."
 ita_dnc.2156.b: "The party orders him out of the ministry."
 ita_dnc.2160.t: "The Rente"
 ita_dnc.2160.d: "The conversion of the debt has been carried through by the great houses without waiting for us, at a rate we could not have refused and did not obtain. The saving is real and it is not ours to claim.\n\nThe Treasury will have half of what it counted on, and the Chamber will be told the good news anyway."
 ita_dnc.2160.a: "Take the half, and say nothing about the other."
 ita_dnc.2164.t: "The Lockout in the Bassa"
 ita_dnc.2164.d: "Fifty thousand day labourers are out across the province and the agrarian association has answered with a lockout, a private guard and a subscription list. The children have been sent north to socialist families in convoys, with bands playing, which the newspapers of the right are calling abduction.\n\nThe prefect wants cavalry. Both sides have stated in writing that they will accept arbitration, on condition that it goes their way."
 ita_dnc.2164.a: "Cavalry to the prefect. The chamber of labour is closed."
 ita_dnc.2164.b: "Both parties before a board, a minister presiding, the award binding."
 ita_dnc.2168.t: "The Capitol"
 ita_dnc.2168.d: "The bloc of the lodges, the radicals and the socialists has taken the capital at the municipal poll, and the new mayor is a Jew, a freemason and the son of exiles, which the clerical press has managed to mention in every paragraph. He has announced a school in every quarter and a rate on church property.\n\nThe prefect can find an irregularity in the returns within a week, if he is told to look."
 ita_dnc.2168.a: "Let the city have its council. It was elected."
 ita_dnc.2168.b: "The prefect will find the irregularity, and the poll will be held again."
 ita_dnc.2169.t: "The Twentieth of September"
 ita_dnc.2169.d: "The anniversary of the breach falls in a fortnight and the new council intends to keep it as it has not been kept in a generation: the whole municipality at the gate, with banners, and speeches about the temporal power.\n\nA minister is expected on the platform. Whoever stands there will be quoted across the Tiber within the hour."
 ita_dnc.2169.a: "The government will be on the platform, as the country expects."
 ita_dnc.2169.b: "No minister goes to the gate this year, and the Bloc may draw its own conclusions."
 ita_dnc.2172.t: "The Nationalist Groups Meet"
 ita_dnc.2172.d: "The groups have met in congress and found a phrase that is doing more work than any of them expected: that we are a proletarian nation among plutocratic ones, and that emigration is the tribute we pay for it. The lecture tours are full and the subscriptions are growing.\n\nWe can take the programme and leave them the name, or let them keep both and see who is shouting in the squares in five years."
 ita_dnc.2172.a: "Take the programme. The African shore is promised, in our own time."
 ita_dnc.2172.b: "Let them talk. Words have never taken a province."
 ita_dnc.2176.t: "The Officers of Salonika"
 ita_dnc.2176.d: "The Third Army has declared for the constitution and the committee at Salonika is telegraphing the palace hourly. The garrisons of Macedonia have gone over almost to a man and the troops sent against them have joined them.\n\nThe Sultan can restore the charter he suspended a generation ago and keep a throne, or he can send for the Albanian regiments and find out whether they come."
 ita_dnc.2176.a: "The constitution is restored, and the Chamber is recalled."
 ita_dnc.2176.b: "The regiments will be broken up and the officers arrested."
 ita_dnc.2177.t: "The Constitution at Salonika"
 ita_dnc.2177.d: "The Porte has a parliament again and a party of young officers behind it who talk about the integrity of the empire in a way the old palace never did. Our consulates report that the new men intend to count the foreign concessions and the foreign schools.\n\nA telegram of congratulation costs us nothing and would be remembered. So would its absence."
 ita_dnc.2177.a: "Congratulate them, and let the schools be counted in a friendly spirit."
 ita_dnc.2177.b: "Say nothing. A weak empire suited us better than a young one."
 ita_dnc.2180.t: "The Ferrer Week"
 ita_dnc.2180.d: "A schoolmaster has been shot in a ditch in Catalonia after a court martial that convinced nobody, and the news has put more people into our squares than any strike of the decade. The demonstrations are anticlerical, they are enormous, and they are not being called by anyone we can send for.\n\nThe prefects ask whether the processions are to be allowed."
 ita_dnc.2180.a: "Let them march. It is not our schoolmaster and not our court."
 ita_dnc.2180.b: "Forbid the processions. We do not riot over another kingdom's courts."
 ita_dnc.2184.t: "The Straits at Twenty Past Five"
 ita_dnc.2184.d: "Thirty-odd seconds, and then the sea drew back and came in three times over what was left. The two cities on the straits are gone; there is no telegraph, no prefect, no garrison and no water, and the survivors are being dug out by hand under rain.\n\nThe first organised parties ashore were foreign sailors from a squadron that happened to be in the roads, and our own ships after them. What we do in the next week will be printed in every capital in Europe."
 ita_dnc.2184.a: "The Regia Marina takes charge of the whole relief."
 ita_dnc.2184.b: "Accept every squadron that offers, and say so publicly."
 ita_dnc.2184.c: "Rebuild to a seismic code, and prosecute those who ignore it."
 ita_dnc.2185.t: "Messina"
 ita_dnc.2185.d: "The straits have gone down in half a minute and the first count of the dead is past anything in living memory. There is no authority ashore, and the ships already in the roads have been landing parties since dawn on their captains' own responsibility.\n\nThe Kingdom has asked for nothing and will not ask. What we send will be remembered for a generation, and so will what we do not send."
 ita_dnc.2185.a: "The squadron is already under way. Let it stay as long as it is needed."
 ita_dnc.2185.b: "The squadron, and a credit voted by the Congress on top of it."
 ita_dnc.2185.c: "The relief societies will answer for us. The fleet has its own stations."
 ita_dnc.2185.e: "Condolences, and a subscription opened by the newspapers."
 ita_dnc.2188.t: "The Elections of Nineteen Nine"
 ita_dnc.2188.d: "The country votes again, with the socialists stronger in the North whatever is done and the ministry looking for its numbers where it has always looked for them. In the Veneto and the Marche that means the parish clergy, who now have an understanding with the government that neither side will put on paper.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects."
 ita_dnc.2188.a: "The prefects will make the returns, as they always have."
 ita_dnc.2188.b: "The sacristy will deliver what the prefecture cannot."
 ita_dnc.2188.c: "The government will not touch this election."
 ita_dnc.2192.t: "The Emperor Has Had a Stroke"
 ita_dnc.2192.d: "The Emperor cannot speak and cannot sign, and the palace has stopped pretending that he will recover. There is a grandson of thirteen, a mother who is not a queen, and a council of rases who each command more men than the throne does.\n\nThe legations are all asking the same question and offering the same friendship. Whoever answers first will be answered."
 ita_dnc.2192.a: "The grandson is designated, and the rases may say what they like."
 ita_dnc.2192.b: "A council of regency, and a quiet word to the legation on the hill."
 ita_dnc.2196.t: "Racconigi Is Offered"
 ita_dnc.2196.d: "The Tsar will pass through on his way home and has let it be known that he would receive us at the castle, without ministers if we prefer, to talk about the Straits and the eastern shore of the Adriatic. Our ally is not to be told and will be told anyway.\n\nAn hour on a terrace is worth a year of notes, and it will be read in Vienna as exactly what it is."
 ita_dnc.2196.a: "Accept the meeting. Let them read it as they please."
 ita_dnc.2196.b: "Decline politely. We have one treaty and it is enough."
 ITADNC_g_the_antivari_company: "The Antivari Company"
 ITADNC_g_the_antivari_company_desc: "The little kingdom across the water has a harbour, a tobacco monopoly and no railway, and a company of ours is ready to take all three. We must ask Cetinje for the concession of the port and of the line to the lake."
 ITADNC_g_algeciras: "The Vote at Algeciras"
 ITADNC_g_algeciras_desc: "The conference on Morocco has come down to the police and the bank, and our ally expects our vote against Paris. We must instruct our delegate how to vote, and let Berlin hear the answer from our own ambassador."
 ITADNC_g_the_conversion: "The Conversion of the Rente"
 ITADNC_g_the_conversion_desc: "Our consolidated debt pays a coupon the Treasury can no longer justify and the great markets are quiet enough to refund it. We must ask the Paris market to carry the conversion, and offer the holders their money back if they will not take the lower rate."
 ITADNC_g_the_tripartite_agreement: "The Tripartite Agreement"
 ITADNC_g_the_tripartite_agreement_desc: "London and Paris are drawing lines across the Abyssinian future and mean to settle it without us. The hinterland behind Eritrea and the Benadir is the only zone we can claim with a straight face. We must ask London to write that zone into the agreement."
 ITADNC_g_the_lockout_in_the_bassa: "The Lockout in the Bassa"
 ITADNC_g_the_lockout_in_the_bassa_desc: "The agrarians of the Parmesan lowland have shut their gates against the syndicalist leagues and the cavalry is quartered on the Chamber of Labour. We must tell the prefect whether the State takes a side in this."
 ITADNC_g_the_compensation: "The Annexation Read in Rome"
 ITADNC_g_the_compensation_desc: "Vienna has taken outright the provinces she has garrisoned since the congress, and did not ask the ally who signed the seventh article with her. That article says no change in the Balkans is made without a compensation to us. We must invoke it, and name what we will take."
 ITADNC_g_the_deputies_of_the_union: "The Deputies of the Union"
 ITADNC_g_the_deputies_of_the_union_desc: "The Catholic electoral union has a committee in every parish and not one candidate of its own in the Chamber. We must ask its president what his votes would cost us at the next returns."
 ITADNC_g_the_register: "A Vote for Every Man"
 ITADNC_g_the_register_desc: "The register admits the men who can read and pay, and the square outside knows exactly who is left off it. We must put the wider franchise before the Chamber and the Senate and let them vote it."
 ITADNC_g_the_register_reprinted: "The Register Is Reprinted"
 ITADNC_g_the_register_reprinted_desc: "The prefects hold the lists, the circular goes out to the ninety, and the Chamber comes back the shape the ministry asked for. We must send the circular once more and let the prefects deliver."
 ITADNC_g_the_free_hand_is_asked_for: "The Free Hand Is Asked For"
 ITADNC_g_the_free_hand_is_asked_for_desc: "Every great power holds an old promise about the African shore and none of them has been asked to honour it. We must put the question to each capital in turn and count the answers."
 ITADNC_g_the_chamber_for_the_corps: "The Chamber Is Asked for the Landing Corps"
 ITADNC_g_the_chamber_for_the_corps_desc: "The Consulta is a fortnight from an ultimatum and the Chamber has never been asked to pay for the expedition. We must go to Montecitorio for the credits of the landing corps before the note goes out."
 ITADNC_g_the_chamber_of_the_machine: "The Chamber of the Machine"
 ITADNC_g_the_chamber_of_the_machine_desc: "The legislature is spent and the prefects report that the country will return the ministry if it is asked in the right order. We must dissolve, and let the machine make the Chamber one more time."
 ITADNC_g_the_merchant_navy_conventions: "The Merchant Navy Conventions"
 ITADNC_g_the_merchant_navy_conventions_desc: "The subsidies to the great shipping companies come up for renewal and part of our own majority means to vote against them. We must put the conventions to the Chamber and stand or fall on the division."
 ita_dnc.1952.t: "Rome Asks for the Port and the Line"
 ita_dnc.1952.d: "The Italian minister offers a company to run our harbour, a railway to the lake, and the tobacco monopoly with them. The money is real and the flag behind it is not the one that garrisons our northern frontier. Vienna will read the concession as a breach of the congress article that keeps this coast empty, and Vienna has made her own offer before."
 ita_dnc.1952.a: "Grant the concession."
 ita_dnc.1952.b: "Grant it, once Vienna has been asked for her leave."
 ita_dnc.1952.c: "Refuse. Vienna pays better."
 ita_dnc.1953.t: "The Company Is Chartered"
 ita_dnc.1953.d: "The company is chartered, the surveyors are on the lake road and the Chamber has voted the subsidy without a division. The Consulta now has a harbour on the far shore that no treaty of ours forbids."
 ita_dnc.1953.a: "The other shore is opened."
 ita_dnc.1954.t: "The Concession Goes Elsewhere"
 ita_dnc.1954.d: "The little kingdom has taken a better offer and our company has withdrawn its surveyors. The nationalist press has the story before the ministry does, and it writes that the Adriatic is being sold over our heads."
 ita_dnc.1954.a: "Let them write."
 ita_dnc.1954.b: "Put the line under the Ministry of the Navy and take the loss."
 ita_dnc.1955.t: "The Italians Are at Antivari"
 ita_dnc.1955.d: "An Italian company has the harbour, the tobacco and a railway line on the coast we have kept empty by treaty. The article of the congress allows us to stop a railway there, and our minister at Cetinje is waiting to be told whether to use it. Either the Italians did not think to ask us, or they asked and expect to be refused."
 ita_dnc.1955.a: "Invoke the article and police that coast."
 ita_dnc.1955.b: "Let the line run."
 ita_dnc.1955.c: "Give them the leave they asked for."
 ita_dnc.1955.e: "Veto it, and pay Cetinje ourselves."
 ita_dnc.1956.t: "Rome's Vote at Algeciras"
 ita_dnc.1956.d: "Our ally has voted with Paris on the police and on the bank, and the conference is lost. The Chancellor told the Reichstag that a waltz may be danced with more than one partner, and the Wilhelmstrasse would like to know how many partners are left. We can pass it off, ask Vienna to demand the account, or say plainly what an alliance is for."
 ita_dnc.1956.a: "One turn of the waltz more."
 ita_dnc.1956.b: "Let Vienna ask for the account."
 ita_dnc.1956.c: "Warn them that the alliance runs both ways."
 ita_dnc.1957.t: "The Delegate Reports"
 ita_dnc.1957.d: "Our delegate has voted, the bank is settled, and the ministry has an understanding it did not have last spring. The Chamber approves of a foreign policy that costs nothing and offends nobody it can see."
 ita_dnc.1957.a: "The vote is cast."
 ita_dnc.1958.t: "Paris Thanks Rome"
 ita_dnc.1958.d: "The Italian vote carried the police and the bank against Berlin, and it was not bought. Our ambassador at the Quirinal writes that the ministry there would like the gratitude in a form that can be quoted."
 ita_dnc.1958.a: "Thank them, where it will be read."
 ita_dnc.1958.b: "Note it, and say nothing."
 ita_dnc.1959.t: "Berlin Asks Vienna to Ask"
 ita_dnc.1959.d: "Berlin would like us to ask our southern ally what her vote at the conference was worth to the alliance. It is a fair question and an ungrateful one to put, and the answer will be in the newspapers within the week. We can put it ourselves, or leave Berlin to put it."
 ita_dnc.1959.a: "Ask for the account."
 ita_dnc.1959.b: "Decline to ask."
 ita_dnc.1960.t: "Rome Asks the Paris Market to Carry the Conversion"
 ita_dnc.1960.d: "The Italian Treasury wants to refund its consolidated debt at a lower coupon and cannot do it on its own market. A syndicate here can carry the paper, and every holder who refuses will be paid off in our gold. If it succeeds, Rome borrows cheaply for a decade, and borrows from us."
 ita_dnc.1960.a: "Carry the conversion."
 ita_dnc.1960.b: "Decline. Let the City try it."
 ita_dnc.1961.t: "Not One Holder Asks to Be Repaid"
 ita_dnc.1961.d: "The conversion opens and the counters stay quiet: the holders take the lower coupon rather than their money back. The Treasury has found the margin the Chamber has been asking for since the tariff war."
 ita_dnc.1961.a: "The margin is ours to spend."
 ita_dnc.1962.t: "The City Is Asked"
 ita_dnc.1962.d: "Paris has declined the Italian conversion and the syndicate is offered to the City instead. The paper is sound, the coupon is low, and the Treasury behind it has balanced its budgets. Taking it puts Rome in our books and out of somebody else's."
 ita_dnc.1962.a: "Take the paper."
 ita_dnc.1962.b: "Leave it. Let Berlin carry it."
 ita_dnc.1963.t: "Rome's Rente"
 ita_dnc.1963.d: "Neither Paris nor the City will carry the Italian conversion, and the Bleichroder house is willing. An ally who owes us money is an ally who reads our notes to the end. The Ballhausplatz would be pleased, and the Italian nationalists would not."
 ita_dnc.1963.a: "Let Bleichroder carry it."
 ita_dnc.1963.b: "Leave it alone."
 ita_dnc.1964.t: "Rome Asks for Her Zone in the Abyssinian Agreement"
 ita_dnc.1964.d: "The Italians want the hinterland behind their two colonies written into the agreement as their zone, against the day the Emperor's house falls. Paris will countersign whatever we sign and the Emperor will protest whatever we write. We can give them the zone, or make them come to terms on the waters of the great river first."
 ita_dnc.1964.a: "Write their zone into the agreement."
 ita_dnc.1964.b: "The Nile comes first."
 ita_dnc.1965.t: "The Three Powers Divide the Future"
 ita_dnc.1965.d: "Three foreign ministries have signed a paper dividing our country between them against the day our house falls. They did not ask us and they did not expect us to read it. We can protest to all three, or say nothing and let them believe we did not read it."
 ita_dnc.1965.a: "Protest, and let the consuls hear it."
 ita_dnc.1965.b: "Take note, and say nothing."
 ita_dnc.1966.t: "The Nile Comes First"
 ita_dnc.1966.d: "London will write our zone only if we accept her reading of the waters that feed the great river. It is a promise about a river we will never touch, in exchange for a hinterland we mean to hold. The Consulta calls the price nominal and the nationalist press calls it a surrender."
 ita_dnc.1966.a: "Accept the reading of the waters."
 ita_dnc.1966.b: "Refuse. The zone is not worth it."
 ita_dnc.1967.t: "Paris Countersigns"
 ita_dnc.1967.d: "London and Rome have settled the Abyssinian zones and our signature is asked for below theirs. The Italian zone touches nothing of ours except the railway that carries our trade up from the coast. We can sign as it stands, or sign with the railway reserved."
 ita_dnc.1967.a: "Sign it as it stands."
 ita_dnc.1967.b: "Sign, with the railway reserved."
 ita_dnc.1968.t: "The Lockout in the Bassa"
 ita_dnc.1968.d: "The agrarians of the lowland have shut their gates and the leagues have answered with a strike across the whole province. The cavalry is quartered on the Chamber of Labour and the prefect asks whether he arbitrates or waits. The Chamber is full of landowners and the square is full of syndicalists."
 ita_dnc.1968.a: "The cavalry keeps the Chamber of Labour."
 ita_dnc.1968.b: "The prefect imposes arbitration."
 ita_dnc.1968.c: "Neither. The province will settle it."
 ita_dnc.1972.t: "Rome Invokes Article Seven"
 ita_dnc.1972.d: "Rome reads the seventh article aloud and asks what we will give for the provinces we have taken. We have already agreed to leave the sandjak, which costs us a garrison and nothing else. The Italian faculty at Trieste would cost us the Slovene deputies, and a flat refusal would cost us the ally."
 ita_dnc.1972.a: "The sandjak, and nothing more."
 ita_dnc.1972.b: "The sandjak, and the faculty at Trieste."
 ita_dnc.1972.c: "Refuse. Bosnia is not the Balkans."
 ita_dnc.1973.t: "The Compensation Is Read to the Chamber"
 ita_dnc.1973.d: "The minister reads the exchange of notes to a Chamber that has already read it in the newspapers. What we were given is small and what we asked for was smaller, and the deputies have decided to be satisfied."
 ita_dnc.1973.a: "The Chamber is satisfied."
 ita_dnc.1974.t: "Petersburg Reads Rome's Disappointment"
 ita_dnc.1974.d: "Rome asked Vienna for a compensation and came away with a garrison town and a promise about a faculty. An ally humiliated like that is an ally worth talking to, and our own quarrel over the straits is the same quarrel. We could offer a meeting at the royal shooting box, or wait until Rome is angrier."
 ita_dnc.1974.a: "Offer the meeting."
 ita_dnc.1974.b: "Wait. They will be angrier."
 ita_dnc.1975.t: "Bülow Is Asked to Weigh In"
 ita_dnc.1975.d: "Rome has refused the compensation offered and is asking us to press our other ally for a better one. The alliance has no article that obliges us to arbitrate between the two of them. Pressing Vienna keeps Rome in the treaty; declining tells Rome what the treaty is worth."
 ita_dnc.1975.a: "Press Vienna to reopen it."
 ita_dnc.1975.b: "The alliance has no article for this."
 ita_dnc.1976.t: "The Union Offers Its Lists"
 ita_dnc.1976.d: "The Catholic electoral union has a committee in every parish and a president who counts them. It will put its voters behind ministerial candidates in the colleges where the socialist is close. It wants the divorce bill dead, the schools left alone and the congregations untouched, and none of it written down."
 ita_dnc.1976.a: "Take the votes. Give the undertakings."
 ita_dnc.1976.b: "Nothing in writing, and nothing denied."
 ita_dnc.1976.c: "Let them run their own men."
 ita_dnc.1980.t: "The Suffrage Before the Chamber"
 ita_dnc.1980.d: "The bill for the wider register is on the order paper and the Senate is reading it with its hat on. Every prefect in the kingdom has written to say what it will do to the lists he keeps. The Extreme Left will vote it whole, the Right will vote it with a reading test, and the ministry can still bury it."
 ita_dnc.1980.a: "Vote it whole."
 ita_dnc.1980.b: "Vote it with the reading test."
 ita_dnc.1980.c: "Reject it."
 ita_dnc.1981.t: "The Prefects Are Asked Once More"
 ita_dnc.1981.d: "The circular is drafted, the lists are in the prefectures, and the ninety have been told what is wanted. One of them asks in writing whether the enquiry into the southern colleges will be pressed. The prefects can deliver as they always have, or they can let the register be read against the ministry."
 ita_dnc.1981.a: "They deliver, as they always have."
 ita_dnc.1981.b: "The register is read against us."
 ita_dnc.1981.c: "They report that the country will not be made."
 ita_dnc.1984.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1984.d: "The Italian ambassador asks, as though in passing, whether we would object to an Italian administration on the shore east of our own. There is an exchange of notes which says that we would not, in return for a free hand where we already stand. Saying it again costs nothing and buys a neighbour who will not raise Tunis a third time."
 ita_dnc.1984.a: "We consent, and Tunis is closed for good."
 ita_dnc.1984.b: "We object."
 ita_dnc.1985.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1985.d: "Rome asks whether the Mediterranean agreements still mean what they meant when they were written. We would rather have that shore Italian than left to a Porte which cannot hold it, and far rather Italian than French. The islands off the Anatolian coast are another matter, and it should be said now."
 ita_dnc.1985.a: "We consent."
 ita_dnc.1985.b: "We consent, and no islands."
 ita_dnc.1985.c: "We object."
 ita_dnc.1986.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1986.d: "Our ally asks whether the promises made when the alliance was young still hold on the African shore. The Porte is our friend and our debtor and will read the answer in her own newspapers. An ally refused this will go and ask the same question elsewhere."
 ita_dnc.1986.a: "We consent."
 ita_dnc.1986.b: "We object."
 ita_dnc.1987.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1987.d: "Rome asks whether the seventh article covers an African adventure as well as a Balkan one. An Italy busy on the far shore is an Italy not counting our Italian schools. An Italy that wins there comes home with an army and an appetite."
 ita_dnc.1987.a: "We consent."
 ita_dnc.1987.b: "We object."
 ita_dnc.1988.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1988.d: "Rome asks for our word on the African shore and offers nothing new in exchange. If the meeting at the shooting box was worth anything, it was worth this. The Porte will thank us either way, and the straits are the only thing we want from her."
 ita_dnc.1988.a: "We consent."
 ita_dnc.1988.b: "We object."
 ita_dnc.1989.t: "The Powers Are Asked About Tripoli"
 ita_dnc.1989.d: "Italian ambassadors have been round every chancellery in Europe asking whether our own province is free. Our governor reports a garrison under strength and wells nobody watches. We can put battalions and a road into the province now, or wait and hear what the powers answer."
 ita_dnc.1989.a: "Reinforce the province."
 ita_dnc.1989.b: "Wait."
 ita_dnc.1990.t: "The Chamber Is Asked for the Credits"
 ita_dnc.1990.d: "The ministry asks the Chamber for the credits of a landing corps before the note goes out, and not after it. The Extreme Left has read the estimate and means to talk it out. The Bank has a cheaper road to the same shore, and a good half of the deputies would rather take it."
 ita_dnc.1990.a: "Vote the credits."
 ita_dnc.1990.b: "The Bank first. No corps."
 ita_dnc.1990.c: "The vote passes by a handful."
 ita_dnc.1992.t: "Rome Votes a Landing Corps"
 ita_dnc.1992.d: "The Italian Chamber has voted the credits for a corps that has only one shore to land upon. Our garrison there is a few battalions and a customs house. We can move troops and build the road now, or wait and let the powers do our arguing for us."
 ita_dnc.1992.a: "Reinforce the province."
 ita_dnc.1992.b: "Wait."
 ita_dnc.1993.t: "The Party and the War"
 ita_dnc.1993.d: "The party congress has the estimate before it and the word Tripoli in every motion. The reformists want a protest from the tribune and the syndicalists want the railways stopped. This party's silence has been bought before, and it will not be bought now."
 ita_dnc.1993.a: "Call the general strike against the war."
 ita_dnc.1993.b: "Protest from the tribune."
 ita_dnc.1994.t: "The Returns"
 ita_dnc.1994.d: "The colleges have voted, the prefects have counted, and the ministry has its arithmetic back. The socialists have gained in the northern cities and the Catholics have been elected openly for the first time. What has come back is not quite the Chamber that was asked for."
 ita_dnc.1994.a: "The machine returns the majority."
 ita_dnc.1994.b: "The Catholics and the nationalists take the northern cities."
 ita_dnc.1994.c: "The machine slips in the South."
 ita_dnc.1996.t: "The Portfolio Offered Twice"
 ita_dnc.1996.d: "Two deputies of the same province were each promised the same undersecretaryship, and both delivered their colleges. One of them has written to a newspaper which prints such letters. We can pay for the silence, or let the arithmetic take the loss."
 ita_dnc.1996.a: "Pay."
 ita_dnc.1996.b: "Let it be printed."
 ita_dnc.1997.t: "The Merchant Navy Conventions"
 ita_dnc.1997.d: "The subsidies to the shipping companies come to a division and the ministry has staked itself upon them. The lines carry our emigrants, our mails and our flag, and every deputy has a yard or a port to defend. The majority that was made at the elections is being counted for the last time."
 ita_dnc.1997.a: "The conventions are voted."
 ita_dnc.1997.b: "The conventions fall, and the old man goes."
 ITA_g_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_g_tt_the_antivari_subsidy: "§YThe Antivari Subsidy is opened among the decisions of the Consulta.§!"
 ITA_g_tt_the_amnesty_of_the_romagna: "§YThe Amnesty of the Romagna is opened among the decisions of the Piazza.§!"
 ITA_g_tt_the_tripartite_is_invoked: "§YThe Tripartite Is Invoked is opened among the decisions of the colonies.§!"
 ITA_g_tt_no_one_signs_the_agreement: "§RThere is no cabinet in London left to sign the agreement.§!"
 ITA_g_tt_the_zone_is_written: "§YOur zone in the Abyssinian hinterland is written into the agreement.§!"
 ITA_g_tt_the_register_of_five_million: "§YThe Register of Five Million takes the place of The Register Is Reprinted among the decisions of the Chamber.§!"
 ITA_g_tt_the_decade_is_reckoned: "§YThe decade is reckoned: the ministry answers for what it asked for and for what it was given.§!"
 ITA_g_tt_vienna_lets_the_line_run: "§GVienna lets the line to the lake be built.§!"
 ITA_g_tt_vienna_asks_nothing: "§YVienna asks us nothing about the vote.§!"
 ITA_g_tt_the_emperor_protests: "§RThe Emperor protests the partition of his hinterland.§!"
 ITA_g_tt_the_railway_is_reserved: "§YParis reserves the railway that climbs from the coast.§!"
 ITA_g_tt_no_hand_is_offered: "§YPetersburg keeps her own counsel and offers us nothing.§!"
 ITA_g_tt_the_prefects_have_nothing_to_report: "§RThe prefects report that the country will not be made this time.§!"
 ITA_g_tt_a_power_objects: "§RA power objects, and the consent of the powers is worth that much less.§!"
 ITA_g_tt_the_porte_waits: "§YThe Porte waits, and reinforces nothing.§!"
 ITA_g_threat_rome_at_antivari: "Rome at Antivari"
 ITA_g_threat_the_port_goes_to_vienna: "The port goes to Vienna"
 ITA_g_threat_the_alliance_is_not_one_sided: "The alliance is not one-sided"
 ITA_g_threat_the_zone_is_written: "The Zone Is Written"
 ITA_g_threat_the_seventh_article: "The seventh article is invoked"
 ITA_g_threat_the_bosnian_refusal: "Rome refuses the annexation"
 ITA_g_threat_the_powers_are_sounded: "The Powers Are Sounded"
 ITA_g_threat_the_landing_corps: "The landing corps is voted"
 ITA_g_threat_the_porte_reinforces: "The Porte reinforces the shore"
 ITA_g_stringher_at_the_bank: "Stringher at the Bank"
 ITA_g_stringher_at_the_bank_desc: "The director general of the Bank of Italy, who rebuilt a currency after the bank scandals and keeps the reserve where the Treasury cannot reach it. He will carry a conversion that no minister could carry alone."
 ITA_g_tittoni_at_the_consulta: "Tittoni at the Consulta"
 ITA_g_tittoni_at_the_consulta_desc: "A prefect turned foreign minister, patient with Vienna and thought soft by the press for it. He gets more out of an ally by asking twice than the nationalists get by shouting."
 ITA_g_meda_the_catholic_deputy: "Meda for the Catholic Deputies"
 ITA_g_meda_the_catholic_deputy_desc: "A Milanese editor and the first Catholic to sit openly for a Catholic electorate. He can deliver the parish committees, and he will ask for the schools in exchange."
 ITA_g_spingardi_at_the_war_office: "Spingardi at the War Office"
 ITA_g_spingardi_at_the_war_office_desc: "A gunner who spent his career on supply and knows what a landing corps costs before it sails. He will have the expedition ready sooner than the staff believes possible."
 ITA_g_unione_liberale: "Unione Liberale"
 ITA_g_unione_liberale_long: "Unione Liberale"
 ITA_g_destra_costituzionale: "Destra Costituzionale"
 ITA_g_destra_costituzionale_long: "Destra Costituzionale"
 ITADNC_s_berlin_for_tunis: "What the Alliance Is Worth"
 ITADNC_s_berlin_for_tunis_desc: "The treaty promises us the support of our ally in North Africa, and the letters that carry the promise name Tripoli and Morocco and stop short of the Regency. A hundred thousand of our people live in Tunis under a protectorate nobody asked us about. We must ask Berlin to extend the promise to Tunis and hear what price is put on it."
 ITADNC_s_the_note_on_tunis: "The Note on Tunis"
 ITADNC_s_the_note_on_tunis_desc: "The conventions that give our people in the Regency their schools, their nationality and their fishing can be denounced at three months notice. Paris has never had to answer for them because Rome has never asked. We must send the note and let Paris choose between renewing the conventions and facing the claim we have laid."
 ITADNC_s_london_stands_aside: "London Stands Aside"
 ITADNC_s_london_stands_aside_desc: "The conventions have been allowed to lapse and the Regency is now a question of squadrons rather than of schools. We must ask the British to stand aside and remind them that a weak arsenal at Bizerte suits them as well as it suits us."
 ITADNC_s_vienna_holds_the_alps: "Vienna Holds the Alps"
 ITADNC_s_vienna_holds_the_alps_desc: "The alliance binds our partners to us if we are attacked, and says nothing whatever about a war we begin ourselves. We must ask Vienna to hold the Alpine frontier while our army marches south, and learn what the treaty is worth before we need it."
 ITADNC_s_berlin_or_racconigi: "Berlin or Racconigi"
 ITADNC_s_berlin_or_racconigi_desc: "Petersburg offers an understanding in the Adriatic that our ally would read as a duplicity, and our ministry will not put its name to two papers at once. We must decline the offer, ask Berlin for the naval convention the staffs have discussed for years, and take our place inside the alliance instead of beside it."
 ITADNC_s_the_viceroy: "The Crown Names the Viceroy"
 ITADNC_s_the_viceroy_desc: "The African colony is governed by a civil administration that has never been asked to do anything but keep the peace, and the debt of Adwa is still on the books. We must offer the command of the Army of Africa to a prince of the House and see whether he takes it."
 ITADNC_s_the_war_of_tunis: "The War of Tunis"
 ITADNC_s_the_war_of_tunis_desc: "The claim is laid, the powers have been sounded one by one and the army of the south stands at its stations. The slap of Tunis has been owed an answer since the Regency was taken from us. We must lay the declaration before the King and ask him to sign it."
 ITADNC_s_the_peace_of_turin: "The Peace of Turin"
 ITADNC_s_the_peace_of_turin_desc: "The French have been thrown back from the passes and the Regency is under our administration. We must offer terms at Turin and name what the Kingdom keeps."
 ITADNC_s_the_armistice: "The Armistice of the Alps"
 ITADNC_s_the_armistice_desc: "The army has been driven back from the passes and the ministry cannot promise the country another campaign. We must ask for an armistice and hear what the victor will take for it."
 ITADNC_s_the_ministry_holds: "The Ministry That Cannot Fall"
 ITADNC_s_the_ministry_holds_desc: "The doctrine of this ministry is that ministers answer to the King and the Chamber is recalled for the budget and for nothing else. We must recall the Chamber for the estimates and, if it will not vote them, let the Senate vote the twelfths instead."
 ITADNC_s_the_insurrection: "The Insurrection"
 ITADNC_s_the_insurrection_desc: "The Chambers of Labour are closed, the Chamber is prorogued and the squares have stopped emptying at nightfall. We must put the garrisons at the disposal of the prefects and let the leagues and the general staff answer for what follows."
 ITADNC_s_the_kings_judges: "The King's Judges"
 ITADNC_s_the_kings_judges_desc: "The code of public safety puts the press under licence and the bench in the gift of the ministry. We must lay the code before the magistrates and ask them to apply it."
 ITADNC_s_the_statuto_kept: "The Statuto Kept"
 ITADNC_s_the_statuto_kept_desc: "The Kingdom has been governed for a decade by ministers who answer to the King while the Chamber votes the budget and goes home. We must ask the Quirinale to say plainly what that is and settle the form of the Kingdom for good."
 ITADNC_s_the_ministry_of_the_sword: "The Ministry of the Sword"
 ITADNC_s_the_ministry_of_the_sword_desc: "The generals have sent up a memorandum and the ministry has nothing left with which to answer it. We must ask the Quirinale whether the presidency goes to a soldier or back to the Chamber."
 ITA_s_tt_plan_west_is_unlocked: "Plan West becomes available among the war plans of the staff once Berlin has answered."
 ITA_s_tt_the_consul_at_tunis: "The Consul at Tunis becomes available among the decisions of the Consulta."
 ITA_s_tt_the_mobilisation_test: "The Alpine Mobilisation Test becomes available among the war plans of the staff."
 ITA_s_tt_the_alliance_is_a_faction: "If Berlin signs, the alliance becomes a faction and the Kingdom is in it."
 ITA_s_tt_the_senates_list: "The Senate's List becomes available among the decisions of the Crown."
 ITA_s_tt_the_military_tribunals: "The Military Tribunals become available among the decisions of the state of siege."
 ITA_s_tt_the_rhine_is_not_promised: "The staff will not put the third army on the Rhine, and the guarantee lapses with it."
 ITA_s_tt_the_powers_consent: "The consent of the powers: §Y[?ITA_w_powers_consent|0]§!"
 ITA_s_tt_the_claim_is_kept: "The claim on the Regency stands where it was laid."
 ITA_s_tt_no_ally_holds_the_alps: "There is no court left to hold the Alpine frontier for us, and the staff is told so."
 ITA_s_tt_no_partner_signs: "There is no partner left to sign a naval convention with, and the alliance stays a paper."
 ITA_s_tt_the_colony_stays_civil: "The colony keeps its civil governor, and a civil governor may be appointed as a political advisor."
 ITA_s_tt_the_ministry_resigns: "The ministry lays down its office, and the country is told why."
 ITA_s_tt_the_kings_minister_goes: "The King's minister leaves the cabinet and the Chamber names his successor."
 ITA_s_tt_the_other_court_waits: "The other court says nothing and keeps its garrisons where they are."
 ITA_s_tt_the_offer_is_declined: "The offer is declined, and we put down our own rising ourselves."
 ITA_s_threat_rome_looks_at_tunis: "Rome Looks at Tunis"
 ITA_s_threat_the_note_on_tunis: "The Note on Tunis"
 ITA_s_threat_the_malta_squadron: "The Squadron at Malta"
 ITA_s_threat_the_naval_convention: "The Naval Convention"
 ITA_s_threat_the_army_of_africa: "The Army of Africa"
 ITA_s_threat_the_war_of_tunis: "The War of Tunis"
 ITA_s_threat_the_insurrection: "The Insurrection"
 ITA_s_threat_the_tyrol_garrisons: "The Garrisons of the Tyrol"
 ITA_s_threat_royal_italy: "Royal Italy"
 ITA_s_threat_the_ministry_of_the_sword: "The Ministry of the Sword"
 ITA_s_triple_alliance: "Triple Alliance"
 ITA_s_ministero_del_re: "Ministero del Re"
 ITA_s_ministero_del_re_long: "The Ministry of the King"
 ITA_s_destra_costituzionale: "Destra Costituzionale"
 ITA_s_destra_costituzionale_long: "The Constitutional Right"
 ITA_s_governo_militare: "Governo Militare"
 ITA_s_governo_militare_long: "The Military Government"
 ITA_s_unione_liberale: "Unione Liberale"
 ITA_s_unione_liberale_long: "The Liberal Union"
 ita_dnc.1748.t: "Rome Asks What the Alliance Is Worth in the Mediterranean"
 ita_dnc.1748.d: "The Italian ambassador reads the old letters back to us. We promised Rome our support in North Africa when the treaty was young, and the promise named Tripoli and Morocco and stopped there.\n\nHe would like the promise extended to the Regency, where a hundred thousand of his countrymen live under a French flag. The Chancellor observes that a quiet France is worth something too."
 ita_dnc.1748.a: "Guarantee the claim."
 ita_dnc.1748.b: "Guarantee it, if their army stands on the Rhine."
 ita_dnc.1748.c: "Decline. Paris is better left quiet."
 ita_dnc.1749.t: "The Price of the Guarantee"
 ita_dnc.1749.d: "The guarantee is offered and it has a price. The staff of our ally wants the timetable signed, the trains found and the detraining stations named, so that three of our corps stand on the northern river on the day a mobilisation begins.\n\nThe Chamber has not seen the convention and will not see it. The ministry can sign, or it can go home without the guarantee."
 ita_dnc.1749.a: "Sign the military convention."
 ita_dnc.1749.b: "Decline. The army stays on our own frontier."
 ita_dnc.1750.t: "Rome and Berlin Talk of Tunis"
 ita_dnc.1750.d: "Our embassy sends the substance of a conversation the two allies did not mean us to have. The Regency was named, and named as a question that is still open.\n\nThe Marine wants the anchorage strengthened at once. The Quai would rather court Rome than frighten her."
 ita_dnc.1750.a: "Strengthen the anchorage in the Regency."
 ita_dnc.1750.b: "Court Rome instead."
 ita_dnc.1751.t: "Rome Looks West"
 ita_dnc.1751.d: "The Italian claim is on the Regency, and the Italian army is being counted for the passes above it. Our attaché notes that the garrisons opposite our own frontier have not been reinforced this year.\n\nA kingdom that is looking at the sea to its south is not looking at the city on our coast."
 ita_dnc.1751.a: "Let them look south."
 ita_dnc.1752.t: "The Note on Tunis"
 ita_dnc.1752.d: "The Italian note asks that the conventions be renewed and that the schools, the nationality and the fishing of the Italian colony be guaranteed in terms. It is polite and it is not a request.\n\nThe Residency answers that the Regency is ours and the colony may take our law. The Quai answers that a claim has been laid and that claims grow when they are ignored."
 ita_dnc.1752.a: "Renew the conventions and guarantee the schools."
 ita_dnc.1752.b: "Refuse. Let the conventions lapse."
 ita_dnc.1752.c: "Offer them a free hand at Tripoli with the conventions."
 ita_dnc.1753.t: "The Conventions Are Renewed"
 ita_dnc.1753.d: "The conventions come back signed and the schools of the colony are named in them. Our people in the Regency keep their nationality and their boats.\n\nThe claim we laid is still on the books. The ministry can put it away and take the paper, or keep it where the other capital can see it."
 ita_dnc.1753.a: "Take the paper and put the claim away."
 ita_dnc.1753.b: "Keep the claim."
 ita_dnc.1754.t: "The Note Has No Addressee"
 ita_dnc.1754.d: "The note on the Regency was drafted and has nowhere to go. The government that held the protectorate is not there to answer it.\n\nThe conventions stand by default and the colony keeps its schools. There is nothing more to ask for and nobody to ask."
 ita_dnc.1754.a: "Then the conventions stand."
 ita_dnc.1756.t: "Rome Asks London to Stand Aside"
 ita_dnc.1756.d: "The Italian ambassador recalls the Mediterranean agreements, when three fleets agreed to keep the sea as it was. He asks for nothing but our silence if the Regency changes hands.\n\nThe Admiralty notes that a weak arsenal opposite our island is worth more to us than a friendship. The Foreign Office notes that a war in the middle sea is worth less than either."
 ita_dnc.1756.a: "Stand aside."
 ita_dnc.1756.b: "Warn them, and reinforce the island squadron."
 ita_dnc.1756.c: "Offer a conference on the Regency."
 ita_dnc.1757.t: "A Conference Is Offered"
 ita_dnc.1757.d: "A conference is offered on the Regency, with the conventions renewed as its first article and the claim withdrawn as its price. The colony would keep its schools and its nationality by treaty.\n\nThe ministry can sit at the table, or it can say that the table is not where the Regency will be settled."
 ita_dnc.1757.a: "Sit at the table and take the conventions."
 ita_dnc.1757.b: "Refuse. The claim stands."
 ita_dnc.1758.t: "London Warns Rome"
 ita_dnc.1758.d: "The British have told the Italians plainly to leave the Regency alone, and have moved a squadron to say it again. It is the first time in years that London has spoken for the middle sea and meant us.\n\nThe Quai is glad of it and would like the fact recorded."
 ita_dnc.1758.a: "Record it, and thank them quietly."
 ita_dnc.1759.t: "No One Is Asked to Stand Aside"
 ita_dnc.1759.d: "There is no fleet in the middle sea whose silence has to be bought, and no cabinet to ask for it. The question of the Regency is between us and the power that holds it.\n\nThe Consulta files the memorandum and says nothing about it in the Chamber."
 ita_dnc.1759.a: "Then no one has to stand aside."
 ita_dnc.1760.t: "Rome Asks Vienna to Hold the Alps"
 ita_dnc.1760.d: "The Italian ambassador asks what the alliance is worth if his King goes south. He does not ask us to march. He asks us to hold the mountain frontier and to say so before the war and not after it.\n\nThe staff says the frontier can be held. The Ballhausplatz says that an ally who begins a war is not the ally the treaty describes."
 ita_dnc.1760.a: "The alliance holds. Guarantee them."
 ita_dnc.1760.b: "Benevolent neutrality. It is not our war."
 ita_dnc.1760.c: "The Adriatic first. Let them give up the eastern shore."
 ita_dnc.1761.t: "The Price of the Alps"
 ita_dnc.1761.d: "The guarantee is offered and the price is the eastern shore. The other court will hold the mountain frontier if the Kingdom writes off the Albanian coast and the harbour our surveyors have been sounding.\n\nThe Consulta says the shore is the work of a generation. The staff says the mountain frontier is the work of a month."
 ita_dnc.1761.a: "Give up the eastern shore."
 ita_dnc.1761.b: "Refuse. The shore is not theirs to ask for."
 ita_dnc.1762.t: "No Ally Holds the Alps"
 ita_dnc.1762.d: "There is no court beyond the mountains to be asked for anything, and the treaty that would have bound it is a curiosity of the archives.\n\nThe staff will have to hold the northern frontier with what it has while the army goes south."
 ita_dnc.1762.a: "Then we hold them ourselves."
 ita_dnc.1763.t: "Berlin Answers for Vienna"
 ita_dnc.1763.d: "Vienna has been asked to hold the mountain frontier and has given its answer. The Italians would now like to know what we intend to do about the western one.\n\nThe General Staff has counted an Italian army on the river for years. It would like to be able to promise something in return."
 ita_dnc.1763.a: "Promise them the river."
 ita_dnc.1763.b: "Say nothing yet."
 ita_dnc.1764.t: "Rome Declines Petersburg and Asks for the Naval Convention"
 ita_dnc.1764.d: "The Italians have declined the eastern understanding that was offered them and have told us so themselves. In exchange they ask for the naval convention the staffs have talked about for years, and for a place inside the alliance rather than beside it.\n\nA fleet in the middle sea under our flag is worth a great deal. So is an ally who can be seen to have chosen."
 ita_dnc.1764.a: "Sign the naval convention and open the alliance."
 ita_dnc.1764.b: "Take note, and promise nothing."
 ita_dnc.1765.t: "The Convention Has No Signatory"
 ita_dnc.1765.d: "The naval convention was drafted, initialled by our own admiralty and sent north to a chancellery that is not there.\n\nThe alliance remains a paper of the archives, and the fleet keeps its own counsel."
 ita_dnc.1765.a: "Then we sail alone."
 ita_dnc.1767.t: "Rome Enters the Alliance"
 ita_dnc.1767.d: "The Italian Kingdom has signed a naval convention and joined the alliance of the central courts openly, which it had never done before.\n\nThe middle sea has changed hands on paper. What remains is to decide whether to answer the fact or the country that made it."
 ita_dnc.1767.a: "Fortify the mountain frontier."
 ita_dnc.1767.b: "Court them all the same."
 ita_dnc.1767.c: "Break off the conversations."
 ita_dnc.1767.e: "Note it, and wait."
 ita_dnc.1768.t: "The Command of the Army of Africa"
 ita_dnc.1768.d: "The Crown offers the command of the Army of Africa to the Duke, who commands a corps at home and has never been offered a colony. With it goes the civil authority of the colony and the ledger of Adwa.\n\nHe may take it and make the colony a viceroyalty. He may decline it and leave the governor where he is."
 ita_dnc.1768.a: "Accept the command."
 ita_dnc.1768.b: "Decline. The colony stays civil."
 ita_dnc.1771.t: "The Viceroy at Asmara"
 ita_dnc.1771.d: "A prince of the Italian house has taken the command at Asmara and the colony below our northern province is now a garrison rather than a customs house.\n\nThe Negus is asked whether the north should be strengthened or the Italians should be met with a courtesy and a tariff."
 ita_dnc.1771.a: "Strengthen the north."
 ita_dnc.1771.b: "Send an envoy and share the customs."
 ita_dnc.1772.t: "The Declaration Before the King"
 ita_dnc.1772.d: "The declaration is drafted, the reservists are on the roads and the fleet is coaled. It waits for one signature, which the Statuto says is the King's alone.\n\nHe has read the reports from the squares and the returns from the Chamber. He asks the ministry whether the country will follow him, and the ministry answers that it will follow him."
 ita_dnc.1772.a: "The King signs."
 ita_dnc.1772.b: "The King will not sign."
 ita_dnc.1773.t: "The Declaration at the Foreign Office"
 ita_dnc.1773.d: "The Italians have declared and the middle sea is a theatre again. The Admiralty asks whether the island squadron is to be brought up or left where it is.\n\nWe said what we said when we were asked, and we may say it again or say something else."
 ita_dnc.1773.a: "Stand aside, as we said we would."
 ita_dnc.1773.b: "Reinforce the island squadron."
 ita_dnc.1774.t: "Vienna Is Asked to Honour the Alliance"
 ita_dnc.1774.d: "Rome has declared and now asks us for the guarantee we discussed before the declaration. The mountain frontier is to be held while the Italian army is away in the south.\n\nThe staff can spare the men. Whether the monarchy should spend them holding a frontier for an ally who chose his own war is another question."
 ita_dnc.1774.a: "Honour the guarantee."
 ita_dnc.1774.b: "The monarchy stays at home."
 ita_dnc.1775.t: "Rome Has Declared"
 ita_dnc.1775.d: "The Italian declaration was handed over this morning and the passes are already closed. Our ally has begun the war we were asked about and did not forbid.\n\nThe General Staff wants to know whether the plan for the western river is a plan or a paper. The Chancellor would rather hold Vienna to the alliance than open a second front for it."
 ita_dnc.1775.a: "March."
 ita_dnc.1775.b: "Hold Vienna to the alliance."
 ita_dnc.1775.c: "Stay out of it."
 ita_dnc.1776.t: "The Peace of Turin"
 ita_dnc.1776.d: "The Italians hold the Regency and their columns are on this side of the passes. They offer us peace at Turin, and the price of it is written out in a single article.\n\nThe army says it can hold the line another season. The Chamber says the country has already paid for two."
 ita_dnc.1776.a: "Cede the Regency."
 ita_dnc.1776.b: "Fight on."
 ita_dnc.1776.c: "Cede the Regency and the island."
 ita_dnc.1777.t: "Terms at the Alps"
 ita_dnc.1777.d: "The Italian army is back behind its own passes and its ministry has asked for terms. We are in a position to name them.\n\nWe may take money, or the fleet that started this, or the ministry that ordered it."
 ita_dnc.1777.a: "The frontier as it was, and an indemnity."
 ita_dnc.1777.b: "Their fleet limited by treaty."
 ita_dnc.1777.c: "The King's ministry must go."
 ita_dnc.1778.t: "The Anchorage at Bizerte"
 ita_dnc.1778.d: "The British will accept the Regency in our hands on one condition, which they put politely and in writing. The great anchorage is to be left open and unfortified.\n\nThe Marine says the anchorage is the only reason the Regency is worth having. The Consulta says a friendly island squadron is worth more than a mole."
 ita_dnc.1778.a: "Accept. The anchorage stays open."
 ita_dnc.1778.b: "Refuse. The anchorage is ours."
 ita_dnc.1779.t: "Bizerte in Italian Hands"
 ita_dnc.1779.d: "The Regency has changed hands and with it the great anchorage that faces our island from the south. The Admiralty has always preferred it weak and has never before been able to ask.\n\nWe may make demilitarisation the price of our recognition, or we may let the thing pass."
 ita_dnc.1779.a: "Demand that the anchorage be left open."
 ita_dnc.1779.b: "Let it pass."
 ita_dnc.1780.t: "The Chamber Is Recalled"
 ita_dnc.1780.d: "The Chamber is recalled for the estimates and for nothing else, and the deputies know it. The ministry does not ask them for a programme, only for the money to govern with.\n\nThey may vote the confidence, refuse it, or vote the budget and adjourn without saying anything at all."
 ita_dnc.1780.a: "Confidence."
 ita_dnc.1780.b: "No confidence."
 ita_dnc.1780.c: "Vote the budget and adjourn."
 ita_dnc.1781.t: "The Ministry Is Beaten"
 ita_dnc.1781.d: "The Chamber has refused the confidence and the ministry has not resigned. The Statuto says the ministers answer to the King, and the King has not asked for their resignation.\n\nHe may dissolve and try the country again, or keep his ministry and let the Senate vote the twelfths month by month."
 ita_dnc.1781.a: "Dissolve again."
 ita_dnc.1781.b: "Keep the ministry. The Senate votes the twelfths."
 ita_dnc.1784.t: "The Squares Will Not Empty"
 ita_dnc.1784.d: "The Chambers of Labour are closed, the Chamber is prorogued and the reservists in the northern towns did not report. What is being read from the balconies is no longer a list of grievances.\n\nThe leagues can rise, or they can call a general strike and wait. The general staff can put the garrisons in the squares, or it can tell the King that it would rather not."
 ita_dnc.1784.a: "The rising."
 ita_dnc.1784.b: "The general strike, and nothing more."
 ita_dnc.1784.c: "The army will not fire."
 ita_dnc.1785.t: "Berlin Backs the General"
 ita_dnc.1785.d: "Our ally is in civil war and its King is governing by decree behind a line of bayonets. The Chancellor observes that a monarchy that puts down its own reds is doing our work for us.\n\nThe staff would like the ally to survive. The Chancellor would like it to owe us for surviving."
 ita_dnc.1785.a: "Back the King and his ministry."
 ita_dnc.1785.b: "Say nothing."
 ita_dnc.1786.t: "The Republic of the North"
 ita_dnc.1786.d: "There is a rising across the mountains and the northern cities are out of their King's hands. The old exiles are already at the frontier asking for rifles and a road.\n\nWe may open the frontier and let the legion through, or close it and keep the affair on the other side of the passes."
 ita_dnc.1786.a: "Let the legion through."
 ita_dnc.1786.b: "Close the frontier."
 ita_dnc.1787.t: "Italy in Civil War"
 ita_dnc.1787.d: "Our southern neighbour is in civil war and its northern provinces are held by the leagues. The monarchy has always said that a throne in danger is every throne's business.\n\nWe may offer the help of the Holy Alliance, mass in the Tyrol for the sake of order, or watch and say nothing."
 ita_dnc.1787.a: "Offer the help of the Holy Alliance."
 ita_dnc.1787.b: "Mass in the Tyrol, for order."
 ita_dnc.1787.c: "Watch, and say nothing."
 ita_dnc.1788.t: "The Bench Is Asked to Apply the Code"
 ita_dnc.1788.d: "The code of public safety is printed and circulated to every court in the Kingdom. It puts the press under licence, gives the ministry the naming of the bench and makes a meeting an offence before it is held.\n\nThe magistrates may apply it, refuse it in the name of the law the Chamber voted, or ask for an amnesty as the price of applying it."
 ita_dnc.1788.a: "Apply the code."
 ita_dnc.1788.b: "The judges refuse."
 ita_dnc.1788.c: "Apply it, against an amnesty."
 ita_dnc.1789.t: "The Amnesty Is Asked For"
 ita_dnc.1789.d: "The bench will apply the code if the prisoners of the last rising come out of the islands first. It is a bargain and the presidents of the courts do not pretend otherwise.\n\nThe ministry can empty the islands and have its code, or keep them full and have neither."
 ita_dnc.1789.a: "Grant the amnesty."
 ita_dnc.1789.b: "Refuse the amnesty."
 ita_dnc.1791.t: "A Soldier Governs in Italy"
 ita_dnc.1791.d: "The Italian presidency has gone to a general and the elections there have been suspended. The Ballhausplatz has watched the experiment with interest and some envy.\n\nAn order that is kept on the other side of the mountains is an order we do not have to keep for them."
 ita_dnc.1791.a: "An order that is kept is worth something."
 ita_dnc.1791.b: "Note it, and no more."
 ita_dnc.1792.t: "The Form of the Kingdom"
 ita_dnc.1792.d: "The Kingdom has been governed for a decade by ministers who answer to the King, and the Chamber has voted the estimates and gone home. The country has stopped asking what the arrangement is called.\n\nThe King may say plainly that he governs and suspend the elections, or he may hand the practice back to the Chamber and keep the Statuto as it was written."
 ita_dnc.1792.a: "The Crown governs."
 ita_dnc.1792.b: "The Crown returns the parliamentary practice."
 ita_dnc.1793.t: "The Ministry Is Offered to the Generals"
 ita_dnc.1793.d: "The general who wrote the decrees is in the antechamber and the memorandum of the staff is on the desk. The Kingdom has been governed by soldiers before, in one island and for one season.\n\nThe King may give the presidency to a soldier and be done with the Chamber, or recall the Chamber and take the man it wants."
 ita_dnc.1793.a: "The general takes the presidency."
 ita_dnc.1793.b: "Recall the Chamber."
 ita_dnc.1794.t: "The King Governs in Italy"
 ita_dnc.1794.d: "The Italian King has said in his own name what his ministers have been doing for a decade. The elections there are suspended and the Chamber sits when it is called.\n\nThe fact is now on the record and every chancellery is writing its minute on it."
 ita_dnc.1794.a: "A king who governs is no neighbour of ours."
 ita_dnc.1794.b: "A kingdom that is governed can be relied upon."
 ita_dnc.1795.t: "Berlin Backs the Military Ministry"
 ita_dnc.1795.d: "A general has taken the presidency of our southern ally and the elections there are suspended. The Chancellor reads it as an ally that will no longer be blown about by its own Chamber.\n\nThe staff asks whether to encourage the arrangement or to wait and see how long it lasts."
 ita_dnc.1795.a: "Support the military ministry."
 ita_dnc.1795.b: "Wait and see."
 ita_dnc.1797.t: "The Offer of the Holy Alliance"
 ita_dnc.1797.d: "The other court offers the help of the Holy Alliance against our own rising, in the old form and with the old words. Its army would be at our disposal and its price would be counted later.\n\nWe may accept and owe the debt, or refuse and put down the rising with the men we have."
 ita_dnc.1797.a: "Accept the help."
 ita_dnc.1797.b: "Refuse it. This is our house."
 ita_dnc.1798.t: "The Alliance Has No Answer"
 ita_dnc.1798.d: "The question of the Regency was drafted for a chancellery that is no longer there to receive it. The treaty that carried the promise has no other guarantor.\n\nThe Consulta files the memorandum and the claim is not laid."
 ita_dnc.1798.a: "Then the promise was worth nothing."
 ita_dnc.1799.t: "The Ally Has Lost"
 ita_dnc.1799.d: "Our southern ally has signed terms in the mountains and has come out of the war with less than it went in with. The staff had counted its corps and will now count them again.\n\nAn ally who loses his own war is worth what he is worth."
 ita_dnc.1799.a: "Then we shall count them again."
 ITADNC_r_london_naval: "London Is Asked for a Naval Understanding"
 ITADNC_r_london_naval_desc: "The middle sea is held by a fleet we cannot fight and watched by two allies who have never helped us in it. We must ask the Admiralty for an understanding on the standing order of that water, and hear what price is put on our signature."
 ITADNC_r_berlin_defensive: "Berlin Is Asked for a Defensive Reading"
 ITADNC_r_berlin_defensive_desc: "We have always read the alliance as a promise to defend and never as a promise to march, and our socialists will not vote a lira until somebody else says so. We must ask Berlin to put the defensive reading in writing and let Vienna read the answer."
 ITADNC_r_the_kingdom_of_all_italians: "The Kingdom of All Italians"
 ITADNC_r_the_kingdom_of_all_italians_desc: "The King has signed the laws of the Bloc and the country has never been asked what it thinks of them. We must go to the country on the labour laws and the wide register, and let the returns say whether this kingdom belongs to all of its Italians."
 ITADNC_r_the_constituent: "The Constituent Is Called"
 ITADNC_r_the_constituent_desc: "The Crown has sent away a ministry that held the Chamber, and the Chamber has not gone home. We must let Montecitorio declare itself constituent, and hear from the general staff whether the regiments will stay in barracks while it sits."
 ITADNC_r_the_abdication: "The Abdication"
 ITADNC_r_the_abdication_desc: "A young King reigns over an assembly that no longer asks his leave and an army that will not answer for him. We must put the question of the throne to the Quirinal and take whatever answer comes back from it."
 ITADNC_r_the_republic_proclaimed: "The Republic Proclaimed"
 ITADNC_r_the_republic_proclaimed_desc: "The throne is empty and the Constituent sits with nothing above it. We must have the assembly vote the form of the State, and live with what the chambers of labour do about the vote."
 ITADNC_r_the_popes_answer: "The Pope's Answer"
 ITADNC_r_the_popes_answer_desc: "The Holy See has never recognised the kingdom and is now asked to live under something it likes far less. We must let the Curia answer for itself, whether the Pope hardens the ban, leaves for a friendlier crown, or treats with us for guarantees."
 ITADNC_r_the_powers_recognise: "The Powers Recognise"
 ITADNC_r_the_powers_recognise_desc: "A republic on this peninsula is a thing every chancery in Europe must write an answer to, and none of them has written it yet. We must ask the six capitals for recognition and count the refusals as carefully as the acceptances."
 ITADNC_r_the_italian_republic: "The Italian Republic"
 ITADNC_r_the_italian_republic_desc: "The Constituent has the constitution before it in two drafts, one with a president and a Chamber, one with the chambers of labour and no polls at all. We must have the assembly vote and take the republic it gives us."
 ita_dnc.1852.t: "A Naval Understanding"
 ita_dnc.1852.d: "The Italian ambassador proposes that our two fleets agree to keep the middle sea as it stands, and that neither of us support a change in it against the other. Rome is allied to Vienna and Berlin and insists the alliance has never touched this water.\n\nWe can take the understanding as it is offered, decline it, or answer that an Italian signature is worth having only from a Rome that has left the Triple Alliance."
 ita_dnc.1852.a: "Agree on the standing order of that sea."
 ita_dnc.1852.b: "Decline. Their signature is already spoken for."
 ita_dnc.1852.c: "Our terms: let them give notice to their allies first."
 ita_dnc.1853.t: "A Defensive Reading"
 ita_dnc.1853.d: "Rome asks the Chancellery to confirm in writing what the Italians have always told their own Chamber: that the alliance obliges nobody to attack anybody. They want the words on paper before their socialists are asked to vote the estimates.\n\nWe can give them the reading they ask for and keep them in the treaty, or answer that the treaty says what it says and needs no gloss."
 ita_dnc.1853.a: "Confirm the defensive reading."
 ita_dnc.1853.b: "The alliance is what it says."
 ita_dnc.1854.t: "The Price of the Understanding"
 ita_dnc.1854.d: "The Admiralty will sign, and only with a kingdom that is not tied to the two courts. The price of a friendly sea is the notice of denunciation, and our ambassador reports it without a word of comment.\n\nWe can give the notice and take the hand that is offered, or keep the alliance and let the understanding go."
 ita_dnc.1854.a: "Give notice. That sea is worth more than the treaty."
 ita_dnc.1854.b: "Keep the alliance. The offer can wait."
 ita_dnc.1855.t: "Rome at the Admiralty"
 ita_dnc.1855.d: "Our attache reports that the Italians have been talking to the British naval staff, and that the talk was not about coaling stations. An ally who arranges his own sea elsewhere is an ally in name only.\n\nWe can shut our own door on them and let them find it shut, or note the thing and say nothing until something is signed."
 ita_dnc.1855.a: "Close the door and let them find it closed."
 ita_dnc.1855.b: "Note it. Nothing is signed yet."
 ita_dnc.1856.t: "The Returns of the Bloc"
 ita_dnc.1856.d: "The last constituencies have declared and the clerks at Montecitorio have finished the arithmetic that decides what kind of kingdom this is going to be. The Bloc went to the country on the labour laws, on the wide register, and on a King who signed both.\n\nEither the country has given the Bloc the Chamber it asked for, or it has sent for the old man who governed before us."
 ita_dnc.1856.a: "The Bloc is returned. This kingdom belongs to all its Italians."
 ita_dnc.1856.b: "The Bloc is beaten. Send for the old man."
 ita_dnc.1857.t: "The Answer Does Not Come"
 ita_dnc.1857.d: "There is no chancery at the other end of the note, or none that will put its name to anything we have proposed. The file goes back into the cupboard with the rest of the correspondence.\n\nNothing has been agreed, and nothing has been refused."
 ita_dnc.1857.a: "File it."
 ita_dnc.1860.t: "Montecitorio Declares Itself"
 ita_dnc.1860.d: "The Extreme Left, the radicals and the republicans have moved that the Chamber sit as a constituent assembly, and the benches of the centre are not leaving the hall. An officer of the general staff has been sent for and is waiting in the corridor.\n\nThe Chamber can declare itself and trust the army to stay in barracks, declare itself and find the army with the King, or take back the motion and accept the ministry the Crown has offered."
 ita_dnc.1860.a: "Declare the Constituent. The regiments will stay in barracks."
 ita_dnc.1860.b: "Declare it, and let the army choose its King."
 ita_dnc.1860.c: "Withdraw the motion and accept the ministry offered."
 ita_dnc.1862.t: "The Republic at Milan"
 ita_dnc.1862.d: "The Italian Chamber has declared itself constituent and the King has gone north-west with the regiments that still answer to him. The great northern cities are in the hands of a government that calls itself a republic and uses our own words for it.\n\nWe can recognise it and put our weight behind it, or wait quietly until we know which side holds the ports."
 ita_dnc.1862.a: "Recognise them and support them."
 ita_dnc.1862.b: "Wait, and see who holds the ports."
 ita_dnc.1863.t: "The King at Turin"
 ita_dnc.1863.d: "The King of Italy has raised his standard in the north-west with the regiments that stayed loyal, and the rest of the peninsula obeys a constituent assembly. A legitimate crown is asking the courts of Europe not to look away.\n\nWe can guarantee him and send what his regiments lack, or keep the frontier shut and let Italians settle Italy."
 ita_dnc.1863.a: "Guarantee the King. A throne is a throne."
 ita_dnc.1863.b: "Shut the frontier and say nothing."
 ita_dnc.1864.t: "The Quirinal Answers"
 ita_dnc.1864.d: "The Constituent sits, the army will not answer for the throne, and the King has asked that the yacht be got ready at Naples. His cousin of Aosta has been at the palace twice this week and has not been sent away.\n\nThe King can go, abdicate in favour of the duke and leave the assembly a regency to accept or refuse, or go north instead and raise his standard among the regiments that are still his."
 ita_dnc.1864.a: "The King abdicates and embarks."
 ita_dnc.1864.b: "The King abdicates in favour of the duke of Aosta."
 ita_dnc.1864.c: "The King goes north and raises the standard."
 ita_dnc.1865.t: "The Regent of Aosta"
 ita_dnc.1865.d: "The instrument of abdication names the duke of Aosta and the Constituent has it on the table. The duke has let it be known that he will take the crown from the assembly and from nobody else.\n\nThe assembly can refuse the regency and leave the throne empty, or accept it and keep a House of Savoy that owes its crown to the Chamber."
 ita_dnc.1865.a: "Refuse the regency. The throne stays empty."
 ita_dnc.1865.b: "Accept the regency. A Savoy who owes us his crown."
 ita_dnc.1866.t: "The Savoy Ask for Nice"
 ita_dnc.1866.d: "The exiled King asks for a house on our coast, in the county his family sold to us within living memory. It is a small request with a very long history behind it.\n\nWe can take him in and let the Italians make of it what they like, or find that no suitable house is available."
 ita_dnc.1866.a: "Give the house. He is a cousin of half of Europe."
 ita_dnc.1866.b: "No suitable house is available."
 ita_dnc.1867.t: "The King Asks His Father-in-Law for a Roof"
 ita_dnc.1867.d: "Our daughter's husband has lost his throne and asks for the shelter of our court until Italy comes to its senses. The men now governing in his place will read our answer as a policy and not as a family matter.\n\nWe can receive him and take what follows, or send him on to a court with more soldiers and less coastline."
 ita_dnc.1867.a: "Receive the King. He is family."
 ita_dnc.1867.b: "Send him on. We have a frontier to keep."
 ita_dnc.1868.t: "The Constituent Votes the Form of the State"
 ita_dnc.1868.d: "The throne is empty, the assembly is sovereign, and the chambers of labour have brought their delegations to the doors of the Capitol. The republicans have their proclamation drafted and the syndicalists have drafted another.\n\nThe assembly can proclaim the republic from the Capitol, or it can divide and leave the street to say what comes next."
 ita_dnc.1868.a: "Proclaim the republic from the Capitol."
 ita_dnc.1868.b: "The assembly divides and the chambers of labour take the street."
 ita_dnc.1872.t: "The Curia Answers"
 ita_dnc.1872.d: "The Holy Father was asked nothing and has been given a republic. The Secretariat of State has three drafts before it and the Sacred College has been called in from the villas.\n\nThe Pope can stay and harden the ban on the polls, leave the city for a crown that will house him, or open talks with the new State for guarantees in writing."
 ita_dnc.1872.a: "The Pope stays, and the ban is hardened."
 ita_dnc.1872.b: "The Pope leaves the city."
 ita_dnc.1872.c: "The Curia will treat for guarantees."
 ita_dnc.1873.t: "The Guarantees Are Asked For"
 ita_dnc.1873.d: "The Curia asks that the law of guarantees be written again by a State that did not make it, with the palaces, the couriers and the missions abroad all named this time. Nothing in the draft asks for a single acre back.\n\nWe can grant them and buy the silence of the parishes, or refuse and let the ban be hardened against us instead."
 ita_dnc.1873.a: "Grant the guarantees."
 ita_dnc.1873.b: "Refuse. The Church may keep its ban."
 ita_dnc.1874.t: "The Pope Asks for Malta"
 ita_dnc.1874.d: "The Holy See asks whether the island would receive the Pope and his household, as it was sounded on the same question in the last reign. The Italians would read our answer as an act aimed at them, and would be right.\n\nWe can offer the island and the escort to reach it, or answer that the garrison has no room."
 ita_dnc.1874.a: "The island will receive him."
 ita_dnc.1874.b: "The garrison has no room."
 ita_dnc.1875.t: "The Pope Asks for a Roof"
 ita_dnc.1875.d: "The Holy Father asks the Apostolic Majesty for a residence at Trent, where the valleys speak Italian and the bishops are ours. The men in Italy would never forgive it and would never dare say so aloud.\n\nWe can receive him and become the first court of the Church, or decline and let him look for a roof somewhere else."
 ita_dnc.1875.a: "Receive the Holy Father at Trent."
 ita_dnc.1875.b: "Decline. Let him look elsewhere."
 ita_dnc.1876.t: "The Republic Asks for Recognition"
 ita_dnc.1876.d: "The Italian Constituent has proclaimed a republic and its first note asks us to recognise it. A sister republic on the far side of the Alps is worth more to us than anything the kings ever signed there.\n\nWe can recognise it, guarantee it and bring it in beside us, or recognise it coldly and leave it standing alone."
 ita_dnc.1876.a: "Recognise, guarantee, and take them in with us."
 ita_dnc.1876.b: "Recognise, and nothing more."
 ita_dnc.1877.t: "The Republic Asks for Recognition"
 ita_dnc.1877.d: "The new Italian government asks for recognition and reminds us how many of its people are living in our cities. The consular reports say the country is quiet enough to be dealt with.\n\nWe can recognise the republic at once, as we have done before in such cases, or wait for the next despatch before saying anything."
 ita_dnc.1877.a: "Recognise the republic."
 ita_dnc.1877.b: "Wait for the next despatch."
 ita_dnc.1878.t: "The Republic Asks for Recognition"
 ita_dnc.1878.d: "The Italians ask for recognition while the House of Savoy still calls itself the lawful government from abroad. Trade and the fleet argue one way and the palace argues the other.\n\nWe can recognise the republic now that order is restored there, or refuse while a king with a claim is still asking us to dinner."
 ita_dnc.1878.a: "Recognise. Order is restored."
 ita_dnc.1878.b: "Refuse while the Savoy still claim."
 ita_dnc.1879.t: "The Republic Asks for Recognition"
 ita_dnc.1879.d: "The note asks the Emperor to receive a republic made by a chamber that sent its King away. It comes from a court we were allied to, and the Emperor has read it aloud twice.\n\nWe can refuse it and say plainly why, or recognise the thing in fact and keep our ambassador at his desk."
 ita_dnc.1879.a: "Refuse. We do not receive regicide."
 ita_dnc.1879.b: "Recognise in fact, and nothing on paper."
 ita_dnc.1880.t: "The Constituent Votes the Constitution"
 ita_dnc.1880.d: "The assembly has the constitution before it in two drafts. One gives the republic a president and a Chamber elected by the whole country; the other gives it to the chambers of labour and abolishes the polls altogether.\n\nThe assembly can vote the presidential republic, or it can vote the republic of labour and let the leagues govern in its name."
 ita_dnc.1880.a: "The presidential republic, one and indivisible."
 ita_dnc.1880.b: "The republic of labour."
 ita_dnc.1882.t: "The Red Republic"
 ita_dnc.1882.d: "The Italians have handed the State to their chambers of labour and abolished the polls, and the frontier corps report that the news is read aloud in our own valleys every evening. A syndicalist republic on the far bank is not a neighbour, it is a fire.\n\nWe can take a war aim against the provinces beyond the river, or draw a cordon along it and let the thing burn itself out."
 ita_dnc.1882.a: "Take the war aim. This is settled with troops or not at all."
 ita_dnc.1882.b: "A cordon on the frontier, and nothing more."
 ita_dnc.1883.t: "Paris Withdraws Recognition"
 ita_dnc.1883.d: "The republic we recognised has abolished its elections and handed itself to the leagues, and our own deputies are asking what our guarantee is worth now. A guarantee given to a government that will not go to the polls is a guarantee given to nobody.\n\nWe can withdraw the guarantee and the alliance with it, or keep our word and answer for it in the Chamber."
 ita_dnc.1883.a: "Withdraw the guarantee."
 ita_dnc.1883.b: "Keep our word."
 ita_dnc.1884.t: "The Republic Asks for Recognition"
 ita_dnc.1884.d: "A republic made by a chamber that sent its King away asks the Apostolic Majesty to recognise it. Our own nationalities read the Italian newspapers, and the corps of the Tyrol have already asked for their reservists.\n\nWe can refuse and mass the corps, offer recognition against a written renunciation of the irredenta, or recognise the thing in fact and say nothing further."
 ita_dnc.1884.a: "Refuse, and let the Tyrol corps stand to."
 ita_dnc.1884.b: "Recognition against the irredenta, in writing."
 ita_dnc.1884.c: "Recognise in fact. We have other frontiers."
 ita_dnc.1885.t: "The Republic Asks for Recognition"
 ita_dnc.1885.d: "The Italians ask the Emperor of all the Russias to receive their republic, having removed a king by a vote of their chamber. The Holy Synod has an opinion about it and has not been asked for one.\n\nWe can refuse, as an autocracy is expected to, or recognise them and keep a friend in that sea."
 ita_dnc.1885.a: "Refuse. We do not applaud this."
 ita_dnc.1885.b: "Recognise them. That sea is useful to us."
 ita_dnc.1886.t: "The Price of the Frontier"
 ita_dnc.1886.d: "Recognition is offered and the price is written out: a renunciation in due form of every claim beyond the eastern frontier, signed by the republic and laid before the assembly. The provinces named are the ones our schools have taught about for forty years.\n\nWe can sign the renunciation and buy the frontier, or refuse and take whatever the corps of the Tyrol are told to do about it."
 ita_dnc.1886.a: "Sign the renunciation. The frontier is worth it."
 ita_dnc.1886.b: "Refuse. We do not sell our own."
 ita_dnc.1899.t: "The King's Cause"
 ita_dnc.1899.d: "The Italian King holds the north-west with the regiments that stayed with him and asks the courts of Europe whether a throne still means anything at all. The Emperor has read the appeal and has been reminded that the man is an ally of ours.\n\nWe can put our weight behind the King's cause, or leave the Italians to settle it among themselves."
 ita_dnc.1899.a: "Support the King's cause."
 ita_dnc.1899.b: "Leave them to it."
 ITA_r_blocco_popolare: "Blocco Popolare"
 ITA_r_blocco_popolare_long: "The Popular Bloc"
 ITA_r_unione_liberale: "Unione Liberale"
 ITA_r_unione_liberale_long: "The Liberal Union"
 ITA_r_destra_costituzionale: "Destra Costituzionale"
 ITA_r_destra_costituzionale_long: "The Constitutional Right"
 ITA_r_partito_repubblicano: "Partito Repubblicano"
 ITA_r_partito_repubblicano_long: "The Republican Party"
 ITA_r_camere_del_lavoro: "Camere del Lavoro"
 ITA_r_camere_del_lavoro_long: "The Chambers of Labour"
 ITA_r_entente_latine: "Entente Latine"
 ITA_r_revel_at_the_admiralty: "Paolo Thaon di Revel"
 ITA_r_revel_at_the_admiralty_desc: "The officer the Admiralty keeps for the day it has to explain itself to a Chamber that counts the cost of every hull. He will take the fleet exactly as far as the understanding says it may go, and not a mile further."
 ITA_r_colajanni_at_the_constituent: "Napoleone Colajanni"
 ITA_r_colajanni_at_the_constituent_desc: "A Sicilian republican who has spent his life proving that the South is governed badly on purpose and printing the figures to show it. He wrote the constitution he wants long before there was an assembly to read it to."
 ITA_r_threat_the_constituent: "The Italian Chamber declares itself constituent"
 ITA_r_threat_the_king_at_turin: "The King of Italy raises his standard in the north"
 ITA_r_threat_vienna_takes_the_kings_part: "Vienna guarantees the Italian King"
 ITA_r_threat_the_throne_is_empty: "Italy puts the throne itself to the question"
 ITA_r_threat_the_republic_proclaimed: "The Italian republic is proclaimed"
 ITA_r_threat_the_pope_leaves_rome: "The Pope leaves for the Tyrol"
 ITA_r_threat_berlin_will_not_recognise: "Berlin refuses to recognise the Italian republic"
 ITA_r_threat_the_republic_of_labour: "The chambers of labour take the Italian State"
 ITA_r_threat_vienna_reads_the_red_republic: "Vienna takes a war aim against the red republic"
 ITA_r_threat_the_cordon_on_the_isonzo: "Vienna draws a cordon on the Isonzo"
 ITA_r_threat_the_tyrol_corps_are_massed: "The corps of the Tyrol are massed against Italy"
 ITADNC_z_the_nation_in_arms: "The Nation in Arms"
 ITADNC_z_the_nation_in_arms_desc: "The plan against the ally has lain undated in the drawer of the staff since the frontier was first surveyed, and the conscript serves two years where the Empire serves three. We shall put the plan and the third year before the Chief of Staff and take the answer he gives us."
 ITADNC_z_conrad_asks_for_the_war: "Conrad Asks for the War"
 ITADNC_z_conrad_asks_for_the_war_desc: "The Austrian Chief of Staff has twice asked his Emperor for a preventive war on us, and our convention and our plan have handed him the argument. We shall let Vienna answer him, and hold the frontier corps ready for whichever answer comes."
 ITADNC_z_berlin_is_asked_to_stand_aside: "Berlin Is Asked to Stand Aside"
 ITADNC_z_berlin_is_asked_to_stand_aside_desc: "A war on the Isonzo is lost before it opens if the Reich marches beside Vienna, and the treaty of the three says nothing about a quarrel between two of them. We shall ask Berlin plainly whether the alliance covers a war that Vienna began."
 ITADNC_z_the_hour: "The Hour"
 ITADNC_z_the_hour_desc: "Vienna is held elsewhere, the frontier is surveyed and the old Emperor will not live for ever. We shall carry the declaration to the Quirinal and ask the King for the signature that opens the war for Trento and Trieste."
 ITADNC_z_cetinje_marches: "Cetinje Is Asked to March"
 ITADNC_z_cetinje_marches_desc: "The father of our Queen keeps an army within sight of the Bocche and his house has wanted them for three generations. We shall ask Cetinje to open the southern front and bring the Montenegrins into a league of our own making."
 ITADNC_z_belgrade: "Belgrade Is Asked to Renounce Dalmatia"
 ITADNC_z_belgrade_desc: "Belgrade wants an outlet on our sea and a friend against Vienna, and both of those are ours to sell. We shall offer our support for the Serbian claim in Bosnia and require the Dalmatian coast to be written off before a shot is fired."
 ITADNC_z_the_sea: "The Sea That Must Be Ours"
 ITADNC_z_the_sea_desc: "The Austrian front has broken and our terms can be on the table before the powers think to call a conference. We shall demand the unredeemed provinces, and Fiume and the Dalmatian coast with them if Vienna is beaten far enough to sign."
 ITADNC_z_terms_at_udine: "Terms at Udine"
 ITADNC_z_terms_at_udine_desc: "The Isonzo has gone the other way and the Austrian corps are across the Tagliamento with the winter behind them. We shall hear what Vienna asks for an armistice and pay the least of it that will end the war."
 ITADNC_z_greater_italy: "Greater Italy"
 ITADNC_z_greater_italy_desc: "The provinces are in, the upper sea is ours and the associations are asking for a state that looks like the victory. We shall let the Quirinal settle what form the new Italy takes and who governs it."
 ITADNC_z_the_kingdom_humbled: "The Kingdom Humbled"
 ITADNC_z_the_kingdom_humbled_desc: "The hour was never struck, or it was struck and the columns came home with nothing to show the country. We shall let the Chamber say who governs what is left of the national programme."
 ITADNC_z_the_albanian_principality: "The Albanian Principality"
 ITADNC_z_the_albanian_principality_desc: "Our schools, our consulates and our coasting steamers already hold the Albanian shore, and the highlands are in revolt against the Porte again. We shall propose an autonomous Albania under a prince of our choosing, and under our guarantee alone."
 ITADNC_z_montenegro_under_our_wing: "Montenegro Under Our Wing"
 ITADNC_z_montenegro_under_our_wing_desc: "The subsidy, the tobacco monopoly and the works at Antivari are ours already, and Cetinje has nothing left to sell but its foreign policy. We shall offer the old King a guarantee and a pension and take his coast under our wing."
 ITADNC_z_the_kingdom_of_italy_and_albania: "The Kingdom of Italy and Albania"
 ITADNC_z_the_kingdom_of_italy_and_albania_desc: "The principality is ours, the Montenegrin coast is under our guarantee and the Albanian notables are looking for a dynasty. We shall ask the Quirinal whether the House will wear the second crown across the water."
 ITA_z_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_z_threat_vienna_answers_conrad: "Vienna weighs a preventive war on Italy"
 ITA_z_threat_the_tyrol_mobilises: "Austria mobilises in the Tyrol"
 ITA_z_threat_the_german_guarantee: "Berlin guarantees Vienna against Italy"
 ITA_z_threat_the_hour: "Italy marches on the Isonzo"
 ITA_z_threat_the_serbian_guarantee: "Italy guarantees Serbia against Vienna"
 ITA_z_threat_the_isonzo_guarantee: "Berlin guarantees Austria against Italy"
 ITA_z_threat_the_albanian_prince: "Italy sets a prince of her own over Albania"
 ITA_z_threat_the_wargoal_on_the_porte: "Italy prepares to take Albania by arms"
 ITA_z_threat_the_condominium: "Vienna demands a share of Albania"
 ITA_z_threat_our_wing_over_cetinje: "Italy takes Montenegro under her wing"
 ITA_z_threat_the_savoy_crown: "A Savoy viceroy is set over Albania"
 ITA_z_party_nazionalista: "Associazione Nazionalista"
 ITA_z_party_nazionalista_long: "Associazione Nazionalista Italiana"
 ITA_z_party_unione_nazionale: "Unione Nazionale"
 ITA_z_party_unione_nazionale_long: "Unione Nazionale Liberale"
 ITA_z_party_unione_liberale: "Unione Liberale"
 ITA_z_party_unione_liberale_long: "Unione Liberale Italiana"
 ITA_z_adriatic_league: "Adriatic League"
 ita_dnc.1652.t: "The Staff Answers"
 ita_dnc.1652.d: "The plan against the ally has lain in the drawer of the staff for years, studied and never dated, because dating it would make it a plan against a treaty. The programme asks for it to be dated, and for the third year with the colours that would fill out the corps it names.\n\nThe staff can take the plan, refuse it, or answer that the army cannot carry it."
 ita_dnc.1652.a: "Date the plan against the ally."
 ita_dnc.1652.b: "The Chief of Staff will not sign."
 ita_dnc.1652.c: "The army is not ready."
 ita_dnc.1653.t: "The Chief of Staff Will Not Sign"
 ita_dnc.1653.d: "The Chief of Staff has told the minister that the alliance is a treaty and that a staff does not plan against a treaty it is sworn to. He offers his resignation with the sentence, in the manner of his generation.\n\nWe may keep him and keep the peace of the staff, or take the resignation and put another man in the chair."
 ita_dnc.1653.a: "Keep him where he is."
 ita_dnc.1653.b: "Another man takes the chair."
 ita_dnc.1654.t: "The Army Is Not Ready"
 ita_dnc.1654.d: "The staff answers with a memorandum on cadres, mountain batteries and the classes that were sent home early to save the budget. It ends by asking for the third year with the colours before any plan is dated.\n\nWe can grant the year and have our plan, or refuse it and have neither."
 ita_dnc.1654.a: "Grant the third year."
 ita_dnc.1654.b: "Refuse the year."
 ita_dnc.1655.t: "The War That Did Not Come"
 ita_dnc.1655.d: "Vienna has heard its Chief of Staff and has not followed him. The frontier corps stand down, the ambassador is cordial again, and the newspapers print what they were forbidden to print a month ago.\n\nThe country has been shown how near it came, and has not liked the view."
 ita_dnc.1655.a: "We were spared a war we did not choose."
 ita_dnc.1656.t: "The Chief of Staff Asks for the War"
 ita_dnc.1656.d: "The Chief of Staff has come again with the same memorandum. Italy is arming, Italy is talking to Belgrade, and the day the Kingdom is ready the Empire fights on two fronts instead of one.\n\nThe Ballhausplatz answers that the alliance is worth more than the Trentino. The Emperor must decide which of them he believes."
 ita_dnc.1656.a: "The alliance is worth more. Refuse him."
 ita_dnc.1656.b: "Let him mobilise in the Tyrol."
 ita_dnc.1657.t: "The Tyrol Mobilises"
 ita_dnc.1657.d: "The Austrian classes have been called in the Tyrol and the works of the Cadore are watched from the far side of the ridge. The ambassador answers that these are manoeuvres and invites us to count the days of them ourselves.\n\nWe can call our own classes, or ask the northern ally to hold Vienna back."
 ita_dnc.1657.a: "Call the classes."
 ita_dnc.1657.b: "Ask the ally to hold them back."
 ita_dnc.1658.t: "Berlin Says No"
 ita_dnc.1658.d: "The German ambassador has read out a note which says the alliance does not cover a war opened by one partner against another. The staff answers that the Tyrol is a matter for the Empire alone.\n\nThe mobilisation can be given up, or carried through without the Reich behind it."
 ita_dnc.1658.a: "Give up the mobilisation."
 ita_dnc.1658.b: "Carry it through regardless."
 ita_dnc.1659.t: "Berlin Is Asked to Restrain Vienna"
 ita_dnc.1659.d: "The Italian ambassador asks whether the Reich means to watch one ally mobilise against another and call it a manoeuvre. He leaves a memorandum on the tonnage the Kingdom would put into the middle sea if the alliance were dissolved.\n\nWe can hold Vienna back, or let the two of them settle it between themselves."
 ita_dnc.1659.a: "Hold Vienna back."
 ita_dnc.1659.b: "Let them settle it."
 ita_dnc.1660.t: "Rome Asks Berlin to Hold Aloof"
 ita_dnc.1660.d: "The Italian ambassador asks for one sentence in writing: that the Reich will not march if the quarrel with Vienna comes to arms. He offers nothing for it and says plainly that the answer will decide what the Kingdom does next.\n\nWe can hold aloof, answer for our ally, or put the whole business before a conference of the powers."
 ita_dnc.1660.a: "Hold aloof."
 ita_dnc.1660.b: "The alliance will be honoured."
 ita_dnc.1660.c: "Propose a conference."
 ita_dnc.1661.t: "The Ally Holds Aloof"
 ita_dnc.1661.d: "The answer from the northern chancery is short and is not published: the Reich will not march for a quarrel Vienna began. Our ambassador is told to keep the paper in his own hands.\n\nThe staff reads it twice and then takes the northern railways off the plan."
 ita_dnc.1661.a: "One front is enough."
 ita_dnc.1662.t: "A Guarantee Against Us"
 ita_dnc.1662.d: "The guarantee to Vienna has been announced from the tribune and cheered by the parties that matter there. Our ambassador reports that it was drafted before he asked his question.\n\nWhatever we do on the Isonzo, we shall be doing it against two empires and not one."
 ita_dnc.1662.a: "Then we must be very sure."
 ita_dnc.1663.t: "A Conference on the Adriatic"
 ita_dnc.1663.d: "We are asked to call a conference on the Adriatic question, as the power with least to gain from either of the claimants. Rome would come at once; Vienna would come slowly and would come.\n\nWe can call the powers together, or decline and let the two of them go on arming."
 ita_dnc.1663.a: "Call the powers together."
 ita_dnc.1663.b: "Decline."
 ita_dnc.1664.t: "The Hour"
 ita_dnc.1664.d: "The declaration is drafted, the classes are called and the ministry has come up to the Quirinal for the signature. The King reads the ministry, then the piazza, then the despatches from the northern chancery, and says nothing for a long while.\n\nHe can sign the war, or he can send the ministry home and keep the peace."
 ita_dnc.1664.a: "Sign it."
 ita_dnc.1664.b: "The King will not sign."
 ita_dnc.1667.t: "Rome Marches on Vienna"
 ita_dnc.1667.d: "The Italian declaration has been delivered and the first corps are moving up to the Isonzo. The treaty of the three is dead and the only question left is what we do about it.\n\nWe can declare for the ally we have left, or stand where we said we would stand."
 ita_dnc.1667.a: "Declare for Vienna."
 ita_dnc.1667.b: "Stand aside."
 ita_dnc.1668.t: "Cetinje Is Asked to March"
 ita_dnc.1668.d: "The Italian minister asks the King to bring his army down to the Bocche while the Austrians are held on the Isonzo. He brings a subsidy with him, and a place in the league Rome is putting together.\n\nThe Bocche have been wanted in this house for three generations. The Austrians are still the Austrians."
 ita_dnc.1668.a: "March on the Bocche."
 ita_dnc.1668.b: "Stay out of it."
 ita_dnc.1669.t: "Belgrade Is Asked to Renounce Dalmatia"
 ita_dnc.1669.d: "Rome offers her support for our claim on the annexed provinces and asks in exchange that we renounce the Dalmatian coast in advance and in writing. The Italian minister adds that the offer will not be made twice once the war is open.\n\nWe can take the bargain, refuse them a coast that speaks our language, or ask what they will arm us with first."
 ita_dnc.1669.a: "Take the bargain."
 ita_dnc.1669.b: "Dalmatia is Slav."
 ita_dnc.1669.c: "Ask for the rifles first."
 ita_dnc.1670.t: "The Rifles That Were Asked For"
 ita_dnc.1670.d: "Belgrade will sign, and will sign sooner if the first consignment is on the Danube before the ink is dry. The arsenals answer that the old pattern can be spared and will not be missed on the Isonzo.\n\nWe can send them and have the convention, or keep them and have neither."
 ita_dnc.1670.a: "Send the rifles."
 ita_dnc.1670.b: "Keep them."
 ita_dnc.1671.t: "Rome Guarantees Belgrade"
 ita_dnc.1671.d: "The guarantee was published in the Italian press before our ambassador was told that it existed. An ally who guarantees our enemy has told us what the alliance is worth to him.\n\nThe Ballhausplatz can note it, and remember it."
 ita_dnc.1671.a: "Note it."
 ita_dnc.1672.t: "Rome Offers Terms"
 ita_dnc.1672.d: "The Italian note offers peace against the provinces: the Trentino, the South Tyrol, Trieste, Istria and the mines at Idrija. If the front gives further, it says, the price will be Fiume and the Dalmatian coast as well.\n\nThe army can hold or it cannot. The Hungarians have said again that they will not fight for Trieste."
 ita_dnc.1672.a: "Cede the provinces and end it."
 ita_dnc.1672.b: "Cede the coast as well."
 ita_dnc.1672.c: "Fight on."
 ita_dnc.1673.t: "The Armistice"
 ita_dnc.1673.d: "The Italian front has broken and our corps are down on the plain with the winter coming on behind them. The staff has drawn the terms it believes Rome will sign rather than lose Venetia.\n\nWe can take an indemnity, the Friuli, Venetia in pledge, or their fleet held down for a term of years."
 ita_dnc.1673.a: "An indemnity and the old frontier."
 ita_dnc.1673.b: "The Friuli."
 ita_dnc.1673.c: "Venetia in pledge."
 ita_dnc.1673.e: "Their fleet held down."
 ita_dnc.1674.t: "The Isonzo Is Settled"
 ita_dnc.1674.d: "The war on the Isonzo has ended with a peace signed at the front and the map redrawn to the watershed. Rome is stronger than she was and is nobody's junior partner now.\n\nWe can take note of it and open our door to her again, or guarantee what is left of Austria against her."
 ita_dnc.1674.a: "Open the door to Rome again."
 ita_dnc.1674.b: "Guarantee what is left of Austria."
 ita_dnc.1675.t: "Belgrade Claims Dalmatia"
 ita_dnc.1675.d: "The Dalmatian coast has passed from an empire to a kingdom that has never pretended it was Slav. Our claim was never renounced and the peace was signed without a word to us.\n\nWe can lodge the claim now and be heard, or say nothing and remember it."
 ita_dnc.1675.a: "Lodge the claim."
 ita_dnc.1675.b: "Say nothing."
 ita_dnc.1676.t: "The Form of the Kingdom"
 ita_dnc.1676.d: "The provinces are in, the fleet holds the upper sea and the associations are asking for a state that looks like the victory it won. The King is asked whether the ministry shall be theirs, or whether the forms of the Statuto are to be kept over it.\n\nHe reads the piazza and the Chamber before he answers."
 ita_dnc.1676.a: "The Greater Italy."
 ita_dnc.1676.b: "Keep the forms of the Statuto."
 ita_dnc.1677.t: "The Chamber Answers for the War"
 ita_dnc.1677.d: "The columns have come home without the provinces and the interpellations have been on the order paper since the armistice was read out. The old man from Piedmont has said nothing at all, which is how he speaks.\n\nThe Chamber can recall him, or keep the men who promised the war and lost it."
 ita_dnc.1677.a: "Recall the old man."
 ita_dnc.1677.b: "Keep the men who promised it."
 ita_dnc.1680.t: "Rome Proposes an Autonomous Albania Under a Prince"
 ita_dnc.1680.d: "The Italian ambassador proposes an autonomous Albania under a prince acceptable to Rome and guaranteed by her, and points to the highlands, which are in revolt again. He observes that the alternative is a coast taken rather than granted.\n\nThe Porte can grant the autonomy and keep the form of sovereignty, or refuse and hold what it can hold."
 ita_dnc.1680.a: "Grant the autonomy."
 ita_dnc.1680.b: "Refuse."
 ita_dnc.1681.t: "A Promise Asked of Us"
 ita_dnc.1681.d: "Cetinje asks for Scutari as the price of its friendship with the new principality, and asks for the promise in writing. The prince we are installing would hear of it within the week.\n\nWe can promise the city, or refuse and keep the principality whole."
 ita_dnc.1681.a: "Promise the city."
 ita_dnc.1681.b: "Refuse."
 ita_dnc.1682.t: "Scutari Is Asked For"
 ita_dnc.1682.d: "A principality has been raised on our southern border and it holds the city our army has camped in front of twice in living memory. The Italians made it and the Italians can move its frontier.\n\nWe can ask Rome for the city now, while she still wants our goodwill, or say nothing."
 ita_dnc.1682.a: "Ask for the city."
 ita_dnc.1682.b: "Say nothing."
 ita_dnc.1683.t: "The Monza Understanding Is Broken"
 ita_dnc.1683.d: "It was agreed at Monza that Albania should belong to neither of us, and Rome has now made it hers in everything but the name. The understanding is a dead letter and the Adriatic has an Italian shore on both sides of it.\n\nWe can demand a condominium over the principality, or accept the Italian primacy and keep the alliance."
 ita_dnc.1683.a: "Demand a condominium."
 ita_dnc.1683.b: "Accept the primacy."
 ita_dnc.1684.t: "Rome Offers a Subsidy and a Guarantee"
 ita_dnc.1684.d: "The Italian minister brings the subsidy, the works at the port and a guarantee of our frontiers, and asks for our foreign policy in exchange. The Queen of Italy is our King's daughter and the Italians have never once let us forget it.\n\nWe can take the guarantee, take the protectorate that comes wrapped in it, or ask Petersburg first."
 ita_dnc.1684.a: "Take the guarantee."
 ita_dnc.1684.b: "Take the protectorate."
 ita_dnc.1684.c: "Ask Petersburg first."
 ita_dnc.1687.t: "Petersburg Is Asked About Cetinje"
 ita_dnc.1687.d: "Cetinje asks whether our subsidy will continue if it takes the Italian one as well. The court there is ours by marriage and by habit, and the Adriatic is not a Russian sea.\n\nWe can cut the subsidy and let Rome pay for what she is buying, or accept her as a partner in the protection."
 ita_dnc.1687.a: "Cut the subsidy."
 ita_dnc.1687.b: "Accept a partner."
 ita_dnc.1688.t: "The Crown Across the Water"
 ita_dnc.1688.d: "The Albanian notables have asked for a prince of the House, and the Duke would take the viceroyalty tomorrow if the King allowed it. The Consulta warns that two crowns in one House are read abroad as one empire.\n\nThe King can accept the second crown, or leave the principality to the prince it already has."
 ita_dnc.1688.a: "Accept the crown."
 ita_dnc.1688.b: "Leave it to the prince it has."
 ita_dnc.1691.t: "The Prince Asks for Scutari"
 ita_dnc.1691.d: "The city promised to Cetinje is ours on every map the Italians themselves drew for us, and the promise was made in our name without us. The Italian resident says the promise is an old one and a small one.\n\nWe can protest and be told to be quiet, or accept it and ask for something else instead."
 ita_dnc.1691.a: "Protest."
 ita_dnc.1691.b: "Accept."
 ITADNC_v_the_modernists: "The Modernists and the State Chairs"
 ITADNC_v_the_modernists_desc: "The encyclical against modernism has named priests who teach in the universities this kingdom pays for, and the Secretariat asks that they be struck off. We must decide whether the ministry clears the faculties for the Church or defends the chairs it appoints to."
 ITADNC_v_the_annuity_and_the_palaces: "The Annuity and the Palaces"
 ITADNC_v_the_annuity_and_the_palaces_desc: "The endowment voted to the Pope has never been drawn and the palaces beyond the river are held by a sovereign who calls himself a prisoner. We shall put the arrears and the Leonine palaces on the table and ask the Vatican whether there is a sovereignty it would accept."
 ITADNC_v_vienna_mediates: "Vienna Mediates"
 ITADNC_v_vienna_mediates_desc: "The Holy See will hear the Catholic court that has spoken for it since the breach, and it will not hear the Quirinal at all. We shall ask Vienna to carry our word across the river, and learn what the Ballhausplatz charges for the errand."
 ITADNC_v_the_king_who_is_not_visited: "The King Who Is Not Visited"
 ITADNC_v_the_king_who_is_not_visited_desc: "No Catholic sovereign will call upon our King in a palace taken from the Papacy, and every court in Europe has kept that rule since the breach. We shall invite the King of Spain, and open the subsidised line between our coasts that would carry him and the commercial convention together."
 ITADNC_v_the_deputies_of_the_union: "The Deputies of the Union"
 ITADNC_v_the_deputies_of_the_union_desc: "The electoral Union can deliver the parishes of the north, and its president wants his pledges signed before the writs go out. We shall go to the country and settle with the Union what its deputies owe this ministry."
 ITADNC_v_the_king_and_the_pope: "The King and the Pope"
 ITADNC_v_the_king_and_the_pope_desc: "Nothing can be signed with the Vatican while the King refuses to be seen bending towards it, and he calls the whole business a kneeling. We must ask the Quirinal for a meeting arranged through a cardinal, and learn whether the Crown stands with the ministry or against it."
 ITADNC_v_the_conciliation: "The Conciliation"
 ITADNC_v_the_conciliation_desc: "The Roman Question has stood open since the breach and the terms have never changed: a real sovereignty over the Leonine quarter, the endowment paid, a concordat to follow. We shall lay those terms before the Vatican and ask the Pope to sign them. What we give up is the quarter beyond the river and every claim this kingdom keeps upon the lands of the Popes."
 ITADNC_v_the_emperors_visit: "The Emperor's Visit"
 ITADNC_v_the_emperors_visit_desc: "The old Emperor could not come to our capital while the Pope called himself a prisoner, and that reason is gone. We shall invite him now, and let Vienna and Berlin say what the alliance is worth once the Roman Question is closed."
 ITADNC_v_the_ministry_of_the_union: "The Ministry of the Union"
 ITADNC_v_the_ministry_of_the_union_desc: "The Catholic deputies are numerous enough to make a ministry, and the Crown must be told whose ministry it will be. We shall ask the Quirinal to call the Union, and govern this kingdom with the men of the pew."
 ITADNC_v_the_third_rome: "The Third Rome"
 ITADNC_v_the_third_rome_desc: "The anticlerical bloc holds the Capitol, the processions hold the streets, and the church policy has bought this ministry nothing it can show the Chamber. We must let Montecitorio decide whether the ministry stands or the old man is called back."
 ITADNC_v_the_league_is_excommunicated: "The League Is Excommunicated"
 ITADNC_v_the_league_is_excommunicated_desc: "The priest who founded the democratic league has been struck with the greater excommunication, and his deputies still sit with our majority. We must decide whether the ministry keeps him or hands him back to the discipline of the Vatican."
 ita_dnc.2048.t: "The Chairs of the State"
 ita_dnc.2048.d: "The encyclical has named the modernist teachers, and the Secretariat asks that they be struck from the faculties this kingdom pays for. The rectors answer that a state chair is not a seminary and that they will not be purged on an order carried across the river.\n\nThe ministry can clear the faculties and buy the goodwill of the Vatican, or stand on the freedom of the universities and pay for that instead."
 ita_dnc.2048.a: "Withdraw the modernist priests from the state chairs."
 ita_dnc.2048.b: "The chairs of the state are not the Church's to fill."
 ita_dnc.2052.t: "The Annuity and the Palaces"
 ita_dnc.2052.d: "Our intermediary has carried the terms across the river: the arrears paid, the Leonine palaces held in a sovereignty the law would recognise, a concordat to follow. The Secretary of State has read them without closing the door and without opening it.\n\nThe Pope must now say whether there is anything here worth negotiating, or whether the Prisoner intends to remain one."
 ita_dnc.2052.a: "The Holy See will negotiate."
 ita_dnc.2052.b: "The Prisoner has nothing to negotiate."
 ita_dnc.2052.c: "Ask for a corridor to the sea."
 ita_dnc.2054.t: "The Corridor to the Sea"
 ita_dnc.2054.d: "The Vatican will treat, and asks for a strip of land running from the palaces down to the shore, so that a sovereign Pope may leave his own state without crossing ours. The Consulta says the strip is worth nothing and would cost us the quarrel of a province.\n\nThe lodges will call it a partition of the capital, and they will not be entirely wrong."
 ita_dnc.2054.a: "Grant the corridor, and open the talks."
 ita_dnc.2054.b: "There will be no corridor."
 ita_dnc.2055.t: "Rome and the Vatican Talk"
 ita_dnc.2055.d: "The Italian ministry and the Secretariat of State are talking through an intermediary that neither side admits to employing. The terms are the old ones: the arrears, the palaces, a sovereignty small enough to be granted and large enough to be called real.\n\nThe courts that have made a policy out of the Roman Question must decide what to say about it."
 ita_dnc.2055.a: "Offer the good offices of the Ballhausplatz."
 ita_dnc.2055.b: "The Roman Question is not our affair."
 ita_dnc.2055.c: "Protest to the Holy See."
 ita_dnc.2055.e: "A Pope less Austrian is worth having."
 ita_dnc.2056.t: "Rome Asks Vienna to Carry a Word to the Vatican"
 ita_dnc.2056.d: "The Italian ambassador asks us to carry across the river a message the Quirinal is not allowed to carry itself. It is the oldest service this court renders the Holy See, and it would put the settlement of the Roman Question in our hands.\n\nOur envoy at the Vatican says the errand is cheap and the credit large. The staff asks what Rome is prepared to pay for it."
 ita_dnc.2056.a: "Carry the word to the Vatican."
 ita_dnc.2056.b: "Vienna does not touch the Roman Question."
 ita_dnc.2056.c: "Name the price: the claims on the Trentino go into a drawer."
 ita_dnc.2057.t: "The Word Is Carried"
 ita_dnc.2057.d: "The Austrian ambassador has been received at the Vatican and has spoken for us, which is more than our own envoy has ever been permitted to do. The Secretariat answered him, and the answer was not a refusal.\n\nThe channel is open, and it is not ours."
 ita_dnc.2057.a: "Open is open."
 ita_dnc.2058.t: "The Price of the Word"
 ita_dnc.2058.d: "Vienna will carry our word across the river and names its price: the claims this kingdom keeps upon the Trentino and the coast are to go into a drawer, in writing. The Consulta says the irredentist press will make a scandal of it within the week.\n\nThe Church would be reached, and the frontier would not be raised again in this reign."
 ita_dnc.2058.a: "Put the claims in a drawer."
 ita_dnc.2058.b: "We will not pay that for a message."
 ita_dnc.2059.t: "The Word Is Not Carried"
 ita_dnc.2059.d: "The answer is that the Roman Question is a matter between this kingdom and the Holy See, and that no third court will carry anything across the river for us. Our envoy is left where he began, without a channel and without a friend in the Secretariat.\n\nThe ministry will have to find another door."
 ita_dnc.2059.a: "Then we find another door."
 ita_dnc.2060.t: "Rome Invites the King of Spain"
 ita_dnc.2060.d: "The Quirinal invites our King to the Italian capital, and asks that he come as a Catholic sovereign rather than as a stranger. No Catholic crown has called there since the Popes lost the city, and the Vatican will read the visit as a verdict.\n\nA commercial convention and a subsidised line between our ports have been drawn up to travel with him."
 ita_dnc.2060.a: "Go, and sign the convention."
 ita_dnc.2060.b: "The King of Spain does not call at the Quirinal."
 ita_dnc.2061.t: "The Line Sails Without a Treaty"
 ita_dnc.2061.d: "Madrid has declined in the courteous form that means the Vatican was consulted first. The subsidised line between the two coasts will open regardless, because the shipowners have already been paid to open it.\n\nWhat we do not have is the convention, or the visit."
 ita_dnc.2061.a: "The ships sail; the King does not."
 ita_dnc.2062.t: "The Curia Reads the Visit"
 ita_dnc.2062.d: "A Catholic king has been received in the palace taken from the Popes and has not crossed the river afterwards. The Secretariat can protest, as it has protested every such visit since the breach, or it can say nothing and let the silence be noticed.\n\nThe parish press is waiting to be told which."
 ita_dnc.2062.a: "Protest, as we have always protested."
 ita_dnc.2062.b: "Say nothing this time."
 ita_dnc.2064.t: "The Deputies of the Union"
 ita_dnc.2064.d: "The electoral Union can carry the parishes of the north, and its president has come to the ministry with a list of pledges he wants signed before the writs go out. He can endorse our candidates on those terms, or he can run his own men and hold the balance himself.\n\nThe country votes either way, and the bishops will tell it how."
 ita_dnc.2064.a: "Endorse our candidates, and take the pledges."
 ita_dnc.2064.b: "The Union will send its own men."
 ita_dnc.2068.t: "The King Will Not Kneel"
 ita_dnc.2068.d: "A meeting with the Pope has been proposed through a cardinal, in a form that spares both sovereigns the appearance of calling upon the other. The King has read the proposal and calls it a kneeling.\n\nThe Crown can give the ministry the meeting the whole policy rests on, or refuse it and leave the Secretariat to draw its own conclusion."
 ita_dnc.2068.a: "The Crown consents to the meeting."
 ita_dnc.2068.b: "The King of Italy kneels to no one."
 ita_dnc.2072.t: "The Holy See Answers"
 ita_dnc.2072.d: "The instrument is drawn: a real sovereignty over the quarter beyond the river, the arrears paid, a concordat to follow, and this kingdom's guarantee upon the whole. The Secretary of State has argued against it in every audience and the Pope has not sent him away.\n\nEverything this ministry has done since the ban was lifted turns on the next word out of the Vatican."
 ita_dnc.2072.a: "The Pope signs."
 ita_dnc.2072.b: "The Prisoner remains."
 ita_dnc.2072.c: "Ask for the whole Leonine quarter and the corridor."
 ita_dnc.2073.t: "The Leonine Quarter and the Corridor"
 ita_dnc.2073.d: "The Pope will sign, and asks for the whole Leonine quarter with a way down to the sea, and the arrears paid in full rather than in instalments. The Treasury says the arrears alone will empty this ministry's credit for a year.\n\nThe Chamber will vote it, if the ministry survives asking."
 ita_dnc.2073.a: "Pay it, and let him sign."
 ita_dnc.2073.b: "That is not a treaty, it is a ransom."
 ita_dnc.2074.t: "The Vatican Signs with the Quirinal"
 ita_dnc.2074.d: "The Roman Question is closed. The Pope has a state again, small enough to walk across and sovereign in law, and the Italians have guaranteed it themselves.\n\nEvery court that has made a policy out of the Prisoner of the Vatican must now say what it thinks of a Pope who is free."
 ita_dnc.2074.a: "Salute the settlement, and accredit to both courts."
 ita_dnc.2074.b: "The Question is closed when the Pope says so twice."
 ita_dnc.2074.c: "The Centre applauds, and so shall we."
 ita_dnc.2074.e: "A free Pope is a Pope that Paris will court."
 ita_dnc.2075.t: "The Vatican Is a State"
 ita_dnc.2075.d: "The Italians have made the Pope a sovereign again, on a hill above their own capital, and they have done it without asking us. The Republic broke with the Holy See and sent its ambassador home; it now watches another power take the place it left.\n\nThe Quai d'Orsay asks whether this is an injury or merely a curiosity."
 ita_dnc.2075.a: "It is an injury."
 ita_dnc.2075.b: "Let them keep him."
 ita_dnc.2076.t: "Rome Invites the Emperor Now That the Vatican Is Free"
 ita_dnc.2076.d: "The invitation this court has refused for a generation has come again, and the reason for refusing it is gone: the Pope is a sovereign in his own state and receives whom he pleases. The Emperor could call at the Italian court and at the Vatican in the same week without slighting either.\n\nThe Holy See would still have to consent, and it has not been asked."
 ita_dnc.2076.a: "Accept, if the Holy See consents."
 ita_dnc.2076.b: "The Emperor does not travel."
 ita_dnc.2077.t: "The Visit Is Not Made"
 ita_dnc.2077.d: "The answer is a courtesy and a refusal. The reasons given are the age of the Emperor and the season, which is what a court says when it means something else.\n\nThe alliance is what it was, and no more than it was."
 ita_dnc.2077.a: "Then it is what it was."
 ita_dnc.2078.t: "The Holy See Is Asked"
 ita_dnc.2078.d: "The Kingdom asks whether we would receive the Emperor during his visit to the Italian court. To consent is to admit, before every Catholic power, that the quarrel is over.\n\nTo refuse is to keep a grievance we have already traded away, and to keep it in public."
 ita_dnc.2078.a: "Receive him. The quarrel is over."
 ita_dnc.2078.b: "Not yet."
 ita_dnc.2079.t: "The Emperor Goes to Rome"
 ita_dnc.2079.d: "The Austrian Emperor will be received at the Italian court and at the Vatican in the same week, and the alliance suddenly looks like something more than a signature. The Chancellor is asked whether the third partner should be brought properly inside.\n\nThe Centre would vote for it tomorrow, and say the Pope had asked them to."
 ita_dnc.2079.a: "Bring them inside the alliance."
 ita_dnc.2079.b: "The signature is enough."
 ita_dnc.2080.t: "The Ministry of the Union"
 ita_dnc.2080.d: "The Catholic deputies hold the balance of the Chamber, and the Crown must name a President of the Council who can command it. The King may call the president of the Union and let a Catholic party govern this kingdom, or keep a liberal at the head and let the Union hold him up from the benches.\n\nEither way the men of the pew have arrived, and the lodges know it."
 ita_dnc.2080.a: "Call the president of the Union."
 ita_dnc.2080.b: "A liberal ministry, with the Union behind it."
 ita_dnc.2081.t: "The Ministry Is Called to Answer"
 ita_dnc.2081.d: "The anticlerical bloc has the Capitol and the streets, and the church policy has come back with nothing this ministry can show the Chamber. The benches want the old man recalled, and the old man is willing.\n\nThe ministry can go, or it can govern without the Catholics and without a majority."
 ita_dnc.2081.a: "Call the old man back."
 ita_dnc.2081.b: "The ministry stands without them."
 ita_dnc.2084.t: "The League Is Excommunicated"
 ita_dnc.2084.d: "The priest who founded the democratic league has been struck with the greater excommunication, and his deputies still vote with our majority. To keep him is to make this ministry the protector of a condemned man and to lose the Secretariat for good.\n\nTo drop him is to hand the Vatican a discipline over our own benches, and to admit that it has one."
 ita_dnc.2084.a: "The ministry keeps him."
 ita_dnc.2084.b: "The ministry lets him go."
 ita_dnc.2088.t: "The Pope Blesses the Kingdom"
 ita_dnc.2088.d: "The instrument is signed, the guard at the gate has been changed, and for the first time since the breach a Pope may speak of the Kingdom without a grievance attached to the sentence. The blessing from the balcony is heard in every parish of the peninsula.\n\nIt costs nothing, and it is worth a great deal."
 ita_dnc.2088.a: "Bless the Kingdom and its King."
 ita_dnc.2089.t: "The Crusade of Tripoli"
 ita_dnc.2089.d: "The Kingdom is at war with the Porte, and its bishops are blessing the transports without waiting to be told to. Our friars and our schools in the Levant are hostages to whatever the Turks decide to do in reprisal.\n\nThe Holy See can call the expedition what the crowds are already calling it, or stand above the quarrel as it has stood above every war."
 ita_dnc.2089.a: "Bless the expedition."
 ita_dnc.2089.b: "The Holy See stands above the quarrel."
 ita_dnc.2090.t: "The Holy See Is Asked for the Concordat"
 ita_dnc.2090.d: "The treaty gave us a state; the concordat would give us the schools, the marriages and the naming of bishops throughout the Kingdom. The draft is on the table and the Secretariat has stopped objecting to the preamble.\n\nSigning binds the Church to a settlement it could otherwise still disown."
 ita_dnc.2090.a: "Sign the concordat."
 ita_dnc.2090.b: "Let it wait."
 ita_dnc.2091.t: "The Roman Chancery"
 ita_dnc.2091.d: "The Secretariat keeps its files and waits."
 ita_dnc.2091.a: "Continue."
