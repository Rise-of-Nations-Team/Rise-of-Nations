 ITA_air_dr_the_command_of_the_air: "The Command of the Air"
 ITA_g_tt_the_reading_is_refused: "The reading is declined, and the papers of the Nile stay where they were."
 ITA_z_tt_the_syndicalists_refuse: "The chambers of labour will not sign, and the offer is left on the table."
 ITA_z_tt_the_soil_decides: "The children born on this soil belong to it, and the consulates say so."
 ITA_g_tt_stringher_takes_the_bank: "Bonaldo Stringher is available to the ministry as an adviser."
 ITA_wr_threat_the_islands: "Italy holds the islands as a pledge"
 ITA_tt_the_piazza_opens: "§YThe Piazza§! opens: what the prefects report from the squares, kept as one figure that runs from calm to boiling. It weighs on stability and on the factories, and every capital reads it before it answers us."
 ITA_tt_the_chamber_opens: "§YThe Chamber§! opens: the majority the ministry can count on, assembled deputy by deputy, from none to made. It weighs on political power and on stability, and the King and the Porte read it before they decide."
 ITA_tt_the_crown_opens: "§YThe Crown§! opens: how much of this kingdom the King believes is his, from a King who listens to a King who governs. It weighs on political power and on stability, and Berlin and Vienna read it before they trust us."
 ita_dnc.2103.t: "The Gymnasts at Monza"
 ita_dnc.2103.d: "The King had reviewed the gymnasts and raised his hand to the crowd when Bresci fired at four paces. The assassin makes no attempt to run and tells the carabinieri that he paid his own passage back from Paterson, and that he was answering for the dead of Milan."
 ita_dnc.2103.a: "Bresci does not miss."
 ita_dnc.2103.b: "Bresci misses, and the King rides on."
 ITA_dnc_air_sc: "Air Force"
 ITA_dnc_consulta_sc: "The Consulta"
 ITA_dnc_historical_sc: "The Works on the Frontier"
 ITA_dnc_uchronia_a_sc: "The Chamber Broken"
 ITA_dnc_uchronia_b_sc: "The Army Will Not Fire"
 ITA_h_the_open_frontier: "The Open Frontier"
 ITA_h_the_open_frontier_desc: "The treaty with Vienna forbids works on the passes above the Piave, and the ridges stand as our grandfathers left them. Our engineers may not build there, and every chancery in Europe reads an open frontier as an invitation."
 ITA_e_the_rendita: "The Service of the Debt"
 ITA_e_the_rendita_desc: "The interest on the debt of the Risorgimento falls due whether the harvest comes in or not, and the Treasury borrows each year to pay what it borrowed the year before.\n\nThe service of the debt: §Y[?ITA_e_rendita|%0]§! of the revenue.\n\nAt the whole of it the mills and the slipways lose a fifth of their yield."
 ITA_tt_the_rendita_opens: "§YThe Service of the Debt§! opens: the interest the Risorgimento left us, which grows every month on its own and which only the budget can push back. It weighs on the mills and on the slipways, and it never waits for us."
 ITA_h_tt_the_crown_is_humbled: "§RThe Crown has been made to give way in public.§! The reckoning of the reign now stands at §Y[?ITA_h_crown_blunders|0]§!, and the first rung of the ladder stays shut while the retreat is remembered."
 ITA_u_tt_a_court_accepts: "One more court of the far shore has put itself under our word. §YThe courts that trust us§!: §Y[?ITA_u_credit|0]§!."
