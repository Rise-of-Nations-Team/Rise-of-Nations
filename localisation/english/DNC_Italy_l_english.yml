 ALB_PRINCIPALITY_neutrality: "Principality of Albania"
 ALB_PRINCIPALITY_neutrality_DEF: "the Principality of Albania"
 ALB_PRINCIPALITY_neutrality_ADJ: "Albanian"
 ITA_g_the_wine_duties_fall: "The Duties on Wine Fall"
 ITA_g_the_wine_duties_fall_desc: "The tariff war with Paris is over, and the vineyards of the south sell across the mountains again. Living costs less at home, and the ministry is thanked for it."
 ITA_g_the_corn_duty_kept: "The Duty on Foreign Corn"
 ITA_g_the_corn_duty_kept_desc: "The landlords of the south keep their tariff on foreign corn, and the obstruction in the Chamber ends. Bread stays dear in the northern cities, and living costs more."
 ITA_dnc_consulta_cat_desc: "The Consulta is our foreign ministry. §YConfidence at Vienna§!: §Y[?ITA_vienna_trust|0]§!. Our notes, our treaties and every quarrel on the frontier move it."
 ITA_GRE: "Greater Italy"
 ITA_GRE_DEF: "Greater Italy"
 ITA_GRE_ADJ: "Italian"
 ITA_GRE_democratic: "Greater Italy"
 ITA_GRE_democratic_DEF: "Greater Italy"
 ITA_GRE_democratic_ADJ: "Italian"
 ITA_GRE_neutrality: "Greater Italy"
 ITA_GRE_neutrality_DEF: "Greater Italy"
 ITA_GRE_neutrality_ADJ: "Italian"
 ITA_GRE_fascism: "Greater Italy"
 ITA_GRE_fascism_DEF: "Greater Italy"
 ITA_GRE_fascism_ADJ: "Italian"
 ITA_GRE_communism: "Greater Italy"
 ITA_GRE_communism_DEF: "Greater Italy"
 ITA_GRE_communism_ADJ: "Italian"
 ITA_dnc_consulta_cat: "The Consulta"
 ITA_w_the_note_to_vienna: "Send a Note to Vienna"
 ITA_w_the_note_to_vienna_desc: "A polite and entirely empty note to Vienna, saying again that the alliance holds. It costs us nothing but paper, and it buys another season of Austrian patience."
 ITA_dec_dissolve_tt: "The election is held, and our majority is worked out again from the returns"
 ITA_dec_special_laws_tt: "Another province gets the special terms, and the North takes it out of our majority"
 ITA_dec_note_to_vienna_tt: "Confidence at Vienna rises, and the ally thinks better of us"
 ITA_dec_denunciation_tt: "The Triple Alliance is denounced, and confidence at Vienna goes to nothing"
 ITA_dnc_political_sc: "Political"
 ITA_dnc_diplomacy_sc: "Diplomacy"
 ITA_dnc_army_sc: "Army"
 ITA_dnc_navy_sc: "Navy"
 ITA_dnc_economy_sc: "Economy"
 ITA_dnc_airforce_sc: "Air Force"
 ITA_t_a_great_power_on_paper: "A Great Power on Paper"
 ITA_t_a_great_power_on_paper_desc: "We sit at the congresses because Cavour won us the seat, and we are asked for our opinion politely. Our offices work, our railways run, and the seat at the table is real. Our industry is not: we make a fraction of the steel the others make, and every foreign ministry in Europe knows the figure."
 ITA_t_the_current_from_the_alps: "Power from the Alps"
 ITA_t_the_current_from_the_alps_desc: "We have no coal of our own, so we are damming the rivers. The plant at Paderno on the Adda is working, the Ticino is next, and the line carries the power into Milan. It will not run a shipyard or roll armour plate. It does build roads and new works faster than coal ever allowed."
 ITA_t_the_gentiloni_understanding: "The Understanding with the Church"
 ITA_t_the_gentiloni_understanding_desc: "Nothing is signed and nothing is announced. The parish clergy have a list of candidates they may recommend, and we have given a promise about the schools that nobody will put in writing. The Catholic vote comes in for us, and we now owe a party that does not admit it exists."
 ITA_t_the_black_year: "The Year of Mourning"
 ITA_t_the_black_year_desc: "The King is dead. The court is in mourning, the Chamber is adjourned, and every prefect in the kingdom is arresting somebody. Trade has stopped, first out of decency and then out of fear. The country will forgive a new king a great deal in his first 12 months, and it will remember what he did with them."
 ITA_t_the_oath_of_the_new_reign: "The New King's Oath"
 ITA_t_the_oath_of_the_new_reign_desc: "The new King has sworn to the Statuto, the kingdom's constitution, in the words his grandfather used. Unlike his father, he acts as though the oath binds him. The ministry answers to the Chamber, and the King does not send for a general when the Chamber is inconvenient."
 ITA_t_the_state_stands_aside: "The State Stays Out of Strikes"
 ITA_t_the_state_stands_aside_desc: "Giolitti holds that a strike is a quarrel between two private parties, and that the government is not one of them. The troops stay in barracks, and the unions bargain instead of marching. Wages rise and the mills keep running. The country is noisier for it, and the prefects say so every week."
 ITA_t_the_arbitration_boards: "The Arbitration Boards"
 ITA_t_the_arbitration_boards_desc: "A magistrate, an employer and a union delegate sit down together in every industrial province. The prefect keeps his decree in the drawer while they talk. Nothing is settled quickly and nobody is satisfied, but the port keeps working and nobody has been shot in the street this year."
 ITA_t_messina_relief: "The Messina Relief"
 ITA_t_messina_relief_desc: "Two cities have to be cleared by hand. 90,000 people are under canvas, and they will be there for two winters.\n\nEvery engineer, every sapper and every ton of cement is going south. Nothing else that was to be built this year is being built, and the relief credit comes back to the Chamber every spring."
 ITA_t_the_army_rebuilt: "The Army Rebuilt"
 ITA_t_the_army_rebuilt_desc: "The classes are called up in full and kept long enough to learn the trade. The batteries fire live rounds instead of drawing them and putting them back. The staff college has stopped promoting on seniority alone. It is expensive, and it is what we owe the men left at Adwa."
 ITA_t_the_cheaper_empire: "The Empire by Sea"
 ITA_t_the_cheaper_empire_desc: "A colony inland has to be held with divisions. A colony on a coast is held with a squadron and a coaling station. The navy wants the money spent on ships and harbours, and it is winning the argument. The army knows what that means for its own estimates."
 ITA_t_no_more_africa: "No More Africa"
 ITA_t_no_more_africa_desc: "The Eritrean garrison is cut to a guard. The concession companies are told to find their own investors. The money goes instead to aqueducts, schools and the line over the Apennines. The papers call it a surrender, and the war party has not forgiven us."
 ITA_t_prefects_tt: "§Y40 of the 90 prefectures§! can be relied on to return a government majority."
 ITA_tb_the_kingdom: "The Kingdom of Italy"
 ITA_tb_the_alpine_current: "Power from the Alps"
 ITA_tb_the_seismic_code: "The Messina Building Code"
 ITA_tb_the_road_from_adwa: "After Adwa"
 ITA_a_the_kings_first_ministry: "The King's First Ministry"
 ITA_a_the_kings_first_ministry_desc: "The new King is 30 and was raised to distrust his father's advisers. The cabinet does not yet know which of them he will keep. Nothing is settled, and every minister is waiting to be told where he stands."
 ITA_a_the_neutral_state: "The Neutral State"
 ITA_a_the_neutral_state_desc: "We have taken the government out of the quarrel between the mill and the men. A strike is now counted rather than charged, and a fortnight of lost production buys us a decade without a barricade. The army is not pleased to be told it has no part in this."
 ITA_a_torniamo_allo_statuto: "Return to the Charter"
 ITA_a_torniamo_allo_statuto_desc: "The ministry rests on the Crown and says so plainly. Nothing has to be bargained twice, and business moves faster than it has in 20 years. Every faction now understands that the road back to office runs through the Quirinal, the King's palace, and not through the Chamber."
 ITA_a_the_reformist_understanding: "The Deal with the Reformists"
 ITA_a_the_reformist_understanding_desc: "The Socialists have agreed to keep a liberal ministry alive. The price is in every estimate: shorter hours, the Sunday rest, and inspectors who actually walk into the sheds. The maximalists, the party's hard wing, call it a betrayal and are recruiting on it."
 ITA_a_the_prefects_circular: "The Circular to the Prefects"
 ITA_a_the_prefects_circular_desc: "Every province has a man who knows what the returns are to say, and Rome keeps a note of what he was told. The estimates pass, the majority holds, and the kingdom is a little less of a democracy each time we use it.\n\nProvinces instructed: §Y[?ITA_prefects|0]§! of 100."
 ITA_a_the_state_takes_no_side: "The Boards Settle It"
 ITA_a_the_state_takes_no_side_desc: "The arbitration boards sit in Genoa, Turin and Milan. The prefect attends as a clerk and not as a commander. Disputes end in a signature instead of a funeral, and the three cities can plan a year ahead for the first time."
 ITA_a_the_decrees_of_public_safety: "The Decrees of Public Safety"
 ITA_a_the_decrees_of_public_safety_desc: "We dissolve associations by order, forbid meetings and seize the presses before the ink is dry. The country has learned that a law it never voted can reach it. The men who used to argue in the Chamber now argue where we cannot hear them."
 ITA_a_the_kings_prerogative: "The King's Prerogative"
 ITA_a_the_kings_prerogative_desc: "Ministers are made and unmade at the Quirinal, the King's palace, and the Chamber is told afterwards. It is exactly what the Statuto, the kingdom's constitution, allows. Every ambition in Rome has quietly turned away from the voters and towards the King."
 ITA_a_the_widened_franchise: "The Widened Franchise"
 ITA_a_the_widened_franchise_desc: "The registers were built for 2 million names and now carry 8 million. A village that its mayor used to deliver has to be argued with. The parties must learn to speak to men who cannot read a programme. Nobody in Rome can predict a seat any more."
 ITA_a_the_reformists_at_the_door: "The Reformists Stay Outside"
 ITA_a_the_reformists_at_the_door_desc: "They vote with us and refuse our portfolios. That lets them claim the labour laws and disown the budget. It suits both sides, and while it lasts the hard wing of their party gets nowhere."
 ITA_a_the_special_laws_of_the_south: "The Special Laws of the South"
 ITA_a_the_special_laws_of_the_south_desc: "For the first time the law admits that the South is a different problem and not simply a poorer North. Aqueducts, roads and cheap power are written into the statute book and charged to the northern taxpayer. The gap closes slowly, and the bills come back to the Chamber every year."
 ITA_a_the_labour_office: "The Labour Office"
 ITA_a_the_labour_office_desc: "The employers' federation and the chambers of labour, the local trade union offices, now argue in one room in Rome with a stenographer taking it down. They rarely agree, but each side leaves knowing what the other will do, and the mills can plan on it."
 ITA_a_government_by_decree: "Government by Decree"
 ITA_a_government_by_decree_desc: "The estimates pass, the ministry is never beaten, and the Chamber sits and watches. We can do anything we like and answer for none of it. The country is quieter than it is content, and one bad harvest will show the difference."
 ITA_a_the_state_of_siege: "The State of Siege"
 ITA_a_the_state_of_siege_desc: "Troops answer a prefect's telegram without waiting for Rome. The officers who put down the last rising have been promoted for it. Order is cheap and quick. We are paying for it by treating every strike as a rebellion, and the working quarters have noticed."
 ITA_a_the_duty_lifted: "The Grain Duty Lifted"
 ITA_a_the_duty_lifted_desc: "Bread and salt are cheaper than they have been since unification. A labourer in the South keeps a fortnight of wages a year that used to go to the Treasury. The landowners of the Po valley have lost their tariff, and they have not forgiven us."
 ITA_a_a_socialist_in_the_ministry: "A Socialist in the Ministry"
 ITA_a_a_socialist_in_the_ministry_desc: "A man this government has arrested now sits in its cabinet. The factories are quieter than they have been in 10 years. The officer corps takes the appointment as an insult, and the party that sent him is tearing itself apart over it."
 ITA_a_the_catholic_vote: "The Catholic Vote"
 ITA_a_the_catholic_vote_desc: "A third of the country has been let back into the polling booth, and it has voted for order. No document exists and no bishop will confirm it. We have gained a bench of deputies who answer to their parish priest before they answer to us."
 ITA_a_the_ban_holds: "The Pope's Ban Holds"
 ITA_a_the_ban_holds_desc: "The Vatican keeps the faithful out of the polling booth and organised in everything else. The rural banks lend where the state does not. The leagues feed where the prefecture cannot, and the countryside has learned to manage without us."
 ITA_a_the_south_bought: "Roads for Votes"
 ITA_a_the_south_bought_desc: "We are building roads, aqueducts, a harbour and a railway that was promised two generations ago. It is patronage, and it is also the first real building the South has ever been given. The deputies who vote our estimates come from those provinces."
 ITA_a_the_south_policed: "The South Policed"
 ITA_a_the_south_policed_desc: "We have built Carabinieri stations where the schools were to have gone. The countryside is quiet and the great estates are worked. Nothing else has changed, and the ships out of Naples are fuller every year."
 ITA_a_the_south_schooled: "Schools for the South"
 ITA_a_the_south_schooled_desc: "Elementary schools have been taken from communes that could not pay for them and put on the national estimate. Nothing will show for 15 years. After that it shows in everything, which is why no ministry before us would pay for it."
 ITA_a_the_majority_that_governs: "The Majority That Governs"
 ITA_a_the_majority_that_governs_desc: "The Chamber can be counted before it is asked. Whatever it was built out of, it is now the instrument the kingdom is governed with, and we have stopped pretending it assembled itself."
 ITA_a_the_giolittian_system: "The Giolittian System"
 ITA_a_the_giolittian_system_desc: "Every opposition is bought into the majority before it can become one. The government stays out of the quarrels it cannot win. Turin, Milan and Genoa are growing faster than anyone thought they could. The critics call it a dictatorship of the Interior, and they are not entirely wrong."
 ITA_a_the_statuto_restored: "The Charter Restored"
 ITA_a_the_statuto_restored_desc: "The kingdom is governed as the Statuto, its constitution, says it should be. The King chooses and the Chamber assents. Decisions are quick and the army is content. Everything now rests on the judgement of one man, and he is new to the throne."
 ITA_a_the_popular_bloc: "The Popular Bloc"
 ITA_a_the_popular_bloc_desc: "Liberals, radicals and reformist socialists sit in one majority, held together by the wider vote and the labour laws. The country is calmer than it was and the mills give up a share of their profit for it. The officers write to each other asking what the Bloc would do in a war."
 ITA_a_tittoni_at_the_interior: "Tittoni at the Interior"
 ITA_a_tittoni_at_the_interior_desc: "He was a prefect before he was a minister, and he never stopped thinking like one. He knows every province by the name of the man who delivers it."
 ITA_a_carcano_at_the_treasury: "Carcano at the Treasury"
 ITA_a_carcano_at_the_treasury_desc: "He balanced Pelloux's books while the Chamber was shouting, and he will balance anyone's. He has never once asked where a majority came from."
 ITA_a_pelloux_at_the_interior: "Pelloux at the Interior"
 ITA_a_pelloux_at_the_interior_desc: "The King wanted the decrees signed by a soldier, so he gave the Interior to a general. He signed them, lost the Chamber, and has been waiting ever since to be told he was right."
 ITA_a_bonomi_in_the_ministry: "Bonomi in the Ministry"
 ITA_a_bonomi_in_the_ministry_desc: "He argues that a party which never governs never changes anything. His own party congress is preparing to expel him for saying it out loud."
 ITA_tb_the_new_reign: "The New Reign"
 ITA_tb_the_neutral_state: "The Neutral State"
 ITA_tb_the_arbitration_boards: "The Arbitration Boards"
 ITA_tb_the_basilicata_law: "The Basilicata Law"
 ITA_tb_the_labour_office: "The Labour Office"
 ITA_tb_the_grain_duty: "The Grain Duty"
 ITA_tb_the_rural_banks: "The Rural Banks"
 ITA_a_three_answers_tt: "§YThe Chamber has three answers, and choosing one closes the other two:§! the §Gneutral state§! of Giolitti, the §Rreturn to the Statuto§! of Sonnino, or the §Bhand offered to Turati§!."
 ITA_a_prefects_counted_tt: "Provinces instructed: §Y[?ITA_prefects|0]§! of 100."
 ITA_a_the_maximalists_win_tt: "§RThe hard wing has taken the party congress.§! It sends its own secretary into the ministry, and he is no friend of ours."
 ITA_a_the_reformists_hold_tt: "§GThe reformists still hold the party.§! The portfolio is taken by a man who wants the arrangement to last."
 ITA_a_two_answers_from_rome_tt: "§YThe Vatican will answer in one of two ways:§! the §Gchurches let the faithful vote§!, or the §Rban holds§! and they stay away from the polls."
 ITA_a_two_blocs_one_ballot_tt: "§RThe Popular Bloc and the parish priest are on the same ballot paper.§! Nobody has explained to either of them how that is to work."
 ITA_a_the_right_finds_a_reserve_tt: "§GThe Right gains a reserve of votes it did not have to pay for.§! It owes the Church for them."
 ITA_a_the_prefect_finds_a_curate_tt: "§GThe prefect now has a curate in every commune he could not otherwise reach.§!"
 ITA_dnc_the_two_italies: "North and South"
 ITA_dnc_the_two_italies_desc: "On the map we are a great power. Underneath it we are a poor farming country. The North reads and the South does not. The young leave and the old stay, and Rome is the last to hear of either."
 ITA_dnc_the_kingdom_made_whole: "The Kingdom Made Whole"
 ITA_dnc_the_kingdom_made_whole_desc: "The distance between the two Italies is still there, but it is being measured, argued over and paid down. The South sends fewer people to the ships and more to the mills. We can govern the kingdom as one country now, and the estimates show it."
 ITA_dnc_white_coal: "The Alpine Power Stations"
 ITA_dnc_white_coal_desc: "The Alpine plants have begun to feed Turin, Milan and Genoa. Every unit of power drawn from falling water is a ton of British coal we do not have to buy."
 ITA_dnc_a_current_for_every_wheel: "Power for Every Mill"
 ITA_dnc_a_current_for_every_wheel_desc: "Reservoirs, transmission lines and state orders have carried the current out of the mountain valleys. Electric power is now the ordinary way an Italian factory is driven, and the mills run closer to full."
 ITA_dnc_the_grid_of_the_triangle: "The Northern Grid"
 ITA_dnc_the_grid_of_the_triangle_desc: "Turin, Milan and Genoa are wired together, and the valleys behind them have roads at last. Where the current reaches, the ground is worth building on."
 ITA_dnc_the_state_orders_from_terni: "The State Orders From Terni"
 ITA_dnc_the_state_orders_from_terni_desc: "Armour plate, gun forgings and rails come out of Umbria on a standing government contract. The works cost us more than a foreign yard would, and they are ours."
 ITA_dnc_the_workshops_of_turin: "The Workshops of Turin"
 ITA_dnc_the_workshops_of_turin_desc: "Turin has motor works, machine tools and a school of fitters in one city. It builds prototypes faster than the ministries can decide what to order."
 ITA_dnc_the_alpine_reservoirs: "Reservoirs in the Alps"
 ITA_dnc_the_alpine_reservoirs_desc: "Dams in the high valleys hold the snowmelt until the mills want it. The current no longer fails in August."
 ITA_dnc_the_special_laws: "The Special Laws"
 ITA_dnc_the_special_laws_desc: "Basilicata and Calabria are being built by decree. Roads, aqueducts, forestry and a run of public works, and the rest of the budget carries the cost."
 ITA_dnc_the_land_that_holds: "The South Keeps Its People"
 ITA_dnc_the_land_that_holds_desc: "Water, roads and quinine have made the southern provinces liveable. People stay, the harvest is larger, and the prefects report a quieter country."
 ITA_dnc_the_quinine_of_the_state: "Quinine at the State's Price"
 ITA_dnc_the_quinine_of_the_state_desc: "Cheap quinine is sold in every tobacco shop, and the ground where the fever bred has been drained. Fewer men die of malaria, and the recruiting sergeants see it before the statisticians do."
 ITA_dnc_the_water_and_the_land: "Water and Roads in the South"
 ITA_dnc_the_water_and_the_land_desc: "The Apulian aqueduct is running, the hillsides are being replanted, and hard roads reach villages that had none. The South is being made reachable before it is made rich."
 ITA_dnc_six_hundred_thousand_a_year: "The Emigrant Ships"
 ITA_dnc_six_hundred_thousand_a_year_desc: "About 600,000 Italians leave every year, most of them young men from the South. The money they send home feeds the villages they left. What they take with them is the men of military age the army will need."
 ITA_dnc_the_commissariat_of_emigration: "The Commissariat for Emigration"
 ITA_dnc_the_commissariat_of_emigration_desc: "We inspect the ships, we fix the fares, and we keep a consul at the far end of the voyage. Leaving is now a service the state provides. The money the emigrants send back is the steadiest income the kingdom has."
 ITA_dnc_the_land_before_the_ship: "The Great Estates Broken Up"
 ITA_dnc_the_land_before_the_ship_desc: "We have broken up the idle estates and put uncultivated ground under the plough. Fewer families reach the quay, and the landowners of the South have not forgiven us."
 ITA_dnc_the_italians_beyond_the_sea: "The Italians Beyond the Sea"
 ITA_dnc_the_italians_beyond_the_sea_desc: "We keep schools, consulates and chambers of commerce from Buenos Aires to New York. 4 million Italians abroad are an argument we can use in capitals that would otherwise ignore us."
 ITA_dnc_the_bread_that_stays: "The Villages Stop Emptying"
 ITA_dnc_the_bread_that_stays_desc: "The villages are no longer emptying. Grain, recruits and taxes all come off the same fields, and the ships sail half full."
 ITA_dnc_the_state_is_neutral: "The Army Stays in Barracks"
 ITA_dnc_the_state_is_neutral_desc: "The army will not be sent against strikers again. The country is calmer for it, and the employers have learned that the government is not their private police force."
 ITA_dnc_the_chambers_of_labour: "The Trade Union Offices"
 ITA_dnc_the_chambers_of_labour_desc: "Every industrial city now has a chamber of labour, the local trade union office, with a legal address and a charter. Production is steadier and disputes are shorter, and the Socialists have somewhere to sit in every one of them."
 ITA_dnc_the_prefect_settles_it: "The Prefect Settles It"
 ITA_dnc_the_prefect_settles_it_desc: "We arrange the elections, discourage the meetings, and the majorities arrive on time. The ministry has never been stronger in the Chamber. It has never been weaker in the street."
 ITA_dnc_the_schools_of_the_kingdom: "The Schools of the Kingdom"
 ITA_dnc_the_schools_of_the_kingdom_desc: "Elementary schools have been taken onto the state's rolls and the teachers are paid from Rome. More men can read every year, and everything that depends on reading gets easier."
 ITA_dnc_the_pew_and_the_ballot: "Catholics at the Polls"
 ITA_dnc_the_pew_and_the_ballot_desc: "Catholic voters are quietly returning to the polls on our side. We have found an ally we spent 30 years pretending did not exist."
 ITA_dnc_e_the_real_country_tt: "The true condition of the Kingdom becomes a matter of public record."
 ITA_dnc_e_white_coal_tt: "Italian industry will be built on falling water rather than on coal landed at Genoa."
 ITA_dnc_e_the_ships_tt: "The emigration question is opened. The Kingdom must choose how to answer it."
 ITA_dnc_e_the_census_bonus: "The Census of the Kingdom"
 ITA_dnc_e_white_coal_bonus: "The Alpine Power Stations"
 ITA_dnc_e_the_wires_bonus: "The Wires Between Three Cities"
 ITA_dnc_e_terni_bonus: "The Terni Works"
 ITA_dnc_e_the_workshops_bonus: "The Workshops of Turin"
 ITA_dnc_e_the_reservoirs_bonus: "Reservoirs in the Alps"
 ITA_dnc_e_the_current_bonus: "Power for Every Mill"
 ITA_dnc_e_special_laws_bonus: "The Special Laws"
 ITA_dnc_e_the_aqueduct_bonus: "The Apulian Aqueduct"
 ITA_dnc_e_the_commissariat_bonus: "The Commissariat for Emigration"
 ITA_dnc_e_beyond_the_sea_bonus: "The Italians Beyond the Sea"
 ITA_dnc_e_one_kingdom_bonus: "Two Italies, One Kingdom"
 ITA_dnc_e_the_loom_bonus: "Power Reaches the Mills"
 ITA_arm_the_verdict_of_adwa: "The Defeat at Adwa"
 ITA_arm_the_verdict_of_adwa_desc: "This army lost to Menelik in Africa and shot down a crowd in Milan. It is not sure which of the two it should be proud of. Recruits arrive expecting to be despised, and the officers do not disappoint them."
 ITA_arm_the_seniority_list: "The Seniority List"
 ITA_arm_the_seniority_list_desc: "Nobody is passed over and nobody is offended. The generals are content and the Chamber is untroubled. The man who will command the army in the next war is already 60."
 ITA_arm_promotion_by_examination: "Promotion by Examination"
 ITA_arm_promotion_by_examination_desc: "An officer now sits a board and takes a paper, and a mark goes against his name. Ability rises faster than it used to, and a great many colonels have written to their deputies about it."
 ITA_arm_the_class_of_the_year: "The Full Yearly Levy"
 ITA_arm_the_class_of_the_year_desc: "The levy is called as the law says it should be, and the exemptions are checked. The register at last resembles the country. The depots are fuller and the families are angrier."
 ITA_arm_three_years_with_the_colours: "Long Service with the Colours"
 ITA_arm_three_years_with_the_colours_desc: "A long service turns a peasant into a soldier, and keeps him out of the fields for two harvests. The battalions are steady, and there are fewer of them than the law allows."
 ITA_arm_two_years_with_the_colours: "Short Service with the Colours"
 ITA_arm_two_years_with_the_colours_desc: "More men pass through the depots, and fewer of them remember what they were taught. We can put a larger army in the field, and it will take longer to make it fit to fight."
 ITA_arm_the_school_of_the_regiment: "The School of the Regiment"
 ITA_arm_the_school_of_the_regiment_desc: "The barracks teaches reading and writing because nobody else has. A conscript goes home able to read a newspaper, and the regiment gets a soldier who can read an order."
 ITA_arm_the_quick_firing_batteries: "The Quick-Firing Batteries"
 ITA_arm_the_quick_firing_batteries_desc: "The gun carriage absorbs its own recoil, so the barrel does not have to be aimed again after every round. A battery can find its target before the enemy has finished deploying."
 ITA_arm_the_deport_licence: "The Deport Licence"
 ITA_arm_the_deport_licence_desc: "We build the recoil carriage under licence at Turin. The first batteries come out late and the fifth on time, and the work stays inside the country."
 ITA_arm_the_krupp_contract: "The Krupp Contract"
 ITA_arm_the_krupp_contract_desc: "The guns come finished off the quay at Genoa, excellent and foreign. The batteries are re-equipped within a year, and our own arsenals have learned nothing from it."
 ITA_arm_the_army_is_not_a_police: "No Guns Against Strikers"
 ITA_arm_the_army_is_not_a_police_desc: "Standing orders forbid the use of field guns in a labour dispute. The prefects are told to manage with the Carabinieri, and the working quarters have stopped counting the army among their enemies."
 ITA_arm_the_cannon_of_milan: "The Cannon of Milan"
 ITA_arm_the_cannon_of_milan_desc: "The battalions still go where the prefect sends them, and the ministry can rely on it. So can the Socialist press, which reprints the casualty list from Milan every spring."
 ITA_arm_the_alpine_frontier: "The Alpine Frontier"
 ITA_arm_the_alpine_frontier_desc: "We are cutting surveys, mule tracks and quarry sidings in the north-east, and entering them in the estimates as roads. The engineers know exactly which contour line the guns are meant to sit on."
 ITA_arm_the_alpini_corps: "The Alpini"
 ITA_arm_the_alpini_corps_desc: "The Alpini, our mountain troops, are recruited in the valleys and officered by men from the same valleys. They are the only corps in the kingdom that fills its ranks with volunteers, and they hold ground nobody else can reach."
 ITA_arm_the_army_of_the_alps: "An Army for the Alps"
 ITA_arm_the_army_of_the_alps_desc: "Everything is sized for a war on the ridgelines. Short marches, heavy positions, and guns that go where wheels cannot. It is a superb instrument in the mountains and a slow one anywhere else."
 ITA_arm_the_frontier_works: "The Frontier Works"
 ITA_arm_the_frontier_works_desc: "There is concrete in the passes and batteries cut into the rock. The garrison has lived on the position long enough to know where the fog sits in October."
 ITA_arm_the_mountain_batteries: "The Mountain Batteries"
 ITA_arm_the_mountain_batteries_desc: "The guns break down into mule loads and the gunners can climb. They put fire above the treeline, where an enemy has learned not to expect it."
 ITA_arm_the_plan_against_the_ally: "The Plan Against the Ally"
 ITA_arm_the_plan_against_the_ally_desc: "We have a finished deployment against the power we are allied to. It is rehearsed every summer and never mentioned when the alliance comes up for renewal. The staff no longer has to improvise."
 ITA_arm_the_army_of_africa: "An Army for Africa"
 ITA_arm_the_army_of_africa_desc: "The columns carry their own water and the officers volunteer for the climate. Everything is built on the assumption that the enemy will be met a fortnight beyond the railhead."
 ITA_arm_the_ascari_regiments: "The Ascari Regiments"
 ITA_arm_the_ascari_regiments_desc: "Our Eritrean battalions are on the regular establishment, with regular pay and Italian officers.\n\nThey march further on less than any regiment raised at home, and they hold together where supply fails. Every one of them is a battalion we need not raise in Italy."
 ITA_arm_a_smaller_army: "A Smaller Army"
 ITA_arm_a_smaller_army_desc: "We keep 12 corps that are properly equipped instead of 16 that are not. The money saved goes to the slipways.\n\nThe country is cheaper to run and the ministry has room to move. The army takes fewer men and loses some of its cohesion."
 ITA_arm_the_cadre_establishment: "The Cadre Establishment"
 ITA_arm_the_cadre_establishment_desc: "Small units of long-service men, filled out on mobilisation from a reserve list kept up to date.\n\nUnits are quicker to train and quicker to call up, and the men in them know their work. It costs us a little of the annual intake."
 ITA_arm_the_army_of_the_new_century: "The Army of the New Century"
 ITA_arm_the_army_of_the_new_century_desc: "Regulations written for the war we have actually chosen to fight, and officers examined for the rank they hold.\n\nThe army trains better, holds together better and stands losses better. Adwa is a lesson in the staff course now, and the country believes in the army again."
 ITA_arm_robilant_at_the_staff: "Mario di Robilant"
 ITA_arm_robilant_at_the_staff_desc: "He commanded in the mountains before anyone else thought it mattered. He wrote the only Italian manual on mountain war that the Alpini, our mountain troops, actually use."
 ITA_arm_the_three_answers_tt: "§YThe Chamber will hear three answers: the Alps, Africa, or a smaller army and a larger fleet.§!"
 ITA_arm_pollio_at_the_boards_tt: "§YAlberto Pollio sits on the examination boards and gains a skill level.§!"
 ITA_arm_cadorna_waits_his_turn_tt: "§YLuigi Cadorna keeps his place on the promotion list.§!"
 ITA_arm_robilant_at_the_staff_tt: "§YMario di Robilant is available as a High Command advisor.§!"
 ITA_arm_diaz_takes_the_salute_tt: "§YArmando Diaz gains a skill level.§!"
 ITADNC_n_the_naval_estimates: "The Naval Estimates"
 ITADNC_n_the_naval_estimates_desc: "Brin is dead, and his fleet is a museum of single ships that cannot even share shells. We will write a real naval programme instead of a shopping list and give the navy a plan it can build to."
 ITADNC_n_the_dante_alighieri: "The First Dreadnought"
 ITADNC_n_the_dante_alighieri_desc: "Every gun on the centreline in triple turrets, and Vienna has not yet drawn a line. We will lay her down at Castellammare and build the yards to finish her, our first dreadnought designed and built at home."
 ITA_n_the_estimates_of_1900: "The First Naval Programme"
 ITA_n_the_estimates_of_1900_desc: "The fleet has been a collection of one-offs, voted for by ministries that rarely lasted 18 months.\n\nThe estimate is written as a programme at last. The yards build faster, the crews train better, and fewer ships are lost to accidents. Programmes are also harder for the Treasury to cut."
 ITA_n_the_estimates_of_1909: "The Long Naval Programme"
 ITA_n_the_estimates_of_1909_desc: "The naval vote is now written four years ahead, because a dreadnought takes four years and the ally is laying down four of them.\n\nThe yards have never been busier and have never had more capacity. The Chamber has never been asked for so much at once, and everything else in the budget is waiting."
 ITA_n_the_drawing_office: "The Drawing Office"
 ITA_n_the_drawing_office_desc: "Four draughtsmen, a colonel of the naval engineers, and orders to work the weights honestly before the committee sees them.\n\nIt is the cheapest line in the estimate. Our designs come out sooner, our guns come out better, and the yards charge us less for the work."
 ITA_n_the_ship_of_the_future: "The All-Big-Gun Ship"
 ITA_n_the_ship_of_the_future_desc: "One calibre in the main battery, so that the gunners range on one kind of splash. No navy has built such a ship yet.\n\nOur heavy ships hit harder and hit further. Every yard in the kingdom has to be rebuilt around her. She costs more than anything we have laid down, and every ship we own becomes a training vessel."
 ITA_n_the_refusal_of_1903: "The Committee's Refusal"
 ITA_n_the_refusal_of_1903_desc: "The committee heard Cuniberti out, thanked him, and voted for the ships the yards could already build.\n\nThe estimate is smaller and the Chamber is calmer. Our heavy ships will be cheaper and weaker, and the argument we won in private has been printed for anyone who cares to lay the keel."
 ITA_n_the_base_at_taranto: "The Base at Taranto"
 ITA_n_the_base_at_taranto_desc: "Dredged basins, a dry dock, coal sheds and a boom across the Mar Piccolo.\n\nThe squadron now lies a day from the Adriatic instead of a week. Ships are repaired faster and the crews are better for it. The South has been sent the first state industry it has ever had."
 ITA_n_a_sea_that_closes_behind_us: "The Closed Adriatic"
 ITA_n_a_sea_that_closes_behind_us_desc: "The staff paper says it plainly. The Adriatic has one door, at Otranto. We have no anchorages on our own side, and the eastern shore is held by our own ally. Batteries now go up at the heel of Italy and survey ships work the channels. Our coast is stronger and we see further out to sea, though the fleet has less reach.\n\nVienna's confidence in Rome: §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_n_the_double_hull: "The Double Hull"
 ITA_n_the_double_hull_desc: "Cesare Laurenti's partitioned boat comes back up when it is asked to, which is more than most submarines in Europe can promise.\n\nForeign navies are ordering them from Venice, our own boats are cheaper and more reliable, and our torpedoes find their mark. The crews no longer volunteer as though for a funeral."
 ITA_n_the_dante_programme: "The Dante Programme"
 ITA_n_the_dante_programme_desc: "Four triple turrets on the centreline, the first of their kind anywhere, built in a yard that had never assembled anything like them.\n\nThe kingdom has a dreadnought before its ally does. Our heavy ships hit harder and stand more, and the yards can take more work. The next four votes are committed to giving her company."
 ITA_n_the_cruiser_answer: "The Armoured Cruisers"
 ITA_n_the_cruiser_answer_desc: "Armoured cruisers are quick, cheap and pleasant to look at. Anything with a uniform heavy battery will beat them.\n\nThe fleet gets hulls now instead of arguments. Our ships are faster, go further and cost less to build, and our battle line will be thin when it meets a dreadnought."
 ITA_n_the_race_with_pola: "The Race with Pola"
 ITA_n_the_race_with_pola_desc: "Austria builds at Pola and we build against her, two allies in a sea 100 miles wide. Each of us publishes the tonnage so that the other can read it.\n\nThe yards are full and the fleet is proud of itself. The Treasury is empty, and neither government will say in its own parliament who the ships are for."
 ITA_n_the_cavour_programme: "The Cavour Programme"
 ITA_n_the_cavour_programme_desc: "A class instead of a prototype. Three hulls are ordered together, cut to one set of templates, on a schedule the yards can plan around.\n\nThe ships are better armoured and better armed, and the yards can take far more work. It is the first time our naval building has behaved like an industry."
 ITA_n_the_export_yard: "The Export Yard"
 ITA_n_the_export_yard_desc: "Foreign orders keep the slips warm and the fitters employed between naval votes.\n\nThe yards learn faster building for a demanding customer than for a ministry that cannot make up its mind. We have far more shipbuilding capacity and it pays for itself. The best ship on the ways is usually somebody else's, and our own crews get less sea time."
 ITA_n_the_high_seas_school: "The Open Sea School"
 ITA_n_the_high_seas_school_desc: "The fleet is trained and stored to leave its own sea. Long-range steaming, colliers exercised with the squadron, landing parties told off by name.\n\nOur ships go further and work together better, and we can put troops ashore where we choose. It is expensive, and the army resents every lira spent on it."
 ITA_n_the_narrow_sea_school: "The Narrow Sea School"
 ITA_n_the_narrow_sea_school_desc: "Mines, torpedo boats, night work and a fortified coast.\n\nThe Adriatic becomes a sea nobody can enter cheaply, ourselves included. Our light ships and our shore batteries are far stronger. The battle line that would have to leave the sea costs more, and is not being built."
 ITA_n_terni_plate: "Terni Plate"
 ITA_n_terni_plate_desc: "The belt armour is rolled at Terni, in Umbria, late and dear, by a works the state has to keep alive to have it at all.\n\nIt is the only armour in the kingdom that no foreign minister can hold up at a wharf. Our ships stand more punishment. The plate arrives slowly, and every constructor knows what that independence costs per ton."
 ITA_n_the_sheffield_contract: "The Sheffield Contract"
 ITA_n_the_sheffield_contract_desc: "The plate is English, cheaper and better, and it arrives in the same holds as the coal.\n\nThe ships are afloat a year earlier and better protected. London and our own foreign ministry both understand the rest of it: our battle line is armoured at England's convenience."
 ITA_n_e300a_tt: "Four keels are laid in yards that cannot finish them on time."
 ITA_n_e300b_tt: "The estimate is withdrawn. The ministry survives the session and the fleet gets nothing this year."
 ITA_n_e300c_tt: "The dredgers go to work in the Mar Grande. The South is sent state money with no prefect attached to it."
 ITA_n_e301a_tt: "The weights are worked through properly and the gunnery school is told to plan for one calibre."
 ITA_n_e301b_tt: "The drawing goes into a cabinet at the naval engineers' office, and the committee returns to the ships it understands."
 ITA_n_e302a_tt: "The spotting tables are rewritten for a single calibre, and the flotillas are told to screen the battle line."
 ITA_n_e302b_tt: "A light battery goes back into the design and the belt loses two inches. The ship will be less than the article promised."
 ITA_n_e303a_tt: "The English constructors are handed the argument they were still assembling. The first all-big-gun keel is laid on the Solent, not at Castellammare."
 ITA_n_e303b_tt: "Livorno studies what such a ship would mean in a closed sea, and the study is ours."
 ITA_n_e303c_tt: "The foreign ministry opens a quiet conversation in London. Our next capital ship will be armoured and engined by the power that sells us our coal."
 ITA_n_e304a_tt: "Terni is kept alive by the naval vote. It delivers late, and it delivers armour no foreign ministry can hold up."
 ITA_n_e304b_tt: "English plate lands at Genoa with the coal and the ship is afloat a year early. We owe London one more favour."
 ITA_n_e305a_tt: "The staff paper becomes the fleet's working assumption, and the ally's attache reports it home."
 ITA_n_e305b_tt: "The survey ships are recalled and the ally is told, in writing, that the Adriatic is a shared sea."
 ITA_n_e305c_tt: "Batteries go up at Brindisi and Otranto without an announcement. They are photographed from a passing steamer within the season."
 ITA_n_e306a_tt: "The country is told it has built the finest ship in Europe, and so is everyone else."
 ITA_n_e306b_tt: "The launch is a naval occasion, not a national one, and Vienna hears of it a fortnight later."
 ITA_n_e307a_tt: "The estimate is written four years forward, and the Chamber is told what it will be voting for."
 ITA_n_e307b_tt: "Venice is given the money Castellammare wanted, and the Austrian battleships acquire a problem nobody at Pola has costed."
 ITA_n_e307c_tt: "The refusal is made to Vienna in the proper form, and believed there more than it is at home."
 ITA_n_e308a_tt: "The yards run full for three years, and most of what they build sails under somebody else's flag."
 ITA_n_e308b_tt: "The contract is bought out at an embarrassing price and the foreign buyer is compensated. The navy gets the best ship in the yard for once."
 ITA_n_e309a_tt: "Venice gets sheds, a slipway and six machines. The navy is the first in Europe to write aircraft into a fleet exercise."
 ITA_n_e309b_tt: "The machine is put away and two more boats are laid down, which is what the flotilla commanders wanted."
 ITA_n_tt_cuniberti_hired: "Colonel Vittorio Cuniberti is given a drawing office and may be appointed as a naval theorist."
 ITA_n_tt_laurenti_hired: "Cesare Laurenti may be appointed as a naval theorist."
 ITA_n_tt_masdea_hired: "Edoardo Masdea may be appointed as a naval theorist."
 ITA_n_tt_masdea_draws_the_ring: "Edoardo Masdea takes the triple turret to the test range at Muggiano."
 ITA_n_tt_cuniberti_gone: "Colonel Cuniberti leaves our service with his drawings and can no longer be appointed."
 ITA_n_tt_vienna_down_3: "Vienna's confidence in Rome falls by §R3§!."
 ITA_n_tt_vienna_down_5: "Vienna's confidence in Rome falls by §R5§!."
 ITA_n_tt_vienna_down_8: "Vienna's confidence in Rome falls by §R8§!."
 ITA_n_tt_vienna_down_10: "Vienna's confidence in Rome falls by §R10§!."
 ITA_n_the_dante_threat: "Italy lays down its first dreadnought"
 ITA_n_the_adriatic_race_threat: "Italy races Austria in the Adriatic"
 ITA_n_the_cavour_threat: "Italy orders three more dreadnoughts"
 ITADNC_w_the_consulta: "The Foreign Ministry"
 ITADNC_w_the_consulta_desc: "Our foreign ministry keeps the archives of a great power on the budget of a middling one, and half our writers have never read the treaties they cite. We will open its books, hire men who know what we signed, and build a cipher room."
 ITADNC_w_the_renewal_of_the_alliance: "Renewing the Triple Alliance"
 ITADNC_w_the_renewal_of_the_alliance_desc: "The Triple Alliance is due for renewal, and Berlin wants our signature before anyone asks the Chamber. The text is defensive and silent on Trento. We will sign, and buy quiet on the Alps and the goodwill of both courts."
 ITADNC_w_the_loyal_third: "Standing by the Alliance"
 ITADNC_w_the_loyal_third_desc: "We have sold the same neutrality twice, and both courts suspect it. We will be the ally we claim to be: our Third Army entrains for the Rhine and Vienna gets its staff talks, and the irredentist press will call it treason."
 ITADNC_w_prinettis_note_to_paris: "Prinetti's Note to Paris"
 ITADNC_w_prinettis_note_to_paris_desc: "Barrère wants an assurance, and only a handful of men in Rome need ever know it was given. We will sign that Italy stays out if France is attacked, securing our western frontier and leaving a treaty in our safe that is now a lie."
 ITADNC_w_the_notice_of_denunciation: "Leaving the Triple Alliance"
 ITADNC_w_the_notice_of_denunciation_desc: "We cannot go on pretending to be bound to the power that holds Trento. We must give formal notice that the alliance will not be renewed. Then we face Europe as a great power with no allies, no coal of our own and a very long coast."
 ITADNC_w_the_staff_talks_at_berlin: "The Staff Talks at Berlin"
 ITADNC_w_the_staff_talks_at_berlin_desc: "An alliance that has never fixed a timetable is a phrase, not a plan. We must send officers to Berlin to settle how many divisions cross the Alps, and on which railways. Then we must build the lines that carry them."
 ITADNC_w_the_double_book: "Keeping Both Bargains"
 ITADNC_w_the_double_book_desc: "We tell Vienna what the treaty says and Paris what the note says, and each pays for a friend already promised elsewhere. We will keep both files apart, with a cipher office good enough that neither capital reads the other's copy."
 ITADNC_w_trento_and_trieste: "Trento and Trieste"
 ITADNC_w_trento_and_trieste_desc: "The Italian lands under Austria have been a subject for banquet speeches for decades. We will state the claim properly in the Chamber, the schools and our dispatches, and prepare the army that will have to make it good."
 ITADNC_w_the_bargain_at_racconigi: "The Tsar's Visit"
 ITADNC_w_the_bargain_at_racconigi_desc: "The Tsar is coming to the King's hunting lodge at Racconigi to keep the Balkans as they are. We will agree, favour no third power there, and take Russia's word on the Straits and on Tripoli. Vienna will hear within the month."
 ITADNC_w_the_albanian_shore: "The Albanian Shore"
 ITADNC_w_the_albanian_shore_desc: "The Strait of Otranto is ours only while nobody else holds Valona, and Vienna is buying quays on the same coast. We will open schools, buy wharves and pay the chiefs, and organise Albania before anyone else does."
 ITADNC_w_the_two_colonies: "Our Colonies"
 ITADNC_w_the_two_colonies_desc: "Eritrea and the Benadir cost more than they return and are run by whoever happens to be there. We will survey them properly and build roads behind Massawa and Mogadishu before anyone proposes a third colony."
 ITADNC_w_buying_out_the_benadir_company: "Buy Out the Somali Company"
 ITADNC_w_buying_out_the_benadir_company_desc: "The chartered company has run the Benadir on subsidies and scandal, and the inquiry found slavery in ports it runs in our name. We will buy back the charter and govern Somalia directly, even if the Chamber vote is painful."
 ITADNC_w_the_ascari_battalions: "The Ascari Battalions"
 ITADNC_w_the_ascari_battalions_desc: "Our best infantry in Africa is Eritrean, and the ascari march further on less than any conscript from Basilicata. We will raise more battalions and pay them what they are worth, and every one is a battalion we need not ship from Naples."
 ITADNC_w_the_treaty_with_menelik: "The Treaty with Menelik"
 ITADNC_w_the_treaty_with_menelik_desc: "Menelik destroyed a European army and is willing to be generous about it. We will fix the Eritrean border, open the caravan roads, join London and Paris in guaranteeing Ethiopia, and tell our army the account is closed."
 ITADNC_w_the_march_back_to_adwa: "The March Back to Adwa"
 ITADNC_w_the_march_back_to_adwa_desc: "Neither the army nor the country has forgiven Adwa, and everything that destroyed Baratieri is still up there. We will build the road from Massawa and train columns for the highlands, then go back despite London's guarantee."
 ITADNC_w_the_tripoli_question: "The Tripoli Question"
 ITADNC_w_the_tripoli_question_desc: "The last untaken piece of Africa lies across the water from Sicily, held by the Porte with a few battalions and no money. We will open the file and record our claim, since every capital already concedes Tripoli is ours when we want it."
 ITADNC_w_the_ultimatum_to_the_porte: "The Ultimatum to the Porte"
 ITADNC_w_the_ultimatum_to_the_porte_desc: "The fleet is coaled and the transports lie at Naples. We must send the Porte, the Ottoman government, a note it cannot accept. It gets a day to answer. Then we take the kingdom into war without asking the Chamber first."
 ITADNC_w_the_banco_di_roma_instead: "The Bank Instead"
 ITADNC_w_the_banco_di_roma_instead_desc: "The Banco di Roma already owns the mills, the quays and much of the debt in Tripoli. We will buy the province instead of storming it, with more branches, more credit and an understanding with the Porte, and the nationalists will shout."
 ITADNC_w_the_islands_as_a_pledge: "The Islands as a Pledge"
 ITADNC_w_the_islands_as_a_pledge_desc: "The Ottoman garrison in Libya is supplied through the Aegean. We must take Rhodes and the islands beside it, and hold them as a pledge until the Porte signs. Everyone will understand what a pledge becomes when it is held long enough."
 ITADNC_w_the_peace_of_ouchy: "The Peace Treaty"
 ITADNC_w_the_peace_of_ouchy_desc: "The Porte will withdraw its officers and grant the provinces autonomy if we agree to call that a transfer. We will sign at Ouchy and add the coast to our register, while the Sultan keeps a religious title over men who still shoot at us."
 ITADNC_w_the_war_that_does_not_end: "The War in the Interior"
 ITADNC_w_the_war_that_does_not_end_desc: "We took the coast in a fortnight and have not taken the interior at all. We will keep paying for more columns and more supplies, while the Senussi hold the wells and the caravan roads and show no sign of stopping."
 ITADNC_w_the_fourth_shore: "The Fourth Shore"
 ITADNC_w_the_fourth_shore_desc: "If Libya is to be worth the graves, it must take the emigrants who now sail to Brooklyn and Buenos Aires. We will sink wells, build the coast road and open land offices to Southern families, and make Libya Italian soil."
 ITA_w_the_consulta: "The Foreign Ministry"
 ITA_w_the_consulta_desc: "The foreign ministry has its own budget line and its own cipher room at last.\n\nIt keeps a record of what was promised to whom. The government has more room to move, and we are better thought of abroad."
 ITA_w_the_third_partner: "The Loyal Ally"
 ITA_w_the_third_partner_desc: "Rome means the treaty it signed. Two general staffs now plan alongside ours, and our army is the better for it.\n\nA third of the Chamber regards the ministry as the caretaker of Austrian rule over Italians."
 ITA_w_the_note_of_1902: "The Note in the Safe"
 ITA_w_the_note_of_1902_desc: "France will not be fought, and the divisions that watched the Alpine passes can be used elsewhere.\n\nOur own ground is better defended and the ministry has room to move. Four men know why, and one of them is a foreign ambassador."
 ITA_w_the_double_book: "The Double Book"
 ITA_w_the_double_book_desc: "We keep two sets of engagements, one for Vienna and one for Paris. Both camps believe they have bought us, and both go on paying.\n\nThe ministry has never been so well informed or so well courted. It has also never depended so completely on nobody in Paris talking."
 ITA_w_the_broken_word: "The Broken Word"
 ITA_w_the_broken_word_desc: "It is on the record in three languages that Italy signs what it does not mean.\n\nEvery undertaking we give from now on is read as provisional. Nobody abroad will trade with us or treat with us on the old terms, and the country knows it."
 ITA_w_free_hands: "Free Hands"
 ITA_w_free_hands_desc: "No ally, no obligation, no timetable written in another capital. The government is freer than it has been in a generation, and the country is readier for a fight.\n\nNobody is under any duty to come when our coast is shelled, and our trading partners have noticed."
 ITA_w_the_albanian_stake: "The Albanian Stake"
 ITA_w_the_albanian_stake_desc: "Coaling rights at Valona, schools inland and a subsidy to the chiefs.\n\nThe Adriatic has one door, and we now hold one side of it. Our ships can steam further and the crews know the coast."
 ITA_w_the_ascari: "The Ascari Battalions"
 ITA_w_the_ascari_desc: "Eritrean regulars under Italian officers, and cheaper to keep than a division raised at home.\n\nThey are used to the heat, they hold together, and they have never lost a colonial campaign. They also add to the men we can call up."
 ITA_w_the_tripartite_understanding: "The Agreement on Ethiopia"
 ITA_w_the_tripartite_understanding_desc: "Rome, London and Paris guarantee Ethiopia whole and divide its trade between them.\n\nThe caravan roads to Massawa are open and the border is a line rather than a grievance. We are easier to trade with, and the country is calmer for it."
 ITA_w_the_second_expedition: "The Second Expedition"
 ITA_w_the_second_expedition_desc: "The army is going back to the highlands to settle Adwa. It attacks with a will.\n\nEvery cartridge fired there arrives by mule, over a mountain, in a column that has to be escorted. The columns eat supply and lose men to the country itself."
 ITA_w_the_banco_di_roma: "The Banco di Roma"
 ITA_w_the_banco_di_roma_desc: "Italian credit does the work an Italian corps would otherwise be asked to do.\n\nIt is slower and far cheaper. The country is easier to run, we are better thought of as a trading partner, and it wins no man a decoration."
 ITA_w_the_desert_that_does_not_end: "The Desert War"
 ITA_w_the_desert_that_does_not_end_desc: "The coast is administered and the interior is not.\n\nThe columns are learning desert war the only way it is learned. The casualty lists arrive in a country that was told the war had ended, and the tribes behind us are not quiet."
 ITA_w_the_fourth_shore: "The Fourth Shore"
 ITA_w_the_fourth_shore_desc: "Land offices at Tripoli and Benghazi, wells, a coast road, and families out of Calabria on the first sailings.\n\nThey emigrate under our own flag instead of somebody else's. The population grows, the country is calmer, and Libya settles down under our administration."
 ITA_w_vienna_trust_tt: "Vienna's confidence in Rome: §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_w_note_sealed_tt: "The note stays in the safe. It cannot be traded on, and it cannot be found."
 ITA_w_note_talked_about_tt: "The note is spoken of in the Paris drawing rooms, and what Paris says aloud is printed in Vienna."
 ITA_w_tripoli_opened_tt: "The Tripoli file is open at the foreign ministry, and the claim can now be acted on."
 ITA_w_ouchy_tt: "Tripolitania, Cyrenaica and the Libyan coast pass to the Kingdom of Italy, and the war with the Porte is ended."
 ITA_w_ultimatum_extended_tt: "The ultimatum is extended. The claim stands, the transports stay at Naples, and the Chamber is told nothing."
 ITA_w_restraint_tt: "The columns are held to their orders. The ministry pays for it in the Roman press for a month."
 ITA_w_expedition_halted_tt: "The expedition is halted at the escarpment. The claim on Ethiopia stands on paper and nowhere else."
 ITA_w_threat_the_irredenta: "Italy claims Trento and Trieste"
 ITA_w_threat_the_second_expedition: "Italy prepares a second Ethiopian expedition"
 ITA_w_threat_the_ultimatum: "Italy threatens the Ottoman provinces in Africa"
