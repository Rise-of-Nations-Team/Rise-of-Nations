 ITA_p_the_piazza: "The Piazza"
 ITA_p_the_piazza_desc: "What the prefects report from the squares, the chambers of labour and the mills, kept as one figure in a book at the Interior. The state shelled Milan for less than this.\n\nThe piazza: §Y[?ITA_piazza|0]§! of 100. It will not fall below §Y[?ITA_piazza_floor|0]§!.\n\nRestless, the strike spreads; angry, the ministry falls; ungoverned, the province is out of the prefect's hands; and a piazza that stays at the top of the book for a season is an insurrection."
 ITA_c_the_chamber: "The Chamber"
 ITA_c_the_chamber_desc: "There is no party in this Chamber, only a majority, and a majority is a thing assembled deputy by deputy in a room off the corridor. It holds until the bill comes.\n\nThe government's hold: §Y[?ITA_majority|0]§! of 100, of which §Y[?ITA_majority_bought|0]§! was made by the prefects.\n\nProvinces worked: §Y[?ITA_prefects|0]§!. Public works promised and not yet delivered: §Y[?ITA_pledges|0]§!."
 ITA_p_the_army_in_the_streets: "The Army in the Streets"
 ITA_p_the_army_in_the_streets_desc: "Bava Beccaris was decorated for it, and the country has not stopped counting since. Every time the troops are sent the square empties that week and refills the next year with men who remember.\n\nTimes the army has been used against a crowd: §Y[?ITA_bayonets|0]§!. While the army holds the streets the square keeps its floor, and the ministry is asked for an amnesty sooner."
 ITA_p_the_province_ungoverned: "The Province Is Not Governed"
 ITA_p_the_province_ungoverned_desc: "The prefect is in his residence with the shutters closed, the telegraph is cut, and a committee sitting in the town hall is issuing passes. Nothing is being built here and nothing is being shipped out."
 ITA_p_the_strike_spreads: "The Strike Spreads"
 ITA_p_the_strike_spreads_desc: "It began in one trade and it is now in all of them: the port, the railway shops, the tramways, the mills along the Olona. There is no fund to break, no leader to arrest and no demand to concede, because nobody drew one up. The furnaces are banked and the country is waiting to see what the government is."
 ITA_p_the_country_divided: "The Country Divided"
 ITA_p_the_country_divided_desc: "There is a line across the peninsula now with an army on either side of it, and the kingdom that Cavour assembled in eleven years has come apart in a fortnight. Whichever side wins, no conscript from those provinces will be trusted with a rifle for a generation."
 ITA_c_the_ministry_that_waits: "The Ministry That Waits"
 ITA_c_the_ministry_that_waits_desc: "A cabinet formed to hold the door until the Chamber can agree on something. It signs nothing that could be quoted against it, and every question it is asked is referred to the next session."
 ITA_c_the_ministry_of_transition: "A Ministry of Transition"
 ITA_c_the_ministry_of_transition_desc: "The King has sent for a man everyone can accept because nobody wants him, and he has undertaken to do nothing at all until the situation clarifies. Every measure is put off to the spring session. The situation does not clarify."
 ITA_c_the_chamber_will_not_vote: "The Chamber Will Not Vote"
 ITA_c_the_chamber_will_not_vote_desc: "The estimates were laid before the House and the House went home. There is no majority for anything: not for the ministry, not against it, not for the credits, not for a dissolution. The Kingdom is administered by the permanent officials and by nobody else."
 ITA_c_the_majority_returned: "The Majority Returned"
 ITA_c_the_majority_returned_desc: "Three hundred and some deputies came back with the government, and for two sessions the ministry can put a bill down and know the numbers before the division bell. It will not last, because it never does, but it is the only condition in which anything in this kingdom gets built."
 ITA_repress_tt: "§RThe army is used against the crowd.§! The piazza falls by §Y14§! now, and one more bayonet is counted against the day it rises again. The ministry pays for it in stability, in war support, and in what the extreme makes of the funerals."
 ITA_ministry_falls_tt: "§RThe ministry falls.§! The most senior standing of the government's political spirits is lost, and the majority falls by §Y15§!."
 ITA_ungoverned_tt: "§RTwo provinces pass out of the government's hands for eight months§! and produce nothing while they are gone."
 ita_dnc.600.t: "The Chambers of Labour Vote to Come Out"
 ita_dnc.600.d: "It began over a shooting in Sardinia and it is now in Milan, Genoa, Turin and Rome at once, without a central committee, without a demand, and without a fund. The trams have stopped, the port has stopped, and the newspapers are not being printed. Nobody in this ministry has seen a general strike before, because until this week no European country had one."
 ita_dnc.600.a: "Send the prefect to sit at the table with them."
 ita_dnc.600.b: "The garrison will clear the squares by this evening."
 ita_dnc.600.c: "It has no demands. It will exhaust itself."
 ita_dnc.601.t: "The Ministry Falls"
 ita_dnc.601.d: "The majority that voted the estimates in the spring did not divide with the government tonight, and the men who arranged it are already in the corridor arranging the next one. Nothing was defeated on principle. A hundred deputies simply decided that a ministry with the country in this state is not a ministry worth being counted with."
 ita_dnc.601.a: "Send for the same man. He will make another majority."
 ita_dnc.601.b: "Send for someone the Chamber has not yet used up."
 ita_dnc.601.c: "Ask the King to prorogue the House until it is calmer."
 ita_dnc.602.t: "The Province Is Out of Hand"
 ita_dnc.602.d: "It started with three men shot at a meeting and it is now a week old. The railway has been torn up outside the city, the telegraph is cut, the tax registers have been burned in the square, and in the smaller towns committees have declared themselves and are issuing bread tickets. The prefect reports that he has no force he can rely on and asks for instructions.\n\nNo amount of political credit will settle this one."
 ita_dnc.602.a: "Two divisions and a state of siege. It ends this month."
 ita_dnc.602.b: "Concede what they are asking for, in writing, today."
 ita_dnc.602.c: "The prefects will manage it without the army."
 ita_dnc.603.t: "The Insurrection"
 ita_dnc.603.d: "The Romagna has been out of the government's hands for three months and the rest of the country has stopped pretending otherwise. The reservists called up in the Marche did not report. In Tuscany the garrison commander has asked to be relieved rather than fire. What is being read from the balconies is no longer a list of grievances but a constitution.\n\nThe kingdom is past the point where a ministry decides anything."
 ita_dnc.603.a: "Then it is a war, and we shall fight it."
 ita_dnc.604.t: "The Province Is Governed Again"
 ita_dnc.604.d: "The committees have dispersed, the prefect is back at his desk, and the registers are being copied out again from the tax rolls in Rome. The line is repaired as far as the junction. Nobody has been prosecuted, which is the only reason it is over."
 ita_dnc.604.a: "Let nothing be said about it in the House."
 ita_dnc.700.t: "The Circular to the Prefects"
 ita_dnc.700.d: "The draft is on the desk and it says nothing that could be read out. It tells ninety prefects which candidates the government regards with favour, which licences may be granted before the poll, and which roads and aqueducts are to be surveyed in which constituencies. It has always been sent. The only question is how hard to write it."
 ita_dnc.700.a: "Write it hard. Promise the works and name the men."
 ita_dnc.700.b: "Send it as it has always been sent."
 ita_dnc.700.c: "Withdraw it. The prefects will supervise and nothing else."
 ita_dnc.701.t: "The General Election"
 ita_dnc.701.d: "Two and a half million men have the vote out of thirty-three million Italians, and in half the southern constituencies the poll is a formality arranged in the prefecture. The clergy have quietly been released from the ban in a few dioceses and will vote for the first time since 1870."
 ita_dnc.701.a: "The prefects will make the returns."
 ita_dnc.701.b: "Fight it on what the ministry has actually built."
 ita_dnc.701.c: "The government will not touch this election."
 ita_dnc.702.t: "The General Election"
 ita_dnc.702.d: "The socialists come back stronger from the North whatever is done, and the ministry's answer is the same as ever: find the numbers somewhere else. In the South that means the prefectures. In the Veneto and the Marche it means the parish clergy, who now have an understanding with the government that neither side will put on paper."
 ita_dnc.702.a: "The prefects will make the returns."
 ita_dnc.702.b: "The sacristy will deliver what the prefecture cannot."
 ita_dnc.702.c: "The government will not touch this election."
 ita_dnc.705.t: "The Returns"
 ita_dnc.705.d: "The last constituencies have been declared and the clerks at Montecitorio have finished the arithmetic that decides what kind of ministry this is going to be."
 ita_dnc.705.a: "The government is returned."
 ita_dnc.705.b: "A ministry, then, but not a majority."
 ita_dnc.705.c: "There is no government in this Chamber."
 ITA_ch_already_out_tt: "§RThe country was already in the streets when the shots were fired.§!"
 ITA_ch_the_prefect_did_not_ask_tt: "§RThe prefect did not telegraph first. The ministry learned of the decree from the newspapers.§!"
 ITA_ch_nobody_else_would_take_it_tt: "§RNobody else would take the Interior. The King's choice is not a choice.§!"
 ITA_ch_the_trade_is_already_theirs_tt: "§RThe agents already have the trade, and the quaysides know it.§!"
 ITA_ch_the_army_was_already_out_tt: "§RThe army was out elsewhere before it was out here. Buggerru is not an incident, it is a pattern.§!"
 ITA_ch_the_strike_took_the_railways_tt: "§RThe strike has taken the railways north and south.§!"
 ITA_ch_dissolved_over_bayonets_tt: "§RThe Chamber is dissolved by a ministry that used troops. Every platform in the country will say so.§!"
 ITA_ch_the_boards_are_tested_tt: "§GThe arbitration boards exist. Parma is the first weight they have been asked to hold.§!"
 ITA_ch_messina_on_a_country_out_tt: "§RThere are no troops to spare for the Straits. They are holding the cities.§!"
 ITA_ch_messina_the_contracts_tt: "§RThe reconstruction contracts are placed before the rubble is cleared, and the Chamber knows which deputies placed them.§!"
 ITA_ch_messina_a_quiet_country_tt: "§GA quiet country lets a government be seen to govern.§!"
 ITA_ch_the_last_reserves_tt: "§RThe last reserves go south. The cities are held by nobody.§!"
 ITA_ch_the_nationalists_have_an_audience_tt: "§RAn angry country is an audience, and the Association has found one.§!"
 ITA_ch_the_papers_have_promised_it_tt: "§RThe newspapers have promised this war on the ministry's behalf.§!"
 ITA_ch_asked_in_the_street_tt: "§RThe reform is being demanded outside the Chamber before it is moved inside it.§!"
 ITA_ch_the_whips_can_count_tt: "§RThe whips have counted the bought seats and know exactly what a mass register costs.§!"
 ITA_ch_the_bought_seats_will_not_hold_tt: "§RThe seats bought through the prefectures will not survive the next election.§!"
 ITA_ch_the_coast_is_ours_tt: "§YThe coast is ours. The interior has not been informed.§!"
 ITA_ch_the_socialists_have_their_issue_tt: "§RThe war has handed the maximalists the argument they were short of.§!"
 ITA_ch_the_reservists_will_not_go_tt: "§RThe reservists called for Africa have already been used against their own towns.§!"
 ITA_ch_gentiloni_the_new_register_tt: "§YUnder the new register the clergy can deliver more votes than the prefects ever could.§!"
 ITA_ch_gentiloni_the_old_register_tt: "§YUnder the old register the pact is worth less. The prefects still hold the seats.§!"
 ITA_ch_red_week_held_tt: "§YThe provinces hold, barely, and the line is cut in one place only.§!"
 ITA_ch_july_the_country_will_not_march_tt: "§RThe country will not march. It has been in the streets all summer and it knows who put it there.§!"
 ITA_ch_july_no_majority_tt: "§RThere is no majority to carry a war vote, and the whips have said so in writing.§!"
 ITA_ch_july_the_army_is_in_the_streets_tt: "§RThe army is holding Italian towns. It cannot be asked to hold a front as well.§!"
 ITA_ch_the_law_of_suspects: "The Law of Suspects"
 ITA_ch_the_law_of_suspects_desc: "The register at the Interior has a card for every anarchist in the kingdom, every subscriber to an anarchist paper, and every man seen at a meeting where one spoke. It works: the ministry knows things it did not know. It also tells several hundred thousand people who were not anarchists last year exactly which side the state has taken, and the emigration offices in Naples are busier than they were."
 ITA_ch_the_amnesty_of_the_new_reign: "The Amnesty of the New Reign"
 ITA_ch_the_amnesty_of_the_new_reign_desc: "The Milan sentences are quashed and the men come home to bands at the station. The reign begins with a gesture nobody in the Chamber advised and half the Senate regards as an insult to the dead King. It buys something that cannot be bought any other way, and it is spent the moment it is made."
 ITA_ch_the_port_that_stopped: "The Port That Stopped"
 ITA_ch_the_port_that_stopped_desc: "Genoa lands two thirds of what the industrial triangle burns, and Genoa is shut. The colliers wait in the roads on demurrage, the grain sits in the holds, and Ansaldo has sent its fitters home. Every day of this is a week somewhere inland."
 ITA_ch_the_ministry_of_the_left: "The Ministry of the Left"
 ITA_ch_the_ministry_of_the_left_desc: "An old orator in front and a card index behind him. The prefectures have a minister who reads their reports, remembers them, and answers by return; the Chamber has a leader who can count. It is not a programme and does not pretend to be one, but it governs, which is more than the last four ministries managed."
 ITA_ch_the_agents_of_the_ports: "The Agents of the Ports"
 ITA_ch_the_agents_of_the_ports_desc: "The law exists and is not enforced, which suits everyone who wrote it. The agents keep the trade, the fares stay what the traffic will bear, and the men keep going: from the Veneto, from the Basilicata, from villages that will have no men of military age in them by the time the class is called. The state is not paying for this. It is simply losing them."
 ITA_ch_the_officers_grievance: "The Officers' Grievance"
 ITA_ch_the_officers_grievance_desc: "A lieutenant has been tried for obeying an order the prefect gave and the ministry did not withdraw. The mess at every garrison in the kingdom has now worked out that the state will send them into a piazza and then disown them for what happens there. They will still go. They will go slowly, and they will not volunteer."
 ITA_ch_the_troops_were_right: "The Troops Were Right"
 ITA_ch_the_troops_were_right_desc: "The officer is confirmed in his rank, the file is closed, and the army knows the state stands behind the rifle. So does everybody else. There is a discipline in the barracks that was not there last year, and a hardness in the leagues that was not there either, and the second will outlast the first."
 ITA_ch_the_general_strike: "The General Strike"
 ITA_ch_the_general_strike_desc: "No train, no tram, no gas, no press but one. Nobody in Europe has done this before and nobody is certain how it stops. Whatever else it proves, it has proved that the country can be halted by men who own nothing and hold no office, and every ministry from now on will govern with that fact in the room."
 ITA_ch_the_lockout_of_parma: "The Lockout in the Bassa"
 ITA_ch_the_lockout_of_parma_desc: "The agrarians have money and time and the leagues have neither, so the fields stand and the bassa eats what the subscription lists send it. The children are in Genoa. The province is being run by two private organisations, neither of which is the prefecture."
 ITA_ch_the_seismic_decree: "The Seismic Decree"
 ITA_ch_the_seismic_decree_desc: "The Straits are rebuilt to a code written by engineers and imposed by decree, over the heads of the Chamber, the province and everyone who owned a building in Messina. It is the best piece of administration the kingdom has done in twenty years, and it was done in a way the constitution does not contemplate."
 ITA_ch_the_africa_of_the_newspapers: "The Africa of the Newspapers"
 ITA_ch_the_africa_of_the_newspapers_desc: "The ministry has said from the tribune what the nationalist weeklies have been saying for a year: that Tripoli is Italian and only the date is in question. The country liked it. So did the Association, which has now been told by the government itself that its programme is the government's, and will hold the ministry to it."
 ITA_ch_the_war_that_was_not_declared: "The War That Was Not Declared"
 ITA_ch_the_war_that_was_not_declared_desc: "The note was drafted and not sent. The Banco di Roma is selling its Tripolitanian holdings at whatever it can get, the nationalist press has found the word renunciation and will not put it down, and a Chamber that had already been promised a colony has been handed a prudent explanation instead. The peace is real. So is the bill for it."
 ITA_ch_the_desert_that_pays_nothing: "The Desert That Pays Nothing"
 ITA_ch_the_desert_that_pays_nothing_desc: "A year in, and the war consists of holding the coast against people who do not want the coast. The columns march, find nothing, and are shot at on the way back. The class held with the colours is a year older, the casualty lists are printed in full, and the men writing against the war in the Romagna are getting a hearing they never had in peacetime."
 ITA_ch_the_garrison_of_the_fourth_shore: "The Garrison of the Fourth Shore"
 ITA_ch_the_garrison_of_the_fourth_shore_desc: "Forts, wire, wells and blockhouses from Zuara to Derna, held by conscripts who did not expect Africa, resupplied by sea because there is no other way. It is permanent now, and it is subtracted from every other thing the army might be asked to do."
 ITA_ch_the_wider_register: "The Wider Register"
 ITA_ch_the_wider_register_desc: "Eight and a half million electors, most of whom have never voted and owe nothing to anybody. The Socialists have a constituency, the Catholics have a constituency, and the deputy who used to be returned by four hundred notables and a prefect's letter no longer knows who is in his own division. This is what was asked for. It cannot be given back."
 ITA_ch_the_register_unrevised: "The Register Unrevised"
 ITA_ch_the_register_unrevised_desc: "The reform was announced in the Chamber and the literacy test stayed in committee, where it will be studied. The country has been told it has the vote and has not been given it, which quiets the tribune for a session and settles nothing at all."
 ITA_ch_the_romagna_remembers: "The Romagna Remembers"
 ITA_ch_the_romagna_remembers_desc: "The committees are broken, the tricolour is back up, and the Romagna has learned exactly what the state will do and how long it takes to do it. The men who ran those four days are alive, at liberty, and no longer arguing among themselves about method."
 ITA_ch_the_barracks_reform: "The Barracks Reform"
 ITA_ch_the_barracks_reform_desc: "The disciplinary companies are abolished and the punishment regulations rewritten, which is what the meeting at Ancona was called about in the first place. The country is quieter than it has been since the strike. The General Staff has put its objection in writing and asked that it be filed where it can be found later."
 ITA_ch_the_alliance_honoured: "The Alliance Honoured"
 ITA_ch_the_alliance_honoured_desc: "The treaty was kept. Italy marches with the partner she has spent thirty years distrusting, for a quarrel about Serbia, over an ultimatum she was not shown. The army is better for having a decision. The country was not asked, and the party that will tell it so is already writing."
 ITA_ch_the_scrap_of_paper: "The Letter of the Treaty"
 ITA_ch_the_scrap_of_paper_desc: "Article VII required consultation and there was none, so the casus foederis does not arise. The lawyers are right, the Consulta is right, and the ministry has read the finding aloud from the tribune. Vienna calls it desertion. The country calls it the first sensible thing done in Rome since Ouchy, and means it."
 ITA_ch_the_hands_are_free: "The Hands Are Free"
 ITA_ch_the_hands_are_free_desc: "Neutral, and letting it be known in both capitals that neutrality has a price and a shelf life. Two embassies now have an interest in improving their offer and neither can be certain of us. It is not a policy anyone would put in a despatch, and it is worth more than one."
 ITA_z_the_chamber_adjourned: "The Chamber Adjourned"
 ITA_z_the_chamber_adjourned_desc: "No dissolution, no proclamation, no crisis: only a session that ends and is not reconvened. The ministry governs by decree because the decree is quicker, and quickness has become the only argument anyone makes. The deputies still draw the allowance. They have simply stopped being consulted."
 ITA_z_the_extreme_left_in_office: "The Extreme Left in Office"
 ITA_z_the_extreme_left_in_office_desc: "Reformists at the Interior, at Labour, at Public Instruction. The prefects who spent a decade counting votes now take instructions from men they used to have followed. The chambers of labour are answered instead of dissolved, and every general in the kingdom has written privately to the King about it."
 ITA_end_the_state_that_chose: "The State That Chose"
 ITA_end_the_state_that_chose_desc: "Universal suffrage, a Chamber that was not bought, and a piazza that is loud without being ungovernable. Nobody in Europe expected this from Italy and a good many people in Rome did not either. The kingdom enters the crisis that is coming as the only great power that will decide its own part in it from a position of quiet."
 ITA_end_the_country_was_asked: "The Country Was Asked"
 ITA_end_the_country_was_asked_desc: "No war without a vote, said aloud and then written down. It makes the ministry slow, it makes the General Staff furious, and it makes any decision Italy reaches almost impossible to reverse afterwards, because the whole country signed it."
 ITA_end_the_ministry_decides_alone: "The Ministry Decides Alone"
 ITA_end_the_ministry_decides_alone_desc: "The prerogative in foreign affairs belongs to the Crown and its ministers, and the Chamber is informed. It is legal, it is fast, and it means that whatever Italy does next will have been done by eleven men who can be named."
 ITA_end_the_bargain_of_1914: "The Bargain"
 ITA_end_the_bargain_of_1914_desc: "Terms discussed in a room in London: the Trentino, Trieste, the Istrian coast, Valona, a share of whatever comes apart. Nothing is signed where anyone can see it, and the ambassador in Vienna is not told. Italy has decided who it will be when the war comes, and has decided it in advance and at a price."
 ITA_end_the_word_kept: "The Word Kept"
 ITA_end_the_word_kept_desc: "The Triple Alliance is thirty years old, the staff talks are current, and Italy marches with Berlin and Vienna because it said it would. Half the Chamber thinks this is madness and the irredentists think it is treason, but no chancellery in Europe will ever again say that an Italian signature means nothing."
 ITA_end_out_by_our_own_decision: "Out, by Our Own Decision"
 ITA_end_out_by_our_own_decision_desc: "Not neutrality bought, not neutrality forced, and not neutrality from weakness: a kingdom that could have gone either way and told both sides no. The factories keep running, the emigrants keep their sons, and Italy will be present at the peace as the one power with nothing to explain and nothing to claim."
 ITA_end_the_kingdom_by_decree: "The Kingdom by Decree"
 ITA_end_the_kingdom_by_decree_desc: "Public safety decrees, prefects with a free hand, garrisons quartered in the industrial towns, and a Chamber that meets when it is convenient. It works. Taxes are collected, order is kept, and the ministry can do in a week what used to take a session. Nobody has a word for this yet. Everyone can feel that it does not bend."
 ITA_end_the_ministry_of_the_sword: "The Ministry of the Sword"
 ITA_end_the_ministry_of_the_sword_desc: "A general at the Interior, a general at the Council, and the Carabinieri answering to both. The army has stopped being the last argument of the state and become its ordinary one, which is a thing armies enjoy for about four years."
 ITA_end_the_civil_mask: "The Civil Mask"
 ITA_end_the_civil_mask_desc: "A lawyer at the Interior, a professor at Public Instruction, and every decree countersigned by a man in a frock coat. The powers are exactly the same. The photographs are different, and in Italy the photographs have always mattered more than anybody admits."
 ITA_end_the_chamber_recalled: "The Chamber Recalled"
 ITA_end_the_chamber_recalled_desc: "The deputies come back to a building they had stopped visiting, and spend the first four sittings on the question of who is to blame. The decrees are lifted one by one. It costs the ministry every friend it had in the prefectures, and it is the only thing that stops the country coming apart."
 ITA_end_the_ministry_of_the_left: "The Ministry of the Extreme Left"
 ITA_end_the_ministry_of_the_left_desc: "The first socialist ministry in Europe, made by a franchise the liberals themselves granted. It will not arm, it will not ally, and it will not send a single class to a war it did not choose. Every embassy in Rome has been instructed to treat the kingdom, for the moment, as a country that is not there."
 ITA_end_the_party_splits: "The Party Splits"
 ITA_end_the_party_splits_desc: "Bissolati took office and Mussolini took the newspaper, and by autumn there are two socialisms in Italy that will not sit in the same hall. The ministry survives on the votes of men who despise it, which in this Chamber is not unusual and is never comfortable."
 ITA_end_the_price_abroad: "The Price Paid Abroad"
 ITA_end_the_price_abroad_desc: "The columns are off the caravan roads, the ascari are paid off, and the consulates report that the kingdom's word is being discounted from Constantinople to Addis Ababa. This is what neutrality cost, and it was always going to be charged somewhere other than at home."
 ITA_end_the_pledge_we_kept: "The Pledge We Kept"
 ITA_end_the_pledge_we_kept_desc: "Rhodes and the twelve islands were taken as security and are not being given back, whatever was promised at Ouchy and whatever the Porte says now. A socialist ministry holding a conquest it voted against is a thing the cartoonists will not let go of."
 ITA_end_the_state_after_the_rising: "The State After the Rising"
 ITA_end_the_state_after_the_rising_desc: "Ten days, four provinces, and something over a hundred dead before the columns had the railway junctions back. The kingdom that came out of the Romagna is not the kingdom that went in: it knows now exactly what it is prepared to do, and so does everybody else."
 ITA_end_the_provinces_that_left: "The Provinces That Left"
 ITA_end_the_provinces_that_left_desc: "Ancona, Ravenna, Forli, and half the Marche are administered by committees the prefects cannot name. Taxes are not remitted, conscripts are not delivered, and the ministry has decided that the honest word for the situation is one it will not use in the Chamber."
 ITA_end_the_ministry_from_the_streets: "The Ministry from the Streets"
 ITA_end_the_ministry_from_the_streets_desc: "The King sent for the men whose arrest he had authorised the previous week, and they came. The rising ends because the government becomes the thing it was raised against. It is the cheapest way this could have ended and there is not a colonel in the kingdom who will forgive it."
 ITA_end_the_kingdom_that_came_out_of_it: "The Kingdom That Came Out of It"
 ITA_end_the_kingdom_that_came_out_of_it_desc: "Whatever was decided in those ten days is now simply how Italy is governed, and the argument about it has moved from the streets into the histories. A state that has survived its own worst week has a certain hardness afterwards, and pays for it in every other way."
 ITA_end_the_crown_that_would_not_sign: "The Crown That Would Not Sign"
 ITA_end_the_crown_that_would_not_sign_desc: "The King refused a second state of siege and let a ministry fall rather than sign it. It is the only genuinely popular act of his reign and it has cost him the confidence of the General Staff, the prefects, and his own household."
 ITA_end_the_army_that_cannot_come_home: "The Army That Cannot Come Home"
 ITA_end_the_army_that_cannot_come_home_desc: "Fifty thousand men between Tripoli and the Fezzan, holding wells against people who do not need to hold anything. Italy is a great power with an army it cannot move, and every chancellery in Europe has done the arithmetic and written Rome off for the season."
 ITA_end_next_year_in_the_fezzan: "Next Year in the Fezzan"
 ITA_end_next_year_in_the_fezzan_desc: "Another column, another oasis, another dispatch promising that the interior will be pacified before the rains. The troops learn a great deal about desert marching, the treasury learns nothing at all, and the phrase has become a joke in the Chamber that nobody laughs at."
 ITA_end_the_coast_only: "The Coast Only"
 ITA_end_the_coast_only_desc: "Five towns, a garrison in each, and a line on the map that stops where the guns of the fleet stop. It is not the fourth shore that was promised from a hundred platforms, but the men are back within reach of a transport and the ration returns fit on one page."
 ITA_end_the_staff_that_was_overruled: "The Staff That Was Overruled"
 ITA_end_the_staff_that_was_overruled_desc: "The General Staff asked for two more divisions and one more year and was refused by civilians, in writing, with reasons. They have kept the copy. Every failure of the next decade will be explained by reference to it, whatever the actual cause turns out to be."
 ITA_end_the_columns_that_came_home: "The Columns That Came Home"
 ITA_end_the_columns_that_came_home_desc: "Battalions off the transports at Naples and Taranto, thin, yellow, and quiet, marching through towns that had been told for two years they were winning. The army is available again. What it is available for is now a much harder question to answer in public."
 ITA_end_the_decade_in_the_sand: "The Decade in the Sand"
 ITA_end_the_decade_in_the_sand_desc: "The best infantry in the kingdom has spent its whole service escorting water. They can march, they can shoot, and they cannot be brought to Europe inside a year. Nobody in Rome will say aloud that Libya has cost Italy the only decade that mattered."
 ITA_end_the_accidental_ministry: "The Accidental Ministry"
 ITA_end_the_accidental_ministry_desc: "Nothing was settled, so a ministry took office that nobody voted for, led by a man nobody chose, resting on a majority that was assembled in a corridor. It will do for the ordinary business of the kingdom. The crisis that is coming is not the ordinary business of the kingdom."
 ITA_end_the_men_in_the_room: "The Men in the Room"
 ITA_end_the_men_in_the_room_desc: "Four signatures, no debate, and the Chamber informed afterwards by telegram. Italy can be committed to anything in a fortnight now, which is exactly the argument for the arrangement and exactly the reason the country will not stand behind whatever is decided."
 ITA_end_the_old_man_recalled: "The Old Man Recalled"
 ITA_end_the_old_man_recalled_desc: "Giolitti comes back the way he always comes back: without a programme, without a speech, and with a list of names. The machine turns over on the first attempt. He will not take the kingdom to war, and he has never once in his life explained himself."
 ITA_end_reckoning_tt: "The verdict on the decade will be taken."
 ITA_end_readout_tt: "§YThe Piazza stands at [?ITA_piazza|0]. The majority stands at [?ITA_majority|0], of which [?ITA_majority_bought|0] was bought. The army has been called out [?ITA_bayonets|0] times.§!"
 ITA_end_free_hand_tt: "Italy may enter or make a faction, and may send volunteers, at its own choosing."
 ITA_end_neutral_lock_tt: "Italy may not join or create a faction, and may not declare war without a war goal."
 ITA_end_chamber_dead_tt: "The Chamber no longer governs. The majority is a formality."
 ITA_end_bargain_london_tt: "The terms are noted and not written where anyone can read them."
 ITA_end_word_kept_tt: "The alliance holds, and the irredentists will not forgive it."
 ITA_end_out_by_choice_tt: "Italy stands out of the coming war by its own decision, and says so first."
 ITA_end_islands_returned_tt: "The Dodecanese returns to the Porte."
 ITA_end_islands_kept_tt: "The islands are kept, against everything the ministry stood for."
 ITA_end_provinces_go_tt: "Emilia Romagna, Abruzzo and Tuscany pass out of the government's control."
 ITA_end_put_down_tt: "The rising is broken by the army. The Piazza falls to 30 and will never again fall below 35."
 ITA_end_libya_closed_tt: "The war in Libya is closed. The army is available again."
 ITA_t_the_hunt_costs_a_bayonet_tt: "§RThe hunt for Bresci's accomplices puts troops into the working quarters.§! A §Rbayonet§! is spent, and the Piazza will never again fall below where it now stands."
 ITA_t_the_law_is_enough_tt: "§GThe law is allowed to be enough.§! The prefects are told to make no arrests they cannot justify to a magistrate, and the Chamber notices."
 ITA_t_the_question_is_put_tt: "§YThe ministry must answer the Genoa decree.§! What it answers depends on whether the street is already up."
 ITA_t_the_port_is_shut_tt: "§RThe port is shut and the ministry gives way.§! The decree is withdrawn, the prefect is transferred, and ninety prefectures learn that a general strike works."
 ITA_t_the_prefect_is_sustained_tt: "§GThe prefect is sustained.§! The decree stands, the machine gains a lever it will use for a decade, and the Extreme Left has its argument for the next twenty years."
 ITA_t_the_price_of_the_quays_tt: "§RThe coal quays at Genoa are worked by men who now know what they are worth.§! The Chamber is asked to vote money for water it cannot see."
 ITA_t_the_roads_before_us_tt: "§YFive roads lead out of Adwa:§! the §Rarmy§!, the §Bfleet§!, the §GChamber§!, the §Gcountry beneath the state§!, and the §YConsulta§!. The estimates will not stretch to all of them."
 ITA_t_the_answer_at_genoa: "The Answer at Genoa"
 ITA_t_the_answer_at_genoa_desc: "Whatever the ministry said about the Genoa decree is being read aloud in ninety prefectures, and nobody in Italy is quite sure yet what it will mean when the next port stops."
 ITA_t_the_three_memoranda: "The Three Memoranda"
 ITA_t_the_three_memoranda_desc: "The War Ministry, the Marine and the Treasury have each sent the King a paper explaining why the others should be cut. Until one of them is chosen, every department is spending the same lira twice on paper."
 ITA_t_luzzatti_at_the_treasury: "Luigi Luzzatti"
 ITA_t_luzzatti_at_the_treasury_desc: "The banker who founded the people's banks and has balanced more budgets than any man in the Chamber. He will find the money, and he will tell you exactly whose it was."
 ITA_a_the_book_carried_over_tt: "§GThe trunk book does not simply vanish.§! A third of the ninety prefectures carry over into the §Ystanding machine§! the new ministry inherits."
 ITA_a_genoa_is_remembered_tt: "§GThe ministry that gave way at Genoa is trusted a little further.§! The street comes down before the new Chamber sits."
 ITA_a_genoa_is_remembered_badly_tt: "§RThe ministry that sustained the prefect at Genoa opens with an enemy already organised.§! It has political power and it has no goodwill."
 ITA_a_the_machine_carries_it_tt: "§YThe prefects deliver the neutral state's majority§!, which means it is owed favours it has not yet been asked for."
 ITA_a_the_bargain_is_made_in_the_lobby_tt: "§GWithout a machine, the arrangement is made group by group in the lobby.§! It is cheaper and it is less reliable."
 ITA_a_nitti_at_the_board_tt: "Francesco Saverio Nitti becomes available as a political advisor."
 ITA_a_nitti_at_the_board: "Nitti at the Board of Trade"
 ITA_a_nitti_at_the_board_desc: "The Southern economist who counted what the North had taken and published the figure. He is not popular in Milan and he is entirely correct."
 ITA_a_the_street_answers_sonnino_tt: "§RThe street answers the Statuto before the Chamber can.§! A §Rbayonet§! is spent putting the answer down."
 ITA_a_the_country_is_quiet_enough_tt: "§GThe country is quiet enough to be governed from the antechamber§!, and the prefects are told so in writing."
 ITA_a_salandra_on_the_right: "Salandra on the Right"
 ITA_a_salandra_on_the_right_desc: "A Puglian professor of administrative law who believes the Statuto meant what it said. Courteous, immovable, and convinced the Chamber is a nuisance the Crown tolerates."
 ITA_a_turati_has_somewhere_to_stand_tt: "§GThe chambers of labour give Turati an address the ministry can negotiate with.§! The offer means something because there is somebody to accept it."
 ITA_a_the_offer_is_made_to_nobody_tt: "§RThe offer is made to a party with no legal existence.§! The maximalists read it out at the congress as proof of what the state wants from them."
 ITA_a_bonomi_at_the_door: "Bonomi at the Door"
 ITA_a_bonomi_at_the_door_desc: "A reformist who will take a portfolio and be expelled for it, and who is worth more inside the ministry than his party will ever admit."
 ITA_a_pledges_given_tt: "§YPledges outstanding: [?ITA_pledges|0]§!. Each one comes due within the year, and comes due badly if there is nothing built to show for it."
 ITA_a_the_circular_only_confirms_it_tt: "§GThe prefects were already instructed by the society ministry.§! The circular only puts a signature on a practice, and costs nothing to send."
 ITA_a_the_ninety_are_written_to_tt: "§RNinety prefectures are told in writing which mayor is to be sustained.§! Somebody will read the circular aloud one day."
 ITA_a_the_garrisons_come_out_tt: "§GA garrison comes out of the industrial quarters.§! A §Gbayonet is returned§!, and the Piazza's floor drops with it."
 ITA_a_nothing_to_withdraw_tt: "§GThere were no troops in the disputes to withdraw.§! The declaration costs nothing and is believed."
 ITA_a_the_two_neutralities_agree_tt: "§GThe Chamber and the ministry are saying the same thing about strikes for once.§! The arbitration boards are actually used."
 ITA_a_a_bayonet_is_spent_tt: "§RA bayonet is spent.§! Troops used against Italians raise the floor under the Piazza permanently, and the endings will count them."
 ITA_a_dissolving_what_we_recognised_tt: "§RThe decrees dissolve associations the Kingdom recognised by law last session.§! The socialists no longer have to argue that the state is not neutral."
 ITA_a_the_prefects_had_the_lists_ready_tt: "§GThe prefects already had the lists.§! Dissolution is a morning's work and nobody outside the quarter hears about it for a week."
 ITA_a_a_ministry_without_a_chamber_tt: "§RThe Chamber will not carry the estimates and is not asked to.§! The ministry loses a paid arrangement and the street takes note."
 ITA_a_the_groups_are_informed_tt: "§GThe groups are informed after the fact and accept it.§! The prefects are the reason why."
 ITA_a_the_census_wrote_the_rolls_tt: "§GThe published figures wrote the new registers.§! Nobody can claim the rolls were drawn to suit the ministry, because they were drawn before it knew what it wanted."
 ITA_a_nobody_knows_who_the_voters_are_tt: "§RSix million names go onto the rolls and nobody in Rome knows what they will do.§! Neither does anybody in Milan."
 ITA_a_the_register_reprinted: "The Register Reprinted"
 ITA_a_the_register_reprinted_desc: "The electorate has quadrupled and every arrangement made with the old one is now worth a fraction of what was paid for it. The prefects are rewriting a book they had spent a decade perfecting."
 ITA_a_the_chambers_deliver_the_votes_tt: "§GThe recognised chambers of labour deliver the reformist votes as promised.§! The arrangement holds because both sides can be held to it."
 ITA_a_a_promise_without_an_address_tt: "§RThe reformists promise support the ministry has no way to collect.§! It is worth political power and very little else."
 ITA_a_the_act_is_already_on_the_book_tt: "§GThe society ministry already carried the special laws.§! This vote is the appropriation, not the act, and it passes in an afternoon."
 ITA_a_the_north_pays_for_it_tt: "§RThe Northern estimates carry the Southern works.§! Lombardy's deputies will say so at every reading."
 ITA_a_a_counterparty_with_an_address_tt: "§GThe Council of Labour sits with organisations that legally exist.§! Disputes are recorded rather than suppressed."
 ITA_a_an_office_that_counts_strangers_tt: "§RThe office counts strikes by bodies the law does not recognise.§! It is a good statistical service and nothing more."
 ITA_a_facta_at_the_council: "Facta at the Council"
 ITA_a_facta_at_the_council_desc: "An amiable Piedmontese lawyer who can be relied upon to keep a room calm, and to be in that room when it matters less than he thinks."
 ITA_a_no_pledge_survives_a_decree_tt: "§REvery pledge given to the Chamber lapses when the Chamber stops deciding.§! Nobody is owed anything, and nobody owes us anything either."
 ITA_a_the_provinces_stop_answering_tt: "§RTwo provinces stop answering Rome altogether.§! Government by decree has reached the point where there is nothing to decree at."
 ITA_a_the_country_does_not_notice_yet_tt: "§GThe country is quiet and the decrees pass unread.§! The prefects gain everything the Chamber lost."
 ITA_a_the_order_is_used_at_once_tt: "§RThe standing order is used within the month.§! A §Rbayonet§! is spent and the quarter remembers the name of the regiment."
 ITA_a_the_order_lies_in_the_drawer_tt: "§GThe order lies unused in every prefecture.§! It is worth more there than it would be in the street."
 ITA_a_the_po_landowners_withdraw_tt: "§RThe grain growers of the Po withdraw from the government's arrangement.§! The machine loses its most reliable province."
 ITA_a_the_south_can_afford_it_tt: "§GThe South has water and roads and can survive the loss of the tariff.§! Bread falls and nothing else does."
 ITA_a_the_treasury_loses_a_certainty_tt: "§RThe Treasury loses its one certainty and the South gets nothing else in exchange.§! Bread is cheaper in provinces with no road to carry it."
 ITA_a_he_sits_beside_the_men_who_fired_tt: "§RThe socialist minister takes his seat beside colleagues who signed the orders to fire.§! His own party will not let him forget it."
 ITA_a_no_blood_between_them_tt: "§GThere is no blood between the ministry and the party it has just taken in.§! The arrangement is survivable."
 ITA_a_the_provinces_did_not_wait_tt: "§YThe parish committees have already been voting for two years.§! Rome is being asked to bless an arrangement the prefects made themselves."
 ITA_a_the_right_asks_first_tt: "§YSonnino's ministry asks the question, which is not the ministry Rome expected to hear from.§! The answer will be warmer for it."
 ITA_a_the_prefects_are_told_quietly_tt: "§YNothing is asked of Rome and nothing is promised.§! The prefects are told a Catholic committee is not an unlawful assembly, and that is the whole of the policy."
 ITA_a_boselli_between_the_two_romes: "Boselli Between the Two Romes"
 ITA_a_boselli_between_the_two_romes_desc: "An old Ligurian liberal trusted by the Quirinale and tolerated by the Vatican, which in this kingdom is a rarer qualification than competence."
 ITA_a_the_same_ninety_seats_tt: "§RThe parish committees already hold these seats.§! Rome's permission buys nothing that was not bought, and the bishops now expect to be paid twice."
 ITA_a_ninety_seats_change_hands_tt: "§GSeats change hands across the north without a single voter changing his mind.§! Both sides deny that any understanding exists."
 ITA_a_the_countryside_owes_us_nothing_tt: "§RThe rural banks, the leagues and the mutual societies stay outside the Kingdom entirely.§! The prefect has nothing to offer them and no hold on them."
 ITA_a_the_provinces_disobey_rome_tt: "§YThe parish committees keep voting after Rome forbids it.§! The seats are ours and the bishops are furious with everyone."
 ITA_a_the_leagues_stay_outside_tt: "§RThe countryside is organised by men who owe the state nothing at all.§! Some of them are socialists and some of them are priests."
 ITA_a_the_works_are_already_standing_tt: "§GThe aqueducts and the roads already exist.§! The Southern question is answered with a ledger instead of a promise, and one pledge is redeemed."
 ITA_a_promised_again_from_rome_tt: "§RThe South is promised works again by a ministry that has not built any.§! The deputies vote for it and expect to be paid."
 ITA_a_a_majority_resting_on_bayonets_tt: "§RThe settlement rests on troops as much as on votes.§! Everyone in the Chamber knows it and the country outside knows it better."
 ITA_a_a_majority_that_can_be_counted_tt: "§GA ministry can count its votes before it asks for them, and has not fired on anybody to get them.§! The King is popular for the first time since Monza."
 ITA_e_the_returns_are_written_to_suit_tt: "§RThe prefects return the figures the ministry wants.§! The census is worth less than it cost and the machine is trusted less for it."
 ITA_e_the_figures_come_back_honest_tt: "§GThe returns come back honest because nobody had a reason to cook them.§! Rome learns what Italy actually is."
 ITA_e_daneo_at_public_instruction: "Daneo at Public Instruction"
 ITA_e_daneo_at_public_instruction_desc: "The minister who took the elementary schools off the communes and onto the state's own rolls. Half of Italy will read because of a man nobody remembers."
 ITA_e_the_valleys_are_bought_tt: "§RThe high valleys are bought out from under the communes that grazed them.§! Nobody in Rome hears the objection."
 ITA_e_the_south_was_paid_first_tt: "§GThe South was paid before the grid was strung.§! The Southern deputies vote the transmission credits without a division."
 ITA_e_every_kilometre_north_of_the_po_tt: "§REvery kilometre of it runs north of the Po and the Chamber can read a map.§! The Southern vote is bought with a promise instead of a road."
 ITA_e_the_plate_is_ours_tt: "§YA kingdom that buys its armour in Sheffield owns no armour at all.§! Terni is dear and it is ours."
 ITA_e_the_navy_signs_the_order_tt: "§GThe Marine signs the plate order it has been promising since 1887.§! The works run full and the constructors get Italian steel."
 ITA_e_the_works_wait_for_a_customer_tt: "§RThe only customer for armour plate has not opened its estimates.§! Terni rolls rail and shell steel and waits."
 ITA_e_the_fitters_of_turin_tt: "Turin's trained fitters become the Kingdom's industrial reserve."
 ITA_e_the_quarter_has_a_committee_tt: "§GThe new quarter has a recognised chamber of labour before it has a grievance.§! The disputes are argued instead of fought."
 ITA_e_thirty_thousand_in_one_quarter_tt: "§RThirty thousand men are gathered into one quarter of one city with no legal way to complain.§! They will find another."
 ITA_e_the_communes_lose_their_pasture_tt: "§RWhole communes are told the pasture is now a lake the state has bought.§! The compensation is calculated in Rome."
 ITA_e_the_current_stops_failing_in_august_tt: "§GThe reservoirs hold the melt and the mills keep turning through a dry August.§! The whole white-coal argument is finally proved."
 ITA_e_the_leash_goes_slack_tt: "§GA strike in Cardiff no longer banks the furnaces of the triangle.§! The ministry can say so in the Chamber and be believed."
 ITA_e_no_longer_on_paper_tt: "§GItaly stops being a great power on paper.§! The industrial base finally matches the flag flown over it."
 ITA_e_the_bill_is_already_law_tt: "§GThe Chamber has already voted the special laws.§! This is the works programme, and it starts on ground that has been surveyed."
 ITA_e_the_deputies_want_the_credit_tt: "§YThe government deputies take the credit for the laws and the prefects collect on it.§! It is how the South has always been governed."
 ITA_e_the_cheapest_army_tt: "§GTwo million Italians a year stop losing their working season to the fever.§! It is the cheapest army this kingdom will ever raise."
 ITA_e_the_census_named_the_districts_tt: "§GThe census named the malarial districts and the quinine goes where it is needed.§! The mortality figures move within two years."
 ITA_e_the_shops_sell_where_they_can_tt: "§RThe tobacco shops sell state quinine wherever there is a tobacco shop§!, which is not where the fever is."
 ITA_e_the_pumps_have_current_tt: "§GThe Sele aqueduct is pumped with Alpine current.§! Puglia gets water that does not depend on a wet winter."
 ITA_e_the_sele_is_a_long_way_off_tt: "§RThe aqueduct is surveyed, costed and begun, and nobody alive will see it finished on this vote.§! The pledges are given anyway."
 ITA_e_the_promises_are_redeemed_tt: "§GPledges made to the Southern deputies are redeemed in concrete.§! For once the Chamber is owed nothing."
 ITA_e_they_stayed_and_it_was_worth_it_tt: "§GThe men who did not sail have ground worth staying on.§! The land reform is vindicated in the census returns."
 ITA_e_the_ships_still_leave_tt: "§YThe works are built and the ships still leave, only fuller of men who mean to come back.§! It is not defeat and it is not victory."
 ITA_e_the_number_is_printed_tt: "§RSix hundred thousand a year is now a published figure.§! Every opposition paper in Italy runs it above the fold."
 ITA_e_the_number_is_an_estimate_tt: "§GThe figure stays an estimate the ministry can argue with.§! Nobody is quite obliged to answer for it yet."
 ITA_e_a_consul_at_the_far_end_tt: "§GA consul waits at the far end of every inspected passage.§! The agents lose the traffic and the emigrants keep their fare."
 ITA_e_the_landowners_break_with_us_tt: "§RThe great landowners of the South break with the government.§! The machine loses the men who used to deliver its Southern seats."
 ITA_e_they_have_lost_twice_tt: "§RThe landowners lost the grain duty and are now losing the estates.§! They will fight every clause and finance the fight."
 ITA_e_they_still_have_the_tariff_tt: "§YThe landowners keep the grain tariff and lose only the idle ground.§! They fight, but they fight for less."
 ITA_e_our_blood_beyond_the_sea: "Our Blood Beyond the Sea"
 ITA_e_our_blood_beyond_the_sea_desc: "Four million Italians in Argentina, Brazil and the United States, with Italian schools, Italian chambers of commerce and consuls who answer to the Consulta. They are not a lost population any more. They are an interest abroad, and one day somebody will ask them for something."
 ITA_e_water_first_then_grain_tt: "§GThe aqueduct came before the plough and the ground holds the water it is given.§! A pledge is redeemed in grain."
 ITA_e_dry_ground_stays_dry_tt: "§RThe estates are broken up and the ground is still dry.§! The families that stay will have a harder decade than the ones that sailed."
 ITA_e_neutrality_under_sonnino_tt: "§RA ministry that restored the Statuto now announces it will not take sides in strikes.§! Nobody in Italy believes a word of it and the Right is furious anyway."
 ITA_e_neutrality_under_the_bloc_tt: "§GThe Popular Bloc's ministry is believed when it says the army will stay in barracks.§! The strikes get shorter."
 ITA_e_neutrality_as_giolitti_meant_it_tt: "§GNeutrality announced by the man who invented the policy.§! It is taken at face value in Milan and in the Chamber."
 ITA_e_the_guns_are_remembered_tt: "§RThe declaration is read out in quarters where the army has already fired.§! It is received as an insult rather than a concession."
 ITA_e_the_prefect_loses_a_lever_tt: "§RRecognised chambers of labour cannot be dissolved by a prefect's signature.§! The machine loses a lever it used every session."
 ITA_e_recognition_after_a_volley_tt: "§GRecognition comes after the shooting and is accepted as an apology.§! A garrison comes out of the quarter."
 ITA_e_recognition_before_a_volley_tt: "§GRecognition comes before anybody has been shot, which is why it works.§! The chambers negotiate rather than agitate."
 ITA_e_the_hall_that_is_unavailable: "The Hall That Is Unavailable"
 ITA_e_the_hall_that_is_unavailable_desc: "There is always a reason. The roof is unsafe, the licence has lapsed, the previous meeting left damage. The prefecture never forbids anything and the meeting never happens, and every man turned away at the door tells forty others."
 ITA_e_the_neutral_state_looks_away_tt: "§RThe ministry that promised neutrality is caught doing this in its own name.§! The reformists it courted read the file aloud."
 ITA_e_nobody_pretended_otherwise_tt: "§GThis ministry never claimed to be neutral, so nothing is exposed.§! The prefects work and the Chamber says nothing."
 ITA_e_the_teacher_is_appointed_from_rome_tt: "§RThe schoolmaster stops being the mayor's man and becomes the state's.§! The prefect loses a place he could always fill."
 ITA_e_the_bishops_ask_about_the_inspectors_tt: "§RThe bishops who delivered the seats want to know who inspects the schools.§! A pledge is spent answering them and the answer satisfies nobody."
 ITA_e_the_communes_are_relieved_tt: "§GThe poorest communes are relieved of a charge they could never carry.§! Nobody objects because nobody is losing anything."
 ITA_e_rome_already_conceded_it_tt: "§RRome has already lifted the ban nationally.§! The parish arrangement now buys seats the Kingdom had been given for nothing."
 ITA_e_the_committee_acts_without_rome_tt: "§GThe parish committees act without waiting for Rome and deliver anyway.§! The prefects gain a curate in every commune."
 ITA_e_the_account_is_settled_tt: "§GThe pledges given across the decade are written off against what was actually built.§! The Chamber is owed less than it feared."
 ITA_e_ten_years_without_a_volley_tt: "§GTen years and the army was never turned on Italians.§! There is no floor under the Piazza that we put there ourselves."
 ITA_e_one_country_held_down_tt: "§RThe two Italies are one kingdom and part of it is held down.§! The arithmetic of the endings will remember every bayonet."
 ITA_arm_tt_the_ministry_wants_it_read: "The Ministry means the report to be read, and the prefectures are told so. §YProvinces worked +6§!."
 ITA_arm_tt_the_ministry_wants_it_shelved: "The report is filed with the compliments of the Ministry and no instruction attached."
 ITA_arm_tt_porro_at_the_desk: "Carlo Porro takes the Operations desk and may be appointed as army chief."
 ITA_arm_tt_nava_kept: "Luigi Nava is confirmed at the head of the list and is now formally §Rof the old guard§!."
 ITA_arm_tt_diaz_noticed: "Major Armando Diaz is noticed by the examining board and gains §Yorganizer§!."
 ITA_arm_tt_pollio_on_the_list: "Alberto Pollio's name stands high on the reopened list and he may be appointed as army chief."
 ITA_arm_tt_the_lists_agree: "The emigration registers and the conscription registers are the same registers. §Y8000 men§! answer who would not have been found."
 ITA_arm_tt_the_class_sailed: "No register was kept and the class has sailed. §R4000 men§! are struck off and the quarters they came from are read aloud in the Chamber."
 ITA_arm_tt_the_prefects_guess: "With no emigration office the prefects estimate the class, as they have every year since unification."
 ITA_arm_tt_a_pledge_is_given: "A public work is promised to buy the vote. §YPromises outstanding +1§!; the Chamber will remember when it is not delivered."
 ITA_arm_tt_the_duty_confirmed: "§RThe circular confirms the duty.§! The army remains available to the prefects. Bayonets §Y+1§!: the floor of the piazza rises permanently."
 ITA_arm_tt_the_duty_refused: "§GThe circular writes the army out of the streets.§! The prefects must find another instrument, and are given twenty more provinces to work."
 ITA_arm_tt_three_years_taught: "Three years with the colours is long enough to teach a man to read and to drill him afterwards."
 ITA_arm_tt_two_years_taught: "Two years with the colours leaves time for the drill or the alphabet, and the inspectors want the drill."
 ITA_arm_tt_the_schools_help: "The Kingdom's schools have already done half of it, and the regiment is handed literate recruits for the first time."
 ITA_arm_tt_the_regiment_teaches_alone: "There are no state schools worth the name, so the regiment teaches the alphabet out of its own drill hours."
 ITA_arm_tt_pecori_to_the_alps: "Guglielmo Pecori Giraldi is sent to the north-eastern command and learns the ground: §Ytrait_mountaineer§!."
 ITA_arm_tt_the_ally_is_the_enemy: "§RThe Consulta is renewing an alliance the General Staff has just written a war against.§!"
 ITA_arm_tt_the_gun_is_ours_batteries: "The Turin and Ansaldo lines are already tooled and the mule gun comes off them in a year."
 ITA_arm_tt_the_gun_is_bought_batteries: "Every mountain barrel comes from Essen with a bill attached and a delivery date the Chamber must vote again."
 ITA_arm_tt_the_alpini_take_the_guns: "The Alpini have an establishment to hang the batteries on, and the mountain divisions are complete."
 ITA_arm_tt_vienna_up_6: "Vienna's confidence in Rome rises by §G6§!: an army looking at Africa is not an army looking at the Isonzo."
 ITA_arm_tt_the_treaty_embarrasses: "The Kingdom has just guaranteed Menelik's borders and is now voting an army to cross them."
 ITA_arm_tt_the_debt_is_open: "Adwa is left on the books as a debt, and the officer corps is told in public that it will be collected."
 ITA_arm_tt_pollio_stays: "Alberto Pollio is confirmed as chief of the army staff and keeps his defensive plans on the books."
 ITA_arm_tt_spingardi_reorganizes: "Paolo Spingardi takes the high command desk and puts the ministry's contracts ahead of the front."
 ITA_arm_tt_cadorna_takes_the_staff: "Luigi Cadorna is named chief of the army staff and orders the offensive he has been demanding."
 ITA_arm_tb_the_continuity_school: "The Continuity School"
 ITA_arm_tb_the_administrators_office: "The Administrator's Office"
 ITA_arm_tb_the_offensive_school: "The Offensive School"
 ITA_arm_pollio_confirmed: "Pollio, Chief of the Staff"
 ITA_arm_spingardi_confirmed: "Spingardi, at the Ministry"
 ITA_arm_cadorna_confirmed: "Cadorna, Chief of the Staff"
 ITA_arm_tt_the_battalions_are_doubled: "The Eritrean depot already exists; this is a second levy on the same highlands, not a new army."
 ITA_arm_tt_the_battalions_are_raised: "The Eritrean battalions are raised, paid and given a depot at Massawa."
 ITA_arm_tt_the_strike_against_the_war: "§RThe quarters strike against the landing and the strike is broken.§! Bayonets §Y+1§!."
 ITA_arm_tt_the_ascari_land_first: "The ascari battalions go ashore first, as they always have, and the metropolitan brigades follow."
 ITA_arm_tt_the_marine_was_waiting: "The Ministry of Marine had the estimate drawn up before the cabinet met."
 ITA_arm_tt_nobody_asked_for_it: "There is no naval programme to hand the difference to, so it goes back to the Treasury and buys a majority instead."
 ITA_arm_tt_the_short_service_pays: "Two years with the colours and a kept index make the cadre system arithmetic rather than a hope."
 ITA_arm_tt_the_long_service_resists: "Three years with the colours and a smaller establishment are the same argument twice, and the colonels say so."
 ITA_arm_tt_spingardi_signs_it: "Paolo Spingardi signs the establishment and may be appointed to the high command."
 ITA_arm_tt_the_verdict_is_remembered: "The army that lost Adwa is now the army that lost the estimates, and every mess in the Kingdom says so."
 ITA_arm_tt_the_corps_takes_it_quietly: "The verdict of Adwa has already been answered, so the corps takes the cut as a matter of arithmetic."
 ITA_arm_tt_frugoni_takes_the_cut: "Pietro Frugoni is left to administer the reduction and grows §Ytrait_cautious§!."
 ITA_arm_tt_nava_retired: "Luigi Nava is retired from the active list."
 ITA_arm_tt_diaz_promoted: "Armando Diaz is promoted over three seniors and gains §Yorganizer§!."
 ITA_arm_tt_pollio_confirmed: "Alberto Pollio is confirmed as Chief of the General Staff by seniority and may be appointed as army chief."
 ITA_arm_the_frontier_threat: "Italy surveys the Alpine frontier"
 ITA_arm_the_northeastern_threat: "Italy deploys its army to the north-east"
 ITA_arm_the_cadore_threat: "Italy fortifies the Cadore"
 ITA_arm_the_landing_threat: "Italy prepares a landing in Tripolitania"
 ITA_arm_tb_the_ansaldo_line: "The Ansaldo Line"
 ITA_arm_tb_the_second_levy: "The Second Levy"
 ITA_arm_tb_the_slipways_at_castellammare: "The Slipways at Castellammare"
 ITA_arm_tb_the_marine_takes_the_vote: "The Marine Takes the Vote"
 ITA_arm_tb_the_northeastern_regulations: "The North-Eastern Regulations"
 ITA_arm_tb_the_colonial_regulations: "The Colonial Regulations"
 ITA_n_tt_the_army_paid_for_this: "The army gave up its share and the second erecting shop is roofed out of it."
 ITA_n_tt_the_chamber_paid_for_this: "Nobody has given anything up, so the ways are lengthened out of the ordinary vote and the deputies notice."
 ITA_n_tt_the_estimates_are_there: "The estimates crossed the corridor last year; the ship is inside the vote already granted."
 ITA_n_tt_the_estimates_are_not_there: "The Chamber is asked for a hull that costs more than any it has voted, with the army's estimates untouched."
 ITA_n_tt_viale_backs_the_ship: "Leone Viale carries the design through the technical committee and may be appointed to the high command."
 ITA_n_tt_vienna_down_4: "Vienna's confidence in Rome falls by §R4§!."
 ITA_n_tt_vienna_down_6: "Vienna's confidence in Rome falls by §R6§!."
 ITA_n_tt_the_study_confirms: "The war game confirms the line of battle the Kingdom is already building, and Livorno says so in print."
 ITA_n_tt_the_study_condemns: "The war game condemns the refusal of 1903 in eleven pages, and the Chamber reads every one of them."
 ITA_n_tt_cagni_reads_it: "Umberto Cagni reads the study twice and comes away a §Ybattleship_adherent§!."
 ITA_n_tt_paladini_takes_the_flotilla: "Osvaldo Paladini takes the night flotilla and gains §Ysuperior_tactician§!."
 ITA_n_tt_revel_takes_her: "Paolo Thaon di Revel is given the ship and becomes a §Ybattleship_adherent§! for the rest of his career."
 ITA_n_tt_the_third_hull_is_voted: "The army's estimates cover the third hull and the Leonardo da Vinci is ordered with her sisters."
 ITA_n_tt_the_third_hull_is_struck: "The committee strikes the third hull out of the programme and the class goes to sea two ships strong."
 ITA_n_tt_the_boats_go_abroad: "Portugal, Brazil and Russia send their orders to Venice, and the arsenal is paid to keep building."
 ITA_n_tt_the_army_already_gave_way: "The army gave up the estimates years ago; the high seas school costs the Chamber nothing new."
 ITA_n_tt_the_army_pays_for_it: "The estimates are taken from the War Ministry without its consent, and the officer corps is told after the vote."
 ITA_n_tt_the_boats_are_the_fleet: "The Venice boats stop being an experiment and become the striking arm of the narrow sea."
 ITA_n_tt_pola_was_already_building: "Vienna stopped trusting us before the credit was voted, and the slips at Trieste were occupied first."
 ITA_n_tt_pola_is_answered: "The programme is answered inside a year and the ally is told, politely, that it was noticed."
 ITA_n_tt_acton_gets_the_squadron: "Alfredo Acton is given the Adriatic squadron and gains §Ysuperior_tactician§!."
 ITA_n_the_cuniberti_threat: "Italy designs the all-big-gun ship"
 ITA_n_the_pola_answer_threat: "Italy answers the Austrian dreadnought programme"
 ITA_n_tb_the_line_of_battle: "The Line of Battle"
 ITA_n_tb_the_flotilla_answer: "The Flotilla Answer"
 ITA_n_tb_the_dante_hull: "The Dante Hull"
 ITA_n_tb_the_cavour_hulls: "The Cavour Hulls"
 ITA_n_tb_the_boats_are_the_fleet: "The Boats Are the Fleet"
 ITA_w_tt_the_ledger_is_not_reopened: "The Consulta opens the ledger it finds and does not write a new first page. Vienna's confidence stands where the Marine left it."
 ITA_w_tt_tittoni_at_the_consulta: "Tommaso Tittoni takes the Palazzo and may be appointed as a political advisor."
 ITA_w_tt_the_base_is_on_the_table: "The Austrian delegation asks what the squadron at Taranto is four hundred miles nearer to."
 ITA_w_tt_the_survey_is_on_the_table: "The Austrian delegation has the Cadore survey, in translation, before the text is initialled."
 ITA_w_tt_vienna_believes_us: "Vienna believes the signature and the military convention is written out in full."
 ITA_w_tt_vienna_does_not_believe_us: "Vienna takes the signature and files it. The Third Army is promised to a staff that no longer counts it."
 ITA_w_tt_the_timetable_is_agreed: "Berlin and Rome settle the railways, the days of mobilisation and the crossing points, and both courts know the figures are real."
 ITA_w_tt_the_timetable_is_not_agreed: "The German staff receives our officers, feeds them well and gives them a timetable it does not intend to use."
 ITA_w_tt_pollio_goes_to_berlin: "Alberto Pollio goes to Berlin himself and may be appointed as army chief."
 ITA_w_tt_the_plan_is_taken_out: "The Isonzo deployment is taken out of the safe and issued, and the claim has a date attached to it."
 ITA_w_tt_the_claim_without_a_plan: "The Kingdom claims three provinces of a great power without a single filed plan for taking them."
 ITA_w_tt_racconigi_is_read: "Vienna has stopped believing us and reads the Racconigi protocol within the month."
 ITA_w_tt_racconigi_stays_quiet: "Vienna still credits Rome, and the protocol stays where the two courts left it."
 ITA_w_tt_tripoli_is_conceded_to_us: "Petersburg concedes Tripolitania in writing in exchange for the Straits, and the file is closed."
 ITA_w_tt_the_depot_already_exists: "The Massawa depot and the establishment already exist; these are reinforcements on an existing strength."
 ITA_w_tt_the_battalions_are_raised: "The Eritrean battalions are raised and given a template of their own."
 ITA_w_tt_the_strike_against_the_expedition: "§RThe quarters strike against the second expedition and the strike is broken.§! Bayonets §Y+1§!."
 ITA_w_tt_the_army_of_africa_marches: "The colonial establishment exists, the supply train works past the last well, and the column marches complete."
 ITA_w_tt_no_army_was_built_for_this: "No colonial army was ever voted, and the column marches with brigades shipped out of Naples."
 ITA_w_tt_the_general_strike_is_broken: "§RThe general strike against the Libyan war is broken by troops.§! Bayonets §Y+1§!."
 ITA_w_tt_the_country_wants_it: "The street is quiet enough that the war is popular before the first shot is fired."
 ITA_w_tt_the_fleet_covers_the_landing: "The high seas school has the hulls and the practice to put a division ashore and keep it supplied."
 ITA_w_tt_the_fleet_cannot_leave: "§RThe fleet was built for the Adriatic and cannot cover an operation outside it.§!"
 ITA_w_tt_vienna_up_8: "Vienna's confidence in Rome rises by §G8§!: a bank is not a landing."
 ITA_w_tt_the_bank_holds_the_province: "Libya is bought rather than stormed. §RThe desert war will never be fought, and the account of it will never be settled.§!"
 ITA_w_tt_the_army_was_promised_a_landing: "An army was voted for Africa and is given a banking concession instead."
 ITA_w_tt_the_pledge_is_kept: "The Aegean islands are held against the signature and quietly not given back."
 ITA_w_tt_nothing_to_hand_back: "Nothing was taken as security, so the Porte signs on our word and keeps its officers in the interior."
 ITA_w_tt_the_army_is_already_there: "The colonial establishment is on the spot and the survey is done by men who live there."
 ITA_w_tt_a_survey_and_nothing_more: "A survey party, two roads and a report. Nothing is garrisoned that was not garrisoned before."
 ITA_w_threat_racconigi_is_read: "Italy bargains with Russia behind its allies"
 ITA_w_threat_the_bank_instead: "Italy buys in Tripoli instead of landing"
 ITA_w_threat_the_fourth_shore: "Italy annexes the Libyan provinces"
 ITA_w_tb_the_convention: "The Military Convention"
 ITA_w_tb_the_plan_is_taken_out: "The Plan Is Taken Out"
 ITA_w_tb_the_second_levy: "The Second Levy"
 ITA_w_tb_the_landing_is_covered: "The Landing Is Covered"
 ITA_end_tt_the_army_looks_north: "The verdict of the decade: §Ythe army was built to fight the ally.§!"
 ITA_end_tt_the_army_looks_south: "The verdict of the decade: §Ythe army was built to collect a debt in Africa.§!"
 ITA_end_tt_the_army_gave_way: "The verdict of the decade: §Ythe army gave up the estimates and the fleet spent them.§!"
 ITA_end_tt_the_fleet_can_leave: "The fleet can leave the Adriatic, and every ministry after this one will be asked why it has not."
 ITA_end_tt_the_sea_was_conceded: "The open sea was conceded in writing, and the coast is fortified because of it."
 ITA_end_tt_vienna_expects_nothing: "Vienna expects nothing from Rome and has written the Third Army out of its plans."
 ITA_end_tt_vienna_still_counts_on_us: "Vienna still counts the Third Army in its order of battle, whatever the Chamber says in public."
 ITA_end_tt_the_count_of_bayonets: "The army has been called out against Italians §Y[?ITA_bayonets|0]§! times, and every prefect knows the number."
 ITA_end_tt_the_barracks_answer: "The circular of the barracks is still in force, so the adjournment is enforced by troops. Bayonets §Y+1§!."
 ITA_end_tt_the_prefects_answer: "The army was written out of the streets, so the adjournment is enforced by prefects and questori alone."
 ITA_end_tt_pelloux_is_recalled: "Luigi Pelloux is recalled to the King's service and may be appointed as a political advisor."
 ITA_end_tt_the_street_waits_and_watches: "The street gives the new ministry a year before it decides anything about it."
 ITA_end_tt_the_columns_are_recalled: "The columns in the Libyan interior are recalled to the coast in the ministry's first week."
 ITA_end_tt_the_barracks_are_remembered: "Every deputy on those benches has a constituent who was shot at by the army, and the list is read out."
 ITA_end_tt_the_estimates_are_cut: "The battle fleet is the first line the new ministry finds in the estimates, and the first it strikes."
 ITA_end_tt_the_army_of_africa_is_recalled: "An army was raised for Africa and is now ordered to come home from it without a battle."
 ITA_end_tt_nobody_built_it_for_this: "Nobody built an army for the interior, so nothing is lost in giving the interior up."
 ITA_end_threat_the_alliance_is_paper: "The Triple Alliance is paper"
 ITA_w_the_military_convention: "The Military Convention"
 ITA_w_the_military_convention_desc: "Vienna and Berlin believed the signature. The Third Army's timetables are printed, the crossing points are surveyed and the staffs exchange officers who are told the truth."
 ITA_w_the_word_that_is_doubted: "The Word That Is Doubted"
 ITA_w_the_word_that_is_doubted_desc: "The treaty is renewed and nobody on the other side of the Alps believes a word of it. Our officers are received in Berlin and shown the timetables the German staff keeps for visitors."
 ita_dnc.860.t: "What Vienna Does With Our Word"
 ita_dnc.860.d: "The Ballhausplatz replies within the month, in the tone reserved for allies. Rome's undertaking is welcomed, noted and, in the covering minute which our black cabinet has read, described as a document of which the second half will not be performed. Somebody in Vienna is very well informed about the Chamber."
 ita_dnc.860.a: "Prove them wrong. Send the staff to Berlin."
 ita_dnc.860.b: "Let them think it. It costs us nothing."
 ita_dnc.862.t: "The Coast and the Interior"
 ita_dnc.862.d: "The treaty is signed and the flag goes up over five towns. Beyond the last palm the Senussi are still where they were, the wells are still theirs, and the officers who negotiated at Ouchy have written a memorandum explaining that autonomy was the only word the Porte would accept. Nobody has told the columns."
 ita_dnc.862.a: "March inland. The province was bought whole."
 ita_dnc.862.b: "Garrison the coast and call it Libya."
 ITA_victor_emmanuel_iii_int: "Vittorio Emanuele III"
 ITA_victor_emmanuel_iii_int_desc: "He came to the throne at thirty over his father's body and spent the reign being underestimated by everyone who met him. The generals call him the little king and take his signature anyway."
 ITADNC_air_the_field_at_centocelle: "The Field at Centocelle"
 ITADNC_air_the_field_at_centocelle_desc: "Wilbur Wright flew before the King and taught two of our officers before he left. We must keep the field, buy the machines and put the motor trade of Turin to work on an engine light enough to fly."
 ITA_o_the_board_of_promotion: "The Board of Promotion"
 ITA_o_the_board_of_promotion_desc: "Advancement is decided by a board applying a written rule, and the rule is on file. The army is better commanded and a good many well-connected colonels are not."
 ITA_o_the_calendar_of_ranks: "The Calendar of Ranks"
 ITA_o_the_calendar_of_ranks_desc: "Seniority decides everything and nobody is offended. The ministry keeps a quiet army and a general staff whose average age rises by one year every year."
 ITA_o_the_school_of_war: "The School of War"
 ITA_o_the_school_of_war_desc: "A staff course built around a problem that can be lost, marked by officers who say so out loud. The corps that come out of it can write an order and read a map."
 ITA_o_the_staff_answers: "The Staff Answers the Crown"
 ITA_o_the_staff_answers_desc: "War plans are made where the Chamber cannot see them and the minister learns of them afterwards. It is efficient and it is one more thing the country has not agreed to."
 ITA_o_the_minister_answers: "The Minister Answers the Chamber"
 ITA_o_the_minister_answers_desc: "Every plan has a signature and the signature belongs to a man who can be questioned on Thursday. Slower, more expensive, and nobody has to guess who is responsible."
 ITA_o_the_pay_of_the_officer: "The Pay of the Officer"
 ITA_o_the_pay_of_the_officer_desc: "A subaltern can live on his pay and marry without a deposit. The candidates stop being only the sons of officers, and the estimates carry a permanent charge."
 ITA_o_the_list_that_is_printed: "The List That Is Printed"
 ITA_o_the_list_that_is_printed_desc: "Who commands what, in what order, and why, printed and public. An officer corps that knows its own shape is worth several divisions of the one that did not."
 ITA_g_the_batteries_rearmed: "The Batteries Rearmed"
 ITA_g_the_batteries_rearmed_desc: "Quick-firing guns on modern carriages, battery by battery, with the drill re-taught each time. The field artillery is finally all of one pattern and all of one century."
 ITA_g_ansaldo_of_genoa: "Ansaldo of Genoa"
 ITA_g_ansaldo_of_genoa_desc: "A second gunmaker who is not the state, with its own drawing office and its own opinion of the estimates. Competition in the tender and thirty thousand men in one valley."
 ITA_g_the_works_retooling: "The Works Are Retooling"
 ITA_g_the_works_retooling_desc: "The shops are being rebuilt around the new lathes and are producing very little while it lasts. Every firm that takes a first artillery order goes through this year."
 ITA_g_the_gun_shop_at_terni: "The Gun Shop at Terni"
 ITA_g_the_gun_shop_at_terni_desc: "The state works roll plate on one side of the yard and bore barrels on the other, and the furnace is paid for twice over. Umbria has a payroll and Rome has a supplier it owns."
 ITA_g_the_heavy_batteries: "The Heavy Batteries"
 ITA_g_the_heavy_batteries_desc: "Howitzers heavy enough to open masonry, with the tractors and the road parties that go with them. Slow to move and impossible to explain to a neighbour as defensive."
 ITA_g_the_shell_that_bursts: "The Shell That Bursts"
 ITA_g_the_shell_that_bursts_desc: "One filling plant, one fuse, one reserve that has actually been counted. The proportion of rounds that do nothing at all falls to something a gunner can plan around."
 ITA_c_the_arma_reinforced: "The Arma Reinforced"
 ITA_c_the_arma_reinforced_desc: "More stations, more men, and a gendarmerie that lives where it works. Public order stops being a task for field batteries, and the annual class is a little smaller."
 ITA_c_the_recruiting_of_the_arma: "The Recruiting of the Arma"
 ITA_c_the_recruiting_of_the_arma_desc: "The new squadrons are being filled from the same classes the line regiments were counting on, and the best non-commissioned officers go first."
 ITA_c_the_guards_of_public_safety: "The Guards of Public Safety"
 ITA_c_the_guards_of_public_safety_desc: "Town guards under the questore, with a stick and a written instruction. Crowds are handled by men whose trade is crowds rather than by conscripts with cartridges."
 ITA_c_the_mobile_squadrons: "The Mobile Squadrons"
 ITA_c_the_mobile_squadrons_desc: "Mounted detachments that can cross a province in a day and do not wait for the assizes. The interior is governed; whether it is governed well is a separate question."
 ITA_c_the_troops_in_barracks: "The Troops Stay in Barracks"
 ITA_c_the_troops_in_barracks_desc: "No prefect may requisition a battalion for public order without the ministry. The regiments train instead of standing in squares, and the palace thinks it a weakness."
 ITA_c_the_oath_not_asked: "The Oath That Is Not Asked"
 ITA_c_the_oath_not_asked_desc: "Two services with two instructions, and a soldier who has not been ordered to fire on his own town in ten years. It shows in the barracks and it shows in the country."
 ITA_c_the_questore_decides: "The Questore Decides"
 ITA_c_the_questore_decides_desc: "The civil authority holds the order and the colonel waits to be asked. Public order is a political act performed by a political officer, which is at least honest."
 ITA_s_the_recruit_who_cannot_read: "The Recruit Who Cannot Read"
 ITA_s_the_recruit_who_cannot_read_desc: "The draft returns are printed by province and the figures are worse than anybody admitted. Training takes longer than it should because the orders have to be read aloud."
 ITA_s_the_regimental_primer: "The Regimental Primer"
 ITA_s_the_regimental_primer_desc: "An hour a day, a book, and an examination before discharge. Men go home able to read, and in the meantime the corporals can be trusted with a written order."
 ITA_s_the_state_pays_the_teacher: "The State Pays the Teacher"
 ITA_s_the_state_pays_the_teacher_desc: "Elementary teachers on the state's rolls, appointed and paid from Rome. The mayor loses a favour, the teacher gains a career, and the school opens in October."
 ITA_s_the_normal_schools: "The Normal Schools"
 ITA_s_the_normal_schools_desc: "Training colleges with paid places and an obligation to serve where sent. The empty posts in the South begin to fill with people who chose the work."
 ITA_s_a_kingdom_that_reads: "A Kingdom That Reads"
 ITA_s_a_kingdom_that_reads_desc: "The conscript reads his orders, the workman reads his contract, the elector reads his paper. Everything the kingdom does becomes cheaper and rather harder to manage."
 ITA_s_the_evening_classes: "The Evening Classes"
 ITA_s_the_evening_classes_desc: "Classes in the barracks and the town halls for men the schools missed. Not elegant, not expensive, and it puts a signature on a great many pay-sheets."
 ITA_m_the_map_of_the_fever: "The Map of the Fever"
 ITA_m_the_map_of_the_fever_desc: "The malarial communes named, mapped and given a station apiece. The men who used to be too sick to work in August are counted, and some of them are counted alive."
 ITA_m_the_ground_drained: "The Ground That Is Drained"
 ITA_m_the_ground_drained_desc: "Ditches, pumps and embankments on the state's account, from the Agro Romano to the Campanian plain. Land that killed people begins to feed them instead."
 ITA_m_the_sulphur_consortium: "The Sulphur Consortium"
 ITA_m_the_sulphur_consortium_desc: "One buyer, one price, the whole output of the island. The trade survives another decade, and every mine owner in the province is now a shareholder in the ministry's policy."
 ITA_m_the_children_out_of_the_mines: "The Children Out of the Mines"
 ITA_m_the_children_out_of_the_mines_desc: "An age fixed, inspectors who may enter a pit, and an end to the advance paid against a boy's back. Less sulphur comes up, and more of it comes up on adult shoulders."
 ITA_m_the_third_class_deck: "The Third-Class Deck"
 ITA_m_the_third_class_deck_desc: "Subsidised lines, inspected decks, and a clause letting the state take the hulls. A merchant marine that carries the emigrants and can be called back in a fortnight."
 ITA_air_the_brigade_of_specialists: "The Brigade of Specialists"
 ITA_air_the_brigade_of_specialists_desc: "A shed, a section and a line in the estimates for balloons, kites and whatever comes next. The cheapest establishment in the army and the only one nobody understands."
 ITA_air_the_airship_park: "The Airship Park"
 ITA_air_the_airship_park_desc: "Semi-rigid dirigibles with a hall, a gas plant and trained crews. They see further than any cavalry patrol and they are at the mercy of an afternoon of weather."
 ITA_air_the_field_at_centocelle: "The Field at Centocelle"
 ITA_air_the_field_at_centocelle_desc: "A flying ground outside Rome, imported machines, and officers learning on them. The engines are the difficulty, and the engines come from the motor trade."
 ITA_air_the_battalion_of_aviators: "The Battalion of Aviators"
 ITA_air_the_battalion_of_aviators_desc: "A unit with a depot, a school and an establishment, instead of a collection of enthusiasts on loan. Flying becomes a career rather than an eccentricity."
 ITA_o_tt_the_board_has_a_rule: "Promotion already goes by examination, so the board has a rule to apply and applies it."
 ITA_o_tt_brusati_is_struck_off: "Roberto Brusati fails the new standard and leaves the active list."
 ITA_o_tt_the_board_reads_the_calendar: "With seniority still the law, the board can only certify what the calendar has already decided."
 ITA_o_tt_the_crown_names_them: "The Crown keeps the appointment of general officers and the Chamber is informed afterwards."
 ITA_o_tt_the_chamber_reads_the_list: "The list is laid before the Chamber, and the deputies read every name on it."
 ITA_o_tt_the_ministry_signs_quietly: "The ministry signs the list and lets the interested parties hear of it privately."
 ITA_o_tt_porro_teaches: "Carlo Porro may be appointed as a theorist."
 ITA_o_tt_the_staff_answers_the_crown: "The Chief of Staff reports to the King and the war plans stay out of the Chamber."
 ITA_o_tt_the_minister_answers_the_chamber: "The Minister of War signs the plans and answers for them at the tribune."
 ITA_o_tt_spingardi_takes_the_ministry: "Paolo Spingardi is available as a corps commander."
 ITA_o_tt_the_grievance_is_answered: "The officers' grievance has been answered."
 ITA_o_tt_the_list_is_public: "The seniority list is printed and the King is credited with it."
 ITA_o_tt_the_list_is_a_courtesy: "The list is printed, but the appointments behind it are still arranged."
 ITA_o_tt_cadorna_is_reached: "Luigi Cadorna reaches a command and brings his own convictions with him."
 ITA_o_tt_diaz_is_reached: "Armando Diaz reaches a staff appointment."
 ITA_g_tt_the_carriage_is_made_here: "The recoil carriage is built under licence in our own shops."
 ITA_g_tt_the_carriage_comes_by_rail: "The guns arrive complete from Essen and the money leaves with the train."
 ITA_g_tt_the_licence_comes_from_le_creusot: "Ansaldo builds to French drawings, and Paris is pleased to sell them."
 ITA_g_tt_the_licence_comes_from_essen: "Ansaldo builds to German drawings, and the alliance is reassured."
 ITA_g_tt_the_park_faces_north: "Nobody pretends the heavy park is for Africa."
 ITA_g_tt_the_park_is_shown_to_the_ally: "The heavy park is shown to the allied attaches, which is its own kind of statement."
 ITA_c_tt_somebody_has_to_do_it: "The army is out of the streets, so the Arma inherits the whole duty."
 ITA_c_tt_the_regiments_keep_the_duty_too: "The regiments keep the duty as well, and the Arma is only an addition to it."
 ITA_c_tt_the_guards_are_told_to_carry_no_rifle: "The guards go into a crowd with a stick and a written instruction, and nothing else."
 ITA_c_tt_the_guards_are_told_to_clear_the_square: "The guards are instructed to clear a square and are given the means to do it."
 ITA_c_tt_the_volleys_are_on_the_record: "One volley is struck off the ministry's account."
 ITA_c_tt_nothing_to_undo: "The troops have not fired on the country, and there is nothing to undo."
 ITA_c_tt_milan_is_written_out: "The doctrine of Milan is struck out of the standing orders."
 ITA_c_tt_the_streets_are_quiet_enough_to_try_it: "The streets are quiet enough that the settlement can be made permanent."
 ITA_c_tt_the_streets_are_not_quiet_and_it_is_tried_anyway: "The streets are not quiet, and the settlement is made anyway."
 ITA_s_tt_the_figure_is_printed_with_the_census: "The literacy return is printed beside the census and cannot be argued away."
 ITA_s_tt_the_figure_stays_in_the_ministry: "The literacy return stays in the ministry, where it can be managed."
 ITA_s_tt_the_communes_lose_a_favour_to_sell: "The communes lose the appointment of the teacher, and with it a favour to sell."
 ITA_s_tt_the_teachers_union_is_recognised: "The teachers' association is recognised and brought into the settlement."
 ITA_s_tt_the_two_italies_are_one_reader: "North and South read the same primer and the same ballot paper."
 ITA_s_tt_one_italy_reads_and_the_other_signs: "One half of the kingdom reads and the other half still signs with a cross."
 ITA_m_tt_the_quinine_has_somewhere_to_go: "The state quinine has stations to be distributed from."
 ITA_m_tt_the_map_is_drawn_and_nothing_follows: "The map is drawn and there is no quinine to put on it."
 ITA_m_tt_the_land_was_promised_and_here_it_is: "Land was promised instead of the emigrant ship, and here it is."
 ITA_m_tt_the_men_who_would_have_dug_it_are_at_sea: "The men who would have dug the ditches are on a steamer to Buenos Aires."
 ITA_m_tt_louisiana_undersells_us: "American sulphur undersells the island in every market it had."
 ITA_m_tt_the_consortium_is_a_bargain_with_the_owners: "The consortium is a bargain struck with the owners and paid for in votes."
 ITA_m_tt_the_consortium_is_forced_to_take_the_miners_in: "The consortium is made to seat the miners' delegates at its own table."
 ITA_m_tt_the_labour_office_has_inspectors_to_send: "The labour office has inspectors and can put them down a shaft."
 ITA_m_tt_the_law_has_nobody_to_enforce_it: "The law fixes an age and provides nobody to go and look."
 ITA_m_tt_turati_calls_it_the_only_thing_worth_the_session: "Turati calls it the only thing the session has been worth."
 ITA_m_tt_mirabello_takes_the_auxiliaries: "Carlo Mirabello takes the auxiliary squadron."
 ITA_m_tt_the_commissariat_writes_the_charter: "The Commissariat writes the charter, and the state can move its people in bodies."
 ITA_m_tt_the_shipowners_write_the_charter: "The shipowners write the charter and the inspectors read it afterwards."
 ITA_m_tt_the_liners_are_counted_as_cruisers: "The subsidised liners are entered in the naval returns as auxiliary cruisers."
 ITA_air_tt_moris_is_given_the_brigade: "Maurizio Moris is available as a corps commander."
 ITA_air_tt_the_staff_calls_it_a_balloon_company: "The staff files the brigade under balloons and forgets about it."
 ITA_air_tt_the_chamber_laughs_and_votes_it: "The Chamber laughs at the item and votes it."
 ITA_air_tt_calderara_is_taught_by_wilbur_wright: "Mario Calderara is taught to fly by Wilbur Wright and stays to teach others."
 ITA_air_tt_douhet_writes_the_regulations: "Giulio Douhet writes the regulations, and they are more ambitious than the machines."
 ITA_air_tt_the_battalion_is_meant_for_the_alps: "The battalion is being built to look over the northern frontier."
 ITA_air_tt_the_battalion_is_offered_to_the_alliance: "The battalion is offered to the alliance as a reconnaissance arm."
 ITA_air_tt_the_porte_calls_it_murder: "The Porte protests to every chancellery in Europe."
 ITA_air_tt_the_kingdom_advertises_it: "The kingdom advertises the feat and enjoys the attention."
 ITA_air_tt_the_extreme_left_asks_who_was_under_it: "The Extreme Left asks who was standing under the grenades."
 ITA_air_tt_the_despatch_says_reconnaissance: "The despatch records a reconnaissance and says nothing about the grenades."
 ITA_air_tt_gavotti_comes_back: "The pilot comes back, lands, and writes the first report of its kind."
 ITA_air_tt_the_machine_does_not_come_back: "The machine does not come back."
 ITA_arm_tt_the_left_reads_the_list: "The Extreme Left has the seniority list printed. Every colonel now knows who passed him and why."
 ITA_arm_tt_the_list_is_the_crowns: "Promotion is the King's prerogative and the ministry says so in one line. The list stays in the drawer."
 ITA_arm_tt_the_ministry_does_not_read_it: "The ministry has no opinion about the seniority list and does not intend to acquire one."
 ITA_arm_tt_the_class_answers_the_denunciation: "The alliance is denounced; the class of the year is voted at full strength, and the piazza answers."
 ITA_arm_tt_the_convention_fixes_the_class: "The military convention already tells us how many men Vienna expects. We call up exactly that many."
 ITA_arm_tt_the_bloc_shortens_the_class: "The bloc will not vote a full class. Fewer men to the colours, and a quieter country for it."
 ITA_arm_tt_the_essen_offer: "Krupp will sell to an ally on an ally's terms, and Vienna hears of the order before Paris does."
 ITA_arm_tt_no_gun_from_essen: "Essen does not sell guns to a country that has left the alliance. Ansaldo gets the drawings and the bill."
 ITA_arm_tt_surveying_an_ally: "Our engineers are measuring the passes of a power we are sworn to reinforce. Somebody in Vienna reads the contracts."
 ITA_arm_tt_the_survey_is_expected: "Nobody in Rome pretends the survey is about avalanches. The Chamber votes it without a division."
 ITA_arm_tt_the_bloc_writes_it_down: "The bloc will not take a verbal assurance. The refusal goes into the regulations, in print, over a signature."
 ITA_arm_tt_the_ministry_says_nothing_in_writing: "The ministry gives its word and refuses to give it in writing. The prefects understand the arrangement."
 ITA_arm_tt_the_primer_before_the_rifle: "The bloc insists the conscript learn to read first. The regiment becomes the largest school in the kingdom."
 ITA_arm_tt_the_rifle_before_the_primer: "The ministry wants soldiers, not scholars. The drill hours go where the ministry says."
 ITA_arm_tt_the_orders_are_placed_where_they_vote: "Arsenal contracts go to the districts that return the right deputies, and the prefects see that it is understood."
 ITA_arm_tt_the_arsenals_are_the_states: "The arsenals stay public, the fitters keep their committees, and nobody is dismissed for belonging to one."
 ITA_arm_tt_the_estimates_are_not_laid_before_anyone: "The arsenal vote is folded into a decree and never reaches a committee."
 ITA_arm_tt_the_alpini_are_told_who_they_face: "The battalions are raised and the maps are issued. The maps have Austrian names on them."
 ITA_arm_tt_the_alpini_are_a_frontier_guard: "The corps is described as customs work in uniform. Vienna accepts the description because it costs nothing."
 ITA_arm_tt_the_estimates_pass_by_decree: "The estimates are promulgated, not debated. Nothing is cut and nothing is explained."
 ITA_arm_tt_the_estimates_are_bought: "The estimates pass on promises made to sixty deputies, and every promise is written down somewhere."
 ITA_arm_tt_the_bloc_cuts_the_estimates: "The bloc trims the army vote before it will carry it. The country approves; the corps does not."
 ITA_arm_tt_the_denunciation_has_an_army: "The treaty is torn up and the deployment matches the policy. For once the staff and the Consulta agree."
 ITA_arm_tt_the_bloc_will_not_pay_for_the_alps: "The bloc was not elected to build an army against Austria, and says so from the benches."
 ITA_arm_tt_the_ally_asks_about_the_concrete: "Vienna reads the tender notices. An ally pouring forts on a shared frontier owes an explanation we do not have."
 ITA_arm_tt_nobody_needs_a_reason_now: "The works go up openly. There is no longer an alliance to embarrass."
 ITA_arm_tt_the_bloc_calls_it_an_adventure: "The bloc names it an adventure paid for by men who will never see Africa, and the piazza takes up the phrase."
 ITA_arm_tt_the_south_is_told_it_gains: "The southern deputies are told the colonial depots will be built in their provinces. Another promise on the account."
 ITA_arm_tt_the_right_has_wanted_this_since_adwa: "The Right has wanted the verdict of Adwa reversed for ten years, and votes the army of Africa without a murmur."
 ITA_arm_tt_no_italian_mothers_to_answer: "Ascari casualties produce no letters to deputies. The ministry counts this as economy."
 ITA_arm_tt_the_bloc_asks_what_they_are_paid: "The bloc asks in the Chamber what an ascaro is paid and how he was recruited. The answers are not read out."
 ITA_arm_tt_vienna_is_told_before_the_porte: "An ally must be told first. Vienna is informed, disapproves, and remembers."
 ITA_arm_tt_there_is_nobody_to_tell: "There is no alliance left to consult. The order goes out on our own authority."
 ITA_arm_tt_the_bloc_breaks_over_libya: "The Extreme Left will not carry a colonial war. The understanding that held the majority together ends here."
 ITA_arm_tt_the_bloc_gets_what_it_asked_for: "A smaller army was the bloc's price for its votes, and the bloc is paid in full."
 ITA_arm_tt_the_right_will_not_forgive_the_cut: "The Right regards the cut as a great power resigning, and remembers it in every subsequent division."
 ITA_arm_tt_the_convention_promised_three_corps: "The convention promises Vienna three corps on the Rhine. We have just made that arithmetic impossible."
 ITA_arm_tt_the_prefects_keep_the_index: "The reserve index is kept by the prefectures, along with everything else worth keeping."
 ITA_arm_tt_the_communes_keep_the_index: "The communes keep the reserve rolls, and the men may read their own entries."
 ITA_arm_tt_the_plan_is_filed_against_a_friend: "The staff has a war plan against the power we are treaty-bound to reinforce. Somebody will eventually ask about it."
 ITA_arm_tt_the_plan_is_the_policy: "The plan and the policy now say the same thing, and neither has to be hidden."
 ITA_arm_tt_the_army_answers_to_the_crown: "The new regulations settle the question of whose army it is. It is the King's."
 ITA_arm_tt_the_army_answers_to_the_chamber: "Estimates, promotions and the barracks duty are all the Chamber's business now, in writing."
 ITA_arm_tt_the_army_answers_to_the_ministry: "The army answers to whoever is at the Interior this year, which is the arrangement the ministry prefers."
 ITA_arm_tt_the_batteries_have_a_map_to_match: "The mule batteries are sited against a frontier we have already named as hostile."
 ITA_arm_tt_mountain_guns_for_a_frontier_at_peace: "Mountain guns for a frontier nobody expects to fight over. The Chamber finds this cheap and reassuring."
 ITA_arm_tt_the_convention_expects_corps_not_hulls: "Vienna and Berlin were promised divisions. They are told the money went into slipways."
 ITA_arm_tt_a_free_hand_needs_a_fleet_first: "A country with no allies needs its own sea before it needs another army corps."
 ITA_n_tt_the_estimates_are_bought: "The naval estimates carry on promises, not arguments. The pledges are entered against the ministry."
 ITA_n_tt_the_estimates_are_signed: "The estimates are signed, promulgated and printed. There is no debate to lose."
 ITA_n_tt_the_estimates_are_contested: "The bloc fights the naval vote line by line and takes something off it."
 ITA_n_tt_the_drawings_are_shown_to_pola: "Allied navies exchange drawings. Pola is shown what Cuniberti is working on, because that is what allies do."
 ITA_n_tt_the_office_keeps_its_own_counsel: "The drawing office shows its work to nobody. There is no ally with a right to ask."
 ITA_n_tt_the_ways_are_laid_where_they_vote: "The new slipways are laid in constituencies that needed encouraging."
 ITA_n_tt_the_yards_are_the_blocs_own_men: "The yard hands are organised, and they are organised on our side of the Chamber."
 ITA_n_tt_fiume_sells_to_an_ally: "Whitehead's works are in Fiume. An ally gets the licence, and gets it cheaply."
 ITA_n_tt_fiume_will_not_sell: "Whitehead's works are in Fiume, and Fiume no longer sells torpedoes to Italy. We shall make our own."
 ITA_n_tt_the_ship_needs_no_vote: "The all-big-gun ship is ordered by decree. There is nobody to persuade."
 ITA_n_tt_the_bloc_will_not_vote_a_battleship: "The bloc will not put its name to a battleship while the schools are unbuilt."
 ITA_n_tt_the_ship_is_paid_for_in_seats: "The hull is bought in the lobby, at the usual rate."
 ITA_n_tt_the_refusal_is_the_blocs_victory: "The bloc wanted the money for something else and got it. The refusal is claimed in every league hall."
 ITA_n_tt_the_refusal_is_read_as_weakness: "The Right reads the refusal as a great power declining to be one, and says so."
 ITA_n_tt_the_ally_asks_why_taranto: "A base at Taranto faces one sea and one navy. Vienna does not need the point explained."
 ITA_n_tt_the_base_faces_where_it_should: "The base faces the Adriatic, which is where the fleet's work will be."
 ITA_n_tt_the_south_gets_a_yard_at_last: "The South is given something built rather than promised, and one old pledge can be struck off."
 ITA_n_tt_the_cheap_boat_passes: "A submarine costs what a gun turret costs. The bloc votes it without a fight."
 ITA_n_tt_the_right_wants_hulls_not_boats: "The Right regards submarines as the weapon of a power that has given up, and votes the credit sourly."
 ITA_n_tt_the_study_names_no_enemy: "The Livorno study is written without naming an opponent, which makes it a poor study and a good treaty document."
 ITA_n_tt_the_study_names_pola: "The study names Pola on its first page and works from there."
 ITA_n_tt_a_closed_sea_with_a_friend_in_it: "The Adriatic can only be closed against the fleet of our own ally. The paper is circulated anyway."
 ITA_n_tt_the_sea_has_one_other_owner: "There is one other fleet in this sea, and we have stopped pretending otherwise."
 ITA_n_tt_the_ally_reads_the_petersburg_papers: "Our best naval constructor is now working for Russia. Vienna draws the obvious conclusion."
 ITA_n_tt_petersburg_is_a_useful_friend: "Petersburg pays well and remembers favours. We are short of friends."
 ITA_n_tt_the_boats_go_to_paris_and_petersburg: "Laurenti's hulls are sold where the orders are, and the orders are in Paris and Petersburg."
 ITA_n_tt_the_ally_reads_the_order_book: "An ally examines our export order book and finds its own rivals in it."
 ITA_n_tt_the_bloc_divides_over_the_dante: "The reformists will carry a dreadnought; the maximalists will not. The bloc splits over one hull."
 ITA_n_tt_the_hull_is_ordered_by_decree: "The Dante is laid down on a decree. The estimates follow afterwards."
 ITA_n_tt_the_hull_costs_three_pledges: "The hull is bought with promises to three groups, all of which will be called in."
 ITA_n_tt_two_allies_building_against_each_other: "Two members of the same alliance are building against each other, and both admit it in their estimates."
 ITA_n_tt_the_race_has_a_name_now: "The race with Pola no longer has to be described as a race with anyone else."
 ITA_n_tt_three_hulls_three_constituencies: "Three hulls, three yards, three sets of grateful deputies."
 ITA_n_tt_the_bloc_asks_for_the_schools_instead: "The bloc asks what a third battleship would buy in classrooms, and gets a figure it can read out."
 ITA_n_tt_the_yard_sells_where_it_likes: "With no alliance to consider, the yards take orders from anyone who pays."
 ITA_n_tt_the_order_book_is_shown_to_berlin: "The order book is shown to Berlin first, as a courtesy that costs us a customer or two."
 ITA_n_tt_a_fleet_for_a_country_with_no_ally: "A country that has denounced its alliance needs a fleet that can leave its own gulf."
 ITA_n_tt_the_ally_asks_what_it_is_for: "Vienna asks what a high seas school is for, and does not accept the answer given."
 ITA_n_tt_the_bloc_pays_for_it_in_the_country: "The bloc carries the largest naval vote of the decade and pays for it in the piazza."
 ITA_n_tt_the_cheap_school_suits_the_bloc: "Coast defence is the cheapest school there is, which is why the bloc voted for it."
 ITA_n_tt_a_great_power_does_not_hide_in_a_gulf: "The Right calls it the doctrine of a second-class power, and the phrase sticks."
 ITA_n_tt_the_ally_is_reassured_by_a_coast_fleet: "A fleet built to defend a coast cannot threaten Pola. Vienna is told so, and believes it."
 ITA_e_tt_the_prefects_count_their_own_districts: "The census is taken by the prefectures, which are counting the districts they also manage."
 ITA_e_tt_the_bloc_wants_the_figures_printed: "The bloc insists the returns be published unedited, and the statisticians are delighted."
 ITA_e_tt_the_ministry_keeps_the_returns: "The returns go to the ministry and no further. What is not published cannot be quoted against us."
 ITA_e_tt_the_concessions_find_friends: "Alpine water concessions are granted to men who were useful at the last election."
 ITA_e_tt_the_concessions_are_granted_by_decree: "The concessions are granted by decree, over the heads of the communes that owned the water."
 ITA_e_tt_the_communes_are_paid_for_their_water: "The communes are compensated before the dams are begun, which is slow, expensive and quiet."
 ITA_e_tt_the_plate_must_be_ours: "Nobody will roll armour plate for a country that has left its alliance. Terni must do it."
 ITA_e_tt_the_ally_will_roll_the_plate: "An allied works will roll plate for us on decent terms while Terni learns how."
 ITA_e_tt_turin_is_the_blocs_city: "Thirty thousand fitters in one quarter, and they vote for the bloc."
 ITA_e_tt_thirty_thousand_men_and_a_garrison: "Thirty thousand fitters in one quarter, and a ministry that answers them with a garrison."
 ITA_e_tt_the_south_is_a_constituency: "The special laws are administered by prefects who will remember the arrangement in June."
 ITA_e_tt_the_south_is_a_debt: "The bloc treats the special laws as a debt the North owes, and pays it without asking for the seats."
 ITA_e_tt_sonnino_wrote_this_book_himself: "The President of the Council wrote about the Sicilian peasantry before he governed. The bill is his own."
 ITA_e_tt_the_bloc_calls_it_a_verdict: "The bloc reads six hundred thousand departures a year as a verdict on the kingdom, and says so."
 ITA_e_tt_the_safety_valve: "Every man on a gangplank is a man not in a piazza. The ministry has always understood the arithmetic."
 ITA_e_tt_the_consulates_are_places_to_give: "The new consular posts are places to be given, and they are given carefully."
 ITA_e_tt_the_leagues_man_the_offices: "The emigration offices are staffed from the leagues, which know the emigrants better than the ministry does."
 ITA_e_tt_the_italians_of_trieste_are_counted_too: "The register of Italians abroad does not stop at Trieste, and the newspapers notice."
 ITA_e_tt_the_lists_stop_at_the_border: "The register stops carefully at the Austrian frontier. Vienna notices that too."
 ITA_e_tt_the_leagues_asked_for_this: "Land at home instead of a berth abroad was the leagues' own demand."
 ITA_e_tt_the_valve_is_shut_by_hand: "The safety valve is closed deliberately, and the landowners who profited from it break with the ministry."
 ITA_e_tt_recognising_our_own_benches: "The chambers of labour are recognised by a ministry that sits with their deputies."
 ITA_e_tt_the_right_recognises_what_it_would_dissolve: "The Right signs a recognition it spent five years promising to revoke, and its own benches say so."
 ITA_e_tt_the_decrees_and_the_prefect_agree: "The public safety decrees and the prefect's instructions say the same thing, which makes both easier to apply."
 ITA_e_tt_the_bloc_cannot_answer_for_this: "The bloc cannot explain a prefect breaking a strike to the men who elected it. The understanding does not survive."
 ITA_e_tt_the_bloc_wrote_this_bill: "Compulsory elementary schooling was the bloc's own bill before it was the ministry's."
 ITA_e_tt_the_teacher_is_a_prefects_appointment: "The schoolmaster is appointed from Rome, which means in practice by the prefect."
 ITA_e_tt_the_communes_are_told_what_to_teach: "The communes lose the schools and are told what will be taught in them."
 ITA_e_tt_the_pact_is_the_ministrys_own_work: "The parish pact was negotiated by the ministry's own agents, district by district."
 ITA_e_tt_the_bloc_cannot_sit_with_the_sacristy: "A bloc resting on the Extreme Left cannot also rest on the curates. Something has to give."
 ITA_e_tt_the_right_and_the_curate_agree: "The Right and the parish committees want the same things, and are pleased to be asked."
 ITA_e_tt_the_leagues_hand_out_the_tablets: "The state quinine is distributed through the leagues, which reach fields the prefecture never visits."
 ITA_e_tt_the_tablets_are_handed_out_by_the_prefect: "The state quinine is distributed by the prefecture, and the peasants are told who sent it."
 ITA_e_tt_the_south_is_answered_and_billed: "The South is answered, and the account of what it now owes the ministry is presented at once."
 ITA_e_tt_the_south_is_answered_and_enfranchised: "The South is answered by a government that also intends to let it vote."
 ITA_e_tt_the_south_is_answered_from_rome: "The South is answered from Rome, thoroughly and without being consulted."
 ITA_e_tt_a_country_that_asks_nobody_for_coal: "A country with no alliance and no coal would be at anyone's mercy. Now it is at nobody's."
 ITA_e_tt_silesian_coal_on_a_friendly_tariff: "Silesian coal comes in on an ally's tariff while the current is being built."
 ITA_e_tt_one_kingdom_administered: "One kingdom, held together by ninety prefects and a great deal of correspondence."
 ITA_e_tt_one_kingdom_enfranchised: "One kingdom, held together because most of the men in it now have a vote."
 ITA_e_tt_one_kingdom_governed: "One kingdom, held together from Rome, and told so."
 ITA_w_tt_foreign_policy_is_the_crowns: "Under the Statuto, treaties are the King's business. The Consulta answers to him and to nobody on the benches."
 ITA_w_tt_the_bloc_asks_to_read_the_treaties: "The bloc asks that treaties be laid before the Chamber. It does not get everything, but it gets the habit."
 ITA_w_tt_the_consulta_is_left_to_itself: "Foreign policy is left to the officials, who are grateful and helpful in return."
 ITA_w_tt_the_renewal_needs_no_debate: "The renewal is signed and announced. It is not debated, because nothing is."
 ITA_w_tt_the_extreme_left_votes_against: "The Extreme Left votes against the alliance and forces us to count our own majority."
 ITA_w_tt_the_convention_never_reaches_the_chamber: "The military convention is a matter between staffs and crowns. The Chamber is not shown it."
 ITA_w_tt_the_chamber_is_told_a_smaller_number: "The Chamber is given a figure for the Rhine army smaller than the one Berlin has."
 ITA_w_tt_the_bloc_learns_of_the_third_army: "The bloc learns that Italian corps are promised to the Rhine, and the benches go up in noise."
 ITA_w_tt_two_books_and_no_chamber: "Two sets of engagements, one cipher room, and no committee entitled to ask."
 ITA_w_tt_the_bloc_would_publish_both: "The bloc's own press would print both books if it ever saw them. The secret is now a domestic risk."
 ITA_w_tt_the_bloc_will_not_own_the_irredenta: "The Extreme Left will not carry an irredentist claim, and the understanding ends over it."
 ITA_w_tt_the_right_writes_the_claim: "The Right has wanted this written down since before the kingdom was whole, and writes it well."
 ITA_w_tt_the_ministry_would_rather_not_have_said_it: "The ministry preferred the claim unspoken. Now it must be defended in the Chamber."
 ITA_w_tt_an_ally_bargaining_with_petersburg: "An ally bargaining with Russia over the Balkans is an ally in name. Vienna reads it that way."
 ITA_w_tt_racconigi_is_the_new_policy: "Racconigi is not a betrayal of anything. It is simply the policy now."
 ITA_w_tt_valona_is_watched_by_two_allies: "Two allies are watching the same harbour, and each knows why the other is there."
 ITA_w_tt_the_other_shore_has_one_claimant: "There is one claimant to the other shore of the Otranto strait, and it is us."
 ITA_w_tt_the_bloc_costs_the_colonies_out: "The bloc has the colonies costed and reads the total out. The total is not flattering."
 ITA_w_tt_a_colony_is_a_place_to_send_a_client: "A colonial administration is a set of appointments, and appointments are what the ministry has to give."
 ITA_w_tt_the_right_wants_them_governed: "The Right wants the colonies governed rather than merely held, and votes the money for it."
 ITA_w_tt_the_bloc_asks_about_the_recruiting: "The bloc asks in the Chamber how the ascari are recruited and what becomes of those who refuse."
 ITA_w_tt_a_colonial_army_costs_no_italian_vote: "Native battalions cost no Italian conscripts, and therefore no Italian votes."
 ITA_w_tt_the_extreme_left_forced_the_inquiry: "It was the Extreme Left that forced the inquiry into the company's Benadir. The buy-out is their result."
 ITA_w_tt_the_inquiry_is_settled_quietly: "The inquiry is settled before it reports, and the officials concerned are transferred."
 ITA_w_tt_the_company_is_not_the_states_business: "The Right holds that a chartered company's affairs are its own. Paying for it anyway is resented."
 ITA_w_tt_adwa_is_closed_by_the_men_who_opposed_it: "The men who voted against the expedition are the men who close the account. The country notices."
 ITA_w_tt_the_right_signs_and_says_nothing: "The Right signs the treaty with Menelik and refuses to celebrate it."
 ITA_w_tt_the_bloc_will_not_survive_a_second_adwa: "The bloc cannot carry a second Abyssinian war for a fortnight, and does not try."
 ITA_w_tt_the_right_has_waited_ten_years: "The Right has waited ten years for this and votes the credits standing."
 ITA_w_tt_the_ministry_did_not_want_this: "The ministry did not want an Abyssinian war and is now carrying one it cannot administer."
 ITA_w_tt_the_ally_is_consulted_about_tripoli: "The alliance requires consultation over Ottoman territory. Vienna is consulted, and is not encouraging."
 ITA_w_tt_nobody_is_consulted_about_tripoli: "There is no treaty left requiring us to ask anyone about Tripoli."
 ITA_w_tt_the_ministry_counts_the_nationalist_seats: "The ministry counts the seats a Libyan enterprise would be worth, and finds the sum persuasive."
 ITA_w_tt_the_alliance_is_told_after_the_fact: "An ally learns of our ultimatum from the newspapers. The Triple Alliance survives the week, barely."
 ITA_w_tt_a_free_hand_is_for_this: "This is what a free hand was denounced for. Nobody has to be squared."
 ITA_w_tt_the_bloc_will_not_hold_through_a_war: "A bloc resting on the Extreme Left cannot hold through a colonial war. It does not."
 ITA_w_tt_the_bank_is_cheaper_than_a_war: "A bank in Tripoli costs a fraction of a landing and leaves the majority intact."
 ITA_w_tt_a_great_power_does_not_send_a_banker: "The Right regards a bank as what a power sends when it dare not send a division."
 ITA_w_tt_the_bloc_is_spared_a_war: "The bloc is spared a war it could not have carried, and the piazza with it."
 ITA_w_tt_the_islands_are_kept_because_we_can: "The islands are described as a pledge. There is no ally in a position to ask when it is redeemed."
 ITA_w_tt_vienna_asks_when_they_go_back: "Vienna asks, in writing, on what date the Aegean islands will be returned."
 ITA_w_tt_the_ministry_banks_the_victory: "The peace is announced, the prefects are instructed, and the victory is banked before the next election."
 ITA_w_tt_the_right_asks_why_we_stopped: "The Right asks why the columns stopped at the coast, and keeps asking."
 ITA_w_tt_the_fourth_shore_owes_nothing_to_vienna: "The fourth shore was taken without an ally's leave and is held without an ally's help."
 ITA_w_tt_the_bloc_counts_the_columns: "The bloc counts the columns still in the desert and prints the figure in every league paper."
 ITA_w_tt_the_right_calls_it_pacification: "The Right calls it pacification and votes the transport."
 ITA_w_tt_the_emigrants_are_sent_to_libya_instead: "Emigrants promised land in the South are offered land in Libya. One old promise is disposed of."
 ITA_w_tt_the_bloc_calls_it_sand: "The bloc calls the fourth shore a box of sand bought with a decade of school budgets."
 ITA_a_tt_the_decrees_are_read_abroad: "A kingdom governing by public safety decree is read abroad as a kingdom expecting trouble."
 ITA_a_tt_vienna_recognises_the_instrument: "Vienna knows the instrument well and regards its use as a sign of seriousness."
 ITA_a_tt_the_new_voters_hear_about_trieste: "Two million new voters, and the first thing many are canvassed about is Trieste."
 ITA_a_tt_the_alliance_is_not_a_platform: "Nobody can campaign on the Triple Alliance. The ministry keeps it out of the election entirely."
 ITA_a_tt_the_ally_counts_the_garrisons_at_home: "Our ally counts the divisions kept in Italian cities and subtracts them from those promised to the Rhine."
 ITA_a_tt_a_free_hand_and_a_garrison_in_milan: "A free hand abroad and a garrison in Milan. The contrast is drawn in every league paper."
 ITA_a_tt_berlin_prefers_a_government_that_lasts: "Berlin and Vienna prefer an ally whose government survives the winter, whatever the means."
 ITA_a_tt_a_free_hand_wielded_by_decree: "A free hand abroad, exercised by a ministry that has stopped consulting anyone at home."
 ITA_a_tt_hungarian_grain_comes_in_free: "With the duty gone, Hungarian grain comes in freely, and Budapest is grateful in a way Vienna records."
 ITA_a_tt_the_grain_is_bought_where_we_like: "The grain is bought wherever it is cheapest, and no treaty says otherwise."
 ITA_a_tt_the_convention_is_kept_from_the_new_minister: "The military convention cannot be shown to a socialist minister, and Vienna knows he is sitting there."
 ITA_a_tt_a_free_hand_that_the_left_can_live_with: "The Left can sit in a ministry that has denounced the alliance. It could not sit in one that kept it."
 ITA_a_tt_the_settlement_has_no_ally_behind_it: "The settlement rests on the country alone. The Chamber is told to remember it."
 ITA_a_tt_the_alliance_underwrites_the_settlement: "A kingdom inside a great alliance can afford a quiet Chamber, and the Chamber knows it."
 ITA_end_tt_the_ally_is_relieved_by_the_adjournment: "Vienna and Berlin greet the adjournment as the end of an unreliable parliament."
 ITA_end_tt_a_free_hand_and_a_closed_chamber: "A kingdom with no allies and no parliament. Europe files the observation."
 ITA_end_tt_the_third_partner_under_a_left_ministry: "Vienna will not deal on military matters with a ministry that includes the Extreme Left."
 ITA_end_tt_the_free_hand_is_folded: "The free hand is folded away. The new ministry has no use for it."
 ITA_end_tt_the_bloc_gets_its_columns_back: "The bloc asked for the columns to come home and can now say it brought them."
 ITA_end_tt_the_right_calls_it_a_surrender: "The Right calls the recall a surrender to a desert, and the phrase outlives the ministry."
 ITA_end_tt_the_verdict_on_the_neutral_state: "Ten years of a state that stood back: an administration that works, and a country that owes it favours."
 ITA_end_tt_the_verdict_on_the_statuto: "Ten years of the Statuto read strictly: a kingdom governed, and a street that has not forgotten."
 ITA_end_tt_the_verdict_on_the_bloc: "Ten years of the popular bloc: a wider franchise and a majority that can be counted."
 ITA_end_tt_the_verdict_on_the_third_partner: "Ten years of loyalty: an alliance that still expects Italian corps, and staffs that still talk."
 ITA_end_tt_the_verdict_on_the_free_hand: "Ten years of a free hand: no allies, no obligations, and every neighbour watching."
 ITA_r_threat_the_note_is_read_back: "Rome tells Vienna the assurance bound only the estimates"
 ITA_r_threat_the_bosnian_file: "Italy asks compensation for Bosnia"
 ITA_r_threat_the_green_book: "Rome publishes the 1902 correspondence"
 ITA_r_threat_the_photographs: "Italy denies the Tripolitanian photographs"
 ITA_r_threat_the_status_quo_answered: "Rome refuses Vienna's reading of Racconigi"
 ITA_r_tb_the_three_worst_provinces: "The Three Worst Provinces"
 ITA_r_tb_the_adriatic_delay: "An Answer Deferred"
 ITA_r_tb_the_yard_that_stayed: "The Yard That Stayed at Messina"
 ITA_r_tb_the_licence_at_last: "The Licence, At Last"
 ITA_r_tb_the_turin_copy: "The Turin Copy"
 ITA_r_tb_the_figures_are_public: "The Figures Are Public"
 ITA_r_dc_the_standing_orders_rewritten: "The Standing Orders Rewritten"
 ITA_r_dc_the_establishment_is_held: "The Establishment Is Held"
 ITA_r_dc_the_battery_that_is_ours: "A Battery That Is Ours"
 ITA_r_dc_the_board_is_sustained: "The Board Is Sustained"
 ITA_r_dc_the_passed_over_get_a_command: "A Command for the Passed Over"
 ITA_g_the_ministry_of_the_lobby: "The Ministry of the Lobby"
 ITA_g_the_ministry_of_the_lobby_desc: "Business is done in the corridor and ratified in the hall. It is quick, it is entirely legal, and it means that no policy of the Kingdom is ever decided by an argument."
 ITA_g_the_book_of_the_ninety: "The Book of the Ninety"
 ITA_g_the_book_of_the_ninety_desc: "The Interior knows the name of every man in every province who can deliver something, and what he wants for it. The estimates are drawn with the ledger open on the table."
 ITA_g_the_boards_of_conciliation: "The Boards of Conciliation"
 ITA_g_the_boards_of_conciliation_desc: "Disputes end in a room with a table in it rather than in a street with cavalry in it. The mills lose fewer weeks and the ministry loses fewer nights."
 ITA_g_the_men_who_will_vote_for_it: "The Men Who Will Vote For It"
 ITA_g_the_men_who_will_vote_for_it_desc: "A bench without a programme, assembled fresh each session out of whoever the ministry can satisfy. It carries every division and believes in nothing whatever."
 ITA_g_the_public_works_estimate: "The Public Works Estimate"
 ITA_g_the_public_works_estimate_desc: "More roads, harbours and bridges are being built in the Kingdom than at any time since unification, and every one of them was voted for a reason that had nothing to do with traffic."
 ITA_g_the_list_that_goes_astray: "The List That Goes Astray"
 ITA_g_the_list_that_goes_astray_desc: "In the South the ministry does not win elections, it arranges them. It is reliable, it is cheap, and it is the single fact about Italy that every foreign newspaper knows."
 ITA_g_the_leagues_are_lawful: "The Leagues Are Lawful"
 ITA_g_the_leagues_are_lawful_desc: "The unions have offices, funds and lawyers. They are far easier to negotiate with than a crowd, and far harder to disperse."
 ITA_g_the_minister_of_the_underworld: "The Minister of the Underworld"
 ITA_g_the_minister_of_the_underworld_desc: "The method has been described in print, with names and constituencies, by a man nobody can accuse of inventing it. The system still works. It simply no longer works quietly."
 ITA_g_the_confederation_of_labour: "The Confederation of Labour"
 ITA_g_the_confederation_of_labour_desc: "Half a million organised men with one address and one treasury. They will not riot. They will also never again be dispersed by a squadron of cavalry and a prefect's decree."
 ITA_g_the_bill_comes_round_again: "The Bill Comes Round Again"
 ITA_g_the_bill_comes_round_again_desc: "Nothing the ministry bought has been kept. Every session the same men present the same accounts, and the figure at the bottom is larger than it was last year."
 ITA_g_the_last_giolittian_chamber: "The Last Giolittian Chamber"
 ITA_g_the_last_giolittian_chamber_desc: "Eight and a half million voters have sent up a Chamber that owes the prefects nothing. It can still be managed. It cannot be counted in advance, and that is the whole difference."
 ITA_g_the_system_outlived_its_arithmetic: "The System Outlived Its Arithmetic"
 ITA_g_the_system_outlived_its_arithmetic_desc: "The machine was dismantled by its own author before the country dismantled it for him, and the ministry has come out of the reckoning still governing. Very few systems in Europe manage that."
 ITA_g_orlando_in_the_lobby: "Orlando in the Lobby"
 ITA_g_orlando_in_the_lobby_desc: "A Sicilian professor of constitutional law who can explain, at length and with authorities, why whatever the ministry did last week was provided for in 1848."
 ITA_g_carcano_at_the_treasury: "Carcano at the Treasury"
 ITA_g_carcano_at_the_treasury_desc: "He signs the public works estimate every year and every year tells the Council that this is the last time. He has been telling them so since Crispi."
 ITA_g_daneo_at_public_instruction: "Daneo at Public Instruction"
 ITA_g_daneo_at_public_instruction_desc: "If the register is to be widened to every man who can read, then somebody had better see that they can. He would rather it were done for its own sake."
 ITA_g_tb_the_lobby: "The Ministry of the Lobby"
 ITA_g_tb_the_boards: "The Boards of Conciliation"
 ITA_g_tb_the_bench: "The Bench Assembled"
 ITA_g_tb_the_public_works: "The Public Works Estimate"
 ITA_g_tb_the_aqueduct: "The Apulian Aqueduct"
 ITA_g_tb_the_strike_counted: "The Strike That Was Counted"
 ITA_g_tb_the_leagues: "The Leagues Made Lawful"
 ITA_g_tb_the_confederation: "The Confederation of Labour"
 ITA_g_the_machine_counted_tt: "Provinces held by the machine: §Y[?ITA_prefects|0]§! of 100."
 ITA_g_the_bench_is_already_full_tt: "§GThe majority is comfortable enough that the groups come to us.§! Nobody has to be paid twice this session."
 ITA_g_the_groups_are_bought_one_by_one_tt: "§RThe bench has to be assembled group by group.§! Every one of them names a price before it sits down."
 ITA_g_the_book_is_thick_tt: "§GThe ledger already covers most of the Kingdom.§! Adding to it is a matter of copying, not of persuasion."
 ITA_g_the_book_is_still_thin_tt: "§YHalf the provinces have no page worth reading.§! The clerks begin at the beginning."
 ITA_g_the_boards_meet_under_guard_tt: "§RThere are still troops in the disputes.§! Nobody sits at a board with a picket outside, and both sides say so."
 ITA_g_the_boards_are_believed_tt: "§GNo garrison has been called out in a strike this year.§! The masters come to the table because the alternative is now genuinely worse for them."
 ITA_g_the_curate_sits_beside_the_notary_tt: "§GThe ban is lifted and the parish vote is on the bench.§! It is the cheapest bloc the ministry has ever acquired."
 ITA_g_the_bench_is_short_of_the_countryside_tt: "§RRome has held the ban.§! The rural provinces send men who owe the ministry nothing at all."
 ITA_g_rome_has_not_answered_yet_tt: "§YThe question of the ban is still open.§! The bench is assembled without knowing whether it will have a Catholic wing."
 ITA_g_more_is_promised_than_can_be_built_tt: "§RThe pledges outrun the estimates.§! Somebody in the Molise is going to be told there is no bridge after all."
 ITA_g_the_works_are_within_reach_tt: "§GEverything promised this session can actually be built.§! It is an unusual position for an Italian ministry."
 ITA_g_the_street_reads_the_returns_tt: "§RThe country is already restless and the returns are printed anyway.§! The Extreme Left has an argument it did not have to make up."
 ITA_g_nobody_below_naples_is_surprised_tt: "§GThe country is quiet and the arrangement passes without comment.§! It is how elections have been held there since 1861."
 ITA_g_a_promise_is_redeemed_tt: "§GThree pledges are struck off the book.§! Water arrives where a minister said it would, which has not happened before."
 ITA_g_nothing_was_owed_here_tt: "§YNothing was promised for this, so nothing is discharged by it.§! The prefects take the credit instead."
 ITA_g_the_floor_will_not_come_down_tt: "§RThe army has been used in the streets before and the piazza remembers.§! The strike does not dissolve; it hardens."
 ITA_g_the_strike_ends_itself_tt: "§GNo troops were sent and there was nothing to fight.§! The strike ends in four days and the ministry is stronger for having done nothing."
 ITA_g_the_office_has_a_counterparty_tt: "§GThe Labour Office now has somebody lawful to write to.§! Disputes are settled in correspondence."
 ITA_g_recognised_and_unrecorded_tt: "§RThe leagues are lawful and nobody is counting them.§! The state has legalised an organisation it cannot see."
 ITA_g_turati_is_tempted_tt: "§GThe country is quiet enough that a reformist can defend taking office.§! Milan splits and the ministry gains a wing."
 ITA_g_the_congress_forbids_it_tt: "§RThe piazza is up and no socialist can be seen entering the Quirinale.§! The offer is refused in public and at length."
 ITA_g_half_the_bench_is_rented_tt: "§RA quarter of the Chamber sits for a favour rather than a conviction.§! Everybody can see it and nobody will say it in the hall."
 ITA_g_the_price_is_still_reasonable_tt: "§GThe bought seats are a minority of the majority.§! The arrangement is still cheaper than governing without one."
 ITA_g_the_pamphlet_can_be_documented_tt: "§RThe machine is large enough that every charge in the pamphlet can be checked.§! It is checked."
 ITA_g_the_pamphlet_is_denied_tt: "§GThe book is thin enough to be called a libel.§! The ministry denies it and enough people believe the denial."
 ITA_g_the_floor_is_organised_tt: "§YThe street has a permanent organisation now.§! It will never again fall as low as it used to between strikes."
 ITA_g_the_confederation_is_ours_tt: "§GThe reformists run the Confederation and the Confederation talks to us.§! It was the entire point of the offer to Turati."
 ITA_g_the_confederation_is_its_own_tt: "§RThe Confederation was built without us and answers to nobody in Rome.§! Half a million men, one treasury, and no obligation."
 ITA_g_the_ledger_will_not_close_tt: "§RThere are more promises outstanding than the session can discharge.§! Something in the cabinet has to go."
 ITA_g_it_is_paid_for_this_session_tt: "§GThe accounts balance for another year.§! Next year they will be presented again."
 ITA_g_the_bought_seats_will_not_survive_it_tt: "§RA large part of the majority was bought and none of it is worth anything to eight million voters.§! The machine is written down."
 ITA_g_there_is_little_to_lose_by_it_tt: "§GThe majority does not rest on purchased seats.§! Widening the register costs the ministry very little."
 ITA_g_the_country_has_already_answered_tt: "§GThe election has been held under the wide register.§! Whatever the Chamber is now, it is what the country sent."
 ITA_g_the_country_has_not_been_asked_yet_tt: "§RThe reckoning is forced before the country has voted on it.§! The Chamber resents being valued by a ministry it did not choose."
 ITA_g_the_sacristy_carried_it_tt: "§GThe parish clergy delivered the new voters.§! The majority survives the register, and now owes a debt to a party that does not admit it exists."
 ITA_g_the_bench_stands_on_itself_tt: "§RThere was no Catholic bloc to carry the new electorate.§! The bench faces eight million voters with nothing but its record."
 ITA_s_the_instrument_owes_nothing_tt: "§REvery pledge the ministry was carrying is written off in one circular.§! An instrument does not owe favours, and the deputies who were promised them stop voting with us."
 ITA_s_there_was_nothing_promised_tt: "§GThe ministry took office owing nobody anything.§! The circular costs a morning and offends nobody who matters."
 ITA_s_the_ninety_already_take_orders_tt: "§GThe ninety prefectures were already instructed by the society ministry.§! The new circular only tells them to stop taking anything in return."
 ITA_s_the_brokers_are_told_to_stop_tt: "§RNinety men are told to stop doing the only thing they know how to do.§! Half the arrangements in the provinces come apart before the new ones are made."
 ITA_s_we_are_shutting_what_we_licensed_tt: "§RThe Kingdom recognised the chambers of labour by law and is now sealing their doors.§! Nobody on the Left has to argue that the state is not neutral any more."
 ITA_s_they_had_no_standing_to_lose_tt: "§GThe chambers were tolerated, never recognised.§! Dissolution takes a prefectural order and a locksmith, and the prefects gain the registers."
 ITA_s_seizing_figures_already_printed_tt: "§RThe ledger is already public and the seizures look like a confession.§! Every issue taken off the stone is read in manuscript by twice as many people."
 ITA_s_the_questori_work_quietly_tt: "§GNothing has been published that anyone can compare the seizures against.§! The questori work at four in the morning and the provinces hear nothing."
 ITA_s_the_court_was_beaten_once_already_tt: "§GThe court has been overruled once and knows how it ends.§! The bill of interpretation passes in a single sitting."
 ITA_s_the_bar_reads_the_bill_aloud_tt: "§RThe bar of Rome reads the bill aloud and calls it what it is.§! The profession that administers the law stops believing in the ministry that writes it."
 ITA_s_no_court_will_hear_the_appeal_tt: "§GThe Cassation has been overruled, so a refused licence has nowhere to go.§! The refusals stop being challenged and start being obeyed."
 ITA_s_the_licence_is_litigated_tt: "§REvery refused licence is taken to court and half of them are won there.§! The instrument works, slowly, and in public."
 ITA_s_nobody_signs_the_register_tt: "§RWith the street this high, no league in the Kingdom will put its officers' names on a prefectural list.§! A §Rbayonet§! goes to closing the ones that meet anyway."
 ITA_s_half_of_them_sign_tt: "§GHalf the leagues register and go on meeting under a prefect's eye.§! It is not liberty and it is quieter than dissolution."
 ITA_s_the_courts_carry_what_the_chamber_will_not_tt: "§YWith no majority, the ministry governs through the bench instead.§! It works, and everyone in Italy can see exactly what has been done to the bench."
 ITA_s_the_transfers_pass_unremarked_tt: "§GWith a majority behind it, the ministry moves eleven magistrates to Sardinia and nobody asks a question in the Chamber.§!"
 ITA_s_too_many_voters_to_draw_around_tt: "§RThe register is too large to be drawn around.§! Redistricting a mass electorate produces a majority and an organised enemy in the same afternoon."
 ITA_s_sixty_seats_stop_being_returned_tt: "§GTwo and a half million voters can be sorted into any map the ministry likes.§! Sixty obstructionist seats stop being returned and nobody is disenfranchised."
 ITA_s_vienna_counts_the_garrisons_at_home_tt: "§RVienna counts the divisions standing in Italian cities and subtracts them from the alliance.§!"
 ITA_s_a_free_hand_and_a_tribunal_in_milan_tt: "§RA kingdom with a free hand abroad and a military tribunal in Milan is watched.§! The powers take note of what the army is being used for."
 ITA_s_the_army_already_answers_the_sash_tt: "§GThe army already accepts a prefect's requisition without asking Rome.§! The telegram only shortens a procedure the regiments know."
 ITA_s_the_generals_are_told_afterwards_tt: "§RThe staff learns that prefects may now proclaim sieges by reading the Gazzetta.§! The army does the work and is not consulted about it."
 ITA_s_the_special_laws_have_a_service_now_tt: "§GThe special laws already exist and now there is a service to execute them.§! The works go up in Apulia and Basilicata without a deputy touching them."
 ITA_s_an_administration_with_nothing_to_do_tt: "§RAn administration has been built for a South that has no programme to administer.§! The inspectors write reports about roads nobody has voted."
 ITA_s_the_sele_water_arrives_on_schedule_tt: "§GThe aqueduct was begun and the water arrives on the engineer's date, not the deputy's.§! Apulia stops burying children in the summer."
 ITA_s_the_engineers_start_from_nothing_tt: "§RThere is no aqueduct to finish, only a survey.§! Everything is begun from the first peg and paid for out of patience."
 ITA_s_the_emergencies_become_the_law_tt: "§YThree emergency measures are consolidated into one ordinary law of the Kingdom.§! The separate spirits are replaced by the Code."
 ITA_s_the_code_writes_down_the_bayonets_tt: "§RThe Code is voted by a country that has already been shot at three times.§! What it consolidates is not order but the memory of the volleys."
 ITA_s_a_quiet_kingdom_codified_tt: "§GThe Code arrives before the shooting does.§! It reads as administration rather than as reprisal, and the prefects gain by it."
 ITA_s_a_censured_ministry_that_stays_tt: "§RA ministry the Chamber has censured stays in office anyway.§! A paid arrangement collapses and the street understands the announcement perfectly."
 ITA_s_the_motion_is_never_moved_tt: "§GWith a majority in hand, the doctrine is stated and never has to be tested.§! The censure is simply not moved."
 ITA_s_a_service_that_can_be_told_tt: "§GA permanent inspectorate answering to Rome.§! It is the first Italian institution that can be told to do a thing and will have done it."
 ITA_s_the_inspectors_have_figures_to_start_from_tt: "§GThe ledger is public, so the inspectorate begins with numbers instead of guesses.§! The first quarter is not wasted counting."
 ITA_s_the_inspectors_count_it_themselves_tt: "§RNothing has ever been counted honestly, so the inspectorate must count it first.§! Two years go into arithmetic before anything is administered."
 ITA_s_obedience_stops_at_the_city_gate_tt: "§RThe Kingdom obeys everywhere except where it matters.§! Provinces stop answering Rome and the ministry finds out by telegram."
 ITA_s_the_kingdom_does_what_it_is_told_tt: "§GFrom the Alps to Sicily, the order given in Rome is the order carried out.§! No Italian government has ever been able to say that."
 ITA_s_the_programme_is_finished_tt: "§GTorniamo allo Statuto ceases to be a programme.§! It is the constitution of the Kingdom as actually practised, and the pamphlet is withdrawn."
 ITA_s_the_floor_under_the_piazza_stays_tt: "§RFour or more bayonets were spent getting here.§! The floor under the Piazza does not come down because the ministry has stopped shooting."
 ITA_s_a_form_that_survived_the_cure_tt: "§GThe Statuto is restored to its letter without a general volley.§! Whatever this is, the country has not been broken to get it."
 ITA_s_the_chambers_dissolved: "The Chambers of Labour Dissolved"
 ITA_s_the_chambers_dissolved_desc: "Sealed doors in four cities and the funds under sequestration. Nothing has been settled and everything has been postponed."
 ITA_s_the_prefect_is_an_instrument: "The Prefect as Instrument"
 ITA_s_the_prefect_is_an_instrument_desc: "Ninety men in a sash who take orders and no longer take terms. It is a better machine and a smaller one."
 ITA_s_the_censor_before_the_press: "Seizure Before Publication"
 ITA_s_the_censor_before_the_press_desc: "The questore reaches the stone before the reader does. The papers that survive are the ones that can afford to be careful."
 ITA_s_the_law_of_interpretation: "The Law of Interpretation"
 ITA_s_the_law_of_interpretation_desc: "The Chamber has told the Court of Cassation what the Statuto means. The Court has agreed, in the only way left to it."
 ITA_s_the_south_administered: "The South Administered"
 ITA_s_the_south_administered_desc: "Engineers and inspectors instead of bargains. It builds more per lira and it costs the ministry every Southern deputy it had."
 ITA_s_the_estimates_are_thin: "An Administration Without a Programme"
 ITA_s_the_estimates_are_thin_desc: "The service exists and there is nothing for it to execute. Inspectors write reports about works that were never voted."
 ITA_s_the_registered_leagues: "The Register of Leagues"
 ITA_s_the_registered_leagues_desc: "Association at the price of a list of names at the prefecture. Most of the trade movement accepts it, and the rest goes underground."
 ITA_s_the_licence_to_print: "The Licence to Print"
 ITA_s_the_licence_to_print_desc: "A deposit, a responsible editor of property, and a renewal every year. The great papers are untouched and the provinces are silent."
 ITA_s_the_bench_is_reliable: "A Reliable Bench"
 ITA_s_the_bench_is_reliable_desc: "The promotion lists have been gone through. Judgements now arrive at the answer the ministry expected, which is convenient and widely known."
 ITA_s_the_colleges_redrawn: "The Colleges Redrawn"
 ITA_s_the_colleges_redrawn_desc: "A map drawn in the Interior. It is entirely legal, it disenfranchises nobody, and it decides sixty elections in advance."
 ITA_s_the_siege_by_telegram: "A State of Siege by Telegram"
 ITA_s_the_siege_by_telegram_desc: "Any prefect may proclaim a siege and report it afterwards. The army is quicker than it has ever been and is used for this."
 ITA_s_the_works_administered: "Works Without a Deputy"
 ITA_s_the_works_administered_desc: "Contracts let on an engineer's report. The aqueducts advance on schedule and no Southern member has a favour left to sell."
 ITA_s_the_code_of_public_safety: "The Code of Public Safety"
 ITA_s_the_code_of_public_safety_desc: "One consolidated text replacing four years of emergencies. What was exceptional is now simply the law of the Kingdom."
 ITA_s_the_ministry_holds: "The Ministry Holds"
 ITA_s_the_ministry_holds_desc: "Ministers hold office at the King's pleasure and a vote of the Chamber is an opinion. Government stops being interrupted every eleven months."
 ITA_s_the_administration_that_governs: "The Administration That Governs"
 ITA_s_the_administration_that_governs_desc: "A permanent inspectorate that answers to Rome. It is the most competent thing the Kingdom has ever built and it answers to nobody elected."
 ITA_s_the_state_that_is_obeyed: "The State That Is Obeyed"
 ITA_s_the_state_that_is_obeyed_desc: "Every instrument works. The cost is entered in a column nobody adds up: the number of Italians who think the Kingdom is theirs."
 ITA_s_the_statuto_kept: "The Statuto Kept"
 ITA_s_the_statuto_kept_desc: "The letter of the Statuto restored and the custom of forty years discarded. Whether it is a constitution or a habit is a question for the next reign."
 ITA_s_orlando_at_grace_and_justice: "Orlando at Grace and Justice"
 ITA_s_orlando_at_grace_and_justice_desc: "A Sicilian professor of public law who can prove that anything the ministry has already done was lawful, and who is usually right."
 ITA_s_orlando_at_grace_and_justice_tt: "Vittorio Emanuele Orlando becomes available as a political advisor."
 ITA_s_the_telegram_threat: "Sieges Proclaimed by Telegram"
 ITA_r_the_chambers_in_the_state: "The Chambers in the State"
 ITA_r_the_chambers_in_the_state_desc: "Every chamber of labour has a register, a treasurer and a legal person. Disputes are argued in an office instead of a square, and the prefect has to find a reason before he closes a hall."
 ITA_r_the_new_electorate: "The New Electorate"
 ITA_r_the_new_electorate_desc: "Eight million men on the rolls and evening classes in every commune to teach them what they are holding. They are learning to read on a ballot paper, and nobody in Rome can predict what they will do with it."
 ITA_r_the_collective_contract: "The Collective Contract"
 ITA_r_the_collective_contract_desc: "A wage settled for a whole trade and enforced by a magistrate. The workshops know their costs a year ahead, and the employers of Lombardy have not stopped calling it theft."
 ITA_r_the_ministry_of_labour: "The Ministry of Labour"
 ITA_r_the_ministry_of_labour_desc: "A department with inspectors, estimates and a seat in cabinet, whose business is the men who work. Every dispute in the Kingdom now has somewhere official to go before it reaches the street."
 ITA_r_the_white_leagues: "The White Leagues"
 ITA_r_the_white_leagues_desc: "Catholic unions, rural banks and parish co-operatives across the North, better organised than anything the Chamber has voted. They keep the countryside quiet and they do not take instructions from us."
 ITA_r_the_south_in_the_register: "The South in the Register"
 ITA_r_the_south_in_the_register_desc: "Two million Southern labourers with a vote, in provinces where the state has been a tax collector and a conscription list. They have discovered that Rome will now listen when they are counted."
 ITA_r_the_party_that_split: "The Party That Split"
 ITA_r_the_party_that_split_desc: "Two socialist parties where there was one, each publishing that the other has betrayed the working class. The ministry is sustained by half of a movement and denounced by the other half every week."
 ITA_r_the_syndicalists_outside: "The Syndicalists Outside"
 ITA_r_the_syndicalists_outside_desc: "The men who walked out of Bologna will not contest another election. They want the general strike, they are preparing for it openly, and no law on the books makes preparing for it a crime."
 ITA_r_the_army_that_is_not_called: "The Army That Is Not Called"
 ITA_r_the_army_that_is_not_called_desc: "No regiment is to be requested in a labour dispute. The squares are quieter than they have been since unification, and the officer corps has been told in writing that the country does not trust it indoors."
 ITA_r_the_officers_memorial: "The Officers' Memorial"
 ITA_r_the_officers_memorial_desc: "A grievance signed by more colonels than the ministry cares to count, addressed to the King rather than to the Chamber. Nothing in it is treason and every word of it is remembered in the messes."
 ITA_r_the_militia_establishment: "The Militia Establishment"
 ITA_r_the_militia_establishment_desc: "Short colours, a real territorial reserve and promotion by examination. It is a defensive army that the Extreme Left will vote money for, which is more than the last three establishments could say."
 ITA_r_the_capital_that_left: "The Capital That Left"
 ITA_r_the_capital_that_left_desc: "Orders postponed, extensions cancelled, and three boards announcing that conditions in the Kingdom do not presently justify investment. No law has been broken and the furnaces are banked all the same."
 ITA_r_the_terms_with_the_industrialists: "The Terms With the Industrialists"
 ITA_r_the_terms_with_the_industrialists_desc: "State orders guaranteed for years ahead, against a written undertaking to keep the plant in Italy and honour the trade contracts. Neither side is grateful and both sides keep to it."
 ITA_r_the_school_against_the_parish: "The School Against the Parish"
 ITA_r_the_school_against_the_parish_desc: "Elementary schooling paid by Rome and taught by a state servant with a pension. The curate is no longer the only man in the commune who can explain a printed document to a labourer."
 ITA_r_the_pensions_act: "The Pensions Act"
 ITA_r_the_pensions_act_desc: "Old age and invalidity made compulsory and collected through the registered halls, paid as a right and not as relief. The most expensive thing the Chamber has ever voted for men who own nothing."
 ITA_r_the_eight_hours: "The Eight Hours"
 ITA_r_the_eight_hours_desc: "Eight hours in the arsenals, the state railways and the naval yards. Every private works in the Kingdom is being asked why it cannot manage what the government manages, and the asking does not stop."
 ITA_r_the_kingdom_of_all_italians: "The Kingdom of All Italians"
 ITA_r_the_kingdom_of_all_italians_desc: "The party that was going to overthrow the Kingdom is inside it arguing about estimates. Harder to govern than the country of ten years ago, and a great deal harder to frighten."
 ITA_r_bonomi_at_the_door: "Ivanoe Bonomi"
 ITA_r_bonomi_at_the_door_desc: "A reformist who will explain the ministry to the halls and the halls to the ministry, and who is disbelieved by both in roughly equal measure."
 ITA_r_nitti_at_labour: "Francesco Saverio Nitti"
 ITA_r_nitti_at_labour_desc: "He arrives at the new department with figures nobody asked for and a Southern accent nobody in the cabinet can ignore any longer."
 ITA_r_tb_the_registered_halls: "The Registered Halls"
 ITA_r_tb_the_evening_classes: "The Evening Classes"
 ITA_r_tb_the_labour_code: "The Labour Code"
 ITA_r_tb_the_territorial_militia: "The Territorial Militia"
 ITA_r_tb_the_state_orders: "The State Orders"
 ITA_r_tb_the_lay_school: "The Lay School"
 ITA_r_turati_has_somewhere_to_stand_tt: "§GThe halls are already recognised.§! Turati has an organisation behind him when he answers, and the answer is yes."
 ITA_r_the_offer_is_made_to_nobody_tt: "§RThe halls have no standing in law.§! The offer is made to a party that cannot deliver what it promises."
 ITA_r_the_dead_of_milan_sit_between_them_tt: "§RTroops have been used on the street.§! Every reformist who takes the hand is asked at his next meeting whose hand it is."
 ITA_r_nothing_stands_between_them_tt: "§GNo blood has been spilled by this government.§! The understanding costs the reformists nothing at home."
 ITA_r_the_registers_already_exist_tt: "§GThe halls have been counted once already.§! The registration is a formality and the votes follow it."
 ITA_r_ninety_halls_must_be_counted_tt: "§RNothing has been counted.§! Ninety prefectures must be made to produce a list of societies they have spent ten years closing."
 ITA_r_the_schools_got_there_first_tt: "§GThe Kingdom already reads.§! The new voters were taught before they were enfranchised."
 ITA_r_the_ballot_is_read_aloud_tt: "§RHalf the register cannot read it.§! The ballot is read aloud by whoever is standing nearest, and that is usually the mayor."
 ITA_r_the_mayor_cannot_deliver_them_tt: "§RThe register is too large to buy.§! Provinces instructed: §Y[?ITA_prefects|0]§! of 100."
 ITA_r_the_employers_remember_the_troops_tt: "§RThe employers remember the troops.§! They argue that a government which fired on strikers in one year cannot bind them in another."
 ITA_r_nobody_has_been_shot_over_a_wage_tt: "§GNo wage in this reign has been settled by rifle fire.§! The employers have no grievance to hide behind."
 ITA_r_the_halls_can_sign_for_a_trade_tt: "§GThe chambers of labour can already sign for a whole trade.§! The code has somebody to sign it."
 ITA_r_the_estimates_pass_without_a_division_tt: "§GThe majority is solid.§! The new department gets its estimates without a division and its inspectors within the year."
 ITA_r_a_department_without_a_budget_tt: "§RThe majority is thin.§! The ministry exists on paper and its inspectors are borrowed from Agriculture."
 ITA_r_the_leagues_come_in_with_a_vote_tt: "§GThe ban is lifted.§! The leagues arrive in the Chamber instead of organising against it."
 ITA_r_the_leagues_organise_against_us_tt: "§RThe faithful are still forbidden the ballot.§! The leagues organise the countryside and answer to Rome, not to us."
 ITA_r_the_pact_already_covers_the_communes_tt: "§GThere is already an understanding with the parishes.§! The leagues arrive inside it rather than against it."
 ITA_r_the_machine_still_holds_the_south_tt: "§YThe prefects still hold the South.§! The new voters are delivered in blocks, and the blocks are not free."
 ITA_r_the_south_votes_for_itself_tt: "§GThe machine is gone from the South.§! The new voters answer to nobody, which is the point and also the difficulty."
 ITA_r_they_have_something_to_vote_about_tt: "§GThe South has had its answer from Rome.§! There is a record to run on."
 ITA_r_a_ballot_and_nothing_else_tt: "§RNothing has been done for the South but this.§! The ballot arrives with a list of promises attached."
 ITA_r_the_intransigents_carry_the_hall_tt: "§RThe intransigents carry the congress.§! The ministry keeps its deputies and loses the movement."
 ITA_r_the_reformists_carry_the_hall_tt: "§GThe reformists carry the congress.§! The men who leave take the newspapers and not the votes."
 ITA_r_they_took_the_party_with_them_tt: "§RThey left with the party behind them.§! Every hall that walked out is now organising for the general strike."
 ITA_r_they_took_the_agitators_and_left_the_votes_tt: "§GThey left with the agitators and without the electors.§! The halls that matter stayed registered."
 ITA_r_a_signed_contract_is_hard_to_strike_against_tt: "§GThe trades are under contract.§! A general strike must first break agreements the workmen signed themselves."
 ITA_r_one_regiment_goes_back_to_barracks_tt: "§GOne standing deployment is withdrawn.§! The permanent floor under the street comes down with it."
 ITA_r_the_order_was_never_given_tt: "§GNo troops have ever been called out by this government.§! The instruction only confirms what the prefects already do."
 ITA_r_the_guards_take_the_duty_instead_tt: "§GThe guards of public safety exist.§! There is a civil force to send where the regiments used to go."
 ITA_r_there_is_nobody_else_to_send_tt: "§RThere is no civil force.§! A prefect facing a crowd has the carabinieri and his own nerve."
 ITA_r_they_have_been_paid_this_year_tt: "§GThe officers have had their pay voted.§! The memorial is a complaint and not an ultimatum."
 ITA_r_the_grievance_is_older_than_the_ministry_tt: "§RThe pay question was never settled.§! The memorial arrives on top of ten years of it."
 ITA_r_the_crown_reads_it_and_says_nothing_tt: "§RThe King reads the memorial and returns it without comment.§! That silence is the whole message."
 ITA_r_the_memorial_is_answered_tt: "§GThe memorial is answered by an establishment the army can live with.§! The grievance is withdrawn."
 ITA_r_the_establishment_is_already_cut_tt: "§GThe establishment has already been reduced.§! The militia law is written on top of a settled peace footing."
 ITA_r_the_classes_are_shortened_by_law_tt: "§YThe colours are shortened by statute.§! More men pass through the depots and fewer of them stay."
 ITA_r_the_current_is_not_theirs_to_take_tt: "§GThe current belongs to the state.§! The North cannot switch off what it does not own."
 ITA_r_the_north_can_switch_off_the_lights_tt: "§RThe power stations are private.§! Three boards can bank the furnaces of the triangle between them."
 ITA_r_turin_keeps_its_workshops_open_tt: "§GThe fitters of Turin have their own works.§! One shop stays open whatever the boards decide."
 ITA_r_the_money_comes_back_on_terms_tt: "§GThe capital returns.§! The flight is over and the terms are written down."
 ITA_r_the_chamber_sets_the_price_tt: "§GThe majority is solid enough to name the terms.§! The state buys plant and does not pay for goodwill."
 ITA_r_they_set_the_price_tt: "§RThe majority is too thin to bargain.§! The industrialists write the undertaking and the Chamber votes it."
 ITA_r_the_state_already_pays_the_teacher_tt: "§GThe schools are already the state's.§! The answer to the parish is a matter of adding classrooms."
 ITA_r_the_commune_pays_and_the_curate_chooses_tt: "§RThe communes still pay the teachers.§! Half the Kingdom's schoolmasters are appointed by men who did not want them appointed."
 ITA_r_two_schools_in_every_village_tt: "§YTwo schools in every village.§! The parish and the Kingdom are teaching the same children different things."
 ITA_r_the_remittances_pay_a_part_of_it_tt: "§GEmigration is governed and the remittances are recorded.§! The fund starts with something behind it."
 ITA_r_the_fund_is_short_from_the_first_year_tt: "§RThe fund is short from the first year.§! The Chamber is asked to make good a promise it has already spent."
 ITA_r_the_halls_collect_the_contributions_tt: "§GThe registered halls collect the contributions.§! Nobody has to build a machine to gather the money."
 ITA_r_the_yards_are_building_and_cannot_stop_tt: "§RThe naval programme is running.§! The yards are on contract time and the hours are taken out of the estimates."
 ITA_r_the_arsenals_can_afford_the_hours_tt: "§GThe yards are not under pressure.§! The hours are conceded where the state is the only employer."
 ITA_r_the_private_trades_ask_for_the_same_tt: "§GThe trades are already under contract.§! The private works are asked for the same hours in writing."
 ITA_r_the_private_yards_refuse_it_tt: "§RThe private yards refuse the hours.§! The men in them can see what the state grants its own."
 ITA_r_the_street_has_nothing_left_to_ask_tt: "§GThe street has run out of demands.§! The settlement holds because there is nothing outstanding worth a barricade."
 ITA_r_the_street_is_still_out_there_tt: "§RThe street is still out there.§! The settlement is signed over the top of a grievance that has not been answered."
 ITA_r_a_free_hand_the_left_can_live_with_tt: "§GThe alliance has been denounced.§! The Extreme Left can vote for a foreign policy for the first time."
 ITA_r_the_convention_is_kept_from_the_ministry_tt: "§RThe alliance is kept.§! The military convention is not shown to a cabinet that contains a socialist, and Vienna is told why."
 ITA_z_the_proletarian_nation: "The Proletarian Nation"
 ITA_z_the_proletarian_nation_desc: "The government has adopted a phrase, and phrases adopted by governments do not stay where they are put. The country is louder, prouder and rather harder to govern, and the men who sell it grain and coal have noticed the change of tone."
 ITA_z_the_idea_nazionale: "L'Idea Nazionale"
 ITA_z_the_idea_nazionale_desc: "A daily paper that is not the organ of any group in the Chamber and cannot be silenced by withholding the government advertisements. It sets the terms of the argument every morning before the ministry has finished its coffee."
 ITA_z_the_associazione_nazionalista: "The Nationalist Association"
 ITA_z_the_associazione_nazionalista_desc: "Committees in every provincial capital, made up of exactly the men the prefect would have invited anyway. Respectable, monarchist, and useful to a ministry for as long as the ministry says what the committees expect to hear."
 ITA_z_trento_e_trieste: "Trento e Trieste"
 ITA_z_trento_e_trieste_desc: "The irredenta is government policy and is spoken of as such. It costs nothing to say and a great deal to un-say, and it has made a difficult neighbour into a neighbour who reads our newspapers with a pencil in his hand."
 ITA_z_the_paper_read_aloud: "The Paper Read Aloud"
 ITA_z_the_paper_read_aloud_desc: "The argument now travels past the last railway station. It arrives simplified, and simplified it is far more useful to a recruiting sergeant than it ever was to an editor."
 ITA_z_the_emigrant_who_is_counted: "The Emigrant Who Is Counted"
 ITA_z_the_emigrant_who_is_counted_desc: "A register, a consul and a returning address. The kingdom knows where its people went, writes to them, and has begun to suggest that they might have gone somewhere the flag already flies."
 ITA_z_the_nation_before_the_class: "The Nation Before the Class"
 ITA_z_the_nation_before_the_class_desc: "A doctrine with a bibliography, taught in the reviews and repeated in the halls. It takes the edge off the class quarrel and puts that edge somewhere else, and the somewhere else is across a frontier."
 ITA_z_the_schools_beyond_the_frontier: "The Schools Beyond the Frontier"
 ITA_z_the_schools_beyond_the_frontier_desc: "Teachers on the Roman payroll in towns that are not Roman. It buys goodwill among Italians we do not govern and a standing grievance with the government that does."
 ITA_z_the_schools_beyond_the_frontier_reinforced: "The Schools Beyond the Frontier Are Reinforced"
 ITA_z_the_schools_beyond_the_frontier_reinforced_desc: "The teaching grant is doubled, the inspectors travel with consular passports, and every schoolmaster sends back what he sees on the road he takes to work."
 ITA_z_the_alliance_on_terms: "The Alliance on Terms"
 ITA_z_the_alliance_on_terms_desc: "The treaty is still signed and the staff talks still happen, but the Consulta now keeps an account of what the alliance has returned this year. Allies who are audited behave differently towards us, and so do their enemies."
 ITA_z_the_lantern_circuit: "The Lantern Circuit"
 ITA_z_the_lantern_circuit_desc: "Forty slides and a folding screen, in market towns where the last public meeting was about a bridge. Cheap, patient, and remarkably effective on men of nineteen."
 ITA_z_the_italian_bottoms: "The Italian Bottoms"
 ITA_z_the_italian_bottoms_desc: "The emigrant trade is carried under our own flag and inspected by our own officers. The yards have steady work, the consuls have a passenger list, and the freight no longer leaves the country in a foreign ledger."
 ITA_z_the_syndicalists_of_the_nation: "The Syndicalists of the Nation"
 ITA_z_the_syndicalists_of_the_nation_desc: "Organisers who know how to call men out, working for a ministry instead of against one. They bring discipline and a following, and they bring quarrels that no cabinet has ever had to arbitrate before."
 ITA_z_the_consular_service: "The Consular Service"
 ITA_z_the_consular_service_desc: "Small posts in small Adriatic ports, each with a cipher and a school subsidy. What comes back is not diplomacy so much as soundings, and the naval staff has asked to be kept on the distribution."
 ITA_z_the_national_subscription: "The National Subscription"
 ITA_z_the_national_subscription_desc: "Public lists, public totals and a printed roll of the subscribers. It is slower than a vote of credit and it commits far more people, which is the only reason it was preferred."
 ITA_z_the_strike_is_a_national_question: "The Strike Is a National Question"
 ITA_z_the_strike_is_a_national_question_desc: "The decree stands over every yard and every main line. The trains run and the ministry is obeyed, and the price is paid in a country that no longer believes the state is a stranger to the quarrel."
 ITA_z_the_fourth_shore_programme: "The Fourth Shore"
 ITA_z_the_fourth_shore_programme_desc: "Surveys, grants and sailings, all promised in advance. It sends men and money out of the peninsula on the strength of a shore the kingdom may or may not come to hold."
 ITA_z_the_receipt_from_vienna: "The Receipt from Vienna"
 ITA_z_the_receipt_from_vienna_desc: "An ally who has been asked, in writing, to state what our friendship is worth. Whatever the answer, the question cannot be withdrawn, and Europe has been told that it was asked."
 ITA_z_the_nation_in_arms: "The Nation in Arms"
 ITA_z_the_nation_in_arms_desc: "The full class trained and the towns full of men who have handled a rifle since. The kingdom can raise more and raise it faster, and pays for it in every other estimate on the table."
 ITA_z_the_country_that_cannot_climb_down: "The Country That Cannot Climb Down"
 ITA_z_the_country_that_cannot_climb_down_desc: "Every ministry from here is a prisoner of the last ten years of speeches. Retreat is no longer a policy that can be presented to the Chamber, and the country will hold together under a blow far better than it will hold together under an apology."
 ITA_z_mare_nostrum: "Mare Nostrum"
 ITA_z_mare_nostrum_desc: "The Adriatic is declared an Italian question in a printed programme with the harbours named. The fleet takes it as an order, the Treasury takes it as a bill, and Pola takes it as a notice."
 ITA_z_greater_italy: "The Greater Italy"
 ITA_z_greater_italy_desc: "A standard the kingdom is now measured against. It makes men, war support and a justification quickly, and it makes every unfinished thing in the country look like a betrayal."
 ITA_national_union: "Unione Nazionale"
 ITA_national_union_long: "Unione Nazionale Italiana"
 ITA_z_corradini_at_the_paper: "Corradini at the Paper"
 ITA_z_corradini_at_the_paper_desc: "He invented the argument and he will not let it be softened for the convenience of a majority. Useful in a hall, dangerous in a cabinet, and impossible to dismiss now that the phrase is in the King's speech."
 ITA_z_boselli_at_the_dante: "Boselli at the Dante"
 ITA_z_boselli_at_the_dante_desc: "Seventy years old, on every committee in Rome, and president of a society with a school in half the towns of the Adriatic. He can raise a subscription in an afternoon and offend nobody doing it."
 ITA_z_tb_the_national_argument: "The National Argument"
 ITA_z_tb_the_press_room: "The Press Room"
 ITA_z_tb_the_reading_rooms: "The Reading Rooms"
 ITA_z_tb_the_dante_lectures: "The Dante Lectures"
 ITA_z_tb_the_terms_are_drafted: "The Terms Are Drafted"
 ITA_z_tb_the_emigrant_liners: "The Emigrant Liners"
 ITA_z_tb_the_cipher_from_durazzo: "The Cipher from Durazzo"
 ITA_z_tb_the_subscription_ship: "A Ship by Subscription"
 ITA_z_tb_the_subscription_schools: "Schools by Subscription"
 ITA_z_tb_the_terms_are_read_twice: "The Terms Are Read Twice"
 ITA_z_tb_the_nation_in_arms: "The Nation in Arms"
 ITA_z_tb_the_sea_that_must_be_ours: "The Adriatic Programme"
 ITA_z_tb_the_greater_italy: "The Greater Italy"
 ITA_z_threat_the_state_irredenta: "Italy has made the irredenta state policy"
 ITA_z_threat_the_school_question: "Italy is quarrelling over schools across the frontier"
 ITA_z_threat_the_adriatic_consulates: "Italian consulates are opening along the Adriatic"
 ITA_z_threat_the_compensation_demanded: "Italy has demanded compensation in advance"
 ITA_z_threat_the_terms_are_published: "Italy has published the terms of the alliance"
 ITA_z_threat_the_receipt_refused: "Italy has been refused her compensation"
 ITA_z_threat_the_receipt_torn_up: "Italy has torn up her account with Vienna"
 ITA_z_threat_the_fourth_shore: "Italy has a settlement programme for a shore she does not hold"
 ITA_z_threat_the_settlement_scheme: "Italy is promising land in Tripolitania"
 ITA_z_threat_the_adriatic_programme: "Italy has named the harbours she wants"
 ITA_z_threat_the_adriatic_squadron: "The Italian squadron has moved north"
 ITA_z_threat_the_country_that_cannot_climb_down: "Italy can no longer withdraw from her own programme"
 ITA_z_threat_the_programme_has_a_date: "The Italian programme has been given a date"
 ITA_z_threat_the_greater_italy: "Italy has declared the whole of her programme"
 ITA_z_tt_the_street_hears_proletarian_and_stops_listening: "The street hears the word proletarian and hears nothing after it"
 ITA_z_tt_the_notables_sign_the_appeal: "The notables sign the appeal without being asked twice"
 ITA_z_tt_the_paper_prints_the_phrase_back: "The paper prints a great power on paper back at the ministry every week"
 ITA_z_tt_a_weekly_with_a_press_of_its_own: "A weekly with a press of its own, and no more than that"
 ITA_z_tt_the_paper_turns_on_the_ministry_too: "The paper turns on the ministry as readily as on the opposition"
 ITA_z_tt_the_lobby_reads_it_before_breakfast: "The lobby reads it before breakfast and votes accordingly"
 ITA_z_tt_the_paper_hands_over_its_subscription_list: "The paper hands over its subscription list to the founders"
 ITA_z_tt_a_congress_nobody_reported: "A congress that no newspaper thought worth reporting"
 ITA_z_tt_the_ally_reads_the_speech_from_the_throne: "The ally reads the speech from the throne, and reads it twice"
 ITA_z_tt_the_claim_is_already_public: "The claim was already public and this only dates it"
 ITA_z_tt_the_consulta_has_not_been_told: "The Consulta learns of the policy from the newspapers"
 ITA_z_tt_the_readers_do_not_need_a_reader: "The kingdom reads it for itself"
 ITA_z_tt_the_schoolmaster_reads_it_out: "The state schoolmaster reads it out on Sunday"
 ITA_z_tt_half_the_kingdom_is_told_what_it_says: "Half the kingdom is told what it says by whoever is holding it"
 ITA_z_tt_the_commissariat_already_keeps_the_register: "The Commissariat of Emigration already keeps the register"
 ITA_z_tt_nobody_knows_how_many_left_last_year: "Nobody in Rome can say how many left last year"
 ITA_z_tt_the_argument_is_made_at_home_instead: "The argument is made to men who are staying"
 ITA_z_tt_the_chambers_of_labour_answer_it: "The chambers of labour answer the doctrine in kind"
 ITA_z_tt_the_argument_lands_on_quiet_ground: "The argument lands on quiet ground and takes root"
 ITA_z_tt_the_troops_already_answered_the_argument: "The troops answered this argument once already, and are remembered for it"
 ITA_z_tt_vienna_protests_and_is_answered_politely: "Vienna protests and is answered with great politeness"
 ITA_z_tt_the_schools_are_closed_by_the_statthalter: "The Statthalter closes the schools and makes them famous"
 ITA_z_tt_the_renewal_now_has_a_price_written_on_it: "The renewal now has a price written on it"
 ITA_z_tt_there_is_nothing_left_to_price: "There is no alliance left to put a price on"
 ITA_z_tt_the_consulta_is_instructed_before_it_signs: "The Consulta is instructed before it signs anything"
 ITA_z_tt_the_prefect_lends_the_hall: "The prefect lends the hall and sits in the front row"
 ITA_z_tt_the_hall_is_hired_by_subscription: "The hall is hired out of the subscribers' pockets"
 ITA_z_tt_the_same_lecturer_goes_to_trieste: "The same lecturer takes the lantern across to Trieste"
 ITA_z_tt_the_export_yard_takes_the_order: "The export yard takes the order for the liners"
 ITA_z_tt_the_lines_are_chartered_from_abroad: "The lines are chartered abroad and the flag is a courtesy"
 ITA_z_tt_the_third_class_deck_is_ours_to_answer_for: "The third class deck is now ours to answer for"
 ITA_z_tt_they_bring_a_following_with_them: "They bring their organisers and a following with them"
 ITA_z_tt_they_bring_only_themselves: "They bring themselves and a printing press"
 ITA_z_tt_the_association_will_not_sit_with_them: "The Association will not sit at a table with them"
 ITA_z_tt_valona_is_already_watched: "Valona is already watched and the consulate only formalises it"
 ITA_z_tt_the_consulates_are_opened_first: "The consulates are opened before anyone has decided why"
 ITA_z_tt_the_naval_staff_asked_for_this_years_ago: "The naval staff asked for exactly this years ago"
 ITA_z_tt_the_ballhausplatz_is_handed_the_bill: "The Ballhausplatz is handed the bill in advance"
 ITA_z_tt_they_pay_because_they_still_need_us: "They pay, because they still need the third signature"
 ITA_z_tt_they_answer_that_the_article_says_consultation: "They answer that the article says consultation and nothing else"
 ITA_z_tt_the_lecturers_pass_the_hat: "The lecturers pass the hat at the end of every evening"
 ITA_z_tt_the_lists_are_short: "The lists are short and headed by the same eleven families"
 ITA_z_tt_the_money_is_asked_for_a_ship: "The subscription is asked for a ship"
 ITA_z_tt_the_money_is_asked_for_the_schools: "The subscription is asked for the schools"
 ITA_z_tt_the_troops_go_out_and_the_floor_rises: "The troops go out, and the street never settles as low again"
 ITA_z_tt_the_decree_is_printed_and_not_yet_used: "The decree is printed and left in the prefect's drawer"
 ITA_z_tt_the_squadrons_answer_instead_of_the_line: "The mobile squadrons answer instead of the line regiments"
 ITA_z_tt_the_barracks_answer_and_remember_it: "The barracks answer, and the barracks remember being asked"
 ITA_z_tt_the_land_is_ours_and_now_must_be_filled: "The shore is held, and now it has to be filled"
 ITA_z_tt_the_promise_is_turned_into_a_prospectus: "The promise of Tripoli is turned into a prospectus"
 ITA_z_tt_a_programme_for_a_shore_we_do_not_hold: "A settlement programme for a shore the kingdom does not hold"
 ITA_z_tt_the_register_is_told_where_to_go: "The emigration register is told where the sailings go"
 ITA_z_tt_the_ledger_is_already_closed: "The ledger with Vienna is already closed"
 ITA_z_tt_the_ally_pays_in_words_and_a_railway: "The ally pays in warm words and a railway concession"
 ITA_z_tt_petersburg_holds_the_other_copy: "Petersburg holds the other copy of the understanding"
 ITA_z_tt_the_full_class_is_already_called: "The full annual class is already being called"
 ITA_z_tt_the_estimates_are_asked_for_all_at_once: "The estimates are asked for entire and all at once"
 ITA_z_tt_the_rifle_clubs_are_full: "The rifle clubs fill up from the lecture circuit"
 ITA_z_tt_the_street_is_already_ahead_of_the_ministry: "The street is already ahead of the ministry that taught it"
 ITA_z_tt_the_ministry_is_still_a_length_ahead: "The ministry is still a length ahead of the procession"
 ITA_z_tt_the_floor_under_the_street_is_now_high: "Too many bayonets have been spent for any ministry to look calm"
 ITA_z_tt_no_ministry_may_now_concede: "No ministry may now concede anything without being called a traitor"
 ITA_z_tt_the_fleet_was_built_to_go_out: "The fleet was built to go out, and the programme suits it"
 ITA_z_tt_the_fleet_was_built_to_stay_in: "The fleet was built to stay in, and the programme does not suit it"
 ITA_z_tt_the_programme_arrives_before_the_fleet: "The programme arrives several years before the fleet"
 ITA_z_tt_the_consuls_have_already_named_the_harbours: "The consuls named the harbours before the programme did"
 ITA_z_tt_the_chamber_votes_the_programme_entire: "The Chamber votes the programme entire and without amendment"
 ITA_z_tt_the_programme_is_carried_over_the_chamber: "The programme is carried over the Chamber rather than through it"
 ITA_z_tt_the_street_will_be_asked_to_pay_for_it: "The street will be asked to pay for it, and knows"
 ITA_z_tt_the_students_are_moved_on_quietly: "The students are moved on quietly and nothing is reported"
 ITA_z_tt_the_doctrine_is_left_in_the_reviews: "The doctrine is left in the reviews where it started"
 ITA_z_tt_the_notables_keep_the_committee: "The notables keep the committee and the newcomers keep the street"
 ITA_z_tt_the_prospectus_is_left_on_the_table: "The prospectus is left on the table for a better year"
 ITA_z_tt_the_rifles_stay_in_the_armoury: "The rifles stay in the armoury and the clubs drill with sticks"
 ITA_z_tt_the_squadron_stays_at_taranto: "The squadron stays at Taranto and the programme stays on paper"
 ITA_z_tt_the_floor_never_comes_down_again: "Whatever the street was before this week, it will not be that again"
 ITADNC_air_the_airship_goes_to_sea: "The Airship Goes to Sea"
 ITADNC_air_the_airship_goes_to_sea_desc: "From a shed on the lagoon an airship can hold the mouth of the Adriatic in sight all day and count what leaves Pola. We must give the dirigibles to the navy and take the army's annual protest in the estimates."
 ITADNC_air_the_memoranda_of_douhet: "The Memoranda of Douhet"
 ITADNC_air_the_memoranda_of_douhet_desc: "A major of the Bersaglieri who has never flown keeps sending us memoranda arguing that the air is a theatre of its own. We must read them to the end and put him where he can be answered, because half of it is wrong and all of it is early."
 ITADNC_air_the_engine_that_is_ours: "The Engine That Is Ours"
 ITADNC_air_the_engine_that_is_ours_desc: "Every aeroplane we own turns a French rotary bought at the price Paris asks. We must tell Fiat, Isotta Fraschini and the fitters of Turin to build an aero engine that will run for an hour, and sit through the ones that will not."
 ITADNC_air_the_seaplane_station: "The Seaplane Station"
 ITADNC_air_the_seaplane_station_desc: "Along most of our coast there is nowhere for a machine to come down but the water. We must build stations on the lagoon and the Ligurian shore with slipways and a crane, and order the machines that can use them."
 ITADNC_air_the_orders_of_the_ministry: "The Orders of the Ministry"
 ITADNC_air_the_orders_of_the_ministry_desc: "We have bought aviation one machine at a time, at the whim of whichever officer was at the table. We must fix the types, the numbers and the deliveries years ahead, so a maker can lay out a shop knowing we shall still be buying."
 ITA_air_the_lesson_of_wilbur_wright: "The Lesson of Wilbur Wright"
 ITA_air_the_lesson_of_wilbur_wright_desc: "The kingdom has a handful of men who were taught to fly by the man who invented it, and they are teaching the next handful. It is not an air service. It is a small number of people who know something nobody else in Italy knows."
 ITA_air_the_dirigible_lobby: "The Dirigible Lobby"
 ITA_air_the_dirigible_lobby_desc: "The airship engineers hold the aeronautical estimates, the sheds and the ear of the ministry, and they spend a good part of their energy explaining why the aeroplane is not ready. The kingdom gets endurance and reconnaissance, and pays for it in everything else."
 ITA_air_the_answer_of_the_world: "The Answer of the World"
 ITA_air_the_answer_of_the_world_desc: "Italy is the country that did it first. Every staff in Europe has a file, every chancellery has a note, and the kingdom is watched now with a particular kind of attention that flatters and does not protect."
 ITA_air_the_makers_of_the_kingdom: "The Makers of the Kingdom"
 ITA_air_the_makers_of_the_kingdom_desc: "A short list of firms that can build an aeroplane, kept alive by orders the kingdom does not strictly need yet. It is dearer than buying from Paris and it is the only way the kingdom will ever stop buying from Paris."
 ITA_air_the_hangars_of_the_north: "The Hangars of the North"
 ITA_air_the_hangars_of_the_north_desc: "Airship stations inland, with the frontier passes on one side and the kingdom's own provinces on the other. The photographs go to the staff, and copies go wherever else they are asked for."
 ITA_air_the_airship_goes_to_sea: "The Airship Goes to Sea"
 ITA_air_the_airship_goes_to_sea_desc: "The dirigibles belong to the admiralty, work over water and report on what leaves the far shore. The army has learned to say the word aviation with a certain coldness."
 ITA_air_the_memoranda_of_douhet: "The Memoranda of Douhet"
 ITA_air_the_memoranda_of_douhet_desc: "A theory of air war exists in the kingdom before the aeroplanes do, written in full, circulated and argued with. Being years early is worth something, and it costs the patience of every senior officer who has to read it."
 ITA_air_the_schools_at_the_makers_fields: "The Schools at the Makers' Fields"
 ITA_air_the_schools_at_the_makers_fields_desc: "Flying is taught by the men who build the machines, at their own fields, to anybody who can pay. It is quicker than the army school, cheaper than the army school, and entirely outside the army."
 ITA_air_the_lobby_is_answered: "The Lobby Is Answered"
 ITA_air_the_lobby_is_answered_desc: "The airship question is settled and the aeronautical estimates stop being an argument between two parties of engineers. Whichever side won, the ministry can now write one programme instead of refereeing two."
 ITA_air_the_command_of_the_air: "The Command of the Air"
 ITA_air_the_command_of_the_air_desc: "The kingdom has squadrons meant to go past the army and hit what is behind it, and a doctrine that says so in writing. The machines are not equal to the idea, and will be flown as though they were."
 ITA_air_the_orders_of_the_ministry: "The Orders of the Ministry"
 ITA_air_the_orders_of_the_ministry_desc: "A standing order with fixed types and fixed dates. The makers can hire, lay out a shop and plan a year ahead; the ministry has bound its own hands for three years to obtain that."
 ITA_air_the_reserve_of_pilots: "The Reserve of Pilots"
 ITA_air_the_reserve_of_pilots_desc: "A register of every man in the kingdom who holds a brevet, with an undertaking against each name. On the day it is wanted the flying service is three times the size of the flying service."
 ITA_air_the_naval_flying_service: "The Naval Flying Service"
 ITA_air_the_naval_flying_service_desc: "The fleet has its own aviators, its own stations and its own idea of what aeroplanes are for. It also has a second aeronautical establishment competing with the first for every officer and every shed."
 ITA_air_the_arm_of_its_own: "An Arm of Its Own"
 ITA_air_the_arm_of_its_own_desc: "Aviation is a service with a director, an establishment and a career that ends somewhere other than an infantry regiment. Everything that has been improvised since the balloon company now has an address."
 ITA_air_crocco_at_the_works: "Crocco at the Airship Works"
 ITA_air_crocco_at_the_works_desc: "Gaetano Crocco designs the kingdom's airships, argues for them in the ministry, and is right about them for about six more years."
 ITA_air_tt_calderara_teaches_what_he_was_taught: "Mario Calderara stays on the field and teaches what Wright taught him."
 ITA_air_tt_the_lesson_is_not_written_down: "The lesson goes home with the American and nobody writes it down."
 ITA_air_tt_the_crowd_at_centocelle: "Half of Rome comes out to the field and goes home certain the century belongs to us."
 ITA_air_tt_the_left_asks_what_it_is_for: "The Extreme Left grants that a school is a school, and asks what comes after it."
 ITA_air_tt_the_field_is_closed_to_the_press: "The field is closed to the press and the flights are reported by the prefecture."
 ITA_air_tt_the_ministry_takes_the_credit: "The ministry takes the credit and the item passes without a division."
 ITA_air_tt_crocco_speaks_for_the_airship: "Gaetano Crocco is available as a theorist and will argue for the airship."
 ITA_air_tt_the_lobby_is_a_constituency: "The airship men are a constituency like any other and are treated as one."
 ITA_air_tt_the_ministry_does_not_consult: "The minister hears the deputation and decides without it."
 ITA_air_tt_the_left_prices_the_shed: "The Extreme Left reads out what one shed costs in schoolrooms."
 ITA_air_tt_the_airship_is_a_flag: "An airship over a city is worth more than what it can carry."
 ITA_air_tt_the_motor_trade_answers: "The Turin motor trade sends fitters, benches and a working drawing office."
 ITA_air_tt_the_shed_stands_alone: "There is no trade behind the shed and every part is made twice."
 ITA_air_tt_an_italian_machine_at_last: "A machine designed, built and flown in the kingdom, and the papers say so for a week."
 ITA_air_tt_the_ministry_prefers_to_buy_abroad: "The ministry would rather buy abroad and is voted down politely."
 ITA_air_tt_the_current_fills_the_envelope: "National current runs the electrolysis plants and the gas costs the kingdom nothing abroad."
 ITA_air_tt_the_gas_is_bought_in: "The hydrogen is bought in, and the sheds wait on somebody else's delivery."
 ITA_air_tt_the_airship_watches_the_provinces: "The dirigibles photograph the provinces as readily as the frontier, and the prefects notice."
 ITA_air_tt_the_estimates_are_read_out_line_by_line: "The Extreme Left reads the aeronautical estimate out line by line."
 ITA_air_tt_the_kingdom_signs_nothing: "The kingdom declines to sign anything limiting what may be dropped from an aeroplane."
 ITA_air_tt_the_kingdom_sends_a_note: "A note is sent explaining that the grenades were aimed at a military camp."
 ITA_air_tt_the_feat_is_taught_in_schools: "The flight over the oasis is printed in the school readers within the year."
 ITA_air_tt_the_chamber_hears_the_word_murder: "The word murder is used in the Chamber and is not withdrawn."
 ITA_air_tt_the_papers_are_told_what_to_print: "The prefects instruct the papers on what the despatch actually said."
 ITA_air_tt_the_ministry_says_as_little_as_possible: "The ministry says as little as possible and waits for the next subject."
 ITA_air_tt_turin_takes_the_second_contract: "Turin takes the second contract and the industrial triangle has two aeroplane shops."
 ITA_air_tt_one_shop_for_a_kingdom: "One shop for a kingdom, and every order queues behind the last."
 ITA_air_tt_the_left_wants_the_works_inspected: "The Extreme Left votes the contracts and sends inspectors with them."
 ITA_air_tt_the_nation_makes_its_own_wings: "A nation that buys its wings abroad is a nation that flies on sufferance."
 ITA_air_tt_the_passes_are_photographed: "The frontier survey is photographed from the air and the maps are corrected."
 ITA_air_tt_there_is_no_map_to_correct: "There is no survey to correct and the photographs go into a drawer."
 ITA_air_tt_the_prefects_ask_for_the_photographs: "The prefects ask for copies of the photographs and are given them."
 ITA_air_tt_the_photographs_go_to_the_land_registry: "The photographs go to the land registry and settle four boundary disputes."
 ITA_air_tt_pola_is_counted_from_the_air: "What lies in Pola is counted from the air, in daylight, once a week."
 ITA_air_tt_nobody_asked_the_admirals_what_for: "The airships are handed over before anybody asks the admirals what for."
 ITA_air_tt_vienna_is_told_it_is_for_the_customs: "Vienna is told the airships are for the customs service and does not believe it."
 ITA_air_tt_the_adriatic_is_watched_openly: "The watch on the Adriatic is kept openly and meant to be seen."
 ITA_air_tt_douhet_is_given_a_desk: "Giulio Douhet is given a desk, a file and the right to circulate what he writes."
 ITA_air_tt_the_papers_circulate_unsigned: "The memoranda circulate unsigned and are attributed to four different officers."
 ITA_air_tt_the_staff_reads_to_the_end: "The staff reads to the end, disagrees on paper, and keeps the file open."
 ITA_air_tt_the_memoranda_are_filed: "The memoranda are acknowledged, filed, and not circulated further."
 ITA_air_tt_the_reviews_print_him: "The nationalist reviews print him in full and treat him as a prophet."
 ITA_air_tt_the_ministry_prefers_him_quiet: "The ministry would rather he wrote less and is careful not to say so."
 ITA_air_tt_the_fitters_already_know_the_work: "The fitters of Turin have been machining to a thousandth for a decade already."
 ITA_air_tt_the_first_engines_seize: "The first engines seize on the bench and the programme starts again."
 ITA_air_tt_the_left_asks_who_owns_the_patent: "The Extreme Left asks who will own the patent and is answered in writing."
 ITA_air_tt_no_more_french_rotaries: "The kingdom stops buying rotaries from Paris, and Paris is told why."
 ITA_air_tt_the_gunmaker_takes_the_wing_spar: "The gun shop has the steel, the jigs and the men, and takes the wing spar."
 ITA_air_tt_a_shop_without_a_trade: "A new shop with no trade behind it learns the work the expensive way."
 ITA_air_tt_the_chamber_asks_about_the_contract: "The Chamber asks how the Ansaldo contract was awarded and gets no clear answer."
 ITA_air_tt_genoa_votes_the_right_way: "Genoa has work, and Genoa votes the way work votes."
 ITA_air_tt_centocelle_sets_the_syllabus: "Centocelle sets the syllabus and the private schools teach to it."
 ITA_air_tt_every_school_teaches_its_own_way: "Every school teaches its own way and every brevet means something different."
 ITA_air_tt_the_schools_take_men_without_a_name: "The schools take any man who can pay, which is not how the army chooses officers."
 ITA_air_tt_the_register_of_the_schools_is_copied: "The prefecture takes a copy of every school register as a matter of course."
 ITA_air_tt_the_aeroplane_men_win_on_the_figures: "The aeroplane men win on cost, on numbers and on how quickly one can be replaced."
 ITA_air_tt_the_airship_men_keep_the_room: "The airship men keep the estimates, the sheds and the argument."
 ITA_air_tt_the_minister_decides_alone: "The minister decides between them alone and informs the Chamber afterwards."
 ITA_air_tt_both_sides_keep_something: "Both sides keep something, which is how this ministry settles anything."
 ITA_air_tt_calderara_gets_his_water: "Mario Calderara gets the water he has been asking for since he learned to fly."
 ITA_air_tt_the_station_waits_for_a_pilot: "The slipway is built and the station waits for somebody who can use it."
 ITA_air_tt_a_machine_that_saves_fishermen: "The first thing the station does is take three fishermen off a sandbank."
 ITA_air_tt_the_sea_is_ours_to_watch: "The sea between the two shores is ours to watch and we mean to watch it."
 ITA_air_tt_libya_is_the_only_evidence_anyone_has: "Libya is the only evidence anybody in Europe has, and it is ours."
 ITA_air_tt_a_doctrine_without_a_precedent: "A doctrine with no precedent behind it is an opinion with footnotes."
 ITA_air_tt_the_ministry_is_asked_why_bombs_are_an_item: "The Chamber asks why bombs are an item in the estimates of a country at peace."
 ITA_air_tt_a_weapon_worthy_of_the_nation: "A weapon that does not wait for the army is a weapon worthy of the nation."
 ITA_air_tt_the_estimate_is_taken_by_decree: "The bombardment estimate is taken by decree and laid before the Chamber later."
 ITA_air_tt_the_item_is_called_experimental: "The item is entered as experimental and passes without discussion."
 ITA_air_tt_the_machine_matches_the_memorandum: "For once the machine on the field matches the machine in the memorandum."
 ITA_air_tt_nobody_can_say_what_it_is_for: "It is the largest aeroplane in the world and nobody can say what it is for."
 ITA_air_tt_the_largest_aeroplane_in_europe: "The largest aeroplane in Europe is Italian, and every attache comes to look."
 ITA_air_tt_the_order_is_placed_quietly: "The order is placed quietly and announced after the machines are delivered."
 ITA_air_tt_the_makers_can_lay_out_a_shop: "With three years of orders in hand the makers hire, build and plan ahead."
 ITA_air_tt_an_order_with_nobody_to_fill_it: "A standing order and nobody in the kingdom able to fill it on time."
 ITA_air_tt_the_order_never_reaches_the_chamber: "The order is signed in the ministry and never reaches the Chamber at all."
 ITA_air_tt_the_contract_is_printed_in_full: "The contract is printed in full, prices included, and survives the reading."
 ITA_air_tt_the_battalion_gets_a_second_intake: "The battalion takes a second intake without waiting for the annual class."
 ITA_air_tt_a_register_and_nowhere_to_send_them: "A register of pilots and no establishment to send them to."
 ITA_air_tt_the_undertaking_is_not_optional: "The undertaking is presented for signature and is not in practice optional."
 ITA_air_tt_the_undertaking_may_be_declined: "The undertaking may be declined, and the register records who declined."
 ITA_air_tt_they_sign_before_they_are_asked: "Half of them have signed before the circular reaches their school."
 ITA_air_tt_the_admiralty_pays_for_it_itself: "The admiralty pays for its aviators out of the naval vote and owes nobody."
 ITA_air_tt_two_services_one_estimate: "Two flying services and one aeronautical estimate between them."
 ITA_air_tt_the_two_services_are_reconciled_on_paper: "The two services are reconciled on paper, which is where the quarrel now lives."
 ITA_air_tt_the_crown_settles_it_between_them: "The Crown settles the question between them and neither may appeal."
 ITA_air_tt_the_directorate_does_not_get_the_sea: "The directorate is given everything that flies except what flies from water."
 ITA_air_tt_one_directorate_for_everything_that_flies: "One directorate takes everything that flies, water included."
 ITA_air_tt_the_arm_is_shown_to_the_country: "The new arm is paraded, photographed and shown to the country as its own."
 ITA_air_tt_the_arm_answers_to_the_chamber: "The new arm reports to a minister who answers questions in the Chamber."
 ITA_air_tt_the_arm_answers_to_the_crown: "The new arm answers to the Crown through the ministry and to nobody else."
 ITA_air_tt_the_arm_is_an_office_with_a_budget_line: "The new arm is an office, a director and a line in the estimates, and that is enough."
