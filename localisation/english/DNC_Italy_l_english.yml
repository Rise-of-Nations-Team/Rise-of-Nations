 RON_Atheism: "The State Has No Church"
 RON_Atheism_desc: "No oath is sworn on a book here. It buys the government a free hand and costs it the parish priest, who was the only man in some villages who could read the notices aloud."
 RON_European_Union: "The Community of Six"
 RON_European_Union_desc: "A customs union that its founders describe as a market and its lawyers draft as a constitution. Steel and coal move without a tariff, and so, eventually, does everything else."
