 ITA_w_the_libyan_survey: "The Libyan Survey"
 ITA_w_the_column_and_the_well: "The Desert Columns"
 ita_dnc.500.t: "How the Powers See Us"
 ita_dnc.500.d: "The foreign ministry has written down how the other powers see us. Berlin calls us a road to the Rhine that may or may not be open. Vienna expects us to ask for Trento one day. Paris thinks we can be bought. London counts us a customer with a long coast and no coal.\n\nThe King has read all four judgements and disagrees with none of them. We have to decide what to do with a reputation like this."
 ita_dnc.500.a: "Take these four judgements as our starting point."
 ita_dnc.501.t: "The Note to Paris"
 ita_dnc.501.d: "The note is two paragraphs long. If France is attacked, directly or indirectly, Italy stays neutral. We also promise to do nothing in North Africa that France would resent. Barrere folds the paper into the embassy bag.\n\nThe alliance we renewed at Berlin says the opposite. Both papers are valid and both carry this government's signature. The only question left is how many men are to know."
 ita_dnc.501.a: "Keep it to the King, the minister and the safe."
 ita_dnc.501.b: "Let word of the note reach the Paris drawing rooms."
 ita_dnc.502.t: "A Deputy Talks in Paris"
 ita_dnc.502.d: "A deputy in the French Chamber has been defending a colonial estimate. He said rather more than he needed to about Italian goodwill in the Mediterranean.\n\nVienna reprinted the speech within four days, with the lines about the alliance set in heavier type. Our ambassador there has been asked, very politely, whether we have undertakings to France that our allies have not seen."
 ita_dnc.502.a: "Deny it. We have given France no such undertaking."
 ita_dnc.502.b: "Admit the note and call it insurance."
 ita_dnc.503.t: "The Notice to Vienna"
 ita_dnc.503.d: "Our ambassador read the declaration standing up, because he was told to make it formal. The Triple Alliance will lapse, and we shall not renew it. He added that the Kingdom remains the friend of both empires.\n\nNobody in the room believed the last sentence. The question now is what tone we take in Rome on the morning the newspapers have it."
 ita_dnc.503.a: "Send a correct despatch and allow no demonstrations."
 ita_dnc.503.b: "Let the Chamber debate it in the open."
 ita_dnc.504.t: "An Envoy from Addis Ababa"
 ita_dnc.504.d: "The Emperor of Ethiopia has sent an envoy to the Quirinal. He is received with the honours due to a sovereign who beat us. He brings the boundary maps, an offer on the caravan road to Massawa, and word that the Emperor considers the war finished.\n\nHe also mentions, without pressing it, that Ethiopia buys rifles from four countries and would rather buy them from three. We can sign the boundary and open the road, or sign and ask for the customs at the frontier."
 ita_dnc.504.a: "Sign the boundary and open the road."
 ita_dnc.504.b: "Sign, and ask for the customs at the frontier."
 ita_dnc.505.t: "The Ultimatum Expires"
 ita_dnc.505.d: "The Porte, the Ottoman government, has answered before our hour was out. It offers everything short of letting us occupy Tripoli: guarantees for Italian firms, money, a commission of inquiry.\n\nIt is a better answer than we expected, and it is not the answer the ultimatum was written to get. The transports are loaded and the Chamber is in recess. We can sail, or give the Porte another week."
 ita_dnc.505.a: "Order the fleet to sail for Tripoli."
 ita_dnc.505.b: "Extend the ultimatum by a week."
 ita_dnc.506.t: "The Aegean Islands"
 ita_dnc.506.d: "The landings are almost unopposed. Rhodes takes an afternoon, and the smaller islands send their notables down to meet the boats. The Greek islanders greet our marines as liberators and ask at once when they will be joined to Athens.\n\nThe fleet reports the Aegean route to Libya closed. The Consulta, our foreign ministry, reports that London has asked about the islands sooner than we expected."
 ita_dnc.506.a: "Hold the islands as a pledge until the Porte signs."
 ita_dnc.506.b: "Keep the islands, and tell the powers so."
 ita_dnc.507.t: "The Oasis Outside Tripoli"
 ita_dnc.507.d: "A battalion holding the palm gardens east of Tripoli was attacked from behind. The men who did it had been counted as townspeople the day before. The survivors came back into the city with a story that ran through the whole force by evening.\n\nThe general commanding asks for a free hand in the oasis. Correspondents from four countries are quartered a mile away. We can give him the free hand, or hold the columns to the orders they have."
 ita_dnc.507.a: "Give the general his free hand in the oasis."
 ita_dnc.507.b: "Hold the columns to their orders."
 ita_dnc.508.t: "The Second Expedition"
 ita_dnc.508.d: "The operations section has brought out the plan it drew for the last war, with better figures. The march runs from Massawa to the escarpment by mule. There is water at four wells, and the enemy knows all of them.\n\nThe Emperor has 60,000 rifles. Every supply column needs an escort of a third of the men it feeds. One officer has written at the bottom that the last army to try this was a good army."
 ita_dnc.508.a: "Send the expedition, and equip it properly this time."
 ita_dnc.508.b: "Halt at the escarpment. The claim can wait."
 ita_dnc.509.t: "The Austrian Offer on Albania"
 ita_dnc.509.d: "The Austrian ambassador has come to the Consulta and put it plainly. Both courts pay the same Albanian chiefs, open rival schools in the same towns and survey the same anchorage at Valona.\n\nHe proposes that both of us stop, and that each undertakes to keep Albania out of the other's hands. He does not say what happens if we refuse. We can take the understanding, or claim Valona for ourselves."
 ita_dnc.509.a: "Accept the understanding. Neither power takes Albania."
 ita_dnc.509.b: "Claim Valona, and give Vienna no answer."
 ITA_the_non_expedit: "The Pope's Ban on Voting"
 ITA_the_non_expedit_desc: "The Pope forbids Catholics to vote in a state that took Rome from him, and about a third of the electorate obeys him.\n\nThe Chamber is therefore quieter than the country, and we are spared an opposition we would not know how to answer. The day a bishop reads the ban loosely, 90 seats change hands without one voter changing his mind."
 ITA_the_emigrant_ledger: "The Emigrant Traffic"
 ITA_the_emigrant_ledger_desc: "About 600,000 Italians leave every year, and the money they send home pays for much of what we import.\n\nThe other column is the one nobody prints. They are men of military age, and the clerk counting their villages for the next call-up keeps finding nobody at the address."
 ITA_the_southern_ledger: "The Neglect of the South"
 ITA_the_southern_ledger_desc: "Most provinces below Naples have no water, no paved road and no school. We have never once said in law that this is a different problem, rather than a poorer version of the North.\n\nEverything built down there takes twice as long and costs twice as much. The account is carried forward every year, in the hope that the next ministry will look at it."
 ITA_the_british_leash: "The British Coal Contract"
 ITA_the_british_leash_desc: "Of every 100 tons of coal we burn, 88 are cut in Wales. Every wheel that turns in Milan turns because a collier unloaded at Genoa.\n\nThe Triple Alliance is renewed on paper every few years. The coal contract is renewed every winter, and it is the one that can stop the mills."
 ITA_the_prefect_machine: "The Prefect Machine"
 ITA_the_prefect_machine_desc: "There are 90 constituencies and 90 prefects, and a book in Rome that records which mayor is to be helped and which list is to go astray in the post.\n\nThe bridges get built and the estimates get voted. The trouble is the book itself. It exists, it is written down, and somebody is always counting."
 ITA_the_mezzogiorno_account: "The Promises to the South"
 ITA_the_mezzogiorno_account_desc: "What has been promised to the South and what has been laid in the ground are two different figures. The second catches up with the first by about an eighth of the gap a year. An aqueduct takes years to build, and few ministries last that long."
 ITA_the_empty_bunkers: "The Coal Bunkers Are Empty"
 ITA_the_empty_bunkers_desc: "The quay at Genoa holds less than three months of coal. The mills are banking their furnaces, because banking costs less than stopping altogether. The yards will follow within a fortnight."
 ITA_the_prefect_ledger: "The Prefects and the Returns"
 ITA_the_prefect_ledger_desc: "Outside the three industrial cities, the state is one man in a sash to a province, and he decides what the returns say. A strong machine gives a ministry a Chamber that does as it is told. That Chamber will not survive one bad harvest. The men it shuts out have nowhere to go but the socialists.\n\nPrefects: §Y[?ITA_prefects|0]§! of 100."
 ITA_the_special_laws: "The Special Laws for the South"
 ITA_the_special_laws_desc: "The law gives the South cheap power, a tariff exemption on raw materials, a state guarantee and a schedule of public works.\n\nIt is the only industrial policy we have ever written for the South. The North pays for it out of its own estimates. It will be a decade before anyone can point at a road and say what it bought."
