 ROM_GREATER_ROMANIA_ADJ: "Romanian"
 ROM_GREATER_ROMANIA_neutrality: "Greater Romania"
 ROM_GREATER_ROMANIA_neutrality_DEF: "Greater Romania"
 ROM_GREATER_ROMANIA_neutrality_ADJ: "Romanian"

 ITA_n_the_war_on_trade_lock_tt: "We have not laid down the ideal battleship, or the fleet of battle is already built"
 ITA_e_the_kingdom_in_arms_desc: "The estimates are voted as one sum and the works run day and night. Nothing we can make at home is bought abroad, and more men are called to the colours."
 ITA_e_the_unified_types_desc: "One pattern of rifle, one gauge of shell, one drawing for every yard. What one workshop makes another can finish, and a broken division is made up again faster."

 ITA_u_the_understanding_with_london: "The Understanding with London"
 ITA_u_the_anglo_italian_defence_pact: "The Anglo-Italian Defence Pact"
 ITA_o_the_beira_is_not_theirs_tt: "Portugal no longer holds the Beira mining district, so it has no wolfram there to sign over to us."
 ITA_n_a_shore_across_the_adriatic_tt: "We hold a shore on the far side of the Adriatic"
 ITA_h_nitti_minister_of_industry_and_labour_desc: "The new ministry stands between the factories and the men who work in them. Nitti means to be at every table where a plant is sited or a wage is settled."
 ITA_h_stringher_plenipotentiary_of_credit_desc: "The Bank of Italy now speaks for the Treasury when the great houses ask for money. Stringher lends where the works need it, and the works run fuller for it."
 ITA_h_luzzatti_plenipotentiary_of_the_treasury_desc: "One man now has the last word on the estimates. The departments bring their demands to Luzzatti before they bring them to the Chamber. Less of our industry goes on keeping the shops full, and what we build goes up faster."
 ITA_h_giolitti_the_interior_reorganised_desc: "Giolitti has put the Interior back in order from the top down. There is one register, one chain of orders, and prefects who answer for their own provinces."
 ITA_h_giolitti_master_of_the_prefects_desc: "Every prefect owes his place to Giolitti. When he moves, the whole administration of the provinces moves with him."
 ITA_h_orlando_makes_italians_desc: "The schools of the Kingdom teach one language and one history. The recruits who come up from them understand their officers, and the country is readier for a war."
 ITA_h_sacchi_the_leagues_in_the_majority_desc: "The leagues sit with the government instead of against it. Strikes that would once have been fought out are now settled at a table."
 ITA_h_sacchi_first_among_equals_desc: "The Radicals hold the balance of the Chamber. Nothing passes that Sacchi has not agreed to first."
 ITA_h_salandra_the_prefects_deliver_desc: "The prefects are told what majority is wanted, and they return it. The constituencies of the South now answer to the ministry."
 ITA_h_salandra_the_grey_eminence_desc: "Salandra holds no great office and settles every question before it reaches one. The Right governs through him, whoever sits in the chair."
 ITA_h_treasury_initiative_modifier_desc: "The Treasury carries its own estimate into the Council, and the departments learn to ask it first."
 ITA_h_the_experimental_works_desc: "The State keeps its own workshops for what the trade will not build. What is proved there passes to the arsenals."
 ITA_h_the_interior_commands_desc: "The police, the register and the prefects answer to one desk. The Interior is now the strongest ministry in the Kingdom."
 ITA_h_the_school_makes_italians_desc: "The children of the villages learn the language of the State before they are called to serve it. The lands we hold give us less trouble, and more of their people work with us."
 ITA_h_the_school_makes_italians_plain_desc: "The schools are opened where they were wanted and the masters are paid. There is nothing else in the law, and the country is content with it."
 ITA_h_the_army_keeps_the_streets_tt: "The army is quartered in the cities and keeps the streets, and we pay for it in stability and political power."
 ITA_operative_emilio_rossi: "Emilio Rossi"
 ITA_l_the_act_of_algeciras_desc: "We sat at the table with the powers and came away with charge of the police in the Moroccan ports. Other countries now find us easier to deal with, and our own trade costs us less."
 ITA_l_antivari_agreement_desc: "The court at Cetinje has let us into its one harbour, and the works there are ours to build. Our factories run fuller for it, and the far shore of the Adriatic is a little less Austrian."
 ITA_l_naval_operation_idea_desc: "The staff has drawn the western basin on one chart: the coaling stops, the landing beaches and the hours between them. We can put more men ashore at once, and we know where a landing against us would come."
 ITA_l_alpine_operation_ns_desc: "The passes, the depots and the garrisons of the northern frontier are worked out to the day. Our columns know the ground, they stand the cold, and they will not be the ones improvising."
 ITA_l_leash_cut_ns_desc: "The fleet is no longer tied to the shore it was built to defend. It can keep the sea far longer, and its crews learn more for every month out."
 ITA_o_threat_vienna_confirms: "Rome Asks Vienna to Confirm the Crown"
 ITA_u_army_mobilization_tt: "Mobilisation speed of the army: §Y[?ITA_u_army_mobilization|%1]§!"
 ITA_u_grande_the_grant_lapses_tt: "The court does not hold the land it promised, and nothing passes to us."
 u_the_second_naval_race: "The Second Naval Race"
 ITA_u_grande_the_ally_is_not_quarrelled_with_tt: "We are in the same faction as London, so we make no claim on her and settle the concessions at the table."
 ITA_u_grande_the_colonial_account_tt: "One command now answers for both seas, and the Colonial Office opens: what the residencies spend from here is set against it."
 ITA_u_tt_the_refusal_is_a_casus_belli: "Every court that refuses gives us a claim to free the nations it governs."
 ita_dnc.2910.t: "The Aeroplane Order"
 ita_dnc.2910.d: "The air circuit at Brescia has been flown and the ministry has the reports. Four houses want the order for our aeroplanes. The sheds at Vizzola Ticino build machines of their own. The Transaerea holds the licences and the hangars. The French firms will sell us their drawings. The motor works of Turin have one triplane that flies a little and breaks a lot, and shops that can build anything. We must choose one of them."
 ita_dnc.2910.a: "Give the order to the sheds at Vizzola Ticino."
 ita_dnc.2910.b: "Give the order to the Transaerea."
 ita_dnc.2910.c: "Buy the French drawings."
 ita_dnc.2910.f: "Let the motor works of Turin build them."
 ita_dnc.2910.e: "Choose no house, and send the reports to the schools."
 air_the_house_of_vizzola: "The House of Vizzola"
 air_the_transaerea: "The Transaerea"
 air_the_french_licences: "The French Licences"
 air_the_turin_motor_trade: "The Turin Motor Trade"
 air_the_circuit_pays_for_itself: "The Circuit Pays for Itself"
 ITA_air_the_house_of_vizzola: "The Sheds at Vizzola Ticino"
 ITA_air_the_house_of_vizzola_desc: "Our aeroplanes now come out of the sheds on the Ticino, and the men who build them are ours. They handle better in the air, and we can lay out a field for them faster."
 ITA_air_the_transaerea: "The Societa Italiana Transaerea"
 ITA_air_the_transaerea_desc: "The company holds the licences and the hangars, and it flies what the ministry asks for. Its machines go further, and fewer of them are lost on the way."
 ITA_air_the_french_licences: "The French Licences"
 ITA_air_the_french_licences_desc: "We buy the drawings instead of making our own, and our pilots fly a proven machine a year before we could have built one. They fight better in it, and they learn faster."
 ITA_air_the_turin_motor_trade: "The Motor Trade of Turin"
 ITA_air_the_turin_motor_trade_desc: "The men who build motor cars are told to build aero engines, and the shops of Turin take to it at once. Our aircraft stand more punishment, and new works go up faster everywhere."
 ITA_o_the_exceptional_laws: "The Exceptional Laws"
 ITA_o_the_exceptional_laws_desc: "The associations are dissolved, the presses licensed and the leaders put over the frontier. What is left of the Extreme Left meets abroad, the lands we hold give less trouble, and the ministry has a freer hand."
 ITA_tt_arm_army_keeps_the_streets: "§RThe army holds the streets§!: we lose stability and political power, the Extreme Left gains ground, and our colonial levies now anger the foreign ministry."
 ITA_tt_arm_supply_up: "§RThe army's supply consumption rises§!, and the establishments wait on the estimates."
 ITA_tt_camera_low_months_set_0: "§GThe count of months the Chamber has sat without a majority goes back to zero.§!"
 ITA_tt_ch_fortis: "§YAlessandro Fortis enters the King's service, once and once only.§!"
 ITA_tt_ch_monza_survived: "§YThe King survives Monza, and the reign goes on as before.§!"
 ITA_tt_ch_tripoli_promised: "§YTripoli is written into the government's programme.§!"
 ITA_tt_crown_down_l: "The Crown §Yloosens its grip§! sharply."
 ITA_tt_crown_down_m: "The Crown §Yloosens its grip§!."
 ITA_tt_crown_set_30: "The Crown §Yfalls back to a King who listens§!."
 ITA_tt_crown_up_l: "The Crown §Ytightens its grip§! sharply."
 ITA_tt_crown_up_m: "The Crown §Ytightens its grip§!."
 ITA_tt_dnc_the_path_is_nazionale: "§YThe kingdom takes the Nation's path§!: the other paths are cleared."
 ITA_tt_end_route: "§YThe systems of the decade close where they stand§!, and the Last Question follows within days unless the era has already ended."
 ITA_tt_end_the_verdict_is_refused: "§RA ministry of transition takes the chair for a year§!: Luzzatti leads the caretakers, and the decade ends without its verdict."
 ITA_tt_g_boards: "§GThe Boards of Conciliation sit without charge, and the piazza cools faster every month.§!"
 ITA_tt_g_bosnia_snub: "§YRome's refusal is on record§!: Petersburg is more likely to offer Racconigi, and §RVienna more likely to refuse us Tripoli§!."
 ITA_tt_g_sounded_auh: "§YWe put Tripoli to Vienna, and we cannot ask twice§!; the answer comes within the week."
 ITA_tt_g_sounded_eng: "§YWe put Tripoli to London, and we cannot ask twice§!; the answer comes within the week."
 ITA_tt_g_sounded_fra: "§YWe put Tripoli to Paris, and we cannot ask twice§!; the answer comes within the week."
 ITA_tt_g_sounded_ger: "§YWe put Tripoli to Berlin, and we cannot ask twice§!; the answer comes within the week."
 ITA_tt_g_sounded_rus: "§YWe put Tripoli to Petersburg, and we cannot ask twice§!; the answer comes within the week."
 ITA_tt_g_trieste_faculty: "§YThe Italian university faculty at Trieste is granted§!, and the University Fund has nothing left to ask for."
 ITA_tt_h_council_cd_flag_cleared: "§GThe King need not wait: another name may be put to him at once.§!"
 ITA_tt_h_council_event_pending_flag_cleared: "§YThe council has no business waiting, and the ministers' focuses may be taken again.§!"
 ITA_tt_h_rising_minister_set_0: "§YNo name is before the council, and the next one must be put forward again.§!"
 ITA_tt_h_the_guards_of_public_safety_in_progress_flag: "§YGiolitti takes up the Guards of Public Safety§!: the focus is barred while he works, and he finishes within six months."
 ITA_tt_h_the_political_police_in_progress_flag: "§YGiolitti takes up the Political Police§!: the focus is barred while he works, and he finishes within six months."
 ITA_tt_h_withdraw_the_name: "§YThe focus that named him is undone and its political power returned§!; he may be named again another day."
 ITA_tt_ita_dnc_1609_b: "If Vienna still stands, the closing of the Lega Nazionale is left to Vienna; if it does not, the piazza §Rheats§!."
 ITA_tt_ita_dnc_2130_a: "§YRome invokes Article 7.§! Unless the path is Giolitti's or the Nation's, Vienna is asked within days to name the compensation."
 ITA_tt_ita_dnc_2168_a: "§YNathan's council sits at the Capitol.§! On the Church's path the Bloc takes to the street and the Twentieth of September follows; on Giolitti's path, Nathan enters the King's service."
 ITA_tt_ita_dnc_701_b: "If the piazza is calm the Chamber's majority §Ggrows§!; if it is not, it §Rthins§!."
 ITA_tt_ita_dnc_702_b: "With the Catholic vote or the Gentiloni understanding the Chamber's majority §Ggrows§! sharply; without them it §Ggrows§! a little."
 ITA_tt_k_vatican_offended: "§RThe Vatican takes offence: we cannot send the intermediary again, and the Law of Guarantees will open no talks now.§!"
 ITA_tt_l_the_provinces_are_ceded: "§RThe Trentino, South Tyrol, Trieste, Istria, Rijeka and Zara pass to Italy§!, and the Italians of the Monarchy are more content for it."
 ITA_tt_majority_bought_up_l: "The bought majority §Rswells§! sharply: at the next election those votes count for half, and under a wider franchise they count against us."
 ITA_tt_majority_down_l: "The Chamber's majority §Rthins§! sharply."
 ITA_tt_majority_down_m: "The Chamber's majority §Rthins§!."
 ITA_tt_majority_down_s: "The Chamber's majority §Rthins§! a little."
 ITA_tt_majority_set_45: "The Chamber's majority is §Rreset to a thin margin, short of what a ministry needs§!."
 ITA_tt_majority_set_50: "The Chamber's majority is §Yreset to an even split, neither made nor lost§!."
 ITA_tt_majority_up_m: "The Chamber's majority §Ggrows§!."
 ITA_tt_majority_up_s: "The Chamber's majority §Ggrows§! a little."
 ITA_tt_o_vienna_asked_berlin: "§YBerlin is asked to judge the recognition before Vienna answers§!, and the question cannot be put off a second time."
 ITA_tt_piazza_down_l: "The Piazza §Gcools§! sharply."
 ITA_tt_piazza_down_m: "The Piazza §Gcools§!."
 ITA_tt_piazza_down_s: "The Piazza §Gcools§! a little."
 ITA_tt_piazza_floor_up_m: "The floor under the Piazza §Rrises§!: the squares never settle as low again."
 ITA_tt_piazza_floor_up_s: "The floor under the Piazza §Rrises§! a little: the squares never settle quite as low again."
 ITA_tt_piazza_up_l: "The Piazza §Rheats§! sharply."
 ITA_tt_piazza_up_m: "The Piazza §Rheats§!."
 ITA_tt_piazza_up_s: "The Piazza §Rheats§! a little."
 ITA_tt_pledges_up: "§RThe ministry promises more than it can pay§!. One promise falls due every year, and costs us seats unless the special laws for the South are in force."
 ITA_tt_r_garibaldian_legion_to_the_rebels: "§YThree Garibaldian legions cross the frontier to the rebel republic.§!"
 ITA_tt_r_irredenta_renounced: "§YWe give up our claim to the Italian lands under Austria, and Vienna has it in writing.§!"
 ITA_tt_s_berlin_in_the_protocol: "§GBerlin signs the police protocol too§!, and Petersburg is asked again, readier now to sign."
 ITA_tt_s_crown_stands: "§YThe Crown stands by its decree§!, and Berlin is the likelier to sign the police protocol when we ask."
 ITA_tt_t_the_prefect_was_sustained: "§YThe prefect of Genoa is sustained, and the chamber of labour stays closed.§!"
 ITA_tt_vienna_trust_down_l: "Vienna's confidence in Rome §Rfalls§! sharply."
 ITA_tt_vienna_trust_down_m: "Vienna's confidence in Rome §Rfalls§!."
 ITA_tt_vienna_trust_down_s: "Vienna's confidence in Rome §Rfalls§! a little."
 ITA_tt_vienna_trust_set_0: "Vienna's confidence in Rome §Rfalls to nothing§!."
 ITA_tt_vienna_trust_up_l: "Vienna's confidence in Rome §Grises§! sharply."
 ITA_tt_vienna_trust_up_m: "Vienna's confidence in Rome §Grises§!."
 ITA_tt_vienna_trust_up_s: "Vienna's confidence in Rome §Grises§! a little."
 ITA_tt_w_powers_consent_down: "§RFewer of the Powers will let us take Tripoli§!, and the Porte counts them before it answers us."
 ITA_tt_w_powers_consent_up: "§GOne more Power will let us take Tripoli§!, and the Porte counts them before it answers us."
 ITA_tt_w_racconigi: "§YPetersburg offers Rome the bargain at Racconigi§!, and no second bargain will be offered."
 ITA_tt_w_racconigi_is_read_in_vienna: "§YVienna has read Racconigi and protested to Rome.§!"
 ITA_tt_w_sandjak_only: "§YWe give up our garrison in the sandjak and ask Rome for nothing more§!. We are now the likelier to let Rome take Tripoli, and Petersburg to offer Rome the bargain at Racconigi."
 ITA_tt_w_the_denial: "§YWe deny before the world that we have signed anything behind the alliance's back.§!"
 ITA_tt_w_trentino_bought_with_neutrality: "§YThe Trentino is ours, bought with a promise to stay out of Vienna's war.§!"
 ITA_tt_w_valona_claimed: "§YWe claim Valona on the far shore of the Adriatic.§!"
 ITA_tt_w_we_mean_the_convention: "§YWe stand by the military convention, and the staff goes to Berlin to prove it.§!"
 ITA_tt_z_compensated: "§YWe pay Rome for Bosnia with the sandjak and an Italian faculty at Trieste.§!"
 ITA_tt_z_conrad_answered: "§YWe have answered the war scare Conrad opened, and the matter is closed.§!"
 ITA_tt_z_consented_to_bosnia: "§YWe accept Vienna's annexation of Bosnia and ask nothing for it.§!"
 ITA_tt_z_innsbruck: "§YWhat was done to our students at Innsbruck is not forgotten in the provinces.§!"
 ITA_tt_z_petersburg_withdrew: "§YWe cut our subsidy to Cetinje§!, and Montenegro is the likelier to take Rome's guarantee."
 ITA_tt_z_tyrol_crisis: "§YThe Tyrol crisis is on record, and we ask Berlin to hold Vienna back.§!"
 ita_dnc.2961.t: "The Admirals Name Their Price"
 ita_dnc.2961.d_a: "The Minister of the Navy has come to us. The Chamber refused the credits for the fleet, and the squadrons answer to their officers before they answer to any assembly.\n\nIf the Crown promises the fleet law the Chamber would not vote, the admirals will hold the ships for the King. We can give that promise, or keep the Crown's word for something else."
 ita_dnc.2961.d_b: "The admirals have written to the Chamber. The fleet is royal in its officers, they say, and the price of its silence is the fleet law the Extreme Left fought for 10 years.\n\nWe refused those credits ourselves. Now we are asked to vote them, or to watch the squadrons sail for the King."
 ita_dnc.2961.a: "Promise them their fleet law."
 ita_dnc.2961.b: "Refuse them. The State does not bargain with its officers."
 ita_dnc.2501.t: "Giolitti at Dronero"
 ita_dnc.2501.d: "Giovanni Giolitti, the member for Dronero, walked out of the Chamber with the Left. He has not joined the opposition either. He sits in his own province, takes letters from both sides, and every prefect in Piedmont is waiting to see which one he answers.\n\nWe can buy him with the Interior, leave him to decide for himself, or put him where he decides nothing."
 ita_dnc.2501.a: "Offer him the Interior."
 ita_dnc.2501.b: "Let him choose for himself."
 ita_dnc.2501.c: "Hold him at Dronero."
 ita_dnc.2605.t: "The Prefects or the Corps"
 ita_dnc.2605.d: "The prefects hold the police and the telegraph in every province, and nobody has yet told them whom they serve. The army corps are in the same position.\n\nThe Interior can write to the prefects tonight and bind the central provinces to us. The Supreme Command can write to the 12 corps commanders and bind the garrisons of the north. We can pay for one letter, not for both."
 ita_dnc.2605.a: "Write to the prefects first."
 ita_dnc.2605.b: "Write to the 12 corps commanders first."
 ita_dnc.2500.b: "Withdraw the Court to Turin."
 ita_dnc.2962.t: "Italy at War with Itself"
 ita_dnc.2962.d: "The King and the Chamber each claim to be the government of Italy. The army has answered both, and the kingdom is at war with itself.\n\nThe prefects of the south hold their provinces for the Crown. The cities of the north have raised their own guards for the Chamber. Every government in Europe now has two Italies to deal with."
 ita_dnc.2962.a: "Watch our own country bleed, whichever side wins."
 ita_dnc.2962.b: "Note it. A throne in danger is every throne's business."
 ita_dnc.2962.c: "Let the Italians settle it among themselves."
 ITA_cw_the_civil_war_follows_tt: "§RThe Chamber we send home will take up arms, and the kingdom will be at war with itself.§!"
 ITA_cw_the_civil_war_follows_b_tt: "§RThe Crown will not accept our refusal. The King's government withdraws to the South, and the kingdom will be at war with itself.§!"
 ITA_cw_the_prefects_are_bound_tt: "§YThe standing of the prefects§! rises sharply. The Interior has bound them to us."
 ITA_cw_the_map_reads_tt: "§YToday the centre is [ITA_cw_GetCentreHeld], the frontier [ITA_cw_GetFrontierHeld] and Piedmont [ITA_cw_GetPiedmontHeld].§! The full lines of the split are read under §Y$ITA_cw_the_war_of_the_two_italies$§! among the decisions."
 ITA_cw_promised_the_fleet_tt: "§YThe squadrons stay with us when the kingdom splits.§! If we have not carried the fleet law within two years, by §Y$ITADNC_o_rebuild_the_battle_fleet$§!, §Y$ITADNC_n_the_fleet_of_battle$§! or §Y$ITADNC_n_the_naval_estimates$§! with §Y$ITADNC_n_the_naval_staff$§!, the admirals §Rmay turn on the government§!."
 ITA_cw_the_admirals_refused_tt: "§RMost of the fleet sails with the other side when the kingdom splits.§! We owe the admirals nothing."
 ITA_cw_the_quays_see_the_credits_tt: "The piazza §Rheats sharply§!. The leagues have seen the Chamber vote the credits it once fought."
 ITA_cw_giolitti_at_the_interior_tt: "§GGiolitti keeps his seat, Piedmont keeps its King, and the prefects answer to him.§! §RThe Right will remember that the coup began with a bargain.§!"
 ITA_cw_giolitti_binds_the_prefects_tt: "§YThe standing of the prefects§! rises sharply. Giolitti at the Interior is their master."
 ITA_cw_giolitti_chooses_tt: "§YGiolitti answers for himself, and Piedmont goes where he goes.§! He is the likelier to stay with the Crown while the Crown's grip holds, and the frontier is now [ITA_cw_GetFrontierHeld]."
 ITA_cw_giolitti_in_the_fortress_tt: "§GPiedmont stays with the Crown.§! §RThe Chamber in arms gains a martyr, and it is steadier when the kingdom splits.§!"
 ITA_cw_the_interior_wrote_first_tt: "§YThe prefects answer the ministry§!, and Tuscany and the Marches stay with us when the kingdom splits §Yif the centre is held§!. The centre is now [ITA_cw_GetCentreHeld]."
 ITA_cw_the_corps_are_written_to_tt: "§YThe Crown's grip loosens sharply§!, and Piedmont and the frontier corps stay with us when the kingdom splits §Yif they are held§!. The frontier is now [ITA_cw_GetFrontierHeld], Piedmont [ITA_cw_GetPiedmontHeld]."
 ITA_cw_the_split_a_tt: "§RThe Chamber takes Milan, Lombardy, Liguria and the Romagna, and the fleet as the admirals were answered.§! The centre is [ITA_cw_GetCentreHeld], the frontier [ITA_cw_GetFrontierHeld], Piedmont follows Giolitti, and the Crown keeps the rest."
 ITA_cw_the_split_b_tt: "§RThe Chamber takes Rome and the north, and the fleet as the admirals were answered.§! The centre is [ITA_cw_GetCentreHeld] and the frontier [ITA_cw_GetFrontierHeld], and §Gthe Court is safe at Turin with the army gathered around it§!."
 ITA_cw_the_split_c_tt: "§RThe Crown keeps the South, the islands and the fleet as the admirals were answered.§! The centre is [ITA_cw_GetCentreHeld], the frontier [ITA_cw_GetFrontierHeld], Piedmont [ITA_cw_GetPiedmontHeld], and Turin goes to Giolitti unless a royal division holds it."
 ITA_cw_held: "§Gheld§!"
 ITA_cw_lost: "§Rlost§!"
 ITA_cw_fascio_delle_opposizioni: "Fascio delle Opposizioni"
 ITA_cw_fascio_delle_opposizioni_long: "The Fascio of the Oppositions"
 ITA_cw_partito_dell_ordine: "Partito dell'Ordine"
 ITA_cw_partito_dell_ordine_long: "The Party of Order"
 ITA_cw_the_exiles_return: "The Exiles Return"
 ITA_cw_the_exiles_return_desc: "The men the tribunals sent abroad are home, and the leagues listen to them before they listen to us."
 ITA_cw_the_exiles_watched: "The Exiles Watched"
 ITA_cw_the_exiles_watched_desc: "The exiles are home with the police watching them, and every meeting of the leagues has a policeman at the door."
 ITA_cw_the_popular_militia: "The Popular Militia"
 ITA_cw_the_popular_militia_desc: "The squads of the leagues hold our streets under their own captains, and the rifles are theirs to keep."
 ITA_cw_the_kings_reserve: "The King's Reserve"
 ITA_cw_the_kings_reserve_desc: "The reserve legions of the Carabinieri are called up, and they stand in the loyal provinces under royal officers."
 ITA_cw_the_territorial_militia: "The Territorial Militia"
 ITA_cw_the_territorial_militia_desc: "A territorial militia stands in the provinces under the army corps, drilled by them and paid by the municipalities."
 ITA_cw_the_kings_levy: "The King's Levy"
 ITA_cw_the_kings_levy_desc: "The parishes and the prefects bring the young men of the loyal provinces to the colours in the King's name."
 ITA_cw_the_frontier_kept: "The Frontier Kept"
 ITA_cw_the_frontier_kept_desc: "The frontier corps stay in the passes for whoever wins, and the country is calmer for knowing it."
 ITA_cw_the_nation_in_arms: "The Nation in Arms"
 ITA_cw_the_nation_in_arms_desc: "The leagues, the municipalities and the students are under arms for the Chamber, and the country is a camp."
 ITA_cw_the_bishops_price: "The Bishops' Price"
 ITA_cw_the_bishops_price_desc: "The parishes vote for the King, and the Crown pays for it with every law it wants to carry."
 ITA_cw_the_purge_of_the_admirals: "The Purge of the Admirals"
 ITA_cw_the_purge_of_the_admirals_desc: "The admirals who turned their ships are struck from the lists, and the fleet is commanded by men who have never had a squadron."
 ITA_cw_the_recovery: "The Recovery"
 ITA_cw_the_recovery_desc: "The provinces the war passed through are being put back to work, and the country goes without to pay for it."
 ITA_DNC_AI_BEHAVIOR: "Italian AI, the turn of the century"
 RULE_OPTION_ITA_DNC_DEFAULT_DESC: "The Italian AI follows the ministry when historical focuses are on, and otherwise draws its road at the start of the game."
 RULE_OPTION_ITA_HISTORICAL: "The ministry"
 RULE_OPTION_ITA_HISTORICAL_DESC: "The Italian AI lets the era run as it did."
 RULE_OPTION_ITA_CROWN: "The King breaks the Chamber"
 RULE_OPTION_ITA_CROWN_DESC: "The Italian AI sends the Chamber home and goes back to the Statuto, the kingdom's constitution."
 RULE_OPTION_ITA_CONSTITUTIONAL: "The King recalls the Chamber"
 RULE_OPTION_ITA_CONSTITUTIONAL_DESC: "The Italian AI sends the Chamber home and recalls it once the war is won, under a King who reigns and does not govern."
 RULE_OPTION_ITA_COMANDO: "The army will not fire"
 RULE_OPTION_ITA_COMANDO_DESC: "The Italian AI lets the army refuse to fire on the crowd, and the Supreme Command governs."
 RULE_OPTION_ITA_OATH: "The oath to the Statuto"
 RULE_OPTION_ITA_OATH_DESC: "The Italian AI lets the army refuse to fire, seats the Chamber and binds the King by an oath to the Statuto, the kingdom's constitution."
 RULE_OPTION_ITA_REPUBLIC: "The leagues govern"
 RULE_OPTION_ITA_REPUBLIC_DESC: "The Italian AI lets the army refuse to fire, seats the Chamber and hands the ministries to the leagues."
 RULE_OPTION_ITA_DNC_RANDOM_DESC: "The Italian AI draws one of the six roads at the start of the game and follows it."
 ita_dnc.2968.t: "The Frontier Corps"
 ita_dnc.2968.d: "The corps of the Quadrilateral and of the Piave stand where the treaty with Vienna put them. Their commanders ask whether they are to march on their own countrymen or hold the passes.\n\nIf we leave them there, the frontier stays a frontier and Vienna has less to say. If we call them down to the plain, we gain their rifles and lose the passes."
 ita_dnc.2968.a: "Leave the frontier corps where they are."
 ita_dnc.2968.b: "Order the frontier corps down to the plain."
 ita_dnc.2966.t: "The Senate and the Press"
 ita_dnc.2966.d: "The Senate has not left the capital. Its president has told us the price. The Senate will lend its name to whichever government holds the seal, if that government lets the newspapers print again.\n\nWe can pay that price and gain the one body both sides still call lawful. Or we can let the President of the Senate go where he likes, and keep the press under the prefects."
 ita_dnc.2966.a: "Pay the Senate's price and let the newspapers print."
 ita_dnc.2966.b: "Let the President of the Senate go where he likes."
 ita_dnc.2967.t: "Sonnino Is Sent For"
 ita_dnc.2967.d: "Sidney Sonnino has offered to form the King's ministry. He is the man who wrote that we should go back to the Statuto, the kingdom's constitution. He would give the coup the face of a programme.\n\nGeneral Pelloux has not asked to be replaced, and the army has no quarrel with him. We can call in the leader of the Right, or keep the General and let the country say that a soldier governs it."
 ita_dnc.2967.a: "Send for Sonnino to form the ministry."
 ita_dnc.2967.b: "Keep the General at the head of the Council."
 ita_dnc.2969.t: "The Bishops Are Asked"
 ita_dnc.2969.d: "The bishops of the loyal provinces have written to us. The parishes would vote for the King's candidates if the Pope lifted his ban on Catholics voting, and the Pope would lift it for a price.\n\nThe price is the schools, the marriage laws and a word from us on the Roman Question. The Vatican was struck by the same tribunals as the leagues and owes the Crown nothing. We can ask and pay it, or keep the Crown away from the Vatican."
 ita_dnc.2969.a: "Ask the Pope to let Catholics vote for the King's candidates."
 ita_dnc.2969.b: "Refuse. The Crown does not beg at the Vatican."
 ita_dnc.2965.t: "Who Holds the Streets"
 ita_dnc.2965.d_a: "The leagues of the north have asked for rifles. The municipalities have asked for a civic guard instead. Both are asking the same thing, which is who holds the cities while the army holds the front.\n\nWe must choose the militia we can live with when the war ends. Whichever one we raise will have to be sent home or kept on the rolls."
 ita_dnc.2965.d_b: "The prefects of the loyal provinces ask leave to arm the municipalities that have declared for the King. The Carabinieri ask instead that their reserve legions be called up under their own officers.\n\nEither force will hold our streets while the army marches. Either will have to be paid off or kept on the rolls when the war is over."
 ita_dnc.2965.a: "Give the leagues their rifles."
 ita_dnc.2965.b: "Raise a territorial militia under the army corps."
 ita_dnc.2965.c: "Let the prefects arm the loyal municipalities."
 ita_dnc.2965.d: "Call up the Carabinieri reserve."
 ITA_cw_the_frontier_kept_tt: "§GVienna is told the passes are held for whoever wins, and is slower to march.§! §RThe men of the Quadrilateral are not ours to spend.§!"
 ITA_cw_the_frontier_emptied_tt: "§GThe frontier corps come down to the plain and fight for us.§! §RThe passes stand empty, and Vienna is quicker to march and readier to mass in the Tyrol.§!"
 ITA_cw_the_prefects_lose_the_press_tt: "The standing of the prefects §Rfalls sharply§!. They lose the press they were used to seizing."
 ITA_cw_the_senate_covers_tt: "§GThe Senate covers the government that holds the seal, and the peace is the likelier to end in an amnesty.§!"
 ITA_cw_saracco_crosses_tt: "§RSaracco crosses to the other Italy, which now has a president for its government.§!"
 ITA_cw_sonnino_governs_tt: "§YThe Right governs in the King's name, and the General leaves the Council.§! The bishops of the loyal provinces will be heard next."
 ITA_cw_the_general_keeps_the_council_tt: "§RA soldier governs, and the country knows it§!; §Gthe army has no quarrel with its minister§!. The bishops of the loyal provinces will be heard next."
 ITA_cw_the_bishops_price_tt: "§GThe parishes vote for the King.§! §RThe Roman Question is open again, and the Crown owes the bishops.§!"
 ITA_cw_the_crown_does_not_beg_tt: "§YThe Pope's ban on Catholics voting stands, and the parishes stay home.§!"
 ITA_cw_the_squads_tt: "§YWe will have to §Rsend this militia home§! or §Ykeep it on the rolls§! when the war ends.§!"
 ITA_cw_the_militia_is_chosen_tt: "§YWe choose the militia that holds our streets, and it will have to be sent home or kept when the war ends.§!"
 ITA_cw_threat_the_empty_frontier: "The Italian frontier stands empty"
 ITADNC_o_rally_the_kingdom: "Rally the Kingdom"
 ITADNC_o_rally_the_kingdom_desc: "The loyal provinces have to be held while the army marches. The men who would hold them are the same men the front is asking for. We shall call up the King's levy and raise a militia to keep our streets until the war is won."
 ITADNC_o_the_kingdom_at_work: "The Kingdom at Work"
 ITADNC_o_the_kingdom_at_work_desc: "The provinces we take back come to us with their registers burned and their rails lifted. We shall put the kingdom back to work while the war is still being fought, so that the peace does not find it in ruins."
 ITADNC_o_the_leagues_dissolved: "The Leagues Dissolved"
 ITADNC_o_the_leagues_dissolved_desc: "The leagues that armed the other Italy still have their sections in the provinces we hold. We shall dissolve them by decree while the state of siege allows it, and let the parishes hear that the King governs."
 ita_dnc.2989.t: "The Military Police and Their Oath"
 ita_dnc.2989.d: "The legions of the Carabinieri in our provinces have not left their barracks. Their colonels have written to ask whom their oath now binds them to.\n\nWe can release them to the King and know at last where we stand in our own streets. Or we can hold them where they are and keep a force that will not fight for us. The leagues are already asking why we feed men who swore to the other side."
 ita_dnc.2989.a: "Let them go to the King."
 ita_dnc.2989.b: "Hold them to their barracks."
 ita_dnc.2963.t: "The Exiles Come Back"
 ita_dnc.2963.d: "The men the tribunals sent abroad after the days of May are coming home. They arrive by every train from Lugano and every steamer from the American ports, and they are asking for rifles.\n\nSome are the printers and weavers of the leagues. Some are friends of the man who shot at the King. We can welcome them and take their hands, or set the police on them and lose their numbers."
 ita_dnc.2963.a: "Welcome them home."
 ita_dnc.2963.b: "Watch them, and put a policeman at every meeting."
 ita_dnc.2964.t: "The Fortress Gates Open"
 ita_dnc.2964.d: "Malatesta has landed on the Adriatic shore, and the Romagna is listening to him. The same week, the gates of the fortress prisons opened for the men the military tribunals sentenced after the days of May.\n\nLazzari walks out with the printers of the Avanti and asks for a seat, not a rifle. We ordered neither thing, and we cannot undo them now."
 ita_dnc.2964.a: "Let them be. The old men are home."
 ita_dnc.2990.t: "Giolitti and Turin"
 ita_dnc.2990.d: "Giolitti sits in our ministry, and Turin sits under the King's flag. The prefect of Turin has written to us privately. The city would declare for us if Giolitti came home to say so.\n\nThe garrison is the question. If the royal divisions have left Turin, a speech will take the city for us. If they are still there, the speech will be made to a barracks."
 ita_dnc.2990.a: "Send him to Turin."
 ita_dnc.2990.b: "Keep him where he is."
 ita_dnc.2972.t: "The Chancellor Weighs the Alliance"
 ita_dnc.2972.d: "Our ally has two governments, and each has written to ask which one we recognise. The King's ministers govern by decree behind a line of bayonets. The Chamber sits under the guns of its own guards.\n\nWe need an Italy that holds its passes against France. We do not much mind which Italy that is, so long as there is only one."
 ita_dnc.2972.a: "Back the King and his ministry."
 ita_dnc.2972.b: "Forbid Vienna to send a corps south of the Brenner."
 ita_dnc.2972.c: "Let the alliance lapse. Italy is no use to us divided."
 ita_dnc.2976.t: "The Chancellor's Word"
 ita_dnc.2976.d: "The Chancellor's note has come by the hand of the ambassador. It says in the plainest German that the Empire deals with the King of Italy and with no one else.\n\nIt is a word, not a corps. It is also the word every prefect in the south was waiting to read in his newspaper."
 ita_dnc.2976.a: "Thank Berlin, and let the prefects read it."
 ita_dnc.2992.t: "The Alliance Lapses"
 ita_dnc.2992.d: "The Chancellor has let it be known, with no note and no word spoken, that the Empire deals with neither Italy until there is one.\n\nThe alliance is not denounced. It lapses. Vienna reads Berlin's silences better than we do, and will draw its own conclusion about what Rome is still worth."
 ita_dnc.2992.a: "Note it. Berlin has no Italian policy left."
 ita_dnc.2970.t: "Vienna and the Divided Kingdom"
 ita_dnc.2970.d: "The Italians have two governments. One of them is a Chamber of the Extreme Left sitting in permanence, which is the thing the Congress of Laibach was called to prevent.\n\nWe can recognise the King and give him our word. We can mass a corps in the Tyrol and let both Italies read the notice. Or we can do what our grandfathers did and march, which Berlin will not like, and Paris less."
 ita_dnc.2970.a: "Recognise the King's government."
 ita_dnc.2970.b: "Mass a corps in the Tyrol, for order."
 ita_dnc.2970.c: "March into Italy, as our grandfathers did."
 ita_dnc.2973.t: "The Ambassador's Note"
 ita_dnc.2973.d_a: "The ambassador has brought the alliance's answer. Vienna deals with the King's government and no other, and offers us whatever we ask.\n\nWe can take the word, and the confidence that comes with it. Or we can decline, and not owe the throne to a foreign government. The other Italy will read either answer."
 ita_dnc.2973.d_c: "An Austrian corps is over the passes. It is marching on the Chamber's provinces in the name of order, and the ambassador has brought the note that explains it.\n\nWe did not ask for this, and we cannot send it home. We can accept what it brings and pay for it in the eyes of our own soldiers. Or we can refuse the foreign bayonet and let the other Italy claim the nation."
 ita_dnc.2973.a: "Accept what Vienna offers."
 ita_dnc.2973.b: "Refuse. The Crown will not owe its throne to Austria."
 ita_dnc.2974.t: "The Austrians at the Isonzo"
 ita_dnc.2974.d_a: "An Austrian corps stands above the passes, with a notice that it is there for order. The frontier towns are counting the guns.\n\nWe can answer the King's foreign friends with the country's own anger, and make the Chamber the party of the Italian lands under Austria. Or we can keep our corps on the Isonzo and hold the passes quietly."
 ita_dnc.2974.d_b: "The Austrians have come over the passes in the King's name, as they came for the King of Naples in our grandfathers' time. The Chamber is now the only Italy fighting a foreign army.\n\nWe can call the country to arms and let the King answer for his allies. Or we can hold the Isonzo with what we have, and let the war of the two Italies wait."
 ita_dnc.2974.a: "Call the country to arms. Trento and Trieste before the Quirinal."
 ita_dnc.2974.b: "Hold the Isonzo, and wait."
 ita_dnc.2971.t: "The Legion at Nice"
 ita_dnc.2971.d: "The Italians have done to their Chamber what our own generals once dreamed of doing to ours. The Chamber has answered by raising the cities.\n\nThe son of Garibaldi is at Nice, asking us to open the frontier to his volunteers. The government of the north asks to be recognised as the government of Italy. We can let the legion through, give the Chamber our word, or close the passes and wait."
 ita_dnc.2971.a: "Let the legion through."
 ita_dnc.2971.b: "Recognise the government of the Chamber."
 ita_dnc.2971.c: "Close the passes."
 ita_dnc.2975.t: "The Legion Crosses the Frontier"
 ita_dnc.2975.d: "France has opened the passes. Ricciotti Garibaldi has crossed with the red shirts of three generations, singing the songs their fathers sang in the Vosges.\n\nThey ask us for a sector of the front and a flag, not for pay. Vienna will read of it tomorrow, and the King will call it a foreign hand in an Italian quarrel. The rifles are real all the same."
 ita_dnc.2975.a: "Enlist the Garibaldian legions, and Ricciotti with them."
 ita_dnc.2991.t: "Paris Recognises the Chamber"
 ita_dnc.2991.d: "The French ambassador has presented his letters to the Chamber, not to the King. The newspapers in Paris now call us the government of Italy.\n\nIt is a word, not a corps of troops. But every prefect who was waiting to see which way Europe leans has read it this morning, and so has Vienna."
 ita_dnc.2991.a: "Thank Paris, and send the news to every prefect."
 ITA_cw_the_exiles_welcomed_tt: "§YThe leagues remember who welcomed them. The fortress gates will open, and the man who walks out is the likelier choice when the Chamber names its leader.§!"
 ITA_cw_berlin_forbids_laibach_tt: "§YBerlin tells Vienna that no Austrian corps may cross the Brenner. Vienna is likelier to recognise the King instead.§!"
 ITA_cw_the_arma_goes_to_the_king_tt: "§RA legion of Carabinieri goes over to the King.§! §GOur own streets are quieter for it, and the ministry stands firmer.§!"
 ITA_cw_the_arma_stays_in_barracks_tt: "§YNo Carabinieri march for either side.§!"
 ITA_cw_the_gates_open_tt: "§YMalatesta is back and the Romagna listens to him, so the insurrection comes sooner if the Piazza is left to heat after the war.§! §YLazzari is free and may sit in the ministry.§!"
 ITA_cw_berlin_lets_the_alliance_lapse_tt: "Berlin says nothing, and lets the Triple Alliance lapse. §RVienna will trust Rome less for it.§!"
 ITA_cw_the_crown_owed_vienna_tt: "§RThe throne owes its safety to a foreign army. The country will not forget it when the war is judged.§!"
 ITA_cw_the_crown_refuses_the_bayonet_tt: "§GThe King refuses to be saved by a foreign army.§!"
 ITA_cw_vienna_stands_with_the_crown_tt: "§GVienna deals with the King's government and with no other.§!"
 ITA_cw_the_isonzo_is_held_tt: "§YOur troops on the frontier hold the passes, whoever wins the war. Vienna has no answer to that.§!"
 ITA_cw_paris_recognises_the_chamber_tt: "§GParis calls the Chamber the government of Italy.§!"
 ITA_cw_the_legion_stands_with_the_chamber_tt: "§GThree legions and Ricciotti Garibaldi stand with the Chamber.§! §RVienna will not like it.§!"
 ITA_cw_tt_2990_a: "§GGiolitti comes over, and Piedmont with him. If a royal division still holds Turin, we get the speech and not the province.§!"
 ITA_cw_nothing_follows_tt: "Nothing further follows from this choice."
 ITA_cw_threat_the_corps_in_the_tyrol: "Austrian corps in the Tyrol"
 ITA_cw_threat_laibach: "The Austrian intervention in Italy"
 ITA_cw_threat_the_legion: "The Legion at the Frontier"
 ita_dnc.2979.t: "The Province Changes Hands"
 ita_dnc.2979.d_a: "The prefect's men have followed the army into the province. They found the land tax registers burned in the square, the rolling stock gone south with the leagues, and the telegraph cut at every post.\n\nThe province is ours again. What is left of it is worth a good deal less than it was."
 ita_dnc.2979.d_b: "Our columns have entered the province behind the Crown's retreat. The prefecture is empty, the archives went away in the King's carts, and the rails are lifted at the junctions.\n\nWe hold the ground. The works on it will have to be built again."
 ita_dnc.2979.a: "Take the province as we find it."
 ita_dnc.2980.t: "The Other Capital Falls"
 ita_dnc.2980.d_a: "Our columns have entered the Chamber's seat, and its president was arrested with his papers. The deputies who got away have met in another city.\n\nThey have named a new leader, the socialist who came out of the fortress two years ago. The moderate Chamber is finished. The Chamber of the leagues fights on."
 ita_dnc.2980.d_b: "The King has gone aboard the squadron with the Queen and the ministry, as the last King of Naples did before him. The generals who stayed have put the Duke of Aosta at the head of the government in the King's name.\n\nOur columns hold his capital. The Crown has another city and another face, and it has not surrendered."
 ita_dnc.2980.a: "Fight on. They have another city and another leader."
 ita_dnc.2994.t_a: "The King Goes Aboard"
 ita_dnc.2994.t_b: "The Chamber Sits in Another City"
 ita_dnc.2994.d_a: "The capital is in the Chamber's hands. The King has gone aboard the squadron with the Queen and the ministry, as the last King of Naples went before him.\n\nThe generals who stayed have put the Duke of Aosta at the head of the government in the King's name. The prefects of the provinces still ours are told that the Crown has moved, and has not surrendered."
 ita_dnc.2994.d_b: "The seat of the Chamber has fallen to the King's columns, and its president was taken with his papers. The deputies who got away have met in another city.\n\nThey have named the socialist who came out of the fortress two years ago to lead what is left of the legal country. The moderate Chamber is finished, and the provinces that followed us are asked to follow him."
 ita_dnc.2994.a: "Move the government, and go on with the war."
 ita_dnc.2977.t: "The Island Rises"
 ita_dnc.2977.d: "Sicily waited for its own statute through the whole war, and we sent a corps into the interior instead. This morning the sulphur towns and the republican clubs of Palermo proclaimed a government of their own.\n\nOur garrisons on the island have gone over to them or gone home. Whichever of us wins on the mainland will have to take Sicily back by sea."
 ita_dnc.2977.a: "Declare war on the island's government."
 ita_dnc.2993.t: "Sicily Proclaims Its Own Government"
 ita_dnc.2993.d: "Sicily has proclaimed its own government at Palermo, and both Italian governments declared war on it the same morning. The island had waited through the whole war for the statute it was promised.\n\nThe squadrons that held the strait for one King or the other now hold it against Sicily. There are three governments on the map where there was one."
 ita_dnc.2993.a: "We shall take the island back by sea."
 ita_dnc.2993.b: "Govern the island from Palermo."
 ita_dnc.2993.c: "Note it, and say nothing."
 ita_dnc.2978.t: "The Admirals Ask for Their Ships"
 ita_dnc.2978.d: "We promised the admirals a fleet law when the kingdom split, and two years have gone by without a vote. This morning the squadron weighed anchor without orders and stood in toward the capital.\n\nThe Minister of the Navy says the officers answer to him and to nobody else. We can break them, or we can hand him the government."
 ita_dnc.2978.a: "Break the admirals and strike them off the navy list."
 ita_dnc.2978.b: "Hand the government to Admiral Bettolo."
 ITA_cw_tt_2994_a: "§YThe government sits in another city under a new head, the Duke of Aosta for the Crown or Turati for the Chamber. The war goes on.§!"
 ITA_cw_palermo_is_promised_tt: "§YPalermo is promised its statute, and Napoleone Colajanni may be taken as an adviser.§!"
 ITA_cw_threat_the_island: "The rising in Sicily"
 ITA_cw_palermo_asks_its_price: "Sicily Asks for Its Statute"
 ITA_cw_palermo_asks_its_price_desc: "The island's deputies have come to ask what the statute we promised them is worth while the kingdom fights itself. We have seven months to answer. Every month we spend on the mainland is a month the sulphur towns spend listening to the republican clubs."
 ITA_cw_the_fleet_law_is_owed: "The Fleet Law Is Owed"
 ITA_cw_the_fleet_law_is_owed_desc: "We promised the admirals their fleet law when the kingdom split, and they hold the squadrons for us on that word. If the law is not carried within two years, they will come for their ships."
 ITA_cw_the_war_of_the_two_italies: "The War of the Two Italies"
 ITA_cw_the_war_of_the_two_italies_desc: "§YWhere the kingdom will split.§! The prefects keep the centre while they stand at §Y[?ITA_cw_prefects_line|0]§! or above. The Crown keeps the frontier at §Y[?ITA_cw_crown_line|0]§! and Piedmont at §Y[?ITA_cw_piedmont_line|0]§!. Today the centre is [ITA_cw_GetCentreHeld], the frontier [ITA_cw_GetFrontierHeld] and Piedmont [ITA_cw_GetPiedmontHeld]."
 ITA_cw_the_debt_to_the_admirals: "The Debt to the Admirals"
 ITA_cw_the_debt_to_the_admirals_desc: "§YThe fleet law was promised when the kingdom split.§! The admirals hold the ships for us until the term runs out. If the law is not carried by then, they will come for them."
 ita_dnc.2982.t: "The Amnesty or the Tribunals"
 ita_dnc.2982.d_a: "The other Italy's leaders are in our hands. The prefects are asking what is to be done with men who sat in a Chamber against the King.\n\nThe military tribunals are ready to sit again. A new reign could instead open with an amnesty, which would cool the squares and leave those men their seats."
 ita_dnc.2982.d_b: "The King's ministers are in our hands. The deputies are asking what is to be done with men who governed by decree and sent the Chamber home.\n\nWe can try them before the tribunals they once used on us. Or we can open the reign of the legal country with an amnesty and let them keep their seats."
 ita_dnc.2982.a: "Proclaim an amnesty and let them keep their seats."
 ita_dnc.2982.b: "Send them before the military tribunals."
 ita_dnc.2983.t: "The Civil War Ends"
 ita_dnc.2983.d_a: "The King's columns have entered the last of the Chamber's cities. The deputies who sat against the decrees have been taken or have fled.\n\nThe Crown governs Italy again by the sword that made it. The governments of Europe are asking what it will do with the victory."
 ita_dnc.2983.d_b: "The legal country has taken the last of the Crown's provinces, and the King's ministers are in its hands. Italy has a Chamber again and no decrees.\n\nThe governments of Europe are asking whether it will also have a King."
 ita_dnc.2983.a: "Tell the country the war is over."
 ita_dnc.2983.b: "Note that Italy has a government again."
 ita_dnc.2988.t: "The Militia After the War"
 ita_dnc.2988.d: "The militia we raised for the war is still on the rolls, and its officers want to know whether they are to be paid off or kept. A country at peace does not need armed leagues in its streets, nor a reserve that answers to the Carabinieri before the ministry.\n\nWe can send them home, or keep them on the books a while longer."
 ita_dnc.2988.a: "Send them home."
 ita_dnc.2988.b: "Keep them on the rolls for now."
 ita_dnc.2984.t: "The General Retires"
 ita_dnc.2984.d: "The General who held the government through the war has asked to be relieved of it, and of his command with it. He served the Crown and the country as a soldier does, and was never asked what he thought of either.\n\nNow that the guns are quiet, he says the question of what Italy is to be is not a soldier's to answer. We shall let him go and answer it ourselves."
 ita_dnc.2984.a: "Accept his resignation and call a civilian to the government."
 ita_dnc.2986.t: "What Becomes of the King"
 ita_dnc.2986.d_a: "The King who left the capital rather than govern with us has been brought back with his ministers. We must now say what we do with him.\n\nHe can swear the Statuto, the kingdom's constitution, a second time before both Houses and reign as his father reigned. Or the House of Savoy can take ship for the last time, as another Piedmontese king did, and leave the country to name itself."
 ita_dnc.2986.d_b: "The King who sent the Chamber home has lost the war his decree began. We who won it must say what we do with him.\n\nHis son can be called to swear the Statuto, the kingdom's constitution, and reign over a recalled Chamber. Or we can declare the Crown forfeit and let the country call itself a republic."
 ita_dnc.2986.a: "Let the King swear the Statuto a second time."
 ita_dnc.2986.b: "Send the House of Savoy into exile."
 ita_dnc.2985.t: "The Prisoners of the Fortress"
 ita_dnc.2985.d: "The war has come and the depots are short of officers and men. The men the tribunals sent to the fortress after the civil war are asking to serve.\n\nTheir party is broken, but their names still carry in the provinces that followed them. We can put them back in the ranks, leave them where they are, or finish what the tribunals began."
 ita_dnc.2985.a: "Let them out and put them in the ranks."
 ita_dnc.2985.b: "Leave them in the fortress."
 ita_dnc.2985.c: "Finish what the tribunals began."
 ita_dnc.2620.e: "Give it to Lazzari, who came out of the fortress."
 ITA_cw_the_leaders_amnestied_tt: "§GThe leaders of the other Italy keep their seats.§!"
 ITA_cw_the_leaders_in_the_fortress_tt: "§RThe leaders of the other Italy go to the fortress and their party is broken. A war may yet call them back.§!"
 ITA_cw_the_hundred_days_open_tt: "§YThe Hundred Days begin, and the country has that long to say what it will be.§!"
 ITA_cw_the_winner_is_settled_tt: "§YThe government returns to Rome. If the Chamber has won it must say what becomes of the King, and if the Crown has won the kingdom returns to the Statuto, its constitution.§!"
 ITA_cw_the_hundred_days_are_bought_tt: "§GThe Hundred Days are put back by a month.§!"
 ITA_cw_the_general_retired_tt: "§YThe General leaves the government, and the provisional regime ends with him.§!"
 ITA_cw_tt_2986_a: "§GThe King swears again, the country settles, and the King's own national spirit comes back.§! If the Chamber won the war it began, the Chamber is recalled under the King's son."
 ITA_cw_tt_2986_b: "§RThe King leaves the country, or his son is told the Chamber will not swear him.§! Italy may then call itself a republic under Colajanni, or leave the regime for the Chamber to settle."
 ITA_cw_the_leaders_reinstated_tt: "§YThe fortress opens, and the men of the beaten party may serve in the government again.§!"
 ITA_cw_the_fortress_is_emptied_tt: "§RThe tribunals finish their work, and nobody will be recalled.§!"
 ITA_cw_fuorusciti: "Fuorusciti"
 ITA_cw_fuorusciti_long: "The Exiles"
 ITA_cw_the_red_rising_tt: "§RMilan, Lombardy, Liguria and the Romagna rise in arms under Malatesta, and Europe is told of it.§!"
 ITA_cw_the_romagna_rises_tt: "§RThe Romagna, Tuscany and the Abruzzi rise in arms.§! The piazza is §Rset to a high mark§! and the Chamber's majority §Rfalls by 25§!."
 ITA_ind_edison: "Edison, Milan"
 ITA_ind_edison_desc: "The electricity company of Milan. It runs the power station in the middle of the city and the long line down from the hydroelectric works on the Adda. The trams, the theatres and the looms all run on what comes down it. Its engineers learned the trade on Edison's patents, and they now sell current across Lombardy on their own terms."
 ITA_ind_marelli: "Ercole Marelli & C., Milan"
 ITA_ind_marelli_desc: "Electric motors, fans and pumps. These are the small machines that let a workshop run on current instead of a steam engine and a belt. Ercole Marelli is a Milanese mechanic who set up for himself, and every hydroelectric scheme in the north needs what his shops turn out."
 ITA_ind_pirelli: "Pirelli & C., Milan"
 ITA_ind_pirelli_desc: "A rubber works on the edge of Milan. It makes hose, belting and insulated wire. Its own ship lays the undersea cable out to the islands. It makes tyres too, for a motor trade that did not exist when the works were built. Crude rubber comes in from overseas and leaves as something the army, the navy and the post office cannot do without."
 ITA_ind_petrolifera: "Petroli d'Italia, Fiorenzuola"
 ITA_ind_petrolifera_desc: "Wells in the hills above Piacenza, and the refineries at Fiorenzuola below them. A Genoese company bought the lot from the French concerns that drilled them first. The field gives little and the oil is light and clean. It is our own petroleum, and no foreign shipper can refuse to deliver it."
 ITA_ind_dinamite_nobel: "Dinamite Nobel, Avigliana"
 ITA_ind_dinamite_nobel_desc: "The explosives works at Avigliana, in the valley west of Turin. It makes dynamite for the tunnels and the quarries, and the smokeless powder the artillery has taken for its own. Nobel's name is on the gate, but the chemists inside are Italian. The War Ministry remembers that whenever the foreign shareholders name a price."
 ITA_ind_ilva: "Ilva, Genoa"
 ITA_ind_ilva_desc: "A company raised on Genoese capital to smelt Italian ore in Italian furnaces, instead of selling the ore to the foundries of northern Europe. Its blast furnaces are going up on the Tyrrhenian shore and the State has promised it orders. Nobody yet knows whether it will pour steel before it pours money away."
 ITA_ind_falck: "Acciaierie e Ferriere Lombarde"
 ITA_ind_falck_desc: "Open-hearth steel, made from scrap iron and rolled into bar, rod and girder for the builders of Milan. Giorgio Enrico Falck comes of a family of Alsatian ironmasters. He has put his furnaces where the city grows fastest, and the city buys everything he pours."
 ITA_ind_elba: "Elba, Portoferraio"
 ITA_ind_elba_desc: "The iron mountain of Elba, worked under a lease from the State. The company is putting up blast furnaces at Portoferraio so that some of the ore stops leaving on foreign ships. The ore is rich and the mines are old. The company would still rather sell the ore abroad than wait for its own furnaces to pay."
 ITA_ind_monteponi: "Monteponi, Iglesias"
 ITA_ind_monteponi_desc: "Lead, zinc and silver out of the hills behind Iglesias, washed, roasted and shipped from the Sardinian coast. The company worked this ground before the Kingdom existed. It knows every seam in the district better than the inspectors who come out from the mainland."
 ITA_ind_bacu_abis: "The Bacu Abis Collieries"
 ITA_ind_bacu_abis_desc: "The coal of the Sulcis, cut from thin seams in the south-west of Sardinia and carried down to the quays on the coast. It is soft and ashy, and it burns badly under a warship's boilers. It is also our own, and no blockade of the straits can take it away."
 ITA_ind_bianchi: "Edoardo Bianchi, Milan"
 ITA_ind_bianchi_desc: "Bicycles first, then motorcycles, then motor cars, out of a Milanese workshop that has never stopped making the first of the three. The bersaglieri, our light infantry, have taken to the bicycle. Edoardo Bianchi has noticed that an army buys bicycles in numbers no shop could ever sell."
 ITA_ind_itala: "Itala, Turin"
 ITA_ind_itala_desc: "A Turin motor works that builds big, strong touring cars, and has driven one of them from Peking to Paris to prove it. Matteo Ceirano founded the firm and has since left it. The works go on without him, selling chassis to anyone who needs a vehicle that will not break on a bad road."
 ITA_ind_officine_meccaniche: "Officine Meccaniche, Milan"
 ITA_ind_officine_meccaniche_desc: "Locomotives, tenders, wagons and the heavy castings that go into them, from the Milanese works that swallowed the old Miani and Silvestri shops. Every railway company in the north has its rolling stock repaired here. Every one of them is late paying."
 ITA_ind_ferrovie_dello_stato: "Ferrovie dello Stato"
 ITA_ind_ferrovie_dello_stato_desc: "The railways bought back from the companies and run by the State. The lines, the stations, the workshops and the men now answer to one director, and he answers to the minister. The track is worn, the rolling stock is short and the timetable is a promise. For the first time the army can plan a mobilisation on a network that takes orders."
 ITA_ind_navigazione_generale: "Navigazione Generale Italiana"
 ITA_ind_navigazione_generale_desc: "The great shipping house of Genoa and Palermo, born of the Florio and Rubattino fleets. Its mail steamers run to the Levant, the Americas and the Red Sea, on subsidies the Chamber renews and complains about in the same breath. Its liners are the Kingdom's merchant fleet in all but name. In a war they will be its transports."
 ITA_ind_lloyd_sabaudo: "Lloyd Sabaudo, Turin"
 ITA_ind_lloyd_sabaudo_desc: "A new line out of Genoa, built for one trade. It carries emigrants to New York and the River Plate, in steerage, on ships ordered from British yards. The capital is from Turin and the passengers are from the south. The company counts on a stream that has never run dry."
 ITA_ind_banca_commerciale: "Banca Commerciale Italiana"
 ITA_ind_banca_commerciale_desc: "The Milanese bank founded on German capital, run by men who learned the trade in Frankfurt, in Genoa and in the Rothschild house at Naples. It lends to electricity, steel and shipping on the German model, and it sits on the boards of the works it lends to. Its critics print the directors' names as if they were a charge sheet."
 ITA_ind_credito_italiano: "Credito Italiano"
 ITA_ind_credito_italiano_desc: "The Genoese bank that rose out of the ruins of the last banking crash, and now reaches from the port to the Milanese exchange. It places the Treasury's loans at home and lends to the shipyards and the railways. It takes care never to be caught holding the same paper as the bank across the street."
 ITA_ind_banco_di_napoli: "Banco di Napoli"
 ITA_ind_banco_di_napoli_desc: "The old public bank of the South, still printing its own notes. Since the emigration law it has carried the savings of emigrants home from the Americas. The money comes back in small sums from Buenos Aires and New York. The bank turns it into loans for a South that has more hands than work."
 ITA_ind_royal_arms_factories: "The Royal Arms Factories"
 ITA_ind_royal_arms_factories_desc: "The rifle factories the State owns outright, at Terni and at Brescia, with shops in Gardone. They turn out the rifle and the carbine of the army, to a pattern the ministry sets and at a pace the estimates allow. They are slower than any private house. They are also the only ones that never ask whether an order will pay."
 ITA_arm_terni_steel: "Acciaierie di Terni"
 ITA_arm_terni_steel_desc: "The steelworks in the Umbrian valley that the navy willed into being. It rolls armour plate, gun forgings and shell steel, far from any coast a foreign fleet could reach. The State is its first customer and its guarantor. The works have never yet had to find out what a price is."
 ITA_arm_fiat_of_turin: "Fiat, Turin"
 ITA_arm_fiat_of_turin_desc: "The Turin motor company that a circle of gentlemen who liked motor cars turned into a factory. It builds touring cars, lorries and engines for anything that will take one. The officers who ride in its cars are already writing reports on what its lorries could carry."
 ITA_arm_ansaldo_of_sampierdarena: "Ansaldo, Genoa"
 ITA_arm_ansaldo_of_sampierdarena_desc: "The Ansaldo mechanical works on the western edge of Genoa. It makes locomotives, marine engines, gun mountings and heavy tubes. It builds everything the navy and the army will pay for, and a good deal they have not yet asked for."
 ITA_arm_armstrong_of_pozzuoli: "Armstrong, Pozzuoli"
 ITA_arm_armstrong_of_pozzuoli_desc: "The Italian works of Armstrong, on the bay at Pozzuoli. Heavy guns, coast-defence mountings and naval ordnance, built to Elswick drawings by Neapolitan hands. It was put here to win the Kingdom's orders from inside the Kingdom, and it has won most of them."
 ITA_arm_glisenti_of_brescia: "Siderurgica Glisenti, Brescia"
 ITA_arm_glisenti_of_brescia_desc: "The Brescian ironworks and arms shop that makes service revolvers for the army. It is working on an automatic pistol of Italian design. The drawings are clever and the parts are not made to a close fit, and the officers who test them report both facts with equal care."
 ITA_arm_savigliano_works: "Officine di Savigliano"
 ITA_arm_savigliano_works_desc: "The national works at Savigliano. It makes iron bridges, cranes, rolling stock and dynamos. It threw the great iron arch across the Adda at Paderno. The army's engineers have not forgotten that a bridge can be built in pieces and carried to the river."
 ITA_arm_beretta_of_gardone: "Beretta, Gardone Val Trompia"
 ITA_arm_beretta_of_gardone_desc: "The oldest gunmaking house in the valley of the Mella. It makes sporting guns, barrels and rifle parts, by the hands of men whose grandfathers made them before. The State factories set the pattern. When the army needs rifles in a hurry, Gardone is where it looks."
 ITA_arm_breda_of_milan: "Ernesto Breda, Milan"
 ITA_arm_breda_of_milan_desc: "Ernesto Breda's engineering works at Milan. It builds locomotives in long series, and boilers and heavy machinery besides. The management believes any machine can be made if the order is large enough. The railway companies are its bread, and the army is the order it is waiting for."
 ITA_arm_officine_galileo: "Officine Galileo, Florence"
 ITA_arm_officine_galileo_desc: "The Florentine instrument works. It makes telescopes, rangefinders, searchlights and the sights that let a battery lay its guns on what an observer sees from a balloon. The glass still comes from abroad, but the work on it is Florentine."
 ITA_n_castellammare: "Regio Cantiere di Castellammare"
 ITA_n_castellammare_desc: "The royal yard on the bay of Naples. The great hulls of the Regia Marina, our navy, go down there on slips the Bourbons built for smaller ships. It builds slowly and it builds well. It also builds whatever the ministry designs, which is its virtue and its trouble."
 ITA_n_arsenale_di_venezia: "Regio Arsenale di Venezia"
 ITA_n_arsenale_di_venezia_desc: "The old arsenal of Venice, behind its walls on the lagoon. It builds torpedo boats, light cruisers and the first hulls of the submarine flotilla, and it refits every ship that comes up the Adriatic. The water is shallow and the channels are narrow. Every large hull it launches is towed out with care."
 ITA_n_arsenale_della_spezia: "Regio Arsenale della Spezia"
 ITA_n_arsenale_della_spezia_desc: "The great naval arsenal of the Kingdom, on the gulf of La Spezia. Dry docks, magazines, workshops, and the slipways where battleships are built beside the refits of the whole fleet. The navy owns it, staffs it and blames it, in that order."
 ITA_n_orlando_di_livorno: "Cantiere Orlando, Livorno"
 ITA_n_orlando_di_livorno_desc: "The Orlando brothers' yard at Livorno, founded by exiles of the Risorgimento. It is now one of the great private yards of the Kingdom. It builds cruisers, torpedo craft and merchant hulls, and it has an armoured cruiser on the slip that the navy watches closely. The family runs it and argues about it in equal measure."
 ITA_n_ansaldo: "Ansaldo, Sestri Ponente"
 ITA_n_ansaldo_desc: "Ansaldo's shipyard at Sestri Ponente. It builds the Garibaldi armoured cruisers one after another, for any navy that pays: Argentina, Spain, Japan and our own. The design is so good that the yard sells it abroad faster than the Chamber can vote for it."
 ITA_n_fiat_san_giorgio: "Fiat San Giorgio, La Spezia"
 ITA_n_fiat_san_giorgio_desc: "The yard on the gulf of La Spezia where the motor company of Turin builds submarines. They are built to Cesare Laurenti's double-hulled design. It is a small yard with a patent worth more than its slips, and foreign navies already come to look at the drawings."
 ITA_air_brigata_specialisti: "Brigata Specialisti del Genio, Rome"
 ITA_air_brigata_specialisti_desc: "The Engineers' specialist brigade at Rome. It holds the balloon park, the gas plant and the workshop that sews the envelopes, and its officers have begun to design an airship of their own. It builds nothing for sale and everything for trial. Its budget is a line inside somebody else's."
 ITA_air_forlanini: "Enrico Forlanini, Milan"
 ITA_air_forlanini_desc: "The Milanese engineer who flew a steam helicopter model before most men had seen a motor car. His own company now builds his airships in the shed at Crescenzago. He also runs a boat on underwater wings across Lake Maggiore. The navy has not yet decided whether that is a curiosity or a warning."
 ITA_air_caproni: "Gianni Caproni"
 ITA_air_caproni_desc: "A young engineer from the Trentino, back from the schools of Munich and Liège. He has the drawings of a biplane and a brother to help him build it. He has no shed of his own, no orders and very little money. The Ministry has started to ask who he is."
 ITA_air_spa: "SPA, Turin"
 ITA_air_spa_desc: "The Turin motor company of Matteo Ceirano and Michele Ansaldi. Its shops built the first aeroplane of Italian design to leave the ground, a triplane drawn by the engineer Faccioli. The machine flies a little and breaks a lot. SPA is already quoting for aero engines."
 ITA_air_isotta_fraschini: "Isotta Fraschini, Milan"
 ITA_air_isotta_fraschini_desc: "The Milanese motor house of Cesare Isotta and the Fraschini brothers. It builds fast touring cars and racing engines, and in a corner of the works an aero engine that must run for an hour without seizing. The cars sell to the rich. The engine is being built for a Ministry that has not yet said it will buy it."
 ITA_arm_terni_steel_improved_desc: "Terni has written the army's orders into the plan of the plant. Shell steel and gun forgings now run on lines of their own, and the pieces come out cheaper for being made in quantity."
 ITA_arm_fiat_of_turin_improved_desc: "Fiat now builds for the fast formations. Staff cars, lorries and tractors come off lines laid out to the army's patterns, and a vehicle ordered in one year's estimates is at the depot before the next."
 ITA_arm_ansaldo_of_sampierdarena_improved_desc: "Ansaldo has a line for the heavy field pieces the army has adopted. The howitzers and the long guns now leave Sampierdarena in batches, not one at a time."
 ITA_arm_armstrong_of_pozzuoli_improved_desc: "Every gun from Pozzuoli is now proved at Nettuno before it leaves. The works have cut their rejections and the cost of a gun together."
 ITA_arm_glisenti_of_brescia_improved_desc: "Glisenti has kept its arms shop instead of selling it. The automatic pistol the officers of the new sections carry is now made in Brescia, to the ministry's gauges."
 ITA_arm_savigliano_works_improved_desc: "Savigliano now keeps a shop for the army's engineers alone. The bridging trains leave the works in sections, cut to be carried to the river and put up in a night."
 ITA_arm_beretta_of_gardone_improved_desc: "Beretta has taken a standing contract for service arms. Gardone now turns out rifles and carbines on machine lines instead of at the bench."
 ITA_arm_breda_of_milan_improved_desc: "Breda builds the military trains to the War Ministry's patterns. The locomotives and wagons of the mobilisation plan come off its lines at a price the railway companies never got."
 ITA_n_castellammare_improved_desc: "Castellammare has had its basins enlarged and its slips kept in steady work. A battleship hull no longer waits between votes for its next plate."
 ITA_n_arsenale_di_venezia_improved_desc: "The Venice arsenal keeps the flying station and the light-craft sheds under one head. The boats of the Adriatic are built and repaired on a single programme."
 ITA_n_arsenale_della_spezia_improved_desc: "La Spezia has been rebuilt around the new capital ships. Its docks take the hulls of the dreadnought age without cutting a new gate."
 ITA_n_orlando_di_livorno_improved_desc: "Orlando now builds to the standards of the battle fleet. Its cruisers leave Livorno fit to steam in the line."
 ITA_n_ansaldo_improved_desc: "Sestri Ponente builds the hulls of our cruiser squadron first and the export orders after. The same design comes off the slip cheaper each time."
 ITA_n_fiat_san_giorgio_improved_desc: "Fiat San Giorgio builds the flotilla's submarines in series at La Spezia. Every hull on the slip goes to the navy, and no drawing is sold abroad."
 ITA_air_brigata_specialisti_improved_desc: "The brigade builds and tries its airships at the experimental yard on Lake Bracciano. A ship leaves its shed, flies out over the water and is back in a morning."
