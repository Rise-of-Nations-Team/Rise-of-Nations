 ITA_air_tb_the_lagoon_station: "The Station on the Lagoon"
 ITA_air_tb_the_watch_on_pola: "The Watch on Pola"
 ITA_air_tb_the_memoranda: "The Memoranda of Douhet"
 ITA_air_tb_the_aero_engine: "An Engine of Our Own"
 ITA_air_tb_the_turin_bench: "The Bench at Turin"
 ITA_air_tb_the_aeronautical_shop: "The Aeronautical Shop"
 ITA_air_tb_the_gun_shop_learns: "The Gun Shop Learns the Trade"
 ITA_air_tb_the_civil_brevet: "The Civil Brevet"
 ITA_air_tb_the_settled_argument: "The Argument Settled"
 ITA_air_tb_the_aeroplane_wins: "The Aeroplane Wins the Estimates"
 ITA_air_tb_the_airship_keeps_it: "The Airship Keeps the Estimates"
 ITA_air_tb_the_slipway: "The Slipway and the Crane"
 ITA_air_tb_the_command_of_the_air: "The Command of the Air"
 ITA_air_tb_the_only_evidence: "The Only Evidence in Europe"
 ITA_air_tb_the_trimotor: "The Caproni Trimotor"
 ITA_air_tb_doctrine_meets_machine: "The Doctrine Meets the Machine"
 ITA_air_tb_the_standing_order: "The Standing Order"
 ITA_air_tb_the_three_year_list: "The Three Year List"
 ITA_air_tb_the_reserve: "The Reserve of Brevets"
 ITA_air_tb_the_naval_service: "The Naval Flying Service"
 ITA_air_tb_the_admiralty_vote: "The Admiralty Vote"
 ITA_air_tb_the_new_arm: "An Arm of Its Own"
 ITA_air_tb_the_directorate: "The Directorate of Aeronautics"
 ITA_air_the_answer_threat: "Italy has bombed from the air"
 ITA_air_the_adriatic_watch_threat: "Italian airships over the Adriatic"
 ITA_air_the_doctrine_threat: "The Italian bombardment squadrons"
 ITA_air_the_trimotor_threat: "The Italian heavy aeroplane"
 ITA_air_the_new_arm_threat: "Italy has raised an air arm"
 ita_dnc.1500.t: "Rome Renews the Alliance"
 ita_dnc.1500.d: "The Italian ambassador brings the renewal and asks for nothing with it. Our ministers read the military convention that comes attached and find it unchanged.\n\nRome has renewed before and built a fleet base facing us the same year. The question is whether to take the paper at its word."
 ita_dnc.1500.a: "Take the renewal at its word."
 ita_dnc.1500.b: "Sign it, and watch them."
 ita_dnc.1501.t: "Vienna Signs Warmly"
 ita_dnc.1501.d: "The Ballhausplatz answers within the week. The renewal is welcomed as the act of an ally, and the covering minute, which our black cabinet has read, says the same thing in private.\n\nThat has not happened before. It gives us something to spend."
 ita_dnc.1501.a: "Good. Now it can be spent."
 ita_dnc.1502.t: "Vienna Signs Without Warmth"
 ita_dnc.1502.d: "The renewal comes back signed and nothing else. The Austrian ambassador, asked whether his court is content, says that his court has signed.\n\nOur attaché reports that the frontier garrisons in the Tyrol were not reduced this spring."
 ita_dnc.1502.a: "Then we know where we stand."
 ita_dnc.1530.t: "A Note from Rome"
 ita_dnc.1530.d: "The Italian ambassador hands over two paragraphs in his own hand. If France is attacked, Italy will stand neutral; and Italy will do nothing in North Africa that France would resent.\n\nIt is worth a great deal, if it stays in the safe. It is worth something else if it does not."
 ita_dnc.1530.a: "Take it, and keep it in the safe."
 ita_dnc.1530.b: "Take it, and let Vienna hear of it."
 ita_dnc.1531.t: "Paris Talks About Rome"
 ita_dnc.1531.d: "A French deputy, defending a colonial estimate, says more than he needed to about Italian goodwill in the Mediterranean. Our embassy sends the cutting the same evening.\n\nEither Rome has given Paris an undertaking, or Paris wants us to think so. We can ask, or we can remember."
 ita_dnc.1531.a: "Ask Rome directly."
 ita_dnc.1531.b: "Say nothing, and remember it."
 ita_dnc.1510.t: "Rome Gives Notice"
 ita_dnc.1510.d: "The Italian ambassador reads the declaration standing. The alliance will lapse and will not be renewed. He adds that the Kingdom remains a friendly neighbour, which is the phrase used about neighbours who are not friends.\n\nThe staff asks whether the Tyrol garrisons should be brought up now, while Rome is still explaining itself."
 ita_dnc.1510.a: "Accept the notice coldly."
 ita_dnc.1510.b: "Answer with a warning on the frontier."
 ita_dnc.1511.t: "Vienna Answers with a Warning"
 ita_dnc.1511.d: "The reply to our notice is not a note. It is the recall of leave in the Tyrol garrisons and a communiqué that speaks of the security of the monarchy's southern frontier.\n\nThe Chamber wants to know whether the ministry expected this. The ministry can stand on the notice or soften it."
 ita_dnc.1511.a: "Stand on the notice."
 ita_dnc.1511.b: "Send a softer note after the first one."
 ita_dnc.1512.t: "Rome Leaves the Triplice"
 ita_dnc.1512.d: "Rome has given Vienna notice that the alliance will lapse. The Italian ambassador here is anxious to say that nothing changes between Berlin and Rome.\n\nThe staff has long counted the Italian army for the Rhine. It would like to know whether to go on counting it."
 ita_dnc.1512.a: "Let them go."
 ita_dnc.1512.b: "Keep the door open."
 ita_dnc.1513.t: "Berlin Keeps the Door Open"
 ita_dnc.1513.d: "The Wilhelmstrasse takes our notice to Vienna as a matter between Rome and Vienna. The Chancellor lets it be known that a separate understanding with Berlin would be read with interest.\n\nWe have left one alliance and not yet lost the other half of it."
 ita_dnc.1513.a: "Note it, and keep the channel."
 ita_dnc.1514.t: "Berlin Shuts the Door"
 ita_dnc.1514.d: "Berlin answers our notice to Vienna as if it had been addressed to Berlin. The military attaché is no longer received by the staff. The trade talks are adjourned without a date.\n\nWe are out of the Triplice altogether, which is what the notice said and not what the ministry meant."
 ita_dnc.1514.a: "Then Paris and London it is."
 ita_dnc.1515.t: "Rome Is Free"
 ita_dnc.1515.d: "Italy has given notice to Vienna. For the first time since the Tunis affair, Rome has no ally on the other side of the Alps and no treaty that binds her against us.\n\nThe Quai wants to know whether to court her now or let her come."
 ita_dnc.1515.a: "Court her now."
 ita_dnc.1515.b: "Let her come to us."
 ita_dnc.1520.t: "The Italian Staff Comes to Berlin"
 ita_dnc.1520.d: "General Pollio and two colonels arrive with the timetable for a third army on the Rhine. They want the rolling stock, the detraining stations and a date on which the convention is more than a convention.\n\nThe General Staff will agree to all of it if Rome can be relied on, and to none of it if Rome cannot."
 ita_dnc.1520.a: "Agree the timetable."
 ita_dnc.1520.b: "Listen, and promise nothing."
 ita_dnc.1521.t: "The Timetable Is Agreed"
 ita_dnc.1521.d: "Berlin has signed the timetable. Three corps, the trains found, the stations named. The staff comes home with a document that binds the Kingdom to the Rhine on the eleventh day of a mobilisation.\n\nThe Chamber has not seen it and will not."
 ita_dnc.1521.a: "File it where the Chamber cannot read it."
 ita_dnc.1522.t: "Berlin Listens"
 ita_dnc.1522.d: "The staff comes home with dinners and no signatures. The Germans were courteous about the third army and said that the question of the trains would be studied.\n\nThey do not believe we would come."
 ita_dnc.1522.a: "They may be right."
 ita_dnc.1525.t: "Rome Reaffirms the Alliance"
 ita_dnc.1525.d: "The Italian government asks that the alliance be read as a true one. The military convention, it says, is to be honoured to the letter, and the ministry would like Vienna to say so.\n\nThe Ballhausplatz has heard this from Rome before. This time the question is whether to believe it."
 ita_dnc.1525.a: "Believe them, and say so."
 ita_dnc.1525.b: "Note it, and doubt it."
 ita_dnc.1526.t: "Vienna Believes Us"
 ita_dnc.1526.d: "The answer from the Ballhausplatz uses the word ally without a qualifying clause. The convention is to be worked out between the staffs. The Emperor sends a decoration.\n\nIt is the first time in twenty years that Vienna has taken our word at its face."
 ita_dnc.1526.a: "It has been a long time coming."
 ita_dnc.1540.t: "Rome Demands the Irredenta"
 ita_dnc.1540.d: "The Italian note names the Trentino, Trieste and Istria and asks for their transfer as the price of peace between the two kingdoms. It is not phrased as an ultimatum. It does not need to be.\n\nThe staff answers that the Tyrol can be held. The Foreign Ministry answers that the Trentino alone has been on the table before. The Hungarians answer that they will not fight for Trieste."
 ita_dnc.1540.a: "Cede the Trentino, and keep the peace."
 ita_dnc.1540.b: "Refuse."
 ita_dnc.1540.c: "Offer the Trentino for their neutrality."
 ita_dnc.1541.t: "Vienna Yields the Trentino"
 ita_dnc.1541.d: "The Austrian answer cedes the Trentino to the Brenner watershed and says nothing about Trieste. The commissioners meet at Ala within the month.\n\nThe piazza wanted the whole of the irredenta. The ministry has half of it without a shot, which is a thing the piazza will have to be told is a victory."
 ita_dnc.1541.a: "Half the irredenta, and no war."
 ita_dnc.1542.t: "Vienna Refuses"
 ita_dnc.1542.d: "The refusal is short and is published in Vienna before it reaches Rome. The Tyrol garrisons are brought to war strength. The Austrian ambassador asks for his passports and is told to keep them for now.\n\nThe claim is now a claim with a casus belli under it. The Chamber has to decide what it is worth."
 ita_dnc.1542.a: "Then it will be settled on the Isonzo."
 ita_dnc.1543.t: "Vienna Offers the Trentino for Our Neutrality"
 ita_dnc.1543.d: "Vienna is at war and answers our note with an offer. The Trentino now, in exchange for a declaration that the Kingdom will stand neutral for the duration.\n\nTrieste is not in the offer. The ministry can take what is on the table, or say that it is not enough."
 ita_dnc.1543.a: "Take the Trentino, and stand aside."
 ita_dnc.1543.b: "Not enough. Trieste too."
 ita_dnc.1544.t: "The Trentino Changes Hands"
 ita_dnc.1544.d: "Vienna has ceded the Trentino to Rome rather than fight for it. The Italian ambassador is pleased and says so. The Austrian ambassador is not and says nothing.\n\nAn ally who can be made to pay will be asked to pay again."
 ita_dnc.1544.a: "It was Vienna's to give."
 ita_dnc.1544.b: "Rome has learnt how to ask."
 ita_dnc.1545.t: "Rome Asks for the Irredenta by Force"
 ita_dnc.1545.d: "Vienna has refused the Italian demand and Rome has a casus belli under her claim. The Austrian ambassador asks what Berlin will do if the Italians cross the Isonzo.\n\nThe staff would rather not fight Italy over the Trentino. The staff would rather not lose Austria either."
 ita_dnc.1545.a: "Stand behind Vienna."
 ita_dnc.1545.b: "Hold aloof."
 ita_dnc.1546.t: "Berlin Stands Behind Vienna"
 ita_dnc.1546.d: "The German guarantee is announced in the Reichstag. The staff is told that a war for the Trentino is a war on two fronts, and that the second front is the one that matters.\n\nThe piazza does not read the Reichstag. The ministry does."
 ita_dnc.1546.a: "Then we must be very sure before we march."
 ita_dnc.1547.t: "Berlin Holds Aloof"
 ita_dnc.1547.d: "Berlin lets it be known that the Trentino is a matter between Rome and Vienna. The German ambassador in Rome is, if anything, cordial.\n\nVienna is alone in this, and Vienna knows it."
 ita_dnc.1547.a: "Vienna is alone."
 ita_dnc.1550.t: "The Italians Ask About the Balkans"
 ita_dnc.1550.d: "The King of Italy proposes a meeting at Racconigi and an understanding to follow it. Rome would recognise our interest in the Straits. We would recognise hers in Tripoli. Both would agree that the Balkans are not Vienna's to arrange.\n\nIt costs us nothing that we were going to keep."
 ita_dnc.1550.a: "Agree. The Balkans are not Vienna's."
 ita_dnc.1550.b: "Decline. We have Vienna to think of."
 ita_dnc.1551.t: "Petersburg Agrees"
 ita_dnc.1551.d: "The understanding is initialled at Racconigi in a single afternoon. The Tsar recognises our interest in Tripoli. We recognise his in the Straits. Neither of us will let Vienna arrange the Balkans alone.\n\nIt is the first paper we have signed with a power that is not our ally."
 ita_dnc.1551.a: "A second string to the bow."
 ita_dnc.1552.t: "Racconigi Is Read in Vienna"
 ita_dnc.1552.d: "The Tsar and the King of Italy have met at Racconigi and our embassy has the text of what they agreed within the fortnight. The Balkans, it says, are not to be arranged by one power alone. The one power is us.\n\nRome has bargained behind our back. The question is whether to say so."
 ita_dnc.1552.a: "Protest to Rome."
 ita_dnc.1552.b: "Say nothing, and remember it."
 ita_dnc.1553.t: "Vienna Protests"
 ita_dnc.1553.d: "The Austrian protest is formal and is handed over in the presence of the German ambassador. Rome has undertaken, it says, to arrange the Balkans with Petersburg against her own ally.\n\nThe ministry can deny that the paper says what it says. Vienna has the paper."
 ita_dnc.1553.a: "The paper says what it says."
 ita_dnc.1554.t: "Petersburg Declines"
 ita_dnc.1554.d: "The Russian answer is warm and empty. The Tsar will be pleased to receive the King, and the Straits are not a matter for a paper.\n\nPetersburg has Vienna to think of, or Paris has asked her to."
 ita_dnc.1554.a: "Then Tripoli is ours to take alone."
 ita_dnc.1560.t: "Rome Buys Valona"
 ita_dnc.1560.d: "Both courts are paying the same Albanian chiefs, opening rival schools in the same towns and surveying the same anchorage. The Italian consul at Valona has been seen with a naval officer and a tape.\n\nWe can propose that both of us stop, or tell Rome to."
 ita_dnc.1560.a: "Propose an understanding. Neither of us takes it."
 ita_dnc.1560.b: "Warn Rome off the Adriatic."
 ita_dnc.1561.t: "Vienna Warns Us Off Valona"
 ita_dnc.1561.d: "The Austrian note says that the monarchy regards the Albanian coast as a matter of its own security and would view an Italian establishment there as an unfriendly act.\n\nThe Adriatic is a narrow sea. Whoever holds Valona holds the door of it."
 ita_dnc.1561.a: "Back down, for now."
 ita_dnc.1561.b: "Claim it anyway."
 ita_dnc.1562.t: "Two Courts Bid for Albania"
 ita_dnc.1562.d: "The Italian and Austrian consuls at Valona are buying the same beys. Each has a school, a doctor and a survey party, and neither has asked the Porte.\n\nThe vilayet is ours. It is a question of whether to garrison it like ours."
 ita_dnc.1562.a: "Reinforce the vilayet."
 ita_dnc.1562.b: "Let them bid. The beys are ours either way."
 ita_dnc.1563.t: "The Porte Reinforces Albania"
 ita_dnc.1563.d: "Two battalions land at Durazzo and a third marches up from Janina. The beys we have been paying take the Sultan's pay as well.\n\nValona is not going to be bought. It will have to be waited for, or taken."
 ita_dnc.1563.a: "The survey stays in the drawer."
 ita_dnc.1570.t: "Rome Demands Satisfaction for Adwa"
 ita_dnc.1570.d: "The Italian resident brings a note. The Kingdom requires the cession of Tigray to the escarpment and the recognition of an Italian protectorate over the trade of the north. Failing this, the army of Eritrea will march.\n\nWe beat them once with spears. They have had years to count why."
 ita_dnc.1570.a: "Cede Tigray, and keep the crown."
 ita_dnc.1570.b: "Refuse. Adwa was not an accident."
 ita_dnc.1571.t: "Menelik Yields Tigray"
 ita_dnc.1571.d: "The Emperor cedes Tigray to the escarpment rather than fight a second time. His envoy signs at Asmara and does not stay for the dinner.\n\nAdwa is answered, on paper. The staff points out that the same roads still lead to the same plateau."
 ita_dnc.1571.a: "Adwa is answered."
 ita_dnc.1572.t: "Italy Moves on Abyssinia"
 ita_dnc.1572.d: "Rome has demanded Tigray and been refused, and the army of Eritrea is being brought up to the escarpment. The Emperor's envoy asks whether Britain will guarantee what Britain has recognised.\n\nThe Nile waters rise in his country. Rome has been useful in the Mediterranean."
 ita_dnc.1572.a: "Warn Rome, and guarantee the Emperor."
 ita_dnc.1572.b: "Let Rome burn her fingers."
 ita_dnc.1573.t: "London Guarantees Abyssinia"
 ita_dnc.1573.d: "The British ambassador reads us a guarantee to the Emperor and adds, without instruction, that the Mediterranean fleet is at Malta this season.\n\nThe expedition can go on into a war with Britain behind the enemy, or halt at the escarpment."
 ita_dnc.1573.a: "Go on regardless."
 ita_dnc.1573.b: "Halt at the escarpment."
 ita_dnc.1574.t: "London Looks Away"
 ita_dnc.1574.d: "The British ambassador says that His Majesty's Government has no interest in the interior of Abyssinia beyond the waters of the Nile, and would be glad to be told when that becomes relevant.\n\nWe have a free hand as far as the escarpment."
 ita_dnc.1574.a: "A free hand, as far as the escarpment."
 ita_dnc.1575.t: "Rome Proposes a Boundary"
 ita_dnc.1575.d: "The Italian resident brings a map with a line on it, an offer of a road from the coast and the recognition of the Emperor's title. The line is further back than the last one.\n\nWe can sign it, or ask for the customs at the coast before we do."
 ita_dnc.1575.a: "Sign the boundary."
 ita_dnc.1575.b: "Sign, but ask for the customs at Massawa first."
 ita_dnc.1576.t: "Menelik Asks for the Customs"
 ita_dnc.1576.d: "The Emperor will sign the boundary if the customs at Massawa are shared. His envoy has the figures and they are not small.\n\nThe colony pays for itself or it does not. The boundary is worth something too."
 ita_dnc.1576.a: "Grant the customs, and sign."
 ita_dnc.1576.b: "Refuse. There is no treaty."
 ita_dnc.1580.t: "The Italian Note on Tripoli"
 ita_dnc.1580.d: "Rome asks that Italian enterprise in Tripoli be given the standing of the state behind it: the bank, the school, the shipping line, and a consul who is heard. The note does not mention the garrison. The garrison is what it is about.\n\nWe can let the Italians buy the vilayet slowly, or make it expensive now."
 ita_dnc.1580.a: "Concede Italian enterprise, and no more."
 ita_dnc.1580.b: "Reinforce Tripoli."
 ita_dnc.1581.t: "The Porte Concedes the Bank"
 ita_dnc.1581.d: "The Porte answers that Italian enterprise in Tripoli is welcome and that the consul will be heard. It answers nothing about the garrison, which is left where it is.\n\nThe door is open a hand's breadth. It can be pushed, or walked through slowly."
 ita_dnc.1581.a: "Walk through slowly."
 ita_dnc.1582.t: "The Porte Reinforces Tripoli"
 ita_dnc.1582.d: "The Porte answers the note with two battalions from Smyrna and a governor known for his opinions of Italians. The bank's manager is asked to produce his papers weekly.\n\nThe note was a question. The answer is no."
 ita_dnc.1582.a: "Then the note becomes an ultimatum."
 ita_dnc.1582.b: "Withdraw the note."
 ita_dnc.1583.t: "Rome Asks About Tripoli"
 ita_dnc.1583.d: "The Italian ambassador asks, without a note, whether an Italian establishment in Tripoli would be regarded as a matter of concern. He does not say establishment of what.\n\nWe can acquiesce and have Rome in our debt, or object and have Rome remember it."
 ita_dnc.1583.a: "Acquiesce."
 ita_dnc.1583.b: "Object."
 ita_dnc.1585.t: "The Italian Ultimatum"
 ita_dnc.1585.d: "Rome gives the Porte a day and a night to consent to the occupation of Tripolitania and Cyrenaica. The note offers guarantees for the Sultan's religious authority and nothing for his sovereignty.\n\nThe garrison is small and the sea is theirs. The vilayet is ours. The question is what the empire can afford to lose this year."
 ita_dnc.1585.a: "Cede the vilayet."
 ita_dnc.1585.b: "Refuse. Let them come and take it."
 ita_dnc.1586.t: "The Porte Yields Tripoli"
 ita_dnc.1586.d: "The Porte's answer arrives before the hour is out and it is not the one the fleet was waiting for. The vilayet is ceded, subject to the Sultan's religious authority, which the note is careful to keep.\n\nThe fourth shore is ours without a landing. The army of Africa has been promised one."
 ita_dnc.1586.a: "A province, and no war."
 ita_dnc.1587.t: "Italy and the Porte"
 ita_dnc.1587.d: "Rome has sent the Porte an ultimatum over Tripoli and the Porte has refused it. The Italian fleet is at sea. Whatever else it does, it will pass Rhodes.\n\nThe islands are Greek in everything but the flag."
 ita_dnc.1587.a: "Watch Rhodes."
 ita_dnc.1587.b: "Stay quiet."
 ita_dnc.1588.t: "Rome Goes to War Without Asking"
 ita_dnc.1588.d: "Rome has sent the Porte an ultimatum over Tripoli. We were told after the note was handed over, in the form of a copy.\n\nAn ally who consults us afterwards is telling us something."
 ita_dnc.1588.a: "Protest the manner of it."
 ita_dnc.1588.b: "Note it."
 ita_dnc.1590.t: "Terms at Ouchy"
 ita_dnc.1590.d: "The Italian plenipotentiaries offer peace at Ouchy. The vilayet passes to Rome. The Sultan keeps his religious authority there and a pension for the officials. The islands, they say, will be returned when the last Ottoman officer has left Africa.\n\nThe war is lost on the coast and not lost in the interior. The empire has other frontiers."
 ita_dnc.1590.a: "Sign."
 ita_dnc.1590.b: "Fight on."
 ita_dnc.1591.t: "The Porte Signs at Ouchy"
 ita_dnc.1591.d: "The treaty is signed at Ouchy in the afternoon. The vilayet is ours. The Sultan keeps his name in the Friday prayers and we keep the coast, which is what we came for.\n\nThe interior has not been asked."
 ita_dnc.1591.a: "The coast is ours. The interior can wait."
 ita_dnc.1592.t: "The Porte Will Not Sign"
 ita_dnc.1592.d: "The Ottoman plenipotentiaries leave Ouchy without signing. The Porte will fight on in the interior, where the Senussi fight for it, and let us hold a coast that costs a division a month.\n\nWe can take the interior, or make the terms worth signing."
 ita_dnc.1592.a: "Then we take the interior."
 ita_dnc.1592.b: "Sweeten the terms."
 ita_dnc.1595.t: "Rhodes Under the Tricolour"
 ita_dnc.1595.d: "The Italians have landed on Rhodes and the smaller islands, almost unopposed. The notables came out to meet the boats. They are Greeks and they are cheering.\n\nRome calls it a pledge, held until the Porte signs. Pledges have a way of staying held."
 ita_dnc.1595.a: "Protest the occupation."
 ita_dnc.1595.b: "Ask that they never go back to the Porte."
 ita_dnc.1596.t: "Athens Claims the Islands"
 ita_dnc.1596.d: "The Greek protest is polite and is accompanied by a map on which the islands are already coloured blue. Athens does not ask us to leave. It asks us to remember whose they are.\n\nThe pledge now has two claimants and one holder."
 ita_dnc.1596.a: "Held is held."
 ITA_w_threat_vienna_answers: "Vienna answers the notice"
 ITA_w_tt_a_power_consents: "§GA power consents to our enterprise in Tripoli.§!"
 ITA_w_tt_a_power_objects: "§RA power objects to our enterprise in Tripoli.§!"
 ITA_w_tt_the_porte_answers: "§YThe Porte will answer the terms within the week.§!"
 ITA_w_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_tt_choose_who_governs_after_the_crisis: "Choose who governs in the name of the Statuto: the ministry, the Crown, the Bloc, the Nation or the Church."
 ITA_ch_threat_the_frontier_is_manned: "The Alpine Frontier Is Manned"
 ITA_ch_threat_the_insurrection: "The Insurrection in the Romagna"
 ITA_r_garibaldian_legion_tt: "The Garibaldian Legion takes the field: five thousand men, the experience of a volunteer corps, and one division raised on our own soil."
 ita_dnc.2100.t: "Regicide at Monza"
 ita_dnc.2100.d: "The Prince of Naples has never been trusted with anything and is King of Italy tonight. The ministry must say what the kingdom does before the funeral train leaves."
 ita_dnc.2100.a: "A state of siege in the red cities, and the subscription lists seized."
 ita_dnc.2100.b: "Saracco, and the amnesty of the new reign."
 ita_dnc.2100.c: "The Estrema will not walk behind the coffin. Let it be seen."
 ita_dnc.2100.e: "The nation goes into mourning, and the mourning will be ours to lead."
 ita_dnc.2101.t: "The Oath at the Quirinale"
 ita_dnc.2101.d: "The King came up on a night train and swore before the two Chambers to observe the Statuto loyally. There are two Statutos in that room: the text, in which ministers answer to the Crown, and the practice grown over it, in which no ministry survives a hostile vote.\n\nHis father died believing the first. The men in front of him have built their careers on the second, and they are watching his face to see which one he has just sworn to."
 ita_dnc.2101.a: "As it is written."
 ita_dnc.2101.b: "As it has been practised."
 ita_dnc.2102.t: "The New Reign Is Asked"
 ita_dnc.2102.d: "The decrees of public safety lapsed with the old reign and the Interior has laid them again on the desk of a King who has been on the throne for a fortnight. The Cassation has already said what it thinks of them.\n\nThe Court wants to know whether the new King signs what his father signed. The Chamber wants to know the same thing, for the opposite reason."
 ita_dnc.2102.a: "The King signs, and the prefects have their powers back."
 ita_dnc.2102.b: "The King will not begin his reign under a decree."
 ita_dnc.2104.t: "Genoa Shuts Its Port"
 ita_dnc.2104.d: "The prefect has dissolved the chamber of labour by decree, on the ground that it took dues from dock workers who were not its members. Within a day the port is shut, the tram men are out and the Ligurian committee has voted a general strike in a city that handles a third of the kingdom's trade.\n\nThe ministry has no answer prepared and the Chamber reconvenes within six weeks. The question will be on the order paper whether we put it there or not."
 ita_dnc.2104.a: "Restore the chamber of labour and recall the prefect."
 ita_dnc.2104.b: "The prefect is sustained. He applied the law as it stands."
 ita_dnc.2104.c: "Let the ministry fall on it rather than answer for it."
 ita_dnc.2105.t: "The Last Question"
 ita_dnc.2105.d: "The decade is closing and nothing has been settled by us. The men who could settle it are still in the room, and they will not sit there for ever.\n\nWe are asked, once, what this ministry was for. The answer will be read out at the end and there will be no second reading."
 ita_dnc.2105.a: "The system worked. Say so, and let the arithmetic stand."
 ita_dnc.2105.b: "The Crown governed. Let it be written that it governed."
 ita_dnc.2105.c: "The Bloc was in the State. That is the whole of it."
 ita_dnc.2105.e: "The nation was armed and the nation was asked. That is enough."
 ita_dnc.2105.f: "The altar and the throne stood together. Let the country see it."
 ita_dnc.2105.g: "Nobody decided anything, and the ledger will say so."
 ita_dnc.2105.h: "The arithmetic will not stand. Let the ministry go and the next one answer for it."
 ita_dnc.2105.i: "The Crown will not put its name to this. Let the ministry answer alone."
 ita_dnc.2105.j: "The Bloc will not sign a verdict upon itself. Let the question be adjourned."
 ita_dnc.2105.k: "The nation was never asked, and we will not pretend that it was."
 ita_dnc.2105.l: "The altar is not entered in a ledger. Let the question wait for better men."
 ITA_end_the_caretakers: "The Caretakers"
 ITA_end_the_caretakers_long: "The Caretaker Ministry"
 ITA_end_tt_the_verdict_is_refused: "The verdict is refused. A caretaker ministry takes the chair and the question is left to the men who come after us."
 ita_dnc.2108.t: "Six Hundred Thousand a Year"
 ita_dnc.2108.d: "Naples, Palermo, Genoa. They are men of military age, they are the ones who could have gone either to America or to a barricade, and the money they post home closes the trade deficit of a great power.\n\nThe Commissariat can protect them on the voyage and count them as they go, or the prefects can refuse a passport to any man of the conscription class and keep the villages full."
 ita_dnc.2108.a: "Protect them. We will not stop them."
 ita_dnc.2108.b: "Let them go, and let the remittances answer for it."
 ita_dnc.2112.t: "The Chambers of Labour Vote to Come Out"
 ita_dnc.2112.d: "It began over a shooting and it is now in Milan, Genoa, Turin and the capital at once, without a central committee, without a demand and without a fund. The trams have stopped, the port has stopped and the newspapers are not being printed.\n\nNobody in this ministry has seen a general strike before, because until this week no European country had one."
 ita_dnc.2112.a: "Send the prefect to sit at the table with them."
 ita_dnc.2112.b: "The garrison will clear the squares by this evening."
 ita_dnc.2112.c: "It has no demands. It will exhaust itself."
 ita_dnc.2116.t: "The Elections of the Strike"
 ita_dnc.2116.d: "The Chamber goes home and the country is asked instead, with the strike still in every memory and the clergy released from the ban in a few dioceses. In half the southern constituencies the poll is a formality arranged in the prefecture."
 ita_dnc.2116.a: "Work the prefectures. A candidate who wants the seat comes to the Interior first."
 ita_dnc.2116.b: "Fight it on what the ministry has actually built."
 ita_dnc.2116.c: "The government will not touch this election."
 ita_dnc.2120.t: "The Veto at the Conclave"
 ita_dnc.2120.d: "The Pope is dead and the cardinals are shut in. Our ambassador reports that the Secretary of State, who has spent his career leaning on Paris and has never hidden what he thinks of the monarchy, will be elected on the next scrutiny unless the Emperor uses the right of exclusion that his house has held since anyone can remember.\n\nThe Cardinal of Cracow is willing to carry the word into the conclave. It has never been used in living memory, and using it will be known within the day."
 ita_dnc.2120.a: "Use the right of exclusion. The crown has held it for centuries."
 ita_dnc.2120.b: "The Emperor will not put his hand into a conclave."
 ita_dnc.2121.t: "A Pope Who Was a Parish Priest"
 ita_dnc.2121.d: "The conclave has been through a veto to reach the patriarch of Venice, the son of a village postman. He has spent his life in parishes, and in several of those parishes the socialists took the council while the faithful stayed home under the ban as instructed.\n\nHe has said nothing about the ban and has not repeated it either, which in these matters is a sentence rather than a silence."
 ita_dnc.2121.a: "Sound the Vatican quietly, through the men who can be sounded."
 ita_dnc.2121.b: "Say nothing, and let the bishops move first."
 ita_dnc.2122.t: "The Cardinal Secretary Is Elected"
 ita_dnc.2122.d: "No crown was raised against him and the Secretary of State is Pope. He knows every chancellery in Europe, he has never conceded a syllable on the guarantees, and he owes his election to the fact that nobody stopped it.\n\nThe ban on Catholic voting stays exactly where it was, and it will be enforced by a man who wrote most of it."
 ita_dnc.2122.a: "Then the ban stays where it is, and we govern without those votes."
 ita_dnc.2122.b: "Ask, through the usual channel, what the new pontificate will cost us."
 ita_dnc.2124.t: "The Line Is Stopped"
 ita_dnc.2124.d: "The private companies have let the permanent way rot and the enginemen have answered with a stoppage that has cut the peninsula in half. The Chamber has been shown the accounts and does not believe them.\n\nWe can take the lines into the hands of the State and put the men under a discipline, or we can pay the companies again and hear the same thing in a year."
 ita_dnc.2124.a: "Buy the lines, and let the State run them under military discipline."
 ita_dnc.2124.b: "Concede, and let the companies keep what is theirs."
 ita_dnc.2128.t: "The Old Man of Brescia"
 ita_dnc.2128.d: "The President of the Council is dying in office and will not resign, and the Interior has governed in his name for a year. The party of the ministry is already counting.\n\nThe succession is between the man who made this Chamber and a lawyer of the Romagna who will keep the seat warm and nothing else."
 ita_dnc.2128.a: "The Interior takes the Presidency of the Council."
 ita_dnc.2128.b: "A caretaker, then, and the Chamber keeps its distance."
 ita_dnc.2130.t: "The Provinces Are Annexed"
 ita_dnc.2130.d: "Vienna has annexed the two provinces it has occupied since the Congress, without a conference and without asking anyone. The seventh article of our treaty says that no change in the Balkans is made without compensation to the other party.\n\nThe piazza has read the article in the newspapers and is in the street with it. We may invoke it, sell it, or look elsewhere for a friend who reads treaties the same way we do."
 ita_dnc.2130.a: "Invoke the article. The compensation is owed and we shall name it."
 ita_dnc.2130.b: "Take the abrogation of the twenty-ninth article and call it settled."
 ita_dnc.2130.c: "Then we look east, to the only court with the same grievance."
 ita_dnc.2133.t: "Buggerru"
 ita_dnc.2133.d: "The Sardinian pits struck over the hour they are made to lose at the coal face, and the company wrote to the prefect asking for troops. The troops came, and the troops fired.\n\nThe telegraph out of the island is slow. By the time the chambers of labour have the story it will have been improved in the telling, and it will be true enough."
 ita_dnc.2133.a: "Court-martial the lieutenant and move the regiment off the island."
 ita_dnc.2133.b: "The troops were stoned first. The file is closed and the officer confirmed."
 ita_dnc.2134.t: "The First General Strike"
 ita_dnc.2134.d: "Milan struck first and Genoa followed the same evening, then Turin, then the capital. There is no train moving north of Florence and no newspaper printing but the socialist ones, and nobody ordered any of it.\n\nNo European state has seen this before. There is no article of the code that fits it and no precedent to send to the prefects."
 ita_dnc.2134.a: "Let it exhaust itself, then dissolve the Chamber."
 ita_dnc.2134.b: "The garrisons out. Every station and every tram shed under guard by morning."
 ita_dnc.2134.c: "Concede the eight-hour day in the mines and be done with it."
 ita_dnc.2136.t: "Tangier"
 ita_dnc.2136.d: "The Emperor landed on the Moroccan coast and spoke of the independence of the Sultan, and a conference has been called to settle what he meant. Our ally asks for our vote and our friend across the Alps asks for our silence, which is the same thing said politely.\n\nWe have promised the second party in writing that we will not cross it in North Africa. The first party has never been told."
 ita_dnc.2136.a: "Our vote goes with the ally. The treaty is a treaty."
 ita_dnc.2136.b: "Our vote goes the other way, and the note we signed is honoured."
 ita_dnc.2136.c: "We will say nothing at all, and let the conference read it as it likes."
 ita_dnc.2137.t: "Conrad Asks for the War"
 ita_dnc.2137.d: "Our attache reports that the Chief of the General Staff has asked his Emperor, for the fourth time, for a preventive war against the Kingdom, and that this time the Foreign Ministry did not object at once. The Tyrol garrisons are being brought up to strength for manoeuvres that were not on the calendar.\n\nWe can man the frontier and let it be seen, or leave the answer to the old man in the Hofburg."
 ita_dnc.2137.a: "Man the frontier, and let them read it in the returns."
 ita_dnc.2137.b: "Say nothing. The Emperor has refused him three times already."
 ita_dnc.2138.t: "The Insurrection"
 ita_dnc.2138.d: "The Romagna has been out of the government's hands for three months and the rest of the country has stopped pretending otherwise. The reservists called up in the Marche did not report and a garrison commander has asked to be relieved rather than fire.\n\nWhat is being read from the balconies is no longer a list of grievances but a constitution. The kingdom is past the point where a ministry decides anything."
 ita_dnc.2138.a: "Then it is a war, and we shall fight it."
 ita_dnc.2139.t: "The Hour Strikes"
 ita_dnc.2139.d: "The Empire is at war on another frontier and every square in the north is full of men shouting the names of two cities that are not ours. The interventionist committees have stopped asking the ministry and started announcing what the ministry will do.\n\nThe army says it needs a season. The street says it needs an hour."
 ita_dnc.2139.a: "Now, while the other frontier holds them."
 ita_dnc.2139.b: "Not yet. Let them shout, and let the depots fill."
 ita_dnc.2140.t: "The Congress at Bologna"
 ita_dnc.2140.d: "The party has been called together to decide whether a socialist may sit in a bourgeois ministry, and the hall is not in a mood to be reasoned with. The reformists point at the labour office and the factory inspectors; the intransigents point at the prefects, who have not gone anywhere.\n\nWhat this congress votes decides who we shall be negotiating with for the rest of the decade."
 ita_dnc.2140.a: "The revolutionaries carry the hall."
 ita_dnc.2140.b: "The reformists hold, and the resolution is buried in committee."
 ita_dnc.2141.t: "The Ministry Falls"
 ita_dnc.2141.d: "The majority that voted the estimates in the spring did not divide with the government tonight, and the men who arranged it are already in the corridor arranging the next one. Nothing was defeated on principle."
 ita_dnc.2141.a: "Send for the same man. He will make another majority."
 ita_dnc.2141.b: "Send for someone the Chamber has not yet used up."
 ita_dnc.2141.c: "Ask the King to prorogue the House until it is calmer."
 ita_dnc.2142.t: "The Fleet Is Asked to Choose"
 ita_dnc.2142.d: "The war is going against us on land and the fleet has spent it at anchor with steam up. The admiralty says that a fleet in being is worth more than a fleet at the bottom, and the country says that it paid for battleships and would like to see one.\n\nThe order can be given tonight and cannot be taken back."
 ita_dnc.2142.a: "The fleet goes out."
 ita_dnc.2142.b: "The fleet stays where it is, and the country may say what it likes."
 ita_dnc.2143.t: "The King's Veto"
 ita_dnc.2143.d: "The King has read the decrees the ministry sent up and has sent them back unsigned, with a note in his own hand about the prerogative of the Crown. The Court has been briefing the newspapers of the right for a fortnight.\n\nEither the ministry goes, or the King learns what a ministry is."
 ita_dnc.2143.a: "The King dismisses us and sends for a man of his own."
 ita_dnc.2143.b: "The King gives way, and the note is never mentioned again."
 ita_dnc.2144.t: "Crete Rises"
 ita_dnc.2144.d: "The island has risen again and the assembly has voted union with the Kingdom for the third time in a decade. The Powers hold the harbours with a handful of ships and the Porte holds nothing at all.\n\nWe can lay the question before the Powers now, while the Kingdom that would swallow the island is still weak, or wait until it is not."
 ita_dnc.2144.a: "Lay it before the Powers, and see who answers."
 ita_dnc.2144.b: "We will wait. The island is not going anywhere."
 ita_dnc.2145.t: "The Cretan Question"
 ita_dnc.2145.d: "Athens has asked the Powers to hear the island's vote and our name is on the list of protectors, which costs us a squadron and a policy. The Porte has asked us privately to remember whose islands they are.\n\nWe may speak for the Hellenes and be thanked in the Aegean, or hold to the Porte and be thanked in Africa."
 ita_dnc.2145.a: "Speak for the island, and let the Porte hear it from us first."
 ita_dnc.2145.b: "Decline. The Powers will settle it without our voice."
 ita_dnc.2146.t: "The Officers' Address"
 ita_dnc.2146.d: "Thirty general officers have signed an address to the King asking that the army be given a free hand in the disturbed provinces and that the ministry be told so. It was not sent through the War Office and the newspapers of the right had it before the King did.\n\nEither the Crown reads it out and the state of siege follows, or the Crown calls its own generals to order in public."
 ita_dnc.2146.a: "The address is granted. The provinces go under the army."
 ita_dnc.2146.b: "The King calls them to order, and the address is returned unread."
 ita_dnc.2147.t: "Terms"
 ita_dnc.2147.d: "The front has stopped moving and the staffs on both sides know it before the newspapers do. There is a moment, which will not be long, when what is held on the map can be turned into what is written in a treaty.\n\nWe can send the terms across the lines tonight, or wait for a spring campaign that neither army has the depots for."
 ita_dnc.2147.a: "Send the terms across, and let them answer them."
 ita_dnc.2147.b: "We fight on. The line will move again."
 ita_dnc.2148.t: "Il Fermo Proposito"
 ita_dnc.2148.d: "The encyclical does not lift the ban and does not repeat it. It tells Catholics to act in the Christian life of the nation, and it leaves the bishops to say what that means in each diocese.\n\nIn three hundred constituencies the parish clergy have already worked out what it means. Nothing is signed and nothing is denied."
 ita_dnc.2148.a: "Take what is offered. The lists will circulate where they are useful."
 ita_dnc.2148.b: "The encyclical says nothing about the ballot, and neither shall we."
 ita_dnc.2149.t: "The Ledger of the Decade"
 ita_dnc.2149.d: "The decade is out and the clerks have added it up: what was promised, what was bought, what was shot at and what was signed. The country will read the total whether we publish it or not.\n\nWhat we did with the Statuto is now a matter of record."
 ita_dnc.2149.a: "Let it be read out."
 ita_dnc.2152.t: "Calabria Shakes"
 ita_dnc.2152.d: "The province has gone down in the night: the villages of the Aspromonte are rubble, the roads are cut and the prefect is asking for engineers, tents and bread in that order. The emigration agents were at the quays before the relief columns were on the road.\n\nWe can send the army and be done in a season, or write a law for the whole of the South and pay for it out of a budget we do not have."
 ita_dnc.2152.a: "The army goes in. Tents, bread and the road reopened."
 ita_dnc.2152.b: "A law for Calabria, and the money found somewhere."
 ita_dnc.2156.t: "The Party Congress Answers"
 ita_dnc.2156.d: "The socialist deputies have a minister among them and the congress has been called to decide whether he is still one of theirs. The reformists point at the accident insurance and the inspectors who now actually enter the sheds.\n\nThe intransigents point at the prefects and at the fact that the ministry's majority is made of men elected by promising to fight it."
 ita_dnc.2156.a: "The portfolio is kept."
 ita_dnc.2156.b: "The party orders him out of the ministry."
 ita_dnc.2160.t: "The Rente"
 ita_dnc.2160.d: "The conversion of the debt has been carried through by the great houses without waiting for us, at a rate we could not have refused and did not obtain. The saving is real and it is not ours to claim.\n\nThe Treasury will have half of what it counted on, and the Chamber will be told the good news anyway."
 ita_dnc.2160.a: "Take the half, and say nothing about the other."
 ita_dnc.2164.t: "The Lockout in the Bassa"
 ita_dnc.2164.d: "Fifty thousand day labourers are out across the province and the agrarian association has answered with a lockout, a private guard and a subscription list. The children have been sent north to socialist families in convoys, with bands playing, which the newspapers of the right are calling abduction.\n\nThe prefect wants cavalry. Both sides have stated in writing that they will accept arbitration, on condition that it goes their way."
 ita_dnc.2164.a: "Cavalry to the prefect. The chamber of labour is closed."
 ita_dnc.2164.b: "Both parties before a board, a minister presiding, the award binding."
 ita_dnc.2168.t: "The Capitol"
 ita_dnc.2168.d: "The bloc of the lodges, the radicals and the socialists has taken the capital at the municipal poll, and the new mayor is a Jew, a freemason and the son of exiles, which the clerical press has managed to mention in every paragraph. He has announced a school in every quarter and a rate on church property.\n\nThe prefect can find an irregularity in the returns within a week, if he is told to look."
 ita_dnc.2168.a: "Let the city have its council. It was elected."
 ita_dnc.2168.b: "The prefect will find the irregularity, and the poll will be held again."
 ita_dnc.2169.t: "The Twentieth of September"
 ita_dnc.2169.d: "The anniversary of the breach falls in a fortnight and the new council intends to keep it as it has not been kept in a generation: the whole municipality at the gate, with banners, and speeches about the temporal power.\n\nA minister is expected on the platform. Whoever stands there will be quoted across the Tiber within the hour."
 ita_dnc.2169.a: "The government will be on the platform, as the country expects."
 ita_dnc.2169.b: "No minister goes to the gate this year, and the Bloc may draw its own conclusions."
 ita_dnc.2172.t: "The Nationalist Groups Meet"
 ita_dnc.2172.d: "The groups have met in congress and found a phrase that is doing more work than any of them expected: that we are a proletarian nation among plutocratic ones, and that emigration is the tribute we pay for it. The lecture tours are full and the subscriptions are growing.\n\nWe can take the programme and leave them the name, or let them keep both and see who is shouting in the squares in five years."
 ita_dnc.2172.a: "Take the programme. The African shore is promised, in our own time."
 ita_dnc.2172.b: "Let them talk. Words have never taken a province."
 ita_dnc.2176.t: "The Officers of Salonika"
 ita_dnc.2176.d: "The Third Army has declared for the constitution and the committee at Salonika is telegraphing the palace hourly. The garrisons of Macedonia have gone over almost to a man and the troops sent against them have joined them.\n\nThe Sultan can restore the charter he suspended a generation ago and keep a throne, or he can send for the Albanian regiments and find out whether they come."
 ita_dnc.2176.a: "The constitution is restored, and the Chamber is recalled."
 ita_dnc.2176.b: "The regiments will be broken up and the officers arrested."
 ita_dnc.2177.t: "The Constitution at Salonika"
 ita_dnc.2177.d: "The Porte has a parliament again and a party of young officers behind it who talk about the integrity of the empire in a way the old palace never did. Our consulates report that the new men intend to count the foreign concessions and the foreign schools.\n\nA telegram of congratulation costs us nothing and would be remembered. So would its absence."
 ita_dnc.2177.a: "Congratulate them, and let the schools be counted in a friendly spirit."
 ita_dnc.2177.b: "Say nothing. A weak empire suited us better than a young one."
 ita_dnc.2180.t: "The Ferrer Week"
 ita_dnc.2180.d: "A schoolmaster has been shot in a ditch in Catalonia after a court martial that convinced nobody, and the news has put more people into our squares than any strike of the decade. The demonstrations are anticlerical, they are enormous, and they are not being called by anyone we can send for.\n\nThe prefects ask whether the processions are to be allowed."
 ita_dnc.2180.a: "Let them march. It is not our schoolmaster and not our court."
 ita_dnc.2180.b: "Forbid the processions. We do not riot over another kingdom's courts."
 ita_dnc.2184.t: "The Straits at Twenty Past Five"
 ita_dnc.2184.d: "Thirty-odd seconds, and then the sea drew back and came in three times over what was left. The two cities on the straits are gone; there is no telegraph, no prefect, no garrison and no water, and the survivors are being dug out by hand under rain.\n\nThe first organised parties ashore were foreign sailors from a squadron that happened to be in the roads, and our own ships after them. What we do in the next week will be printed in every capital in Europe."
 ita_dnc.2184.a: "The Regia Marina takes charge of the whole relief."
 ita_dnc.2184.b: "Accept every squadron that offers, and say so publicly."
 ita_dnc.2184.c: "Rebuild to a seismic code, and prosecute those who ignore it."
 ita_dnc.2185.t: "Messina"
 ita_dnc.2185.d: "The straits have gone down in half a minute and the first count of the dead is past anything in living memory. There is no authority ashore, and the ships already in the roads have been landing parties since dawn on their captains' own responsibility.\n\nThe Kingdom has asked for nothing and will not ask. What we send will be remembered for a generation, and so will what we do not send."
 ita_dnc.2185.a: "The squadron is already under way. Let it stay as long as it is needed."
 ita_dnc.2185.b: "The squadron, and a credit voted by the Congress on top of it."
 ita_dnc.2185.c: "The relief societies will answer for us. The fleet has its own stations."
 ita_dnc.2185.e: "Condolences, and a subscription opened by the newspapers."
 ita_dnc.2188.t: "The Elections of Nineteen Nine"
 ita_dnc.2188.d: "The country votes again, with the socialists stronger in the North whatever is done and the ministry looking for its numbers where it has always looked for them. In the Veneto and the Marche that means the parish clergy, who now have an understanding with the government that neither side will put on paper."
 ita_dnc.2188.a: "The prefects will make the returns, as they always have."
 ita_dnc.2188.b: "The sacristy will deliver what the prefecture cannot."
 ita_dnc.2188.c: "The government will not touch this election."
 ita_dnc.2192.t: "The Emperor Has Had a Stroke"
 ita_dnc.2192.d: "The Emperor cannot speak and cannot sign, and the palace has stopped pretending that he will recover. There is a grandson of thirteen, a mother who is not a queen, and a council of rases who each command more men than the throne does.\n\nThe legations are all asking the same question and offering the same friendship. Whoever answers first will be answered."
 ita_dnc.2192.a: "The grandson is designated, and the rases may say what they like."
 ita_dnc.2192.b: "A council of regency, and a quiet word to the legation on the hill."
 ita_dnc.2196.t: "Racconigi Is Offered"
 ita_dnc.2196.d: "The Tsar will pass through on his way home and has let it be known that he would receive us at the castle, without ministers if we prefer, to talk about the Straits and the eastern shore of the Adriatic. Our ally is not to be told and will be told anyway.\n\nAn hour on a terrace is worth a year of notes, and it will be read in Vienna as exactly what it is."
 ita_dnc.2196.a: "Accept the meeting. Let them read it as they please."
 ita_dnc.2196.b: "Decline politely. We have one treaty and it is enough."
 ita_dnc.1956.t: "Rome's Vote at Algeciras"
 ita_dnc.1956.d: "Our ally has voted with Paris on the police and on the bank, and the conference is lost. The Chancellor told the Reichstag that a waltz may be danced with more than one partner, and the Wilhelmstrasse would like to know how many partners are left. We can pass it off, ask Vienna to demand the account, or say plainly what an alliance is for."
 ita_dnc.1956.a: "One turn of the waltz more."
 ita_dnc.1956.b: "Let Vienna ask for the account."
 ita_dnc.1956.c: "Warn them that the alliance runs both ways."
 ita_dnc.1957.t: "The Delegate Reports"
 ita_dnc.1957.d: "Our delegate has voted, the bank is settled, and the ministry has an understanding it did not have last spring. The Chamber approves of a foreign policy that costs nothing and offends nobody it can see."
 ita_dnc.1957.a: "The vote is cast."
 ita_dnc.1958.t: "Paris Thanks Rome"
 ita_dnc.1958.d: "The Italian vote carried the police and the bank against Berlin, and it was not bought. Our ambassador at the Quirinal writes that the ministry there would like the gratitude in a form that can be quoted."
 ita_dnc.1958.a: "Thank them, where it will be read."
 ita_dnc.1958.b: "Note it, and say nothing."
 ita_dnc.1959.t: "Berlin Asks Vienna to Ask"
 ita_dnc.1959.d: "Berlin would like us to ask our southern ally what her vote at the conference was worth to the alliance. It is a fair question and an ungrateful one to put, and the answer will be in the newspapers within the week. We can put it ourselves, or leave Berlin to put it."
 ita_dnc.1959.a: "Ask for the account."
 ita_dnc.1959.b: "Decline to ask."
 ita_dnc.1972.t: "Rome Invokes Article Seven"
 ita_dnc.1972.d: "Rome reads the seventh article aloud and asks what we will give for the provinces we have taken. We have already agreed to leave the sandjak, which costs us a garrison and nothing else. The Italian faculty at Trieste would cost us the Slovene deputies, and a flat refusal would cost us the ally."
 ita_dnc.1972.a: "The sandjak, and nothing more."
 ita_dnc.1972.b: "The sandjak, and the faculty at Trieste."
 ita_dnc.1972.c: "Refuse. Bosnia is not the Balkans."
 ita_dnc.1973.t: "The Compensation Is Read to the Chamber"
 ita_dnc.1973.d: "The minister reads the exchange of notes to a Chamber that has already read it in the newspapers. What we were given is small and what we asked for was smaller, and the deputies have decided to be satisfied."
 ita_dnc.1973.a: "The Chamber is satisfied."
 ita_dnc.1974.t: "Petersburg Reads Rome's Disappointment"
 ita_dnc.1974.d: "Rome asked Vienna for a compensation and came away with a garrison town and a promise about a faculty. An ally humiliated like that is an ally worth talking to, and our own quarrel over the straits is the same quarrel. We could offer a meeting at the royal shooting box, or wait until Rome is angrier."
 ita_dnc.1974.a: "Offer the meeting."
 ita_dnc.1974.b: "Wait. They will be angrier."
 ita_dnc.1975.t: "Bülow Is Asked to Weigh In"
 ita_dnc.1975.d: "Rome has refused the compensation offered and is asking us to press our other ally for a better one. The alliance has no article that obliges us to arbitrate between the two of them. Pressing Vienna keeps Rome in the treaty; declining tells Rome what the treaty is worth."
 ita_dnc.1975.a: "Press Vienna to reopen it."
 ita_dnc.1975.b: "The alliance has no article for this."
 ita_dnc.1984.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1984.d: "The Italian ambassador asks, as though in passing, whether we would object to an Italian administration on the shore east of our own. There is an exchange of notes which says that we would not, in return for a free hand where we already stand. Saying it again costs nothing and buys a neighbour who will not raise Tunis a third time."
 ita_dnc.1984.a: "We consent, and Tunis is closed for good."
 ita_dnc.1984.b: "We object."
 ita_dnc.1985.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1985.d: "Rome asks whether the Mediterranean agreements still mean what they meant when they were written. We would rather have that shore Italian than left to a Porte which cannot hold it, and far rather Italian than French. The islands off the Anatolian coast are another matter, and it should be said now."
 ita_dnc.1985.a: "We consent."
 ita_dnc.1985.b: "We consent, and no islands."
 ita_dnc.1985.c: "We object."
 ita_dnc.1986.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1986.d: "Our ally asks whether the promises made when the alliance was young still hold on the African shore. The Porte is our friend and our debtor and will read the answer in her own newspapers. An ally refused this will go and ask the same question elsewhere."
 ita_dnc.1986.a: "We consent."
 ita_dnc.1986.b: "We object."
 ita_dnc.1987.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1987.d: "Rome asks whether the seventh article covers an African adventure as well as a Balkan one. An Italy busy on the far shore is an Italy not counting our Italian schools. An Italy that wins there comes home with an army and an appetite."
 ita_dnc.1987.a: "We consent."
 ita_dnc.1987.b: "We object."
 ita_dnc.1988.t: "Rome Asks Whether Tripoli Is Free"
 ita_dnc.1988.d: "Rome asks for our word on the African shore and offers nothing new in exchange. If the meeting at the shooting box was worth anything, it was worth this. The Porte will thank us either way, and the straits are the only thing we want from her."
 ita_dnc.1988.a: "We consent."
 ita_dnc.1988.b: "We object."
 ita_dnc.1989.t: "The Powers Are Asked About Tripoli"
 ita_dnc.1989.d: "Italian ambassadors have been round every chancellery in Europe asking whether our own province is free. Our governor reports a garrison under strength and wells nobody watches. We can put battalions and a road into the province now, or wait and hear what the powers answer."
 ita_dnc.1989.a: "Reinforce the province."
 ita_dnc.1989.b: "Wait."
 ITA_g_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_g_tt_the_antivari_subsidy: "§YThe Antivari Subsidy is opened among the decisions of the Consulta.§!"
 ITA_g_tt_the_amnesty_of_the_romagna: "§YThe Amnesty of the Romagna is opened among the decisions of the Piazza.§!"
 ITA_g_tt_the_tripartite_is_invoked: "§YThe Tripartite Is Invoked is opened among the decisions of the colonies.§!"
 ITA_g_tt_no_one_signs_the_agreement: "§RThere is no cabinet in London left to sign the agreement.§!"
 ITA_g_tt_the_zone_is_written: "§YOur zone in the Abyssinian hinterland is written into the agreement.§!"
 ITA_g_tt_the_register_of_five_million: "§YThe Register of Five Million takes the place of The Register Is Reprinted among the decisions of the Chamber.§!"
 ITA_g_tt_the_decade_is_reckoned: "§YThe decade is reckoned: the ministry answers for what it asked for and for what it was given.§!"
 ITA_g_tt_vienna_lets_the_line_run: "§GVienna lets the line to the lake be built.§!"
 ITA_g_tt_vienna_asks_nothing: "§YVienna asks us nothing about the vote.§!"
 ITA_g_tt_the_emperor_protests: "§RThe Emperor protests the partition of his hinterland.§!"
 ITA_g_tt_the_railway_is_reserved: "§YParis reserves the railway that climbs from the coast.§!"
 ITA_g_tt_no_hand_is_offered: "§YPetersburg keeps her own counsel and offers us nothing.§!"
 ITA_g_tt_the_prefects_have_nothing_to_report: "§RThe prefects report that the country will not be made this time.§!"
 ITA_g_tt_a_power_objects: "§RA power objects, and the consent of the powers is worth that much less.§!"
 ITA_g_tt_the_porte_waits: "§YThe Porte waits, and reinforces nothing.§!"
 ITA_g_threat_rome_at_antivari: "Rome at Antivari"
 ITA_g_threat_the_port_goes_to_vienna: "The port goes to Vienna"
 ITA_g_threat_the_alliance_is_not_one_sided: "The alliance is not one-sided"
 ITA_g_threat_the_zone_is_written: "The Zone Is Written"
 ITA_g_threat_the_seventh_article: "The seventh article is invoked"
 ITA_g_threat_the_bosnian_refusal: "Rome refuses the annexation"
 ITA_g_threat_the_powers_are_sounded: "The Powers Are Sounded"
 ITA_g_threat_the_landing_corps: "The landing corps is voted"
 ITA_g_threat_the_porte_reinforces: "The Porte reinforces the shore"
 ITA_g_stringher_at_the_bank: "Stringher at the Bank"
 ITA_g_stringher_at_the_bank_desc: "The director general of the Bank of Italy, who rebuilt a currency after the bank scandals and keeps the reserve where the Treasury cannot reach it. He will carry a conversion that no minister could carry alone."
 ITA_g_tittoni_at_the_consulta: "Tittoni at the Consulta"
 ITA_g_tittoni_at_the_consulta_desc: "A prefect turned foreign minister, patient with Vienna and thought soft by the press for it. He gets more out of an ally by asking twice than the nationalists get by shouting."
 ITA_g_meda_the_catholic_deputy: "Meda for the Catholic Deputies"
 ITA_g_meda_the_catholic_deputy_desc: "A Milanese editor and the first Catholic to sit openly for a Catholic electorate. He can deliver the parish committees, and he will ask for the schools in exchange."
 ITA_g_spingardi_at_the_war_office: "Spingardi at the War Office"
 ITA_g_spingardi_at_the_war_office_desc: "A gunner who spent his career on supply and knows what a landing corps costs before it sails. He will have the expedition ready sooner than the staff believes possible."
 ITA_g_unione_liberale: "Unione Liberale"
 ITA_g_unione_liberale_long: "Unione Liberale"
 ITA_g_destra_costituzionale: "Destra Costituzionale"
 ITA_g_destra_costituzionale_long: "Destra Costituzionale"
 ITA_s_tt_plan_west_is_unlocked: "Plan West becomes available among the war plans of the staff once Berlin has answered."
 ITA_s_tt_the_consul_at_tunis: "The Consul at Tunis becomes available among the decisions of the Consulta."
 ITA_s_tt_the_mobilisation_test: "The Alpine Mobilisation Test becomes available among the war plans of the staff."
 ITA_s_tt_the_alliance_is_a_faction: "If Berlin signs, the alliance becomes a faction and the Kingdom is in it."
 ITA_s_tt_the_senates_list: "The Senate's List becomes available among the decisions of the Crown."
 ITA_s_tt_the_military_tribunals: "The Military Tribunals become available among the decisions of the state of siege."
 ITA_s_tt_the_rhine_is_not_promised: "The staff will not put the third army on the Rhine, and the guarantee lapses with it."
 ITA_s_tt_the_claim_is_kept: "The claim on the Regency stands where it was laid."
 ITA_s_tt_no_ally_holds_the_alps: "There is no court left to hold the Alpine frontier for us, and the staff is told so."
 ITA_s_tt_no_partner_signs: "There is no partner left to sign a naval convention with, and the alliance stays a paper."
 ITA_s_tt_the_colony_stays_civil: "The colony keeps its civil governor, and a civil governor may be appointed as a political advisor."
 ITA_s_tt_the_ministry_resigns: "The ministry lays down its office, and the country is told why."
 ITA_s_tt_the_kings_minister_goes: "The King's minister leaves the cabinet and the Chamber names his successor."
 ITA_s_tt_the_other_court_waits: "The other court says nothing and keeps its garrisons where they are."
 ITA_s_tt_the_offer_is_declined: "The offer is declined, and we put down our own rising ourselves."
 ITA_s_threat_rome_looks_at_tunis: "Rome Looks at Tunis"
 ITA_s_threat_the_note_on_tunis: "The Note on Tunis"
 ITA_s_threat_the_malta_squadron: "The Squadron at Malta"
 ITA_s_threat_the_naval_convention: "The Naval Convention"
 ITA_s_threat_the_army_of_africa: "The Army of Africa"
 ITA_s_threat_the_war_of_tunis: "The War of Tunis"
 ITA_s_threat_the_insurrection: "The Insurrection"
 ITA_s_threat_the_tyrol_garrisons: "The Garrisons of the Tyrol"
 ITA_s_threat_royal_italy: "Royal Italy"
 ITA_s_threat_the_ministry_of_the_sword: "The Ministry of the Sword"
 ITA_s_triple_alliance: "Triple Alliance"
 ITA_s_ministero_del_re: "Ministero del Re"
 ITA_s_ministero_del_re_long: "The Ministry of the King"
 ITA_s_destra_costituzionale: "Destra Costituzionale"
 ITA_s_destra_costituzionale_long: "The Constitutional Right"
 ITA_s_governo_militare: "Governo Militare"
 ITA_s_governo_militare_long: "The Military Government"
 ITA_s_unione_liberale: "Unione Liberale"
 ITA_s_unione_liberale_long: "The Liberal Union"
 ita_dnc.1780.t: "The Chamber Is Recalled"
 ita_dnc.1780.d: "The Chamber is recalled for the estimates and for nothing else, and the deputies know it. The ministry does not ask them for a programme, only for the money to govern with.\n\nThey may vote the confidence, refuse it, or vote the budget and adjourn without saying anything at all."
 ita_dnc.1780.a: "Confidence."
 ita_dnc.1780.b: "No confidence."
 ita_dnc.1780.c: "Vote the budget and adjourn."
 ita_dnc.1781.t: "The Ministry Is Beaten"
 ita_dnc.1781.d: "The Chamber has refused the confidence and the ministry has not resigned. The Statuto says the ministers answer to the King, and the King has not asked for their resignation.\n\nHe may dissolve and try the country again, or keep his ministry and let the Senate vote the twelfths month by month."
 ita_dnc.1781.a: "Dissolve again."
 ita_dnc.1781.b: "Keep the ministry. The Senate votes the twelfths."
 ita_dnc.1785.t: "Berlin Backs the General"
 ita_dnc.1785.d: "Our ally is in civil war and its King is governing by decree behind a line of bayonets. The Chancellor observes that a monarchy that puts down its own reds is doing our work for us.\n\nThe staff would like the ally to survive. The Chancellor would like it to owe us for surviving."
 ita_dnc.1785.a: "Back the King and his ministry."
 ita_dnc.1785.b: "Say nothing."
 ita_dnc.1786.t: "The Republic of the North"
 ita_dnc.1786.d: "There is a rising across the mountains and the northern cities are out of their King's hands. The old exiles are already at the frontier asking for rifles and a road.\n\nWe may open the frontier and let the legion through, or close it and keep the affair on the other side of the passes."
 ita_dnc.1786.a: "Let the legion through."
 ita_dnc.1786.b: "Close the frontier."
 ita_dnc.1787.t: "Italy in Civil War"
 ita_dnc.1787.d: "Our southern neighbour is in civil war and its northern provinces are held by the leagues. The monarchy has always said that a throne in danger is every throne's business.\n\nWe may offer the help of the Holy Alliance, mass in the Tyrol for the sake of order, or watch and say nothing."
 ita_dnc.1787.a: "Offer the help of the Holy Alliance."
 ita_dnc.1787.b: "Mass in the Tyrol, for order."
 ita_dnc.1787.c: "Watch, and say nothing."
 ita_dnc.1797.t: "The Offer of the Holy Alliance"
 ita_dnc.1797.d: "The other court offers the help of the Holy Alliance against our own rising, in the old form and with the old words. Its army would be at our disposal and its price would be counted later.\n\nWe may accept and owe the debt, or refuse and put down the rising with the men we have."
 ita_dnc.1797.a: "Accept the help."
 ita_dnc.1797.b: "Refuse it. This is our house."
 ita_dnc.1857.t: "The Answer Does Not Come"
 ita_dnc.1857.d: "There is no chancery at the other end of the note, or none that will put its name to anything we have proposed. The file goes back into the cupboard with the rest of the correspondence.\n\nNothing has been agreed, and nothing has been refused."
 ita_dnc.1857.a: "File it."
 ita_dnc.1876.t: "The Republic Asks for Recognition"
 ita_dnc.1876.d: "The Italian Constituent has proclaimed a republic and its first note asks us to recognise it. A sister republic on the far side of the Alps is worth more to us than anything the kings ever signed there.\n\nWe can recognise it, guarantee it and bring it in beside us, or recognise it coldly and leave it standing alone."
 ita_dnc.1876.a: "Recognise, guarantee, and take them in with us."
 ita_dnc.1876.b: "Recognise, and nothing more."
 ita_dnc.1877.t: "The Republic Asks for Recognition"
 ita_dnc.1877.d: "The new Italian government asks for recognition and reminds us how many of its people are living in our cities. The consular reports say the country is quiet enough to be dealt with.\n\nWe can recognise the republic at once, as we have done before in such cases, or wait for the next despatch before saying anything."
 ita_dnc.1877.a: "Recognise the republic."
 ita_dnc.1877.b: "Wait for the next despatch."
 ita_dnc.1878.t: "The Republic Asks for Recognition"
 ita_dnc.1878.d: "The Italians ask for recognition while the House of Savoy still calls itself the lawful government from abroad. Trade and the fleet argue one way and the palace argues the other.\n\nWe can recognise the republic now that order is restored there, or refuse while a king with a claim is still asking us to dinner."
 ita_dnc.1878.a: "Recognise. Order is restored."
 ita_dnc.1878.b: "Refuse while the Savoy still claim."
 ita_dnc.1879.t: "The Republic Asks for Recognition"
 ita_dnc.1879.d: "The note asks the Emperor to receive a republic made by a chamber that sent its King away. It comes from a court we were allied to, and the Emperor has read it aloud twice.\n\nWe can refuse it and say plainly why, or recognise the thing in fact and keep our ambassador at his desk."
 ita_dnc.1879.a: "Refuse. We do not receive regicide."
 ita_dnc.1879.b: "Recognise in fact, and nothing on paper."
 ita_dnc.1884.t: "The Republic Asks for Recognition"
 ita_dnc.1884.d: "A republic made by a chamber that sent its King away asks the Apostolic Majesty to recognise it. Our own nationalities read the Italian newspapers, and the corps of the Tyrol have already asked for their reservists.\n\nWe can refuse and mass the corps, offer recognition against a written renunciation of the irredenta, or recognise the thing in fact and say nothing further."
 ita_dnc.1884.a: "Refuse, and let the Tyrol corps stand to."
 ita_dnc.1884.b: "Recognition against the irredenta, in writing."
 ita_dnc.1884.c: "Recognise in fact. We have other frontiers."
 ita_dnc.1885.t: "The Republic Asks for Recognition"
 ita_dnc.1885.d: "The Italians ask the Emperor of all the Russias to receive their republic, having removed a king by a vote of their chamber. The Holy Synod has an opinion about it and has not been asked for one.\n\nWe can refuse, as an autocracy is expected to, or recognise them and keep a friend in that sea."
 ita_dnc.1885.a: "Refuse. We do not applaud this."
 ita_dnc.1885.b: "Recognise them. That sea is useful to us."
 ita_dnc.1886.t: "The Price of the Frontier"
 ita_dnc.1886.d: "Recognition is offered and the price is written out: a renunciation in due form of every claim beyond the eastern frontier, signed by the republic and laid before the assembly. The provinces named are the ones our schools have taught about for forty years.\n\nWe can sign the renunciation and buy the frontier, or refuse and take whatever the corps of the Tyrol are told to do about it."
 ita_dnc.1886.a: "Sign the renunciation. The frontier is worth it."
 ita_dnc.1886.b: "Refuse. We do not sell our own."
 ITA_r_blocco_popolare: "Blocco Popolare"
 ITA_r_blocco_popolare_long: "The Popular Bloc"
 ITA_r_unione_liberale: "Unione Liberale"
 ITA_r_unione_liberale_long: "The Liberal Union"
 ITA_r_destra_costituzionale: "Destra Costituzionale"
 ITA_r_destra_costituzionale_long: "The Constitutional Right"
 ITA_r_partito_repubblicano: "Partito Repubblicano"
 ITA_r_partito_repubblicano_long: "The Republican Party"
 ITA_r_camere_del_lavoro: "Camere del Lavoro"
 ITA_r_camere_del_lavoro_long: "The Chambers of Labour"
 ITA_r_entente_latine: "Entente Latine"
 ITA_r_revel_at_the_admiralty: "Paolo Thaon di Revel"
 ITA_r_revel_at_the_admiralty_desc: "The officer the Admiralty keeps for the day it has to explain itself to a Chamber that counts the cost of every hull. He will take the fleet exactly as far as the understanding says it may go, and not a mile further."
 ITA_r_colajanni_at_the_constituent: "Napoleone Colajanni"
 ITA_r_colajanni_at_the_constituent_desc: "A Sicilian republican who has spent his life proving that the South is governed badly on purpose and printing the figures to show it. He wrote the constitution he wants long before there was an assembly to read it to."
 ITA_r_threat_the_constituent: "The Italian Chamber declares itself constituent"
 ITA_r_threat_the_king_at_turin: "The King of Italy raises his standard in the north"
 ITA_r_threat_vienna_takes_the_kings_part: "Vienna guarantees the Italian King"
 ITA_r_threat_the_throne_is_empty: "Italy puts the throne itself to the question"
 ITA_r_threat_the_republic_proclaimed: "The Italian republic is proclaimed"
 ITA_r_threat_the_pope_leaves_rome: "The Pope leaves for the Tyrol"
 ITA_r_threat_berlin_will_not_recognise: "Berlin refuses to recognise the Italian republic"
 ITA_r_threat_the_republic_of_labour: "The chambers of labour take the Italian State"
 ITA_r_threat_vienna_reads_the_red_republic: "Vienna takes a war aim against the red republic"
 ITA_r_threat_the_cordon_on_the_isonzo: "Vienna draws a cordon on the Isonzo"
 ITA_r_threat_the_tyrol_corps_are_massed: "The corps of the Tyrol are massed against Italy"
 ITA_z_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_z_threat_vienna_answers_conrad: "Vienna weighs a preventive war on Italy"
 ITA_z_threat_the_tyrol_mobilises: "Austria mobilises in the Tyrol"
 ITA_z_threat_the_german_guarantee: "Berlin guarantees Vienna against Italy"
 ITA_z_threat_the_hour: "Italy marches on the Isonzo"
 ITA_z_threat_the_serbian_guarantee: "Italy guarantees Serbia against Vienna"
 ITA_z_threat_the_isonzo_guarantee: "Berlin guarantees Austria against Italy"
 ITA_z_threat_the_albanian_prince: "Italy sets a prince of her own over Albania"
 ITA_z_threat_the_wargoal_on_the_porte: "Italy prepares to take Albania by arms"
 ITA_z_threat_the_condominium: "Vienna demands a share of Albania"
 ITA_z_threat_our_wing_over_cetinje: "Italy takes Montenegro under her wing"
 ITA_z_threat_the_savoy_crown: "A Savoy viceroy is set over Albania"
 ITA_z_party_nazionalista: "Associazione Nazionalista"
 ITA_z_party_nazionalista_long: "Associazione Nazionalista Italiana"
 ITA_z_party_unione_nazionale: "Unione Nazionale"
 ITA_z_party_unione_nazionale_long: "Unione Nazionale Liberale"
 ITA_z_party_unione_liberale: "Unione Liberale"
 ITA_z_party_unione_liberale_long: "Unione Liberale Italiana"
 ITA_z_adriatic_league: "Adriatic League"
 ita_dnc.1655.t: "The War That Did Not Come"
 ita_dnc.1655.d: "Vienna has heard its Chief of Staff and has not followed him. The frontier corps stand down, the ambassador is cordial again, and the newspapers print what they were forbidden to print a month ago.\n\nThe country has been shown how near it came, and has not liked the view."
 ita_dnc.1655.a: "We were spared a war we did not choose."
 ita_dnc.1656.t: "The Chief of Staff Asks for the War"
 ita_dnc.1656.d: "The Chief of Staff has come again with the same memorandum. Italy is arming, Italy is talking to Belgrade, and the day the Kingdom is ready the Empire fights on two fronts instead of one.\n\nThe Ballhausplatz answers that the alliance is worth more than the Trentino. The Emperor must decide which of them he believes."
 ita_dnc.1656.a: "The alliance is worth more. Refuse him."
 ita_dnc.1656.b: "Let him mobilise in the Tyrol."
 ita_dnc.1657.t: "The Tyrol Mobilises"
 ita_dnc.1657.d: "The Austrian classes have been called in the Tyrol and the works of the Cadore are watched from the far side of the ridge. The ambassador answers that these are manoeuvres and invites us to count the days of them ourselves.\n\nWe can call our own classes, or ask the northern ally to hold Vienna back."
 ita_dnc.1657.a: "Call the classes."
 ita_dnc.1657.b: "Ask the ally to hold them back."
 ita_dnc.1658.t: "Berlin Says No"
 ita_dnc.1658.d: "The German ambassador has read out a note which says the alliance does not cover a war opened by one partner against another. The staff answers that the Tyrol is a matter for the Empire alone.\n\nThe mobilisation can be given up, or carried through without the Reich behind it."
 ita_dnc.1658.a: "Give up the mobilisation."
 ita_dnc.1658.b: "Carry it through regardless."
 ita_dnc.1659.t: "Berlin Is Asked to Restrain Vienna"
 ita_dnc.1659.d: "The Italian ambassador asks whether the Reich means to watch one ally mobilise against another and call it a manoeuvre. He leaves a memorandum on the tonnage the Kingdom would put into the middle sea if the alliance were dissolved.\n\nWe can hold Vienna back, or let the two of them settle it between themselves."
 ita_dnc.1659.a: "Hold Vienna back."
 ita_dnc.1659.b: "Let them settle it."
 ita_dnc.1672.t: "Rome Offers Terms"
 ita_dnc.1672.d: "The Italian note offers peace against the provinces: the Trentino, the South Tyrol, Trieste, Istria and the mines at Idrija. If the front gives further, it says, the price will be Fiume and the Dalmatian coast as well.\n\nThe army can hold or it cannot. The Hungarians have said again that they will not fight for Trieste."
 ita_dnc.1672.a: "Cede the provinces and end it."
 ita_dnc.1672.b: "Cede the coast as well."
 ita_dnc.1672.c: "Fight on."
 ita_dnc.1673.t: "The Armistice"
 ita_dnc.1673.d: "The Italian front has broken and our corps are down on the plain with the winter coming on behind them. The staff has drawn the terms it believes Rome will sign rather than lose Venetia.\n\nWe can take an indemnity, the Friuli, Venetia in pledge, or their fleet held down for a term of years."
 ita_dnc.1673.a: "An indemnity and the old frontier."
 ita_dnc.1673.b: "The Friuli."
 ita_dnc.1673.c: "Venetia in pledge."
 ita_dnc.1673.e: "Their fleet held down."
 ita_dnc.1674.t: "The Isonzo Is Settled"
 ita_dnc.1674.d: "The war on the Isonzo has ended with a peace signed at the front and the map redrawn to the watershed. Rome is stronger than she was and is nobody's junior partner now.\n\nWe can take note of it and open our door to her again, or guarantee what is left of Austria against her."
 ita_dnc.1674.a: "Open the door to Rome again."
 ita_dnc.1674.b: "Guarantee what is left of Austria."
 ita_dnc.1675.t: "Belgrade Claims Dalmatia"
 ita_dnc.1675.d: "The Dalmatian coast has passed from an empire to a kingdom that has never pretended it was Slav. Our claim was never renounced and the peace was signed without a word to us.\n\nWe can lodge the claim now and be heard, or say nothing and remember it."
 ita_dnc.1675.a: "Lodge the claim."
 ita_dnc.1675.b: "Say nothing."
 ita_dnc.1684.t: "Rome Offers a Subsidy and a Guarantee"
 ita_dnc.1684.d: "The Italian minister brings the subsidy, the works at the port and a guarantee of our frontiers, and asks for our foreign policy in exchange. The Queen of Italy is our King's daughter and the Italians have never once let us forget it.\n\nWe can take the guarantee, take the protectorate that comes wrapped in it, or ask Petersburg first."
 ita_dnc.1684.a: "Take the guarantee."
 ita_dnc.1684.b: "Take the protectorate."
 ita_dnc.1684.c: "Ask Petersburg first."
 ita_dnc.1687.t: "Petersburg Is Asked About Cetinje"
 ita_dnc.1687.d: "Cetinje asks whether our subsidy will continue if it takes the Italian one as well. The court there is ours by marriage and by habit, and the Adriatic is not a Russian sea.\n\nWe can cut the subsidy and let Rome pay for what she is buying, or accept her as a partner in the protection."
 ita_dnc.1687.a: "Cut the subsidy."
 ita_dnc.1687.b: "Accept a partner."
 ITA_v_catholic_union: "Unione Cattolica"
 ITA_v_catholic_union_long: "Unione Cattolica"
 ITA_v_national_democratic_league: "Lega Democratica Nazionale"
 ITA_v_national_democratic_league_long: "Lega Democratica Nazionale"
 ITA_v_liberal_catholic_union: "Unione Liberale Cattolica"
 ITA_v_liberal_catholic_union_long: "Unione Liberale Cattolica"
 ITA_v_liberal_union: "Unione Liberale"
 ITA_v_liberal_union_long: "Unione Liberale"
 ITA_v_the_triple_alliance: "Triple Alliance"
 ITA_dnc_crown_cat: "The Crown"
 ITA_dnc_crown_cat_desc: "The Crown stands at [?ITA_crown|0]. What the King will sign, and what he will send back to the ministry unsigned, is read off that figure at every fork."
 ITA_dnc_church_cat: "The Church"
 ITA_dnc_church_cat_desc: "The business the ministry does with the Church: the prefects who count the parish, the bishops who wait on the exequatur, and whichever intermediary is willing to carry a letter across the Tiber."
 ITA_dnc_bloc_cat: "The Popular Bloc"
 ITA_dnc_bloc_cat_desc: "What a ministry of the bloc can give the country through the councils, the leagues and the schools. None of it needs the Chamber to be asked twice."
 ITA_dnc_irredenta_cat: "Irredenta"
 ITA_dnc_irredenta_cat_desc: "The committees, the gymnastic societies and the subscriptions that keep the unredeemed provinces in mind. Every one of them is read in Vienna, and answered."
 ITA_p_the_strike_is_let_run: "The Strike Is Let Run"
 ITA_p_the_strike_is_let_run_desc: "The prefects are told to keep the troops in barracks and let the strike find its own end. Nothing is conceded and nothing is broken, and in a few days the men go back to work because they are hungry."
 ITA_p_the_anarchists_are_sent_to_the_islands: "The Anarchists Are Sent to the Islands"
 ITA_p_the_anarchists_are_sent_to_the_islands_desc: "The law of suspects allows the police to remove a man to Lampedusa or Ustica without troubling a court. The squares grow quieter and the courts grow ashamed."
 ITA_p_buggerru_is_investigated: "Buggerru Is Investigated"
 ITA_p_buggerru_is_investigated_desc: "An inquiry is opened into the volleys fired at the Sardinian miners and the lieutenant who ordered them. The findings will not please the officer corps, and the mining districts will read them for years."
 ITA_p_the_amnesty_of_the_romagna: "The Amnesty of the Romagna"
 ITA_p_the_amnesty_of_the_romagna_desc: "The men convicted in the agrarian troubles of the Romagna are let out and their sentences struck from the record. The province is quieter for it, and stays quieter than it was before."
 ITA_c_the_register_of_five_million: "The Register of Five Million"
 ITA_c_the_register_of_five_million_desc: "The new electorate is inscribed college by college, and the prefects are given the time to inscribe it in the right order. The Chamber that comes back will be larger and the square will notice who was left off the list."
 ITA_c_the_twelfths_are_voted: "The Twelfths Are Voted"
 ITA_c_the_twelfths_are_voted_desc: "The budget is not ready, so the Chamber votes the provisional twelfths and the ministry is paid for another quarter. It is the least interesting thing a government can do and it is what keeps a government alive."
 ITA_c_the_closure_is_moved: "The Closure Is Moved"
 ITA_c_the_closure_is_moved_desc: "The obstruction from the benches of the Extreme Left is broken by moving the closure and voting through the night. The bill passes and the galleries empty into the street."
 ITA_c_the_extreme_left_is_received: "The Extreme Left Is Received"
 ITA_c_the_extreme_left_is_received_desc: "The leaders of the Extreme Left are received at the Consulta and told what the ministry intends before the Chamber hears it. Some of them come away half persuaded, and their followers notice."
 ITA_c_the_nationalist_interpellation: "The Nationalist Interpellation"
 ITA_c_the_nationalist_interpellation_desc: "A nationalist deputy interpellates the government on the unredeemed provinces and the ministry answers him at length. The answer is read in the Ballhausplatz before it is read in Milan."
 ITA_pr_the_ninety_are_asked_for_a_list: "The Ninety Are Asked for a List"
 ITA_pr_the_ninety_are_asked_for_a_list_desc: "Every prefect in the kingdom is asked which candidate his province can be made to return. The lists come back promptly, and the machine spends some of itself in the writing."
 ITA_pr_the_prefect_answers_to_the_minister_of_labour: "The Prefect Answers to the Minister of Labour"
 ITA_pr_the_prefect_answers_to_the_minister_of_labour_desc: "Labour disputes are taken out of the hands of the Interior and given to the new ministry that the leagues trust. The squares calm and the prefects lose a weapon they had grown fond of."
 ITA_pr_the_prefect_counts_the_parish: "The Prefect Counts the Parish"
 ITA_pr_the_prefect_counts_the_parish_desc: "The prefects are instructed to report which parishes will deliver and which priest is worth calling on. The Catholic vote is thereby added to the machine without anybody admitting that it has been."
 ITA_s_the_law_for_naples: "The Law for Naples"
 ITA_s_the_law_for_naples_desc: "The special law for Naples pays for a industrial quarter at Bagnoli and the works to serve it. The South gets a factory instead of a promise."
 ITA_s_the_emphyteusis: "The Emphyteusis"
 ITA_s_the_emphyteusis_desc: "The waste lands of the latifundia are let out on long leases to the men who work them. The roads follow the leases, because a tenant who owns his improvements will ask for a road."
 ITA_s_the_white_leagues_in_apulia: "The White Leagues in Apulia"
 ITA_s_the_white_leagues_in_apulia_desc: "The Catholic leagues are given the run of the Apulian harvest and the labour contracts that go with it. The red leagues lose the province, and the province loses some of its hands to the settlement."
 ITA_e_the_consuls_of_the_americas: "The Consuls of the Americas"
 ITA_e_the_consuls_of_the_americas_desc: "The consulates on the far side of the ocean are given clerks, a register and the money to keep them. Men who are counted come back more often than men who are not."
 ITA_e_the_indemnity_is_asked_again: "The Indemnity Is Asked Again"
 ITA_e_the_indemnity_is_asked_again_desc: "The claim for the Italians lynched in Louisiana is presented again, with the consular inspection of arrivals attached to it. Washington may pay, or may send us back to the state courts."
 ITA_e_the_brazilian_passage_reopened: "The Brazilian Passage Reopened"
 ITA_e_the_brazilian_passage_reopened_desc: "The ban on the subsidised passage is offered back to Rio in exchange for consular inspection of the plantations. The planters want the hands badly enough to consider it."
 ITA_e_the_parish_sends_the_chaplain: "The Parish Sends the Chaplain"
 ITA_e_the_parish_sends_the_chaplain_desc: "The Scalabrinian fathers are put aboard the emigrant ships and paid for out of the estimates. They keep the villages in touch with the men who left them, and the men come home."
 ITA_w_the_antivari_subsidy: "The Antivari Subsidy"
 ITA_w_the_antivari_subsidy_desc: "The Compagnia di Antivari is paid to run the port, the telegraph and the salt of the little kingdom. Cetinje is grateful and the Ballhausplatz counts the bill."
 ITA_w_the_schools_in_albania: "The Schools in Albania"
 ITA_w_the_schools_in_albania_desc: "More Italian schools are opened in Scutari and along the coast, and the teachers are chosen in Rome. The Porte protests, and our staff learns the roads behind the schools."
 ITA_w_the_consul_at_tunis: "The Consul at Tunis"
 ITA_w_the_consul_at_tunis_desc: "The consulate at Tunis is enlarged and told to speak for the Italian colony as though it were a province. Paris takes it very badly and the powers take note of the precedent."
 ITA_w_the_banks_branch_at_tripoli: "The Bank's Branch at Tripoli"
 ITA_w_the_banks_branch_at_tripoli_desc: "The Banco di Roma opens at Tripoli with a mill, a steamer line and a credit for the caravans. Trade is the cheapest way to occupy a province, and the cheapest to disown."
 ITA_w_the_powers_are_sounded_on_tripoli: "The Powers Are Sounded on Tripoli"
 ITA_w_the_powers_are_sounded_on_tripoli_desc: "One capital at a time is asked, in confidence, what it would say if Italy took the fourth shore. Each answer costs something and each answer is worth having before the ultimatum is drafted."
 ITA_k_the_audience_at_the_quirinal: "The Audience at the Quirinal"
 ITA_k_the_audience_at_the_quirinal_desc: "The President of the Council goes up the hill weekly and stays longer than protocol requires. The King is consulted before he is informed, and he remembers it."
 ITA_k_the_royal_decree: "The Royal Decree"
 ITA_k_the_royal_decree_desc: "A measure the Chamber will not pass is issued as a royal decree and enforced from the day of signature. The works begin at once and the Cassation is invited to think about it afterwards."
 ITA_k_the_prorogation_for_the_session: "The Prorogation for the Session"
 ITA_k_the_prorogation_for_the_session_desc: "The Chamber is prorogued and does not sit again until the ministry wants it to. The majority is spared a season of wear, and the square is left to make the arguments the deputies would have made."
 ITA_k_a_batch_of_senators: "A Batch of Senators"
 ITA_k_a_batch_of_senators_desc: "The Crown names a batch of senators chosen for their willingness rather than their eminence. The upper house will carry what the lower house sends it."
 ITA_k_the_grand_cross: "The Grand Cross for the General"
 ITA_k_the_grand_cross_desc: "The general who fired on the crowd is decorated in front of the garrison of the capital. The army learns what the Crown thinks of officers who obey, and the streets learn it too."
 ITA_k_the_amnesty_of_the_new_reign: "The Amnesty of the New Reign"
 ITA_k_the_amnesty_of_the_new_reign_desc: "The new reign opens the prisons to the men convicted under the old one. The country is grateful and the Crown has spent the gratitude it was given at the funeral."
 ITA_k_the_royal_commissioner: "The Royal Commissioner"
 ITA_k_the_royal_commissioner_desc: "A royal commissioner is sent into a southern province with the powers of a council and a prefect together. The province is governed, and the deputies of the province are not consulted."
 ITA_k_the_civil_list_cut: "The Civil List Cut"
 ITA_k_the_civil_list_cut_desc: "The civil list is trimmed and the saving is voted to the estimates of the ministry. The Treasury is pleased, the court is not, and the court says so."
 ITA_k_the_kings_veto_withheld: "The King's Veto Withheld"
 ITA_k_the_kings_veto_withheld_desc: "The King is persuaded not to refuse his signature to a bill his household detests. The Chamber discovers that it can carry a measure over the Crown, and does not forget."
 ITA_k_the_regents_question: "The Regent's Question"
 ITA_k_the_regents_question_desc: "The Duke of Aosta is sounded on whether he would take the throne if it were offered him. He does not say no, and the answer is written down."
 ITA_k_the_king_is_asked_again: "The King Is Asked Again"
 ITA_k_the_king_is_asked_again_desc: "The King who refused to sign is asked again, this time by the whole cabinet and the Senate together. A monarch who has been asked twice by everyone he trusts usually signs."
 ITA_k_the_kings_tour_of_the_south: "The King's Tour of the South"
 ITA_k_the_kings_tour_of_the_south_desc: "The King goes down to the provinces of the South with the Queen and stays a month. The towns turn out, the deputies ride in the train, and nobody strikes while he is there."
 ITA_k_the_senates_list: "The Senate's List"
 ITA_k_the_senates_list_desc: "The Senate votes the twelfths and the list of appointments in a single afternoon and asks nothing in return. The ministry that survived the Chamber finds the upper house waiting to be useful."
 ITA_ch_the_sacristy_list: "The Sacristy List"
 ITA_ch_the_sacristy_list_desc: "The Electoral Union draws up the colleges where Catholics may vote and for whom. The list is not published and it decides more seats than any speech."
 ITA_ch_the_opera_dei_congressi: "The Opera dei Congressi"
 ITA_ch_the_opera_dei_congressi_desc: "The Catholic congresses are left alone to run their rural banks, their leagues and their parish committees. The countryside gets a discipline that costs the prefecture nothing."
 ITA_ch_the_law_of_guarantees_read_again: "The Law of Guarantees Read Again"
 ITA_ch_the_law_of_guarantees_read_again_desc: "The lawyers of the Consulta are asked what the Law of Guarantees would allow if anybody wanted it to allow something. Their answer is sent quietly across the Tiber."
 ITA_ch_the_divorce_bill_buried: "The Divorce Bill Buried"
 ITA_ch_the_divorce_bill_buried_desc: "The divorce bill is sent to a committee from which no bill has ever returned. The Church is satisfied and the anticlerical press is furious."
 ITA_ch_the_catechism_in_the_schools: "The Catechism in the Schools"
 ITA_ch_the_catechism_in_the_schools_desc: "The communes are permitted to put religious instruction back into the elementary schools. The parish priest becomes an officer of the state without being paid by it."
 ITA_ch_the_bishops_exequatur: "The Bishop's Exequatur"
 ITA_ch_the_bishops_exequatur_desc: "The royal exequatur is granted to a bishop the Curia has appointed without asking us. It is a small courtesy and it is counted on the other bank of the river."
 ITA_ch_the_catholic_banks: "The Catholic Banks"
 ITA_ch_the_catholic_banks_desc: "The rural savings banks of the Catholic movement are given the standing of public institutions. They lend where the state will not, and the roads follow the lending."
 ITA_ch_the_rural_leagues: "The Rural Leagues"
 ITA_ch_the_rural_leagues_desc: "The white leagues are given the contracts and the recognition that the red ones were refused. The harvest is brought in without a strike."
 ITA_ch_the_intermediary_is_sent_again: "The Intermediary Is Sent Again"
 ITA_ch_the_intermediary_is_sent_again_desc: "A layman nobody can name officially is sent across the river again with a written question. If he comes back with a written answer, the conversation has begun."
 ITA_ch_the_concordat_is_drafted: "The Concordat Is Drafted"
 ITA_ch_the_concordat_is_drafted_desc: "The jurists of both sides sit down to a text covering the bishops, the schools, the marriage law and the territory. Nothing is signed, but the text exists and both sides have initialled it."
 ITA_ch_the_twentieth_of_september_stood_down: "The Twentieth of September Stood Down"
 ITA_ch_the_twentieth_of_september_stood_down_desc: "The official commemoration of the breach at the Porta Pia is reduced to a wreath and a bugle. The Curia notices, and so do the lodges."
 ITA_b_the_league_is_lawful: "The League Is Lawful"
 ITA_b_the_league_is_lawful_desc: "The leagues of resistance are entered on a register and given standing before the courts. A union that can sue does not need to riot."
 ITA_b_the_cooperatives_contract: "The Cooperative's Contract"
 ITA_b_the_cooperatives_contract_desc: "Public works are contracted directly to the workers cooperatives instead of to the usual houses. The roads are built and the profit stays in the province."
 ITA_b_municipal_socialism: "Municipal Socialism"
 ITA_b_municipal_socialism_desc: "The red communes are allowed to take the gas, the trams and the mills into their own hands. The rates fall, the works are built, and the square has something to defend."
 ITA_b_the_school_against_the_parish: "The School Against the Parish"
 ITA_b_the_school_against_the_parish_desc: "The elementary schools are taken from the communes and paid for by the state, and the catechism goes out of them. The teachers are ours and the Curia says so loudly."
 ITA_b_the_womens_work_law: "The Women's Work Law"
 ITA_b_the_womens_work_law_desc: "The hours of women and children in the mills and the rice fields are fixed by law and inspected. The mills complain, and the mill towns are quieter."
 ITA_b_the_school_meals: "The School Meals"
 ITA_b_the_school_meals_desc: "The communes are given the money to feed the children who come to school hungry. Attendance rises and so does the standing of the men who voted it."
 ITA_b_the_strike_fund_is_counted: "The Strike Fund Is Counted"
 ITA_b_the_strike_fund_is_counted_desc: "The Confederation opens its books and tells the leagues how long they could actually stay out. The answer is short, and the leagues settle."
 ITA_b_the_pension_fund: "The Pension Fund"
 ITA_b_the_pension_fund_desc: "The old age and invalidity fund is made compulsory and the employers are made to pay into it. Every wage in the kingdom is a little smaller and every old man is a little safer."
 ITA_b_the_garibaldian_legion: "The Garibaldian Legion"
 ITA_b_the_garibaldian_legion_desc: "The red shirts are called out again and the volunteers are given rifles and a number. They are worth a brigade and they belong to nobody in the ministry."
 ITA_b_the_committee_for_the_constituent: "The Committee for the Constituent"
 ITA_b_the_committee_for_the_constituent_desc: "A committee of deputies, lawyers and league secretaries sits to prepare the summoning of a constituent assembly. It has no legal standing whatever and everybody knows where it meets."
 ITA_i_the_trento_committee: "The Trento Committee"
 ITA_i_the_trento_committee_desc: "The Trento and Trieste committee is funded, housed and allowed to hold its meetings in public halls. Its maps are better than the ones the staff has."
 ITA_i_the_trieste_gymnasts: "The Trieste Gymnasts"
 ITA_i_the_trieste_gymnasts_desc: "The gymnastic societies of the coast are given instructors, flags and a subsidy from Rome. Vienna must decide whether they are athletes or a militia."
 ITA_i_the_dalmatian_press: "The Dalmatian Press"
 ITA_i_the_dalmatian_press_desc: "The Italian papers of Zara and Spalato are bought quietly and given a new press. Belgrade reads them with pleasure and the Ballhausplatz with none."
 ITA_i_battistis_lectures: "Battisti's Lectures"
 ITA_i_battistis_lectures_desc: "Battisti is sent round the northern cities to lecture on the province he comes from. He fills the halls, and the halls sing on the way out."
 ITA_i_the_adriatic_map: "The Adriatic Map"
 ITA_i_the_adriatic_map_desc: "The staff is given the soundings, the roads and the garrisons of the far shore, and told to draw the plan for them. A war that has been drawn is half a war."
 ITA_i_the_consulate_at_fiume: "The Consulate at Fiume"
 ITA_i_the_consulate_at_fiume_desc: "The consulate is enlarged with clerks who are not clerks and a budget nobody itemises. The consular service becomes the best informed office in the kingdom."
 ITA_i_the_university_fund: "The University Fund"
 ITA_i_the_university_fund_desc: "A national subscription is raised for an Italian faculty in the unredeemed provinces. Vienna is asked again where it may be put."
 ITA_i_the_volunteers_register: "The Volunteers' Register"
 ITA_i_the_volunteers_register_desc: "A register is opened for the men who wish to serve wherever the frontier is crossed. It fills faster than the depots can clothe it."
 ITA_i_the_students_to_innsbruck: "The Students to Innsbruck"
 ITA_i_the_students_to_innsbruck_desc: "The student associations are paid to send their delegations north for the term. There will be a riot and there will be arrests, and both will be reported at length."
 ITA_i_the_albanian_committee: "The Albanian Committee"
 ITA_i_the_albanian_committee_desc: "The Albanian exiles in Naples and Bari are given a house, a newspaper and a subsidy. They call themselves a committee and the Porte calls them something else."
 ITA_dec_strike_let_run_tt: "The troops stay in barracks; the strike will end by itself, one way or the other"
 ITA_dec_the_islands_tt: "The known agitators go to the islands, and the courts look away"
 ITA_dec_buggerru_tt: "The volleys in the mining district are examined in public"
 ITA_dec_amnesty_romagna_tt: "The province is pardoned, and the floor beneath its square comes down"
 ITA_dec_register_of_five_million_tt: "The new voters are inscribed to the advantage of the ministry at the next returns"
 ITA_dec_the_twelfths_tt: "The ministry is paid for another quarter without a budget"
 ITA_dec_the_closure_tt: "The obstruction is broken and the majority holds, at the cost of the street"
 ITA_dec_the_extreme_left_tt: "The Extreme Left is taken into the confidence of the ministry"
 ITA_dec_the_interpellation_tt: "The unredeemed provinces are named aloud in the Chamber, and heard abroad"
 ITA_dec_the_ninety_tt: "Every prefecture reports the college it can deliver at the next returns"
 ITA_dec_the_minister_of_labour_tt: "Labour disputes leave the prefecture for the new ministry"
 ITA_dec_counts_the_parish_tt: "The parishes are counted into the majority"
 ITA_dec_law_for_naples_tt: "The special law raises an industrial quarter at Naples"
 ITA_dec_the_emphyteusis_tt: "The waste land is leased out, and the roads follow the leases"
 ITA_dec_white_leagues_apulia_tt: "The white leagues settle on the Apulian harvest for a year"
 ITA_dec_consuls_americas_tt: "The consulates count our own, and more of them come home"
 ITA_dec_indemnity_again_tt: "Washington is asked to pay, and to let our consuls onto the quay"
 ITA_dec_brazil_reopened_tt: "Rio is asked whether the passage may be opened on our terms"
 ITA_dec_the_chaplain_tt: "The fathers sail with the emigrants and the villages keep their men"
 ITA_dec_antivari_subsidy_tt: "The port of the little kingdom is ours to run, and Vienna reads the accounts"
 ITA_dec_schools_in_albania_tt: "The schools spread along the coast, and our staff learns the ground behind them"
 ITA_dec_consul_at_tunis_tt: "The consulate speaks for the colony, and the powers take note"
 ITA_dec_banks_branch_tripoli_tt: "The bank is at Tripoli before the army is"
 ITA_dec_powers_sounded_tt: "One capital is chosen and asked, in confidence, what it would say"
 ITA_dec_audience_quirinal_tt: "The King is consulted before he is informed"
 ITA_dec_the_royal_decree_tt: "The measure is law from the day of signature, and the Chamber is told afterwards"
 ITA_dec_the_prorogation_tt: "The Chamber does not sit, and the majority is spared the wear of a session"
 ITA_dec_batch_of_senators_tt: "The upper house is filled with men who will carry what is sent to them"
 ITA_dec_the_grand_cross_tt: "The decoration stands, and the army knows where it stands"
 ITA_dec_amnesty_new_reign_tt: "The prisons are opened for the new reign, and the floor of the square comes down"
 ITA_dec_royal_commissioner_tt: "A province is governed from the Quirinal, over the heads of its deputies"
 ITA_dec_civil_list_cut_tt: "The court pays for the estimates, and does not forgive it"
 ITA_dec_veto_withheld_tt: "The Crown signs what it hates, and the Chamber remembers that it can be made to"
 ITA_dec_the_regents_question_tt: "The Duke of Aosta has been asked, and has not said no"
 ITA_dec_king_asked_again_tt: "The King consents at the second asking"
 ITA_dec_tour_of_the_south_tt: "The King is cheered in the provinces, and nothing is struck while he is there"
 ITA_dec_the_senates_list_tt: "The Senate votes the money and the appointments in one afternoon"
 ITA_dec_the_sacristy_list_tt: "The Electoral Union names the colleges, and they answer at the next returns"
 ITA_dec_opera_dei_congressi_tt: "The Catholic congresses keep the countryside in order at no charge to us"
 ITA_dec_guarantees_read_again_tt: "The Law of Guarantees is read for what it would permit, and the reading crosses the river"
 ITA_dec_divorce_buried_tt: "The bill dies in committee and the Church is told so"
 ITA_dec_the_catechism_tt: "The parish priest teaches in the schools of the state again"
 ITA_dec_the_exequatur_tt: "One more step is taken towards the Curia"
 ITA_dec_catholic_banks_tt: "The rural banks lend where the Treasury will not"
 ITA_dec_the_rural_leagues_tt: "The white leagues take the countryside from the red ones"
 ITA_dec_the_intermediary_tt: "The conversation across the river is begun"
 ITA_dec_concordat_drafted_tt: "A text exists, initialled by both sides"
 ITA_dec_twentieth_stood_down_tt: "The commemoration is reduced to a wreath; the Curia notices and the lodges shout"
 ITA_dec_league_is_lawful_tt: "A union that can go to court has less use for the street"
 ITA_dec_cooperatives_contract_tt: "The works go to the cooperatives, and the profit stays in the province"
 ITA_dec_municipal_socialism_tt: "The commune takes the works into its own hands"
 ITA_dec_school_against_parish_tt: "The state pays the teachers, and the Curia steps back"
 ITA_dec_womens_work_law_tt: "The hours in the mills and the rice fields are fixed and inspected"
 ITA_dec_school_meals_tt: "The children are fed at school, and the commune is thanked for it"
 ITA_dec_strike_fund_tt: "The leagues are shown how long their money would last"
 ITA_dec_the_pension_fund_tt: "The fund is compulsory, and every wage in the kingdom pays into it"
 ITA_dec_garibaldian_legion_tt: "The volunteers are raised, armed and formed into a division of our own"
 ITA_dec_committee_constituent_tt: "The committee sits, and everybody knows where"
 ITA_dec_trento_committee_tt: "The committee is public, funded and better mapped than the staff"
 ITA_dec_trieste_gymnasts_tt: "The societies drill in the open, and Vienna must decide what they are"
 ITA_dec_dalmatian_press_tt: "The papers of the far shore change hands quietly"
 ITA_dec_battistis_lectures_tt: "The halls are full, and they sing on the way out"
 ITA_dec_the_adriatic_map_tt: "The plan against the ally is drawn, with the soundings on it"
 ITA_dec_consulate_at_fiume_tt: "The consular service becomes the best informed office in the kingdom"
 ITA_dec_university_fund_tt: "The subscription is raised and Vienna is asked again where the faculty may stand"
 ITA_dec_volunteers_register_tt: "The register fills faster than the depots can clothe it"
 ITA_dec_students_to_innsbruck_tt: "The delegations go north, and what happens there is reported at length"
 ITA_dec_albanian_committee_tt: "The exiles have a house, a paper and a name"
 ITA_dec_strike_burned_out_tt: "The men go back, and the square is emptier than it has been for a long time"
 ITA_dec_strike_hardened_tt: "The strike hardens into a habit, and the floor beneath the square rises"
 ITA_dec_soundings_put_off_tt: "No capital is asked this season"
 ita_dnc.2200.t: "The Strike Runs Its Course"
 ita_dnc.2200.d: "No troops were sent, no chamber of labour was shut and no arrests were made, and the strike has now lasted longer than the funds behind it. The Confederation must decide whether to call the men back with nothing to show, or to let the chambers of labour vote to stay out and turn a wage dispute into a standing quarrel with the state.\n\nWhichever they choose, the ministry will be told it did too little."
 ita_dnc.2200.a: "The Confederation calls the men back."
 ita_dnc.2200.b: "The chambers of labour vote to stay out."
 ita_dnc.2208.t: "A Second Indemnity"
 ita_dnc.2208.d: "The Italian ambassador presents the claim for the men killed in Louisiana a second time, and attaches to it a request that Italian consuls be admitted to the landing stages to inspect the arrivals.\n\nThe money is small and the precedent is not. Admitting a foreign consul to the quay is a thing that will be quoted at us by every other government that sends us its poor."
 ita_dnc.2208.a: "Pay it, and let their consuls on the quay."
 ita_dnc.2208.b: "The matter belongs to the courts of the state."
 ita_dnc.2212.t: "The Passage Is Asked For Again"
 ita_dnc.2212.d: "Rome offers to lift the ban on the subsidised passage, on condition that Italian consuls may inspect the plantations and that the contracts are paid in coin.\n\nThe fazendas want the hands and have wanted them for years. The planters will not enjoy being inspected by a foreign government in their own province."
 ita_dnc.2212.a: "Accept the inspection; we need the hands."
 ita_dnc.2212.b: "The plantations will not be inspected."
 ita_dnc.2216.t: "The Question Is Put to the Powers"
 ita_dnc.2216.d: "The Consulta has drafted the same confidential question five times over, once for each of the chancelleries whose opinion will matter when the fourth shore is taken. Each of them will answer differently, each answer will cost us something elsewhere, and none of them can be asked twice in the same season.\n\nWe must choose which capital hears the question first."
 ita_dnc.2216.a: "Ask Paris."
 ita_dnc.2216.b: "Ask London."
 ita_dnc.2216.c: "Ask Berlin."
 ita_dnc.2216.e: "Ask Vienna."
 ita_dnc.2216.f: "Ask Petersburg."
 ita_dnc.2216.g: "The soundings can wait."
 ITA_e_the_consuls_on_the_quay: "The Consuls on the Quay"
 ITA_e_the_consuls_on_the_quay_desc: "Our consulates in the Americas keep a register of the men who landed, and a man who is on a register comes home."
 ITA_e_the_chaplains_of_the_passage: "The Chaplains of the Passage"
 ITA_e_the_chaplains_of_the_passage_desc: "The Scalabrinian fathers sail with the emigrants and write to the parish that sent them, and the parish keeps its men."
 ITA_b_the_pensions_are_funded: "The Pensions Are Funded"
 ITA_b_the_pensions_are_funded_desc: "The old age fund is compulsory and the employers pay into it, and every wage in the kingdom is that much smaller."
 ITA_i_the_volunteers_are_registered: "The Volunteers Are Registered"
 ITA_i_the_volunteers_are_registered_desc: "A register of men who have asked to serve beyond the frontier stands open in every northern city."
 ITA_i_the_committees_beyond_the_frontier: "The Committees Beyond the Frontier"
 ITA_i_the_committees_beyond_the_frontier_desc: "The irredentist committees send back roads, garrisons and timetables that the staff would otherwise have to guess at."
 ITA_i_the_committees_beyond_the_frontier_reinforced: "The Committees Beyond the Frontier Are Reinforced"
 ITA_i_the_committees_beyond_the_frontier_reinforced_desc: "The committees are funded from the secret estimates and answer to the staff instead of to the newspapers, and the maps that come back are drawn to scale."
 ITA_i_the_map_of_the_adriatic: "The Map of the Adriatic"
 ITA_i_the_map_of_the_adriatic_desc: "The staff has the soundings of the far shore, the roads behind it and the plan drawn for both."
 ITA_w_the_schools_are_reinforced: "The Schools Are Reinforced"
 ITA_w_the_schools_are_reinforced_desc: "Every schoolmaster we send down the Albanian coast comes back with something the staff can use."
 ITA_dnc_colonies_cat: "The Colonies"
 ITA_dnc_works_cat: "Public Works"
 ITA_dnc_plans_cat: "War Plans and the Staff"
 ITA_dnc_ministry_cat: "The Ministry"
 ITA_dnc_press_cat: "The Press"
 ITA_dnc_wars_cat: "The Wars"
 ITA_dnc_adriatic_cat: "The Adriatic"
 ITA_dnc_messina_cat: "Messina"
 ITA_dnc_siege_cat: "The State of Siege"
 ITA_af_the_massawa_railway: "The Massawa Railway"
 ITA_af_the_massawa_railway_desc: "The colony lives off one port and a mule track into the highlands. We will carry the line up from the sea, so that a battalion and a harvest can move in the same week."
 ITA_af_the_benadir_bought_out: "The Benadir Bought Out"
 ITA_af_the_benadir_bought_out_desc: "The chartered company has governed the southern coast cheaply and badly, and the scandal of its labour has reached the Chamber. We will buy it out, put the Benadir under the state and take its askari companies onto our own establishment."
 ITA_af_the_ascari_battalion_raised: "The Ascari Battalion Raised"
 ITA_af_the_ascari_battalion_raised_desc: "Recruiting is open in the highlands, and the pay of a soldier is better than the pay of a herdsman. We will raise another battalion of askari and let it carry the garrison duty that costs us conscripts."
 ITA_af_the_tripoli_agents: "The Tripoli Agents"
 ITA_af_the_tripoli_agents_desc: "Our consulate on that coast keeps a list of the notables and a fund for them. We will pay the agents, buy the opinion of the town and let the powers see that our interest there is an old one."
 ITA_af_the_kufra_caravan: "The Kufra Caravan"
 ITA_af_the_kufra_caravan_desc: "The brotherhood of the interior trades through the oases and sells us nothing. We will send a caravan of goods and gifts up to the lodges and ask for nothing in return this season."
 ITA_af_the_senussi_subsidy: "The Senussi Subsidy"
 ITA_af_the_senussi_subsidy_desc: "The interior is held by nobody who signs treaties, and the order that rules the oases can be paid. We will pay it, and a province that has been ungovernable will be governed by somebody who is not at war with us."
 ITA_af_the_sultans_treaties: "The Sultans' Treaties"
 ITA_af_the_sultans_treaties_desc: "The sultans of the southern ports signed with the company, not with the kingdom. We will renew the treaties in our own name and pay openly for the harbours we already use."
 ITA_af_the_lake_tana_survey: "The Lake Tana Survey"
 ITA_af_the_lake_tana_survey_desc: "The engineers want the levels of the lake and the passes that lead to it, and the Emperor will not like being asked. We will send the survey anyway and file what it brings back."
 ITA_af_the_tripartite_is_invoked: "The Tripartite Is Invoked"
 ITA_af_the_tripartite_is_invoked_desc: "The three powers divided the future of the highlands on paper, and paper has to be reread from time to time. We will ask London whether the zone that agreement left us is still ours."
 ITA_af_the_senussi_are_asked: "The Senussi Are Asked"
 ITA_af_the_senussi_are_asked_desc: "If the coast is ever taken, the war for it will be decided in the oases behind it. We will ask the order, through the bank and the missions, to keep the interior quiet whatever happens on the shore."
 ITA_af_the_customs_at_massawa: "The Customs at Massawa"
 ITA_af_the_customs_at_massawa_desc: "Everything the highlands buy passes our customs house, and the duty is a standing grievance at the Emperor's court. We will offer to share the receipts and see what he will give for them."
 ITA_af_the_africa_corps_is_named: "The Africa Corps Is Named"
 ITA_af_the_africa_corps_is_named_desc: "The African garrisons are a collection of detachments with no head over them. We will name a corps for Africa, give it a staff, and let the army plan for a war south of the sea."
 ITA_pw_the_apulian_aqueduct: "The Apulian Aqueduct"
 ITA_pw_the_apulian_aqueduct_desc: "The driest province in Europe drinks from cisterns and buys its water by the barrel. We will bring the springs of Campania across the mountains, and the towns that riot over water will have taps."
 ITA_pw_the_direttissima: "The Direttissima Rome-Naples"
 ITA_pw_the_direttissima_desc: "The trains between the capital and the greatest city of the South still crawl around every hill. We will build the direct line and cut the run to half a day."
 ITA_pw_the_po_dykes: "The Po Dykes"
 ITA_pw_the_po_dykes_desc: "The great river takes a harvest and half a province whenever the spring is wet. We will raise and widen the dykes along the lower reaches before it does it again."
 ITA_pw_the_genoa_harbour: "The Genoa Harbour"
 ITA_pw_the_genoa_harbour_desc: "The port that feeds the industry of the North is full, and the ships wait their turn outside the mole. We will dredge the basin and build the new quays."
 ITA_pw_the_simplon_approaches: "The Simplon Approaches"
 ITA_pw_the_simplon_approaches_desc: "The tunnel under the mountain will open, and our side of it is a single track winding through the valleys. We will double the approaches so that the traffic of the North does not stop at the frontier."
 ITA_pw_the_sulphur_consortium: "The Sulphur Consortium"
 ITA_pw_the_sulphur_consortium_desc: "The sulphur of the island is sold by men who undercut each other and pay their miners in bread. We will put the trade into a consortium and build the refinery the owners never built."
 ITA_pw_messina_rebuilt: "Messina Rebuilt"
 ITA_pw_messina_rebuilt_desc: "The city is a field of rubble with a plan drawn over it, and the huts were meant to last one winter. We will rebuild it in stone, to the seismic code, and put the works back on the strait."
 ITA_pw_the_calabria_law: "The Calabria Law"
 ITA_pw_the_calabria_law_desc: "The province shakes, the hillsides come down on the villages, and the emigrant ships take whoever is left. We will pass the special law for Calabria and pay for its roads, its forests and its rebuilt towns."
 ITA_wp_plan_west: "Plan West"
 ITA_wp_plan_west_desc: "The staff keeps a plan for the western frontier, and it has not been opened since the last quarrel with Paris. We will bring it up to date, with the passes, the depots and the timetable of the trains."
 ITA_wp_plan_east: "Plan East"
 ITA_wp_plan_east_desc: "There is a plan against the ally in a locked drawer, and nobody has walked the ground it describes. We will work it through: the river line, the mountain sectors, and the railways that would carry the army there."
 ITA_wp_the_libya_expedition: "The Libya Expedition"
 ITA_wp_the_libya_expedition_desc: "An expedition across the sea is a naval problem before it is a military one. We will rehearse the loading, the convoy and the landing beaches until the corps can sail within a fortnight of the order."
 ITA_wp_the_adwa_column: "The Adwa Column"
 ITA_wp_the_adwa_column_desc: "The road up to the highlands is the road on which we lost an army. We will plan the column properly this time: water, transport, and a line of posts behind it."
 ITA_wp_the_adriatic_coast_defence: "The Adriatic Coast Defence"
 ITA_wp_the_adriatic_coast_defence_desc: "Our eastern shore is flat, open, and one night's steaming from the ally's bases. We will fortify the landing places of the Veneto and of Apulia."
 ITA_wp_the_mobilisation_test: "The Alpine Mobilisation Test"
 ITA_wp_the_mobilisation_test_desc: "A mobilisation that has never been tried is a table of figures. We will call up the alpine districts without warning and count what actually reaches the depots."
 ITA_wp_the_alpine_frontier_is_surveyed: "The Alpine Frontier Is Surveyed"
 ITA_wp_the_alpine_frontier_is_surveyed_desc: "The engineers have never mapped the passes on our side as an enemy would read them. We will survey the whole alpine frontier and site the works where the survey tells us to."
 ITA_wp_the_fleet_school_is_chosen: "The Fleet School Is Chosen"
 ITA_wp_the_fleet_school_is_chosen_desc: "The admiralty is split between a fleet for the open sea and a fleet for the narrow one, and the estimates will not pay for both. We will call the board together and make it choose the school."
 ITA_wp_the_class_is_called_early: "The Class Is Called Early"
 ITA_wp_the_class_is_called_early_desc: "The class of the year can be called to the colours before its time, and the country will notice that it has been. We will call it early and take the trouble that follows."
 ITA_wp_the_manoeuvres_of_the_two_armies: "The Manoeuvres of the Two Armies"
 ITA_wp_the_manoeuvres_of_the_two_armies_desc: "The army trains by regiments and has not moved two armies against each other in a decade. We will hold the great manoeuvres and let the staff learn its trade on the ground."
 ITA_mi_the_reshuffle: "The Reshuffle"
 ITA_mi_the_reshuffle_desc: "A ministry that has been in office a season owes something to every group in the Chamber. We will redistribute the portfolios and pay some of those debts."
 ITA_mi_the_confidence_vote: "The Confidence Vote"
 ITA_mi_the_confidence_vote_desc: "The Chamber is talking and the ministry is not governing. We will put the question of confidence and make the groups declare themselves in the division."
 ITA_mi_the_interpellation_answered: "The Interpellation Answered"
 ITA_mi_the_interpellation_answered_desc: "The Extreme Left has an interpellation down on the last shooting, and it will be debated with the galleries full. We will answer it from the tribune ourselves."
 ITA_mi_the_estimates_by_decree: "The Estimates by Decree"
 ITA_mi_the_estimates_by_decree_desc: "The Chamber will not vote the estimates and the arsenals are waiting for the money. We will bring them in by decree and let the deputies protest in the lobby."
 ITA_mi_the_honours_list: "The Honours List"
 ITA_mi_the_honours_list_desc: "Senators are made, crosses are given, and provincial notables are remembered by name. We will publish the list before the session opens."
 ITA_mi_the_resignation_threatened: "The Resignation Threatened"
 ITA_mi_the_resignation_threatened_desc: "A ministry that cannot be replaced may ask for anything it likes. We will lay our resignation on the table and see who in this Chamber wants the succession."
 ITA_mi_the_under_secretary_for_the_left: "The Under-Secretary for the Left"
 ITA_mi_the_under_secretary_for_the_left_desc: "A reformist deputy at a desk in the ministry is worth more to us than the same man making speeches in the piazza. We will offer him the under-secretaryship and let his friends explain it to the party."
 ITA_mi_the_ministry_of_transition: "The Ministry of Transition"
 ITA_mi_the_ministry_of_transition_desc: "The majority has come apart and no group will carry the session on its own. We will form a ministry of transition, hold the machine together, and pay for it in patronage."
 ITA_pr2_subsidise_a_paper: "Subsidise a Paper"
 ITA_pr2_subsidise_a_paper_desc: "Every group in the Chamber has a paper, and every paper has a deficit. We will carry one of them through the session, and it will carry us."
 ITA_pr2_seize_an_edition: "Seize an Edition"
 ITA_pr2_seize_an_edition_desc: "An edition is on the streets calling for the strike by name and by district. We will seize it at the presses and prosecute the editor."
 ITA_pr2_the_agenzia_stefani: "The Agenzia Stefani"
 ITA_pr2_the_agenzia_stefani_desc: "The wire service that speaks for the ministry is read in every chancellery in Europe. We will put it on a proper footing, and the courts of Europe will read us as we wish to be read."
 ITA_pr2_the_war_correspondents: "The War Correspondents"
 ITA_pr2_the_war_correspondents_desc: "The country reads its war in the evening papers, and the papers print what the staff allows them. We will take the correspondents to the front and let them write from it."
 ITA_pr2_the_idea_nazionale: "The Idea Nazionale"
 ITA_pr2_the_idea_nazionale_desc: "The nationalist groups have a review, a lecture circuit and no money at all. We will fund the paper and let it carry the programme into the piazza."
 ITA_pr2_the_avanti_prosecuted: "The Avanti Prosecuted"
 ITA_pr2_the_avanti_prosecuted_desc: "The socialist daily has printed an incitement that a court can read as one. We will prosecute it, take the noise of the trial, and take the silence that follows the verdict."
 ITA_wr_the_transports_at_naples: "The Transports at Naples"
 ITA_wr_the_transports_at_naples_desc: "The expedition is waiting on hulls, and the merchant companies want their season. We will requisition the transports at the quays and load the corps."
 ITA_wr_reprisals_in_the_oases: "Reprisals in the Oases"
 ITA_wr_reprisals_in_the_oases_desc: "The columns are ambushed at the wells, and the villages behind us feed the ambush. We will make the reprisals the officers are asking for and hold the interior by fear."
 ITA_wr_the_islands_as_a_pledge: "The Islands as a Pledge"
 ITA_wr_the_islands_as_a_pledge_desc: "The war on that coast will not end until the enemy feels it at home. We will take the islands of the Aegean and hold them as a pledge for the peace."
 ITA_wr_the_volunteers_of_garibaldi: "The Volunteers of Garibaldi"
 ITA_wr_the_volunteers_of_garibaldi_desc: "The old man's son has the name, and the volunteers are already writing to him. We will let him raise his legion and put it in the line where the name is worth something."
 ITA_wr_the_irredentist_legion: "The Irredentist Legion"
 ITA_wr_the_irredentist_legion_desc: "The students from beyond the frontier are subjects of the enemy, and every one of them has come to enlist. We will form them into an alpine legion and mind where we send it."
 ITA_wr_the_indemnity_loan: "The Indemnity Loan"
 ITA_wr_the_indemnity_loan_desc: "The indemnity is being paid out of the ordinary budget and it is eating the estimates. We will fund it with a loan and be rid of the charge a year early."
 ITA_ad_the_montenegrin_loan: "The Montenegrin Loan"
 ITA_ad_the_montenegrin_loan_desc: "The prince across the water is short of money, and his creditors sit in Vienna. We will lend him ours and take the port and the customs as our security."
 ITA_ad_the_survey_of_valona: "The Survey of Valona"
 ITA_ad_the_survey_of_valona_desc: "The bay is the finest anchorage on the far shore, and nobody has charted it properly since the Venetians. We will send the hydrographers across under a merchant flag."
 ITA_ad_the_bocche_are_watched: "The Bocche Are Watched"
 ITA_ad_the_bocche_are_watched_desc: "The ally exercises his fleet behind the mouths, and our attaches are never invited. We will keep a ship in the strait and let it count what comes out."
 ITA_ad_the_serbian_line_is_financed: "The Serbian Line Is Financed"
 ITA_ad_the_serbian_line_is_financed_desc: "Belgrade wants a railway to the sea that does not pass through the ally's hands. We will find the money for it, and put an Italian port at the end of it."
 ITA_ad_article_twenty_nine_is_invoked: "Article Twenty-Nine Is Invoked Against Vienna"
 ITA_ad_article_twenty_nine_is_invoked_desc: "The treaty that closed the last war on that coast forbids the little kingdom a navy and puts its shore under the ally's police. We will ask Vienna to give the article up, and we will ask in public."
 ITA_ad_the_fleet_visits_cattaro: "The Fleet Visits Cattaro"
 ITA_ad_the_fleet_visits_cattaro_desc: "A fleet that never visits the ally's ports is read as a fleet preparing against him. We will ask for the courtesy visit and read the answer carefully."
 ITA_ad_the_tobacco_regie: "The Tobacco Regie"
 ITA_ad_the_tobacco_regie_desc: "The little kingdom's whole revenue is its tobacco, and the monopoly is for sale. We will take the regie and pay the prince his rent."
 ITA_ad_the_adriatic_squadron_shows_the_flag: "The Adriatic Squadron Shows the Flag"
 ITA_ad_the_adriatic_squadron_shows_the_flag_desc: "The far shore sees the ally's ships every season and ours almost never. We will send the squadron up the coast and let it be seen in every roadstead."
 ITA_me_the_huts: "The Huts"
 ITA_me_the_huts_desc: "The survivors are under canvas and the winter is coming down the strait. We will put up the timber huts and quarter the homeless before the rains."
 ITA_me_the_relief_credit: "The Relief Credit"
 ITA_me_the_relief_credit_desc: "The Chamber will vote anything asked for the strait this session. We will ask for the relief credit and spend it on the water, the roads and the harbour."
 ITA_me_the_foreign_sailors_thanked: "The Foreign Sailors Thanked"
 ITA_me_the_foreign_sailors_thanked_desc: "Foreign squadrons were in the roads before our own were, and their sailors dug our people out of the ruins. We will thank them by name, in public, and remember the debt."
 ITA_me_the_reconstruction_plan: "The Reconstruction Plan"
 ITA_me_the_reconstruction_plan_desc: "The city will be rebuilt where it stood, and the only argument left is how. We will adopt the plan, the building code and the works that go with them."
 ITA_me_the_straits_ferry: "The Straits Ferry"
 ITA_me_the_straits_ferry_desc: "The island and the mainland are joined by a boat that cannot carry a train. We will build the ferry berths and the approaches on both shores."
 ITA_sg_siege_by_telegram: "Siege by Telegram"
 ITA_sg_siege_by_telegram_desc: "A province has stopped obeying its prefect, and the telegraph to it still works. We will proclaim the state of siege there by wire and let the general govern it until it is quiet."
 ITA_sg_the_military_tribunals: "The Military Tribunals"
 ITA_sg_the_military_tribunals_desc: "The civil courts acquit, and the trials drag on for a year while the districts watch. We will send the cases to military tribunals and have them judged in a week."
 ITA_sg_the_press_sequestered: "The Press Sequestered"
 ITA_sg_the_press_sequestered_desc: "The seditious sheets are printed at night in a few cities and read in the morning in all of them. We will sequester the presses and hold the type."
 ITA_sg_the_siege_lifted: "The Siege Lifted"
 ITA_sg_the_siege_lifted_desc: "The state of siege was meant for a season and it has become the way we govern. We will lift it, give the districts back their civil courts, and take the credit for it."
 ITA_sg_the_amnesty: "The Amnesty"
 ITA_sg_the_amnesty_desc: "The prisons hold the men of the last rising, and every one of them is an argument against us. We will proclaim the amnesty and empty the cells."
 ITA_sg_the_carabinieri_reinforced: "The Carabinieri Reinforced"
 ITA_sg_the_carabinieri_reinforced_desc: "Public order is kept by soldiers who were raised for a war, and they keep it badly. We will raise more legions of carabinieri and take the army out of the squares."
 ITA_dec_massawa_railway_tt: "The line climbs from the port into the highlands"
 ITA_dec_benadir_tt: "The southern coast passes to the state, with its askari"
 ITA_dec_ascari_battalion_tt: "Another battalion of askari takes the colours"
 ITA_dec_tripoli_agents_tt: "The notables of the coast are on our list, and the Porte knows it"
 ITA_dec_kufra_caravan_tt: "The lodges of the interior receive us"
 ITA_dec_senussi_subsidy_tt: "The order is paid, and an ungoverned province is governed"
 ITA_dec_sultans_treaties_tt: "The treaties are renewed in the name of the kingdom"
 ITA_dec_lake_tana_tt: "The levels and the passes are filed at the staff"
 ITA_dec_the_zone_is_asked_tt: "London is asked whether our zone is still ours"
 ITA_dec_the_order_is_asked_tt: "The order is asked to keep the interior quiet"
 ITA_dec_customs_at_massawa_tt: "The Emperor is offered a share of the customs"
 ITA_dec_africa_corps_tt: "Africa gets a corps and a staff of its own"
 ITA_dec_apulian_aqueduct_tt: "The aqueduct advances, and the province is quieter for it"
 ITA_dec_direttissima_tt: "The direct line joins the capital to the South"
 ITA_dec_po_dykes_tt: "The lower river is diked"
 ITA_dec_genoa_harbour_tt: "The basin is dredged and the new quays are built"
 ITA_dec_simplon_tt: "The approaches are doubled, and Bern takes note"
 ITA_dec_sulphur_consortium_tt: "The trade is consolidated and the refinery is built"
 ITA_dec_messina_rebuilt_tt: "The city rises again, in stone"
 ITA_dec_calabria_law_tt: "The special law is applied to the province"
 ITA_dec_plan_west_tt: "The western plan is worked through"
 ITA_dec_plan_east_tt: "The plan against the ally is worked through"
 ITA_dec_libya_expedition_tt: "The crossing and the landing are rehearsed"
 ITA_dec_adwa_column_tt: "The column south is planned properly this time"
 ITA_dec_adriatic_coast_tt: "The eastern beaches are fortified"
 ITA_dec_mobilisation_test_tt: "The alpine districts are called without warning"
 ITA_dec_alpine_survey_tt: "The frontier is surveyed, and the works are sited"
 ITA_dec_fleet_school_tt: "The board is called together to choose the school of the fleet"
 ITA_dec_class_called_early_tt: "The class is with the colours, and the country notices"
 ITA_dec_manoeuvres_tt: "Two armies manoeuvre against each other"
 ITA_dec_reshuffle_tt: "Portfolios change hands and the majority is paid"
 ITA_dec_confidence_vote_tt: "The Chamber is made to declare itself"
 ITA_dec_interpellation_tt: "The tribune is answered, and the piazza is not"
 ITA_dec_estimates_by_decree_tt: "The estimates pass without the Chamber"
 ITA_dec_honours_list_tt: "The list is published before the session opens"
 ITA_dec_resignation_threatened_tt: "The succession is offered to whoever will take it"
 ITA_dec_under_secretary_tt: "A reformist takes a desk in the ministry"
 ITA_dec_ministry_of_transition_tt: "A ministry is put together to hold the session"
 ITA_dec_subsidise_a_paper_tt: "A paper is carried through the session"
 ITA_dec_seize_an_edition_tt: "The edition is taken at the presses"
 ITA_dec_agenzia_stefani_tt: "The chancelleries read us as we wish to be read"
 ITA_dec_war_correspondents_tt: "The country reads the war and stays with it"
 ITA_dec_idea_nazionale_tt: "The programme is carried into the piazza"
 ITA_dec_avanti_the_trial_tt: "The trial opens, and the square answers it"
 ITA_dec_avanti_the_verdict_tt: "The verdict comes down and the noise goes out of it"
 ITA_dec_transports_at_naples_tt: "The transports are requisitioned and loaded"
 ITA_dec_reprisals_tt: "The interior is held by fear, and Europe reads the reports"
 ITA_dec_islands_pledge_tt: "The islands are claimed as a pledge for the peace"
 ITA_dec_garibaldi_volunteers_tt: "The legion takes the field under the name"
 ITA_dec_irredentist_legion_tt: "The students from beyond the frontier are in the line"
 ITA_dec_indemnity_loan_tt: "The indemnity is funded and lifted early"
 ITA_dec_montenegrin_loan_tt: "The prince takes our money, and the port goes with it"
 ITA_dec_survey_of_valona_tt: "The bay is charted, and Vienna hears of it"
 ITA_dec_bocche_watched_tt: "A ship keeps count in the strait, and the ally resents it"
 ITA_dec_serbian_line_tt: "The line to the sea is financed"
 ITA_dec_article_twenty_nine_tt: "Vienna is asked to give up the article"
 ITA_dec_fleet_visits_tt: "The courtesy visit is asked for"
 ITA_dec_tobacco_regie_tt: "The monopoly is ours, and the prince is paid his rent"
 ITA_dec_squadron_shows_the_flag_tt: "The far shore sees our flag, and the ally takes offence"
 ITA_dec_the_huts_tt: "The homeless are under a roof before the rains"
 ITA_dec_relief_credit_tt: "The credit is voted and spent on the strait"
 ITA_dec_sailors_thanked_tt: "The foreign squadrons are thanked by name"
 ITA_dec_reconstruction_plan_tt: "The city is rebuilt to the plan and to the code"
 ITA_dec_straits_ferry_tt: "The ferry berths join the island to the mainland"
 ITA_dec_siege_by_telegram_tt: "The province is governed again, and the square pays for it"
 ITA_dec_military_tribunals_tt: "The cases go to the soldiers, and the courts are silent"
 ITA_dec_press_sequestered_tt: "The presses are held and the type is seized"
 ITA_dec_siege_lifted_tt: "The civil courts come back, and the Quirinal grumbles"
 ITA_dec_the_amnesty_tt: "The cells are emptied, and the Crown was not asked"
 ITA_dec_carabinieri_tt: "The Arma is reinforced and the army leaves the squares"
 ITA_dec_tt_the_highlands_answer: "The highlands answer, and the Consulta reads the answer"
 ITA_dec_tt_a_power_reaffirms: "A power reaffirms our zone"
 ITA_dec_tt_the_article_is_struck: "The article is struck out, and the far shore may arm itself"
 ITA_dec_tt_the_roadstead_is_open: "The ally opens his roadstead to our squadron"
 ITA_dec_tt_the_ocean_school: "The fleet is built for the open sea"
 ITA_dec_tt_the_narrow_school: "The fleet is built for the narrow sea"
 ITA_dec_tt_the_interior_stays_quiet: "The order stands aside, and the interior stays quiet"
 ITA_af_threat_the_order_answers: "The Senussi proclaim the holy war against Italy"
 ita_dnc.2224.t: "The Customs Are Offered"
 ita_dnc.2224.d: "The Italians propose to share the receipts of the customs house at the port, where everything our merchants bring up the escarpment is taxed before it reaches us. There is a draft convention with the offer, and a request that our caravans keep to the road they have always used. We may take it up and sign, or leave the paper where it lies and go on paying at the gate."
 ita_dnc.2224.a: "Take it up and sign"
 ita_dnc.2224.b: "Leave the paper where it lies"
 ita_dnc.2225.t: "The Customs Are Taken Up"
 ita_dnc.2225.d: "The convention is signed and the first quarter's receipts are already going up the escarpment. Our consul writes that the party at that court which wants nothing whatever from us has lost a little ground. The Consulta can build on this."
 ita_dnc.2225.a: "The road up the escarpment is open"
 ita_dnc.2226.t: "The Offer Is Not Taken Up"
 ita_dnc.2226.d: "The draft has come back unsigned, with a courteous note about the dignity of an empire. Nobody at the customs house will admit that a refusal was what they expected."
 ita_dnc.2226.a: "File it and wait"
 ita_dnc.2228.t: "The Zone Is Asked About Again"
 ita_dnc.2228.d: "Rome asks whether the agreement of the three powers on the Abyssinian question still stands, and whether the zone it left to Italy is still hers. The question is put in a note that plainly expects an answer we shall have to publish. We may reaffirm the agreement as it was signed, or say nothing and keep our own hands free on the upper river."
 ita_dnc.2228.a: "Reaffirm the zone"
 ita_dnc.2228.b: "Say nothing, and keep our hands free"
 ita_dnc.2229.t: "The Zone Is Reaffirmed"
 ita_dnc.2229.d: "The answer is friendly and it names the zone. The Consulta can quote it in the next conversation with the powers, and the consent we have been counting is worth a little more than it was."
 ita_dnc.2229.a: "Quote it where it matters"
 ita_dnc.2230.t: "No Answer on the Zone"
 ita_dnc.2230.d: "The reply says a great deal about old friendship and nothing at all about the zone. The agreement is not denied, and it is not confirmed either."
 ita_dnc.2230.a: "Then we shall ask again"
 ita_dnc.2232.t: "Rome Asks for the Abrogation of Article Twenty-Nine"
 ita_dnc.2232.d: "The Italians ask us to give up the article of the treaty that keeps the little kingdom across the water from arming its own coast and puts its shore under our maritime police. They ask in a note that their newspapers already have in proof. We may abrogate the article and be thanked for it in Cetinje, or refuse and leave the ministry in Rome to explain the refusal to its own piazza."
 ita_dnc.2232.a: "Give up the article"
 ita_dnc.2232.b: "Refuse, and let them explain it"
 ita_dnc.2233.t: "The Article Is Struck Out"
 ita_dnc.2233.d: "The ally has given up the article, and the shore opposite ours is free of his police. The prince over the water knows perfectly well who asked for it."
 ita_dnc.2233.a: "The coast is free"
 ita_dnc.2234.t: "The Article Stands"
 ita_dnc.2234.d: "The ally will not touch the article, and says so in a note that was written to be read aloud. The papers have it by the evening and the piazza has it by the morning."
 ita_dnc.2234.a: "Let the country read it"
 ita_dnc.2236.t: "The Italian Squadron at Cattaro"
 ita_dnc.2236.d: "The Italians ask for a courtesy visit of their Adriatic squadron to our great roadstead, with the salutes, the dinners and the exchange of officers that go with it. Our admirals do not want them counting the moorings; our diplomats say that a refusal will be printed from Paris to Petersburg. We may receive the squadron properly, or find a reason why this season will not do."
 ita_dnc.2236.a: "Receive them, with the salutes"
 ita_dnc.2236.b: "Find a reason"
 ita_dnc.2237.t: "The Squadron Is Received"
 ita_dnc.2237.d: "The salutes were fired, the dinners were given, and our officers walked the moorings for the best part of a week. They came back with rather more than the admirals opposite meant to show them."
 ita_dnc.2237.a: "Worth the coal it cost"
 ita_dnc.2238.t: "The Roadstead Is Closed to Us"
 ita_dnc.2238.d: "The visit is declined, politely, on account of manoeuvres that nobody can find in the naval lists. The squadron turns back at sea, and every wardroom in the fleet draws the same conclusion about the alliance."
 ita_dnc.2238.a: "The wardrooms have understood"
 ita_dnc.2240.t: "The Admiralty Asks for a School"
 ita_dnc.2240.d: "The board is divided and the estimates will carry only one school. One party wants capital ships that can leave this sea and be counted among the great fleets; the other wants torpedo craft, submarines and coast defence, because the war we shall actually fight will be fought within sight of land. The minister has to choose, and the yards, the academy and the estimates will follow the choice for a generation."
 ita_dnc.2240.a: "Build for the open sea"
 ita_dnc.2240.b: "Build for the narrow sea"
 ita_dnc.2244.t: "Rome Asks the Order to Keep the Interior Quiet"
 ita_dnc.2244.d: "An envoy has come up from the coast with letters from the Italian bank and from the missions, and one request: that the brotherhood keep the oases quiet whatever happens on the shore. He offers subsidies for the lodges, arms for the caravans and a written promise about our schools. We may give the word and stand aside, or preach the holy war and close the wells behind him."
 ita_dnc.2244.a: "Give the word, and stand aside"
 ita_dnc.2244.b: "Preach the holy war"
 ita_dnc.2245.t: "The Interior Stays Quiet"
 ita_dnc.2245.d: "The word has gone out to the lodges of the interior: whatever happens on the shore, the oases will not rise. It has cost the Treasury and the missions between them a great deal, and it is worth an army corps."
 ita_dnc.2245.a: "Worth an army corps"
 ita_dnc.2246.t: "The Order Preaches the War"
 ita_dnc.2246.d: "The brotherhood has answered with a proclamation, and the wells behind the coast are closed to us. Every column that goes inland will have to fight for its water."
 ita_dnc.2246.a: "Then it will be fought for"
 ITA_p_the_league_settles: "The League Has Settled Here"
 ITA_p_the_league_settles_desc: "The white league has its hall, its contract and its own list of the men to be hired first. Fewer of them will go for soldiers, and rather more gets built."
 ITA_c_the_crown: "The Crown"
 ITA_c_the_crown_desc: "There is a King in this kingdom and the Statuto does not say how much of it is his. What he believes he may do is settled by what the last ministry let him do.\n\nThe Crown's hand: §Y[?ITA_crown|0]§! of a hundred.\n\nBelow thirty-five the King listens. From thirty-five to sixty-four he hesitates. At sixty-five and above the King governs."
 ITA_g_the_ministry_of_the_left: "The Ministry of the Left"
 ITA_g_the_ministry_of_the_left_desc: "The majority is not a party but a subscription, renewed session by session with a portfolio here and a public work there. Nothing can be asked of the Chamber until the Extreme Left has had its answer, and every request costs more than the last."
 ITA_g_the_convention_of_paris: "The Convention of Paris"
 ITA_g_the_convention_of_paris_desc: "A labour treaty for our workmen in France, signed in the open and celebrated with a presidential visit. Two governments that were enemies over Tunis now have a document to point at."
 ITA_g_the_rente_converted: "The Rente Converted"
 ITA_g_the_rente_converted_desc: "The Paris market carried the conversion and the coupon on our debt has come down. What was going out in interest goes into ground and mortar instead."
 ITA_g_the_rente_half: "The Half Conversion"
 ITA_g_the_rente_half_desc: "The conversion went through without us at the table, and the saving is real but smaller than it should have been. The houses that did it will remember that the Treasury was not consulted."
 ITA_g_the_conversion_that_failed: "The Conversion That Failed"
 ITA_g_the_conversion_that_failed_desc: "No market would carry the paper, and the Treasury has had to say so out loud. Every ministry that follows will be asked why the coupon was not cut."
 ITA_g_the_state_railways: "The State Railways"
 ITA_g_the_state_railways_desc: "The lines are bought back and run from a desk in Rome. The gauge is the same and the timetable is worse, but the state now decides where the next embankment goes."
 ITA_s_garrison_duty: "Garrison Duty"
 ITA_s_garrison_duty_desc: "Battalions that should be at manoeuvres are standing in market squares with fixed bayonets. The men learn the trade of policemen and forget the trade of soldiers."
 ITA_s_the_protocol: "The Protocol"
 ITA_s_the_protocol_desc: "A police convention against the anarchists, signed with a power that has more experience of them than we have. Names cross the frontier now, and the squares are quieter every month."
 ITA_s_the_powers_silence: "The Powers' Silence"
 ITA_s_the_powers_silence_desc: "We asked the chancelleries what they would say, and not one of them said anything. A government that has been told nothing may do a great deal."
 ITA_s_the_naval_convention: "The Naval Convention"
 ITA_s_the_naval_convention_desc: "Our squadrons and theirs now share a signal book, a coaling plan and a station in the middle sea. The wardrooms study a doctrine written elsewhere and are glad of it."
 ITA_s_the_score_of_tunis_settled: "The Score of Tunis Settled"
 ITA_s_the_score_of_tunis_settled_desc: "The oldest grievance in the kingdom has been paid, and the men who were told to forget it no longer have to. A country that has had its answer is easier to govern."
 ITA_s_bizerte_open: "Bizerte Open"
 ITA_s_bizerte_open_desc: "The works at the great roadstead are levelled and the basin is open water. Nobody keeps a fleet there now, and that is the whole of the bargain."
 ITA_s_the_indemnity: "The Indemnity"
 ITA_s_the_indemnity_desc: "The peace was bought with a sum the Treasury will be paying for years, and the schedule is written in gold. Ministries will be made and unmade over the instalments."
 ITA_s_the_fleet_limited: "The Fleet Limited"
 ITA_s_the_fleet_limited_desc: "The peace fixed what we may lay down, and the yards have been told which slips to close. The naval estimates are now written in another capital."
 ITA_r_the_yards_stopped: "The Yards Stopped"
 ITA_r_the_yards_stopped_desc: "The great arsenal has downed tools and the admirals have written to the King about it. Nothing leaves the slipways until the dispute is settled."
 ITA_r_the_sunday_rest: "The Sunday Rest"
 ITA_r_the_sunday_rest_desc: "One day in seven is closed by law, and the inspectors are being let through the gate at last. The mills lose a shift and the country gains a temper."
 ITA_r_the_berlin_model: "The Berlin Model"
 ITA_r_the_berlin_model_desc: "Our study mission came home with the insurance registers of a state that has been at this longer than we have. The clerks copy the forms and the workmen notice the difference."
 ITA_r_the_crown_and_the_bloc: "The Crown and the Bloc"
 ITA_r_the_crown_and_the_bloc_desc: "The King has taken the majority as he found it, and the majority has stopped asking whether he would. A ministry that need not look over its shoulder gets more done in a morning."
 ITA_r_the_arbitration_clause: "The Arbitration Clause"
 ITA_r_the_arbitration_clause_desc: "A general treaty of arbitration, signed and printed, which sends our quarrels to a table before they reach a frontier. The country approves, and the general staff has stopped reading the newspapers."
 ITA_r_the_war_not_fought: "The War Not Fought"
 ITA_r_the_war_not_fought_desc: "The expedition was talked about, costed and put away in a drawer. The Treasury and the mothers of the south are of one mind for once."
 ITA_r_the_constituent_sits: "The Constituent Sits"
 ITA_r_the_constituent_sits_desc: "An assembly is writing the state down from the beginning, and until it has finished nothing else can be decided. Every ministerial order is provisional and every deputy knows it."
 ITA_r_the_republic: "The Republic"
 ITA_r_the_republic_desc: "The form of the state has changed and the prefects are still addressing their reports to a Crown that is not there. It will settle, but not this year."
 ITA_r_the_guarantees_renewed: "The Guarantees Renewed"
 ITA_r_the_guarantees_renewed_desc: "The new state has renewed, in its own name, the guarantees the old one gave the Holy See. The Pope stayed, and half the quarrel went out with the King."
 ITA_r_the_republic_one_and_indivisible: "The Republic, One and Indivisible"
 ITA_r_the_republic_one_and_indivisible_desc: "The assembly has voted the formula and the army has sworn to it. Whatever else is in dispute, the shape of the state no longer is."
 ITA_z_the_adriatic_line: "The Adriatic Line"
 ITA_z_the_adriatic_line_desc: "Our money built the road to the eastern shore and our houses handle what moves along it. The two small kingdoms across the water trade through Italian ledgers now."
 ITA_z_the_army_that_is_not_ready: "The Army That Is Not Ready"
 ITA_z_the_army_that_is_not_ready_desc: "The general staff has put in writing what the ministry did not want written down. The country has read it too."
 ITA_z_the_war_that_did_not_come: "The War That Did Not Come"
 ITA_z_the_war_that_did_not_come_desc: "The staff across the mountains asked for its war and was refused by its own foreign office. Both frontiers went back to sleep, and ours slept the better of the two."
 ITA_z_the_mobilisation: "The Mobilisation"
 ITA_z_the_mobilisation_desc: "The classes are called, the railways are on the military timetable and the depots are full. The country has never been so ready, and will not be again for a generation."
 ITA_z_the_legions_in_the_street: "The Legions in the Street"
 ITA_z_the_legions_in_the_street_desc: "The volunteer companies did not go home when the crisis passed, and they drill where the prefect can watch them. There are more men under arms than the state has sworn in."
 ITA_z_the_two_shores: "The Two Shores"
 ITA_z_the_two_shores_desc: "One sea, two coasts and one flag over the harbours of both. The freight that used to go round now goes across."
 ITA_z_the_consular_service_reinforced: "The Consular Service Reinforced"
 ITA_z_the_consular_service_reinforced_desc: "Every port and market town of the eastern shore has an Italian consul, a clerk and a subsidy. What the neighbouring staff intends is generally known in Rome before it is signed."
 ITA_k_the_private_channel: "The Private Channel"
 ITA_k_the_private_channel_desc: "No audience, no communique, and a monsignor who calls on a lawyer in a private house. The Catholic courts of Europe have noticed the calm, which is what it was for."
 ITA_k_the_lodges_against_us: "The Lodges Against Us"
 ITA_k_the_lodges_against_us_desc: "The lodges and the Extreme Left have decided that this is a clerical ministry and obstruct it as such. Everything must be carried twice, and paid for twice."
 ITA_k_the_missions: "The Missions Shared"
 ITA_k_the_missions_desc: "The protectorate of the Catholic missions in the east is exercised by two courts instead of one, and one of them is ours. Our houses in the Levant trade under our own flag at last."
 ITA_k_the_chairs_of_the_state: "The Chairs of the State"
 ITA_k_the_chairs_of_the_state_desc: "The state has kept its chairs and told the Curia that a professor answers to the ministry which pays him. The faculties are noisier and the work is better."
 ITA_k_the_conciliation: "The Conciliation"
 ITA_k_the_conciliation_desc: "The oldest quarrel in the kingdom has been signed away, and the Pope is a sovereign again on a few hectares of garden. Half the country has stopped choosing between its parish and its passport."
 ITA_k_the_catholic_kingdom: "The Catholic Kingdom"
 ITA_k_the_catholic_kingdom_desc: "The altar and the throne stand together, and the electoral union delivers what it undertook to deliver. The barracks fill without a quarrel and the sacristies count the ballots."
 ITA_k_the_christian_democrats: "The Christian Democrats"
 ITA_k_the_christian_democrats_desc: "A Catholic party that answers to its voters before its bishops now sits in the Chamber under its own name. The country is steadier and the ministry is watched from a new quarter."
 ITA_k_the_concordat: "The Concordat"
 ITA_k_the_concordat_desc: "Marriage, the schools and the seminaries are settled in a single instrument signed by both sovereigns. What used to be argued in the newspapers is now argued between lawyers."
 ITA_v_the_madrid_convention: "The Madrid Convention"
 ITA_v_the_madrid_convention_desc: "A young Catholic king came to Rome, and a commercial treaty was signed while he was here. The Curia was displeased and the merchants of the Tyrrhenian were not."
 ITA_v_the_crown_and_the_altar: "The Crown and the Altar"
 ITA_v_the_crown_and_the_altar_desc: "The King has consented to be spoken for, and the ministry and the Quirinal say the same thing to the Vatican. A government that speaks with one voice is obeyed with fewer letters."
 ITA_v_the_missions: "The Protection of Our Own"
 ITA_v_the_missions_desc: "The Porte has recognised that Italian religious in the Levant are protected by Italy and by nobody else. It is a small paper, and every chancellery has read it."
 ITA_v_the_curia_is_cold: "The Curia Is Cold"
 ITA_v_the_curia_is_cold_desc: "The offer was made, and the answer was that the Holy Father remains a prisoner. Nothing can be asked of that quarter until the frost lifts."
 ITA_v_the_prisoner_remains: "The Prisoner Remains"
 ITA_v_the_prisoner_remains_desc: "The Conciliation was within a day of signature and the Secretariat of State stopped it. The country was promised an end to the quarrel and has been handed the quarrel back."
 ITA_e_the_bank_of_italy: "The Bank of Italy"
 ITA_e_the_bank_of_italy_desc: "One bank of issue, one discount rate, and a director whom the other houses obey. Credit reaches the yards and the building sites at a price they can pay."
 ITA_n_the_coal_of_cardiff: "The Coal of Cardiff"
 ITA_n_the_coal_of_cardiff_desc: "Our bunkers are filled under a long contract and our colliers sail in convoy behind our own escorts. A country with no coal of its own has at least made the carriage safe."
 MNT_the_coast_policed: "The Coast Is Policed"
 MNT_the_coast_policed_desc: "Foreign gunboats keep order in our roadsteads and foreign engineers survey our harbours. Nothing is built along this shore that the visitors have not approved."
 ITA_giuseppe_saracco: "Giuseppe Saracco"
 ITA_giuseppe_saracco_desc: "The ministry of transition, kept in a drawer at the Senate and taken out when nobody else will serve. He will hold the seals for exactly as long as the Chamber needs to decide what it wants."
 ITA_alessandro_fortis: "Alessandro Fortis"
 ITA_alessandro_fortis_desc: "The locum, a Romagnol who was a republican before he was a minister and still argues like one. He will keep the chair warm and buy the railways while he is sitting in it."
 ITA_ettore_sacchi: "Ettore Sacchi"
 ITA_ettore_sacchi_desc: "The radical, who wants the franchise widened, the clergy out of the schools and the Chamber sitting oftener. He will vote with anybody who gives him one of the three."
 ITA_filippo_turati: "Filippo Turati"
 ITA_filippo_turati_desc: "The reformist who edits the review the whole Left reads and will not take office without the party's leave. Offer him labour and the leagues come in behind him."
 ITA_leonida_bissolati: "Leonida Bissolati"
 ITA_leonida_bissolati_desc: "The reformist of the party paper, who holds that a socialist may serve the state without ceasing to be one. His motion has split the congress twice."
 ITA_rinaldo_rigola: "Rinaldo Rigola"
 ITA_rinaldo_rigola_desc: "The secretary of the confederation, who counts subscriptions rather than speeches and calls the general strike a weapon that rusts. What he signs, the chambers of labour keep."
 ITA_arturo_labriola: "Arturo Labriola"
 ITA_arturo_labriola_desc: "The revolutionary syndicalist of Naples, who despises the ballot and believes in the strike that does not stop. He is heard further in the south than any deputy."
 ITA_napoleone_colajanni: "Napoleone Colajanni"
 ITA_napoleone_colajanni_desc: "The republican dean, a Sicilian who has been proving with figures that the south is robbed for longer than most deputies have sat. He is the only republican the moderates will listen to."
 ITA_ernesto_nathan: "Ernesto Nathan"
 ITA_ernesto_nathan_desc: "The mayor of the Capitol and Grand Master of the lodges, who lights the streets, builds the schools and says at the anniversary of the breach precisely what the Vatican dreads. The city has never been better run or worse loved across the river."
 ITA_filippo_meda: "Filippo Meda"
 ITA_filippo_meda_desc: "The Catholic deputy, elected where no Catholic was supposed to stand, who reads the ban loosely and votes for order. He is the standing proof that the pews can be counted."
 ITA_ottorino_gentiloni: "Ottorino Gentiloni"
 ITA_ottorino_gentiloni_desc: "The count who keeps the lists of the electoral union and knows which candidate signed which undertaking. Nothing is written down that a bishop would ever have to disown."
 ITA_giuseppe_toniolo: "Giuseppe Toniolo"
 ITA_giuseppe_toniolo_desc: "The social Catholic of the popular union, who teaches that a wage is a moral question before it is an economic one. The white leagues quote him at their meetings."
 ITA_romolo_murri: "Romolo Murri"
 ITA_romolo_murri_desc: "The suspended priest of the democratic league, who wants a Catholic party answerable to its voters. Rome has already told him twice to be quiet."
 ITA_ernesto_pacelli: "Ernesto Pacelli"
 ITA_ernesto_pacelli_desc: "The Pope's banker, who lends where the Holy See wishes to be seen and then asks the Consulta for an escort. His branch reaches Tripoli before our consul does."
 ITA_bonaldo_stringher: "Bonaldo Stringher"
 ITA_bonaldo_stringher_desc: "The director of the bank of issue, who held the lira steady through a panic that broke better houses than ours. Ministers call on him, and not the other way about."
 ITA_giulio_prinetti: "Giulio Prinetti"
 ITA_giulio_prinetti_desc: "A bicycle manufacturer at the Consulta, blunt with ambassadors and quick with a decree. He exchanged the letters that no ally has yet been shown."
 ITA_emilio_visconti_venosta: "Emilio Visconti Venosta"
 ITA_emilio_visconti_venosta_desc: "The old hand of the Consulta, brought back whenever a conference must be attended and nothing must be conceded. He has outlived the men who taught him the trade."
 ITA_antonino_di_san_giuliano: "Antonino di San Giuliano"
 ITA_antonino_di_san_giuliano_desc: "A Sicilian marquis who has read every treaty and believes none of them. He asks for the eastern shore in a tone which suggests he is doing everyone a favour."
 ITA_luigi_federzoni: "Luigi Federzoni"
 ITA_luigi_federzoni_desc: "The nationalist journalist who gave the idea its paper and the paper its readers. He wants the emigrants to leave as soldiers rather than as passengers."
 ITA_gabriele_dannunzio: "Gabriele D'Annunzio"
 ITA_gabriele_dannunzio_desc: "The poet of the ship, who can fill a theatre and a recruiting office in the same week. His debts are as celebrated as his verse."
 ITA_cesare_battisti: "Cesare Battisti"
 ITA_cesare_battisti_desc: "The socialist of Trento, who edits an Italian paper under an imperial censor and keeps a map of the valleys on his wall. He is a subject of the Emperor and the guest of every Italian faculty."
 ITA_alceste_de_ambris: "Alceste De Ambris"
 ITA_alceste_de_ambris_desc: "The syndicalist of Parma, who took a whole province out on strike and fed it from soup kitchens. The prefect sent cavalry and made him a legend."
 ITA_ferdinando_martini: "Ferdinando Martini"
 ITA_ferdinando_martini_desc: "The civil governor, a man of letters who ran a colony with a budget, a school and no punitive columns. He is the answer to everyone who says Africa can only be held with the sword."
 ITA_ernesto_teodoro_moneta: "Ernesto Teodoro Moneta"
 ITA_ernesto_teodoro_moneta_desc: "A Garibaldian who has spent his old age arguing that wars are settled more cheaply at a table. The prize he was given abroad is quoted against him at home."
 ITA_salvatore_barzilai: "Salvatore Barzilai"
 ITA_salvatore_barzilai_desc: "A republican deputy born under the double eagle, who speaks for the unredeemed cities in a chamber that is not supposed to mention them. He votes against the ministry and for the fleet."
 ITA_luigi_albertini: "Luigi Albertini"
 ITA_luigi_albertini_desc: "The editor of the great Milanese daily, who turned a newspaper into an institution and the institution into an opposition. Ministers read him before they read their prefects."
 ITA_tancredi_saletta: "Tancredi Saletta"
 ITA_tancredi_saletta_desc: "The chief of staff of the long peace, who plans for the Alpine wall and declines to plan for anything else. He will tell the ministry the army is not ready, and he will be right."
 ITA_ettore_pedotti: "Ettore Pedotti"
 ITA_ettore_pedotti_desc: "A minister of war who counts blankets, boots and remounts and leaves the speeches to others. The depots have been in order since he took them over."
 ITA_carlo_mirabello: "Carlo Mirabello"
 ITA_carlo_mirabello_desc: "A minister of the marine who believes in the line of battle and has laid down the hulls to prove it. He would rather have a few good ships than a fleet of coastal ones."
 ITA_giovanni_bettolo: "Giovanni Bettolo"
 ITA_giovanni_bettolo_desc: "A sailor turned minister whose name is tied to the steel works and to the contracts that came with them. He is trusted at sea and watched on shore."
 ITA_enrico_corradini_desc: "The president of the association, who tells the country it is a proletarian nation and that emigration is a defeat. He wants the men who sail for the plate to sail for a colony instead."
 ITA_giulio_douhet_theorist: "Giulio Douhet"
 ITA_giulio_douhet_theorist_desc: "An artillery officer who has decided that the next war will be settled above the trenches and writes about nothing else. The staff calls him a nuisance and reads every page."
 ITA_maurizio_moris_air_chief: "Maurizio Mario Moris"
 ITA_maurizio_moris_air_chief_desc: "The engineer officer who built the first shed at the aerodrome outside Rome and put the army into the air. Every Italian pilot has passed through a school he founded."
 ITA_g_tt_the_prefects_are_open: "The decisions of the Prefects are open."
 ITA_g_tt_the_emigration_office_is_open: "The decisions of Emigration are open, and the indemnity may be asked for a second time."
 ITA_g_tt_the_church_is_open: "The decisions of the Church are open."
 ITA_g_tt_the_south_is_open: "The decisions of the South are open."
 ITA_g_tt_the_chamber_is_open: "The decisions of the Chamber are open."
 ITA_g_tt_the_chamber_may_be_dissolved: "The next dissolution of the Chamber will cost the ministry nothing."
 ITA_g_tt_the_sacristy_list: "The Sacristy List may be drawn up if the Church answers for the ballot."
 ITA_g_tt_nathan_is_available: "The mayor of the Capitol may serve the ministry as an adviser, if the Capitol says yes."
 ITA_g_tt_the_remittance_office_is_cheap: "The Remittance Office will open for half of what it would have cost."
 ITA_g_tt_the_boards_sit_free: "The Boards of Conciliation will sit once without charge."
 ITA_g_tt_the_passage_is_watched: "Our consuls inspect the estates and the wages are paid in coin."
 ITA_g_tt_the_wine_duties_fall: "The duties on wine fall on both sides of the mountains."
 ITA_g_tt_the_vatican_protests: "The Vatican protests at the reception of a foreign head of state in the palace of the Popes."
 ITA_v_tt_the_file_comes_round: "The file is left with the Porte and the consulates are told to ask again when the season changes."
 ITA_g_tt_the_protest_is_private: "The protest is made in a letter that nobody outside the Curia will read, and the private channel stays open."
 ITA_g_tt_the_visit_is_postponed: "The visit is postponed and the convention lapses."
 ITA_g_tt_the_corn_duty_is_kept: "The duty on foreign corn is kept."
 ITA_g_tt_the_island_is_ungoverned: "The province is out of the prefect's hands for a year."
 ITA_g_tt_the_catholic_vote_returns: "Where the sacristies open, the returns come back to the ministry."
 ITA_g_tt_the_railway_law_passes: "The railway law passes and the lines pass to the State."
 ITA_g_the_strike_threat: "Italy on general strike"
 ita_dnc.1713.t: "Rome Proposes the Police Protocol"
 ita_dnc.1713.d: "The Italian ambassador proposes that our police and theirs exchange lists of anarchists, photographs and sailings, and that each expel what the other names. The draft is the one our own ministry drew up and could not get the western courts to sign.\n\nRome offers to sign it first. The question is whether an Italian ministry can be trusted with our lists, and whether Berlin should be brought in before we answer."
 ita_dnc.1713.a: "Sign with Rome."
 ita_dnc.1713.b: "Berlin should sign before we do."
 ita_dnc.1796.t: "The Protocol Needs Berlin"
 ita_dnc.1796.d: "Petersburg will not sign a police convention with Rome unless we sign it too, and has said so through their ambassador. The draft binds every signatory to expel what the others name.\n\nThe Chancellor can put our name to it and let the eastern courts have their convention, or leave Rome to be disappointed."
 ita_dnc.1796.a: "Berlin signs as well."
 ita_dnc.1796.b: "Let them settle it between themselves."
 ITA_s_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_s_tt_the_crown: "The King's hold on his ministers: §Y[?ITA_crown|0]§!"
 ITA_s_tt_the_programme_waits: "The programme waits for a new reign, and nothing more of it can be taken until the Crown stands behind it."
 ITA_s_tt_the_royal_decree_is_unlocked: "The Royal Decree may now be laid before the country from among the decisions of the Crown."
 ITA_s_tt_the_cassation_must_answer_first: "Nothing else will pass this Chamber until the Court has been asked again."
 ITA_s_tt_berlin_reads_the_conflict: "Berlin has read our constitutional conflict and has drawn its own parallel with it."
 ITA_s_tt_berlin_says_nothing: "Berlin says nothing, which is neither a blessing nor a warning."
 ITA_s_tt_the_islands_are_opened: "The Anarchists Are Sent to the Islands becomes available among the decisions of the Piazza."
 ITA_s_tt_petersburg_wants_berlin_first: "Petersburg will not put its name to the protocol until Berlin has put down its own."
 ITA_s_tt_the_colony_is_watched: "The colony abroad is watched and its clubs are reported on."
 ITA_s_tt_the_federal_law_does_not_allow_it: "We are told that the federal law does not allow it, and there the matter rests."
 ITA_s_tt_berlin_declines_the_protocol: "Berlin declines the protocol, and Petersburg will not move without it."
 ITA_s_tt_the_arma_is_doubled: "The Arma is doubled in place of the garrisons, and the squares are policed by gendarmes."
 ITA_s_tt_the_questore_is_free: "The Questore Is Replaced costs the ministry nothing once the guards hold the streets."
 ITA_s_tt_one_session_only: "The Chamber is prorogued for a single session and will have to be faced again."
 ITA_s_tt_the_estimates_by_decree: "The Estimates by Decree becomes available among the decisions of the Ministry once the King's ministry holds."
 ITA_s_tt_the_powers_say_nothing: "The powers say nothing, and their newspapers say it for them."
 ITA_s_tt_the_lists_are_made: "The new lists are drawn in every province and will be read at the next returns."
 ITA_s_meda_in_the_ministry: "The Catholic Deputy in the Ministry"
 ITA_s_meda_in_the_ministry_desc: "The Electoral Union names him and the bishops do not disown him, which is the whole of his qualification and quite enough of it."
 ITA_s_tt_the_ban_is_not_lifted: "The ban on the polls is not lifted, and the Catholic vote stays where it was."
 ITA_s_tt_the_offer_is_refused: "The quarter beyond the river is refused, and the Roman question closes again."
 ITA_s_tt_the_royal_commissioner: "The Royal Commissioner becomes available among the decisions of the Crown once the South is administered."
 ITA_s_tt_the_plans_are_reviewed: "The plans against us are taken out and read again at the other staff."
 ITA_s_tt_berlin_stays_at_home: "Berlin stays at home and sends a telegram."
 ITA_s_threat_torniamo_allo_statuto: "Torniamo allo Statuto"
 ITA_s_threat_the_chamber_is_sent_home: "The Chamber Is Sent Home"
 ITA_s_salandra_keeper_of_the_seals: "Keeper of the Seals"
 ITA_s_salandra_keeper_of_the_seals_desc: "The bill of interpretation was drafted in his room, and the bench will hear from him before it hears from anyone else."
 ITA_s_pelloux_at_the_interior: "The General at the Interior"
 ITA_s_pelloux_at_the_interior_desc: "He has held a ministry and he has held a corps, and he has never thought the two so very different."
 ITA_r_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_r_tt_the_price_of_entry: "The price of the Bloc: the street loses patience with a ministry that has taken the oath, the prefects lose their instructions, the Court withdraws its confidence, and the Vatican is against us from the first day."
 ITA_r_tt_turati_takes_the_portfolio: "Turati takes the Ministry of Labour, and the Interior is bound to keep the troops out of the squares."
 ITA_r_tt_bissolati_takes_the_portfolio: "Bissolati takes the portfolio instead, and he brings no party with him."
 ITA_r_tt_the_bloc_takes_the_floor: "The decisions of the Popular Bloc are open for as long as the Bloc governs."
 ITA_r_tt_the_register_of_five_millions: "The Register of Five Million becomes available among the decisions of the Chamber once the new electorate is voted."
 ITA_r_tt_the_register_is_read_for_us: "The register is widened now and read at the next returns, where the new colleges answer for the Bloc."
 ITA_r_tt_rigola_takes_the_chair: "The secretary of the Confederation of Labour is available to the ministry as an adviser."
 ITA_r_tt_the_school_against_the_parish: "The School Against the Parish becomes available among the decisions of the Popular Bloc."
 ITA_r_tt_the_womens_work_law: "The Women's Work Law becomes available among the decisions of the Popular Bloc."
 ITA_r_tt_no_answer_comes: "There is no government in that capital to answer us, and the question falls."
 ITA_r_tt_the_convention_is_offered: "The invitation and the draft convention go out together, and the answer will come from the other side of the Alps."
 ITA_r_tt_luzzatti_is_called: "Luzzatti is called in for the insurance bill and is available to the ministry as an adviser."
 ITA_r_tt_the_mission_comes_home: "The mission comes home with notes, courtesies and no signature."
 ITA_r_tt_the_visit_is_adjourned: "The visit is adjourned to a season that is never named."
 ITA_r_tt_the_pension_fund: "The Pension Fund becomes available among the decisions of the Popular Bloc once the insurance is law."
 ITA_r_tt_the_militia_or_the_staff: "The general staff answers the bill, and its answer decides whether we get the militia establishment or a new chief of staff."
 ITA_r_tt_cadorna_takes_the_staff: "Cadorna takes the general staff, and he is available to the ministry as an adviser."
 ITA_r_tt_the_strike_fund: "The Strike Fund Is Counted becomes available among the decisions of the Popular Bloc once the Confederation is recognised."
 ITA_r_tt_the_appeal_to_the_king: "The Curia carries the quarrel over the head of the ministry, and the King will remember it when the bills of the Bloc reach him."
 ITA_r_tt_the_massawa_railway: "The Massawa Railway becomes available among the decisions of the Colonies."
 ITA_r_tt_the_bank_asks_the_consulta: "The bank carries its case to the Consulta, where the Banco di Roma Instead becomes the likelier answer to the Tripoli question."
 ITA_r_threat_vienna_answers: "Vienna answers the shortened service"
 ita_dnc.1604.t: "Rome Asks for the Italian Faculty at Trieste"
 ita_dnc.1604.d: "The Italian ambassador asks that the law faculty promised to our Italian subjects be opened at Trieste, where they live, and not in a German town where they can be watched.\n\nThe Statthalter answers that a faculty at Trieste is a claim with a lecture hall. The Hungarians do not care. The Emperor would like the noise to stop."
 ita_dnc.1604.a: "Give them the faculty at Trieste."
 ita_dnc.1604.b: "Refuse. Innsbruck will do, or nothing will."
 ita_dnc.1604.c: "Offer the faculty here, under our own eye."
 ita_dnc.1605.t: "Rome Asks That the Lega Nazionale Be Left Alone"
 ita_dnc.1605.d: "The Italian consulates at Trieste, Zara and Spalato pay the schoolmasters of the Lega Nazionale, and Rome asks that this be tolerated as it has been tolerated for a generation.\n\nThe police at Zara would rather expel the consul and close the schools. The Foreign Ministry would rather sell the toleration than give it away."
 ita_dnc.1605.a: "Tolerate the consuls and their schools."
 ita_dnc.1605.b: "Expel the consul at Zara and close the schools."
 ita_dnc.1605.c: "Tolerate them, if the Lega Nazionale is dissolved."
 ita_dnc.1606.t: "The Night at Innsbruck"
 ita_dnc.1606.d: "The faculty was refused and our students went to hear the lecture anyway. The town rose against them and the gendarmes arrested the lecturers along with the rioters.\n\nBy morning the whole affair is in every Italian paper, with the names of the arrested printed like a casualty list."
 ita_dnc.1606.a: "The provinces have a night to remember."
 ita_dnc.1609.t: "The Lega Is Asked to Close Its Doors"
 ita_dnc.1609.d: "Vienna will leave our consuls alone if the Lega Nazionale is dissolved by our own hand.\n\nThe Lega is a society of schoolmasters and a subscription list. It is also the only Italian institution left in Dalmatia. We can sign the dissolution, or tell the ambassador what he already expects to hear."
 ita_dnc.1609.a: "Dissolve the Lega. The consuls are worth more."
 ita_dnc.1609.b: "Refuse. Let them do their own closing."
 ita_dnc.1614.t: "A Faculty in the Wrong Town"
 ita_dnc.1614.d: "The faculty is offered in the capital, under the eye of the police, and the word Trieste does not appear anywhere in the decree.\n\nOur students would have their degrees. The committees would have a grievance instead, and they would rather have the grievance."
 ita_dnc.1614.a: "Take the faculty where it is offered."
 ita_dnc.1614.b: "Refuse. It is Trieste or nothing."
 ita_dnc.1616.t: "Rome Offers to Finance the Line to Medua"
 ita_dnc.1616.d: "The Italians offer the capital, the engineers and the rolling stock for a railway from the Danube to a harbour that is not Austrian.\n\nPetersburg has encouraged the scheme warmly and has not paid for any part of it. The syndicate wants an answer before the season closes."
 ita_dnc.1616.a: "Take the Italian money and build the line."
 ita_dnc.1616.b: "Ask Petersburg first."
 ita_dnc.1617.t: "The Concession Through Albania"
 ita_dnc.1617.d: "The line the Serbs want must cross our Albanian sanjaks to reach the sea, and the concession is ours to grant or to withhold.\n\nGranting it brings money, and Italian engineers, into a province we barely hold. Withholding it leaves the Serbs exactly where they are."
 ita_dnc.1617.a: "Grant the concession."
 ita_dnc.1617.b: "Refuse it. The province is quiet enough."
 ita_dnc.1618.t: "Petersburg Is Asked About the Line"
 ita_dnc.1618.d: "Belgrade will not take Italian money for the railway until we say what we think of it.\n\nThe line breaks the Austrian hold on the Sandjak, which is what we want. It also puts Italy on the Albanian shore, which is not. We can back it, or send the question back to Vienna where it will die."
 ita_dnc.1618.a: "Back the line, and let the Italians pay for it."
 ita_dnc.1618.b: "Send them to Vienna. It is an Austrian question."
 ita_dnc.1623.t: "Rome Will Not Close the Lega"
 ita_dnc.1623.d: "Rome has refused to dissolve the Lega Nazionale, and the consul at Zara has been instructed to go on paying its schoolmasters as before.\n\nThe police have the expulsion order drawn. The Statthalter would like it signed today."
 ita_dnc.1623.a: "Expel the consul and close the schools."
 ita_dnc.1634.t: "Berlin Asks Vienna to Pay"
 ita_dnc.1634.d: "Berlin has asked us, as plainly as one ally may ask another, to settle with Rome before the Italians make their claim in public.\n\nThe evacuation of the Sandjak and a faculty would cost us very little. The alternative costs us the alliance and an army on the Isonzo."
 ita_dnc.1634.a: "Pay them the Sandjak and the faculty."
 ita_dnc.1638.t: "Berlin Stands Behind Vienna"
 ita_dnc.1638.d: "Vienna asks what we will do if Rome presses her claim, and Rome asks what we will do if Vienna refuses it.\n\nThe staff would rather not choose. The Chancellor observes that only one of the two has an army we have ever counted on for the Rhine."
 ita_dnc.1638.a: "Stand behind Vienna."
 ita_dnc.1638.b: "Press Vienna to pay."
 ita_dnc.1639.t: "Izvolsky Proposes Racconigi"
 ita_dnc.1639.d: "Vienna has refused Rome her compensation, and the Italians are looking about them for a friend.\n\nA meeting at a royal shooting box would cost us nothing and could be made to mean a great deal. Or we can wait until they need us rather more than they do now."
 ita_dnc.1639.a: "Propose the meeting."
 ita_dnc.1639.b: "Wait. They will come again."
