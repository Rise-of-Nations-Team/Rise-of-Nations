 ita_dnc.2360.t: "The Rise of a Minister"
 ita_dnc.2360.d: "Three chairs stand at the council table and all three are taken. The King has been given a fourth name, and the Quirinal does not enlarge its councils to please a Chamber. One of the men now sitting will read of his dismissal in the morning papers, unless the name is withdrawn before the ink dries."
 ita_dnc.2360.a: "The first chair is given up"
 ita_dnc.2360.b: "The second chair is given up"
 ita_dnc.2360.c: "The third chair is given up"
 ita_dnc.2360.e: "The Crown withholds its confidence"
 ita_dnc.2361.t: "The King Calls Another"
 ita_dnc.2361.d: "The ministry has done what it was called to do, and the men who did it have grown larger than the offices that hold them. At the Quirinal the King keeps the only list that matters, and no vote of the Chamber may add a name to it. He will read one of them aloud, or he will keep the list closed."
 ita_dnc.2361.a: "Let the first man form it"
 ita_dnc.2361.b: "Let the second man form it"
 ita_dnc.2361.c: "Let the third man form it"
 ita_dnc.2361.e: "The country is not ready"
 ita_dnc.2362.t: "The Minister's Duties"
 ita_dnc.2362.d: "The Interior has grown into two houses that do not speak to one another: the reserved office with its cards, and the guards who stand in the squares. The Minister has the time and the money to build one of them properly, and the other will wait for a successor. Which is it to be?"
 ita_dnc.2362.a: "The office and its cards"
 ita_dnc.2362.b: "The guards in the squares"
 ita_dnc.2363.t: "The Quarrel of the Purse"
 ita_dnc.2363.d: "Three men now claim the last word over the estimates, and each holds letters from the others that read badly in daylight. The Chamber has noticed, the papers have noticed, and no ministry carries a budget while such a quarrel lasts. The King is asked to settle it."
 ita_dnc.2363.a: "Industry shall prevail"
 ita_dnc.2363.b: "The Bank shall prevail"
 ita_dnc.2363.c: "The Treasury shall prevail"
 ita_dnc.2363.e: "The Crown will not arbitrate"
 ita_dnc.2364.t: "Nitti Takes Up a File"
 ita_dnc.2364.d: "The Minister goes through the papers on his desk and settles on the one he means to finish."
 ita_dnc.2364.a: "Very well."
 ita_dnc.2365.t: "Nitti Closes a File"
 ita_dnc.2365.d: "The Minister sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2365.a: "Very well."
 ita_dnc.2366.t: "Stringher Takes Up a File"
 ita_dnc.2366.d: "The governor of the Bank sets aside the correspondence and settles on the work he means to finish."
 ita_dnc.2366.a: "Very well."
 ita_dnc.2367.t: "Stringher Closes a File"
 ita_dnc.2367.d: "The governor sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2367.a: "Very well."
 ita_dnc.2368.t: "Luzzatti Takes Up a File"
 ita_dnc.2368.d: "The Treasury clears its desk of everything that is not the one operation it means to finish."
 ita_dnc.2368.a: "Very well."
 ita_dnc.2369.t: "Luzzatti Closes a File"
 ita_dnc.2369.d: "The Treasury sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2369.a: "Very well."
 ita_dnc.2370.t: "Giolitti Takes Up a File"
 ita_dnc.2370.d: "The Interior reads what the prefectures have sent and settles on the work it means to finish."
 ita_dnc.2370.a: "Very well."
 ita_dnc.2371.t: "Giolitti Closes a File"
 ita_dnc.2371.d: "The Interior sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2371.a: "Very well."
 ita_dnc.2372.t: "Orlando Takes Up a File"
 ita_dnc.2372.d: "Public Instruction sets its clerks on the one law it means to carry through the Chamber."
 ita_dnc.2372.a: "Very well."
 ita_dnc.2373.t: "Orlando Closes a File"
 ita_dnc.2373.d: "Public Instruction sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2373.a: "Very well."
 ita_dnc.2374.t: "Sacchi Takes Up a File"
 ita_dnc.2374.d: "The chancellor of the majority counts his people in the lobbies and settles on the work he means to finish."
 ita_dnc.2374.a: "Very well."
 ita_dnc.2375.t: "Sacchi Closes a File"
 ita_dnc.2375.d: "The chancellor sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2375.a: "Very well."
 ita_dnc.2376.t: "Salandra Takes Up a File"
 ita_dnc.2376.d: "The chancellor of the majority counts his people in the lobbies and settles on the work he means to finish."
 ita_dnc.2376.a: "Very well."
 ita_dnc.2377.t: "Salandra Closes a File"
 ita_dnc.2377.d: "The chancellor sends up the finished work, and the notice that reaches the country carries his name."
 ita_dnc.2377.a: "Very well."
 ITA_h_the_council_dm: "The Council of Seven"
 ITA_h_the_council_dm_desc: "The King lends three chairs at the council table and takes them back when he pleases. The ministers who sit in them do not wait to be told what to do: each works his own branch of the government and finishes it in his own time, and the notice that reaches the country carries his name and not ours."
 ITA_h_the_council_dm_tt: "The King has lent three seats at the council table, and they are held by §Y[GetITACouncilSeatOne]§!, §Y[GetITACouncilSeatTwo]§! and §Y[GetITACouncilSeatThree]§!. \nEach minister seated works his own branch and finishes it without being told."
 ITA_h_nitti_minister_of_industry: "Nitti at the Ministry of Industry"
 ITA_h_nitti_minister_of_industry_desc: "He believes the State can make an industry where none has grown by itself, and he means to spend our money proving it."
 ITA_h_nitti_minister_of_industry_and_labour: "Ministry of Industry and Labour"
 ITA_h_stringher_at_the_bank: "Stringher at the Bank"
 ITA_h_stringher_at_the_bank_desc: "The governor keeps the note issue steady and the failing houses upright, and he expects the Treasury to keep out of it."
 ITA_h_stringher_plenipotentiary_of_credit: "Plenipotentiary of Credit"
 ITA_h_luzzatti_at_the_treasury: "Luzzatti at the Treasury"
 ITA_h_luzzatti_at_the_treasury_desc: "The markets answer him when they answer nobody else, and he intends to spend that credit on the debt before anything else."
 ITA_h_luzzatti_plenipotentiary_of_the_treasury: "Plenipotentiary of the Treasury"
 ITA_h_giolitti_at_the_interior: "Giolitti at the Interior"
 ITA_h_giolitti_at_the_interior_desc: "He holds the prefects, the police and the electoral machine, and he has never confused the ministry with anything else."
 ITA_h_giolitti_the_interior_reorganised: "The Interior Reorganised"
 ITA_h_giolitti_master_of_the_prefects: "Master of the Prefects"
 ITA_h_orlando_at_public_instruction: "Orlando at Public Instruction"
 ITA_h_orlando_at_public_instruction_desc: "A jurist in a ministry of clerks, he means to legislate the schools into existence rather than wait for the communes."
 ITA_h_orlando_makes_italians: "The Ministry That Makes Italians"
 ITA_h_sacchi_and_the_extreme: "Sacchi and the Extreme"
 ITA_h_sacchi_and_the_extreme_desc: "The radicals sit inside the cabinet now, which costs the ministry its quiet and gains it their votes."
 ITA_h_sacchi_the_leagues_in_the_majority: "The Leagues in the Majority"
 ITA_h_sacchi_first_among_equals: "First Among Equals"
 ITA_h_salandra_and_the_right: "Salandra and the Right"
 ITA_h_salandra_and_the_right_desc: "The constitutional Right sits inside the cabinet now, and it will vote for anything that keeps the prefects busy."
 ITA_h_salandra_the_prefects_deliver: "The Prefects Deliver"
 ITA_h_salandra_the_grey_eminence: "The Grey Eminence"
 ITA_h_treasury_initiative_modifier: "The Initiative of the Treasury"
 ITA_h_the_experimental_works: "The Experimental Works"
 ITA_h_the_interior_commands: "The Interior Commands"
 ITA_h_the_school_makes_italians: "The School Makes Italians"
 ITA_h_the_school_makes_italians_plain: "The Schools of the Kingdom"
 ITADNC_l_the_unredeemed_brothers: "The Unredeemed Brothers"
 ITADNC_l_the_unredeemed_brothers_desc: "The Italians of the Littoral and of the Trentino are subjects of an ally, and our ally treats them as a nuisance to be policed. Every year the Lega Nazionale is dissolved and every year it returns. Vienna must be told plainly that these provinces are Italian, and that we intend to have them."
 ITADNC_l_the_price_of_article_seven: "The Price of Article Seven"
 ITADNC_l_the_price_of_article_seven_desc: "Article Seven of our treaty is plain: neither ally may take Ottoman land in the Balkans without compensating the other. Vienna has taken Bosnia and offers us words. We will present the bill in Berlin, where the treaty was signed, and we will name the Adriatic provinces as its price."
 ITADNC_l_the_review_of_the_fleet: "The Review at Naples"
 ITADNC_l_the_review_of_the_fleet_desc: "The King swore his oath before the Chambers with his father barely buried, and the country has watched him since for the measure of the man. The fleet will pass before him in the bay, and the army will line the shore. A reign that begins in mourning must be seen to begin in strength."
 ITADNC_l_the_claims_of_the_risorgimento: "The Claims of the Risorgimento"
 ITADNC_l_the_claims_of_the_risorgimento_desc: "The Kingdom was bought with Nice and Savoy, and the plebiscites that ratified the sale were a formality. In Tunis a hundred thousand of our people live under a Protectorate that was taken from under our hand, and our convention there falls due. In Malta the courts have been ordered to abandon our language. A note shall go to Paris and to London, but Paris, at least, will not bow to mere words."
 ITADNC_l_the_verdict_of_adwa_reversed: "The Verdict of Adwa Reversed"
 ITADNC_l_the_verdict_of_adwa_reversed_desc: "For fourteen years every dispatch from Africa has been read against a single date. The army has not forgiven the country and the country has not forgiven the army. With Addis in our hands the ledger is closed and a new reckoning may begin."
 ITADNC_l_the_convention_with_san_marino: "The Convention with San Marino"
 ITADNC_l_the_convention_with_san_marino_desc: "Our convention of friendship and good neighbourhood with the Republic falls due for renewal, and the Republic has nothing to sell us but its goodwill. Engineers have surveyed a line from Rimini to the rock and the plans have gathered dust for a decade. We shall renew the convention and build the railway with it."
 ITADNC_l_the_albanian_shore: "The Albanian Shore"
 ITADNC_l_the_albanian_shore_desc: "Twice we have signed with Vienna that neither of us shall take the Albanian coast, and twice the ink has been read differently in each chancellery. Valona commands the mouth of our own sea; in another power's hands it is a gun laid on Brindisi. We shall settle the question with the ally who signed, not with the Porte who cannot hold it."
 ITADNC_l_the_award_at_belgrade: "The Award at Belgrade"
 ITADNC_l_the_award_at_belgrade_desc: "The Serbs have been strangled by an Austrian customs war for three years and have no port of their own. We hold the shore that Vienna has lost. A door on the sea, given freely, will buy us a friend on the Danube for a generation."
 ITADNC_l_the_first_soldier: "The First Soldier of Italy"
 ITADNC_l_the_first_soldier_desc: "The Statute gives the King command of the forces of land and sea, and he has taken that clause literally at every autumn manoeuvre since his accession. The generals have learned that the throne reads their returns. Let the command be made plain, so that the army answers the Crown before it answers the Chamber."
 ITADNC_l_the_award_at_cetinje: "The Award at Cetinje"
 ITADNC_l_the_award_at_cetinje_desc: "The Antivari concession, the tobacco monopoly and a marriage bind Cetinje to us more firmly than any treaty, and our garrison at Canea gives us a voice on Crete. Our friends have waited a long while for their share. We shall pay them out of the Turkish inheritance and let the world scold them for taking it."
 ITADNC_l_the_fate_of_the_dual_monarchy: "The Fate of the Dual Monarchy"
 ITADNC_l_the_fate_of_the_dual_monarchy_desc: "The Consulta has kept a drawer of memoranda on what follows the Habsburgs, and the trialists in Vienna have made every one of them plausible. The Adriatic cannot be left to whoever inherits the wreck. We shall decide the shape of the succession before the succession decides itself."
 ITADNC_l_the_arbiter_of_the_nation: "The Arbiter of the Nation"
 ITADNC_l_the_arbiter_of_the_nation_desc: "Ministry has followed ministry and the Crown has settled every one of the crises, calling the man it wanted and dismissing the man it did not. Abroad we are now received as a power and not as a supplicant. The King is the arbiter of the nation in fact, and the fact should be acknowledged."
 ITADNC_l_the_claims_pressed: "The Claims Pressed"
 ITADNC_l_the_claims_pressed_desc: "Words have been sent and words have been returned. The Chamber will not be satisfied with another exchange of notes; the claims must now be pressed by the only argument that has ever moved a Protectorate."
 ITADNC_l_the_italians_of_tunis: "The Italians of Tunis"
 ITADNC_l_the_italians_of_tunis_desc: "There are more Italians in the Regency than Frenchmen, and they keep their own schools, their own hospital and their own chamber of commerce. Let the Consulta work through them. A province may be won by its schoolmasters as surely as by its soldiers."
 ITADNC_l_the_fate_of_ottoman_europe: "The Fate of Ottoman Europe"
 ITADNC_l_the_fate_of_ottoman_europe_desc: "The Porte cannot hold the Albanian lands and every chancellery in Europe knows it. We have a prince ready and a plan for an autonomous principality under our protection. We must name our price before another power names its own, and we must name it to the Porte itself."
 ITADNC_l_the_second_award_at_cetinje: "The Second Award at Cetinje"
 ITADNC_l_the_second_award_at_cetinje_desc: "Athens claims the islands we garrison and the Epirus our friends want, and it claims them from a position it cannot defend. Cetinje and Belgrade are owed a further payment. We shall present the account in Athens and let our friends collect what we do not keep."
 ITADNC_l_the_war_with_greece: "The War with Greece"
 ITADNC_l_the_war_with_greece_desc: "The Greeks are already fighting, and a kingdom at war cannot defend two seas at once. Nothing we could have asked for in peace will be refused us now. We shall take the whole of it while the taking is cheap."
 ITADNC_l_the_schools_of_the_levant: "The Schools of the Levant"
 ITADNC_l_the_schools_of_the_levant_desc: "The Dante Alighieri keeps schools from Salonica to Smyrna, our post offices carry the mail of half the Levant, and Paris still claims to speak for every Catholic mission in the Sultan's lands. That claim is older than the Third Republic and no longer answers to anything. We shall take up the protection of the missions ourselves, and teach the coast to read in our language."
 ITADNC_l_the_protectorate_over_greece: "The Protectorate over Greece"
 ITADNC_l_the_protectorate_over_greece_desc: "A kingdom that has surrendered its islands and its northern province is no longer a kingdom that decides its own affairs. Northern Epirus is ours by claim and Athens has no protector left. We shall offer the Greeks the form of a throne and keep the substance of it ourselves."
 ITA_l_the_rifles_are_counted_tt: "Our armies carry at least forty thousand rifles."
 ITA_l_the_ladder_opens_tt: "§YThe Consulta opens the file of the unredeemed provinces, and every demand that follows will be read against this one.§!"
 ITA_l_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_l_if_they_refuse_tt: "\n§YEffects if they refuse:§!"
 ITA_l_the_review_of_the_fleet_tt: "We hold more than two subject nations, or more than nine states beyond the Kingdom."
 ITA_l_the_first_soldier_tt: "We hold more than four subject nations, or more than twenty-four states beyond the Kingdom."
 ITA_l_the_arbiter_of_the_nation_tt: "We hold more than four subject nations, or more than twenty-four states beyond the Kingdom, and a great power has capitulated to us."
 ITA_l_the_verdict_of_adwa_reversed_tt: "Shewa and Tigray are held by us or by an ally."
 ITA_l_the_verdict_reversed_tt: "§GThe defeat in Africa is answered, and the army and the country are reconciled.§! The masons on the Altar of the Fatherland work to a shorter calendar, and the reservists come back to the depots without being called twice."
 ITA_l_unlock_influence_countries_tt: "§YThe Consulta may now work through our schools, our hospitals and our chambers of commerce abroad. New decisions are available in the irredenta category.§!"
 ITA_l_the_severity_is_chosen_tt: "§YWe shall choose how much to ask of the Porte before the note is written, and the world will weigh what we ask.§!"
 ITA_l_vienna_refuses_tt: "§RVienna will not sell its provinces, and the Italians of the realm are worth less at court for having asked.§!"
 ITA_l_belgrade_holds_no_claim_tt: "Belgrade holds no claim on the Adriatic states that it could withdraw, and offers its friendship instead."
 ITA_l_blunders_tt: "§RA demand has been refused in the open. The Consulta has now been rebuffed [?ITA_l_blunders|0] times.§!"
 ITA_l_the_principality_is_raised_tt: "§YAn Albanian principality is raised under our protection.§!"
 ITA_l_article_seven_threat: "The Price of Article Seven"
 ITA_l_risorgimento_claims_threat: "The Claims of the Risorgimento"
 ITA_l_albanian_shore_threat: "The Albanian Shore"
 ITA_l_end_of_the_monarchy: "The End of the Dual Monarchy"
 ITA_l_claims_pressed_threat: "The Claims Pressed"
 ITA_l_second_award_threat: "The Second Award at Cetinje"
 ITA_l_the_provinces_are_ours: "The Unredeemed Provinces Are Ours"
 ITA_l_the_whole_shore: "The Whole Albanian Shore"
 ITA_l_the_albanian_principality: "The Albanian Principality"
 ITA_l_the_wing_over_cetinje: "The Wing over Cetinje"
 ITA_l_the_verdict_reversed: "The Verdict Reversed"
 ITA_l_the_verdict_reversed_desc: "Africa has been answered and the army has been given back its name. Recruits come willingly and the ministries are given room to work."
 ITA_l_the_ally_stood_aside: "The Ally Stood Aside"
 ITA_l_the_ally_stood_aside_desc: "The guarantor of the realm let the Italian bill be presented and said nothing. Every ministry and every regiment has drawn the same conclusion."
 ita_dnc.2400.t: "The Demand for the Provinces"
 ita_dnc.2400.d: "The Italian ambassador has read out a list of provinces and called them a debt rather than a request. He was careful to say that the alliance is dear to Rome and that the list is not negotiable. Ceding them would keep the treaty alive and hand a rival the eastern shore of the Adriatic; refusing them would leave the realm to defend that shore alone."
 ita_dnc.2400.a: "Let them go, and let the alliance live."
 ita_dnc.2400.b: "The Empire does not sell its provinces."
 ita_dnc.2401.t: "The Note Passed to Berlin"
 ita_dnc.2401.d: "The Italians have brought their claim to us rather than to the party they mean to despoil, on the ground that we guaranteed the alliance and must therefore price it. Vienna has not been consulted and will learn our answer from the newspapers. Yielding the provinces holds the alliance together at our ally's expense; standing by the guarantee holds our word and loses us Rome."
 ita_dnc.2401.a: "Let Rome have the provinces."
 ita_dnc.2401.b: "The guarantee stands as it was given."
 ita_dnc.2402.t: "The Provinces Are Ceded"
 ita_dnc.2402.d: "The instruments were signed without ceremony and the prefects were in Trieste before the crowds were. Bells have been rung in every city of the Kingdom and the Chamber has adjourned itself in the middle of a finance debate. Abroad the reading is colder, and every chancellery has begun to count what else we may decide is ours."
 ita_dnc.2402.a: "The irredenta is redeemed."
 ita_dnc.2404.t: "The Demand and the Civil War"
 ita_dnc.2404.d: "The Italian note has arrived in the middle of our own quarrel, addressed to whoever is judged to be governing. Our rivals will make what they can of any answer we give. Handing over the provinces buys us quiet on one frontier while we settle the other; refusing them adds a great power to the list of our enemies."
 ita_dnc.2404.a: "We have troubles enough at home."
 ita_dnc.2404.b: "Not one village, not in this hour."
 ita_dnc.2405.t: "The Conference on Compensation"
 ita_dnc.2405.d: "Rome has invoked the compensation clause of the alliance and asked us to arbitrate it, since the treaty was signed in our capital. The Austrians took the Bosnian provinces without asking and have offered their partner nothing but courtesies. Standing aside costs us an ally's trust and keeps the Italians in the alliance; defending the realm keeps our word and drives Rome out of it."
 ita_dnc.2405.a: "Vienna is on its own in this."
 ita_dnc.2405.b: "The Empire must be defended."
 ita_dnc.2406.t: "The Guarantee Has Lapsed"
 ita_dnc.2406.d: "The Germans have declined to shelter their partner in the Adriatic quarrel, and the news reached us before it reached Vienna. The Balkan settlement now has one guarantor fewer. Taking up the guarantee ourselves puts us where the Germans would not stand; leaving it down lets two allies quarrel without us."
 ita_dnc.2406.a: "Then we shall speak for Vienna."
 ita_dnc.2406.b: "Let the allies quarrel alone."
 ita_dnc.2407.t: "Berlin Stands with Vienna"
 ita_dnc.2407.d: "The Germans have refused the Italian claim and put their weight behind the realm on the Danube. The alliance that faces us has closed ranks, and Rome has been left holding an unpaid bill. Offering the Italians our hand may loosen the knot; pressing the quarrel with the Danube may cut it."
 ita_dnc.2407.a: "Rome should be offered a hand."
 ita_dnc.2407.b: "The Danube is the greater danger."
 ita_dnc.2409.t: "The Adriatic Provinces"
 ita_dnc.2409.d: "The compensation clause has been read against us in a foreign capital and the Italians have named the price in Dalmatian towns. Our guarantor has said nothing we can quote. Paying the bill keeps the alliance and cuts the coast in half; refusing it leaves an ally standing over us with a grievance and an army."
 ita_dnc.2409.a: "The Empire does not pay for Bosnia."
 ita_dnc.2409.b: "Rome shall have its compensation."
 ita_dnc.2409.c: "We must comply with Rome's demands."
 ita_dnc.2411.t: "Belgrade Revises Its Claim"
 ita_dnc.2411.d: "The Italians have laid a claim on the Adriatic towns and have taken the trouble to tell us before the newspapers did. The customs war has taught us how little our northern neighbour cares whether we eat. Standing down our own claim buys a friend with a fleet; holding it keeps a coastline we have never once controlled."
 ita_dnc.2411.a: "Let Rome have the coast."
 ita_dnc.2411.b: "The coast is Serbian and remains so."
 ita_dnc.2415.t: "A Door on the Sea"
 ita_dnc.2415.d: "An Italian note offers us the town and the roadstead outright, with no condition written into it and none hinted at. Our merchants have been at the mercy of a neighbour's customs house for three years. A kingdom that has never owned a harbour is being handed one by a great power that expects to be remembered for it."
 ita_dnc.2415.a: "At last, the sea!"
 ita_dnc.2416.t: "Our Coast Given Away"
 ita_dnc.2416.d: "The Italians have handed a stretch of our Adriatic coast to the Serbs and have made a ceremony of it. The town was ours in law and in the almanac, whatever the army held on the day. Answering the insult costs us a quarrel with two neighbours at once; swallowing it costs us the belief of everyone who reads the almanac."
 ita_dnc.2416.a: "We shall remember this gift."
 ita_dnc.2416.b: "The coast was lost long before."
 ita_dnc.2420.t: "The Demand for the Succession"
 ita_dnc.2420.d: "The Italians no longer ask for provinces; they ask what shall be done with the realm when it ends, and they ask it while we are still governing. The nationalities have read the note before the ministers finished it. Giving in ends the Monarchy on terms someone else wrote; standing firm ends it in a war we shall have to win twice."
 ita_dnc.2420.a: "Give in to the Italians."
 ita_dnc.2420.b: "And yet the Monarchy must stand."
 ita_dnc.2421.t: "The Shape of the Succession"
 ita_dnc.2421.d: "Vienna has conceded, and the drawer of memoranda is open on the table. What replaces the Monarchy on the eastern shore is now ours to draw, and every line we draw makes a friend or an enemy for a generation. The Consulta waits for the pen."
 ita_dnc.2421.a: "Croatia alone as a client kingdom."
 ita_dnc.2421.b: "Partition the inheritance with Serbia."
 ita_dnc.2421.c: "All of the Adriatic belongs to the Kingdom."
 ita_dnc.2421.f: "Honour the promise made to Cetinje."
 ita_dnc.2421.e: "Croatia and Slovenia both as client kingdoms."
 ita_dnc.2423.t: "The Monarchy Must Stand"
 ita_dnc.2423.d: "The Italian note has been refused and the refusal has been printed in every language of the realm. The regiments are steady and the nationalities are watching to see what steadiness costs. Calling the country to arms will answer the insult and empty the treasury of patience; buying the nationalities will hold the realm together and be called weakness."
 ita_dnc.2423.a: "Call the regiments to the colours."
 ita_dnc.2423.b: "Buy the nationalities their quiet."
 ita_dnc.2425.t: "The Note on the Regency"
 ita_dnc.2425.d: "An Italian note has arrived claiming the Regency, the county beyond the river and the island of the courts, and it cites treaties older than the Protectorate. A hundred thousand of their people live in the Regency and pay no attention to our schools. Yielding the Regency costs a province and keeps the peace; refusing it invites a fleet into a sea we do not command alone."
 ita_dnc.2425.a: "We must accept, and quickly."
 ita_dnc.2425.b: "Never, and let them try it."
 ita_dnc.2430.t: "The Albanian Coast"
 ita_dnc.2430.d: "Rome has denounced the standstill we twice signed and now asks us to stand aside while it settles the Albanian coast alone. The Porte cannot hold that coast and both of us have always known it. Letting Rome have it keeps the alliance and loses us the mouth of the Adriatic; refusing costs us the alliance and gains us a war on two shores."
 ita_dnc.2430.a: "The standstill is not worth a war."
 ita_dnc.2430.b: "The Adriatic is not Italy's to take."
 ita_dnc.2431.t: "The Standstill Abandoned"
 ita_dnc.2431.d: "Vienna has let go of the Albanian standstill and has told us so through a third party. The Adriatic is now open to whoever moves first, and only one power on that sea has a fleet ready. Speaking for the Porte puts us in the way of a friend we have been courting; saying nothing hands the strait to a rising power."
 ita_dnc.2431.a: "We shall not act alone in this."
 ita_dnc.2431.b: "The Adriatic is not a private lake."
 ita_dnc.2435.t: "Justice for Montenegro"
 ita_dnc.2435.d: "The Italians have taken a district from the Porte and are handing it to us without asking anything in the note. The concession at Antivari and the marriage have earned us more than we dared to ask for. A principality that lives on a tobacco monopoly is being given a province by a kingdom that expects gratitude."
 ita_dnc.2435.a: "Justice for Montenegro at last."
 ita_dnc.2436.t: "Serbia Rejoices"
 ita_dnc.2436.d: "Rome has sent word that the districts our schoolmasters have written about for a generation are to be handed over to us. There is no condition in the note and no committee to sit on it. A kingdom without a coast is being paid in the one currency it has always wanted, by a power that means to be remembered."
 ita_dnc.2436.a: "Serbia rejoices in the gift."
 ita_dnc.2437.t: "Enosis at Last"
 ita_dnc.2437.d: "The Italian government has written to say that what it has taken from the Porte in our direction is ours to keep. Our assembly voted for union and waited for the powers to notice. One of them has noticed, and has sent the deeds instead of a lecture."
 ita_dnc.2437.d_crete: "The Italian garrison at Canea is to be withdrawn and the island handed to us, in a note so short that the ministry read it twice. Our assembly proclaimed the union and was told to be patient. Patience has been rewarded by the one protecting power that wanted something in return."
 ita_dnc.2437.d_epirus: "The mainland districts our schoolmasters have counted for a generation are to be handed to us by Rome, taken from the Porte and given away in the same season. There is no condition in the note. A power that wanted the Adriatic has decided that our gratitude is worth more than a province."
 ita_dnc.2437.a: "Enosis at last."
 ita_dnc.2440.t: "The Fate of Ottoman Europe"
 ita_dnc.2440.d: "The Porte cannot hold the Albanian lands and our consuls have said so for a decade. We may take the shore outright, raise a principality under our protection, or raise it and pay our friend in the mountains for standing with us. The heavier the demand, the louder the chancelleries."
 ita_dnc.2440.a: "Take the whole of the shore."
 ita_dnc.2440.b: "A principality under our protection."
 ita_dnc.2440.c: "A principality, and the mountain rewarded."
 ita_dnc.2441.t: "The Demand for the Shore"
 ita_dnc.2441.d: "The Italians have demanded the Albanian coast outright, with no talk of autonomy and no offer of a price. Our garrisons there are paid late and the mountain chiefs answer to nobody. Standing firm means a war in a province we barely govern; conceding means the loss of the last European coast the Sultan holds."
 ita_dnc.2441.a: "We must stand firm."
 ita_dnc.2441.b: "It will spare so many lives."
 ita_dnc.2442.t: "A Principality Proposed"
 ita_dnc.2442.d: "Rome proposes an autonomous Albanian principality under its protection and offers to leave the Sultan his title over it. The province has cost us more in garrisons than it has ever returned in taxes. Standing firm keeps the letter of our sovereignty and buys a war; conceding keeps the form of it and loses the substance."
 ita_dnc.2442.a: "We must stand firm."
 ita_dnc.2442.b: "It will spare so many lives."
 ita_dnc.2443.t: "A Principality and a Payment"
 ita_dnc.2443.d: "The Italian note asks for an Albanian principality under its protection and for our recognition that the mountain kingdom stands under the same wing. It is the whole of our northern frontier settled by another power's pen. Standing firm means a war on a frontier we cannot supply; conceding means the last of Europe goes at once."
 ita_dnc.2443.a: "We must stand firm."
 ita_dnc.2443.b: "It will spare so many lives."
 ita_dnc.2445.t: "What the Ally Shall Have"
 ita_dnc.2445.d: "The note to Athens is drafted and the only question left is what our friends are to be paid out of it. A promise kept in the mountains is worth an army corps on that frontier for a generation. A promise broken is worth nothing at all, but it leaves more in our own hands."
 ita_dnc.2445.a: "Our friend shall have its share."
 ita_dnc.2445.b: "Rome keeps what Rome takes."
 ita_dnc.2446.t: "The Demand on the Islands"
 ita_dnc.2446.d: "An Italian note claims the islands and the northern province, and it was delivered with a squadron already at sea. Our army is spread over three frontiers and our creditors are all in the same capitals as our friends. Yielding costs us the islands and the province; refusing costs us whatever the fleet decides to take."
 ita_dnc.2446.d_cetinje: "The Italian note claims our islands and our northern province, and says plainly that part of what is taken will be handed to the mountain kingdom. Our army is spread over three frontiers. Yielding buys peace and makes a neighbour bigger; refusing invites a fleet we cannot answer."
 ita_dnc.2446.d_belgrade: "The Italian note claims our islands and our northern province, and the Serbs have already been promised a portion of the settlement. Our army is spread over three frontiers and our friends are counting their own gains. Yielding costs us two provinces and buys quiet; refusing costs us whatever a fleet can carry."
 ita_dnc.2446.d_both: "The Italian note claims our islands and our northern province, and both our northern neighbours have been promised a share before the note reached us. We are being divided by people who send us congratulations. Yielding leaves us a kingdom without a frontier; refusing leaves us a kingdom at war with three."
 ita_dnc.2446.a: "We cannot resist them."
 ita_dnc.2446.b: "We will not yield."
 ita_dnc.2447.t: "The Protectorate Offered"
 ita_dnc.2447.d: "The Italians offer to leave us our King, our flag and our army list, and to take everything else. The islands are gone, the northern province is gone, and no power has answered our last three notes. Accepting keeps the throne and ends the kingdom; refusing keeps the kingdom until the first landing."
 ita_dnc.2447.a: "Accept the inevitable."
 ita_dnc.2447.b: "Refuse, whatever it costs."
 auh_dnc.2490.t: "An Imminent Demand"
 auh_dnc.2490.d: "Our legation in Rome reports that the Consulta has opened a file on the provinces and that a note is being drawn up. We have weeks, not months, and the nationalities will hear of it before the ministers agree on an answer. Preparing openly steadies the army and tells every subject of the realm that the frontier is in question."
 auh_dnc.2490.a: "Brace!"
 ITADNC_l_the_bank_before_the_flag: "The Bank Before the Flag"
 ITADNC_l_the_bank_before_the_flag_desc: "The Porte stands in the way of our plans in Africa, and it is not too late to alter our priorities and seek its friendship instead. The only way this could come about is a trade: what we have taken from Vienna in the Balkans, returned to Ottoman sovereignty, against the administration of the African shore. The Porte has already shown its price by accepting money for Bosnia."
 ITADNC_l_the_ultimatum_to_the_porte: "Tripoli or War"
 ITADNC_l_the_ultimatum_to_the_porte_desc: "Tripoli was promised to us in Paris and conceded to us in London, and every year the promise is worth a little less. If the Porte will not concede the administration of the shore, we must prepare the country for the war that follows. The African shore will be Italian."
 ITADNC_l_the_friendship_with_the_porte: "The Friendship of the Porte"
 ITADNC_l_the_friendship_with_the_porte_desc: "We have chosen the counting house over the flag, and Constantinople should be told what that choice is worth. We shall sign the commercial convention it has asked of us and promise our support at the Straits. A friend at the Bosphorus will do more for our trade than a quarrel in the sand."
 ITADNC_l_the_sphere_between_the_colonies: "The Sphere Between the Colonies"
 ITADNC_l_the_sphere_between_the_colonies_desc: "London, Paris and Rome have reserved us a territorial link between Eritrea and Somaliland, west of Addis Ababa, and not a mile of it has ever been surveyed. We shall put the agreement to the Negus himself and ask for the railway concession that would make it real. What the powers granted on paper, only Addis Ababa can grant on the ground."
 ITADNC_l_the_understanding_with_the_neutrals: "The Understanding with the Neutrals"
 ITADNC_l_the_understanding_with_the_neutrals_desc: "Behind our northern shoulder stand small states that no great power wishes to see armed, and every one of them can be reached without a shot. We shall open our consulates and our purse to Bern, to Monaco and to San Marino. An understanding on the frontier costs less than a corps on it."
 ITADNC_l_the_plan_against_the_ally: "The Plan Against the Ally"
 ITADNC_l_the_plan_against_the_ally_desc: "The Simplon is open and the Gotthard convention is signed, and the staff has been quietly drawing the northern frontier ever since. We shall finish the operational study against the ally and against everything that lies between us and his flank. Where Bern has already conceded us the transit, we shall ask her to march with us instead."
 ITADNC_l_the_landing_at_valona: "The Landing at Valona"
 ITADNC_l_the_landing_at_valona_desc: "The Navy has kept the Valona landing in its portfolio since the Adriatic accords, and the war with Vienna is the hour it was drawn for. We shall put the plan into execution and take the bay and the mountain behind it. Every month we hold the mine, its chromium and its aluminium come to our yards."
 ITADNC_l_the_pact_of_cartagena: "The Pact of Cartagena"
 ITADNC_l_the_pact_of_cartagena_desc: "London, Paris and Madrid have agreed the Mediterranean settlement among themselves and left our name off the paper. We shall go to Madrid ourselves and ask for the signature that is missing. A sea with four keepers is a sea in which nobody moves without us."
 ITADNC_l_the_balearics: "The Balearics"
 ITADNC_l_the_balearics_desc: "Every naval memorandum of the decade puts the Balearics squarely across our western route, and Madrid can neither fortify them nor let them go. We shall take the islands, and the archipelago beyond the strait with them. The western basin will be ours, or it will belong to whoever reaches it first."
 ITADNC_l_the_war_with_vienna: "The War with Vienna"
 ITADNC_l_the_war_with_vienna_desc: "The Chamber has been told for a decade that the alliance is a leash and that Trieste is Italian, and the staff has the plan in its drawer already. We shall have done with the ally and claim the city the alliance forbade us to name aloud. We do not claim the Monarchy; we claim Trieste."
 ITADNC_l_the_concession_at_antivari: "The Concession at Antivari"
 ITADNC_l_the_concession_at_antivari_desc: "Our company holds the port at Antivari and our loan holds the principality, and the mountain behind both is full of ore. We shall ask Cetinje for the mining rights and for the yard that must go with them. A prince who owes us his budget can hardly refuse us his chromium."
 ITADNC_l_the_league_of_the_adriatic: "The League of the Adriatic"
 ITADNC_l_the_league_of_the_adriatic_desc: "The customs war has driven Belgrade out of the northern market and into ours, and Tittoni has sketched a league of the eastern shore. We shall offer Serbia the place that Petersburg has never troubled to fill. Either she takes our hand, or the Adriatic will be settled without her."
 ITADNC_l_the_mandate_at_algeciras: "The Mandate at Algeciras"
 ITADNC_l_the_mandate_at_algeciras_desc: "The conference on Morocco has opened and our delegation sits between Paris and Berlin holding a vote that both of them want. We shall cast it with the western powers and take the mandate for the bank and the police that follows. What we cannot hold with troops we shall hold with a signature."
 ITADNC_l_the_share_of_morocco: "The Share of Morocco"
 ITADNC_l_the_share_of_morocco_desc: "The notes we exchanged with Paris traded Morocco against Tripolitania, and we have been paid in neither. We shall put our protection to the Sultan and take the share those notes promised us. If Madrid means to claim the northern presidios as well, she may defend them."
 ITADNC_l_the_landing_on_the_dalmatian_shore: "The Dalmatian Landing"
 ITADNC_l_the_landing_on_the_dalmatian_shore_desc: "The Regia Marina has rehearsed the eastern landing for years, and the war with Vienna has finally opened the far shore to it. We shall put the divisions across and hold the beaches until the army comes up behind them. The fleet will carry the war to the coast that has always faced us."
 ITADNC_l_the_valleys_that_speak_italian: "The Valleys That Speak Italian"
 ITADNC_l_the_valleys_that_speak_italian_desc: "There are valleys beyond the lakes where the schools, the churches and the newspapers are Italian and the flag is not. Rome has always disavowed the men who say so aloud; we shall stop disavowing them. The Confederation will give up what was never hers to keep."
 ITADNC_l_the_gold_of_the_lakes: "The Gold of the Lakes"
 ITADNC_l_the_gold_of_the_lakes_desc: "Half the savings of our emigrants cross the frontier at Chiasso and never come back, and nobody in Rome can say who moves them or why. We shall open an office on the lakes to read the traffic and the ledgers behind it. We shall milk the Confederation rather than march into her."
 ITADNC_l_the_friendship_of_menelik: "The Friendship of Menelik"
 ITADNC_l_the_friendship_of_menelik_desc: "Three frontier conventions with the Negus have fixed our colonial borders without a shot fired, and the tripartite agreement has fixed our sphere beyond them. We shall confirm all of them and put our name to a pact of non-aggression besides. Adwa cost us an army; Addis Ababa can be had for a signature."
 ITADNC_l_the_road_to_addis: "The Road to Addis"
 ITADNC_l_the_road_to_addis_desc: "The railway concession to the highlands is disputed between Paris and ourselves, and the Negus grows old with no settled heir behind him. We shall offer the Empire our protection while it can still be offered rather than imposed. If it is refused, we shall take the road ourselves."
 ITADNC_l_the_plan_for_the_aegean: "The Plan for the Aegean"
 ITADNC_l_the_plan_for_the_aegean_desc: "The Navy has been drawing the islands for years, and the Porte and Athens each hold a part of what we want. We shall prepare the operation against the Dodecanese and against the Aegean islands together, as one piece of work. The plan must be ready before the war makes it necessary."
 ITADNC_l_the_return_of_the_lands_of_savoy: "The Lands of Savoy"
 ITADNC_l_the_return_of_the_lands_of_savoy_desc: "The plebiscites that gave Nice and Savoy away have been contested by our press from the day they were counted. We shall take back the cradle of the dynasty and the city of the man who made Italy. Paris and Monaco will be informed; they will not be consulted."
 ITADNC_l_beyond_the_pillars: "Beyond the Pillars"
 ITADNC_l_beyond_the_pillars_desc: "Our fleet burns Welsh coal, and the road to it passes under British guns at three separate doors. We shall break the leash, turn the yards of the inner sea over to ocean work and build for the water beyond the Pillars. A fleet that cannot leave its own sea is a coast guard with battleships."
 ITADNC_l_the_italians_of_the_plate: "The Italians of the Plate"
 ITADNC_l_the_italians_of_the_plate_desc: "More of our people live between the Plate and the Parana than in half our provinces, and their debts are owed to houses in Europe. We blockaded the Caribbean coast beside London and Berlin, and the tribunal at The Hague rewarded us for it. We shall put the same instrument to work on the river."
 ITADNC_l_the_leash_is_cut: "The Leash Is Cut"
 ITADNC_l_the_leash_is_cut_desc: "Gibraltar, Malta and Suez are three doors and not one of them is ours, and every ton of our coal passes through the first. The argument in the Chamber is finished and the yards have heard the verdict. We shall tell the fleet to plan as though the doors were already open."
 ITADNC_l_the_governorships_beyond_the_sea: "The Governorships Beyond the Sea"
 ITADNC_l_the_governorships_beyond_the_sea_desc: "Martini governed Eritrea as a civil governor and proved that a colony can be administered rather than merely garrisoned. The Consulta has built a colonial directorate on that lesson, and it now needs governorships to direct. We shall raise them for Tripolitania, for Cyrenaica, for the Horn and for the islands."
 ita_dnc.2450.t: "Bosnia for Tripoli"
 ita_dnc.2450.d: "Rome offers a trade rather than an ultimatum. The Balkan lands the Italians hold would return to our sovereignty, and in exchange the administration of the African shore would pass to them. To accept is to recover provinces we had written off, at the price of a coast we have held for centuries; to refuse is to keep the coast and leave the provinces where they lie."
 ita_dnc.2450.a: "This is the best offer we shall get."
 ita_dnc.2450.b: "We will not sell what is ours for what was stolen."
 ita_dnc.2451.t: "The Bargain Is Struck"
 ita_dnc.2451.d: "The Porte has signed. Our commissioners hand back the Balkan districts and take up the administration of the African shore in the same week. Neither government will call the exchange a defeat in public, and both know which of the two got the coast."
 ita_dnc.2451.a: "The exchange is made."
 ita_dnc.2452.t: "The Porte Will Not Trade"
 ita_dnc.2452.d: "Constantinople has read our offer and sent it back unopened. The provinces stay where they are, the shore stays Ottoman, and the Consulta has spent its credit for nothing at all. What we cannot buy we shall have to claim."
 ita_dnc.2452.a: "Then we shall claim it."
 ita_dnc.2455.t: "Tripoli or War"
 ita_dnc.2455.d: "The Italian ambassador has asked for the administration of the African shore and has named the alternative aloud. Their army is mustered in the south and their fleet is coaled. To concede is to lose a province and keep the peace; to refuse is to keep the province and fight for it."
 ita_dnc.2455.a: "Let us make a deal. Perhaps they will turn elsewhere."
 ita_dnc.2455.b: "Tripoli will remain Trablus."
 ita_dnc.2456.t: "The Porte Concedes the Shore"
 ita_dnc.2456.d: "The concession has come back signed from Constantinople, and the governor has been instructed to receive our officials. Paris and London, who promised us the shore and then dreaded the war it would cost, breathe out at last. We take the coast, and the islands are the price of it."
 ita_dnc.2456.a: "The shore is ours."
 ita_dnc.2457.t: "Tripoli Will Remain Trablus"
 ita_dnc.2457.d: "The Porte refuses, and refuses in public. Every pact we hold with Constantinople is void tonight, and every other signature of ours is being read again in a dozen chanceries. Vienna, which invoked the article against us, will not be sorry to see us bogged in the sand."
 ita_dnc.2457.a: "Then the fleet sails."
 ita_dnc.2458.t: "One Battle at a Time"
 ita_dnc.2458.d: "We are fighting for the capital, and a second war on the African shore would finish us before the first is won. The Italians ask for the coast and offer nothing in return but their silence. A government that cannot hold its own provinces is in no position to refuse anyone."
 ita_dnc.2458.a: "One battle at a time."
 ita_dnc.2460.t: "The Friendship of the Porte"
 ita_dnc.2460.d: "Rome has signed the commercial convention and promised its support at the Straits, and the note arrived without a single condition attached to it. It is the first paper from a European capital in years that asks us for nothing. The Sultan has ordered it acknowledged."
 ita_dnc.2460.a: "The Sublime Porte acknowledges."
 ita_dnc.2460.b: "We shall see what it is worth."
 ita_dnc.2465.t: "The Railway and the Customs"
 ita_dnc.2465.d: "The Italians have brought us the paper that the European powers signed among themselves about our country, and now propose to make a part of it real. A railway concession and a customs treaty would tie their two colonies together across our west. To sign is to gain a line and lose a road we control; to refuse is to keep the road and make an enemy of the nearer colony."
 ita_dnc.2465.a: "The line will be built."
 ita_dnc.2465.b: "Our west is not theirs to join."
 ita_dnc.2470.t: "The Transit of the Simplon"
 ita_dnc.2470.d: "The tunnel is open and the convention is signed, and the staff in Rome has finished a plan that runs through our valleys. The Italians say plainly that the plan exists and ask which side of it we intend to stand on. Neutrality has never had to be answered quite so directly."
 ita_dnc.2470.a: "Then we shall join them."
 ita_dnc.2470.b: "Then we shall face them."
 ita_dnc.2475.t: "The Rights at Antivari"
 ita_dnc.2475.d: "The Italian company already holds our port and the Italian loan already holds our budget, and now Rome asks for the mountain behind both. They offer works and a yard in exchange for the mining rights. To agree is to be paid for what we cannot dig ourselves; to refuse is to owe a great power an answer it did not want."
 ita_dnc.2475.a: "That is not in our best interest."
 ita_dnc.2475.b: "No one loses."
 ita_dnc.2480.t: "The League of the Adriatic"
 ita_dnc.2480.d: "The customs war has closed the northern market to our pigs and our plums, and Rome has chosen this moment to offer us a place at its side. A league of the eastern shore would give us a port and a patron in one signature. Petersburg has promised much and delivered little, and this offer will not be repeated."
 ita_dnc.2480.a: "We humbly accept this offer."
 ita_dnc.2480.b: "Belgrade will not be anyone's client."
 ita_dnc.2485.t: "Nice and Savoy Are Gone"
 ita_dnc.2485.d: "The Italian government has proclaimed the cradle of the house of Savoy and the county beyond the river to be Italian soil, and its troops did not wait for the proclamation. The plebiscites that gave us both have been denounced in the Chamber at Rome for a generation. There is nothing to answer here; the thing is done."
 ita_dnc.2485.a: "A note of protest, then."
 ita_dnc.2486.t: "Nice and Savoy Are Gone"
 ita_dnc.2486.d: "The Italian army has taken the county on our doorstep and the flag over the old town has changed. Our frontier now runs against a kingdom that has just shown what it thinks of old settlements. The Prince has been informed rather than consulted."
 ita_dnc.2486.a: "We are very small, and they are very close."
 ita_dnc.2490.t: "The Matter of the Plate"
 ita_dnc.2490.d: "Rome is pressing the debts of its emigrants on the river republics with the same instrument it used on the Caribbean coast, and the tribunal at The Hague has already rewarded that method once. Our doctrine holds that this hemisphere is not a court of collection. The Department asks whether we intend to say so aloud."
 ita_dnc.2490.a: "The matter belongs before the court."
 ita_dnc.2490.b: "Who cares?"
 ita_dnc.2495.t: "Rome Offers Protection"
 ita_dnc.2495.d: "The Italian minister has offered our sovereign the protection of his King, and the word protection was not softened in the reading. The powers around us have already divided the map in their own chanceries; this is the first of them to say so to our face. To accept is to keep the throne and lose the treaty power; to refuse is to keep both until someone comes for them."
 ita_dnc.2495.a: "Better a protector than a conqueror."
 ita_dnc.2495.b: "We are not a province of anyone."
 ITA_l_the_capital_answers_tt: "§YAddis Ababa will answer.§!"
 ITA_l_the_bank_renounces_tt: "We hold nothing in the Balkans that the Porte would recognise as its own, so the exchange is reduced to a renunciation: our claims on Bosnia and on Trebinje are withdrawn."
 ITA_l_valona_tt: "While the kingdom holds the whole of Albania, the mine sends its chromium and its aluminium to our yards every month, and every sixth shipment pays for an offshore civilian factory, up to four of them. Lose the mountain and the factories go with it."
 ITA_l_valona_tt_complete: "Shipments since the last factory: §Y[?ITA_l_valona_shipments|0]§!. Factories built out of the mine: §Y[?ITA_l_valona_civs|0]§!."
 ITA_l_the_far_shore_tt: "The landing establishment takes up every specialist battalion in the kingdom, and nothing else will get them while the operation lasts."
 ITA_l_the_operator_of_the_lakes_tt: "An operative of the new office becomes available to the Consulta."
 ITA_l_the_pillars_dockyards_tt: "In our fully controlled coastal states in Europe, up to [?ITA_l_max_states_for_dockyards|0] of them, two dockyards are laid down at once against one military factory each."
 ITA_l_the_plate_tt: "The consulates on the river open their ledgers: §Y[?ITA_l_plate_countries^num]§! republics of the Plate are entered, and the Consulta may work on them by decision."
 ITA_l_the_plate_trigger_tt: "At least one republic of the Plate exists outside our faction"
 ITA_l_beyond_the_pillars_trigger_tt: "No major power at war with us still holds a coast on our sea"
 ITA_l_the_sphere_granted_tt: "The concession is granted, and the two colonies are joined on paper at last."
 ITA_l_the_court_is_seized_tt: "Washington has taken the matter to the tribunal, and our collectors on the river will work under its eye."
 ITA_l_the_ultimatum_to_the_porte: "The Ultimatum to the Porte"
 ITA_l_war_with_vienna_threat: "The War with Vienna"
 ITA_l_the_lands_of_savoy_threat: "The Lands of Savoy"
 the_landing_at_valona: "The Landing at Valona"
 ITA_l_the_sphere_agreement: "The Railway and the Customs"
 ITA_l_the_sphere_agreement_desc: "The line between the two colonies is surveyed at last, and the customs houses along it answer to Rome quite as much as to the Negus."
 ITA_l_the_act_of_algeciras: "The Act of Algeciras"
 ITA_l_antivari_agreement: "The Antivari Agreement"
 ITA_l_naval_operation_idea: "Operation of the Western Basin"
 ITA_l_alpine_operation_ns: "The Alpine Operation"
 ITA_l_dalmatian_landing_ns: "The Dalmatian Landing"
 ITA_l_dalmatian_landing_ns_desc: "Every specialist battalion in the kingdom is aboard a transport or waiting for one. Nothing else that needs them is going to get them until the far shore is held."
 ITA_l_the_office_of_the_lakes: "The Office of the Lakes"
 ITA_l_the_office_of_the_lakes_desc: "A small bureau at Chiasso reads the traffic that crosses the frontier, and what it learns about money it learns about everything else as well."
 ITA_l_the_leash_broken: "The Leash Broken"
 ITA_l_the_leash_broken_desc: "The coal contract is no longer the first article of our naval policy. The yards of the inner sea are being cut over to ocean work, and the men who used to sign for Welsh colliers are signing for hulls instead."
 ITA_l_leash_cut_ns: "The Fleet Looks Outward"
 ITADNC_o_break_the_chamber: "Break the Chamber"
 ITADNC_o_break_the_chamber_desc: "The obstruction must end. The Chamber means to break the ministry by paralysing the House, and in doing so it will give us the excuse we need to govern under the Statuto, with the help of loyal elements in the army."
 ITADNC_o_secure_the_new_order: "Secure the New Order"
 ITADNC_o_secure_the_new_order_desc: "The fighting is over, and the men who called themselves the legal government are in prison or across a frontier. We shall proclaim an amnesty in the name of the Crown, and let the leagues understand that the decrees are not going to be withdrawn a second time."
 ITADNC_o_the_statuto_alone: "The Statuto Alone"
 ITADNC_o_the_statuto_alone_desc: "The charter gives the King the right to make war, to make treaties and to choose his ministers, and for two generations the Chamber has borrowed all three. We shall return to the Statuto as it was written, and govern by it without asking the deputies for anything."
 ITADNC_o_recall_the_chamber: "Recall the Chamber"
 ITADNC_o_recall_the_chamber_desc: "The country will not be held down by prefects for ever, and the Crown has no wish to be the last royal house in Europe governing by decree. We shall call the deputies back to Montecitorio, and let the ministry answer to them again."
 ITADNC_o_vienna_confirms_the_crown: "Vienna Confirms the Crown"
 ITADNC_o_vienna_confirms_the_crown_desc: "A government born of a coup is a government the alliance may refuse, and the alliance is the only guarantee our northern frontier has. We must ask Vienna to renew with us as we are, and learn whether the crown we defended is still worth an ally's signature."
 ITADNC_o_rebuild_the_kingdom: "Rebuild the Kingdom"
 ITADNC_o_rebuild_the_kingdom_desc: "Whatever flag the ministry now flies, the mills are cold, the harvest was left standing and the roads carry soldiers instead of goods. We shall put the country back to work first, because the two Italies that fought each other need the same bread."
 ITADNC_o_the_army_of_the_king: "The Army of the King"
 ITADNC_o_the_army_of_the_king_desc: "The regiments that held the streets did not hold them for a ministry, and the general who gave the order has been thanked in the Senate. We shall bind the army to the person of the King, so that the next crisis finds it already sworn."
 ITADNC_o_a_greater_and_better_italy: "A Greater and Better Italy"
 ITADNC_o_a_greater_and_better_italy_desc: "The provinces of the South sent their sons to the barricades and their taxes to Rome, and got a prefect in return. We shall take the special laws out of the drawer, drain the land and build the aqueducts, and let the Mezzogiorno see the state as something other than a tax collector."
 ITADNC_o_the_bulwark_of_latinity: "The Bulwark of Latinity"
 ITADNC_o_the_bulwark_of_latinity_desc: "Beyond the Isonzo our language is taught on sufferance, and the Italian law faculty at Innsbruck was broken up by students who would not have it there. We shall make the kingdom the open guarantor of the Latin name, and let [AUH.GetNameDef] read the notice for what it is."
 ita_dnc.2500.t: "The House Is Sent Home"
 ita_dnc.2500.d: "The decree was read to a chamber the carabinieri had already cleared, and the deputies who would not leave were carried down the steps. In the provinces the prefects hold the telegraph and the garrisons hold the streets, while in the north the opposition has named a government of its own. The kingdom has two of everything now, and only one army."
 ita_dnc.2500.a: "The King keeps the Quirinal"
 ita_dnc.2510.t: "Rome Asks for Recognition"
 ita_dnc.2510.d: "The ministry that governs in Rome was put there by a decree and a regiment, and it now asks the alliance to say that it is the kingdom. Our ambassador writes that the King signs what the generals bring him, and that the Chamber is shut. To renew with such a government is to answer for whatever it does next."
 ita_dnc.2510.a: "The Kingdom is what its King says it is."
 ita_dnc.2510.b: "We do not renew with a military government."
 ita_dnc.2510.c: "Berlin must speak before we do."
 ita_dnc.2511.t: "The Crown Is Not Confirmed"
 ita_dnc.2511.d: "Vienna will not put its name to a government of generals, and the alliance has lapsed with the answer. We can march for the unredeemed provinces and settle the question on our own terms, or we can stand aside and let the King take back in his own name the power we have been exercising for him. The army is waiting to be told which."
 ita_dnc.2511.a: "Then we take what was promised."
 ita_dnc.2511.b: "The King resumes what is his."
 ita_dnc.2512.t: "Vienna Asks Berlin to Judge"
 ita_dnc.2512.d: "Vienna has been asked to recognize a government that no election made, and would rather not decide it alone. The Italians are our ally on paper, and the passes they watch are the ones we would otherwise have to garrison. A word from us keeps them in the alliance, and silence sends them out of it."
 ita_dnc.2512.a: "Tell Vienna to renew."
 ita_dnc.2512.b: "This is Vienna's affair."
 ITA_o_the_house_is_sent_home_tt: "§YThe Chamber is dissolved and the prefects govern by decree.§! The party that will not accept it is already arming, and the quarrel will be settled in the field."
 ITA_o_the_prefects_answer_tt: "§YThe standing of the prefects§! rises by everything the decrees hand them."
 ITA_o_the_kingdom_restored_tt: "§YThe kingdom takes back its older name, and the Historic Right takes the government.§!"
 ITA_o_constitutional_kingdom_tt: "§YThe kingdom is named for the charter it has just honoured, and the Liberal Union takes the government.§!"
 ITA_o_if_vienna_confirms_tt: "\n§YEffects if Vienna confirms the crown:§!"
 ITA_o_tt_the_capital_answers: "Vienna will answer, and the answer decides whether the alliance still covers us."
 ITA_o_vienna_trust_tt: "§YConfidence at Vienna§! rises: the ally has put in writing what our own Chamber would not."
 ITA_o_the_king_resumes_tt: "The junta stands down, and the King governs in his own name."
 ITA_o_the_bulwark_of_latinity_tt: "§RThis National Spirit will be lost if we stand in a faction with, or fight a war on the same side as, [AUH.GetNameDef].§!"
 ITA_o_threat_the_chamber: "The Coup Against the Italian Chamber"
 ITA_o_threat_the_statuto: "The Italian Return to the Statuto"
 ITA_o_threat_the_crown_denied: "The Italian Claim on the Unredeemed Provinces"
 ITA_o_the_royal_decrees: "The Royal Decrees"
 ITA_o_the_royal_decrees_desc: "The public safety law the Chamber refused stands by decree, and the prefects hold every power it gives them. Nothing has been withdrawn, and nothing is going to be."
 ITA_o_clamp_down_on_the_leagues: "Clamp Down on the Leagues"
 ITA_o_clamp_down_on_the_leagues_desc: "The chambers of labour are watched, their funds are audited and their meetings need a permit. The order is temporary in law and permanent in practice."
 ITA_o_the_statuto_alone: "The Statuto Alone"
 ITA_o_the_statuto_alone_desc: "The King makes the treaties and names the ministers, as the charter always said he might. A kingdom that answers to no assembly has little to gain from other people's quarrels."
 ITA_o_recall_the_chamber: "The Chamber Recalled"
 ITA_o_recall_the_chamber_desc: "The deputies sit again, and the decrees are read to them before they are signed. The habit of government by prefect takes longer to lose than it took to acquire."
 ITA_o_rebuild_the_kingdom: "Rebuild the Kingdom"
 ITA_o_rebuild_the_kingdom_desc: "Everything the treasury can spare goes to the mills, the fields and the roads, and the shops are empty of everything else."
 ITA_o_national_revival: "National Revival"
 ITA_o_national_revival_desc: "The country is repairing what the fighting broke, and the work is going faster than the ministry promised."
 ITA_o_national_revival2_desc: "The country is repairing what the fighting broke, and the barracks are filling again with men who came for the wage."
 ITA_o_national_revival3_desc: "The country is repairing what the fighting broke, and the South is being built for the first time rather than policed."
 ITA_o_national_revival4_desc: "The country is repairing what the fighting broke, the barracks are full and the South is being built at last. The kingdom is stronger than the one that went into the quarrel."
 ITA_o_the_bulwark_of_latinity: "The Bulwark of Latinity"
 ITA_o_the_bulwark_of_latinity_desc: "The kingdom stands as guarantor of the Latin name from the Alps to the Levant, and the societies that teach our language abroad no longer work in secret."
 ITA_o_the_alliance_confirms_us: "The Alliance Confirms Us"
 ITA_o_the_alliance_confirms_us_desc: "The ally has recognized the government the Chamber would not, and no cabinet in Europe now asks by what right the King governs."
 ITADNC_o_the_true_enemy_is_the_west: "The True Enemy Is the West"
 ITADNC_o_the_true_enemy_is_the_west_desc: "The slap of Tunis has never been answered, and the conventions that confirmed the French protectorate were signed by ministers who no longer speak for us. Our quarrel is not in the Alps but on the far shore of the middle sea."
 ITADNC_o_expel_the_subversives: "Expel the Subversives"
 ITADNC_o_expel_the_subversives_desc: "The exceptional laws are on the books and every agitator is known to his prefect. We shall put them across the frontier and let our neighbours discover for themselves what it costs to shelter them."
 ITADNC_o_see_to_the_alpine_front: "See to the Alpine Front"
 ITADNC_o_see_to_the_alpine_front_desc: "The barrier works of the Astico and the Agno rise against a salient that hangs over Venetia. We must close the passes with concrete, and let Vienna read our answer in the plans of our engineers."
 ITADNC_o_rebuild_the_battle_fleet: "Rebuild the Battle Fleet"
 ITADNC_o_rebuild_the_battle_fleet_desc: "Colonel Cuniberti has drawn the ideal battleship, and a foreign navy has read him more carefully than our own. The slipways must be widened and the programme laid down before the design is taken from us."
 ITADNC_o_accept_the_mastery_of_the_sea: "Accept the Mastery of the Sea"
 ITADNC_o_accept_the_mastery_of_the_sea_desc: "Our coasts are open, our coal comes from Cardiff and our bread crosses water we do not control. We shall concede the sea to those who hold it, and spend on factories what we would have sunk in armour."
 ITADNC_o_safeguard_the_adriatic_shore: "Safeguard the Adriatic Shore"
 ITADNC_o_safeguard_the_adriatic_shore_desc: "The understandings with Vienna promised that no great power would take the eastern shore, and Vienna has begun to forget them. We must offer our word to the small states of that coast before someone else offers them a garrison."
 ITADNC_o_a_place_in_the_sun: "A Place in the Sun"
 ITADNC_o_a_place_in_the_sun_desc: "Corradini writes of a proletarian nation and the country reads him aloud. We shall ask, as any power asks, for a bay and a coaling station, and we shall remember the answer we are given."
 ITADNC_o_an_alliance_with_the_shadow: "An Alliance with the Shadow"
 ITADNC_o_an_alliance_with_the_shadow_desc: "If we cannot take our place in the sun, then we shall stand with those who cast the shadow over us."
 ITADNC_o_the_shore_at_antivari: "The Shore at Antivari"
 ITADNC_o_the_shore_at_antivari_desc: "The company at Antivari flies our flag, our subsidies keep Cetinje solvent, and our Queen was born on that shore. We shall guarantee the principality and build it the works that make a guarantee worth having."
 ITADNC_o_the_trentino_for_a_guarantee: "The Trentino for a Guarantee"
 ITADNC_o_the_trentino_for_a_guarantee_desc: "Article seven was written so that neither ally could move in the Balkans without paying the other. We shall name the price in plain words: the salient for our signature. Vienna may answer as it pleases."
 ITADNC_o_the_pride_of_the_new_italy: "The Pride of the New Italy"
 ITADNC_o_the_pride_of_the_new_italy_desc: "The plate rolled at Terni is the equal of any in Europe, and the triple turret is our own idea before it is anyone else's. We must lay down ships no admiralty can match rather than count hulls against richer yards."
 ITADNC_o_the_latin_understanding: "The Latin Understanding"
 ITADNC_o_the_latin_understanding_desc: "The Mediterranean agreements lapsed, and every foreign minister since has tried to reopen them and failed. We shall put the pact to all the Latin capitals at once and let each of them answer for itself."
 ITADNC_o_the_day_the_coal_stops: "The Day the Coal Stops"
 ITADNC_o_the_day_the_coal_stops_desc: "Every furnace in the north burns coal that arrives by sea from Cardiff, and the Chamber is reminded of it each winter. We must put the white coal of the Alps to work before a blockade teaches us the lesson."
 ITADNC_o_the_latin_league: "The Latin League"
 ITADNC_o_the_latin_league_desc: "The Mediterranean agreements once bound Rome, London and Madrid together, and Spain signed them last of all. We shall raise our own league in the middle sea, and send the invitation to the capitals that belong in it."
 ITADNC_o_a_free_hand_in_tunis: "A Free Hand in Tunis"
 ITADNC_o_a_free_hand_in_tunis_desc: "There are more Italians in the Regency than there are Frenchmen, and Paris no longer has the strength to argue the point. We must take the statute we were refused when the protectorate was proclaimed."
 ITADNC_o_the_military_convention: "The Military Convention"
 ITADNC_o_the_military_convention_desc: "General Cosenz promised an army on the Rhine, and every chief of staff since has reconfirmed the promise on paper. We shall turn the understanding into a convention, with the divisions counted and the railways timed."
 ITADNC_o_break_the_mediterranean_condominium: "Break the Mediterranean Condominium"
 ITADNC_o_break_the_mediterranean_condominium_desc: "Italian was struck from the courts of Malta by decree, Kassala was handed back without a word to us, and Nice and Savoy were sold over the heads of their people. The condominium of the two western powers over our sea must end."
 ITADNC_o_the_conspiracy_at_belgrade: "The Conspiracy at Belgrade"
 ITADNC_o_the_conspiracy_at_belgrade_desc: "A circle of officers in Belgrade has tired of a dynasty that takes its orders from Vienna through a secret convention. We shall find them money and silence, and be ready if the palace hears of it first."
 ITADNC_o_rekindle_the_iberian_union: "Rekindle the Iberian Union"
 ITADNC_o_rekindle_the_iberian_union_desc: "Iberism never died among the federalists of Madrid and the republicans of Lisbon; it only ever lacked a patron. We shall furnish the patron, and let the two crowns decide what to do with the idea."
 ITADNC_o_the_hour_of_vienna: "The Hour of Vienna"
 ITADNC_o_the_hour_of_vienna_desc: "Conrad has asked his Emperor for a preventive war against us in every memorandum he has written. The hour is ours the moment the Empire is busy elsewhere, and we shall not let it pass."
 ITADNC_o_the_corniche: "The Corniche"
 ITADNC_o_the_corniche_desc: "The coast road from Ventimiglia to Nice runs through the Principality, and the alpine barrier forts close every pass above it. We shall take the road, and the Principality with it."
 ITADNC_o_the_night_of_the_konak: "The Night of the Konak"
 ITADNC_o_the_night_of_the_konak_desc: "The old palace has one door that is never watched, and the officers of the guard are counted among our friends. When the night is chosen, Belgrade will wake to a new dynasty and to a different alliance."
 ITADNC_o_through_the_valais: "Through the Valais"
 ITADNC_o_through_the_valais_desc: "The Simplon is bored and the Gothard convention is signed, and the only road around the French Alps runs through the cantons. We shall use it, whatever the Confederation has to say about its neutrality."
 ITADNC_o_the_last_shore: "The Last Shore"
 ITADNC_o_the_last_shore_desc: "Valona commands the mouth of our sea, and whoever holds it can close the Adriatic against us at will. We shall not leave the eastern shore in the hands that hold it now."
 ITADNC_o_reinstate_the_lost_provinces: "Reinstate the Lost Provinces"
 ITADNC_o_reinstate_the_lost_provinces_desc: "The county of Nice and the duchy of Savoy were signed away at Turin and confirmed by a plebiscite nobody believes. We shall write them back into the kingdom under their own names, and the last shame is undone."
 ita_dnc.2515.t: "The Exiles at the Border"
 ita_dnc.2515.d: "Rome has emptied its gaols of agitators and marched them to our frontier posts with their papers in order. Our police say the men are dangerous; our liberals say that a free country does not hand refugees back. Somebody must decide before the next train arrives."
 ita_dnc.2515.a: "We are not Rome's gaoler."
 ita_dnc.2515.b: "We will police them for Rome."
 ita_dnc.2518.t: "The Bay They Ask For"
 ita_dnc.2518.d: "An Italian squadron lies off the bay and the minister has presented a note asking for a lease, a coaling station and a customs house. It is politely worded and no ultimatum is attached to it. Every concession we have ever granted began in exactly this manner."
 ita_dnc.2518.a: "The bay is leased to Rome."
 ita_dnc.2518.b: "The coast is not for sale."
 ita_dnc.2520.t: "The Word from Rome"
 ita_dnc.2520.d: "The Italian minister has offered his government's guarantee against any power that moves upon this coast, and he has named no price for it at all. A guarantee is a shield until the day it becomes a title of ownership. The court must answer before the offer is made public."
 ita_dnc.2520.a: "We accept the guarantee."
 ita_dnc.2520.b: "We will be no one's ward."
 ita_dnc.2528.t: "The Price of the Salient"
 ita_dnc.2528.d: "Rome asks for the salient by name and offers in exchange a signature on the alliance and a guarantee of our rear. The General Staff answers that the ground is worth two corps in any war against Italy. The Minister answers that an unsatisfied ally is worth less than the ground."
 ita_dnc.2528.a: "A satisfied ally is worth it."
 ita_dnc.2528.b: "Not one village of the Empire."
 ita_dnc.2530.t: "The Pact of the Middle Sea"
 ita_dnc.2530.d: "Rome proposes a standing understanding among the Latin powers: consultation before any of us moves, and no separate bargain with the great powers outside it. Nothing is promised in arms and nothing is asked in money. The whole weight of the thing is that Rome would speak first."
 ita_dnc.2530.a: "Rome may speak for the sea."
 ita_dnc.2530.b: "We keep our own counsel."
 ita_dnc.2548.t: "Two Crowns, One Peninsula"
 ita_dnc.2548.d: "The chancery across the border has voted the union and asks only that we say the word. The crowns would be joined, the armies merged, and the peninsula would answer Europe with a single voice. Our ministers are divided and the court has said nothing at all."
 ita_dnc.2548.a: "Two crowns, one peninsula."
 ita_dnc.2548.b: "Never willingly."
 ITA_o_the_capitals_answer_tt: "§YBerne and Paris will each decide what to do with the men we have expelled.§!"
 ITA_o_the_sbarramenti_tt: "Builds §Y2 land forts§! on every border province of Piedmont, Lombardy and Venetia."
 ITA_o_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_o_the_three_answer_tt: "§YMontenegro, Serbia and Greece each answer for themselves.§!"
 ITA_o_the_capital_answers_tt: "§YThe power that holds the bay will answer within the fortnight.§!"
 ITA_o_the_antivari_yards_tt: "§YBuilds 1 civilian factory in Montenegro, and opens the shared slot to hold it.§!"
 ITA_o_the_latin_understanding_tt: "§YEvery Latin capital is asked to join the understanding.§!"
 ITA_o_the_military_convention_tt: "§YEvery member of our faction is told to plan for a common front.§!"
 ITA_o_the_conspiracy_is_watched_tt: "§RBelgrade has heard of the conspiracy, and the officers will not move.§!"
 ITA_o_the_officers_are_ours_tt: "§YIf the palace has heard nothing, the officers are ours and the night may be chosen.§!"
 ITA_o_the_iberian_union_opens_tt: "§YMadrid and Lisbon may now decide between themselves to refound the union.§!"
 ITA_o_the_night_of_the_konak_tt: "§YBelgrade leaves the orbit of Vienna, and joins our faction if we lead one.§!"
 ITA_o_the_statuto_alone2: "The Statuto Alone"
 ITA_o_the_statuto_alone2_desc: "The King governs through his ministers and the Chamber is not consulted. The prefects have learned whom they answer to, and the country has learned to be quiet about it."
 ITA_o_the_naval_programme: "The Naval Programme"
 ITA_o_the_naval_programme_desc: "The slipways at Castellammare and La Spezia are laid out for hulls larger than any we have built. What the yards lose in patience they gain in the price of armour."
 ITA_o_the_mastery_of_the_sea: "Mastery of the Sea Conceded"
 ITA_o_the_mastery_of_the_sea_desc: "The naval estimates have been cut and the money has gone to the mills instead. The admirals call it a surrender; the treasury calls it arithmetic."
 ITA_o_the_white_coal: "The White Coal"
 ITA_o_the_white_coal_desc: "The alpine torrents turn the dynamos of the north and the household bill falls with them. A blockade would still hurt, but it would no longer stop the country."
 ITA_o_the_military_convention: "The Military Convention"
 ITA_o_the_military_convention_desc: "The staffs have exchanged mobilisation tables and the railway timetables agree with one another. An alliance that has been rehearsed is a different thing from an alliance that has been signed."
 ITA_o_the_subversives_abroad: "The Subversives from Italy"
 ITA_o_the_subversives_abroad_desc: "The Italian exiles have settled in our cities and brought their newspapers and their unions with them. They work cheaply and they argue loudly, and both facts are noticed."
 ITA_o_the_adriatic_guarantee: "The Guarantee from Rome"
 ITA_o_the_adriatic_guarantee_desc: "Rome has given its word against any power that moves upon this coast. The court sleeps better for it, and the great neighbour has been made to notice."
 ITA_o_industrial_support: "Italian Industrial Support"
 ITA_o_industrial_support_desc: "Italian engineers and Italian money are at work in the principality, and the works they have built are ours to use. What was a harbour is becoming a yard."
 ITA_o_the_iberian_idea: "The Iberian Idea"
 ITA_o_the_iberian_idea_desc: "The old dream of one peninsula is being printed again, and this time somebody abroad is paying for the paper. The federalists have found a patron and the crown has noticed."
 ITA_o_the_latin_league_faction: "Latin League"
 ITA_o_threat_the_true_enemy_is_the_west: "Italy Named the West Its Enemy"
 ITA_o_threat_expel_the_subversives: "Italy Expelled Its Subversives"
 ITA_o_threat_the_alpine_front: "Italy Fortified the Alpine Front"
 ITA_o_threat_a_place_in_the_sun: "Italy Asked for a Place in the Sun"
 ITA_o_threat_the_trentino_for_a_guarantee: "Italy Asked Vienna for the Trentino"
 ITA_o_threat_the_latin_understanding: "Italy Proposed a Latin Understanding"
 ITA_o_threat_the_latin_league: "Italy Raised the Latin League"
 ITA_o_threat_a_free_hand_in_tunis: "Italy Claimed a Free Hand in Tunis"
 ITA_o_threat_the_military_convention: "Italy Signed a Military Convention"
 ITA_o_threat_break_the_mediterranean_condominium: "Italy Moved Against the Middle Sea Powers"
 ITA_o_threat_the_hour_of_vienna: "Italy Turned on Vienna"
 ITA_o_threat_the_corniche: "Italy Marched on the Corniche"
 ITA_o_threat_the_night_of_the_konak: "Italy Overturned the Throne of Belgrade"
 ITA_o_threat_through_the_valais: "Italy Marched Through the Cantons"
 ITA_o_threat_the_last_shore: "Italy Claimed the Eastern Shore"
 ITADNC_o_the_king_reigns_and_does_not_govern: "The King Reigns and Does Not Govern"
 ITADNC_o_the_king_reigns_and_does_not_govern_desc: "The new reign has taken the Statuto at its word, and the ministry that closed the reaction was a bargain struck between the Crown and the Chamber. We shall make that bargain the rule: the King is to reign, and the men the country elects are to govern."
 ITADNC_o_marconi_recalled: "Marconi Recalled"
 ITADNC_o_marconi_recalled_desc: "The Post Office sent the young man away, and London paid for the wireless that the trials off La Spezia had already proved. We must call him home and give him a laboratory, before the next Italian invention is patented in another language."
 ITADNC_o_the_menace_from_the_alps: "The Menace from the Alps"
 ITADNC_o_the_menace_from_the_alps_desc: "Vienna has swallowed a province without asking Europe, and the railway she means to drive through the Sandjak will end on our own sea. We shall lay the whole affair before every paper in the Peninsula, and let the smaller courts read what a friend she is."
 ITADNC_o_the_adriatic_league: "The Adriatic League"
 ITADNC_o_the_adriatic_league_desc: "The line the Serbs want from the Danube to our coast is the answer to the line Vienna wants driven south, and every small state between the two is looking for a patron. We must be that patron, and gather them into a league of our own."
 ITADNC_o_the_danubian_membership: "The Danubian Membership"
 ITADNC_o_the_danubian_membership_desc: "Bucharest sells us her wheat, Athens seats us on her financial commission, and Sofia has our recognition of her independence without waiting for Vienna. We shall turn those three courtesies into three memberships."
 ITADNC_o_the_alpine_membership: "The Alpine Membership"
 ITADNC_o_the_alpine_membership_desc: "Bern and Monaco strike the same coin that we do, and the tunnel under the Simplon was paid for in part out of our own budget. We must ask the mountain states to sit with us, and make the customs of the Alps a Latin arrangement rather than a German one."
 ITADNC_o_the_iberian_membership: "The Iberian Membership"
 ITADNC_o_the_iberian_membership_desc: "At Algeciras the Spanish delegation voted with ours from the first session to the last, and the commercial treaty with Madrid is already signed. We shall ask both crowns of the western peninsula to join us, and speak for the Latin sea with one voice."
 ITADNC_o_the_shared_laboratories: "The Shared Laboratories"
 ITADNC_o_the_shared_laboratories_desc: "Our torpedoes come from a foreign licence and our armour plate from an English one, and the men who might have written those patents are working in other yards. We must open our laboratories to our allies and take theirs in exchange."
 ITADNC_o_the_danubian_expansion: "The Danubian Expansion"
 ITADNC_o_the_danubian_expansion_desc: "The convention with San Marino is renewable and has never once been broken, and our seat on the Ottoman debt council gives us the ear of the Porte on every tariff. We shall carry the league to the edge of the Balkans and take in both."
 ITADNC_o_no_austrian_clients_in_the_alps: "No Austrian Clients in the Alps"
 ITADNC_o_no_austrian_clients_in_the_alps_desc: "Vaduz has no army, no foreign policy of its own and a customs union with Vienna that has outlived two generations, and Monaco is bound by treaty to another master. We must break every Austrian client along the mountain wall, whatever the war costs us."
 ITADNC_o_the_wolfram_of_the_beira: "The Wolfram of the Beira"
 ITADNC_o_the_wolfram_of_the_beira_desc: "The tungsten that Terni and Ansaldo need for their cutting steel comes out of a single Portuguese district, and it goes to whoever offers the better price. We shall ask our ally for the rights to it, and pay in machines rather than in soldiers."
 ITADNC_o_pool_the_workshops: "Pool the Workshops"
 ITADNC_o_pool_the_workshops_desc: "Each of our partners keeps a workshop that does one thing better than the rest of us, and each of them guards its drawings. We must pool the drawings and the gauges, so that a gun proved in one yard can be built in every yard of the league."
 ITADNC_o_no_austrian_clients_in_the_balkans: "No Austrian Clients in the Balkans"
 ITADNC_o_no_austrian_clients_in_the_balkans_desc: "For a generation a secret convention made Belgrade a client of Vienna, and the Ballhausplatz has been buying replacements for it ever since. We shall put an end to the government of the Balkans from a chancery on the Danube."
 ITADNC_o_the_serbian_membership: "The Serbian Membership"
 ITADNC_o_the_serbian_membership_desc: "Vienna has shut her frontier against Serbian stock and Rome has fed Belgrade through the whole of the quarrel, and the railway to our own coast was drawn with Serbian engineers. We must offer the Serbs a seat while the quarrel lasts."
 ITADNC_o_the_montenegrin_membership: "The Montenegrin Membership"
 ITADNC_o_the_montenegrin_membership_desc: "Our Queen is a daughter of the Prince of Montenegro, our subsidy keeps Cetinje solvent, and the company at Antivari holds the port, the line inland and the tobacco. We shall ask the smallest of our neighbours to make the friendship a treaty."
 ITADNC_o_the_albanian_membership: "The Albanian Membership"
 ITADNC_o_the_albanian_membership_desc: "Vienna agreed with us twice that Albania should stand alone if the Porte withdrew, and the congresses of our own Albanians have met at Corigliano, at Lungro and at Naples. We must call the Albanians into the league before the ally does."
 ITADNC_o_strike_at_vienna: "Strike at Vienna"
 ITADNC_o_strike_at_vienna_desc: "The Monarchy is held together by an idea that its own peoples have stopped believing, and every nationality inside it now looks outward for a friend. We shall not conquer Vienna; we shall change the government that sits there."
 ITA_o_the_adriatic_league_tt: "Founds the Adriatic League with Rome at its head, unless we already lead a faction of our own."
 ITA_o_the_adriatic_league_faction: "Adriatic League"
 ITA_o_the_invitation_tt: "Only neighbours that still exist, answer to nobody and belong to no other faction are invited to sit with us."
 ITA_o_no_austrian_clients_in_the_alps_tt: "For every mountain state that answers to Vienna, a war goal to change the government that answers."
 ITA_o_no_austrian_clients_in_the_alps_SWI_tt: "Bern answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_alps_MCO_tt: "Monaco answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_alps_SMR_tt: "San Marino answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_alps_LIE_tt: "Vaduz answers to Vienna: a war goal to topple that government."
 ITA_o_no_austrian_clients_in_the_balkans_tt: "Every Balkan government that answers to Vienna is given a war goal to be toppled."
 ITA_o_the_wolfram_of_the_beira_tt: "Lisbon signs the resources of the mining district of the Beira over to our own industry."
 ITA_o_pool_the_workshops_tt: "Every other member of the league receives the pooled tooling of the league."
 ITA_o_the_zanardelli_ministry: "The Ministry of Compromise"
 ITA_o_the_zanardelli_ministry_desc: "The Crown has stopped choosing ministries against the Chamber, and the Chamber has stopped voting against the Crown."
 ITA_o_the_adriatic_system: "The Adriatic System"
 ITA_o_the_adriatic_system_desc: "A belt of small states along the eastern shore looks to Rome before it looks up the Danube."
 ITA_o_the_adriatic_system2: "The Adriatic System Confirmed"
 ITA_o_the_adriatic_system2_desc: "The league now feeds our own workshops, and the smaller courts have stopped asking Vienna what Rome intends."
 ITA_o_pool_the_workshops: "The Pooled Workshops"
 ITA_o_pool_the_workshops_desc: "Drawings, gauges and tooling pass freely between the yards of the league."
 ITA_o_the_menace_from_the_alps: "The Menace from the Alps"
 ITA_o_the_menace_from_the_alps_desc: "The Italian press has convinced us that the Monarchy on the Danube means to reach the sea over our heads."
 ita_adriatic_research: "Adriatic Research"
 ita_adriatic_research_desc: "The laboratories of the league report their work to one another."
 ita_dnc.2550.t: "The Noise Out of Rome"
 ita_dnc.2550.d: "Every paper from Milan to Palermo is printing the same story: that the province was taken without asking Europe, and that the railway through the Sandjak is meant to bring us down to the sea. The Consulta says nothing and lets the editors talk. A note to Rome would cost us the appearance of calm; silence will cost us the smaller courts."
 ita_dnc.2550.a: "Let them print. The province is ours."
 ita_dnc.2550.b: "Send a note, and quiet the editors."
 ita_dnc.2551.t: "A Belt of Small States"
 ita_dnc.2551.d: "Rome has gathered the courts that lie between us and the sea into a league of her own, and has put herself at the head of it. The invitations went out to Bucharest, to Bern and to Cetinje on the same morning. We can outbid her in every one of those capitals, or decide that a league of small states is not worth the price."
 ita_dnc.2551.a: "Then we shall outbid Rome in each."
 ita_dnc.2551.b: "A league of shopkeepers changes nothing."
 ita_dnc.2552.t: "Belgrade Looks to Rome"
 ita_dnc.2552.d: "The Serbs have been offered a seat in the Italian league, and they have been offered it while our own frontier stands shut against their herds. Rome has fed Belgrade through the whole of the quarrel and now presents the bill. We may shut the frontier tighter, or open it and buy back what we are losing."
 ita_dnc.2552.a: "Shut the frontier tighter."
 ita_dnc.2552.b: "Open it, and let the herds through."
 ita_dnc.2553.t: "Cetinje Looks to Rome"
 ita_dnc.2553.d: "The Queen of Italy is a daughter of the Prince of Montenegro, and the company that holds the port at Antivari, the line inland and the tobacco is Italian to the last share. Now Rome offers Cetinje a seat at her own table. The Prince has always taken whichever subsidy was the larger."
 ita_dnc.2553.a: "Then let our subsidy be the larger."
 ita_dnc.2553.b: "The Prince was bought long ago, and not by us."
 ita_dnc.2554.t: "The Albanian Congresses"
 ita_dnc.2554.d: "Twice we have promised Rome that Albania should stand alone if the Porte ever withdrew, and twice we meant it only for as long as Rome could not act on it. The schools and the consulates at Valona and Scutari are Italian, and now the invitation is Italian too. The promise is being called in."
 ita_dnc.2554.a: "The promise was made to another Rome."
 ita_dnc.2554.b: "Keep the promise, and keep the ally."
 ITADNC_u_the_army_will_not_fire: "The Army Will Not Fire"
 ITADNC_u_the_army_will_not_fire_desc: "The court has struck the decrees down, the rule against obstruction was imposed on the Chamber by royal decree, and the ministry now orders the troops into the squares a second time. The Supreme Command has answered in writing that the army will not fire on the country, and we must govern what that answer leaves standing."
 ITADNC_u_rally_the_country: "Rally the Country"
 ITADNC_u_rally_the_country_desc: "Socialists, republicans and radicals have sat together through the whole obstruction, and the popular blocs already hold the streets of the northern towns. We must call in the militias of the other camp before the prefects arm them against us."
 ITADNC_u_the_men_of_the_siege: "The Men of the Siege"
 ITADNC_u_the_men_of_the_siege_desc: "The military tribunals of Milan sentenced civilians by the hundred and the new reign began by pardoning some of them. We shall pardon the rest, and send home the officers and the prefects who signed those sentences."
 ITADNC_u_the_country_put_back_to_work: "The Country Put Back to Work"
 ITADNC_u_the_country_put_back_to_work_desc: "The works drawn up for the South were voted and never paid for, and the harbours and the aqueducts stand half built. We must finish them now, and let the country live modestly while the quarrel over its government is settled."
 ITADNC_u_the_public_works_of_the_recovery: "The Public Works of the Recovery"
 ITADNC_u_the_public_works_of_the_recovery_desc: "The rent can be converted at last, and the law on municipal enterprise lets a town run its own gas and its own trams. We shall spend what the conversion saves on the works, and put a counsellor for industry at the ministry."
 ITADNC_u_what_italy_will_be: "What Italy Will Be"
 ITADNC_u_what_italy_will_be_desc: "The proclamation has been read to the country and the oath to the Statute is to be sworn before the Chambers. We must say now what Italy is to be when the fighting ends, and we shall not be charged for the answer."
 ITADNC_u_the_workers_of_the_littoral: "The Workers of the Littoral"
 ITADNC_u_the_workers_of_the_littoral_desc: "The Chambers of Labour of Trieste and of the Littoral speak our language and the Statthalter has dissolved them all. We shall demand the ports and the valleys they organised, and take them if Vienna will not hand them over."
 ITADNC_u_the_shore_of_dalmatia: "The Shore of Dalmatia"
 ITADNC_u_the_shore_of_dalmatia_desc: "The Croat and Serb coalition has resolved at Fiume and at Zara that the coast shall be governed from the coast. We shall answer that it will be governed from Rome, and we must be ready to go and say so."
 ITADNC_u_the_valleys_of_the_confederation: "The Valleys of the Confederation"
 ITADNC_u_the_valleys_of_the_confederation_desc: "Italian hands dug the Simplon and the Gotthard, and Zurich answered their strike with a riot against them. The valleys that speak our language must come home, and the Confederation will not give them up for the asking."
 ITADNC_u_the_alpine_shield: "The Alpine Shield"
 ITADNC_u_the_alpine_shield_desc: "The principality on the upper Rhine has been in a customs union with Vienna since our grandfathers, Monaco is bound to Paris by treaty and the Republic on the mountain by convention. We shall gather the small states inside our own shield before another power gathers them into its."
 ITADNC_u_re_ratify_the_triple_alliance: "Re-Ratify the Triple Alliance"
 ITADNC_u_re_ratify_the_triple_alliance_desc: "The alliance falls due for renewal and both courts have asked whether the new Rome still means what the old one signed. We shall renew it as it stands, and let the chanceries see that a change of government has not changed our word."
 ITADNC_u_the_franco_italian_pact: "The Franco-Italian Pact"
 ITADNC_u_the_franco_italian_pact_desc: "The notes exchanged with the French ambassador say that neither power will march if the other is attacked, and neither capital has ever published them. We must put them into a signed instrument, and ask Paris to sign what she has already promised."
 ITADNC_u_offer_a_trade_proposal: "Offer a Trade Proposal"
 ITADNC_u_offer_a_trade_proposal_desc: "The customs war closed the French market to our wine and our silk and it ruined the South a second time. We shall offer the treaty of commerce that ends it, and we shall ask for nothing else in the same letter."
 ITADNC_u_request_the_french_colonies: "Request the French Colonies"
 ITADNC_u_request_the_french_colonies_desc: "The Regency was promised to us and taken by Paris, and the Italians who work its fields are the greater part of its settlers. We shall ask for a share in its government, and we must be ready for the answer that has already been given once."
 ITADNC_u_the_army_on_the_rhine: "The Army on the Rhine"
 ITADNC_u_the_army_on_the_rhine_desc: "The military convention promises an Italian army corps on the upper Rhine and every staff talk since has confirmed the promise. We shall tell our ally that the corps is ready, and ask what the alliance means to pay for it."
 ITADNC_u_reject_the_triple_alliance: "Reject the Triple Alliance"
 ITADNC_u_reject_the_triple_alliance_desc: "The republicans have asked the Chamber every year to denounce the treaty and the Chamber has never dared to put it to a vote. We shall denounce it, leave the alliance, and take the free hand the country has been demanding since the frontier was drawn."
 ITADNC_u_the_note_of_denunciation: "The Note of Denunciation"
 ITADNC_u_the_note_of_denunciation_desc: "The denunciation has been voted and it must now be delivered, in the proper form and by the proper hand. We shall send the note to the two courts, and set our consulates to the work that follows a broken alliance."
 ITADNC_u_the_hypothesis_north_east: "The Hypothesis North-East"
 ITADNC_u_the_hypothesis_north_east_desc: "The Supreme Command has kept a plan against the ally in its safe since the day the alliance was signed, and the ground has been surveyed twice over. We shall take it out and give it to the armies now facing the north-east."
 ITADNC_u_the_hypothesis_west: "The Hypothesis West"
 ITADNC_u_the_hypothesis_west_desc: "The other plan lies in the same safe, it faces the passes and the river of the west, and it has been kept as carefully as the first. We shall take it out and give it to the armies now facing that way."
 ITADNC_u_demand_the_return_of_nice: "Demand the Return of Nice"
 ITADNC_u_demand_the_return_of_nice_desc: "The plebiscites that gave away the county and the duchy were held under occupation, and our press has never let the country forget it. We shall demand them back, and Paris will hear the demand in the street before she reads the note."
 ITADNC_u_the_passes_of_the_alps: "The Passes of the Alps"
 ITADNC_u_the_passes_of_the_alps_desc: "The tunnels under the Simplon and the Gotthard carry more of our trade than any port of ours, and they run through a neutral. We shall ask the Confederation for passage, and we shall ask for the passage only."
 ITADNC_u_the_western_settlement: "The Western Settlement"
 ITADNC_u_the_western_settlement_desc: "The armies west of the mountains have stopped, and no great power holds a valley on our side of the watershed any longer. We must write the settlement now, take up the cores the war has given us, and set governors over what we hold."
 ITA_u_the_civil_war_tt: "§RThe country is at war with itself.§! The Chamber, the officers who refused and the street stand on one side; the Crown, the South and the islands on the other, and the prefects answer whoever writes to them first. Neither side is a rebellion in its own eyes."
 ITA_u_the_hundred_days_tt: "§YThe Hundred Days§! begin. Italy has a season from the first quiet day to say what she will be; if the term runs out with no answer, §RAn Uncertain Future§! settles on us."
 ITA_u_the_blocchi_answer_tt: "The popular blocs answer the call: their squads come over to us instead of being armed against us, and the leagues of the north stand with the legal country."
 ITA_u_the_tribunals_are_undone_tt: "The sentences of the military tribunals are quashed and the men who signed them lose their posts. §GStability +5%§! and the democratic vote grows by §G5%§!."
 ITA_u_the_south_is_paid_tt: "The special laws are paid at last. The decisions of §YThe South§! are open while the works run."
 ITA_u_the_industrial_counsellor_tt: "A counsellor for industry takes a desk at the ministry and the municipal works are opened. The decisions of §YPublic Works§! are open."
 ITA_u_the_oath_is_prepared_tt: "The oath is drafted and the two answers are laid before the Chamber. §YA fortnight§! is bought back on the Hundred Days, and the choice itself is free."
 ITA_u_the_littoral_is_handed_over_tt: "Vienna is already ours or already with us: the ports and the valleys of the Littoral pass to Rome without a shot. §YTrieste, Istria, Fiume, Idria, the Trentino and the Tyrol§!."
 ITA_u_the_shore_is_handed_over_tt: "Vienna is already ours or already with us: the whole shore from Zara to Budva passes to Rome without a shot."
 ITA_u_the_valleys_are_handed_over_tt: "The Confederation is already ours or already with us: §YTicino§! and §YGrisons§! pass to Rome without a shot."
 ITA_u_the_small_states_come_in_tt: "A state that is already our own subject is taken into the kingdom entire, with its army and its treasury."
 ITA_u_the_sphere_still_covers_them_tt: "§YThe sphere agreement still covers them.§! Paris has undertaken to leave the small neutrals alone and so have we, and the undertaking holds for exactly as long as we are not at war with her."
 ITA_u_the_capitals_answer_tt: "§YThe capital answers within a day.§! What it answers depends on what we have built and on what it owes elsewhere."
 ITA_u_the_offer_goes_out_tt: "The offer of a treaty of commerce leaves for Paris. §YNothing else is asked in the same letter§! and nothing else is promised."
 ITA_u_the_passage_is_asked_tt: "We ask the Confederation for the right to move troops and stores through the tunnels, and we offer to pay for every train."
 ITA_u_the_settlement_is_signed_tt: "The western settlement is signed. Every state we hold west of the watershed becomes ours in law, and four governorates of the west are opened."
 ITA_u_the_provisional_regime_tt: "§YThe Supreme Command takes the ministries.§! The most colourless soldier in the army governs until the question is settled, and the army obeys him because he is one of them."
 ITA_u_the_chamber_sits_tt: "§YThe Chamber sits in permanence.§! No soldier is put over the ministries, and the deputies govern in the middle of a war they cannot direct."
 ITA_u_the_hundred_days_are_won_tt: "§GThe Hundred Days are won.§! A form of state has been chosen before the term ran out, and the prefects know again whose orders they take."
 ITA_u_the_regime_is_settled_tt: "§GThe question of the regime is settled.§! The Hundred Days close, and §RAn Uncertain Future§! will not be laid on us."
 ITA_u_the_customs_line_is_moved_tt: "The customs line moves to the watershed and the old posts in the valleys come down."
 ITA_u_threat_the_army_refuses: "The Italian army has refused an order"
 ITA_u_threat_the_regency: "Rome asks for a share of the Regency"
 ITA_u_threat_the_denunciation: "Rome has denounced her alliance"
 ITA_u_threat_the_western_claim: "Rome claims the county and the duchy"
 ITA_u_the_provisional_regime: "The Provisional Regime"
 ITA_u_the_provisional_regime_desc: "A soldier holds the ministries and signs what the Chamber votes. The staff work is quick and the political work is slow, and nobody pretends the arrangement is a government."
 ITA_u_the_blocchi_popolari: "The Popular Blocs"
 ITA_u_the_blocchi_popolari_desc: "Socialists, republicans and radicals share one list and one street. The leagues bring in men the conscription office never found, and they expect to be heard when the fighting stops."
 ITA_u_the_municipal_works: "The Municipal Works"
 ITA_u_the_municipal_works_desc: "The towns run their own gas, their own water and their own trams, and the savings of the conversion pay for the rest. The country is poor but it is working again."
 ITA_u_uncertain_future: "An Uncertain Future"
 ITA_u_uncertain_future_desc: "The provisional arrangement has outlived its term and no form of state has been chosen. The prefects obey whoever writes first and the ministries answer only to themselves."
 ITA_u_the_alliance_re_ratified: "The Alliance Re-Ratified"
 ITA_u_the_alliance_re_ratified_desc: "The old articles have been signed again by a government that was in the street a season ago. The two courts are reassured, and so is every chancery that reads the renewal."
 ITA_u_the_pact_with_paris: "The Pact with Paris"
 ITA_u_the_pact_with_paris_desc: "Neither power marches if the other is attacked, and the paper says so in plain words at last. The western frontier can be thinned and the fleet can look east."
 ITA_u_the_commercial_treaty: "The Commercial Treaty"
 ITA_u_the_commercial_treaty_desc: "The tariff walls come down and the wine, the silk and the wheat cross the frontier again. Both treasuries lose a little revenue and both peoples eat better for it."
 ITA_u_the_continental_engagement: "The Continental Engagement"
 ITA_u_the_continental_engagement_desc: "An army corps is earmarked for a river we have never seen, and the staffs exchange timetables every spring. The alliance is worth more to us because we are worth more to it."
 ITA_u_the_corps_on_the_rhine: "The Corps on the Rhine"
 ITA_u_the_corps_on_the_rhine_desc: "The corps has gone north with its guns and its trains. Our allies count on it, and the passes behind it are held by fewer men than the staff would like."
 ITA_u_the_free_hand_ns: "The Free Hand"
 ITA_u_the_free_hand_ns_desc: "We are bound to nobody and owed by nobody. Every chancery must ask what Rome will do, and none of them can be told in advance."
 ITA_u_the_denunciation: "The Denunciation"
 ITA_u_the_denunciation_desc: "The note has been delivered and the consulates have been set to the work that follows. Our ministers abroad are busier than they have been in a generation."
 ITA_u_the_alpine_transit: "The Alpine Transit"
 ITA_u_the_alpine_transit_desc: "The tunnels are open to our trains and we pay for every one of them. The mountain has stopped being a wall and started being a road."
 ITA_u_the_hypothesis_north_east: "The Hypothesis North-East"
 ITA_u_the_hypothesis_north_east_desc: "The plan against the ally has come out of the safe and gone to the army commands. The ground is surveyed, the bridges are numbered, and the staff has been waiting a long time."
 ITA_u_the_hypothesis_west: "The Hypothesis West"
 ITA_u_the_hypothesis_west_desc: "The plan against the west has come out of the same safe. The passes are surveyed and the timetable for the first fortnight is already printed."
 ITA_u_the_hundred_days: "The Hundred Days"
 ITA_u_governorate_west: "The Governorates of the West"
 ITA_u_growing_dissent_mission: "The Hundred Days"
 ITA_u_growing_dissent_mission_desc: "The provisional regime has given itself a term, and the term is short. If no form of state is chosen before it runs out, the country will be governed by nobody in particular for as long as that lasts."
 ITA_u_the_prefecture_of_nice: "The Prefecture of Nice"
 ITA_u_the_prefecture_of_nice_desc: "A prefect of our own goes to the county, the registers are translated and the schools are reopened in the language of the valleys."
 ITA_u_the_prefecture_of_savoy: "The Prefecture of Savoy"
 ITA_u_the_prefecture_of_savoy_desc: "The duchy that gave the dynasty its name is administered from Rome again, and the house that came from it says so at every ceremony."
 ITA_u_the_roads_over_the_passes: "The Roads over the Passes"
 ITA_u_the_roads_over_the_passes_desc: "The military roads of the old frontier are widened for traffic and the valleys stop being a dead end."
 ITA_u_the_western_customs_line: "The Western Customs Line"
 ITA_u_the_western_customs_line_desc: "The customs posts come down in the valleys and go up again on the watershed, where the mountains put them."
 ita_dnc.2600.t: "The Comando Refuses"
 ita_dnc.2600.d: "The ministry has ordered the troops into the squares a second time, and the Supreme Command has refused the order in writing and published the refusal. The Chamber is in permanent session, the prefects have the security guards, the Crown has the seal, and the country now has two governments and one army. Whoever holds the ministries while the quarrel is settled will be the one the army obeys."
 ita_dnc.2600.a: "Let the Comando hold the ministries"
 ita_dnc.2600.b: "The Chamber sits in permanence"
 ita_dnc.2601.t: "The Hundred Days Are Gone"
 ita_dnc.2601.d: "The provisional arrangement has outlasted the term it set itself and nobody can say any longer what form the state has. The prefects take their orders from whoever writes to them first, and the ministries answer to themselves. Nothing will be settled until somebody is willing to be called the government."
 ita_dnc.2601.a: "Let it run on, then"
 ita_dnc.2820.t: "Rome Renews the Treaty"
 ita_dnc.2820.d: "The Italian ambassador has brought the alliance back to us with the same articles and a new government behind them. The men who signed the last renewal are gone, and the men who took the ministries were in the street against their own Crown a season ago. Renewing costs us nothing today and may cost us the Adriatic tomorrow."
 ita_dnc.2820.a: "The treaty holds"
 ita_dnc.2820.b: "Rome has changed too much"
 ita_dnc.2821.t: "Rome Signs Again"
 ita_dnc.2821.d: "The Italian ambassador has laid the alliance before the Chancellery unaltered and asks for our signature under it. We have always held that the worth of Rome is the army corps she promises the upper river, and that promise has not been withdrawn. Vienna will read our answer before the ink on it is dry."
 ita_dnc.2821.a: "The treaty holds"
 ita_dnc.2821.b: "Rome has changed too much"
 ita_dnc.2822.t: "Rome Offers a Pact"
 ita_dnc.2822.d: "Rome proposes to turn the notes our ambassadors exchanged into a signed instrument: neither power marches if the other is attacked. The same government has just renewed its alliance in Vienna and in Berlin, and the Chamber will ask how both papers can be honest. A signature buys us the mountain frontier and costs us the answer we owe London."
 ita_dnc.2822.a: "The notes of the two ministers stand"
 ita_dnc.2822.b: "Not while Rome sits in Berlin"
 ita_dnc.2824.t: "The Wine and the Silk"
 ita_dnc.2824.d: "Rome asks for the treaty of commerce that would end the tariff war, and asks for nothing else in the same letter. Our growers have had the market to themselves since the walls went up and they will be heard in the Chamber. The Italians have already sold their harvest elsewhere and can wait longer than we can."
 ita_dnc.2824.a: "The customs war is over"
 ita_dnc.2824.b: "The tariff stays"
 ita_dnc.2826.t: "Rome Asks for the Regency"
 ita_dnc.2826.d: "The Italian minister asks for a share in the government of the Regency, on the ground that most of the settlers who work it are his countrymen. The Protectorate was our answer to that argument once, and the argument has not improved with keeping. Refusing will put the claim into every Italian newspaper, and it will stay there."
 ita_dnc.2826.a: "A condominium in the Regency"
 ita_dnc.2826.b: "The Protectorate is not shared"
 ita_dnc.2827.t: "Paris Shares the Regency"
 ita_dnc.2827.d: "Paris has agreed to a joint administration and the first Italian resident is already on the boat. The settlers who cleared those fields will be governed by their own consuls at last. The Chamber will want to know what we gave up for it."
 ita_dnc.2827.a: "Send the resident"
 ita_dnc.2828.t: "Rome Offers the Corps"
 ita_dnc.2828.d: "Rome has told the alliance that the army corps promised for the upper river is mobilised and waiting for a railway timetable. Sending it would thin the passes at the moment our neighbour is counting the battalions there. Keeping it at home would tell every chancery in Europe what the alliance is worth."
 ita_dnc.2828.a: "Send the corps"
 ita_dnc.2828.b: "Keep them in the Alps"
 ita_dnc.2830.t: "The Alliance Is Denounced"
 ita_dnc.2830.d: "The Italian ambassador has read out a note denouncing the alliance and has asked for no reply. He did not ask for terms, he did not ask for time, and he left the paper on the table and went home. The treaty is at an end and the frontier is now a frontier like any other."
 ita_dnc.2830.a: "So be it, then"
 ita_dnc.2832.t: "The Note to the Courts"
 ita_dnc.2832.d: "The formal note has followed the denunciation and goes over the same ground in the language of lawyers. Rome asks that the commercial articles be kept in force and that her consulates be left alone. We may let her go quietly, or we may make the departure expensive for her."
 ita_dnc.2832.a: "Let her go quietly"
 ita_dnc.2832.b: "She will be watched"
 ita_dnc.2834.t: "Rome Asks for the County"
 ita_dnc.2834.d: "The Italian note asks for the county and the duchy back and calls the plebiscites that gave them to us a fraud carried out under occupation. The argument has been made in their press for two generations and nobody in ours has ever troubled to answer it. Yielding would cost us the mountain frontier; refusing will cost us whatever friendship is left."
 ita_dnc.2834.a: "Take them and be quiet"
 ita_dnc.2834.b: "Nice is France"
 ita_dnc.2835.t: "The County Comes Home"
 ita_dnc.2835.d: "The commissioners have signed and the county and the duchy pass to us without a shot fired. The generation that voted under occupation is mostly gone, and the one that follows it will vote for us. The frontier now sits where the mountains put it."
 ita_dnc.2835.a: "Raise the flag over the prefecture"
 ita_dnc.2836.t: "Rome Asks for Passage"
 ita_dnc.2836.d: "Rome asks for the right to move troops and stores through the tunnels and offers to pay for every train that runs. The tunnels were dug so that no power should ever have to ask, and the whole of our standing rests on refusing such requests. Granting it would buy us a friend on the south side of the mountain."
 ita_dnc.2836.a: "The tunnels are open"
 ita_dnc.2836.b: "Neutrality is not for sale"
 ITADNC_u_call_the_general_strike: "Call the General Strike"
 ITADNC_u_call_the_general_strike_desc: "The dead at Buggerru and at Castelluzzo have done what no congress could, and the chambers of labour are voting to stop the whole country at once. We shall call the strike ourselves, ruin the season's work, and come out of it with a side."
 ITADNC_u_the_bureau_of_the_leagues: "The Bureau of the Leagues"
 ITADNC_u_the_bureau_of_the_leagues_desc: "Every league keeps its own books and its own informers, and the ministry knows more about us than we know about ourselves. We shall put a single secretariat over them all, and learn who is paid by the prefecture before we are asked to govern."
 ITADNC_u_the_office_of_public_vigilance: "The Office of Public Vigilance"
 ITADNC_u_the_office_of_public_vigilance_desc: "The central register of subversives holds a card for every one of us, drawn up by clerks who never expected the men on the cards to read them. We shall take the files as they stand and keep them working, with the names on the other side of the ledger."
 ITADNC_u_the_agents_beyond_the_frontier: "The Agents Beyond the Frontier"
 ITADNC_u_the_agents_beyond_the_frontier_desc: "Our people were followed to London, to Lugano and to Paterson by men the ministry paid, and the reports came back to Rome with the ordinary post. We must send our own beyond the frontier, because the quarrel does not stop at the customs house."
 ITADNC_u_the_men_who_came_back_from_lugano: "The Men Who Came Back from Lugano"
 ITADNC_u_the_men_who_came_back_from_lugano_desc: "The papers printed in Switzerland were read in every valley of the north, and the men who printed them were expelled from one canton after another. We shall call them home and give them work, because an exile who has been watched knows how watching is done."
 ITADNC_u_the_fasci_brought_back: "The Fasci Brought Back"
 ITADNC_u_the_fasci_brought_back_desc: "The leagues of Sicily were dissolved by decree and their leaders were tried by court martial, and the name has been forbidden ever since. We shall raise the fasci again, and this time give them an establishment instead of a banner."
 ITADNC_u_the_army_of_the_leagues: "The Army of the Leagues"
 ITADNC_u_the_army_of_the_leagues_desc: "The programme asks for the abolition of the standing army and for a nation in arms, and the officer corps was chosen by the men we have just put out. We shall clear the seniority lists and give the commands to those who did not fire."
 ITADNC_u_the_delegates_in_the_regiments: "The Delegates in the Regiments"
 ITADNC_u_the_delegates_in_the_regiments_desc: "Our speakers have been tried for what they said outside the barracks gates, and the conscripts inside heard every word of it. We shall seat a delegate in each regiment, and let the men argue with their officers about what an army is for."
 ITADNC_u_the_levy_of_the_leagues: "The Levy of the Leagues"
 ITADNC_u_the_levy_of_the_leagues_desc: "Short service and a militia are written into the programme, and the classes we never called are standing in the piazza waiting to be asked. We shall take them all at once, and accept that they will reach the depots knowing nothing."
 ITADNC_u_the_country_is_ours: "The Country Is Ours"
 ITADNC_u_the_country_is_ours_desc: "The country stood still for five days and the government could not find a general who would order the volleys. We shall say plainly that the kingdom is finished, put the republic of the workers in its place, and answer for what the powers make of it."
 ITADNC_u_the_minimum_programme: "The Minimum Programme"
 ITADNC_u_the_minimum_programme_desc: "Universal suffrage, a nation in arms, freedom of association, the eight hours and a graduated tax were voted at Rome and never asked for since. We shall govern on that paper alone, and let the congress choose the man who reads it out."
 ITADNC_u_the_syndicate_governs: "The Syndicate Governs"
 ITADNC_u_the_syndicate_governs_desc: "The men of the Avanguardia have carried the party at Bologna, and they hold that the union and not the deputy is the unit of the state. We shall let the chambers of labour govern, and stop pretending that a parliament will ever be the instrument."
 ITADNC_u_the_municipality_takes_it: "The Municipality Takes It"
 ITADNC_u_the_municipality_takes_it_desc: "The law lets a commune take over its own gas, its own water and its own trams, and Milan and Bologna have shown what the accounts look like afterwards. We shall municipalise everything the law allows, and pay for it out of what the concessions cost us."
 ITADNC_u_the_works_to_the_syndicate: "The Works to the Syndicate"
 ITADNC_u_the_works_to_the_syndicate_desc: "At Parma the chamber of labour administered the province for a whole season while the landowners waited for troops that were never sent. We shall hand the works to the unions that already run them, and take the loss in tidiness for the gain in reach."
 ITADNC_u_the_liberties_are_not_suspended: "The Liberties Are Not Suspended"
 ITADNC_u_the_liberties_are_not_suspended_desc: "Every ministry of the last generation answered a strike with a state of siege, and we were the ones carried down the steps. We shall not suspend a single liberty we were denied, and the Direction will answer for the order of the country."
 ITADNC_u_the_congress_governs: "The Congress Governs"
 ITADNC_u_the_congress_governs_desc: "Imola, Bologna, Rome and Florence settled more than the Chamber ever did, and the deputies came back from each to be told what they had voted for. We shall make the congress the sovereign body, and let anyone who wants a say come and take a card."
 ITADNC_u_the_state_takes_the_works: "The State Takes the Works"
 ITADNC_u_the_state_takes_the_works_desc: "The railways have been run for the shareholders and repaired for nobody, and the law that takes them is already drafted. We shall put the lines, the shops and the men on the state's books, and build the plant the companies would not."
 ITADNC_u_the_single_council: "The Single Council"
 ITADNC_u_the_single_council_desc: "The higher council of labour was set up to be consulted and then ignored, and it has advised on everything and decided nothing. We shall give it the decision itself, and let one room settle what a dozen ministries used to argue about."
 ITADNC_u_the_confederation_of_labour: "The Confederation of Labour"
 ITADNC_u_the_confederation_of_labour_desc: "The chambers of labour and the trade federations have met at Milan and agreed at last to speak with one voice. We shall recognize the confederation as the other half of the government, and stop treating a strike as a matter for the police."
 ITADNC_u_the_collective_tenancies: "The Collective Tenancies"
 ITADNC_u_the_collective_tenancies_desc: "In the Romagna the day labourers have rented whole estates together and farmed them in common for a generation, without a lira of credit. We shall lend the leases the money and the drains they were always refused, and let the land answer for the loan."
 ITADNC_u_the_worker_who_gives_more: "The Worker Who Gives More"
 ITADNC_u_the_worker_who_gives_more_desc: "The cooperative congresses preach emulation and the chambers of labour quarrel about piecework, and neither argument has ever been settled. We shall reward the worker who gives more, and hear from the rest that we have become the masters."
 ITADNC_u_the_pensions_of_the_state: "The Pensions of the State"
 ITADNC_u_the_pensions_of_the_state_desc: "The national provident fund is voluntary, underfunded and known to almost nobody, and the bills to make it compulsory were tabled and never voted. We shall vote them, and let a man who has worked his life out stop working without asking his sons."
 ITADNC_u_the_state_works_at_terni: "The State Works at Terni"
 ITADNC_u_the_state_works_at_terni_desc: "The steelworks live on the navy's orders and bank their furnaces the moment the estimates are cut. We shall put the state's own orders behind them, and keep the plate and the guns coming from a works that answers to us and not to a syndicate of banks."
 ITADNC_u_the_women_of_the_leagues: "The Women of the Leagues"
 ITADNC_u_the_women_of_the_leagues_desc: "The law on the hours of women and children was carried against the mills, and the women entered on the rolls at Ancona were struck off again within the month. We shall bring them into the leagues on the same card as the men, and give up the night shift to do it."
 ita_dnc.2620.t: "Who Shall Lead the Republic"
 ita_dnc.2620.d: "The congress has sat three days in a hall that used to be a theatre, and voted on everything except the one question it came for. The names before it are the man who wrote the programme, the man who would sooner govern with the army than against it, the man the unions sent, and, when the fortress has opened, the man who walked out of it. Whichever we choose will be told he was the compromise."
 ita_dnc.2620.a: "Turati wrote it. Let him read it."
 ita_dnc.2620.b: "Bissolati, and no more quarrels."
 ita_dnc.2620.c: "The unions have sent Rigola."
 ITA_u_the_provinces_rise_tt: "§YMilan, Genoa and Turin come out with the leagues.§! The strike costs us the season's work wherever it holds, and while the clock of the civil war is still running it buys us time on it."
 ITA_u_the_bureau_watches_tt: "§YThe secretariat reads the post of every chamber of labour, and the informers are listed before they are paid.§!"
 ITA_u_the_vigilance_office_tt: "§YThe central register keeps working, with our names taken off it and the ministry's put on.§! §RThe office is dissolved the day this road is abandoned.§!"
 ITA_u_the_agents_abroad_tt: "§YOur own people watch the emigration now, and the reports come to the party and not to the prefecture.§!"
 ITA_u_the_frontier_is_no_wall_tt: "§YWhat is printed in Lugano is read in the valleys inside a week.§!"
 ITA_u_the_exiles_are_called_home_tt: "§YThe writers expelled from Bern and from Geneva come home to paid work.§!"
 ITA_u_the_leagues_in_arms_tt: "§YThe Leagues in Arms§! is the militia's own account. Every step of this road adds a line to it, and the whole army reads the total."
 ITA_u_the_country_is_ours_tt: "§YThe kingdom is declared finished, and the powers are told so in writing.§! The road divides here between the ballot and the union."
 ITA_u_the_congress_elects_tt: "§YThe congress meets to choose the head of the republic.§!"
 ITA_u_the_syndicate_governs_tt: "§YArturo Labriola takes the government, and the chambers of labour take the state.§!"
 ITA_u_the_works_in_common_tt: "§YThe Works in Common§! is the ledger of everything taken into public hands. Every step of this road adds a line to it, and the whole of industry reads the total."
 ITA_u_the_direction_tt: "§YThe Direction§! is the executive of the party. Every step of this road adds a line to what it may do, and the government of the country reads the total."
 ITA_u_the_syndicate_is_recognised_tt: "§YThe confederation is recognized as the other half of the government.§!"
 ITA_u_the_tenancies_tt: "§YThree of our own provinces get the drains and the sheds the leases were always refused.§!"
 ITA_u_the_pensions_tt: "§YA man who has worked his life out stops working without asking his sons.§!"
 ITA_u_the_night_shift_is_closed_tt: "§RThe mills may no longer be worked at night, and that decision is closed to us for good.§!"
 ITA_ud_the_province_is_raised_tt: "§YOne more of our own provinces comes out with the leagues.§!"
 ITA_ud_the_mills_run_at_night_tt: "§YThe night shift ends, and the looms go back to the day.§!"
 ITA_u_threat_the_country_is_ours: "The Italian Republic of the Leagues"
 ITA_u_the_general_strike: "The General Strike"
 ITA_u_the_general_strike_desc: "The mills are cold, the ports are shut and the trains are not running, and nobody goes back to work until the leagues say so. What it costs is being paid now, and what it buys will be counted later."
 ITA_u_the_bureau_of_the_leagues: "The Bureau of the Leagues"
 ITA_u_the_bureau_of_the_leagues_desc: "One secretariat now keeps the books of every chamber of labour, and reads their post before the prefect does."
 ITA_u_the_agents_abroad: "The Agents Beyond the Frontier"
 ITA_u_the_agents_abroad_desc: "Our own men follow the emigration through Switzerland, France and England, and the reports come home to the party."
 ITA_u_the_exiles_of_lugano: "The Men Who Came Back"
 ITA_u_the_exiles_of_lugano_desc: "The writers expelled from one canton after another are on our payroll now, and they know precisely how a police force follows a man."
 ITA_u_the_country_is_ours: "The Country Is Ours"
 ITA_u_the_country_is_ours_desc: "The kingdom has been declared finished and nothing has yet been put in its place, and every office in the country is waiting to be told whose it is."
 ITA_u_the_minimum_programme: "The Minimum Programme"
 ITA_u_the_minimum_programme_desc: "The republic has one sheet of paper for a constitution, and every measure is read against it in public before it is voted."
 ITA_u_the_pensions_of_the_state: "The Pensions of the State"
 ITA_u_the_pensions_of_the_state_desc: "The provident fund is compulsory, funded and paid, and men who would have worked until they dropped are at home instead."
 ITA_u_the_women_of_the_leagues: "The Women of the Leagues"
 ITA_u_the_women_of_the_leagues_desc: "The law on the hours is enforced, the leagues take women on the same card as the men, and the registers are longer for it."
 ITA_u_the_direction: "The Direction"
 ITA_u_the_direction_desc: "The executive of the party sits above the ministries and answers for them, and what this road has voted it, it keeps."
 ITA_u_the_leagues_in_arms: "The Leagues in Arms"
 ITA_u_the_leagues_in_arms_desc: "The army is being rebuilt around the leagues rather than around the depots, and it shows in the men long before it shows on a map."
 ITA_u_the_works_in_common: "The Works in Common"
 ITA_u_the_works_in_common_desc: "Mills, lines and land taken into common hands are kept on one account, and every builder in the country reads that account."
 ITA_u_the_vigilance_office: "The Office of Public Vigilance"
 ITA_u_the_vigilance_office_desc: "The register of subversives is still kept, still complete and still growing, and it now watches the other side of the room."
 ITA_u_the_leagues_cat: "The Leagues"
 ITA_ud_the_province_is_raised: "Raise Another Province"
 ITA_ud_the_province_is_raised_desc: "The strike holds where the leagues are strong and stops at the next prefecture. Send the speakers and the funds, and it will not stop there."
 ITA_ud_the_mills_run_at_night: "The Mills Run at Night"
 ITA_ud_the_mills_run_at_night_desc: "The looms and the furnaces can be kept going through the night, and the leagues will not care to be asked. It buys output, and it is paid for in temper."
 ITADNC_u_royalist_sentiment: "Royalist Sentiment"
 ITADNC_u_royalist_sentiment_desc: "The old King has been buried and the Queen's prayer is printed in every paper in the Kingdom, and men who never cheered a Savoy in their lives are standing bareheaded in the street. The dynasty is the one thing the country still agrees upon, and we must build on it before the mood passes."
 ITADNC_u_the_oath_to_the_statuto: "The Oath to the Statuto"
 ITADNC_u_the_oath_to_the_statuto_desc: "The new King has sworn before the Chambers to keep the constitution his grandfather granted, and the deputies who expected a soldier have found a constitutional prince instead. We shall hold him to the words he used, and make the oath the charter of the reign rather than a ceremony."
 ITADNC_u_return_to_the_statuto: "Return to the Statuto"
 ITADNC_u_return_to_the_statuto_desc: "Sonnino has argued for years that the constitution never made the ministry answerable to the Chamber, and that parliamentary government is a usurpation of the royal prerogative. We shall read the articles as they were written and give the naming of ministers back to the Crown; the deputies will vote the budget and nothing else."
 ITADNC_u_the_country_is_consulted: "The Country Is Consulted"
 ITADNC_u_the_country_is_consulted_desc: "The general elections have sent back a Chamber that no single group can command, and the King must now choose among the men the constituencies gave him. We shall let the country speak first and the Quirinal decide afterwards, so that whoever is called governs with a majority he did not have to buy."
 ITADNC_u_the_king_is_called_home: "The King Is Called Home"
 ITADNC_u_the_king_is_called_home_desc: "The Queen is a Petrovic and the subsidy that keeps Cetinje solvent is drawn on the Italian treasury, yet Vienna still claims a right to be consulted about the little kingdom's affairs. We shall ask the Prince for a son of his house, and for his foreign policy to be placed where his daughter already is. Cetinje may refuse, and if it does the arrangement will be made without it."
 ITADNC_u_the_supreme_command_governs: "The Supreme Command Governs"
 ITADNC_u_the_supreme_command_governs_desc: "A general has governed by decree within living memory, and the staff has never forgotten how quiet the provinces were while he did it. We shall put the Supreme Command at the head of the state and spare the King a ministry altogether; the man who signs will be whoever the staff can agree upon."
 ITADNC_u_no_bands_in_the_streets: "No Bands in the Streets"
 ITADNC_u_no_bands_in_the_streets_desc: "The public security law already lets a prefect dissolve any association by decree, and the chambers of labour have learned to march wherever the police are thin. We shall take politics out of the street entirely: no processions, no uniforms, no bands, and no meeting that has not been declared."
 ITADNC_u_the_scholars_come_home: "The Scholars Come Home"
 ITADNC_u_the_scholars_come_home_desc: "Our best physicist works in England because no Italian ministry would pay for his masts, and the navy had to sign a convention with a foreign company to use an invention made here. We must bring the men and their patents home, and pay them what the Admiralty was paying for the same work abroad."
 ITADNC_u_the_kings_academy: "The King's Academy"
 ITADNC_u_the_kings_academy_desc: "The academy of the Lincei was refounded as the academy of the Kingdom and has lived ever since on the civil list rather than the budget, and the Crown has quietly paid for more research than the ministry of instruction. We shall make the royal patronage an institution, with chairs, laboratories and a stipend a young man can live on."
 ITADNC_u_the_sea_that_closes: "The Sea That Closes"
 ITADNC_u_the_sea_that_closes_desc: "Every ton of coal that turns an Italian wheel comes by sea from Cardiff, and the shipping that carries it is not ours and will not sail for us on the day we need it most. We shall fill the depots at Taranto while the peace lasts, and buy at leisure what we would otherwise have to beg for."
 ITADNC_u_the_subversives_expelled: "The Subversives Expelled"
 ITADNC_u_the_subversives_expelled_desc: "The anti-anarchist law lets us put a man on a train, and the international conference at Rome obliged our neighbours to take an interest in where he gets off. We shall clear the plotters out of the Kingdom and let the frontier they cross decide what to do with them."
 ITADNC_u_the_school_of_turin: "The School of Turin"
 ITADNC_u_the_school_of_turin_desc: "Piedmont made the Kingdom with the army before the deputies had agreed on a flag, and the war school still teaches that a state is what its regiments can hold. We shall put the school back at the centre of the service and let it form the officers who will form the country."
 ITADNC_u_the_liberal_leaning: "The Liberal Leaning"
 ITADNC_u_the_liberal_leaning_desc: "The radicals and the Extreme have come in from the wilderness, and the popular blocs are winning towns that used to be safe for the prefect. We shall give the shield a liberal colour and govern with the men who can speak to the leagues without calling out the troops."
 ITADNC_u_the_conservative_leaning: "The Conservative Leaning"
 ITADNC_u_the_conservative_leaning_desc: "The constitutional right has a newspaper of its own at last, and Sonnino and Salandra are printing what the ministries have only dared to do. We shall give the shield a conservative colour and govern with the men who believe the state should be obeyed before it is loved."
 ITADNC_u_the_shared_laboratories: "The Shared Laboratories"
 ITADNC_u_the_shared_laboratories_desc: "The international congresses meet every other year, and the exhibition at Milan brought half the instrument makers of Europe through the new tunnel to look at us. We shall open our laboratories to whoever will open theirs, and take our share of every result."
 ITADNC_u_the_technical_missions: "The Technical Missions"
 ITADNC_u_the_technical_missions_desc: "Terni learned to roll armour from Vickers and Ansaldo learned to bore guns from Armstrong, and both learned it by sending men abroad rather than by buying drawings. We shall send the missions out as a matter of policy, and share what they bring back with everyone who marches beside us."
 ITADNC_u_the_kings_machines: "The King's Machines"
 ITADNC_u_the_kings_machines_desc: "The aerostatic park has its field on the lake and the specialist brigade has more ideas than money, while the naval staff quietly draws a battleship no other navy has thought of yet. We shall pay for both out of the royal establishment and let the ministries argue about it afterwards."
 ITADNC_u_everything_for_the_army: "Everything for the Army"
 ITADNC_u_everything_for_the_army_desc: "The war is here, and the depots we filled in peace are the only thing standing between the divisions and an empty magazine. We shall open them entire and give the army everything, and settle the accounts when there is a country left to settle them in."
 ITADNC_u_the_garibaldian_legion: "The Garibaldian Legion"
 ITADNC_u_the_garibaldian_legion_desc: "The red shirts went to Greece under a Garibaldi within the memory of serving officers, and the Kingdom has used the volunteers as often as it has feared them. We shall raise the legion under the royal colours, so that the men who would have marched against us march for us instead."
 ITADNC_u_the_territorial_militia: "The Territorial Militia"
 ITADNC_u_the_territorial_militia_desc: "The mobile and territorial militias exist on paper and have neither officers nor rifles enough to be worth the paper they are listed on, and every reform since has been argued about and shelved. We shall officer them properly out of the reserve and count them as troops rather than as a list of names."
 ITADNC_u_the_state_that_provides: "The State That Provides"
 ITADNC_u_the_state_that_provides_desc: "The labour office and the superior council of labour were voted by men who disagreed about everything else, and the law on the work of women and children passed the same way. We shall make provision the business of the state rather than of a party, and let both colours claim it."
 ITADNC_u_the_station_at_coltano: "The Station at Coltano"
 ITADNC_u_the_station_at_coltano_desc: "The Crown has given the marshes near Pisa to the man who sent a signal across the Atlantic, and the masts are going up on royal ground because no ministry could find the site. We shall finish the station and set the Kingdom at the centre of a net that reaches the fleet wherever it happens to be."
 ITADNC_u_the_piedmontese_gunners: "The Piedmontese Gunners"
 ITADNC_u_the_piedmontese_gunners_desc: "The licence for the quick-firing gun is bought and the field piece it yields is the equal of anything in Europe, but the men who serve it are still trained as their fathers were. We shall rebuild the artillery school at Turin around the new gun and teach the whole arm again."
 ITADNC_u_the_glory_of_the_royal_army: "The Glory of the Royal Army"
 ITADNC_u_the_glory_of_the_royal_army_desc: "The army has carried the verdict of Adwa on its back for a generation, and every promotion board and every recruit knows it. We shall bury that verdict under a service the country is proud of, and make the Royal Army the first institution of the Kingdom again."
 ITADNC_u_the_shield_of_the_constitution: "The Shield of the Constitution"
 ITADNC_u_the_shield_of_the_constitution_desc: "The Hague has met twice and an Italian has taken the peace prize for arguing that arbitration is worth more than an alliance, and our gendarmes already keep order in Macedonia under a European mandate. We shall summon the governments that answer to no chamber to accept the arbitration they signed and never meant to honour. Those who will not sit down with us will find that we hold a court's warrant and an army."
 ita_dnc.2610.t: "Rome Has Asked"
 ita_dnc.2610.d: "The Italian minister has requested an audience for a week hence, and has let it be known privately what he intends to lay on the table when he comes. The Prince has that long to decide whether the house of Petrovic answers Rome, Vienna, or nobody at all. A court that must think aloud in front of its own ministers has already lost something."
 ita_dnc.2610.a: "Brace, and count our friends."
 ita_dnc.2602.t: "The House at Cetinje"
 ita_dnc.2602.d: "The paper is on the Prince's table. Rome asks for a son of the house to be brought up at the Quirinal and for our despatches to be read there before they are answered, and offers the subsidy, the harbour company and a guarantee in exchange. Vienna will hear of it before the ink is dry, and Vienna has opinions about this house."
 ita_dnc.2602.a: "The two houses are already one."
 ita_dnc.2602.b: "Cetinje is not a Roman province."
 ita_dnc.2603.t: "The Prince Comes to Rome"
 ita_dnc.2603.d: "The Prince has accepted. A boy of the house of Petrovic will be brought up at the Quirinal, the harbour company passes into Italian hands, and the little kingdom's despatches will be read here before they are answered. What we make of the arrangement is now our own affair, and the Ballhausplatz will read whichever version we choose to publish."
 ita_dnc.2603.a: "Bind the two crowns openly."
 ita_dnc.2603.b: "Take the harbour and say nothing."
 ita_dnc.2604.t: "The Men from Rome"
 ita_dnc.2604.d: "A train from Italy has left a crowd of men on our platform with expulsion orders in their pockets and no country willing to take them any further on. Rome calls them anarchists; our own police call them printers, cobblers and one poet. We may keep them under watch at our own expense, or put them back on the train and let Rome explain the matter to its Chamber."
 ita_dnc.2604.a: "Keep them, and open a file on each."
 ita_dnc.2604.b: "Send them back where they printed."
 ita_dnc.2606.t: "The Ministry Is Chosen"
 ita_dnc.2606.d: "The returns are in and no group has the majority that would let the King simply send for its leader. The palace may call the man the Chamber will follow, who governs by bargaining and lasts as long as the bargain does, or the man the Crown trusts, who governs by decree and is obeyed until he is not. Both will hold the country; they will not hold it in the same way."
 ita_dnc.2606.a: "Send for the man the Chamber follows."
 ita_dnc.2606.b: "Send for the King's own man."
 ita_dnc.2608.t: "A Summons to The Hague"
 ita_dnc.2608.d: "An Italian note has been handed to our foreign ministry. The Kingdom invites us to submit our quarrels with our neighbours to the permanent court and to accept a commission that answers to nobody we appoint. Refusing costs us nothing today, and hands Rome a grievance it may keep for as long as it finds convenient."
 ita_dnc.2608.a: "We will sit at the court."
 ita_dnc.2608.b: "Rome may keep its lectures."
 ITA_u_crown_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_u_crown_if_they_refuse_tt: "\n§YEffects if they refuse:§!"
 ITA_u_crown_tt_the_capital_answers: "§YCetinje will answer.§! The Prince may bind his house to ours, or send the Italian minister home and let Vienna hear of it."
 ITA_u_crown_tt_the_capitals_answer: "§YEvery court that answers to no chamber is summoned.§! Those that sit down with us become our friends; those that refuse hand us a warrant against them."
 ITA_u_tt_the_articles_returned: "The articles that give the Crown the naming of ministers and the dissolution of the Chamber are read again as they were written, and the practice of the last reign lapses."
 ITA_u_tt_the_command_governs: "The chief of the staff takes the presidency of the council. He is not a party and he has no programme; the army has one, and it will be carried out."
 ITA_u_tt_the_prefects_may_act: "The prefects may now dissolve an association by decree, and the guards of public safety answer to the ministry of the interior alone."
 ITA_u_tt_the_academies_are_open: "The chairs left empty for want of money are filled, and the men who took their instruments abroad are offered them back at home."
 ITA_u_tt_the_royal_patronage: "The civil list pays for the laboratories the budget will not, and the academy of the Kingdom answers to the Crown rather than to the ministry of instruction."
 ITA_u_tt_the_depots_are_filled: "Coal, oil and grain are bought while the sea is open and stored where the fleet can guard them. Nothing here is spent on the army today; all of it is waiting for the army."
 ITA_u_tt_the_depots_are_opened: "The depots are opened entire. What was bought against a blockade goes to the divisions in the field, and the civil economy is told to wait."
 ITA_u_tt_the_neighbour_decides: "The expelled men are put over the frontier. Whether they are watched, jailed or sent straight back to us is no longer our decision."
 ITA_u_tt_the_school_forms_the_country: "The war school takes the whole promotion list through its hands, and an officer who has not passed it does not command."
 ITA_u_crown_tt_an_advisor_is_available: "§YA political adviser is now willing to serve:§!"
 ITA_u_tt_the_red_shirts_muster: "The volunteer legions muster under the royal colours, officered from the reserve list and paid by the war ministry."
 ITA_u_tt_the_verdict_reversed: "The verdict of Adwa is struck out of the service, and the burden the defeat laid on the army is lifted if it is still borne."
 ITA_u_tt_the_laboratories_are_shared: "Our institutes are opened to every ally, and theirs to us. The exchange is worth twice as much when there is a faction to exchange with."
 ITA_u_tt_the_royal_workshops: "The airship park and the naval drawing office are paid out of the royal establishment, and neither has to wait for a vote."
 ITA_u_tt_the_station_speaks: "The station on the royal estate carries the fleet's traffic and the government's, and any ship under our flag can be reached from it."
 ITA_u_tt_the_country_answers: "The constituencies have spoken and the King must choose. The Chamber's man and the Crown's man will not govern the same country."
 ITA_u_the_royal_army_tt: "§YThe Army of the Kingdom§! grows with every reform of the road. It is read by the gunnery of the whole land service, and the country reads it too."
 ITA_u_artillery_attack_tt: "Artillery attack of the Royal Army: §Y[?ITA_u_army_artillery_attack|%1]§!"
 ITA_u_artillery_defence_tt: "Artillery defence of the Royal Army: §Y[?ITA_u_army_artillery_defence|%1]§!"
 ITA_u_the_royal_army: "The Army of the Kingdom"
 ITA_u_the_royal_army_desc: "The gunners of Turin are the arm the monarchic road pays for first, and every licence bought and every battery re-taught is felt in the field before it is felt in the estimates."
 ITA_u_the_king_restored: "The King at the Head of the State"
 ITA_u_the_king_restored_desc: "The Crown is again the first authority of the Kingdom and not the last resort of a ministry. Whoever governs, governs in the King's name and knows he may be replaced in it."
 ITA_u_the_shield_of_the_state: "The Shield of the State"
 ITA_u_the_shield_of_the_state_desc: "Politics has been taken out of the street and put back into the Chamber, where the prefects can watch it. The country is quieter, and the men who lived by processions are looking for other work."
 ITA_u_the_shield_of_the_left: "The Shield of the State: The Left"
 ITA_u_the_shield_of_the_right: "The Shield of the State: The Right"
 ITA_u_the_shield_of_the_left_and_labour: "The Left Shield and the Office of Labour"
 ITA_u_the_shield_of_the_right_and_labour: "The Right Shield and the Office of Labour"
 ITA_u_the_shield_of_the_left_complete: "The Left Shield of the Constitution"
 ITA_u_the_shield_of_the_right_complete: "The Right Shield of the Constitution"
 ITA_u_the_school_of_turin: "The School of Turin"
 ITA_u_the_school_of_turin_desc: "The war school teaches that the Kingdom was made by regiments and is held by them, and the officers it turns out believe it. So, increasingly, does everyone they command."
 ITA_u_the_school_of_turin_2: "The School of Turin: The Levy"
 ITA_u_the_school_of_turin_3: "The School of Turin: The Glory of the Army"
 ITA_u_the_school_of_turin_4: "The School of Turin: The First Institution"
 ITA_u_the_scholars_returned: "The Scholars Returned"
 ITA_u_the_royal_patronage: "The Royal Patronage"
 ITA_u_the_depots_at_taranto: "The Depots at Taranto"
 ITA_u_the_depots_at_taranto_desc: "The coal and the oil are bought while the sea is open and stored where the fleet can watch them. It is money spent on nothing at all, until the day it is the only money that was well spent."
 ITA_u_everything_for_the_army: "Everything for the Army"
 ITA_u_the_technical_missions: "The Technical Missions"
 ITA_u_the_station_at_coltano: "The Station at Coltano"
 ITA_u_the_volunteers: "The Volunteers Under the Royal Colours"
 ITA_u_the_volunteers_desc: "Men who came to the depots for a cause rather than for a conscription notice, and who will fight harder and obey a little worse than the line. The war ministry has decided it can live with that."
 ITA_u_the_house_of_petrovic: "The House of Petrovic"
 ITA_u_the_house_of_petrovic_desc: "The marriage has become an arrangement. A prince of Cetinje is brought up at the Quirinal, the harbour company is ours, and the little kingdom's despatches are read here first."
 ITA_u_the_returned_exiles: "The Exiles Sent Back"
 ITA_u_the_men_from_rome: "The Men from Rome"
 ITA_u_the_oath_to_the_statuto: "the oath to the Statuto"
 ITA_u_return_to_the_statuto: "the return to the Statuto"
 ITA_u_the_king_is_called_home: "the demand made at Cetinje"
 ITA_u_the_shield_of_the_constitution: "the summons to the court"
 the_scholars_come_home: "The Scholars Come Home"
 the_kings_academy: "The King's Academy"
 the_shared_laboratories: "The Shared Laboratories"
 the_kings_machines: "The King's Machines"
 the_station_at_coltano: "The Station at Coltano"
 the_piedmontese_gunners: "The Piedmontese Gunners"
 ITADNC_u_the_second_note_to_paris: "The Second Note to Paris"
 ITADNC_u_the_second_note_to_paris_desc: "The first note was signed in a winter and told Paris only that we would not join an attack upon her. We shall send a second and go further, promising a free hand in the west for a free hand in the east, and let the alliance find out when it can."
 ITADNC_u_the_defence_treaty_with_paris: "The Defence Treaty with Paris"
 ITADNC_u_the_defence_treaty_with_paris_desc: "A note that says nothing in public protects nobody in a crisis. We must turn the understanding into a guarantee that binds both frontiers, and keep the paper in a drawer where Berlin and Vienna will not read it."
 ITADNC_u_the_industrial_cooperation: "The Industrial Cooperation"
 ITADNC_u_the_industrial_cooperation_desc: "The steel of Terni and the dynamos of Milan want capital, and the only capital in Europe that will come without a political price is French. We shall open the north to the banks of Paris and let them build what our own houses cannot."
 ITADNC_u_the_shared_patents: "The Shared Patents"
 ITADNC_u_the_shared_patents_desc: "Our foundries copy what they are shown and pay for what they are not. We shall trade licences with Schneider and Saint-Chamond, handing over the drawings of Terni and Ansaldo in exchange, so that neither works alone."
 ITADNC_u_the_coal_and_the_ore: "The Coal and the Ore"
 ITADNC_u_the_coal_and_the_ore_desc: "Every furnace we light burns coal that came by sea from Cardiff, and a fleet that is not ours can stop all of it. We shall trade the ore of the island for the coal of the Loire, and buy nothing across the Channel that a friend can sell us."
 ITADNC_u_the_works_for_the_ore: "The Works for the Ore"
 ITADNC_u_the_works_for_the_ore_desc: "France has the ore and the bauxite, and we have the men who know how to work them. We shall offer to move plant across the Alps in exchange for what comes out of her ground, and let the two economies hold each other by something heavier than a treaty."
 ITADNC_u_the_spheres_in_the_middle_sea: "The Spheres in the Middle Sea"
 ITADNC_u_the_spheres_in_the_middle_sea_desc: "Two Latin powers cannot both want the same shore and remain friends. We shall draw the line ourselves, leaving the west to Paris and taking the east, and we shall hold to it exactly as long as Paris does."
 ITADNC_u_the_hand_to_barcelona: "The Hand to Barcelona"
 ITADNC_u_the_hand_to_barcelona_desc: "They shot the schoolmaster in the ditch of Montjuic, and the news emptied our own workshops for a week. We shall send men, money and printers to the Catalan comrades, and learn in their streets what our own will one day need."
 ITADNC_u_the_comrades_of_the_east: "The Comrades of the East"
 ITADNC_u_the_comrades_of_the_east_desc: "The strikers of Petersburg are fed by subscriptions taken up in Turin and Milan, and the police of two empires read the same lists. We shall put the collection on a proper footing and send more than money to the east."
 ITADNC_u_the_littoral_rises: "The Littoral Rises"
 ITADNC_u_the_littoral_rises_desc: "The principle of nationality was made here, and it can be turned against the empire that once used it on us. We shall not march to annex the Littoral; we shall call it out, and let the workmen of Trieste unmake the government that holds them."
 ITADNC_u_the_general_strike_abroad: "The General Strike Abroad"
 ITADNC_u_the_general_strike_abroad_desc: "The congresses voted that the answer to a war is a strike in every country that declares it, and no party has yet dared to try it. We shall try it, and pay for the halls, the printers and the funds that make it possible beyond our own frontier."
 ITADNC_u_support_the_proletarian_uprising: "Support the Proletarian Uprising"
 ITADNC_u_support_the_proletarian_uprising_desc: "A rising that runs out of bread in a fortnight teaches the wrong lesson to everyone who watched it. We shall keep a standing fund at the disposal of the Chambers of Labour, so that the next one abroad does not end for want of money."
 ITADNC_u_the_hand_to_lisbon: "The Hand to Lisbon"
 ITADNC_u_the_hand_to_lisbon_desc: "They killed a king in the square, and the throne that replaced him is held up by nothing but the garrison. We shall offer the Portuguese republicans everything they lack, and tell the palace plainly what we shall do if it refuses."
 ITADNC_u_the_congress_of_the_nations: "The Congress of the Nations"
 ITADNC_u_the_congress_of_the_nations_desc: "Trentini, Ruthenes, Poles and Croats have no seat in any parliament that governs them, and our own deputies have asked for years that they be given one. We shall call them to Rome, and let the empires read what they say."
 ITADNC_u_the_red_legion: "The Red Legion"
 ITADNC_u_the_red_legion_desc: "The red shirts went abroad for other men's freedom within living memory, and the volunteers are still there to be called. We shall raise the legion again, under the Leagues this time and not under a general."
 ITADNC_u_the_international_at_rome: "The International at Rome"
 ITADNC_u_the_international_at_rome_desc: "The party has asked at every congress that the International sit in Rome, and has been refused every time by men who thought us provincial. We shall call it here on our own authority, and be the address to which the workmen of Europe write."
 ITADNC_u_a_europe_of_labour: "A Europe of Labour"
 ITADNC_u_a_europe_of_labour_desc: "Paris and Amsterdam resolved that the continent belongs to those who work it, and then went home to their own parliaments. We shall act on the resolution instead of reprinting it, and let every small state in Europe hear it from us first."
 ITADNC_u_the_end_of_the_thrones: "The End of the Thrones"
 ITADNC_u_the_end_of_the_thrones_desc: "The minimum programme says what is to be done with crowns, and we have already done it with our own. We shall not stop at the Alps, and no dynasty in Europe will be able to say that it was not warned."
 ITADNC_u_the_ships_that_carry_them: "The Ships That Carry Them"
 ITADNC_u_the_ships_that_carry_them_desc: "The state pays the subsidy that keeps the emigrant liners running, and the state may therefore say who sails and what sails with them. We shall use the conventions as an instrument, and make the fleet that empties our villages carry our politics with it."
 ITADNC_u_proletarian_solidarity: "Proletarian Solidarity"
 ITADNC_u_proletarian_solidarity_desc: "The Chambers of Labour keep their own funds for the widows and the locked out, and they have never been asked to keep one for each other. We shall bind the funds together, so that what one city can spare another city may draw."
 ITADNC_u_the_end_of_the_protectorates: "The End of the Protectorates"
 ITADNC_u_the_end_of_the_protectorates_desc: "The reformers in London have shown the continent what a protectorate does to the men inside it, and our press has printed every word of it. We shall take the case up where they left it, and say plainly that no flag has the right to farm a people."
 ITADNC_u_the_leagues_of_the_plate: "The Leagues of the Plate"
 ITADNC_u_the_leagues_of_the_plate_desc: "There are more Italians on the Plate and in Sao Paulo than in many of our provinces, and their halls and their presses are already ours. We shall organise them properly, and the residence laws written to break them shall not."
 ITADNC_u_the_young_turks: "The Young Turks"
 ITADNC_u_the_young_turks_desc: "The officers who rose at Salonica proved that an old empire can be made to change its constitution in a summer. We shall find the men who will do the same elsewhere in the Levant, and see that they want for neither money nor arms."
 ITADNC_u_war_on_the_counting_house: "War on the Counting House"
 ITADNC_u_war_on_the_counting_house_desc: "Bologna resolved that capital has no country, and the greatest counting house of all now sits behind two oceans and calls itself a republic. We must break it there, or watch it buy back everything we have taken here."
 ITADNC_u_the_answer_to_tokyo: "The Answer to Tokyo"
 ITADNC_u_the_answer_to_tokyo_desc: "We sold the two cruisers that won Japan her war, and made a new empire in the east out of our own yards. We shall answer for that ourselves, before the fleet we built comes back to teach us the lesson."
 ITADNC_u_the_labour_hegemony: "The Labour Hegemony"
 ITADNC_u_the_labour_hegemony_desc: "The Leagues govern here, and a single red state ringed by empires is a state waiting to be strangled. We shall make labour the master of the continent, and let the name this country has already taken mean what it says."
 ita_dnc.2700.t: "The Second Note from Rome"
 ita_dnc.2700.d: "The Italian ambassador has left a note which says, without saying it, that Rome will not march with Vienna and Berlin against us. Nothing is signed and nothing is published; the Consulta asks only that we put the same words on paper. It costs us no army and no colony, and it makes an enemy of the Triple Alliance the day it is known."
 ita_dnc.2700.a: "Barrere may have his answer."
 ita_dnc.2700.b: "Rome signs with everyone."
 ita_dnc.2702.t: "A Treaty of Mutual Defence"
 ita_dnc.2702.d: "Rome now asks for what the note left unsaid: that neither of us shall be attacked without the other standing up. Our staff wants the Alpine frontier quiet and our admirals want the middle sea shared. The Italians want a guarantee they can show to nobody, and the price is that we answer for their quarrels as they answer for ours."
 ita_dnc.2702.a: "Then let both frontiers be safe."
 ita_dnc.2702.b: "We guarantee nobody's adventures."
 ita_dnc.2704.t: "The Capital for the Mills"
 ita_dnc.2704.d: "Rome has asked our banks to take shares in the steel and the electricity of her north, where the plant exists and the money does not. The houses that would put it there ask only for the blessing of the government. What we build there we shall not own, and what we build there will one day sell against us."
 ita_dnc.2704.a: "Paris has capital and Milan has none."
 ita_dnc.2704.b: "Our banks will not build a rival."
 ita_dnc.2706.t: "The Licences Exchanged"
 ita_dnc.2706.d: "The Italians propose that Schneider and Saint-Chamond open their drawings to Terni and Ansaldo, and that the Italian houses open theirs in return. Our engineers say the exchange is uneven and that we should be teaching more than we learn. Our ministers say a workshop that owes us its patents follows our policy."
 ita_dnc.2706.a: "Let the drawings cross the Alps."
 ita_dnc.2706.b: "We do not lend our trade secrets."
 ita_dnc.2708.t: "Coal for Ore"
 ita_dnc.2708.d: "Rome offers the ore of her island for the coal of the Loire, cargo against cargo, without either of us asking Cardiff for anything. Our mines would gain a customer who pays and her furnaces a supply no fleet can cut. It would tie the two economies so tightly that neither could carry a quarrel as far as a war."
 ita_dnc.2708.a: "Let the ships be loaded."
 ita_dnc.2708.b: "Our coal is wanted at home."
 ita_dnc.2710.t: "A Line Across the Sea"
 ita_dnc.2710.d: "The Italians propose to draw a line through the middle sea, and that each of us promise not to cross it. The eastern shore and the islands off it would be their affair; the west, from the ocean coast to the desert, would be ours. No congress will ratify it, and it will hold only as long as both governments wish it to."
 ita_dnc.2710.a: "The west is ours, the east theirs."
 ita_dnc.2710.b: "We divide nothing with Rome."
 ita_dnc.2880.t: "The Ships from Genoa"
 ita_dnc.2880.d: "Italian volunteers, Italian money and Italian newspapers have come ashore for the strikers of the city, and the garrison has asked for orders. To let them work is to admit that the quarrel in our own streets is now an affair of the whole continent. To turn them back is to say so to the workmen ourselves, in front of the barricades."
 ita_dnc.2880.a: "Let the comrades land."
 ita_dnc.2880.b: "The frontier is closed to them."
 ita_dnc.2882.t: "Rome Offers the Republic"
 ita_dnc.2882.d: "The Italians write that the throne here has outlived the country under it, and that Rome will stand behind whatever the republicans put in its place. They offer money, presses, and recognition on the first morning. They do not say what they will do if we thank them and change nothing, but the tone leaves little room to wonder."
 ita_dnc.2882.a: "The republic will be proclaimed."
 ita_dnc.2882.b: "This crown is not Rome's to give."
 ita_dnc.2884.t: "The Congress Meets at Rome"
 ita_dnc.2884.d: "The Italians have called the International to sit in their own capital, and have sent us a place on the platform. Our delegates would speak beside theirs and vote beside theirs, and what the congress resolved would be read in every hall we have. It would also make Rome the address to which the workmen of the world write."
 ita_dnc.2884.a: "Our delegates will take the train."
 ita_dnc.2884.b: "The International sits nowhere."
 ita_dnc.2886.t: "A Congress of Nationalities"
 ita_dnc.2886.d: "Rome proposes a congress of the peoples who have no state, and has invited the ones inside our own frontiers by name. The Italians call it a hearing; our prefects call it a school for agitators with a foreign address. Whatever we answer will be printed, and the peoples in question will read it before our parliament does."
 ita_dnc.2886.a: "Let them go, and let them talk."
 ita_dnc.2886.b: "No passports for that congress."
 ITA_u_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_u_if_they_refuse_tt: "\n§YEffects if they refuse:§!"
 ITA_u_tt_the_capital_answers: "§YThe capital we have written to will answer for itself,§! and what it answers is not ours to decide."
 ITA_u_spheres_of_influence_tt: "§YOurs under the agreement:§! the Tripolitanian shore and the Cyrenaican, the Regency, the Albanian coast and the Black Mountain."
 ITA_u_the_western_sphere_tt: "§YTheirs under the agreement:§! the Sherifian empire, the Algerian departments and the Syrian coast."
 ITA_u_the_works_for_the_ore_tt: "§YUnlocks decisions to move industry to France in exchange for resources.§!"
 ITA_u_the_littoral_rises_tt: "§YThe Leagues call the workmen of the Littoral out against the Statthalter,§! and Rome answers for whatever follows."
 ITA_u_the_general_strike_abroad_tt: "§YIf we belong to no bloc, the Leagues open one of their own,§! and every party that follows us may sit in it."
 ITA_u_support_the_proletarian_uprising_tt: "§YA standing fund is placed at the disposal of the Chambers of Labour§! for risings that are not our own."
 ITA_u_the_congress_of_the_nations_tt: "§YEvery European power that governs a nation without its consent is asked to send it to Rome.§!"
 ITA_u_the_red_legion_tt: "§YThe Leagues raise their own volunteers,§! and the legion may be sent where a ministry would never send the army."
 ITA_u_the_leagues_abroad_tt: "§YUnlocks the decisions of the Leagues Abroad:§! the strike funds, the speakers and the presses we keep in other men's countries."
 ITA_u_the_international_at_rome_tt: "§YNo fraternal government sits anywhere yet;§! the congress will be called the day one does."
 ITA_u_a_europe_of_labour_tt: "§YEvery small state in Europe hears the resolution from us,§! and hears it before its own ministers do."
 ITA_u_the_end_of_the_thrones_tt: "§YWe take a quarrel with every crowned government in Europe that is neither our subject nor our ally.§!"
 ITA_u_bypass_the_end_of_the_thrones_tt: "§YThere is no crowned government left in Europe to answer for.§!"
 ITA_u_the_ships_that_carry_them_tt: "§YThe subsidised liners become an instrument of policy,§! and the republics of the Plate learn who fills their cities."
 ITA_u_proletarian_solidarity_tt: "§YThe funds of the Chambers of Labour are made common,§! and what one city can spare another may draw."
 ITA_u_the_end_of_the_protectorates_tt: "§YEvery people held under another flag learns that Rome has spoken for it.§!"
 ITA_u_the_leagues_of_the_plate_tt: "§YThe halls and the presses of the emigration go to work on the republics of the south.§!"
 ITA_u_the_young_turks_tt: "§YThe committees of the Levant find money, printers and officers,§! and they know where they came from."
 ITA_u_war_on_the_counting_house_tt: "§YThe quarrel is with capital itself, and capital keeps its books beyond the ocean.§!"
 ITA_u_the_answer_to_tokyo_tt: "§YThe yards that built her fleet will answer for it.§!"
 ITA_u_the_labour_hegemony_tt: "§YEvery major power holding ground in Europe that is not with us is now against us.§!"
 ITA_u_the_workers_international: "The Workers' International"
 ITA_u_a_europe_of_labour: "A Europe of Labour"
 ITA_u_the_end_of_the_thrones: "The End of the Thrones"
 ITA_u_the_end_of_the_protectorates: "The End of the Protectorates"
 ITA_u_war_on_the_counting_house: "War on the Counting House"
 ITA_u_the_answer_to_tokyo: "The Answer to Tokyo"
 ITA_u_the_labour_hegemony: "The Labour Hegemony"
 ITA_u_the_hand_to_lisbon: "The Hand to Lisbon"
 ITA_u_the_shared_patents_ns: "The Shared Patents"
 ITA_u_the_shared_patents_ns_desc: "The drawings cross the Alps in both directions, and neither works alone any longer."
 ITA_u_french_trade_ns: "The Coal of the Loire"
 ITA_u_french_trade_ns_desc: "Ore goes north and coal comes south, and no fleet in the Channel decides whether our furnaces burn."
 ITA_u_the_french_capital: "French Capital in the North"
 ITA_u_the_french_capital_desc: "Paris owns a share of the mills it paid to build, and takes that share home."
 ITA_u_the_eastern_subscription: "The Eastern Subscription"
 ITA_u_the_solidarity_funds: "The Solidarity Funds"
 ITA_u_the_red_legion_ns: "The Red Legion"
 ITA_u_the_red_legion_ns_desc: "Volunteers of the Leagues, sworn to no ministry and sent where the army would not go."
 ITA_u_the_emigrant_fleet: "The Emigrant Fleet"
 ITA_u_the_emigrant_fleet_desc: "The subsidised liners carry more than passengers, and the government decides what."
 ITA_u_war_on_the_counting_house_ns: "War on the Counting House"
 ITA_u_the_answer_to_tokyo_ns: "The Answer to Tokyo"
 ITADNC_u_the_free_hand: "The Free Hand"
 ITADNC_u_the_free_hand_desc: "The Consulta calls its own doctrine the free hand, and the phrase has outlived the ministers who coined it. We shall owe our signature to no capital, and let each of them bid for it in turn."
 ITADNC_u_the_mediterranean_system: "The Mediterranean System"
 ITADNC_u_the_mediterranean_system_desc: "The agreements that once bound Rome to the powers of the middle sea have lapsed, and every foreign minister since has tried to reopen them and failed. We must rebuild the system under our own hand, and let the whole basin learn whose word holds it together."
 ITADNC_u_the_alliance_renewed: "The Alliance Renewed"
 ITADNC_u_the_alliance_renewed_desc: "Vienna wants the treaty renewed ahead of time and without paying anything for it, exactly as it was renewed before. We shall put our signature on the paper and name our own price in the same breath. The Monarchy may answer as it pleases."
 ITADNC_u_the_habsburg_question: "The Habsburg Question"
 ITADNC_u_the_habsburg_question_desc: "The press and the memoranda of the Consulta argue over what follows the Monarchy, and nobody in Vienna will say the word aloud. We shall ask it plainly, and ask whether the nationalities are to be heard at all. A refusal will be answered where refusals are answered."
 ITADNC_u_rekindle_the_royalist_sentiment: "Rekindle the Royalist Sentiment"
 ITADNC_u_rekindle_the_royalist_sentiment_desc: "The funeral at Monza and the prayer of our Queen turned a murdered king into a rallying cry, and the courts of Europe read every word of it. We shall export that summer to our neighbours, and let their thrones remember who stood beside them."
 ITADNC_u_carve_up_the_littoral: "Carve Up the Littoral"
 ITADNC_u_carve_up_the_littoral_desc: "The resolutions of Fiume and Zara claim the eastern shore for a coalition that never thought to invite us. We must read them backwards and claim the Littoral ourselves, before the men who wrote them are strong enough to hold it."
 ITADNC_u_align_the_south_slavs: "Align the South Slavs"
 ITADNC_u_align_the_south_slavs_desc: "The Croat and Serb deputies have resolved at Fiume and at Zara to act as one, and their resolutions ask Vienna for what Vienna will never grant. We shall offer what Vienna refuses, and ask only that they look south when they look for a patron."
 ITADNC_u_sway_the_balkans: "Sway the Balkans"
 ITADNC_u_sway_the_balkans_desc: "Our officers hold the Monastir sector of the international gendarmerie, and General De Giorgis is obeyed there as no foreign officer is obeyed elsewhere. We must turn a police mandate into a standing influence, and put a consul behind every gendarme."
 ITADNC_u_establish_a_customs_union: "Establish a Customs Union"
 ITADNC_u_establish_a_customs_union_desc: "The commercial treaties Luzzatti negotiated proved that our exports can live without their protection, and our partners have read the same returns. We shall pull the tariff wall down between us, and let the middle sea trade as a single market."
 ITADNC_u_the_first_award_at_rome: "The First Award at Rome"
 ITADNC_u_the_first_award_at_rome_desc: "Tittoni asked that the quarrels of the Balkans be judged at Rome rather than at Berlin, and he was never given the chair. We shall take it ourselves and hand down the first award, so that the claimants learn where judgement lives."
 ITADNC_u_the_mediterranean_cooperation_sphere: "The Cooperation Sphere"
 ITADNC_u_the_mediterranean_cooperation_sphere_desc: "Our post offices in the Ottoman lands and our consulates in the Levant already carry a great deal more than mail. We must bind them into one sphere with our partners, so that a survey, a school and a shipping line all move on the same word."
 ITADNC_u_extend_the_system_eastward: "Extend the System Eastward"
 ITADNC_u_extend_the_system_eastward_desc: "The commercial treaty with the Porte opened Smyrna, Beirut and Salonica to our consuls, and our merchants followed them within the season. We shall carry the system east, and invite the capitals of the near east to sit in it."
 ITADNC_u_the_capitulations: "The Capitulations"
 ITADNC_u_the_capitulations_desc: "Our consular courts at Constantinople and at Smyrna judge our own subjects under our own law, and the Porte has never dared to close them. We must have the privileges written down again and widened, so that trade follows the flag into the Empire."
 ITADNC_u_the_second_award_at_rome: "The Second Award at Rome"
 ITADNC_u_the_second_award_at_rome_desc: "The first award was obeyed, and the claimants who were not heard have come back to Rome with their maps. We shall judge again on the same model, and let the second beneficiary owe us what the first already owes."
 ITADNC_u_the_trade_agreements: "The Trade Agreements"
 ITADNC_u_the_trade_agreements_desc: "The commercial treaties are signed, and the partners of the system now ask for the same terms among themselves. We shall extend the schedules to every member, and let the middle sea keep its own accounts."
 ITADNC_u_the_integrated_economies: "The Integrated Economies"
 ITADNC_u_the_integrated_economies_desc: "The exposition at Milan showed the continent an Italy standing at the crossing of the Simplon and the sea. We must braid our industries into those of our partners, until no member of the system can price a ton of steel alone."
 ITADNC_u_the_neutral_republic: "The Neutral Republic"
 ITADNC_u_the_neutral_republic_desc: "The notes exchanged with Barrere bind Paris and Rome to stand aside from each other's quarrels, and neither of us denounced a treaty to do it. We shall put the understanding on paper, and let the Republic sign for its own neutrality. Paris will be told before the ink is ordered."
 ITADNC_u_the_march_on_the_var: "The March on the Var"
 ITADNC_u_the_march_on_the_var_desc: "The western hypothesis has been kept current by every chief of staff since Saletta, and the railways to the frontier are counted in it. We shall take the plan out of its drawer and march the army to the river it names."
 ITADNC_u_the_note_to_christiania: "The Note to Christiania"
 ITADNC_u_the_note_to_christiania_desc: "The northern kingdom took its independence without a shot, and the powers signed for its integrity soon afterwards. We shall send our own note north, and offer a guarantee that costs the recipient nothing but a signature."
 ITADNC_u_the_mediterranean_confederation: "The Mediterranean Confederation"
 ITADNC_u_the_mediterranean_confederation_desc: "The press and the chancelleries have each drawn up a confederation of the middle sea, and neither has ever managed to convene one. We shall convene it, and give the system a common table rather than a common creditor."
 ITADNC_u_the_latin_sisters: "The Latin Sisters"
 ITADNC_u_the_latin_sisters_desc: "The note of Prinetti and the visit of the President to Rome have already made the Latin entente a fact that neither capital will admit. We must ask Paris to admit it in writing, and to stand with us in the sea we share."
 ITADNC_u_the_hand_on_the_var: "The Hand on the Var"
 ITADNC_u_the_hand_on_the_var_desc: "The Regency holds more of our countrymen than of theirs, and the staff has drawn a coup that no minister has ever been shown. Paris is bound by the treaty and cannot answer with an army. We shall take the Regency while the treaty holds."
 ITADNC_u_partition_the_porte: "Partition the Porte"
 ITADNC_u_partition_the_porte_desc: "The Consulta has debated three Ottoman policies through the whole of the crisis, and the first of them is to share the Empire out. We shall put the partition to our partners, and let each of them name the share it wants. The Porte will hear of it soon enough."
 ITADNC_u_prop_up_the_porte: "Prop Up the Porte"
 ITADNC_u_prop_up_the_porte_desc: "The second policy of the Consulta is to keep the Empire standing, because a weak neighbour on the far shore is worth more than a strong one dividing it. We shall guarantee the Porte, and build it the works that make a guarantee worth having."
 ITADNC_u_the_shore_alone: "The Shore Alone"
 ITADNC_u_the_shore_alone_desc: "The third policy asks for the shore and for nothing else, neither a share of the capital nor a word about the straits. We shall name that price to the Porte and take nothing beyond the dunes. A refusal will be settled on the shore itself."
 ITADNC_u_the_league_of_the_middle_sea: "The League of the Middle Sea"
 ITADNC_u_the_league_of_the_middle_sea_desc: "The system began as a lapsed set of agreements and has become a table at which the whole basin sits. We shall name it a league at last, and let the middle sea be governed by those who live upon it."
 ita_dnc.2720.t: "The Treaty Comes Up Again"
 ita_dnc.2720.d: "The ambassador from Rome asks that the alliance be renewed early and without conditions, as it was renewed before any of us held office. He offers the Monarchy a place in a system that Rome intends to lead, and he does not pretend otherwise. Signing keeps our southern frontier quiet; refusing leaves it to the generals."
 ita_dnc.2720.a: "Rome is still worth having."
 ita_dnc.2720.b: "The Monarchy needs no Latin partner."
 ita_dnc.2722.t: "The Nationalities Speak"
 ita_dnc.2722.d: "The Italian note asks, in the politest possible language, what the Monarchy intends to do about the peoples it governs and does not represent. Whatever answer we give will be printed in Zagreb and in Prague before it is read in Rome. The Emperor's ministers are not accustomed to being examined."
 ita_dnc.2722.a: "The nationalities may be heard."
 ita_dnc.2722.b: "The Monarchy is not a debating club."
 ita_dnc.2724.t: "Rome or Vienna"
 ita_dnc.2724.d: "A quiet envoy from Rome has come with the proposal our deputies have wanted for years and have never once been offered. He asks nothing of our language or our church, only that we look south when we look for a patron. Vienna has promised us the same thing twice and delivered neither."
 ita_dnc.2724.a: "Rome, then, and not Vienna."
 ita_dnc.2724.b: "We were promised nothing."
 ita_dnc.2726.t: "The Tariff Wall"
 ita_dnc.2726.d: "Rome proposes that the duties between the members of the system come down together, and has sent the schedules already drawn. Our exporters have read them and are delighted; our manufacturers have read them and are not. The question is whether our workshops meet the market now or later."
 ita_dnc.2726.a: "The tariff wall comes down."
 ita_dnc.2726.b: "Our industries are not ready."
 ita_dnc.2728.t: "The Award at Rome"
 ita_dnc.2728.d: "The powers have argued over the same valleys since before our grandfathers were born, and Rome has at last offered to judge between them. The award is read out with our minister standing beside the Italian one and the maps unrolled on the table. What Rome gives, Rome expects to be remembered for."
 ita_dnc.2728.a: "Rome has judged, and we are heard."
 ita_dnc.2729.t: "The Second Award"
 ita_dnc.2729.d: "A second court sits at Rome, and this time it is our claim that lies on the table. The first beneficiary is already spoken of in the chancelleries as a client, and nobody has troubled to soften the word. We may take the award and the reputation that comes with it, or take neither."
 ita_dnc.2729.a: "We accept the judgement of Rome."
 ita_dnc.2730.t: "The Privileges"
 ita_dnc.2730.d: "The Italian embassy asks that the old privileges be confirmed and widened, with their own courts judging their own subjects in our cities. Our jurists call it a wound that never closes; our treasury answers that the trade which follows is real. The Empire has granted worse and survived it."
 ita_dnc.2730.a: "The privileges stand."
 ita_dnc.2730.b: "The Empire is not a market."
 ita_dnc.2732.t: "A Word from the Alps"
 ita_dnc.2732.d: "Our attache in Rome reports that something has been decided and that we are the subject of it, though he cannot yet say what. The prefects along the frontier are told to expect a note before the season is out. There is time to prepare, and no time at all to argue."
 ita_dnc.2732.a: "Brace!"
 ita_dnc.2734.t: "The Treaty of Neutrality"
 ita_dnc.2734.d: "Rome offers a treaty by which neither of us joins a quarrel the other begins, and does not propose to leave its own alliance in order to sign it. Our ambassador believes the offer honest and the timing anything but. Accepting frees a frontier; refusing leaves a claim upon it."
 ita_dnc.2734.a: "A treaty of neutrality, then."
 ita_dnc.2734.b: "France does not sign under the Alps."
 ita_dnc.2736.t: "The Note from Rome"
 ita_dnc.2736.d: "A note has arrived from Rome offering a guarantee of our integrity and a seat at a table in the middle sea. We are a small kingdom lately made, and we have taken great care to owe nothing to anybody. A guarantee is a friendship until the day it becomes a claim."
 ita_dnc.2736.a: "We will take the guarantee."
 ita_dnc.2736.b: "Our neutrality is our guarantee."
 ita_dnc.2738.t: "Two Latin Powers"
 ita_dnc.2738.d: "The Italian ambassador asks the Republic to stand openly where it has stood quietly since the notes were exchanged. He speaks of one sea and two Latin powers, and he means an alliance, and says so. Our own frontier does not point south, and our own quarrels are not in the middle sea."
 ita_dnc.2738.a: "Two Latin powers, one sea."
 ita_dnc.2738.b: "Paris keeps its hands free."
 ita_dnc.2740.t: "The Hand on the Regency"
 ita_dnc.2740.d: "The prefect at Tunis reports Italian officers in plain clothes, Italian money in the wrong hands, and a garrison that has suddenly become too small. Rome is bound by treaty not to march, and has plainly found a way to arrive without marching. The Republic may lose a protectorate or lose a treaty."
 ita_dnc.2740.a: "The Regency is not worth a war."
 ita_dnc.2740.b: "The prefect has been warned."
 ita_dnc.2742.t: "A Share of the Empire"
 ita_dnc.2742.d: "Rome has laid a map of the Ottoman lands on the table and invited each of us to point at what we want. The shares are generous, and the invitation is not the kind that is offered twice. Our merchants in the Empire will be paying for this long after the soldiers have gone home."
 ita_dnc.2742.a: "Our share is fair."
 ita_dnc.2742.b: "We will not carve a state we trade with."
 ita_dnc.2743.t: "The Partition Proposed"
 ita_dnc.2743.d: "Our ambassadors report that a map of the Empire was drawn in Rome and shown to a room of ministers, not one of whom walked out. The shares are named and the claimants have been counted. We may fight for the whole of it, or give up the shore and keep the capital."
 ita_dnc.2743.a: "We will not be carved."
 ita_dnc.2743.b: "Better to concede the shore than the capital."
 ita_dnc.2744.t: "The Roman Guarantee"
 ita_dnc.2744.d: "Rome offers to guarantee the Empire and to raise works within it at Rome's own expense, and asks for nothing at the signing. Our ministers remember that the last power to guarantee us took a province for its trouble. A protector who is present is a protector all the same."
 ita_dnc.2744.a: "Rome is welcome."
 ita_dnc.2744.b: "We need no protector."
 ita_dnc.2746.t: "The Shore for Peace"
 ita_dnc.2746.d: "The Italian note asks for the African shore and states, in writing, that it asks for nothing whatever beyond it. No claim is made upon the capital, the straits or the islands, and the ambassador repeated the point twice. The shore is far, poor and hard to hold, and it is ours."
 ita_dnc.2746.a: "The shore for peace."
 ita_dnc.2746.b: "Not one dune."
 ITA_u_the_free_hand_tt: "§YThe Consulta will owe its signature to no capital.§!"
 ITA_u_the_mediterranean_system_tt: "§YThe system is a standing offer, and the capitals of the basin will judge every later step of this road against it.§!"
 ITA_u_the_royalist_example_tt: "Every crowned neighbour receives the Italian example, and inclines towards Rome for it."
 ITA_u_align_the_south_slavs_tt: "The offer goes to Zagreb and to Ljubljana, and stands open until there is someone there to answer it."
 ITA_u_unlock_influence_countries_tt: "Unlocks Decision: Influence Countries"
 ITA_u_the_customs_union_tt: "Every member of the system is asked to bring its tariff wall down with ours."
 ITA_u_the_first_award_at_rome_tt: "Rome hands down the first award, and the beneficiary owes the chair that gave it."
 ITA_u_the_second_award_at_rome_tt: "Rome hands down a second award, to a second claimant, in a second sitting."
 ITA_u_the_cooperation_sphere_tt: "The consulates, the post offices and the surveys of the system are pooled with every member of it."
 ITA_u_extend_the_system_eastward_tt: "The invitation to the system goes east, to the Porte and to its neighbours."
 ITA_u_the_capitulations_tt: "The consular privileges are widened for three years, and our trade follows them into the Empire."
 ITA_u_the_integrated_economies_tt: "The sphere becomes one economy, and every member trades the sphere for the integrated ledger."
 ITA_u_the_mediterranean_confederation_tt: "The Latin System takes the name of the Confederation, and every member trades up with it."
 ITA_u_the_note_to_christiania_tt: "The northern kingdom is invited into the system, and offered a guarantee along with the invitation."
 ITA_u_the_league_of_the_middle_sea_tt: "The system is named a league at last. There is no new crown, no new party and no new name for Italy: the League carries the end by itself."
 ITA_u_threat_the_alliance_renewed: "Italy renews the alliance on its own terms"
 ITA_u_threat_the_habsburg_question: "Italy asks what follows the Monarchy"
 ITA_u_threat_carve_up_the_littoral: "Italy claims the eastern Littoral"
 ITA_u_threat_the_march_on_the_var: "Italy marches on the Var"
 ITA_u_threat_the_shore_alone: "Italy demands the African shore"
 ITA_u_threat_partition_the_porte: "Italy proposes to partition the Porte"
 ITA_u_threat_the_hand_on_the_var: "Italy has laid its hand on the Regency"
 ITA_u_the_mediterranean_system: "The Mediterranean System"
 ITA_u_the_mediterranean_system_desc: "The agreements of the middle sea are ours to reopen, and the capitals of the basin now answer to Rome before they answer to anyone else."
 ITA_u_the_nationalities_heard: "The Nationalities Heard"
 ITA_u_the_nationalities_heard_desc: "The Monarchy has agreed to listen to the peoples it governs, and every province has begun to draft its list of demands."
 ITA_u_the_hand_of_rome: "The Hand of Rome"
 ITA_u_the_hand_of_rome_desc: "Rome offered what Vienna refused, and our ministries have learned to look south for an answer."
 ITA_u_the_royalist_example: "The Royalist Example"
 ITA_u_the_royalist_example_desc: "The Italian throne survived its own murder and grew stronger for it, and our court has taken the lesson to heart."
 ITA_u_the_customs_union: "The Customs Union"
 ITA_u_the_customs_union_desc: "The duties between the members of the system have come down together, and the middle sea trades as a single market."
 ITA_u_the_cooperation_sphere: "The Cooperation Sphere"
 ITA_u_the_cooperation_sphere_desc: "Consuls, post offices, schools and surveys are pooled across the system, and what is discovered in one member is read in all of them."
 ITA_u_the_integrated_economies: "The Integrated Economies"
 ITA_u_the_integrated_economies_desc: "The industries of the system are braided together, and no member prices a ton of steel without the others."
 ITA_u_the_confederation: "The Mediterranean Confederation"
 ITA_u_the_confederation_desc: "The system has a common table, a common tariff and a common ledger, and its members no longer bargain against one another."
 ITA_u_the_capitulations: "The Capitulations"
 ITA_u_the_capitulations_desc: "Our courts judge our own subjects in the cities of the Empire, and our merchants trade behind them."
 ITA_u_the_capitulations_granted: "The Capitulations Granted"
 ITA_u_the_capitulations_granted_desc: "Foreign courts sit in our cities and foreign merchants trade under foreign law, and our treasury sees very little of it."
 ITA_u_the_trade_agreements: "The Trade Agreements"
 ITA_u_the_trade_agreements_desc: "The commercial schedules of the system read the same in every capital, and the middle sea keeps its own accounts."
 ITA_u_the_award_at_rome: "The Award at Rome"
 ITA_u_the_award_at_rome_desc: "Our claim was judged at Rome and granted, and the country has not yet stopped celebrating the verdict."
 ITA_u_the_roman_guarantee: "The Roman Guarantee"
 ITA_u_the_roman_guarantee_desc: "Rome has guaranteed our integrity and paid for the works that make such a guarantee credible."
 ITA_u_the_league_of_the_middle_sea: "The League of the Middle Sea"
 ITA_u_the_league_of_the_middle_sea_desc: "The basin is governed by those who live upon it, and the chair stands in Rome."
 ITADNC_u_see_to_the_adriatic: "See to the Adriatic"
 ITADNC_u_see_to_the_adriatic_desc: "Vienna settles the affairs of the eastern shore at conferences to which we are not invited, and the railway surveyors of the Sandjak have already gone south. The Adriatic is a closed sea with two coasts, and we hold one of them. We shall tell the small courts of the far bank that Rome will answer for them, and let Vienna read the note in the newspapers."
 ITADNC_u_restore_the_venetian_borders: "Restore the Venetian Borders"
 ITADNC_u_restore_the_venetian_borders_desc: "The societies of Trieste and the Dante Alighieri keep the map of the old dominion on their walls, and the students of Innsbruck have shown us what our brothers are worth to the Empire. We shall claim the whole Venetian inheritance and stop pretending that the alliance means anything. Let the shore learn who is coming, and let the courts of Europe take note."
 ITADNC_u_safeguard_the_porte: "Safeguard the Porte"
 ITADNC_u_safeguard_the_porte_desc: "The Sultan cannot hold his European provinces alone, and every power that offers him a shield asks for a coast in return. We shall offer the shield and ask for nothing yet, so that when we do ask he has no one else to ask. A friend at the Straits is worth more to the fleet than a province taken from him."
 ITADNC_u_valona_for_guarantees: "Valona for Guarantees"
 ITADNC_u_valona_for_guarantees_desc: "Our consuls have been buying schools and roads on the far shore for a generation, and the bay is the only anchorage that closes the mouth of the sea. We shall put the offer to the Porte plainly: the shore in exchange for our word that no one else shall take the rest. If he refuses we have lost a note and gained a grievance."
 ITADNC_u_tributes_for_guarantees: "Tributes for Guarantees"
 ITADNC_u_tributes_for_guarantees_desc: "The tobacco monopoly, the harbour company and the financial commission already put Italian names on the ledgers of three small courts. We shall regularise it: they pay for the protection they are receiving, and in return our guarantee is written down. Those who prefer an Austrian garrison to an Italian creditor may say so aloud."
 ITADNC_u_safeguard_the_adriatic: "Safeguard the Adriatic"
 ITADNC_u_safeguard_the_adriatic_desc: "A princess of Montenegro sits on our throne, and the courts of the far bank would rather deal with a cousin than with a corps. We shall guarantee the three of them together, arm them quietly, and make our word the cheapest security in the sea. The shore that does not need Vienna will not call Vienna."
 ITADNC_u_the_corfu_note: "The Corfu Note"
 ITADNC_u_the_corfu_note_desc: "Four centuries of the Republic left the island Italian in its language and its law, and the kingdom that holds it now cannot pay its own creditors. We shall lay a claim on the island and send the note to whoever is actually holding it. Nobody in Europe will fight a war for a lighthouse."
 ITADNC_u_the_venetian_possessions: "The Venetian Possessions"
 ITADNC_u_the_venetian_possessions_desc: "The article of the alliance promised us compensation whenever the balance of the eastern shore was disturbed, and the Empire has disturbed it and paid us nothing. We shall take the compensation from the weaker party instead, and claim the old Venetian ports outright. The Porte may sign them over or defend them."
 ITADNC_u_the_frontier_works: "The Frontier Works"
 ITADNC_u_the_frontier_works_desc: "Our engineers have surveyed the passes above the Isonzo and our clients on the far bank have no works at all facing the Empire. We shall lay the concrete on our own ground and offer the same batteries to any court that will have them. A friend who cannot hold his frontier is a road, not a friend."
 ITADNC_u_liberate_oppressed_peoples: "Liberate the Oppressed Peoples"
 ITADNC_u_liberate_oppressed_peoples_desc: "The congresses of the Albanian colonies in the south have petitioned us for a state of the four provinces, and the Ruthene deputies have been asking the same of a parliament that will not hear them. We shall recognise both claims on paper before anyone recognises them on the ground. A nationality with a map is a nationality with a future."
 ITADNC_u_the_arsenal_for_the_allies: "The Arsenal for the Allies"
 ITADNC_u_the_arsenal_for_the_allies_desc: "We lost the Serbian gun trials to Schneider because our terms were dearer and our credit shorter, and the rifles we did place in the mountains bought us more goodwill than any treaty. We shall subsidise the orders out of the estimates and let Terni and the Ansaldo undercut the French. The Treasury will complain, and the Treasury will be overruled."
 ITADNC_u_the_ionian_protectorate: "The Ionian Protectorate"
 ITADNC_u_the_ionian_protectorate_desc: "The islands were held under a protectorate within living memory, and the kingdom that took them over has been under foreign financial control ever since. The ministry must choose between the islands alone and the whole kingdom under our receivership. Either demand goes to Athens over the same signature, and neither can be withdrawn."
 ITADNC_u_further_ottoman_concessions: "Further Ottoman Concessions"
 ITADNC_u_further_ottoman_concessions_desc: "The Sandjak and the country beyond it are the ground the Empire wants its railway to cross, and our counter project needs the same passes. We shall demand the interior as well as the coast, before Vienna surveys it for us. A shore without its hinterland is a beach."
 ITADNC_u_support_the_albanians: "Support the Albanians"
 ITADNC_u_support_the_albanians_desc: "We have paid for their schools, their presses and their consulates for years without ever saying what we expect in return. We shall say it now: our guarantee and our subsidies, against the right to speak for them in Europe. If there is no state at Durazzo to accept, the committee will have to make one."
 ITADNC_u_the_adriatic_duchies: "The Adriatic Duchies"
 ITADNC_u_the_adriatic_duchies_desc: "The resolutions of Fiume and Zara have made the principle of nationality a doctrine of our own left, and the Empire holds four nations that would rather be duchies than provinces. The ministry shall keep the instruments ready in the drawer: a crown for each of them, to be raised when the ground is ours. We shall not promise what we do not yet hold."
 ITADNC_u_the_volunteers_of_the_adriatic: "The Volunteers of the Adriatic"
 ITADNC_u_the_volunteers_of_the_adriatic_desc: "The son of the General is recruiting for the far shore again, as he recruited for Greece, and the ministry is asked every week whether it knows. The Crown must decide whether the red shirts march with our silence or stay at home with our blessing. A legion that leaves without orders can be disowned; it cannot be recalled."
 ITADNC_u_the_albanian_crown: "The Albanian Crown"
 ITADNC_u_the_albanian_crown_desc: "The congresses have asked for a prince and never agreed on a name, and the House has more princes than it has thrones to give them. We shall offer the crown of the far shore to the Duke and let the chieftains accept him or refuse him. A principality that owes us its prince owes us its ports."
 ITADNC_u_the_rump_of_the_porte: "The Rump of the Porte"
 ITADNC_u_the_rump_of_the_porte_desc: "The partition plans have been in the drawers of the Consulta since the annexation crisis, and every power that waits will find the ground taken by another. We shall finish what is left of the European Turkey on our own terms. Whether the Sultan signs or the army marches, the coast is ours by the end of it."
 ITADNC_u_the_joint_squadron: "The Joint Squadron"
 ITADNC_u_the_joint_squadron_desc: "Our officers already command a sector of the gendarmerie of the interior and our ships already stand in the international squadron. We shall turn the habit into an institution and hold the manoeuvres of the whole eastern shore under our flag. If the Straits open to us as well, the naval staff will have learned more in one season than in a decade of estimates."
 ITADNC_u_subdue_the_adriatic_states: "Subdue the Adriatic States"
 ITADNC_u_subdue_the_adriatic_states_desc: "We have paid the subsidy, held the monopoly, built the railway and financed the opposition, and the courts of the far bank still answer us as equals. We shall put the demand to them as a demand: enter our system with their crowns kept, or lose them. The green party will find its captains and we shall find our pretext."
 ITADNC_u_the_hour_of_the_isonzo: "The Hour of the Isonzo"
 ITADNC_u_the_hour_of_the_isonzo_desc: "Two staffs have kept the same plan in the same safe for a decade, and the ally we are bound to has kept its own. The army is in the field, the rifles are in the depots, and the pretext is written. We shall demand the unredeemed provinces from Vienna and take the whole Monarchy if she refuses."
 ITADNC_u_the_springtime_of_nations: "The Springtime of Nations"
 ITADNC_u_the_springtime_of_nations_desc: "The principle we invoked for ourselves cannot stop at our own frontier, and half the powers of Europe govern nations that never consented. We shall untie our own allies first, so that nobody may say we spared our friends, and then put the same demand to the rest. Those who will not free their nationalities will be made to."
 ita_dnc.2760.t: "The Note from the Consulta"
 ita_dnc.2760.d: "The Italian ambassador has read us a note in which Rome undertakes to answer for the security of the small courts of the eastern shore. It is not addressed to us and it names no one, which is precisely how such notes are addressed. The General Staff would answer it on the Isonzo; the Ballhausplatz would rather buy the quarrel off before the newspapers make it a question of honour."
 ita_dnc.2760.a: "Let the Kaiserjager be seen on the Isonzo"
 ita_dnc.2760.b: "Rome must be soothed"
 ita_dnc.2760.c: "The Consulta speaks for the gallery"
 ita_dnc.2761.t: "Manoeuvres on the Frontier"
 ita_dnc.2761.d: "The Imperial and Royal army has moved its mountain battalions to the Italian frontier and the movement has been announced rather than hidden. The Roman press calls it an answer to a note that Vienna claims never to have received. Both capitals insist that the alliance stands."
 ita_dnc.2761.a: "The alliance is a piece of paper"
 ita_dnc.2762.t: "An Offer from the West"
 ita_dnc.2762.d: "Rome has circulated a note offering its good offices to the smaller states of the continent, and the wording leaves little doubt as to whom it is aimed. Standing with the Italians would cost us the goodwill of the Court that sits nearer to us. Standing aside costs nothing today and leaves us alone tomorrow."
 ita_dnc.2762.a: "Answer Rome warmly"
 ita_dnc.2762.b: "We have quarrels enough"
 ita_dnc.2763.t: "The Adriatic Question Reopens"
 ita_dnc.2763.d: "The Italian claim on the eastern shore has been pressed in the open and the answer has been refused in the open. Every chancellery on the peninsula is now counting what it holds and what it might be given. The powers that have interests there will speak before the month is out, and those that have none will pretend to."
 ita_dnc.2763.a: "Our own claim must be heard"
 ita_dnc.2763.b: "Note it and say nothing"
 ita_dnc.2764.t: "The Answer from the Ballhausplatz"
 ita_dnc.2764.d: "The Empire has chosen to treat our note as a friendly communication and has said so in writing. The ambassador was received with more warmth than the occasion required and left with assurances he did not ask for. We are being paid not to press the matter, which tells us the matter is worth pressing."
 ita_dnc.2764.a: "Take the assurances and keep the note"
 ita_dnc.2765.t: "The Claim on the Old Dominion"
 ita_dnc.2765.d: "Rome has published a claim to the whole inheritance of the Republic, which is to say to the coast we govern and the provinces behind it. The Chief of Staff has been asking for years to be allowed to read his memorandum on a preventive war to the Emperor. Granting it would be the end of the alliance in all but name; refusing it would tell Rome that the Monarchy answers street societies with silence."
 ita_dnc.2765.a: "Conrad shall have his memorandum read"
 ita_dnc.2765.b: "We do not answer street societies"
 ita_dnc.2766.t: "The Memorandum Is Read"
 ita_dnc.2766.d: "Our military attache reports that the Chief of the Imperial Staff has laid a plan for a preventive war before his sovereign, and that he was heard out to the end. The document names our frontier, our depots and the season. The ministry may treat it as a warning to be answered, or as a scandal to be printed."
 ita_dnc.2766.a: "Answer it in the depots"
 ita_dnc.2766.b: "Print it and let the Chamber judge"
 ita_dnc.2770.t: "An Offer of a Shield"
 ita_dnc.2770.d: "The Italian ambassador offers the guarantee of his sovereign for our European provinces and asks, for the moment, for nothing at all. Accepting puts an Italian name beside ours in every dispatch about the shore and makes an enemy of the Court that wants the railway. Refusing leaves us where we are, which is alone."
 ita_dnc.2770.a: "Let Rome's name stand beside ours"
 ita_dnc.2770.b: "The Sultan needs no Italian shield"
 ita_dnc.2771.t: "The Guarantee Is Signed"
 ita_dnc.2771.d: "The Porte has accepted our word for its European provinces and the exchange of notes was completed this morning. Our consuls in the interior report that the news reached the villages before it reached the newspapers. We are now the one power in the sea whose promise the Sultan has in writing."
 ita_dnc.2771.a: "The shield is ours to hold"
 ita_dnc.2772.t: "The Bay and the Island"
 ita_dnc.2772.d: "Rome asks for the great bay of the far shore and the island that closes it, and offers in exchange to answer for everything we still hold there. The bay is a harbour we cannot garrison and a debt we cannot pay. Giving it away buys us a protector; keeping it buys us a war we would fight alone."
 ita_dnc.2772.a: "The shore for the shield"
 ita_dnc.2772.b: "Not one stone of the Sultan's shore"
 ita_dnc.2773.t: "The Shore Is Delivered"
 ita_dnc.2773.d: "The Porte has signed the shore over to us and asked only that the guarantee be published on the same day. Our marines went ashore in the bay without a shot and the consulate flag was already flying when they landed. Europe will read the arrangement as a purchase, which it was."
 ita_dnc.2773.a: "Publish the guarantee with the deed"
 ita_dnc.2774.t: "The Sultan Declines"
 ita_dnc.2774.d: "The Porte has returned our note with thanks and without an answer to the question it asked. The consulates report that the refusal was drafted before the offer arrived. We have shown the whole sea what we want and gained nothing but the knowledge that they will not give it."
 ita_dnc.2774.a: "Then it will be taken another way"
 ita_dnc.2774.b: "Let the note lie where it fell"
 ita_dnc.2776.t: "Two Tenders for the Guns"
 ita_dnc.2776.d: "The Italian works have entered a tender for our field batteries and the terms are better than they have ever offered before. Their guns come with a subsidy and a political friendship we may not want. The French house offers a longer credit and asks for nothing that anybody will write down."
 ita_dnc.2776.a: "The order goes to Terni"
 ita_dnc.2776.b: "Creusot offers better terms"
 ita_dnc.2777.t: "The Trials Are Lost"
 ita_dnc.2777.d: "The batteries have gone to the French house again, on terms our works were told were impossible. The subsidy is spent, the estimates are voted, and the guns are in another country. The Chamber will want to know what the ministry bought with the money."
 ita_dnc.2777.a: "Pay the bill and say nothing"
 ita_dnc.2777.b: "Publish the terms we were beaten by"
 ita_dnc.2782.t: "The Bill for the Protection"
 ita_dnc.2782.d: "Rome proposes to put on paper what has been true for years: that our tobacco, our harbour and our loans are Italian, and that the protection which comes with them has a price. Paying it makes our independence a matter of book keeping. Refusing it hands the ledgers to whoever offers the next loan."
 ita_dnc.2782.a: "Better an Italian creditor than a garrison"
 ita_dnc.2782.b: "We are not a province to be farmed"
 ita_dnc.2784.t: "The Tribute Is Entered"
 ita_dnc.2784.d: "A court of the far bank has accepted our terms and the first payment has been entered in the accounts of the Treasury. Our guarantee went out over the same signature and by the same post. The other capitals of the sea will hear of it before our own Chamber does."
 ita_dnc.2784.a: "Enter it and guarantee the payer"
 ita_dnc.2786.t: "The Italian Engineers"
 ita_dnc.2786.d: "Rome offers to build the works on our northern passes at its own charge and with its own engineers. Concrete laid by a foreign staff is concrete that a foreign staff has surveyed. Building it ourselves will take longer than the quarrel is likely to leave us."
 ita_dnc.2786.a: "Let the Italian engineers come"
 ita_dnc.2786.b: "Our forts will be built by our own hands"
 ita_dnc.2788.t: "The Word of the King"
 ita_dnc.2788.d: "The Italian minister offers his sovereign's guarantee for our frontiers and asks for no treaty, no base and no payment. A guarantee accepted is a protector acquired, and protectors are not easily dismissed. A guarantee refused is an insult that the Court on the other side will hear of within the week."
 ita_dnc.2788.a: "We accept the Italian word"
 ita_dnc.2788.b: "A guarantee we did not ask for is a claim"
 ita_dnc.2790.t: "The Note on the Island"
 ita_dnc.2790.d: "Rome has laid a formal claim to the island and asks us to settle the matter by cession rather than by arms. The powers that guaranteed our finances have not said what they would do, which is usually an answer. Handing it over costs us a province and our name; keeping it may cost us the fleet."
 ita_dnc.2790.a: "The Powers will not fight for an island"
 ita_dnc.2790.b: "Corfu is Greek"
 ita_dnc.2791.t: "The Island Is Ceded"
 ita_dnc.2791.d: "The island has been signed over and our garrison landed at the citadel this morning. The Italian schools that never closed are now the schools of the kingdom. The chancelleries have protested in the terms reserved for things they intend to accept."
 ita_dnc.2791.a: "The old dominion begins again"
 ita_dnc.2792.t: "The Note Is Refused"
 ita_dnc.2792.d: "The island has been refused us in language written for the newspapers rather than for the Consulta. The garrison there has been reinforced and the guarantors have been asked to say where they stand. We have a claim on the register and no island to show for it."
 ita_dnc.2792.a: "Then the claim will be pressed"
 ita_dnc.2792.b: "Leave the claim on the register"
 ita_dnc.2794.t: "The Old Venetian Ports"
 ita_dnc.2794.d: "Rome demands the ports its Republic held before our fathers took them, and offers nothing whatever in exchange. Ceding them strips the European provinces of every harbour worth the name. Refusing invites a fleet we cannot meet and a Court to the north that will take its share while we are busy."
 ita_dnc.2794.a: "The shore is not worth the fleet"
 ita_dnc.2794.b: "Let them come and take it"
 ita_dnc.2795.t: "The Answer on the Ports"
 ita_dnc.2795.d: "The Porte has returned its answer on the old ports and the Consulta has the text before the Chamber does. Either the harbours are ours by signature or they are ours by the claim already on the register. The ministry must be ready to publish whichever it turns out to be."
 ita_dnc.2795.a: "Publish it as it stands"
 ita_dnc.2796.t: "The Offer from Across the Sea"
 ita_dnc.2796.d: "The Italians offer their guarantee, their subsidies and their schools, and ask in exchange to speak for us in Europe. Their money has already built half the presses that argue about it. Taking it puts a foreign hand on the coast; refusing it leaves us to the Sultan and the Court beyond him."
 ita_dnc.2796.a: "Take the guarantee and the subsidies"
 ita_dnc.2796.b: "Autonomy under the Sultan, and nothing else"
 ita_dnc.2797.t: "The Committee Asks for a State"
 ita_dnc.2797.d: "The committee of the southern colonies has come to the ministry to point out that we are offering to guarantee a country that does not exist. They ask us to make it first and guarantee it afterwards, and they have a map with them. The Consulta observes that making states is a longer business than promising to protect them."
 ita_dnc.2797.a: "Then the state will have to be made"
 ita_dnc.2797.b: "Guarantees first, maps afterwards"
 ita_dnc.2798.t: "Rome Is Busy in the South"
 ita_dnc.2798.d: "Our ally has demanded the old ports of the eastern shore and has been refused, and the fleet at Taranto is being provisioned. Whatever follows will hold the Italian army in the south for a season. We may take our own share of the shore while they are occupied, or we may keep our hands clean and our reserves at home."
 ita_dnc.2798.a: "Take our share while they are busy"
 ita_dnc.2798.b: "Let them have their adventure"
 ita_dnc.2800.t: "The Red Shirts Are Recruiting"
 ita_dnc.2800.d: "The son of the General has opened his lists again and the prefects report that men are leaving for the eastern shore by the trainload. The ministry can look away and let the legion go, and answer for it afterwards in Europe. Or the Crown can forbid it, keep the volunteers at home, and be told by half the country that it has betrayed the name."
 ita_dnc.2800.a: "Let him go, and let the ministry know nothing"
 ita_dnc.2800.b: "The King's government does not raise legions"
 ita_dnc.2802.t: "A Prince Is Offered"
 ita_dnc.2802.d: "Rome offers us a prince of its own House, a crown, a treasury and a guarantee, and asks in exchange for what a protectorate always asks. A principality with a foreign prince is at least a principality, and the chieftains have never agreed on one of their own. Refusing means holding the coast alone against everyone who wants it."
 ita_dnc.2802.a: "Let the Duke come and be crowned"
 ita_dnc.2802.b: "We will have no prince from over the water"
 ita_dnc.2803.t: "The Terms from Rome"
 ita_dnc.2803.d: "The Italians propose to take our foreign affairs and our customs into their own hands and to leave us our flag. They point out, not unreasonably, that they are already paying for both. Accepting ends our independence quietly; refusing ends it noisily and later."
 ita_dnc.2803.a: "Sign, and keep the flag"
 ita_dnc.2803.b: "We will not be administered"
 ita_dnc.2804.t: "The Ionian Question"
 ita_dnc.2804.d: "The ministry has two drafts on the table and the courier leaves tonight. The first asks Athens for the islands alone, which the powers might swallow and the kingdom might survive. The second asks for the kingdom itself under our receivership, which would settle the eastern sea and wake up every chancellery that lent it money."
 ita_dnc.2804.a: "The islands, and nothing else"
 ita_dnc.2804.b: "The kingdom, under our receivership"
 ita_dnc.2805.t: "The Demand for the Islands"
 ita_dnc.2805.d: "Rome asks for the western islands and offers in return its guarantee and the lifting of the foreign control over our revenues. The islands are the poorest part of the kingdom and the loudest part of the parliament. Giving them up buys us our own treasury back; keeping them may cost us the fleet and the coast together."
 ita_dnc.2805.a: "The islands for our own treasury"
 ita_dnc.2805.b: "Not one island, and not one drachma"
 ita_dnc.2806.t: "The Last Article"
 ita_dnc.2806.d: "Rome proposes to close the account and take what remains of the European provinces into the Kingdom outright. We are already administered from a foreign capital and the request is a formality dressed as a treaty. Signing ends the dynasty with dignity; refusing ends it without."
 ita_dnc.2806.a: "Sign, and let the dynasty withdraw"
 ita_dnc.2806.b: "The Sultan signs nothing away"
 ita_dnc.2807.t: "The Ultimatum of the Straits"
 ita_dnc.2807.d: "The Italian note demands what is left of our European possessions and sets a term for the answer. Our guarantors have been sounded and have offered sympathy. The army in Europe can hold the passes for a season, and after that there will be nothing to hold."
 ita_dnc.2807.a: "Accept the protectorate and keep the throne"
 ita_dnc.2807.b: "The army will answer in the passes"
 ita_dnc.2808.t: "The Receivership"
 ita_dnc.2808.d: "The Italians propose to take over the control of our finances, our customs and our foreign policy, and to leave the dynasty on its throne. The commission that already governs our revenues would simply change its chairman. Accepting makes us a client of one power instead of four; refusing makes us the object of a war."
 ita_dnc.2808.a: "One creditor is better than four"
 ita_dnc.2808.b: "The kingdom is not in liquidation"
 ita_dnc.2809.t: "The Protectorate We Gave Up"
 ita_dnc.2809.d: "Rome proposes to take up in the eastern sea the position this country held there and surrendered within living memory. Our commercial houses in the Levant are asking whether the flag will follow the trade. Resuming the guarantee means a quarrel with a power we have been cultivating; declining it means the sea is theirs."
 ita_dnc.2809.a: "The islands are a British interest still"
 ita_dnc.2809.b: "We gave them up once; let them keep them"
 ita_dnc.2810.t: "The Demand for the Interior"
 ita_dnc.2810.d: "Rome now asks for the country behind the coast, the passes the railway must cross and the towns that feed them. Ceding the interior leaves our remaining provinces without a road between them. Refusing means a landing on a shore we have already been told we cannot hold."
 ita_dnc.2810.a: "The interior is not worth the war"
 ita_dnc.2810.b: "They shall have the passes and nothing else"
 ita_dnc.2811.t: "The Share of Belgrade"
 ita_dnc.2811.d: "The Italians are taking the interior of the eastern shore and have not mentioned us in any of the notes. Every road they are asking for is a road our own merchants use to reach the sea. We may protest and be recorded, or we may ask plainly for our portion while there is still a portion to ask for."
 ita_dnc.2811.a: "Protest, and let it be recorded"
 ita_dnc.2811.b: "Ask for our share while there is one"
 ita_dnc.2812.t: "The Demand on the Frontier"
 ita_dnc.2812.d: "Our ally has laid a demand for the unredeemed provinces on the table and moved its corps to the river. Giving up the mountain country and the port would cost the Monarchy its Italian frontier and its prestige with it. Refusing means a war on a new front while the Court to the north decides at its leisure whether the treaty binds it."
 ita_dnc.2812.a: "The Trentino, and not one village more"
 ita_dnc.2812.b: "Not a stone, not a soul"
 ita_dnc.2813.t: "The Squadron at the Straits"
 ita_dnc.2813.d: "The Italians ask to bring their combined squadron and their allied captains through the Straits for the season's manoeuvres. Opening the passage lets a foreign fleet learn water that no foreign fleet has surveyed. Keeping them at the northern port costs us nothing and teaches them nothing."
 ita_dnc.2813.a: "Open the Straits to the squadron"
 ita_dnc.2813.b: "They may anchor at Salonica"
 ita_dnc.2814.t: "The Demand from Rome"
 ita_dnc.2814.d: "The Italian minister has put it to us without the usual wrapping: enter their system, keep the crown, and take the subsidy as a settled arrangement rather than a favour. Their money already pays for our railway, our tobacco and half our opposition. Refusing means holding a coast alone against the fleet that has been supplying it."
 ita_dnc.2814.a: "Enter their system and keep the crown"
 ita_dnc.2814.b: "The crown is not for sale"
 ita_dnc.2815.t: "Our Neighbour Refuses"
 ita_dnc.2815.d: "The court on the other side of the mountains has refused the Italian demand and is asking whether it will stand alone. Coming to its aid means a war with a power whose loans we are still repaying. Leaving it to its fate means we shall be next, and alone when our turn comes."
 ita_dnc.2815.a: "We shall not be taken one by one"
 ita_dnc.2815.b: "This is not our quarrel"
 ita_dnc.2816.t: "The Frontier Is Moved"
 ita_dnc.2816.d: "Vienna has ceded the mountain province and the port rather than fight for them, and the commissioners are already marking the new line. Half the ground the societies have claimed for a generation is ours by signature. The other half is still on the wrong side of the frontier and everybody knows it."
 ita_dnc.2816.a: "Half the claim, and the war put off"
 ita_dnc.2817.t: "Not a Stone"
 ita_dnc.2817.d: "The Monarchy has refused the demand entire and has recalled its ambassador without waiting for ours to leave. The staffs on both sides have taken out the plans they have kept for a decade. There is nothing left to write, and the army is where the plan says it should be."
 ita_dnc.2817.a: "Then the plan will be executed"
 ita_dnc.2818.t: "The Demand of the Nations"
 ita_dnc.2818.d: "Rome invokes the principle of nationality against every power that governs a people which never consented, and this time it names us. Granting autonomy would cost us provinces, revenue and the obedience of the rest. Refusing sets an Italian army in the field with a cause that half of Europe will applaud."
 ita_dnc.2818.a: "Grant the nationalities their autonomy"
 ita_dnc.2818.b: "We govern our own provinces"
 ita_dnc.2819.t: "A Crown Without a Kingdom"
 ita_dnc.2819.d: "The instruments for the far shore are drawn, sealed and useless: there is no state there to receive them and no prince who will take a crown that has no ground. The committee of the colonies has been saying so for years to anyone who would listen. Either we make the country first, or we put the papers back in the drawer."
 ita_dnc.2819.a: "The country must be made before the crown"
 ita_dnc.2819.b: "Back in the drawer until the ground is ours"
 ITA_u_one_of_the_options_tt: "\n§YOne of the following:§!"
 ITA_u_credit_tt: "§YCourts of the far shore under Italian protection:§! [?ITA_u_credit|0]"
 ITA_u_tt_safeguard_the_porte: "§YIf the Porte is still guaranteed or allied to us when the joint squadron sails, our navy and our army gain experience from the cruise.§!"
 ITA_u_tt_the_frontier_works: "Bunkers are raised on our own provinces along the Austrian frontier."
 ITA_u_tt_the_works_wait: "The works on the far bank wait until the Empire is at war with us."
 ITA_u_tt_liberate_oppressed_peoples: "§YLiberating a constituent nation of the Dual Monarchy costs us far less, and making one our subject costs us less still.§!"
 ITA_u_tt_the_arsenal_waits: "No court of the far shore is under our protection, so the subsidised orders wait for one that is."
 ITA_u_tt_the_joint_squadron: "Every court under our protection joins the manoeuvres of the season, and so do we."
 ITA_u_tt_the_dalmatian_legion: "The Dalmatian Legion is raised, and its battalions take the field under our colours."
 ITA_u_tt_the_legions_are_raised: "The volunteer legions are raised and their battalions take the field under our colours."
 ITA_u_tt_the_principle_of_nationality: "Our own allies and clients are released from every tie to us before the demand reaches them."
 ITA_u_tt_the_third_party_holds: "Whoever else is holding the ground of the old European provinces will be asked for it in turn."
 ITA_u_tt_the_isonzo_equipment: "The depots hold enough rifles for the field army."
 ITA_u_tt_no_subject_nations: "No power still governs a nation that has not consented."
 ITA_u_tt_the_committee_is_heard: "The committee of the colonies is heard, and the making of the state goes on the agenda."
 ITA_u_tt_the_state_must_be_made: "The instruments wait in the drawer until there is a country on the far shore to receive them."
 ITA_u_threat_the_habsburg_menace: "Italy answers for the Adriatic"
 ITA_u_threat_corfu: "Italy claims the Ionian island"
 ITA_u_threat_the_ionian_protectorate: "Italy demands the Ionian protectorate"
 ITA_u_threat_the_venetian_possessions: "Italy claims the Venetian possessions"
 ITA_u_threat_further_ottoman_concessions: "Italy demands the eastern interior"
 ITA_u_threat_the_isonzo_review: "Austria masses on the Isonzo"
 ITA_u_threat_the_albanian_shore: "Italy takes the Albanian shore"
 ITA_u_threat_the_tribute: "Italy collects the Adriatic tribute"
 ITA_u_threat_vienna_moves_too: "Vienna takes its share of the shore"
 ITA_u_threat_the_ionian_quarrel: "London answers for the islands"
 ITA_u_threat_the_isonzo_settlement: "The frontier on the Isonzo is moved"
 ITA_u_threat_the_hour_of_the_isonzo: "Italy turns on the Dual Monarchy"
 ITA_u_the_austrian_manoeuvres: "The Austrian Manoeuvres"
 ITA_u_the_austrian_manoeuvres_desc: "The mountain battalions of the Empire are camped in view of our frontier posts and the newspapers print the map every morning."
 ITA_u_safeguard_the_porte_idea: "The Italian Shield"
 ITA_u_safeguard_the_porte_idea_desc: "The Kingdom has undertaken to answer for these provinces, and the undertaking has been published."
 ITA_u_safeguard_the_adriatic_idea: "The Guarantee of Rome"
 ITA_u_safeguard_the_adriatic_idea_desc: "Our frontier is covered by a word given in Rome, and the ministry has stopped budgeting for the alternative."
 ITA_u_paying_for_protection: "Paying for Protection"
 ITA_u_paying_for_protection_desc: "The monopoly, the harbour dues and the loan service all run through a foreign house, and the country knows whose house it is."
 ITA_u_receiving_the_tribute: "The Tribute of the Far Shore"
 ITA_u_receiving_the_tribute_desc: "The payments of the protected courts are entered in the accounts of the Treasury and the Chamber has stopped asking where they come from."
 ITA_u_the_italian_arsenal: "The Italian Arsenal"
 ITA_u_the_italian_arsenal_desc: "Our batteries, our rifles and our cartridges all come from the same works across the water, and so do the instructors."
 ITA_u_the_cost_of_the_subsidies: "The Cost of the Subsidies"
 ITA_u_the_cost_of_the_subsidies_desc: "The orders placed for the small courts are carried on our own estimates, and the works are paid whether the guns are wanted or not."
 ITA_u_safeguard_albania_idea: "The Italian Subsidy"
 ITA_u_safeguard_albania_idea_desc: "The schools, the presses and the rifles all come from across the sea, and the chieftains have grown used to it."
 ITA_u_the_arsenal_of_the_allies: "The Arsenal of the Allies"
 ITA_u_the_arsenal_of_the_allies_desc: "We arm the far shore and the far shore sends us its volunteers, which is a trade the estimates never show."
 ITA_u_the_joint_manoeuvres: "The Joint Manoeuvres"
 ITA_u_the_joint_manoeuvres_desc: "The staffs of the eastern shore drill together for a season under our officers, and the signal books are the same on every ship."
 ITA_u_the_frontier_works_ns: "The Works on the Isonzo"
 ITA_u_the_frontier_works_ns_desc: "The concrete is laid, the batteries are mounted and the passes are held by men who know the ground."
 ITA_u_the_hour_of_the_isonzo_ns: "The Hour of the Isonzo"
 ITA_u_the_hour_of_the_isonzo_ns_desc: "The plan that two staffs have kept in the same safe for a decade is taken out and given a date."
 ITA_u_the_adriatic_duchies_cat_desc: "The crowns of the eastern shore, drawn and sealed, waiting for ground that is ours."
 ALB_neutrality_party_principality: "Principality"
 ALB_neutrality_party_principality_long: "The Principality of Albania"
 ALB_PRINCIPALITY: "Principality of Albania"
 ALB_PRINCIPALITY_DEF: "the Principality of Albania"
 ALB_PRINCIPALITY_ADJ: "Albanian"
 ITADNC_u_la_grande_politica: "La Grande Politica"
 ITADNC_u_la_grande_politica_desc: "The Navy League prints its programme in every port and the press asks aloud why a kingdom set between two seas keeps the ambitions of a province. We shall answer it plainly: from today the Kingdom holds a world policy, and every ministry will be measured against it."
 ITADNC_u_the_understanding_with_london: "The Understanding with London"
 ITADNC_u_the_understanding_with_london_desc: "Our coasts lie open, our coal comes from British pits and our bread crosses a sea their fleet commands; the staffs have written it out plainly, and Italy cannot make war on England. We must say so in London ourselves, before anyone makes us prove it."
 ITADNC_u_the_battle_fleet: "The Battle Fleet"
 ITADNC_u_the_battle_fleet_desc: "Our yards can lay down the fastest armoured ships afloat, and the estimates have never once been written to let them. We shall order the squadron the naval press has been drawing for years, and widen the slips that must carry it."
 ITADNC_u_carve_up_the_congo: "Carve Up the Congo"
 ITADNC_u_carve_up_the_congo_desc: "Our officers have served in the Force Publique and know exactly what the concession companies do on that river, and London has made a scandal of it that Brussels cannot answer. We shall be at the table when the basin is divided, and we shall not go there empty-handed."
 ITADNC_u_the_second_naval_race: "The Second Naval Race"
 ITADNC_u_the_second_naval_race_desc: "The first ship in the world to carry her guns in triple turrets stands on our slips, and every admiralty in Europe has sent a man to look at her. We must lay down the rest of her class before the advantage is copied, and widen the yards that will build them."
 ITADNC_u_expand_the_eastern_holdings: "Expand the Eastern Holdings"
 ITADNC_u_expand_the_eastern_holdings_desc: "The court granted us a quarter on the river once the legations were relieved, and we have governed it with a flagpole and a clerk. We shall ask Peking to make the grant real, and open the business of the Kingdom in the East."
 ITADNC_u_the_anglo_italian_defence_pact: "The Anglo-Italian Defence Pact"
 ITADNC_u_the_anglo_italian_defence_pact_desc: "Two agreements on the Horn and a convention on the Somali coast were drawn up by our consuls and theirs, and no cabinet has ever put its name to any of them. We shall offer London the treaty that habit deserves, and let the offer stand or fall on its own merits."
 ITADNC_u_the_industrial_investments: "The Industrial Investments"
 ITADNC_u_the_industrial_investments_desc: "The protocol left the court poorer than the war did and ringed with creditors who agree on nothing at all. We shall put Italian houses and Italian capital into the eastern provinces while the others are still quarrelling over the interest."
 ITADNC_u_the_arms_for_peking: "The Arms for Peking"
 ITADNC_u_the_arms_for_peking_desc: "The court is fighting on its own ground with rifles bought wherever a merchant would sell them, and it pays in silver. Our arsenals shall send the pattern we make, the works to feed it and the instructors to teach it."
 ITADNC_u_break_the_mediterranean_hegemony: "Break the Mediterranean Hegemony"
 ITADNC_u_break_the_mediterranean_hegemony_desc: "The middle sea is locked at both ends and cut across the middle by garrisons that are not ours, and the whole naval debate of the decade turns on that single fact. We shall register our claim to the locks, and stop asking permission to leave our own coast."
 ITADNC_u_the_anglo_italian_cooperation_program: "The Anglo-Italian Cooperation Program"
 ITADNC_u_the_anglo_italian_cooperation_program_desc: "Our best plate is rolled in Sheffield and our turrets are drawn on the Tyne, and the orders go out year after year without a word of doctrine attached. We shall turn the invoices into a programme, with shared drawings, shared constructors and slips working to one design."
 ITADNC_u_the_joint_research_with_peking: "The Joint Research with Peking"
 ITADNC_u_the_joint_research_with_peking_desc: "Our technical missions have surveyed mines, railways and arsenals in the East and brought home a great deal more than they were sent for. We shall put the missions on a permanent footing, so that the schools of the court and our own read the same papers."
 ITADNC_u_the_volunteers_for_china: "The Volunteers for China"
 ITADNC_u_the_volunteers_for_china_desc: "A Royal expeditionary corps embarked for the East once already, and the officers who came back are still on the active rolls. We shall raise the corps again and give the court soldiers, rather than notes of sympathy."
 ITADNC_u_the_eastern_allies: "The Eastern Allies"
 ITADNC_u_the_eastern_allies_desc: "The consular reports of the Geographical Society say the same thing from every eastern port: the courts there want partners and are offered creditors. We shall invite them into our alliance, and be the flag that asked before it demanded."
 ITADNC_u_a_free_hand_in_tunis_ww: "A Free Hand in Tunis"
 ITADNC_u_a_free_hand_in_tunis_ww_desc: "The slap of Tunis is the one grievance no ministry has ever managed to bury, and the power that dealt it can no longer answer for the shore. We shall take the regency back and enter it in the register as a province of the Kingdom."
 ITADNC_u_petition_for_the_old_claims: "Petition for the Old Claims"
 ITADNC_u_petition_for_the_old_claims_desc: "We handed the frontier post back to London at the stroke of a pen, and the colonial press has not stopped asking why since the day the order was signed. We shall put the claim to our ally in writing, and let the answer be entered in the record."
 ITADNC_u_the_concession_at_tientsin_ww: "The Concession at Tientsin"
 ITADNC_u_the_concession_at_tientsin_ww_desc: "The grant on the river exists on paper and nowhere else: no boundary, no council, no garrison and no quay. We shall ask the court to let us build it properly, and we shall pay for the work ourselves."
 ITADNC_u_the_stations_of_the_red_sea_ww: "The Stations of the Red Sea"
 ITADNC_u_the_stations_of_the_red_sea_ww_desc: "Massawa and Assab sit astride the road to the canal, and every ship that coals there coals under our flag. We shall stock the stations, dredge the moorings and make the passage to the Indies a road that we supply."
 ITADNC_u_expand_the_african_reach: "Expand the African Reach"
 ITADNC_u_expand_the_african_reach_desc: "Three powers agreed at a conference table that the ground between our two colonies falls to us, and not one Italian officer has ever stood upon it. We shall register the sphere as a claim, on the Horn and on the northern shore alike."
 ITADNC_u_unify_the_horn: "Unify the Horn"
 ITADNC_u_unify_the_horn_desc: "The law has made the southern coast a colony of the State, and it is still administered as three separate accidents by three separate residencies. We shall put the whole Horn under one command and let the governorates answer to it."
 ITADNC_u_the_naval_doctrine_of_the_middle_sea: "The Naval Doctrine of the Middle Sea"
 ITADNC_u_the_naval_doctrine_of_the_middle_sea_desc: "The Rivista has argued the closed sea for a decade against every officer trained for the open ocean, and the argument has never been settled by anything but seniority. We shall settle it: the fleet is built for this sea, and it shall be taught for it."
 ITADNC_u_the_pact_with_peking: "The Pact with Peking"
 ITADNC_u_the_pact_with_peking_desc: "The treaty of commerce and establishment gave us standing at a court that has learned to expect ultimatums from every flag it sees. We shall offer the alliance no other power has offered, and ask the court to stand with us."
 ITADNC_u_the_african_allies: "The African Allies"
 ITADNC_u_the_african_allies_desc: "We have signed at Addis Ababa and at Rabat, and both treaties were read at home as the price of avoiding a war we could not win. We shall read them the other way about, and invite both courts into the alliance."
 ITADNC_u_the_pacific_stations: "The Pacific Stations"
 ITADNC_u_the_pacific_stations_desc: "The colonial press has been drawing coaling points on the far ocean since before the last ministry fell, and the Geographical Society has surveyed half of them already. We shall register the claims, so that an eastern squadron has somewhere to put its coal."
 ITADNC_u_divide_the_powers_in_china: "Divide the Powers in China"
 ITADNC_u_divide_the_powers_in_china_desc: "We asked the court for a bay on that coast once, withdrew the demand under pressure and lost a minister for the humiliation. We shall not ask twice: the concessions will be divided with the court, and whoever holds the best harbour will be told so."
 ITADNC_u_the_middle_sea_is_ours: "The Middle Sea Is Ours"
 ITADNC_u_the_middle_sea_is_ours_desc: "No hostile squadron rides at anchor between the two locks, and no enemy flag flies on a shore our fleet cannot reach within the week. The sea is ours to keep, and every ministry that follows this one will be judged on whether it kept it."
 ITADNC_u_the_shore_from_tripoli_to_the_horn: "The Shore from Tripoli to the Horn"
 ITADNC_u_the_shore_from_tripoli_to_the_horn_desc: "The conference reserved to us the ground from the regency to the Horn and left the line on the map unmarked, as though nobody expected it to be walked. We shall mark it claim by claim, from the shore of the middle sea to the ocean at the other end."
 ITA_u_grande_tt_the_world_policy: "The Navy League and the colonial press now speak for the Government. The fleet, the eastern concessions and the African sphere all hang from this one programme."
 ITA_u_grande_tt_the_capital_answers: "The capital that receives this demand will answer in its own time, and its answer will be entered in the record."
 ITA_u_grande_if_they_accept_tt: "\n§YEffects if they accept:§!"
 ITA_u_grande_tt_the_locks_of_the_sea: "The gates of the middle sea are registered as claims of the Kingdom, and the auxiliary cruiser decisions open with them."
 ITA_u_grande_tt_the_invitation: "Every court named here receives our invitation to the alliance and answers it as it sees fit."
 ITA_u_grande_tt_the_coaling_road: "Every station on the road to the canal that we control is stocked, dredged and supplied for the season that follows."
 ITA_u_grande_tt_the_sphere_declared: "The ground reserved to us on the Horn and on the northern shore is registered as a claim of the Kingdom."
 ITA_u_grande_tt_one_command_on_two_seas: "The residencies of the Horn answer to a single command, and the governorate decisions of the colonies open with it."
 ITA_u_grande_tt_the_far_stations: "The coaling points of the far ocean are registered as claims, so that an eastern squadron has a shore of its own."
 ITA_u_grande_tt_the_sea_is_kept: "No hostile great power holds a shore of the middle sea, and the Kingdom keeps the doctrine, the fleet and the ports that hold it so."
 ITA_u_grande_tt_the_line_is_drawn: "Every state between the regency and the Horn is registered as a claim of the Kingdom, from the middle sea to the ocean."
 ITA_u_la_grande_politica: "La Grande Politica"
 ITA_u_la_grande_politica_desc: "The Government answers to a programme that begins on our own coast and ends wherever the flag can be carried."
 ITA_u_the_naval_understanding: "The Naval Understanding"
 ITA_u_the_naval_understanding_desc: "We do not build against the fleet that guards our grain, and our convoys sail cheaper for the courtesy."
 ITA_u_the_battle_fleet: "The Battle Fleet"
 ITA_u_the_battle_fleet_desc: "The estimates are written at last for a squadron of the line, and the slips are widened to carry it."
 ITA_u_the_second_naval_race: "The Second Naval Race"
 ITA_u_the_second_naval_race_desc: "Every yard that can lay a heavy hull is laying one, and the drawings they work from are ours."
 ITA_u_the_eastern_investments: "The Italian Houses"
 ITA_u_the_eastern_investments_desc: "Italian capital, Italian foremen and Italian machines are at work in the provinces, and none of it was given freely."
 ITA_u_the_arsenal_of_the_east: "The Arsenal of the East"
 ITA_u_the_arsenal_of_the_east_desc: "Our arsenals work to a foreign order as well as our own, and the pattern they sell is the pattern they keep."
 ITA_u_the_shared_yards: "The Shared Yards"
 ITA_u_the_shared_yards_desc: "Drawings, constructors and rolled plate pass both ways across the northern sea."
 ITA_u_the_corps_for_china: "The Corps for the East"
 ITA_u_the_corps_for_china_desc: "A brigade of the line, a battery and the airmen of the park stand ready to embark for the eastern war."
 ITA_u_the_middle_sea_is_ours: "The Middle Sea Is Ours"
 ITA_u_the_middle_sea_is_ours_desc: "The sea between the locks answers to one fleet, and it is not a foreign one."
 ITA_u_the_coaling_station: "The Coaling Station"
 ITA_u_the_coaling_station_desc: "Coal sheds, a mole and a condenser on the passage to the Indies."
 ita_dnc.2840.t: "The Note from Rome"
 ita_dnc.2840.d: "The Italians have sent a memorandum that reads more like a confession than a proposal: their coasts lie open, their coal is ours and their bread crosses a sea we command. They ask only that we acknowledge it and stop counting their cruisers. The Admiralty is divided on whether an admission is worth a signature."
 ita_dnc.2840.a: "Rome knows its place."
 ita_dnc.2840.b: "Another Mediterranean fleet?"
 ita_dnc.2842.t: "The Question of the Basin"
 ita_dnc.2842.d: "A memorandum from the Consulta reminds us that Italian officers served in the Force Publique and that Italian merchants have been kept off the river ever since. It proposes a division of the eastern districts, and offers to say nothing further about the concession companies. The Chamber has been asking for a year what that river is really worth to us."
 ita_dnc.2842.a: "The Chamber will sell."
 ita_dnc.2842.b: "The Congo is Belgian now."
 ita_dnc.2844.t: "The Italians at the River"
 ita_dnc.2844.d: "The quarter granted to the Italians when the legations were relieved has a flagpole, a clerk and no boundary at all. Their minister now asks for the boundary, a council and the right to bring in police of his own. Every grant of this kind has begun exactly so, and every one has ended larger than it began."
 ita_dnc.2844.a: "The concession may be built."
 ita_dnc.2844.b: "Tientsin was a courtesy."
 ita_dnc.2846.t: "The Offer from the Consulta"
 ita_dnc.2846.d: "Two agreements on the Horn and a convention on the Somali coast were written by our consuls and theirs together, without a word from either cabinet. Rome now proposes that the habit become a treaty, with guarantees exchanged and the middle sea understood between us. The Foreign Office has never signed such a thing with a lesser power."
 ita_dnc.2846.a: "The Horn agreements become a pact."
 ita_dnc.2846.b: "London signs with no one."
 ita_dnc.2848.t: "The Houses from Milan"
 ita_dnc.2848.d: "The protocol left the court poorer than the war did, and the creditors who imposed it agree on nothing except that they will not lend again. The Italians offer capital, foremen and machines for the provinces, and ask for standing rather than territory. Nothing they build here will ever be entirely ours."
 ita_dnc.2848.a: "The Italian houses may build."
 ita_dnc.2848.b: "The concessions are enough."
 ita_dnc.2850.t: "The Rifles from Turin"
 ita_dnc.2850.d: "The court is fighting on its own ground with rifles bought wherever a merchant would sell them, and no two battalions carry the same cartridge. Rome offers a single pattern, the works to feed it and the instructors to teach it, and asks for nothing in writing. What is not written down is remembered longest."
 ita_dnc.2850.a: "Send them, and send the instructors."
 ita_dnc.2850.b: "We will not owe Rome our rifles."
 ita_dnc.2852.t: "The Frontier Post Again"
 ita_dnc.2852.d: "We handed the frontier post back to the Italians and took it up again when the reconquest was done, and their colonial press has never let the matter rest. Their ambassador now presents the claim formally, as an ally rather than a suppliant. Refusing it costs us nothing today and something later."
 ita_dnc.2852.a: "Kassala goes back to Rome."
 ita_dnc.2852.b: "We paid for that frontier."
 ita_dnc.2854.t: "The Quarter on the River"
 ita_dnc.2854.d: "The Italians have surveyed their quarter, drawn its streets and costed its quay, and they propose to pay for every part of it themselves. What they ask of the court is a boundary and a signature. A concession that has been built properly is far harder to take back than one that was never built at all."
 ita_dnc.2854.a: "Build it properly."
 ita_dnc.2854.b: "The grant lapses."
 ita_dnc.2855.t: "The Deed from Peking"
 ita_dnc.2855.d: "The court has signed the boundary and the council, and the quarter on the river is ours in law as well as on paper. Our consul asks whether the flag should go up first or the harbour engineers should land first, since the court will notice whichever comes before the other. Both will be noticed, and only one will be forgiven."
 ita_dnc.2855.a: "Raise the flag over the quarter."
 ita_dnc.2855.b: "Land the engineers before the flag."
 ita_dnc.2856.t: "The Alliance Offered"
 ita_dnc.2856.d: "The Italians have offered what no other power has offered this court since the protocol: a treaty of alliance, signed between equals and published in full. Their minister makes no demand upon the provinces and asks for no concession in return. The council understands that an ally who asks for nothing is asking for the court itself."
 ita_dnc.2856.a: "We will stand with Rome."
 ita_dnc.2856.b: "The court binds itself to no one."
 ita_dnc.2951.t: "The Account of the Ministry"
 ita_dnc.2951.d: "The decade we asked for is over, and the country wants an account of it. The prefectures have their returns, the Chamber has its majority, and the squares have their memory. What we say now is what the next ministry will inherit."
 ita_dnc.2951.a: "Let the prefects make the returns one last time."
 ita_dnc.2951.b: "We shall pay for order out of our own credit."
 ita_dnc.2951.c: "We shall let the country speak and take what it says."
 ITA_o_the_union_inherits_the_wars_tt: "The wars of the annexed crown become our own."
 ITA_o_the_union_stands_alone_tt: "We lead no alliance, and the union will stand outside ours."
 ITA_u_the_nations_are_freed_tt: "Every nationality that has cores in our provinces is set up as a state of its own."
 ita_dnc.2952.t: "The War Office Asks a Question"
 ita_dnc.2952.d: "The general staff has counted the battalions raised in Africa and finds that the colonies now hold more rifles than the divisions of the north. Its memorandum is polite and it is not a request. Either the levies stop, or the estimates of the army are opened again and the ministry pays for what it has taken."
 ita_dnc.2952.a: "The estimates will be opened. The army is answered."
 ita_dnc.2952.b: "The colonies will keep their battalions. Let the staff write again."
 ITA_h_the_war_office_is_paid_tt: "The §Yanger of the War Office§! falls back."
 ITA_h_the_war_office_is_refused_tt: "The staff will remember that it was refused."
 ITA_h_the_war_office_resents_us: "The Staff Is Not Answered"
 ITA_h_the_war_office_resents_us_desc: "We took the men and we did not pay for them. The staff carries out our orders and keeps its own account of them."
 ita_dnc.2953.t: "The Consulta Asks a Question"
 ita_dnc.2953.d: "The Consulta has been reading the same telegrams as the colonial governors, and it does not like what the levies are doing to our word abroad. Every irregular band we raise is a paragraph in a foreign note. Either the recruiting is slowed, or the foreign ministry will decline to answer for it."
 ita_dnc.2953.a: "The recruiting is slowed. The Consulta is answered."
 ita_dnc.2953.b: "The colonies are governed from Rome, not from the Consulta."
 ITA_h_the_consulta_is_paid_tt: "The §Yanger of the Consulta§! falls back."
 ITA_h_the_consulta_is_refused_tt: "The foreign ministry will answer for nothing it did not write."
 ITA_h_the_consulta_resents_us: "The Consulta Is Not Answered"
 ITA_h_the_consulta_resents_us_desc: "The foreign ministry has been overruled on the ground it is supposed to speak for, and it has stopped defending us in the notes it sends."
 ita_dnc.2954.t: "The Note from the River Plate"
 ita_dnc.2954.d: "The consuls of the Italian kingdom on the Plate have gone past what a consulate does. They enrol reservists, they subsidise a press, and they speak for a community larger than some of the republics around it. The department has the file, and the question is whether it goes to the Court or into a drawer."
 ita_dnc.2954.a: "The file goes to the Court."
 ita_dnc.2954.b: "The file goes into the drawer."
 ITA_l_the_court_at_washington: "The Court Has the File"
 ITA_l_the_court_at_washington_desc: "Washington has taken our work on the Plate to arbitration, and every republic on the river now reads our consuls as a party to a case."
 ITA_l_washington_looks_away_tt: "Washington has read the file and put it away."
 ITA_air_range_tt: "Reach of the Air Service"
 ITA_air_accidents_tt: "Accidents in the Air Service"
 ITA_air_efficiency_tt: "Efficiency of the Air Missions"
 ITA_air_experience_tt: "Experience of the Air Service"
 ITA_air_aces_tt: "Airmen Who Make a Name"
 ITA_air_weather_tt: "Flying in Bad Weather"
 ITA_air_night_tt: "Flying by Night"
 ITA_air_aiming_tt: "Aim of the Bomb"
 ITA_n_morale_tt: "Morale of the Fleet"
 ITA_n_range_tt: "Range of the Fleet"
 ITA_n_experience_tt: "Experience of the Fleet"
 ITA_n_speed_tt: "Speed of the Fleet"
 ITA_n_coordination_tt: "Coordination in the Line"
 ITA_n_retreat_tt: "Breaking Off an Action"
 ITA_n_detection_tt: "Eyes of the Fleet"
 ITA_n_hunting_tt: "Hunting the Submarine"
 ITA_e_the_lines_run_better_tt: "Our §Ybuilding sites§! work faster."
 ITA_e_the_ground_gives_more_tt: "Our §Yown ground§! gives more."
 ITA_e_the_schools_answer_tt: "Our §Ylaboratories§! answer sooner."
 ITA_e_the_freight_is_cheaper_tt: "Our §Yfreight§! costs the works less."
 ITA_h_albertini_is_available_tt: "The editor of the Corriere will speak for the ministry."
 ITA_o_latin_system: "The Latin System"
 ITA_ENG_naval_group: "Anglo-Italian Naval Programme"
 ITA_ENG_naval_group_desc: "The two admiralties open their drawings of hulls and armour to one another."
 ITA_ENG_naval_tech_sharing: "The Naval Understanding"
 ITA_ENG_naval_tech_sharing_desc: "London lets our constructors read what its own yards have learned."
 ITA_QIN_group: "The Works at Peking"
 ITA_QIN_group_desc: "Our engineers and the court's share what each of them builds."
 ITA_AUH_industrial_group: "The Customs Union of the Littoral"
 ITA_AUH_industrial_group_desc: "The works of the two crowns are read as one estimate."
 ITA_RUS_naval_group: "The Yards of the Two Seas"
 ITA_RUS_naval_group_desc: "Petersburg and Rome build to one another's drawings."
 ITA_FRA_industrial_group: "The Shared Patents"
 ITA_FRA_industrial_group_desc: "What is patented in Paris is worked in Milan, and the other way about."
 ITA_o_destra_storica: "Destra Storica"
 ITA_o_destra_storica_long: "The Historical Right"
 ITA_o_unione_liberale: "Unione Liberale"
 ITA_o_unione_liberale_long: "The Liberal Union"
 ITA_o_governo_del_re: "Governo del Re"
 ITA_o_governo_del_re_long: "The Government of the King"
 ITA_l_award_at_belgrade_other: "Given the Award at Belgrade"
 ITA_l_award_at_cetinje_other: "Given the Award at Cetinje"
 ITA_l_second_award_at_cetinje_other: "Given the Second Award at Cetinje"
 ITA_u_guardian_of_the_adriatic: "Guardian of the Adriatic"
 ITA_u_trading_partners: "Trading Partners"
 ITA_h_the_stations_are_ours: "The Stations Are Italian"
 ita_dnc.2955.t: "The Italian Consulate"
 ita_dnc.2955.d: "The Italians have opened a consulate that does rather more than stamp papers. It keeps a register of its own nationals, it subsidises a school, and it answers to Rome and to nobody here. The department can treat it as a courtesy or as a lodgement."
 ita_dnc.2955.a: "A courtesy between friendly states."
 ita_dnc.2955.b: "The register will be watched."
 ITA_h_the_consulate_is_watched_tt: "The consulate is put under observation."
 ITA_h_the_stations_are_watched: "The Consulates Are Watched"
 ITA_h_the_stations_are_watched_desc: "A foreign department has decided that our consulates keep more than registers, and treats every note we send as evidence."
 ITA_l_no_porte_answers_tt: "No Ottoman ministry is left to answer, and the claim is made against whoever holds the shore."
 ita_dnc.2712.t: "The Answer Is Yes"
 ita_dnc.2712.d: "The note we sent has come back signed. [FROM.GetNameDefCap] has taken our terms as they were written, and the Consulta may enter the answer in the file it keeps of capitals that deal with us."
 ita_dnc.2712.a: "Enter it in the file."
 ita_dnc.2713.t: "The Answer Is No"
 ita_dnc.2713.d: "The note we sent has come back refused. [FROM.GetNameDefCap] gives no reason that the Consulta can put in a despatch, and the ministry must explain in the Chamber why it wrote at all."
 ita_dnc.2713.a: "The Chamber will be told."
 ITA_air_the_wireless_aloft_ns_desc: "A set aloft is worth a squadron of couriers, and our airships now carry one that talks back to the ground."
 ITA_air_the_defence_of_the_kingdom_ns_desc: "The Specialist Brigade answers for the sky over the arsenals and the two capitals, and it answers to the ministry alone."
 ITA_air_the_sheds_on_the_far_shore_ns_desc: "We keep sheds on the eastern shore, and what flies from them comes back with the coast drawn."
 ITA_air_the_night_and_the_beam_ns_desc: "A beam laid along the coast lets an airship find its shed after dark, which no other service in Europe can promise its crews."
 ITA_air_the_memoranda_of_douhet_ns_desc: "One officer keeps writing that the next war is decided above the armies. The ministry has stopped filing the memoranda and started reading them."
 ITA_n_the_staff_of_the_marine_desc: "The fleet finally has a staff that sits between the admirals and the ministry, and writes what it means to do before it is asked."
 ITA_n_the_staff_of_the_marine_improved_desc: "The naval staff now drafts the war plans itself and the squadrons exercise against them instead of against the calendar."
 ITA_n_the_night_flotillas_desc: "The torpedo boats work by night in the narrow sea, where a battleship is a target and a searchlight is a confession."
 ITA_n_the_glauco_boats_desc: "The submarine flotilla is no longer an experiment kept at La Spezia: it is a squadron with a station and a doctrine."
 ITA_u_the_shield_of_the_left_desc: "The regime rests on what the leagues will tolerate, and it is careful never to find out where that ends."
 ITA_u_the_shield_of_the_right_desc: "The regime rests on the men of property, who will pay for order and expect to be told they are paying for the nation."
 ITA_u_the_shield_of_the_left_and_labour_desc: "The leagues sit at the table and the hours are shorter, so the street is quiet without a single squadron being called out."
 ITA_u_the_shield_of_the_right_and_labour_desc: "The employers are protected and the workmen are insured, and neither side is told what the other was promised."
 ITA_u_the_shield_of_the_left_complete_desc: "Labour, the courts and the schools all answer to the same programme, and the regime no longer needs to argue for it."
 ITA_u_the_shield_of_the_right_complete_desc: "Property, the church and the officers hold the same view of the state, and the state has stopped asking anyone else."
 ITA_u_the_school_of_turin_2_desc: "The war school at Turin sets the examinations that decide who commands, and the regiments have noticed."
 ITA_u_the_school_of_turin_3_desc: "Turin now trains the staff as well as the line, and an officer who has not passed through it does not rise."
 ITA_u_the_school_of_turin_4_desc: "The school is the army: doctrine, promotion and the manoeuvre season all come out of the same building."
 ITA_u_the_scholars_returned_desc: "The men who left for foreign laboratories have been offered chairs at home, and most of them have taken them."
 ITA_u_the_royal_patronage_desc: "The Crown pays for the observatories, the institutes and the prizes, and its name is on all of them."
 ITA_u_everything_for_the_army_desc: "The estimates are written for the army first and the rest of the kingdom afterwards, and nobody in the Chamber says so aloud."
 ITA_u_the_technical_missions_desc: "Our engineers sit in foreign works and send home what they see, which is cheaper than inventing it twice."
 ITA_u_the_station_at_coltano_desc: "The station at Coltano talks to the colonies and to the fleet without asking a foreign cable company for permission."
 ITA_u_the_returned_exiles_desc: "The men we drove out have come back, and they have brought the organisations they built abroad with them."
 ITA_u_the_men_from_rome_desc: "Rome sends its own men to the provinces that will not govern themselves, and they do not stand for election."
 ITA_u_the_eastern_subscription_desc: "The eastern comrades are kept in funds by a subscription raised here, and they answer for what it buys."
 ITA_u_the_solidarity_funds_desc: "A fund kept in Rome pays the strike benefit of unions in half a dozen countries, and Rome decides which strikes it pays for."
 ITA_u_war_on_the_counting_house_ns_desc: "The banks are treated as an enemy department rather than a partner, and they have begun to behave like one."
 ITA_u_the_answer_to_tokyo_ns_desc: "Tokyo asked what a workers’ Italy would do in Asia, and we answered in writing."
 ITADNC_air_the_airship_goes_to_sea_patrol: "The Patrol Over the Water"
 ITADNC_air_the_engine_that_is_ours_motors: "The Motors of the Kingdom"
 ITADNC_air_the_school_of_the_airship_engines: "The Engines of the Airship School"
 ITADNC_air_the_school_of_the_bomb_sights: "The Sights of the Bombing School"
 ITADNC_air_the_school_of_the_eye_guns: "The Guns the Observers Direct"
 ITADNC_air_the_seaplane_station_patrol: "The Patrol from the Seaplane Station"
 ITADNC_n_the_ideal_battleship_guns: "The Guns of the Ideal Battleship"
 ITA_u_a_free_hand_in_tunis: "A Free Hand in Tunis"
 ITA_u_break_the_mediterranean_hegemony: "Breaking the Mediterranean Hegemony"
 ITA_u_carve_up_the_congo: "The Partition of the Congo"
 ITA_u_divide_the_powers_in_china: "Dividing the Powers in China"
