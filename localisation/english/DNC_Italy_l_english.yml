 h_the_treaty_of_commerce_with_petersburg: "The Treaty of Commerce with Petersburg"
 h_the_naval_understanding: "The Naval Understanding"
 h_the_million_who_left: "The Million Who Left"
 ITA_h_the_convention_of_extradition: "The Convention of Extradition"
 ITA_h_the_convention_of_extradition_desc: "The powers keep one list of names and one file of photographs, and the men upon it have nowhere left that is not a jurisdiction."
 ITA_h_the_balkan_status_quo: "The Balkan Status Quo"
 ITA_h_the_balkan_status_quo_desc: "Neither crown moves in that sea without the other, and nothing about it was ever written down."
 ITA_h_trading_partners: "Trading Partners of the Kingdom"
 ITA_h_the_gendarmerie_mission: "The Gendarmerie Mission"
 ITA_h_the_gendarmerie_mission_desc: "Our carabinieri police a sector of another empire, and learn there what a gendarmerie is worth."
 ITA_h_the_pass_is_ours_to_use: "The Pass Is Ours to Use"
 ITA_h_the_concession_at_tientsin: "The Concession on the River"
 ITA_h_the_dragon_and_the_eagle: "The Dragon and the Eagle"
 ITA_h_the_flag_follows_the_emigrant: "The Flag Follows the Emigrant"
 ITA_h_the_flag_follows_the_emigrant_desc: "Where our people land a consul lands with them, and behind the consul stands a hull."
 ITA_h_stations_modifier: "The Stations of the Red Sea"
 ITA_h_stations_modifier_desc: "Coal sheds, moles and condensers on the passage to the Indies."
 ITA_h_the_league_of_the_straits: "The League of the Straits"
 ita_dnc.2310.t: "The Convention Against Anarchy"
 ita_dnc.2310.d: "Rome has circulated the protocol its own conference drafted: one list of names, one file of photographs, and no asylum for the men who murder sovereigns. To sign is to let a foreign police force reach into our courts and to lose the exiles who shelter here. To refuse is to be named, in every chancellery, as the door the assassins use."
 ita_dnc.2310.a: "Sign what Rome has drafted."
 ita_dnc.2310.b: "No court of ours will be bound."
 ita_dnc.2311.t: "The Surrender of the Exiles"
 ita_dnc.2311.d: "The convention bound our police; Rome now wants it to bind our judges. The article would make a man who kills a head of state a common criminal, extraditable on demand, whatever politics he pleads. Granting it hands our benches a rule written abroad; withholding it tells Rome the pact was paper."
 ita_dnc.2311.a: "We will surrender them."
 ita_dnc.2311.b: "No state can promise that."
 ita_dnc.2312.t: "The Doors of Europe Close"
 ita_dnc.2312.d: "The powers that signed at Rome have begun to write the extradition article into their own codes, and the committees that printed freely a season ago are packing up their presses. The states that refused are named in the same dispatch. The Kingdom has made the sheltering of assassins a matter between governments."
 ita_dnc.2312.a: "Our signature is on it."
 ita_dnc.2312.b: "We signed nothing."
 ita_dnc.2313.t: "The Presses of the Ticino"
 ita_dnc.2313.d: "A note from Rome names the halls, the printers and the streets of the southern canton where the exiles meet, and asks that the colonies be broken up and their men handed over. To comply is to break the oldest promise the republic makes to anyone who reaches its border. To refuse is to leave an army standing at the head of the passes."
 ita_dnc.2313.a: "The colonies will be dispersed."
 ita_dnc.2313.b: "We do not surrender our guests."
 ita_dnc.2314.t: "The Convention of the Gotthard"
 ita_dnc.2314.d: "Rome proposes that the tariff of the great tunnel be fixed by treaty among the three states it serves, rather than by the company that bored it. Signing ties our rates to the will of our neighbours for a generation. Refusing keeps the toll in our own hands, and the ill will of the two capitals that use it most."
 ita_dnc.2314.a: "We will sit at that table."
 ita_dnc.2314.b: "The rates are ours to set."
 ita_dnc.2315.t: "The Pass Is Answered"
 ita_dnc.2315.d: "The reply from the mountain republic has reached the ministry, and with it the schedule the pass will carry from now on. Our coal and our emigrants use that line whatever is decided there. The question is only whether the rate is a treaty now or still a favour."
 ita_dnc.2315.a: "The rate is written down."
 ita_dnc.2315.b: "Then we pay what they ask."
 ita_dnc.2320.t: "The Ports of the Benadir"
 ita_dnc.2320.d: "The Kingdom has made its coast a colony of the State and now asks that the limits behind it be settled: the wells, the caravan roads and the stations both administrations claim. Yielding them buys a friend on that shore and loses a hinterland. Holding them keeps the map and invites the quarrel."
 ita_dnc.2320.a: "Let them have the hinterland."
 ita_dnc.2320.b: "Absolutely not."
 ita_dnc.2321.t: "A Station on That Coast"
 ita_dnc.2321.d: "The Kingdom has revived a demand it once withdrew: an anchorage, a coaling station and a strip of shore, held on lease and garrisoned by its marines. Granting it opens the door every other power has already walked through. Refusing it tells a proud and impatient ministry that the door is barred."
 ita_dnc.2321.a: "Their case is a fair one."
 ita_dnc.2321.b: "That coast is not theirs to ask for."
 ita_dnc.2324.t: "The Concession at Tientsin"
 ita_dnc.2324.d: "The grant on the river was made in the settlement that ended the siege, and it has never been more than a flagpole and a clerk. Rome asks for the boundary, the council and the garrison that would make it real. To honour it is to lose a quarter of a city; to withhold it is to keep a creditor waiting."
 ita_dnc.2324.a: "The grant was a courtesy, not a gift."
 ita_dnc.2324.b: "We will honour the grant."
 ita_dnc.2325.t: "The Naval Understanding"
 ita_dnc.2325.d: "Rome asks for constructors, drawings and plate, and offers in exchange the free run of its yards and its trials. Sharing the craft puts a fleet in the middle sea that answers to nobody but its own king. Withholding it keeps the craft at home and sends the orders to a rival yard."
 ita_dnc.2325.a: "Let them build with our drawings."
 ita_dnc.2325.b: "The trade is ours to keep."
 ita_dnc.2326.t: "The Talks at the Foreign Office"
 ita_dnc.2326.d: "The Italians have reopened the frontier of their eastern colony and want the wells and the river bank on their side of it. Conceding the line buys a friendly flank on a coast we cannot garrison twice. Refusing it keeps the map and adds one more grievance to a growing file."
 ita_dnc.2326.a: "The frontier may be rectified."
 ita_dnc.2326.b: "Not one mile."
 ita_dnc.2327.t: "The Road to Addis"
 ita_dnc.2327.d: "The men who were beaten on our plateau are back at the gate, and this time they bring rifles, cartridges and instructors rather than surveyors. Taking the gift arms our levies faster than any other friend could. Refusing it keeps the memory clean and the arsenal empty."
 ita_dnc.2327.a: "Unexpected, but welcome."
 ita_dnc.2327.b: "We have seen their roads before."
 ita_dnc.2328.t: "The Hand of London"
 ita_dnc.2328.d: "Rome offers to align its Horn, its coast and its fleet with ours, and asks only that we cease treating its colonies as a nuisance. Accepting steadies the middle sea and disappoints an emperor who trusted the other flag. Refusing leaves that fleet free to be courted by the powers we watch."
 ita_dnc.2328.a: "This steadies the middle sea."
 ita_dnc.2328.b: "We will not be tied."
 ita_dnc.2330.t: "Rome Turns to London"
 ita_dnc.2330.d: "The instructors are recalled, the convoy of rifles is halted at the coast, and the ministry that courted us has signed with the empire that beat us to the sea. Nothing was ever promised in writing, so nothing has been broken. It remains to decide whether this is a slight or merely a fact."
 ita_dnc.2330.a: "Nothing was ever promised."
 ita_dnc.2330.b: "We will remember the road."
 ita_dnc.2332.t: "The Treaty with Peking"
 ita_dnc.2332.d: "A minor power offers the court what the great ones never have: a treaty of commerce and establishment on equal terms, and a place in its alliance. Accepting binds us to a distant quarrel we have no fleet to join. Refusing leaves us alone among creditors who agree on everything except us."
 ita_dnc.2332.a: "Sign, and let them come."
 ita_dnc.2332.b: "We are done with treaties."
 ita_dnc.2333.t: "The Million Who Left"
 ita_dnc.2333.d: "Rome demands a commission, an indemnity and a federal law after the killings in the southern ports, and its ambassador has read the list of names aloud. Meeting the demand puts the government where its own constitution says it may not reach. Refusing tells a proud kingdom that its people abroad have no flag."
 ita_dnc.2333.a: "A commission will sit."
 ita_dnc.2333.b: "This is a matter for the states."
 ita_dnc.2394.t: "The Hunting Lodge at Racconigi"
 ita_dnc.2394.d: "The Italian king proposes a meeting at a shooting lodge where nothing will be signed: neither crown to move in the Balkans without the other, and each to hold the other's hand at the Straits and in the desert. Agreeing costs us the free hand our rival in Vienna also wants. Refusing costs us the only friend left who wants that sea open."
 ita_dnc.2394.a: "Nothing shall be written, and everything shall hold."
 ita_dnc.2394.b: "The Tsar does not bargain with the Triple Alliance."
 ita_dnc.2395.t: "Rome and Petersburg Have Met"
 ita_dnc.2395.d: "Our ally and the empire we have just outmanoeuvred in the Balkans have met at a shooting lodge, and the communique says only that the two sovereigns hunted. The ministry believes rather more than that. To protest is to spend the credit of the court on a paper we cannot produce; to say nothing is to let the thing stand."
 ita_dnc.2395.a: "We will protest, and loudly."
 ita_dnc.2395.b: "Let them hunt."
 ita_dnc.2396.t: "The Treaty of Commerce and the Naval Orders"
 ita_dnc.2396.d: "The Italians offer a commercial treaty and, with it, the slips that can build the armoured cruisers ours cannot lay down in time. Signing puts our naval programme in a foreign yard and our tariff in a foreign ledger. Declining keeps both at home and leaves the ships unbuilt."
 ita_dnc.2396.a: "Sign the treaty, and order the ships."
 ita_dnc.2396.b: "Our own yards will manage."
 ita_dnc.2397.t: "London Takes Note of the Orders"
 ita_dnc.2397.d: "The armoured cruisers building on the Ligurian slips are now entered in a Russian ledger, and the ministry has been asked what it makes of that. The yard is a neutral one and the contract is lawful. Whether it makes the Italians a supplier or a partner is the only question worth asking."
 ita_dnc.2397.a: "A yard sells to whoever pays."
 ita_dnc.2397.b: "Note it, and keep them close."
 ita_dnc.2398.t: "The Convention of the Straits"
 ita_dnc.2398.d: "The Italians ask that the shooting lodge become an alliance: our hand where the sea is closed, theirs where the desert begins. Accepting ties the empire to a kingdom still bound by treaty to our rival. Refusing leaves the understanding what it has always been, a promise between two men."
 ita_dnc.2398.a: "The Straits are worth an ally."
 ita_dnc.2398.b: "We do not tie ourselves to Rome."
 ita_dnc.2399.t: "The Debt Must Be Served"
 ita_dnc.2399.d: "The Roman bank holds the paper of our provinces, its delegate sits on the council of our debt, and it now offers to administer both under its own protection. Accepting hands a foreign ministry the revenue of the empire. Refusing leaves the account open, and this creditor has an army."
 ita_dnc.2399.a: "The debt must be served."
 ita_dnc.2399.b: "The Porte is not a company."
 FOCUS_FILTER_ITA_COUNCIL: "Council of Seven"
 ITADNC_h_the_royal_prerogative: "The Royal Prerogative"
 ITADNC_h_the_royal_prerogative_desc: "The King names his ministers and dismisses them, and no vote of the Chamber can name one for him. Those he calls are not colleagues: they hold what he lends them, and they hold it exactly as long as they are useful. A man who forgets whose hand raised him will find how quickly it is withdrawn. The course is set at the Quirinal."
 ITADNC_h_nitti_at_the_ministry: "Nitti at the Ministry"
 ITADNC_h_nitti_at_the_ministry_desc: "The professor from Muro Lucano has spent the decade telling the Chamber that the South will never be rich until the State builds its industry for it. We shall give him the portfolio he keeps asking for, and let him prove it at our expense."
 ITADNC_h_stringher_at_the_bank: "Stringher at the Bank"
 ITADNC_h_stringher_at_the_bank_desc: "The Bank of Italy has a governor who has held the note issue steady since the day he was appointed, and the great houses come to him before they come to us. We must seat him at the council table before the next crash finds him there alone."
 ITADNC_h_luzzatti_at_the_treasury: "Luzzatti at the Treasury"
 ITADNC_h_luzzatti_at_the_treasury_desc: "The Treasury needs a man the Paris and London markets will answer, and there is one who has already carried our paper through worse weather than this. We shall call him back to the Treasury and let him refund the debt."
 ITADNC_h_giolitti_at_the_interior: "Giolitti at the Interior"
 ITADNC_h_giolitti_at_the_interior_desc: "The Interior is the ministry that counts the votes, moves the prefects and decides which strike is a crime. We must put it in the hands of the one man who has never mistaken it for anything else."
 ITADNC_h_orlando_at_public_instruction: "Orlando at Public Instruction"
 ITADNC_h_orlando_at_public_instruction_desc: "Public Instruction is the ministry nobody wants, handed from cabinet to cabinet with its schools half built and its teachers half paid. We shall give it to a jurist who intends to legislate rather than to administer."
 ITADNC_h_sacchi_and_the_extreme: "Sacchi and the Extreme"
 ITADNC_h_sacchi_and_the_extreme_desc: "The radicals hold enough seats to break any budget and have never yet been offered a reason not to. We must bring their leader into the cabinet and buy the Extreme with a chair instead of a promise."
 ITADNC_h_salandra_and_the_right: "Salandra and the Right"
 ITADNC_h_salandra_and_the_right_desc: "The constitutional Right votes with us when it is asked and against us when it is ignored, and lately it has been ignored. We shall seat its man at the council table and have the majority counted from the other side."
 ITADNC_h_the_special_law_for_naples: "The Special Law for Naples"
 ITADNC_h_the_special_law_for_naples_desc: "Naples has a harbour, a customs house and no work, and the emigration offices there are busier than the yards. The Ministry will draw a special law: an industrial zone on the bay, and furnaces where there is now nothing but salt."
 ITADNC_h_the_credit_for_industry: "The Credit for Industry"
 ITADNC_h_the_credit_for_industry_desc: "Our banks lend against land and against paper and almost never against a machine that is not yet built. The Bank will stand behind the industrial credit itself, and the workshops will at last find money at a rate they can pay."
 ITADNC_h_the_conversion_of_the_rendita: "The Conversion of the Rendita"
 ITADNC_h_the_conversion_of_the_rendita_desc: "The consolidated rent pays a coupon the Treasury can no longer justify, and the markets are quiet enough to refund it. We shall offer the holders the lower rate or their money back, and spend the difference where the furnaces are."
 ITADNC_h_the_political_police: "The Political Police"
 ITADNC_h_the_political_police_desc: "The Interior keeps its cards on the subversives in a dozen offices that do not speak to one another. The reserved office will be given the whole file, and the man who reads it will report to the Minister alone."
 ITADNC_h_the_guards_of_public_safety: "The Guards of Public Safety"
 ITADNC_h_the_guards_of_public_safety_desc: "The city guards are hired by the communes, paid badly and obeyed rarely, and every riot proves it again. We shall make them a corps of the State, sworn, drilled and answerable to the prefect."
 ITADNC_h_the_law_on_the_schools: "The Law on the Schools"
 ITADNC_h_the_law_on_the_schools_desc: "Half our conscripts cannot sign the roll, and the communes that owe them a school have neither the money nor the will. The law will lengthen the years of instruction and open the evening and Sunday classes at the charge of the State."
 ITADNC_h_the_work_of_the_majority: "The Work of the Majority"
 ITADNC_h_the_work_of_the_majority_desc: "A majority that only votes is not a majority but an audience, and ours has been sitting quietly for far too long. Our chancellor shall put it to work on the commissions, the budgets and the laws of expenditure."
 ITADNC_h_the_ministry_of_industry: "The Ministry of Industry"
 ITADNC_h_the_ministry_of_industry_desc: "Industry and labour are still administered as an appendix to agriculture, by clerks who have never been inside a foundry. We shall cut them loose into a ministry of their own and give it to the man who asked for it."
 ITADNC_h_the_plenipotentiary_of_credit: "The Plenipotentiary of Credit"
 ITADNC_h_the_plenipotentiary_of_credit_desc: "The Bank already decides which company survives a bad winter, and it does so on an authority nobody can name. We shall write that authority down and make its governor plenipotentiary over the industrial credit."
 ITADNC_h_the_plenipotentiary_of_the_treasury: "The Plenipotentiary of the Treasury"
 ITADNC_h_the_plenipotentiary_of_the_treasury_desc: "Every ministry spends and only one of them is ever asked where the money went, which is no way to carry a budget. The Treasury shall have the last word over the estimates, and the departments will learn to ask before they buy."
 ITADNC_h_the_files_are_joined: "The Files Are Joined"
 ITADNC_h_the_files_are_joined_desc: "The cards of the reserved office are worth nothing while the prefects keep their own and share neither. All of it shall be joined in one directorate, and the Minister will know a man before the man knows himself."
 ITADNC_h_the_mobile_squadrons: "The Mobile Squadrons"
 ITADNC_h_the_mobile_squadrons_desc: "A rising in the Sicilian interior takes three days to reach by rail, and by then the town has burned or calmed itself. We shall raise mobile squadrons of carabinieri, mounted and lorried, that move the day the telegram arrives."
 ITADNC_h_the_agency_and_the_press: "The Agency and the Press"
 ITADNC_h_the_agency_and_the_press_desc: "The news agency is officious, subsidised and read in every prefecture, and the great Milan paper is read everywhere else. We must keep the first and come to terms with the second before somebody else does."
 ITADNC_h_the_leagues_in_the_majority: "The Leagues in the Majority"
 ITADNC_h_the_leagues_in_the_majority_desc: "The leagues and the cooperatives can call a general strike whenever the Chamber forgets them, and once they very nearly did. We shall bring them inside the ministerial bargain, and the Extreme will not walk out on us again."
 ITADNC_h_the_prefects_deliver: "The Prefects Deliver"
 ITADNC_h_the_prefects_deliver_desc: "A dissolution is of use only to a government whose prefects know what is expected of them in the constituencies. The circulars shall go out before the writs do, and the majority will come back larger than it left."
 ITADNC_h_the_new_industries: "The New Industries"
 ITADNC_h_the_new_industries_desc: "Electricity, chemistry and the patent office are where the next fortune lies, and we keep laboratories nobody has ever paid to test anything. We shall fund the testing institutes and let the new trades grow around them."
 ITADNC_h_the_commercial_treaties: "The Commercial Treaties"
 ITADNC_h_the_commercial_treaties_desc: "Our tariff was written for a country that exported wine and imported everything else, and it no longer describes us. The Treasury shall renegotiate the commercial treaties and revise the schedule line by line."
 ITADNC_h_the_interior_commands: "The Interior Commands"
 ITADNC_h_the_interior_commands_desc: "Troops used to keep order answer to a general who answers to the War Ministry, which has never wanted the duty. In fact if not in law the Interior shall command them, and the prefect will stop having to ask twice."
 ITADNC_h_the_school_makes_italians: "The School Makes Italians"
 ITADNC_h_the_school_makes_italians_desc: "We have made Italy and we have not yet made Italians, and every dialect on every parade ground says so aloud. The school shall teach one language, one history and one flag until the recruit arrives already knowing them."
 ITADNC_h_the_majority_that_governs: "The Majority That Governs"
 ITADNC_h_the_majority_that_governs_desc: "A majority that survives every vote is not the same thing as a majority that governs, and ours has only ever done the first. Our chancellor shall make it the instrument of the ministry, and keep it so."
 ITADNC_h_the_king_calls_another: "The King Calls Another"
 ITADNC_h_the_king_calls_another_desc: "The presidency of the Council is not won in the Chamber, it is given at the Quirinal, and it can be taken back there. The King shall call one of the ministers we have raised and charge him with forming the government."
 ITADNC_h_the_ministry_stands: "The Ministry Stands"
 ITADNC_h_the_ministry_stands_desc: "The dissolution has been risked, the elections have been held and the ministry has come back with its majority whole. We shall stay where we are, and the Crown shall say so in terms nobody can misread."
 ITA_h_the_council_opens_tt: "Opens the §YCouncil of Seven§!. The King may lend three seats at the council table; each minister seated works his own branch and finishes it without being told."
 ITA_h_the_crown_gains_tt: "The §YCrown§! gains authority over the ministry."
 ITA_h_council_seat_tt: "If the three seats are already taken, the King must be asked which of the sitting ministers gives his up."
 ITA_h_council_cd_days_tt: "Days before the King will hear another name: [?ITA_h_council_cd_flag:days_left|Y0]"
 ITA_h_the_council_has_finished_tt: "Three of the ministers now seated have each carried their branch to its end."
 ITA_h_nitti_named_tt: "§YFrancesco Saverio Nitti§! is called to the council table and takes up the industry of the South:"
 ITA_h_stringher_named_tt: "§YBonaldo Stringher§! is called to the council table and brings the Bank with him:"
 ITA_h_luzzatti_named_tt: "§YLuigi Luzzatti§! is called to the council table and takes the Treasury:"
 ITA_h_giolitti_named_tt: "§YGiovanni Giolitti§! is called to the council table and takes the Interior:"
 ITA_h_orlando_named_tt: "§YVittorio Emanuele Orlando§! is called to the council table and takes Public Instruction:"
 ITA_h_sacchi_named_tt: "§YEttore Sacchi§! is called to the council table and answers for the Extreme:"
 ITA_h_salandra_named_tt: "§YAntonio Salandra§! is called to the council table and answers for the Right:"
 ITA_h_the_seat_is_emptied_tt: "The minister sitting in that chair is dismissed and his branch stops where it stands."
 ITA_h_the_seat_is_filled_tt: "The new minister takes the chair and begins on the first work of his branch."
 ITA_h_the_name_is_withdrawn_tt: "The name is withdrawn, the political power is returned and the King will hear another at once."
 ITA_h_the_king_names_a_president_tt: "The minister is called to the Quirinal and charged with forming the government."
 ITA_h_sacchi_leaves_the_cabinet_tt: "The Radicals lose their voice in the cabinet the day their leader takes the presidency."
 ITA_h_the_treasury_intrigue_tt: "The winner keeps the last word over the estimates; the other two are shut out of it for good."
 ITA_h_stop_the_ministry_of_industry_tt: "The work on the Ministry of Industry and Labour is stopped where it stands, and the political power laid out on it is lost."
 ITA_h_stop_the_plenipotentiary_of_credit_tt: "The work on the Plenipotentiary of Credit is stopped where it stands, and the political power laid out on it is lost."
 ITA_h_stop_the_plenipotentiary_of_the_treasury_tt: "The work on the Plenipotentiary of the Treasury is stopped where it stands, and the political power laid out on it is lost."
 ITA_h_the_treasury_intrigue_unsettled_tt: "Nobody is given the last word, and the quarrel is carried into the next session."
 ITA_h_plenipotentiary_me_tt: "Only one plenipotentiary may hold the last word over the estimates."
 ITA_h_the_special_law_for_naples_tt: "The industrial zone on the bay of Naples is opened by law."
 ITA_h_the_credit_for_industry_tt: "The Bank stands behind the industrial credit and the rescue of the failing houses."
 ITA_h_the_conversion_of_the_rendita_tt: "The saving on the coupon is spent on the works of the north and on the plate mills."
 ITA_h_the_political_police_tt: "The reserved office is given the whole file on the subversives."
 ITA_h_the_guards_of_public_safety_tt: "The city guards become a sworn corps of the State under the prefect."
 ITA_h_the_law_on_the_schools_tt: "The years of instruction are lengthened and the evening classes are opened."
 ITA_h_the_work_of_the_majority_tt: "The majority is set to work in the Chamber, and the ministry may call on it:"
 ITA_h_the_ministry_of_industry_tt: "Industry and labour are cut loose from agriculture into a ministry of their own."
 ITA_h_the_plenipotentiary_of_credit_tt: "The governor of the Bank is made plenipotentiary over the industrial credit."
 ITA_h_the_files_are_joined_tt: "The cards of the reserved office and of the prefectures are joined in one directorate."
 ITA_h_the_mobile_squadrons_tt: "The mobile squadrons are raised, mounted where there is no road and lorried where there is."
 ITA_h_the_ascari_battalion_opens_tt: "The carabinieri who serve in Africa may now be formed into a battalion of their own."
 ITA_h_the_agency_and_the_press_tt: "The news agency is kept on the subsidy and the great Milan paper is come to terms with."
 ITA_h_the_leagues_in_the_majority_tt: "Prevents the Extreme from walking out of the Chamber."
 ITA_h_the_majority_gains_tt: "The §Ymajority§! in the Chamber is enlarged."
 ITA_h_the_prefects_deliver_tt: "The prefects prepare the constituencies before the writs are issued."
 ITA_h_the_new_industries_tt: "The testing institutes are funded and the new trades grow around them."
 ITA_h_the_commercial_treaties_tt: "The commercial treaties are reopened and the tariff schedule with them:"
 ITA_h_the_interior_commands_tt: "The troops kept for public order answer to the Interior in fact if not in law."
 ITA_h_the_school_makes_italians_tt: "One language, one history and one flag are taught in every commune of the kingdom."
 ITA_h_the_majority_that_governs_tt: "The chancellor makes the majority the instrument of the ministry."
 ITA_h_the_king_calls_another_tt: "The King will call one of the ministers of the council to form the government."
 ITA_h_the_ministry_stands_tt: "The Crown confirms the ministry in office, and the palace of government is enlarged."
 ITA_h_only_nitti_tt: "This focus can only be completed by §YNitti§!, once he has been called to the council table."
 ITA_h_only_stringher_tt: "This focus can only be completed by §YStringher§!, once he has been called to the council table."
