 ITA_dnc_e_the_workshops_bonus: "The Workshops of Turin"
 ITA_dnc_e_the_reservoirs_bonus: "Reservoirs in the Alps"
 ITA_dnc_e_the_current_bonus: "A Current for Every Wheel"
 ITA_dnc_e_special_laws_bonus: "The Special Laws"
 ITA_dnc_e_the_aqueduct_bonus: "The Apulian Aqueduct"
 ITA_dnc_e_the_commissariat_bonus: "The Commissariat of Emigration"
 ITA_dnc_e_beyond_the_sea_bonus: "The Italians Beyond the Sea"
 ITA_dnc_e_one_kingdom_bonus: "Two Italies, One Kingdom"
 ITA_dnc_e_the_loom_bonus: "The Current Reaches the Loom"
 ITADNC_arm_the_army_after_adwa: "The Army After Adwa"
 ITADNC_arm_the_army_after_adwa_desc: "Ours is the only European army destroyed by an African one, and the same generals turned field guns on Milan. We must decide what the army is for before we decide what it is worth, and put the staff to work on the answer."
 ITADNC_arm_pollio_keeps_the_staff: "Pollio Keeps the Staff"
 ITADNC_arm_pollio_keeps_the_staff_desc: "The general has spent years planning against France and warns against provoking Vienna over ground he considers already lost. We must leave him at his desk and let his plans stand as written."
 ITADNC_arm_spingardi_at_the_ministry: "Spingardi at the Ministry"
 ITADNC_arm_spingardi_at_the_ministry_desc: "The ministry needs contracts placed and factories running more than it needs a new strategy. We must hand Spingardi the war ministry and let the general staff wait its turn."
 ITADNC_arm_cadornas_hour: "Cadorna's Hour"
 ITADNC_arm_cadornas_hour_desc: "Cadorna has no patience left for the defensive plans and says so in front of the ministers. We must give him the staff and let him draw up the offensive he has been demanding."
 ITADNC_arm_the_alpine_frontier: "The Alpine Frontier"
 ITADNC_arm_the_alpine_frontier_desc: "We have signed the Triple Alliance and every staff ride still goes north-east. We must survey the passes above the Cadore, lay the Veneto roads for gun traffic, and say nothing aloud about which ally the works face."
 ITADNC_arm_the_arsenals: "The Arsenals"
 ITADNC_arm_the_arsenals_desc: "The Carcano is ours; the machine tools that make it are not, and buying abroad is faster and teaches the country nothing. We must fit out Terni and Turin to build their own plant, and keep the whole rifle inside the kingdom."
 ITADNC_arm_the_alpini: "The Alpini"
 ITADNC_arm_the_alpini_desc: "Battalions raised in the valleys they are meant to hold, by men who already know the ground. We must give them their own establishment, their guns on mules and a school of their own, and have a speciality no other army in Europe has troubled to build."
 ITADNC_arm_the_army_estimates: "The Army Estimates"
 ITADNC_arm_the_army_estimates_desc: "The War Minister lays the figures down and the Chamber finds three armies inside them and room for one. We must say which - the Alps, Africa, or a smaller establishment that lets the fleet have the difference - and hold to it through the vote."
 ITADNC_arm_the_army_of_the_alps: "The Army of the Alps"
 ITADNC_arm_the_army_of_the_alps_desc: "The enemy is the ally, and everything worth building points north-east. We must raise mountain divisions, put works into the Cadore and above the Isonzo, and run railheads to Belluno and Udine while the treaty still runs."
 ITADNC_arm_the_works_in_the_cadore: "The Works in the Cadore"
 ITADNC_arm_the_works_in_the_cadore_desc: "Concrete goes into the passes above Agordo and the ledgers call it road improvement. We must build the forts, spur a railway to each and garrison them with men who will hold the ground they live in."
 ITADNC_arm_the_mountain_batteries: "The Mountain Batteries"
 ITADNC_arm_the_mountain_batteries_desc: "A gun that breaks into mule loads and comes together above the treeline is worth two that cannot leave the valley road. We must give the short sixty-five to the Alpini and teach our gunners angles the manuals do not cover."
 ITADNC_arm_the_plan_against_the_ally: "The Plan Against the Ally"
 ITADNC_arm_the_plan_against_the_ally_desc: "The staff has completed a deployment against Austria-Hungary and filed it where the Consulta will not find it. We must rehearse the Isonzo with one hand and renew the Triple Alliance with the other, and accept what that costs us when it is found out."
 ITADNC_arm_the_army_of_africa: "The Army of Africa"
 ITADNC_arm_the_army_of_africa_desc: "Adwa is a debt and we intend to collect it. We must raise colonial establishments, a supply train that works past the last well and ascari battalions on the strength, and tell the Chamber honestly that the question is prestige."
 ITADNC_arm_the_ascari_regiments: "The Ascari Regiments"
 ITADNC_arm_the_ascari_regiments_desc: "The Eritrean battalions fought better at Adwa than our metropolitan brigades and were spent covering their retreat. We must raise them properly, pay them properly and give them a depot at Massawa, so that Africa costs us fewer men out of Naples."
 ITADNC_arm_the_army_of_the_new_century: "The Army of the New Century"
 ITADNC_arm_the_army_of_the_new_century_desc: "The choosing is finished and the men who lost Adwa are retiring. We must rewrite the regulations around what we chose and train the majors who will command the next war for something in particular."
 ITA_arm_the_verdict_of_adwa: "The Verdict of Adwa"
 ITA_arm_the_verdict_of_adwa_desc: "An army that lost to Menelik and won at Milan, and is not sure which of the two it is supposed to be proud of. Recruits arrive expecting to be despised and the officers do not disappoint them."
 ITA_arm_the_seniority_list: "The Seniority List"
 ITA_arm_the_seniority_list_desc: "Nobody is passed over and nobody is offended. The generals are content, the Chamber is untroubled, and the man who will command the army in the next war is already sixty."
 ITA_arm_promotion_by_examination: "Promotion by Examination"
 ITA_arm_promotion_by_examination_desc: "Boards, papers and a mark against a name. Ability rises faster than it used to and a great many colonels have written to their deputies about it."
 ITA_arm_the_class_of_the_year: "The Class of the Year"
 ITA_arm_the_class_of_the_year_desc: "The levy is called as the law says it should be, exemptions are audited, and the register at last resembles the country. The depots are fuller and the families are angrier."
 ITA_arm_three_years_with_the_colours: "Three Years with the Colours"
 ITA_arm_three_years_with_the_colours_desc: "A long service that turns a peasant into a soldier and keeps him out of the fields for two harvests. The battalions are steady and there are fewer of them."
 ITA_arm_two_years_with_the_colours: "Two Years with the Colours"
 ITA_arm_two_years_with_the_colours_desc: "More men pass through the depots and fewer of them remember what they learned. On paper the Kingdom can put a great army in the field, and on paper it has trained it."
 ITA_arm_the_school_of_the_regiment: "The School of the Regiment"
 ITA_arm_the_school_of_the_regiment_desc: "The barracks teaches letters because nobody else has. A conscript goes home able to read the newspaper that will one day tell him what his officers have done."
 ITA_arm_the_quick_firing_batteries: "The Quick-Firing Batteries"
 ITA_arm_the_quick_firing_batteries_desc: "A carriage that absorbs its own recoil, a layer who does not relay after every round, and a battery that can be registered before the enemy has finished deploying."
 ITA_arm_the_deport_licence: "The Deport Licence"
 ITA_arm_the_deport_licence_desc: "The hydro-pneumatic carriage is licensed and built at Turin. The first batteries are late and the fifth is on time, and the trade has stayed inside the country."
 ITA_arm_the_krupp_contract: "The Krupp Contract"
 ITA_arm_the_krupp_contract_desc: "Finished guns off the quay at Genoa, excellent and foreign. The batteries are re-equipped in a year and the arsenals have learned nothing they did not already know."
 ITA_arm_the_army_is_not_a_police: "The Army Is Not a Police Force"
 ITA_arm_the_army_is_not_a_police_desc: "Standing orders forbid the use of field artillery in a labour dispute. The prefects are told to manage with the carabinieri, and the working quarters have stopped counting the army among their enemies."
 ITA_arm_the_cannon_of_milan: "The Cannon of Milan"
 ITA_arm_the_cannon_of_milan_desc: "The battalions still go where the prefect sends them, and the ministry can rely on it. So can the Socialist press, which reprints the casualty list of ninety-eight every May."
 ITA_arm_the_alpine_frontier: "The Alpine Frontier"
 ITA_arm_the_alpine_frontier_desc: "Surveys, mule tracks and quarry sidings in the north-east, entered in the estimates as roads. The engineers know exactly which contour line the guns are meant to sit on."
 ITA_arm_the_alpini_corps: "The Alpini"
 ITA_arm_the_alpini_corps_desc: "Recruited in the valleys, officered by men from the same valleys, and the only corps in the Kingdom that fills its ranks with volunteers. They keep the feather and they keep the ground."
 ITA_arm_the_army_of_the_alps: "An Army for the Alps"
 ITA_arm_the_army_of_the_alps_desc: "Everything is sized for a war of ridgelines: short marches, heavy positions, guns that go where wheels cannot. It is a superb instrument in one place and an awkward one anywhere else."
 ITA_arm_the_frontier_works: "The Frontier Works"
 ITA_arm_the_frontier_works_desc: "Concrete in the passes, batteries cut into the rock and a garrison that has lived on the position long enough to know where the fog sits in October."
 ITA_arm_the_mountain_batteries: "The Mountain Batteries"
 ITA_arm_the_mountain_batteries_desc: "Guns broken into mule loads, gunners who can climb, and fire support above the treeline where an enemy has learned not to expect it."
 ITA_arm_the_plan_against_the_ally: "The Plan Against the Ally"
 ITA_arm_the_plan_against_the_ally_desc: "A finished deployment against the power we are allied to, rehearsed every summer and never mentioned at the renewal talks. The staff has stopped improvising."
 ITA_arm_the_army_of_africa: "An Army for Africa"
 ITA_arm_the_army_of_africa_desc: "Columns that carry their own water, officers who volunteer for the climate, and an establishment that assumes the enemy will be met a fortnight beyond the railhead."
 ITA_arm_the_ascari_regiments: "The Ascari Regiments"
 ITA_arm_the_ascari_regiments_desc: "Eritrean battalions on a proper establishment with proper pay. They march further on less than any regiment raised in Lombardy, and Rome has begun to depend on it."
 ITA_arm_a_smaller_army: "A Smaller Army"
 ITA_arm_a_smaller_army_desc: "Twelve corps that are equipped instead of sixteen that are not. The saving goes to the slipways, and the officer corps has been told to call it prudence."
 ITA_arm_the_cadre_establishment: "The Cadre Establishment"
 ITA_arm_the_cadre_establishment_desc: "Small units of long-service men who can be filled out from an indexed reserve. Cheap in peace, and it works only if the index is kept honest."
 ITA_arm_the_army_of_the_new_century: "The Army of the New Century"
 ITA_arm_the_army_of_the_new_century_desc: "Regulations written for a war the Kingdom has actually chosen to fight, and officers who were examined for the rank they hold. Adwa is a page in the staff course now, not an open wound."
 ITA_arm_robilant_at_the_staff: "Mario di Robilant"
 ITA_arm_robilant_at_the_staff_desc: "He commanded in the mountains before it was fashionable and has written the only Italian manual on it that the Alpini actually use."
 ITA_arm_the_three_answers_tt: "§YThe Chamber will hear three answers: the Alps, Africa, or a smaller army and a larger fleet.§!"
 ITA_arm_pollio_at_the_boards_tt: "§YAlberto Pollio sits on the examination boards and gains a skill level.§!"
 ITA_arm_cadorna_waits_his_turn_tt: "§YLuigi Cadorna keeps his place on the list, and remembers who put it there.§!"
 ITA_arm_robilant_at_the_staff_tt: "§YMario di Robilant is available as a High Command advisor.§!"
 ITA_arm_diaz_takes_the_salute_tt: "§YArmando Diaz gains a skill level.§!"
 ita_dnc.400.t: "The Report Nobody Published"
 ita_dnc.400.d: "Baratieri was acquitted and the report was shelved, and every officer in the Kingdom has read a copy anyway. Twelve thousand men marched into the mountains in four columns working off three different maps, and the columns lost touch before dawn. The failure was the staff work, and the staff is still the staff."
 ita_dnc.400.a: "Then we begin with the staff."
 ita_dnc.400.b: "Let it stay on the shelf."
 ita_dnc.401.t: "The List Is Posted in January"
 ita_dnc.401.d: "It is the same list every year, in the same order, one year older. Pollio wants examination boards and a mark against every name. The seniors answer that a colonel who has waited twenty years has earned his regiment, and several of them have written to their deputies about it. Cadorna has written to the King."
 ita_dnc.401.a: "Open the list to examination."
 ita_dnc.401.b: "Seniority is the only honest rule."
 ita_dnc.402.t: "The Class of the Year"
 ita_dnc.402.d: "Two hundred thousand names on the registers, ninety thousand exemptions granted, and a good part of the remainder already gone to Buenos Aires or New York without telling the mayor. The Minister of War may have three years with the colours and a small army, or two years and a large one that has forgotten its drill by the second harvest."
 ita_dnc.402.a: "Three years. Soldiers, not numbers."
 ita_dnc.402.b: "Two years. Numbers are what we have."
 ita_dnc.403.t: "The Recoil Question"
 ita_dnc.403.d: "Two answers lie on the table. Krupp will sell a finished quick-firer for cash and teach us nothing. Deport's hydro-pneumatic carriage can be licensed and turned out at Turin, more slowly, and the trade stays in the country. Ansaldo has already sent a deputation to the ministry, and so has the German embassy."
 ita_dnc.403.a: "Licence it. Build it at Turin."
 ita_dnc.403.b: "Buy the guns from Essen."
 ita_dnc.404.t: "The Prefect Asks for Battalions"
 ita_dnc.404.d: "A prefect in Emilia wires for two battalions to clear a strike. In ninety-eight the answer was Bava Beccaris, grapeshot in the Corso and a decoration from a King who now lies in the Pantheon with three bullets in him. Giolitti's rule is that the state does not take sides in a wage dispute. No general has yet been made to test it."
 ita_dnc.404.a: "The army does not police strikes."
 ita_dnc.404.b: "Order first. Send the battalions."
 ita_dnc.405.t: "The Feather and the Establishment"
 ita_dnc.405.d: "The Alpini recruit where the men already know the snow, which is why they are the only corps that fills its ranks without a summons. Robilant wants them made permanent, with their own artillery and their own school at Aosta. The line regiments call it a private army with a feather in its hat."
 ita_dnc.405.a: "Give them a corps of their own."
 ita_dnc.405.b: "They are line battalions with a hat."
 ita_dnc.406.t: "The Debt of Adwa"
 ita_dnc.406.d: "Menelik still holds the treaty that made Ethiopia sovereign and Italy the power that signed it away. The officer corps wants the frontier redrawn at Adigrat. The Consulta wants the caravan road and the coffee. Both are being asked for at once, and only one of them is cheap."
 ita_dnc.406.a: "The frontier. We are going back."
 ita_dnc.406.b: "The road and the trade. Not the frontier."
 ita_dnc.407.t: "The Transports Are Loaded at Naples"
 ita_dnc.407.d: "The Ottoman garrison in Tripolitania is thin, the nationalist papers have already printed the landing, and the Banco di Roma has been buying land there for a decade. Giolitti spent two years telling the Consulta that Tripoli is a box of sand. He has stopped saying it where reporters can hear."
 ita_dnc.407.a: "Send the ultimatum to the Porte."
 ita_dnc.407.b: "Hold the transports."
 ita_dnc.408.t: "The Minister Takes It Personally"
 ita_dnc.408.d: "The War Minister reads the vote as a verdict on himself and offers to go. The estimates cross the corridor to the Marine, where Thaon di Revel has been waiting with a list of slipways. The generals will be correct and quiet about it, and will remember the year."
 ita_dnc.408.a: "Accept the resignation."
 ita_dnc.408.b: "Keep him, and split the difference."
 ita_dnc.409.t: "The Review"
 ita_dnc.409.d: "The King takes the salute of an army that finally knows what it is for. The officers who marched off three maps in Tigray are pensioned, their successors were examined for the rank they wear, and the regulations in the hands of the drill sergeants were printed this year. Whatever the Chamber decided, it has reached the parade ground."
 ita_dnc.409.a: "The Kingdom has an army."
 ITADNC_n_the_naval_estimates: "The Naval Estimates"
 ITADNC_n_the_naval_estimates_desc: "Brin is dead and the fleet he left us is a museum of single ships, no two magazines interchangeable. Our estimate can buy hulls or it can buy a plan, and we must say at the Marine which the Regia Marina is going to have."
 ITADNC_n_the_design_office: "The Design Office"
 ITADNC_n_the_design_office_desc: "Cuniberti will not stop arguing that the secondary battery is the part that has to go, and he has nowhere to prove it. We must give him a table at the Genio Navale, his sums and a hearing before the technical committee."
 ITADNC_n_the_building_ways: "The Building Ways"
 ITADNC_n_the_building_ways_desc: "Castellammare, La Spezia and Venice can lay down three capital hulls at once and finish none of them on time. We must lengthen the slips, roof the erecting shops and hire the fitters before the drawings arrive."
 ITADNC_n_the_whitehead_licence: "The Whitehead Licence"
 ITADNC_n_the_whitehead_licence_desc: "The best torpedo in Europe is made at Fiume, on Austrian soil, by an English firm. We must buy the licence while it is still for sale and lay down a state works at Naples, so a customs house cannot disarm our flotillas."
 ITADNC_n_the_article_in_janes: "The Article in Jane's"
 ITADNC_n_the_article_in_janes_desc: "The technical committee will not carry the ship and our estimates will not stretch to it. We must let the colonel publish instead, over his own name and about somebody else's fleet, and keep the money in the vote where the Chamber can see it."
 ITADNC_n_the_fleet_base_at_taranto: "The Fleet Base at Taranto"
 ITADNC_n_the_fleet_base_at_taranto_desc: "Spezia faces France and Naples faces nothing in particular, while the Mar Grande is deep, defensible and near the mouth of the Adriatic. We must dredge it, fort it and move the squadron south to the war it is actually for."
 ITADNC_n_the_glauco_boats: "The Glauco Boats"
 ITADNC_n_the_glauco_boats_desc: "Pullino's boats at Venice are small, wet and reliable enough that our crews volunteer twice. We must build them in numbers, because a boat that can sit in a narrow sea for a week changes what Pola may safely risk."
 ITADNC_n_the_triple_turret: "The Triple Turret"
 ITADNC_n_the_triple_turret_desc: "Masdea proposes three barrels on one turntable and every foreign constructor tells us it will jam, whip and spread the salvo. We must pay for a proof mounting and let him try, because if the ring holds we carry more guns per ton than anybody."
 ITADNC_n_the_petersburg_drawings: "The Petersburg Drawings"
 ITADNC_n_the_petersburg_drawings_desc: "Vickers wants the plans, Petersburg wants the man, and the Marine needs the fee. We must sell the drawings and let the colonel go with them, and read what he builds abroad in a foreign navy list."
 ITADNC_n_the_naval_academy_study: "The Naval Academy Study"
 ITADNC_n_the_naval_academy_study_desc: "The Academy has war-gamed the Adriatic with Pola playing itself and no thumb on the scale. We must print the answer it came back with - that the sea cannot be forced by a line of battle and cannot be held without one - and let the Chamber ask what it has been buying."
 ITADNC_n_the_adriatic_is_a_closed_sea: "The Adriatic Is a Closed Sea"
 ITADNC_n_the_adriatic_is_a_closed_sea_desc: "One door at Otranto, and behind it a coast of islands belonging to our ally: we hold the flat side, with all the ports and none of the anchorages. We must fortify what we hold and teach the fleet to fight in a sea it cannot leave."
 ITADNC_n_the_laurenti_hull: "The Laurenti Hull"
 ITADNC_n_the_laurenti_hull_desc: "A double hull, a partitioned battery and a boat that surfaces when the crew asks it to. We must build Laurenti's design at Venice and sell it abroad, because it is something the great powers cannot yet copy."
 ITADNC_n_the_dante_alighieri: "The Dante Alighieri"
 ITADNC_n_the_dante_alighieri_desc: "Every gun on the centreline, in triple turrets, and Vienna has not yet drawn a line on paper. We must lay her down at Castellammare - the first dreadnought we have designed and built ourselves - and let every attache in Rome write home about it."
 ITADNC_n_the_night_attack: "The Night Attack"
 ITADNC_n_the_night_attack_desc: "A destroyer captain who can find a battle squadron at two in the morning is worth a battleship the Chamber will never vote us. We must train the flotillas to work without lights in water they know, and pay the bill in oil, torpedoes and lost boats."
 ITADNC_n_the_race_with_pola: "The Race with Pola"
 ITADNC_n_the_race_with_pola_desc: "Vienna's delegations have voted the credit and the slips at Trieste are occupied, and the only sea those ships can be used in is the one we must cross. We must answer the programme, and be seen to answer it, while the treaty is still signed."
 ITADNC_n_the_cavour_class: "The Cavour Class"
 ITADNC_n_the_cavour_class_desc: "Ordering one hull at a time gets us prototypes and no squadron. We must order three ships to one settled design together, so the yards cut plate for a class, and hold the third hull against the committee that will try to strike it out."
 ITADNC_n_the_export_yard: "The Export Yard"
 ITADNC_n_the_export_yard_desc: "If our fleet will not order, the slips go cold and the fitters go home. We must let Ansaldo and Orlando take work for Argentina, Spain and the Turks, and watch the finest hull in the yard leave under another flag."
 ITA_n_the_estimates_of_1900: "The Estimates of 1900"
 ITA_n_the_estimates_of_1900_desc: "A fleet of one-offs, a ministry that changes hands every eighteen months, and a vote that has never once been written to a plan lasting longer than the ministry. The estimate is at last drawn up as a programme rather than a shopping list, and the Treasury has noticed that programmes are harder to cut."
 ITA_n_the_estimates_of_1909: "The Estimates of 1909"
 ITA_n_the_estimates_of_1909_desc: "The vote is now written four years ahead, because a dreadnought takes four years and the ally is building four of them. The yards have never been busier and the Chamber has never been asked for so much at once. Everything that is not a hull is being paid for by somebody who did not vote for it."
 ITA_n_the_drawing_office: "The Drawing Office"
 ITA_n_the_drawing_office_desc: "Four draughtsmen, a colonel of the Genio Navale and a standing instruction to work the weights honestly before the committee sees them. It is the cheapest thing in the estimate and the only part of the Regia Marina that is ahead of anyone."
 ITA_n_the_ship_of_the_future: "The Ship of the Future"
 ITA_n_the_ship_of_the_future_desc: "A uniform main battery, one calibre and one set of splashes to range on, in a hull nobody has built yet. The gunnery is transformed and so is the price: every yard in the Kingdom has to be rebuilt around a ship the Kingdom has never made, and every existing ship becomes a training vessel."
 ITA_n_the_refusal_of_1903: "The Refusal of 1903"
 ITA_n_the_refusal_of_1903_desc: "The committee heard him, thanked him, and voted for what the yards could already build. The estimate is smaller, the Chamber is calmer, and the argument the Regia Marina had won in private has been given away in print to whoever cares to lay the keel."
 ITA_n_the_base_at_taranto: "The Base at Taranto"
 ITA_n_the_base_at_taranto_desc: "Dredged basins, a dry dock, coal sheds and a boom across the Mar Piccolo. The squadron now lies where the Adriatic can be reached in a day rather than a week, and the South has been given the only piece of state industry it has ever been sent."
 ITA_n_a_sea_that_closes_behind_us: "A Sea That Closes Behind Us"
 ITA_n_a_sea_that_closes_behind_us_desc: "The staff paper is circulated: one door at Otranto, no anchorages on our own side, and an eastern shore held by the power we are treaty-bound to. Batteries go up at the heel of Italy and the survey ships work the channels, and the ally's attache reports every yard of it.\n\nVienna's confidence in Rome: §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_n_the_double_hull: "The Double Hull"
 ITA_n_the_double_hull_desc: "Laurenti's partitioned boat surfaces when it is asked to, which is more than most of Europe's can promise. Foreign navies are placing orders at Venice, and the crews of the Regia Marina no longer volunteer as though they were volunteering for a funeral."
 ITA_n_the_dante_programme: "The Dante Programme"
 ITA_n_the_dante_programme_desc: "Four triple turrets on the centreline, the first of them in the world, built in a yard that had never assembled anything like it. The Kingdom has a dreadnought before its ally does. It has also committed the next four estimates to keeping her company."
 ITA_n_the_cruiser_answer: "The Cruiser Answer"
 ITA_n_the_cruiser_answer_desc: "Armoured cruisers are quick, handsome, affordable and beaten by anything with a uniform heavy battery. The fleet gets hulls this decade instead of arguments, and the wardroom keeps a copy of the Jane's article in the drawer to remind itself what it settled for."
 ITA_n_the_race_with_pola: "The Race with Pola"
 ITA_n_the_race_with_pola_desc: "Two allies laying down capital ships against each other in a sea a hundred miles wide, each publishing the tonnage so the other can read it. The yards are full and the Treasury is empty, and neither government will say in the Chamber who the ships are for."
 ITA_n_the_cavour_programme: "The Cavour Programme"
 ITA_n_the_cavour_programme_desc: "A class rather than a prototype: three hulls ordered together, plate cut to one set of templates, and a fitting-out schedule the yards can actually plan around. It is the first time Italian naval construction has behaved like an industry instead of a commission."
 ITA_n_the_export_yard: "The Export Yard"
 ITA_n_the_export_yard_desc: "Foreign orders keep the slips warm and the fitters employed between naval votes, and the drawing offices learn faster building for demanding customers than for a ministry that cannot make up its mind. The best ship on the ways is always somebody else's."
 ITA_n_the_high_seas_school: "The School of the Open Sea"
 ITA_n_the_high_seas_school_desc: "The fleet is trained and stored to leave its own sea: long-range steaming, colliers exercised with the squadron, landing parties told off by name. It is expensive, the army resents every lira of it, and it is the only doctrine under which Italy can put troops ashore where it chooses."
 ITA_n_the_narrow_sea_school: "The School of the Narrow Sea"
 ITA_n_the_narrow_sea_school_desc: "Mines, boats, night torpedo work and a fortified coast. The Adriatic becomes a sea nobody can enter cheaply, including us. The battle line that would have to leave it is not built, and the Chamber is quietly relieved."
 ITA_n_terni_plate: "Terni Plate"
 ITA_n_terni_plate_desc: "The belt is rolled in Umbria, late and dear, by a works the state had to keep alive to have it at all. It is the only armour in the Kingdom that no foreign minister can delay, and every constructor knows exactly how much that independence is costing per ton."
 ITA_n_the_sheffield_contract: "The Sheffield Contract"
 ITA_n_the_sheffield_contract_desc: "The plate is cheaper, better and English, and it arrives in the same bottoms as the coal. The ships are afloat a year earlier. So is the understanding, at the Consulta and at the Admiralty both, that Italy's battle line is armoured at London's convenience."
 ita_dnc.300.t: "The Estimates of the New Century"
 ita_dnc.300.d: "The Ministry of Marine lays its estimate before a Chamber still arguing about Adwa and the state of siege. There is money for a squadron, or for the yards that would build one, or for the base a squadron would sail from, and there is not money for two of the three. Bettolo's officials want the hulls. The constructors want the slips lengthened first. The naval staff want Taranto dredged and the fleet moved south. The minister has a week to choose, and whichever he chooses will be quoted back at him for a decade."
 ita_dnc.300.a: "Vote the hulls. The yards will manage somehow."
 ita_dnc.300.b: "Vote nothing this year. The Chamber has had a bad enough one."
 ita_dnc.300.c: "Vote the base. The ships can wait; the harbour cannot."
 ITA_n_e300a_tt: "Four keels are laid in yards that cannot finish them on time, and everybody involved knows it while signing."
 ITA_n_e300b_tt: "The estimate is withdrawn and the ministry survives the session. The Navy List ages by a year in one afternoon."
 ITA_n_e300c_tt: "The dredgers go to work in the Mar Grande, and the South is sent state money for the first time since unification without a prefect attached to it."
 ita_dnc.301.t: "The Colonel Presents His Ship"
 ita_dnc.301.d: "Cuniberti stands before the technical committee with a general arrangement eight feet long and a table of weights he has checked four times. Twelve heavy guns, no secondary battery worth the name, twenty-four knots, seventeen thousand tons. The committee's objection is not that it will not work. The objection is that if it does work, every ship on the Navy List becomes a training vessel the day she commissions, including the four the Chamber voted for last year and the two still on the slips."
 ita_dnc.301.a: "Order the design worked up in full."
 ita_dnc.301.b: "Thank the colonel and file the drawing."
 ITA_n_e301a_tt: "The weights are worked through properly and the gunnery school is told to plan for one calibre."
 ITA_n_e301b_tt: "The drawing goes into a cabinet at the Genio Navale, and the committee returns to the ships it understands."
 ita_dnc.302.t: "Twelve Guns and Nothing Between Them"
 ita_dnc.302.d: "The gunnery school reports that with a uniform main battery the spotters range on the splashes instead of guessing which calibre made them, and the hit rate at eight thousand yards roughly doubles. The same report notes that the ship has almost nothing to throw at a torpedo boat closing in the dark, and that the Adriatic is full of torpedo boats belonging to the ally. Thaon di Revel's staff want a secondary battery put back. The constructors reply that the weight has to come out of the belt or out of the boilers, and invite the staff to choose which."
 ita_dnc.302.a: "Hold the line. No secondary battery."
 ita_dnc.302.b: "Put back a light battery and accept the weight."
 ITA_n_e302a_tt: "The spotting tables are rewritten for a single calibre, and the flotillas are told the battle line will simply have to be screened."
 ITA_n_e302b_tt: "A light battery goes back into the design, the belt loses two inches, and the ship becomes slightly less than the article promised."
 ita_dnc.303.t: "The Ideal Battleship Is Printed Abroad"
 ita_dnc.303.d: "The article appears under the colonel's own name in the naval annual, complete with the general arrangement, the weights and the reasoning, under the title of an ideal battleship for the British fleet. It is read at the Admiralty within the month and at Portsmouth within two. Rome has published, free of charge and over its own signature, the design it declined to pay for. The only question left open is who lays the first keel, and the answer will be printed in every naval annual for thirty years."
 ita_dnc.303.a: "Let it stand. The credit is Italy's whatever flag flies over the ship."
 ita_dnc.303.b: "Answer it with a staff paper of our own."
 ita_dnc.303.c: "Approach Vickers about buying a hull instead of drawing one."
 ITA_n_e303a_tt: "The Admiralty's constructors are handed a finished argument they were still assembling, and the first all-big-gun keel is laid on the Solent rather than at Castellammare."
 ITA_n_e303b_tt: "Livorno is set to work on what such a ship would mean for a closed sea, which is at least a study the Kingdom owns."
 ITA_n_e303c_tt: "The Consulta opens a quiet conversation in London, and the fleet's next capital ship will be armoured, engined and largely built by the power that sells us our coal."
 ita_dnc.304.t: "Terni or Sheffield"
 ita_dnc.304.d: "The belt needs cemented plate, and the works at Terni can roll it at a price and to a schedule which the constructors describe in writing as optimistic. Vickers and John Brown can deliver the same plate sooner and cheaper, carried in ships crossing a sea London controls, out of furnaces fed by coal London also controls. The Kingdom has no coal under any part of it and has already learned what a leash feels like. The question in front of the minister is whether he wants a second one fastened around the armour belt."
 ita_dnc.304.a: "Roll the plate at Terni, whatever it costs and however late."
 ita_dnc.304.b: "Buy the plate at Sheffield and get the ship into the water."
 ITA_n_e304a_tt: "Terni is kept alive by the naval vote, delivers late, and delivers armour no foreign ministry can hold up at a wharf."
 ITA_n_e304b_tt: "The plate lands at Genoa in the same bottoms as the coal, the ship is afloat a year early, and the account with London grows by one more item."
 ita_dnc.305.t: "A Sea With One Door"
 ita_dnc.305.d: "The staff appreciation runs to four pages and says one thing: the Adriatic can be closed at Otranto by whichever fleet gets a squadron there first, and the eastern shore, which holds every deep-water anchorage in the sea, belongs to the power Rome is formally allied to. The Consulta would rather the paper did not circulate. The naval staff would rather it were acted upon. Vienna's attache has already asked, twice and politely, what exactly the survey ships out of Brindisi are surveying."
 ita_dnc.305.a: "Act on it. The sea is a military problem before it is a diplomatic one."
 ita_dnc.305.b: "Reassure Vienna and shelve the paper."
 ita_dnc.305.c: "Fortify the heel of Italy and say nothing to anybody."
 ITA_n_e305a_tt: "The appreciation becomes the working assumption of the fleet, and the attache's next report says so."
 ITA_n_e305b_tt: "The survey ships are recalled and the ally is told, in writing, that the Adriatic is a shared sea."
 ITA_n_e305c_tt: "Batteries go up at Brindisi and Otranto without an announcement, and are photographed from a passing steamer within the season."
 ita_dnc.306.t: "The Dante Alighieri Takes the Water"
 ita_dnc.306.d: "She goes down the ways at Castellammare with the King on the stand and half the Chamber behind him, and the newspapers count the guns for their readers: twelve, all of one calibre, all on the centreline, in a ship laid down before anybody else in Europe had drawn one. The naval attaches count them as well. The wire to Vienna goes out the same evening, and within the week the delegations at Pola will be asked for a credit they have twice refused."
 ita_dnc.306.a: "Let the launch be as loud as the newspapers want it."
 ita_dnc.306.b: "Keep the ceremony small and the figures out of the press."
 ITA_n_e306a_tt: "The country is told it has built the finest ship in Europe, and so is everybody else."
 ITA_n_e306b_tt: "The launch is a naval occasion rather than a national one, and Vienna is given a fortnight less to be alarmed in."
 ita_dnc.307.t: "Pola Lays Down Four"
 ita_dnc.307.d: "The Tegetthoff class: four ships, triple turrets, ordered together. The credit was voted by delegations that had refused a fleet twice before, and the slips at Trieste were cleared before the vote was taken. Vienna is formally an ally, the treaty has years left to run, and every officer in both navies knows the only water in which either fleet could reach the other. Rome can match the programme keel for keel, answer it with something cheaper that would still hurt, or say plainly and publicly that it will not race an ally."
 ita_dnc.307.a: "Keel for keel."
 ita_dnc.307.b: "Boats instead of battleships."
 ita_dnc.307.c: "Refuse the race, and say so at Vienna."
 ITA_n_e307a_tt: "The estimate is written four years forward and the Chamber is told what it will be voting for the next four years."
 ITA_n_e307b_tt: "Venice is given the money Castellammare wanted, and the ally's four battleships acquire a problem nobody at Pola has costed."
 ITA_n_e307c_tt: "The refusal is made in the proper form at the Ballhausplatz, and is believed there rather more than it is at home."
 ita_dnc.308.t: "The Yard Sells What the Fleet Will Not Buy"
 ita_dnc.308.d: "Ansaldo has a cruiser on the ways against an Argentine order and Orlando is quoting the Turks. The fitters are employed, the plate mills are running and the profit is entirely real. It is also the case that the best hull the Kingdom can build this year will fly somebody else's flag, and that one of the buyers is a power the fleet may eventually have to meet somewhere in the Mediterranean, in a ship it paid Genoa to build."
 ita_dnc.308.a: "Take the orders. A warm slip is worth more than a principle."
 ita_dnc.308.b: "Buy the hull out of the contract for the Regia Marina."
 ITA_n_e308a_tt: "The yards run full for three years, and the Navy List is the only navy list in Europe shorter than the order book that fed it."
 ITA_n_e308b_tt: "The contract is bought out at an embarrassing price, the buyer is compensated, and the Regia Marina gets the best ship in the yard for once."
 ita_dnc.309.t: "Calderara Rises From the Water"
 ita_dnc.309.d: "Lieutenant Calderara puts a float-fitted machine off the lagoon at Venice and stays up long enough to report the position of three boats the flotilla commander had lost. The naval staff had funded the experiment as a curiosity and a courtesy. The submarine officers, who spend their working lives unable to see anything at all, have understood the implications considerably faster than the gunnery branch has."
 ita_dnc.309.a: "Fund a naval air station on the lagoon."
 ita_dnc.309.b: "Spend the money on more boats instead."
 ITA_n_e309a_tt: "Venice gets sheds, a slipway and six machines, and the Regia Marina becomes the first navy in Europe to write aircraft into a fleet exercise."
 ITA_n_e309b_tt: "The machine is put away and two more boats are laid down, which is the answer the flotilla commanders asked for anyway."
 ITA_n_tt_vienna_confidence_set: "Vienna's confidence in Rome stands at §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_n_tt_cuniberti_hired: "Colonel Vittorio Cuniberti is given a drawing office and may be appointed as a naval theorist."
 ITA_n_tt_pullino_hired: "Giacinto Pullino may be appointed as a naval theorist; Cesare Laurenti will follow once the double hull is proved."
 ITA_n_tt_laurenti_hired: "Cesare Laurenti may be appointed as a naval theorist."
 ITA_n_tt_masdea_hired: "Edoardo Masdea may be appointed as a naval theorist."
 ITA_n_tt_masdea_draws_the_ring: "Edoardo Masdea takes the triple mounting to the proof range at Muggiano."
 ITA_n_tt_cuniberti_gone: "Colonel Cuniberti leaves the Kingdom's service with his drawings and may no longer be appointed."
 ITA_n_tt_vienna_down_3: "Vienna's confidence in Rome falls by §R3§!."
 ITA_n_tt_vienna_down_5: "Vienna's confidence in Rome falls by §R5§!."
 ITA_n_tt_vienna_down_8: "Vienna's confidence in Rome falls by §R8§!."
 ITA_n_tt_vienna_down_10: "Vienna's confidence in Rome falls by §R10§!."
 ITA_n_the_dante_threat: "The Dante Alighieri"
 ITA_n_the_adriatic_race_threat: "The Adriatic Race"
 ITA_n_the_cavour_threat: "The Cavour Programme"
 ITADNC_w_the_consulta: "The Consulta"
 ITADNC_w_the_consulta_desc: "The Palazzo della Consulta keeps the archives of a great power and the means of a middling one, and half our own despatch writers have never read the treaties. We must open the ministry's books and staff it with men who know what we have actually signed."
 ITADNC_w_the_renewal_of_the_alliance: "The Renewal of the Alliance"
 ITADNC_w_the_renewal_of_the_alliance_desc: "The Triple Alliance falls due and Berlin wants our hand on it before anyone thinks to ask the Chamber. We must sign: the text is defensive, it says nothing about Trento, and it buys quiet on the Alpine frontier and the good opinion of both courts."
 ITADNC_w_the_loyal_third: "The Loyal Third"
 ITADNC_w_the_loyal_third_desc: "We have sold the same neutrality twice and both courts suspect it. We must be the ally we say we are - the Third Army entrained for the Rhine, the staff conversations Vienna has asked for since Adwa - and let the irredentist press call it treason."
 ITADNC_w_prinettis_note_to_paris: "Prinetti's Note to Paris"
 ITADNC_w_prinettis_note_to_paris_desc: "Barrere wants an assurance and only a handful of men in Rome need ever know it was given. We must sign it - if France is attacked, Italy stays out - and buy the whole western frontier without a soldier, at the price of a treaty that is now a lie in a safe."
 ITADNC_w_the_notice_of_denunciation: "Notice of Denunciation"
 ITADNC_w_the_notice_of_denunciation_desc: "We cannot go on pretending to be bound to the power that holds Trento. We must give formal notice that the alliance will not be renewed, and then face Europe as a great power with no allies, no coal of our own and a very long coast."
 ITADNC_w_the_staff_talks_at_berlin: "The Staff Talks at Berlin"
 ITADNC_w_the_staff_talks_at_berlin_desc: "An alliance that has never fixed a timetable is a phrase, not a plan. We must send officers to Berlin to settle how many divisions cross the Alps, on which railways and by what day of mobilisation, and build the lines that carry them."
 ITADNC_w_the_double_book: "The Double Book"
 ITADNC_w_the_double_book_desc: "We tell Vienna what the treaty says and Paris what the note says, and each pays for a friend we have already promised elsewhere. We must keep both files and keep them apart, and run a cipher office good enough that neither capital reads the other's copy."
 ITADNC_w_trento_and_trieste: "Trento and Trieste"
 ITADNC_w_trento_and_trieste_desc: "The irredenta has been a subject for banquets for thirty years. We must state the claim properly - in the Chamber, in the schools, in our despatches - that the Trentino, Trieste and Istria are Italian land under a foreign crown, and prepare the army that will have to make it good."
 ITADNC_w_the_bargain_at_racconigi: "The Bargain at Racconigi"
 ITADNC_w_the_bargain_at_racconigi_desc: "The Tsar is coming to the King's shooting lodge and wants the Balkans left as they are. We must agree, favour no third power there, and take Petersburg's word on the Straits and Tripoli, knowing Vienna will hear of it within the month."
 ITADNC_w_the_albanian_shore: "The Albanian Shore"
 ITADNC_w_the_albanian_shore_desc: "The Otranto narrows are ours only while nobody else holds Valona, and Vienna is buying quays on the same coast out of the same kind of purse. We must open schools, buy wharves and pay the chiefs, and organise Albania before anyone else does."
 ITADNC_w_the_two_colonies: "The Two Colonies"
 ITADNC_w_the_two_colonies_desc: "Eritrea and the Benadir cost more than they return and are governed by whoever happens to be on the spot. We must survey them properly and put a road behind Massawa and a road behind Mogadishu before anybody proposes a third possession."
 ITADNC_w_buying_out_the_benadir_company: "Buying Out the Benadir Company"
 ITADNC_w_buying_out_the_benadir_company_desc: "The chartered company has run the Benadir on a subsidy and a scandal, and the inquiry found slaving in ports it administers in our name. We must buy the charter back and govern Somaliland directly, and hold the vote we would rather avoid."
 ITADNC_w_the_ascari_battalions: "The Ascari Battalions"
 ITADNC_w_the_ascari_battalions_desc: "The best infantry we have in Africa is Eritrean, and it marches further on less than a conscript from Basilicata. We must raise more of them and pay them what they are worth, because each battalion is one we need not ship out of Naples."
 ITADNC_w_the_treaty_with_menelik: "The Treaty with Menelik"
 ITADNC_w_the_treaty_with_menelik_desc: "Menelik destroyed a European army and is willing to be generous about it. We must fix the Eritrean boundary, open the caravan roads and join London and Paris in guaranteeing Ethiopia whole, and tell our own army the account is closed."
 ITADNC_w_the_march_back_to_adwa: "The March Back to Adwa"
 ITADNC_w_the_march_back_to_adwa_desc: "The army has not forgiven Adwa and neither has the country, and everything that destroyed Baratieri is still there. We must build the road up from Massawa, train the columns for the highlands, and go back knowing London guarantees the borders we intend to cross."
 ITADNC_w_the_tripoli_question: "The Tripoli Question"
 ITADNC_w_the_tripoli_question_desc: "The last piece of Africa nobody has taken lies across the water from Sicily, held by a few Ottoman battalions and no money. We must open the file and put the claim on record, because every chancellery has already conceded it is ours when we want it."
 ITADNC_w_the_ultimatum_to_the_porte: "The Ultimatum to the Porte"
 ITADNC_w_the_ultimatum_to_the_porte_desc: "The fleet is coaled and the transports lie at Naples. We must send the Porte a note it cannot accept, give it a day to answer, and take this kingdom into war with the Ottoman Empire without asking the Chamber first."
 ITADNC_w_the_banco_di_roma_instead: "The Banco di Roma Instead"
 ITADNC_w_the_banco_di_roma_instead_desc: "Our bank already holds the mills, the quays and half the debts in Tripoli. We must buy the province instead of storming it - more branches, more credit to the notables, an understanding with the Porte - and take the nationalist press shouting at us for it."
 ITADNC_w_the_islands_as_a_pledge: "The Islands as a Pledge"
 ITADNC_w_the_islands_as_a_pledge_desc: "The Ottoman garrison in Libya is supplied through the Aegean. We must take Rhodes and the islands as a pledge to be handed back when Constantinople signs, and let everyone understand what a pledge becomes when it is held long enough."
 ITADNC_w_the_peace_of_ouchy: "The Peace of Ouchy"
 ITADNC_w_the_peace_of_ouchy_desc: "The Porte will withdraw its officers and grant the provinces autonomy if we agree to call that a transfer. We must sign at Ouchy and take the coast onto our own register, knowing the Sultan keeps a religious title over men who will go on shooting at us."
 ITADNC_w_the_war_that_does_not_end: "The War That Does Not End"
 ITADNC_w_the_war_that_does_not_end_desc: "We took the coast in a fortnight and we have not taken the interior at all. We must keep paying for it - more columns, more supply, more men promised a parade - while the Senussi hold the wells and the caravan roads."
 ITADNC_w_the_fourth_shore: "The Fourth Shore"
 ITADNC_w_the_fourth_shore_desc: "If Libya is to be worth the graves it must take the emigrants who now go to Brooklyn and Buenos Aires. We must sink the wells, drive the coast road and open land offices to any family out of the South, and write the coast into the kingdom as our own soil."
 ITA_w_the_consulta: "The Consulta"
 ITA_w_the_consulta_desc: "The foreign ministry has been given its own budget line, its own cipher room and, for the first time in a decade, an instruction to keep records of what was promised to whom."
 ITA_w_the_third_partner: "The Loyal Third"
 ITA_w_the_third_partner_desc: "Rome means the treaty it signed. Two general staffs plan with ours, and one third of the Chamber regards the ministry as the caretaker of Austrian rule over Italians."
 ITA_w_the_note_of_1902: "The Note in the Safe"
 ITA_w_the_note_of_1902_desc: "France will not be fought, and the divisions that watched the Alpine passes can watch something else. Four men know why, and one of them is a foreign ambassador."
 ITA_w_the_double_book: "The Double Book"
 ITA_w_the_double_book_desc: "Both camps believe they have bought us and both go on paying. The Consulta has never been so well informed, so well courted, or so completely dependent on nobody in Paris talking."
 ITA_w_the_broken_word: "The Broken Word"
 ITA_w_the_broken_word_desc: "It is now on the record in three languages that Italy signs what it does not mean. Every future undertaking will be read as provisional, and priced accordingly."
 ITA_w_free_hands: "Free Hands"
 ITA_w_free_hands_desc: "No ally, no obligation, no timetable written in someone else's capital. Also no one under any duty to come when the coast is shelled."
 ITA_w_the_albanian_stake: "The Albanian Stake"
 ITA_w_the_albanian_stake_desc: "Coaling rights at Valona, schools in the hinterland and a subsidy to the chiefs. The Adriatic is a corridor, and Rome now holds one hinge of the door."
 ITA_w_the_ascari: "The Ascari Battalions"
 ITA_w_the_ascari_desc: "Eritrean regulars under Italian officers, acclimatised, cheaper to keep than a metropolitan division, and the only troops we have who have never lost a colonial campaign."
 ITA_w_the_tripartite_understanding: "The Tripartite Understanding"
 ITA_w_the_tripartite_understanding_desc: "Rome, London and Paris guarantee Ethiopia's integrity and divide its trade. The caravan roads to Massawa are open and the border is a line rather than a grievance."
 ITA_w_the_second_expedition: "The Second Expedition"
 ITA_w_the_second_expedition_desc: "The army is going back to the highlands to settle Adwa. Every cartridge fired there arrives by mule, over a mountain, in a column that has to be escorted."
 ITA_w_the_banco_di_roma: "The Banco di Roma"
 ITA_w_the_banco_di_roma_desc: "Italian credit does the work an Italian corps would otherwise be asked to do. It is slower, it is far cheaper, and it wins no man a decoration."
 ITA_w_the_desert_that_does_not_end: "The Desert That Does Not End"
 ITA_w_the_desert_that_does_not_end_desc: "The coast is administered and the interior is not. The columns learn desert war the only way it is learned, and the casualty lists arrive in a country that was told the war ended."
 ITA_w_the_fourth_shore: "The Fourth Shore"
 ITA_w_the_fourth_shore_desc: "Land offices at Tripoli and Benghazi, wells, a coast road, and families out of Calabria on the first sailings. Emigration that leaves under our own flag."
 ITA_w_vienna_trust_tt: "Confidence of Vienna in Rome: §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_w_note_sealed_tt: "The note stays in the safe. It cannot be traded on, and it cannot be found."
 ITA_w_note_talked_about_tt: "The note is spoken of in Paris drawing rooms. What is spoken of in Paris is printed in Vienna."
 ITA_w_tripoli_opened_tt: "The Tripoli file is open at the Consulta. The decision to use it, or not to, is taken here."
 ITA_w_ouchy_tt: "Tripolitania, Cyrenaica and the Libyan coast pass to the Kingdom of Italy, and the war with the Porte is ended."
 ITA_w_ultimatum_extended_tt: "The ultimatum is extended. The wargoal stands, the transports stay at Naples, and the Chamber is told nothing."
 ITA_w_restraint_tt: "The columns are held to their orders. The ministry pays for it in the Roman press for a month."
 ITA_w_expedition_halted_tt: "The expedition is halted at the escarpment. The claim on Ethiopia stands on paper and nowhere else."
 ITA_w_threat_the_irredenta: "Italy claims Trento and Trieste"
 ITA_w_threat_the_second_expedition: "Italy prepares a second Ethiopian expedition"
 ITA_w_threat_the_ultimatum: "Italy threatens the Ottoman provinces in Africa"
 ITA_w_threat_the_chamber_cheers: "Rome renounces the Triple Alliance"
 ITA_w_threat_the_libyan_war: "Italy invades Ottoman Libya"
 ITA_w_threat_the_aegean: "Italy occupies the Aegean islands"
 ITA_w_threat_the_reprisals: "Reprisals in the Tripoli oases"
 ITA_w_threat_valona: "Italy stakes a claim to Valona"
 ITA_w_the_cipher_room: "The Cipher Room"
 ITA_w_the_military_convention_bonus: "The Military Convention"
 ITA_w_the_third_army_rides: "The Third Army Timetable"
 ITA_w_the_rhine_timetable: "The Rhine Timetable"
 ITA_w_the_black_cabinet: "The Reading of Despatches"
 ITA_w_the_balkan_desks: "The Balkan Desks"
 ITA_w_the_otranto_survey: "The Otranto Survey"
 ITA_w_the_colonial_office_bonus: "The Colonial Office"
 ITA_w_the_benadir_survey: "The Benadir Survey"
 ITA_w_the_colonial_battalions: "The Colonial Battalions"
 ITA_w_the_libyan_survey: "The Libyan Survey"
 ITA_w_the_column_and_the_well: "The Column and the Well"
 ita_dnc.500.t: "The Chancelleries Take Our Measure"
 ita_dnc.500.d: "The ministry's own summary is not flattering. Berlin regards us as a road to the Rhine that may or may not be open. Vienna regards us as the ally that will one day ask for Trento and would rather we asked before the Emperor dies. Paris regards us as purchasable. London regards us as a customer with a long coast and no coal.\n\nThe King is thirty. He reads all four estimates and does not disagree with any of them."
 ita_dnc.500.a: "Then let them price us correctly."
 ita_dnc.501.t: "The Note is Signed"
 ita_dnc.501.d: "The paper is two paragraphs long. If France is the object of direct or indirect aggression, Italy will maintain a strict neutrality; and Italy will do nothing in North Africa that France would resent. Barrere folds it and puts it in the embassy bag.\n\nThe treaty renewed at Berlin says something else entirely. Both documents are now valid, both are signed by the same government, and the question before the ministry is simply how many people are to know."
 ita_dnc.501.a: "The King, the minister, and the safe."
 ita_dnc.501.b: "Let Paris be pleased with us aloud."
 ita_dnc.502.t: "The Second Book Is Printed Abroad"
 ita_dnc.502.d: "A deputy in the French Chamber, defending a colonial estimate, says rather more than he needed to about Italian goodwill in the Mediterranean. The sentence is reprinted in Vienna within four days, with the parts about the alliance set in heavier type.\n\nThe Ballhausplatz asks our ambassador, very politely, whether the Kingdom has undertakings towards France that its allies have not seen."
 ita_dnc.502.a: "There is no such undertaking. Say so."
 ita_dnc.502.b: "Admit the note and call it insurance."
 ita_dnc.503.t: "The Notice at the Ballhausplatz"
 ita_dnc.503.d: "Our ambassador reads the declaration standing, because he has been asked to make it formal. The alliance will lapse and will not be renewed. The Kingdom remains, of course, the friend of both empires.\n\nNobody in the room pretends to believe the last sentence. The question at home is what tone Rome takes on the morning the newspapers have it."
 ita_dnc.503.a: "A correct despatch and no demonstrations."
 ita_dnc.503.b: "Let the Chamber say what the country thinks."
 ita_dnc.504.t: "An Envoy from Addis Ababa"
 ita_dnc.504.d: "The Emperor's envoy is received at the Quirinal with the honours due to a sovereign who beat us, which is to say generously. He brings the boundary maps, an offer on the caravan road to Massawa, and a message that the Emperor considers the war of 1896 concluded.\n\nHe also mentions, without emphasis, that Ethiopia is buying rifles from four countries and would prefer to buy them from three."
 ita_dnc.504.a: "Sign the boundary and open the road."
 ita_dnc.504.b: "Sign, and ask for the customs at the frontier."
 ita_dnc.505.t: "The Ultimatum Expires"
 ita_dnc.505.d: "The Porte's reply arrives before the hour is out. It offers everything short of the occupation: guarantees for Italian enterprise, indemnities, a commission. It is a better answer than we expected and it is not the answer the ultimatum was written to receive.\n\nThe transports are loaded. The Chamber is in recess. The word rests with the ministry and nobody else."
 ita_dnc.505.a: "The fleet sails for Tripoli."
 ita_dnc.505.b: "Extend the term by a week."
 ita_dnc.506.t: "Twelve Islands"
 ita_dnc.506.d: "The landings are almost unopposed. Rhodes takes an afternoon, and the smaller islands send out their notables to meet the boats. The Greek inhabitants greet the marines as liberators and immediately ask when the union with Athens will be proclaimed.\n\nThe fleet reports that the Aegean supply route to Libya is closed. The Consulta reports that London has asked a question about the islands rather sooner than expected."
 ita_dnc.506.a: "A pledge, held until the Porte signs."
 ita_dnc.506.b: "The islands were Roman before they were Ottoman."
 ita_dnc.507.t: "The Oasis Outside Tripoli"
 ita_dnc.507.d: "A battalion holding the palm gardens east of the city is taken from behind by men who were counted as townspeople the day before. The survivors come back into Tripoli with a story that spreads through the whole force before evening.\n\nThe general commanding asks for a free hand in the oasis. The correspondents of four countries are quartered a mile away, and they can already smell the smoke."
 ita_dnc.507.a: "Give him his free hand."
 ita_dnc.507.b: "Hold the columns to their orders."
 ita_dnc.508.t: "The Staff Reads the Map Again"
 ita_dnc.508.d: "The operations section has prepared the estimate it prepared in 1895, with better figures. Massawa to the escarpment by mule. Water at four points, all of them known to the enemy. Sixty thousand rifles in the Emperor's hands, and a supply column that must be escorted by a third of the force it feeds.\n\nOne officer notes at the bottom that the last army to attempt this was a good army."
 ita_dnc.508.a: "This time we go with enough of everything."
 ita_dnc.508.b: "Halt at the escarpment. The claim can wait."
 ita_dnc.509.t: "The Adriatic Question Has No Second Claimant"
 ita_dnc.509.d: "The Austrian ambassador is amiable and entirely direct. Both courts are paying the same Albanian chiefs, opening rival schools in the same towns and surveying the same anchorage. He proposes that they stop, and that both powers undertake to keep Albania independent of each other.\n\nHe does not say what happens if Rome declines. He does not really need to."
 ita_dnc.509.a: "An understanding. Neither of us takes it."
 ita_dnc.509.b: "Valona commands the Adriatic. Say nothing."
 ITA_the_non_expedit: "The Non Expedit"
 ITA_the_non_expedit_desc: "The Holy See has held since 1874 that it is not expedient for a Catholic to vote in the elections of a state that took Rome from the Pope, and a third of the electorate obeys. The Chamber is therefore quieter than the country, the ministry is spared an opposition it would not know how to answer, and the day a bishop decides the rule may be read loosely, ninety seats change hands without a single voter changing his mind."
 ITA_the_emigrant_ledger: "The Emigrant Ledger"
 ITA_the_emigrant_ledger_desc: "Six hundred thousand leave every year and the money they post home closes the trade deficit of a great power. The other column is the one nobody prints: they are of military age, the villages they left are being counted for the conscription class of 1920 by a clerk who keeps finding nobody at the address, and the ledger balances because the country is being drained to balance it."
 ITA_the_southern_ledger: "The Southern Ledger"
 ITA_the_southern_ledger_desc: "Most of the provinces below Naples have no water, no metalled road and no school, and the Kingdom has never once admitted in statute that this is a different problem rather than a poorer version of the North. Everything built there is built twice as slowly and costs twice as much, and the account is carried forward every year in the hope that the next ministry will look at it."
 ITA_the_british_leash: "The British Leash"
 ITA_the_british_leash_desc: "Eighty-eight tons in every hundred are cut in Wales, and every wheel that turns in Milan turns because a collier unloaded at Genoa. The Triple Alliance is renewed on paper every few years; the coal contract is renewed every winter, and the Consulta knows which of the two would actually stop the mills."
 ITA_the_prefect_machine: "The Prefect Machine"
 ITA_the_prefect_machine_desc: "Ninety constituencies, ninety prefects, and a book in Rome recording which mayor is to be sustained and which list is to go astray in the post. The bridges get built and the estimates get voted. The book is the difficulty: it exists, it is written down, and somebody is always counting."
 ITA_the_mezzogiorno_account: "The Mezzogiorno Account"
 ITA_the_mezzogiorno_account_desc: "What has been promised to the South and what has actually been laid in the ground are two different figures, and the second follows the first by about an eighth of the gap a year. Aqueducts take longer than ministries do."
 ITA_the_empty_bunkers: "The Bunkers Are Empty"
 ITA_the_empty_bunkers_desc: "Under three months on the quay at Genoa. The mills bank their furnaces because banking is cheaper than stopping, and the yards follow within the fortnight."
 ITA_the_prefect_ledger: "The Prefect Ledger"
 ITA_the_prefect_ledger_desc: "Outside the three industrial cities the state is one man in a sash per province, and he decides what the returns say. A strong machine hands a ministry a Chamber that does as it is told and a Chamber that will not survive one bad harvest. It also means the men it shuts out have nowhere left to go except the party you have already outlawed in your head.\n\nPrefects: §Y[?ITA_prefects|0]§! of 100. Electorate: §Y[?ITA_electorate|0]§! hundred thousand."
 ITA_the_special_laws: "The Special Laws for the South"
 ITA_the_special_laws_desc: "Cheap power, a tariff exemption on raw materials, a state guarantee and a schedule of public works written into statute. It is the only industrial policy the kingdom has ever addressed to the South, it is charged to the Northern estimates, and it will be another decade before anybody can point at a road and say that this is what it bought."
 ITA_liberal_left: "Liberal Left"
 ITA_liberal_left_long: "The Liberal Left of Giovanni Giolitti"
 ITA_constitutional_right: "Constitutional Right"
 ITA_constitutional_right_long: "The Constitutional Right and the Statuto"
 ITA_popular_bloc: "Popular Bloc"
 ITA_popular_bloc_long: "The Popular Bloc of the Extreme Left"
 ITA_vittorio_cuniberti: "Vittorio Cuniberti"
 ITA_vittorio_cuniberti_desc: "Colonel of the Genio Navale. He drew the all-big-gun ship in 1902 and has spent every year since explaining, to committees, why the small guns are the part that has to go."
 ITA_edoardo_masdea: "Edoardo Masdea"
 ITA_edoardo_masdea_desc: "Chief constructor of the Regia Marina. He put three barrels on one turntable before anyone else dared, having done the sums twice and asked to do them again."
 ITA_giacinto_pullino: "Giacinto Pullino"
 ITA_giacinto_pullino_desc: "Builder of the Glauco boats at the Venice arsenal. Small, wet, reliable enough that the crews volunteer twice, and intended for the Adriatic and nowhere else."
 ITA_cesare_laurenti: "Cesare Laurenti"
 ITA_cesare_laurenti_desc: "The double hull that becomes the Foca and then the Medusa class, which is the design the rest of Europe eventually buys."
 ITA_tb_naval_estimates: "The Naval Estimates"
 ITA_tb_the_maremma_pits: "The Maremma Pits"
 ITA_tb_the_estimate: "The Estimate of 1900"
 ITA_tb_all_big_gun: "The All-Big-Gun Ship"
 ITA_tb_the_design_office: "The Design Office"
 ITA_tb_the_cruiser_yard: "The Cruiser Yard"
 ITA_tb_the_building_ways: "The Building Ways"
 ITA_tb_cemented_plate: "Cemented Plate"
 ITA_tb_sheffield_plate: "Sheffield Plate"
 ITA_tb_the_dante: "The Dante Alighieri"
 ITA_tb_the_ring_holds: "The Triple Turret"
