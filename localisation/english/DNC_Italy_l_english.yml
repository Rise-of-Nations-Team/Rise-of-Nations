 ITA_gaetano_chierchia: "Gaetano Chierchia"
 ITA_francesco_guicciardini: "Francesco Guicciardini"
 ITA_severino_casana: "Severino Casana"
 ITA_pietro_carmine: "Pietro Carmine"
 ITA_giulio_rubini: "Giulio Rubini"
 ITA_ernesto_di_broglio: "Ernesto Di Broglio"
 ITA_angelo_majorana_calatabiano: "Angelo Majorana Calatabiano"
 ITA_pietro_lacava: "Pietro Lacava"
 ITA_nicola_balenzano: "Nicola Balenzano"
 ITA_francesco_tedesco: "Francesco Tedesco"
 ITA_emanuele_gianturco: "Emanuele Gianturco"
 ITA_pietro_bertolini: "Pietro Bertolini"
 ITA_guido_baccelli: "Guido Baccelli"
 ITA_nunzio_nasi: "Nunzio Nasi"
 ITA_luigi_rava: "Luigi Rava"
 ITA_giuseppe_marcora: "Giuseppe Marcora"
 ITA_antonio_starabba_di_rudini: "Antonio Starabba di Rudinì"
 ITA_edoardo_pantano: "Edoardo Pantano"
 ITA_enrico_ferri: "Enrico Ferri"
 ITA_andrea_costa: "Andrea Costa"
 ITA_claudio_treves: "Claudio Treves"
 ITA_giovanni_grosoli: "Giovanni Grosoli Pironi"
 ITA_luigi_sturzo: "Luigi Sturzo"
 ITA_domenico_bonamico: "Domenico Bonamico"
 ITA_enrico_barone: "Enrico Barone"
 ITA_giuseppe_salvago_raggi: "Giuseppe Salvago Raggi"
 ITA_tommaso_of_savoy_genoa: "Tommaso, Duke of Genoa"
 ITA_guglielmo_marconi: "Guglielmo Marconi"
 ITA_luigi_pelloux_desc: "When the Chamber would not yield, this general governed by decree. To him the army is still the safest pair of hands in the kingdom."
 ITA_giovanni_giolitti_desc: "A Piedmontese civil servant who counts votes the way other men count troops. In his view the state need not fire on a strike to end it."
 ITA_sidney_sonnino_desc: "The stern leader of the constitutional Right, and the man who balanced the budget once. He tells the Crown to keep to the letter of the Statuto, the kingdom's constitution."
 ITA_luigi_luzzatti_desc: "Economist of the people's banks, and a preacher of thrift and cheap credit. Every new tax he takes as a personal defeat."
 ITA_antonio_salandra_desc: "An Apulian professor of administrative law, and a landowner of the Right. He wants a strong government and a Chamber that knows its place."
 ITA_paolo_boselli_desc: "Ligurian elder of the Treasury benches, and patron of the Dante Alighieri society. His cause is patriotism taught in every schoolroom."
 ITA_vittorio_emanuele_orlando_desc: "A Sicilian jurist of public law. By day he writes on the theory of the state, by night he bargains for his island's votes."
 ITA_francesco_saverio_nitti_desc: "The young Neapolitan economist who has measured what the South pays and what it receives. For the South he wants water and power, not sermons."
 ITA_ivanoe_bonomi_desc: "The reformist of Mantua, who writes that socialism must come by the ballot box and the cooperative. The rest of the Left hates him for it."
 ITA_luigi_facta_desc: "The patient deputy of Pinerolo, who votes with Giolitti every time. He knows the files of the Interior better than the men who sign them."
 ITA_constantino_lazzari_desc: "The hard man of the Milanese workers, who will not shake a minister's hand. The old socialist faith is to be kept free of compromise."
 ITA_benito_mussolini_desc: "A blacksmith's son from the Romagna, a schoolteacher turned agitator. In every café he can find, at home and in exile, he preaches revolution."
 ITA_tommaso_tittoni_desc: "A Roman landowner and prefect. He keeps the Triple Alliance in good repair and his French contacts warm, and lets neither side see the other."
 ITA_edoardo_daneo_desc: "A Turin lawyer who would take the village school off the poorest communes, and have the state pay for it instead."
 ITA_paolo_carcano_desc: "A Lombard financier of the Left, who cuts the duties on bread and salt. Even so, he expects the budget to close every year."
 ITA_carlo_porro_desc: "A geographer of the frontier, who knows every pass from the Col di Tenda to the Isonzo. Young officers learn from him to read the ground."
 ITA_paolo_spingardi_desc: "The administrator of the war office and commander of the Carabinieri. He counts rifles, horses and wagons before he counts divisions."
 ITA_maurizio_moris_desc: "An engineer officer of the specialist brigade, who sends balloons up over the manoeuvres. He wants an airship that answers its helm."
 ITA_alberto_pollio_desc: "The scholar general who wrote the history of Custoza and of Waterloo. An alliance, he holds, is worth no more than the plans drawn with it."
 ITA_guglielmo_pecori_giraldi_desc: "A Florentine officer of the ascari, our colonial troops. In Eritrea he learned that they fight best under men who keep their word."
 ITA_paolo_thaon_di_revel_high_command_desc: "The Piedmontese naval officer who trains the cadets at the academy of Livorno. Every captain he sends out is to be ready for the narrow Adriatic."
 ITA_giuseppe_ettore_vigano_desc: "The staff general of the Military Geographic Institute. He maps the kingdom he is asked to defend, and supplies the army that holds it."
 ITA_mario_calderara_desc: "The naval lieutenant who learned to fly from the Wright brothers themselves. The fleet, he says, should see beyond its own horizon."
 ITA_enrico_costantino_morin_desc: "The Genoese vice admiral who runs the ministry of marine like a flagship. At a pinch he has held the war office and the Consulta, the foreign ministry, as well."
 ITA_gaetano_chierchia_desc: "An admiral who once sailed round the world charting currents for science. Now he charts the movements of the fleet for the staff."
 ITA_coriolano_ponza_di_san_martino_desc: "A Piedmontese general at the war office. He wants the chief of staff obeyed in peace as he would be in war."
 ITA_luigi_majnoni_d_intignano_desc: "The Lombard cavalryman given the Alpini, the mountain troops. Their companies are to be fed, shod and on skis before the snow closes the passes."
 ITA_francesco_guicciardini_desc: "A Tuscan count of the Right, and a scholar of farming. Sonnino calls him to the Consulta, the foreign ministry, whenever he needs a steady hand."
 ITA_severino_casana_desc: "An engineer and former mayor of Turin, and the first civilian at the war office. He reads the army's accounts the way a builder reads plans."
 ITA_pietro_carmine_desc: "The Lombard minister of finance, a careful man of the Right. He guards the duty on flour as other men guard the frontier."
 ITA_giulio_rubini_desc: "A Lombard deputy who holds the Treasury for a season. He is wary of loans, and warier still of ministers who promise public works with no revenue to pay for them."
 ITA_ernesto_di_broglio_desc: "The modest deputy of the Right who keeps the Treasury for Zanardelli. Tax relief on land and salt must wait, he says, until the budget can bear it."
 ITA_angelo_majorana_calatabiano_desc: "The Sicilian professor of constitutional law who helps convert the national debt to a lower rate of interest. He calls it the kingdom's quiet victory."
 ITA_pietro_lacava_desc: "Deputy of Basilicata, now at public works. A lifetime has gone in asking Rome for roads, bridges and water for the poorest province."
 ITA_nicola_balenzano_desc: "An Apulian lawyer at public works. He wants the southern railway lines finished, and the rolling stock that runs on them built at home."
 ITA_francesco_tedesco_desc: "The minister who takes the railways off the private companies. The kingdom is handed one network, one timetable and one set of debts."
 ITA_emanuele_gianturco_desc: "The Neapolitan jurist of the civil code, and a musician in his youth. He brings a scholar's patience to the public works of the South."
 ITA_pietro_bertolini_desc: "The Venetian administrator who drafts the laws for rebuilding Messina and Reggio. The work goes on stone by stone and lira by lira."
 ITA_guido_baccelli_desc: "The great Roman physician, who teaches his students at the bedside and has cleared the old Forum. He runs public instruction with a doctor's certainty."
 ITA_nunzio_nasi_desc: "The Sicilian minister of the schools, adored at home and pursued in Rome. His expense accounts will one day be read aloud in the Senate."
 ITA_luigi_rava_desc: "A Romagnol minister who has put the pinewoods of Ravenna under the protection of the law. The country schools, he says, should teach farming as well as letters."
 ITA_giuseppe_marcora_desc: "The old Garibaldian of the Radicals, now President of the Chamber. He rings his bell at the Right and the Left alike."
 ITA_antonio_starabba_di_rudini_desc: "The Sicilian marquis who has twice led the government. Now he leads the grandees of the Right against every combination Giolitti puts together."
 ITA_edoardo_pantano_desc: "The Sicilian of the Extreme Left who joins a ministry at last, and takes agriculture. His promise to the peasant is credit instead of charity."
 ITA_enrico_ferri_desc: "The criminologist who edits the party paper and teaches that society makes its own criminals. He can hold a crowd for hours on the subject."
 ITA_andrea_costa_desc: "A Romagnol who began in the International, and the first socialist ever elected to the Chamber. He is now one of its vice-presidents."
 ITA_claudio_treves_desc: "The reformist journalist at Turati's side, and a sharp pen. Reform, he writes, is harder work than revolution."
 ITA_giovanni_grosoli_desc: "The Catholic count of Ferrara, at the head of the Opera dei Congressi, the Catholic lay association. He is building a press and a bank for people the state ignores."
 ITA_luigi_sturzo_desc: "The Sicilian priest who runs the town of Caltagirone. Catholics should be in the communes, he says, long before they are allowed to sit in the Chamber."
 ITA_domenico_bonamico_desc: "The naval officer who argued in print that the kingdom's frontier is its coastline. The fleet, he says, must be built to hold it."
 ITA_enrico_barone_desc: "A colonel who teaches military history at the War School, and economics to anyone who will listen. He treats both as problems of supply."
 ITA_giuseppe_salvago_raggi_desc: "A Genoese marquis who held the legation at Peking through the siege of the Boxers. Wherever the kingdom needs a cool head among foreigners, he is sent."
 ITA_guglielmo_marconi_desc: "The young Bolognese who sent a signal across the ocean without a wire. The navy wants him home before its ships sail out of each other's hearing."
 ITA_carlo_caneva_desc: "A general from Udine, who began as an artillery officer and held the fort at Kassala against the Mahdists. He now stands second at the head of the general staff."
 ITA_francesco_cocco_ortu: "Francesco Cocco-Ortu"
 ITA_giuseppe_palumbo: "Giuseppe Palumbo"
 ITA_enrico_gualterio: "Enrico Gualterio"
 ITA_giovanni_sechi: "Giovanni Sechi"
 ITA_ottavio_ricaldoni: "Ottavio Ricaldoni"
 ITA_almerico_da_schio: "Almerico da Schio"
 ITA_francesco_siacci: "Francesco Siacci"
 ITA_giuseppe_perrucchetti: "Giuseppe Perrucchetti"
 ITA_ottavio_ragni: "Ottavio Ragni"
 ITA_ottavio_briccola: "Ottavio Briccola"
 ITA_gaetano_crocco_air_chief: "Gaetano Crocco"
 ITA_prince_luigi_amedeo_high_command: "Luigi Amedeo, Duke of the Abruzzi"
 ITA_arm_pollio_the_historian: "Alberto Pollio"
 ITA_arm_pedotti_at_the_alpini: "Ettore Pedotti"
 ITA_w_cagni_the_landing_party: "Umberto Cagni"
 ITA_air_ricaldoni_the_aviation_section: "Ottavio Ricaldoni"
 ITA_air_douhet_the_aviators_battalion: "Giulio Douhet"
 ITA_n_bettolo_chief_of_the_naval_staff: "Giovanni Bettolo"
 ITA_n_thaon_di_revel_chief_of_the_naval_staff: "Paolo Thaon di Revel"
 ITA_e_spingardi_at_the_war_office: "Paolo Spingardi"
 ITA_w_bertolini_at_the_colonies: "Pietro Bertolini"
 ITA_w_salvago_raggi_governor_of_eritrea: "Giuseppe Salvago Raggi"
 ITA_e_tedesco_at_the_treasury: "Francesco Tedesco"
 ITA_francesco_cocco_ortu_desc: "The Sardinian lawyer of the constitutional Left, who put his name to the divorce bill with Zanardelli. He wants inspectors of labour sent into the mills."
 ITA_giuseppe_palumbo_desc: "The admiral who took the Vettor Pisani round the world and held the ministry of the navy under Pelloux. He now commands the squadron of the Middle Sea."
 ITA_giovanni_sechi_desc: "A Sardinian officer who teaches at the academy of Livorno. The navy, he writes, must learn strategy and not only the tactics of the day of battle."
 ITA_ottavio_ricaldoni_desc: "An engineer officer, born in Montevideo, who draws the semi-rigid airship with Crocco. He wants it flown from Lake Bracciano to Rome."
 ITA_almerico_da_schio_desc: "The old count of Vicenza, who has studied the weather all his life. With his own money he is building an airship, and has named it Italia."
 ITA_francesco_siacci_desc: "The Roman colonel of artillery who left the batteries for the chair of mechanics at Naples. Every battery uses his firing tables, though few gunners can follow the mathematics behind them."
 ITA_giuseppe_perrucchetti_desc: "The officer who first proposed that mountain men should guard their own valleys. The frontier, he still writes, is held from the passes."
 ITA_gaetano_crocco_desc: "A Neapolitan engineer lieutenant of the specialist brigade. He wants the airship steered like a ship and built like a bridge."
 ITA_gaetano_crocco_air_chief_desc: "The engineer who flew the first airship over Rome. The airship section is given to him, with its crews and its sheds on the lake."
 ITA_giuseppe_zanardelli_desc: "The old lawyer of Brescia who wrote the penal code and leads the constitutional Left. He holds that the Statuto, the kingdom's constitution, belongs to the Chamber as much as to the King."
 ITA_errico_malatesta_desc: "The anarchist from Campania, who edits his papers from exile in London. He waits for the day the Italian workers need neither party nor king."
 ITA_prince_luigi_amedeo_high_command_desc: "The royal explorer of the pole and the Ruwenzori. He takes the inspectorate of torpedo boats and trains their crews to attack at night."
 ITA_arm_pollio_the_historian_desc: "The general who wrote the histories of Custoza and of Waterloo. His lectures to the staff are on why armies are beaten before the first shot is fired."
 ITA_arm_pedotti_at_the_alpini_desc: "The old volunteer of the Alpine Hunters, once minister of war. He takes command of the mountain troops and keeps their companies at work all winter."
 ITA_w_cagni_the_landing_party_desc: "A polar explorer who lands at Tripoli with the sailors of the fleet. He holds the town until the army comes ashore."
 ITA_air_ricaldoni_the_aviation_section_desc: "An engineer captain who commands the aviation section of the specialist battalion. He turns volunteers into pilots, one broken machine at a time."
 ITA_air_douhet_the_aviators_battalion_desc: "A staff officer who cannot fly, given the aviators battalion. He buys every machine he can find."
 ITA_n_bettolo_chief_of_the_naval_staff_desc: "The Genoese admiral and deputy, a veteran of Lissa, who now heads the new naval staff. His argument is for the big guns of the dreadnoughts."
 ITA_n_thaon_di_revel_chief_of_the_naval_staff_desc: "A Piedmontese admiral who takes the naval staff. The Adriatic, he holds, will be won by flotillas, mines and patience."
 ITA_e_spingardi_at_the_war_office_desc: "The former commander of the Carabinieri, now minister of war. He spends the extraordinary estimates on guns, horses and aeroplanes."
 ITA_w_bertolini_at_the_colonies_desc: "The Venetian jurist who becomes the first minister of the colonies. He writes the ordinances for the provinces beyond the sea."
 ITA_w_salvago_raggi_governor_of_eritrea_desc: "The marquis of the Peking legation, now governing Eritrea from Asmara. He is carrying the railway up from the sea."
 ITA_e_tedesco_at_the_treasury_desc: "The minister of public works, moved across to the Treasury. The lira is kept at par while the war estimates grow."
 ITA_arm_pollio_takes_the_staff_tt: "Alberto Pollio gains a skill level and a point of planning, and may be appointed chief of the army."
 ITA_arm_pollio_the_historian_tt: "Alberto Pollio lectures on the old campaigns and may be appointed as a theorist."
 ITA_arm_brusati_takes_the_first_corps_tt: "Roberto Brusati takes the army corps at Turin. He gains a corps command, or a skill level with a point of attack and a point of defence."
 ITA_arm_aosta_named_for_an_army_tt: "The Duke of Aosta is named to command an army in war and becomes a field marshal."
 ITA_arm_turin_rides_ahead_tt: "The Count of Turin takes the new fast formations. He gains a corps command, or a skill level and a point of attack."
 ITA_arm_pedotti_commands_the_alpini_tt: "Ettore Pedotti takes command of the Alpine troops and may be appointed to the high command."
 ITA_air_ricaldoni_takes_the_section_tt: "Ottavio Ricaldoni takes the aviation section and may be appointed chief of the air service."
 ITA_air_douhet_takes_the_aviators_tt: "Giulio Douhet is given the aviators battalion and may be appointed chief of the air service."
 ITA_n_tt_bettolo_heads_the_staff: "Giovanni Bettolo heads the naval staff and gains a skill level. Francesco Grenet takes the fleet to sea and gains a skill level and a point of coordination."
 ITA_n_tt_revel_holds_the_narrow_sea: "Paolo Thaon di Revel may be appointed chief of the naval staff."
 ITA_e_tt_spingardi_at_the_war_office: "Paolo Spingardi goes to the war office and may be appointed as a political advisor."
 ITA_e_tt_tedesco_at_the_treasury: "Francesco Tedesco moves from public works to the Treasury, and may be appointed there as a political advisor."
 ITA_w_tt_salvago_raggi_governs_eritrea: "Giuseppe Salvago Raggi goes to Asmara as governor of Eritrea and may be appointed as a political advisor. Ferdinando Martini leaves the list of advisors."
 ITA_w_tt_ameglio_lands_on_rhodes: "Giovanni Ameglio takes Rhodes from the sea. He gains a corps command, or a skill level, a point of attack and the Invader trait."
 ITA_w_tt_the_libyan_promotions: "Diaz, Giardino, Capello, Pecori Giraldi, Ragni and Briccola each take a corps command or gain a skill level. Cagni, Thaon di Revel and the Duke of the Abruzzi gain a skill level."
 ITA_w_tt_salsa_holds_the_interior: "Tommaso Salsa carries the columns into the interior. He gains a corps command, or a skill level, a point of attack, a point of defence and the Desert Fox trait."
 ITA_ettore_pedotti_high_command: "Ettore Pedotti"
 ITA_ottavio_ricaldoni_air_chief: "Ottavio Ricaldoni"
 ITA_giulio_douhet_air_chief: "Giulio Douhet"
 ITA_ettore_pedotti_high_command_desc: "A general who left the war office for the mountain troops. A frontier, he holds, is defended by the men who live on it."
 ITA_ottavio_ricaldoni_air_chief_desc: "The engineer officer who commands the aviation section of the specialist battalion. He would hang an engine and a rudder under every balloon in the army."
 ITA_giulio_douhet_air_chief_desc: "An artillery officer given the battalion of aviators. The air is a battlefield of its own, he writes, and he is not thanked for saying so."
 ITA_enrico_gualterio_desc: "An admiral who took the squadron of the Middle Sea after Palumbo. He now presides over the Superior Council of the Navy, where every estimate of the fleet is argued out."
 ITA_w_tt_libya_takes_its_commanders: "Carlo Caneva takes the army of Libya and becomes a field marshal. Umberto Cagni lands his sailors at Tripoli and may be appointed to the high command."
 ITA_w_tt_the_fourth_shore_is_governed: "Vincenzo Garioni takes the governorship of Tripolitania and gains a corps command, or a skill level and a point of defence. Pietro Bertolini goes to the ministry of the colonies."
 ITA_cw_tt_side_the_crown_at_rome: "§YWe keep the King's government in Rome, under General Pelloux.§! The Chamber sets up in Milan and names its own head, Giolitti if he has gone north, otherwise Zanardelli, or a republican or a socialist."
 ITA_cw_tt_side_the_crown_at_turin: "§YWe keep the King's government and take the Court to Turin, with General Pelloux at its head.§! The Chamber takes Rome under Zanardelli, or under the republicans after him."
 ITA_cw_tt_side_the_comando: "§YWe keep the government, and General Saletta holds the ministries, or General Pollio after him.§! The King goes south to Naples with the Crown's party, and we fight him for the kingdom."
 ITA_cw_tt_side_the_chamber: "§YWe keep the government, and Zanardelli holds the ministries, or Luzzatti after him.§! The King goes south to Naples with the Crown's party, and we fight him for the kingdom."
 ITA_cw_tt_side_the_romagna: "§YWe keep the government and the rest of the country.§! The Romagna, Tuscany and the Abruzzi go to the risen provinces, and Malatesta leads them, or Labriola if he is gone."
 ITA_cw_tt_side_the_red_rising: "§YWe keep the government and the rest of the country.§! Milan, Lombardy, Liguria and the Romagna go to the rising, and Malatesta leads it, or Labriola if he is gone."
 ITA_cw_tt_side_the_island: "§YWe keep our own government, and every Italian government declares war on the island.§! Sicily is a republic under Colajanni, or under Barzilai if he is gone."
 ita_dnc.3000.t: "The Consulate at Fiume"
 ita_dnc.3000.d: "Our small consulates on the Adriatic now send back more than trade reports. The consul at Fiume asks for clerks who are not clerks, and for money nobody will itemise.\n\nIf we pay, our consular service becomes the best informed office we have. Vienna will guess what the new clerks are for."
 ita_dnc.3000.a: "Enlarge the consulate at Fiume."
 ita_dnc.3000.b: "Keep the consulate as it is."
 ITA_tt_the_consulate_stays_small: "The consular service stays as it is, and Vienna has nothing new to complain about."
 ita_dnc.3001.t: "New Duties for the Treasury"
 ita_dnc.3001.d: "The service of the debt is close to what the budget can bear. The Treasury has four remedies ready, and every one of them falls on a household or a town hall.\n\nWe can lay one of them now and take the anger that follows, or wait and hope the revenue catches up."
 ita_dnc.3001.a: "Hold the duty on salt where it stands."
 ita_dnc.3001.b: "Keep the duty on sugar and take the difference."
 ita_dnc.3001.c: "Bring back the duty on ground grain."
 ita_dnc.3001.e: "Call in the arrears of the towns."
 ita_dnc.3001.f: "Lay no new duty for now."
 ITA_e_tt_no_new_duty: "The service of the debt keeps climbing, and the Treasury will ask again if it reaches this point once more."
 ita_dnc.3002.t: "The Works for the Ore"
 ita_dnc.3002.d: "France has the ore, and we have the plant she wants built. Paris will trade steel, bauxite, tungsten or chrome for a works moved across the border.\n\nEvery trade costs us a civilian factory at home. We choose which of our mills is paid first, or we keep our factories where they are."
 ita_dnc.3002.a: "Trade a factory for steel for the Milanese mills."
 ita_dnc.3002.b: "Trade a factory for bauxite for the Turin works."
 ita_dnc.3002.c: "Trade a factory for tungsten for the Ligurian yards."
 ita_dnc.3002.e: "Trade a factory for chrome for the Emilian forges."
 ita_dnc.3002.f: "Keep our factories at home."
 ITA_u_tt_the_factories_stay_home: "The French offer lapses, and no other factory is moved across the border."
 ita_dnc.3003.t: "The Chambers of Commerce"
 ita_dnc.3003.d: "Our banks and schools on the River Plate have done their work. Italian chambers of commerce now sit in Buenos Aires and Montevideo, and the governments there consult them before they sign a contract.\n\nWe will let the chambers speak for Italy in every port of the Plate."
 ita_dnc.3003.a: "Put the chambers to work for the Kingdom."
 ita_dnc.3004.t: "The Residency at Tripoli"
 ita_dnc.3004.d: "The governor is installed at Tripoli with a staff, a treasury and a building to match.\n\nA province is governed from an address, or it is not governed at all. We open the residency and give the town the room to grow around it."
 ita_dnc.3004.a: "Open the residency at Tripoli."
 ita_dnc.3005.t: "The Coast Road of Tripolitania"
 ita_dnc.3005.d: "The track along the shore can now be made into a road that a marching column and a lorry can both use.\n\nWe will build it, and the towns east of Tripoli will stop being a week away."
 ita_dnc.3005.a: "Build the coast road."
 ita_dnc.3006.t: "The Residency at Benghazi"
 ita_dnc.3006.d: "Cyrenaica has never been run from the same place as the west, and it never will be.\n\nWe give the eastern province a governor of its own at Benghazi, instead of a desk in the capital."
 ita_dnc.3006.a: "Open the residency at Benghazi."
 ita_dnc.3007.t: "The Coast Road of Cyrenaica"
 ita_dnc.3007.d: "Our garrisons inland still depend on the sea for everything they eat and fire.\n\nWe will carry the road along the shore and up onto the green plateau behind it."
 ita_dnc.3007.a: "Build the road to the plateau."
 ita_dnc.3008.t: "The Residency of the Horn"
 ita_dnc.3008.d: "Eritrea and Somalia sit on two different seas and have been run as two separate accidents.\n\nWe set one governor over both coasts, with the staff and the treasury to match, and make them a single command."
 ita_dnc.3008.a: "Open the residency of the Horn."
 ita_dnc.3009.t: "The Road Between the Colonies"
 ita_dnc.3009.d: "The tracks between our two colonies can now be joined and made fit for a convoy.\n\nWe will build the road, and what we hold on the Red Sea and on the Indian Ocean will be able to support each other."
 ita_dnc.3009.a: "Join the colonies by road."
 ita_dnc.3010.t: "The Residency of the Islands"
 ita_dnc.3010.d: "Until now the islands have been a naval station with a mayor.\n\nWe appoint a civil governor and make the harbour works his first charge."
 ita_dnc.3010.a: "Appoint the governor of the islands."
 ita_dnc.3011.t: "The Anchorage of the Islands"
 ita_dnc.3011.d: "The squadron in the eastern sea still has to go home to lie up.\n\nWe will dredge the great roadstead, lay moorings and build a proper coal store."
 ita_dnc.3011.a: "Build the moorings and the coal store."
 ITA_h_the_colonial_office_grows_tt: "While we hold a colony, the Colonial Office account grows a little stronger twice a year, up to its limit."
 ITA_l_the_governorships_tt: "Each governorate gets its residency once we hold its capital, and its road once we hold the country around it."
 ITA_e_tt_the_duties_are_ready: "When the service of the debt nears the wall, the Treasury will ask us to lay one of the consumption duties."
 ITA_u_tt_the_stations_are_built: "Every coaling station we take in the East gets a naval base built at once."
 ITA_h_the_colonial_levy: "The Levy of [FROM.GetName]"
 ITA_h_the_colonial_levy_desc: "Each province of the empire can give us its regular battalions once. We enrol them and pay them out of the colonial account, and we argue later about who commands them."
 ita_dnc.2141.e: "Dissolve the Chamber and call elections."
 ita_dnc.3023.t: "The Chamber Will Not Hold"
 ita_dnc.3023.d: "The majority has come apart again, and the Chamber has sat for months without one. The estimates wait, and the corridors are already trading the next combination.\n\nWe can dissolve the Chamber and go to the country, or govern on as we are."
 ita_dnc.3023.a: "Dissolve the Chamber and call elections."
 ita_dnc.3023.b: "Govern on without a majority."
 ITA_tt_the_chamber_sits_on: "The Chamber sits on without a majority, and the months without one keep counting."
 ITA_dec_tt_the_roadstead_is_open: "Cattaro is opened to the Italian squadron, and Rome is the warmer for it."
 ita_dnc.2236.t: "The Italian Squadron at Cattaro"
 ita_dnc.2236.d: "The Italians ask to bring their Adriatic squadron into Cattaro on a courtesy visit. That means salutes, dinners and an exchange of officers.\n\nOur admirals do not want them counting the moorings. Our diplomats say a refusal will be printed from Paris to Petersburg. We may receive the squadron properly, or find a reason why this season will not do."
 ita_dnc.2236.a: "Receive them, with the salutes"
 ita_dnc.2236.b: "Find a reason why this season will not do."
 ita_dnc.2237.t: "The Squadron Is Received"
 ita_dnc.2237.d: "The salutes were fired and the dinners were given. Our officers walked the moorings at Cattaro for the best part of a week.\n\nThey came back with soundings, sketches and the run of the defences. The Austrian admirals meant to show them a good deal less."
 ita_dnc.2237.a: "Put the soundings in the war plan."
 ita_dnc.2238.t: "Cattaro Is Closed to Us"
 ita_dnc.2238.d: "The visit is declined, politely, on account of manoeuvres that nobody can find in the naval lists. Our squadron turns back at sea.\n\nEvery wardroom in the fleet has drawn the same conclusion about the alliance. The country will hear of it, and will not like it."
 ita_dnc.2238.a: "Let the papers print where the squadron turned back."
 ita_dnc.3012.t: "Notice to Vienna"
 ita_dnc.3012.d: "Confidence at Vienna has stayed at almost nothing for months, and the Consulta has drafted the notice that the kingdom will not renew the Triple Alliance. 28 years of Italian foreign policy would end on one sheet of paper.\n\nWe can send it now and face every foreign ministry in Europe the same afternoon, or keep the alliance a while longer."
 ita_dnc.3012.a: "Send the notice and denounce the alliance."
 ita_dnc.3012.b: "Keep the alliance for now."
 ITA_w_tt_the_alliance_is_kept_for_now: "The alliance stands. The Consulta will raise it again if confidence at Vienna stays this low."
 ita_dnc.3013.t: "The Senussi Subsidy"
 ita_dnc.3013.d: "We hold the Libyan coast, but the interior has not been governed since the peace. The Senussi brotherhood keeps the oases, and its sheikhs say they can bring a province back to order for a price.\n\nWe can pay them and take the interior back one province at a time, or leave it to our own columns."
 ita_dnc.3013.a: "Pay the Senussi to bring a province back."
 ita_dnc.3013.b: "Leave the interior to our own columns."
 ITA_w_tt_the_interior_is_left_to_the_columns: "The Senussi are not paid, and the ungoverned provinces stay as they are until our garrisons can hold them."
 ita_dnc.3014.t: "Sicily Asks for Its Statute"
 ita_dnc.3014.d: "The island's deputies have come to ask what the statute we promised them is worth while the kingdom fights itself. Every month we spend on the mainland is a month the sulphur towns spend listening to the republican clubs.\n\nWe can promise Palermo its statute, send the Twelfth Corps into the interior, or give no answer yet."
 ita_dnc.3014.a: "Promise Palermo its statute."
 ita_dnc.3014.b: "Send the Twelfth Corps into the interior."
 ita_dnc.3014.c: "Give Palermo no answer yet."
 ITA_cw_tt_palermo_waits: "Palermo is given nothing, and the clock on the island keeps running."
 ita_dnc.2101.c: "Open the new reign with an amnesty."
 ita_dnc.2134.e: "Open an inquiry into the shootings at Buggerru."
 ita_dnc.2164.c: "Pardon the Romagna and send the men home."
 ita_dnc.3015.t: "The Relief of Messina"
 ita_dnc.3015.d: "The survivors of the Straits are living in the open, and the ruins still hold the dead. The navy has done what ships can do, and the rest now falls to us.\n\nWe can send the army's relief columns into the ruins, put the homeless under huts before the rains, or thank the foreign squadrons that came first."
 ita_dnc.3015.a: "Send the relief columns into the ruins."
 ita_dnc.3015.b: "Put the homeless under huts before the rains."
 ita_dnc.3015.c: "Thank the foreign squadrons by name."
 ita_dnc.3015.e: "Leave the relief to the navy."
 ITA_me_tt_the_navy_carries_on: "The navy keeps the relief going with what it has, and nothing more is spent on it."
 ita_dnc.3016.t: "The Messina Credits"
 ita_dnc.3016.d: "The province cannot pay for its own rebuilding, and the ministry has asked the Chamber for an emergency credit. The deputies of the South will vote for it, and so will anyone who wants a contract.\n\nWe can put the credit to the vote and spend it on the Straits, or leave the province to find the money."
 ita_dnc.3016.a: "Vote the relief credits in the Chamber."
 ita_dnc.3016.b: "Leave the credits to the province."
 ITA_me_tt_the_province_pays: "The province pays for what it can, and the Chamber is not asked for anything."
 ita_dnc.3017.t: "Rebuilding Messina"
 ita_dnc.3017.d: "The rubble is cleared, and three plans are on the minister's desk. The engineers want the city rebuilt in stone. The prefect wants the quarters and the roads back first, and the Treasury wants one factory to pay for the rest.\n\nWe can afford only one of them."
 ita_dnc.3017.a: "Rebuild Messina in stone."
 ita_dnc.3017.b: "Rebuild the quarters and the roads first."
 ita_dnc.3017.c: "Rebuild to the reconstruction plan."
 ita_dnc.3017.e: "Leave the rebuilding to the contractors."
 ITA_me_tt_the_contractors_rebuild: "The contractors rebuild what pays, and the state spends nothing on it."
 ita_dnc.3018.t: "The Straits Ferry"
 ita_dnc.3018.d: "The ferry across the Straits still runs from a beach, and every train from Sicily waits for the weather. The engineers can build proper berths on both shores.\n\nWe can join Sicily to the mainland, or keep the old boats running."
 ita_dnc.3018.a: "Build the ferry berths across the Straits."
 ita_dnc.3018.b: "Keep the old boats running."
 ITA_me_tt_the_old_boats_run: "The old ferry keeps running from the beach, and nothing is built."
 ita_dnc.3019.t: "The Law of Guarantees"
 ita_dnc.3019.d: "The Catholic vote now sits with our majority, and the bishops expect something for it. The Law of Guarantees still fixes the Pope's standing, and the schools are still closed to the parish.\n\nWe can ask our lawyers what the law would allow and let the answer cross the Tiber, or put the catechism back in the schools."
 ita_dnc.3019.a: "Read the law again and send the answer across the Tiber."
 ita_dnc.3019.b: "Put the catechism back in the schools."
 ita_dnc.3019.c: "Leave the Law of Guarantees as it stands."
 ITA_k_tt_the_law_stands: "The law stays as it is written, and the Vatican is told nothing new."
 ita_dnc.3020.t: "The Islands as a Pledge"
 ita_dnc.3020.d: "The war in Libya will not end until the Porte feels it at home. The Aegean islands lie on the route from Constantinople to Tripoli, and the fleet can take them.\n\nWe can claim the islands and hold them until the peace is signed, or keep the war in Africa."
 ita_dnc.3020.a: "Claim the islands as a pledge."
 ita_dnc.3020.b: "Keep the war in Africa."
 ITA_wr_tt_the_islands_are_left: "The islands are left to the Porte, and the powers have nothing to protest."
 ita_dnc.3021.t: "The Volunteers of Garibaldi"
 ita_dnc.3021.d: "Ricciotti Garibaldi carries his father's name, and the volunteers are already writing to him from every city in the kingdom.\n\nWe can let him raise his legion and put it in the line, where the name is worth something, or keep the volunteers at home."
 ita_dnc.3021.a: "Let Ricciotti Garibaldi raise his legion."
 ita_dnc.3021.b: "Keep the volunteers at home."
 ITA_wr_tt_the_volunteers_stay_home: "The volunteers are thanked and sent home, and no legion takes the field."
 ita_dnc.3022.t: "The Irredentist Legion"
 ita_dnc.3022.d: "The students from the irredenta, the Italian lands under Austria, are subjects of the enemy. Every one of them has come to enlist.\n\nWe can form them into an alpine legion and be careful where we send it, or put them in the ordinary regiments."
 ita_dnc.3022.a: "Raise the students as an alpine legion."
 ita_dnc.3022.b: "Send the students to the ordinary regiments."
 ITA_wr_tt_the_students_join_the_line: "The students enlist under other names, and no legion is formed."
