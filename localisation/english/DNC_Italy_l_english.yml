 ITA_e_the_schools_answer_tt: "Our §Ylaboratories§! answer sooner."
 ITA_e_the_freight_is_cheaper_tt: "Our §Yfreight§! costs the works less."
 ITA_h_albertini_is_available_tt: "Luigi Albertini, editor of the Corriere, is now available as an adviser to the ministry."
 ITA_o_latin_system: "The Latin System"
 ITA_ENG_naval_group: "Anglo-Italian Naval Programme"
 ITA_ENG_naval_group_desc: "The two admiralties open their drawings of hulls and armour to one another."
 ITA_ENG_naval_tech_sharing: "The Naval Understanding"
 ITA_ENG_naval_tech_sharing_desc: "London lets our constructors read what its own yards have learned."
 ITA_QIN_group: "The Works at Peking"
 ITA_QIN_group_desc: "Our engineers and the court's own share what each of them builds."
 ITA_AUH_industrial_group: "The Customs Union of the Littoral"
 ITA_AUH_industrial_group_desc: "The factories of the two crowns share what each of them learns."
 ITA_RUS_naval_group: "The Yards of the Two Seas"
 ITA_RUS_naval_group_desc: "Petersburg and Rome build to one another's drawings."
 ITA_FRA_industrial_group: "The Shared Patents"
 ITA_FRA_industrial_group_desc: "What is patented in Paris is worked in Milan, and the other way about."
 ITA_o_destra_storica: "Destra Storica"
 ITA_o_destra_storica_long: "The Historical Right"
 ITA_o_unione_liberale: "Unione Liberale"
 ITA_o_unione_liberale_long: "The Liberal Union"
 ITA_o_governo_del_re: "Governo del Re"
 ITA_o_governo_del_re_long: "The Government of the King"
 ITA_l_award_at_belgrade_other: "Given the Award at Belgrade"
 ITA_l_award_at_cetinje_other: "Given the Award at Cetinje"
 ITA_l_second_award_at_cetinje_other: "Given the Second Award at Cetinje"
 ITA_u_guardian_of_the_adriatic: "Guardian of the Adriatic"
 ITA_u_trading_partners: "Trading Partners"
 ITA_h_the_stations_are_ours: "The Stations Are Italian"
 ita_dnc.2955.t: "The Italian Consulate"
 ita_dnc.2955.d: "The Italians have opened a consulate that does rather more than stamp papers. It keeps a register of its own nationals, it pays for a school, and it answers to Rome and to nobody here.\n\nWe can treat it as a courtesy between friendly states, or as a foothold and watch it."
 ita_dnc.2955.a: "Treat it as a courtesy between friendly states."
 ita_dnc.2955.b: "Watch the consulate and its register."
 ITA_h_the_consulate_is_watched_tt: "The consulate is put under observation."
 ITA_h_the_stations_are_watched: "The Consulates Are Watched"
 ITA_h_the_stations_are_watched_desc: "A foreign department has decided that our consulates keep more than registers. It treats every note we send as evidence, and other capitals are slower to deal with us."
 ITA_l_no_porte_answers_tt: "No Ottoman ministry is left to answer, and the claim is made against whoever holds the shore."
 ita_dnc.2712.t: "Our Note Is Accepted"
 ita_dnc.2712.d: "The note we sent has come back signed. [FROM.GetNameDefCap] has taken our terms exactly as they were written.\n\nThe Consulta, our foreign ministry, will enter the answer in its file. We have something to show the Chamber."
 ita_dnc.2712.a: "Enter it in the file."
 ita_dnc.2713.t: "Our Note Is Refused"
 ita_dnc.2713.d: "The note we sent has come back refused. [FROM.GetNameDefCap] gives no reason the Consulta can put into a despatch.\n\nWe shall have to explain in the Chamber why we wrote at all."
 ita_dnc.2713.a: "Tell the Chamber and take the questions."
 ITA_air_the_wireless_aloft_ns_desc: "Our airships now carry a wireless set that talks back to the ground. One of them is worth a squadron of couriers, and what they see reaches us while it still matters."
 ITA_air_the_defence_of_the_kingdom_ns_desc: "The Specialist Brigade answers for the sky over our arsenals and both capitals, and it answers to the ministry and to nobody else. The gun sites go up faster because of it."
 ITA_air_the_sheds_on_the_far_shore_ns_desc: "We keep airship sheds on the eastern shore. What flies from them comes back with the far coast drawn, and fewer crews are lost doing it."
 ITA_air_the_night_and_the_beam_ns_desc: "A light beam laid along the coast lets an airship find its own shed after dark. No other air service in Europe can promise its crews that."
 ITA_air_the_memoranda_of_douhet_ns_desc: "One officer keeps writing that the next war is decided above the armies. The ministry has stopped filing the memoranda and started reading them."
 ITA_n_the_staff_of_the_marine_desc: "The fleet has a staff at last, sitting between the admirals and the ministry. It writes down what the navy means to do before anyone asks."
 ITA_n_the_staff_of_the_marine_improved_desc: "The naval staff now writes the war plans itself. The squadrons exercise against those plans instead of doing the same drill every season."
 ITA_n_the_night_flotillas_desc: "Our torpedo boats work by night in the narrow sea. A battleship is a target there, and a searchlight tells the enemy where you are."
 ITA_n_the_glauco_boats_desc: "The submarine flotilla is no longer an experiment tied up at La Spezia. It is a squadron with a base of its own and orders it has trained for."
 ITA_u_the_shield_of_the_left_desc: "The government rests on what the leagues will put up with, and takes care never to find the limit. No other party can shake it while the leagues stand where they do."
 ITA_u_the_shield_of_the_right_desc: "The government rests on the men of property. They will pay for order, and they expect to be told they are paying for the nation."
 ITA_u_the_shield_of_the_left_and_labour_desc: "The leagues sit at the table and the working hours are shorter. The streets are quiet, and not one squadron of police has been called out to make them so."
 ITA_u_the_shield_of_the_right_and_labour_desc: "The employers are protected and the workmen are insured. Neither side has been told what the other was promised, and both keep quiet."
 ITA_u_the_shield_of_the_left_complete_desc: "Labour, the courts and the schools all answer to the same programme. The government no longer has to argue for it in the Chamber."
 ITA_u_the_shield_of_the_right_complete_desc: "Property, the church and the officers hold the same view of the state. The government has stopped asking anybody else what they think."
 ITA_u_the_school_of_turin_2_desc: "The war school at Turin sets the examinations that decide who commands. The regiments have noticed, and the better officers are applying."
 ITA_u_the_school_of_turin_3_desc: "Turin now trains the staff officers as well as the line officers. An officer who has not passed through the school does not rise."
 ITA_u_the_school_of_turin_4_desc: "Doctrine, promotion and the manoeuvre season all come out of the same building at Turin. The school is the army now, and the army knows it."
 ITA_u_the_scholars_returned_desc: "The men who left for foreign laboratories have been offered chairs at home, and most of them have taken them."
 ITA_u_the_royal_patronage_desc: "The Crown pays for the observatories, the institutes and the prizes, and its name is on all of them."
 ITA_u_everything_for_the_army_desc: "The estimates are written for the army first and for the rest of the kingdom afterwards. The divisions march faster and eat less, and the factories go short."
 ITA_u_the_technical_missions_desc: "We send our engineers into foreign workshops and they write home what they have seen. Our arms works go up faster, and they change over to a new pattern with less waste."
 ITA_u_the_station_at_coltano_desc: "The wireless station at Coltano reaches the colonies and the fleet without a foreign cable company in between. Our ships give less away, they train better, and what the station learns goes to our laboratories."
 ITA_u_the_returned_exiles_desc: "The men we drove out have come home, and they have brought the organisations they built abroad with them. They are better organised than our police, and the country is harder to govern for it."
 ITA_u_the_men_from_rome_desc: "Rome sends its own men to the provinces that will not govern themselves. They stand for no election, they answer to nobody in the province, and everybody there knows it."
 ITA_u_the_eastern_subscription_desc: "A subscription raised here keeps our comrades in the east in funds. They answer to Rome for every sum they spend, and the party at home is the stronger for it."
 ITA_u_the_solidarity_funds_desc: "A fund kept in Rome pays the strike benefit of unions in half a dozen countries. Rome decides which strikes it pays for, and the unions at home follow where Rome leads."
 ITA_u_war_on_the_counting_house_ns_desc: "We treat the banks as an enemy department rather than a partner, and they have begun to behave like one. The country is in a fighting temper, and the army with it."
 ITA_u_the_answer_to_tokyo_ns_desc: "Tokyo asked what a workers' Italy would do in Asia, and we answered in writing. The fleet was told to be ready to make the answer good."
