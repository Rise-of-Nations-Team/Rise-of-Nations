 RON_Atheism: "The State Has No Church"
 RON_Atheism_desc: "No oath is sworn on a book here. The government has a free hand, and it has lost the parish priest. In some villages he was the only man who could read a notice aloud."
 RON_European_Union: "The Community of Six"
 RON_European_Union_desc: "A customs union. Its founders call it a market, and its lawyers are drafting it as a constitution.\n\nSteel and coal cross the borders without a tariff, and the factories build faster for it. Nobody inside it can prepare a war quickly any more."
