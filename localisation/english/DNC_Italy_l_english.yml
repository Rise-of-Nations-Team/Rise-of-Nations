 vittorio_ambrosio: "Vittorio Ambrosio"
 ITA_p_the_piazza: "The Piazza"
 ITA_p_the_piazza_desc: "What the prefects report from the squares, the chambers of labour and the mills, kept as one figure in a book at the Interior. The state shelled Milan for less than this.\n\nThe piazza: §Y[?ITA_piazza|0]§! of 100. It will not fall below §Y[?ITA_piazza_floor|0]§!.\n\nA restless piazza spreads the strike. An angry one brings the ministry down. Higher still, a province passes out of the prefect's hands. A piazza that stays at the top of the book for a season is an insurrection."
 ITA_c_the_chamber: "The Chamber"
 ITA_c_the_chamber_desc: "There is no party in this Chamber, only a majority. A majority is assembled deputy by deputy, in a room off the corridor, and it holds until the bill comes.\n\nThe government's hold: §Y[?ITA_majority|0]§! of 100, of which §Y[?ITA_majority_bought|0]§! was made by the prefects.\n\nProvinces worked: §Y[?ITA_prefects|0]§!. Public works promised and not yet delivered: §Y[?ITA_pledges|0]§!."
 ITA_p_the_army_in_the_streets: "The Army in the Streets"
 ITA_p_the_army_in_the_streets_desc: "Bava Beccaris was decorated for shelling a crowd, and the country has not stopped counting since. Every time the troops are sent, the square empties that week and fills again the next year with men who remember.\n\nTimes the army has been used against a crowd: §Y[?ITA_bayonets|0]§!. While the army holds the streets we lose stability and political power, and the communists gain ground."
 ITA_p_the_province_ungoverned: "The Province Is Not Governed"
 ITA_p_the_province_ungoverned_desc: "The prefect sits in his residence with the shutters closed, the telegraph is cut, and a committee in the town hall is issuing passes. Nothing is being built here. Nothing is being shipped out, and no recruits are coming from these towns."
 ITA_p_the_strike_spreads: "The Strike Spreads"
 ITA_p_the_strike_spreads_desc: "It began in one trade and it is now in all of them: the port, the railway shops, the tramways and the mills along the Olona. There is no fund to break, no leader to arrest and no demand to concede, because nobody drew one up. The furnaces are banked, the factories work at a fraction of their output, and nothing is being built while it lasts."
 ITA_p_the_country_divided: "The Country Divided"
 ITA_p_the_country_divided_desc: "There is a line across the peninsula now, with an army on either side of it. The kingdom that Cavour put together in 11 years has come apart in a fortnight. Whichever side wins, no conscript from these provinces will be trusted with a rifle for a generation."
 ITA_c_the_ministry_that_waits: "The Ministry That Waits"
 ITA_c_the_ministry_that_waits_desc: "A ministry formed to hold the door until the Chamber can agree on something. It signs nothing that could be quoted against it. Every question it is asked is put off to the next session."
 ITA_c_the_ministry_of_transition: "A Ministry of Transition"
 ITA_c_the_ministry_of_transition_desc: "The King has sent for a man everyone can accept, because nobody wants him. He has undertaken to do nothing until the situation is clearer. Every measure is put off to the spring session, and the situation does not get clearer."
 ITA_c_the_chamber_will_not_vote: "The Chamber Will Not Vote"
 ITA_c_the_chamber_will_not_vote_desc: "The estimates were laid before the Chamber, and the Chamber went home. There is no majority for anything: not for the ministry, not against it, not for the credits, not for a dissolution. The Kingdom is run by its permanent officials and by nobody else."
 ITA_c_the_majority_returned: "The Majority Returned"
 ITA_c_the_majority_returned_desc: "More than 300 deputies came back with the government. For two sessions the ministry can put a bill down and know the numbers before the division bell. It will not last, because it never does, but it is the only condition in which anything here gets built."
 ITA_repress_tt: "§RThe army is used against the crowd.§! The piazza falls by §Y14§!, and one more bayonet is counted in the book."
 ITA_ministry_falls_tt: "§RThe ministry falls.§! The senior bargain that was holding the majority together is §Ylost§!."
 ITA_ungoverned_tt: "§RTwo provinces pass out of our hands for eight months.§! Almost nothing is built, mined or recruited there until they come back."
 ita_dnc.600.t: "The General Strike"
 ita_dnc.600.d: "It began with a shooting in Sardinia. It is now in Milan, Genoa, Turin and Rome at once, with no central committee, no demand and no strike fund. The trams have stopped, the port has stopped, and the newspapers are not being printed.\n\nNobody in this ministry has seen a general strike before, because until this week no country in Europe had one. We can send a prefect to the table, send the garrison, or wait for it to run itself out."
 ita_dnc.600.a: "Send the prefect to sit at the table with them."
 ita_dnc.600.b: "Send the garrison to clear the squares."
 ita_dnc.600.c: "Wait. The strike has no demands and will exhaust itself."
 ita_dnc.601.t: "The Ministry Falls"
 ita_dnc.601.d: "The majority that voted the estimates in the spring did not divide with the government tonight. The men who arranged it are already in the corridor arranging the next one. Nothing was beaten on a principle.\n\nAbout 100 deputies decided that a ministry with the country in this state is not worth being counted with. The King must send for somebody. We can advise him to call the same man, to try a new one, or to send the Chamber home until it is calmer."
 ita_dnc.601.a: "Send for the same man. He will make another majority."
 ita_dnc.601.b: "Send for someone the Chamber has not yet used up."
 ita_dnc.601.c: "Ask the King to send the Chamber home until it is calmer."
 ita_dnc.602.t: "The Ungoverned Provinces"
 ita_dnc.602.d: "Three men were shot at a meeting a week ago. The province has not been governed since. The railway outside the city is torn up and the telegraph is cut. The tax registers were burned in the square, and in the smaller towns committees have taken over and are issuing bread tickets.\n\nThe prefect has no force he can trust and asks for instructions. We can send the army, concede what the committees are asking, or leave the prefects to settle it."
 ita_dnc.602.a: "Send two divisions and proclaim a state of siege."
 ita_dnc.602.b: "Concede what they are asking for, and put it in writing."
 ita_dnc.602.c: "Leave it to the prefects. Keep the army in barracks."
 ita_dnc.603.t: "The Insurrection"
 ita_dnc.603.d: "The Romagna has been out of our hands for three months, and the rest of the country has stopped pretending otherwise. The reservists called up in the Marche did not report. In Tuscany the garrison commander asked to be relieved rather than fire on a crowd.\n\nWhat is read from the balconies is no longer a list of grievances. It is a constitution. There is nothing left for us to concede, and the army will have to settle it."
 ita_dnc.603.a: "Fight it. The army will put the rising down."
 ita_dnc.604.t: "The Provinces Governed Again"
 ita_dnc.604.d: "The committees have broken up and the prefect is back at his desk. The tax registers are being copied out again from the rolls in Rome, and the line is repaired as far as the junction. No one is to be prosecuted. That was the condition for ending it."
 ita_dnc.604.a: "Say nothing about it in the Chamber."
 ita_dnc.700.t: "The Circular to the Prefects"
 ita_dnc.700.d: "The draft is on the desk, and it says nothing that could be read out in the Chamber. It tells 90 prefects which candidates the government favours and which licences may be granted before the poll. It names the roads and aqueducts to be surveyed, and the constituencies they are to be surveyed in. The circular has always been sent. The only question is how hard to write it."
 ita_dnc.700.a: "Write it hard. Promise the works and name the men."
 ita_dnc.700.b: "Send it as it has always been sent."
 ita_dnc.700.c: "Withdraw it. The prefects will supervise and nothing else."
 ita_dnc.701.t: "The General Election"
 ita_dnc.701.d: "2.5 million men have the vote, out of 33 million Italians. In half the southern seats the poll is a formality arranged in the prefecture. In a few dioceses the bishops have quietly lifted the Pope's ban on Catholics voting. Their people will go to the polls for the first time in a generation."
 ita_dnc.701.a: "Let the prefects make the returns."
 ita_dnc.701.b: "Fight it on what the ministry has built."
 ita_dnc.701.c: "Keep the government out of this election."
 ita_dnc.702.t: "The General Election"
 ita_dnc.702.d: "The Socialists will come back stronger from the North whatever we do, so the numbers have to be found somewhere else. In the South that means the prefectures. In the Veneto and the Marche it means the parish clergy, who now have an understanding with us that neither side will put on paper."
 ita_dnc.702.a: "Let the prefects make the returns."
 ita_dnc.702.b: "Ask the parish clergy for the votes the prefects cannot find."
 ita_dnc.702.c: "Keep the government out of this election."
 ita_dnc.705.t: "The Returns"
 ita_dnc.705.d: "The last constituencies have declared. The clerks in the Chamber have finished counting, and we now know what kind of ministry this is going to be."
 ita_dnc.705.a: "Govern with the majority the country has returned."
 ita_dnc.705.b: "Govern without a majority."
 ita_dnc.705.c: "Admit that this Chamber will not make a government."
 ITA_ch_already_out_tt: "§RThe country was already in the streets when the shots were fired.§!"
 ITA_ch_the_prefect_did_not_ask_tt: "§RThe prefect did not ask Rome first. We read about his decree in the newspapers.§!"
 ITA_ch_nobody_else_would_take_it_tt: "§RNobody else would take the Interior, so the King has no one else to send for.§!"
 ITA_ch_the_trade_is_already_theirs_tt: "§RThe shipping agents already run the emigrant trade, and every quayside works for them.§!"
 ITA_ch_the_army_was_already_out_tt: "§RThe army had already been used against strikers elsewhere. Buggerru is not the first time.§!"
 ITA_ch_the_strike_took_the_railways_tt: "§RThe strike has taken the railways north and south.§!"
 ITA_ch_dissolved_over_bayonets_tt: "§RThe Chamber is dissolved by a ministry that has just used troops on Italians.§!"
 ITA_ch_the_boards_are_tested_tt: "§GThe arbitration boards exist, and Parma is the first dispute they have been asked to settle.§!"
 ITA_ch_messina_on_a_country_out_tt: "§RThere are no troops to spare for Messina. They are holding the cities at home.§!"
 ITA_ch_messina_the_contracts_tt: "§RThe reconstruction contracts are placed before the rubble is cleared, and the Chamber knows which deputies placed them.§!"
 ITA_ch_messina_a_quiet_country_tt: "§GA quiet country lets us be seen to govern.§!"
 ITA_ch_the_last_reserves_tt: "§RThe last reserves go south to Messina, and no troops are left to hold the cities.§!"
 ITA_ch_the_nationalists_have_an_audience_tt: "§RThe country is angry, and the nationalists have found their audience in it.§!"
 ITA_ch_the_papers_have_promised_it_tt: "§RThe newspapers have promised this war in our name.§!"
 ITA_ch_asked_in_the_street_tt: "§RThe reform is being demanded outside the Chamber before it is moved inside it.§!"
 ITA_ch_the_whips_can_count_tt: "§RThe whips have counted the bought seats and know what a wider franchise would cost us.§!"
 ITA_ch_the_bought_seats_will_not_hold_tt: "§RThe seats bought through the prefectures will not survive the next election.§!"
 ITA_ch_the_coast_is_ours_tt: "§YWe hold the coast. The tribes of the interior have not accepted it.§!"
 ITA_ch_the_socialists_have_their_issue_tt: "§RThe war has given the revolutionary socialists the argument they were short of.§!"
 ITA_ch_the_reservists_will_not_go_tt: "§RThe reservists called for Africa have already been used against their own towns.§!"
 ITA_ch_gentiloni_the_new_register_tt: "§YUnder the new register the clergy can deliver more votes than the prefects ever could.§!"
 ITA_ch_gentiloni_the_old_register_tt: "§YUnder the old register the understanding with the clergy is worth less, because the prefects still hold the seats.§!"
 ITA_ch_red_week_held_tt: "§YThe provinces hold, barely, and the railway is cut in one place only.§!"
 ITA_ch_july_the_country_will_not_march_tt: "§RThe country will not march. It has been in the streets all summer, and it blames us.§!"
 ITA_ch_july_no_majority_tt: "§RThere is no majority to carry a war vote, and the whips have said so in writing.§!"
 ITA_ch_july_the_army_is_in_the_streets_tt: "§RThe army is holding Italian towns. It cannot be asked to hold a front as well.§!"
 ITA_ch_the_law_of_suspects: "The Law of Suspects"
 ITA_ch_the_law_of_suspects_desc: "The Interior keeps a card for every anarchist in the kingdom. It keeps one for every subscriber to an anarchist paper, and for every man seen at a meeting where one spoke. It works: we know things we did not know before. It also tells hundreds of thousands of men who were not anarchists which side the state has taken. The emigration offices in Naples are busier than they were."
 ITA_ch_the_amnesty_of_the_new_reign: "The Amnesty of the New Reign"
 ITA_ch_the_amnesty_of_the_new_reign_desc: "The Milan sentences are quashed, and the men come home to bands at the station. Nobody in the Chamber advised it, and half the Senate calls it an insult to the dead King. The country is calmer than it has been for years, and we have spent most of the credit the new reign brought us."
 ITA_ch_the_port_that_stopped: "The Port That Stopped"
 ITA_ch_the_port_that_stopped_desc: "Genoa is shut. Two thirds of the coal that feeds the mills of the north comes through that port. The colliers wait outside the harbour at our expense, the grain sits in the holds, and Ansaldo has sent its fitters home. The mills inland run short within the week, and nothing is being built."
 ITA_ch_the_ministry_of_the_left: "The Ministry of the Left"
 ITA_ch_the_ministry_of_the_left_desc: "An old orator at the front of the ministry and a card index behind him. The prefects have a minister who reads their reports, remembers them, and answers by return. The Chamber has a leader who can count his votes. It is not a programme, but it governs, which is more than the last four ministries did."
 ITA_ch_the_agents_of_the_ports: "The Agents of the Ports"
 ITA_ch_the_agents_of_the_ports_desc: "The emigration law exists and is not enforced, which suits everyone who wrote it. The shipping agents keep the trade and charge what the traffic will bear. The men keep going, from the Veneto and the Basilicata, out of villages that will have no men of military age left in them when the call-up comes. We are not paying for this. We are losing them."
 ITA_ch_the_officers_grievance: "The Officers' Grievance"
 ITA_ch_the_officers_grievance_desc: "A lieutenant has been tried for obeying an order the prefect gave and we did not withdraw. Every mess in the kingdom has drawn the same conclusion: the state will send the army into a square and then disown it for what happens there. The officers will still go when they are ordered. They will go slowly, and they will not volunteer."
 ITA_ch_the_troops_were_right: "The Troops Were Right"
 ITA_ch_the_troops_were_right_desc: "The officer is confirmed in his rank and the file is closed. The army knows the state will stand behind the rifle, and so does everybody else. There is a discipline in the barracks that was not there last year. There is a hardness in the leagues that was not there either, and it will last longer."
 ITA_ch_the_general_strike: "The General Strike"
 ITA_ch_the_general_strike_desc: "No train, no tram, no gas, and one newspaper still printing. Nobody in Europe has done this before, and nobody is sure how it ends. The country has been stopped by men who own nothing and hold no office. Every ministry after this one will govern knowing it can be done again."
 ITA_ch_the_lockout_of_parma: "The Parma Lockout"
 ITA_ch_the_lockout_of_parma_desc: "The landowners around Parma have money and time. The leagues have neither, so the fields stand idle and the lowlands live on what the subscription lists send them. The strikers' children have been sent away to Genoa. Two private organisations are running the province, and neither of them is the prefecture."
 ITA_ch_the_seismic_decree: "The Earthquake Building Code"
 ITA_ch_the_seismic_decree_desc: "The Straits are being rebuilt to a code written by engineers and imposed by decree. The Chamber, the province and everyone who owned a building in Messina were passed over. It is the best piece of administration the kingdom has done in 20 years, and it was done in a way the constitution does not provide for."
 ITA_ch_the_africa_of_the_newspapers: "The Promise of Tripoli"
 ITA_ch_the_africa_of_the_newspapers_desc: "We have said from the tribune what the nationalist papers have been saying for a year: Tripoli is Italian, and only the timing is in question. The country liked hearing it. So did the nationalists, who have now been told by the government itself that their programme is ours, and will hold us to it."
 ITA_ch_the_war_that_was_not_declared: "The War That Was Not Declared"
 ITA_ch_the_war_that_was_not_declared_desc: "The note was drafted and never sent. The Banco di Roma is selling its holdings in Tripolitania for whatever it can get. The nationalist press has found the word renunciation and will not put it down. The Chamber was promised a colony and has been given a careful explanation instead. We have our peace, and we are paying for it in temper."
 ITA_ch_the_desert_that_pays_nothing: "The Desert That Pays Nothing"
 ITA_ch_the_desert_that_pays_nothing_desc: "A year in, the war is holding a coast against men who do not want the coast. Our columns march out, find nothing, and are shot at on the way back. The conscripts who should have gone home are still in Africa. The casualty lists are printed in full, and the men writing against the war in the Romagna have an audience they never had in peacetime."
 ITA_ch_the_garrison_of_the_fourth_shore: "The Garrison of the Fourth Shore"
 ITA_ch_the_garrison_of_the_fourth_shore_desc: "Forts, wire, wells and blockhouses run from Zuara to Derna along the Fourth Shore, our coast in Africa. They are held by conscripts who did not expect Africa and supplied by sea, because there is no other way. The garrison is permanent now, and every division in it is a division we cannot use anywhere else."
 ITA_ch_the_wider_register: "The Wider Register"
 ITA_ch_the_wider_register_desc: "8.5 million electors, most of whom have never voted and owe nothing to anybody. The Socialists have a constituency now, and so do the Catholics. The deputy who used to be returned by 400 notables and a prefect's letter no longer knows who is in his own division. This is what was asked for, and it cannot be taken back."
 ITA_ch_the_register_unrevised: "The Register Unrevised"
 ITA_ch_the_register_unrevised_desc: "The reform was announced in the Chamber and the literacy test was left in committee, where it will be studied. The country has been told it has the vote and has not been given it. That quiets the tribune for a session and settles nothing."
 ITA_ch_the_romagna_remembers: "The Romagna Remembers"
 ITA_ch_the_romagna_remembers_desc: "The committees are broken and the tricolour is back over the town halls. The Romagna has learned what the state will do and how long it takes to do it. The men who ran those four days are alive and at liberty. They have stopped arguing among themselves about method."
 ITA_ch_the_barracks_reform: "The Barracks Reform"
 ITA_ch_the_barracks_reform_desc: "The disciplinary companies are abolished and the punishment regulations rewritten. That is what the meeting at Ancona was called about in the first place. The country is quieter than it has been since the strike, and the barracks are slacker. The General Staff has put its objection in writing and asked that it be kept on file."
 ITA_ch_the_alliance_honoured: "The Alliance Honoured"
 ITA_ch_the_alliance_honoured_desc: "The treaty was kept. We march with the partner we have spent 30 years distrusting, in a quarrel about Serbia, over an ultimatum we were never shown. The army is better for having a decision at last. The country was not asked, and the Socialists are already writing about it."
 ITA_ch_the_scrap_of_paper: "The Letter of the Treaty"
 ITA_ch_the_scrap_of_paper_desc: "Article 7 required Vienna to consult us before moving, and Vienna did not. The duty to march therefore does not arise. The lawyers say so, the foreign ministry says so, and we have read the finding aloud from the tribune. Vienna calls it desertion. The country calls it the first sensible thing done in Rome since Ouchy."
 ITA_ch_the_hands_are_free: "The Hands Are Free"
 ITA_ch_the_hands_are_free_desc: "We are neutral, and both capitals have been told that our neutrality has a price and will not be offered for ever. Two embassies now have reason to improve their offer, and neither can be sure of us. Nobody would put this in a despatch, and it is worth more than anything we could put in one."
 ITA_z_the_chamber_adjourned: "The Chamber Adjourned"
 ITA_z_the_chamber_adjourned_desc: "There was no dissolution and no proclamation. The session simply ended and was never called back. We govern by decree because the decree is quicker, and speed has become the only argument anyone makes for it. The deputies still draw their allowance. They have stopped being consulted."
 ITA_z_the_extreme_left_in_office: "The Extreme Left in Office"
 ITA_z_the_extreme_left_in_office_desc: "Reformists hold the Interior, Labour and Public Instruction. The prefects who spent a decade counting votes now take their orders from men they used to have followed. A chamber of labour, the local trade union office, is answered now instead of dissolved. Every general in the kingdom has written privately to the King about it."
 ITA_end_the_state_that_chose: "The State That Chose"
 ITA_end_the_state_that_chose_desc: "Every man has the vote, the Chamber was not bought, and the streets are loud without being ungovernable. Nobody in Europe expected this of Italy, and a good many people in Rome did not either. The kingdom goes into the crisis ahead in quiet, and will settle its own part in it."
 ITA_end_the_country_was_asked: "The Country Was Asked"
 ITA_end_the_country_was_asked_desc: "No war without a vote of the Chamber. It was said aloud first and then written down. It makes us slow and it makes the General Staff furious. It also makes any decision the country reaches very hard to go back on, because the whole country made it."
 ITA_end_the_ministry_decides_alone: "The Ministry Decides Alone"
 ITA_end_the_ministry_decides_alone_desc: "Foreign affairs belong to the Crown and its ministers. The Chamber is told afterwards. It is legal and it is fast, and whatever the kingdom does next will have been decided by 11 men whose names are known."
 ITA_end_the_bargain_of_1914: "The Bargain in London"
 ITA_end_the_bargain_of_1914_desc: "Terms are being discussed in a room in London: the Trentino, Trieste, the Istrian coast, Valona, and a share of whatever comes apart. Nothing is signed where anyone can see it, and our ambassador in Vienna is not told. We have decided which side we will be on, in advance and at a price."
 ITA_end_the_word_kept: "The Word Kept"
 ITA_end_the_word_kept_desc: "The Triple Alliance is 30 years old, the staff talks are current, and we march with Berlin and Vienna because we said we would. Half the Chamber calls it madness, and the irredentists, who want the Italian lands held by Austria, call it treason. No chancellery in Europe will ever again say that an Italian signature means nothing."
 ITA_end_out_by_our_own_decision: "Out, by Our Own Decision"
 ITA_end_out_by_our_own_decision_desc: "Our neutrality was not bought, not forced, and not taken out of weakness. We could have gone either way and we told both sides no. The factories keep running and the emigrants keep their sons. We shall be at the peace table with nothing to explain and nothing to claim."
 ITA_end_the_kingdom_by_decree: "The Kingdom by Decree"
 ITA_end_the_kingdom_by_decree_desc: "Public safety decrees, prefects with a free hand, garrisons in the industrial towns, and a Chamber that sits when it suits us. It works. Taxes come in, order is kept, and we can do in a week what used to take a session. There is no name for this kind of government yet, and nothing in it gives way."
 ITA_end_the_ministry_of_the_sword: "The Generals in Office"
 ITA_end_the_ministry_of_the_sword_desc: "A general holds the Interior, a general presides at the Council, and the Carabinieri answer to both. The army used to be the last argument of the state. It is now the ordinary one, and it is enjoying itself."
 ITA_end_the_civil_mask: "The Civilian Ministry"
 ITA_end_the_civil_mask_desc: "A lawyer holds the Interior, a professor holds Public Instruction, and every decree is countersigned by a man in a frock coat. The powers are exactly the same as they were. Only the faces have changed, and in Italy the faces have always mattered more than anyone admits."
 ITA_end_the_chamber_recalled: "The Chamber Recalled"
 ITA_end_the_chamber_recalled_desc: "The deputies come back to a building they had stopped visiting. They spend the first four sittings asking who is to blame. The decrees are then lifted one by one. It costs us every friend we had in the prefectures, and it is the only thing keeping the country together."
 ITA_end_the_ministry_of_the_left: "The Ministry of the Extreme Left"
 ITA_end_the_ministry_of_the_left_desc: "The first socialist ministry in Europe, made by a franchise the liberals themselves granted. It will not arm, it will not join an alliance, and it will not send a year's conscripts to a war it did not choose. Every embassy in Rome has been told to treat the kingdom, for now, as a country that is not there."
 ITA_end_the_party_splits: "The Party Splits"
 ITA_end_the_party_splits_desc: "Leonida Bissolati took office and Benito Mussolini took the party newspaper. There are now two socialist parties in Italy, and they will not sit in the same hall. The ministry survives on the votes of men who despise it. That is not unusual in this Chamber, and it is never comfortable."
 ITA_end_the_price_abroad: "The Price Paid Abroad"
 ITA_end_the_price_abroad_desc: "Our columns are off the caravan roads, and the ascari, our colonial troops, have been paid off. The consulates report that the kingdom's word counts for less from Constantinople to Addis Ababa. This is what neutrality cost us, and the bill was always going to be presented abroad rather than at home."
 ITA_end_the_pledge_we_kept: "The Pledge We Kept"
 ITA_end_the_pledge_we_kept_desc: "Rhodes and the Dodecanese were taken as security, and they are not going back. That holds whatever was promised at Ouchy and whatever the Porte, the Ottoman government, says now. A socialist ministry is keeping a conquest it voted against, and the cartoonists will not let it go."
 ITA_end_the_state_after_the_rising: "The State After the Rising"
 ITA_end_the_state_after_the_rising_desc: "10 days, four provinces, and more than 100 dead before the columns had the railway junctions back. The kingdom that came out of the Romagna is not the kingdom that went in. It knows what it is prepared to do to its own people, and so does everybody else."
 ITA_end_the_provinces_that_left: "The Provinces That Left"
 ITA_end_the_provinces_that_left_desc: "Ancona, Ravenna, Forli and half the Marche are run by committees whose members the prefects cannot name. No taxes come out of them and no conscripts are delivered. The honest word for this is secession, and we will not use it in the Chamber."
 ITA_end_the_ministry_from_the_streets: "The Ministry from the Streets"
 ITA_end_the_ministry_from_the_streets_desc: "The King sent for the men whose arrest he had authorised the week before, and they came. The rising ends because the government has become the thing the rising demanded. It was the cheapest way out, and there is not a colonel in the kingdom who will forgive it."
 ITA_end_the_kingdom_that_came_out_of_it: "The Kingdom That Survived"
 ITA_end_the_kingdom_that_came_out_of_it_desc: "What was decided in those 10 days is now simply how Italy is governed. The argument about it has moved from the streets into the history books. A state that has survived its own worst week is harder afterwards, and holds together under a strain that would have broken it before."
 ITA_end_the_crown_that_would_not_sign: "The Crown That Would Not Sign"
 ITA_end_the_crown_that_would_not_sign_desc: "The King refused a second state of siege and let a ministry fall rather than sign it. It is the only popular act of his reign. It has also cost him the confidence of the General Staff, the prefects and his own household."
 ITA_end_the_army_that_cannot_come_home: "The Army That Cannot Come Home"
 ITA_end_the_army_that_cannot_come_home_desc: "50,000 men are strung out between Tripoli and the Fezzan, holding wells against tribes that do not need to hold anything. We are a great power with an army we cannot move. Every chancellery in Europe has counted our divisions and written Rome off for the season."
 ITA_end_next_year_in_the_fezzan: "Next Year in the Fezzan"
 ITA_end_next_year_in_the_fezzan_desc: "Another column, another oasis, and another despatch promising that the interior will be pacified before the rains. The troops are learning a great deal about desert marching. The Treasury is learning nothing, and 'next year in the Fezzan' has become a phrase nobody in the Chamber laughs at."
 ITA_end_the_coast_only: "The Coast Only"
 ITA_end_the_coast_only_desc: "Five towns, a garrison in each, and a frontier that stops where the guns of the fleet stop. It is not the Fourth Shore, our coast in Africa, that was promised from every platform in Italy. The men are within reach of a transport again, and the supply returns fit on one page."
 ITA_end_the_staff_that_was_overruled: "The Staff That Was Overruled"
 ITA_end_the_staff_that_was_overruled_desc: "The General Staff asked for two more divisions and one more year. They were refused by civilians, in writing and with reasons, and they have kept the copy. Every failure of the next decade will be laid at that letter, whatever the real cause turns out to be."
 ITA_end_the_columns_that_came_home: "The Columns That Came Home"
 ITA_end_the_columns_that_came_home_desc: "The battalions come off the transports at Naples and Taranto, thin and quiet, and march through towns that were told for two years that we were winning. The army is available again. What we are to use it for is a much harder question to answer in public."
 ITA_end_the_decade_in_the_sand: "The Decade in the Sand"
 ITA_end_the_decade_in_the_sand_desc: "The best infantry in the kingdom has spent its whole service escorting water convoys. The men can march and they can shoot. They cannot be brought back to Europe inside a year. Nobody in Rome will say aloud that Libya has cost us the decade we needed."
 ITA_end_the_accidental_ministry: "The Accidental Ministry"
 ITA_end_the_accidental_ministry_desc: "Nothing was settled, so a ministry took office that nobody voted for. It is led by a man nobody chose and rests on a majority put together in a corridor. It will do for the ordinary business of the kingdom. The crisis ahead is not ordinary business."
 ITA_end_the_men_in_the_room: "Decided Behind Closed Doors"
 ITA_end_the_men_in_the_room_desc: "Four signatures, no debate, and the Chamber told afterwards by telegram. The kingdom can be committed to anything in a fortnight. That is the whole argument for the arrangement, and it is why the country will not stand behind what is decided."
 ITA_end_the_old_man_recalled: "Giolitti Recalled"
 ITA_end_the_old_man_recalled_desc: "Giovanni Giolitti comes back the way he always comes back: with no programme, no speech, and a list of names. The machine starts on the first attempt. He will not take the kingdom to war, and he has never once explained himself to anybody."
 ITA_end_reckoning_tt: "The decade is closed, and the kingdom is judged on how it was governed."
 ITA_end_readout_tt: "§YThe piazza stands at [?ITA_piazza|0] and the majority at [?ITA_majority|0], of which [?ITA_majority_bought|0] was bought. The army has been called out [?ITA_bayonets|0] times.§!"
 ITA_end_free_hand_tt: "Italy may join or form a faction, and may send volunteers, as it chooses."
 ITA_end_neutral_lock_tt: "Italy may not join or create a faction, and may not declare war without a war goal."
 ITA_end_chamber_dead_tt: "The Chamber no longer governs, and its majority is a formality."
 ITA_end_bargain_london_tt: "The terms are agreed in London and written down nowhere anyone can read them."
 ITA_end_word_kept_tt: "The alliance holds, and those who want the Italian lands under Austria will not forgive it."
 ITA_end_out_by_choice_tt: "Italy stands out of the coming war by its own decision, and says so first."
 ITA_end_islands_returned_tt: "The Dodecanese goes back to the Porte, the Ottoman government."
 ITA_end_islands_kept_tt: "The islands are kept, against everything the ministry stood for."
 ITA_end_provinces_go_tt: "Emilia Romagna, Abruzzo and Tuscany pass out of our control."
 ITA_end_put_down_tt: "The rising is broken by the army, and the piazza falls back without ever settling as low again."
 ITA_end_libya_closed_tt: "The war in Libya is closed, the army comes home, and the piazza cools."
 ITA_t_the_hunt_costs_a_bayonet_tt: "§RThe hunt for Bresci's accomplices puts troops into the working quarters.§! A §Rbayonet§! is spent, and the piazza will never again fall below where it stands now."
 ITA_t_the_law_is_enough_tt: "§GThe law is left to do the work.§! The prefects are told to make no arrest they cannot justify to a magistrate, and the Chamber notices."
 ITA_t_the_question_is_put_tt: "§YThe ministry must answer for the Genoa decree.§! What we say depends on whether the street is already up."
 ITA_t_the_port_is_shut_tt: "§RThe port is shut and the ministry gives way.§! The decree is withdrawn, the prefect is transferred, and 90 prefectures learn that a general strike works."
 ITA_t_the_prefect_is_sustained_tt: "§GThe prefect is sustained.§! The decree stands, the machine gains a lever it will use for a decade, and the Extreme Left has its argument for the next 20 years."
 ITA_t_the_price_of_the_quays_tt: "§RThe coal quays at Genoa are worked by men who now know what they are worth.§! The Chamber is asked to vote the money that will keep them working."
 ITA_t_the_roads_before_us_tt: "§YFive roads lead out of the defeat at Adwa.§! They are the §Rarmy§!, the §Bfleet§!, the §GChamber§!, the §Gcountry beneath the state§! and the §Yforeign ministry§!, and the estimates will not stretch to all of them."
 ITA_t_the_answer_at_genoa: "The Answer at Genoa"
 ITA_t_the_answer_at_genoa_desc: "Whatever we said about the Genoa decree is being read aloud in 90 prefectures. Nobody yet knows what it will mean when the next port stops, and until then the ministry is weaker and the work goes slower."
 ITA_t_the_three_memoranda: "The Staff Papers"
 ITA_t_the_three_memoranda_desc: "The War Ministry, the navy and the Treasury have each sent the King a paper explaining why the other two should be cut. Until we choose between them, every department is spending the same lira twice. The services drill hard to prove their case, and the army's organisation suffers for it."
 ITA_t_luzzatti_at_the_treasury: "Luigi Luzzatti"
 ITA_t_luzzatti_at_the_treasury_desc: "The banker who founded the people's banks and has balanced more budgets than any man in the Chamber. He will find the money, and he will tell you exactly whose it was."
 ITA_a_the_book_carried_over_tt: "§GThe prefects' book does not vanish with the ministry.§! A third of the 90 prefectures carry over into the §Ystanding machine§! the next government inherits."
 ITA_a_genoa_is_remembered_tt: "§GThe ministry that gave way at Genoa is trusted a little further.§! The street goes home before the new Chamber sits."
 ITA_a_genoa_is_remembered_badly_tt: "§RThe ministry that backed the prefect at Genoa starts with an enemy already organised.§! It has political power and no goodwill."
 ITA_a_the_machine_carries_it_tt: "§YThe prefects deliver the majority§!, and the ministry owes favours it has not yet been asked for."
 ITA_a_the_bargain_is_made_in_the_lobby_tt: "§GWithout a machine, the arrangement is made group by group in the lobby.§! It is cheaper and it is less reliable."
 ITA_a_nitti_at_the_board_tt: "Francesco Saverio Nitti becomes available as a political advisor."
 ITA_a_nitti_at_the_board: "Nitti at the Board of Trade"
 ITA_a_nitti_at_the_board_desc: "The Southern economist who counted what the North had taken and published the figure. He is not popular in Milan and he is entirely correct."
 ITA_a_the_street_answers_sonnino_tt: "§RThe street answers the call to return to the Statuto, the kingdom's constitution, before the Chamber can.§! A §Rbayonet§! is spent putting that answer down."
 ITA_a_the_country_is_quiet_enough_tt: "§GThe country is quiet enough to be governed from a desk in Rome§!, and the prefects are told so in writing."
 ITA_a_salandra_on_the_right: "Salandra on the Right"
 ITA_a_salandra_on_the_right_desc: "A professor of administrative law from Puglia who believes the Statuto, the kingdom's constitution, meant what it said. He is courteous, immovable, and convinced the Chamber is a nuisance the Crown tolerates."
 ITA_a_turati_has_somewhere_to_stand_tt: "§GThe chambers of labour, the local union offices, give Turati an address we can negotiate with.§! Somebody can now accept our offer, so the offer is worth making."
 ITA_a_the_offer_is_made_to_nobody_tt: "§ROur offer goes to a party the law does not recognise.§! The hard-line socialists read it out at their congress as proof that we only want to buy them."
 ITA_a_bonomi_at_the_door: "Bonomi Outside the Ministry"
 ITA_a_bonomi_at_the_door_desc: "Ivanoe Bonomi is a reformist socialist who will take a ministry if we offer him one. His own party will expel him for it, and he is worth more to us than his party will admit."
 ITA_a_pledges_given_tt: "§Y[?ITA_pledges|0] pledges outstanding§!. Each one falls due within the year, and the Chamber will ask what we built with it."
 ITA_a_the_circular_only_confirms_it_tt: "§GThe prefects were given these instructions by an earlier ministry.§! The circular only puts a signature on a practice, and it costs nothing to send."
 ITA_a_the_ninety_are_written_to_tt: "§R90 prefectures are told in writing which mayor to support.§! If the circular is ever read out in the Chamber, we will have to answer for it."
 ITA_a_the_garrisons_come_out_tt: "§GWe take a garrison out of the industrial quarters.§! A §Gbayonet is returned§!, and the floor under the piazza drops with it."
 ITA_a_nothing_to_withdraw_tt: "§GThere were no troops in the disputes to withdraw.§! The declaration costs us nothing, and it is believed."
 ITA_a_the_two_neutralities_agree_tt: "§GThe Chamber and the ministry say the same thing about strikes.§! The arbitration boards are used instead of the troops."
 ITA_a_a_bayonet_is_spent_tt: "§RA bayonet is spent.§! Troops turned on Italians raise the floor under the piazza for good, and every bayonet is counted at the end."
 ITA_a_dissolving_what_we_recognised_tt: "§RWe dissolve by decree the associations we recognised by law last session.§! The socialists no longer have to argue that the state takes sides, because we have proved it."
 ITA_a_the_prefects_had_the_lists_ready_tt: "§GThe prefects already had the lists.§! The dissolutions take one morning, and nobody outside the quarter hears of them for a week."
 ITA_a_a_ministry_without_a_chamber_tt: "§RThe Chamber will not vote the estimates, so we stop asking it to.§! We lose the majority we paid for, and the street notices."
 ITA_a_the_groups_are_informed_tt: "§GThe parliamentary groups are told after the fact and accept it.§! They accept it because the prefects hold their seats."
 ITA_a_the_census_wrote_the_rolls_tt: "§GThe published census figures wrote the new voting registers.§! Nobody can say the rolls were drawn to suit us, because they were drawn before we knew what we wanted."
 ITA_a_nobody_knows_who_the_voters_are_tt: "§R6 million names go onto the voting rolls, and nobody in Rome knows how they will vote.§! Nobody in Milan knows either."
 ITA_a_the_register_reprinted: "The New Voting Register"
 ITA_a_the_register_reprinted_desc: "The electorate is four times the size it was, and every bargain struck with the old one is worth a fraction of its price. The prefects are rewriting a register they spent a decade perfecting, and nobody yet knows how the new voters will vote."
 ITA_a_the_chambers_deliver_the_votes_tt: "§GThe recognised chambers of labour deliver the reformist votes they promised.§! The bargain holds because both sides can be held to it."
 ITA_a_a_promise_without_an_address_tt: "§RThe reformists promise support we have no way of collecting.§! We get political power out of it and very little else."
 ITA_a_the_act_is_already_on_the_book_tt: "§GThe special laws are already on the statute book.§! This vote only pays for them, and it passes in an afternoon."
 ITA_a_the_north_pays_for_it_tt: "§RThe North pays for the works in the South.§! The Lombard deputies will say so at every reading of the bill."
 ITA_a_a_counterparty_with_an_address_tt: "§GThe Council of Labour sits with unions that exist in law.§! Disputes are recorded and argued instead of being broken up."
 ITA_a_an_office_that_counts_strangers_tt: "§RThe office counts strikes called by unions the law does not recognise.§! It gives us good figures and no hold on anybody."
 ITA_a_facta_at_the_council: "Facta at the Council"
 ITA_a_facta_at_the_council_desc: "Luigi Facta is an amiable lawyer from Piedmont, and he can be relied on to keep a meeting calm. He is always in the room, and rarely in the room where the decision is taken."
 ITA_a_no_pledge_survives_a_decree_tt: "§REvery pledge we gave the Chamber lapses once the Chamber stops deciding.§! We owe nobody anything, and nobody owes us anything."
 ITA_a_the_provinces_stop_answering_tt: "§RTwo provinces stop answering Rome altogether.§! We are governing by decree in places that no longer read the decrees."
 ITA_a_the_country_does_not_notice_yet_tt: "§GThe country is quiet and the decrees pass unread.§! The prefects gain every power the Chamber has lost."
 ITA_a_the_order_is_used_at_once_tt: "§RThe standing order is used within the month.§! A §Rbayonet§! is spent, and the quarter remembers which regiment came."
 ITA_a_the_order_lies_in_the_drawer_tt: "§GThe order lies unused in every prefecture.§! It does more good in the drawer than it would in the street."
 ITA_a_the_po_landowners_withdraw_tt: "§RThe grain growers of the Po break with us.§! The machine loses the most reliable province it had."
 ITA_a_the_south_can_afford_it_tt: "§GThe South has its water and its roads, and can take the loss of the tariff.§! Bread gets cheaper and nothing else gets worse."
 ITA_a_the_treasury_loses_a_certainty_tt: "§RThe Treasury loses its surest revenue, and the South gets nothing in exchange.§! Bread is cheaper in provinces that have no road to carry it."
 ITA_a_he_sits_beside_the_men_who_fired_tt: "§RThe socialist minister sits beside the men who signed the orders to fire.§! His own party will not let him forget it."
 ITA_a_no_blood_between_them_tt: "§GThere is no blood between us and the party we have just taken in.§! The arrangement can last."
 ITA_a_the_provinces_did_not_wait_tt: "§YThe parish committees have been voting for two years already.§! The Vatican is only asked to bless an arrangement our prefects made themselves."
 ITA_a_the_right_asks_first_tt: "§YThe question comes from Sonnino's ministry, which is not the ministry the Vatican expected to hear from.§! The answer is warmer for it."
 ITA_a_the_prefects_are_told_quietly_tt: "§YWe ask the Vatican for nothing and promise it nothing.§! The prefects are simply told that a Catholic committee is not an unlawful assembly."
 ITA_a_boselli_between_the_two_romes: "Boselli, Acceptable to the Vatican"
 ITA_a_boselli_between_the_two_romes_desc: "Paolo Boselli is an old Ligurian liberal. The King's palace trusts him and the Vatican tolerates him, and in this kingdom that is rarer than ability."
 ITA_a_the_same_ninety_seats_tt: "§RThe parish committees already hold these seats.§! The Vatican's permission buys us nothing new, and the bishops now expect to be paid twice."
 ITA_a_ninety_seats_change_hands_tt: "§GSeats change hands across the north without one voter changing his mind.§! Both sides deny that there is any understanding."
 ITA_a_the_countryside_owes_us_nothing_tt: "§RThe rural banks, the leagues and the mutual societies stay outside the state altogether.§! A prefect has nothing to offer them and no hold on them."
 ITA_a_the_provinces_disobey_rome_tt: "§YThe parish committees keep voting after the Vatican forbids it.§! We take the seats, and the bishops are furious with everybody."
 ITA_a_the_leagues_stay_outside_tt: "§RThe countryside is organised by men who owe the state nothing.§! Some of them are socialists and some of them are priests."
 ITA_a_the_works_are_already_standing_tt: "§GThe aqueducts and the roads are already standing.§! We answer the South with finished works instead of promises, and one pledge is redeemed."
 ITA_a_promised_again_from_rome_tt: "§RWe promise the South works again, and we have built none yet.§! The Southern deputies vote for it and expect to be paid."
 ITA_a_a_majority_resting_on_bayonets_tt: "§RThe settlement rests on troops as much as on votes.§! Everyone in the Chamber knows it, and the country knows it better."
 ITA_a_a_majority_that_can_be_counted_tt: "§GWe can count our votes before we ask for them, and we have fired on nobody to get them.§! The King is more popular than he has been since Monza."
 ITA_e_the_returns_are_written_to_suit_tt: "§RThe prefects send back the figures we want to read.§! The census is worth less than it cost, and the machine is trusted less for it."
 ITA_e_the_figures_come_back_honest_tt: "§GThe returns come back honest, because nobody had a reason to falsify them.§! Rome learns for once what the country actually holds."
 ITA_e_daneo_at_public_instruction: "Daneo at Public Instruction"
 ITA_e_daneo_at_public_instruction_desc: "Edoardo Daneo is the minister who took the elementary schools off the communes and put them on the state's own payroll. Half of Italy will learn to read because of it."
 ITA_e_the_valleys_are_bought_tt: "§RThe high valleys are bought out from under the communes that grazed them.§! Their objections never reach Rome."
 ITA_e_the_south_was_paid_first_tt: "§GThe South was paid before a single wire went up.§! The Southern deputies vote the transmission credits through without opposition."
 ITA_e_every_kilometre_north_of_the_po_tt: "§REvery kilometre of the line runs north of the Po, and the Chamber can read a map.§! The Southern vote is bought with a promise instead of a road."
 ITA_e_the_plate_is_ours_tt: "§YWe roll our own armour plate at Terni instead of buying it in Sheffield.§! It costs more, and no foreign government can cut off the supply."
 ITA_e_the_navy_signs_the_order_tt: "§GThe navy signs the armour plate order it has been promising for 20 years.§! Terni runs full, and the constructors build with Italian steel."
 ITA_e_the_works_wait_for_a_customer_tt: "§RThe navy is the only buyer of armour plate, and it has not voted the money.§! Terni rolls rail and shell steel instead, and waits."
 ITA_e_the_fitters_of_turin_tt: "Turin's trained fitters become the pool of skilled men the rest of our industry hires from."
 ITA_e_the_quarter_has_a_committee_tt: "§GThe new quarter gets a recognised chamber of labour, the local union office, before it has a grievance.§! Disputes are argued there instead of fought in the street."
 ITA_e_thirty_thousand_in_one_quarter_tt: "§R30,000 men are packed into one quarter of one city with no lawful way to complain.§! They will find an unlawful one."
 ITA_e_the_communes_lose_their_pasture_tt: "§RWhole communes are told their pasture is now a reservoir the state has bought.§! The compensation is worked out in Rome, not with them."
 ITA_e_the_current_stops_failing_in_august_tt: "§GThe reservoirs hold the snowmelt, and the mills keep turning through a dry August.§! Water power has finally proved it can carry our industry."
 ITA_e_the_leash_goes_slack_tt: "§GA strike at Cardiff no longer puts out the furnaces of the industrial triangle.§! We can say so in the Chamber and be believed."
 ITA_e_no_longer_on_paper_tt: "§GItaly stops being a great power only on paper.§! Our industry is finally the size the flag claims it is."
 ITA_e_the_bill_is_already_law_tt: "§GThe Chamber has already voted the special laws.§! This is the building programme itself, and the ground is already surveyed."
 ITA_e_the_deputies_want_the_credit_tt: "§YOur deputies take the credit for the laws, and the prefects collect on it.§! That is how the South has always been governed."
 ITA_e_the_cheapest_army_tt: "§G2 million Italians a year stop losing their working season to malaria.§! No other measure puts as many fit men in the ranks for as little."
 ITA_e_the_census_named_the_districts_tt: "§GThe census named the malarial districts, so the state quinine goes where it is needed.§! The death rate falls within two years."
 ITA_e_the_shops_sell_where_they_can_tt: "§RThe state quinine is sold in tobacco shops§!, and the tobacco shops are not where the malaria is."
 ITA_e_the_pumps_have_current_tt: "§GAlpine power drives the pumps of the Sele aqueduct.§! Puglia gets water that no longer depends on a wet winter."
 ITA_e_the_sele_is_a_long_way_off_tt: "§RThe aqueduct is surveyed, costed and begun, and this vote will not finish it.§! We give the pledges anyway."
 ITA_e_the_promises_are_redeemed_tt: "§GThe pledges we gave the Southern deputies are paid in finished works.§! For once the Chamber is owed nothing."
 ITA_e_they_stayed_and_it_was_worth_it_tt: "§GThe men who did not sail now have land worth staying on.§! The census returns show the land reform working."
 ITA_e_the_ships_still_leave_tt: "§YThe works are built and the emigrant ships still sail, carrying more men who mean to come home.§! We have slowed the emigration without stopping it."
 ITA_e_the_number_is_printed_tt: "§R600,000 emigrants a year is now an official published figure.§! Every opposition paper in Italy prints it on the front page."
 ITA_e_the_number_is_an_estimate_tt: "§GThe emigration figure stays an estimate we can argue with.§! Nobody has to answer for it in the Chamber yet."
 ITA_e_a_consul_at_the_far_end_tt: "§GA consul meets every inspected ship at the far end of the crossing.§! The agents lose the traffic, and the emigrants keep their fare."
 ITA_e_the_landowners_break_with_us_tt: "§RThe great landowners of the South break with us.§! The machine loses the men who used to deliver its Southern seats."
 ITA_e_they_have_lost_twice_tt: "§RThe landowners have lost the grain duty and are now losing the estates.§! They will fight every clause of the bill and pay for the fight."
 ITA_e_they_still_have_the_tariff_tt: "§YThe landowners keep the grain tariff and lose only the land they never worked.§! They still fight us, but they fight for less."
 ITA_e_our_blood_beyond_the_sea: "The Italians Abroad"
 ITA_e_our_blood_beyond_the_sea_desc: "4 million Italians live in Argentina, Brazil and the United States. They have Italian schools, Italian chambers of commerce and consuls who answer to our foreign ministry. They are no longer a population we have lost, and one day we will ask them for something."
 ITA_e_water_first_then_grain_tt: "§GThe aqueduct was built before the land was broken, so the ground holds the water it is given.§! One pledge is paid in grain."
 ITA_e_dry_ground_stays_dry_tt: "§RThe estates are broken up and the ground is still dry.§! The families who stay face a harder decade than the ones who sailed."
 ITA_e_neutrality_under_sonnino_tt: "§RA ministry that restored the Statuto, the kingdom's constitution, now says it will not take sides in strikes.§! Nobody believes it, and the Right is furious anyway."
 ITA_e_neutrality_under_the_bloc_tt: "§GThe Popular Bloc's ministry is believed when it says the army will stay in barracks.§! The strikes end sooner."
 ITA_e_neutrality_as_giolitti_meant_it_tt: "§GGiovanni Giolitti announces the policy he invented himself.§! Milan and the Chamber both take it at face value."
 ITA_e_the_guns_are_remembered_tt: "§RThe declaration is read out in quarters where the army has already fired.§! It is taken as an insult, not as a concession."
 ITA_e_the_prefect_loses_a_lever_tt: "§RA prefect can no longer dissolve a recognised chamber of labour with his signature.§! The machine loses a lever it used every session."
 ITA_e_recognition_after_a_volley_tt: "§GRecognition comes after the shooting, and is accepted as an apology.§! A garrison leaves the quarter."
 ITA_e_recognition_before_a_volley_tt: "§GRecognition comes before anybody has been shot, which is why it works.§! The chambers of labour negotiate instead of agitating."
 ITA_e_the_hall_that_is_unavailable: "Meeting Halls Refused"
 ITA_e_the_hall_that_is_unavailable_desc: "There is always a reason. The roof is unsafe, the licence has lapsed, the last meeting left damage. The prefecture forbids nothing and the meeting never happens, and every man turned away at the door tells 40 others."
 ITA_e_the_neutral_state_looks_away_tt: "§RWe promised to stay neutral, and we are caught doing this in our own name.§! The reformists we courted read the file out in the Chamber."
 ITA_e_nobody_pretended_otherwise_tt: "§GWe never claimed to be neutral, so nothing is exposed.§! The prefects do the work and the Chamber says nothing."
 ITA_e_the_teacher_is_appointed_from_rome_tt: "§RThe schoolmaster stops being the mayor's man and becomes the state's.§! A prefect loses a post he could always fill with a friend."
 ITA_e_the_bishops_ask_about_the_inspectors_tt: "§RThe bishops who delivered the seats want to know who will inspect the schools.§! We spend a pledge on the answer, and the answer satisfies nobody."
 ITA_e_the_communes_are_relieved_tt: "§GThe poorest communes are relieved of a charge they could never carry.§! Nobody objects, because nobody loses anything by it."
 ITA_e_rome_already_conceded_it_tt: "§RThe Vatican has already lifted its ban on Catholics voting.§! The parish arrangement now buys seats we were being given for nothing."
 ITA_e_the_committee_acts_without_rome_tt: "§GThe parish committees act without waiting for the Vatican, and deliver the votes anyway.§! The prefects gain a curate in every commune."
 ITA_e_the_account_is_settled_tt: "§GEvery pledge of the last decade is set against what we actually built.§! The Chamber is owed far less than it feared."
 ITA_e_ten_years_without_a_volley_tt: "§G10 years, and the army was never turned on Italians.§! We have put no floor under the piazza ourselves."
 ITA_e_one_country_held_down_tt: "§RThe two Italies are one kingdom, and one half of it is held down by force.§! Every bayonet we spent is counted at the end."
 ITA_arm_tt_the_ministry_wants_it_read: "We mean the report to be read, and the prefectures are told so. §YProvinces worked +6§!."
 ITA_arm_tt_the_ministry_wants_it_shelved: "The report is filed with our compliments and no instruction attached. Nothing follows from it."
 ITA_arm_tt_porro_at_the_desk: "Carlo Porro takes the Operations desk and may be appointed as army chief."
 ITA_arm_tt_nava_kept: "Luigi Nava is confirmed at the head of the promotion list, and is now formally §Rof the old guard§!."
 ITA_arm_tt_diaz_noticed: "Major Armando Diaz is noticed by the examining board and gains §Yorganizer§!."
 ITA_arm_tt_pollio_on_the_list: "Alberto Pollio's name stands high on the reopened list and he may be appointed as army chief."
 ITA_arm_tt_the_lists_agree: "The emigration registers and the call-up registers are now one register. §Y8,000 men§! answer the call who would never have been found."
 ITA_arm_tt_the_class_sailed: "No register was kept, and the year's recruits have sailed. §R4,000 men§! are struck off, and the Chamber hears which districts they came from."
 ITA_arm_tt_the_prefects_guess: "With no emigration office, the prefects guess how many men of military age are left, as they always have."
 ITA_arm_tt_a_pledge_is_given: "We promise a public work to buy the vote. §YPledges outstanding +1§!, and the Chamber will remember if we do not build it."
 ITA_arm_tt_the_duty_confirmed: "§RThe circular confirms the duty.§! The army stays available to the prefects, and Bayonets §Y+1§! raises the floor under the piazza for good."
 ITA_arm_tt_the_duty_refused: "§GThe circular writes the army out of the streets.§! The prefects must find another instrument, and are given 20 more provinces to work."
 ITA_arm_tt_three_years_taught: "Three years with the colours is long enough to teach a man to read and to drill him afterwards."
 ITA_arm_tt_two_years_taught: "Two years with the colours leaves time for the drill or the alphabet, and the inspectors want the drill."
 ITA_arm_tt_the_schools_help: "The Kingdom's schools have already done half of it, and the regiment is handed literate recruits for the first time."
 ITA_arm_tt_the_regiment_teaches_alone: "There are no state schools worth the name, so the regiment teaches the alphabet out of its own drill hours."
 ITA_arm_tt_pecori_to_the_alps: "Guglielmo Pecori Giraldi is sent to the north-eastern command and learns the ground: §Ytrait_mountaineer§!."
 ITA_arm_tt_the_ally_is_the_enemy: "§ROur foreign ministry is renewing an alliance that our own army staff has just drawn up a war plan against.§!"
 ITA_arm_tt_the_gun_is_ours_batteries: "The Turin and Ansaldo lines are already tooled, and the mountain gun comes off them within a year."
 ITA_arm_tt_the_gun_is_bought_batteries: "Every mountain barrel comes from Essen with a bill attached, and every delivery has to be voted again by the Chamber."
 ITA_arm_tt_the_alpini_take_the_guns: "The Alpini, our mountain troops, now have the establishment to carry the batteries, and the mountain divisions are complete."
 ITA_arm_tt_vienna_up_6: "Vienna's confidence in Rome rises by §G6§!. An army looking at Africa is not an army looking at the Isonzo."
 ITA_arm_tt_the_treaty_embarrasses: "We have just guaranteed Menelik's borders, and we are now voting an army to cross them."
 ITA_arm_tt_the_debt_is_open: "We leave Adwa unavenged on the record, and the officer corps is told in public that we mean to avenge it."
 ITA_arm_tt_pollio_stays: "Alberto Pollio is confirmed as chief of the army staff and keeps his defensive plans on the books."
 ITA_arm_tt_spingardi_reorganizes: "Paolo Spingardi takes the high command, and puts the ministry's contracts before the needs of the front."
 ITA_arm_tt_cadorna_takes_the_staff: "Luigi Cadorna is named chief of the army staff and orders the offensive he has been demanding."
 ITA_arm_tb_the_continuity_school: "The Continuity School"
 ITA_arm_tb_the_administrators_office: "The Administrator's Office"
 ITA_arm_tb_the_offensive_school: "The Offensive School"
 ITA_arm_pollio_confirmed: "Pollio, Chief of the Staff"
 ITA_arm_spingardi_confirmed: "Spingardi, at the Ministry"
 ITA_arm_cadorna_confirmed: "Cadorna, Chief of the Staff"
 ITA_arm_tt_the_battalions_are_doubled: "The Eritrean depot already exists. This is a second levy on the same highlands, not a new army."
 ITA_arm_tt_the_battalions_are_raised: "The Eritrean battalions are raised, paid and given a depot at Massawa."
 ITA_arm_tt_the_strike_against_the_war: "§RThe working quarters strike against the landing, and we break the strike.§! Bayonets §Y+1§!."
 ITA_arm_tt_the_ascari_land_first: "The ascari, our colonial troops, go ashore first as they always have, and the Italian brigades follow."
 ITA_arm_tt_the_marine_was_waiting: "The Ministry of Marine had the estimate drawn up before the ministers met."
 ITA_arm_tt_nobody_asked_for_it: "There is no naval programme to give the money to, so it goes back to the Treasury and buys us a majority instead."
 ITA_arm_tt_the_short_service_pays: "Two years with the colours and a register kept up to date turn the reserve system into arithmetic instead of a hope."
 ITA_arm_tt_the_long_service_resists: "Three years with the colours and a smaller establishment are the same argument twice, and the colonels say so."
 ITA_arm_tt_spingardi_signs_it: "Paolo Spingardi signs the establishment and may be appointed to the high command."
 ITA_arm_tt_the_verdict_is_remembered: "The army that lost Adwa has now lost the estimates as well, and every officers' mess in the country says so."
 ITA_arm_tt_the_corps_takes_it_quietly: "Adwa has already been answered, so the officer corps takes the cut as a question of money and nothing more."
 ITA_arm_tt_frugoni_takes_the_cut: "Pietro Frugoni is left to administer the reduction and grows §Ytrait_cautious§!."
 ITA_arm_tt_nava_retired: "Luigi Nava is retired from the active list."
 ITA_arm_tt_diaz_promoted: "Armando Diaz is promoted over three seniors and gains §Yorganizer§!."
 ITA_arm_tt_pollio_confirmed: "Alberto Pollio is confirmed as chief of the army staff by seniority and may be appointed as army chief."
 ITA_arm_the_frontier_threat: "Italy surveys the Alpine frontier"
 ITA_arm_the_northeastern_threat: "Italy deploys its army to the north-east"
 ITA_arm_the_cadore_threat: "Italy fortifies the Cadore"
 ITA_arm_the_landing_threat: "Italy prepares a landing in Tripolitania"
 ITA_arm_tb_the_ansaldo_line: "The Ansaldo Line"
 ITA_arm_tb_the_second_levy: "The Second Levy"
 ITA_arm_tb_the_slipways_at_castellammare: "The Slipways at Castellammare"
 ITA_arm_tb_the_marine_takes_the_vote: "The Navy Wins the Vote"
 ITA_arm_tb_the_northeastern_regulations: "The North-Eastern Regulations"
 ITA_arm_tb_the_colonial_regulations: "The Colonial Regulations"
 ITA_n_tt_the_army_paid_for_this: "The army gave up its share, and the second erecting shop is roofed with the money."
 ITA_n_tt_the_chamber_paid_for_this: "Nobody gave anything up, so the building ways are lengthened out of the ordinary vote, and the deputies notice."
 ITA_n_tt_the_estimates_are_there: "The money crossed from the army to the navy last year. The ship fits inside a vote the Chamber has already granted."
 ITA_n_tt_the_estimates_are_not_there: "We ask the Chamber for a hull costing more than any it has voted, and the army's estimates are untouched."
 ITA_n_tt_viale_backs_the_ship: "Leone Viale carries the design through the technical committee and may be appointed to the high command."
 ITA_n_tt_vienna_down_4: "Vienna's confidence in Rome falls by §R4§!."
 ITA_n_tt_vienna_down_6: "Vienna's confidence in Rome falls by §R6§!."
 ITA_n_tt_the_study_confirms: "The war game confirms the line of battle we are already building, and the naval academy at Livorno says so in print."
 ITA_n_tt_the_study_condemns: "The war game condemns the committee's refusal of the all-big-gun design in 11 pages, and the Chamber reads every one of them."
 ITA_n_tt_cagni_reads_it: "Umberto Cagni reads the study twice and comes away a §Ybattleship_adherent§!."
 ITA_n_tt_paladini_takes_the_flotilla: "Osvaldo Paladini takes the night flotilla and gains §Ysuperior_tactician§!."
 ITA_n_tt_revel_takes_her: "Paolo Thaon di Revel is given the ship and becomes a §Ybattleship_adherent§! for the rest of his career."
 ITA_n_tt_the_third_hull_is_voted: "The army's estimates cover the third hull and the Leonardo da Vinci is ordered with her sisters."
 ITA_n_tt_the_third_hull_is_struck: "The committee strikes the third hull out of the programme and the class goes to sea two ships strong."
 ITA_n_tt_the_boats_go_abroad: "Portugal, Brazil and Russia send their orders to Venice, and the arsenal is paid to keep building."
 ITA_n_tt_the_army_already_gave_way: "The army gave up the estimates years ago. The high seas school costs the Chamber nothing new."
 ITA_n_tt_the_army_pays_for_it: "The money is taken from the War Ministry without its consent, and the officer corps hears about it after the vote."
 ITA_n_tt_the_boats_are_the_fleet: "The torpedo boats built at Venice stop being an experiment. They become our striking arm in the narrow sea of the Adriatic."
 ITA_n_tt_pola_was_already_building: "Vienna stopped trusting us before the credit was voted, and the slips at Trieste were occupied first."
 ITA_n_tt_pola_is_answered: "We answer the Austrian programme within a year, and we tell our ally politely that we noticed it."
 ITA_n_tt_acton_gets_the_squadron: "Alfredo Acton is given the Adriatic squadron and gains §Ysuperior_tactician§!."
 ITA_n_the_cuniberti_threat: "Italy designs the all-big-gun ship"
 ITA_n_the_pola_answer_threat: "Italy answers the Austrian dreadnought programme"
 ITA_n_tb_the_line_of_battle: "The Line of Battle"
 ITA_n_tb_the_flotilla_answer: "The Torpedo Flotilla"
 ITA_n_tb_the_dante_hull: "The Dante Hull"
 ITA_n_tb_the_cavour_hulls: "The Cavour Hulls"
 ITA_n_tb_the_boats_are_the_fleet: "The Torpedo Boat Fleet"
 ITA_w_tt_the_ledger_is_not_reopened: "Vienna's confidence in Rome keeps the figure it already had, instead of starting again from scratch."
 ITA_w_tt_tittoni_at_the_consulta: "Tommaso Tittoni takes the foreign ministry and can be hired as a political advisor."
 ITA_w_tt_the_base_is_on_the_table: "The Austrian delegation asks about our new naval base at Taranto, and Vienna's confidence in Rome falls by 5."
 ITA_w_tt_the_survey_is_on_the_table: "The Austrian delegation has our survey of the Alpine frontier in translation, and Vienna's confidence in Rome falls by 5."
 ITA_w_tt_vienna_believes_us: "Vienna believes our signature, and the military convention is written out in full."
 ITA_w_tt_vienna_does_not_believe_us: "Vienna files our signature and stops counting the Third Army in its plans."
 ITA_w_tt_the_timetable_is_agreed: "Berlin and Rome settle the railways, the mobilisation days and the crossing points."
 ITA_w_tt_the_timetable_is_not_agreed: "The German staff receives our officers and gives them a timetable it will not use."
 ITA_w_tt_pollio_goes_to_berlin: "Alberto Pollio goes to Berlin himself and may be appointed as army chief."
 ITA_w_tt_the_plan_is_taken_out: "The Isonzo deployment is taken out of the safe and issued to the army."
 ITA_w_tt_the_claim_without_a_plan: "We claim three provinces of a great power with no plan on file for taking them."
 ITA_w_tt_racconigi_is_read: "Vienna reads the Racconigi protocol within the month and stops believing us."
 ITA_w_tt_racconigi_stays_quiet: "Vienna still trusts Rome, and the protocol stays where the two courts left it."
 ITA_w_tt_tripoli_is_conceded_to_us: "Russia concedes Tripolitania to us in writing, in exchange for our support at the Straits."
 ITA_w_tt_the_depot_already_exists: "The depot at Massawa is already there, so the new battalions are reinforcements."
 ITA_w_tt_the_battalions_are_raised: "The Eritrean battalions are raised and given a division template of their own."
 ITA_w_tt_the_strike_against_the_expedition: "§RThe working quarters strike against the second expedition, and troops break the strike.§! Bayonets §Y+1§!."
 ITA_w_tt_the_army_of_africa_marches: "We have a colonial army. The supply train works past the last well, and the column marches at full strength."
 ITA_w_tt_no_army_was_built_for_this: "We never voted a colonial army, so the column marches with brigades shipped out of Naples."
 ITA_w_tt_the_general_strike_is_broken: "§RThe general strike against the Libyan war is broken by troops.§! Bayonets §Y+1§!."
 ITA_w_tt_the_country_wants_it: "The piazza is quiet, and the war is popular before the first shot is fired."
 ITA_w_tt_the_fleet_covers_the_landing: "Our high seas fleet has the hulls and the practice to land a division and keep it supplied."
 ITA_w_tt_the_fleet_cannot_leave: "§RThe fleet was built for the Adriatic and cannot cover an operation outside it.§!"
 ITA_w_tt_vienna_up_8: "Vienna's confidence in Rome rises by §G8§!: we bought the province instead of invading it."
 ITA_w_tt_the_bank_holds_the_province: "We buy Libya instead of storming it. §RThe desert war will never be fought.§!"
 ITA_w_tt_the_army_was_promised_a_landing: "We voted an army for Africa and give it a banking concession instead."
 ITA_w_tt_the_pledge_is_kept: "We keep the Aegean islands instead of handing them back."
 ITA_w_tt_nothing_to_hand_back: "We took nothing as security, so the Porte signs on our word and keeps its officers in the interior."
 ITA_w_tt_the_army_is_already_there: "Our colonial army is already on the ground, and the survey is done by men who live there."
 ITA_w_tt_a_survey_and_nothing_more: "We send a survey party and build two roads. No new garrison goes with them."
 ITA_w_threat_racconigi_is_read: "Italy bargains with Russia behind its allies"
 ITA_w_threat_the_bank_instead: "Italy buys Tripoli instead of invading it"
 ITA_w_threat_the_fourth_shore: "Italy annexes the Libyan provinces"
 ITA_w_tb_the_convention: "The Military Convention"
 ITA_w_tb_the_plan_is_taken_out: "The Isonzo Plan"
 ITA_w_tb_the_second_levy: "The Second Levy"
 ITA_w_tb_the_landing_is_covered: "The Landing Is Covered"
 ITA_end_tt_the_army_looks_north: "The verdict of the decade: §Ythe army was built to fight the ally.§!"
 ITA_end_tt_the_army_looks_south: "The verdict of the decade: §Ythe army was built to collect a debt in Africa.§!"
 ITA_end_tt_the_army_gave_way: "The verdict of the decade: §Ythe army gave up the estimates and the fleet spent them.§!"
 ITA_end_tt_the_fleet_can_leave: "The fleet can leave the Adriatic, and every ministry after this one will be asked why it has not."
 ITA_end_tt_the_sea_was_conceded: "The open sea was conceded in writing, and the coast is fortified because of it."
 ITA_end_tt_vienna_expects_nothing: "Vienna expects nothing from Rome and has written the Third Army out of its plans."
 ITA_end_tt_vienna_still_counts_on_us: "Vienna still counts the Third Army in its order of battle, whatever the Chamber says in public."
 ITA_end_tt_the_count_of_bayonets: "The army has been called out against Italians §Y[?ITA_bayonets|0]§! times."
 ITA_end_tt_the_barracks_answer: "The barracks circular is still in force, so troops enforce the adjournment. Bayonets §Y+1§!."
 ITA_end_tt_the_prefects_answer: "The army was written out of the streets, so prefects and police enforce the adjournment alone."
 ITA_end_tt_pelloux_is_recalled: "Luigi Pelloux is recalled to the King's service and may be appointed as a political advisor."
 ITA_end_tt_the_street_waits_and_watches: "The street gives the new ministry a year before it decides anything about it."
 ITA_end_tt_the_columns_are_recalled: "The columns in the Libyan interior are recalled to the coast in the ministry's first week."
 ITA_end_tt_the_barracks_are_remembered: "Every deputy on those benches has a constituent the army fired on, and the names are read out in the Chamber."
 ITA_end_tt_the_estimates_are_cut: "The new ministry cuts the battle fleet first when it goes through the estimates."
 ITA_end_tt_the_army_of_africa_is_recalled: "The army raised for Africa is ordered home without a battle."
 ITA_end_tt_nobody_built_it_for_this: "We never built an army for the interior, so we lose nothing by giving it up."
 ITA_end_threat_the_alliance_is_paper: "The Triple Alliance exists only on paper"
 ITA_w_the_military_convention: "The Military Convention"
 ITA_w_the_military_convention_desc: "Vienna and Berlin believe our signature. The Third Army's timetables are printed and the crossing points are surveyed. Our officers work with theirs on the real plan."
 ITA_w_the_word_that_is_doubted: "The Alliance Doubts Us"
 ITA_w_the_word_that_is_doubted_desc: "We renewed the treaty, and nobody on the other side of the Alps believes a word of it. Our officers are received in Berlin and shown the timetables the German staff keeps for visitors."
 ita_dnc.860.t: "Vienna Doubts the Convention"
 ita_dnc.860.d: "Vienna answers within the month, in the tone kept for allies. Our undertaking is welcomed and noted. Our black cabinet, the office that opens other governments' post, has read the covering minute as well: Vienna does not expect us to perform the second half.\n\nSomebody there is well informed about the Chamber. We can send our staff to Berlin and prove them wrong, or say nothing and keep the political credit for use at home."
 ita_dnc.860.a: "Send the staff to Berlin and prove them wrong."
 ita_dnc.860.b: "Say nothing. Vienna can think what it likes."
 ita_dnc.862.t: "The Coast and the Interior"
 ita_dnc.862.d: "The treaty is signed and our flag goes up over five towns on the coast. Beyond the last palm the Senussi hold the wells, exactly as before. Our officers at Ouchy conceded autonomy because it was the only word the Porte would accept.\n\nThe columns have not been told. We can march them inland and take the province we paid for, or garrison the coast and leave the interior to the tribes."
 ita_dnc.862.a: "March the columns inland. We bought the whole province."
 ita_dnc.862.b: "Garrison the coast and leave the interior alone."
 ITA_victor_emmanuel_iii_int: "Vittorio Emanuele III"
 ITA_victor_emmanuel_iii_int_desc: "He came to the throne at 30, over his father's body, and almost everyone who meets him underestimates him. The generals call him the little king, and they take his signature all the same."
 ITADNC_air_the_field_at_centocelle: "The Rome Airfield"
 ITADNC_air_the_field_at_centocelle_desc: "Wilbur Wright flew before the King at Centocelle and taught two of our officers before he left. We shall keep the field and buy the machines. The engine is the difficulty, and Turin builds engines."
 ITA_o_the_board_of_promotion: "The Board of Promotion"
 ITA_o_the_board_of_promotion_desc: "A board decides promotion by a written rule, and the rule is on file. The army is better commanded, and a good many well-connected colonels are passed over."
 ITA_o_the_calendar_of_ranks: "Promotion by Seniority"
 ITA_o_the_calendar_of_ranks_desc: "Seniority decides everything, and nobody is offended. The ministry keeps a quiet army, and the generals get older every year."
 ITA_o_the_school_of_war: "The School of War"
 ITA_o_the_school_of_war_desc: "A staff course built on a problem the student can lose, marked by officers who say so plainly. The officers who come out of it can write an order and read a map."
 ITA_o_the_staff_answers: "The Staff Answers the Crown"
 ITA_o_the_staff_answers_desc: "War plans are made where the Chamber cannot see them, and the minister hears of them afterwards. The work goes faster, and the country has agreed to none of it."
 ITA_o_the_minister_answers: "The Minister Answers the Chamber"
 ITA_o_the_minister_answers_desc: "Every plan carries a signature, and the man who signed it can be questioned in the Chamber. The work is slower and costs more, and nobody has to guess who is responsible."
 ITA_o_the_pay_of_the_officer: "The Pay of the Officer"
 ITA_o_the_pay_of_the_officer_desc: "A junior officer can live on his pay and marry without putting down a deposit. Men who are not the sons of officers now apply, and the estimates carry the charge for good."
 ITA_o_the_list_that_is_printed: "The Printed Seniority List"
 ITA_o_the_list_that_is_printed_desc: "The list says who commands what, in what order, and why, and it is printed for anyone to read. An officer corps that knows where it stands trains faster and quarrels less."
 ITA_g_the_batteries_rearmed: "The Batteries Rearmed"
 ITA_g_the_batteries_rearmed_desc: "Quick-firing guns on new carriages, battery by battery, with the drill taught again each time. The field artillery is at last all of one pattern."
 ITA_g_ansaldo_of_genoa: "Ansaldo of Genoa"
 ITA_g_ansaldo_of_genoa_desc: "A second gunmaker that is not the state, with its own drawing office and its own view of the estimates. The tenders are now contested, and 30,000 men work in one valley."
 ITA_g_the_works_retooling: "The Works Are Retooling"
 ITA_g_the_works_retooling_desc: "The shops are being rebuilt around the new lathes, and they produce very little while the work lasts. Every firm that takes a first artillery order goes through it."
 ITA_g_the_gun_shop_at_terni: "The Gun Shop at Terni"
 ITA_g_the_gun_shop_at_terni_desc: "The state works roll armour plate on one side of the yard and bore gun barrels on the other. The same furnace pays for both. Umbria has the wages, and Rome has a gunmaker it owns."
 ITA_g_the_heavy_batteries: "The Heavy Batteries"
 ITA_g_the_heavy_batteries_desc: "Howitzers heavy enough to open masonry, with the tractors and the road parties they need. They move slowly, and no neighbour will believe they are for defence."
 ITA_g_the_shell_that_bursts: "The New Fuse"
 ITA_g_the_shell_that_bursts_desc: "One filling plant, one fuse, and a reserve of shells that has actually been counted. Far fewer rounds fall without going off, and a gunner can plan on the rest."
 ITA_c_the_arma_reinforced: "The Military Police Reinforced"
 ITA_c_the_arma_reinforced_desc: "More stations, more men, and Carabinieri who live where they work. Public order stops being a job for the army, and fewer men are left for the conscript intake."
 ITA_c_the_recruiting_of_the_arma: "Recruiting the Military Police"
 ITA_c_the_recruiting_of_the_arma_desc: "The new squadrons are filled from the same intake the line regiments were counting on. The best sergeants go first."
 ITA_c_the_guards_of_public_safety: "The Guards of Public Safety"
 ITA_c_the_guards_of_public_safety_desc: "Town guards under the police chief, with a stick and a written instruction. Crowds are handled by men trained for crowds, not by conscripts with live cartridges."
 ITA_c_the_mobile_squadrons: "The Mobile Squadrons"
 ITA_c_the_mobile_squadrons_desc: "Mounted detachments that can cross a province in a day and do not wait for a court order. The country districts are policed at last, and the squadrons are not gentle about it."
 ITA_c_the_troops_in_barracks: "The Troops Stay in Barracks"
 ITA_c_the_troops_in_barracks_desc: "No prefect may call out a battalion for public order without the ministry's leave. The regiments train instead of standing in squares, and the Crown calls it a weakness."
 ITA_c_the_oath_not_asked: "The Army Off the Streets"
 ITA_c_the_oath_not_asked_desc: "Two services with two sets of orders, and no soldier has been told to fire on his own town in 10 years. The barracks are steadier for it, and so is the country."
 ITA_c_the_questore_decides: "The Police Chief Decides"
 ITA_c_the_questore_decides_desc: "The police chief gives the order, and the colonel waits to be asked. Public order is settled by a civil officer who answers to the Interior."
 ITA_s_the_recruit_who_cannot_read: "The Recruit Who Cannot Read"
 ITA_s_the_recruit_who_cannot_read_desc: "The draft returns are printed province by province, and the figures are worse than anyone admitted. Training takes longer because every order has to be read aloud."
 ITA_s_the_regimental_primer: "The Regimental Primer"
 ITA_s_the_regimental_primer_desc: "An hour a day, a book, and an examination before discharge. Men go home able to read, and a corporal can be trusted with a written order."
 ITA_s_the_state_pays_the_teacher: "The State Pays the Teacher"
 ITA_s_the_state_pays_the_teacher_desc: "Elementary teachers go on the state's rolls, appointed and paid from Rome. The mayor loses a favour to hand out, the teacher gains a career, and the school opens on time."
 ITA_s_the_normal_schools: "The Teacher Training Colleges"
 ITA_s_the_normal_schools_desc: "Training colleges with paid places, and a duty to serve wherever the ministry sends them. The empty posts in the South begin to fill with people who chose the work."
 ITA_s_a_kingdom_that_reads: "A Kingdom That Reads"
 ITA_s_a_kingdom_that_reads_desc: "The conscript reads his orders, the workman reads his contract, the elector reads his newspaper. Everything the kingdom does becomes cheaper, and harder to manage quietly."
 ITA_s_the_evening_classes: "The Evening Classes"
 ITA_s_the_evening_classes_desc: "Classes in the barracks and the town halls for men the schools missed. It costs little, and a great many men can sign their own pay-sheet at the end of it."
 ITA_m_the_map_of_the_fever: "The Malaria Map"
 ITA_m_the_map_of_the_fever_desc: "Every malarial commune is named, mapped and given a quinine station of its own. Men who were too sick to work in August are fit, and the draft finds them."
 ITA_m_the_ground_drained: "The Marshes Drained"
 ITA_m_the_ground_drained_desc: "Ditches, pumps and embankments paid for by the state, from the marshes outside Rome to the plain of Campania. Ground that used to kill people now grows crops."
 ITA_m_the_sulphur_consortium: "The Sulphur Cartel"
 ITA_m_the_sulphur_consortium_desc: "One buyer, one price, and the whole output of Sicily. The trade survives, and every mine owner on the island now has a stake in the ministry's policy."
 ITA_m_the_children_out_of_the_mines: "The Children Out of the Mines"
 ITA_m_the_children_out_of_the_mines_desc: "A minimum age, inspectors who may go down a pit, and an end to the loan a father takes against his son's work. Less sulphur comes up, and grown men carry it."
 ITA_m_the_third_class_deck: "The Third-Class Deck"
 ITA_m_the_third_class_deck_desc: "Subsidised lines, inspected decks, and a clause that lets the state take the ships. The same hulls carry our emigrants and can be called up as auxiliaries in a fortnight."
 ITA_air_the_brigade_of_specialists: "The Brigade of Specialists"
 ITA_air_the_brigade_of_specialists_desc: "A shed, a section, and a line in the estimates for balloons, kites and whatever comes next. It is the cheapest unit in the army, and the men in it learn fast."
 ITA_air_the_airship_park: "The Airship Park"
 ITA_air_the_airship_park_desc: "Semi-rigid airships with a hall, a gas plant and trained crews. They see further than any cavalry patrol, and a bad afternoon of weather can bring one down."
 ITA_air_the_field_at_centocelle: "The Rome Airfield"
 ITA_air_the_field_at_centocelle_desc: "A flying ground outside Rome, imported machines, and officers learning on them. The engines are the difficulty, and they come from the motor works at Turin."
 ITA_air_the_battalion_of_aviators: "The Battalion of Aviators"
 ITA_air_the_battalion_of_aviators_desc: "A proper unit with a depot, a school and a place in the estimates. Flying becomes a career an officer can make, instead of a loan from his regiment."
 ITA_o_tt_the_board_has_a_rule: "Promotion already goes by examination, so the board has a rule to apply and applies it."
 ITA_o_tt_brusati_is_struck_off: "Roberto Brusati fails the new standard and leaves the active list."
 ITA_o_tt_the_board_reads_the_calendar: "Seniority is still the law, so the board can only confirm what the seniority list has already decided."
 ITA_o_tt_the_crown_names_them: "The Crown keeps the appointment of general officers and the Chamber is informed afterwards."
 ITA_o_tt_the_chamber_reads_the_list: "The list is laid before the Chamber, and the deputies read every name on it."
 ITA_o_tt_the_ministry_signs_quietly: "The ministry signs the list and lets the interested parties hear of it privately."
 ITA_o_tt_porro_teaches: "Carlo Porro may be appointed as a theorist."
 ITA_o_tt_the_staff_answers_the_crown: "The Chief of Staff reports to the King and the war plans stay out of the Chamber."
 ITA_o_tt_the_minister_answers_the_chamber: "The Minister of War signs the plans and answers for them in the Chamber."
 ITA_o_tt_spingardi_takes_the_ministry: "Paolo Spingardi is available for the high command."
 ITA_o_tt_the_grievance_is_answered: "The officers' grievance has been answered."
 ITA_o_tt_the_list_is_public: "The seniority list is printed and the King is credited with it."
 ITA_o_tt_the_list_is_a_courtesy: "The list is printed, but the appointments behind it are still arranged."
 ITA_o_tt_cadorna_is_reached: "Luigi Cadorna reaches a command and brings his own convictions with him."
 ITA_o_tt_diaz_is_reached: "Armando Diaz reaches a staff appointment."
 ITA_g_tt_the_carriage_is_made_here: "The recoil carriage is built under licence in our own shops."
 ITA_g_tt_the_carriage_comes_by_rail: "The guns arrive complete from Essen and the money leaves with the train."
 ITA_g_tt_the_licence_comes_from_le_creusot: "Ansaldo builds to French drawings, and Paris is pleased to sell them."
 ITA_g_tt_the_licence_comes_from_essen: "Ansaldo builds to German drawings, and the alliance is reassured."
 ITA_g_tt_the_park_faces_north: "Nobody pretends the heavy artillery is meant for Africa."
 ITA_g_tt_the_park_is_shown_to_the_ally: "The heavy artillery is shown to the allied attachés, who are meant to notice it."
 ITA_c_tt_somebody_has_to_do_it: "The army is out of the streets, so the Carabinieri take the whole duty."
 ITA_c_tt_the_regiments_keep_the_duty_too: "The regiments keep the duty as well, and the Carabinieri are only an addition."
 ITA_c_tt_the_guards_are_told_to_carry_no_rifle: "The guards go into a crowd with a stick and a written instruction, and nothing else."
 ITA_c_tt_the_guards_are_told_to_clear_the_square: "The guards are ordered to clear the square, and they are armed to do it."
 ITA_c_tt_the_volleys_are_on_the_record: "One volley is struck off the count of bayonets."
 ITA_c_tt_nothing_to_undo: "The troops have not fired on the country, and there is nothing to undo."
 ITA_c_tt_milan_is_written_out: "The Milan precedent, firing on a crowd with artillery, is struck out of the standing orders."
 ITA_c_tt_the_streets_are_quiet_enough_to_try_it: "The streets are quiet enough that the settlement can be made permanent."
 ITA_c_tt_the_streets_are_not_quiet_and_it_is_tried_anyway: "The streets are not quiet, and the settlement is made anyway."
 ITA_s_tt_the_figure_is_printed_with_the_census: "The literacy return is printed beside the census and cannot be argued away."
 ITA_s_tt_the_figure_stays_in_the_ministry: "The literacy return stays in the ministry, where it can be managed."
 ITA_s_tt_the_communes_lose_a_favour_to_sell: "The communes lose the appointment of the teacher, and with it a favour to sell."
 ITA_s_tt_the_teachers_union_is_recognised: "The teachers' association is recognised and brought into the settlement."
 ITA_s_tt_the_two_italies_are_one_reader: "North and South read the same primer and the same ballot paper."
 ITA_s_tt_one_italy_reads_and_the_other_signs: "One half of the kingdom reads and the other half still signs with a cross."
 ITA_m_tt_the_quinine_has_somewhere_to_go: "The state quinine now has stations to be handed out from."
 ITA_m_tt_the_map_is_drawn_and_nothing_follows: "The map is drawn and there is no quinine to put on it."
 ITA_m_tt_the_land_was_promised_and_here_it_is: "We promised land instead of the emigrant ship, and here it is."
 ITA_m_tt_the_men_who_would_have_dug_it_are_at_sea: "The men who would have dug the ditches are on a steamer to Buenos Aires."
 ITA_m_tt_louisiana_undersells_us: "American sulphur undersells Sicily in every market it had."
 ITA_m_tt_the_consortium_is_a_bargain_with_the_owners: "The consortium is a bargain struck with the owners and paid for in votes."
 ITA_m_tt_the_consortium_is_forced_to_take_the_miners_in: "The consortium is made to seat the miners' delegates at its own table."
 ITA_m_tt_the_labour_office_has_inspectors_to_send: "The labour office has inspectors and can put them down a shaft."
 ITA_m_tt_the_law_has_nobody_to_enforce_it: "The law fixes an age and provides nobody to go and look."
 ITA_m_tt_turati_calls_it_the_only_thing_worth_the_session: "Filippo Turati calls it the only thing the session has been worth."
 ITA_m_tt_mirabello_takes_the_auxiliaries: "Carlo Mirabello takes the auxiliary squadron."
 ITA_m_tt_the_commissariat_writes_the_charter: "The Commissariat for Emigration writes the charter, and the state can move people in large parties."
 ITA_m_tt_the_shipowners_write_the_charter: "The shipowners write the charter and the inspectors read it afterwards."
 ITA_m_tt_the_liners_are_counted_as_cruisers: "The subsidised liners are entered in the naval returns as auxiliary cruisers."
 ITA_air_tt_moris_is_given_the_brigade: "Maurizio Moris is available as an air theorist."
 ITA_air_tt_the_staff_calls_it_a_balloon_company: "The staff files the brigade under balloons and forgets about it."
 ITA_air_tt_the_chamber_laughs_and_votes_it: "The Chamber laughs at the item and votes it."
 ITA_air_tt_calderara_is_taught_by_wilbur_wright: "Mario Calderara is taught to fly by Wilbur Wright and stays to teach others."
 ITA_air_tt_douhet_writes_the_regulations: "Giulio Douhet writes the regulations, and they are more ambitious than the machines."
 ITA_air_tt_the_battalion_is_meant_for_the_alps: "The battalion is being built to look over the northern frontier."
 ITA_air_tt_the_battalion_is_offered_to_the_alliance: "The battalion is offered to the alliance as a reconnaissance arm."
 ITA_air_tt_the_porte_calls_it_murder: "The Porte protests to every government in Europe."
 ITA_air_tt_the_kingdom_advertises_it: "The kingdom advertises the feat and enjoys the attention."
 ITA_air_tt_the_extreme_left_asks_who_was_under_it: "The Extreme Left asks who was standing under the grenades."
 ITA_air_tt_the_despatch_says_reconnaissance: "The official despatch calls the flight a reconnaissance and says nothing about the grenades."
 ITA_air_tt_gavotti_comes_back: "The pilot lands safely and writes up the first bombing flight anyone has flown."
 ITA_air_tt_the_machine_does_not_come_back: "The aircraft does not come back."
 ITA_arm_tt_the_left_reads_the_list: "The Extreme Left has the army seniority list printed, and every colonel can read who was promoted over him."
 ITA_arm_tt_the_list_is_the_crowns: "The ministry answers in one line that promotion is the King's business, and the list is not published."
 ITA_arm_tt_the_ministry_does_not_read_it: "The ministry refuses to give an opinion on the seniority list, now or later."
 ITA_arm_tt_the_class_answers_the_denunciation: "With the alliance denounced, we call up the full year of conscripts, and the piazza rises."
 ITA_arm_tt_the_convention_fixes_the_class: "The military convention says how many men Vienna expects, and we call up exactly that number."
 ITA_arm_tt_the_bloc_shortens_the_class: "The Bloc will not vote a full year of conscripts, so fewer men are called up and the country is quieter."
 ITA_arm_tt_the_essen_offer: "Krupp sells guns to an ally on an ally's terms, and Vienna hears of our order before Paris does."
 ITA_arm_tt_no_gun_from_essen: "Krupp will not sell guns to a country that has left the alliance, so Ansaldo gets the drawings and the bill."
 ITA_arm_tt_surveying_an_ally: "Our engineers are surveying the alpine passes of the ally we are sworn to reinforce, and Vienna reads the contracts."
 ITA_arm_tt_the_survey_is_expected: "Nobody in Rome pretends the survey is about avalanches, and the Chamber votes it through without argument."
 ITA_arm_tt_the_bloc_writes_it_down: "The Bloc will not take a spoken promise, so the refusal is written into the army regulations and signed."
 ITA_arm_tt_the_ministry_says_nothing_in_writing: "The ministry gives its word but will not put it in writing, and the prefects understand what that means."
 ITA_arm_tt_the_primer_before_the_rifle: "The Bloc insists that conscripts learn to read before they learn to shoot, which makes the army our largest school."
 ITA_arm_tt_the_rifle_before_the_primer: "The ministry wants soldiers, not readers, and the hours go to drill instead of lessons."
 ITA_arm_tt_the_orders_are_placed_where_they_vote: "Arsenal contracts go to the districts that return the right deputies, and the prefects make sure it is understood."
 ITA_arm_tt_the_arsenals_are_the_states: "The arsenals stay in state hands, the fitters keep their committees, and nobody is dismissed for joining one."
 ITA_arm_tt_the_estimates_are_not_laid_before_anyone: "The arsenal estimates are put through by decree and never reach a committee."
 ITA_arm_tt_the_alpini_are_told_who_they_face: "The Alpini, our mountain troops, are raised and issued maps with Austrian place names on them."
 ITA_arm_tt_the_alpini_are_a_frontier_guard: "We describe the new mountain corps as customs work in uniform, and Vienna accepts the description."
 ITA_arm_tt_the_estimates_pass_by_decree: "The army estimates are put through by decree. Nothing is cut, and nothing is explained."
 ITA_arm_tt_the_estimates_are_bought: "The army estimates pass on promises made to 60 deputies, and every promise is on somebody's list."
 ITA_arm_tt_the_bloc_cuts_the_estimates: "The Bloc cuts the army estimates before it will carry them, which pleases the country and angers the generals."
 ITA_arm_tt_the_denunciation_has_an_army: "We have torn up the treaty, and the army is now posted where the policy points. The staff and the foreign ministry agree."
 ITA_arm_tt_the_bloc_will_not_pay_for_the_alps: "The Bloc was not elected to build an army against Austria, and says so from the benches."
 ITA_arm_tt_the_ally_asks_about_the_concrete: "Vienna reads our tender notices and asks why an ally is building forts on a frontier we share."
 ITA_arm_tt_nobody_needs_a_reason_now: "The forts go up openly, because there is no longer an alliance to embarrass."
 ITA_arm_tt_the_bloc_calls_it_an_adventure: "The Bloc calls it an adventure paid for by men who will never see Africa, and the piazza takes up the phrase."
 ITA_arm_tt_the_south_is_told_it_gains: "The southern deputies are told the colonial depots will be built in their provinces, which is one more promise we owe them."
 ITA_arm_tt_the_right_has_wanted_this_since_adwa: "The Right has wanted the defeat at Adwa reversed for 10 years, and votes the African army without a murmur."
 ITA_arm_tt_no_italian_mothers_to_answer: "Losses among the ascari, our colonial troops, bring no letters to deputies, and the ministry counts that as a saving."
 ITA_arm_tt_the_bloc_asks_what_they_are_paid: "The Bloc asks in the Chamber what our colonial troops are paid and how they were recruited. The answers are never read out."
 ITA_arm_tt_vienna_is_told_before_the_porte: "We tell Vienna before we tell the Porte, the Ottoman government. Vienna disapproves and remembers it."
 ITA_arm_tt_there_is_nobody_to_tell: "There is no alliance left to consult, so the order goes out on our own authority."
 ITA_arm_tt_the_bloc_breaks_over_libya: "The Extreme Left will not carry a colonial war, and the understanding that held our majority together ends."
 ITA_arm_tt_the_bloc_gets_what_it_asked_for: "A smaller army was the Bloc's price for its votes, and we pay it in full."
 ITA_arm_tt_the_right_will_not_forgive_the_cut: "The Right calls the cut a great power giving up, and votes against us on everything after it."
 ITA_arm_tt_the_convention_promised_three_corps: "The convention promises Vienna three corps on the Rhine, and we no longer have the men to send them."
 ITA_arm_tt_the_prefects_keep_the_index: "The prefects keep the reserve rolls, along with every other list worth keeping."
 ITA_arm_tt_the_communes_keep_the_index: "The communes keep the reserve rolls, and every man may read his own entry."
 ITA_arm_tt_the_plan_is_filed_against_a_friend: "The staff keeps a war plan against the ally we are sworn to reinforce, and somebody will ask about it."
 ITA_arm_tt_the_plan_is_the_policy: "The war plan and the policy now say the same thing, and neither has to be hidden."
 ITA_arm_tt_the_army_answers_to_the_crown: "The new regulations settle whose army it is, and it is the King's."
 ITA_arm_tt_the_army_answers_to_the_chamber: "Estimates, promotions and the running of the barracks are all the Chamber's business now, in writing."
 ITA_arm_tt_the_army_answers_to_the_ministry: "The army answers to whoever holds the Interior this year, which is how the ministry prefers it."
 ITA_arm_tt_the_batteries_have_a_map_to_match: "The mountain batteries are placed along a frontier we have already named as hostile."
 ITA_arm_tt_mountain_guns_for_a_frontier_at_peace: "We buy mountain guns for a frontier nobody expects to fight over, and the Chamber finds that cheap and reassuring."
 ITA_arm_tt_the_convention_expects_corps_not_hulls: "Vienna and Berlin were promised divisions, and we tell them the money went into shipyards instead."
 ITA_arm_tt_a_free_hand_needs_a_fleet_first: "A country with no allies needs to hold its own sea before it needs another army corps."
 ITA_n_tt_the_estimates_are_bought: "The naval estimates pass on promises, not arguments, and every pledge is entered against us."
 ITA_n_tt_the_estimates_are_signed: "The naval estimates are signed and published by decree, so there is no debate to lose."
 ITA_n_tt_the_estimates_are_contested: "The Bloc fights the naval estimates line by line and cuts something off them."
 ITA_n_tt_the_drawings_are_shown_to_pola: "Allied navies exchange drawings, so Pola, the Austrian naval base, is shown what Cuniberti is designing."
 ITA_n_tt_the_office_keeps_its_own_counsel: "The drawing office shows its work to nobody, because no ally has a right to ask."
 ITA_n_tt_the_ways_are_laid_where_they_vote: "The new slipways are built in the districts whose deputies needed encouraging."
 ITA_n_tt_the_yards_are_the_blocs_own_men: "The shipyard men are organised, and they are organised on our side of the Chamber."
 ITA_n_tt_fiume_sells_to_an_ally: "Whitehead's torpedo works are at Fiume, in Austria-Hungary, and an ally gets the licence cheaply."
 ITA_n_tt_fiume_will_not_sell: "Whitehead's torpedo works are at Fiume, and Fiume no longer sells to us. We shall build our own."
 ITA_n_tt_the_ship_needs_no_vote: "The all-big-gun battleship is ordered by decree, and nobody has to be persuaded."
 ITA_n_tt_the_bloc_will_not_vote_a_battleship: "The Bloc will not put its name to a battleship while the schools are still unbuilt."
 ITA_n_tt_the_ship_is_paid_for_in_seats: "The battleship is bought with promises to deputies, at the usual rate."
 ITA_n_tt_the_refusal_is_the_blocs_victory: "The Bloc wanted the money spent elsewhere and got its way, and every league hall claims the credit."
 ITA_n_tt_the_refusal_is_read_as_weakness: "The Right calls the refusal a great power giving up its rank, and says so in the Chamber."
 ITA_n_tt_the_ally_asks_why_taranto: "A base at Taranto faces one sea and one navy, and Vienna understands which."
 ITA_n_tt_the_base_faces_where_it_should: "The base faces the Adriatic, which is where the fleet will do its work."
 ITA_n_tt_the_south_gets_a_yard_at_last: "The South is given something built instead of promised, and one old pledge is struck off."
 ITA_n_tt_the_cheap_boat_passes: "A submarine costs about what one gun turret costs, and the Bloc votes it without a fight."
 ITA_n_tt_the_right_wants_hulls_not_boats: "The Right calls submarines the weapon of a power that has given up, and votes the money sourly."
 ITA_n_tt_the_study_names_no_enemy: "The war study from Livorno names no enemy at all, which keeps the treaty safe and the study useless."
 ITA_n_tt_the_study_names_pola: "The war study names Pola, the Austrian naval base, on its first page and works from there."
 ITA_n_tt_a_closed_sea_with_a_friend_in_it: "The Adriatic can only be closed against our own ally's fleet, and the paper is circulated anyway."
 ITA_n_tt_the_sea_has_one_other_owner: "There is one other fleet in the Adriatic, and we have stopped pretending otherwise."
 ITA_n_tt_the_ally_reads_the_petersburg_papers: "Our best naval designer is now working for Russia, and Vienna draws its own conclusion."
 ITA_n_tt_petersburg_is_a_useful_friend: "Petersburg pays well and remembers favours, and we are short of friends."
 ITA_n_tt_the_boats_go_to_paris_and_petersburg: "Laurenti's submarines are sold where the orders are, and the orders come from Paris and Petersburg."
 ITA_n_tt_the_ally_reads_the_order_book: "Our ally reads our export order book and finds its own rivals in it."
 ITA_n_tt_the_bloc_divides_over_the_dante: "The moderate socialists will vote for a battleship and the hardliners will not, so the Bloc splits over one hull."
 ITA_n_tt_the_hull_is_ordered_by_decree: "The Dante is laid down by decree, and the estimates are voted afterwards."
 ITA_n_tt_the_hull_costs_three_pledges: "The ship is bought with promises to three groups, and all three will be called in."
 ITA_n_tt_two_allies_building_against_each_other: "Two members of the same alliance are building against each other, and both say so in their estimates."
 ITA_n_tt_the_race_has_a_name_now: "The naval race with Austria no longer has to be described as a race with anyone else."
 ITA_n_tt_three_hulls_three_constituencies: "Three ships are laid down in three yards, and three sets of deputies are grateful."
 ITA_n_tt_the_bloc_asks_for_the_schools_instead: "The Bloc asks how many classrooms a third battleship would buy, and gets a figure it can read out."
 ITA_n_tt_the_yard_sells_where_it_likes: "With no alliance to consider, our yards take orders from anyone who pays."
 ITA_n_tt_the_order_book_is_shown_to_berlin: "We show our order book to Berlin first, and the courtesy costs us a customer or two."
 ITA_n_tt_a_fleet_for_a_country_with_no_ally: "A country that has denounced its alliance needs a fleet that can leave its own gulf."
 ITA_n_tt_the_ally_asks_what_it_is_for: "Vienna asks what a high seas fleet is for, and does not believe our answer."
 ITA_n_tt_the_bloc_pays_for_it_in_the_country: "The Bloc carries the largest naval estimates in years, and pays for it in the piazza."
 ITA_n_tt_the_cheap_school_suits_the_bloc: "Coast defence is the cheapest way to build a navy, which is why the Bloc voted for it."
 ITA_n_tt_a_great_power_does_not_hide_in_a_gulf: "The Right calls coast defence the doctrine of a second-class power, and the phrase sticks."
 ITA_n_tt_the_ally_is_reassured_by_a_coast_fleet: "A fleet built to defend our coast cannot threaten Pola, and Vienna believes us when we say so."
 ITA_e_tt_the_prefects_count_their_own_districts: "The census is taken by the prefects, who are counting the districts they also manage."
 ITA_e_tt_the_bloc_wants_the_figures_printed: "The Bloc insists the figures be published as they stand, and the statisticians are delighted."
 ITA_e_tt_the_ministry_keeps_the_returns: "The figures go to the ministry and no further, because what is not published cannot be quoted against us."
 ITA_e_tt_the_concessions_find_friends: "The alpine water concessions go to men who were useful at the last election."
 ITA_e_tt_the_concessions_are_granted_by_decree: "The concessions are granted by decree, over the heads of the communes that owned the water."
 ITA_e_tt_the_communes_are_paid_for_their_water: "The communes are paid for their water before the dams are begun, which is slow and expensive."
 ITA_e_tt_the_plate_must_be_ours: "Nobody abroad will roll armour plate for a country that has left its alliance, so Terni must do it."
 ITA_e_tt_the_ally_will_roll_the_plate: "An allied works will roll armour plate for us on decent terms while Terni learns how."
 ITA_e_tt_turin_is_the_blocs_city: "30,000 fitters work in one quarter of Turin, and they vote for the Bloc."
 ITA_e_tt_thirty_thousand_men_and_a_garrison: "30,000 fitters work in one quarter of Turin, and the ministry answers them with a garrison."
 ITA_e_tt_the_south_is_a_constituency: "The special laws are run by prefects who will remember the arrangement at the next election."
 ITA_e_tt_the_south_is_a_debt: "The Bloc treats the special laws as a debt the North owes, and pays it without asking for seats in return."
 ITA_e_tt_sonnino_wrote_this_book_himself: "Sidney Sonnino wrote about the Sicilian peasantry long before he governed, and this bill is his own."
 ITA_e_tt_the_bloc_calls_it_a_verdict: "The Bloc calls 600,000 departures a year a verdict on the kingdom, and says so from the benches."
 ITA_e_tt_the_safety_valve: "Every man on a gangplank is a man not in a piazza, and the ministry has always counted on it."
 ITA_e_tt_the_consulates_are_places_to_give: "The new consular posts are jobs in our gift, and we hand them out carefully."
 ITA_e_tt_the_leagues_man_the_offices: "The emigration offices are staffed from the leagues, which know the emigrants better than the ministry does."
 ITA_e_tt_the_italians_of_trieste_are_counted_too: "The register of Italians abroad counts Trieste as well, and the newspapers notice."
 ITA_e_tt_the_lists_stop_at_the_border: "The register stops carefully at the Austrian frontier, and Vienna notices that too."
 ITA_e_tt_the_leagues_asked_for_this: "The leagues asked for land at home instead of a berth abroad, and they get it."
 ITA_e_tt_the_valve_is_shut_by_hand: "We close the safety valve on purpose, and the landowners who profited from it break with us."
 ITA_e_tt_recognising_our_own_benches: "We recognise the chambers of labour, the local union offices, whose deputies sit with us."
 ITA_e_tt_the_right_recognises_what_it_would_dissolve: "The Right recognises the chambers of labour it spent five years promising to close, and its own benches complain."
 ITA_e_tt_the_decrees_and_the_prefect_agree: "The public safety decrees and the prefects' instructions say the same thing, which makes both easier to apply."
 ITA_e_tt_the_bloc_cannot_answer_for_this: "The Bloc cannot explain a prefect breaking a strike to the men who elected it, and the understanding ends."
 ITA_e_tt_the_bloc_wrote_this_bill: "Compulsory elementary schooling was the Bloc's own bill before it was the ministry's."
 ITA_e_tt_the_teacher_is_a_prefects_appointment: "The schoolmaster is appointed from Rome, which in practice means by the prefect."
 ITA_e_tt_the_communes_are_told_what_to_teach: "The communes lose the schools and are told what will be taught in them."
 ITA_e_tt_the_pact_is_the_ministrys_own_work: "The agreement with the parish clergy was made by the ministry's own agents, district by district."
 ITA_e_tt_the_bloc_cannot_sit_with_the_sacristy: "The Bloc rests on the Extreme Left and cannot also rest on the parish priests, so it breaks."
 ITA_e_tt_the_right_and_the_curate_agree: "The Right and the parish committees want the same things, and are pleased to be asked."
 ITA_e_tt_the_leagues_hand_out_the_tablets: "The state quinine goes out through the leagues, which reach fields the prefects never visit."
 ITA_e_tt_the_tablets_are_handed_out_by_the_prefect: "The state quinine goes out through the prefects, and the peasants are told who sent it."
 ITA_e_tt_the_south_is_answered_and_billed: "The South gets its answer, and is told at once what it now owes the ministry for it."
 ITA_e_tt_the_south_is_answered_and_enfranchised: "The South gets its answer from a government that also means to give it the vote."
 ITA_e_tt_the_south_is_answered_from_rome: "The South gets its answer from Rome, in full and without being consulted."
 ITA_e_tt_a_country_that_asks_nobody_for_coal: "A country with no alliance and no coal would be at anyone's mercy, so we make our own power."
 ITA_e_tt_silesian_coal_on_a_friendly_tariff: "Silesian coal comes in at an ally's rate while we build the power stations."
 ITA_e_tt_one_kingdom_administered: "The kingdom is held together by 90 prefects and a great deal of correspondence."
 ITA_e_tt_one_kingdom_enfranchised: "The kingdom is held together because most of the men in it now have a vote."
 ITA_e_tt_one_kingdom_governed: "The kingdom is held together from Rome, and is told so."
 ITA_w_tt_foreign_policy_is_the_crowns: "Under the Statuto, the kingdom's constitution, treaties belong to the King. The foreign ministry answers to him and not to the Chamber, and our majority falls."
 ITA_w_tt_the_bloc_asks_to_read_the_treaties: "The Bloc has treaties laid before the Chamber. It does not get every one of them, but our majority grows."
 ITA_w_tt_the_consulta_is_left_to_itself: "We leave foreign policy to the officials, who are grateful and helpful, and our hold on the provinces grows."
 ITA_w_tt_the_renewal_needs_no_debate: "The renewal is signed and announced without a debate, and Vienna trusts us further."
 ITA_w_tt_the_extreme_left_votes_against: "The Extreme Left votes against the alliance. Our majority falls and the piazza rises with it."
 ITA_w_tt_the_convention_never_reaches_the_chamber: "The military convention is settled between the staffs and the crowns, and the Chamber never sees it."
 ITA_w_tt_the_chamber_is_told_a_smaller_number: "We give the Chamber a smaller figure for the Rhine army than the one Berlin holds. Our hold on the provinces grows, and our majority slips."
 ITA_w_tt_the_bloc_learns_of_the_third_army: "The Bloc learns that Italian corps are promised to the Rhine, and the benches erupt."
 ITA_w_tt_two_books_and_no_chamber: "We keep two sets of engagements in one cipher room, and no committee may ask about either. Our hold on the provinces grows."
 ITA_w_tt_the_bloc_would_publish_both: "The Bloc's own press would print both sets of engagements if it ever saw them, and the piazza rises on the rumour."
 ITA_w_tt_the_bloc_will_not_own_the_irredenta: "The Extreme Left will not carry a claim on the irredenta, the Italian lands under Austria. We lose one of the arrangements that hold our majority together."
 ITA_w_tt_the_right_writes_the_claim: "The Right has wanted this claim written down since before the kingdom was whole, and writes it well."
 ITA_w_tt_the_ministry_would_rather_not_have_said_it: "We would rather the claim had gone unspoken. It must now be defended in the Chamber, and our hold on the provinces weakens."
 ITA_w_tt_an_ally_bargaining_with_petersburg: "We have bargained with Russia over the Balkans while still in the alliance, and Vienna's confidence in us falls."
 ITA_w_tt_racconigi_is_the_new_policy: "The bargain at Racconigi betrays nobody now, and Russia thinks better of us for it."
 ITA_w_tt_valona_is_watched_by_two_allies: "Two allies are watching the same harbour at Valona, and Vienna's confidence in us falls."
 ITA_w_tt_the_other_shore_has_one_claimant: "Only one power now claims the far shore of the Otranto strait, and we say so openly."
 ITA_w_tt_the_bloc_costs_the_colonies_out: "The Bloc reads the cost of the colonies out in the Chamber, and our majority falls."
 ITA_w_tt_a_colony_is_a_place_to_send_a_client: "A colonial administration is a list of posts in our gift. We hand them out, and buy both provinces and votes with them."
 ITA_w_tt_the_right_wants_them_governed: "The Right wants the colonies governed and not merely held, and votes the money for roads in Eritrea."
 ITA_w_tt_the_bloc_asks_about_the_recruiting: "The Bloc asks in the Chamber how our colonial troops are recruited, and the piazza takes up the question."
 ITA_w_tt_a_colonial_army_costs_no_italian_vote: "Colonial battalions cost us no Italian conscripts, and therefore no Italian votes."
 ITA_w_tt_the_extreme_left_forced_the_inquiry: "The Extreme Left forced the inquiry into the company's rule on the Benadir coast, and the buy-out raises our majority."
 ITA_w_tt_the_inquiry_is_settled_quietly: "The inquiry is settled before it reports, the officials are moved on, and our hold on the provinces grows."
 ITA_w_tt_the_company_is_not_the_states_business: "The Right holds that a chartered company's affairs are its own. We pay anyway, and the piazza rises."
 ITA_w_tt_adwa_is_closed_by_the_men_who_opposed_it: "The men who voted against the expedition are the men who settle with Adwa. Our majority grows and the piazza quietens."
 ITA_w_tt_the_right_signs_and_says_nothing: "The Right signs the treaty with Menelik and refuses to celebrate it."
 ITA_w_tt_the_bloc_will_not_survive_a_second_adwa: "The Bloc could not carry a second Abyssinian war for a fortnight, and does not try."
 ITA_w_tt_the_right_has_waited_ten_years: "The Right has waited 10 years for this and votes the money standing."
 ITA_w_tt_the_ministry_did_not_want_this: "We did not want an Abyssinian war and now have to run one, and our hold on the provinces breaks."
 ITA_w_tt_the_ally_is_consulted_about_tripoli: "The alliance requires us to consult Vienna over Ottoman territory. We do, and Vienna's confidence in us falls."
 ITA_w_tt_nobody_is_consulted_about_tripoli: "No treaty is left that requires us to ask anyone about Tripoli."
 ITA_w_tt_the_ministry_counts_the_nationalist_seats: "We count the seats a Libyan war would be worth, and buy our majority with them."
 ITA_w_tt_the_alliance_is_told_after_the_fact: "Vienna learns of our ultimatum from the newspapers, and its confidence in us falls hard."
 ITA_w_tt_a_free_hand_is_for_this: "This is what we left the alliance for. Nobody has to be asked first."
 ITA_w_tt_the_bloc_will_not_hold_through_a_war: "The Bloc rests on the Extreme Left and will not hold through a colonial war. We lose one of its arrangements, and the piazza rises."
 ITA_w_tt_the_bank_is_cheaper_than_a_war: "A bank in Tripoli costs a fraction of a landing, and our majority grows instead of breaking."
 ITA_w_tt_a_great_power_does_not_send_a_banker: "The Right says a bank is what a power sends when it dare not send a division."
 ITA_w_tt_the_bloc_is_spared_a_war: "The Bloc is spared a war it could not have carried, and the piazza settles."
 ITA_w_tt_the_islands_are_kept_because_we_can: "We call the Dodecanese a pledge. No ally is left to ask when we mean to give the islands back."
 ITA_w_tt_vienna_asks_when_they_go_back: "Vienna asks in writing when the Aegean islands will be given back, and its confidence in us falls."
 ITA_w_tt_the_ministry_banks_the_victory: "The peace is announced and the prefects are instructed. Our majority, the seats we bought and our hold on the provinces all grow."
 ITA_w_tt_the_right_asks_why_we_stopped: "The Right asks why the columns stopped at the coast, and the piazza takes up the question."
 ITA_w_tt_the_fourth_shore_owes_nothing_to_vienna: "We took the Fourth Shore, our coast in Africa, without an ally's leave, and hold it without an ally's help."
 ITA_w_tt_the_bloc_counts_the_columns: "The Bloc counts the columns still in the desert and prints the figure everywhere. Our majority falls and the piazza rises."
 ITA_w_tt_the_right_calls_it_pacification: "The Right calls the desert fighting pacification, and votes the money for transport."
 ITA_w_tt_the_emigrants_are_sent_to_libya_instead: "Emigrants promised land in the South are offered land in Libya instead. Our majority grows and an old pledge is struck off."
 ITA_w_tt_the_bloc_calls_it_sand: "The Bloc calls the Fourth Shore a box of sand bought with a decade of school money, and the piazza rises."
 ITA_a_tt_the_decrees_are_read_abroad: "A kingdom that governs by public safety decree is read abroad as a kingdom expecting trouble."
 ITA_a_tt_vienna_recognises_the_instrument: "Vienna knows the decree well and takes our use of it as a sign of seriousness."
 ITA_a_tt_the_new_voters_hear_about_trieste: "2 million men have the vote for the first time, and the first thing many are canvassed about is Trieste."
 ITA_a_tt_the_alliance_is_not_a_platform: "Nobody can campaign on the Triple Alliance, so we keep it out of the election altogether."
 ITA_a_tt_the_ally_counts_the_garrisons_at_home: "Vienna counts the divisions we keep in Italian cities and takes them off the number promised to the Rhine."
 ITA_a_tt_a_free_hand_and_a_garrison_in_milan: "We claim a free hand abroad and keep a garrison in Milan, and every league paper says so."
 ITA_a_tt_berlin_prefers_a_government_that_lasts: "Berlin and Vienna would rather have an ally whose government lasts the winter, whatever it takes."
 ITA_a_tt_a_free_hand_wielded_by_decree: "We take a free hand abroad, and rule at home without consulting anyone."
 ITA_a_tt_hungarian_grain_comes_in_free: "With the duty gone, Hungarian grain comes in freely, and Budapest is grateful in a way Vienna notes."
 ITA_a_tt_the_grain_is_bought_where_we_like: "We buy grain wherever it is cheapest, and no treaty says otherwise."
 ITA_a_tt_the_convention_is_kept_from_the_new_minister: "The military convention cannot be shown to a socialist minister, and Vienna has noticed that one is sitting in our cabinet."
 ITA_a_tt_a_free_hand_that_the_left_can_live_with: "The Left will sit in a ministry that has denounced the alliance, and would not sit in one that kept it."
 ITA_a_tt_the_settlement_has_no_ally_behind_it: "The settlement rests on the country alone, and the Chamber is told to remember it."
 ITA_a_tt_the_alliance_underwrites_the_settlement: "A kingdom inside a great alliance can afford a quiet Chamber, and the Chamber knows why."
 ITA_end_tt_the_ally_is_relieved_by_the_adjournment: "Vienna and Berlin welcome the adjournment as the end of an unreliable parliament."
 ITA_end_tt_a_free_hand_and_a_closed_chamber: "We have no allies and no sitting parliament. The other powers have noticed both."
 ITA_end_tt_the_third_partner_under_a_left_ministry: "Vienna will not deal on military matters with a ministry that includes the Extreme Left."
 ITA_end_tt_the_free_hand_is_folded: "The new ministry has no use for a free hand and puts the policy aside."
 ITA_end_tt_the_bloc_gets_its_columns_back: "The Bloc asked for the columns to come home from the desert, and now takes the credit."
 ITA_end_tt_the_right_calls_it_a_surrender: "The Right calls the recall a surrender to the desert, and goes on saying so for years."
 ITA_end_tt_the_verdict_on_the_neutral_state: "10 years of standing back have left us an administration that works and a country that owes us favours."
 ITA_end_tt_the_verdict_on_the_statuto: "10 years of the Statuto, the kingdom's constitution, read to the letter. The country is governed, and the street has not forgotten how."
 ITA_end_tt_the_verdict_on_the_bloc: "10 years of the popular Bloc have widened the franchise. The majority can now be counted in advance."
 ITA_end_tt_the_verdict_on_the_third_partner: "10 years of loyalty to the alliance. Vienna still expects Italian corps, and the two staffs still talk."
 ITA_end_tt_the_verdict_on_the_free_hand: "10 years of a free hand have left us no allies and no obligations. Every neighbour is watching."
 ITA_r_threat_the_note_is_read_back: "Rome tells Vienna the promise covered only the estimates"
 ITA_r_threat_the_bosnian_file: "Italy asks compensation for Bosnia"
 ITA_r_threat_the_green_book: "Rome publishes the correspondence with Vienna"
 ITA_r_threat_the_photographs: "Italy denies the photographs from Tripolitania"
 ITA_r_threat_the_status_quo_answered: "Rome refuses Vienna's reading of Racconigi"
 ITA_r_tb_the_three_worst_provinces: "The Three Worst Provinces"
 ITA_r_tb_the_adriatic_delay: "The Adriatic Answer Deferred"
 ITA_r_tb_the_yard_that_stayed: "The Messina Yard"
 ITA_r_tb_the_licence_at_last: "The Licence Granted"
 ITA_r_tb_the_turin_copy: "The Turin Copy"
 ITA_r_tb_the_figures_are_public: "The Published Figures"
 ITA_r_dc_the_standing_orders_rewritten: "The Standing Orders Rewritten"
 ITA_r_dc_the_establishment_is_held: "The Establishment Held"
 ITA_r_dc_the_battery_that_is_ours: "A Battery Built in Italy"
 ITA_r_dc_the_board_is_sustained: "The Promotion Board Upheld"
 ITA_r_dc_the_passed_over_get_a_command: "A Command for Officers Passed Over"
 ITA_g_the_ministry_of_the_lobby: "The Ministry of the Lobby"
 ITA_g_the_ministry_of_the_lobby_desc: "Deals are made in the corridor and confirmed in the hall. It is quick and it is legal. No policy of the Kingdom is ever decided by an argument, and a Chamber built this way will not vote for a war."
 ITA_g_the_book_of_the_ninety: "The Book of the Prefects"
 ITA_g_the_book_of_the_ninety_desc: "The Interior keeps a book of every man in every province who can deliver votes, and of what he wants in return. The estimates are drawn up with that book open on the table, and the roads go where it says."
 ITA_g_the_boards_of_conciliation: "The Boards of Conciliation"
 ITA_g_the_boards_of_conciliation_desc: "Strikes are settled round a table instead of in the street. The mills lose fewer weeks and the country is quieter for it. Arbitration costs money, and a people used to it is slow to want a war."
 ITA_g_the_men_who_will_vote_for_it: "The Assembled Majority"
 ITA_g_the_men_who_will_vote_for_it_desc: "A majority with no programme, put together fresh each session out of whoever the ministry can satisfy. It carries every vote in the Chamber and believes in nothing at all. It will not carry a war."
 ITA_g_the_public_works_estimate: "The Public Works Estimate"
 ITA_g_the_public_works_estimate_desc: "More roads, harbours and bridges are going up than at any time since unification. Every one of them was voted for a reason that had nothing to do with traffic. The works are expensive, and each one was paid for with a promise."
 ITA_g_the_list_that_goes_astray: "The Arranged Elections"
 ITA_g_the_list_that_goes_astray_desc: "In the South we do not win elections, we arrange them. It is cheap and it never fails. It is also the one fact about Italy that every foreign paper knows, and the men counted out of a ballot go looking for another party."
 ITA_g_the_leagues_are_lawful: "The Leagues Are Lawful"
 ITA_g_the_leagues_are_lawful_desc: "The unions have offices, funds and lawyers. They are far easier to negotiate with than a crowd, and far harder to disperse."
 ITA_g_the_minister_of_the_underworld: "The Minister of the Underworld"
 ITA_g_the_minister_of_the_underworld_desc: "A pamphlet has described the method in print, with names and constituencies, and its author cannot be accused of inventing it. The system still works, but everyone can now see how. The Chamber is harder to manage and the country is angrier."
 ITA_g_the_confederation_of_labour: "The Confederation of Labour"
 ITA_g_the_confederation_of_labour_desc: "500,000 organised men with one address and one treasury. They will not riot, and they can no longer be broken up by a squadron of cavalry and a prefect's order. The workshops run steadily, and no ministry will get a war past them."
 ITA_g_the_bill_comes_round_again: "The Unpaid Promises"
 ITA_g_the_bill_comes_round_again_desc: "Nothing we bought has been paid for. Every session the same men come back with the same accounts, and the sum at the bottom is larger than last year's. Buying them off again costs more every time."
 ITA_g_the_last_giolittian_chamber: "The Last Giolittian Chamber"
 ITA_g_the_last_giolittian_chamber_desc: "8.5 million voters have sent up a Chamber that owes the prefects nothing. It can still be managed, but it cannot be counted in advance. That is the whole difference, and every bill now costs us something."
 ITA_g_the_system_outlived_its_arithmetic: "The Machine Dismantled"
 ITA_g_the_system_outlived_its_arithmetic_desc: "We took the machine apart ourselves, before the country could take it apart for us. The ministry came through it still governing, which very few systems in Europe have managed. The country is calmer, the work goes faster, and nobody in it is in a mood for a war."
 ITA_g_orlando_in_the_lobby: "Orlando in the Lobby"
 ITA_g_orlando_in_the_lobby_desc: "A Sicilian professor of constitutional law. He can explain at length, and with authorities, why whatever we did last week was already allowed by the Statuto, the kingdom's constitution."
 ITA_g_carcano_at_the_treasury: "Carcano at the Treasury"
 ITA_g_carcano_at_the_treasury_desc: "He signs the public works estimate every year and every year tells the Council that this is the last time. He has been telling them so since Crispi."
 ITA_g_daneo_at_public_instruction: "Daneo at Public Instruction"
 ITA_g_daneo_at_public_instruction_desc: "If the register is to be widened to every man who can read, then somebody had better see that they can. He would rather it were done for its own sake."
 ITA_g_tb_the_lobby: "The Ministry of the Lobby"
 ITA_g_tb_the_boards: "The Boards of Conciliation"
 ITA_g_tb_the_bench: "The Assembled Majority"
 ITA_g_tb_the_public_works: "The Public Works Estimate"
 ITA_g_tb_the_aqueduct: "The Apulian Aqueduct"
 ITA_g_tb_the_strike_counted: "The Strike That Was Counted"
 ITA_g_tb_the_leagues: "The Leagues Made Lawful"
 ITA_g_tb_the_confederation: "The Confederation of Labour"
 ITA_g_the_machine_counted_tt: "Provinces held by the machine: §Y[?ITA_prefects|0]§! of 100."
 ITA_g_the_bench_is_already_full_tt: "§GThe majority is comfortable enough that the groups come to us.§! Nobody has to be paid twice this session."
 ITA_g_the_groups_are_bought_one_by_one_tt: "§RThe bench has to be assembled group by group.§! Every one of them names a price before it sits down."
 ITA_g_the_book_is_thick_tt: "§GThe book of the prefects already covers most of the Kingdom.§! Adding to it is a matter of copying, not of persuasion."
 ITA_g_the_book_is_still_thin_tt: "§YHalf the provinces have no page in the book.§! The clerks have to start from nothing."
 ITA_g_the_boards_meet_under_guard_tt: "§RTroops are still being sent into labour disputes.§! Neither side will sit at a board while soldiers wait outside the door."
 ITA_g_the_boards_are_believed_tt: "§GNo troops have been called out in a strike this year.§! The employers come to the table, because a strike now costs them more than a settlement."
 ITA_g_the_curate_sits_beside_the_notary_tt: "§GThe Pope's ban on Catholics voting is lifted and the parish vote is ours.§! It is the cheapest support we have ever been given."
 ITA_g_the_bench_is_short_of_the_countryside_tt: "§RThe Pope has kept his ban on Catholics voting.§! The country provinces send us men who owe the ministry nothing."
 ITA_g_rome_has_not_answered_yet_tt: "§YThe Pope has not said whether he will lift his ban on voting.§! We assemble the majority without knowing if it will have a Catholic wing."
 ITA_g_more_is_promised_than_can_be_built_tt: "§RThe pledges outrun the estimates.§! Somebody in the Molise is going to be told there is no bridge after all."
 ITA_g_the_works_are_within_reach_tt: "§GEverything promised this session can actually be built.§! No minister has to go back on a bridge this year."
 ITA_g_the_street_reads_the_returns_tt: "§RThe country is already restless, and the arranged returns are printed all the same.§! The Extreme Left is handed an argument it did not have to invent."
 ITA_g_nobody_below_naples_is_surprised_tt: "§GThe country is quiet and the arrangement passes without comment.§! It is how elections have been held in the South since unification."
 ITA_g_a_promise_is_redeemed_tt: "§GThree promises are struck off the book.§! Water reaches the villages a minister promised it to."
 ITA_g_nothing_was_owed_here_tt: "§YNothing was promised here, so no promise is paid off by it.§! The prefects take the credit instead."
 ITA_g_the_floor_will_not_come_down_tt: "§RThe army has been used in the streets before, and the piazza remembers.§! The strike hardens instead of breaking up."
 ITA_g_the_strike_ends_itself_tt: "§GNo troops were sent and there was nothing to fight.§! The strike ends in four days and the ministry is stronger for having done nothing."
 ITA_g_the_office_has_a_counterparty_tt: "§GThe Labour Office now has somebody lawful to write to.§! Disputes are settled by letter instead of in the street."
 ITA_g_recognised_and_unrecorded_tt: "§RThe leagues are lawful and nobody is counting them.§! The state has legalised an organisation it cannot see."
 ITA_g_turati_is_tempted_tt: "§GThe country is quiet enough that a reformist can defend taking office.§! The socialists split over it, and we gain a wing of them."
 ITA_g_the_congress_forbids_it_tt: "§RThe piazza is up, and no socialist can be seen entering the Quirinal, the King's palace.§! The offer is refused in public and at length."
 ITA_g_half_the_bench_is_rented_tt: "§RA quarter of the Chamber sits for a favour rather than a conviction.§! Everybody can see it and nobody will say it in the hall."
 ITA_g_the_price_is_still_reasonable_tt: "§GThe bought seats are a minority of the majority.§! The arrangement is still cheaper than governing without one."
 ITA_g_the_pamphlet_can_be_documented_tt: "§RThe machine is large enough that every charge in the pamphlet can be checked.§! The newspapers check them, one by one."
 ITA_g_the_pamphlet_is_denied_tt: "§GThe pamphlet is thin enough to be called a libel.§! We deny it, and enough people believe the denial."
 ITA_g_the_floor_is_organised_tt: "§YThe street has a permanent organisation now.§! The piazza never falls as low between strikes as it used to."
 ITA_g_the_confederation_is_ours_tt: "§GThe reformists run the Confederation and the Confederation talks to us.§! It was the entire point of the offer to Turati."
 ITA_g_the_confederation_is_its_own_tt: "§RThe Confederation was built without us and answers to nobody in Rome.§! 500,000 men, one treasury, and nothing owed to the government."
 ITA_g_the_ledger_will_not_close_tt: "§RThere are more promises outstanding than this session can pay off.§! Something in the cabinet has to go."
 ITA_g_it_is_paid_for_this_session_tt: "§GThe promises are paid off for another year.§! The same men will be back next session."
 ITA_g_the_bought_seats_will_not_survive_it_tt: "§RMuch of the majority was bought, and a bought seat is worth nothing to 8 million new voters.§! The machine loses most of its value."
 ITA_g_there_is_little_to_lose_by_it_tt: "§GThe majority does not rest on purchased seats.§! Widening the register costs the ministry very little."
 ITA_g_the_country_has_already_answered_tt: "§GThe election has been held under the wide register.§! Whatever the Chamber is now, it is what the country sent."
 ITA_g_the_country_has_not_been_asked_yet_tt: "§RThe question is forced before the country has voted on it.§! The Chamber resents being judged by a ministry it did not choose."
 ITA_g_the_sacristy_carried_it_tt: "§GThe parish clergy delivered the new voters.§! The majority survives the wider register, and owes a debt to a Catholic party that does not admit it exists."
 ITA_g_the_bench_stands_on_itself_tt: "§RThere was no Catholic vote to carry the new electorate.§! The majority faces 8 million voters with nothing but its record."
 ITA_s_the_instrument_owes_nothing_tt: "§REvery promise the ministry was carrying is cancelled by one circular.§! The prefects stop dealing in favours, and the deputies who were promised them stop voting with us."
 ITA_s_there_was_nothing_promised_tt: "§GThe ministry took office owing nobody anything.§! The circular costs a morning and offends nobody who matters."
 ITA_s_the_ninety_already_take_orders_tt: "§GThe 90 prefectures were already instructed by the society ministry.§! The new circular only tells them to stop taking anything in return."
 ITA_s_the_brokers_are_told_to_stop_tt: "§R90 prefects are told to stop doing the only thing they know how to do.§! Half the arrangements in the provinces come apart before new ones are made."
 ITA_s_we_are_shutting_what_we_licensed_tt: "§RWe gave the chambers of labour standing in law, and we are now sealing their doors.§! Nobody on the Left has to argue that the state is not neutral."
 ITA_s_they_had_no_standing_to_lose_tt: "§GThe chambers of labour were tolerated, never recognised in law.§! Closing them takes a prefect's order and a locksmith, and we keep their membership lists."
 ITA_s_seizing_figures_already_printed_tt: "§RThe figures are already public, so seizing the papers looks like a confession.§! Every issue stopped at the press is copied by hand and read by twice as many people."
 ITA_s_the_questori_work_quietly_tt: "§GNothing has been printed that anyone can check the seizures against.§! The police chiefs work at four in the morning and the provinces hear nothing."
 ITA_s_the_court_was_beaten_once_already_tt: "§GThe Court of Cassation has been overruled once and knows how that ends.§! The bill passes in a single sitting."
 ITA_s_the_bar_reads_the_bill_aloud_tt: "§RThe lawyers of Rome read the bill aloud in public and call it a fraud.§! The men who administer the law stop believing in the ministry that writes it."
 ITA_s_no_court_will_hear_the_appeal_tt: "§GThe Court of Cassation has been overruled, so a refused licence has nowhere to appeal.§! The refusals stop being challenged and start being obeyed."
 ITA_s_the_licence_is_litigated_tt: "§REvery refused licence goes to court, and half of them are won there.§! The censorship works, slowly, and in full public view."
 ITA_s_nobody_signs_the_register_tt: "§RWith the street this high, no league will put its officers' names on a prefect's list.§! A §Rbayonet§! is spent closing the ones that meet anyway."
 ITA_s_half_of_them_sign_tt: "§GHalf the leagues register and go on meeting under a prefect's eye.§! It is not liberty, but it is quieter than closing them."
 ITA_s_the_courts_carry_what_the_chamber_will_not_tt: "§YWith no majority in the Chamber, we govern through the judges instead.§! It works, and everyone in Italy can see what has been done to the courts."
 ITA_s_the_transfers_pass_unremarked_tt: "§GWith a majority behind us, we move 11 magistrates to Sardinia and nobody asks a question in the Chamber.§!"
 ITA_s_too_many_voters_to_draw_around_tt: "§RThe register is too large to draw a map around.§! Redrawing the seats now buys us a majority and an organised enemy in the same afternoon."
 ITA_s_sixty_seats_stop_being_returned_tt: "§G2.5 million voters can be sorted into any map we like.§! 60 opposition seats stop being returned, and nobody loses a vote."
 ITA_s_vienna_counts_the_garrisons_at_home_tt: "§RVienna counts the divisions standing in Italian cities and subtracts them from the alliance.§!"
 ITA_s_a_free_hand_and_a_tribunal_in_milan_tt: "§RWe stand alone abroad and hold a military court in Milan.§! The other powers take note of what our army is being used for."
 ITA_s_the_army_already_answers_the_sash_tt: "§GThe army already turns out on a prefect's order without asking Rome.§! The telegram only shortens a procedure the regiments know."
 ITA_s_the_generals_are_told_afterwards_tt: "§RThe generals learn that prefects may now proclaim a state of siege by reading the official gazette.§! The army does the work and is never consulted."
 ITA_s_the_special_laws_have_a_service_now_tt: "§GThe special laws already exist and now there is a service to execute them.§! The works go up in Apulia and Basilicata without a deputy touching them."
 ITA_s_an_administration_with_nothing_to_do_tt: "§RAn administration has been built for a South that has no programme to administer.§! The inspectors write reports about roads nobody has voted."
 ITA_s_the_sele_water_arrives_on_schedule_tt: "§GThe aqueduct was begun in time, and the water arrives when the engineers said it would.§! Apulia stops burying children every summer."
 ITA_s_the_engineers_start_from_nothing_tt: "§RThere is no aqueduct to finish, only a survey.§! Everything starts from the first peg, and the water is years away."
 ITA_s_the_emergencies_become_the_law_tt: "§YThree emergency measures are rolled into one ordinary law of the Kingdom.§! They stop being exceptional powers and become the Code of Public Safety."
 ITA_s_the_code_writes_down_the_bayonets_tt: "§RThe Code is voted by a country the army has already fired on three times.§! It is read as a threat, not as administration."
 ITA_s_a_quiet_kingdom_codified_tt: "§GThe Code arrives before any shooting.§! It reads as administration rather than punishment, and the prefects gain by it."
 ITA_s_a_censured_ministry_that_stays_tt: "§RThe Chamber censures the ministry and the ministry stays in office.§! The bought majority falls apart, and the street draws its own conclusion."
 ITA_s_the_motion_is_never_moved_tt: "§GWith a majority in hand, we state the doctrine and never have to test it.§! No censure motion is ever moved."
 ITA_s_a_service_that_can_be_told_tt: "§GA permanent inspectorate answering to Rome.§! It is the first Italian service that can be told to do a thing and will actually do it."
 ITA_s_the_inspectors_have_figures_to_start_from_tt: "§GThe figures are public, so the inspectors begin with numbers instead of guesses.§! Their first months are not spent counting."
 ITA_s_the_inspectors_count_it_themselves_tt: "§RNothing has ever been counted honestly, so the inspectors have to count it first.§! Two years go on counting before anything is built."
 ITA_s_obedience_stops_at_the_city_gate_tt: "§RThe Kingdom obeys Rome everywhere except in the cities.§! Provinces stop answering, and we find out by telegram."
 ITA_s_the_kingdom_does_what_it_is_told_tt: "§GFrom the Alps to Sicily, the order given in Rome is the order carried out.§! No Italian government has ever been able to say that."
 ITA_s_the_programme_is_finished_tt: "§GTorniamo allo Statuto, back to the constitution, stops being a programme.§! It is now how the Kingdom is actually governed, and the pamphlet is withdrawn."
 ITA_s_the_floor_under_the_piazza_stays_tt: "§RFour or more bayonets were spent getting here.§! The floor under the piazza does not come down just because we have stopped shooting."
 ITA_s_a_form_that_survived_the_cure_tt: "§GThe Statuto, the kingdom's constitution, is restored to the letter without a single volley.§! The country has not been broken to get there."
 ITA_s_the_chambers_dissolved: "The Chambers of Labour Closed"
 ITA_s_the_chambers_dissolved_desc: "Doors sealed in four cities and the union funds seized. The mills run without a stoppage, and nothing has been settled. The quarrel is only put off, and the men behind it have gone to the socialists."
 ITA_s_the_prefect_is_an_instrument: "The Prefects Take Orders"
 ITA_s_the_prefect_is_an_instrument_desc: "90 prefects who take their orders from Rome and no longer take terms from anybody else. They do what they are told, and the work in the provinces goes faster for it."
 ITA_s_the_censor_before_the_press: "Seizure Before Publication"
 ITA_s_the_censor_before_the_press_desc: "The police chief reaches the presses before the reader does. The papers that survive are the ones that can afford to be careful, and the rest print nothing worth seizing."
 ITA_s_the_law_of_interpretation: "The Law of Interpretation"
 ITA_s_the_law_of_interpretation_desc: "The Chamber has told the Court of Cassation what the Statuto, the kingdom's constitution, means. The Court has agreed, because nothing else was left to it."
 ITA_s_the_estimates_are_thin: "An Administration Without a Programme"
 ITA_s_the_estimates_are_thin_desc: "The service exists and there is nothing for it to execute. Inspectors write reports about works that were never voted."
 ITA_s_the_registered_leagues: "The Register of Leagues"
 ITA_s_the_registered_leagues_desc: "A league may meet if it lodges the names of its officers with the prefect. Most of the unions accept the price, and the rest go underground."
 ITA_s_the_licence_to_print: "The Licence to Print"
 ITA_s_the_licence_to_print_desc: "Every paper must lodge a deposit, name an editor with money of his own, and renew its licence each year. The big papers can pay. The provincial press falls silent."
 ITA_s_the_bench_is_reliable: "A Reliable Judiciary"
 ITA_s_the_bench_is_reliable_desc: "The promotion lists have been gone through and the awkward men moved. Judgements now come out the way we expected, which is convenient and widely known."
 ITA_s_the_colleges_redrawn: "The Constituencies Redrawn"
 ITA_s_the_colleges_redrawn_desc: "The Interior has drawn a new electoral map. It is entirely legal, it takes the vote from nobody, and it settles 60 seats before anyone votes."
 ITA_s_the_siege_by_telegram: "A State of Siege by Telegram"
 ITA_s_the_siege_by_telegram_desc: "Any prefect may proclaim a state of siege and report it to Rome afterwards. The army turns out faster than it ever has, and this is what it turns out for."
 ITA_s_the_works_administered: "Works Let by Engineers"
 ITA_s_the_works_administered_desc: "Contracts are let on an engineer's report and nothing else. The aqueducts advance on schedule, and no Southern deputy has a favour left to sell."
 ITA_s_the_code_of_public_safety: "The Code of Public Safety"
 ITA_s_the_code_of_public_safety_desc: "One law replaces four years of emergency decrees. Powers that were exceptional are now the ordinary law of the Kingdom, and the prefects use them every week."
 ITA_s_the_administration_that_governs: "The Administration That Governs"
 ITA_s_the_administration_that_governs_desc: "A permanent body of inspectors that answers to Rome and to nobody else. It is the most competent thing the Kingdom has ever built, and no elected man can give it an order."
 ITA_s_the_state_that_is_obeyed: "The State That Is Obeyed"
 ITA_s_the_state_that_is_obeyed_desc: "Every order given in Rome is carried out. The Kingdom has never been stronger or better obeyed. Fewer Italians every year believe it belongs to them, and that is the price."
 ITA_s_the_statuto_kept: "The Charter Kept"
 ITA_s_the_statuto_kept_desc: "The Statuto, the kingdom's constitution, is read to the letter again, and 40 years of custom are thrown out. Whether what we have is a constitution or a habit is a question for the next reign."
 ITA_s_orlando_at_grace_and_justice: "Orlando at Justice"
 ITA_s_orlando_at_grace_and_justice_desc: "A Sicilian professor of public law who can prove that anything the ministry has already done was lawful, and who is usually right."
 ITA_s_orlando_at_grace_and_justice_tt: "Vittorio Emanuele Orlando becomes available as a political advisor."
 ITA_s_the_telegram_threat: "Sieges Proclaimed by Telegram"
 ITA_r_the_new_electorate: "The New Electorate"
 ITA_r_the_new_electorate_desc: "8 million men are on the rolls, with evening classes in every commune to teach them to read. They are learning on a ballot paper, and nobody in Rome can predict what they will do with it."
 ITA_r_the_collective_contract: "The Collective Contract"
 ITA_r_the_collective_contract_desc: "A wage settled for a whole trade and enforced by a magistrate. The workshops know their costs a year ahead, and the employers of Lombardy have not stopped calling it theft."
 ITA_r_the_ministry_of_labour: "The Ministry of Labour"
 ITA_r_the_ministry_of_labour_desc: "A department with inspectors, estimates and a seat in cabinet, whose business is the men who work. Every dispute in the Kingdom now has somewhere official to go before it reaches the street."
 ITA_r_the_white_leagues: "The White Leagues"
 ITA_r_the_white_leagues_desc: "Catholic unions, rural banks and parish co-operatives across the North, better organised than anything the Chamber has voted. They keep the countryside quiet and they do not take instructions from us."
 ITA_r_the_south_in_the_register: "The South in the Register"
 ITA_r_the_south_in_the_register_desc: "2 million Southern labourers now have a vote, in provinces where the state has meant a tax collector and a conscription list. They have found that Rome listens once they can be counted."
 ITA_r_the_party_that_split: "The Party That Split"
 ITA_r_the_party_that_split_desc: "Two socialist parties where there was one, each publishing that the other has betrayed the working class. The ministry is sustained by half of a movement and denounced by the other half every week."
 ITA_r_the_syndicalists_outside: "The Syndicalists Outside"
 ITA_r_the_syndicalists_outside_desc: "The men who walked out of the Bologna congress will not stand at another election. They want a general strike and are preparing for it in the open, and no law on the books makes that a crime."
 ITA_r_the_army_that_is_not_called: "The Army Off the Streets"
 ITA_r_the_army_that_is_not_called_desc: "No regiment may be called out in a labour dispute. The squares are quieter than they have been since unification. The officer corps has been told in writing that the country will not trust it at home."
 ITA_r_the_officers_memorial: "The Officers' Petition"
 ITA_r_the_officers_memorial_desc: "More colonels have signed the grievance than the ministry likes to count. They sent it to the King rather than to the Chamber. Nothing in it is treason, and the officers' messes remember every word. The regiments are slower and angrier for it, and the ministry is weaker."
 ITA_r_the_militia_establishment: "The Militia Army"
 ITA_r_the_militia_establishment_desc: "Men serve a short term in the army, then pass to a territorial reserve that can be called back. Officers rise by examination. It is an army for defending Italy, and the Extreme Left will vote the money for it. Training takes longer, our men hold their own ground well, and they are poor in the attack."
 ITA_r_the_capital_that_left: "The Flight of Capital"
 ITA_r_the_capital_that_left_desc: "Three of the big boards have announced that they will not invest in Italy for the present. Orders are postponed, new plant is cancelled, and the furnaces are banked. No law has been broken. Our factories work short, building is slow, and there is nothing the Chamber can order them to do."
 ITA_r_the_terms_with_the_industrialists: "The Bargain With Industry"
 ITA_r_the_terms_with_the_industrialists_desc: "We guarantee the mills state orders for years ahead. In return they sign an undertaking to keep their plant in Italy and to honour the contracts they have signed with their workmen. Neither side is grateful, and both sides keep to it. The works run fuller, new plant goes up faster, and the country is quieter for it."
 ITA_r_the_school_against_the_parish: "The State School"
 ITA_r_the_school_against_the_parish_desc: "Rome pays for the elementary schools now, and the teacher is a state servant with a pension. The curate is no longer the only man in the village who can read a printed page to a labourer. The country learns faster and lives better, and the parish clergy will not forgive us."
 ITA_r_the_pensions_act: "The Pensions Act"
 ITA_r_the_pensions_act_desc: "Old age and invalidity insurance is compulsory, and the contributions are collected through the registered chambers of labour. A pension is paid as a right and not as charity. It is the most expensive thing the Chamber has ever voted. The country is calmer and healthier, it costs a great deal every year, and men with a pension are slower to want a war."
 ITA_r_the_eight_hours: "The Shorter Working Day"
 ITA_r_the_eight_hours_desc: "The state has given its own men an eight-hour day in the arsenals, the railways and the naval yards. Every private works in the kingdom is now asked why it cannot do the same. The country is quieter, our factories and our yards turn out less, and the asking does not stop."
 ITA_r_the_kingdom_of_all_italians: "The Kingdom of All Italians"
 ITA_r_the_kingdom_of_all_italians_desc: "The party that meant to overthrow the Kingdom sits inside it now, arguing about the estimates. The quarrel that split the country has become a parliamentary quarrel. The Kingdom is steadier, richer and easier to lead than it was, and it is a great deal harder to frighten into a war."
 ITA_r_bonomi_at_the_door: "Ivanoe Bonomi"
 ITA_r_bonomi_at_the_door_desc: "A reformist socialist who explains the government to the chambers of labour and the chambers of labour to the government. Both sides listen to him, and neither quite believes him."
 ITA_r_nitti_at_labour: "Francesco Saverio Nitti"
 ITA_r_nitti_at_labour_desc: "He arrives at the new department with figures nobody asked for and the South behind him. Nobody in the cabinet can talk over him any more."
 ITA_r_tb_the_registered_halls: "The Trade Union Register"
 ITA_r_tb_the_evening_classes: "The Evening Classes"
 ITA_r_tb_the_labour_code: "The Labour Code"
 ITA_r_tb_the_territorial_militia: "The Territorial Militia"
 ITA_r_tb_the_state_orders: "The State Contracts"
 ITA_r_tb_the_lay_school: "The Secular School"
 ITA_r_turati_has_somewhere_to_stand_tt: "§GThe chambers of labour are recognised in law.§! Turati has an organisation behind him, and he says yes."
 ITA_r_the_offer_is_made_to_nobody_tt: "§RThe chambers of labour have no standing in law.§! We are bargaining with a party that cannot deliver what it promises."
 ITA_r_the_dead_of_milan_sit_between_them_tt: "§RTroops have been sent against a crowd.§! Any reformist who takes our hand must answer for it at his next meeting."
 ITA_r_nothing_stands_between_them_tt: "§GThis government has not fired on anybody.§! The reformists can deal with us without losing their own people."
 ITA_r_the_registers_already_exist_tt: "§GThe chambers of labour have been counted once already.§! Registering them is a formality, and their votes follow."
 ITA_r_ninety_halls_must_be_counted_tt: "§RNothing has been counted yet.§! 90 prefectures must list the workers' societies they have spent years closing."
 ITA_r_the_schools_got_there_first_tt: "§GThe Kingdom can read.§! The new voters went to school before they got the vote."
 ITA_r_the_ballot_is_read_aloud_tt: "§RHalf the register cannot read.§! Somebody reads the ballot out for them, and it is usually the mayor."
 ITA_r_the_mayor_cannot_deliver_them_tt: "§RThere are too many voters to buy.§! The prefects can still deliver §Y[?ITA_prefects|0]§! provinces out of 100, and no more."
 ITA_r_the_employers_remember_the_troops_tt: "§RThe employers remember the troops.§! They say a government that fired on strikers cannot now tell them what to sign."
 ITA_r_nobody_has_been_shot_over_a_wage_tt: "§GNo strike in this reign has been put down by rifle fire.§! The employers have no grievance to hide behind."
 ITA_r_the_halls_can_sign_for_a_trade_tt: "§GThe chambers of labour can sign for a whole trade.§! There is somebody on the other side to sign the code."
 ITA_r_the_estimates_pass_without_a_division_tt: "§GThe majority is solid.§! The new department gets its money without a fight, and its inspectors within the year."
 ITA_r_a_department_without_a_budget_tt: "§RThe majority is thin.§! The new department exists on paper, and it borrows its inspectors from Agriculture."
 ITA_r_the_leagues_come_in_with_a_vote_tt: "§GThe Pope has lifted his ban on Catholics voting.§! The Catholic leagues come into the Chamber instead of organising against it."
 ITA_r_the_leagues_organise_against_us_tt: "§RThe Pope still forbids Catholics to vote.§! The leagues organise the countryside, and they answer to the Vatican and not to us."
 ITA_r_the_pact_already_covers_the_communes_tt: "§GWe already have an understanding with the parish clergy.§! The leagues come in under it instead of against it."
 ITA_r_the_machine_still_holds_the_south_tt: "§YThe prefects still hold the South.§! The new voters are delivered in blocks, and every block has a price."
 ITA_r_the_south_votes_for_itself_tt: "§GThe prefects no longer run the South.§! The new voters answer to nobody, and we cannot count them in advance."
 ITA_r_they_have_something_to_vote_about_tt: "§GRome has answered the South.§! We have something to show the new voters when we ask for their votes."
 ITA_r_a_ballot_and_nothing_else_tt: "§RThe vote is all the South has been given.§! It arrives with a list of promises and nothing else behind it."
 ITA_r_the_intransigents_carry_the_hall_tt: "§RThe hard-liners carry the socialist congress.§! We keep the reformist deputies and lose the movement behind them."
 ITA_r_the_reformists_carry_the_hall_tt: "§GThe reformists carry the socialist congress.§! The men who walk out take the newspapers with them and leave the votes."
 ITA_r_they_took_the_party_with_them_tt: "§RThe men who walked out took the party with them.§! Every chamber of labour that followed them is working for a general strike."
 ITA_r_they_took_the_agitators_and_left_the_votes_tt: "§GThey took the agitators and left the voters behind.§! The chambers of labour that matter are still on the register."
 ITA_r_a_signed_contract_is_hard_to_strike_against_tt: "§GThe trades are under signed contracts.§! A general strike has to break agreements the workmen signed themselves."
 ITA_r_one_regiment_goes_back_to_barracks_tt: "§GOne standing garrison goes back to barracks.§! The troops are no longer a fixture in the streets of the city."
 ITA_r_the_order_was_never_given_tt: "§GThis government has never called troops out against a crowd.§! The order only puts in writing what the prefects already do."
 ITA_r_the_guards_take_the_duty_instead_tt: "§GThere is a police force for public order.§! We can send police where we used to send regiments."
 ITA_r_there_is_nobody_else_to_send_tt: "§RThere is no police force for public order.§! A prefect facing a crowd has the Carabinieri and his own nerve."
 ITA_r_they_have_been_paid_this_year_tt: "§GThe Chamber has voted the officers their pay.§! Their petition is a complaint and not an ultimatum."
 ITA_r_the_grievance_is_older_than_the_ministry_tt: "§RThe officers' pay was never settled.§! Their petition comes on top of 10 years of the same complaint."
 ITA_r_the_crown_reads_it_and_says_nothing_tt: "§RThe King reads the petition and sends it back without a word.§! He has not backed us, and the officers have noticed."
 ITA_r_the_memorial_is_answered_tt: "§GThe new army law gives the officers terms they can live with.§! The petition is withdrawn."
 ITA_r_the_establishment_is_already_cut_tt: "§GThe army has already been cut back.§! The militia law is written on top of a peace footing that is settled."
 ITA_r_the_classes_are_shortened_by_law_tt: "§YThe law has shortened the term of service.§! More men pass through the depots, and fewer of them stay."
 ITA_r_the_current_is_not_theirs_to_take_tt: "§GThe power stations belong to the state.§! The northern boards cannot switch off what they do not own."
 ITA_r_the_north_can_switch_off_the_lights_tt: "§RThe power stations are private.§! Three boards between them can bank the furnaces of Milan, Turin and Genoa."
 ITA_r_turin_keeps_its_workshops_open_tt: "§GThe fitters of Turin have works of their own.§! One shop keeps running whatever the boards decide."
 ITA_r_the_money_comes_back_on_terms_tt: "§GThe money is coming back.§! The investors return on terms that are written down and signed."
 ITA_r_the_chamber_sets_the_price_tt: "§GThe majority is strong enough to name the terms.§! We buy the plant at what it is worth and pay nothing for goodwill."
 ITA_r_they_set_the_price_tt: "§RThe majority is too thin to bargain.§! The industrialists write the agreement, and the Chamber votes it through."
 ITA_r_the_state_already_pays_the_teacher_tt: "§GThe state already pays the schoolmasters.§! Answering the parish school is now a question of building classrooms."
 ITA_r_the_commune_pays_and_the_curate_chooses_tt: "§RThe communes still pay the teachers.§! Half our schoolmasters are chosen by the men who wanted no school at all."
 ITA_r_two_schools_in_every_village_tt: "§YThere are two schools in every village.§! The parish and the state teach the same children different things."
 ITA_r_the_remittances_pay_a_part_of_it_tt: "§GWe govern the emigrant traffic and record the money sent home.§! The pension fund starts with something behind it."
 ITA_r_the_fund_is_short_from_the_first_year_tt: "§RThe fund is short in its first year.§! The Chamber has to find the money for a pension it has already promised."
 ITA_r_the_halls_collect_the_contributions_tt: "§GThe registered chambers of labour collect the contributions.§! We do not have to build an office to gather the money."
 ITA_r_the_yards_are_building_and_cannot_stop_tt: "§RThe naval programme is running.§! The yards are on contract time, and shorter hours come out of the navy estimates."
 ITA_r_the_arsenals_can_afford_the_hours_tt: "§GThe yards have no programme to finish.§! We can grant the shorter day where the state is the only employer."
 ITA_r_the_private_trades_ask_for_the_same_tt: "§GThe trades are already under contract.§! The private works are asked in writing for the same hours."
 ITA_r_the_private_yards_refuse_it_tt: "§RThe private yards refuse the shorter day.§! Their men can see what the state gives its own workmen."
 ITA_r_the_street_has_nothing_left_to_ask_tt: "§GThe street has run out of demands.§! The settlement holds, because nothing is left that is worth a barricade."
 ITA_r_the_street_is_still_out_there_tt: "§RThe street has not been answered.§! We are signing a settlement on top of a grievance that is still open."
 ITA_r_a_free_hand_the_left_can_live_with_tt: "§GThe alliance has been ended.§! The Extreme Left can vote for our foreign policy for the first time."
 ITA_r_the_convention_is_kept_from_the_ministry_tt: "§RThe alliance is kept.§! The military convention is hidden from our own cabinet because a socialist sits in it, and Vienna is told why."
 ITA_z_the_proletarian_nation: "The Workers' Nation"
 ITA_z_the_proletarian_nation_desc: "The government has taken up Corradini's phrase: Italy is a poor nation among rich ones, and is owed its place. The country is louder and prouder for it, and harder to govern. The men who sell us grain and coal have heard the change of tone, and they deal with us on worse terms."
 ITA_z_the_idea_nazionale: "L'Idea Nazionale"
 ITA_z_the_idea_nazionale_desc: "A daily paper that belongs to no group in the Chamber and lives on what its readers pay. We cannot bring it to heel by withholding the government advertisements. It sets the terms of the argument every morning, and the ministry reads it before it does anything else."
 ITA_z_the_associazione_nazionalista: "The Nationalist Association"
 ITA_z_the_associazione_nazionalista_desc: "There is a committee in every provincial capital, made up of the men the prefect would have invited anyway. They are respectable and monarchist, and they keep the socialists out of the drawing rooms. They are useful to us for as long as we say what they expect to hear."
 ITA_z_trento_e_trieste: "Trento e Trieste"
 ITA_z_trento_e_trieste_desc: "Trento and Trieste are Italian towns under Austrian rule, and getting them back is now our declared policy. Saying so costs us nothing today. Taking them would cost a war, and we can no longer stop saying it. Vienna reads our newspapers now with a pencil in its hand."
 ITA_z_the_paper_read_aloud: "The Paper Read Aloud"
 ITA_z_the_paper_read_aloud_desc: "The national argument now travels past the last railway station. In villages where few can read, somebody reads the paper out loud in the square. It arrives simplified, and in that form it is worth more to a recruiting sergeant than to an editor."
 ITA_z_the_nation_before_the_class: "The Nation Before the Class"
 ITA_z_the_nation_before_the_class_desc: "The reviews teach it and the meeting halls repeat it: a man owes more to his country than to his class. The quarrel between workman and master has lost its heat. What the workmen are angry about now lies across a frontier, and the factories get less out of them."
 ITA_z_the_schools_beyond_the_frontier: "The Schools Beyond the Frontier"
 ITA_z_the_schools_beyond_the_frontier_desc: "We pay Italian schoolmasters to teach in towns we do not govern. It buys us goodwill among Italians under a foreign flag, and a standing quarrel with the government that rules them."
 ITA_z_the_schools_beyond_the_frontier_reinforced: "The Frontier Schools Reinforced"
 ITA_z_the_schools_beyond_the_frontier_reinforced_desc: "We have doubled the teaching grant, and the inspectors now travel on consular passports. Every schoolmaster sends back what he sees on the road he takes to work, and our staff learn the ground from it."
 ITA_z_the_alliance_on_terms: "The Alliance on Terms"
 ITA_z_the_alliance_on_terms_desc: "The treaty still stands and the staff talks go on. The Consulta, our foreign ministry, now keeps a written record of what the alliance has given us and what it has cost. Our allies know they are being audited, and so do their enemies."
 ITA_z_the_lantern_circuit: "The Travelling Lectures"
 ITA_z_the_lantern_circuit_desc: "A lecturer, 40 glass slides and a folding screen go round the market towns, where the last public meeting was about a bridge. It is cheap and it is slow. It works very well on young men of 19, and a good many of them enlist."
 ITA_z_the_italian_bottoms: "Our Own Emigrant Ships"
 ITA_z_the_italian_bottoms_desc: "Our emigrants sail in Italian ships now, and Italian officers inspect the ships before they leave. The yards have steady work. The consuls get a passenger list, and the fares are paid to Italian companies instead of foreign ones."
 ITA_z_the_syndicalists_of_the_nation: "The Nationalist Unions"
 ITA_z_the_syndicalists_of_the_nation_desc: "Union organisers who know how to call a strike are working for the government instead of against it. They bring discipline and a following with them. They also bring quarrels no cabinet has had to settle before, and the country is noisier for it."
 ITA_z_the_consular_service: "The Consular Service"
 ITA_z_the_consular_service_desc: "We have opened small consulates in small Adriatic ports. Each has a code book and money for a school. What they send back is less diplomacy than soundings, and the naval staff has asked for a copy of everything."
 ITA_z_the_national_subscription: "The National Subscription"
 ITA_z_the_national_subscription_desc: "The money is raised by public subscription. The lists, the totals and the names of the subscribers are all printed. It is slower than voting a credit in the Chamber. It also puts far more people behind the policy, and that is why we chose it."
 ITA_z_the_strike_is_a_national_question: "The Strike Decree"
 ITA_z_the_strike_is_a_national_question_desc: "The decree covers every shipyard and every main line. A strike on them is a matter for the state now, not for the employer. The trains run and we are obeyed. The country no longer believes the state is a stranger to the quarrel."
 ITA_z_the_fourth_shore_programme: "The Fourth Shore"
 ITA_z_the_fourth_shore_programme_desc: "The Fourth Shore is the coast we mean to settle in Africa. We are promising surveys, land grants and sailings before we hold a foot of it. Men and money are leaving Italy on the strength of that promise."
 ITA_z_the_receipt_from_vienna: "The Price Asked of Vienna"
 ITA_z_the_receipt_from_vienna_desc: "We have asked Vienna, in writing, to say what our friendship is worth to her. The question cannot be taken back. Europe has been told that we asked it, and every chancellery is waiting for the answer."
 ITA_z_the_nation_in_arms: "The Nation in Arms"
 ITA_z_the_nation_in_arms_desc: "Every man of military age has been trained, and the towns are full of men who have handled a rifle. We can raise more soldiers and raise them faster. It is paid for out of every other bill on the table."
 ITA_z_the_country_that_cannot_climb_down: "The Country Cannot Climb Down"
 ITA_z_the_country_that_cannot_climb_down_desc: "Every ministry that follows is a prisoner of 10 years of speeches. No government can go to the Chamber now and propose to back down. The country will stand a hard blow better than it will stand an apology, and it is harder to govern for it."
 ITA_z_mare_nostrum: "Mare Nostrum"
 ITA_z_mare_nostrum_desc: "Mare nostrum means our sea. We have printed a programme that calls the Adriatic an Italian question and names the harbours we want. The fleet reads it as an order. The Treasury reads it as a bill, and the Austrian base at Pola reads it as a warning."
 ITA_z_greater_italy: "The Greater Italy"
 ITA_z_greater_italy_desc: "The whole programme is declared: the lands under Austria, the Adriatic, the African shore. The kingdom is measured against it every day. Men enlist, a war is easy to justify, and everything at home that is still unfinished begins to look like a betrayal."
 ITA_national_union: "Unione Nazionale"
 ITA_national_union_long: "Unione Nazionale Italiana"
 ITA_z_corradini_at_the_paper: "Corradini at the Paper"
 ITA_z_corradini_at_the_paper_desc: "He invented the argument, and he will not let it be softened to suit a majority. He is useful in a meeting hall and dangerous in a cabinet. We cannot drop him now that his phrase is in the King's speech."
 ITA_z_boselli_at_the_dante: "Boselli at the Dante"
 ITA_z_boselli_at_the_dante_desc: "He is 70 years old and sits on every committee in Rome. He presides over the Dante Alighieri society, which keeps a school in half the towns of the Adriatic. He can raise a subscription in an afternoon without offending anybody."
 ITA_z_tb_the_national_argument: "The National Argument"
 ITA_z_tb_the_press_room: "The Nationalist Press"
 ITA_z_tb_the_reading_rooms: "The Reading Rooms"
 ITA_z_tb_the_dante_lectures: "The Dante Alighieri Lectures"
 ITA_z_tb_the_terms_are_drafted: "The Terms Are Drafted"
 ITA_z_tb_the_emigrant_liners: "The Emigrant Liners"
 ITA_z_tb_the_cipher_from_durazzo: "The Cipher Telegram from Durazzo"
 ITA_z_tb_the_subscription_ship: "A Ship by Subscription"
 ITA_z_tb_the_subscription_schools: "Schools by Subscription"
 ITA_z_tb_the_terms_are_read_twice: "The Terms Are Read Twice"
 ITA_z_tb_the_nation_in_arms: "The Nation in Arms"
 ITA_z_tb_the_sea_that_must_be_ours: "The Adriatic Programme"
 ITA_z_tb_the_greater_italy: "The Greater Italy"
 ITA_z_threat_the_state_irredenta: "Italy has made the Italian lands under Austria a matter of state policy"
 ITA_z_threat_the_school_question: "Italy is paying for Italian schools across the frontier"
 ITA_z_threat_the_adriatic_consulates: "Italian consulates are opening along the Adriatic"
 ITA_z_threat_the_compensation_demanded: "Italy has demanded compensation in advance"
 ITA_z_threat_the_terms_are_published: "Italy has published the terms of the alliance"
 ITA_z_threat_the_receipt_refused: "Italy has been refused her compensation"
 ITA_z_threat_the_receipt_torn_up: "Italy has ended her bargain with Vienna"
 ITA_z_threat_the_fourth_shore: "Italy is planning to settle a coast she does not hold"
 ITA_z_threat_the_settlement_scheme: "Italy is promising land in Tripolitania"
 ITA_z_threat_the_adriatic_programme: "Italy has named the harbours she wants"
 ITA_z_threat_the_adriatic_squadron: "The Italian squadron has moved north"
 ITA_z_threat_the_country_that_cannot_climb_down: "Italy can no longer withdraw from her own programme"
 ITA_z_threat_the_programme_has_a_date: "Italy has set a deadline for her programme"
 ITA_z_threat_the_greater_italy: "Italy has declared the whole of her programme"
 ITA_z_tt_the_street_hears_proletarian_and_stops_listening: "The street hears the word proletarian and stops listening to the rest"
 ITA_z_tt_the_notables_sign_the_appeal: "The leading men of each province sign the appeal without being asked twice"
 ITA_z_tt_the_paper_prints_the_phrase_back: "Every week the paper prints our own phrase back at us: a great power on paper"
 ITA_z_tt_a_weekly_with_a_press_of_its_own: "It is a weekly with a printing press of its own, and nothing more"
 ITA_z_tt_the_paper_turns_on_the_ministry_too: "The paper turns on the ministry as readily as on the opposition"
 ITA_z_tt_the_lobby_reads_it_before_breakfast: "The deputies read it before breakfast and vote accordingly"
 ITA_z_tt_the_paper_hands_over_its_subscription_list: "The paper hands its list of subscribers to the founders of the association"
 ITA_z_tt_a_congress_nobody_reported: "A congress that no newspaper thought worth reporting"
 ITA_z_tt_the_ally_reads_the_speech_from_the_throne: "Our ally reads the King's speech from the throne, and then reads it again"
 ITA_z_tt_the_claim_is_already_public: "The claim was public already, and this only makes it official"
 ITA_z_tt_the_consulta_has_not_been_told: "The Consulta, our foreign ministry, learns of the policy from the newspapers"
 ITA_z_tt_the_readers_do_not_need_a_reader: "The country can read it for itself"
 ITA_z_tt_the_schoolmaster_reads_it_out: "The state schoolmaster reads it out on Sunday"
 ITA_z_tt_half_the_kingdom_is_told_what_it_says: "Half the kingdom hears what the paper says from whoever is holding it"
 ITA_z_tt_the_commissariat_already_keeps_the_register: "The Commissariat for Emigration already keeps the register"
 ITA_z_tt_nobody_knows_how_many_left_last_year: "Nobody in Rome can say how many left last year"
 ITA_z_tt_the_argument_is_made_at_home_instead: "We make the argument to the men who are staying at home"
 ITA_z_tt_the_chambers_of_labour_answer_it: "The chambers of labour answer the doctrine with one of their own"
 ITA_z_tt_the_argument_lands_on_quiet_ground: "There is nobody to argue back, and the doctrine takes root"
 ITA_z_tt_the_troops_already_answered_the_argument: "Troops answered this argument once before, and nobody has forgotten it"
 ITA_z_tt_vienna_protests_and_is_answered_politely: "Vienna protests, and we answer very politely"
 ITA_z_tt_the_schools_are_closed_by_the_statthalter: "The Austrian governor closes the schools and makes them famous"
 ITA_z_tt_the_renewal_now_has_a_price_written_on_it: "The renewal of the alliance now has a price written on it"
 ITA_z_tt_there_is_nothing_left_to_price: "There is no alliance left to put a price on"
 ITA_z_tt_the_consulta_is_instructed_before_it_signs: "The foreign ministry takes its instructions before it signs anything"
 ITA_z_tt_the_prefect_lends_the_hall: "The prefect lends the hall and sits in the front row"
 ITA_z_tt_the_hall_is_hired_by_subscription: "The subscribers pay for the hall out of their own pockets"
 ITA_z_tt_the_same_lecturer_goes_to_trieste: "The same lecturer takes his slides across to Trieste"
 ITA_z_tt_the_export_yard_takes_the_order: "The yard that builds for export takes the order for the liners"
 ITA_z_tt_the_lines_are_chartered_from_abroad: "The ships are chartered abroad, and our flag on them is a courtesy"
 ITA_z_tt_the_third_class_deck_is_ours_to_answer_for: "The third-class decks are ours to answer for now"
 ITA_z_tt_they_bring_a_following_with_them: "They bring their organisers and a following with them"
 ITA_z_tt_they_bring_only_themselves: "They bring themselves and a printing press"
 ITA_z_tt_the_association_will_not_sit_with_them: "The Nationalist Association will not sit at a table with them"
 ITA_z_tt_valona_is_already_watched: "We watch Valona already, and the consulate only makes it official"
 ITA_z_tt_the_consulates_are_opened_first: "The consulates are opened before anyone has decided why"
 ITA_z_tt_the_naval_staff_asked_for_this_years_ago: "The naval staff asked for exactly this years ago"
 ITA_z_tt_the_ballhausplatz_is_handed_the_bill: "Vienna is handed the bill in advance"
 ITA_z_tt_they_pay_because_they_still_need_us: "They pay, because the alliance still needs our signature"
 ITA_z_tt_they_answer_that_the_article_says_consultation: "Vienna answers that the treaty only requires them to consult us, and pays nothing"
 ITA_z_tt_the_lecturers_pass_the_hat: "The lecturers pay for the circuit by collecting money from the audience"
 ITA_z_tt_the_lists_are_short: "The subscription lists are short, and the same 11 families head every one of them"
 ITA_z_tt_the_money_is_asked_for_a_ship: "The subscription asks the country for money to build a warship"
 ITA_z_tt_the_money_is_asked_for_the_schools: "The subscription asks the country for money for the Italian schools in Austria"
 ITA_z_tt_the_troops_go_out_and_the_floor_rises: "Troops are sent against the crowds, and the streets never go quiet again"
 ITA_z_tt_the_decree_is_printed_and_not_yet_used: "The decree is printed and kept in the prefect's drawer, ready to use"
 ITA_z_tt_the_squadrons_answer_instead_of_the_line: "The Carabinieri squadrons are called out instead of the army"
 ITA_z_tt_the_barracks_answer_and_remember_it: "The army answers, and does not forget that it was asked to police the streets"
 ITA_z_tt_the_land_is_ours_and_now_must_be_filled: "We hold the Fourth Shore, our coast in Africa, and now we must settle it"
 ITA_z_tt_the_promise_is_turned_into_a_prospectus: "The promise of land in Tripoli is printed as an offer to settlers"
 ITA_z_tt_a_programme_for_a_shore_we_do_not_hold: "We plan the settlement of a coast we do not yet hold"
 ITA_z_tt_the_register_is_told_where_to_go: "The emigration office sends the emigrants to the ports we choose"
 ITA_z_tt_the_ledger_is_already_closed: "We have already had everything from Vienna that the alliance was going to give"
 ITA_z_tt_the_ally_pays_in_words_and_a_railway: "Vienna pays us in warm words and one railway concession"
 ITA_z_tt_petersburg_holds_the_other_copy: "Petersburg holds the other copy of the agreement"
 ITA_z_tt_the_full_class_is_already_called: "We already call up every man of military age each year"
 ITA_z_tt_the_estimates_are_asked_for_all_at_once: "We ask the Chamber for the whole of the army and navy estimates at once"
 ITA_z_tt_the_rifle_clubs_are_full: "The lectures send men to the rifle clubs, and the clubs are full"
 ITA_z_tt_the_street_is_already_ahead_of_the_ministry: "The crowds now want more than the ministry that taught them will give"
 ITA_z_tt_the_ministry_is_still_a_length_ahead: "The ministry still leads the movement it started"
 ITA_z_tt_the_floor_under_the_street_is_now_high: "The troops have been used too often for the streets to be quiet again"
 ITA_z_tt_no_ministry_may_now_concede: "We can give nothing up now without being called traitors"
 ITA_z_tt_the_fleet_was_built_to_go_out: "The fleet was built for the open sea, and this programme suits it"
 ITA_z_tt_the_fleet_was_built_to_stay_in: "The fleet was built to guard our coast, and this programme does not suit it"
 ITA_z_tt_the_programme_arrives_before_the_fleet: "The programme is announced years before the ships to carry it out exist"
 ITA_z_tt_the_consuls_have_already_named_the_harbours: "Our consuls had already named the harbours we want"
 ITA_z_tt_the_chamber_votes_the_programme_entire: "The Chamber votes the whole programme through without changing a word"
 ITA_z_tt_the_programme_is_carried_over_the_chamber: "The programme goes through by decree, over the Chamber's head"
 ITA_z_tt_the_street_will_be_asked_to_pay_for_it: "The country will be taxed for it, and the country knows"
 ITA_z_tt_the_students_are_moved_on_quietly: "The police move the students on quietly and nothing is reported"
 ITA_z_tt_the_doctrine_is_left_in_the_reviews: "The idea stays in the magazines where it started"
 ITA_z_tt_the_notables_keep_the_committee: "The local worthies keep the committee, and the newcomers keep the street"
 ITA_z_tt_the_prospectus_is_left_on_the_table: "The scheme is put aside until a better year"
 ITA_z_tt_the_rifles_stay_in_the_armoury: "The rifles stay in the armoury, and the clubs drill with sticks"
 ITA_z_tt_the_squadron_stays_at_taranto: "The squadron stays in port at Taranto and the programme stays on paper"
 ITA_z_tt_the_floor_never_comes_down_again: "The streets will not go back to what they were before this week"
 ITADNC_air_the_airship_goes_to_sea: "Airships for the Navy"
 ITADNC_air_the_airship_goes_to_sea_desc: "An airship from the lagoon can watch the Adriatic all day and count every ship leaving Pola. We will hand our dirigibles to the navy, and sit through the army's protests every budget season."
 ITADNC_air_the_memoranda_of_douhet: "Douhet's Papers"
 ITADNC_air_the_memoranda_of_douhet_desc: "Major Douhet of the bersaglieri has never flown, yet keeps sending us papers arguing that the air is a battlefield of its own. We will read them and give him a desk. Half of it is wrong, and all of it is early."
 ITADNC_air_the_engine_that_is_ours: "An Italian Aero Engine"
 ITADNC_air_the_engine_that_is_ours_desc: "Every aeroplane we own turns a French engine bought at a French price. We will ask Fiat, Isotta Fraschini and the fitters of Turin for an engine of our own, and pay for the early failures too."
 ITADNC_air_the_seaplane_station: "The Seaplane Station"
 ITADNC_air_the_seaplane_station_desc: "Along most of our coast an aeroplane can land only on water, and a machine that comes down at sea is lost. We will build seaplane stations with slipways and cranes on the lagoon and the Ligurian shore."
 ITADNC_air_the_orders_of_the_ministry: "A Standing Order for Aeroplanes"
 ITADNC_air_the_orders_of_the_ministry_desc: "We buy aeroplanes one at a time, whenever an officer asks. We will fix the types and deliveries years ahead, so a firm that knows we will keep buying can build a workshop and hire the men."
 ITA_air_the_lesson_of_wilbur_wright: "The Lesson of Wilbur Wright"
 ITA_air_the_lesson_of_wilbur_wright_desc: "A handful of our officers were taught to fly by Wilbur Wright himself, and they are teaching the next handful.\n\nIt is not an air service yet. It is a small school of men who know something nobody else in Italy knows, and they break fewer machines than anyone."
 ITA_air_the_dirigible_lobby: "The Airship Lobby"
 ITA_air_the_dirigible_lobby_desc: "The airship engineers hold the aeronautical money, the sheds and the ear of the ministry. They spend much of their time explaining why the aeroplane is not ready.\n\nWe get range and reconnaissance from them. We pay for it in nimble machines, in the speed of our building, and in the political power it takes to refuse them."
 ITA_air_the_answer_of_the_world: "Europe Takes Notice"
 ITA_air_the_answer_of_the_world_desc: "We were the first country to drop a bomb from an aeroplane. Every staff in Europe now keeps a file on how we did it.\n\nOur airmen have learned to aim, and the country is proud of them. We are also watched closely, and a power that wants a quarrel with us finds its case sooner."
 ITA_air_the_makers_of_the_kingdom: "Our Own Aircraft Makers"
 ITA_air_the_makers_of_the_kingdom_desc: "A short list of firms in the kingdom can build an aeroplane. We keep them alive with orders we do not strictly need yet.\n\nIt costs more than buying from Paris, and our airfields go up faster because the work is at home. It is also the only way we shall ever stop buying from Paris."
 ITA_air_the_hangars_of_the_north: "The Hangars of the North"
 ITA_air_the_hangars_of_the_north_desc: "Our airship stations sit inland, with the frontier passes on one side and our own provinces on the other. They fly over both.\n\nThe photographs go to the army staff. The prefects ask for copies of their own provinces, and they get them."
 ITA_air_the_airship_goes_to_sea: "Airships for the Navy"
 ITA_air_the_airship_goes_to_sea_desc: "The dirigibles belong to the navy now. They work over water, report what leaves the far shore, and fly with our convoys.\n\nThe fleet and the air service have learned to work to the same orders. The army says the word aviation coldly now, and says it often."
 ITA_air_the_memoranda_of_douhet: "Douhet's Papers"
 ITA_air_the_memoranda_of_douhet_desc: "We have a full theory of air war before we have the aeroplanes to fight one. It is written out, circulated and argued with in every mess.\n\nOur airmen learn faster for it, and they bomb straighter. The generals spend their time reading and replying, which is time they do not spend commanding."
 ITA_air_the_schools_at_the_makers_fields: "The Makers' Flying Schools"
 ITA_air_the_schools_at_the_makers_fields_desc: "Flying is taught by the men who build the machines, on their own fields, to anyone who can pay. Our pilots learn faster and crash less than the army school could manage.\n\nIt is cheaper than the army school, and it is entirely outside the army. The men who come out of it belong to nobody in particular."
 ITA_air_the_lobby_is_answered: "The Airship Argument Settled"
 ITA_air_the_lobby_is_answered_desc: "The airship question is settled. The aeronautical estimate is no longer an argument between two parties of engineers.\n\nThe ministry writes one programme now instead of refereeing two. The airfields go up faster, the machines handle better, and we spend less political power keeping the peace."
 ITA_air_the_command_of_the_air: "The Command of the Air"
 ITA_air_the_command_of_the_air_desc: "We keep squadrons meant to fly past the army and strike what lies behind it. The doctrine is written down and taught.\n\nOur bombing is accurate and the country is proud of it. The machines are not equal to the idea, and we fly them as though they were, so we lose more of them."
 ITA_air_the_orders_of_the_ministry: "The Standing Order for Aeroplanes"
 ITA_air_the_orders_of_the_ministry_desc: "One order, with the types fixed and the deliveries fixed. The makers can hire men, lay out a shop and plan a year ahead.\n\nOur airfields and our factories go up faster because the work is certain. We have tied our own hands for three years to get it, and the Chamber reminds us of that."
 ITA_air_the_reserve_of_pilots: "The Reserve of Pilots"
 ITA_air_the_reserve_of_pilots_desc: "We keep a register of every man in the kingdom who holds a pilot's licence. Each name has a signed undertaking beside it.\n\nOn the day we call them in, the flying service is three times the size it was yesterday. A squadron that loses men keeps most of what it knew."
 ITA_air_the_naval_flying_service: "The Naval Flying Service"
 ITA_air_the_naval_flying_service_desc: "The fleet has its own aviators, its own stations and its own idea of what aeroplanes are for. They strike ships better than the army could teach them to.\n\nWe now keep two flying services instead of one. They compete for every officer, every shed and every hour of the staff's time."
 ITA_air_the_arm_of_its_own: "The Air Service"
 ITA_air_the_arm_of_its_own_desc: "Aviation is a service now, with a director, a staff and a career of its own. A pilot no longer has to go back to an infantry regiment to be promoted.\n\nEverything improvised since the old balloon company has an address and a budget. Our airmen train better, fly better and break fewer machines."
 ITA_air_crocco_at_the_works: "Crocco at the Airship Works"
 ITA_air_crocco_at_the_works_desc: "Gaetano Crocco designs our airships and argues for them in the ministry. He knows more about lift, fabric and engines than anyone else in the kingdom.\n\nHe is right about the airship for the moment. He will go on arguing for it long after the aeroplane has passed it."
 ITA_air_tt_calderara_teaches_what_he_was_taught: "Mario Calderara stays on the field and teaches what Wilbur Wright taught him."
 ITA_air_tt_the_lesson_is_not_written_down: "Wilbur Wright goes home and nobody writes down what he taught."
 ITA_air_tt_the_crowd_at_centocelle: "Half of Rome comes out to the field at Centocelle to watch the flying."
 ITA_air_tt_the_left_asks_what_it_is_for: "The Extreme Left accepts the flying school and asks what we mean to do with it."
 ITA_air_tt_the_field_is_closed_to_the_press: "The field is closed to the press and the flights are reported by the prefecture."
 ITA_air_tt_the_ministry_takes_the_credit: "The ministry takes the credit and the money passes without a vote."
 ITA_air_tt_crocco_speaks_for_the_airship: "Gaetano Crocco is available to advise us, and he will argue for the airship."
 ITA_air_tt_the_lobby_is_a_constituency: "The airship men are a voting interest like any other, and we treat them as one."
 ITA_air_tt_the_ministry_does_not_consult: "The minister receives the airship men and then decides without them."
 ITA_air_tt_the_left_prices_the_shed: "The Extreme Left reads out how many schoolrooms one airship shed would pay for."
 ITA_air_tt_the_airship_is_a_flag: "An airship over a city is worth more to us than anything it can carry."
 ITA_air_tt_the_motor_trade_answers: "The Turin motor trade sends fitters, benches and a working drawing office."
 ITA_air_tt_the_shed_stands_alone: "No motor trade stands behind the shed, so every part has to be made twice."
 ITA_air_tt_an_italian_machine_at_last: "An aeroplane designed, built and flown in the kingdom, and the papers print it for a week."
 ITA_air_tt_the_ministry_prefers_to_buy_abroad: "The ministry would rather buy abroad, and the Chamber votes it down politely."
 ITA_air_tt_the_current_fills_the_envelope: "Our own electricity makes the hydrogen, so the gas costs us nothing abroad."
 ITA_air_tt_the_gas_is_bought_in: "We buy the hydrogen abroad, and the sheds wait on somebody else's delivery."
 ITA_air_tt_the_airship_watches_the_provinces: "The airships photograph our own provinces as readily as the frontier, and the prefects ask for copies."
 ITA_air_tt_the_estimates_are_read_out_line_by_line: "The Extreme Left reads the aeronautical estimate out line by line."
 ITA_air_tt_the_kingdom_signs_nothing: "We refuse to sign anything limiting what may be dropped from an aeroplane."
 ITA_air_tt_the_kingdom_sends_a_note: "We send a note explaining that the grenades were aimed at a military camp."
 ITA_air_tt_the_feat_is_taught_in_schools: "The flight over the oasis is printed in the school readers within the year."
 ITA_air_tt_the_chamber_hears_the_word_murder: "The word murder is used in the Chamber and is not withdrawn."
 ITA_air_tt_the_papers_are_told_what_to_print: "The prefects tell the newspapers what the despatch actually said."
 ITA_air_tt_the_ministry_says_as_little_as_possible: "The ministry says as little as possible and waits for the next subject."
 ITA_air_tt_turin_takes_the_second_contract: "Turin takes the second contract, and the north has two aeroplane shops instead of one."
 ITA_air_tt_one_shop_for_a_kingdom: "One aeroplane shop for the whole kingdom, and every order waits behind the last."
 ITA_air_tt_the_left_wants_the_works_inspected: "The Extreme Left votes the contracts and sends inspectors with them."
 ITA_air_tt_the_nation_makes_its_own_wings: "We build our own aeroplanes and stop flying on what Paris agrees to sell us."
 ITA_air_tt_the_passes_are_photographed: "The frontier survey is photographed from the air and the maps are corrected."
 ITA_air_tt_there_is_no_map_to_correct: "There is no frontier survey to correct, so the photographs go into a drawer."
 ITA_air_tt_the_prefects_ask_for_the_photographs: "The prefects ask for copies of the photographs and are given them."
 ITA_air_tt_the_photographs_go_to_the_land_registry: "The photographs go to the land registry and settle four boundary disputes."
 ITA_air_tt_pola_is_counted_from_the_air: "The ships in Pola are counted from the air, in daylight, once a week."
 ITA_air_tt_nobody_asked_the_admirals_what_for: "The airships go to the navy before anyone asks the admirals what they want them for."
 ITA_air_tt_vienna_is_told_it_is_for_the_customs: "Vienna is told the airships are for the customs service and does not believe it."
 ITA_air_tt_the_adriatic_is_watched_openly: "We watch the Adriatic openly, and we mean Vienna to see us do it."
 ITA_air_tt_douhet_is_given_a_desk: "Giulio Douhet is given a desk, a file and the right to circulate what he writes."
 ITA_air_tt_the_papers_circulate_unsigned: "The papers circulate unsigned, and four different officers are said to have written them."
 ITA_air_tt_the_staff_reads_to_the_end: "The staff reads to the end, disagrees on paper, and keeps the file open."
 ITA_air_tt_the_memoranda_are_filed: "The papers are acknowledged, filed, and shown to nobody else."
 ITA_air_tt_the_reviews_print_him: "The nationalist magazines print him in full and treat him as a prophet."
 ITA_air_tt_the_ministry_prefers_him_quiet: "The ministry would rather he wrote less and is careful not to say so."
 ITA_air_tt_the_fitters_already_know_the_work: "The fitters of Turin have worked to a thousandth of an inch for 10 years."
 ITA_air_tt_the_first_engines_seize: "The first engines seize on the bench and the programme starts again."
 ITA_air_tt_the_left_asks_who_owns_the_patent: "The Extreme Left asks who will own the patent and is answered in writing."
 ITA_air_tt_no_more_french_rotaries: "We stop buying engines from Paris, and Paris is told why."
 ITA_air_tt_the_gunmaker_takes_the_wing_spar: "The gun works has the steel, the tools and the men, and takes on the wing frames."
 ITA_air_tt_a_shop_without_a_trade: "A new shop with no trade behind it learns the work the expensive way."
 ITA_air_tt_the_chamber_asks_about_the_contract: "The Chamber asks how the Ansaldo contract was awarded and gets no clear answer."
 ITA_air_tt_genoa_votes_the_right_way: "Genoa has the work, and Genoa votes for the ministry that gave it."
 ITA_air_tt_centocelle_sets_the_syllabus: "The army school at Centocelle sets the syllabus, and the private schools teach to it."
 ITA_air_tt_every_school_teaches_its_own_way: "Every school teaches its own way, and a pilot's licence means something different at each."
 ITA_air_tt_the_schools_take_men_without_a_name: "The schools take any man who can pay, which is not how the army chooses officers."
 ITA_air_tt_the_register_of_the_schools_is_copied: "The prefecture takes a copy of every school register as a matter of course."
 ITA_air_tt_the_aeroplane_men_win_on_the_figures: "The aeroplane men win on cost, on numbers and on how quickly one can be replaced."
 ITA_air_tt_the_airship_men_keep_the_room: "The airship men keep the estimates, the sheds and the argument."
 ITA_air_tt_the_minister_decides_alone: "The minister decides between them alone and informs the Chamber afterwards."
 ITA_air_tt_both_sides_keep_something: "Both sides keep part of what they asked for, and neither is satisfied."
 ITA_air_tt_calderara_gets_his_water: "Mario Calderara gets the seaplane station he has been asking for since he learned to fly."
 ITA_air_tt_the_station_waits_for_a_pilot: "The slipway is built and the station waits for somebody who can use it."
 ITA_air_tt_a_machine_that_saves_fishermen: "The first thing the station does is take three fishermen off a sandbank."
 ITA_air_tt_the_sea_is_ours_to_watch: "The sea between the two shores is ours to watch, and we shall watch it."
 ITA_air_tt_libya_is_the_only_evidence_anyone_has: "Libya is the only war anybody in Europe has flown in, and it was ours."
 ITA_air_tt_a_doctrine_without_a_precedent: "A doctrine that has never been tried in war is still only an opinion."
 ITA_air_tt_the_ministry_is_asked_why_bombs_are_an_item: "The Chamber asks why bombs are an item in the estimates of a country at peace."
 ITA_air_tt_a_weapon_worthy_of_the_nation: "The nationalists call it a weapon that does not have to wait for the army."
 ITA_air_tt_the_estimate_is_taken_by_decree: "The bombardment estimate is taken by decree and laid before the Chamber later."
 ITA_air_tt_the_item_is_called_experimental: "The item is entered as experimental and passes without discussion."
 ITA_air_tt_the_machine_matches_the_memorandum: "For once the aeroplane on the field is the one the papers described."
 ITA_air_tt_nobody_can_say_what_it_is_for: "It is the largest aeroplane in the world and nobody can say what it is for."
 ITA_air_tt_the_largest_aeroplane_in_europe: "The largest aeroplane in Europe is Italian, and every foreign attache comes to look."
 ITA_air_tt_the_order_is_placed_quietly: "The order is placed quietly and announced after the machines are delivered."
 ITA_air_tt_the_makers_can_lay_out_a_shop: "With three years of orders in hand the makers hire, build and plan ahead."
 ITA_air_tt_an_order_with_nobody_to_fill_it: "A standing order and nobody in the kingdom able to fill it on time."
 ITA_air_tt_the_order_never_reaches_the_chamber: "The order is signed in the ministry and never reaches the Chamber at all."
 ITA_air_tt_the_contract_is_printed_in_full: "The contract is printed in full, prices included, and nobody finds a fault in it."
 ITA_air_tt_the_battalion_gets_a_second_intake: "The aviators' battalion takes a second intake without waiting for the yearly call-up."
 ITA_air_tt_a_register_and_nowhere_to_send_them: "We have a register of pilots and no air service to send them to."
 ITA_air_tt_the_undertaking_is_not_optional: "The pilots are asked to sign, and in practice they are not free to refuse."
 ITA_air_tt_the_undertaking_may_be_declined: "A pilot may refuse to sign, and the register notes who refused."
 ITA_air_tt_they_sign_before_they_are_asked: "Half of them have signed before the circular reaches their school."
 ITA_air_tt_the_admiralty_pays_for_it_itself: "The navy pays for its aviators out of its own money and owes the army nothing."
 ITA_air_tt_two_services_one_estimate: "Two flying services and one aeronautical estimate between them."
 ITA_air_tt_the_two_services_are_reconciled_on_paper: "The two services are reconciled on paper, and go on quarrelling everywhere else."
 ITA_air_tt_the_crown_settles_it_between_them: "The Crown settles the question between them and neither may appeal."
 ITA_air_tt_the_directorate_does_not_get_the_sea: "The new directorate gets everything that flies except the seaplanes."
 ITA_air_tt_one_directorate_for_everything_that_flies: "One directorate takes everything that flies, the seaplanes included."
 ITA_air_tt_the_arm_is_shown_to_the_country: "The new arm is paraded, photographed and shown to the country as its own."
 ITA_air_tt_the_arm_answers_to_the_chamber: "The new arm reports to a minister who answers questions in the Chamber."
 ITA_air_tt_the_arm_answers_to_the_crown: "The new arm answers to the Crown through the ministry and to nobody else."
 ITA_air_tt_the_arm_is_an_office_with_a_budget_line: "The new arm is an office, a director and a line in the estimates."
 ITA_air_tb_the_lesson: "The Lesson of Wilbur Wright"
 ITA_air_tb_the_first_brevets: "The First Pilots' Licences"
 ITA_air_tb_the_lobby: "The Airship Lobby"
 ITA_air_tb_vizzola: "The Shed at Vizzola"
 ITA_air_tb_the_motor_trade: "The Motor Trade Answers"
 ITA_air_tb_the_hydrogen_works: "The Hydrogen Works"
 ITA_air_tb_the_electrolysis_shed: "Hydrogen from Italian Electricity"
 ITA_air_tb_the_despatches_are_studied: "The Despatches Are Studied"
 ITA_air_tb_the_makers: "Our Own Aircraft Makers"
 ITA_air_tb_the_inland_sheds: "The Inland Sheds"
 ITA_air_tb_the_frontier_survey: "The Frontier Survey from the Air"
 ITA_air_tb_the_lagoon_station: "The Station on the Lagoon"
 ITA_air_tb_the_watch_on_pola: "The Watch on Pola"
 ITA_air_tb_the_memoranda: "The Memoranda of Douhet"
 ITA_air_tb_the_aero_engine: "An Italian Aero Engine"
 ITA_air_tb_the_turin_bench: "The Bench at Turin"
 ITA_air_tb_the_aeronautical_shop: "The Aeroplane Shop"
 ITA_air_tb_the_gun_shop_learns: "The Gun Shop Learns the Trade"
 ITA_air_tb_the_civil_brevet: "The Civilian Pilot's Licence"
 ITA_air_tb_the_settled_argument: "The Airship Argument Settled"
 ITA_air_tb_the_aeroplane_wins: "The Aeroplane Wins the Estimates"
 ITA_air_tb_the_airship_keeps_it: "The Airship Keeps the Estimates"
 ITA_air_tb_the_slipway: "The Slipway and the Crane"
 ITA_air_tb_the_command_of_the_air: "The Command of the Air"
 ITA_air_tb_the_only_evidence: "The Lesson of Libya"
 ITA_air_tb_the_trimotor: "The Caproni Trimotor"
 ITA_air_tb_doctrine_meets_machine: "A Bomber for the Doctrine"
 ITA_air_tb_the_standing_order: "The Standing Order"
 ITA_air_tb_the_three_year_list: "The Three Year List"
 ITA_air_tb_the_reserve: "The Reserve of Brevets"
 ITA_air_tb_the_naval_service: "The Naval Flying Service"
 ITA_air_tb_the_admiralty_vote: "The Admiralty Vote"
 ITA_air_tb_the_new_arm: "An Arm of Its Own"
 ITA_air_tb_the_directorate: "The Directorate of Aeronautics"
 ITA_air_the_answer_threat: "Italy has bombed from the air"
 ITA_air_the_adriatic_watch_threat: "Italian airships over the Adriatic"
 ITA_air_the_doctrine_threat: "The Italian bombardment squadrons"
 ITA_air_the_trimotor_threat: "The Italian heavy aeroplane"
 ITA_air_the_new_arm_threat: "Italy has raised an air arm"
 ita_dnc.1500.t: "Rome Renews the Alliance"
 ita_dnc.1500.d: "The Italian ambassador brings the renewed alliance and asks for nothing in return. The military convention comes with it, word for word as before.\n\nRome has renewed before and built a naval base facing us the same year. We can trust the paper, or sign it and watch them."
 ita_dnc.1500.a: "Sign the renewal, and say we trust them."
 ita_dnc.1500.b: "Sign it coldly, and watch them."
 ita_dnc.1501.t: "Vienna Signs Warmly"
 ita_dnc.1501.d: "Vienna answers within the week. The renewal is welcomed as the act of an ally. Our cipher office reads the covering minute meant for nobody else, and it says the same thing.\n\nVienna has never taken our word like this before. The goodwill is real, and we can spend it."
 ita_dnc.1501.a: "Spend the goodwill in Vienna."
 ita_dnc.1502.t: "Vienna Signs Without Warmth"
 ita_dnc.1502.d: "The renewal comes back signed, and nothing more. We asked the Austrian ambassador whether his court was content. He answered that his court had signed.\n\nOur military attaché reports that the Tyrol garrisons were not reduced this spring. Vienna has kept the alliance and kept its guns where they are."
 ita_dnc.1502.a: "Note it, and watch the Tyrol."
 ita_dnc.1530.t: "Rome Offers Us Its Neutrality"
 ita_dnc.1530.d: "The Italian ambassador hands over two paragraphs written in his own hand. If we are attacked, Italy will stand neutral. Italy will also do nothing in North Africa that we would resent.\n\nThe paper is worth a great deal while it stays in the safe. We can lock it away, or let Vienna hear that Rome has signed it."
 ita_dnc.1530.a: "Take it, and keep it in the safe."
 ita_dnc.1530.b: "Take it, and let Vienna hear of it."
 ita_dnc.1531.t: "Paris Lets Slip an Understanding"
 ita_dnc.1531.d: "A French deputy, defending a colonial estimate, says too much about Italian goodwill in the Mediterranean. Our embassy in Paris sends the newspaper cutting the same evening.\n\nEither Rome has given Paris an undertaking, or Paris wants us to think so. We can ask Rome outright, or say nothing and remember it."
 ita_dnc.1531.a: "Ask Rome outright what was promised."
 ita_dnc.1531.b: "Say nothing, and remember it."
 ita_dnc.1510.t: "Rome Gives Notice"
 ita_dnc.1510.d: "The Italian ambassador reads his declaration standing. The alliance will lapse and will not be renewed. He adds that Italy remains a friendly neighbour, which is not the same as an ally.\n\nThe staff wants to know whether to bring the Tyrol garrisons up to strength now. We can take the notice quietly, or answer it on the frontier."
 ita_dnc.1510.a: "Accept the notice, and answer nothing."
 ita_dnc.1510.b: "Recall leave in the Tyrol, and publish the reason."
 ita_dnc.1511.t: "Vienna Answers with a Warning"
 ita_dnc.1511.d: "Vienna has not answered with a note. It has recalled leave in the Tyrol garrisons. The communiqué speaks of the security of the monarchy's southern frontier, which means us.\n\nThe Chamber wants to know whether we expected this. We can stand on the notice, or send a softer one after it."
 ita_dnc.1511.a: "Stand on the notice, and say so publicly."
 ita_dnc.1511.b: "Send a softer note after the first one."
 ita_dnc.1512.t: "Rome Leaves the Triple Alliance"
 ita_dnc.1512.d: "Rome has given Vienna notice that the alliance will lapse. The Italian ambassador here is anxious to tell us that nothing changes between Berlin and Rome.\n\nOur staff has counted the Italian army for the Rhine for years. We can let Rome go, or keep a door open to her."
 ita_dnc.1512.a: "Let them go, and close the staff talks."
 ita_dnc.1512.b: "Keep the door open to a separate understanding."
 ita_dnc.1513.t: "Berlin Offers a Separate Understanding"
 ita_dnc.1513.d: "Berlin treats our notice to Vienna as a matter between Rome and Vienna alone. The Chancellor lets it be known that a separate understanding with Germany would be welcome.\n\nWe have left the alliance and not lost the Germans with it. The channel to Berlin is open as long as we use it."
 ita_dnc.1513.a: "Note it, and keep the channel to Berlin open."
 ita_dnc.1514.t: "Berlin Cuts Us Off"
 ita_dnc.1514.d: "Berlin answers our notice to Vienna as though it had been addressed to Berlin. Our military attaché is no longer received by the German staff. The trade talks are adjourned and no new date is offered.\n\nWe are out of the Triple Alliance altogether. That is what the notice said, and it is not what we meant."
 ita_dnc.1514.a: "Turn to Paris and London."
 ita_dnc.1515.t: "Italy Stands Alone"
 ita_dnc.1515.d: "Italy has given Vienna notice that the alliance will lapse. For the first time since we took Tunis, Rome has no ally across the Alps.\n\nNo treaty now binds Italy against us. We can court her at once, or wait and let her come to us."
 ita_dnc.1515.a: "Offer Rome an understanding at once."
 ita_dnc.1515.b: "Wait, and let Rome come to us."
 ita_dnc.1520.t: "The Italian Staff Comes to Berlin"
 ita_dnc.1520.d: "General Pollio and two colonels arrive with a timetable for a third Italian army on the Rhine. They want the rolling stock, the detraining stations and a firm day of mobilisation.\n\nOur staff will sign all of it if Rome can be relied on. We can agree the timetable, or hear them out and promise nothing."
 ita_dnc.1520.a: "Agree the timetable, down to the trains."
 ita_dnc.1520.b: "Listen to them, and promise nothing."
 ita_dnc.1521.t: "The Timetable Is Agreed"
 ita_dnc.1521.d: "Berlin has signed the timetable. It covers three corps, the trains to carry them and the stations where they detrain.\n\nOur staff comes home with a paper that puts an Italian army on the Rhine by the 11th day of mobilisation. The Chamber has not seen it, and will not."
 ita_dnc.1521.a: "File it where the Chamber cannot read it."
 ita_dnc.1522.t: "Berlin Gives No Signature"
 ita_dnc.1522.d: "Our staff comes home from Berlin with dinners and no signature. The Germans were courteous about the third army and said the question of the trains would be studied.\n\nStudied means nothing was settled. Berlin does not believe our army would ever reach the Rhine."
 ita_dnc.1522.a: "Admit the staff talks failed."
 ita_dnc.1525.t: "Rome Reaffirms the Alliance"
 ita_dnc.1525.d: "The Italian government asks that the alliance be read as a true one. The military convention, it says, will be honoured to the letter. Rome would like us to say the same in public.\n\nWe have heard this from Rome before. We can take the word and say so, or note it and go on doubting."
 ita_dnc.1525.a: "Accept the word, and say so in public."
 ita_dnc.1525.b: "Note it, and give Rome nothing."
 ita_dnc.1526.t: "Vienna Believes Us"
 ita_dnc.1526.d: "Vienna answers using the word ally, with no clause after it to take it back. The convention is to be worked out between the two staffs, and the Emperor sends a decoration.\n\nVienna has not taken our word at face value in 20 years. The military convention is now a real one."
 ita_dnc.1526.a: "Take the credit in the Chamber."
 ita_dnc.1540.t: "Rome Demands the Trentino and Trieste"
 ita_dnc.1540.d: "The Italian note names the Trentino, Trieste and Istria, and asks for all three as the price of peace. It is not written as an ultimatum, and it does not have to be.\n\nThe staff says the Tyrol can be held. Our foreign ministry says the Trentino alone has been discussed before. The Hungarians say they will not fight for Trieste."
 ita_dnc.1540.a: "Cede the Trentino, and keep the peace."
 ita_dnc.1540.b: "Refuse the note, and hold the Tyrol."
 ita_dnc.1540.c: "Offer the Trentino for their neutrality."
 ita_dnc.1541.t: "Vienna Yields the Trentino"
 ita_dnc.1541.d: "The Austrian answer cedes the Trentino to the Brenner watershed and says nothing about Trieste. The boundary commissioners meet at Ala within the month.\n\nThe piazza wanted the whole of the irredenta, the Italian lands under Austria. We have half of it and not a shot fired, and we shall have to call that a victory."
 ita_dnc.1541.a: "Take half the irredenta, and keep the peace."
 ita_dnc.1542.t: "Vienna Refuses"
 ita_dnc.1542.d: "The refusal is short and is printed in Vienna before it reaches us. The Tyrol garrisons are brought up to war strength. The Austrian ambassador asks for his passports and is told to wait.\n\nOur claim now has a cause for war under it. The Chamber has to decide what the Trentino is worth."
 ita_dnc.1542.a: "Settle the claim on the Isonzo."
 ita_dnc.1543.t: "Vienna Offers the Trentino"
 ita_dnc.1543.d: "Vienna is at war and answers our note with an offer. We are to have the Trentino, in exchange for a declaration that Italy stands neutral for the duration.\n\nTrieste is not in the offer and will not be. We can take the Trentino and stand neutral, or refuse and take the rest by force."
 ita_dnc.1543.a: "Take the Trentino, and declare our neutrality."
 ita_dnc.1543.b: "Refuse the offer, and take Trieste by force."
 ita_dnc.1544.t: "The Trentino Changes Hands"
 ita_dnc.1544.d: "Vienna has ceded the Trentino to Rome rather than fight for it. The Italian ambassador is pleased and says so. The Austrian ambassador says nothing at all.\n\nOne ally has taken land from the other, and we were not asked. We can hold Vienna to blame for giving way, or Rome for asking."
 ita_dnc.1544.a: "Hold Vienna to blame for giving it away."
 ita_dnc.1544.b: "Watch Rome, and trust her less."
 ita_dnc.1545.t: "Rome Marches on the Trentino"
 ita_dnc.1545.d: "Vienna has refused the Italian demand, and Rome now has a cause for war. The Austrian ambassador asks what we will do if the Italians cross the Isonzo.\n\nOur staff would rather not fight Italy over the Trentino. It would rather not lose Austria either. We can guarantee Vienna, or stand out of it."
 ita_dnc.1545.a: "Guarantee Vienna, and let Rome hear it."
 ita_dnc.1545.b: "Hold aloof, and let them settle it."
 ita_dnc.1546.t: "Berlin Stands Behind Vienna"
 ita_dnc.1546.d: "Germany has guaranteed Austria, and the guarantee is read out in the Reichstag. Our staff now counts a war for the Trentino as a war on two fronts.\n\nThe second front would be the German one, and it is the one that would decide the war. The piazza has not understood that yet."
 ita_dnc.1546.a: "Wait until we are sure of Germany."
 ita_dnc.1547.t: "Berlin Holds Aloof"
 ita_dnc.1547.d: "Berlin lets it be known that the Trentino is a matter between Rome and Vienna alone. The German ambassador here is, if anything, cordial about it.\n\nVienna will fight this one without Germany. Our staff can prepare for one front instead of two."
 ita_dnc.1547.a: "Prepare for one front, not two."
 ita_dnc.1550.t: "Rome Proposes a Balkan Bargain"
 ita_dnc.1550.d: "The King of Italy proposes a meeting at Racconigi and an understanding to follow it. Rome would recognise our interest in the Straits. We would recognise hers in Tripoli.\n\nBoth of us would agree that Vienna cannot arrange the Balkans alone. We can sign, or decline and keep Vienna content."
 ita_dnc.1550.a: "Agree, and recognise Italy's claim on Tripoli."
 ita_dnc.1550.b: "Decline. We have Vienna to think of."
 ita_dnc.1551.t: "Petersburg Agrees"
 ita_dnc.1551.d: "The understanding is initialled at Racconigi in a single afternoon. The Tsar recognises our interest in Tripoli. We recognise his in the Straits.\n\nNeither of us will let Vienna arrange the Balkans alone. It is the first paper we have signed with a power that is not our ally."
 ita_dnc.1551.a: "File the protocol, and say nothing in public."
 ita_dnc.1552.t: "Vienna Reads the Tsar's Deal"
 ita_dnc.1552.d: "The Tsar and the King of Italy have met at Racconigi. Our embassy has the text of what they agreed within the fortnight.\n\nThe Balkans, it says, are not to be arranged by one power alone, and that power is us. Rome has bargained behind our back. We can protest, or say nothing and remember it."
 ita_dnc.1552.a: "Protest to Rome in front of the Germans."
 ita_dnc.1552.b: "Say nothing, and remember it."
 ita_dnc.1553.t: "Vienna Protests"
 ita_dnc.1553.d: "The Austrian protest is formal and is handed over in front of the German ambassador. We have undertaken, it says, to arrange the Balkans with Petersburg against our own ally.\n\nWe can deny the words, but Vienna has a copy of the protocol. The denial would cost us more than the admission."
 ita_dnc.1553.a: "Admit the protocol, and take the damage."
 ita_dnc.1554.t: "Petersburg Declines"
 ita_dnc.1554.d: "The Russian answer is warm and says nothing. The Tsar will be pleased to receive the King, and the Straits are not a matter for a written agreement.\n\nPetersburg has Vienna to consider, or Paris has asked her to consider it. Tripoli is ours to take without help."
 ita_dnc.1554.a: "Take Tripoli without help from Petersburg."
 ita_dnc.1560.t: "Rome Buys Valona"
 ita_dnc.1560.d: "Both courts are paying the same Albanian chiefs and opening rival schools in the same towns. The Italian consul at Valona has been seen on the shore with a naval officer and a measuring tape.\n\nRome is surveying the anchorage for a base. We can propose that both of us keep off Albania, or warn Rome off alone."
 ita_dnc.1560.a: "Propose that neither of us takes Albania."
 ita_dnc.1560.b: "Warn Rome off the Adriatic."
 ita_dnc.1561.t: "Vienna Warns Us Off Valona"
 ita_dnc.1561.d: "The Austrian note calls the Albanian coast a matter of the monarchy's own security. An Italian establishment at Valona would be treated as an unfriendly act.\n\nThe Adriatic is a narrow sea, and Valona stands at the mouth of it. We can drop the survey for now, or lay our claim and take the quarrel."
 ita_dnc.1561.a: "Drop the survey, for now."
 ita_dnc.1561.b: "Claim Albania, and take the quarrel with Vienna."
 ita_dnc.1562.t: "Rival Courts Bid for Albania"
 ita_dnc.1562.d: "The Italian and Austrian consuls at Valona are buying the same Albanian chiefs. Each has brought a school, a doctor and a survey party, and neither has asked us.\n\nThe province is ours, and neither court behaves as though it were. We can garrison Albania properly, or let the two of them bid."
 ita_dnc.1562.a: "Reinforce Albania, and build the road inland."
 ita_dnc.1562.b: "Let them bid against each other."
 ita_dnc.1563.t: "The Porte Reinforces Albania"
 ita_dnc.1563.d: "Two Ottoman battalions land at Durazzo and a third marches up from Janina. The Albanian chiefs we have been paying take the Sultan's pay as well.\n\nValona cannot be bought now. The survey goes back in the drawer until the Porte is weaker or we are stronger."
 ita_dnc.1563.a: "Put the survey back in the drawer."
 ita_dnc.1570.t: "Rome Demands Satisfaction for Adwa"
 ita_dnc.1570.d: "The Italian resident brings a note. Italy requires Tigray as far as the escarpment, and an Italian protectorate over the trade of the north.\n\nIf we refuse, the army of Eritrea will march. We beat that army once at Adwa, and it has been counting the reasons ever since."
 ita_dnc.1570.a: "Cede Tigray, and keep the crown."
 ita_dnc.1570.b: "Refuse the note. Adwa was not an accident."
 ita_dnc.1571.t: "Menelik Yields Tigray"
 ita_dnc.1571.d: "The Emperor cedes Tigray as far as the escarpment rather than fight a second time. His envoy signs at Asmara and does not stay for the dinner.\n\nAdwa is answered on paper, and the Chamber will say so loudly. The staff says the same roads still lead up to the same plateau."
 ita_dnc.1571.a: "Take Tigray, and tell the Chamber Adwa is answered."
 ita_dnc.1572.t: "Italy Moves on Abyssinia"
 ita_dnc.1572.d: "Rome has demanded Tigray and been refused. The army of Eritrea is being brought up to the escarpment.\n\nThe Emperor's envoy asks whether we will guarantee what we have already recognised. The Nile rises in his country, and Rome has been useful to us in the Mediterranean. We can warn Rome off, or let her go on."
 ita_dnc.1572.a: "Warn Rome, and guarantee the Emperor."
 ita_dnc.1572.b: "Let Rome go on, and say nothing."
 ita_dnc.1573.t: "London Guarantees Abyssinia"
 ita_dnc.1573.d: "The British ambassador reads us a guarantee given to the Emperor. He adds, without instruction from London, that the Mediterranean fleet is at Malta this season.\n\nIf the expedition goes on, Britain stands behind the enemy. We can go on regardless, or halt the columns at the escarpment."
 ita_dnc.1573.a: "Go on, and take the risk of Britain."
 ita_dnc.1573.b: "Halt the expedition at the escarpment."
 ita_dnc.1574.t: "London Looks Away"
 ita_dnc.1574.d: "The British ambassador says that London has no interest in the interior of Abyssinia beyond the Nile waters. He would be glad to be told when the Nile becomes part of it.\n\nWe have a free hand as far as the escarpment, and no further. The expedition can go on."
 ita_dnc.1574.a: "Take the free hand, and keep off the Nile."
 ita_dnc.1575.t: "Rome Proposes a Boundary"
 ita_dnc.1575.d: "The Italian resident brings a map with a line drawn on it. Italy offers a road from the coast and the recognition of the Emperor's title.\n\nThe line is further back than the last one they proposed. We can sign it as it stands, or ask for a share of the customs at Massawa first."
 ita_dnc.1575.a: "Sign the boundary as it stands."
 ita_dnc.1575.b: "Ask for a share of the Massawa customs first."
 ita_dnc.1576.t: "Menelik Asks for the Customs"
 ita_dnc.1576.d: "The Emperor will sign the boundary if the customs at Massawa are shared with him. His envoy has the figures, and the share he wants is a large one.\n\nMassawa is what makes the colony pay for itself. We can grant the customs and get the boundary, or refuse and lose the understanding."
 ita_dnc.1576.a: "Grant the share of the customs, and sign."
 ita_dnc.1576.b: "Refuse, and let the understanding lapse."
 ita_dnc.1580.t: "The Italian Note on Tripoli"
 ita_dnc.1580.d: "Rome asks that Italian business in Tripoli be treated as the business of the Italian state. It names the bank, the school, the shipping line and a consul who is heard.\n\nThe note says nothing about our garrison, and the garrison is what it is about. We can let the Italians buy the province slowly, or reinforce it and make them pay."
 ita_dnc.1580.a: "Concede the bank and the school, and nothing else."
 ita_dnc.1580.b: "Reinforce Tripoli, and answer the note with troops."
 ita_dnc.1581.t: "The Porte Concedes the Bank"
 ita_dnc.1581.d: "The Porte answers that Italian business in Tripoli is welcome and that our consul will be heard. It says nothing about the Ottoman garrison, which stays where it is.\n\nThe bank, the school and the shipping line can now work under our flag. Tripoli can be bought before it has to be taken."
 ita_dnc.1581.a: "Buy Tripoli slowly, and keep the Porte content."
 ita_dnc.1582.t: "The Porte Reinforces Tripoli"
 ita_dnc.1582.d: "The Porte answers our note with two battalions from Smyrna and a new governor who dislikes Italians. The manager of our bank is made to produce his papers every week.\n\nThe answer is no, and it was meant to be read as no. We can turn the note into an ultimatum, or withdraw it."
 ita_dnc.1582.a: "Turn the note into an ultimatum."
 ita_dnc.1582.b: "Withdraw the note, and say nothing more."
 ita_dnc.1583.t: "Rome Asks About Tripoli"
 ita_dnc.1583.d: "The Italian ambassador asks, without putting anything in writing, whether an Italian establishment in Tripoli would concern us. He does not say an establishment of what.\n\nHe means a landing and a garrison. We can acquiesce and have Rome in our debt, or object and have Rome remember it."
 ita_dnc.1583.a: "Acquiesce, and let Rome take Tripoli."
 ita_dnc.1583.b: "Object, and put it on the record."
 ita_dnc.1585.t: "The Italian Ultimatum"
 ita_dnc.1585.d: "Rome gives us a day and a night to consent to the occupation of Tripolitania and Cyrenaica. The note guarantees the Sultan's religious authority and says nothing of his sovereignty.\n\nOur garrison there is small and the sea is theirs. We can cede the province, or refuse and make them come and take it."
 ita_dnc.1585.a: "Cede Tripolitania and Cyrenaica, and keep the Sultan's religious authority."
 ita_dnc.1585.b: "Refuse. Let them come and take it."
 ita_dnc.1586.t: "The Porte Yields Tripoli"
 ita_dnc.1586.d: "The Porte answers before the hour is out, and it is not the answer the fleet expected. The province is ceded, subject only to the Sultan's religious authority.\n\nThe Fourth Shore, our coast in Africa, is ours without a landing. The army that was promised a war in Africa will not get one."
 ita_dnc.1586.a: "Take the province, and send the fleet home."
 ita_dnc.1587.t: "The Italian Fleet Passes Rhodes"
 ita_dnc.1587.d: "Rome has sent the Porte an ultimatum over Tripoli, and the Porte has refused it. The Italian fleet is at sea, and whatever else it does it will pass Rhodes.\n\nThe people of those islands are Greek in everything but the flag over them. We can claim them now, or say nothing and wait."
 ita_dnc.1587.a: "Claim the Dodecanese, and exercise the fleet."
 ita_dnc.1587.b: "Stay quiet, and let Rome and the Porte fight."
 ita_dnc.1588.t: "Rome Goes to War Without Asking"
 ita_dnc.1588.d: "Rome has sent the Porte an ultimatum over Tripoli. We learned of it after the note was handed over, and we learned of it from a copy.\n\nThe alliance says the two of us consult before either moves in the east. Rome did not. We can protest the manner of it, or note it and say nothing."
 ita_dnc.1588.a: "Protest the manner of it."
 ita_dnc.1588.b: "Note it, and say nothing to Rome."
 ita_dnc.1590.t: "The Peace Offer"
 ita_dnc.1590.d: "The Italian plenipotentiaries offer peace at Ouchy. The province passes to Rome. The Sultan keeps his religious authority there, and the officials keep their pensions.\n\nThe islands go back, they say, once the last Ottoman officer has left Africa. The war is lost on the coast and not in the interior. We can sign, or fight on and hold the desert."
 ita_dnc.1590.a: "Sign the peace, and give up the coast."
 ita_dnc.1590.b: "Fight on in the interior."
 ita_dnc.1591.t: "The Porte Signs the Peace"
 ita_dnc.1591.d: "The treaty is signed at Ouchy in the afternoon. The province is ours. The Sultan keeps his name in the Friday prayers, and we keep the coast.\n\nThe coast is what we came for. Nobody has asked the tribes of the interior, and they will have to be asked in the end."
 ita_dnc.1591.a: "Hold the coast, and leave the interior for later."
 ita_dnc.1592.t: "The Porte Will Not Sign"
 ita_dnc.1592.d: "The Ottoman plenipotentiaries leave Ouchy without signing. The Porte will fight on in the interior, where the Senussi, a desert brotherhood, fight for it.\n\nWe are left holding a coast that costs a division a month. We can take the interior by force, or sweeten the terms and get a signature."
 ita_dnc.1592.a: "Take the interior by force."
 ita_dnc.1592.b: "Sweeten the terms, and offer again."
 ita_dnc.1595.t: "The Italians Land on Rhodes"
 ita_dnc.1595.d: "Italian troops have landed on Rhodes and the smaller islands, almost unopposed. The leading men of the towns came down to meet the boats. They are Greeks, and they are cheering.\n\nRome says it is only holding the islands until the Porte signs a peace. We can protest the landing, or ask Rome to promise that the islands never go back."
 ita_dnc.1595.a: "Protest the occupation."
 ita_dnc.1595.b: "Ask Rome to promise that the islands never go back to the Porte."
 ita_dnc.1596.t: "Athens Claims the Islands"
 ita_dnc.1596.d: "Athens has sent a polite protest, with a map on which the islands are already coloured blue. It does not ask us to leave. It asks us to remember whose the islands are.\n\nTwo governments now claim them, and we are the one holding them. We can say plainly that the islands stay ours until the Porte signs."
 ita_dnc.1596.a: "Keep the islands. We hold them until the Porte signs."
 ITA_w_threat_vienna_answers: "Vienna answers the notice"
 ITA_w_tt_a_power_consents: "§GA power consents to our enterprise in Tripoli.§!"
 ITA_w_tt_a_power_objects: "§RA power objects to our enterprise in Tripoli.§!"
 ITA_w_tt_the_porte_answers: "§YThe Porte will answer our terms within the week.§!"
 ITA_w_tt_the_capital_answers: "§YThe government we have approached will answer, and its answer decides what follows.§!"
 ITA_tt_choose_who_governs_after_the_crisis: "Choose who governs in the name of the Statuto, the kingdom's constitution: the ministry, the Crown, the Bloc, the Nation or the Church."
 ITA_ch_threat_the_frontier_is_manned: "The Alpine Frontier Is Manned"
 ITA_ch_threat_the_insurrection: "The Insurrection in the Romagna"
 ita_dnc.2100.t: "Regicide at Monza"
 ita_dnc.2100.d: "The King has been shot dead at Monza. The Prince of Naples, who has never been trusted with anything, is King of Italy tonight.\n\nThe funeral train leaves within days. We must say what the kingdom does before it goes."
 ita_dnc.2100.a: "Declare a state of siege in the red cities, and seize the subscription lists."
 ita_dnc.2100.b: "Send for Saracco, and open the new reign with an amnesty."
 ita_dnc.2100.c: "Let the Extreme Left stay away from the coffin, and let the country see it."
 ita_dnc.2100.e: "Put the nation into mourning, and lead the mourning ourselves."
 ita_dnc.2101.t: "The Oath at the Quirinal"
 ita_dnc.2101.d: "The King came up on a night train and swore before both Chambers to keep the Statuto, the kingdom's constitution. There are two versions of it in that room. The text says ministers answer to the Crown. The practice grown over it says no ministry survives a hostile vote.\n\nHis father died believing the text. The men in front of him have built their careers on the practice, and they are watching his face."
 ita_dnc.2101.a: "Read the oath as it is written: ministers answer to the Crown."
 ita_dnc.2101.b: "Read the oath as it is practised: no ministry survives a hostile vote."
 ita_dnc.2102.t: "The Decrees of Public Safety"
 ita_dnc.2102.d: "The decrees of public safety lapsed with the old reign. The Interior has laid them again on the desk of a King who has worn the crown for a fortnight. The judges have already said what they think of them.\n\nEveryone is waiting to see whether the new King signs what his father signed. The Chamber is waiting for the opposite reason."
 ita_dnc.2102.a: "Let the King sign, and the prefects have their powers back."
 ita_dnc.2102.b: "Withdraw the decrees. The new reign will not begin under one."
 ita_dnc.2104.t: "Genoa Shuts Its Port"
 ita_dnc.2104.d: "The prefect of Genoa has closed the chamber of labour, the local trade union office. He says it took dues from dockers who were not members.\n\nThe port shut within a day. The tram men are out, and the Ligurian committee has called a general strike in the city that handles a third of our trade. The Chamber sits again in six weeks and will ask us what we did."
 ita_dnc.2104.a: "Restore the chamber of labour and recall the prefect."
 ita_dnc.2104.b: "Back the prefect. He applied the law as it stands."
 ita_dnc.2104.c: "Let the ministry fall on it rather than answer for it."
 ita_dnc.2105.t: "The Verdict on the Decade"
 ita_dnc.2105.d: "The decade is closing and we have settled nothing. The men who could settle it are still in the room, and they will not sit there much longer.\n\nWe are asked once, and only once, what this ministry was for. Whatever we answer will be read out and written down."
 ita_dnc.2105.a: "Stand by the system, and let Giolitti form the next ministry."
 ita_dnc.2105.b: "Say the Crown governed, and let Sonnino form the next ministry."
 ita_dnc.2105.c: "Say the Bloc was in the State, and let Giolitti form the next ministry."
 ita_dnc.2105.e: "Say the nation was armed and asked, and let Salandra take the chair."
 ita_dnc.2105.f: "Say the altar and the throne stood together, and let Giolitti go on."
 ita_dnc.2105.g: "Refuse the verdict. Nobody decided anything, and we will not pretend otherwise."
 ita_dnc.2105.h: "Refuse the verdict, and let the next ministry answer for it."
 ita_dnc.2105.i: "Refuse the verdict. The Crown will not put its name to it."
 ita_dnc.2105.j: "Refuse the verdict. The Bloc will not sign one upon itself."
 ita_dnc.2105.k: "Refuse the verdict. The nation was never asked, and we will not pretend it was."
 ita_dnc.2105.l: "Refuse the verdict, and leave the question to better men."
 ITA_end_the_caretakers: "The Caretakers"
 ITA_end_the_caretakers_long: "The Caretaker Ministry"
 ITA_end_tt_the_verdict_is_refused: "A caretaker ministry takes the chair for a year, and the question is left to the men who come after us."
 ita_dnc.2108.t: "The Emigrant Ships"
 ita_dnc.2108.d: "About 600,000 Italians leave every year, most of them young men of military age from the south. They sail from Naples, Palermo and Genoa, and the money they send home pays for much of what we import.\n\nAgents sell them tickets they cannot read and berths that do not exist. Every man who sails is a man the army will not call up. We can run the traffic ourselves, or leave it to the shipping companies."
 ita_dnc.2108.a: "Set up a commissariat to run the emigrant traffic."
 ita_dnc.2108.b: "Leave it to the shipping agents."
 ita_dnc.2112.t: "The Strike Spreads"
 ita_dnc.2112.d: "It began with a shooting, and it is now in Milan, Genoa, Turin and the capital at once. There is no central committee, no list of demands and no strike fund. The trams have stopped, the port has stopped, and no newspapers are being printed.\n\nNobody in this ministry has handled a general strike before. Until this week no country in Europe had seen one."
 ita_dnc.2112.a: "Send the prefect to sit at the table with them."
 ita_dnc.2112.b: "Send the garrison to clear the squares."
 ita_dnc.2112.c: "Wait. The strike has no demands and will exhaust itself."
 ita_dnc.2116.t: "The Election After the Strike"
 ita_dnc.2116.d: "The Chamber has been sent home and the country votes instead. The strike is still in every memory, and in a few dioceses the clergy have been released from the Pope's ban on Catholics voting.\n\nIn half the southern seats the poll is a formality arranged in the prefecture. We can work the prefects, fight on our record, or keep our hands off it."
 ita_dnc.2116.a: "Work the prefectures. A candidate who wants the seat comes to the Interior first."
 ita_dnc.2116.b: "Fight it on what the ministry has actually built."
 ita_dnc.2116.c: "Keep the government out of this election."
 ita_dnc.2120.t: "The Veto at the Conclave"
 ita_dnc.2120.d: "The Pope is dead and the cardinals are shut in. Our ambassador reports that the Secretary of State will be elected on the next ballot. He has leaned on Paris all his career and has never hidden what he thinks of the Italian monarchy.\n\nOur house has held the right to exclude a candidate for as long as anyone can remember. The Cardinal of Cracow will carry the word in. It has not been used in living memory, and using it will be known within the day."
 ita_dnc.2120.a: "Use the right of exclusion. Our house has held it for centuries."
 ita_dnc.2120.b: "Stay out of the conclave. The Emperor will not put his hand into it."
 ita_dnc.2121.t: "The New Pope from Venice"
 ita_dnc.2121.d: "The conclave has been through a veto to reach the patriarch of Venice, the son of a village postman. He has spent his life in parishes, and in several of them the socialists took the council while the faithful stayed home under the Pope's ban on voting.\n\nHe has said nothing about the ban and has not repeated it. We can sound the Vatican quietly, or say nothing and let the bishops move first."
 ita_dnc.2121.a: "Sound the Vatican quietly, through the men who will talk to us."
 ita_dnc.2121.b: "Say nothing, and let the bishops move first."
 ita_dnc.2122.t: "The Cardinal Secretary Is Elected"
 ita_dnc.2122.d: "No crown was raised against him, and the Secretary of State is Pope. He knows every foreign ministry in Europe and has never given an inch on the quarrel between the Kingdom and the Pope.\n\nThe ban on Catholic voting stays exactly where it is, enforced by the man who wrote most of it. We can govern without those votes, or ask quietly what the new pontificate will cost us."
 ita_dnc.2122.a: "Govern without the Catholic vote. The ban stays where it is."
 ita_dnc.2122.b: "Ask, through the usual channel, what the new pontificate will cost us."
 ita_dnc.2124.t: "The Railway Strike"
 ita_dnc.2124.d: "The private companies have let the track rot, and the enginemen have answered with a stoppage that has cut the peninsula in half. The Chamber has been shown the companies' accounts and does not believe them.\n\nWe can buy the lines into the hands of the State and put the men under military discipline. Or we can pay the companies again and hear the same thing in a year."
 ita_dnc.2124.a: "Buy the lines, and let the State run them under military discipline."
 ita_dnc.2124.b: "Pay the companies again, and let them keep the lines."
 ita_dnc.2128.t: "The Succession to the Presidency"
 ita_dnc.2128.d: "The President of the Council is dying in office and will not resign. The Interior has governed in his name for a year, and the party of the ministry is already counting heads.\n\nThe choice is between Giolitti, who made this Chamber, and Fortis, a lawyer of the Romagna who will keep the seat warm and do nothing else."
 ita_dnc.2128.a: "Send for Giolitti, who has governed in his name for a year."
 ita_dnc.2128.b: "Send for Fortis, and let him keep the seat warm."
 ita_dnc.2130.t: "The Annexation of Bosnia"
 ita_dnc.2130.d: "Vienna has annexed the two provinces it has occupied since the Congress, without a conference and without asking anyone. Article 7 of our treaty says that no change in the Balkans is made without compensation to the other party.\n\nThe piazza has read the article in the newspapers and is in the street with it. We can invoke it, sell it, or look east for a friend who reads treaties as we do."
 ita_dnc.2130.a: "Invoke the article. The compensation is owed and we shall name it."
 ita_dnc.2130.b: "Take the repeal of Article 29 and call it settled."
 ita_dnc.2130.c: "Turn east instead, to the one court with the same grievance."
 ita_dnc.2133.t: "The Shooting at Buggerru"
 ita_dnc.2133.d: "The Sardinian miners struck over the hour they are made to lose at the coal face. The company wrote to the prefect asking for troops. The troops came, and the troops fired.\n\nThe telegraph off the island is slow, and the chambers of labour will have the story before we do. We can try the officer, or close the file."
 ita_dnc.2133.a: "Try the lieutenant by court martial, and move the regiment off the island."
 ita_dnc.2133.b: "Close the file. The troops were stoned first and the officer stands."
 ita_dnc.2134.t: "The First General Strike"
 ita_dnc.2134.d: "Milan struck first and Genoa followed the same evening, then Turin, then the capital. No train is moving north of Florence, and no newspaper is printing but the socialist ones. Nobody ordered any of it.\n\nNo European state has seen this before. There is no article of the code that fits it, and no precedent to send to the prefects."
 ita_dnc.2134.a: "Let the strike exhaust itself. The Chamber will thank us for keeping our head."
 ita_dnc.2134.b: "Turn out the garrisons. Every station and tram shed under guard by morning."
 ita_dnc.2134.c: "Concede the eight-hour day in the mines and be done with it."
 ita_dnc.2136.t: "The Crisis over Morocco"
 ita_dnc.2136.d: "The German Emperor has landed at Tangier and spoken up for the independence of the Sultan. A conference has been called to settle what he meant. Germany asks for our vote. France asks for our silence, which is the same thing said politely.\n\nWe promised France in writing that we would not cross her in North Africa. Germany has never been told."
 ita_dnc.2136.a: "Vote with our ally. A treaty is a treaty."
 ita_dnc.2136.b: "Vote the other way, and honour the note we signed with France."
 ita_dnc.2136.c: "Say nothing, and let the conference read our silence as it likes."
 ita_dnc.2137.t: "Conrad Asks for the War"
 ita_dnc.2137.d: "Our attaché in Vienna reports that the Chief of the General Staff has asked his Emperor for a preventive war against us. It is the fourth time, and this time the foreign ministry did not object at once.\n\nThe Tyrol garrisons are being brought up to strength for manoeuvres nobody had planned. We can man the frontier and let Vienna see it, or leave the answer to the Emperor."
 ita_dnc.2137.a: "Man the frontier, and let Vienna see it."
 ita_dnc.2137.b: "Say nothing. The Emperor has refused him three times already."
 ita_dnc.2138.t: "The Rising in the Romagna"
 ita_dnc.2138.d: "The Romagna has been out of the government's hands for three months, and the rest of the country has stopped pretending otherwise. The reservists called up in the Marche did not report, and a garrison commander has asked to be relieved rather than fire.\n\nWhat is read from the balconies now is not a list of grievances but a constitution. We are past the point where a ministry decides anything."
 ita_dnc.2138.a: "Fight it. This is a civil war now."
 ita_dnc.2139.t: "The Squares Demand War"
 ita_dnc.2139.d: "The Empire is at war on another frontier, and every square in the north is full of men shouting for Trento and Trieste. The committees for intervention have stopped asking the ministry and started announcing what it will do.\n\nThe army says it needs a season to be ready. The street says it needs an hour. We can move now, or wait and let the depots fill."
 ita_dnc.2139.a: "Move now, while the other frontier holds them."
 ita_dnc.2139.b: "Wait. Let them shout, and let the depots fill."
 ita_dnc.2140.t: "The Congress at Bologna"
 ita_dnc.2140.d: "The party has been called together to decide whether a socialist may sit in a bourgeois ministry, and the hall is in no mood to be reasoned with. The reformists point at the labour office and the factory inspectors. The revolutionaries point at the prefects, who have not gone anywhere.\n\nWhat this congress votes decides who we shall be negotiating with for the rest of the decade."
 ita_dnc.2140.a: "Let the revolutionaries carry the hall."
 ita_dnc.2140.b: "Let the reformists hold, and bury the resolution in committee."
 ita_dnc.2141.t: "The Ministry Falls"
 ita_dnc.2141.d: "The majority that voted the estimates in the spring did not divide with the government tonight. The men who arranged that majority are already in the corridor arranging the next one.\n\nNothing was defeated on principle. We have only to decide who is sent for."
 ita_dnc.2141.a: "Send for the same man. He will make another majority."
 ita_dnc.2141.b: "Send for someone the Chamber has not yet used up."
 ita_dnc.2141.c: "Ask the King to send the Chamber home until it is calmer."
 ita_dnc.2142.t: "The Fleet at Anchor"
 ita_dnc.2142.d: "The war is going against us on land, and the fleet has spent it at anchor with steam up. The admiralty says a fleet in being is worth more than a fleet on the bottom.\n\nThe country paid for battleships and would like to see one. The order can be given tonight, and it cannot be taken back."
 ita_dnc.2142.a: "Send the fleet out."
 ita_dnc.2142.b: "Keep the fleet at anchor, and let the country say what it likes."
 ita_dnc.2143.t: "The King's Veto"
 ita_dnc.2143.d: "The King has read the decrees we sent up and has sent them back unsigned. He wrote a note in his own hand about the prerogative of the Crown.\n\nThe King's household has been briefing the newspapers of the right for a fortnight. Either this ministry goes, or the King learns what a ministry is."
 ita_dnc.2143.a: "Resign, and let the King send for a man of his own."
 ita_dnc.2143.b: "Stand firm. The King gives way, and the note is never mentioned again."
 ita_dnc.2144.t: "Crete Rises"
 ita_dnc.2144.d: "Crete has risen again, and the island assembly has voted union with us for the third time in a decade. The Powers hold the harbours with a handful of ships, and the Porte holds nothing at all.\n\nWe can lay the question before the Powers now, while the Ottoman government is too weak to answer. Or we can leave the island where it is for the present."
 ita_dnc.2144.a: "Lay it before the Powers, and see who answers."
 ita_dnc.2144.b: "Wait. The island is not going anywhere."
 ita_dnc.2145.t: "The Cretan Question"
 ita_dnc.2145.d: "Athens has asked the Powers to hear the island's vote, and our name is on the list of protectors. That costs us a squadron and a policy. The Porte has asked us privately to remember whose islands they are.\n\nWe can speak for the island and be thanked in Athens, at the Porte's expense. Or we can stay out, and let the Powers settle it."
 ita_dnc.2145.a: "Speak for the island, and let the Porte hear it from us first."
 ita_dnc.2145.b: "Decline. The Powers will settle it without our voice."
 ita_dnc.2146.t: "The Officers' Address"
 ita_dnc.2146.d: "30 general officers have signed an address to the King. They ask that the army be given a free hand in the disturbed provinces, and that the ministry be told so.\n\nIt did not go through the War Office, and the newspapers of the right had it before the King did. Either the Crown reads it out and a state of siege follows, or the Crown calls its own generals to order in public."
 ita_dnc.2146.a: "Grant the address, and put the disturbed provinces under the army."
 ita_dnc.2146.b: "Ask the King to call them to order, and return the address unread."
 ita_dnc.2147.t: "The Offer of Terms"
 ita_dnc.2147.d: "The front has stopped moving, and the staffs on both sides know it before the newspapers do. There is a short moment now in which what is held on the map can be written into a treaty.\n\nWe can send our terms across the lines tonight. Or we can wait for a spring campaign that neither army has the depots for."
 ita_dnc.2147.a: "Send the terms across, and let them answer them."
 ita_dnc.2147.b: "Fight on. The line will move again."
 ita_dnc.2148.t: "The Encyclical Says Nothing"
 ita_dnc.2148.d: "The encyclical does not lift the Pope's ban on Catholics voting, and it does not repeat it. It tells Catholics to take part in the Christian life of the nation, and leaves each bishop to say what that means.\n\nIn 300 constituencies the parish clergy have already worked out what it means. Nothing is signed, and nothing is denied."
 ita_dnc.2148.a: "Take what is offered. The lists will circulate where they are useful."
 ita_dnc.2148.b: "Say nothing about the ballot, as the encyclical does."
 ita_dnc.2149.t: "The Record of the Decade"
 ita_dnc.2149.d: "The decade is out and the clerks have added it up: what was promised, what was bought, what was shot at and what was signed. The country will read the total whether we publish it or not.\n\nWhat we did with the Statuto, the kingdom's constitution, is now a matter of record."
 ita_dnc.2149.a: "Let the record be read out."
 ita_dnc.2152.t: "The Calabrian Earthquake"
 ita_dnc.2152.d: "The province went down in the night. The villages of the Aspromonte are rubble, the roads are cut, and the prefect is asking for engineers, tents and bread in that order.\n\nThe emigration agents were at the quays before the relief columns were on the road. We can send the army and be done in a season. Or we can write a law for the whole South and pay for it out of a budget we do not have."
 ita_dnc.2152.a: "Send the army in with tents and bread, and reopen the road."
 ita_dnc.2152.b: "Write a law for the whole South, and find the money somewhere."
 ita_dnc.2156.t: "The Socialist in the Ministry"
 ita_dnc.2156.d: "The socialist deputies have a minister among them, and the congress has been called to decide whether he is still one of theirs. The reformists point at the accident insurance and the inspectors who now actually enter the sheds.\n\nThe revolutionaries point at the prefects. They point too at a majority made of men who were elected by promising to fight it."
 ita_dnc.2156.a: "Keep the portfolio. The socialist stays in the ministry."
 ita_dnc.2156.b: "Let the party order him out of the ministry."
 ita_dnc.2160.t: "The Debt Conversion"
 ita_dnc.2160.d: "The great banking houses have converted the state debt without waiting for us, at a rate we could not have refused and did not obtain. The saving is real, and it is not ours to claim.\n\nThe Treasury will have half of what it counted on. The Chamber will be told the good news anyway."
 ita_dnc.2160.a: "Take the half, and say nothing about the other."
 ita_dnc.2164.t: "The Lockout in the Po Valley"
 ita_dnc.2164.d: "50,000 day labourers are out across the province, and the landowners' association has answered with a lockout, a private guard and a subscription list. The children have been sent north to socialist families in convoys, with bands playing, which the newspapers of the right are calling abduction.\n\nThe prefect wants cavalry. Both sides have said in writing that they will accept arbitration, on condition that it goes their way."
 ita_dnc.2164.a: "Send the cavalry, and close the chamber of labour."
 ita_dnc.2164.b: "Put both sides before a board, with a minister presiding and the award binding."
 ita_dnc.2168.t: "The Bloc Takes Rome"
 ita_dnc.2168.d: "The Bloc of the lodges, the radicals and the socialists has taken the capital at the municipal poll. The new mayor is a Jew, a freemason and the son of exiles, which the clerical press has managed to mention in every paragraph.\n\nHe has announced a school in every quarter and a rate on church property. The prefect can find an irregularity in the returns within a week, if he is told to look."
 ita_dnc.2168.a: "Let the city have its council. It was elected."
 ita_dnc.2168.b: "Tell the prefect to find an irregularity, and hold the poll again."
 ita_dnc.2169.t: "The Twentieth of September"
 ita_dnc.2169.d: "The anniversary of the day our troops breached the wall falls in a fortnight. The new council means to keep it as it has not been kept in a generation: the whole municipality at the gate, with banners and speeches against the temporal power of the Pope.\n\nA minister is expected on the platform, and whoever stands there will be quoted in the Vatican within the hour. We can send one, or stay away."
 ita_dnc.2169.a: "Send a minister to the platform, as the country expects."
 ita_dnc.2169.b: "Keep every minister away from the gate, and let the Bloc draw its own conclusions."
 ita_dnc.2172.t: "The Nationalist Groups Meet"
 ita_dnc.2172.d: "The nationalist groups have met in congress and found a phrase that is doing more work than any of them expected: that we are a poor nation among rich ones, and that emigration is the tribute we pay for it. The lecture tours are full and the subscriptions are growing.\n\nWe can take the programme and leave them the name. Or we can let them keep both, and see who is shouting in the squares in five years."
 ita_dnc.2172.a: "Take the programme. The African shore is promised, in our own time."
 ita_dnc.2172.b: "Let them talk. Words have never taken a province."
 ita_dnc.2176.t: "The Army Revolt at Salonika"
 ita_dnc.2176.d: "The Third Army has declared for the constitution, and the committee at Salonika is telegraphing the palace every hour. The garrisons of Macedonia have gone over almost to a man, and the troops sent against them have joined them.\n\nWe can restore the charter we suspended a generation ago and keep the throne. Or we can send for the Albanian regiments and find out whether they come."
 ita_dnc.2176.a: "Restore the constitution, and recall the parliament."
 ita_dnc.2176.b: "Break up the regiments, and arrest the officers."
 ita_dnc.2177.t: "The Porte Has a Parliament"
 ita_dnc.2177.d: "The Porte has a parliament again, and behind it a party of young officers who talk about the integrity of the empire as the old palace never did. Our consulates report that the new men mean to count the foreign concessions and the foreign schools.\n\nA telegram of congratulation would cost us nothing, and saying nothing would be noticed just as clearly. We can send one, or hold our tongue."
 ita_dnc.2177.a: "Congratulate them, and let the schools be counted in a friendly spirit."
 ita_dnc.2177.b: "Say nothing. A weak empire suited us better than a young one."
 ita_dnc.2180.t: "The Protests over Ferrer"
 ita_dnc.2180.d: "A schoolmaster has been shot in a ditch in Catalonia, after a court martial that convinced nobody. The news has put more people into our squares than any strike of the decade.\n\nThe demonstrations are against the Church, they are enormous, and nobody we can send for called them. The prefects are asking whether the processions are to be allowed."
 ita_dnc.2180.a: "Let them march. It is not our schoolmaster and not our court."
 ita_dnc.2180.b: "Forbid the processions. We do not riot over another kingdom's courts."
 ita_dnc.2184.t: "The Messina Earthquake"
 ita_dnc.2184.d: "The ground shook for 30 seconds, and then the sea came in three times over what was left. The two cities on the straits are gone. There is no telegraph, no prefect and no water, and the survivors are being dug out by hand.\n\nThe first parties ashore were foreign sailors from a squadron that happened to be in the roads. Our own ships came after them, and what we do this week will be printed in every capital in Europe."
 ita_dnc.2184.a: "Give the navy charge of the whole relief."
 ita_dnc.2184.b: "Accept every squadron that offers, and say so publicly."
 ita_dnc.2184.c: "Rebuild to a seismic code, and prosecute those who ignore it."
 ita_dnc.2185.t: "The Earthquake at Messina"
 ita_dnc.2185.d: "An earthquake has thrown down the cities on both sides of the Messina straits in half a minute. The first count of the dead is past anything in living memory, and there is no authority left ashore.\n\nWarships already in the roads have been landing parties since dawn, on their captains' own word. Italy has asked us for nothing and will not ask. What we send now will be remembered for a generation."
 ita_dnc.2185.a: "Keep the squadron at Messina as long as it is needed."
 ita_dnc.2185.b: "Send the squadron, and ask Congress for a relief credit."
 ita_dnc.2185.c: "Leave it to the relief societies."
 ita_dnc.2185.e: "Send our condolences and let the newspapers open a subscription."
 ita_dnc.2188.t: "The Election and the Clergy"
 ita_dnc.2188.d: "The country votes again. The socialists will be stronger in the North whatever we do, and we must find our numbers where we have always found them.\n\nIn the Veneto and the Marche that means the parish clergy. They have an understanding with us that neither side will put on paper."
 ita_dnc.2188.a: "Let the prefects make the returns, as they always have."
 ita_dnc.2188.b: "Go to the parish clergy for the votes the prefects cannot bring."
 ita_dnc.2188.c: "Keep the government out of this election."
 ita_dnc.2192.t: "The Emperor's Stroke"
 ita_dnc.2192.d: "The Emperor cannot speak and cannot sign. The palace has stopped pretending that he will recover.\n\nThe heir is a grandson of 13, and his mother is not a queen. The rases, the great nobles, each command more men than the throne does, and every foreign legation is offering its friendship. We can name the boy now, or set up a council of regency and hear the Italians out."
 ita_dnc.2192.a: "Name the grandson heir, whatever the rases say."
 ita_dnc.2192.b: "Set up a council of regency, and speak to the Italian legation."
 ita_dnc.2196.t: "The Meeting with the Tsar"
 ita_dnc.2196.d: "The Tsar passes through on his way home. He has let it be known that he would receive us at Racconigi, without ministers if we prefer, to talk about the Straits and the Adriatic.\n\nVienna is not to be told, and will be told anyway. An hour on a terrace is worth a year of notes. We can accept the meeting, or decline it and keep our ally quiet."
 ita_dnc.2196.a: "Accept the meeting at Racconigi."
 ita_dnc.2196.b: "Decline the meeting, and tell Vienna so."
 ita_dnc.1956.t: "Rome's Vote on Morocco"
 ita_dnc.1956.d: "Italy has voted with France at Algeciras, on the police and on the bank. She is our ally, and the conference is lost to us.\n\nThe Chancellor has told the Reichstag that a waltz may be danced with more than one partner. We can let the remark stand, ask Vienna to demand an account, or tell Rome plainly what an alliance is for."
 ita_dnc.1956.a: "Let the remark stand, and say no more."
 ita_dnc.1956.b: "Ask Vienna to demand the account."
 ita_dnc.1956.c: "Warn Rome that the alliance runs both ways."
 ita_dnc.1957.t: "The Delegate Reports"
 ita_dnc.1957.d: "Our delegate has voted and the bank at Algeciras is settled. We have an understanding we did not have before.\n\nThe Chamber approves of a foreign policy that costs nothing and offends nobody it can see."
 ita_dnc.1957.a: "Take the credit in the Chamber."
 ita_dnc.1958.t: "The Italian Vote on Morocco"
 ita_dnc.1958.d: "The Italian vote carried the police and the bank against Berlin, and it was not bought.\n\nOur ambassador in Rome writes that the Italian ministry would like our gratitude in a form it can quote. We can thank them in public, or note it and say nothing."
 ita_dnc.1958.a: "Thank Rome in public, where it will be read."
 ita_dnc.1958.b: "Note it, and say nothing in public."
 ita_dnc.1959.t: "Berlin Asks Us to Press Rome"
 ita_dnc.1959.d: "Berlin would like us to ask Rome what her vote at Algeciras was worth to the alliance.\n\nIt is a fair question and an ungrateful one to put. Whatever Rome answers will be in the newspapers within the week. We can put the question ourselves, or leave Berlin to put it."
 ita_dnc.1959.a: "Ask Rome to account for her vote."
 ita_dnc.1959.b: "Say nothing to Rome."
 ita_dnc.1972.t: "Rome Demands Compensation"
 ita_dnc.1972.d: "Rome invokes Article 7 of the alliance and asks what we will give for the provinces we have annexed. We have already agreed to leave the sandjak, the Ottoman district we garrison, and that costs us little.\n\nAn Italian faculty at Trieste would cost us the Slovene deputies. A flat refusal would cost us the ally."
 ita_dnc.1972.a: "Give up the sandjak, and nothing more."
 ita_dnc.1972.b: "Give up the sandjak, and grant the faculty at Trieste."
 ita_dnc.1972.c: "Refuse. Article 7 does not cover Bosnia."
 ita_dnc.1973.t: "The Compensation Is Read Out"
 ita_dnc.1973.d: "The minister reads the exchange of notes to the Chamber. The deputies have already read it in the newspapers.\n\nWhat Vienna gave us is small. What we asked for was smaller, and the Chamber has decided to be satisfied."
 ita_dnc.1973.a: "Close the debate. The Chamber is satisfied."
 ita_dnc.1974.t: "Rome Is Refused by Vienna"
 ita_dnc.1974.d: "Rome asked Vienna to pay for the annexation of the provinces. She came away with very little.\n\nAn ally treated like that is worth talking to, and our own quarrel with Vienna over the Straits is the same quarrel. We can offer Rome a meeting at Racconigi, or wait until she is angrier."
 ita_dnc.1974.a: "Offer a meeting at Racconigi."
 ita_dnc.1974.b: "Wait. Rome will be angrier later."
 ita_dnc.1975.t: "Berlin Is Asked to Mediate"
 ita_dnc.1975.d: "Rome has refused the compensation Vienna offered. She asks us to press Vienna for a better one.\n\nThe alliance has no article that obliges us to judge between our two allies. If we press Vienna we keep Rome in the treaty. If we decline, Rome learns what the treaty is worth to us."
 ita_dnc.1975.a: "Press Vienna to reopen the question."
 ita_dnc.1975.b: "Refuse. The alliance has no article for this."
 ita_dnc.1984.t: "Rome Asks About Tripoli"
 ita_dnc.1984.d: "The Italian ambassador asks, as though in passing, whether we would object to an Italian administration on the shore east of Tunisia.\n\nWe have already exchanged notes saying that we would not, in return for a free hand in Tunis. Saying it again costs us nothing, and buys a neighbour who will not raise Tunis again."
 ita_dnc.1984.a: "Agree, and close the question of Tunis for good."
 ita_dnc.1984.b: "Object to an Italian Tripoli."
 ita_dnc.1985.t: "Rome Asks About Tripoli"
 ita_dnc.1985.d: "Rome asks whether the Mediterranean agreements still mean what they meant when they were signed.\n\nWe would rather see that shore Italian than left to a Porte that cannot hold it, and far rather Italian than French. The islands off the Anatolian coast are another matter, and we should say so now."
 ita_dnc.1985.a: "Agree to an Italian Tripoli."
 ita_dnc.1985.b: "Agree, but not to the Aegean islands."
 ita_dnc.1985.c: "Object to an Italian Tripoli."
 ita_dnc.1986.t: "Rome Asks About Tripoli"
 ita_dnc.1986.d: "Our ally asks whether the promises made when the alliance was young still hold on the African shore.\n\nThe Porte is our friend and our debtor, and will read our answer in her own newspapers. An ally refused this will go and ask the same question elsewhere."
 ita_dnc.1986.a: "Agree to an Italian Tripoli."
 ita_dnc.1986.b: "Object to an Italian Tripoli."
 ita_dnc.1987.t: "Rome Asks About Tripoli"
 ita_dnc.1987.d: "Rome asks whether Article 7 of the alliance covers an African adventure as well as a Balkan one.\n\nAn Italy busy on the far shore is an Italy that stops counting the Italian schools in our provinces. An Italy that wins there comes home with an army and an appetite."
 ita_dnc.1987.a: "Agree to an Italian Tripoli."
 ita_dnc.1987.b: "Object to an Italian Tripoli."
 ita_dnc.1988.t: "Rome Asks About Tripoli"
 ita_dnc.1988.d: "Rome asks for our word on the African shore and offers nothing new in return.\n\nIf the meeting at Racconigi was worth anything, it was worth this. The Porte will thank us either way, and the Straits are the only thing we want from her."
 ita_dnc.1988.a: "Agree to an Italian Tripoli."
 ita_dnc.1988.b: "Object to an Italian Tripoli."
 ita_dnc.1989.t: "Rome Sounds Europe on Tripoli"
 ita_dnc.1989.d: "Italian ambassadors have been round every court in Europe, asking whether our own province is free to be taken.\n\nOur governor at Tripoli reports a garrison under strength and wells nobody watches. We can send troops and build a road into the province now, or wait and hear what the powers answer."
 ita_dnc.1989.a: "Reinforce the province and put a road through it."
 ita_dnc.1989.b: "Wait, and reinforce nothing."
 ITA_g_tt_the_capital_answers: "§YThe capital we ask will answer, and its answer decides the question.§!"
 ITA_g_tt_no_one_signs_the_agreement: "§RThere is no government left in London to sign the agreement.§!"
 ITA_g_tt_the_zone_is_written: "§YOur zone in the interior of Abyssinia goes into the agreement.§!"
 ITA_g_tt_the_decade_is_reckoned: "§YThe ministry now answers for the decade, for what it asked for and for what it was given.§!"
 ITA_g_tt_vienna_lets_the_line_run: "§GVienna lets us build the railway to the lake.§!"
 ITA_g_tt_vienna_asks_nothing: "§YVienna asks us nothing about the vote.§!"
 ITA_g_tt_the_emperor_protests: "§RThe Emperor protests at the carving up of his country.§!"
 ITA_g_tt_the_railway_is_reserved: "§YParis keeps the railway that climbs from the coast.§!"
 ITA_g_tt_no_hand_is_offered: "§YPetersburg says nothing and offers us nothing.§!"
 ITA_g_tt_the_prefects_have_nothing_to_report: "§RThe prefects report that this election cannot be managed.§!"
 ITA_g_tt_a_power_objects: "§RA power objects, and we have one consent less from the powers.§!"
 ITA_g_tt_the_porte_waits: "§YThe Porte waits, and reinforces nothing.§!"
 ITA_g_threat_rome_at_antivari: "Italy is established at Antivari"
 ITA_g_threat_the_port_goes_to_vienna: "The port goes to Vienna"
 ITA_g_threat_the_alliance_is_not_one_sided: "Berlin warns Rome about the alliance"
 ITA_g_threat_the_zone_is_written: "Italy writes her zone into the agreement"
 ITA_g_threat_the_seventh_article: "Rome invokes Article 7 of the alliance"
 ITA_g_threat_the_bosnian_refusal: "Rome refuses the annexation"
 ITA_g_threat_the_powers_are_sounded: "Italy sounds the powers over Tripoli"
 ITA_g_threat_the_landing_corps: "Italy votes a landing corps"
 ITA_g_threat_the_porte_reinforces: "The Porte reinforces the shore"
 ITA_g_stringher_at_the_bank: "Stringher at the Bank"
 ITA_g_stringher_at_the_bank_desc: "Bonaldo Stringher is the director general of the Bank of Italy. He rebuilt the currency after the bank scandals, and he keeps the reserve out of the Treasury's reach. He will carry a debt conversion that no minister could carry alone."
 ITA_g_tittoni_at_the_consulta: "Tittoni at the Consulta"
 ITA_g_tittoni_at_the_consulta_desc: "Tommaso Tittoni went from prefect to foreign minister. He is patient with Vienna, and the press calls him soft for it. He gets more out of an ally by asking twice than the nationalists get by shouting."
 ITA_g_meda_the_catholic_deputy: "Meda for the Catholic Deputies"
 ITA_g_meda_the_catholic_deputy_desc: "Filippo Meda edits a Milan newspaper. He is the first Catholic to sit in the Chamber openly for Catholic voters. He can deliver the parish committees, and he will want the schools in return."
 ITA_g_spingardi_at_the_war_office: "Spingardi at the War Office"
 ITA_g_spingardi_at_the_war_office_desc: "Paolo Spingardi is a gunner who spent his career on supply. He knows what a landing corps costs before it sails. He will have the expedition ready sooner than the staff thinks possible."
 ITA_g_unione_liberale: "Unione Liberale"
 ITA_g_unione_liberale_long: "Unione Liberale"
 ITA_g_destra_costituzionale: "Destra Costituzionale"
 ITA_g_destra_costituzionale_long: "Destra Costituzionale"
 ITA_s_tt_the_alliance_is_a_faction: "If Berlin signs, the alliance becomes a faction and the Kingdom is in it."
 ITA_s_tt_the_rhine_is_not_promised: "The staff will not put the third army on the Rhine, and the guarantee lapses with it."
 ITA_s_tt_the_claim_is_kept: "Our claim on the Regency of Tunis stands."
 ITA_s_tt_no_ally_holds_the_alps: "There is no ally left to hold the Alpine frontier for us."
 ITA_s_tt_no_partner_signs: "There is no partner left to sign a naval convention, and the alliance stays on paper."
 ITA_s_tt_the_colony_stays_civil: "The colony keeps its civil governor, who may be appointed as a political advisor."
 ITA_s_tt_the_ministry_resigns: "The ministry resigns, and the country is told why."
 ITA_s_tt_the_kings_minister_goes: "The King's minister leaves the cabinet and the Chamber names his successor."
 ITA_s_tt_the_other_court_waits: "Vienna says nothing and keeps its garrisons where they are."
 ITA_s_tt_the_offer_is_declined: "We decline the offer and put the rising down ourselves."
 ITA_s_threat_rome_looks_at_tunis: "Italy looks at Tunis"
 ITA_s_threat_the_note_on_tunis: "Rome sends a note about Tunis"
 ITA_s_threat_the_malta_squadron: "The Squadron at Malta"
 ITA_s_threat_the_naval_convention: "The Naval Convention"
 ITA_s_threat_the_army_of_africa: "The Army of Africa"
 ITA_s_threat_the_war_of_tunis: "The War of Tunis"
 ITA_s_threat_the_insurrection: "The Insurrection"
 ITA_s_threat_the_tyrol_garrisons: "Vienna masses in the Tyrol"
 ITA_s_threat_royal_italy: "Royal Italy"
 ITA_s_threat_the_ministry_of_the_sword: "The Ministry of the Sword"
 ITA_s_triple_alliance: "Triple Alliance"
 ITA_s_ministero_del_re: "Ministero del Re"
 ITA_s_ministero_del_re_long: "The Ministry of the King"
 ITA_s_destra_costituzionale: "Destra Costituzionale"
 ITA_s_destra_costituzionale_long: "The Constitutional Right"
 ITA_s_governo_militare: "Governo Militare"
 ITA_s_governo_militare_long: "The Military Government"
 ITA_s_unione_liberale: "Unione Liberale"
 ITA_s_unione_liberale_long: "The Liberal Union"
 ita_dnc.1780.t: "The Chamber Is Recalled"
 ita_dnc.1780.d: "The Chamber comes back for the estimates, the army and navy money bills, and for nothing else. The deputies know it.\n\nWe ask them for no programme, only for the money to govern with. They can vote us their confidence, refuse it, or pass the budget and go home without saying anything."
 ita_dnc.1780.a: "Take the confidence and govern with it."
 ita_dnc.1780.b: "Let them refuse the confidence."
 ita_dnc.1780.c: "Vote the budget and adjourn."
 ita_dnc.1781.t: "The Ministry Is Beaten"
 ita_dnc.1781.d: "The Chamber has refused us its confidence and we have not resigned. The Statuto, the kingdom's constitution, says that ministers answer to the King, and the King has not asked for our resignation.\n\nHe can dissolve the Chamber and try the country again. Or he can keep us in office and let the Senate vote the money one month at a time."
 ita_dnc.1781.a: "Dissolve the Chamber again."
 ita_dnc.1781.b: "Keep the ministry, and let the Senate vote the money."
 ita_dnc.1785.t: "Rome Governs by Decree"
 ita_dnc.1785.d: "Our ally is in civil war. The King is governing by decree, behind a line of bayonets.\n\nThe Chancellor says that a monarchy putting down its own reds is doing our work for us. We can back the King openly, or say nothing and let him manage alone."
 ita_dnc.1785.a: "Back the King and his ministry."
 ita_dnc.1785.b: "Say nothing."
 ita_dnc.1786.t: "A Republic in North Italy"
 ita_dnc.1786.d: "There is a rising across the mountains. The northern Italian cities are out of their King's hands.\n\nThe old exiles are at the frontier, asking us for rifles and a road south. We can open the frontier and let the legions through, or close it and keep the quarrel on the far side of the passes."
 ita_dnc.1786.a: "Open the frontier and let the legions through."
 ita_dnc.1786.b: "Close the frontier."
 ita_dnc.1787.t: "Italy in Civil War"
 ita_dnc.1787.d: "Our southern neighbour is in civil war. Its northern provinces are held by the leagues, the peasant and workers' unions.\n\nThis house has always held that a throne in danger is every throne's business. We can offer the help of the Holy Alliance, mass our corps in the Tyrol for the sake of order, or watch and say nothing."
 ita_dnc.1787.a: "Offer the help of the Holy Alliance."
 ita_dnc.1787.b: "Mass our corps in the Tyrol, for order."
 ita_dnc.1787.c: "Watch, and say nothing."
 ita_dnc.1797.t: "The Offer of the Holy Alliance"
 ita_dnc.1797.d: "Vienna offers us the help of the Holy Alliance against our own rising, in the old form and with the old words.\n\nAn Austrian army would be at our disposal, and the price would be counted later. We can accept it, or put the rising down with the men we have."
 ita_dnc.1797.a: "Accept the offer."
 ita_dnc.1797.b: "Refuse. We will put the rising down ourselves."
 ita_dnc.1857.t: "The Answer Does Not Come"
 ita_dnc.1857.d: "There is no government at the other end of our note, or none that will put its name to what we proposed.\n\nThe file goes back into the cupboard with the rest of the correspondence. Nothing has been agreed, and nothing has been refused."
 ita_dnc.1857.a: "File it."
 ita_dnc.1876.t: "The Republic Asks for Recognition"
 ita_dnc.1876.d: "The Italian constituent assembly has proclaimed a republic. Its first note asks us to recognise it.\n\nA sister republic across the Alps is worth more to us than anything the kings ever signed there. We can recognise it, guarantee it and bring it in beside us, or recognise it and leave it standing alone."
 ita_dnc.1876.a: "Recognise the republic, guarantee it and bring it in beside us."
 ita_dnc.1876.b: "Recognise the republic, and nothing more."
 ita_dnc.1877.t: "The Republic Asks for Recognition"
 ita_dnc.1877.d: "The new Italian government asks for our recognition. It reminds us how many of its people live in our cities.\n\nOur consuls report the country quiet enough to deal with. We can recognise the republic at once, as we have done before, or wait for the next despatch."
 ita_dnc.1877.a: "Recognise the republic."
 ita_dnc.1877.b: "Wait for the next despatch."
 ita_dnc.1878.t: "The Republic Asks for Recognition"
 ita_dnc.1878.d: "The Italians ask for our recognition. The House of Savoy, in exile, still calls itself the lawful government of Italy.\n\nOur trade and our fleet argue for recognition. The palace argues against it, and a king with a claim is still received at our court. We can recognise the republic now that order is restored, or refuse."
 ita_dnc.1878.a: "Recognise the republic. Order is restored there."
 ita_dnc.1878.b: "Refuse while the House of Savoy still claims the throne."
 ita_dnc.1879.t: "The Republic Asks for Recognition"
 ita_dnc.1879.d: "The note asks the Emperor to receive a republic made by a chamber that sent its King away. It comes from a country we were allied to.\n\nThe Emperor has read it aloud twice. We can refuse it and say plainly why, or deal with the republic in fact and keep our ambassador at his desk."
 ita_dnc.1879.a: "Refuse. We do not receive a chamber that deposes its King."
 ita_dnc.1879.b: "Recognise in fact, and nothing on paper."
 ita_dnc.1884.t: "The Republic Asks for Recognition"
 ita_dnc.1884.d: "A republic made by a chamber that sent its King away asks the Emperor to recognise it. Our own nationalities read the Italian newspapers.\n\nThe corps of the Tyrol have already asked for their reservists. We can refuse recognition and mass them. We can offer it against a written renunciation of the irredenta, the Italian lands under our rule. Or we can recognise the republic in fact and say nothing more."
 ita_dnc.1884.a: "Refuse, and prepare a war to put the King back."
 ita_dnc.1884.b: "Offer recognition for a written renunciation of the irredenta."
 ita_dnc.1884.c: "Recognise in fact. We have other frontiers."
 ita_dnc.1885.t: "The Republic Asks for Recognition"
 ita_dnc.1885.d: "The Italian chamber has voted the King out and proclaimed a republic. Rome now asks us to recognise it.\n\nThe Holy Synod is against it, and no autocracy likes to applaud a deposed king. We can refuse the request, or recognise the republic and keep a friend in the Mediterranean."
 ita_dnc.1885.a: "Refuse recognition to the republic."
 ita_dnc.1885.b: "Recognise the republic and keep Rome friendly."
 ita_dnc.1886.t: "Vienna's Price for Recognition"
 ita_dnc.1886.d: "Vienna will recognise the republic on one condition. We must renounce every claim beyond the eastern frontier, in writing, before the assembly.\n\nThe provinces named are the ones our schools have taught about for 40 years. We can sign and have the recognition, or refuse and wait for the Austrian corps in the Tyrol."
 ita_dnc.1886.a: "Sign the renunciation and take the recognition."
 ita_dnc.1886.b: "Refuse to renounce the unredeemed provinces."
 ITA_r_blocco_popolare: "Blocco Popolare"
 ITA_r_blocco_popolare_long: "The Popular Bloc"
 ITA_r_unione_liberale: "Unione Liberale"
 ITA_r_unione_liberale_long: "The Liberal Union"
 ITA_r_destra_costituzionale: "Destra Costituzionale"
 ITA_r_destra_costituzionale_long: "The Constitutional Right"
 ITA_r_partito_repubblicano: "Partito Repubblicano"
 ITA_r_partito_repubblicano_long: "The Republican Party"
 ITA_r_camere_del_lavoro: "Camere del Lavoro"
 ITA_r_camere_del_lavoro_long: "The Chambers of Labour"
 ITA_r_entente_latine: "Entente Latine"
 ITA_r_revel_at_the_admiralty: "Paolo Thaon di Revel"
 ITA_r_revel_at_the_admiralty_desc: "The admiral the navy sends to the Chamber when it has to explain what a battleship costs. He will take the fleet as far as the government has agreed to go, and no further."
 ITA_r_colajanni_at_the_constituent: "Napoleone Colajanni"
 ITA_r_colajanni_at_the_constituent_desc: "A Sicilian republican who has spent his life proving that the South is governed badly on purpose. He prints the figures to show it, and he wrote his constitution years before there was an assembly to read it to."
 ITA_r_threat_the_constituent: "The Italian Chamber declares itself constituent"
 ITA_r_threat_the_king_at_turin: "The King of Italy raises his standard in the north"
 ITA_r_threat_vienna_takes_the_kings_part: "Vienna guarantees the Italian King"
 ITA_r_threat_the_throne_is_empty: "Italy puts the throne itself to the question"
 ITA_r_threat_the_republic_proclaimed: "The Italian republic is proclaimed"
 ITA_r_threat_the_pope_leaves_rome: "The Pope leaves for the Tyrol"
 ITA_r_threat_berlin_will_not_recognise: "Berlin refuses to recognise the Italian republic"
 ITA_r_threat_the_republic_of_labour: "The chambers of labour take the Italian State"
 ITA_r_threat_vienna_reads_the_red_republic: "Vienna takes a war aim against the red republic"
 ITA_r_threat_the_cordon_on_the_isonzo: "Vienna draws a cordon on the Isonzo"
 ITA_r_threat_the_tyrol_corps_are_massed: "The corps of the Tyrol are massed against Italy"
 ITA_z_tt_the_capital_answers: "§YThe capital that is asked will answer, and its answer decides.§!"
 ITA_z_threat_vienna_answers_conrad: "Vienna weighs a preventive war on Italy"
 ITA_z_threat_the_tyrol_mobilises: "Austria mobilises in the Tyrol"
 ITA_z_threat_the_german_guarantee: "Berlin guarantees Vienna against Italy"
 ITA_z_threat_the_hour: "Italy marches on the Isonzo"
 ITA_z_threat_the_serbian_guarantee: "Italy guarantees Serbia against Vienna"
 ITA_z_threat_the_isonzo_guarantee: "Berlin guarantees Austria against Italy"
 ITA_z_threat_the_albanian_prince: "Italy sets a prince of her own over Albania"
 ITA_z_threat_the_wargoal_on_the_porte: "Italy prepares to take Albania by arms"
 ITA_z_threat_the_condominium: "Vienna demands a share of Albania"
 ITA_z_threat_our_wing_over_cetinje: "Italy takes Montenegro under her wing"
 ITA_z_threat_the_savoy_crown: "A Savoy viceroy is set over Albania"
 ITA_z_party_nazionalista: "Associazione Nazionalista"
 ITA_z_party_nazionalista_long: "Associazione Nazionalista Italiana"
 ITA_z_party_unione_nazionale: "Unione Nazionale"
 ITA_z_party_unione_nazionale_long: "Unione Nazionale Liberale"
 ITA_z_party_unione_liberale: "Unione Liberale"
 ITA_z_party_unione_liberale_long: "Unione Liberale Italiana"
 ITA_z_adriatic_league: "Adriatic League"
 ita_dnc.1655.t: "Vienna Draws Back from War"
 ita_dnc.1655.d: "Vienna has heard its Chief of Staff and has not followed him. The corps on the frontier stand down and the ambassador is cordial again.\n\nThe newspapers print what they were forbidden to print a month ago. The country has seen how near the war came, and does not like what it saw."
 ita_dnc.1655.a: "Note it. We were spared a war we did not choose."
 ita_dnc.1656.t: "Conrad Asks for War"
 ita_dnc.1656.d: "Conrad has come again with the same memorandum. Italy is arming and talking to Belgrade, and the day Rome is ready we fight on two fronts instead of one.\n\nOur foreign ministry answers that the alliance is worth more than the Trentino. The Emperor must decide which of the two he believes."
 ita_dnc.1656.a: "Refuse him. The alliance is worth more than the Trentino."
 ita_dnc.1656.b: "Let him mobilise in the Tyrol."
 ita_dnc.1657.t: "The Tyrol Mobilises"
 ita_dnc.1657.d: "Austria has called up her reservists in the Tyrol, and our works in the Cadore are watched from the far side of the ridge. The ambassador calls it a manoeuvre and invites us to count the days ourselves.\n\nWe can call up our own men, or ask Berlin to hold Vienna back."
 ita_dnc.1657.a: "Call up our own reservists."
 ita_dnc.1657.b: "Ask Berlin to hold Vienna back."
 ita_dnc.1658.t: "Berlin Says No"
 ita_dnc.1658.d: "The German ambassador has read us a note. The alliance, it says, does not cover a war one partner opens against another.\n\nOur staff answers that the Tyrol is a matter for the Empire alone. We can give up the mobilisation, or carry it through without Berlin behind us."
 ita_dnc.1658.a: "Give up the mobilisation."
 ita_dnc.1658.b: "Carry it through regardless."
 ita_dnc.1659.t: "Rome Asks Us to Restrain Vienna"
 ita_dnc.1659.d: "The Italian ambassador asks whether we mean to watch one ally mobilise against another and call it a manoeuvre. He leaves a memorandum on the tonnage Italy would put into the Mediterranean if the alliance broke up.\n\nWe can hold Vienna back, or let the two of them settle it between themselves."
 ita_dnc.1659.a: "Hold Vienna back."
 ita_dnc.1659.b: "Let them settle it."
 ita_dnc.1672.t: "Rome Offers Terms"
 ita_dnc.1672.d: "Rome offers peace in exchange for the provinces: the Trentino, the South Tyrol, Trieste, Istria and the mines at Idrija. If the front gives way further, the price rises to Fiume and the Dalmatian coast.\n\nThe Hungarians have said again that they will not fight for Trieste. Either the army holds, or we pay what Rome asks."
 ita_dnc.1672.a: "Cede the provinces and end it."
 ita_dnc.1672.b: "Cede the coast as well."
 ita_dnc.1672.c: "Fight on."
 ita_dnc.1673.t: "The Armistice"
 ita_dnc.1673.d: "The Italian front has broken and our corps are down on the plain, with winter coming on behind them. The staff has drawn the terms it believes Rome will sign rather than lose Venetia.\n\nWe can take money, we can take the Friuli, we can hold Venetia as a pledge, or we can hold their fleet down for a term of years."
 ita_dnc.1673.a: "Take an indemnity and keep the old frontier."
 ita_dnc.1673.b: "Take the Friuli."
 ita_dnc.1673.c: "Hold Venetia and the Friuli in pledge."
 ita_dnc.1673.e: "Hold their fleet down for a term of years."
 ita_dnc.1674.t: "The Peace on the Isonzo"
 ita_dnc.1674.d: "The war on the Isonzo is over. The peace was signed at the front and the map has been redrawn to the watershed, and Rome is stronger than she was.\n\nWe can open our door to her again, or guarantee what is left of Austria against her."
 ita_dnc.1674.a: "Open the door to Rome again."
 ita_dnc.1674.b: "Guarantee what is left of Austria."
 ita_dnc.1675.t: "Italy Takes Dalmatia"
 ita_dnc.1675.d: "The Dalmatian coast has passed from Vienna to Rome, and Rome has never pretended the coast was Slav. Our own claim was never renounced. The peace was signed without a word to us.\n\nWe can lodge the claim now and be heard, or say nothing and wait."
 ita_dnc.1675.a: "Lodge the claim."
 ita_dnc.1675.b: "Say nothing."
 ita_dnc.1684.t: "Rome's Offer to Montenegro"
 ita_dnc.1684.d: "The Italian minister brings a subsidy, the works at the port and a guarantee of our frontiers. In exchange he asks for our foreign policy.\n\nThe Queen of Italy is our King's daughter, and Rome has never let us forget it. We can take the guarantee, take the protection that comes wrapped inside it, or ask Petersburg first."
 ita_dnc.1684.a: "Take the guarantee."
 ita_dnc.1684.b: "Take the protectorate."
 ita_dnc.1684.c: "Ask Petersburg first."
 ita_dnc.1687.t: "Montenegro Asks About the Subsidy"
 ita_dnc.1687.d: "Cetinje asks whether our subsidy goes on if it takes the Italian one as well. The court there is ours by marriage and by habit. The Adriatic, though, is not a Russian sea.\n\nWe can stand aside and let Rome pay for what she is buying, or take her as a partner in protecting Montenegro."
 ita_dnc.1687.a: "Stand aside and let Rome pay."
 ita_dnc.1687.b: "Take Rome as a partner in the protection."
 ITA_v_catholic_union: "Unione Cattolica"
 ITA_v_catholic_union_long: "Unione Cattolica"
 ITA_v_national_democratic_league: "Lega Democratica Nazionale"
 ITA_v_national_democratic_league_long: "Lega Democratica Nazionale"
 ITA_v_liberal_catholic_union: "Unione Liberale Cattolica"
 ITA_v_liberal_catholic_union_long: "Unione Liberale Cattolica"
 ITA_v_liberal_union: "Unione Liberale"
 ITA_v_liberal_union_long: "Unione Liberale"
 ITA_v_the_triple_alliance: "Triple Alliance"
 ITA_dec_buggerru_tt: "We hold a public inquiry into the shootings at the Buggerru mine, and the anger in the streets comes down."
 ITA_dec_amnesty_romagna_tt: "The province is pardoned. The anger in the streets falls at once, and it will not climb back as high."
 ITA_dec_brazil_reopened_tt: "We ask Rio whether the subsidised passage may be opened again on our terms."
 ITA_dec_banks_branch_tripoli_tt: "The Banco di Roma opens at Tripoli, and Italian money is on that coast before our troops are."
 ITA_dec_amnesty_new_reign_tt: "The new King pardons the political prisoners. The streets calm sharply and will not run as hot again, and the Crown pays for it."
 ITA_dec_guarantees_read_again_tt: "The Law of Guarantees, which fixed the Pope's standing, is read again for what it would allow. The Vatican is listening."
 ITA_dec_the_catechism_tt: "The parish priest teaches in the state schools again. The country is steadier, and the anticlerical towns protest."
 ITA_dec_municipal_socialism_tt: "The town council takes the works into its own hands, a new factory goes up, and the streets calm."
 ITA_dec_womens_work_law_tt: "The hours in the mills and the rice fields are fixed by law and inspected, and the mill towns quieten."
 ITA_dec_trieste_gymnasts_tt: "The gymnastic societies drill in the open, and Vienna must decide what to call them."
 ITA_dec_consulate_at_fiume_tt: "The consulate at Fiume is enlarged, and our consular service reports better than any other office we have."
 ITA_dec_strike_burned_out_tt: "The men go back to work, and the streets are as quiet as they have been for a long time."
 ITA_dec_strike_hardened_tt: "The strike ends, but the habit of striking stays. The streets will not settle as low again, and our majority slips."
 ITA_dec_soundings_put_off_tt: "No capital is asked, and the question waits for another day."
 ita_dnc.2200.t: "The Strike Runs Its Course"
 ita_dnc.2200.d: "We sent no troops. We shut no chamber of labour, the local union office, and we made no arrests. The strike has now outlasted the money behind it.\n\nThe Confederation of Labour can call the men back with nothing to show for it. Or it can let the chambers vote to stay out, and turn a wage dispute into a quarrel with the state. Either way, we shall be told we did too little."
 ita_dnc.2200.a: "Let the Confederation call the men back."
 ita_dnc.2200.b: "Let the chambers of labour vote to stay out."
 ita_dnc.2208.t: "The Italian Indemnity Claim"
 ita_dnc.2208.d: "The Italian ambassador has presented the claim a second time. He asks payment for the Italians killed in Louisiana, and he asks that Italian consuls be let onto the landing stages to meet the arrivals.\n\nThe money is small. The precedent is not, and every other government that sends us its poor will ask for the same thing."
 ita_dnc.2208.a: "Pay the claim, and let their consuls onto the landing stages."
 ita_dnc.2208.b: "Refuse. The matter belongs to the courts of the state."
 ita_dnc.2212.t: "The Italian Emigration Ban"
 ita_dnc.2212.d: "Rome has banned the subsidised passage to our ports, and our coffee planters have been short of hands ever since. Rome will now lift the ban on two conditions. Italian consuls must be allowed to inspect the plantations, and the contracts must be paid in coin.\n\nThe planters want the hands and have wanted them for years. They will not enjoy being inspected by a foreign government on their own land."
 ita_dnc.2212.a: "Accept the inspection. We need the hands."
 ita_dnc.2212.b: "Refuse. No foreign consul will inspect our plantations."
 ita_dnc.2216.t: "Sounding the Powers"
 ita_dnc.2216.d: "The foreign ministry has written the same confidential question five times over, once for each of the powers whose opinion will matter when we take Tripoli. Each capital will answer differently, and each answer will cost us something somewhere else.\n\nNone of them can be asked twice in the same season. We must choose which capital hears the question first."
 ita_dnc.2216.a: "Ask Paris."
 ita_dnc.2216.b: "Ask London."
 ita_dnc.2216.c: "Ask Berlin."
 ita_dnc.2216.e: "Ask Vienna."
 ita_dnc.2216.f: "Ask Petersburg."
 ita_dnc.2216.g: "Put the question off for now."
 ITA_e_the_consuls_on_the_quay: "The Consuls on the Quay"
 ITA_e_the_consuls_on_the_quay_desc: "Our consulates in the Americas keep a register of every Italian who lands. A man who is on that register can be found again, and more of them come home to serve."
 ITA_e_the_chaplains_of_the_passage: "The Chaplains of the Passage"
 ITA_e_the_chaplains_of_the_passage_desc: "The Scalabrinian fathers sail with the emigrants and write home to the parish that sent them. The village keeps its hold on its men, and more of them come back."
 ITA_b_the_pensions_are_funded: "The Pensions Are Funded"
 ITA_b_the_pensions_are_funded_desc: "The old age fund is compulsory and the employers pay into it. Every wage in the kingdom is that much smaller, and the country buys that much less."
 ITA_i_the_committees_beyond_the_frontier: "The Committees Beyond the Frontier"
 ITA_i_the_committees_beyond_the_frontier_desc: "The irredentist committees in the Italian lands under Austria send back roads, garrisons and railway timetables. Our staff no longer has to guess at them when it plans."
 ITA_i_the_committees_beyond_the_frontier_reinforced: "The Committees Across the Frontier"
 ITA_i_the_committees_beyond_the_frontier_reinforced_desc: "The committees are paid out of the secret funds and answer to the staff, not to the newspapers. The maps that come back are drawn to scale, and our plans against Austria come together fast."
 ITA_i_the_map_of_the_adriatic: "The Map of the Adriatic"
 ITA_i_the_map_of_the_adriatic_desc: "The staff has the soundings of the Austrian shore, the roads behind it, and a plan drawn for both. A war with Austria will be planned faster for it."
 ITA_w_the_schools_are_reinforced: "The Schools Are Reinforced"
 ITA_w_the_schools_are_reinforced_desc: "Every schoolmaster we send down the Albanian coast comes back with something our staff can use against the Ottomans."
 ITA_dnc_wars_cat: "The Staff and the Wars"
 ITA_af_the_lake_tana_survey: "The Lake Tana Survey"
 ITA_af_the_lake_tana_survey_desc: "Our engineers want the levels of Lake Tana and the passes that lead to it. The Emperor will not like being asked, and we shall send the survey without asking him."
 ITA_wp_plan_west: "Plan West"
 ITA_wp_plan_west_desc: "The staff keeps a plan for the French frontier, and nobody has opened it since the last quarrel with Paris. We will bring it up to date: the passes, the depots and the railway timetables."
 ITA_wp_plan_east: "Plan East"
 ITA_wp_plan_east_desc: "There is a plan against Austria-Hungary, our own ally, in a locked drawer. Nobody has walked the ground it describes. We will work it through: the river line, the mountain sectors and the railways that would carry the army there."
 ITA_wp_the_libya_expedition: "The Libya Expedition"
 ITA_wp_the_libya_expedition_desc: "Landing an army in Tripoli is a naval problem before it is a military one. We will rehearse the loading, the convoy and the beaches until the corps can sail within a fortnight of the order."
 ITA_wp_the_adwa_column: "The Adwa Column"
 ITA_wp_the_adwa_column_desc: "The road up to the Ethiopian highlands is the road on which we lost an army at Adwa. We will plan the column properly this time: water, transport, and a line of posts behind it."
 ITA_wr_the_transports_at_naples: "The Transports at Naples"
 ITA_wr_the_transports_at_naples_desc: "The expedition is waiting for ships, and the merchant companies want their summer trade. We will requisition the transports lying at Naples and load the corps."
 ITA_wr_the_indemnity_loan: "The Indemnity Loan"
 ITA_wr_the_indemnity_loan_desc: "We are paying the indemnity out of the ordinary budget, and it is eating the estimates. We will cover it with a loan instead, and the charge will run out within the year."
 ITA_dec_massawa_railway_tt: "The railway from Massawa reaches the highlands."
 ITA_dec_benadir_tt: "The Benadir coast passes to the state, with the ascari, our colonial troops."
 ITA_dec_senussi_subsidy_tt: "The Senussi take our money, and one ungoverned province comes back under control."
 ITA_dec_sultans_treaties_tt: "The treaties with the coastal sultans are renewed in the name of the kingdom."
 ITA_dec_lake_tana_tt: "The survey of Lake Tana is filed at the staff, and the Emperor hears of it."
 ITA_dec_the_zone_is_asked_tt: "London is asked to confirm that our zone in Ethiopia is still ours."
 ITA_dec_the_order_is_asked_tt: "The Senussi are asked to keep the interior quiet."
 ITA_dec_customs_at_massawa_tt: "The Emperor is offered a share of the customs at Massawa."
 ITA_dec_apulian_aqueduct_tt: "The aqueduct reaches Apulia, and the province is quieter for it."
 ITA_dec_messina_rebuilt_tt: "Messina is rebuilt in stone."
 ITA_dec_calabria_law_tt: "The special law is applied to Calabria."
 ITA_dec_transports_at_naples_tt: "The transports are requisitioned at Naples and loaded."
 ITA_dec_islands_pledge_tt: "We claim the islands of the Aegean, and the powers take note."
 ITA_dec_garibaldi_volunteers_tt: "The Garibaldi legion takes the field."
 ITA_dec_irredentist_legion_tt: "The students from the Austrian lands take the field as an alpine legion."
 ITA_dec_indemnity_loan_tt: "The indemnity is funded by loan, and the charge runs out within the year."
 ITA_dec_montenegrin_loan_tt: "The Prince takes our money, and Antivari is ours to use."
 ITA_dec_article_twenty_nine_tt: "Vienna is asked in public to give up Article 29."
 ITA_dec_the_huts_tt: "The homeless are under a roof before the rains, and the strait is quieter."
 ITA_dec_relief_credit_tt: "The credit is voted and spent on Messina, and the Chamber is with us."
 ITA_dec_sailors_thanked_tt: "The Russian, British and American squadrons are thanked by name."
 ITA_dec_reconstruction_plan_tt: "Messina is rebuilt to the plan and to the building code."
 ITA_dec_straits_ferry_tt: "The ferry berths join Sicily to the mainland."
 ITA_dec_tt_the_highlands_answer: "Rome hears that the offer has been taken up."
 ITA_dec_tt_a_power_reaffirms: "London confirms the Italian zone, and one more power has said yes."
 ITA_dec_tt_the_article_is_struck: "The article is struck out, Montenegro may arm its coast, and Rome is the warmer for it."
 ITA_dec_tt_the_interior_stays_quiet: "The brotherhood stands aside, and the interior stays quiet."
 ITA_af_threat_the_order_answers: "The Senussi proclaim a holy war against Italy"
 ita_dnc.2224.t: "The Massawa Customs Offer"
 ita_dnc.2224.d: "The Italians offer us a share of the customs at Massawa. Everything our merchants land there is taxed before it ever reaches the highlands, and the money stays in Italian hands. The draft agreement asks one thing in return: our caravans keep to the road they have always used. We can sign it, or leave the paper where it lies and go on paying at the gate."
 ita_dnc.2224.a: "Sign the customs agreement."
 ita_dnc.2224.b: "Leave the paper where it lies and go on paying."
 ita_dnc.2225.t: "The Customs Agreement Signed"
 ita_dnc.2225.d: "The agreement is signed, and the first quarter's receipts are already going up to the highlands. Our consul writes that the party at court which wants nothing from us has lost ground. We mean to build on that."
 ita_dnc.2225.a: "Keep the road open and take our share of the receipts."
 ita_dnc.2226.t: "The Customs Offer Refused"
 ita_dnc.2226.d: "Our draft convention has come back from the Ethiopian court unsigned. The note with it is courteous. It says that an empire does not take a share of another man's customs house.\n\nWe keep all the receipts at the port, and we have lost the opening we wanted. Our own men at the customs house now say they expected the refusal, though none of them said so before."
 ita_dnc.2226.a: "File it and wait"
 ita_dnc.2228.t: "Rome Asks About the Zone"
 ita_dnc.2228.d: "Rome asks whether the agreement of the three powers on Abyssinia still stands. It asks whether the zone that agreement left to Italy is still hers. The note plainly expects an answer we shall have to publish.\n\nWe may confirm the agreement as it was signed. Or we may say nothing, and keep our own hands free on the upper river."
 ita_dnc.2228.a: "Confirm the agreement and the Italian zone."
 ita_dnc.2228.b: "Say nothing, and keep our hands free"
 ita_dnc.2229.t: "The Zone Is Reaffirmed"
 ita_dnc.2229.d: "London has answered, and the answer names the zone. It is friendly, and it is in writing.\n\nThe Consulta, our foreign ministry, can quote it the next time the powers ask. The consent we have been counting is worth a little more than it was."
 ita_dnc.2229.a: "Quote it the next time the powers ask."
 ita_dnc.2230.t: "No Answer on the Zone"
 ita_dnc.2230.d: "The answer has come back. It says a great deal about an old friendship, and nothing at all about the zone.\n\nThe agreement has not been denied. It has not been confirmed either, and we shall have to ask again."
 ita_dnc.2230.a: "Ask again when the moment suits us."
 ita_dnc.2232.t: "Rome Wants the Clause Dropped"
 ita_dnc.2232.d: "The Italians ask us to give up Article 29 of the treaty. It is the article that stops Montenegro arming its own coast and puts that shore under our naval police. Their newspapers already have the note in proof.\n\nWe may drop the article and be thanked for it in Cetinje. Or we may refuse, and let the ministry in Rome explain that at home."
 ita_dnc.2232.a: "Give up Article 29."
 ita_dnc.2232.b: "Refuse, and let Rome explain it at home."
 ita_dnc.2233.t: "The Clause Is Struck Out"
 ita_dnc.2233.d: "Vienna has given up Article 29. The shore opposite ours is free of Austrian naval police for the first time.\n\nThe prince in Cetinje knows who asked for it. Montenegro will remember the favour, and so will Vienna."
 ita_dnc.2233.a: "Tell Cetinje who asked for it."
 ita_dnc.2234.t: "The Clause Stands"
 ita_dnc.2234.d: "The answer will not touch Article 29. It was written to be read aloud, and it will be.\n\nThe papers have it by the evening and the street has it by the morning. The fleet draws its own conclusion and goes back to its gunnery."
 ita_dnc.2234.a: "Print it, and send the fleet back to its gunnery."
 ita_dnc.2244.t: "Rome Asks for Our Neutrality"
 ita_dnc.2244.d: "An envoy has come up from the coast. He carries letters from the Italian bank and from the missions, and one request: that we keep the oases quiet whatever happens on the shore.\n\nHe offers subsidies for the lodges, arms for the caravans and a written promise about our schools. We may give the word and stand aside, or preach the holy war and close the wells behind him."
 ita_dnc.2244.a: "Give the word, and stand aside"
 ita_dnc.2244.b: "Preach the holy war and close the wells."
 ita_dnc.2245.t: "The Interior Stays Quiet"
 ita_dnc.2245.d: "The word has gone out to the lodges of the interior. Whatever happens on the shore, the oases will not rise.\n\nIt has cost the Treasury and the missions a great deal between them. It has also saved us the army corps we would have needed to hold the wells."
 ita_dnc.2245.a: "Pay the subsidies and keep the word."
 ita_dnc.2246.t: "The Order Preaches Holy War"
 ita_dnc.2246.d: "The brotherhood has answered with a proclamation. The wells behind the coast are closed to us.\n\nEvery column that goes inland will have to fight for its water. The country knows it, and wants the thing done anyway."
 ita_dnc.2246.a: "Send the columns and fight for the water."
 ITA_c_the_crown: "The Crown"
 ITA_c_the_crown_desc: "There is a King in this kingdom, and the Statuto, the kingdom's constitution, does not say how much of it is his. What he believes he may do is settled by what the last ministry let him do.\n\nThe Crown's hand: §Y[?ITA_crown|0]§! out of 100.\n\nBelow 35 the King listens. Between 35 and 64 he hesitates. At 65 and above the King governs."
 ITA_g_the_ministry_of_the_left: "The Ministry of the Left"
 ITA_g_the_ministry_of_the_left_desc: "The majority is not a party. It is bought back session by session with a portfolio here and a public work there. Nothing gets through the Chamber until the Extreme Left has had its answer, and every bargain costs more than the last."
 ITA_g_the_convention_of_paris: "The Convention of Paris"
 ITA_g_the_convention_of_paris_desc: "Our workmen in France are covered by a labour treaty, signed in the open and marked by a presidential visit. Two governments that quarrelled over Tunis now have a paper to point at. Trade across that frontier costs us less, and governments of our own kind are easier to talk to."
 ITA_g_the_rente_converted: "The Debt Converted"
 ITA_g_the_rente_converted_desc: "The Paris market carried the conversion, and the interest we pay on the state debt has come down. The money that used to go out in coupons goes into new factories instead, and the Treasury has room to move."
 ITA_g_the_rente_half: "The Half Conversion"
 ITA_g_the_rente_half_desc: "The conversion went through without the Treasury at the table. The saving is real, and it is smaller than it should have been. There is money for new factories, and the banking houses that did the work know we could not do it ourselves."
 ITA_g_the_conversion_that_failed: "The Conversion That Failed"
 ITA_g_the_conversion_that_failed_desc: "No market would carry the paper, and the Treasury has had to say so out loud. We still pay the old interest on the whole debt. Every ministry that follows will be asked in the Chamber why the coupon was not cut."
 ITA_g_the_state_railways: "The State Railways"
 ITA_g_the_state_railways_desc: "The lines have been bought back from the companies and are run from a desk in Rome. The timetable is worse than it was. The state now decides where the next embankment goes, and new track is laid faster."
 ITA_s_garrison_duty: "Garrison Duty"
 ITA_s_garrison_duty_desc: "Battalions that should be at manoeuvres are standing in market squares with fixed bayonets. The men are learning police work instead of soldiering, and the army trains worse for it."
 ITA_s_the_protocol: "The Police Convention"
 ITA_s_the_protocol_desc: "We have signed a police convention against the anarchists with a power that has hunted them longer than we have. The two forces now pass names and descriptions across the frontier."
 ITA_s_the_powers_silence: "The Powers' Silence"
 ITA_s_the_powers_silence_desc: "We asked the foreign ministries of Europe what they would say, and not one of them answered. Nobody has told us to stop, and the country is readier for what comes next."
 ITA_s_the_naval_convention: "The Naval Convention"
 ITA_s_the_naval_convention_desc: "Our squadrons and theirs now share a signal book, a coaling plan and a station in the Mediterranean. Our officers train to a doctrine that has already been written and proved, so the fleet learns faster and its own doctrine costs us less to work out."
 ITA_s_the_score_of_tunis_settled: "The Tunis Grievance Settled"
 ITA_s_the_score_of_tunis_settled_desc: "The oldest grievance in the kingdom has been settled. The men who were told to forget Tunis no longer have to. The country is a good deal steadier for it."
 ITA_s_bizerte_open: "Bizerte Open"
 ITA_s_bizerte_open_desc: "The works at Bizerte have been levelled and the basin is open water again. No fleet is based there, and no new naval works may be built on that coast. Traders on both shores think better of an arrangement that keeps the roadstead open."
 ITA_s_the_indemnity: "The Indemnity"
 ITA_s_the_indemnity_desc: "The peace was bought with a sum the Treasury will be paying off for years, and the instalments are due in gold. The money comes out of what the country would otherwise have bought, and every ministry will be judged on the payments."
 ITA_s_the_fleet_limited: "The Fleet Limited"
 ITA_s_the_fleet_limited_desc: "The peace fixed what we may lay down, and the yards have been told which slips to close. The empty slips stand where our dockyards were, and the naval estimates are now settled in another capital."
 ITA_r_the_yards_stopped: "The Yards Stopped"
 ITA_r_the_yards_stopped_desc: "The men at the great arsenal have downed tools, and the admirals have written to the King about it. Nothing leaves the slipways until the dispute is settled."
 ITA_r_the_sunday_rest: "The Sunday Rest"
 ITA_r_the_sunday_rest_desc: "One day in seven is closed by law, and the inspectors are being let through the factory gate at last. The mills lose a shift a week, and the country is calmer for it."
 ITA_r_the_berlin_model: "The Berlin Model"
 ITA_r_the_berlin_model_desc: "Our study mission came home from Berlin with the workers' insurance registers of a state that has been at this longer than we have. Our clerks are copying the forms, and the men in the works have noticed the difference."
 ITA_r_the_crown_and_the_bloc: "The Crown and the Bloc"
 ITA_r_the_crown_and_the_bloc_desc: "The King has accepted the Bloc as his majority, and the Bloc has stopped asking whether he would. A ministry that need not look over its shoulder carries its business faster."
 ITA_r_the_arbitration_clause: "The Arbitration Clause"
 ITA_r_the_arbitration_clause_desc: "We have signed a general treaty of arbitration, and it is printed. Our quarrels go to a table before they reach a frontier. The country approves, and it has stopped thinking about war."
 ITA_r_the_war_not_fought: "The War Not Fought"
 ITA_r_the_war_not_fought_desc: "The expedition was talked about, costed, and then put away in a drawer. The Treasury is relieved and so are the families of the south, and the country is quieter than it has been."
 ITA_r_the_constituent_sits: "The Constituent Assembly"
 ITA_r_the_constituent_sits_desc: "An assembly is writing the constitution from the beginning. Until it has finished, nothing else can be settled. Every order a minister signs is provisional, and every deputy knows it."
 ITA_r_the_republic: "The Republic"
 ITA_r_the_republic_desc: "The form of the state has changed, and the prefects are still addressing their reports to a Crown that is not there. It will settle in time, and it has not settled yet."
 ITA_r_the_guarantees_renewed: "The Guarantees Renewed"
 ITA_r_the_guarantees_renewed_desc: "The new state has renewed, in its own name, the guarantees the kingdom gave the Pope. He has stayed in Rome, and half the old quarrel went out with the King."
 ITA_r_the_republic_one_and_indivisible: "The Republic, One and Indivisible"
 ITA_r_the_republic_one_and_indivisible_desc: "The assembly has voted the formula and the army has sworn to it. Plenty is still in dispute. The shape of the state is not, and the country has settled around it."
 ITA_z_the_army_that_is_not_ready: "The Army Is Not Ready"
 ITA_z_the_army_that_is_not_ready_desc: "The general staff has put in writing what the ministry did not want written down: the army is not fit to fight. The country has read it too, and has stopped believing in the war."
 ITA_z_the_war_that_did_not_come: "Vienna Refuses Its War"
 ITA_z_the_war_that_did_not_come_desc: "The Austrian general staff asked for its war against us and was refused by its own foreign ministry. Both frontiers have gone quiet again, and the country has stopped waiting for bad news."
 ITA_z_the_mobilisation: "The Mobilisation"
 ITA_z_the_mobilisation_desc: "The men of military age have been called up, the railways are on the military timetable and the depots are full. The country has never been readier for a war, and it knows it."
 ITA_z_the_legions_in_the_street: "The Volunteers in the Street"
 ITA_z_the_legions_in_the_street_desc: "The volunteer companies did not go home when the crisis passed. They drill in the open, where the prefect can watch them and do nothing. There are more men under arms than the state has sworn in."
 ITA_z_the_two_shores: "Both Shores"
 ITA_z_the_two_shores_desc: "One sea, two coasts, and our flag over the harbours of both. Freight that used to go the long way round now goes straight across, and traders everywhere think better of us."
 ITA_z_the_consular_service_reinforced: "The Consular Service Reinforced"
 ITA_z_the_consular_service_reinforced_desc: "Every port and market town on the eastern shore has an Italian consul, a clerk and a subsidy. They send back what they hear, so Rome usually knows what the Austrian staff intends before it is signed."
 ITA_k_the_private_channel: "The Private Channel"
 ITA_k_the_private_channel_desc: "There is no audience and no announcement. A monsignor calls on a lawyer in a private house, and the two of them settle what can be settled. The Catholic courts of Europe have noticed how quiet Rome has become."
 ITA_k_the_lodges_against_us: "The Lodges Against Us"
 ITA_k_the_lodges_against_us_desc: "The masonic lodges and the Extreme Left have decided that this is a clerical ministry, and they obstruct it as one. Every measure has to be carried twice, and paid for twice."
 ITA_k_the_missions: "The Missions Shared"
 ITA_k_the_missions_desc: "The protection of the Catholic missions in the Levant is shared between two courts, and one of them is ours. Our merchant houses there trade under our own flag at last, and trade with the Porte, the Ottoman government, costs us less."
 ITA_k_the_chairs_of_the_state: "The University Chairs"
 ITA_k_the_chairs_of_the_state_desc: "The state has kept its university chairs, and told the Vatican that a professor answers to the ministry that pays him. The faculties are noisier than they were, and the work coming out of them is better."
 ITA_k_the_conciliation: "The Conciliation"
 ITA_k_the_conciliation_desc: "The quarrel between the kingdom and the Pope has been signed away, and he is a sovereign again on a few hectares of garden. Half the country no longer has to choose between its parish and its passport, and the ministry governs with less noise."
 ITA_k_the_catholic_kingdom: "The Catholic Kingdom"
 ITA_k_the_catholic_kingdom_desc: "The Church and the Crown stand together, and the Catholic electoral union delivers the votes it promised. The barracks fill without an argument, and the parish priests count the ballots."
 ITA_k_the_christian_democrats: "The Christian Democrats"
 ITA_k_the_christian_democrats_desc: "A Catholic party that answers to its voters before its bishops now sits in the Chamber under its own name. The country is steadier for it, and the ministry is watched from one more quarter."
 ITA_k_the_concordat: "The Concordat"
 ITA_k_the_concordat_desc: "Marriage, the schools and the seminaries are settled in one document, signed by the King and by the Pope. What used to be fought out in the newspapers is now argued between lawyers, and the country is calmer."
 ITA_v_the_madrid_convention: "The Madrid Convention"
 ITA_v_the_madrid_convention_desc: "The young King of Spain came to Rome, and a commercial treaty was signed while he was here. The Vatican was displeased. Our merchants were not, and trade with Spain costs us less."
 ITA_v_the_crown_and_the_altar: "The Crown and the Altar"
 ITA_v_the_crown_and_the_altar_desc: "The King has agreed to let the ministry speak for him. The palace and the government now say the same thing to the Vatican, and a government that speaks with one voice is obeyed faster."
 ITA_v_the_missions: "The Italian Missions Protected"
 ITA_v_the_missions_desc: "The Porte, the Ottoman government, has recognised that Italian monks and nuns in the Levant are protected by Italy and by nobody else. It is a small paper, and every foreign ministry in Europe has read it."
 ITA_v_the_curia_is_cold: "The Vatican Says No"
 ITA_v_the_curia_is_cold_desc: "We made the offer, and the answer was that the Pope remains a prisoner in his own palace. Nothing can be asked of the Vatican now, and the Catholic deputies will vote against us as a matter of course."
 ITA_v_the_prisoner_remains: "The Pope Stays a Prisoner"
 ITA_v_the_prisoner_remains_desc: "The settlement was within a day of signature when the Pope's own secretary of state stopped it. The country had been promised an end to the quarrel, and has been handed the quarrel back."
 ITA_e_the_bank_of_italy: "The Bank of Italy"
 ITA_e_the_bank_of_italy_desc: "There is one bank of issue now, one discount rate, and a director general the other houses obey. Credit reaches the yards and the building sites at a price they can pay, and work goes up faster."
 ITA_n_the_coal_of_cardiff: "The Coal of Cardiff"
 ITA_n_the_coal_of_cardiff_desc: "Our bunkers are filled under a long contract with the Welsh pits, and our colliers sail in convoy behind our own escorts. We have no coal of our own, and we have at least made the carriage of it safe."
 MNT_the_coast_policed: "The Coast Is Policed"
 MNT_the_coast_policed_desc: "Foreign gunboats keep order in our roadsteads, and foreign engineers survey our harbours. Nothing is built along this shore that the visitors have not approved, and no merchant treats us as a country that owns its own coast."
 ITA_giuseppe_saracco: "Giuseppe Saracco"
 ITA_giuseppe_saracco_desc: "The caretaker, an old senator taken out of the drawer whenever nobody else will serve. He will hold the seals for as long as the Chamber needs to decide what it wants."
 ITA_alessandro_fortis: "Alessandro Fortis"
 ITA_alessandro_fortis_desc: "A stand-in from the Romagna who was a republican before he was a minister, and still argues like one. He will keep the chair warm, and buy the railways for the state while he sits in it."
 ITA_ettore_sacchi: "Ettore Sacchi"
 ITA_ettore_sacchi_desc: "The radical, and a careful lawyer with it. He wants the vote widened, the clergy out of the schools and the Chamber sitting more often. He will vote with anybody who gives him one of the three."
 ITA_filippo_turati: "Filippo Turati"
 ITA_filippo_turati_desc: "The reformist socialist who edits the review the whole Left reads. He will not take office without the party's leave. Offer him labour laws and the leagues come in behind him."
 ITA_leonida_bissolati: "Leonida Bissolati"
 ITA_leonida_bissolati_desc: "He edits the party paper and holds that a socialist may serve the state without ceasing to be one. His motion has split the party congress twice."
 ITA_rinaldo_rigola: "Rinaldo Rigola"
 ITA_rinaldo_rigola_desc: "Secretary of the trade union confederation. He counts subscriptions rather than speeches, and calls the general strike a weapon that rusts. What he signs, the chambers of labour keep."
 ITA_arturo_labriola: "Arturo Labriola"
 ITA_arturo_labriola_desc: "The revolutionary syndicalist of Naples. He despises the ballot and believes in the strike that does not stop, and he is heard further in the south than any deputy."
 ITA_napoleone_colajanni: "Napoleone Colajanni"
 ITA_napoleone_colajanni_desc: "The oldest republican in the Chamber, a Sicilian who has spent his career proving with figures that the South is robbed. He is the only republican the moderates will listen to."
 ITA_ernesto_nathan: "Ernesto Nathan"
 ITA_ernesto_nathan_desc: "Mayor of Rome and Grand Master of the masonic lodges. He lights the streets, builds the schools, and says at every anniversary of the breach at Porta Pia exactly what the Vatican dreads. The city has never been better run, and never worse liked across the river."
 ITA_filippo_meda: "Filippo Meda"
 ITA_filippo_meda_desc: "The Catholic deputy, elected where no Catholic was supposed to stand. He reads the Pope's ban on Catholic voting loosely, and votes for order. He is the proof that the pews can be counted."
 ITA_ottorino_gentiloni: "Ottorino Gentiloni"
 ITA_ottorino_gentiloni_desc: "He keeps the lists of the Catholic electoral union, and knows which candidate signed which undertaking. Nothing is written down that a bishop would ever have to disown."
 ITA_giuseppe_toniolo: "Giuseppe Toniolo"
 ITA_giuseppe_toniolo_desc: "A Catholic professor who teaches that a wage is a moral question before it is an economic one. The white leagues, the Catholic unions, quote him at their meetings."
 ITA_romolo_murri: "Romolo Murri"
 ITA_romolo_murri_desc: "A priest under suspension who wants a Catholic party answerable to its voters rather than to its bishops. The Vatican has already told him twice to be quiet."
 ITA_ernesto_pacelli: "Ernesto Pacelli"
 ITA_ernesto_pacelli_desc: "The Pope's banker. He lends where the Vatican wishes to be seen, and then asks the foreign ministry for an escort. His branch reaches Tripoli before our consul does."
 ITA_bonaldo_stringher: "Bonaldo Stringher"
 ITA_bonaldo_stringher_desc: "Director general of the Bank of Italy. He held the lira steady through a panic that broke better houses than ours, and ministers call on him rather than the other way about."
 ITA_giulio_prinetti: "Giulio Prinetti"
 ITA_giulio_prinetti_desc: "A bicycle manufacturer running the foreign ministry, blunt with ambassadors and quick with a decree. He exchanged the letters with Paris that no ally has yet been shown."
 ITA_emilio_visconti_venosta: "Emilio Visconti Venosta"
 ITA_emilio_visconti_venosta_desc: "The old hand of the foreign ministry, brought back whenever a conference must be attended and nothing conceded. He has outlived the men who taught him the trade."
 ITA_antonino_di_san_giuliano: "Antonino di San Giuliano"
 ITA_antonino_di_san_giuliano_desc: "A Sicilian marquis who has read every treaty and believes none of them. He asks for the eastern shore in a tone that suggests he is doing everyone a favour."
 ITA_luigi_federzoni: "Luigi Federzoni"
 ITA_luigi_federzoni_desc: "The journalist who gave the nationalists their newspaper, and the newspaper its readers. He wants our emigrants to leave as soldiers rather than as passengers."
 ITA_gabriele_dannunzio: "Gabriele D'Annunzio"
 ITA_gabriele_dannunzio_desc: "The poet who can fill a theatre and a recruiting office in the same week. His play about the sea sells the Adriatic to people who have never seen it, and his debts are as famous as his verse."
 ITA_cesare_battisti: "Cesare Battisti"
 ITA_cesare_battisti_desc: "The socialist of Trento. He edits an Italian paper under an Austrian censor and keeps a map of the valleys on his wall. He is a subject of the Emperor and the guest of every Italian university."
 ITA_alceste_de_ambris: "Alceste De Ambris"
 ITA_alceste_de_ambris_desc: "The syndicalist of Parma. He took a whole province out on strike and fed it from soup kitchens, and the prefect sent cavalry and made him a legend."
 ITA_ferdinando_martini: "Ferdinando Martini"
 ITA_ferdinando_martini_desc: "A man of letters who governed Eritrea with a budget, a school and no punitive columns. He is the answer to everyone who says Africa can only be held with the sword."
 ITA_ernesto_teodoro_moneta: "Ernesto Teodoro Moneta"
 ITA_ernesto_teodoro_moneta_desc: "A Garibaldian who has spent his old age arguing that wars are settled more cheaply at a table. The peace prize he was given abroad is quoted against him at home."
 ITA_salvatore_barzilai: "Salvatore Barzilai"
 ITA_salvatore_barzilai_desc: "A republican deputy born an Austrian subject in Trieste. He speaks for the irredenta, the Italian lands under Austria, in a Chamber that is not supposed to mention them. He votes against the ministry and for the fleet."
 ITA_luigi_albertini: "Luigi Albertini"
 ITA_luigi_albertini_desc: "He edits the largest daily paper in Milan. Ministers read him before they read their prefects, and he has turned the paper into an opposition of its own."
 ITA_tancredi_saletta: "Tancredi Saletta"
 ITA_tancredi_saletta_desc: "The chief of the general staff. He plans the defence of the Alpine passes and will plan nothing else. He tells the ministry the army is not ready for anything more, and he is right."
 ITA_ettore_pedotti: "Ettore Pedotti"
 ITA_ettore_pedotti_desc: "A minister of war who counts blankets, boots and horses, and leaves the speeches to other men. The depots have been in order since he took them over."
 ITA_carlo_mirabello: "Carlo Mirabello"
 ITA_carlo_mirabello_desc: "A navy minister who believes in the line of battle and has laid down the hulls to prove it. He would rather have a few big ships than a crowd of coastal ones."
 ITA_giovanni_bettolo: "Giovanni Bettolo"
 ITA_giovanni_bettolo_desc: "A sailor turned minister. His name is tied to the steel works and to the contracts that came with them, so the fleet trusts him and the Chamber does not."
 ITA_enrico_corradini_desc: "Enrico Corradini leads the nationalist association. He tells the country it is a proletarian nation, poor among rich ones, and that every man who emigrates is a defeat. He wants those men to sail for a colony of our own instead."
 ITA_giulio_douhet_theorist: "Giulio Douhet"
 ITA_giulio_douhet_theorist_desc: "An artillery officer who believes the next war will be decided in the air, and he writes about nothing else. The staff calls him a nuisance and reads every page he sends."
 ITA_maurizio_moris_air_chief: "Maurizio Moris"
 ITA_maurizio_moris_air_chief_desc: "The engineer officer who built the first hangar on the field outside Rome and put the army into the air. Every Italian pilot so far has been trained in a school he founded."
 ITA_g_tt_the_chamber_may_be_dissolved: "The next dissolution of the Chamber will cost the ministry nothing."
 ITA_g_tt_nathan_is_available: "Ernesto Nathan, the mayor of Rome, may serve the ministry as an adviser if his council agrees."
 ITA_g_tt_the_remittance_office_is_cheap: "The Remittance Office will open for half of what it would have cost."
 ITA_g_tt_the_boards_sit_free: "The Boards of Conciliation will sit once without charge."
 ITA_g_tt_the_passage_is_watched: "Our consuls inspect the plantations, and the emigrants are paid their wages in coin."
 ITA_g_tt_the_wine_duties_fall: "The duties on wine fall on both sides of the mountains."
 ITA_g_tt_the_vatican_protests: "The Vatican protests that a foreign sovereign was received at the Quirinal, which was once the Popes' palace."
 ITA_v_tt_the_file_comes_round: "The file stays with the Porte, and our consulates are told to ask again next season."
 ITA_g_tt_the_protest_is_private: "The protest goes in a letter nobody outside the Vatican will read, and our private channel stays open."
 ITA_g_tt_the_visit_is_postponed: "The visit is postponed and the convention lapses."
 ITA_g_tt_the_corn_duty_is_kept: "The duty on foreign corn is kept."
 ITA_g_tt_the_island_is_ungoverned: "The province is out of the prefect's hands for a year."
 ITA_g_tt_the_catholic_vote_returns: "Where the parish clergy work for us, the returns come back to the ministry."
 ITA_g_tt_the_railway_law_passes: "The railway law is voted, and the lines pass to the State."
 ITA_g_the_strike_threat: "Italy on general strike"
 ita_dnc.1713.t: "Rome Proposes the Police Protocol"
 ita_dnc.1713.d: "The Italian ambassador proposes that our police and theirs exchange lists of anarchists. Each side would send photographs and sailing dates, and expel the men the other names. The draft is our own, and the western courts would not sign it.\n\nRome offers to sign it first. We can put our name to it now, or ask Berlin to sign before we answer."
 ita_dnc.1713.a: "Sign with Rome."
 ita_dnc.1713.b: "Ask Berlin to sign before we do."
 ita_dnc.1796.t: "The Protocol Needs Berlin"
 ita_dnc.1796.d: "Petersburg will not sign a police convention with Rome unless we sign it as well. Their ambassador has said so plainly. The draft binds every signatory to expel the men the others name.\n\nWe can put our name to it and let the eastern courts have their convention. Or we can leave the two of them to settle it."
 ita_dnc.1796.a: "Sign the protocol as well."
 ita_dnc.1796.b: "Let them settle it between themselves."
 ITA_s_tt_the_capital_answers: "§YThe capital we ask will answer, and its answer decides what happens next.§!"
 ITA_s_tt_the_crown: "The King's hold on his ministers: §Y[?ITA_crown|0]§!"
 ITA_s_tt_the_programme_waits: "The programme waits for a new reign. Nothing more of it can be taken until the Crown stands behind it."
 ITA_s_tt_the_cassation_must_answer_first: "Nothing else passes this Chamber until the Court of Cassation has been asked again."
 ITA_s_tt_berlin_reads_the_conflict: "Berlin has read our quarrel over the constitution and finds a parallel with its own."
 ITA_s_tt_berlin_says_nothing: "Berlin sends us no answer at all, neither support nor warning."
 ITA_s_tt_petersburg_wants_berlin_first: "Petersburg will not sign the protocol until Berlin has signed it first."
 ITA_s_tt_the_colony_is_watched: "The Italian communities abroad are watched, and their clubs are reported on."
 ITA_s_tt_the_federal_law_does_not_allow_it: "We are told that federal law does not allow it, and the matter ends there."
 ITA_s_tt_berlin_declines_the_protocol: "Berlin declines the protocol, and Petersburg will not move without it."
 ITA_s_tt_the_arma_is_doubled: "The Carabinieri are doubled, and they police the squares in place of the garrisons."
 ITA_s_tt_the_questore_is_free: "Replacing a police chief costs the ministry nothing once the guards hold the streets."
 ITA_s_tt_one_session_only: "The Chamber is sent home for one session only, and we shall have to face it again."
 ITA_s_tt_the_powers_say_nothing: "None of the powers answers us, and their newspapers do the talking instead."
 ITA_s_tt_the_lists_are_made: "The new voters' lists are drawn in every province and will be read at the next returns."
 ITA_s_meda_in_the_ministry: "The Catholic Deputy in the Ministry"
 ITA_s_meda_in_the_ministry_desc: "The Electoral Union has named him, and the bishops have not disowned him. That is his whole qualification, and it puts a Catholic deputy in the ministry for the first time."
 ITA_s_tt_the_ban_is_not_lifted: "The Pope's ban on Catholics voting stands, and their vote stays where it was."
 ITA_s_tt_the_offer_is_refused: "The offer of the quarter across the Tiber is refused, and the Roman Question closes again."
 ITA_s_tt_the_plans_are_reviewed: "The other general staff takes its plans against us out and reads them again."
 ITA_s_tt_berlin_stays_at_home: "Berlin stays at home and sends a telegram."
 ITA_s_threat_torniamo_allo_statuto: "Torniamo allo Statuto"
 ITA_s_threat_the_chamber_is_sent_home: "The Chamber Is Sent Home"
 ITA_s_salandra_keeper_of_the_seals: "Keeper of the Seals"
 ITA_s_salandra_keeper_of_the_seals_desc: "Antonio Salandra keeps the seals, which makes him our Minister of Justice. The bill that reads the constitution the Crown's way was drafted in his room, and the judges will hear from him first."
 ITA_s_pelloux_at_the_interior: "The General at the Interior"
 ITA_s_pelloux_at_the_interior_desc: "Luigi Pelloux is a general at the Interior, the ministry that runs the prefects and the police. He has commanded an army corps, and he runs the ministry the same way."
 ITA_r_tt_the_capital_answers: "§YThe capital we ask will answer, and its answer decides what happens next.§!"
 ITA_r_tt_the_price_of_entry: "The Bloc costs us the patience of the street, the obedience of the prefects, the confidence of the Court and the goodwill of the Vatican."
 ITA_r_tt_turati_takes_the_portfolio: "Turati takes the Ministry of Labour, and the Interior is bound to keep the troops out of the squares."
 ITA_r_tt_bissolati_takes_the_portfolio: "Bissolati takes the Ministry of Labour instead, and he brings no party with him."
 ITA_r_tt_the_register_is_read_for_us: "The register is widened now, and the new constituencies answer for the Bloc at the next returns."
 ITA_r_tt_rigola_takes_the_chair: "Rinaldo Rigola, secretary of the Confederation of Labour, is available to the ministry as an adviser."
 ITA_r_tt_no_answer_comes: "There is no government in that capital to answer us, and the question falls."
 ITA_r_tt_the_convention_is_offered: "The invitation and the draft convention go out together, and we wait on the answer from across the Alps."
 ITA_r_tt_luzzatti_is_called: "Luigi Luzzatti is called in for the insurance bill, and is available to the ministry as an adviser."
 ITA_r_tt_the_mission_comes_home: "The mission comes home with notes, courtesies and no signature."
 ITA_r_tt_the_visit_is_adjourned: "The visit is put off, and no new season is named for it."
 ITA_r_tt_the_militia_or_the_staff: "The general staff answers the bill. Its answer decides whether we get the militia, or a new chief of staff."
 ITA_r_tt_cadorna_takes_the_staff: "Luigi Cadorna takes the general staff and is available to the ministry as an adviser."
 ITA_r_tt_the_appeal_to_the_king: "The Vatican takes the quarrel over our heads to the King. He will remember it when the bills of the Bloc reach him."
 ITA_r_tt_the_bank_asks_the_consulta: "The bank takes its case to the Consulta, our foreign ministry, and sending the Banco di Roma instead becomes the likelier answer at Tripoli."
 ITA_r_threat_vienna_answers: "Vienna answers the shortened service"
 ita_dnc.1604.t: "The Italian Faculty at Trieste"
 ita_dnc.1604.d: "The Italian ambassador asks for the law faculty we promised our Italian subjects. He wants it opened at Trieste, where they live, and not in a German-speaking town where the police can watch them.\n\nThe governor of the Littoral calls a faculty at Trieste an Italian claim with a lecture hall. The Hungarians do not care, and the Emperor wants the noise to stop. We can grant it, refuse it, or offer the faculty here in Vienna."
 ita_dnc.1604.a: "Give them the faculty at Trieste."
 ita_dnc.1604.b: "Refuse. They can take the faculty at Innsbruck or take nothing."
 ita_dnc.1604.c: "Offer the faculty here, under our own eye."
 ita_dnc.1605.t: "The Lega Nazionale Schools"
 ita_dnc.1605.d: "The Italian consulates at Trieste, Zara and Spalato pay the schoolmasters of the Lega Nazionale, the Italian schools society in our lands. Rome asks that we go on tolerating it, as we have for a generation.\n\nThe police at Zara would rather expel the consul and shut the schools. Our own ministry would rather sell the toleration than give it away."
 ita_dnc.1605.a: "Tolerate the consuls and their schools."
 ita_dnc.1605.b: "Expel the consul at Zara and close the schools."
 ita_dnc.1605.c: "Tolerate them, if the Lega Nazionale is dissolved."
 ita_dnc.1606.t: "The Riot at Innsbruck"
 ita_dnc.1606.d: "Vienna refused the faculty, and our students went to Innsbruck to hear the lecture anyway. The town rose against them. The Austrian police arrested our lecturers along with the rioters.\n\nBy morning every paper in Italy has the story and the names of the arrested men. The squares are filling."
 ita_dnc.1606.a: "Let the squares have their night."
 ita_dnc.1609.t: "Vienna's Price for the Consuls"
 ita_dnc.1609.d: "Vienna will leave our consuls at Zara and Spalato alone on one condition. We must dissolve the Lega Nazionale, the Italian schools society in Austria, by our own hand.\n\nThe Lega is a few schoolmasters and a subscription list. It is also the last Italian institution in Dalmatia. We can sign the dissolution, or refuse and let Vienna act."
 ita_dnc.1609.a: "Dissolve the Lega. The consuls are worth more."
 ita_dnc.1609.b: "Refuse. Let Vienna close the schools itself."
 ita_dnc.1614.t: "The Faculty Offered at Vienna"
 ita_dnc.1614.d: "Vienna offers the law faculty in Vienna itself, under the eye of its own police. The word Trieste appears nowhere in the decree.\n\nOur students would get their degrees. The committees at home would rather have the grievance, and they will say so loudly. We can take the offer, or refuse it."
 ita_dnc.1614.a: "Take the faculty where it is offered."
 ita_dnc.1614.b: "Refuse. It is Trieste or nothing."
 ita_dnc.1623.t: "Rome Will Not Close the Lega"
 ita_dnc.1623.d: "Rome has refused to dissolve the Lega Nazionale, the Italian schools society in our lands. The consul at Zara is to go on paying its schoolmasters as before.\n\nThe police have the expulsion order drawn up. The governor of the Littoral would like it signed today."
 ita_dnc.1623.a: "Expel the consul and close the schools."
 ITA_z_tt_belgrade_signs_first: "The motion waits until the Serbs have signed the convention."
 ITA_z_threat_the_proletarian_nation: "The Proletarian Nation"
 ITA_z_threat_antivari: "The Italian Station at Antivari"
 ITA_z_threat_the_line: "The Danube-Adriatic Railway"
 ITA_z_threat_the_convention: "The Convention with Belgrade"
 ITA_v_tt_the_capital_answers: "§YThe capital we ask will answer, and its answer decides what happens next.§!"
 ITA_v_tt_the_channel_survives: "§YThe private channel to the Vatican Secretariat is not broken.§!"
 ITA_v_tt_the_powers_consent: "§YOne more of the powers has let us pass.§!"
 ITA_v_tt_the_old_protector_is_confirmed: "§YThe older protector keeps charge of the missions, and we get nothing.§!"
 ITA_v_tt_the_quirinal_looks_for_the_channel: "§YThe ministry will look for the channel to the Vatican without the archbishop.§!"
 ITA_v_threat_the_bank: "The Bank of the Pope in Tripoli"
 ITA_v_tt_the_estimates_carry_the_schools: "The schools of the Levant are paid for out of our own estimates, and the Vatican is told who pays the schoolmasters."
 ITA_v_tt_the_consulates_drop_the_charge: "Our consulates drop the case. The Italian schoolmasters are left to the older protector, and the papers at home will say what they like."
 ITADNC_n_the_naval_flying_service: "The Naval Flying Service"
 ITADNC_n_the_naval_flying_service_desc: "One of our officers has flown a machine off the lagoon at Venice, and the fleet has no use for him yet. We shall give the navy its own flying station and let him teach there."
 ITA_arm_spingardi_holds_the_order: "Spingardi Holds the Order"
 ITA_arm_spingardi_holds_the_order_desc: "Spingardi, the Minister of War, signs the operations order, and the staff writes only what the ministry has agreed to pay for."
 ITA_e_tt_stringher_at_the_bank: "Bonaldo Stringher, director general of the Bank of Italy, is available to the ministry as an adviser."
 ITA_arm_tt_pollio_holds_the_staff: "Pollio is confirmed at the head of the staff."
 ITA_arm_tt_spingardi_takes_the_ministry: "Spingardi takes the War Ministry, and the estimates with it."
 ITA_arm_tt_cadorna_holds_the_staff: "Cadorna is called to the head of the staff."
 ITA_n_tt_cuniberti_takes_the_table: "Vittorio Cuniberti takes the naval drawing office and is available to the navy as a theorist."
 ITA_n_tt_the_flotilla_is_laid_down: "A flotilla of torpedo craft is laid down for the fleet."
 ITA_n_tt_the_two_boats_are_launched: "The first boats of the class are launched and taken into the fleet."
 ITA_n_tt_laurenti_takes_the_drawings: "Cesare Laurenti takes the submarine drawings and is available to the navy as a theorist."
 ITA_n_tt_calderara_takes_the_seaplanes: "Mario Calderara takes charge of the naval flying station and is available to the navy as a theorist."
 ITA_air_tt_douhet_takes_a_chair: "Giulio Douhet's memoranda are read at the ministry, and he is available as a theorist of the air."
 ITA_air_tt_moris_takes_the_directorate: "Maurizio Moris takes the directorate of the air service and is available as an air chief."
