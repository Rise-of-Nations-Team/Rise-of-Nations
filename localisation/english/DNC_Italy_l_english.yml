 ITA_party_governo_del_re_long: "The Government of the King"
 ITA_party_destra_storica: "Destra Storica"
 ITA_party_destra_storica_long: "The Historical Right"
 ITA_party_unione_liberale: "Unione Liberale"
 ITA_party_unione_liberale_long: "The Liberal Union"
