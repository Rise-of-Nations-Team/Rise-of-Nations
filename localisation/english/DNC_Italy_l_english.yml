 ITA_party_destra_costituzionale_long: "The Constitutional Right"
 ITA_party_partito_socialista: "Partito Socialista"
 ITA_party_partito_socialista_long: "The Italian Socialist Party"
 ITA_party_comando_supremo: "Comando Supremo"
 ITA_party_comando_supremo_long: "The Supreme Command"
 ITA_the_presidency: "The Presidency"
 ITA_the_presidency_desc: "He is president of the council because he can count the Chamber, and he holds the office for exactly as long as that stays true. The King signs; the majority governs."
 ITA_the_presidency_conciliator: "The Presidency: Conciliation"
 ITA_the_presidency_conciliator_desc: "He answers a strike by letting it run itself out and a deputation by hearing it. The country is quieter for it, and the Left comes a little closer to the government every year."
 ITA_the_presidency_prefects: "The Presidency: The Prefects"
 ITA_the_presidency_prefects_desc: "He governs through the prefects, and the prefects govern through the police. Order is cheap and confidence is dear, and the country is learning to look to the state rather than the Chamber."
 ITA_the_presidency_prerogative: "The Presidency and the Prerogative"
 ITA_the_presidency_prerogative_desc: "The Crown has taken back the naming of ministers, and the president of the council now speaks with the King behind him instead of the Chamber. The parties settle down because there is nothing left to bargain over."
 ITA_the_presidency_prerogative_conciliator: "The Prerogative: Conciliation"
 ITA_the_presidency_prerogative_conciliator_desc: "A government the King names and a hand the country does not feel. It is the strongest ministry Italy has had, and the least often obliged to prove it."
 ITA_the_presidency_prerogative_prefects: "The Prerogative: The Prefects"
 ITA_the_presidency_prerogative_prefects_desc: "The King names the ministry and the ministry names the prefects, and between them there is no room for a motion of confidence. What the country loses in ease it returns in obedience."
 ITA_l_loyalty_of_the_army: "Loyalty of the Army"
 ITA_l_loyalty_of_the_army_desc: "The fleet was reviewed and the regiments cheered the man who reviewed them, not the ministry that paid for it. The army has decided whose it is."
 ITA_l_supreme_command: "Supreme Command"
 ITA_l_supreme_command_desc: "The King is first soldier in fact as well as in the Statuto, and the staff takes its orders where the constitution says they come from. Garrison and province alike are quieter for knowing it."
 ITA_l_the_arbiter: "The Arbiter of the Nation"
 ITA_l_the_arbiter_desc: "He stands above the parties because the army, the provinces and the new possessions all answer to him and to nobody in between. Italy has one arbiter, and every quarrel ends at his door."
 ITA_h_the_confidence_of_the_crown: "The Confidence of the Crown"
 ITA_h_the_confidence_of_the_crown_desc: "The same ministry has sat through the whole reign and finished what it began, which no Italian government has managed before. The Crown has stopped looking for a replacement, and the offices have stopped waiting for one."
 ITA_h_nitti_president: "Nitti at the Council"
 ITA_h_nitti_president_desc: "The economist who counted what the South was owed has the council instead of a portfolio, and he has brought the whole programme of works up with him. Everything is a construction site and everything is late."
 ITA_h_stringher_president: "Stringher at the Council"
 ITA_h_stringher_president_desc: "The man who held the lira through the panic now holds the government, and he treats the budget of the state as he treated the reserve of the bank. Nothing is spent that has not been provided for."
 ITA_h_luzzatti_president: "Luzzatti at the Council"
 ITA_h_luzzatti_president_desc: "The treasury man has the council, and he has kept the treasury too. He knows what the country produces better than the men who produce it, and he means to have it counted."
 ITA_h_giolitti_president_files: "Giolitti at the Council: The Files"
 ITA_h_giolitti_president_files_desc: "He came to the council from the interior and brought the cabinets with him. He knows who is paid by whom, at home and abroad, and foreign money finds the ground very hard."
 ITA_h_giolitti_president_guards: "Giolitti at the Council: The Guards"
 ITA_h_giolitti_president_guards_desc: "He came to the council from the interior and brought the public security guards with him. Where the flag flies over unwilling ground, the garrison sleeps better than it used to."
 ITA_h_orlando_president: "Orlando at the Council"
 ITA_h_orlando_president_desc: "The professor of public law has the council, and the schools he built are turning out a generation that believes in the state. It is a patriotic country now, and a wary one."
 ITA_h_sacchi_president: "Sacchi at the Council"
 ITA_h_sacchi_president_desc: "The radical is in office, and the Extreme is in the majority for the first time since the Risorgimento. Everyone who thinks as we do abroad has noticed."
 ITA_h_salandra_president: "Salandra at the Council"
 ITA_h_salandra_president_desc: "The Right has the council and the whole conservative bench has come with it. Able men are suddenly willing to serve, and they no longer ask what it will cost us to have them."
 ITA_anna_kuliscioff: "Anna Kuliscioff"
 ITA_anna_kuliscioff_desc: "The doctor of the poor quarters who will not let the party forget the women in the factories. Give her the law on the hours of women and children and she will bring the leagues in behind it."
 ITA_nullo_baldini: "Nullo Baldini"
 ITA_nullo_baldini_desc: "He put the day labourers of the Romagna into a cooperative and made it pay, then did it again across the plain. Hand him the leases and the drainage and he will find the men to work them."
 ITA_giuseppe_ottolenghi: "Giuseppe Ottolenghi"
 ITA_giuseppe_ottolenghi_desc: "The first Jew to sit as minister of war, and the man who made the army manoeuvre against itself instead of parading. He teaches by letting the staff lose."
 ITA_dnc_the_prefects: "The Machine of the Prefects"
 ITA_dnc_the_prefects_desc: "The prefect is the Kingdom in the province, and he answers to the Minister of the Interior and to nobody else. What the ministry asks of him here is paid for in political capital, and it is read in the square the same week."
 ITA_dnc_the_chamber: "The Majority in the Chamber"
 ITA_dnc_the_chamber_desc: "A majority in Montecitorio is not won once, it is kept every month. These are the instruments by which a ministry keeps it, and each of them leaves a debt behind."
 ITA_dnc_the_crown: "The Favour of the Crown"
 ITA_dnc_the_crown_desc: "The King reigns, and the Statuto lets him govern whenever a ministry lets him. Every courtesy we pay the Quirinal raises him a little, and every answer we refuse him lowers him."
 ITA_dnc_messina: "The Relief of Messina"
 ITA_dnc_messina_desc: "The city on the Straits is rubble and the fleet is landing sailors into it. What the Kingdom does in these weeks will be remembered longer than the estimates of a whole session."
 ITA_h_colonial_levies: "The Colonial Levies"
 ITA_h_colonial_levies_desc: "The Colonial Office holds that it alone may raise native troops. The Ministry of War will not tolerate a second army outside its command. Pushing either too far may have grave consequences."
 ITA_h_governorate_eritrea: "The Governorate of Eritrea"
 ITA_h_governorate_eritrea_desc: "The oldest of our possessions has a civil governor, a budget and a set of accounts of its own. What the residency decides here is entered in the ledger the Colonial Office keeps for the whole empire."
 ITA_h_governorate_somalia: "The Governorate of Somalia"
 ITA_h_governorate_somalia_desc: "The southern coast is administered from a handful of ports and a great deal of paper. What the residency decides here is entered in the ledger the Colonial Office keeps for the whole empire."
 ITA_h_governorate_benadir: "The Governorate of the Benadir"
 ITA_h_governorate_benadir_desc: "The company is bought out and the coast is now governed by the Kingdom rather than by a charter. What the residency decides here is entered in the ledger the Colonial Office keeps for the whole empire."
 ITA_h_governorate_tripolitania: "The Governorate of Tripolitania"
 ITA_h_governorate_tripolitania_desc: "The regency is administered from the coast, and the interior is administered by agreement. What the residency decides here is entered in the ledger the Colonial Office keeps for the whole empire."
 ITA_h_governorate_aegean: "The Governorate of the Aegean"
 ITA_h_governorate_aegean_desc: "The islands are held as a pledge and governed as a province, which is a contradiction nobody in the Consulta wishes to resolve. What the residency decides here is entered in the ledger the Colonial Office keeps for the whole empire."
 ITA_h_governorate_east_africa: "The Governorate of East Africa"
 ITA_h_governorate_east_africa_desc: "The sphere agreed at the conference table has to be turned into an administration on the ground. What the residency decides here is entered in the ledger the Colonial Office keeps for the whole empire."
 ITA_h_the_majority_cat: "The Work of the Majority"
 ITA_h_the_majority_cat_desc: "A majority that does no work is a majority that is counted once and then lost. Commissions, estimates and laws of expenditure are how a ministry earns the votes it already has."
 ITA_h_commercial_treaties_cat: "The Commercial Treaties"
 ITA_h_commercial_treaties_cat_desc: "The tariff wall was raised in anger and has been paid for ever since by everyone who ships or eats. The treasury has two instruments here and no more."
 ITA_h_influence_countries_cat: "The Consulates Abroad"
 ITA_h_influence_countries_cat_desc: "A consulate is a listening post, a school fund and a chamber of commerce under one roof. Where we open one and keep it open, the government of that country learns to expect us."
 ITA_h_emigrant_trade_cat: "The Trade of the Emigration"
 ITA_h_emigrant_trade_cat_desc: "The men who left are a market, a remittance and a claim on us all at once. The consulates can turn that traffic into freight and into money that comes home."
 ITA_l_governorate_tripolitania: "The Residency of Tripolitania"
 ITA_l_governorate_tripolitania_desc: "A governorship is a house, a road and a register, in that order. Until all three exist the province is occupied and not governed."
 ITA_l_governorate_cyrenaica: "The Residency of Cyrenaica"
 ITA_l_governorate_cyrenaica_desc: "The eastern province is a coast, an escarpment and an interior that has never been administered from the sea. Until the residency stands there we hold ports and nothing else."
 ITA_l_governorate_the_horn: "The Residency of the Horn"
 ITA_l_governorate_the_horn_desc: "Two colonies on two seas have been run as two separate accidents. A single residency will make them one command."
 ITA_l_governorate_the_islands: "The Residency of the Islands"
 ITA_l_governorate_the_islands_desc: "The islands need a governor, an anchorage and a census before they need anything else. The fleet wants the second of those far more than the Consulta wants the first."
 ITA_l_the_plate: "The Italians of the Plate"
 ITA_l_the_plate_desc: "More of our people live between the two rivers than in any province of the Kingdom, and they are not our subjects there. Every instrument below turns that colony into weight, and Washington is watching us use it."
 ITA_pd_the_prefect_is_summoned: "The Prefect Is Summoned"
 ITA_pd_the_prefect_is_summoned_desc: "A province has slipped out of the hand that is supposed to hold it, and the man responsible will explain himself in Rome. He will go back with the ministry behind him and with less room than he had."
 ITA_pd_the_prefect_is_summoned_tt: "The square is quieter by 4, and the machine of the prefects gains 3"
 ITA_pd_the_carabinieri_are_moved: "The Carabinieri Are Moved"
 ITA_pd_the_carabinieri_are_moved_desc: "Squadrons are drawn from the quiet provinces and put where the meetings are being held. We shall have order in that district, and we shall have it there permanently."
 ITA_pd_the_carabinieri_are_moved_tt: "The square falls by 7, and its floor rises by 3: this quiet is bought and will not be given back"
 ITA_pd_the_subsidy_to_the_province: "The Subsidy to the Province"
 ITA_pd_the_subsidy_to_the_province_desc: "A bridge, a water main and a normal school are cheaper than a battalion and last longer. The deputy of the district will vote with us for a session on the strength of it."
 ITA_pd_the_subsidy_to_the_province_tt: "The square falls by 3 and the majority gains 2"
 ITA_pd_the_lists_are_revised: "The Lists Are Revised"
 ITA_pd_the_lists_are_revised_desc: "The electoral registers are gone through office by office, and the ministry decides which names survive the reading. It is a lawful operation and everyone knows what it is for."
 ITA_pd_the_lists_are_revised_tt: "The machine of the prefects gains 6"
 ITA_pd_the_hand_is_lifted: "The Hand Is Lifted"
 ITA_pd_the_hand_is_lifted_desc: "The circulars are withdrawn and the prefects are told to hold the ring and nothing more. We shall find out what the country does when the state stops arranging it."
 ITA_pd_the_hand_is_lifted_tt: "The machine of the prefects loses 8 and the floor of the square falls by 3, but the square itself rises by 3"
 ITA_cd_the_committee_seats: "The Committee Seats"
 ITA_cd_the_committee_seats_desc: "The chairmanships of the standing committees are the only currency a ministry may spend without a vote. We shall distribute them among the men we need in the division lobby."
 ITA_cd_the_committee_seats_tt: "The majority gains 4"
 ITA_cd_the_pledge_is_bought: "The Pledge Is Bought"
 ITA_cd_the_pledge_is_bought_desc: "A group of deputies will come over for a canal, a decoration and a promise about the next honours list. The votes are real and the debt falls due later."
 ITA_cd_the_pledge_is_bought_tt: "The majority gains 7, of which 7 is bought and will decay, and one pledge falls due later"
 ITA_cd_the_session_is_prolonged: "The Session Is Prolonged"
 ITA_cd_the_session_is_prolonged_desc: "The Chamber will sit through the heat rather than go home with the estimates unvoted. Nobody thanks us for it and the arithmetic improves."
 ITA_cd_the_session_is_prolonged_tt: "The majority gains 3 and one month of a low Chamber is struck off the record"
 ITA_cd_the_deputy_is_answered: "The Deputy Is Answered"
 ITA_cd_the_deputy_is_answered_desc: "An interpellation is taken seriously, answered at length and settled with an undertaking. The undertaking will have to be kept."
 ITA_cd_the_deputy_is_answered_tt: "The majority gains 2 and the ministry owes one more pledge"
 ITA_cd_the_vote_of_confidence: "The Vote of Confidence"
 ITA_cd_the_vote_of_confidence_desc: "The ministry puts its life on the question and dares the Chamber to take it. A majority that is already safe is worth more once it has been counted in public."
 ITA_cd_the_vote_of_confidence_tt: "The ministry gains 60 political power and 5 percent stability"
 ITA_kd_the_audience_is_asked_for: "The Audience Is Asked For"
 ITA_kd_the_audience_is_asked_for_desc: "The President of the Council goes up to the Quirinal before the Chamber hears of it, not after. The King notices which of his ministers do that."
 ITA_kd_the_audience_is_asked_for_tt: "The Crown rises by 5"
 ITA_kd_the_civil_list_is_voted: "The Civil List Is Voted"
 ITA_kd_the_civil_list_is_voted_desc: "The household of the King is put on the estimates without an argument and without an amendment. The extreme left will divide against it and we shall let them."
 ITA_kd_the_civil_list_is_voted_tt: "The Crown rises by 6 and the majority falls by 2"
 ITA_kd_the_king_reviews_the_army: "The King Reviews the Army"
 ITA_kd_the_king_reviews_the_army_desc: "The manoeuvres end with the sovereign in the saddle in front of his corps commanders. The army remembers who its head is, and so does the ministry."
 ITA_kd_the_king_reviews_the_army_tt: "The Crown rises by 4 and the army gains 10 experience"
 ITA_kd_the_ministry_answers_the_crown: "The Ministry Answers the Crown"
 ITA_kd_the_ministry_answers_the_crown_desc: "A royal wish is declined in writing, courteously, and the Chamber is told that it was declined. The Statuto says the ministers are responsible, and we intend to be."
 ITA_kd_the_ministry_answers_the_crown_tt: "The Crown falls by 6 and the majority gains 4"
 ITA_kd_the_royal_journey: "The Royal Journey"
 ITA_kd_the_royal_journey_desc: "The King goes south with the Queen, the fleet and the newspapers, and stays longer than the programme said. Loyalty is cheaper to manufacture in the provinces than in the capital."
 ITA_kd_the_royal_journey_tt: "The Crown rises by 3 and the square falls by 3"
 ITA_mz_the_relief_columns: "The Relief Columns"
 ITA_mz_the_relief_columns_desc: "Every ship, engineer battalion and field bakery we possess goes to the Straits before the ministry decides who pays. The country will judge us on the first fortnight and on nothing else."
 ITA_mz_the_relief_columns_tt: "The square falls by 5, the Crown rises by 4, and stability rises by 3 percent"
 ITA_mz_the_quarters_are_rebuilt: "The Quarters Are Rebuilt"
 ITA_mz_the_quarters_are_rebuilt_desc: "The huts come down and a city is laid out again, lower, wider and braced against the next one. Calabria across the water gets the same road and the same money."
 ITA_mz_the_quarters_are_rebuilt_tt: "One shared building slot and one level of infrastructure in Sicily, and one level in Calabria"
 ITA_mz_the_extraordinary_credits: "The Extraordinary Credits"
 ITA_mz_the_extraordinary_credits_desc: "The Chamber is asked for a credit outside the estimates and outside the ordinary law. Nobody will vote against the Straits, and every deputy will remember that he did not."
 ITA_mz_the_extraordinary_credits_tt: "The majority gains 5 and the ministry owes 2 pledges"
 ITA_h_levy_eritrea: "The Levy of Eritrea"
 ITA_h_levy_eritrea_desc: "The oldest recruiting ground we have will give us regular battalions rather than bands. We shall enroll them, pay them from the colonial account and quarrel later about who commands them."
 ITA_h_levy_somalia: "The Levy of Somalia"
 ITA_h_levy_somalia_desc: "The southern districts can be asked for men on the same terms as the north, and they will give them. The residency will do the enrolling and will send the muster roll to Rome afterwards."
 ITA_h_levy_benadir: "The Levy of the Benadir"
 ITA_h_levy_benadir_desc: "The coast is ours outright now, and the armed police of the old company can be taken onto the establishment. The Colonial Office insists that they remain its own."
 ITA_h_levy_jubaland: "The Levy of the Jubaland"
 ITA_h_levy_jubaland_desc: "The river districts will furnish irregular bands who know the country and need no supply train. We shall arm them and give them a residency officer, and that is all."
 ITA_h_levy_tigray: "The Levy of the Tigray"
 ITA_h_levy_tigray_desc: "The highland chiefs will bring their own men if we pay the chiefs and not the men. It is the largest levy available to us and the most dangerous one to disband."
 ITA_h_levy_harar: "The Levy of Harar"
 ITA_h_levy_harar_desc: "The city and its caravan roads can raise mounted bands that are worth a brigade in that country. The Ministry of War would like them counted as cavalry, which they are not."
 ITA_h_levy_ogaden: "The Levy of the Ogaden"
 ITA_h_levy_ogaden_desc: "The clans of the interior will take our rifles and our subsidy and give us scouts. What they will not take is a garrison, and we shall not insist on one."
 ITA_h_levy_tripolitania: "The Levy of Tripolitania"
 ITA_h_levy_tripolitania_desc: "The coastal towns will enroll for pay, and the pay is cheaper than shipping conscripts across the sea. The War Office wants these battalions on its own establishment from the first day."
 ITA_h_levy_cyrenaica: "The Levy of Cyrenaica"
 ITA_h_levy_cyrenaica_desc: "The eastern province will give us men only where the brotherhood does not object. We shall recruit where we are welcome and leave the escarpment alone for now."
 ITA_h_levy_albania: "The Levy of Albania"
 ITA_h_levy_albania_desc: "The northern clans will serve under our colours for a subsidy and a promise about their own land. The Consulta considers every rifle we hand out there to be an act of foreign policy."
 ITA_h_levy_dodecanese: "The Levy of the Islands"
 ITA_h_levy_dodecanese_desc: "The islanders are seamen before they are soldiers, and the fleet wants them as such. We shall enroll a small corps and lend most of it to the naval stations."
 ITA_h_levy_raised_tt: "The levy is enrolled. Whoever did not sign the order will be angry: the counter of the War Office or the counter of the Consulta rises by 1"
 ITA_h_gov_eritrea_the_budget: "The Budget of Eritrea"
 ITA_h_gov_eritrea_the_budget_desc: "The colonial account is closed against the treasury at home and made to live on its own customs. Every year it does so is a year the Kingdom does not pay for it."
 ITA_h_gov_eritrea_the_workshops: "The Workshops of Eritrea"
 ITA_h_gov_eritrea_the_workshops_desc: "The arsenal at the port is enlarged so that a battalion can be re equipped without waiting for a ship. The road up the escarpment is widened at the same time."
 ITA_h_gov_eritrea_the_concessions: "The Concessions of Eritrea"
 ITA_h_gov_eritrea_the_concessions_desc: "The highland plateau is opened to Italian planters on long leases and short terms. What they raise there is counted at home as our own production."
 ITA_h_gov_eritrea_the_residency: "The Residency of Eritrea"
 ITA_h_gov_eritrea_the_residency_desc: "The civil governor is given a staff, a treasury and the authority to bind the chiefs. Nothing will be decided in that colony that is not decided in his office."
 ITA_h_gov_somalia_the_budget: "The Budget of Somalia"
 ITA_h_gov_somalia_the_budget_desc: "The southern account is made to balance on its own port dues and its own tribute. The treasury at home is relieved of it by the same measure."
 ITA_h_gov_somalia_the_workshops: "The Workshops of Somalia"
 ITA_h_gov_somalia_the_workshops_desc: "A repair yard and a magazine at the port will keep the garrison supplied without a convoy. The road inland is metalled as far as the wells."
 ITA_h_gov_somalia_the_concessions: "The Concessions of Somalia"
 ITA_h_gov_somalia_the_concessions_desc: "The river valleys are leased to Italian companies for cotton and for sugar. The Kingdom takes a share of the crop and counts it at home."
 ITA_h_gov_somalia_the_residency: "The Residency of Somalia"
 ITA_h_gov_somalia_the_residency_desc: "The sultans keep their titles and lose the right to treat with anybody but us. It is cheaper than a garrison and it is more permanent."
 ITA_h_gov_benadir_the_budget: "The Budget of the Benadir"
 ITA_h_gov_benadir_the_budget_desc: "The accounts of the old company are wound up and replaced by an ordinary colonial estimate. Whatever the charter used to cost us, it will not cost us again."
 ITA_h_gov_benadir_the_workshops: "The Workshops of the Benadir"
 ITA_h_gov_benadir_the_workshops_desc: "The company sheds are taken over, enlarged and put to military account. What was built for ivory will now serve the establishment."
 ITA_h_gov_benadir_the_concessions: "The Concessions of the Benadir"
 ITA_h_gov_benadir_the_concessions_desc: "The plantations along the coast are granted afresh to companies that answer to the residency. The old charter holders may bid like anyone else."
 ITA_h_gov_benadir_the_residency: "The Residency of the Benadir"
 ITA_h_gov_benadir_the_residency_desc: "A governor replaces a board of directors, and the coast is administered instead of exploited. The difference is a matter of law and of nothing else yet."
 ITA_h_gov_tripolitania_the_budget: "The Budget of Tripolitania"
 ITA_h_gov_tripolitania_the_budget_desc: "The regency is put on its own customs and its own land tax from the first estimate. A province that pays for itself is a province the Chamber will not debate."
 ITA_h_gov_tripolitania_the_workshops: "The Workshops of Tripolitania"
 ITA_h_gov_tripolitania_the_workshops_desc: "The harbour works are finished and a repair shop is put behind them for the garrison. Everything landed there afterwards costs us less."
 ITA_h_gov_tripolitania_the_concessions: "The Concessions of Tripolitania"
 ITA_h_gov_tripolitania_the_concessions_desc: "The oases and the coastal strip are surveyed and leased to Italian settlers on easy terms. The emigration that went across the ocean may go across the sea instead."
 ITA_h_gov_tripolitania_the_residency: "The Residency of Tripolitania"
 ITA_h_gov_tripolitania_the_residency_desc: "The governor sits in the town and treats with the interior through the notables. We shall not ask the interior for more than it will give quietly."
 ITA_h_gov_aegean_the_budget: "The Budget of the Aegean"
 ITA_h_gov_aegean_the_budget_desc: "The islands are put on their own harbour dues and cease to be a charge on the navy estimate. A pledge that pays its own way may be held for a long time."
 ITA_h_gov_aegean_the_workshops: "The Workshops of the Aegean"
 ITA_h_gov_aegean_the_workshops_desc: "A dockyard shed and a coal store are put up where the squadron already anchors. The fleet will not have to go home to refit a destroyer."
 ITA_h_gov_aegean_the_concessions: "The Concessions of the Aegean"
 ITA_h_gov_aegean_the_concessions_desc: "The sponge fisheries and the quarries are leased on terms that favour Italian houses. The islanders keep their councils and lose their best contracts."
 ITA_h_gov_aegean_the_residency: "The Residency of the Aegean"
 ITA_h_gov_aegean_the_residency_desc: "A civil governor is appointed over what the treaty still calls a temporary occupation. The word temporary will stay in the treaty and out of the estimates."
 ITA_h_gov_east_africa_the_budget: "The Budget of East Africa"
 ITA_h_gov_east_africa_the_budget_desc: "The sphere is given one account instead of three and one governor instead of a committee. It will cost the treasury less on the day the reform is signed."
 ITA_h_gov_east_africa_the_workshops: "The Workshops of East Africa"
 ITA_h_gov_east_africa_the_workshops_desc: "A depot on the caravan road will do the work that three coastal stores do badly. The garrison inland stops living on what the porters remember to carry."
 ITA_h_gov_east_africa_the_concessions: "The Concessions of East Africa"
 ITA_h_gov_east_africa_the_concessions_desc: "The plantations of the interior are granted to Italian companies under the residency and not under a charter. The lesson of the Benadir has been learned once."
 ITA_h_gov_east_africa_the_residency: "The Residency of East Africa"
 ITA_h_gov_east_africa_the_residency_desc: "The chiefs of the sphere sign with our governor and with nobody else, and are paid for it. A protectorate that is administered is worth three that are merely claimed."
 ITA_h_gov_budget_tt: "The colonial account gives back 0.005 of the consumer goods the Kingdom must find at home"
 ITA_h_gov_workshops_tt: "The colonial account adds 0.005 to the building speed of arms factories, and one level of infrastructure is laid"
 ITA_h_gov_concessions_tt: "The colonial account adds 0.005 to the industrial capacity of the Kingdom"
 ITA_h_gov_residency_tt: "The colonial account takes 0.005 off the autonomy our subjects gain"
 ITA_h_the_committee_of_the_budget: "The Committee of the Budget"
 ITA_h_the_committee_of_the_budget_desc: "The budget committee is reconstituted with our men in the chair and in the reporting seats. Every estimate for the rest of the session will come out of it in the shape we gave it."
 ITA_h_the_committee_of_the_budget_tt: "The majority gains 4 and the ministry gains 25 political power"
 ITA_h_the_estimates_are_voted: "The Estimates Are Voted"
 ITA_h_the_estimates_are_voted_desc: "The whole of the estimates go through in one session, on time, without a provisional twelfth. It is the dullest thing a majority can do and the surest proof that it exists."
 ITA_h_the_estimates_are_voted_tt: "The majority gains 3 and stability rises by 3 percent"
 ITA_h_the_law_of_expenditure: "The Law of Expenditure"
 ITA_h_the_law_of_expenditure_desc: "A special law puts money into roads, harbours and drainage in the provinces that ask loudest. The Chamber will vote it and then quarrel about who was left out."
 ITA_h_the_law_of_expenditure_tt: "One level of infrastructure in 2 of our core states, and the majority falls by 2"
 ITA_h_the_commission_of_inquiry: "The Commission of Inquiry"
 ITA_h_the_commission_of_inquiry_desc: "A parliamentary commission is sent where the trouble is, with power to take evidence on oath. It will take a year, and for that year nobody can say the state did nothing."
 ITA_h_the_commission_of_inquiry_tt: "The square falls by 4 and the majority gains 2"
 ITA_h_the_pledges_are_called_in: "The Pledges Are Called In"
 ITA_h_the_pledges_are_called_in_desc: "The undertakings given in this session are called in at once, before the men who gave them forget. We shall be poorer in credit afterwards and stronger in the lobby tonight."
 ITA_h_the_pledges_are_called_in_tt: "3 pledges are spent and the majority gains 6"
 ITA_h_the_tariff_schedule_revised: "The Tariff Schedule Is Revised"
 ITA_h_the_tariff_schedule_revised_desc: "The general schedule is rewritten line by line, and the lines that feed the country are cut first. The industrialists will be heard and will not be obeyed."
 ITA_h_the_tariff_schedule_revised_tt: "The ministry gains 50 political power and the majority gains 3"
 ITA_h_the_treaties_are_signed: "The Treaties Are Signed"
 ITA_h_the_treaties_are_signed_desc: "The commercial conventions are concluded with every power that will sit down with us. It is a small thing in the newspapers and a large one on the quays."
 ITA_h_the_treaties_are_signed_tt: "Every great power not at war with us thinks a little better of us, and stability rises by 3 percent"
 ITA_h_the_consulate_works_on: "The Consulate Works On Them"
 ITA_h_the_consulate_works_on_desc: "Our consulate in that country is given money for schools, for a chamber of commerce and for the local press. In two years the ministry there will have learned to ask us before it decides."
 ITA_h_the_consulate_opens_tt: "The work begins, and we already think better of them"
 ITA_h_the_consulate_reports_tt: "They think better of us, and their government is inclined to look for us first"
 ITA_h_the_houses_of_the_plate: "The Houses of the Plate"
 ITA_h_the_houses_of_the_plate_desc: "The Italian trading houses on the river are given credit at home and a consular agent of their own. Money that used to stay abroad will come back through Genoa."
 ITA_h_the_houses_of_the_plate_tt: "The square falls by 3 and Buenos Aires thinks better of us"
 ITA_h_the_coffee_of_sao_paulo: "The Coffee of the Plantations"
 ITA_h_the_coffee_of_sao_paulo_desc: "The passage is reopened on terms the commissariat can defend, and the crop comes home in our bottoms. The men who sail out will send back more than they cost."
 ITA_h_the_coffee_of_sao_paulo_tt: "4000 men return or are freed for service, and Rio thinks better of us"
 ITA_h_the_remittances_of_the_north: "The Remittances of the North"
 ITA_h_the_remittances_of_the_north_desc: "A postal savings office is opened in every city where our people are counted in the tens of thousands. What they save there is banked here."
 ITA_h_the_remittances_of_the_north_tt: "The ministry gains 40 political power and the square falls by 2"
 ITA_h_the_trade_of_the_levant: "The Trade of the Levant"
 ITA_h_the_trade_of_the_levant_desc: "The old colonies of Italian merchants in the eastern ports are given a bank and a subsidised line. The Porte will find it easier to deal with us than with anyone else."
 ITA_h_the_trade_of_the_levant_tt: "The majority gains 2 and the Porte thinks better of us"
 ITA_l_tripolitania_the_residency: "The Residency at Tripoli"
 ITA_l_tripolitania_the_residency_desc: "The governor is installed with a staff, a treasury and a building that says what he is. A province is governed from an address or it is not governed."
 ITA_l_tripolitania_the_coast_road: "The Coast Road of Tripolitania"
 ITA_l_tripolitania_the_coast_road_desc: "The track along the shore is made into a road that a column and a lorry can both use. Everything east of the capital stops being a week away."
 ITA_l_tripolitania_the_register: "The Register of Tripolitania"
 ITA_l_tripolitania_the_register_desc: "The tribes and the land are written down, and the notables are paid to help with the writing. Men and taxes both follow the register."
 ITA_l_cyrenaica_the_residency: "The Residency at Benghazi"
 ITA_l_cyrenaica_the_residency_desc: "The eastern province gets a governor of its own instead of an office in the capital. It has never been administered from the same place as the west and never will be."
 ITA_l_cyrenaica_the_coast_road: "The Coast Road of Cyrenaica"
 ITA_l_cyrenaica_the_coast_road_desc: "The road is carried along the shore and up onto the green plateau behind it. The garrisons of the interior cease to depend on the sea alone."
 ITA_l_cyrenaica_the_register: "The Register of Cyrenaica"
 ITA_l_cyrenaica_the_register_desc: "The lodges and the tribal sections are surveyed by agreement rather than by column. What we learn we shall use carefully."
 ITA_l_the_horn_the_residency: "The Residency of the Horn"
 ITA_l_the_horn_the_residency_desc: "One governor is set over both coasts, with the staff and the treasury to match. Two colonies that never spoke to each other are now one command."
 ITA_l_the_horn_the_coast_road: "The Road Between the Seas"
 ITA_l_the_horn_the_coast_road_desc: "The tracks between the two colonies are joined and made fit for a convoy. What we hold on the Red Sea and what we hold on the Indian Ocean become one theatre."
 ITA_l_the_horn_the_register: "The Register of the Horn"
 ITA_l_the_horn_the_register_desc: "The chiefs are enrolled, the wells are recorded and the tribute is fixed. It is the dullest instrument of empire and the one that lasts."
 ITA_l_the_islands_the_residency: "The Residency of the Islands"
 ITA_l_the_islands_the_residency_desc: "A civil governor is appointed and given the harbour works as his first charge. The islands stop being a naval station with a mayor."
 ITA_l_the_islands_the_anchorage: "The Anchorage of the Islands"
 ITA_l_the_islands_the_anchorage_desc: "The great roadstead is dredged, moored and given a coal store worth the name. The squadron in the eastern sea will not have to go home to lie up."
 ITA_l_the_islands_the_register: "The Register of the Islands"
 ITA_l_the_islands_the_register_desc: "The councils are confirmed, the rolls are taken and the young men are counted. The fleet will want that list before the army does."
 ITA_l_the_residency_is_opened_tt: "One shared building slot and one level of infrastructure in the seat of the governorate"
 ITA_l_the_coast_road_tt: "One level of infrastructure in each of the 2 provinces the road joins"
 ITA_l_the_register_of_the_tribes_tt: "Men are enrolled from the register, and the ministry gains 15 political power"
 ITA_l_the_anchorage_tt: "One naval base in the islands, and the fleet gains 15 experience"
 ITA_l_the_banks_of_the_plate: "The Banks of the Plate"
 ITA_l_the_banks_of_the_plate_desc: "An Italian bank of issue is opened on the river with the treasury standing quietly behind it. Whoever lends to that government afterwards will be lending our money."
 ITA_l_the_schools_of_the_river: "The Schools of the River"
 ITA_l_the_schools_of_the_river_desc: "The societies on the eastern bank are given teachers, books and a subsidy that is not published. A generation that reads our language will vote for our friends."
 ITA_l_the_reservists_on_the_river: "The Reservists on the River"
 ITA_l_the_reservists_on_the_river_desc: "The consulates call in the men of military age who never reported and offer them terms. Most of them will come home if the passage is paid."
 ITA_l_the_reservists_on_the_river_tt: "6000 men come home to the colours, and our weight on the river grows by 1"
 ITA_l_the_press_of_buenos_aires: "The Press of the River"
 ITA_l_the_press_of_buenos_aires_desc: "Two newspapers of the colony are bought and a third is given advertising it cannot refuse. What they print about London will be printed for a year."
 ITA_l_the_chambers_of_commerce: "The Chambers of Commerce"
 ITA_l_the_chambers_of_commerce_desc: "The Italian chambers of commerce on the river are federated and given a voice in Rome. The republics of the basin will treat with that federation because there is nobody else to treat with."
 ITA_l_the_chambers_of_commerce_tt: "The ministry gains 45 political power and every republic of the basin thinks better of us"
 ITA_l_the_plate_pressure_tt: "Our weight on the river grows"
 ITA_i_the_schools_of_tunis: "The Schools of Tunis"
 ITA_i_the_schools_of_tunis_desc: "The Italian schools of the regency are funded openly, in defiance of the protectorate that pretends they are French. We claim nothing by force and we claim it every morning at nine."
 ITA_i_the_schools_of_tunis_tt: "The Kingdom lays a claim to the regency, and the ministry gains 20 political power"
 ITA_i_the_chambers_of_labour_abroad: "The Chambers of Labour Abroad"
 ITA_i_the_chambers_of_labour_abroad_desc: "Our workmen in the regency are organised into chambers of labour that answer to Rome and not to Paris. The residency will protest, and the protest will be filed."
 ITA_i_the_chambers_of_labour_abroad_tt: "Men are enrolled from the colony, and Paris thinks worse of us"
 ITA_i_the_subscription_for_the_schools: "The Subscription for the Schools"
 ITA_i_the_subscription_for_the_schools_desc: "A public subscription is opened at home for the schools beyond the frontier, and the committees run it. It raises money, and it raises the temperature of every piazza that gives."
 ITA_i_the_subscription_for_the_schools_tt: "The square rises by 2 and the ministry gains 25 political power"
 ITA_arm_the_alpine_works: "The Alpine Works"
 ITA_arm_the_alpine_works_desc: "The barrier forts above the Piave, sector by sector, as the Comando has drawn them."
 ITA_n_the_auxiliary_cruisers: "The Auxiliary Cruisers"
 ITA_n_the_auxiliary_cruisers_desc: "The subsidised packets, entered on the naval register before anyone needs them."
 ITA_e_the_consumption_duties: "The Consumption Duties"
 ITA_e_the_consumption_duties_desc: "The gate duties and the excises, the only revenue the Treasury can raise without a new law."
 ITA_e_the_reclamations: "The Reclamations"
 ITA_e_the_reclamations_desc: "The bonifiche, province by province, where the water is drained and the land is given back."
 ITA_e_the_state_railways: "The State Railways"
 ITA_e_the_state_railways_desc: "The lines, the rolling stock and the workshops the Kingdom has just taken into its own hands."
 ITA_e_the_hydro_power: "The White Coal"
 ITA_e_the_hydro_power_desc: "The alpine stations and the current they send down to the mills."
 ITA_o_the_iberian_union: "The Iberian Union"
 ITA_o_the_iberian_union_desc: "Two crowns and one peninsula. Rome has said what it thinks; the decision is not Rome's to take."
 ITA_o_the_latin_league: "The Latin League"
 ITA_o_the_latin_league_desc: "The upkeep of the Mediterranean system: conferences, subsidies, tariffs and schools."
 ITA_o_the_adriatic_league: "The Adriatic League"
 ITA_o_the_adriatic_league_desc: "The belt of small courts around the Monarchy, and what it costs to keep it standing."
 ITA_u_found_the_albanian_state: "Found the Albanian State"
 ITA_u_found_the_albanian_state_desc: "The committee at Durazzo has a map and a candidate. We supply the rest."
 ITA_u_restore_croatia: "Restore Croatia"
 ITA_u_restore_croatia_desc: "The Triune Kingdom, promised at Agram for two generations and never granted."
 ITA_u_establish_slovenia: "Establish Slovenia"
 ITA_u_establish_slovenia_desc: "Carniola, Styria and the Littoral, gathered into a state that has never existed."
 ITA_u_raise_saint_stephen: "Raise Saint Stephen"
 ITA_u_raise_saint_stephen_desc: "The crown of the Magyars, offered to a Hungary that no longer answers to Vienna."
 ITA_u_the_works_for_the_ore: "The Works for the Ore"
 ITA_u_the_works_for_the_ore_desc: "Plant for minerals: what the two Latin economies could trade if they chose to."
 ITA_u_the_leagues_abroad: "The Leagues Abroad"
 ITA_u_the_leagues_abroad_desc: "The strike funds, the speakers and the presses the International keeps in other men's countries."
 ITA_u_the_eastern_stations: "The Eastern Stations"
 ITA_u_the_eastern_stations_desc: "Coal, moorings and a wireless mast at every point of support between Suez and the China Sea."
 ITA_arm_the_operations_office: "The Operations Office"
 ITA_arm_the_operations_office_desc: "The Comando keeps a working file on every neighbour, and the file is only worth what the last survey put into it. Send the officers over the frontier as tourists and let them come back with the roads, the depots and the garrisons."
 ITA_dec_the_operations_office_tt: "§YIf the war hypotheses were adopted§!: a hard, short study - §G45§! days of §G+10%§! artillery attack and §G+10%§! breakthrough, and the ground opposite loses §R10%§! of its supply and its manpower.\n§YOtherwise, the great manoeuvres§!: milder and twice as long - §G90§! days of §G+5%§! artillery attack, §G+5%§! breakthrough and §G+10%§! planning."
 ITA_arm_the_african_variant: "The African Variant"
 ITA_arm_the_african_variant_desc: "A plan drawn for the Alps is worthless on the Eritrean plateau, where the column moves at the speed of its water. The Africa command must be allowed to write its own variant and to rehearse it on the ground."
 ITA_dec_the_african_variant_tt: "Every African state we own carries §GThe Column Is Ready§! for §G365§! days: §G+10%§! local supply and §G+15%§! infrastructure construction."
 ITA_arm_the_plan_of_the_north_east: "The North-Eastern Hypothesis"
 ITA_arm_the_plan_of_the_north_east_desc: "The concentration studied since Saletta took the staff puts four armies between the Isonzo and the Cadore, against the ally we are still treaty-bound to. File it as the working plan and let the west wait."
 ITA_dec_the_plan_of_the_north_east_tt: "Files the north-eastern plan and withdraws the western one. The staff gains §G+10%§! planning speed and §G+10%§! maximum planning while a plan is on the table."
 ITA_arm_the_plan_of_the_west: "The Western Hypothesis"
 ITA_arm_the_plan_of_the_west_desc: "The other ipotesi faces the Alps of Savoy and the coast road to Nice, and the Triple Alliance was signed to make it the likely one. File it as the working plan and let the north-east wait."
 ITA_dec_the_plan_of_the_west_tt: "Files the western plan and withdraws the north-eastern one. The staff gains §G+10%§! planning speed and §G+10%§! maximum planning while a plan is on the table."
 ITA_arm_the_barrier_of_the_cadore: "The Barrier of the Cadore"
 ITA_arm_the_barrier_of_the_cadore_desc: "The Cadore is the shortest road from the Pusteria to the Venetian plain, and it is held today by three companies and a customs post. Build the barrier where the engineers have already surveyed it."
 ITA_dec_the_barrier_of_the_cadore_tt: "Builds §G1§! level of fortification on the border provinces of Veneto, at once."
 ITA_arm_the_barrier_of_the_agordino: "The Barrier of the Agordino"
 ITA_arm_the_barrier_of_the_agordino_desc: "Behind the Cadore the Agordino carries the second road down, and a barrier that ends at the first valley is not a barrier. Close it with the same works and the same guns."
 ITA_dec_the_barrier_of_the_agordino_tt: "Builds §G1§! level of fortification on the border provinces of Veneto, at once."
 ITA_arm_the_barrier_of_the_valsugana: "The Barrier of the Valsugana"
 ITA_arm_the_barrier_of_the_valsugana_desc: "The Valsugana is the corridor that would carry an Austrian army to Bassano in four marches, and it is the sector Conrad reads first. It must be shut harder than the rest, whatever Vienna says about the treaty."
 ITA_dec_the_barrier_of_the_valsugana_tt: "Builds §G1§! level of fortification on the border provinces of Veneto, at once."
 ITA_arm_the_barrier_of_the_tagliamento: "The Line of the Tagliamento"
 ITA_arm_the_barrier_of_the_tagliamento_desc: "East of the Piave the frontier runs across open ground, and the only line worth holding there is the river itself. Fortify the crossings while the works in the mountains are still being argued about."
 ITA_dec_the_barrier_of_the_tagliamento_tt: "Builds §G2§! levels of fortification on the border provinces of Friuli, at once."
 ITA_n_take_up_the_liners: "Take Up the Liners"
 ITA_n_take_up_the_liners_desc: "The maritime conventions pay the great companies to build hulls the Navy can call in, and the clause has never once been used. Take up a squadron of packets and put them on the register before we need them."
 ITA_dec_take_up_the_liners_tt: "§G20§! convoys enter the naval register, and the service gains §G25§! naval experience."
 ITA_n_the_clause_in_the_conventions: "The Clause in the Conventions"
 ITA_n_the_clause_in_the_conventions_desc: "The subsidy is paid whether or not the shipowner builds to Admiralty scantlings, and every owner has noticed. Rewrite the clause, and pay for the slipway that will make it worth signing."
 ITA_dec_the_clause_in_the_conventions_tt: "Opens a shared slot and builds §G1§! dockyard in Liguria at once, and the service gains §G25§! naval experience."
 ITA_n_the_guns_for_the_packets: "The Guns for the Packets"
 ITA_n_the_guns_for_the_packets_desc: "A liner with a register number and no mounting is a merchant ship with a flag on it. Cut the gun beds now, in the yard, and store the pieces ashore against the day."
 ITA_dec_the_guns_for_the_packets_tt: "The Auxiliary Squadron, permanent: §G+10%§! naval range, §G+5%§! naval hit chance and §G+5%§! screening efficiency. The service gains §G35§! naval experience."
 ITA_e_the_gate_duty_of_rome: "The Gate Duty of Rome"
 ITA_e_the_gate_duty_of_rome_desc: "Rome collects its dazio at the gates on wine, meat and building stone, and the tariff has not been revised since the city became a capital. Revise it upward, and expect to be told about it in the Chamber."
 ITA_dec_the_gate_duty_of_rome_tt: "The debt service falls by §G0.05§!, and stability by §R0.02§!."
 ITA_e_the_gate_duty_of_naples: "The Gate Duty of Naples"
 ITA_e_the_gate_duty_of_naples_desc: "Naples is the largest consumer city in the Kingdom and the poorest, and its gate duty falls on bread before it falls on anything else. Raise it if the Treasury must, and the prefect will need his carabineers."
 ITA_dec_the_gate_duty_of_naples_tt: "The debt service falls by §G0.05§!, and stability by §R0.03§!."
 ITA_e_the_gate_duty_of_milan: "The Gate Duty of Milan"
 ITA_e_the_gate_duty_of_milan_desc: "Milan pays more at its gates than any other commune and complains the loudest, because its chamber of labour writes the complaint. The yield is the best in Italy and we shall take it."
 ITA_dec_the_gate_duty_of_milan_tt: "The debt service falls by §G0.06§!, and stability by §R0.03§!."
 ITA_e_the_duty_on_salt: "The Duty on Salt"
 ITA_e_the_duty_on_salt_desc: "The salt monopoly is the oldest revenue of the state and the one no household can avoid. Hold the price where it stands rather than grant the sgravio that has been promised every spring."
 ITA_dec_the_duty_on_salt_tt: "The debt service falls by §G0.08§!, and stability by §R0.04§!."
 ITA_e_the_duty_on_sugar: "The Duty on Sugar"
 ITA_e_the_duty_on_sugar_desc: "The refiners of the Veneto were given a protective duty and have grown fat behind it while the consumer pays four times the London price. Keep the duty and take the difference for the Treasury."
 ITA_dec_the_duty_on_sugar_tt: "The debt service falls by §G0.07§!, at a cost of §R25§! political power."
 ITA_e_the_duty_on_ground_grain: "The Duty on Ground Grain"
 ITA_e_the_duty_on_ground_grain_desc: "The milling tax was abolished after it cost a ministry its head, and every finance minister since has looked at it again. Bring it back in another name, and be ready for what follows in the squares."
 ITA_dec_the_duty_on_ground_grain_tt: "The debt service falls by §G0.10§!. Stability falls by §R0.06§! and communist support rises by §R3%§!."
 ITA_e_the_octroi_is_farmed_out: "The Octroi Is Farmed Out"
 ITA_e_the_octroi_is_farmed_out_desc: "Half the communes collect their own gate duty badly and the other half sell the right to a contractor who collects it well. Farm out the collection where the accounts are worst and pay the political price."
 ITA_dec_the_octroi_is_farmed_out_tt: "The debt service falls by §G0.04§!, at a cost of §R15§! political power."
 ITA_e_the_arrears_of_the_communes: "The Arrears of the Communes"
 ITA_e_the_arrears_of_the_communes_desc: "The southern communes owe the Treasury more than they raise in a year, and the Treasury has lent them the money to pay the interest. Call the arrears in, and let the prefects explain it."
 ITA_dec_the_arrears_of_the_communes_tt: "The debt service falls by §G0.12§!, and stability by §R0.05§!."
 ITA_e_the_bonifica_of_the_agro_romano: "The Agro Romano"
 ITA_e_the_bonifica_of_the_agro_romano_desc: "Malaria begins where the tram line ends, within sight of the dome, and the law of reclamation has been on the books for a generation. Drain it, and the capital will have a hinterland at last."
 ITA_dec_the_bonifica_of_the_agro_romano_tt: "Opens §G1§! shared slot in Latium and builds §G1§! level of infrastructure at once."
 ITA_e_the_bonifica_of_the_pontine_marshes: "The Pontine Marshes"
 ITA_e_the_bonifica_of_the_pontine_marshes_desc: "The marshes have defeated every drainage scheme since the Caesars, and the last one failed for want of a pumping station. Buy the pumps and finish the work."
 ITA_dec_the_bonifica_of_the_pontine_marshes_tt: "Opens §G1§! shared slot in the Viterbese and builds §G1§! level of infrastructure at once."
 ITA_e_the_bonifica_of_the_maremma: "The Maremma"
 ITA_e_the_bonifica_of_the_maremma_desc: "The Tuscan coast is grazing for six months and fever for the other six, and the great estates prefer it that way. Reclaim it over their objection."
 ITA_dec_the_bonifica_of_the_maremma_tt: "Opens §G1§! shared slot in Tuscany and builds §G1§! level of infrastructure at once."
 ITA_e_the_bonifica_of_the_lower_po: "The Lower Po"
 ITA_e_the_bonifica_of_the_lower_po_desc: "The delta floods on a schedule the embankments no longer keep, and its labourers are the best organised in Italy. Reclaim the bassa, and the leagues will remember who paid for it."
 ITA_dec_the_bonifica_of_the_lower_po_tt: "Opens §G1§! shared slot in Emilia and builds §G1§! level of infrastructure at once. Stability rises by §G0.02§!."
 ITA_e_the_bonifica_of_the_tavoliere: "The Tavoliere"
 ITA_e_the_bonifica_of_the_tavoliere_desc: "The Apulian plain is worked by men who walk to it from the towns because there is no water on it. Sink the wells and cut the canals, and the walk will end."
 ITA_dec_the_bonifica_of_the_tavoliere_tt: "Opens §G1§! shared slot in Apulia and builds §G1§! level of infrastructure at once."
 ITA_e_the_direttissima_to_naples: "The Direttissima to Naples"
 ITA_e_the_direttissima_to_naples_desc: "The mail takes nine hours to Naples on a line that climbs every hill between the two cities. Cut the direct road along the coast, and the capital and the south will be a morning apart."
 ITA_dec_the_direttissima_to_naples_tt: "Builds §G2§! levels of infrastructure in the Neapolitan states at once."
 ITA_e_the_line_through_the_apennines: "The Line Through the Apennines"
 ITA_e_the_line_through_the_apennines_desc: "Everything that moves between the north and the centre crosses the Porrettana at the pace of a banked curve. Bore the direct line under the mountain, whatever the estimate says."
 ITA_dec_the_line_through_the_apennines_tt: "Builds §G2§! levels of infrastructure in Emilia at once."
 ITA_e_the_adriatic_line_is_doubled: "The Adriatic Line Is Doubled"
 ITA_e_the_adriatic_line_is_doubled_desc: "One track carries the whole eastern coast, the grain of Apulia and, on the day it comes, the army going north. Double it, and the staff will stop writing memoranda about it."
 ITA_dec_the_adriatic_line_is_doubled_tt: "Builds §G1§! level of infrastructure in the Abruzzi and §G1§! in Apulia at once."
 ITA_e_the_orders_to_breda: "The Orders to Breda"
 ITA_e_the_orders_to_breda_desc: "The state now owns the network and inherits its rolling stock, most of which is older than the men driving it. Place the orders at home instead of abroad, and let the works grow to fill them."
 ITA_dec_the_orders_to_breda_tt: "Opens §G1§! shared slot in the Milanese and builds §G1§! civilian factory at once."
 ITA_e_the_workshops_of_the_state_railways: "The Workshops of the State Railways"
 ITA_e_the_workshops_of_the_state_railways_desc: "Six private companies left six incompatible repair shops, and a locomotive can wait a season for a part. Build one great workshop and make the parts interchangeable."
 ITA_dec_the_workshops_of_the_state_railways_tt: "Opens §G1§! shared slot in Tuscany and builds §G1§! civilian factory at once."
 ITA_e_the_traction_of_the_valtellina: "The Traction of the Valtellina"
 ITA_e_the_traction_of_the_valtellina_desc: "The Valtellina line is the first in the world to run on three-phase current taken from a mountain river. Extend the system, because every kilometre it covers is coal we do not buy."
 ITA_dec_the_traction_of_the_valtellina_tt: "Builds §G1§! level of infrastructure in Lombardy and gives it §GThe White Coal§!: §G+10%§! local resources and §G+5%§! construction speed."
 ITA_e_the_station_at_paderno: "The Station at Paderno"
 ITA_e_the_station_at_paderno_desc: "The fall of the Adda at Paderno already lights Milan, and the company will build twice as much if the concession is renewed. Renew it and take the current for the mills."
 ITA_dec_the_station_at_paderno_tt: "Opens §G1§! shared slot in Lombardy, builds §G1§! civilian factory at once, and puts the white coal on the network."
 ITA_e_the_stations_of_the_ticino: "The Stations of the Ticino"
 ITA_e_the_stations_of_the_ticino_desc: "The Ticino carries more water past Piedmont than Piedmont burns coal in a year, and it turns nothing. Dam the reaches and set the turbines."
 ITA_dec_the_stations_of_the_ticino_tt: "Piedmont gains §GThe White Coal§! and §G1§! civilian factory at once."
 ITA_e_the_stations_of_the_adige: "The Stations of the Adige"
 ITA_e_the_stations_of_the_adige_desc: "The Adige falls out of mountains that are not ours and is ours for the last stretch, which is the stretch that matters. Build the stations on the lower river."
 ITA_dec_the_stations_of_the_adige_tt: "The Veneto gains §GThe White Coal§! and §G1§! civilian factory at once."
 ITA_e_the_stations_of_the_ossola: "The Stations of the Ossola"
 ITA_e_the_stations_of_the_ossola_desc: "The Ossola valleys hold the steepest usable water in the Kingdom and the new tunnel puts a railway beside it. Take the water while the works are still on site."
 ITA_dec_the_stations_of_the_ossola_tt: "The Piedmontese valleys gain §GThe White Coal§! and §G1§! civilian factory at once."
 ITA_e_the_line_to_the_lombard_mills: "The Line to the Lombard Mills"
 ITA_e_the_line_to_the_lombard_mills_desc: "Current made in the Alps is worth nothing until a copper line carries it to a spindle in Milan. String the line, and the coal bill of the north falls with it."
 ITA_dec_the_line_to_the_lombard_mills_tt: "The Milanese gains §GThe White Coal§!, §G2§! shared slots and §G2§! civilian factories at once, and the debt service falls by §G0.05§!."
 ITA_o_form_the_iberian_union: "Form the Iberian Union"
 ITA_o_form_the_iberian_union_desc: "Rome has said in public what the federalists on both sides of the Guadiana have said in private for fifty years: that the peninsula is one country with two courts. The question goes to the other capital, and it will be answered there."
 ITA_dec_form_the_iberian_union_tt: "Puts the question to the other Iberian crown. Acceptance makes one state of the peninsula and brings it into the Italian system; refusal closes the matter for good."
 ITA_o_the_conference_of_the_league: "The Conference of the League"
 ITA_o_the_conference_of_the_league_desc: "A league that meets only when it is threatened is a rumour, and the smaller courts have begun to say so. Call the conference to Rome and let them be seen arriving."
 ITA_dec_the_conference_of_the_league_tt: "Every member of our system gains a §Gmedium§! improvement in its opinion of us."
 ITA_o_the_subsidy_to_the_latin_squadrons: "The Subsidy to the Latin Squadrons"
 ITA_o_the_subsidy_to_the_latin_squadrons_desc: "Our partners keep fleets they cannot coal and crews they cannot pay through a winter. Pay for them out of Rome, and the ships will be where we want them."
 ITA_dec_the_subsidy_to_the_latin_squadrons_tt: "Every minor member receives §G10§! convoys, and the service gains §G25§! naval experience."
 ITA_o_the_common_tariff_of_the_league: "The Common Tariff"
 ITA_o_the_common_tariff_of_the_league_desc: "Four Latin tariffs against each other make the league poorer than the alliance is worth. Negotiate one schedule and sign it before the harvest."
 ITA_dec_the_common_tariff_of_the_league_tt: "The League Is Kept, permanent: §G+10%§! trade opinion and §G+15%§! monthly opinion gain."
 ITA_o_the_school_for_the_league: "The School for the League"
 ITA_o_the_school_for_the_league_desc: "Officers who have never worked from the same manual will not manoeuvre together on the day. Open the staff course at Turin to the league and pay the fees ourselves."
 ITA_dec_the_school_for_the_league_tt: "The army gains §G15§! experience, and every minor member a §Gsmall§! improvement in its opinion of us."
 ITA_o_the_railway_of_the_danube_and_the_adriatic: "The Danube-Adriatic Railway"
 ITA_o_the_railway_of_the_danube_and_the_adriatic_desc: "Every wagon leaving Belgrade goes north through Hungarian hands because there is no line to the sea that is not Austrian. Build the line, and the Monarchy loses its stranglehold on the Balkan trade."
 ITA_dec_the_railway_of_the_danube_and_the_adriatic_tt: "Builds §G1§! level of infrastructure in Apulia at once, and every minor member gains a §Gmedium§! improvement in its opinion of us."
 ITA_o_the_coastal_squadron_of_the_league: "The Coastal Squadron"
 ITA_o_the_coastal_squadron_of_the_league_desc: "The eastern shore is a wall of islands and our partners have nothing that can work among them. Fit out a common squadron for the narrow sea and keep it at their disposal."
 ITA_dec_the_coastal_squadron_of_the_league_tt: "Every minor member receives §G10§! convoys, and the service gains §G25§! naval experience."
 ITA_o_the_customs_union_of_the_league: "The Customs Union"
 ITA_o_the_customs_union_of_the_league_desc: "The small states of the eastern shore trade with Vienna because Vienna is the only market that will have them. Open ours instead, and pay the Chamber for the privilege."
 ITA_dec_the_customs_union_of_the_league_tt: "The League Is Kept, permanent: §G+10%§! trade opinion and §G+15%§! monthly opinion gain. Costs §R25§! political power."
 ITA_o_the_arms_for_the_small_courts: "The Arms for the Small Courts"
 ITA_o_the_arms_for_the_small_courts_desc: "Cettigne and Belgrade buy their artillery where the credit is easiest, and the credit is French. Undercut it from Terni, and take the loss on the books."
 ITA_dec_the_arms_for_the_small_courts_tt: "Every minor member gains a §Glarge§! improvement in its opinion of us, at a cost of §R25§! political power."
 ITA_u_the_committee_of_durazzo: "The Committee of Durazzo"
 ITA_u_the_committee_of_durazzo_desc: "The Albanian committee has been meeting in Naples for years with a flag, a grammar and no frontier. Give it a frontier on paper before anyone is asked to fight for one."
 ITA_dec_the_committee_of_durazzo_tt: "Albania receives cores on Scutari, Durazzo and Berat, and on Janina, Prizren and Dibra if all three are already ours."
 ITA_u_proclaim_the_albanian_principality: "Proclaim the Albanian Principality"
 ITA_u_proclaim_the_albanian_principality_desc: "The committee has its map, the clans have their subsidies and the shore is in our hands. Proclaim the principality and put a prince of Savoy at the head of it."
 ITA_dec_proclaim_the_albanian_principality_tt: "Every Albanian core we hold passes to Albania, and Albania enters our system as a client. Costs §R50§! political power."
 ITA_u_the_diet_of_agram: "The Diet of Agram"
 ITA_u_the_diet_of_agram_desc: "The Triune Kingdom exists in the coronation oath and nowhere on the ground, and the diet at Agram says so every session. Draw the frontier the diet claims and let the claim become a title."
 ITA_dec_the_diet_of_agram_tt: "Croatia receives cores on Croatia, Slavonia, Dalmatia, Istria, Fiume, Lika and the Military Frontier."
 ITA_u_proclaim_the_kingdom_of_croatia: "Proclaim the Kingdom of Croatia"
 ITA_u_proclaim_the_kingdom_of_croatia_desc: "Agram is ours to give away and there is a diet in it that has been waiting a century to be asked. Proclaim the kingdom and hand it what we hold of its own."
 ITA_dec_proclaim_the_kingdom_of_croatia_tt: "Every Croatian core we hold passes to Croatia, and Croatia enters our system as a client. Costs §R50§! political power."
 ITA_u_the_assembly_of_laibach: "The Assembly of Laibach"
 ITA_u_the_assembly_of_laibach_desc: "The Slovene lands are three crown provinces, two dioceses and no state, and their leaders have never been offered one. Draw the state and let them argue about the capital afterwards."
 ITA_dec_the_assembly_of_laibach_tt: "Slovenia receives cores on Carniola, Styria, Carinthia, Gorizia and the Karst."
 ITA_u_proclaim_the_slovene_state: "Proclaim the Slovene State"
 ITA_u_proclaim_the_slovene_state_desc: "Laibach is in our hands and the assembly has voted the address. Proclaim the state, and the shortest road from Vienna to the sea will run through a country that owes us everything."
 ITA_dec_proclaim_the_slovene_state_tt: "Every Slovene core we hold passes to Slovenia, and Slovenia enters our system as a client. Costs §R50§! political power."
 ITA_u_the_crown_is_offered_at_buda: "The Crown Is Offered at Buda"
 ITA_u_the_crown_is_offered_at_buda_desc: "The Hungarians keep a separate crown, a separate diet and a grievance older than the Compromise. Offer them the crown alone, and the Monarchy loses its second half."
 ITA_dec_the_crown_is_offered_at_buda_tt: "Hungary receives cores on the Alfold, Transdanubia, the Banat, Slovakia, Transylvania and the Highlands."
 ITA_u_raise_the_hungarian_kingdom: "Raise the Hungarian Kingdom"
 ITA_u_raise_the_hungarian_kingdom_desc: "Buda is ours and the diet has sworn to the new crown. Raise the kingdom of Saint Stephen, and let Vienna govern what is left."
 ITA_dec_raise_the_hungarian_kingdom_tt: "Every Hungarian core we hold passes to Hungary, and Hungary enters our system as a client. Costs §R50§! political power."
 ITA_u_the_steel_for_the_milanese_mills: "Steel for the Milanese Mills"
 ITA_u_the_steel_for_the_milanese_mills_desc: "Paris will not sell the ore of Lorraine, but Paris will trade it for a works built on French ground with Italian money. Move a plant across the Alps and take the mineral in payment."
 ITA_dec_the_steel_for_the_milanese_mills_tt: "One of our civilian factories is dismantled and rebuilt in France. The Milanese gains §G6§! steel."
 ITA_u_the_bauxite_for_the_turin_works: "Bauxite for the Turin Works"
 ITA_u_the_bauxite_for_the_turin_works_desc: "The new light metal needs current, which we have, and bauxite, which we do not. Trade a works for the mineral before the French find another buyer."
 ITA_dec_the_bauxite_for_the_turin_works_tt: "One of our civilian factories is dismantled and rebuilt in France. Piedmont gains §G6§! aluminium."
 ITA_u_the_tungsten_for_the_ligurian_yards: "Tungsten for the Ligurian Yards"
 ITA_u_the_tungsten_for_the_ligurian_yards_desc: "Ansaldo cannot cut armour plate without high-speed steel and cannot make high-speed steel without wolfram. Buy the wolfram with a factory, since we have no other coin."
 ITA_dec_the_tungsten_for_the_ligurian_yards_tt: "One of our civilian factories is dismantled and rebuilt in France. Liguria gains §G4§! tungsten."
 ITA_u_the_chrome_for_the_emilian_forges: "Chrome for the Emilian Forges"
 ITA_u_the_chrome_for_the_emilian_forges_desc: "Armour plate is a chrome alloy, and every ton of chrome in Europe passes through a house in Paris or a house in London. Deal with Paris, and pay in plant."
 ITA_dec_the_chrome_for_the_emilian_forges_tt: "One of our civilian factories is dismantled and rebuilt in France. Emilia gains §G4§! chromium."
 ITA_u_the_strike_fund_abroad: "The Strike Fund Abroad"
 ITA_u_the_strike_fund_abroad_desc: "A strike lasts as long as the fund that feeds it, and the funds of the north are always the first to run out. Pay the fund, and let the government there explain the winter."
 ITA_dec_the_strike_fund_abroad_tt: "The target loses §R0.02§! stability, and its communists gain §G3%§! support."
 ITA_u_the_speakers_are_sent: "The Speakers Are Sent"
 ITA_u_the_speakers_are_sent_desc: "Our party has more orators than seats and nothing at home for them to do between elections. Send them where the language is close and the grievance is fresh."
 ITA_dec_the_speakers_are_sent_tt: "The communists of the target gain §G2%§! support."
 ITA_u_the_presses_abroad: "The Presses Abroad"
 ITA_u_the_presses_abroad_desc: "A paper printed in Rome and carried in a seaman's kitbag is read in every port on the continent. Pay for the presses, and stop pretending the ministry does not know."
 ITA_dec_the_presses_abroad_tt: "Every European power that is not already ours sees its communists gain §G1%§! support."
 ITA_u_the_seamen_refuse_the_cargo: "The Seamen Refuse the Cargo"
 ITA_u_the_seamen_refuse_the_cargo_desc: "The seamen's federation can stop a port faster than an army can take it, and it owes us for the last lockout. Call in the debt on the coast we choose."
 ITA_dec_the_seamen_refuse_the_cargo_tt: "Every coastal state of the target carries §GThe Port Is Idle§! for §G90§! days: §R15%§! local resources and §R10%§! construction speed."
 ITA_u_the_congress_of_the_international: "The Congress of the International"
 ITA_u_the_congress_of_the_international_desc: "The International has met in every capital that would have it, and Rome has never been one of them. Hold the congress here, and let Europe read the address in our newspapers."
 ITA_dec_the_congress_of_the_international_tt: "Every workers' government gains a §Glarge§! improvement in its opinion of us, and war support rises by §G0.03§!."
 ITA_u_the_general_strike_is_answered: "The General Strike Is Answered"
 ITA_u_the_general_strike_is_answered_desc: "When the call goes out abroad it is answered or it is broken, and there is nothing in between. Answer it with our money, our speakers and our ships."
 ITA_dec_the_general_strike_is_answered_tt: "The target loses §R0.05§! stability and §R0.03§! war support, and its communists gain §G5%§! support."
 ITA_u_the_station_at_tientsin: "The Station at Tientsin"
 ITA_u_the_station_at_tientsin_desc: "The concession on the Hai River is a strip of mud with a flag on it and no coal behind the flag. Build the mole, the sheds and the bunkers, or give the concession back."
 ITA_dec_the_station_at_tientsin_tt: "Builds §G2§! levels of naval base on the coast of the station."
 ITA_u_the_station_on_the_gulf_of_chihli: "The Station on the Gulf"
 ITA_u_the_station_on_the_gulf_of_chihli_desc: "A squadron that must coal at Hong Kong is a squadron that sails on British sufferance. Take the anchorage on the gulf and fit it out ourselves."
 ITA_dec_the_station_on_the_gulf_of_chihli_tt: "Builds §G2§! levels of naval base on the coast of the station."
 ITA_u_the_station_on_the_red_sea: "The Station in the Aegean"
 ITA_u_the_station_on_the_red_sea_desc: "Everything we send east coals once in the islands, and the anchorage we use there belongs to the Porte. Make it a base, and the road to the Levant is ours to watch."
 ITA_dec_the_station_on_the_red_sea_tt: "Builds §G2§! levels of naval base on the coast of the station."
 ITA_u_the_station_on_the_indian_run: "The Station on the Hong Kong Roads"
 ITA_u_the_station_on_the_indian_run_desc: "Past Singapore there is one roadstead where a ship of ours may lie, and it flies another flag. Hold it and coal it, and the China run is no longer a favour."
 ITA_dec_the_station_on_the_indian_run_tt: "Builds §G2§! levels of naval base on the coast of the station."
 ITA_u_the_station_on_the_china_run: "The Station on the China Run"
 ITA_u_the_station_on_the_china_run_desc: "The last leg to the China coast is the longest and the least served, and our consuls have reported on it for years. Make the last leg ours."
 ITA_dec_the_station_on_the_china_run_tt: "Builds §G2§! levels of naval base on the coast of the station."
 ITA_arm_the_hypothesis_is_drawn: "The Hypothesis Is Drawn"
 ITA_arm_the_hypothesis_is_drawn_desc: "The operations office has the roads, the depots and the garrisons of one neighbour on a single sheet, and the sheet is fresh."
 ITA_arm_the_manoeuvre_is_rehearsed: "The Manoeuvre Is Rehearsed"
 ITA_arm_the_manoeuvre_is_rehearsed_desc: "Two armies have walked the ground in front of the umpires, and what they learned holds for a season."
 ITA_arm_the_ground_is_walked: "The Ground Is Walked"
 ITA_arm_the_ground_is_walked_desc: "Foreign officers have been over this province with a notebook, and the depots and the garrisons are on a map in Rome."
 ITA_arm_the_column_is_ready: "The Column Is Ready"
 ITA_arm_the_column_is_ready_desc: "The African command has its own plan, its own wells and its own transport tables."
 ITA_arm_the_plan_is_filed: "The Plan Is Filed"
 ITA_arm_the_plan_is_filed_desc: "One concentration is on the table at the Comando, and the staff works to it instead of arguing about it."
 ITA_n_the_auxiliary_squadron: "The Auxiliary Squadron"
 ITA_n_the_auxiliary_squadron_desc: "The subsidised packets carry their gun beds from the slipway, and the pieces are stored ashore against the day."
 ITA_e_the_white_coal: "The White Coal"
 ITA_e_the_white_coal_desc: "The current comes down from the mountain and the coal bill of the province comes down with it."
 ITA_o_the_league_is_kept: "The League Is Kept"
 ITA_o_the_league_is_kept_desc: "One tariff, one conference table and one paymaster: the smaller courts have stopped shopping elsewhere."
 ITA_u_the_port_is_idle: "The Port Is Idle"
 ITA_u_the_port_is_idle_desc: "The seamen's federation has called the men off the quays, and nothing is loading."
 ITADNC_arm_the_army_after_adwa: "The Army After Adwa"
 ITADNC_arm_the_army_after_adwa_desc: "The commission of enquiry has reported, the war estimates have collapsed, and the chief of staff we appointed after the defeat still sits at his desk with nothing to spend. We must rebuild the army from the establishment upward, and begin by admitting what the enquiry found."
 ITADNC_arm_the_alpine_frontier: "The Alpine Frontier"
 ITADNC_arm_the_alpine_frontier_desc: "The barrages of the Cadore, the Agordino and the Valsugana are held by a Command that has never been given the money to finish them. We must survey the passes sector by sector and put the works in hand where the ground decides, and not the ministry."
 ITADNC_arm_the_great_manoeuvres: "The Great Manoeuvres"
 ITADNC_arm_the_great_manoeuvres_desc: "The minister of war asks for manoeuvres of two armies against each other, schools of fire, and advancement by merit rather than by seniority. We must give him his manoeuvre season before the estimates take it away from him."
 ITADNC_arm_the_war_hypotheses: "The War Hypotheses"
 ITADNC_arm_the_war_hypotheses_desc: "The Command has been told to study its concentrations: one to the north-east against the ally we are treatied to, one to the west against the neighbour we quarrel with. We shall have both hypotheses written out, and let the office that writes them say which it prefers."
 ITADNC_arm_the_truppe_celeri: "The Truppe Celeri"
 ITADNC_arm_the_truppe_celeri_desc: "Cavalry, cyclist bersaglieri and horse artillery are scattered among the divisions, where none of them can be used at speed. We must gather them into fast formations of their own, and give the army something that moves quicker than a marching column."
 ITADNC_arm_the_school_of_musketry: "The School of Musketry"
 ITADNC_arm_the_school_of_musketry_desc: "Our infantry is issued a rifle and taught to carry it rather than to shoot it, and the school of fire the programme promised has never been funded. We shall open it, and have every regiment send its instructors through."
 ITADNC_arm_the_motor_service: "The Motor Service"
 ITADNC_arm_the_motor_service_desc: "The Engineers have raised a motor section and bought its first lorries out of the ordinary estimates. We must give the service a proper establishment before the horse contractors talk the ministry out of it."
 ITADNC_arm_the_workshops_of_reconstruction: "The Workshops of Reconstruction"
 ITADNC_arm_the_workshops_of_reconstruction_desc: "The construction works at Turin and at Naples are choked with material come home from Africa, and half of it can be made serviceable again. We shall put the workshops on war hours and take back what the campaign has left us."
 ITADNC_arm_the_war_school_at_turin: "The War School at Turin"
 ITADNC_arm_the_war_school_at_turin_desc: "The War School quarrels with the ministry every year over who shall set its course and who shall pass its students. We must settle the question in the school's favour, and let the staff be chosen by the men who teach it."
 ITADNC_arm_the_heavy_field_artillery: "The Heavy Field Artillery"
 ITADNC_arm_the_heavy_field_artillery_desc: "The experimental commissions of the artillery have brought a howitzer and a long gun of heavy calibre through their trials. We shall order both into service, and give the army a piece that can reach behind a fortified line."
 ITADNC_arm_the_quick_firing_gun: "The Quick-Firing Gun"
 ITADNC_arm_the_quick_firing_gun_desc: "The trials are over, and the recoil system we want is held under a foreign licence that can be bought. We must take the licence, put the gun into the batteries, and stop laying a carriage again after every round."
 ITADNC_arm_the_army_corps_commands: "The Army Corps Commands"
 ITADNC_arm_the_army_corps_commands_desc: "The corps commands were reshuffled after the defeat and have been left with generals of very uneven quality ever since. We shall promote the two best of them over the heads of the list, and have the corps commanded rather than administered."
 ITADNC_arm_the_range_at_nettuno: "The Range at Nettuno"
 ITADNC_arm_the_range_at_nettuno_desc: "Every gun the works deliver is received, proved and measured on one stretch of coast before it ever reaches a battery. We must enlarge the range, so that nothing goes to the field until it has been fired here first."
 ITADNC_arm_the_eyes_of_the_army: "The Eyes of the Army"
 ITADNC_arm_the_eyes_of_the_army_desc: "The aerostatic section can hold a captive balloon above a battery and correct its fire from the basket. We shall attach the section to the artillery, and let the guns see what they are shooting at."
 ITADNC_arm_the_bersaglieri_cyclists: "The Bersaglieri Cyclists"
 ITADNC_arm_the_bersaglieri_cyclists_desc: "Companies of bersaglieri have been put on bicycles and can cover a road march that no marching company will match. We must raise them properly, on their own establishment, and use them where the ground allows the machine."
 ITADNC_arm_the_africa_command: "The Africa Command"
 ITADNC_arm_the_africa_command_desc: "The troops beyond the sea are administered from Rome by men who have never seen the country they write orders for. We shall constitute a command in Africa, with its colonial corps under it, and let it answer for its own garrisons."
 ITADNC_arm_the_machine_gun_sections: "The Machine Gun Sections"
 ITADNC_arm_the_machine_gun_sections_desc: "Two machine guns stand before the Council, one bought under licence and one of our own design, and the argument is over how many each regiment shall have. We must settle it, order both, and put a section with every regiment of the line."
 ITADNC_arm_the_alpini: "The Alpini"
 ITADNC_arm_the_alpini_desc: "The alpine battalions are raised in the valleys they are meant to hold, and their mountain guns go up on mules. We shall give them their own establishment and their own school, and keep the frontier with troops who live on it."
 ITADNC_arm_the_works_at_sampierdarena: "The Works at Sampierdarena"
 ITADNC_arm_the_works_at_sampierdarena_desc: "One works on the Ligurian shore can bore and line a heavy tube, and every other order for one goes abroad. We must enlarge it, and stop paying a foreign yard for what our own hands are able to finish."
 ITADNC_arm_the_supply_columns: "The Supply Columns"
 ITADNC_arm_the_supply_columns_desc: "The mule columns and the intendance have come back from Africa having learned what a campaign costs a service that was never organised for one. We shall reorganise both upon what they learned, and stop feeding an army by improvisation."
 ITADNC_arm_the_defence_of_the_kingdom: "The Defence of the Kingdom"
 ITADNC_arm_the_defence_of_the_kingdom_desc: "The plan for the defence of the Kingdom must hold two frontiers at once, and it has never once been written out as a single document. We must write it, fortify to it, and let the works follow the plan instead of the province that asks loudest."
 ITADNC_arm_the_military_railways: "The Military Railways"
 ITADNC_arm_the_military_railways_desc: "Mobilisation is a railway problem before it is a military one, and the lines are being bought back into the hands of the State. We shall build the military branches and the loading platforms while the question is still open."
 ITADNC_arm_the_field_wireless: "The Field Wireless"
 ITADNC_arm_the_field_wireless_desc: "The trials have carried a signal from a field station to a headquarters with no wire between the two of them. We must equip the army with the sets, and let an order reach a corps faster than a mounted man can carry it."
 ITA_arm_the_new_army_tt: "§YThe Army of the Kingdom§! now keeps its own account: every reform of this branch pours a further measure into it, and the country panel shows what the army has been made into."
 ITA_arm_the_alpine_works_tt: "§YThe works of the alpine barrages§! may now be put in hand sector by sector, as the Command surveys them."
 ITA_arm_the_plans_office_tt: "§YThe plans of the Comando§! are opened: the operations office may be set to work against a named power, and the plan it draws holds for the term of its warrant."
 ITA_arm_the_fucile_tt: "The depots are issued rifles of the Fucile mod. 91 pattern."
 ITA_arm_the_motor_section_tt: "The sezione automobilistica of the Engineers takes its first lorries onto the establishment."
 ITA_arm_the_heavy_pieces_tt: "The Obice da 149/12 and the Cannone da 149/35 A pass out of the experimental commissions and into the batteries."
 ITA_arm_the_deport_gun_tt: "The Deport licence is taken, and the Cannone da 75/27 mod. 906 and the Cannone da 65/17 go to the field and mountain batteries."
 ITA_arm_the_marshals_tt: "Two corps commanders are promoted over the heads of the seniority list."
 ITA_arm_the_range_tt: "The proving range receives, fires and measures every piece before it is passed to a battery."
 ITA_arm_the_cyclists_tt: "The cyclist companies of the bersaglieri are raised on an establishment of their own."
 ITA_arm_the_colonial_troops_tt: "The command of the troops in Africa is constituted, with the colonial corps under its orders."
 ITA_arm_the_machine_guns_tt: "The Mitragliatrice Maxim mod. 906 and the Mitragliatrice Perino are both ordered, and a section goes to every regiment of the line."
 ITA_arm_the_works_tt: "The Ansaldo works at Sampierdarena take the boring and lining of heavy tubes."
 ITA_arm_the_military_railways_tt: "The military branches and the loading platforms are laid on the lines the State has bought back."
 ITA_arm_available_chief_of_army_tt: "§YThe following Chief of the Army Staff is now available:§!"
 ITA_arm_org_tt: " Army Organisation: $RIGHT|+=%1$"
 ITA_arm_morale_tt: " Army Morale: $RIGHT|+=%1$"
 ITA_arm_speed_tt: " Army Speed: $RIGHT|+=%1$"
 ITA_arm_planning_tt: " Planning Speed: $RIGHT|+=%1$"
 ITA_arm_initiative_tt: " Initiative: $RIGHT|+=%1$"
 ITA_arm_infantry_attack_tt: " Infantry Attack: $RIGHT|+=%1$"
 ITA_arm_infantry_defence_tt: " Infantry Defence: $RIGHT|+=%1$"
 ITA_arm_artillery_attack_tt: " Artillery Attack: $RIGHT|+=%1$"
 ITA_arm_cavalry_tt: " Cavalry Attack: $RIGHT|+=%1$"
 ITA_arm_core_defence_tt: " Defence in Our Own States: $RIGHT|+=%1$"
 ITA_arm_dig_in_tt: " Maximum Entrenchment: $RIGHT|+=%1$"
 ITA_arm_reinforce_tt: " Reinforce Rate: $RIGHT|+=%1$"
 ITA_arm_supply_tt: " Supply Consumption: $RIGHT|+=%1$"
 ITA_arm_experience_tt: " Army Experience Gain: $RIGHT|+=%1$"
 ITA_arm_command_tt: " Command Power Gain: $RIGHT|+=%1$"
 ITA_arm_special_forces_tt: " Special Forces Establishment: $RIGHT|+=%1$"
 ITA_arm_mobilization_tt: " Mobilisation Speed: $RIGHT|+=%1$"
 ITA_arm_the_new_army: "The Army of the Kingdom"
 ITA_arm_the_new_army_desc: "What the reforms after the defeat have actually made of the Regio Esercito. Every measure taken in the army branch is entered here, and the account is never closed."
 ITA_arm_the_sbarramenti: "The Alpine Barrages"
 ITA_arm_the_sbarramenti_desc: "The sbarramenti of the Cadore, the Agordino and the Valsugana are under construction, and the engineers are working on the passes while the season allows."
 ITA_arm_the_camp_of_instruction: "The Camp of Instruction"
 ITA_arm_the_camp_of_instruction_desc: "Two armies are in the field against each other for the manoeuvre season, and the ministry is paying for every day of it."
 ita_dnc.2900.t: "The Operations Office"
 ita_dnc.2900.d: "The Command has its warrant to study the hypotheses of concentration, and now it wants the office that will do the work: a standing bureau, with its own draughtsmen, its own establishment and its own line in the estimates. The Treasury answers that a bureau put on the establishment is a bureau that never reports. The staff is waiting on a decision, and so are the works that would have to feed it."
 ita_dnc.2900.a: "Let the office stand on the establishment."
 ita_dnc.2900.b: "It will work on what the estimates allow."
 ita_dnc.2901.t: "The Establishments Wait"
 ita_dnc.2901.d: "The construction works and the arsenals of the State have been told to hold their orders until the estimates are read again, and the men in them are not paid to wait. Their delegates have gone to the ministry, and the ministry has sent them on to us. What is said now will be repeated in every yard of the Kingdom before the week is out."
 ita_dnc.2901.a: "Find them the work out of the ordinary vote."
 ita_dnc.2901.b: "They will wait for the reading of the estimates."
 ITADNC_air_the_specialist_brigade: "The Specialist Brigade"
 ITADNC_air_the_specialist_brigade_desc: "The Engineers keep the balloon service inside a corps that also digs trenches and strings telegraph, and no officer answers for the air alone. We must raise the specialist brigade, give Moris the aeronautical section and let it order its own material."
 ITADNC_air_the_aerostatic_companies: "The Aerostatic Companies"
 ITADNC_air_the_aerostatic_companies_desc: "Our captive balloons go out with the great manoeuvres, hang above the gun line for a morning and are handed back to the fortress stores. We must put the aerostatic companies on a standing establishment, with their own gas, drivers and winches."
 ITADNC_air_the_yard_at_vigna_di_valle: "The Yard at Vigna di Valle"
 ITADNC_air_the_yard_at_vigna_di_valle_desc: "On the lake at Bracciano there is sheltered water, level ground and room for a shed, and no other site in the Kingdom will serve for trials. We must open the experimental yard there and build our airships where we can watch them fly."
 ITADNC_air_the_dirigible_of_schio: "The Dirigible of Schio"
 ITADNC_air_the_dirigible_of_schio_desc: "A gentleman of Vicenza has built an airship on his own money, flown it above Schio and offered it to the Ministry, which declined it. We must take the gift, bring his hull into our shed and pay the men who understand how it was made."
 ITADNC_air_the_wireless_aloft: "The Wireless Aloft"
 ITADNC_air_the_wireless_aloft_desc: "An airship that sees the enemy and cannot tell anyone is worth a cavalry patrol and no more. We must put a wireless set and a trained operator in every car we send up, and teach the ground stations to take down what they send."
 ITADNC_air_the_directorate: "The Directorate of Aeronautics"
 ITADNC_air_the_directorate_desc: "The air belongs to the Engineers, and the Engineers answer for bridges and roads before they answer for machines. We must cut a directorate of aeronautics out of the corps and give it the estimates, the schools and the yards in its own name."
 ITADNC_air_the_school_of_the_eye: "The School of the Eye"
 ITADNC_air_the_school_of_the_eye_desc: "The staff will grant the flying machine one duty only, to see for the guns and report what it sees. We must teach observation and the correction of fire until the balloon and the airship are the eye of the artillery and of the fleet."
 ITADNC_air_the_school_of_the_airship: "The School of the Airship"
 ITADNC_air_the_school_of_the_airship_desc: "The semi-rigid of Crocco and Ricaldoni has come up over Rome, and Forlanini has flown his own above Milan. We must train the dirigibilisti in numbers, keep both designs alive and build the sheds that will hold what they fly."
 ITADNC_air_the_school_of_the_bomb: "The School of the Bomb"
 ITADNC_air_the_school_of_the_bomb_desc: "Officers write in the Rivista that a machine which carries an explosive is worth more than one that only watches, and the Ministry will not hear it. We must teach the drop, order the cases and the sights, and learn on our own ground what a bomb from the air can do."
 ITADNC_air_the_defence_of_the_kingdom: "The Defence of the Kingdom"
 ITADNC_air_the_defence_of_the_kingdom_desc: "The memoranda of the Engineers set it down as a principle that the Kingdom can be reached from above, and nobody will pay for the answer. We must plan the defence of our own sky, name the cities that must be covered and buy guns that can be laid on a machine."
 ITADNC_air_the_sheds_on_the_far_shore: "The Sheds on the Far Shore"
 ITADNC_air_the_sheds_on_the_far_shore_desc: "An airship that must come home to the lagoon each evening can watch the mouth of the Adriatic and never the coast beyond it. The staff would have sheds on the eastern shore, and we must survey the ground and the moorings while the question is still ours."
 ITADNC_air_the_night_and_the_beam: "The Night and the Beam"
 ITADNC_air_the_night_and_the_beam_desc: "Men have gone up from Vigna di Valle after dark with a searchlight following them, and written nothing down because nobody asked them to. We must make night flying a programme, give the crews the beam and the compass, and find out what the dark costs us."
 ITADNC_air_the_circuit_at_brescia: "The Circuit at Brescia"
 ITADNC_air_the_circuit_at_brescia_desc: "Every maker in Europe will fly at the meeting on the Lombard plain, and our own workshops will stand beside them or be seen not to. We must send the Ministry to Brescia with money in hand and buy from the houses whose machines finish the circuit."
 ITADNC_n_the_ideal_battleship: "The Ideal Battleship"
 ITADNC_n_the_ideal_battleship_desc: "Cuniberti has drawn a ship that carries one calibre in a dozen mountings and outranges everything afloat, and the estimates cannot pay for her. We must keep the drawings, let him publish abroad what we will not build, and set the office to work on the next hull."
 ITADNC_n_the_yards_of_the_kingdom: "The Yards of the Kingdom"
 ITADNC_n_the_yards_of_the_kingdom_desc: "La Spezia, Venice, Castellammare and Taranto are the largest works we own, and half their slips stand idle between votes. We must keep the state arsenals in steady work, enlarge the basins and let the private houses build alongside them."
 ITADNC_n_the_fleet_of_battle: "The Fleet of Battle"
 ITADNC_n_the_fleet_of_battle_desc: "Masdea's ships at Castellammare are the fastest capital ships afloat, and scattered between four seas they are worth nothing. We must build the line, keep it together, and settle at last that the Regia Marina is a fleet of battle and not a squadron of raiders."
 ITA_air_the_specialist_brigade_tt: "The aeronautical section answers to the Brigade alone, and every field, yard and school that follows will be raised under it."
 ITA_air_the_field_at_centocelle_tt: "Calderara and Savoia are brevetted, and the field outside Rome becomes the first flying ground of the Kingdom."
 ITA_air_the_aerostatic_companies_tt: "The balloon companies keep their own establishment, and the Engineers no longer borrow them back from the fortresses."
 ITA_air_the_yard_at_vigna_di_valle_tt: "The experimental yard on the lake takes the trials, the drawing office and the gas plant into one hand."
 ITA_air_the_wireless_aloft_tt: "Every car that goes up carries a set, and the ground stations are trained to take down what it sends."
 ITA_air_the_directorate_tt: "Aeronautics leaves the Engineers and votes its own estimates. Should the prefects be instructed, the Ministry takes the directorate back."
 ITA_air_the_school_of_the_eye_tt: "The observers pass out qualified to lay a battery from the air and to report for the fleet."
 ITA_air_the_school_of_the_airship_tt: "The dirigibilisti are trained in numbers, and both the semi-rigid and the Forlanini hull stay on the strength."
 ITA_air_the_school_of_the_bomb_tt: "The school teaches the drop and the sight, and the Ministry buys the cases it has always refused."
 ITA_air_the_seaplane_station_tt: "The station opens on water the fleet already holds, with slipway, crane and moorings for the machines."
 ITA_air_the_defence_of_the_kingdom_tt: "The sky over the Kingdom becomes a charge of the Ministry, and the cities that must be covered are named."
 ITA_air_the_orders_of_the_ministry_tt: "Types, numbers and deliveries are fixed ahead, and a maker can lay out a shop knowing we shall still be buying."
 ITA_air_the_sheds_on_the_far_shore_tt: "The ground and the moorings on the eastern shore are surveyed, and the sheds are drawn before anyone else asks for them."
 ITA_air_the_memoranda_of_douhet_tt: "The memoranda are read to the end and answered in print, and the air becomes a subject the staff must argue about."
 ITA_air_the_engine_that_is_ours_tt: "The motor houses of Turin and Milan take the aero contracts, and the French licence stops being the only offer."
 ITA_air_the_circuit_at_brescia_tt: "The Ministry buys at the meeting from the houses whose machines finish, and the workshops that fly there keep the orders."
 ITA_n_the_naval_estimates_tt: "The Marine states what it is buying before it buys, and the vote is written against a plan and not against a hull."
 ITA_n_the_ideal_battleship_tt: "The design office keeps the single calibre drawings, and what we will not build is published where it will be read."
 ITA_n_the_ideal_battleship_lock_tt: "The war on trade has the estimates. Let its own school finish, or leave it untaken, before the line is drawn again."
 ITA_n_the_yards_of_the_kingdom_tt: "The state arsenals are kept in work between votes, and the basins are enlarged for the hulls we mean to lay."
 ITA_n_the_naval_flying_service_tt: "The fleet gets its own flying station and its own observers. Complete the fleet of battle and this door closes for good."
 ITA_n_the_dante_alighieri_tt: "The first dreadnought we have designed and built ourselves goes down at Castellammare. Complete the fleet of battle and this door closes for good."
 ITA_n_the_fleet_of_battle_tt: "The high seas school carries the Marine, and the Consulta will read the answer whenever it weighs a war. The flying service and the Dante are given up for it."
 ITA_air_the_wireless_aloft_ns: "Wireless Aloft"
 ITA_air_the_defence_of_the_kingdom_ns: "The Defence of the Kingdom"
 ITA_air_the_sheds_on_the_far_shore_ns: "Sheds on the Far Shore"
 ITA_air_the_night_and_the_beam_ns: "The Night and the Beam"
 ITA_air_the_memoranda_of_douhet_ns: "The Memoranda of Douhet"
 ITADNC_n_the_war_on_trade: "The War on Trade"
 ITADNC_n_the_war_on_trade_desc: "The Rivista Marittima has argued for a decade that a poor navy sinks cargoes and does not seek battle. We shall fit the fleet for the guerra di corsa and leave the line of battle to the powers who can pay for one."
 ITADNC_n_the_naval_staff: "The Naval Staff"
 ITADNC_n_the_naval_staff_desc: "Every squadron sails to an order written in the minister's own hand, and nobody at the Marine keeps a war plan from one ministry to the next. We must raise a Stato Maggiore by royal decree and let sailors plan the naval war."
 ITADNC_n_the_landing_companies: "The Landing Companies"
 ITADNC_n_the_landing_companies_desc: "The companies from the Elba held the legations at Peking, and the first men ashore in the ruins of Messina were ours. We shall train the landing companies properly, so the fleet can put a battalion on any beach it can reach."
 ITADNC_n_the_bases_beyond_the_strait: "The Bases Beyond the Strait"
 ITADNC_n_the_bases_beyond_the_strait_desc: "The arsenal and the graving dock at Taranto stand open, and the squadron still winters where the Tyrrhenian is comfortable. We must move the base of the squadron into the lower Adriatic and keep the fleet where the war will be."
 ITADNC_n_the_adriatic_is_ours: "The Adriatic Is Ours"
 ITADNC_n_the_adriatic_is_ours_desc: "From Venice to Otranto our shore is low and without shelter, and theirs is a wall of islands with Pola, Sebenico and the Bocche behind it. We shall hold the far side of the water, and the Adriatic will have two coasts at last."
 ITADNC_n_the_middle_sea: "The Middle Sea"
 ITADNC_n_the_middle_sea_desc: "The Lega Navale has taught a generation to call this water ours, and the fleet can at last say the same without blushing. We shall keep the middle sea, and no squadron will cross it against our will."
 ITADNC_n_the_cruiser_squadron: "The Cruiser Squadron"
 ITADNC_n_the_cruiser_squadron_desc: "Ansaldo has laid down ten Garibaldi hulls and sold seven of them abroad, and the three we kept are the best ships in our line. We shall order the rest for ourselves and pay for the yard that can repeat them."
 ITADNC_n_the_armoured_raiders: "The Armoured Raiders"
 ITADNC_n_the_armoured_raiders_desc: "The armoured cruisers we design for foreign buyers are built for the trade routes and not for the line of battle. We must arm our own to the same drawing and send them where the cargoes are."
 ITADNC_n_the_flotilla_at_night: "The Flotilla at Night"
 ITADNC_n_the_flotilla_at_night_desc: "The Lampo and Nembo boats can cross the Adriatic between dusk and dawn, and the Whitehead works at Fiume sells us the torpedo under licence. We shall drill the flotillas for night work and buy the torpedo by the hundred."
 ITADNC_n_the_submarine_flotilla: "The Submarine Flotilla"
 ITADNC_n_the_submarine_flotilla_desc: "Laurenti has drawn the Glauco boats, and Pullino's Delfino has proved a double hull that foreign yards already want under licence. We must build the flotilla for ourselves before we sell the drawings abroad."
 ITADNC_n_the_flotilla_unleashed: "The Flotilla Unleashed"
 ITADNC_n_the_flotilla_unleashed_desc: "The war on trade has been argued in the reviews with every restriction attached to it, and the restrictions are what make it useless. We shall let the flotillas take a cargo wherever they find one and answer for it afterwards."
 ITADNC_e_the_extraordinary_estimates: "The Extraordinary Estimates"
 ITADNC_e_the_extraordinary_estimates_desc: "The ordinary budget closes in surplus every year and pays for nothing that a war would need. We shall vote a second budget apart from the first, and the ministries of war and marine will spend out of it."
 ITADNC_e_the_tariff_kept: "The Tariff Kept"
 ITADNC_e_the_tariff_kept_desc: "The South asks that the tariff be opened and the ironmasters of the North ask that it be kept entire. We shall keep it entire, and the mills will take the whole home market whether they have earned it or not."
 ITADNC_e_the_consumption_duties: "The Consumption Duties"
 ITADNC_e_the_consumption_duties_desc: "The dazi are levied at the gate of every city, and the poor pay them on bread, salt and oil before they pay anything else. We must press the duties harder to hold the estimates, and the towns will know whose hand is in their pocket."
 ITADNC_e_the_steel_consortium: "The Steel Consortium"
 ITADNC_e_the_steel_consortium_desc: "Elba, Ilva, Terni and Piombino bid against one another for the same ore and then for the same state order. We shall bring them under one agreement, and the kingdom will have a steel industry instead of four foundries."
 ITADNC_e_the_industries_of_the_colonies: "The Industries of the Colonies"
 ITADNC_e_the_industries_of_the_colonies_desc: "The Benadir Company has run the coast at a loss and asks the Treasury to cover the deficit once again. We must buy the company out and work the colonies as an estate of the kingdom."
 ITADNC_e_the_current_instead_of_coal: "The Current Instead of Coal"
 ITADNC_e_the_current_instead_of_coal_desc: "Nine tenths of our coal crosses the sea from Cardiff, while the Alps run white water the whole year for nothing. We shall build for the current instead, and let the carbone bianco carry what the coal cannot."
 ITADNC_e_the_sulcis_pits: "The Sulcis Pits"
 ITADNC_e_the_sulcis_pits_desc: "The seams at Bacu Abis are thin and the coal is poor, and the press calls it carbone nazionale all the same. We must open the Sulcis pits, because a bad mine at home outlasts a good one behind a blockade."
 ITADNC_e_the_electric_furnace: "The Electric Furnace"
 ITADNC_e_the_electric_furnace_desc: "Stassano has patented a furnace that makes steel out of current and scrap without a ton of coke. We shall set his furnaces to work at Turin and cast the steel our blast furnaces cannot."
 ITADNC_e_the_kingdom_supplies_itself: "The Kingdom Supplies Itself"
 ITADNC_e_the_kingdom_supplies_itself_desc: "The pits, the furnaces and the colonies now answer for what the extraordinary estimates promised, and the drafts drawn against them can be met. We shall close the account, and the kingdom will owe its own industry nothing."
 ITADNC_e_the_estimates_raised: "The Estimates Raised"
 ITADNC_e_the_estimates_raised_desc: "The Chamber has voted the naval programme, and the War Ministry asks for its own increase in the same session. We shall raise the military estimates together and let the orders follow them out of the ministries."
 ITADNC_e_the_orders_are_concentrated: "The Orders Are Concentrated"
 ITADNC_e_the_orders_are_concentrated_desc: "Every corps command buys its own stores, and the Treasury learns the total only when the bills arrive. We must concentrate the military orders in a single book, and the arsenals will know what they are building."
 ITADNC_e_the_programme_of_construction: "The Programme of Construction"
 ITADNC_e_the_programme_of_construction_desc: "The naval programme is voted and the armour for it must come from Terni under an English licence. We shall lay the hulls down at once and let the plate follow them out of the rolling mill."
 ITADNC_e_the_council_of_supply: "The Council of Supply"
 ITADNC_e_the_council_of_supply_desc: "The ministries bid against one another for the same steel, the same rails and the same hands, and the war has made the bidding ruinous. We must put a superior council over the supply of the kingdom, and no ministry will order outside it."
 ITADNC_e_the_undersecretariat_of_arms: "The Undersecretariat of Arms"
 ITADNC_e_the_undersecretariat_of_arms_desc: "The arsenals answer to the War Ministry, the yards answer to the Marine, and nobody answers for the cartridge. We shall create an undersecretariat for arms and munitions and give it the whole account."
 ITADNC_e_the_unified_types: "The Unified Types"
 ITADNC_e_the_unified_types_desc: "The army carries three rifles, the batteries fire four cartridges, and the depots sort them by hand. We must settle one rifle, one gun and one cartridge, and every works in the kingdom will make them."
 ITADNC_e_the_whole_kingdom_mobilised: "The Whole Kingdom Mobilised"
 ITADNC_e_the_whole_kingdom_mobilised_desc: "Nothing in this decade has prepared the country to put its whole industry under the War Ministry, and the war will not wait for us to learn. We shall mobilise the kingdom entire, and the works that made ploughs will make shells."
 ITA_n_the_narrow_sea_school_tt: "§Y$ITADNC_n_the_ideal_battleship$§! stays closed until §Y$ITADNC_n_the_flotilla_unleashed$§! is completed. The Consulta will be told that the narrow sea school has carried the argument."
 ITA_n_the_squadron_moves_south_tt: "Every core coastal state that already keeps a §Y$naval_base$§!: add §G1§! §Y$naval_base$§!."
 ITA_n_an_island_beyond_otranto_tt: "§Y[ROOT.GetName]§! or an Italian subject fully controls an island beyond the Strait of Otranto"
 ITA_n_the_coast_that_answers_tt: "Every core coastal state: add §G1§! §Y$coastal_bunker$§!."
 ITA_n_the_line_school_opens_tt: "§Y$ITADNC_n_the_ideal_battleship$§! is open again."
 ITA_e_the_rendita_limit_tt: "The §Yservice of the debt§! is under §Y90%§!"
 ITA_e_rendita_risen_tt: "The §Yservice of the debt§! grows heavier, and stands at §R[?ITA_e_rendita|%0]§!."
 ITA_e_the_treasury_goes_to_war_tt: "§RRemove§! §Y$ITA_e_the_consolidated_five_per_cent$§!. Gain §Y$ITA_e_the_war_treasury$§!, and the pareggio is closed to us."
 ITA_e_the_drift_is_slowed_tt: "§GReduce§! the monthly growth of the §Yservice of the debt§! by §Y0.5%§!."
 ITA_e_the_debt_is_cleared_tt: "§RRemove§! §Y$ITA_e_the_war_treasury$§!. Gain §Y$ITA_e_the_kingdom_solvent_mod$§!, and the §Yservice of the debt§! falls to §G0%§!."
 ITA_e_the_tariff_holds_tt: "§RLock§! §Y$free_trade$§! and §Y$export_focus$§!. Gain §Y$closed_economy$§!."
 ITA_e_the_law_that_follows_tt: "Having §Y$partial_economic_mobilisation$§! enabled will change the Economy Law to §Y$war_economy$§! if it is available."
 ITA_e_the_whole_kingdom_mobilised_tt: "§RRemove§! the standing Economy Law. Gain §Y$tot_economic_mobilisation$§!."
 ITA_n_the_staff_of_the_marine: "The Staff of the Marine"
 ITA_n_the_staff_of_the_marine_improved: "The Staff That Plans the War"
 ITA_n_the_night_flotillas: "The Night Flotillas"
 ITA_n_the_glauco_boats: "The Glauco Boats"
 ITA_n_the_guerre_de_course: "The Guerra di Corsa"
 ITA_n_the_guerre_de_course_desc: "Our cruisers and our flotillas are fitted to hunt cargoes rather than to hold a line, and the line of battle has been let go."
 ITA_n_mare_nostrum: "Mare Nostrum"
 ITA_n_mare_nostrum_desc: "The fleet keeps the middle sea from the Bocche to the Sicilian narrows, and the Lega Navale has taught the country to call that water ours."
 ITA_e_the_tariff_of_eighty_seven: "The Tariff of Eighty-Seven"
 ITA_e_the_tariff_of_eighty_seven_desc: "The tariff stands entire and the mills take the home market whole. Our customers abroad have noticed, and they say so."
 ITA_e_the_unified_types: "One Rifle, One Gun, One Cartridge"
 ITA_e_the_kingdom_in_arms: "The Kingdom in Arms"
 ITADNC_e_the_pareggio: "The Budget in Balance"
 ITADNC_e_the_pareggio_desc: "Years of extraordinary estimates have left the Kingdom paying its creditors before it pays its own people. We shall close the extraordinary budget, meet the interest out of the ordinary revenue, and let the country grow before the army does."
 ITADNC_e_the_lira_at_par: "The Lira at Par"
 ITADNC_e_the_lira_at_par_desc: "Our paper is taken abroad at a discount, and every cargo we buy is dearer for it. The first step out of our difficulties must be to make the lira worth abroad what it is worth at home."
 ITADNC_e_the_sgravi: "Relief from the Taxes"
 ITADNC_e_the_sgravi_desc: "The burden of the consumption taxes has grown heavier every year that the estimates have grown. Lifting part of it will cost the Treasury for a season, but our people must be left more of their own money to spend."
 ITADNC_e_the_duty_on_bread_repealed: "Repeal the Duty on Bread"
 ITADNC_e_the_duty_on_bread_repealed_desc: "The duty on foreign grain was laid to shelter our landowners and it has stayed to feed the Treasury, and it is paid at the baker's door in every town of the South. We shall strike it from the tariff and let bread find its own price."
 ITADNC_e_the_commercial_treaties: "The Commercial Treaties"
 ITADNC_e_the_commercial_treaties_desc: "If our people are to thrive we must sell abroad what we grow and buy abroad what we cannot dig. We shall put our name to new treaties of commerce with our neighbours, treaties written to suit us."
 ITADNC_e_the_workmens_houses: "Houses for the Working People"
 ITADNC_e_the_workmens_houses_desc: "The men who fill our new works sleep in courts that no inspector will enter. We shall charter societies to build them decent lodgings, and set a standard of living the Kingdom can be shown for."
 ITADNC_e_the_boards_of_conciliation: "The Boards of Conciliation"
 ITADNC_e_the_boards_of_conciliation_desc: "Every dispute in our works ends in the street because there is no room where it can end otherwise. We shall seat masters and men at the same table before the prefect must send anyone at all."
 ITADNC_e_the_industrial_triangle: "The Industrial Triangle"
 ITADNC_e_the_industrial_triangle_desc: "Turin, Milan and Genoa now make between them more than the rest of the Kingdom together. We shall be known for the quality of what comes out of that triangle, or we shall not be known at all."
 ITADNC_e_the_ilva_at_piombino: "The Ilva at Piombino"
 ITADNC_e_the_ilva_at_piombino_desc: "The ore of Elba is shipped abroad to come back as rails we pay for twice. A company shall be chartered to smelt it on our own shore, and the furnaces shall stand at Piombino."
 ITADNC_e_the_land_reclaimed: "The Land Reclaimed"
 ITADNC_e_the_land_reclaimed_desc: "Half the plain of the Kingdom is marsh, and the men who might work it are on the quay at Genoa with a ticket in their hand. We shall drain it, teach it and put a road through it, and the whole nation will be the better for it."
 ITADNC_e_the_cities_that_swell: "The Cities That Swell"
 ITADNC_e_the_cities_that_swell_desc: "The machines we have put in the fields have freed more hands than the fields ever held, and those hands are walking to Turin and to Naples. They will find work in our shops, and our shops must be made ready for them."
 ITADNC_e_the_kingdom_solvent: "The Kingdom Solvent"
 ITADNC_e_the_kingdom_solvent_desc: "Our lira stands at par, our rentes have come home from Paris, and the houses that would not lend to us before now offer on our own terms. The Kingdom is solvent, and every office in Europe has had to say so in print."
 ITADNC_e_the_orders_of_the_state: "The Orders of the State"
 ITADNC_e_the_orders_of_the_state_desc: "Everything our great works have learned, they learned filling an order signed by a ministry. We shall place those orders in one book and on one calendar, and the lines will never stand idle again."
 ITADNC_e_the_arsenals_enlarged: "Enlarge the Arsenals"
 ITADNC_e_the_arsenals_enlarged_desc: "Having at last put our finances in order, we may turn to the safety of what we have built. The arsenals of Spezia, Turin and Pozzuoli shall be enlarged, and what the Kingdom needs the Kingdom shall make."
 ITADNC_e_the_kingdom_at_war_pays: "The Kingdom at War Pays"
 ITADNC_e_the_kingdom_at_war_pays_desc: "War has come to us after all, and every lira saved in a decade of careful budgets will be spent in a single year. We shall spend it well, and outbuild whoever thought a patient country could not fight."
 ITADNC_e_the_railways_of_the_state: "The Railways of the State"
 ITADNC_e_the_railways_of_the_state_desc: "The companies have run our lines for a generation, and every year the State has paid for the track while they took the fare. The network is ours now; what remains is to make it worth having."
 ITADNC_e_the_simplon_is_opened: "The Simplon Is Opened"
 ITADNC_e_the_simplon_is_opened_desc: "The longest tunnel in the world runs under the Alps and it opens on our side. It is the shortest road our goods have ever had to the markets of the north, and we must make our own approaches worthy of it."
 ITADNC_e_the_coal_contract: "The Coal Contract"
 ITADNC_e_the_coal_contract_desc: "We have no coal, and every furnace, every locomotive and every boiler in the fleet burns what comes over the sea from the Welsh pits. A standing contract would end the yearly scramble, and put our boiler rooms in another man's hand."
 ITADNC_e_the_rolling_stock_orders: "The Rolling Stock Orders"
 ITADNC_e_the_rolling_stock_orders_desc: "The lines are ours and they are worked with engines bought abroad. We must build our own and give the work to our own shops, whatever the estimates say it costs."
 ITADNC_e_the_line_to_the_south: "The Line to the South"
 ITADNC_e_the_line_to_the_south_desc: "The trains that go south still go the long way round, and a regiment sent to Naples spends a day and a night doing it. A direct line would carry our goods, and our soldiers, at twice the speed."
 ITADNC_e_the_line_to_the_north: "The Line to the North"
 ITADNC_e_the_line_to_the_north_desc: "Between Bologna and Florence our goods climb a mountain by a road built for mules. A direct line through it must be cut, to bind the north of the Kingdom to the centre and bring the Alps nearer."
 ITADNC_e_the_polytechnic: "The Polytechnic"
 ITADNC_e_the_polytechnic_desc: "Our works are run by men who learned their trade in Zurich and in Charlottenburg, because there is nowhere here to learn it. We shall found a school of our own, with laboratories and a workshop, and keep the next generation at home."
 ita_dnc.2930.t: "A Standing Contract for Coal"
 ita_dnc.2930.d: "The Italian ambassador has laid a proposal on the table: a fixed tonnage every year out of the Welsh pits, at a price agreed for the term of the charter. Our owners would have a buyer who never haggles and never fails to pay. But a kingdom that need not worry about its boilers is a kingdom free to think about the sea."
 ita_dnc.2930.a: "Their furnaces and our pits both stand to gain."
 ita_dnc.2930.b: "Coal is the one thing we shall not sell cheaply."
 ita_dnc.2931.t: "The Charter Is Signed"
 ita_dnc.2931.d: "The contract is initialled and the first colliers are already loading. Our furnaces, our locomotives and the boiler rooms of the fleet are provided for at a price we know in advance. The yearly scramble in the coal market is over, and the brokers who lived on it will not thank us."
 ita_dnc.2931.a: "The boiler rooms may rest easy."
 ita_dnc.2932.t: "The Charter Refused"
 ita_dnc.2932.d: "The answer is that the pits will not be bound. They will sell to us as they always have, cargo by cargo and at whatever the season asks, and every rise in the market will be felt in our works within the month. We shall pay it, because there is nowhere else to buy."
 ita_dnc.2932.a: "Then we shall pay the market price."
 ITA_e_tt_luzzatti_at_the_treasury: "§YLuigi Luzzatti§! takes the Treasury, and may be hired as a §Ypolitical advisor§!."
 ITA_e_tt_pacelli_withdraws: "§RThe Banco di Roma withdraws§!: with the extraordinary estimates closed, §YErnesto Pacelli§! has no further business with the State."
 ITA_e_tt_the_credit_becomes_the_solvency: "Replace §YThe Credit Restored§! with §YThe Kingdom Solvent§!, effective change:"
 ITA_e_tt_the_credit_is_restored: "Replace §YThe Consolidated Five Per Cent§! with §YThe Credit Restored§!: the service of the debt stops climbing of itself."
 ITA_e_tt_the_note_falls_due: "§RThe holders must be paid at par§!: §YThe Conversion Pending§! is laid on the Treasury, and it lasts as long as our borrowing did."
 ITA_e_tt_the_wall_is_reached: "§RThe service of the debt has eaten the whole ordinary revenue§!: our factories and our slipways lose part of their output until it is brought down."
 ITA_e_tt_the_network_is_ours: "Bring §YInfrastructure§! to its full height in §YMilano§!, §YLiguria§!, §YEmilia Romagna§! and §YLatium§!, wherever we hold the ground."
 ITA_e_tt_the_line_to_the_south: "Raise §YInfrastructure§! in §YNapoli§!, §YPuglia§!, §YCalabria§! and §YSicily§! where we hold them, and lay a railway from the capital to Naples if we hold both ends."
 ITA_e_tt_the_line_to_the_north: "Raise §YInfrastructure§! in §YEmilia Romagna§!, §YTuscany§!, §YVeneto§! and §YFriuli§! where we hold them, and cut a railway through the mountain if we hold both ends."
 ITA_e_tt_if_they_accept: "\n§YEffects if they accept:§!"
 ITA_e_tt_war_cancels_the_charter: "A war between the two kingdoms cancels the charter."
 ITA_e_tt_the_capital_answers: "§YLondon will answer in its own time.§!"
 ITA_e_modify_the_consolidated_tt: "Modify §YThe Consolidated Five Per Cent§! by:"
 ITA_e_modify_the_war_treasury_tt: "Modify §YThe War Treasury§! by:"
 ITA_e_modify_the_credit_restored_tt: "Modify §YThe Credit Restored§! by:"
 ITA_e_modify_the_kingdom_solvent_tt: "Modify §YThe Kingdom Solvent§! by:"
 ITA_e_rendita_tt: "§YService of the debt§!: §R[?ITA_e_rendita|%0]§! of what our works produce is spoken for before we spend a lira."
 ITA_e_rendita_eased_tt: "The §Yservice of the debt§! is eased, and stands at §Y[?ITA_e_rendita|%0]§!."
 ITA_e_the_bread_is_cheaper_tt: "Bread is cheaper, and the §Ypiazza§! is quieter by as much."
 ITA_e_the_treaties_are_signed_tt: "Our works buy their raw materials abroad on better terms."
 ITA_e_the_yards_work_faster_tt: "Everything the Kingdom builds goes up faster."
 ITA_e_the_drawing_office_tt: "Our research goes faster."
 ITA_e_the_ore_stays_home_tt: "More is drawn from the resources we hold ourselves."
 ITA_e_the_book_is_full_tt: "A shortage of raw materials costs our lines less."
 ITA_e_the_shops_change_hands_tt: "Turning a civilian shop over to war work costs less."
 ITA_e_the_shops_grow_tt: "Our §Yfactories§! give more."
 ITA_e_the_slips_grow_tt: "Our §Ydockyards§! give more."
 ITA_e_the_line_reaches_further_tt: "A production line reaches a higher efficiency."
 ITA_e_the_line_settles_sooner_tt: "A production line gains its efficiency faster."
 ITA_e_the_line_starts_higher_tt: "A production line starts at a higher efficiency."
 ITA_e_the_line_changes_cheaper_tt: "Changing what a line makes costs less efficiency."
 ITA_e_the_military_works_slow_tt: "Arms factories are built more slowly."
 ITA_e_the_slips_work_slow_tt: "Dockyards are built more slowly."
 ITA_e_the_books_are_open_tt: "The syndicate that places our rente abroad reads the books of the Treasury."
 ITA_e_the_consolidated_five_per_cent: "The Consolidated Five Per Cent"
 ITA_e_the_consolidated_five_per_cent_desc: "The rente is placed in Paris and in London, and the interest is met before anything else is paid. Every month that we go on borrowing, a little more of what our works produce is spoken for."
 ITA_e_the_war_treasury: "The War Treasury"
 ITA_e_the_war_treasury_desc: "The Kingdom has chosen to go on borrowing while it arms. The lenders are willing, the works are busy, and the interest climbs every month."
 ITA_e_the_credit_restored: "The Credit Restored"
 ITA_e_the_credit_restored_desc: "The extraordinary budget is closed and the service of the debt no longer climbs of itself. What is owed is still owed, and the holders must one day be paid at par."
 ITA_e_the_kingdom_solvent_mod: "The Kingdom Solvent"
 ITA_e_the_kingdom_solvent_mod_desc: "The rente has come home and been converted on our own terms. The Kingdom borrows as a solvent state borrows, and its works answer for it."
 ITA_e_a_power_that_makes_things: "A Power That Makes Things"
 ITA_e_a_power_that_makes_things_desc: "We were a great power on paper, with a seat at every table and nothing in our hands. The triangle now makes what the Kingdom needs, and the paper has something behind it."
 ITA_e_the_conversion_pending: "The Conversion Pending"
 ITA_e_the_conversion_pending_desc: "The Treasury must stand ready to redeem at par every holder who refuses the new rate. Until the operation is closed the money is held, and it cannot be spent twice."
 ITA_e_the_coal_charter_ns: "The Italian Coal Charter"
 ITA_e_the_coal_charter_ns_desc: "A fixed tonnage goes south every year at a price agreed for the term. It is a good trade, and it is a hold on a kingdom that has no pits of its own."
 ITADNC_h_the_works_on_the_frontier: "The Works on the Frontier"
 ITADNC_h_the_works_on_the_frontier_desc: "The passes above the Piave and the Tagliamento have been left open since the alliance was signed, and our engineers are forbidden to lay a single stone there. The Kingdom is a sovereign state and may fortify any ground that is its own. Let the works begin, and let those who object read the treaty again."
 ITADNC_h_the_army_is_paid: "The Army Is Paid"
 ITADNC_h_the_army_is_paid_desc: "A subaltern of the line cannot keep a decent coat on his back out of what the Treasury allows him, and the general staff knows it better than the Chamber does. We shall carry the army bills entire and raise the pay before we raise a single regiment."
 ITADNC_h_the_state_stands_aside: "The State Stands Aside"
 ITADNC_h_the_state_stands_aside_desc: "The prefects ask us again whether they may dissolve the chambers of labour and put the troops in the squares. The answer is no. Where the law is not broken the State has no side to take, and a strike that is allowed to end is a strike that ends. Those who cannot govern without the bayonet may resign."
 ITADNC_h_the_prefects_are_instructed: "The Prefects Are Instructed"
 ITADNC_h_the_prefects_are_instructed_desc: "A government that watches a general strike from the window is not a government. The circular goes out tonight: the chambers of labour are closed where they preach sedition, the leagues are dissolved, and the prefect who hesitates is replaced by one who does not. Order first; the rest will follow."
 ITADNC_h_the_corps_for_china: "The Corps for China"
 ITADNC_h_the_corps_for_china_desc: "Our expeditionary corps has gone ashore beside the other powers and the legations are still holding. We shall keep it in the field until the rising is broken, and we shall come home with a concession of our own on that coast."
 ITADNC_h_the_oath_before_the_king: "The Oath Before the King"
 ITADNC_h_the_oath_before_the_king_desc: "The army swore to the King and to the Statute, and it did not swear to whatever majority happens to sit in Montecitorio this season. That oath shall be read aloud in every barracks, seniority shall govern promotion, and the officer who wants a party may resign his commission."
 ITADNC_h_the_schools_are_left_alone: "The Schools Are Left Alone"
 ITADNC_h_the_schools_are_left_alone_desc: "The war school at Turin trains the men who will draw our plans, and the ministry rewrites its syllabus every time a deputy complains of it. We shall leave the school to its own professors and let doctrine be argued out by soldiers."
 ITADNC_h_the_reserve_is_prepared: "The Reserve Is Prepared"
 ITADNC_h_the_reserve_is_prepared_desc: "The staff has done the arithmetic of mobilisation, and the answer is that our depots run empty in a fortnight. We shall fill them now and quietly, so that the next war finds the reserve clothed and fed instead of waiting on a platform."
 ITADNC_h_the_colonial_office: "The Colonial Office"
 ITADNC_h_the_colonial_office_desc: "Our colonial business is run by a bureau of the Consulta that answers to no one and is outgrown by every dispatch it opens. We shall raise it into a central directorate with its own governors and its own estimates, and let a ministry of colonies grow out of it."
 ITADNC_h_the_companies_of_discipline: "The Companies of Discipline"
 ITADNC_h_the_companies_of_discipline_desc: "Every regiment keeps a handful of men it cannot use and may not discharge, and they cost the Treasury as much as soldiers do. We shall gather them into companies of discipline and set them to the roads, the forts and the colonies."
 ITADNC_h_the_schools_of_the_corps: "The Schools of the Corps"
 ITADNC_h_the_schools_of_the_corps_desc: "Half the conscripts who come to us cannot read the order pinned to the barrack door. We shall reopen the regimental schools and teach them their letters before we teach them fire control, because a soldier who can read a map is worth two who cannot."
 ITADNC_h_the_office_of_reserved_affairs: "The Office of Reserved Affairs"
 ITADNC_h_the_office_of_reserved_affairs_desc: "The reserved office of public security and the information office of the staff have never once compared their files. We shall put them under one roof and give them the money they have been begging for, and we shall expect to know what our enemies intend before they do it."
 ITADNC_h_the_understanding_with_vienna: "The Understanding with Vienna"
 ITADNC_h_the_understanding_with_vienna_desc: "The alliance has held for twenty years and it has cost us nothing but the patience of our newspapers. Vienna will renew it early and without conditions if we ask before the nationalists do. Let the treaty be signed again, and let the Littoral wait."
 ITADNC_h_the_ascari_are_enrolled: "The Ascari Are Enrolled"
 ITADNC_h_the_ascari_are_enrolled_desc: "The colonial corps in Eritrea is the only body of ours with recent experience of battle, and the ministry of war and the Consulta are still quarrelling over who commands it. We shall settle it by enrolling the ascari properly, in their own battalions and their own irregular bands."
 ITADNC_h_the_new_arms: "The New Arms"
 ITADNC_h_the_new_arms_desc: "The artillery commissions have reported and the verdict is plain: our batteries are a generation behind and our infantry has no machine guns at all. We shall order the quick-firing gun, buy the machine gun abroad where we must, and keep the experimental works running."
 ITADNC_h_the_grain_and_the_coal: "The Grain and the Coal"
 ITADNC_h_the_grain_and_the_coal_desc: "Nearly every ton of coal we burn is landed from Cardiff and much of the bread we eat is grown abroad. We shall build the magazines of the State and sign the shipping conventions in advance, so that a blockade takes months to bite instead of weeks."
 ITADNC_h_the_men_in_the_cafes: "The Men in the Cafes"
 ITADNC_h_the_men_in_the_cafes_desc: "The central political register holds the name of every subversive who has ever left the Kingdom, and our consulates keep paid informers in the cafes where they gather. We shall pay them better and place them where the exiles actually talk."
 ITADNC_h_the_integration_of_the_littoral: "The Integration of the Littoral"
 ITADNC_h_the_integration_of_the_littoral_desc: "Our workmen build the Monarchy ships and our ports carry its trade, and the customs line between us costs both capitals more than it earns either. We shall propose a customs and railway union of the Littoral, and take the industry by treaty rather than by claim."
 ITADNC_h_the_yards_of_trieste: "The Yards of Trieste"
 ITADNC_h_the_yards_of_trieste_desc: "The technical works at Trieste and the torpedo yard at Fiume are the most modern war industry within our reach, and they are in our hands at last. We shall keep the drawing offices intact, enlarge the slipways, and let the men who built for Vienna build for us."
 ITA_h_frontier_ultimatum_tt: "§RThe works may be halted if we are confronted and give way.§!"
 ITA_h_may_provoke_hostility_tt: "§RThis may provoke hostility.§!"
 ITA_h_army_advisor_cp_tt: "Command power cost of unit leaders serving as advisors: §G-15%§!"
 ITA_h_the_army_estimates_pass_tt: "The army estimates pass entire, and the general staff will speak to a ministry that has paid it."
 ITA_h_the_army_of_the_king_tt: "The §YArmy of the King§! grows with every measure the ministry carries for it, and the panel of the country shows what it is worth today."
 ITA_h_sacchi_is_offered_tt: "The radicals will support a ministry that keeps the troops out of the squares."
 ITA_h_salandra_stands_down_tt: "Salandra withdraws from the ministry and takes the constitutional right with him."
 ITA_h_the_squares_empty_tt: "The §YPiazza§! falls by five points as the strikes are allowed to end on their own."
 ITA_h_salandra_is_called_tt: "Salandra is called to the ministry, and the constitutional right comes with him."
 ITA_h_the_extreme_is_shut_out_tt: "Sacchi, Turati, Bissolati and Rigola are shut out of every ministry while the circular stands."
 ITA_h_the_prefects_rise_tt: "The §YPrefects§! gain ten points as the circular goes out over the ministry signature."
 ITA_h_the_volunteers_are_ashore_tt: "We have more than one volunteer contingent ashore in China."
 ITA_h_army_mobilization_tt: "Mobilisation speed: §G+10%§!"
 ITA_h_army_morale_tt: "Army morale: §G+10%§!"
 ITA_h_pollio_takes_the_oath_tt: "Pollio reads the oath at the head of the army and takes the offensive doctrine as his own."
 ITA_h_the_war_school_is_free_tt: "The war school sets its own syllabus, and its graduates argue land doctrine without a deputy in the room."
 ITA_h_reserve_tt: "§YNext time the Kingdom is at war:§!"
 ITA_h_the_colonial_office_tt: "Allows the formation of colonies, protectorates and administrative divisions in conquered territory, and the division of Africa into projected spheres of influence."
 ITA_h_the_discipline_divisions_tt: "Three divisions of discipline are raised in the capital under the locked template, and the cap holds at twelve."
 ITA_h_the_conscript_can_read_tt: "The regimental schools reopen, and the support arms find recruits who can read an order."
 ITA_h_the_reserved_office_tt: "The reserved office opens as an intelligence service, with one operative more and its upgrades a fifth faster."
 ITA_h_if_vienna_accepts_tt: "§YEffects if Vienna accepts:§!"
 ITA_h_the_capital_answers_tt: "§YThe Ballhausplatz will answer in its own time.§!"
 ITA_h_the_ascari_battalions_tt: "Four ascari battalions are raised in Eritrea, or in a home province if the colony is not ours to raise them in."
 ITA_h_the_experimental_batteries_tt: "The experimental batteries keep firing, and what they learn goes to the ordnance works."
 ITA_h_the_crown_is_humbled_tt: "The §YCrown§! loses ten points, and the reign remembers the humiliation."
 ITA_h_the_alliance_is_signed_tt: "The alliance is signed again, and the frontier is quiet for another decade."
 ITA_h_the_littoral_opens_tt: "The Littoral opens to our trade, and a civilian works is put up on the far side of the customs line."
 ITA_h_the_frontier: "the works above the Piave"
 ITA_h_the_schools_of_the_corps: "The Schools of the Corps"
 ITA_h_the_schools_are_left_alone: "The Schools Are Left Alone"
 ITA_h_the_new_arms: "The New Arms"
 ITA_h_the_army_of_the_king: "The Army of the King"
 ITA_h_the_army_of_the_king_desc: "What the ministry has carried for the army, added up. Every bill voted and every oath read makes the column a little heavier."
 ITA_h_the_colonial_office_modifier: "The Colonial Office"
 ITA_h_the_colonial_office_modifier_desc: "The central directorate keeps the accounts of the governorates. It is worth nothing on the day it opens and everything the governors make of it afterwards."
 ITA_h_the_frontier_armed: "The Armed Frontier"
 ITA_h_the_frontier_armed_desc: "The barrier works above the Piave are ours to build, and the engineers are laying stone in the passes at last. Our ally reads the treaty differently, and says so."
 ITA_h_the_works_halted: "The Works Halted"
 ITA_h_the_works_halted_desc: "We were confronted on the frontier and we gave way. The engineers have come down from the passes, and the Chamber wants to know who told them to go up."
 ITA_h_the_china_corps: "The Corps in China"
 ITA_h_the_china_corps_desc: "Two thousand men under a colonel of ours are serving beside the great powers, and what they learn there is worth more than the concession they will bring home."
 ITA_h_the_depots_are_full: "The Depots Are Full"
 ITA_h_the_depots_are_full_desc: "The stores were filled in peace and the reserve found them full. For once the recruits are clothed on the day they report."
 ITA_h_the_magazines_of_the_state: "The Magazines of the State"
 ITA_h_the_magazines_of_the_state_desc: "Grain in the state warehouses, coal contracted a season ahead, and shipping conventions signed before anyone needs them."
 ITA_h_the_reserved_office: "The Reserved Office"
 ITA_h_the_reserved_office_desc: "Public security and the information office of the staff now keep one register between them, and it is read every morning by men who are paid to be suspicious."
 ITA_h_the_informers: "The Men in the Cafes"
 ITA_h_the_informers_desc: "The consulates pay well and the exiles talk freely. Very little is decided in a cafe in Paris or Geneva that is not known in Rome within the week."
 ITA_h_the_alliance_renewed: "The Alliance Renewed"
 ITA_h_the_alliance_renewed_desc: "The treaty was signed again before its term and without a province changing hands. Our northern frontier is quiet, and our claims are quieter still."
 ITA_h_the_littoral_trade: "The Trade of the Littoral"
 ITA_h_the_littoral_trade_desc: "One tariff and one timetable from Venice to Fiume. The ports on both shores are busier than either finance ministry expected."
 ITA_h_the_triestine_yards: "Stabilimento Tecnico Triestino"
 ITA_h_the_triestine_yards_desc: "The technical works of Trieste, with the drawing offices and the slipways intact, and the torpedo yard at Fiume for company."
 ita_dnc.2300.t: "The Works Above the Piave"
 ita_dnc.2300.d: "Italian engineers are cutting emplacements into the passes of the Cadore and the Valsugana, on ground the treaty of alliance says must be left open. The chief of staff has asked twice for a preventive war and been refused twice. We may demand that the work stops and ask Berlin to stand behind the demand, or we may send a note and let the matter lie."
 ita_dnc.2300.a: "Demand the works stop, and call on Berlin."
 ita_dnc.2300.b: "A note of protest, and nothing more."
 ita_dnc.2301.t: "Vienna Asks Us to Stand"
 ita_dnc.2301.d: "The Ballhausplatz has demanded that Rome take its engineers off the alpine passes, and it wants to know whether we will march if Rome refuses. Backing the demand means putting our army behind a quarrel over stone. Our own staff would rather have the Italians friendly than frightened."
 ita_dnc.2301.a: "The Monarchy stands alone in this."
 ita_dnc.2301.b: "Berlin stands with Vienna."
 ita_dnc.2302.t: "A Note and Nothing More"
 ita_dnc.2302.d: "Vienna has sent Rome a note of protest over the works in the passes and has asked for nothing further. It is a small thing in itself. It tells us how much the Monarchy is willing to spend to keep its southern ally honest, and the answer is very little."
 ita_dnc.2302.a: "Endorse the note in our own name."
 ita_dnc.2302.b: "This is not our quarrel."
 ita_dnc.2303.t: "Berlin Will Not Follow"
 ita_dnc.2303.d: "Our demand has gone to Rome and Berlin has declined to stand behind it. The army can still be put on the frontier and the Italians can still be made to choose. If they refuse, we shall be alone in whatever comes of it."
 ita_dnc.2303.a: "Put the ultimatum to Rome regardless."
 ita_dnc.2303.b: "Let the note stand and say no more."
 ita_dnc.2304.t: "Berlin Stands with Us"
 ita_dnc.2304.d: "Berlin has answered that it will honour the alliance if the quarrel over the passes becomes a war. With the German army behind us the Italians must either take their engineers off the mountain or explain themselves to two courts at once. The promise is worth something even unused."
 ita_dnc.2304.a: "Put the ultimatum to Rome."
 ita_dnc.2304.b: "Having the promise is enough."
 ita_dnc.2305.t: "The Ultimatum from Vienna"
 ita_dnc.2305.d: "The Ballhausplatz gives us a term to take our engineers off the passes and level what they have built. Berlin has not put its name to the demand, and our staff believes the Monarchy is bluffing. Standing firm may cost us a war on the Isonzo before the depots are filled; giving way costs us the works, the year, and rather more than either."
 ita_dnc.2305.a: "The Kingdom fortifies its own ground. We do not stop."
 ita_dnc.2305.b: "We are not ready for this. The works are suspended."
 ita_dnc.2306.t: "The Ultimatum of Two Courts"
 ita_dnc.2306.d: "The demand from Vienna arrives with Berlin under it, and the term is short. Refusing means the two of them on the Isonzo while our reserve is still on paper. Giving way means the engineers come down the mountain and the Chamber is told why by somebody else."
 ita_dnc.2306.a: "The Kingdom does not stop for two courts."
 ita_dnc.2306.b: "Against both of them, no. The works are suspended."
 ita_dnc.2308.t: "Rome Does Not Stop"
 ita_dnc.2308.d: "Rome answers that the passes are Italian ground and that the works will go on. Our army stands on the frontier and the Emperor must now say whether the Monarchy meant what it wrote. The chief of staff wants the order; the Ballhausplatz would rather find a formula."
 ita_dnc.2308.a: "Then we take the frontier by force."
 ita_dnc.2308.b: "We will not begin a war over stone."
 ita_dnc.2309.t: "Rome Gives Way"
 ita_dnc.2309.d: "The Italian engineers are coming down from the passes and the ministry in Rome is explaining to its own Chamber why. We have our answer without firing a round. What we do with it now is a question of manners, and of what we want the world to hear."
 ita_dnc.2309.a: "Take the climbdown and say nothing."
 ita_dnc.2309.b: "Let the newspapers make the most of it."
 ita_dnc.2390.t: "The Alliance Renewed Early"
 ita_dnc.2390.d: "Rome proposes to renew the treaty before its term and asks nothing for it: no province, no undertaking about the Littoral, only the signature. It would settle our southern frontier for another decade and cost the Monarchy nothing at all. It would also teach the party in Rome that patience is rewarded."
 ita_dnc.2390.a: "The alliance is worth more than three provinces."
 ita_dnc.2390.b: "Rome asks too often."
 ita_dnc.2391.t: "Vienna Declines Rome"
 ita_dnc.2391.d: "The Monarchy has refused to renew the treaty early, and has let Rome know it in the driest terms available to a chancellery. The alliance holds on paper. The Italians have been told what their signature is worth, and they will not ask a second time."
 ita_dnc.2391.a: "Remind Vienna what the alliance is for."
 ita_dnc.2391.b: "Let them settle it between themselves."
 ita_dnc.2392.t: "The Customs Union"
 ita_dnc.2392.d: "Rome offers a customs and railway union of the Littoral: our trade through their ports, their workmen in our yards, one tariff and one timetable. The finance ministry says plainly that the Monarchy needs a southern outlet. The governor at Trieste says it hands the province to Italy without a shot."
 ita_dnc.2392.a: "The Monarchy needs a southern port."
 ita_dnc.2392.b: "The Littoral is not for sale."
 ITADNC_h_the_pact_against_anarchy: "The Pact Against Anarchy"
 ITADNC_h_the_pact_against_anarchy_desc: "The men who killed our King and the Empress at Geneva did not act alone and did not act at home. Their committees print in one country, plot in a second and strike in a third, and no police force may follow them across a border. Let the powers sign what we proposed in Rome: the same lists, the same photographs, the same refusals of asylum."
 ITADNC_h_the_surrender_of_the_exiles: "The Surrender of the Exiles"
 ITADNC_h_the_surrender_of_the_exiles_desc: "The convention binds the police of Europe, but it does not yet bind its courts, and every committee we have named is safe again the moment it crosses a frontier. We shall ask each signatory for the article the conference would not carry: that the men who kill kings are criminals and not refugees."
 ITADNC_h_the_bargain_at_racconigi: "The Bargain at Racconigi"
 ITADNC_h_the_bargain_at_racconigi_desc: "Petersburg has been humbled in the East and outmanoeuvred in the Balkans, and it has no friend left who wants the Straits closed. We shall meet the Tsar at a hunting lodge, where nothing is signed and everything is agreed: neither of us moves in that sea without the other."
 ITADNC_h_the_treaty_of_commerce_with_petersburg: "The Treaty of Commerce with Petersburg"
 ITADNC_h_the_treaty_of_commerce_with_petersburg_desc: "The hunting lodge settled what neither crown would do; it did not settle what we might sell. Our slips can lay the armoured cruisers the Tsar cannot build in time, and we must put the tariff and the naval orders into a single treaty before London finds a reason to object."
 ITADNC_h_the_convention_of_the_straits: "The Convention of the Straits"
 ITADNC_h_the_convention_of_the_straits_desc: "The other half of the lodge was never written down: our hand at the Straits against theirs where the desert begins. We must now ask Petersburg to sign it as an alliance, for a promise that binds nobody on paper binds nobody at all."
 ITADNC_h_the_porte_in_our_debt: "The Porte in Our Debt"
 ITADNC_h_the_porte_in_our_debt_desc: "Our bank already holds the paper of the Sultan's provinces and our delegate already sits on the council of his debt. We shall present the whole account at once and offer the Porte the only terms it can meet: our protection, and our administration of what it owes."
 ITADNC_h_the_consulates_abroad: "The Consulates Abroad"
 ITADNC_h_the_consulates_abroad_desc: "The emigration law gave us a commissariat and a consul in every port that takes our people, and we have used both for nothing but paperwork. We shall put the consular service to work, for it must speak for the Kingdom wherever the Kingdom has no soldiers."
 ITADNC_h_the_carabinieri_for_macedonia: "The Carabinieri for Macedonia"
 ITADNC_h_the_carabinieri_for_macedonia_desc: "The powers have carved the Sultan's rebellious provinces into police sectors, and ours is the one nobody else wanted. We shall send the carabinieri and a general to command them, and learn in another empire's provinces what a gendarmerie is worth."
 ITADNC_h_the_reckoning_with_the_refuge: "The Reckoning with the Refuge"
 ITADNC_h_the_reckoning_with_the_refuge_desc: "Every man who has murdered a sovereign this decade was fed, printed and armed in the same mountain cantons, and the republic there calls them guests. We shall demand that the colonies be broken up and their men delivered, and we shall say plainly what a refusal will cost."
 ITADNC_h_the_convention_of_the_gotthard: "The Convention of the Gotthard"
 ITADNC_h_the_convention_of_the_gotthard_desc: "The tunnels under the mountains carry our coal north and our emigrants home, and the tariff on them is set by a company we do not own. We must sit down with Berne and Berlin and fix the rate of the pass by treaty rather than by favour."
 ITADNC_h_the_kingdom_is_no_refuge: "The Kingdom Is No Refuge"
 ITADNC_h_the_kingdom_is_no_refuge_desc: "We asked the powers to close their doors and some of them refused; we cannot ask of others what we will not do ourselves. Every subversive subject of a foreign state shall be expelled, and the states that would not sign shall find our guarantees and our friendship withdrawn."
 ITADNC_h_the_hand_of_menelik: "The Hand of Menelik"
 ITADNC_h_the_hand_of_menelik_desc: "The Negus buys his rifles where he can and remembers who sold him the last ones. We shall arm him and send a mission to drill his levies, and take the place beside his throne that London believes is already hers."
 ITADNC_h_the_hand_of_london: "The Hand of London"
 ITADNC_h_the_hand_of_london_desc: "Our flotillas and theirs already hunt the same Mullah along the same coast, and the agreement that ended it was written by our two consuls together. We shall make that habit a policy, and align the Horn and the middle sea with the fleet we cannot fight."
 ITADNC_h_the_concession_at_tientsin: "The Concession at Tientsin"
 ITADNC_h_the_concession_at_tientsin_desc: "Peking granted us a quarter on the river once the legations were relieved, and we have governed it with a flagpole and a clerk. We shall ask that the grant be made real, with a boundary, a council and a garrison of our own."
 ITADNC_h_the_bay_of_san_mun: "The Bay of San Mun"
 ITADNC_h_the_bay_of_san_mun_desc: "We once asked Peking for a naval station on that coast, withdrew the demand and lost a minister for it. We shall put the claim back on the table, and where the shore is held by others we shall register our right to it instead."
 ITADNC_h_the_stations_of_the_benadir: "The Stations of the Benadir"
 ITADNC_h_the_stations_of_the_benadir_desc: "The coast is ours by law now and a colony of the State, but the hinterland behind it answers to sultans, companies and other flags. We shall settle the stations and their limits with whoever will talk, and claim outright from whoever will not."
 ITADNC_h_the_naval_understanding: "The Naval Understanding"
 ITADNC_h_the_naval_understanding_desc: "Our best plate is rolled in Sheffield and our best turrets are drawn on the Tyne, and every keel we lay is a letter to a British yard. We shall regularise it as an exchange of designs and constructors, so that what we buy this year we can build the next."
 ITADNC_h_the_talks_at_the_foreign_office: "The Talks at the Foreign Office"
 ITADNC_h_the_talks_at_the_foreign_office_desc: "The line between our Benadir and their protectorate was drawn on a map by men who had seen neither. We shall reopen the question in London and ask that the wells and the river bank fall on our side of it."
 ITADNC_h_the_treaty_with_peking: "The Treaty with Peking"
 ITADNC_h_the_treaty_with_peking_desc: "The protocol left the court poorer, angrier and surrounded by creditors who agree on nothing. We shall offer it a treaty of commerce and establishment that no other power has offered, and be the first flag it does not have to fear."
 ITADNC_h_the_sphere_of_the_tripartite: "The Sphere of the Tripartite"
 ITADNC_h_the_sphere_of_the_tripartite_desc: "Three powers agreed on paper that the ground between our two colonies is ours to develop, and not one Italian officer has ever stood upon it. We shall declare the sphere in full and name the governorates that will hold it, so that the map and the flag say the same thing."
 ITADNC_h_the_colonial_administrations: "The Colonial Administrations"
 ITADNC_h_the_colonial_administrations_desc: "Our possessions are run by three ministries, a chartered company and a naval station, and none of them answers to another. We shall give each of them a governor, a budget and a seal, and give the ministry a single desk to read their reports."
 ITADNC_h_the_wealth_of_the_east: "The Wealth of the East"
 ITADNC_h_the_wealth_of_the_east_desc: "Our consuls in the East send home ledgers of silk, tin and coal that leave in other bottoms, and our geographers have called it a scandal for a decade. We shall claim the trade of those coasts as our own concern and act as though the claim were granted."
 ITADNC_h_the_stations_of_the_red_sea: "The Stations of the Red Sea"
 ITADNC_h_the_stations_of_the_red_sea_desc: "Massawa and Assab sit astride the road every steamer to the Indies must take, and we sell them nothing but water. We shall build the coal sheds, the moles and the condensers, and make the passage pay us for passing."
 ITADNC_h_the_kingdom_and_the_dragon: "The Kingdom and the Dragon"
 ITADNC_h_the_kingdom_and_the_dragon_desc: "If the court can be made an ally rather than a debtor, the powers who divided its coast will find themselves the guests and we the host. We shall bind ourselves to Peking against them and take from the greatest of them what it took from everyone."
 ITADNC_h_the_million_who_left: "The Million Who Left"
 ITADNC_h_the_million_who_left_desc: "Our people are lynched in American towns and the government there answers that it cannot reach into a state. We shall demand a commission, an indemnity and a law, and remind Washington that the emigrant carries our flag whether or not it wants him to."
 ITA_h_tt_the_capital_answers: "The capital we have written to will answer in its own time, and the answer will be its own."
 ITA_h_if_they_accept_tt: "§YEffects if they accept:§!"
 ITA_h_if_they_refuse_tt: "§YEffects if they refuse:§!"
 ITA_h_unlock_influence_countries_tt: "Unlocks Decision: Influence Countries"
 ITA_h_unlock_colonial_trade_tt: "Unlocks Decision: Trade With Our Colonies Abroad"
 ITA_h_tt_the_kingdom_is_no_refuge: "Every state that refused the convention loses our guarantee and our non-aggression pact, and an ally that refused it is put out of the alliance."
 ITA_h_tt_the_colonial_levies: "Three colonial templates enter the register: a battalion of the line, an irregular band and a mixed levy for the Negus."
 ITA_h_tt_the_bay_of_san_mun: "Where the shore is held by the court or by a friend we ask for the anchorage; where it is held by anyone else we register the claim."
 ITA_h_tt_the_stations_of_the_benadir: "Where a station is held by a friend we ask for it; where it is held by anyone else we claim it outright."
 ITA_h_tt_the_talks_at_the_foreign_office: "The talks cover [547.GetName], [549.GetName], [268.GetName], [1087.GetName], [1088.GetName] and [116.GetName]."
 ITA_h_tt_the_sphere_of_the_tripartite: "The sphere is declared in full, and two governorates are named to hold it."
 ITA_h_unlock_benadir_tt: "Unlocks Decisions: The Benadir"
 ITA_h_unlock_tripolitania_tt: "Unlocks Decisions: Tripolitania"
 ITA_h_unlock_the_aegean_tt: "Unlocks Decisions: The Aegean"
 ITA_h_unlock_east_africa_tt: "Unlocks Decisions: East Africa"
 ITA_h_tt_the_wealth_of_the_east: "The trade of those coasts is declared our own concern, and the map is marked accordingly."
 ITA_h_tt_the_stations_of_the_red_sea: "Every station on the passage that we hold receives its coal sheds, its moles and its condensers."
 ITA_h_tt_the_kingdom_and_the_dragon: "The court and the Kingdom stand together, and the greatest of the powers on that coast is named as the object."
