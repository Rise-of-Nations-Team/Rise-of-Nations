##RON USA IDEAS##
 USA_american_constitution: "The American Constitution"
 USA_american_constitution_desc: "The Constitution of 1787 and the federal system it created are the bedrock of the Republic. Its checks and balances slow down radical change, and the reverence it inspires makes foreign ideologies a hard sell to the American public."
 USA_bill_of_rights: "The Bill of Rights"
 USA_bill_of_rights_desc: "The first ten amendments guarantee free speech, a free press and the right to assemble. They give Washington a reservoir of legitimacy, and they make it far harder for foreign agents to work in the open."
 USA_jim_crow_laws3: "Jim Crow Laws"
 USA_jim_crow_laws3_desc: "Segregation has hardened into an ever more elaborate legal edifice. The disenfranchised are kept away from the ballot box and out of the ranks, and the machine politicians who write these laws are rewarded with unchallenged control of their statehouses."
 firing_squads_USA: "Firing Squads"
 firing_squads_ USA_desc: "Unrest is being answered with summary executions. Order returns to the streets and the war effort is spared further strikes, but the country will not forget how it was done."
 firing_squads_ USA_2: "Firing Squads"
 firing_squads_ USA_2_desc: "The tribunals no longer bother with appeals. Dissent has gone quiet, and so has much of public life."
 Productivity_Increase: "Productivity Increase"
 Productivity_Increase_desc: "New methods on the shop floor and a fresh wave of investment have our builders and factories working at a pace they have never held before."
 NOR_state_investments: "State Investments"
 NOR_state_investments_desc: "Public money is flowing into the shipyards. Slipways are being lengthened and cranes replaced, and the yards can finally take on the work the fleet needs."
 ENG_naval_production: "Naval Production"
 ENG_naval_production_desc: "Escorts and submarines are being laid down on standardised patterns. They are cheaper by the hull and the yards have learned to build them quickly."
 IRE_submarine_production_idea: "Submarine Production"
 IRE_submarine_production_idea_desc: "The yards have specialised in undersea craft. Pressure hulls come together faster and cheaper than anywhere else, and our designers are years ahead."
