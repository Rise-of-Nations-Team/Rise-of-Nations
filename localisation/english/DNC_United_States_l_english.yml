 USA_occupation_force_desc: "Deployment and maintenance of military forces in occupied territories or regions for security, stabilization, or governance."

 USA_defending_our_positions: "Defending Our Positions"
 USA_defending_our_positions_desc: "Strategies, policies, or actions to defend and secure American military positions, outposts, or territories from external threats."

 USA_expand_our_army: "Expand Our Army"
 USA_expand_our_army_desc: "Initiatives or policies to increase the size, strength, or capabilities of the U.S. Army through recruitment, training, or modernization."

 USA_civil_war_lessons: "Civil War Lessons"
 USA_civil_war_lessons_desc: "Study and application of military strategies, tactics, and lessons learned from the American Civil War to modern military doctrine and operations."

 USA_industrial_warfare: "Industrial Warfare"
 USA_industrial_warfare_desc: "Utilization of industrial resources, technology, and production capabilities to support military operations and enhance combat effectiveness."

 USA_total_war_tactics: "Total War Tactics"
 USA_total_war_tactics_desc: "Adoption of total war strategies involving the mobilization of all resources, civilian and military, to achieve decisive victory in conflict."

 USA_military_industrial_complex: "Military-Industrial Complex"
 USA_military_industrial_complex_desc: "Integration and collaboration between military institutions and industrial sectors to develop and produce military equipment and technology."

 USA_military_contractors: "Military Contractors"
 USA_military_contractors_desc: "Engagement of private contractors or companies to provide specialized services, equipment, or support to the U.S. military."

 USA_ready_to_defend: "Ready to Defend"
 USA_ready_to_defend_desc: "Ensuring preparedness and capability of U.S. military forces to defend national interests, territory, and allies against potential threats."

 USA_fund_academies: "Fund Academies"
 USA_fund_academies_desc: "Allocation of resources and funding to military academies for education, training, and development of future military leaders."

 USA_expand_military_budget: "Expand Military Budget"
 USA_expand_military_budget_desc: "Increase in government expenditure allocated to defense and military operations, including procurement, training, and infrastructure."

 USA_authorize_RnD_programs: "Authorize R&D Programs"
 USA_authorize_RnD_programs_desc: "Approval and support for research and development programs aimed at advancing military technology, innovation, and capabilities."

 USA_aerial_warfare: "Aerial Warfare"
 USA_aerial_warfare_desc: "Strategies, tactics, and technology developments focused on air combat, aerial reconnaissance, and support operations in military campaigns."

 USA_state_of_the_navy: "State of the Navy"
 USA_state_of_the_navy_desc: "Assessment, evaluation, or discussion of the readiness, capabilities, and strategic role of the U.S. Navy in national defense and global operations."

 USA_continued_dreadnought_investment: "Continued Dreadnought Investment"
 USA_continued_dreadnought_investment_desc: "Continued investment and expansion of the dreadnought fleet as a cornerstone of naval strategy and projection of maritime power."

 USA_great_white_fleet: "Great White Fleet"
 USA_great_white_fleet_desc: "Historical deployment of the U.S. Navy's Great White Fleet to demonstrate naval strength and promote American interests globally."

 USA_submarine_development: "Submarine Development"
 USA_submarine_development_desc: "Research, design, and deployment of submarines for underwater warfare, reconnaissance, and strategic deterrence."

 USA_undersea_warfare: "Undersea Warfare"
 USA_undersea_warfare_desc: "Strategies, technologies, and operations focused on underwater combat, including submarine warfare and anti-submarine tactics."

 USA_commission_destroyers: "Commission Destroyers"
 USA_commission_destroyers_desc: "Building and commissioning of destroyer-class ships for fleet defense, escort missions, and anti-submarine warfare capabilities."

 USA_support_ship_focus: "Support Ship Focus"
 USA_support_ship_focus_desc: "Emphasis on the development and deployment of support ships for logistics, supply, medical aid, and other non-combat roles in naval operations."

 USA_versatile_task_forces: "Versatile Task Forces"
 USA_versatile_task_forces_desc: "Formation and deployment of versatile task forces capable of multi-mission operations, adapting to various strategic and operational needs."

 USA_streamlined_production_techniques: "Streamlined Production Techniques"
 USA_streamlined_production_techniques_desc: "Adoption of efficient manufacturing methods and practices to accelerate production of military equipment and resources."

 USA_screen_ships: "Screen Ships"
 USA_screen_ships_desc: "Deployment of screening forces and tactics to protect fleet formations, monitor enemy movements, and maintain situational awareness."

 USA_quantity_over_quality: "Quantity over Quality"
 USA_quantity_over_quality_desc: "Emphasis on producing a larger quantity of military assets, personnel, or equipment rather than focusing on individual quality or capability."

 USA_manueverability_over_firepower: "Maneuverability over Firepower"
 USA_manueverability_over_firepower_desc: "Prioritization of agility, speed, and maneuverability in military operations and tactics over sheer firepower or static defenses."

 USA_global_navy: "Global Navy"
 USA_global_navy_desc: "Maintenance, expansion, and deployment of naval forces for global operations, presence, and power projection in international waters."

 USA_maximum_firepower: "Maximum Firepower"
 USA_maximum_firepower_desc: "Emphasis on maximizing the offensive capabilities and firepower of military units, platforms, or weapons systems."

 USA_bigger_ships: "Bigger Ships"
 USA_bigger_ships_desc: "Development, construction, or acquisition of larger naval vessels, carriers, or warships for enhanced operational capabilities and force projection."

 USA_bigger_guns: "Bigger Guns"
 USA_bigger_guns_desc: "Development, installation, or upgrade of larger caliber guns, cannons, or artillery on naval vessels or ground-based military platforms."

 USA_new_naval_theory: "New Naval Theory"
 USA_new_naval_theory_desc: "Emerging or evolving concepts, doctrines, or strategies shaping naval warfare, operations, and tactics in contemporary or future scenarios."

 USA_the_battleship: "The Battleship"
 USA_the_battleship_desc: "Historical or contemporary significance, roles, and capabilities of battleships as key components of naval fleets and power projection."

 USA_united_states_marines: "United States Marines"
 USA_united_states_marines_desc: "Historical legacy, traditions, and roles of the United States Marine Corps (USMC) in amphibious warfare, expeditionary missions, and national defense."

 USA_halls_of_montezuma: "Halls of Montezuma"
 USA_halls_of_montezuma_desc: "Reference to the Battle of Chapultepec during the Mexican-American War, commemorating the USMC's bravery and victory."

 USA_shores_of_tripoli: "Shores of Tripoli"
