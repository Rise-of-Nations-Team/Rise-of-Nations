 USA_fight_battles_desc: "Engagement in military engagements, conflicts, or battles to defend national interests, protect allies, or uphold international security."

 USA_land_and_sea: "Land and Sea"
 USA_land_and_sea_desc: "Integrated military operations and strategies combining land-based and maritime forces to achieve tactical and strategic objectives."

 USA_americas_finest: "America's Finest"
